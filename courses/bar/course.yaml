# Audio (ADR 0156): OmniVoice cloning two speakers of the VinKo Corpus (Rabanus et al. 2023; Universities of Verona,
# Trento and Bozen; CC BY-NC-SA 4.0), each from about 13 s of their own dialect: a woman from Bozen (VinKo speaker
# U0430) and a man from Meran (U1810). No model knows South Tyrolean: OmniVoice reads the text as German
# (`language: de`) in the cloned voice, which carries the speaker's accent. The weights are non-commercial and the
# reference share-alike: the clips are CC-BY-NC-SA-4.0, crediting the corpus and the speaker. A sentence or story
# character that says who speaks gets that voice; the rest are shared at random (ADR 0078). Iffy (ADR 0091) until a
# South Tyrolean listener goes through the audio check (#/bar/bar-Latn.moser/audio): no listening exercises.
