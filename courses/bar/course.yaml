# South Tyrolean (bar), the dialect German-speaking South Tyroleans speak every day, for English speakers from
# nothing, A1 to early A2 in ten units (ADR 0156; the brief is README.md). Spelled as Moser's Wörterbuch der Südtiroler
# Mundarten (2015) spells it, without its stress marks; the central forms (Bozen, the Eisacktal) canonical. Everyday
# scenes in Bozen and on a farm on the Ritten with people of the course's own.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
