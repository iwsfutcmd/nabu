stories:
- id: bar.story.u04
  node: bar.u04.story
  title:
    en: Marende at Oma's
  characters:
  - id: oma
    speaker: f
    name:
      bar-Latn/moser: Oma
  - id: lena
    speaker: f
    name:
      bar-Latn/moser: Lena
  - id: giulia
    speaker: f
    name:
      bar-Latn/moser: Giulia
  - id: hannes
    speaker: m
    name:
      bar-Latn/moser: Hannes
  steps:
  - line:
      speaker: oma
      forms:
        bar-Latn/moser:
          text: Griaß enk! Hobts es Hunger?
          tokens: [{surface: Griaß, lexeme: griaß-enk}, {surface: enk, lexeme: griaß-enk}, {surface: Hobts, lexeme: hobm, feats: {Mood: Ind, Number: Plur, Person: '2', Tense: Pres, VerbForm: Fin}}, {surface: es,
              lexeme: es, feats: {Case: Nom}}, {surface: Hunger, lexeme: hunger, feats: {Case: Acc, Number: Sing}}]
      translations:
        en: Hello, you two! Are you hungry?
  - line:
      speaker: lena
      forms:
        bar-Latn/moser:
          text: Jo, Oma! Mir hobm Hunger und Durscht.
          tokens: [{surface: Jo, lexeme: jo}, {surface: Oma, lexeme: oma, feats: {Case: Nom, Number: Sing}}, {surface: Mir, lexeme: mir, feats: {Case: Nom}}, {surface: hobm, lexeme: hobm, feats: {Mood: Ind,
                Number: Plur, Person: '1', Tense: Pres, VerbForm: Fin}}, {surface: Hunger, lexeme: hunger, feats: {Case: Acc, Number: Sing}}, {surface: und, lexeme: und}, {surface: Durscht, lexeme: durscht,
              feats: {Case: Acc, Number: Sing}}]
      translations:
        en: Yes, Grandma! We're hungry and thirsty.
  - line:
      speaker: oma
      forms:
        bar-Latn/moser:
          text: Do isch Speck, Kas und Schittlbrot.
          tokens: [{surface: Do, lexeme: do}, {surface: isch, lexeme: sein, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: Speck, lexeme: speck, feats: {Case: Nom,
                Number: Sing}}, {surface: Kas, lexeme: kas, feats: {Case: Nom, Number: Sing}}, {surface: und, lexeme: und}, {surface: Schittlbrot, lexeme: schittlbrot, feats: {Case: Nom, Number: Sing}}]
      translations:
        en: Here's speck, cheese and crispbread.
  - line:
      speaker: giulia
      forms:
        bar-Latn/moser:
          text: Danke! Des isch fein!
          tokens: [{surface: Danke, lexeme: danke}, {surface: Des, lexeme: des}, {surface: isch, lexeme: sein, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: fein,
              lexeme: fein}]
      translations:
        en: Thank you! This is delicious!
  - line:
      speaker: oma
      ask: arrange
      forms:
        bar-Latn/moser:
          text: Wos trinksch du, Giulia?
          tokens: [{surface: Wos, lexeme: wos}, {surface: trinksch, lexeme: trinkn, feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}}, {surface: du, lexeme: du, feats: {Case: Nom}},
            {surface: Giulia, lexeme: giulia, feats: {Case: Nom, Number: Sing}}]
      translations:
        en: What will you drink, Giulia?
  - line:
      speaker: giulia
      forms:
        bar-Latn/moser:
          text: I trink a Wosser, bitte.
          tokens: [{surface: I, lexeme: i, feats: {Case: Nom}}, {surface: trink, lexeme: trinkn, feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}}, {surface: a, lexeme: a, feats: {
                Case: Acc, Gender: Neut, Number: Sing}}, {surface: Wosser, lexeme: wosser, feats: {Case: Acc, Number: Sing}}, {surface: bitte, lexeme: bitte}]
      translations:
        en: I'll have a water, please.
  - choose:
      prompt:
        en: What does Giulia drink?
      options:
      - en: water
      - en: wine
      - en: coffee
      answer: 0
  - line:
      speaker: oma
      forms:
        bar-Latn/moser:
          text: Und du, Lena? A Wein?
          tokens: [{surface: Und, lexeme: und}, {surface: du, lexeme: du, feats: {Case: Nom}}, {surface: Lena, lexeme: lena, feats: {Case: Nom, Number: Sing}}, {surface: A, lexeme: a, feats: {Case: Nom,
                Gender: Masc, Number: Sing}}, {surface: Wein, lexeme: wein, feats: {Case: Nom, Number: Sing}}]
      translations:
        en: And you, Lena? A wine?
  - line:
      speaker: lena
      forms:
        bar-Latn/moser:
          text: Na, i trink liaber an Kaffee.
          tokens: [{surface: Na, lexeme: na}, {surface: i, lexeme: i, feats: {Case: Nom}}, {surface: trink, lexeme: trinkn, feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}}, {
              surface: liaber, lexeme: liaber}, {surface: an, lexeme: a, feats: {Case: Acc, Gender: Masc, Number: Sing}}, {surface: Kaffee, lexeme: kaffee, feats: {Case: Acc, Number: Sing}}]
      translations:
        en: No, I'd rather have a coffee.
  - line:
      speaker: hannes
      forms:
        bar-Latn/moser:
          text: Servus! Isch nou eppes do?
          tokens: [{surface: Servus, lexeme: servus}, {surface: Isch, lexeme: sein, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: nou, lexeme: nou}, {surface: eppes,
              lexeme: eppes}, {surface: do, lexeme: do}]
      translations:
        en: Hi! Is there anything left?
  - line:
      speaker: oma
      forms:
        bar-Latn/moser:
          text: Jo, Hannes! Do isch nou Speck und Kas.
          tokens: [{surface: Jo, lexeme: jo}, {surface: Hannes, lexeme: hannes, feats: {Case: Nom, Number: Sing}}, {surface: Do, lexeme: do}, {surface: isch, lexeme: sein, feats: {Mood: Ind, Number: Sing,
                Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: nou, lexeme: nou}, {surface: Speck, lexeme: speck, feats: {Case: Nom, Number: Sing}}, {surface: und, lexeme: und}, {surface: Kas, lexeme: kas,
              feats: {Case: Nom, Number: Sing}}]
      translations:
        en: Yes, Hannes! There's still speck and cheese.
  - choose:
      prompt:
        en: Who comes late to the Marende?
      options:
      - en: Hannes
      - en: Giulia
      - en: Lena
      answer: 0
scenarios:
- id: bar.marende
  after: bar.u04.fein
  title:
    en: Marende at the farm
  setting:
    en: The big wooden table in the Stube of a farmhouse on the Ritten, above Bozen, at about five in the afternoon.
  character:
    en: Oma, a farmer's widow in her late seventies, warm and insistent, who will not let a guest leave her table hungry.
  goal:
    en: Say whether you are hungry or thirsty, say what you like and what you would rather have, and thank her.
