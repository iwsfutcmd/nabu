scenarios:
- id: bar.zimmer
  after: bar.u05.huckn
  title:
    en: A room to rent
  setting:
    en: A sunny flat on the second floor of an old building in Bozen, where a room is to let.
  character:
    en: Herr Gruber, a retired railwayman in his sixties, polite and a little formal (you say Sie to him), who rents out his late son's room and wants a quiet tenant.
  goal:
    en: Ask what the room and the flat have (a kitchen, a garden), say what you like about it, and say whether you will take it.
