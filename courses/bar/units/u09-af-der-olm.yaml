scenarios:
- id: bar.hittn
  after: bar.u09.wondern
  title:
    en: At the mountain hut
  setting:
    en: A wooden hut on an Alm above the tree line, after a two-hour climb, with benches outside in the sun and a view of the Dolomites.
  character:
    en: The Hüttenwirtin, a strong, cheerful woman in her fifties who runs the hut every summer and cooks everything herself.
  goal:
    en: Say where you have come from, ask what there is to eat and drink, order, and ask about the weather and the way down.
