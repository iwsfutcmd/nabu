- id: bar.bar
  after: bar.u02.wohnen
  title:
    en: At Luis's bar
  setting:
    en: 'A small coffee bar on a corner of the old town in Bozen, on a weekday morning: people stand at the counter for an espresso before work.'
  character:
    en: Luis, the bar's owner, about fifty, from Bozen, who knows all his regulars by name and is curious about new faces.
