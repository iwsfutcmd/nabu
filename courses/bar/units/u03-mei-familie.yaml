scenarios:
- id: bar.familie
  after: bar.u03.leit
  title:
    en: Family photos
  setting:
    en: A kitchen table in a flat in Bozen on a Sunday afternoon, with a box of old family photos.
  character:
    en: 'Lena, a nurse in her mid-twenties, who loves telling stories about her family: her parents in Bozen, her brother Hannes, and her grandmother on a farm on the Ritten.'
  goal:
    en: Ask who the people in the photos are, how old they are and where they live, and say who is in your own family.
