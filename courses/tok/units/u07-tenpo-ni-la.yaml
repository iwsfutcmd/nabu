# Unit 7 (tok): la for context: a time before it (tenpo ni la, tenpo pini la, tenpo kama la, tenpo suno kama la) or a condition (sina wile la …); tenpo, suno, mun and sike for days, nights and years; pini, open, sin and awen as verbs and preverbs; taso (but, only) and weka (away).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a fluent speaker.
id: u07
title:
  en: 'tenpo ni la: Now and then'
cefr: A2
kcs:
- {id: 'sense:tenpo', gloss: {en: 'time; moment, period'}, forms: {tok-Latn/standard: [tenpo], tok-Qaap/sitelen-pona: [󱥫]}, notes: {en: 'tenpo ni is now (this time), tenpo pini the past, tenpo kama the
      future. tenpo seme? asks when.'}}
- {id: 'sense:la', gloss: {en: '(sets the scene: what comes before la is the time or condition for the rest)'}, forms: {tok-Latn/standard: [la], tok-Qaap/sitelen-pona: [󱤡]}, notes: {en: 'X la Y: in the
      setting X, Y. tenpo ni la mi moku: now I''m eating. Toki Pona has no tenses; la gives the time when it matters.'}}
- {id: 'sense:suno', gloss: {en: 'sun; light; shine, bright'}, forms: {tok-Latn/standard: [suno], tok-Qaap/sitelen-pona: [󱥤]}, image: {file: ../images/sun.svg, license: CC0-1.0, provenance: {author: 'llm:claude@bc6746e0390b',
      status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'tenpo suno is a day: tenpo suno ni is today, tenpo suno kama tomorrow, tenpo suno pini yesterday.'}}
- {id: 'sense:mun', gloss: {en: 'moon, star; light in the night sky'}, forms: {tok-Latn/standard: [mun], tok-Qaap/sitelen-pona: [󱤺]}, image: {file: ../images/moon.svg, license: CC0-1.0, provenance: {author: 'llm:claude@2c94300bb951',
      status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'mun is any light in the night sky: mun mute, many stars.'}}
- {id: 'sense:sike', gloss: {en: 'circle, ball, wheel; round; cycle'}, forms: {tok-Latn/standard: [sike], tok-Qaap/sitelen-pona: [󱥜]}, notes: {en: 'tenpo sike is a year: one round of the seasons. tenpo
      sike kama is next year.'}}
- {id: 'sense:pini', gloss: {en: 'end, finish, stop; done; past'}, forms: {tok-Latn/standard: [pini], tok-Qaap/sitelen-pona: [󱥐]}, notes: {en: 'As a preverb: mi pini moku, I''ve finished eating. tenpo pini
      is the past.'}}
- {id: 'sense:open', gloss: {en: 'open; begin, start'}, forms: {tok-Latn/standard: [open], tok-Qaap/sitelen-pona: [󱥇]}, notes: {en: 'mi open e lupa: I open the door. As a preverb: mi open pali, I start
      working.'}}
- {id: 'sense:sin', gloss: {en: 'new, fresh; again; another'}, forms: {tok-Latn/standard: [sin], tok-Qaap/sitelen-pona: [󱥝]}, notes: {en: 'tomo sin: a new house. After a verb it means again: mi kama sin,
      I come again.'}}
- {id: 'sense:awen', gloss: {en: 'stay, wait, remain; keep; still'}, forms: {tok-Latn/standard: [awen], tok-Qaap/sitelen-pona: [󱤈]}, notes: {en: 'As a preverb it means still or keep doing: ona li awen lape,
      she''s still asleep. With e it is keep: mi awen e moku.'}}
- {id: 'sense:taso', gloss: {en: but; only}, forms: {tok-Latn/standard: [taso], tok-Qaap/sitelen-pona: [󱥨]}, notes: {en: 'At the start of a sentence taso is but. After a word it means only: mi taso, only
      me.'}}
- {id: 'sense:weka', gloss: {en: 'away, gone, absent; remove'}, forms: {tok-Latn/standard: [weka], tok-Qaap/sitelen-pona: [󱥶]}, notes: {en: 'ona li weka: he''s away. With e it is take away: mi weka e jaki,
      I clean up the mess.'}}
- {id: 'construction:la-if', gloss: {en: 'X la Y as a condition: if X, Y; when X, Y'}, notes: {en: 'The la that sets a time also sets a condition: sina wile la mi kama, if you want, I''ll come. A whole
      sentence can stand before la.'}}
nodes:
