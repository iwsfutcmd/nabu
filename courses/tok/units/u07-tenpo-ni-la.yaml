scenarios:
- id: tok.plans-for-tomorrow
  after: tok.u07.but
  title:
    en: Plans for tomorrow
  setting:
    en: Evening on a balcony. The sun is going down and the first stars come out.
  character:
    en: jan Tomasi, relaxed and chatty, who likes to remember last year in Canada.
  goal:
    en: Say what you will do tomorrow with tenpo suno kama la …, tell one thing from the past with tenpo pini la …, and make a plan with a condition (sina wile la …).
