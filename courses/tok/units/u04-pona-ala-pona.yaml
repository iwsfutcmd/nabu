scenarios:
- id: tok.guess-the-animal
  after: tok.u04.fun
  title:
    en: Guess the animal
  setting:
    en: A rainy afternoon at Mila's home. Mila thinks of an animal and you guess it with questions; then you swap.
  character:
    en: jan Mila, playful and a bit silly, who answers yes/no questions only with the verb or with ala.
  goal:
    en: Ask yes/no questions with … ala …? and …, anu seme? (ona li suli ala suli? ona li mu, anu seme?) and seme questions to guess the animal, and answer Mila's questions the same way.
