# Unit 4 (tok): ala after the word it negates, yes/no questions (sina moku ala moku?, …, anu seme?) answered with the verb or with ala, seme questions, anu (or), kama and tawa (come, go), sona, pilin, musi, nasa, jaki and mu.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a fluent speaker.
id: u04
title:
  en: sina pona ala pona? Are you okay?
cefr: A1
kcs:
- {id: 'sense:ala', gloss: {en: 'not, no; nothing, none'}, forms: {tok-Latn/standard: [ala], tok-Qaap/sitelen-pona: [󱤂]}, notes: {en: 'ala follows the word it negates: mi moku ala, I''m not eating. Alone,
      ala! means No!'}}
- {id: 'sense:jaki', gloss: {en: 'gross, dirty, disgusting; trash'}, forms: {tok-Latn/standard: [jaki], tok-Qaap/sitelen-pona: [󱤐]}, notes: {en: ni li jaki! is That's gross!}}
- {id: 'sense:sona', gloss: {en: know; knowledge; know how to}, forms: {tok-Latn/standard: [sona], tok-Qaap/sitelen-pona: [󱥡]}, notes: {en: 'sona e is knowing something: mi sona e toki pona.'}}
- {id: 'sense:pilin', gloss: {en: feel; feeling; heart}, forms: {tok-Latn/standard: [pilin], tok-Qaap/sitelen-pona: [󱥎]}, notes: {en: 'mi pilin pona: I feel good. mi pilin ike: I feel bad.'}}
- {id: 'sense:seme', gloss: {en: 'what? which? who?'}, forms: {tok-Latn/standard: [seme], tok-Qaap/sitelen-pona: [󱥙]}, notes: {en: 'seme stands where the answer goes: ni li seme? What is this? soweli seme?
      Which animal?'}}
- {id: 'sense:anu', gloss: {en: or}, forms: {tok-Latn/standard: [anu], tok-Qaap/sitelen-pona: [󱤇]}, notes: {en: 'anu joins choices: kili anu pan? Ending with , anu seme? makes a yes/no question: sina moku,
      anu seme?'}}
- {id: 'sense:kama', gloss: {en: 'come, arrive; become'}, forms: {tok-Latn/standard: [kama], tok-Qaap/sitelen-pona: [󱤖]}, notes: {en: kama pona! is Welcome!}}
- {id: 'sense:tawa', gloss: {en: 'go, move; to, toward'}, forms: {tok-Latn/standard: [tawa], tok-Qaap/sitelen-pona: [󱥩]}, notes: {en: 'mi tawa tomo: I''m going home. tawa pona! is Goodbye! to someone who
      is leaving.'}}
- {id: 'sense:musi', gloss: {en: 'fun, play; game, art'}, forms: {tok-Latn/standard: [musi], tok-Qaap/sitelen-pona: [󱤻]}}
- {id: 'sense:nasa', gloss: {en: 'strange, weird, silly, crazy'}, forms: {tok-Latn/standard: [nasa], tok-Qaap/sitelen-pona: [󱤾]}}
- {id: 'sense:mu', gloss: {en: '(an animal''s sound: moo, woof, meow, tweet)'}, forms: {tok-Latn/standard: [mu], tok-Qaap/sitelen-pona: [󱤹]}, notes: {en: 'mu is any animal noise, and making it: soweli li
      mu.'}}
- {id: 'construction:x-ala-x', gloss: {en: 'X ala X?: a yes/no question'}, notes: {en: 'Say the first word of the predicate, ala, then the word again: sina moku ala moku? Are you eating? Answer with the
      word (moku: yes) or with ala (moku ala, or just ala: no).'}}
