# Unit 5 (tok): modifiers in a row (jan pona mi, mama meli mi), pi to regroup them (jan pi toki pona, tomo pi jan Lina), mute for many and very (mi mute, sina mute, ona mute), ale, family words (mama, meli, mije, jan sama), kulupu, nimi, sama, ante, and en between subjects.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a fluent speaker.
id: u05
title:
  en: 'jan pi toki pona: Toki Pona people'
cefr: A1
kcs:
- {id: 'sense:mute', gloss: {en: 'many, a lot of, very; more'}, forms: {tok-Latn/standard: [mute], tok-Qaap/sitelen-pona: [󱤼]}, notes: {en: 'mute after a word makes it many: jan mute, many people. mi mute
      is we, sina mute is you (all), ona mute is they.'}}
- {id: 'sense:ale', gloss: {en: 'all, every; everything; always'}, forms: {tok-Latn/standard: [ale], tok-Qaap/sitelen-pona: [󱤄]}, notes: {en: 'ale li pona: all is well. ijo ale is everything, jan ale is
      everyone.'}}
- {id: 'sense:mama', gloss: {en: 'parent, mother, father; caretaker'}, forms: {tok-Latn/standard: [mama], tok-Qaap/sitelen-pona: [󱤱]}, notes: {en: 'mama is a parent of either kind. mama meli is a mother,
      mama mije a father.'}}
- {id: 'sense:meli', gloss: {en: 'woman, female; feminine'}, forms: {tok-Latn/standard: [meli], tok-Qaap/sitelen-pona: [󱤳]}, notes: {en: meli or jan meli is a woman.}}
- {id: 'sense:mije', gloss: {en: 'man, male; masculine'}, forms: {tok-Latn/standard: [mije], tok-Qaap/sitelen-pona: [󱤵]}, notes: {en: mije or jan mije is a man.}}
- {id: 'sense:nimi', gloss: {en: name; word}, forms: {tok-Latn/standard: [nimi], tok-Qaap/sitelen-pona: [󱥂]}, image: {file: ../images/name-tag.svg, license: CC0-1.0, provenance: {author: 'llm:claude@949422768931',
      status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'nimi mi li Lina: my name is Lina. nimi sina li seme? asks someone''s name.'}}
- {id: 'sense:en', gloss: {en: and (between subjects)}, forms: {tok-Latn/standard: [en], tok-Qaap/sitelen-pona: [󱤊]}, notes: {en: 'en joins subjects only: jan Lina en jan Pita li moku. Objects each take
      e, predicates each take li.'}}
- {id: 'sense:pi', gloss: {en: of (groups the next words into one modifier)}, forms: {tok-Latn/standard: [pi], tok-Qaap/sitelen-pona: [󱥍]}, notes: {en: 'jan toki pona is a good talking person; jan pi toki
      pona is a person of Toki Pona, a speaker. pi comes before two or more words.'}}
- {id: 'sense:kulupu', gloss: {en: 'group, community, team; society'}, forms: {tok-Latn/standard: [kulupu], tok-Qaap/sitelen-pona: [󱤟]}, notes: {en: kulupu pi toki pona is the Toki Pona community.}}
- {id: 'sense:sama', gloss: {en: 'same, alike, equal; like, as'}, forms: {tok-Latn/standard: [sama], tok-Qaap/sitelen-pona: [󱥖]}, notes: {en: 'jan sama is a sibling: a person of the same family. mi sama
      sina: I''m like you.'}}
- {id: 'sense:ante', gloss: {en: 'other, different; change'}, forms: {tok-Latn/standard: [ante], tok-Qaap/sitelen-pona: [󱤆]}, notes: {en: 'jan ante: someone else, other people. With e it is change: mi ante
      e tomo, I change the house.'}}
- {id: 'sense:tomasi', gloss: {en: Tomasi (a name)}, forms: {tok-Latn/standard: [Tomasi], tok-Qaap/sitelen-pona: [󱦐󱥭󱥅󱤲󱤈󱥡󱤎󱦑]}, notes: {en: 'In sitelen pona: tomo, olin, mani, awen, sona, ilo give T, o, m,
      a, s, i.'}}
