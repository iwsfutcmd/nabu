# Unit 9 (tok): The body (sijelo, lawa, uta, luka, noka, selo), colours as modifiers (kule, loje, jelo, laso, walo, pimeja), numbers that add up (wan, tu, tu wan, tu tu, luka) and nanpa for numbers and order (nanpa wan: first).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a fluent speaker.
id: u09
title:
  en: 'sijelo en kule: Body and colours'
cefr: A2
kcs:
- {id: 'sense:sijelo', gloss: {en: body; physical state; torso}, forms: {tok-Latn/standard: [sijelo], tok-Qaap/sitelen-pona: [󱥛]}, notes: {en: 'sijelo mi li pilin ike: I feel sick (my body feels bad).'}}
- {id: 'sense:lawa', gloss: {en: 'head, mind; main, leading; lead, control'}, forms: {tok-Latn/standard: [lawa], tok-Qaap/sitelen-pona: [󱤤]}, notes: {en: jan lawa is a leader; ona li lawa e kulupu is she
      leads the group.}}
- {id: 'sense:uta', gloss: {en: 'mouth, lips'}, forms: {tok-Latn/standard: [uta], tok-Qaap/sitelen-pona: [󱥰]}}
- {id: 'sense:luka', gloss: {en: 'hand, arm; five'}, forms: {tok-Latn/standard: [luka], tok-Qaap/sitelen-pona: [󱤭]}, image: {file: ../images/hand.svg, license: CC0-1.0, provenance: {author: 'llm:claude@b081ec947041',
      status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'As a number luka is five: soweli luka is five animals.'}}
- {id: 'sense:noka', gloss: {en: 'foot, leg; bottom, lower part'}, forms: {tok-Latn/standard: [noka], tok-Qaap/sitelen-pona: [󱥃]}}
- {id: 'sense:selo', gloss: {en: 'skin, outside, surface; peel, shell, bark'}, forms: {tok-Latn/standard: [selo], tok-Qaap/sitelen-pona: [󱥘]}}
- {id: 'sense:kule', gloss: {en: colour; colourful; paint}, forms: {tok-Latn/standard: [kule], tok-Qaap/sitelen-pona: [󱤞]}, notes: {en: 'kasi kule is a flower. … li kule seme? asks what colour something
      is.'}}
- {id: 'sense:loje', gloss: {en: red; reddish}, forms: {tok-Latn/standard: [loje], tok-Qaap/sitelen-pona: [󱤫]}}
- {id: 'sense:jelo', gloss: {en: yellow; yellowish}, forms: {tok-Latn/standard: [jelo], tok-Qaap/sitelen-pona: [󱤒]}}
- {id: 'sense:laso', gloss: {en: 'blue, green'}, forms: {tok-Latn/standard: [laso], tok-Qaap/sitelen-pona: [󱤣]}, notes: {en: 'One word covers blue and green: sewi li laso, the sky is blue; kasi li laso,
      the plants are green.'}}
- {id: 'sense:walo', gloss: {en: 'white; pale, light-coloured'}, forms: {tok-Latn/standard: [walo], tok-Qaap/sitelen-pona: [󱥲]}}
- {id: 'sense:pimeja', gloss: {en: 'black, dark; shadow'}, forms: {tok-Latn/standard: [pimeja], tok-Qaap/sitelen-pona: [󱥏]}, notes: {en: tenpo pimeja is night.}}
- {id: 'sense:wan', gloss: {en: one; single; united}, forms: {tok-Latn/standard: [wan], tok-Qaap/sitelen-pona: [󱥳]}, notes: {en: 'wan follows its noun: jan wan is one person.'}}
- {id: 'sense:tu', gloss: {en: 'two; split, divide'}, forms: {tok-Latn/standard: [tu], tok-Qaap/sitelen-pona: [󱥮]}, notes: {en: 'Numbers add up: tu wan is three, tu tu is four.'}}
- {id: 'sense:nanpa', gloss: {en: 'number; -th (nanpa wan: first)'}, forms: {tok-Latn/standard: [nanpa], tok-Qaap/sitelen-pona: [󱤽]}, notes: {en: 'nanpa before a number gives the order: jan nanpa wan is
      the first person, lipu nanpa tu is the second page.'}}
- {id: 'construction:counting', gloss: {en: 'numbers that add up: tu wan (three), tu tu (four)'}, notes: {en: 'Number words follow the noun and are added: luka (five) and wan make six, soweli luka tu is
      seven animals. Past that, most speakers just say mute.'}}
