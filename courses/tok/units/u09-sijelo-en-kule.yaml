scenarios:
- id: tok.at-the-doctor
  after: tok.u09.hands-feet
  title:
    en: At the doctor's
  setting:
    en: A small, quiet clinic. The doctor sits across from you with a kind smile and asks what is wrong.
  character:
    en: jan sona, a calm doctor who speaks slow, simple Toki Pona and points at parts of the body.
  goal:
    en: Say which part of your body feels bad (lawa mi li pilin ike, noka mi …), answer the doctor's yes/no questions, and follow simple commands like o open e uta sina!
