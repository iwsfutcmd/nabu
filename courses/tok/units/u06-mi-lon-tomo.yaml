# Unit 6 (tok): lon for where things are (mi lon tomo) and for yes and true, position nouns after lon (sewi, anpa, insa, poka, monsi, sinpin), things in the house (supa, poki, lupa), tan and tawa for from and to, kepeken, ma and nasin, ma Kanata, and X li pona tawa mi for liking.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a fluent speaker.
id: u06
title:
  en: 'mi lon tomo: I''m at home'
cefr: A1
kcs:
- {id: 'sense:lon', gloss: {en: 'at, in, on; be there, exist; true, yes'}, forms: {tok-Latn/standard: [lon], tok-Qaap/sitelen-pona: [󱤬]}, notes: {en: 'mi lon tomo: I''m at home. lon also means true: ni
      li lon, that''s true; and lon answers yes to a lon ala lon? question.'}}
- {id: 'sense:supa', gloss: {en: 'table, surface; furniture'}, forms: {tok-Latn/standard: [supa], tok-Qaap/sitelen-pona: [󱥥]}, notes: {en: Anything flat to put things on or sit on. supa lape (a sleeping
      surface) is a bed.}}
- {id: 'sense:poki', gloss: {en: 'box, cup, bag, bowl; container'}, forms: {tok-Latn/standard: [poki], tok-Qaap/sitelen-pona: [󱥓]}, notes: {en: poki is anything that holds things.}}
- {id: 'sense:insa', gloss: {en: 'inside, middle; belly'}, forms: {tok-Latn/standard: [insa], tok-Qaap/sitelen-pona: [󱤏]}, notes: {en: 'Position words are nouns after lon: lon insa poki, inside the box.'}}
- {id: 'sense:sewi', gloss: {en: 'top, above, up; sky; holy'}, forms: {tok-Latn/standard: [sewi], tok-Qaap/sitelen-pona: [󱥚]}, notes: {en: 'lon sewi supa: on (top of) the table. lon sewi alone is up above,
      in the sky.'}}
- {id: 'sense:anpa', gloss: {en: 'bottom, under, below, down; floor'}, forms: {tok-Latn/standard: [anpa], tok-Qaap/sitelen-pona: [󱤅]}, notes: {en: 'lon anpa supa: under the table. lon anpa alone is down
      below, on the floor.'}}
- {id: 'sense:poka', gloss: {en: 'side; next to, beside, with; nearby'}, forms: {tok-Latn/standard: [poka], tok-Qaap/sitelen-pona: [󱥒]}, notes: {en: 'lon poka mi: beside me, with me.'}}
- {id: 'sense:monsi', gloss: {en: 'back, behind, rear'}, forms: {tok-Latn/standard: [monsi], tok-Qaap/sitelen-pona: [󱤸]}, notes: {en: 'lon monsi tomo: behind the house.'}}
- {id: 'sense:sinpin', gloss: {en: 'front, face; wall'}, forms: {tok-Latn/standard: [sinpin], tok-Qaap/sitelen-pona: [󱥟]}, notes: {en: 'lon sinpin tomo: in front of the house. sinpin is also a wall.'}}
- {id: 'sense:lupa', gloss: {en: 'door, window, hole; opening'}, forms: {tok-Latn/standard: [lupa], tok-Qaap/sitelen-pona: [󱤯]}, notes: {en: lupa is any hole or opening. lupa tomo is a door.}}
- {id: 'sense:tan', gloss: {en: 'from; because of; cause, origin'}, forms: {tok-Latn/standard: [tan], tok-Qaap/sitelen-pona: [󱥧]}, notes: {en: 'mi kama tan ma Kanata: I come from Canada. tan sina: because
      of you.'}}
- {id: 'sense:ma', gloss: {en: 'land, country, ground; place; outdoors'}, forms: {tok-Latn/standard: [ma], tok-Qaap/sitelen-pona: [󱤰]}, notes: {en: ma Kanata is Canada. ma tomo (a land of houses) is a town
      or city.}}
- {id: 'sense:nasin', gloss: {en: 'road, path, way; method, custom'}, forms: {tok-Latn/standard: [nasin], tok-Qaap/sitelen-pona: [󱤿]}, notes: {en: 'nasin is a road and a way of doing things: nasin pona,
      a good way.'}}
- {id: 'sense:kepeken', gloss: {en: 'using, with; use'}, forms: {tok-Latn/standard: [kepeken], tok-Qaap/sitelen-pona: [󱤙]}, notes: {en: 'mi moku kepeken ilo: I eat with a utensil. Like lon and tawa, kepeken
      comes after the predicate.'}}
- {id: 'sense:kanata', gloss: {en: Kanata (Canada; a place name)}, forms: {tok-Latn/standard: [Kanata], tok-Qaap/sitelen-pona: [󱦐󱤗󱤃󱤿󱤈󱥪󱤀󱦑]}, notes: {en: 'ma Kanata is Canada. In sitelen pona: kasi, alasa,
      nasin, awen, telo, a give K, a, n, a, t, a.'}}
- {id: 'construction:pona-tawa', gloss: {en: 'X li pona tawa Y: Y likes X'}, notes: {en: 'Literally X is good to Y: kili li pona tawa mi, I like fruit. ike tawa says the opposite: ni li ike tawa mi, I don''t
      like this.'}}
