scenarios:
- id: tok.toki-pona-meetup
  after: tok.u10.oops
  title:
    en: Talking about Toki Pona
  setting:
    en: A small Toki Pona meetup in a café. Someone has brought a copy of pu and a sheet of sitelen pona to pass around.
  character:
    en: jan Mila, an enthusiastic speaker who loves sitelen pona and wants to know what you think of the language.
  goal:
    en: 'Say what you like with … li pona tawa mi, say who made Toki Pona (jan Sonja), agree with mi kin, and report what someone said with ona li toki e ni: …'
