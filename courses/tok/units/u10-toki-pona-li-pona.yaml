# Unit 10 (tok): Sound and hearing (kalama, kute), writing and drawing (sitelen, sitelen pona), pu and jan Sonja, hard and long things (kiwen, palisa, linja, nena), pakala, kin after the word it stresses, and e ni: before a reported sentence.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a fluent speaker.
id: u10
title:
  en: 'toki pona li pona: Toki Pona is good'
cefr: A2
kcs:
- {id: 'sense:kalama', gloss: {en: 'sound, noise; make a sound; play (music)'}, forms: {tok-Latn/standard: [kalama], tok-Qaap/sitelen-pona: [󱤕]}, notes: {en: kalama musi is music.}}
- {id: 'sense:kute', gloss: {en: 'hear, listen; ear; obey'}, forms: {tok-Latn/standard: [kute], tok-Qaap/sitelen-pona: [󱤠]}, notes: {en: 'kute e is listen to: mi kute e sina, I''m listening to you.'}}
- {id: 'sense:sitelen', gloss: {en: 'picture, image, drawing; writing, sign; draw, write'}, forms: {tok-Latn/standard: [sitelen], tok-Qaap/sitelen-pona: [󱥠]}, notes: {en: 'sitelen pona is Toki Pona''s own
      writing: one sign for each word.'}}
- {id: 'sense:pu', gloss: {en: the official book of Toki Pona; read or use pu}, forms: {tok-Latn/standard: [pu], tok-Qaap/sitelen-pona: [󱥕]}, notes: {en: 'pu is jan Sonja''s book Toki Pona: The Language
      of Good. mi pu is I''m reading pu; the book itself is lipu pu.'}}
- {id: 'sense:kiwen', gloss: {en: 'stone, rock; hard, solid; metal'}, forms: {tok-Latn/standard: [kiwen], tok-Qaap/sitelen-pona: [󱤛]}}
- {id: 'sense:palisa', gloss: {en: 'stick, rod, pole; long hard thing'}, forms: {tok-Latn/standard: [palisa], tok-Qaap/sitelen-pona: [󱥊]}}
- {id: 'sense:linja', gloss: {en: 'string, rope, thread, line; hair'}, forms: {tok-Latn/standard: [linja], tok-Qaap/sitelen-pona: [󱤩]}, notes: {en: linja lawa is the hair on your head.}}
- {id: 'sense:nena', gloss: {en: 'hill, mountain; bump, button; nose'}, forms: {tok-Latn/standard: [nena], tok-Qaap/sitelen-pona: [󱥀]}, image: {file: ../images/mountain.svg, license: CC0-1.0, provenance: {
      author: 'llm:claude@a8e4d984f938', status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'Any bump sticking out: a hill, a button, or the nose on your face.'}}
- {id: 'sense:pakala', gloss: {en: 'break, damage, mess up; broken; oops!'}, forms: {tok-Latn/standard: [pakala], tok-Qaap/sitelen-pona: [󱥈]}, notes: {en: pakala! on its own is what you say when something
      goes wrong.}}
- {id: 'sense:kin', gloss: {en: 'too, also; indeed, really'}, forms: {tok-Latn/standard: [kin], tok-Qaap/sitelen-pona: [󱥹]}, notes: {en: 'kin follows the word it stresses: mi kin is me too. It is not in
      pu but in jan Sonja''s later book, and every speaker uses it.'}}
- {id: 'sense:sonja', gloss: {en: Sonja (a name)}, forms: {tok-Latn/standard: [Sonja], tok-Qaap/sitelen-pona: [󱦐󱥡󱥅󱤿󱤑󱤀󱦑]}, notes: {en: 'jan Sonja (Sonja Lang) made Toki Pona in 2001 and wrote pu. In sitelen
      pona: sona, olin, nasin, jan, a give S, o, n, j, a.'}}
- {id: 'construction:ni-colon', gloss: {en: 'e ni: before a reported sentence (says that, thinks that)'}, notes: {en: 'ni can point ahead to the next sentence, after a colon: ona li toki e ni: toki pona
      li pona (she says that Toki Pona is good).'}}
nodes:
