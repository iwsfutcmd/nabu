# Unit 8 (tok): o for commands, for calling someone and for should (o kama!, jan Lina o, …, sina o lape), preverbs before a verb (mi ken toki, mi kama sona, mi alasa pali), giving with pana, and the market, money, clothes, air, paste, death and fighting.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a fluent speaker.
id: u08
title:
  en: o kama! Come!
cefr: A2
kcs:
- {id: 'sense:o', gloss: {en: 'hey! (calling someone); do it! (a command); should, let''s'}, forms: {tok-Latn/standard: [o], tok-Qaap/sitelen-pona: [󱥄]}, notes: {en: 'Before a verb o gives an order (o kama!),
      after a name it calls someone (jan Lina o, …), and after a subject it means should (sina o lape).'}}
- {id: 'sense:pana', gloss: {en: 'give, send, hand over; emit, release'}, forms: {tok-Latn/standard: [pana], tok-Qaap/sitelen-pona: [󱥌]}, notes: {en: 'Who gets it follows tawa: o pana e telo tawa mi! (give
      me water!)'}}
- {id: 'sense:ken', gloss: {en: 'can, may, be able; possible; chance'}, forms: {tok-Latn/standard: [ken], tok-Qaap/sitelen-pona: [󱤘]}, notes: {en: 'Before a verb, with no e: mi ken toki, I can talk. ken
      la at the start of a sentence is maybe.'}}
- {id: 'sense:alasa', gloss: {en: 'hunt, gather, forage; try to (before a verb)'}, forms: {tok-Latn/standard: [alasa], tok-Qaap/sitelen-pona: [󱤃]}, notes: {en: 'mi alasa e kili: I pick fruit. Before another
      verb it means try: mi alasa pali, I try to work.'}}
- {id: 'sense:esun', gloss: {en: 'market, shop, store; trade, buy, sell'}, forms: {tok-Latn/standard: [esun], tok-Qaap/sitelen-pona: [󱤋]}, notes: {en: mi esun e kili can be buying or selling fruit. jan
      esun is a shopkeeper or a seller.}}
- {id: 'sense:mani', gloss: {en: 'money, cash; savings, wealth'}, forms: {tok-Latn/standard: [mani], tok-Qaap/sitelen-pona: [󱤲]}}
- {id: 'sense:len', gloss: {en: 'clothes, cloth, fabric; cover; privacy'}, forms: {tok-Latn/standard: [len], tok-Qaap/sitelen-pona: [󱤥]}}
- {id: 'sense:kon', gloss: {en: 'air, wind, breath; spirit, soul; essence'}, forms: {tok-Latn/standard: [kon], tok-Qaap/sitelen-pona: [󱤝]}, notes: {en: 'kon li tawa: the air moves, the wind is blowing.'}}
- {id: 'sense:ko', gloss: {en: 'paste, powder, dough, sand, mud; goo'}, forms: {tok-Latn/standard: [ko], tok-Qaap/sitelen-pona: [󱤜]}, notes: {en: 'ko is anything soft or crumbly, between a solid and a liquid.'}}
- {id: 'sense:moli', gloss: {en: 'die, dead; death; kill'}, forms: {tok-Latn/standard: [moli], tok-Qaap/sitelen-pona: [󱤷]}, notes: {en: 'With e it means kill: o moli ala e pipi! (don''t kill the bug!)'}}
- {id: 'sense:utala', gloss: {en: 'fight, battle, war; compete; challenge'}, forms: {tok-Latn/standard: [utala], tok-Qaap/sitelen-pona: [󱥱]}, image: {file: ../images/sword.svg, license: CC0-1.0, provenance: {
      author: 'llm:claude@974a394d608f', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'construction:preverb', gloss: {en: 'a preverb before a verb: mi wile moku (I want to eat)'}, notes: {en: 'wile, ken, kama, awen, sona, lukin, alasa, open and pini can stand right before another
      verb, with no e: mi ken toki. ala after the preverb negates it: mi ken ala toki.'}}
