scenarios:
- id: tok.milas-home
  after: tok.u02.hot-cold
  title:
    en: Mila's animals
  setting:
    en: Mila's home on a cold day. A fire keeps the room warm, a cat sleeps by it, a bird chatters, a lizard sits in a glass tank and fish swim in a bowl of cold water.
  character:
    en: jan Mila, a cheerful child who loves her animals and speaks only very simple Toki Pona.
  goal:
    en: Point things out with ni li … and say what the animals and things are like with li and adjectives (soweli li suwi, telo li lete, akesi li lili li wawa).
