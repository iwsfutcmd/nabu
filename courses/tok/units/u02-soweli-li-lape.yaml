# Unit 2 (tok): li after every subject but a bare mi or sina (ona li lape, jan Lina li moku), ona, ni (this, that), animals and things, a noun with adjectives after it (soweli lili, telo lete), several predicates (ona li suli li wawa) and jan Mila.
