- {id: 'sense:ona', gloss: {en: 'she, he, it, they; her, him, them'}, forms: {tok-Latn/standard: [ona], tok-Qaap/sitelen-pona: [󱥆]}, notes: {en: 'ona is any third person or thing, one or more. After a noun
