scenarios:
- id: tok.lunch-at-milas
  after: tok.u03.love
  title:
    en: Lunch at Mila's
  setting:
    en: Mila's kitchen at noon. Fruit, bread and water are on the table, plants grow by the window, and Mila's pet keeps looking at the food.
  character:
    en: jan Mila, a cheerful child who loves plants and is making lunch; she speaks only very simple Toki Pona.
  goal:
    en: Say what you want, have and see with e (mi wile e pan, mi jo e kili, mi lukin e kasi), and say what you love.
