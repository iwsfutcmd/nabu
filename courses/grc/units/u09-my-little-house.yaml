# Ancient Greek (grc), unit 9: My little house (Lysias 1.9).
# A house and its rooms; "I have" as ἔστι μοι; upstairs and downstairs; the dative plural; a baby is born (the
# aorist ἐγένετο); αὐτός for him, her, it; "I lived" (the imperfect of a middle verb).
# The passage is Hude's text of Lysias (public domain), as the Perseus Digital Library has it; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u09-my-little-house
title:
  en: My little house
cefr: A2
kcs:
- id: sense:oikidion
  gloss:
    en: a little house
  forms:
    grc-Grek/polytonic:
    - οἰκίδιον
  image:
    file: ../images/house.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@grc-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: construction:esti-moi
  gloss:
    en: 'ἔστι μοι + a noun: I have (word for word, there is to me)'
- id: sense:diplous
  gloss:
    en: double; (of a house) on two floors
  forms:
    grc-Grek/polytonic:
    - διπλοῦς
- id: sense:ano
  gloss:
    en: up; upstairs
  forms:
    grc-Grek/polytonic:
    - ἄνω
- id: sense:kato
  gloss:
    en: down; downstairs
  forms:
    grc-Grek/polytonic:
    - κάτω
- id: sense:isos
  gloss:
    en: 'equal, the same (as: with the dative)'
  forms:
    grc-Grek/polytonic:
    - ἴσος
- id: form:dat-pl
  gloss:
    en: 'the dative plural: to, for (the) …; after ἐν, in (τοῖς κάτω, to the downstairs rooms)'
- id: sense:gynaikonitis
  gloss:
    en: the women's rooms of a house
  forms:
    grc-Grek/polytonic:
    - γυναικωνῖτις
- id: sense:andronitis
  gloss:
    en: the men's rooms of a house
  forms:
    grc-Grek/polytonic:
    - ἀνδρωνῖτις
- id: sense:kata
  gloss:
    en: (with the accusative) by, for, in
  forms:
    grc-Grek/polytonic:
    - κατά
- id: sense:paidion
  gloss:
    en: little child, baby
  forms:
    grc-Grek/polytonic:
    - παιδίον
  notes:
    en: 'Neuter, like τέκνον: τὸ παιδίον, and so αὐτό, "it".'
- id: form:aor-3s
  gloss:
    en: 'the aorist, he, she, it: did (once, in the past)'
- id: sense:epeide
  gloss:
    en: when, after; since
  forms:
    grc-Grek/polytonic:
    - ἐπειδή
- id: sense:autos
  gloss:
    en: him, her, it (never first in its clause); self
  forms:
    grc-Grek/polytonic:
    - αὐτός
- id: sense:thelazo
  gloss:
    en: to nurse, breastfeed
  forms:
    grc-Grek/polytonic:
    - θηλάζω
- id: sense:diaitaomai
  gloss:
    en: to live, spend one's days
  forms:
    grc-Grek/polytonic:
    - διαιτάομαι
  notes:
    en: διῃτώμην, "I was living", is its imperfect.
- id: form:impf-1s
  gloss:
    en: 'the imperfect, I: I was doing, I used to do'
