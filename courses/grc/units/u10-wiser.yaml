# Ancient Greek (grc), unit 10: Wiser than this man (Plato, Apology 21d).
# Knowing and thinking: οἶδα (I know) and its infinitive and participle; οἴομαι (I think); wiser (the comparative,
# with the genitive of the one compared); "men of Athens"; nor (οὐδέ), just as (ὥσπερ).
# The passage is Burnet's text of Plato (public domain), as the Perseus Digital Library has it; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u10-wiser
title:
  en: Wiser than this man
cefr: A2
kcs:
- id: sense:anthropos
  gloss:
    en: human being, person; man
  forms:
    grc-Grek/polytonic:
    - ἄνθρωπος
- id: sense:sophos
  gloss:
    en: wise, clever
  forms:
    grc-Grek/polytonic:
    - σοφός
- id: form:comp
  gloss:
    en: 'the comparative: more …, -er (σοφώτερος, wiser); the one compared in the genitive (than)'
- id: sense:aner
  gloss:
    en: man; husband
  forms:
    grc-Grek/polytonic:
    - ἀνήρ
  notes:
    en: ὦ ἄνδρες Ἀθηναῖοι, "men of Athens", is how a speaker addressed the Athenian assembly and courts.
- id: sense:oida
  gloss:
    en: to know
  forms:
    grc-Grek/polytonic:
    - οἶδα
  notes:
    en: 'οἶδα is a perfect ("I have seen, and so know") used as a present: οἶδα I know, οἶσθα you know; to know εἰδέναι, knowing εἰδώς.'
- id: sense:oude
  gloss:
    en: and not, nor; not even
  forms:
    grc-Grek/polytonic:
    - οὐδέ
- id: sense:oiomai
  gloss:
    en: to think, suppose, believe
  forms:
    grc-Grek/polytonic:
    - οἴομαι
- id: sense:hosper
  gloss:
    en: just as, as
  forms:
    grc-Grek/polytonic:
    - ὥσπερ
