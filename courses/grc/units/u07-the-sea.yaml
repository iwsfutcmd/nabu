    license: CC0-1.0
    provenance:
      author: llm:claude@grc-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
  notes:
    en: 'Neuter: τὸ ὄρος, to the mountain τῷ ὄρει.'
- id: sense:epi
