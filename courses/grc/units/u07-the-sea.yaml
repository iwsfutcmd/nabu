- id: sense:onoma
  gloss:
    en: name
  forms:
    grc-Grek/polytonic:
    - ὄνομα
  notes:
    en: τί ὄνομά σοι; "what is your name?", word for word "what name (is there) to you?".
- id: sense:theches
  gloss:
