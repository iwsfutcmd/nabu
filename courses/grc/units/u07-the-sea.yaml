# Ancient Greek (grc), unit 7: The sea! The sea! (Xenophon, Anabasis 4.7.21, 24).
# Mountains, days and numbers; "was" (ἦν) and the imperfect plural (ἔθεον); a name with the dative (ὄνομά μοι);
# the genitive plural; a first participle (βοώντων, shouting).
# The passage is Marchant's text of Xenophon (public domain), as the Perseus Digital Library has it; the rest was
# drafted by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u07-the-sea
title:
  en: The sea! The sea!
cefr: A2
kcs:
- id: sense:oros
  gloss:
    en: mountain
  forms:
    grc-Grek/polytonic:
    - ὄρος
  image:
