scenarios:
- id: grc.on-the-march
  after: grc.u07.they-ran
  title:
    en: On the march
  setting:
    en: 'Spring of 400 BCE, in the mountains of north-eastern Anatolia: the Greek army has marched for months, and today it is climbing Mount Theches.'
  character:
    en: A tired, cheerful hoplite from Arcadia, who speaks only Attic Greek.
  goal:
    en: Ask him his name, ask on which day the army reached the mountain, and tell him what the soldiers in front are shouting.
