- id: form:gen-pl
  gloss:
    en: 'the genitive plural: of (the) … (τῶν στρατιωτῶν, of the soldiers); also after ἀκούω, hear'
- id: form:ptc
  gloss:
    en: 'the participle: -ing (βοώντων, shouting)'
- id: sense:entha
  gloss:
    en: there; then
  forms:
