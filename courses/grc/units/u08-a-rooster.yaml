# Ancient Greek (grc), unit 8: We owe a rooster (Plato, Phaedo 118a).
# Owing and paying: the dative of the one you owe; "pay!" to several people, and "don't forget!" (μή and the
# subjunctive); ταῦτα, "these things"; the future ἔσται; seeing (ὁράω); something else (τι, ἄλλος).
# The passage is Burnet's text of Plato (public domain), as the Perseus Digital Library has it; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u08-a-rooster
title:
  en: We owe a rooster
cefr: A2
kcs:
- id: sense:asklepios
  gloss:
    en: Asclepius (the god of healing)
  forms:
    grc-Grek/polytonic:
    - Ἀσκληπιός
  notes:
    en: A sick man who got well gave Asclepius a rooster. Socrates' last words are a debt to him.
- id: sense:alektryon
  gloss:
    en: rooster, cock
  forms:
    grc-Grek/polytonic:
    - ἀλεκτρυών
  image:
    file: ../images/bird.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@grc-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: sense:opheilo
  gloss:
    en: to owe
  forms:
    grc-Grek/polytonic:
    - ὀφείλω
- id: sense:apodidomi
  gloss:
    en: to give back, pay (what is owed)
  forms:
    grc-Grek/polytonic:
    - ἀποδίδωμι
  notes:
    en: ἀπόδοτε, "pay (it)!" to several people, is its aorist imperative.
- id: sense:ameleo
  gloss:
    en: to neglect, forget about
  forms:
    grc-Grek/polytonic:
    - ἀμελέω
- id: form:aor-subj-2p
  gloss:
    en: 'the aorist subjunctive, you (several): after μή, "don''t (do it)!"'
- id: form:fut-3s
  gloss:
    en: 'the future, he, she, it: will do, will be'
- id: sense:horao
  gloss:
    en: to see, look
  forms:
    grc-Grek/polytonic:
    - ὁράω
  notes:
    en: ὅρα, "look!, see!", is its imperative.
- id: sense:ei
  gloss:
    en: if; (after see, ask) whether
  forms:
    grc-Grek/polytonic:
    - εἰ
- id: sense:tis.indef
  gloss:
    en: someone, something; a, some (never first; it leans on the word before)
  forms:
    grc-Grek/polytonic:
    - τις
  notes:
    en: 'τις, τι is τίς, τί without its accent: εἴ τι, "if anything".'
- id: sense:allos
  gloss:
    en: other, another; (ἄλλο) something else
  forms:
    grc-Grek/polytonic:
    - ἄλλος
- id: sense:theos
  gloss:
    en: god
  forms:
    grc-Grek/polytonic:
    - θεός
