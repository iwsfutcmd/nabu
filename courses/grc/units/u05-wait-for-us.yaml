# Ancient Greek (grc), unit 5: Wait for us! (Plato, Republic 327a-b).
# Yesterday and the aorist (κατέβην); μετά with the genitive; telling someone to do something (κελεύω and the
# infinitive); "wait!" to one person and to several; me, you, us (με, σε, ἡμᾶς, ὑμᾶς); ἔφη; a first future.
# The passage is Burnet's text of Plato (public domain), as the Perseus Digital Library has it; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u05-wait-for-us
title:
  en: Wait for us!
cefr: A1
kcs:
- id: sense:katabaino
  gloss:
    en: to go down (from Athens to the sea, from the hills to the plain)
  forms:
    grc-Grek/polytonic:
    - καταβαίνω
  notes:
    en: 'κατέβην, "I went down", is its aorist: one journey, told as done.'
- id: form:aor-1s
  gloss:
    en: 'the aorist, I: I did (once, in the past)'
- id: sense:chthes
  gloss:
    en: yesterday
  forms:
    grc-Grek/polytonic:
    - χθές
- id: sense:peiraieus
  gloss:
    en: the Piraeus (the harbour town of Athens)
  forms:
    grc-Grek/polytonic:
    - Πειραιεύς
  notes:
    en: 'To the Piraeus: εἰς Πειραιᾶ, usually without the article.'
- id: sense:meta
  gloss:
    en: (with the genitive) with, together with
  forms:
    grc-Grek/polytonic:
    - μετά
- id: sense:glaukon
  gloss:
    en: Glaucon (Plato's elder brother)
  forms:
    grc-Grek/polytonic:
    - Γλαύκων
- id: sense:ariston
  gloss:
    en: Ariston (the father of Plato and Glaucon)
  forms:
    grc-Grek/polytonic:
    - Ἀρίστων
- id: sense:phemi
  gloss:
    en: to say
  forms:
    grc-Grek/polytonic:
    - φημί
  notes:
    en: 'ἔφη, "he said" or "she said", often stands inside the words it reports: οὗτος, ἔφη, ὄπισθεν προσέρχεται.'
- id: form:impf-3s
  gloss:
    en: 'the imperfect, he, she, it: was doing, did'
- id: sense:polemarchos
  gloss:
    en: Polemarchus (Cephalus' son, Lysias' brother)
  forms:
    grc-Grek/polytonic:
    - Πολέμαρχος
- id: sense:keleuo
  gloss:
    en: to order, tell (someone to do something)
  forms:
    grc-Grek/polytonic:
    - κελεύω
- id: form:inf
  gloss:
    en: 'the infinitive: to do (κελεύει περιμεῖναι, he tells (you) to wait)'
- id: sense:perimeno
  gloss:
    en: to wait (for)
  forms:
    grc-Grek/polytonic:
    - περιμένω
- id: sense:alla
  gloss:
    en: but; (opening a reply or a command) well, then
  forms:
    grc-Grek/polytonic:
    - ἀλλά
- id: sense:houtos
  gloss:
    en: this, this one; he (here)
  forms:
    grc-Grek/polytonic:
    - οὗτος
  notes:
    en: 'οὗτος points: "this man here". Called out, it is "there he is!". Its feminine is αὕτη.'
- id: sense:opisthen
  gloss:
    en: behind
  forms:
    grc-Grek/polytonic:
    - ὄπισθεν
- id: form:fut-1p
  gloss:
    en: 'the future, we: we will do'
- id: sense:emi
  gloss:
    en: said (only in ἦ δ’ ὅς, "said he")
  forms:
    grc-Grek/polytonic:
    - ἦ
- id: sense:hos
  gloss:
    en: he (only in ἦ δ’ ὅς, "said he")
  forms:
    grc-Grek/polytonic:
    - ὅς
  notes:
    en: 'ἦ δ’ ὅς, "said he", is how Plato''s narrators report a speaker: ἀλλὰ περιμενοῦμεν, ἦ δ’ ὃς ὁ Γλαύκων.'
