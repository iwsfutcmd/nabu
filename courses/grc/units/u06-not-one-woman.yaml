stories:
- id: grc.story.not-one-woman
  node: grc.u06.story
  title:
    en: Not one woman is here (Aristophanes, Lysistrata 5-8)
  characters:
  - id: lysistrate
    name:
      grc-Grek/polytonic: Λυσιστράτη
  - id: kalonike
    name:
      grc-Grek/polytonic: Καλονίκη
  steps:
  - line:
      speaker: lysistrate
      ask: complete
      gap: sense:gyne
      distractors:
      - sense:oikia
      - sense:hodos
      forms:
        grc-Grek/polytonic:
          text: νῦν δ’ οὐδεμία πάρεστιν ἐνταυθοῖ γυνή·
          tokens:
          - surface: νῦν
            sense: nyn
            readings:
              attic: νῦν
          - surface: δ’
            sense: de
            readings:
              attic: δ’
          - surface: οὐδεμία
            sense: oudeis
            form: form:f
            readings:
              attic: οὐδεμῐ́ᾰ
          - surface: πάρεστιν
            sense: pareimi
            form: form:pres-3s
            readings:
              attic: πᾰ́ρεστῐν
          - surface: ἐνταυθοῖ
            sense: entautha
            readings:
              attic: ἐνταυθοῖ
          - surface: γυνή
            sense: gyne
            readings:
              attic: γῠνή
      translations:
        en: “But now there is not one woman here,
  - line:
      speaker: lysistrate
      forms:
        grc-Grek/polytonic:
          text: πλὴν ἥ γ’ ἐμὴ κωμῆτις ἥδ’ ἐξέρχεται.
          tokens:
          - surface: πλὴν
            sense: plen
            readings:
              attic: πλὴν
          - surface: ἥ
            sense: ho
            readings:
              attic: ἥ
          - surface: γ’
            sense: ge
            readings:
              attic: γ’
          - surface: ἐμὴ
            sense: emos
            form: form:f
            readings:
              attic: ἐμὴ
          - surface: κωμῆτις
            sense: kometis
            readings:
              attic: κωμῆτῐς
          - surface: ἥδ’
            sense: hode
            form: form:f
            readings:
              attic: ἥδ’
          - surface: ἐξέρχεται
            sense: exerchomai
            form: form:pres-3s
            readings:
              attic: ἐξέρχεται
      translations:
        en: 'except my neighbour: here she comes out.'
  - choose:
      prompt:
        en: Who has come to Lysistrata's meeting?
      options:
      - en: No one, except her neighbour
      - en: All the women of Athens
      - en: Her mother
      answer: 0
  - line:
      speaker: lysistrate
      forms:
        grc-Grek/polytonic:
          text: χαῖρ’ ὦ Καλονίκη.
          tokens:
          - surface: χαῖρ’
            sense: chairo
            form: form:impv-2s
            readings:
              attic: χαῖρ’
          - surface: ὦ
            sense: o
            readings:
              attic: ὦ
          - surface: Καλονίκη
            sense: kalonike
            form: form:voc
            readings:
              attic: Κᾰλονῑ́κη
      translations:
        en: Hello, Calonice.”
  - line:
      speaker: kalonike
      ask: arrange
      forms:
        grc-Grek/polytonic:
          text: καὶ σύ γ’ ὦ Λυσιστράτη.
          tokens:
          - surface: καὶ
            sense: kai
            readings:
              attic: καὶ
          - surface: σύ
            sense: sy
            readings:
              attic: σῠ́
          - surface: γ’
            sense: ge
            readings:
              attic: γ’
          - surface: ὦ
            sense: o
            readings:
              attic: ὦ
          - surface: Λυσιστράτη
            sense: lysistrate
            form: form:voc
            readings:
              attic: Λῡσῐστρᾰ́τη
      translations:
        en: “Hello to you too, Lysistrata.
  - line:
      speaker: kalonike
      forms:
        grc-Grek/polytonic:
          text: τί συντετάραξαι; μὴ σκυθρώπαζ’ ὦ τέκνον.
          tokens:
          - surface: τί
            sense: ti
            readings:
              attic: τῐ́
          - surface: συντετάραξαι
            sense: syntaratto
            form: form:perf-2s
            readings:
              attic: σῠντετᾰ́ρᾰξαι
          - surface: μὴ
            sense: me
            readings:
              attic: μὴ
          - surface: σκυθρώπαζ’
            sense: skythropazo
            form: form:impv-2s
            readings:
              attic: σκῠθρώπᾰζ’
          - surface: ὦ
            sense: o
            readings:
              attic: ὦ
          - surface: τέκνον
            sense: teknon
            form: form:voc
            readings:
              attic: τέκνον
      translations:
        en: What has upset you? Don't scowl, child.”
  - choose:
      prompt:
        en: How does Lysistrata look?
      options:
      - en: Upset and scowling
      - en: Happy
      - en: Sleepy
      answer: 0
scenarios:
- id: grc.at-the-meeting
  after: grc.u06.ready
  title:
    en: The women's meeting
  setting:
    en: 'Athens, 411 BCE, early morning in a street below the Acropolis: Lysistrata has called the women of Greece to a meeting, and almost no one has come.'
  character:
    en: Calonice, Lysistrata's neighbour, warm and teasing, who speaks only Attic Greek.
  goal:
    en: Greet her, ask her where the other women are, and tell her that you are ready.
