# Ancient Greek (grc), unit 6: Not one woman is here (Aristophanes, Lysistrata 5-8).
# Women and neighbours; being here (πάρειμι); no one (οὐδείς, οὐδεμία); my (ἐμός); this one here (ὅδε);
# "don't!" (μή and the imperative); ready, said by a woman and by a man.
# The passage is Hall and Geldart's text of Aristophanes (public domain), as the Perseus Digital Library has it;
# the rest was drafted by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u06-not-one-woman
title:
  en: Not one woman is here
cefr: A2
kcs:
- id: sense:gyne
  gloss:
    en: woman; wife
  forms:
    grc-Grek/polytonic:
    - γυνή
  notes:
    en: 'Its other forms are built on γυναικ-: of the woman τῆς γυναικός, the women αἱ γυναῖκες.'
- id: sense:oudeis
  gloss:
    en: no one, nobody; (with a noun) no, not one
  forms:
    grc-Grek/polytonic:
    - οὐδείς
  notes:
    en: οὐδείς for a man or a masculine word, οὐδεμία for a woman, οὐδέν for a thing ("nothing").
- id: sense:pareimi
  gloss:
    en: to be here, be present
  forms:
    grc-Grek/polytonic:
    - πάρειμι
- id: sense:entautha
  gloss:
    en: here, there
  forms:
    grc-Grek/polytonic:
    - ἐνταῦθα
    - ἐνταυθοῖ
  notes:
    en: ἐνταυθοῖ, "(to) here", is how the women of Aristophanes say it.
- id: sense:emos
  gloss:
    en: my, mine
  forms:
    grc-Grek/polytonic:
    - ἐμός
- id: sense:kometis
  gloss:
    en: a woman of the same village or quarter; neighbour
  forms:
    grc-Grek/polytonic:
    - κωμῆτις
- id: sense:plen
  gloss:
    en: (with the genitive) except
  forms:
    grc-Grek/polytonic:
    - πλήν
- id: sense:hode
  gloss:
    en: this (one) here
  forms:
    grc-Grek/polytonic:
    - ὅδε
  notes:
    en: 'ὅδε, ἥδε, τόδε point at what is right in front of you: ἥδε ἐξέρχεται, "here she comes out".'
- id: sense:exerchomai
  gloss:
    en: to come out, go out
  forms:
    grc-Grek/polytonic:
    - ἐξέρχομαι
- id: sense:kalonike
  gloss:
    en: Calonice (Lysistrata's neighbour)
  forms:
    grc-Grek/polytonic:
    - Καλονίκη
- id: sense:lysistrate
  gloss:
    en: Lysistrata (the Athenian woman of Aristophanes' play)
  forms:
    grc-Grek/polytonic:
    - Λυσιστράτη
- id: sense:me
  gloss:
    en: not (in commands and wishes)
  forms:
    grc-Grek/polytonic:
    - μή
  notes:
    en: 'μή with an imperative forbids: μὴ σκυ^θρώπαζε, "don''t scowl!". Statements take οὐ.'
- id: sense:skythropazo
  gloss:
    en: to look sullen, scowl
  forms:
    grc-Grek/polytonic:
    - σκυθρωπάζω
- id: sense:syntaratto
  gloss:
    en: to throw into confusion, upset
  forms:
    grc-Grek/polytonic:
    - συνταράττω
  notes:
    en: συ^ντετάραξαι, "you have been upset" (you are upset), is its perfect.
- id: sense:hetoimos
  gloss:
    en: ready
  forms:
    grc-Grek/polytonic:
    - ἕτοιμος
  notes:
    en: A woman says ἑτοίμη εἰμί, a man ἕτοιμός εἰμι.
