- id: sense:oikogenes
  gloss:
    en: born in the household (of a slave)
  forms:
    grc-Grek/polytonic:
    - οἰκογενής
  notes:
    en: 'Meno''s boy is a slave, born in Meno''s house: he has spoken Greek since he could speak.'
