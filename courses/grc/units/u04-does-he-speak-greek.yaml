stories:
- id: grc.story.a-greek-boy
  node: grc.u04.story
  title:
    en: Does he speak Greek? (Plato, Meno 82b)
  characters:
  - id: socrates
    name:
      grc-Grek/polytonic: Σωκράτης
  - id: menon
    name:
      grc-Grek/polytonic: Μένων
  steps:
  - line:
      speaker: menon
      forms:
        grc-Grek/polytonic:
          text: πάνυ γε. δεῦρο πρόσελθε.
          tokens:
          - surface: πάνυ
            sense: pany
            readings:
              attic: πᾰ́νῠ
          - surface: γε
            sense: ge
            readings:
              attic: γε
          - surface: δεῦρο
            sense: deuro
            readings:
              attic: δεῦρο
          - surface: πρόσελθε
            sense: proserchomai
            form: form:impv-2s
            readings:
              attic: πρόσελθε
      translations:
        en: “Certainly. Come here, you.”
  - line:
      speaker: socrates
      ask: complete
      gap: sense:hellenizo
      distractors:
      - sense:echo
      - sense:akouo
      forms:
        grc-Grek/polytonic:
          text: Ἕλλην μέν ἐστι καὶ ἑλληνίζει;
          tokens:
          - surface: Ἕλλην
            sense: hellen
            readings:
              attic: Ἕλλην
          - surface: μέν
            sense: men
            readings:
              attic: μέν
          - surface: ἐστι
            sense: eimi
            form: form:pres-3s
            readings:
              attic: ἐστῐ
          - surface: καὶ
            sense: kai
            readings:
              attic: καὶ
          - surface: ἑλληνίζει
            sense: hellenizo
            form: form:pres-3s
            readings:
              attic: ἑλληνῐ́ζει
      translations:
        en: “He is Greek, and speaks Greek?”
  - line:
      speaker: menon
      ask: arrange
      forms:
        grc-Grek/polytonic:
          text: πάνυ γε σφόδρα, οἰκογενής γε.
          tokens:
          - surface: πάνυ
            sense: pany
            readings:
              attic: πᾰ́νῠ
          - surface: γε
            sense: ge
            readings:
              attic: γε
          - surface: σφόδρα
            sense: sphodra
            readings:
              attic: σφόδρᾰ
          - surface: οἰκογενής
            sense: oikogenes
            readings:
              attic: οἰκογενής
          - surface: γε
            sense: ge
            readings:
              attic: γε
      translations:
        en: '“Very much so: he was born in my house.”'
  - choose:
      prompt:
        en: What does Socrates want to know about the boy?
      options:
      - en: Whether he speaks Greek
      - en: Whether he can write
      - en: Where his father is
      answer: 0
  - choose:
      prompt:
        en: Why does the boy speak Greek well?
      options:
      - en: He was born in Meno's household
      - en: He is an Athenian
      - en: He learned it in the agora
      answer: 0
scenarios:
- id: grc.in-the-agora
  after: grc.u04.hear-and-learn
  title:
    en: In the agora
  setting:
    en: The agora at midday, crowded and loud; a traveller who has just arrived in Athens is looking about him.
  character:
    en: A young traveller from Thessaly, friendly and talkative, who speaks only Attic Greek.
  goal:
    en: Ask him where he comes from and whether he speaks Greek, tell him that you are learning Greek, and ask whether he understands you.
