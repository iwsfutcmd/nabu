stories:
- id: grc.story.where-to
  node: grc.u03.story
  title:
    en: Where to, and where from? (Plato, Phaedrus 227a)
  characters:
  - id: socrates
    name:
      grc-Grek/polytonic: Σωκράτης
  - id: phaidros
    name:
      grc-Grek/polytonic: Φαῖδρος
  steps:
  - line:
      speaker: socrates
      ask: complete
      gap: sense:pothen
      distractors:
      - sense:hemera
      - sense:oikia
      forms:
        grc-Grek/polytonic:
          text: ὦ φίλε Φαῖδρε, ποῖ δὴ καὶ πόθεν;
          tokens:
          - surface: ὦ
            sense: o
            readings:
              attic: ὦ
          - surface: φίλε
            sense: philos
            form: form:voc
            readings:
              attic: φῐ́λε
          - surface: Φαῖδρε
            sense: phaidros
            form: form:voc
            readings:
              attic: Φαῖδρε
          - surface: ποῖ
            sense: poi
            readings:
              attic: ποῖ
          - surface: δὴ
            sense: de-indeed
            readings:
              attic: δὴ
          - surface: καὶ
            sense: kai
            readings:
              attic: καὶ
          - surface: πόθεν
            sense: pothen
            readings:
              attic: πόθεν
      translations:
        en: “Phaedrus, my friend, where are you going, and where have you come from?”
  - line:
      speaker: phaidros
      forms:
        grc-Grek/polytonic:
          text: παρὰ Λυσίου, ὦ Σώκρατες, τοῦ Κεφάλου,
          tokens:
          - surface: παρὰ
            sense: para
            readings:
              attic: πᾰρᾰ̀
          - surface: Λυσίου
            sense: lysias
            form: form:gen
            readings:
              attic: Λῡσῐ́ου
          - surface: ὦ
            sense: o
            readings:
              attic: ὦ
          - surface: Σώκρατες
            sense: sokrates
            form: form:voc
            readings:
              attic: Σώκρᾰτες
          - surface: τοῦ
            sense: ho
            form: form:gen
            readings:
              attic: τοῦ
          - surface: Κεφάλου
            sense: kephalos
            form: form:gen
            readings:
              attic: Κεφᾰ́λου
      translations:
        en: “From Lysias, Socrates, the son of Cephalus,
  - line:
      speaker: phaidros
      ask: arrange
      forms:
        grc-Grek/polytonic:
          text: πορεύομαι δὲ πρὸς περίπατον ἔξω τείχους.
          tokens:
          - surface: πορεύομαι
            sense: poreuomai
            form: form:pres-1s
            readings:
              attic: πορεύομαι
          - surface: δὲ
            sense: de
            readings:
              attic: δὲ
          - surface: πρὸς
            sense: pros
            readings:
              attic: πρὸς
          - surface: περίπατον
            sense: peripatos
            form: form:acc
            readings:
              attic: περῐ́πᾰτον
          - surface: ἔξω
            sense: exo
            readings:
              attic: ἔξω
          - surface: τείχους
            sense: teichos
            form: form:gen
            readings:
              attic: τείχους
      translations:
        en: and I am going for a walk outside the walls.”
  - choose:
      prompt:
        en: Where has Phaedrus come from?
      options:
      - en: From the house of Lysias
      - en: From the agora
      - en: From the prison
      answer: 0
  - choose:
      prompt:
        en: Where is he going?
      options:
      - en: For a walk outside the city walls
      - en: Home
      - en: To the agora
      answer: 0
scenarios:
- id: grc.outside-the-walls
  after: grc.u03.from-lysias
  title:
    en: Outside the walls
  setting:
    en: Athens on a summer morning, just outside the city walls, where the road runs down to the river Ilissus.
  character:
    en: Phaedrus, a cheerful young Athenian who loves a clever speech, who speaks only Attic Greek.
  goal:
    en: Greet him, ask him where he is going and where he has come from, and tell him where you are going.
