# Ancient Greek (grc), unit 3: Where to, and where from? (Plato, Phaedrus 227a).
# Going and coming: ποῖ, πόθεν, ποῦ; prepositions and their cases (εἰς and the accusative, ἐκ and παρά with the
# genitive, ἐν and the dative); a middle verb, πορεύομαι; the agora, the house, the town.
# The passage is Burnet's text of Plato (public domain), as the Perseus Digital Library has it; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u03-where-to
title:
  en: Where to, and where from?
cefr: A1
kcs:
- id: sense:philos
  gloss:
    en: friend; (as an adjective) dear
  forms:
    grc-Grek/polytonic:
    - φίλος
  notes:
    en: 'ὦ φίλε, "my friend", is how Socrates greets a friend: ὦ φίλε Φαῖδρε.'
- id: sense:phaidros
  gloss:
    en: Phaedrus (a young Athenian, Socrates' friend)
  forms:
    grc-Grek/polytonic:
    - Φαῖδρος
- id: sense:poi
  gloss:
    en: where to? (to what place)
  forms:
    grc-Grek/polytonic:
    - ποῖ
- id: sense:pothen
  gloss:
    en: where from? (from what place)
  forms:
    grc-Grek/polytonic:
    - πόθεν
- id: sense:de-indeed
  gloss:
    en: indeed, now (gives weight to the word before it)
  forms:
    grc-Grek/polytonic:
    - δή
  notes:
    en: 'δή leans on the word before it: ποῖ δή, "where, then?". It is not δέ, "and, but".'
- id: sense:poreuomai
  gloss:
    en: to go, travel, walk
  forms:
    grc-Grek/polytonic:
    - πορεύομαι
  notes:
    en: 'A middle verb: its endings are -ομαι, -ῃ (or -ει), -εται, but it means a plain "I go".'
- id: sense:pros
  gloss:
    en: (with the accusative) to, towards
  forms:
    grc-Grek/polytonic:
    - πρός
- id: sense:peripatos
  gloss:
    en: a walk; a stroll
  forms:
    grc-Grek/polytonic:
    - περίπατος
- id: sense:exo
  gloss:
    en: (with the genitive) outside
  forms:
    grc-Grek/polytonic:
    - ἔξω
- id: sense:teichos
  gloss:
    en: wall; the city walls
  forms:
    grc-Grek/polytonic:
    - τεῖχος
  notes:
    en: 'A neuter noun of the third declension: τὸ τεῖχος, of the wall τοῦ τείχους.'
- id: sense:eis
  gloss:
    en: (with the accusative) into, to
  forms:
    grc-Grek/polytonic:
    - εἰς
- id: sense:agora
  gloss:
    en: the agora, the market place
  forms:
    grc-Grek/polytonic:
    - ἀγορά
  notes:
    en: 'The open square at the heart of Athens: market, law courts and meeting place.'
- id: sense:oikia
  gloss:
    en: house; household
  forms:
    grc-Grek/polytonic:
    - οἰκία
  image:
    file: ../images/house.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@grc-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: sense:badizo
  gloss:
    en: to walk, go
  forms:
    grc-Grek/polytonic:
    - βαδίζω
- id: sense:ek
  gloss:
    en: (with the genitive) out of, from
  forms:
    grc-Grek/polytonic:
    - ἐκ
    - ἐξ
  notes:
    en: 'ἐξ before a vowel: ἐξ ἀγορᾶς.'
- id: sense:pou
  gloss:
    en: where? (at what place)
  forms:
    grc-Grek/polytonic:
    - ποῦ
- id: sense:en
  gloss:
    en: (with the dative) in, at, on
  forms:
    grc-Grek/polytonic:
    - ἐν
- id: form:dat
  gloss:
    en: 'the dative: to, for; after ἐν, in (ἐν τῇ ἀγορᾷ)'
- id: sense:oikoi
  gloss:
    en: at home
  forms:
    grc-Grek/polytonic:
    - οἴκοι
- id: sense:oikade
  gloss:
    en: home, homewards
  forms:
    grc-Grek/polytonic:
    - οἴκαδε
- id: sense:hodos
  gloss:
    en: road, way, street
  forms:
    grc-Grek/polytonic:
    - ὁδός
  notes:
    en: 'Feminine, though it ends in -ος: ἡ ὁδός.'
- id: sense:para
  gloss:
    en: (with the genitive) from (a person); (with the accusative) to (a person)
  forms:
    grc-Grek/polytonic:
    - παρά
- id: sense:lysias
  gloss:
    en: Lysias (the Athenian speechwriter, son of Cephalus)
  forms:
    grc-Grek/polytonic:
    - Λυσίας
- id: sense:kephalos
  gloss:
    en: Cephalus (Lysias' father)
  forms:
    grc-Grek/polytonic:
    - Κέφαλος
- id: sense:astu
  gloss:
    en: the town, the city (Athens itself, within the walls)
  forms:
    grc-Grek/polytonic:
    - ἄστυ
  notes:
    en: 'A neuter noun: τὸ ἄστυ, in the town ἐν τῷ ἄστει.'
