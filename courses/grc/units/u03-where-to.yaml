      translations:
        en: “Phaedrus, my friend, where are you going, and where have you come from?”
  - line:
      speaker: phaidros
      ask: complete
      gap: lexeme:sokrates
      distractors:
      - lexeme:kriton
      - lexeme:phaidros
      forms:
        grc-Grek/polytonic:
          text: παρὰ Λυσίου, ὦ Σώκρατες, τοῦ Κεφάλου,
          tokens: [{surface: παρὰ, lexeme: para, n: 1, head: 2, rel: case, readings: {attic: πᾰρᾰ̀}}, {surface: Λυσίου, lexeme: lysias, feats: {Case: Gen, Number: Sing}, n: 2, readings: {attic: Λῡσῐ́ου}}, {surface: ὦ, lexeme: o, readings: {attic: ὦ}}, {surface: Σώκρατες, lexeme: sokrates, feats: {Case: Voc, Number: Sing}, readings: {attic: Σώκρᾰτες}}, {surface: τοῦ, lexeme: ho, feats: {Case: Gen, Gender: Masc, Number: Sing}, n: 5, head: 6, rel: det, readings: {attic: τοῦ}}, {surface: Κεφάλου, lexeme: kephalos, feats: {Case: Gen, Number: Sing}, n: 6, readings: {attic: Κεφᾰ́λου}}]
      translations:
        en: “From Lysias, Socrates, the son of Cephalus,
  - line:
      speaker: phaidros
      ask: arrange
      forms:
        grc-Grek/polytonic:
          text: πορεύομαι δὲ πρὸς περίπατον ἔξω τείχους.
