# Ancient Greek (grc), unit 1: Why so early? (Plato, Crito 43a).
# Greetings, and names called in the vocative; εἰμί (I am, you are, it is); questions and "not"; night, day and dawn.
# The passage is Burnet's text of Plato (public domain), as the Perseus Digital Library has it; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u01-is-it-early
title:
  en: Why so early?
cefr: A1
kcs:
- id: sense:chairo
  gloss:
    en: 'to be glad; χαῖρε, χαίρετε: hello! (also goodbye)'
  forms:
    grc-Grek/polytonic:
    - χαίρω
  notes:
    en: 'Its imperative is the everyday greeting, on meeting and on parting: χαῖρε to one person, χαίρετε to several.'
- id: form:impv-2s
  gloss:
    en: 'the imperative, to one person: do!'
- id: form:impv-2p
  gloss:
    en: 'the imperative, to several people: do!'
- id: sense:o
  gloss:
    en: O (before the name of someone you call; not translated)
  forms:
    grc-Grek/polytonic:
    - ὦ
  notes:
    en: 'Greek calls a person with ὦ and the vocative: ὦ Σώκρατες. English leaves the ὦ out.'
- id: form:voc
  gloss:
    en: 'the vocative: the form for calling someone (Σώκρατες, from Σωκράτης)'
- id: sense:sokrates
  gloss:
    en: Socrates (the Athenian philosopher, 469–399 BCE)
  forms:
    grc-Grek/polytonic:
    - Σωκράτης
- id: sense:kriton
  gloss:
    en: Crito (Socrates' friend, of his age)
  forms:
    grc-Grek/polytonic:
    - Κρίτων
- id: sense:xanthippe
  gloss:
    en: Xanthippe (Socrates' wife)
  forms:
    grc-Grek/polytonic:
    - Ξανθίππη
- id: sense:kai
  gloss:
    en: and; also, too
  forms:
    grc-Grek/polytonic:
    - καί
- id: sense:eimi
  gloss:
    en: to be
  forms:
    grc-Grek/polytonic:
    - εἰμί
  notes:
    en: 'εἰμί I am, εἶ you are, ἐστί(ν) he, she, it is. εἰμί and ἐστί lean on the word before them (they are enclitics) and lose their own accent after many words: νύξ ἐστιν; after οὐκ it is ἔστιν.'
- id: form:pres-1s
  gloss:
    en: 'the present, I: I do, I am doing'
- id: form:pres-2s
  gloss:
    en: 'the present, you (one person): you do, you are doing'
- id: form:pres-3s
  gloss:
    en: 'the present, he, she, it: does, is doing'
- id: sense:tis
  gloss:
    en: who? which?
  forms:
    grc-Grek/polytonic:
    - τίς
- id: sense:sy
  gloss:
    en: you (one person)
  forms:
    grc-Grek/polytonic:
    - σύ
- id: sense:ego
  gloss:
    en: I
  forms:
    grc-Grek/polytonic:
    - ἐγώ
- id: sense:nai
  gloss:
    en: 'yes'
  forms:
    grc-Grek/polytonic:
    - ναί
- id: sense:ou
  gloss:
    en: not; (alone) no
  forms:
    grc-Grek/polytonic:
    - οὐ
    - οὐκ
    - οὐχ
    - οὔ
  notes:
    en: 'οὐ before a consonant, οὐκ before a smooth breathing, οὐχ before a rough one: οὐ πρῴ, οὐκ ἔστιν, οὐχ ἡμέρα. Alone, "no", it is οὔ.'
- id: sense:nyx
  gloss:
    en: night
  forms:
    grc-Grek/polytonic:
    - νύξ
  image:
    file: ../images/moon.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@grc-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: sense:hemera
  gloss:
    en: day
  forms:
    grc-Grek/polytonic:
    - ἡμέρα
  image:
    file: ../images/sun.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@grc-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: sense:nyn
  gloss:
    en: now
  forms:
    grc-Grek/polytonic:
    - νῦν
- id: sense:ede
  gloss:
    en: already; by now
  forms:
    grc-Grek/polytonic:
    - ἤδη
- id: sense:eti
  gloss:
    en: still, yet
  forms:
    grc-Grek/polytonic:
    - ἔτι
- id: sense:proi
  gloss:
    en: early (in the day)
  forms:
    grc-Grek/polytonic:
    - πρῴ
- id: sense:pany
  gloss:
    en: very, quite
  forms:
    grc-Grek/polytonic:
    - πάνυ
- id: sense:e
  gloss:
    en: or
  forms:
    grc-Grek/polytonic:
    - ἤ
- id: sense:penika
  gloss:
    en: at what time?
  forms:
    grc-Grek/polytonic:
    - πηνίκα
- id: sense:malista
  gloss:
    en: most, especially; (with a time or a number) about, just
  forms:
    grc-Grek/polytonic:
    - μάλιστα
- id: sense:orthros
  gloss:
    en: dawn, the hour before daybreak
  forms:
    grc-Grek/polytonic:
    - ὄρθρος
  image:
    file: ../images/sunrise.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@grc-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: sense:bathys
  gloss:
    en: deep
  forms:
    grc-Grek/polytonic:
    - βαθύς
  notes:
    en: 'ὄρθρος βαθύς, "deep dawn": the first grey light, long before the sun is up.'
- id: sense:ti
  gloss:
    en: what? why?
  forms:
    grc-Grek/polytonic:
    - τί
- id: sense:tenikade
  gloss:
    en: at this hour (so early, or so late)
  forms:
    grc-Grek/polytonic:
    - τηνικάδε
- id: sense:aphikneomai
  gloss:
    en: to arrive, come
  forms:
    grc-Grek/polytonic:
    - ἀφικνέομαι
  notes:
    en: 'ἀφῖξαι, "you have come" (you are here), is its perfect: a deed done and its result now.'
- id: form:perf-2s
  gloss:
    en: 'the perfect, you (one person): you have done (and so it stands)'
- id: sense:men
  gloss:
    en: (marks a first point; δέ answers it)
  forms:
    grc-Grek/polytonic:
    - μέν
  notes:
    en: 'μέν and οὖν together say "indeed": πάνυ μὲν οὖν, "yes, very much so", is the strongest yes of Plato''s dialogues.'
- id: sense:oun
  gloss:
    en: so, then, therefore
  forms:
    grc-Grek/polytonic:
    - οὖν
  notes:
    en: 'οὖν never comes first: it stands second in its clause (τί οὖν ἀφῖξαι;).'
