- id: grc.story.two-sons
  node: grc.u02.story
  title:
    en: Two sons (Xenophon, Anabasis 1.1.1)
  steps:
  - line:
      ask: arrange
      forms:
        grc-Grek/polytonic:
          text: Δαρείου καὶ Παρυσάτιδος γίγνονται παῖδες δύο,
          tokens:
          - surface: Δαρείου
            sense: dareios
            form: form:gen
            readings:
              attic: Δᾱρείου
          - surface: καὶ
            sense: kai
            readings:
              attic: καὶ
          - surface: Παρυσάτιδος
            sense: parysatis
            form: form:gen
            readings:
              attic: Πᾰρῠσᾰ́τῐδος
          - surface: γίγνονται
            sense: gignomai
            form: form:pres-3p
            readings:
              attic: γῐ́γνονται
          - surface: παῖδες
            sense: pais
            form: form:pl
            readings:
              attic: παῖδες
          - surface: δύο
            sense: dyo
            readings:
              attic: δῠ́ο
      translations:
        en: Darius and Parysatis had two sons,
  - line:
      ask: complete
      gap: sense:neoteros
      distractors:
      - sense:pater
      - sense:meter
      forms:
        grc-Grek/polytonic:
          text: πρεσβύτερος μὲν Ἀρταξέρξης, νεώτερος δὲ Κῦρος.
          tokens:
          - surface: πρεσβύτερος
            sense: presbyteros
            readings:
              attic: πρεσβῠ́τερος
          - surface: μὲν
            sense: men
            readings:
              attic: μὲν
          - surface: Ἀρταξέρξης
            sense: artaxerxes
            readings:
              attic: Ᾰ̓ρτᾰξέρξης
          - surface: νεώτερος
            sense: neoteros
            readings:
              attic: νεώτερος
          - surface: δὲ
            sense: de
            readings:
              attic: δὲ
          - surface: Κῦρος
            sense: kyros
            readings:
              attic: Κῦρος
      translations:
        en: Artaxerxes the elder, and Cyrus the younger.
  - choose:
      prompt:
