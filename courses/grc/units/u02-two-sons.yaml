# Ancient Greek (grc), unit 2: Two sons (Xenophon, Anabasis 1.1.1).
# The article; family words; the accusative (an object) and the genitive (of, 's); the plural; μέν … δέ; ἔχω.
# The passage is Marchant's text of Xenophon (public domain), as the Perseus Digital Library has it; the rest was
# drafted by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u02-two-sons
title:
  en: Two sons
cefr: A1
kcs:
- id: sense:ho
  gloss:
    en: the
  forms:
    grc-Grek/polytonic:
    - ὁ
    - ἡ
  notes:
    en: ὁ with a man or a masculine word, ἡ with a woman or a feminine one, τό with a neuter one. Greek also puts it with names (ὁ Κῦρος) and where English says "my" or "his" (ὁ πατήρ, "his father").
- id: sense:pater
  gloss:
    en: father
  forms:
    grc-Grek/polytonic:
    - πατήρ
- id: sense:meter
  gloss:
    en: mother
  forms:
    grc-Grek/polytonic:
    - μήτηρ
- id: sense:pais
  gloss:
    en: child; boy, girl; son, daughter
  forms:
    grc-Grek/polytonic:
    - παῖς
  notes:
    en: ὁ παῖς is a boy or a son, ἡ παῖς a girl or a daughter. It is also what a master calls a young slave.
- id: sense:hyios
  gloss:
    en: son
  forms:
    grc-Grek/polytonic:
    - υἱός
- id: sense:teknon
  gloss:
    en: child
  forms:
    grc-Grek/polytonic:
    - τέκνον
  notes:
    en: 'τέκνον is neuter: τὸ τέκνον. A mother calls her child, or an older woman a younger one, ὦ τέκνον.'
- id: sense:thygater
  gloss:
    en: daughter
  forms:
    grc-Grek/polytonic:
    - θυγάτηρ
- id: sense:adelphos
  gloss:
    en: brother
  forms:
    grc-Grek/polytonic:
    - ἀδελφός
- id: sense:adelphe
  gloss:
    en: sister
  forms:
    grc-Grek/polytonic:
    - ἀδελφή
- id: form:acc
  gloss:
    en: 'the accusative: the object of a verb (ἀδελφὸν ἔχω, I have a brother)'
- id: sense:echo
  gloss:
    en: to have; to hold
  forms:
    grc-Grek/polytonic:
    - ἔχω
- id: sense:dyo
  gloss:
    en: two
  forms:
    grc-Grek/polytonic:
    - δύο
- id: form:pl
  gloss:
    en: 'the plural, as subject: -οι, -αι, -ες (ἀδελφοί, brothers)'
- id: sense:treis
  gloss:
    en: three
  forms:
    grc-Grek/polytonic:
    - τρεῖς
- id: form:acc-pl
  gloss:
    en: 'the accusative plural: the objects (παῖδας, children)'
- id: sense:gignomai
  gloss:
    en: to become; to be born; to happen
  forms:
    grc-Grek/polytonic:
    - γίγνομαι
- id: form:pres-3p
  gloss:
    en: 'the present, they: they do, they are doing'
- id: sense:dareios
  gloss:
    en: Darius (Darius II, king of Persia, 424–404 BCE)
  forms:
    grc-Grek/polytonic:
    - Δαρεῖος
- id: form:gen
  gloss:
    en: 'the genitive: of, ''s (Δαρείου, of Darius)'
- id: sense:kyros
  gloss:
    en: Cyrus (the younger son of Darius II)
  forms:
    grc-Grek/polytonic:
    - Κῦρος
- id: sense:parysatis
  gloss:
    en: Parysatis (Darius' queen, mother of Cyrus)
  forms:
    grc-Grek/polytonic:
    - Παρύσατις
- id: sense:artaxerxes
  gloss:
    en: Artaxerxes (the elder son, king after Darius)
  forms:
    grc-Grek/polytonic:
    - Ἀρταξέρξης
- id: sense:presbyteros
  gloss:
    en: older, the elder
  forms:
    grc-Grek/polytonic:
    - πρεσβύτερος
- id: sense:neoteros
  gloss:
    en: younger, the younger
  forms:
    grc-Grek/polytonic:
    - νεώτερος
- id: sense:de
  gloss:
    en: and, but (second in its clause; answers μέν)
  forms:
    grc-Grek/polytonic:
    - δέ
  notes:
    en: 'μέν … δέ sets two things side by side: πρεσβύτερος μὲν Ἀρταξέρξης, νεώτερος δὲ Κῦρος, "Artaxerxes the elder, Cyrus the younger". Neither word comes first in its clause.'
- id: form:f
  gloss:
    en: 'feminine: an adjective''s form for a woman or a feminine word (νεωτέρα, younger)'
