# Ancient Greek (grc): Attic, the Greek of Athens in the fifth and fourth centuries BCE, as Plato, Xenophon,
# Lysias and Aristophanes wrote it (ADR 0087). Polytonic text, as editions print it; accents and breathings
# left out of an answer are noted, not failed, unless they make another word.
# Each unit's lessons teach the words of an Attic passage, and its story reads it: the text of public-domain
# editions (Burnet's Plato, Marchant's Xenophon, Hude's Lysias, Hall and Geldart's Aristophanes), as the
# Perseus Digital Library has them. Checked against the Cambridge Grammar of Classical Greek (2019) and the
# Cambridge Greek Lexicon (2021) in the reference library.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a reviewer.
id: grc
target: grc-Grek
orthographies: [grc-Grek/polytonic]
support: [en-Latn/standard]
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@grc-draft-v1', status: draft}
# A Greek word is a stem and an ending: a new verb in a new form, or a new noun in a new case, is two KCs.
iPlusOne: 2
# Every facet but listen (as hbo, ADR 0082): Attic is read, not heard, and a reconstructed synthetic voice is no
# ear-training. The clips still say each card once it is answered, and speaking cards stay (reading aloud).
facets: [recognize, produce, speak, read-script, write-script]
# Audio (ADR 0087): the reconstructed pronunciation of classical Attic (CGCG §§1.14–33), never Modern Greek text.
# Each word's pinned `attic` reading (its spelling with every α, ι, υ marked long or short) is given to the voice as
# IPA phonemes (nabu.audio.attic.piper), so it never reads Greek letters: aspirated φ θ χ, [y] for υ, long and short
# vowels, the accent as a stress. The voice is Piper's Greek rapunzelina (low): neural, a stopgap until a better one
# (Ben, 2026-11-09). Its dataset is CC0, but it was fine-tuned from Piper's English ryan voice, whose dataset is
# CC BY-NC-SA 4.0: the clips are CC-BY-NC-SA-4.0. One voice reads everything (ADR 0078).
audio:
  # ADR 0091: too far from Attic to present: no clip ships. The clips stay here for the audio check, until a better voice.
  quality: bad
  voices:
  - {id: attic-el, provider: piper, voice: el_GR-rapunzelina-low, speaker: f, orthography: grc-Grek/polytonic, reading: attic, license: CC-BY-NC-SA-4.0}
units: [units/abc.yaml, units/u01-is-it-early.yaml, units/u02-two-sons.yaml, units/u03-where-to.yaml, units/u04-does-he-speak-greek.yaml, units/u05-wait-for-us.yaml, units/u06-not-one-woman.yaml, units/u07-the-sea.yaml, units/u08-a-rooster.yaml, units/u09-my-little-house.yaml, units/u10-wiser.yaml]
