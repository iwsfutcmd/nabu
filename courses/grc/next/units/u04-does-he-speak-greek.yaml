stories:
- id: grc.story.a-greek-boy
  node: grc.u04.story
  title:
    en: Does he speak Greek? (Plato, Meno 82b)
  characters:
  - id: socrates
    name:
      grc-Grek/polytonic: Σωκράτης
  - id: menon
    name:
      grc-Grek/polytonic: Μένων
  steps:
  - line:
      speaker: menon
      forms:
        grc-Grek/polytonic:
          text: πάνυ γε. δεῦρο πρόσελθε.
          tokens: [{surface: πάνυ, lexeme: pany, readings: {attic: πᾰ́νῠ}}, {surface: γε, lexeme: ge, readings: {attic: γε}}, {surface: δεῦρο, lexeme: deuro, readings: {attic: δεῦρο}}, {surface: πρόσελθε, lexeme: proserchomai, feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, readings: {attic: πρόσελθε}}]
      translations:
        en: “Certainly. Come here, you.”
  - line:
      speaker: socrates
      ask: complete
      gap: lexeme:hellenizo
      asks: form
      distractors:
      - {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}
      - {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}
      forms:
        grc-Grek/polytonic:
          text: Ἕλλην μέν ἐστι καὶ ἑλληνίζει;
          tokens: [{surface: Ἕλλην, lexeme: hellen, feats: {Case: Nom, Number: Sing}, readings: {attic: Ἕλλην}}, {surface: μέν, lexeme: men, readings: {attic: μέν}}, {surface: ἐστι, lexeme: eimi, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, readings: {attic: ἐστῐ}}, {surface: καὶ, lexeme: kai, readings: {attic: καὶ}}, {surface: ἑλληνίζει, lexeme: hellenizo, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, readings: {attic: ἑλληνῐ́ζει}}]
      translations:
        en: “He is Greek, and speaks Greek?”
  - line:
      speaker: menon
      ask: arrange
      forms:
        grc-Grek/polytonic:
          text: πάνυ γε σφόδρα, οἰκογενής γε.
          tokens: [{surface: πάνυ, lexeme: pany, readings: {attic: πᾰ́νῠ}}, {surface: γε, lexeme: ge, readings: {attic: γε}}, {surface: σφόδρα, lexeme: sphodra, readings: {attic: σφόδρᾰ}}, {surface: οἰκογενής, lexeme: oikogenes, feats: {Case: Nom, Gender: Masc, Number: Sing}, readings: {attic: οἰκογενής}}, {surface: γε, lexeme: ge, readings: {attic: γε}}]
      translations:
        en: '“Very much so: he was born in my house.”'
  - choose:
      prompt:
        en: What does Socrates want to know about the boy?
      options:
      - en: Whether he speaks Greek
      - en: Whether he can write
      - en: Where his father is
      answer: 0
  - choose:
      prompt:
        en: Why does the boy speak Greek well?
      options:
      - en: He was born in Meno's household
      - en: He is an Athenian
      - en: He learned it in the agora
      answer: 0
scenarios:
- id: grc.in-the-agora
  after: grc.u04.hear-and-learn
  title:
    en: In the agora
  setting:
    en: The agora at midday, crowded and loud; a traveller who has just arrived in Athens is looking about him.
  character:
    en: A young traveller from Thessaly, friendly and talkative, who speaks only Attic Greek.
  goal:
    en: Ask him where he comes from and whether he speaks Greek, tell him that you are learning Greek, and ask whether he understands you.
