stories:
- id: grc.story.not-one-woman
  node: grc.u06.story
  title:
    en: Not one woman is here (Aristophanes, Lysistrata 5-8)
  characters:
  - id: lysistrate
    name:
      grc-Grek/polytonic: Λυσιστράτη
  - id: kalonike
    name:
      grc-Grek/polytonic: Καλονίκη
  steps:
  - line:
      speaker: lysistrate
      ask: complete
      gap: lexeme:gyne
      distractors:
      - lexeme:glotta
      - lexeme:nyx
      forms:
        grc-Grek/polytonic:
          text: νῦν δ’ οὐδεμία πάρεστιν ἐνταυθοῖ γυνή·
          tokens: [{surface: νῦν, lexeme: nyn, readings: {attic: νῦν}}, {surface: δ’, lexeme: de, readings: {attic: δ’}}, {surface: οὐδεμία, lexeme: oudeis, feats: {Case: Nom, Gender: Fem, Number: Sing}, readings: {attic: οὐδεμῐ́ᾰ}}, {surface: πάρεστιν, lexeme: pareimi, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, readings: {attic: πᾰ́ρεστῐν}}, {surface: ἐνταυθοῖ, lexeme: entautha, readings: {attic: ἐνταυθοῖ}}, {surface: γυνή, lexeme: gyne, feats: {Case: Nom, Number: Sing}, readings: {attic: γῠνή}}]
      translations:
        en: “But now there is not one woman here,
  - line:
      speaker: lysistrate
      forms:
        grc-Grek/polytonic:
          text: πλὴν ἥ γ’ ἐμὴ κωμῆτις ἥδ’ ἐξέρχεται.
          tokens: [{surface: πλὴν, lexeme: plen, n: 1, head: 5, rel: case, readings: {attic: πλὴν}}, {surface: ἥ, lexeme: ho, feats: {Case: Nom, Gender: Fem, Number: Sing}, n: 2, head: 5, rel: det, readings: {attic: ἥ}}, {surface: γ’, lexeme: ge, readings: {attic: γ’}}, {surface: ἐμὴ, lexeme: emos, feats: {Case: Nom, Gender: Fem, Number: Sing}, n: 4, head: 5, rel: det, readings: {attic: ἐμὴ}}, {surface: κωμῆτις, lexeme: kometis, feats: {Case: Nom, Number: Sing}, n: 5, readings: {attic: κωμῆτῐς}}, {surface: ἥδ’, lexeme: hode, feats: {Case: Nom, Gender: Fem, Number: Sing}, readings: {attic: ἥδ’}}, {surface: ἐξέρχεται, lexeme: exerchomai, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, readings: {attic: ἐξέρχεται}}]
      translations:
        en: 'except my neighbour: here she comes out.'
  - choose:
      prompt:
        en: Who has come to Lysistrata's meeting?
      options:
      - en: No one, except her neighbour
      - en: All the women of Athens
      - en: Her mother
      answer: 0
  - line:
      speaker: lysistrate
      forms:
        grc-Grek/polytonic:
          text: χαῖρ’ ὦ Καλονίκη.
          tokens: [{surface: χαῖρ’, lexeme: chairo, feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, readings: {attic: χαῖρ’}}, {surface: ὦ, lexeme: o, readings: {attic: ὦ}}, {surface: Καλονίκη, lexeme: kalonike, feats: {Case: Voc, Number: Sing}, readings: {attic: Κᾰλονῑ́κη}}]
      translations:
        en: Hello, Calonice.”
  - line:
      speaker: kalonike
      ask: arrange
      forms:
        grc-Grek/polytonic:
          text: καὶ σύ γ’ ὦ Λυσιστράτη.
          tokens: [{surface: καὶ, lexeme: kai, readings: {attic: καὶ}}, {surface: σύ, lexeme: sy, feats: {Case: Nom, Number: Sing}, readings: {attic: σῠ́}}, {surface: γ’, lexeme: ge, readings: {attic: γ’}}, {surface: ὦ, lexeme: o, readings: {attic: ὦ}}, {surface: Λυσιστράτη, lexeme: lysistrate, feats: {Case: Voc, Number: Sing}, readings: {attic: Λῡσῐστρᾰ́τη}}]
      translations:
        en: “Hello to you too, Lysistrata.
  - line:
      speaker: kalonike
      forms:
        grc-Grek/polytonic:
          text: τί συντετάραξαι; μὴ σκυθρώπαζ’ ὦ τέκνον.
          tokens: [{surface: τί, lexeme: ti, readings: {attic: τῐ́}}, {surface: συντετάραξαι, lexeme: syntaratto, feats: {Aspect: Perf, Mood: Ind, Number: Sing, Person: '2', VerbForm: Fin}, readings: {attic: σῠντετᾰ́ρᾰξαι}}, {surface: μὴ, lexeme: me, readings: {attic: μὴ}}, {surface: σκυθρώπαζ’, lexeme: skythropazo, feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, readings: {attic: σκῠθρώπᾰζ’}}, {surface: ὦ, lexeme: o, readings: {attic: ὦ}}, {surface: τέκνον, lexeme: teknon, feats: {Case: 'Acc,Nom,Voc', Number: Sing}, readings: {attic: τέκνον}}]
      translations:
        en: What has upset you? Don't scowl, child.”
  - choose:
      prompt:
        en: How does Lysistrata look?
      options:
      - en: Upset and scowling
      - en: Happy
      - en: Sleepy
      answer: 0
scenarios:
- id: grc.at-the-meeting
  after: grc.u06.ready
  title:
    en: The women's meeting
  setting:
    en: 'Athens, 411 BCE, early morning in a street below the Acropolis: Lysistrata has called the women of Greece to a meeting, and almost no one has come.'
  character:
    en: Calonice, Lysistrata's neighbour, warm and teasing, who speaks only Attic Greek.
  goal:
    en: Greet her, ask her where the other women are, and tell her that you are ready.
