- id: yue.story.free-tomorrow
  node: yue.time-story
  title:
    en: Are you free tomorrow?
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
  characters:
  - {id: gaa-ming, name: {yue-Hant-HK/standard: 家明}}
  - {id: mei-ling, name: {yue-Hant-HK/standard: 美玲}}
  steps:
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 美玲，你今日得唔得閒呀？
          tokens: [{surface: 美玲, readings: {jyutping: mei5 ling4}}, {surface: 你, sense: 你, readings: {jyutping: nei5}}, {surface: 今日, sense: 今日, readings: {jyutping: gam1 jat6}}, {surface: 得唔得閒, sense: 得閒, morphs: [{surface: 得, kc: 'sense:得閒'}, {surface: 唔, kc: 'sense:唔'}, {surface: 得閒, kc: 'sense:得閒'}], readings: {jyutping: dak1 m4 dak1 haan4}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Mei-ling, are you free today?'}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 對唔住，我今日好忙。
          tokens: [{surface: 對唔住, sense: 對唔住, readings: {jyutping: deoi3 m4 zyu6}}, {surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 今日, sense: 今日, readings: {jyutping: gam1 jat6}}, {surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 忙, sense: 忙, readings: {jyutping: mong4}}]
      translations: {en: 'Sorry, I''m really busy today.'}
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 聽日呢？
          tokens: [{surface: 聽日, sense: 聽日, readings: {jyutping: ting1 jat6}}, {surface: 呢, sense: 呢-sfp, readings: {jyutping: ne1}}]
      translations: {en: 'What about tomorrow?'}
  - line:
      speaker: mei-ling
