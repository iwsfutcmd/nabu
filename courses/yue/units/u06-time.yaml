          tokens: [{surface: 聽日, sense: 聽日, readings: {jyutping: ting1 jat6}}, {surface: 禮拜六, sense: 禮拜, morphs: [{surface: 禮拜, kc: 'sense:禮拜'}, {surface: 六, kc: 'sense:六'}], readings: {jyutping: lai5 baai3 luk6}}, {surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 得閒, sense: 得閒, readings: {jyutping: dak1 haan4}}]
      translations: {en: Tomorrow's Saturday. I'm free!}
  - choose:
