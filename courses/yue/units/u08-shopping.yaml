stories:
- id: yue.story.market
  node: yue.shopping-story
  title:
    en: Bargaining at the market
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
  characters:
  - {id: mei-ling, name: {yue-Hant-HK/standard: 美玲}}
  - {id: si-tau, name: {yue-Hant-HK/standard: 檔主}}
  steps:
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 唔該，呢件衫幾多錢呀？
          tokens: [{surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}, {surface: 呢件, sense: 呢, morphs: [{surface: 呢, kc: 'sense:呢'}, {surface: 件, kc: 'sense:件'}], readings: {jyutping: ne1 gin6}}, {surface: 衫, sense: 衫, readings: {jyutping: saam1}}, {surface: 幾多, sense: 幾多, readings: {jyutping: gei2 do1}}, {surface: 錢, sense: 錢, readings: {jyutping: cin2}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Excuse me, how much is this top?'}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 一百蚊。
          tokens: [{surface: 一百, morphs: [{surface: 一, kc: 'sense:一'}, {surface: 百, kc: 'sense:百'}], readings: {jyutping: jat1 baak3}}, {surface: 蚊, sense: 蚊, readings: {jyutping: man1}}]
      translations: {en: A hundred dollars.}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 太貴喇！平啲得唔得呀？
          tokens: [{surface: 太, sense: 太, readings: {jyutping: taai3}}, {surface: 貴, sense: 貴, readings: {jyutping: gwai3}}, {surface: 喇, sense: 喇, readings: {jyutping: laa3}}, {surface: 平, sense: 平, readings: {jyutping: peng4}}, {surface: 啲, sense: 啲, readings: {jyutping: di1}}, {surface: 得, sense: 得, readings: {jyutping: dak1}}, {surface: 唔, sense: 唔, readings: {jyutping: m4}}, {surface: 得, sense: 得, readings: {jyutping: dak1}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'That''s too expensive! Can you make it cheaper?'}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 八十蚊啦。
          tokens: [{surface: 八十, morphs: [{surface: 八, kc: 'sense:八'}, {surface: 十, kc: 'sense:十'}], readings: {jyutping: baat3 sap6}}, {surface: 蚊, sense: 蚊, readings: {jyutping: man1}}, {surface: 啦, sense: 啦, readings: {jyutping: laa1}}]
      translations: {en: 'Eighty, then.'}
  - choose:
      prompt: {en: 'What price does the stallholder ask first?'}
      options: [{en: 100 dollars}, {en: 80 dollars}, {en: 50 dollars}]
      answer: 0
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 有冇細啲呀？
          tokens: [{surface: 有, sense: 有, readings: {jyutping: jau5}}, {surface: 冇, sense: 冇, readings: {jyutping: mou5}}, {surface: 細, sense: 細, readings: {jyutping: sai3}}, {surface: 啲, sense: 啲, readings: {jyutping: di1}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Do you have a smaller one?'}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 有。你鍾意咩顏色呀？
          tokens: [{surface: 有, sense: 有, readings: {jyutping: jau5}}, {surface: 你, sense: 你, readings: {jyutping: nei5}}, {surface: 鍾意, sense: 鍾意, readings: {jyutping: zung1 ji3}}, {surface: 咩, sense: 咩, readings: {jyutping: me1}}, {surface: 顏色, sense: 顏色, readings: {jyutping: ngaan4 sik1}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Yes. What colour do you like?'}
  - line:
      speaker: mei-ling
      ask: complete
      gap: sense:紅色
      distractors: ['sense:黑色', 'sense:白色']
      forms:
        yue-Hant-HK/standard:
          text: 我要紅色嘅。
          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 要, sense: 要, readings: {jyutping: jiu3}}, {surface: 紅色, sense: 紅色, readings: {jyutping: hung4 sik1}}, {surface: 嘅, sense: 嘅, readings: {jyutping: ge3}}]
      translations: {en: I'll take the red one.}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 收唔收八達通呀？
          tokens: [{surface: 收, sense: 收, readings: {jyutping: sau1}}, {surface: 唔, sense: 唔, readings: {jyutping: m4}}, {surface: 收, sense: 收, readings: {jyutping: sau1}}, {surface: 八達通, sense: 八達通, readings: {jyutping: baat3 daat6 tung1}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Do you take Octopus?'}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 唔收，要現金。
          tokens: [{surface: 唔, sense: 唔, readings: {jyutping: m4}}, {surface: 收, sense: 收, readings: {jyutping: sau1}}, {surface: 要, sense: 要, readings: {jyutping: jiu3}}, {surface: 現金, sense: 現金, readings: {jyutping: jin6 gam1}}]
      translations: {en: 'No, cash only.'}
  - line:
      speaker: mei-ling
      ask: arrange
      forms:
        yue-Hant-HK/standard:
          text: 好，俾你八十蚊。
          tokens: [{surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 俾, sense: 俾, readings: {jyutping: bei2}}, {surface: 你, sense: 你, readings: {jyutping: nei5}}, {surface: 八十, morphs: [{surface: 八, kc: 'sense:八'}, {surface: 十, kc: 'sense:十'}], readings: {jyutping: baat3 sap6}}, {surface: 蚊, sense: 蚊, readings: {jyutping: man1}}]
      translations: {en: 'OK, here''s eighty dollars.'}
  - choose:
      prompt: {en: 'How does Mei-ling pay?'}
      options: [{en: in cash}, {en: with her Octopus card}, {en: she doesn't buy anything}]
      answer: 0
scenarios:
- id: yue.market-bargain
  after: yue.pay
  title:
    en: Bargaining at a street market
  setting:
    en: A busy clothes stall at a night market in Mong Kok.
  character:
    en: A quick-talking stallholder who starts with high prices but is happy to bargain a little.
  goal:
    en: Ask the price of something, say it is too expensive, ask for a cheaper price and a different size or colour, and pay.
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
