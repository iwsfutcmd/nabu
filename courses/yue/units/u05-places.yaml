- id: yue.story.neighbours
  node: yue.places-story
  title:
    en: New neighbours
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
  characters:
  - {id: mei-ling, name: {yue-Hant-HK/standard: 美玲}}
  - {id: gaa-ming, name: {yue-Hant-HK/standard: 家明}}
  steps:
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 早晨！你係唔係住喺呢度呀？
          tokens: [{surface: 早晨, sense: 早晨, readings: {jyutping: zou2 san4}}, {surface: 你, sense: 你, readings: {jyutping: nei5}}, {surface: 係, sense: 係, readings: {jyutping: hai6}}, {surface: 唔, sense: 唔, readings: {jyutping: m4}}, {surface: 係, sense: 係, readings: {jyutping: hai6}}, {surface: 住, sense: 住, readings: {jyutping: zyu6}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 呢度, sense: 呢度, readings: {jyutping: ni1 dou6}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Morning! Do you live here?'}
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 係呀，我住喺樓上。
          tokens: [{surface: 係, sense: 係, readings: {jyutping: hai6}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}, {surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 住, sense: 住, readings: {jyutping: zyu6}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 樓上, sense: 樓上, readings: {jyutping: lau4 soeng6}}]
      translations: {en: 'Yes, I live upstairs.'}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 我住喺樓下！
          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 住, sense: 住, readings: {jyutping: zyu6}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 樓下, sense: 樓下, readings: {jyutping: lau4 haa6}}]
      translations: {en: I live downstairs!}
  - choose:
      prompt: {en: 'Where does Ka-ming live?'}
      options: [{en: upstairs}, {en: downstairs}, {en: in Central}]
      answer: 0
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 你去邊度呀？
          tokens: [{surface: 你, sense: 你, readings: {jyutping: nei5}}, {surface: 去, sense: 去, readings: {jyutping: heoi3}}, {surface: 邊度, sense: 邊度, readings: {jyutping: bin1 dou6}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Where are you going?'}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 我返工。我喺中環做嘢。
          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 返工, sense: 返工, readings: {jyutping: faan1 gung1}}, {surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 中環, sense: 中環, readings: {jyutping: zung1 waan4}}, {surface: 做嘢, sense: 做嘢, readings: {jyutping: zou6 je5}}]
      translations: {en: I'm going to work. I work in Central.}
  - line:
      speaker: gaa-ming
      ask: complete
      gap: sense:醫院
      distractors: ['sense:銀行', 'sense:學校']
      forms:
        yue-Hant-HK/standard:
          text: 我喺醫院做嘢，我係醫生。
          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 醫院, sense: 醫院, readings: {jyutping: ji1 jyun2}}, {surface: 做嘢, sense: 做嘢, readings: {jyutping: zou6 je5}}, {surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 係, sense: 係, readings: {jyutping: hai6}}, {surface: 醫生, sense: 醫生, readings: {jyutping: ji1 sang1}}]
      translations: {en: I work at a hospital. I'm a doctor.}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 醫院遠唔遠呀？
          tokens: [{surface: 醫院, sense: 醫院, readings: {jyutping: ji1 jyun2}}, {surface: 遠, sense: 遠, readings: {jyutping: jyun5}}, {surface: 唔, sense: 唔, readings: {jyutping: m4}}, {surface: 遠, sense: 遠, readings: {jyutping: jyun5}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Is the hospital far?'}
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 唔係好遠。
          tokens: [{surface: 唔, sense: 唔, readings: {jyutping: m4}}, {surface: 係, sense: 係, readings: {jyutping: hai6}}, {surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 遠, sense: 遠, readings: {jyutping: jyun5}}]
      translations: {en: Not very far.}
  - line:
      speaker: mei-ling
      ask: arrange
      forms:
        yue-Hant-HK/standard:
          text: 附近有冇超市呀？
          tokens: [{surface: 附近, sense: 附近, readings: {jyutping: fu6 gan6}}, {surface: 有, sense: 有, readings: {jyutping: jau5}}, {surface: 冇, sense: 冇, readings: {jyutping: mou5}}, {surface: 超市, sense: 超市, readings: {jyutping: ciu1 si5}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Is there a supermarket nearby?'}
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 有，喺銀行對面。
          tokens: [{surface: 有, sense: 有, readings: {jyutping: jau5}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 銀行, sense: 銀行, readings: {jyutping: ngan4 hong4}}, {surface: 對面, sense: 對面, readings: {jyutping: deoi3 min6}}]
      translations: {en: 'Yes, opposite the bank.'}
  - choose:
      prompt: {en: 'Where is the supermarket?'}
      options: [{en: opposite the bank}, {en: behind the hospital}, {en: upstairs}]
      answer: 0
