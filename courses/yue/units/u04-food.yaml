stories:
- id: yue.story.cha-chaan-teng
  node: yue.food-story
  title:
    en: Breakfast at the cha chaan teng
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
  characters:
  - {id: fo-gai, name: {yue-Hant-HK/standard: 伙計}}
  - {id: gaa-ming, name: {yue-Hant-HK/standard: 家明}}
  steps:
  - line:
      speaker: fo-gai
      forms:
        yue-Hant-HK/standard:
          text: 早晨！食咩呀？
          tokens: [{surface: 早晨, sense: 早晨, readings: {jyutping: zou2 san4}}, {surface: 食, sense: 食, readings: {jyutping: sik6}}, {surface: 咩, sense: 咩, readings: {jyutping: me1}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Morning! What''ll you have?'}
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 唔該，我要牛肉麵。
          tokens: [{surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}, {surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 要, sense: 要, readings: {jyutping: jiu3}}, {surface: 牛肉, sense: 牛肉, readings: {jyutping: ngau4 juk6}}, {surface: 麵, sense: 麵, readings: {jyutping: min6}}]
      translations: {en: 'Beef noodles, please.'}
  - line:
      speaker: fo-gai
      forms:
        yue-Hant-HK/standard:
          text: 飲咩呀？
          tokens: [{surface: 飲, sense: 飲, readings: {jyutping: jam2}}, {surface: 咩, sense: 咩, readings: {jyutping: me1}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Anything to drink?'}
  - line:
      speaker: gaa-ming
      ask: complete
      gap: sense:奶茶
      distractors: ['sense:咖啡', 'sense:水']
      forms:
        yue-Hant-HK/standard:
          text: 一杯奶茶，唔該。
          tokens: [{surface: 一, sense: 一, readings: {jyutping: jat1}}, {surface: 杯, sense: 杯, readings: {jyutping: bui1}}, {surface: 奶茶, sense: 奶茶, readings: {jyutping: naai5 caa4}}, {surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}]
      translations: {en: 'A milk tea, please.'}
  - line:
      speaker: fo-gai
      forms:
        yue-Hant-HK/standard:
          text: 熱定凍呀？
          tokens: [{surface: 熱, sense: 熱, readings: {jyutping: jit6}}, {surface: 定, sense: 定, readings: {jyutping: ding6}}, {surface: 凍, sense: 凍, readings: {jyutping: dung3}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Hot or iced?'}
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 凍嘅，唔該。
          tokens: [{surface: 凍, sense: 凍, readings: {jyutping: dung3}}, {surface: 嘅, sense: 嘅, readings: {jyutping: ge3}}, {surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}]
      translations: {en: 'Iced, please.'}
  - choose:
      prompt: {en: 'What does Ka-ming order to drink?'}
      options: [{en: an iced milk tea}, {en: a hot milk tea}, {en: an iced coffee}]
      answer: 0
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 呢碗麵好好食！
          tokens: [{surface: 呢碗, sense: 呢, morphs: [{surface: 呢, kc: 'sense:呢'}, {surface: 碗, kc: 'sense:碗'}], readings: {jyutping: ni1 wun2}}, {surface: 麵, sense: 麵, readings: {jyutping: min6}}, {surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 好食, sense: 好食, readings: {jyutping: hou2 sik6}}]
      translations: {en: These noodles are delicious!}
  - line:
      speaker: gaa-ming
      ask: arrange
      forms:
        yue-Hant-HK/standard:
          text: 我好飽呀。
          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 飽, sense: 飽, readings: {jyutping: baau2}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: I'm so full.}
  - line:
      speaker: gaa-ming
      forms:
        yue-Hant-HK/standard:
          text: 唔該晒！
          tokens: [{surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}, {surface: 晒, sense: 晒, readings: {jyutping: saai3}}]
