scenarios:
- id: yue.order-cha-chaan-teng
  after: yue.cafe
  title:
    en: Ordering at a cha chaan teng
  setting:
    en: A crowded Hong Kong-style café at breakfast time; the waiter is busy and quick.
  character:
    en: A brisk but friendly waiter who asks short questions (食咩呀？ 飲咩呀？ 熱定凍呀？).
  goal:
    en: Order something to eat and a drink, say whether you want it hot or iced, and thank the waiter.
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
