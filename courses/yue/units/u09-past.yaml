- id: yue.weekend-chat
  after: yue.study
  title:
    en: Catching up after the weekend
  setting:
    en: The office pantry on a Monday morning.
  character:
    en: A friendly colleague who asks whether you have eaten and what you did at the weekend, and talks about their own.
  goal:
