        yue-Hant-HK/standard:
          text: 食咗喇。你呢？
          tokens: [{surface: 食, sense: 食, readings: {jyutping: sik6}}, {surface: 咗, sense: 咗, readings: {jyutping: zo2}}, {surface: 喇, sense: 喇, readings: {jyutping: laa3}}, {surface: 你, sense: 你, readings: {jyutping: nei5}}, {surface: 呢, sense: 呢-sfp, readings: {jyutping: ne1}}]
      translations: {en: 'Yes, I have. And you?'}
  - line:
