stories:
- id: yue.story.book-stall
  node: yue.numbers-story
  title:
    en: At the book stall
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
  characters:
  - {id: mei-ling, name: {yue-Hant-HK/standard: 美玲}}
  - {id: si-tau, name: {yue-Hant-HK/standard: 檔主}}
  steps:
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 你好！呢本書幾多錢呀？
          tokens: [{surface: 你好, sense: 你好, readings: {jyutping: nei5 hou2}}, {surface: 呢本, sense: 呢, morphs: [{surface: 呢, kc: 'sense:呢'}, {surface: 本, kc: 'sense:本'}], readings: {jyutping: ni1 bun2}}, {surface: 書, sense: 書, readings: {jyutping: syu1}}, {surface: 幾多, sense: 幾多, readings: {jyutping: gei2 do1}}, {surface: 錢, sense: 錢, readings: {jyutping: cin2}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'Hello! How much is this book?'}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 呢本八十蚊。
          tokens: [{surface: 呢本, sense: 呢, morphs: [{surface: 呢, kc: 'sense:呢'}, {surface: 本, kc: 'sense:本'}], readings: {jyutping: ni1 bun2}}, {surface: 八十, morphs: [{surface: 八, kc: 'sense:八'}, {surface: 十, kc: 'sense:十'}], readings: {jyutping: baat3 sap6}}, {surface: 蚊, sense: 蚊, readings: {jyutping: man1}}]
      translations: {en: This one is eighty dollars.}
  - line:
      speaker: mei-ling
      ask: arrange
      forms:
        yue-Hant-HK/standard:
          text: 嗰本呢？
          tokens: [{surface: 嗰本, sense: 嗰, morphs: [{surface: 嗰, kc: 'sense:嗰'}, {surface: 本, kc: 'sense:本'}], readings: {jyutping: go2 bun2}}, {surface: 呢, sense: 呢-sfp, readings: {jyutping: ne1}}]
      translations: {en: 'And that one?'}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 嗰本二十蚊。
          tokens: [{surface: 嗰本, sense: 嗰, morphs: [{surface: 嗰, kc: 'sense:嗰'}, {surface: 本, kc: 'sense:本'}], readings: {jyutping: go2 bun2}}, {surface: 二十, morphs: [{surface: 二, kc: 'sense:二'}, {surface: 十, kc: 'sense:十'}], readings: {jyutping: ji6 sap6}}, {surface: 蚊, sense: 蚊, readings: {jyutping: man1}}]
      translations: {en: That one is twenty dollars.}
  - choose:
      prompt: {en: 'How much is the first book?'}
      options: [{en: 80 dollars}, {en: 20 dollars}, {en: 8 dollars}]
      answer: 0
  - line:
      speaker: mei-ling
      ask: complete
      gap: sense:本
      distractors: ['sense:隻', 'sense:個']
      forms:
        yue-Hant-HK/standard:
          text: 我買兩本。
          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 買, sense: 買, readings: {jyutping: maai5}}, {surface: 兩, sense: 兩, readings: {jyutping: loeng5}}, {surface: 本, sense: 本, readings: {jyutping: bun2}}]
      translations: {en: I'll take two.}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 兩本四十蚊。
          tokens: [{surface: 兩, sense: 兩, readings: {jyutping: loeng5}}, {surface: 本, sense: 本, readings: {jyutping: bun2}}, {surface: 四十, morphs: [{surface: 四, kc: 'sense:四'}, {surface: 十, kc: 'sense:十'}], readings: {jyutping: sei3 sap6}}, {surface: 蚊, sense: 蚊, readings: {jyutping: man1}}]
      translations: {en: Forty dollars for two.}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 好，唔該晒！
          tokens: [{surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}, {surface: 晒, sense: 晒, readings: {jyutping: saai3}}]
      translations: {en: 'OK, thanks so much!'}
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 唔該！拜拜！
          tokens: [{surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}, {surface: 拜拜, sense: 拜拜, readings: {jyutping: baai1 baai3}}]
      translations: {en: Thank you! Bye-bye!}
  - choose:
      prompt: {en: 'How many books does Mei-ling buy?'}
      options: [{en: two}, {en: one}, {en: four}]
      answer: 0
