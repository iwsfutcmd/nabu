scenarios:
- id: yue.taxi-ride
  after: yue.tickets
  title:
    en: Taking a taxi
  setting:
    en: A red urban taxi in Kowloon on a weekday afternoon.
  character:
    en: A chatty taxi driver who asks where you are going and comments on the traffic in simple Cantonese.
  goal:
    en: Say where you want to go, ask how long it takes, tell the driver where to stop and pay.
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
