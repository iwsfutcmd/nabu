stories:
- id: yue.story.taxi
  node: yue.transport-story
  title:
    en: A taxi to the airport
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
  characters:
  - {id: mei-ling, name: {yue-Hant-HK/standard: 美玲}}
  - {id: si-gei, name: {yue-Hant-HK/standard: 司機}}
  steps:
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 司機，唔該去機場。
          tokens: [{surface: 司機, sense: 司機, readings: {jyutping: si1 gei1}}, {surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}, {surface: 去, sense: 去, readings: {jyutping: heoi3}}, {surface: 機場, sense: 機場, readings: {jyutping: gei1 coeng4}}]
      translations: {en: 'Driver, the airport, please.'}
  - line:
      speaker: si-gei
      forms:
        yue-Hant-HK/standard:
          text: 好。
          tokens: [{surface: 好, sense: 好, readings: {jyutping: hou2}}]
      translations: {en: OK.}
  - line:
      speaker: mei-ling
      ask: arrange
      forms:
        yue-Hant-HK/standard:
          text: 要幾耐呀？
          tokens: [{surface: 要, sense: 要, readings: {jyutping: jiu3}}, {surface: 幾耐, sense: 幾耐, readings: {jyutping: gei2 noi6}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: 'How long will it take?'}
  - line:
      speaker: si-gei
      forms:
        yue-Hant-HK/standard:
          text: 要四十分鐘。
          tokens: [{surface: 要, sense: 要, readings: {jyutping: jiu3}}, {surface: 四十, morphs: [{surface: 四, kc: 'sense:四'}, {surface: 十, kc: 'sense:十'}], readings: {jyutping: sei3 sap6}}, {surface: 分鐘, sense: 分鐘, readings: {jyutping: fan1 zung1}}]
      translations: {en: Forty minutes.}
  - choose:
      prompt: {en: 'How long is the ride?'}
      options: [{en: forty minutes}, {en: fourteen minutes}, {en: four minutes}]
      answer: 0
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 好，唔該。
          tokens: [{surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}]
      translations: {en: 'OK, thanks.'}
  - line:
      speaker: si-gei
      forms:
        yue-Hant-HK/standard:
          text: 機場喺前面喇。
          tokens: [{surface: 機場, sense: 機場, readings: {jyutping: gei1 coeng4}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 前面, sense: 前面, readings: {jyutping: cin4 min6}}, {surface: 喇, sense: 喇, readings: {jyutping: laa3}}]
      translations: {en: The airport is just ahead now.}
  - line:
      speaker: mei-ling
      ask: complete
      gap: sense:停
      distractors: ['sense:搭', 'sense:等']
      forms:
        yue-Hant-HK/standard:
          text: 唔該，喺呢度停。
          tokens: [{surface: 唔該, sense: 唔該, readings: {jyutping: m4 goi1}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 呢度, sense: 呢度, readings: {jyutping: ni1 dou6}}, {surface: 停, sense: 停, readings: {jyutping: ting4}}]
      translations: {en: Please stop here.}
  - line:
      speaker: si-gei
      forms:
        yue-Hant-HK/standard:
          text: 三百蚊。
          tokens: [{surface: 三百, morphs: [{surface: 三, kc: 'sense:三'}, {surface: 百, kc: 'sense:百'}], readings: {jyutping: saam1 baak3}}, {surface: 蚊, sense: 蚊, readings: {jyutping: man1}}]
      translations: {en: Three hundred dollars.}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 我用八達通。
          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 用, sense: 用, readings: {jyutping: jung6}}, {surface: 八達通, sense: 八達通, readings: {jyutping: baat3 daat6 tung1}}]
      translations: {en: I'll use my Octopus card.}
  - line:
      speaker: si-gei
      forms:
        yue-Hant-HK/standard:
          text: 好。拜拜！
          tokens: [{surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 拜拜, sense: 拜拜, readings: {jyutping: baai1 baai3}}]
      translations: {en: OK. Bye-bye!}
  - choose:
      prompt: {en: 'How does Mei-ling pay?'}
      options: [{en: with her Octopus card}, {en: in cash}, {en: she doesn't pay}]
      answer: 0
scenarios:
- id: yue.taxi-ride
  after: yue.tickets
  title:
    en: Taking a taxi
  setting:
    en: A red urban taxi in Kowloon on a weekday afternoon.
  character:
    en: A chatty taxi driver who asks where you are going and comments on the traffic in simple Cantonese.
  goal:
    en: Say where you want to go, ask how long it takes, tell the driver where to stop and pay.
  provenance: {author: 'llm:claude@4c3f4acef278', status: draft}
