        yue-Hant-HK/standard:
          text: 落緊雨呀！
          tokens: [{surface: 落, sense: 落, readings: {jyutping: lok6}}, {surface: 緊, sense: 緊, readings: {jyutping: gan2}}, {surface: 雨, sense: 雨, readings: {jyutping: jyu5}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
      translations: {en: It's raining!}
  - choose:
