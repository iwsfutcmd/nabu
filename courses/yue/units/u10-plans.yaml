          tokens: [{surface: 兩, sense: 兩, readings: {jyutping: loeng5}}, {surface: 點, sense: 點, readings: {jyutping: dim2}}, {surface: 喺, sense: 喺, readings: {jyutping: hai2}}, {surface: 地鐵, sense: 地鐵, readings: {jyutping: dei6 tit3}}, {surface: 站, sense: 站, readings: {jyutping: zaam6}}, {surface: 等, sense: 等, readings: {jyutping: dang2}}, {surface: 啦, sense: 啦, readings: {jyutping: laa1}}]
