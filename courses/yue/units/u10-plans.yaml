          tokens: [{surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 睇, sense: 睇, readings: {jyutping: tai2}}, {surface: 緊, sense: 緊, readings: {jyutping: gan2}}, {surface: 電視, sense: 電視, readings: {jyutping: din6 si6}}]
