      options: [{en: It's raining.}, {en: He's at work.}, {en: He's tired.}]
      answer: 0
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 天文台話一陣出太陽。
          tokens: [{surface: 天文台, sense: 天文台, readings: {jyutping: tin1 man4 toi4}}, {surface: 話, sense: 話, readings: {jyutping: waa6}}, {surface: 一陣, sense: 一陣, readings: {jyutping: jat1 zan6}}, {surface: 出太陽, sense: 出太陽, readings: {jyutping: ceot1 taai3 joeng4}}]
      translations: {en: The Observatory says it'll be sunny soon.}
  - line:
      speaker: gaa-ming
      ask: complete
      gap: sense:遮
      distractors: ['sense:電話', 'sense:電視']
      forms:
        yue-Hant-HK/standard:
          text: 好啦，我帶遮。
          tokens: [{surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 啦, sense: 啦, readings: {jyutping: laa1}}, {surface: 我, sense: 我, readings: {jyutping: ngo5}}, {surface: 帶, sense: 帶, readings: {jyutping: daai3}}, {surface: 遮, sense: 遮, readings: {jyutping: ze1}}]
      translations: {en: 'All right, I''ll bring an umbrella.'}
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 好呀！我哋幾點等呀？
          tokens: [{surface: 好, sense: 好, readings: {jyutping: hou2}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}, {surface: 我哋, sense: 我, morphs: [{surface: 我, kc: 'sense:我'}, {surface: 哋, kc: 'form:plural-dei'}], readings: {jyutping: ngo5 dei6}}, {surface: 幾點, sense: 幾點, readings: {jyutping: gei2 dim2}}, {surface: 等, sense: 等, readings: {jyutping: dang2}}, {surface: 呀, sense: 呀, readings: {jyutping: aa3}}]
