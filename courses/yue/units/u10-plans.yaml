          tokens: [{surface: 不如, sense: 不如, readings: {jyutping: bat1 jyu4}}, {surface: 一齊, sense: 一齊, readings: {jyutping: jat1 cai4}}, {surface: 去, sense: 去, readings: {jyutping: heoi3}}, {surface: 行山, sense: 行山, readings: {jyutping: haang4 saan1}}, {surface: 啦, sense: 啦, readings: {jyutping: laa1}}]
      translations: {en: 'Why don''t we go hiking together?'}
  - line:
