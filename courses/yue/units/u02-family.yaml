# Cantonese (Hong Kong) unit u02-family: names (叫, 姓), the general classifier 個, 呢個, family words, 有/冇, 都, the particle 呢.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: u02-family
title: {en: 'Names, family and friends'}
cefr: A1
kcs:
- {id: 'sense:叫', gloss: {en: to be called; to call}, forms: {yue-Hant-HK/standard: [叫]}}
- {id: 'sense:咩', gloss: {en: what (short for 乜嘢)}, forms: {yue-Hant-HK/standard: [咩]}}
- {id: 'sense:名', gloss: {en: name}, forms: {yue-Hant-HK/standard: [名]}, image: {file: ../images/name-tag.svg, license: CC0-1.0, provenance: {author: 'llm:claude@949422768931', status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'Read meng2 in everyday words (叫咩名, 出名, 簽名); ming4 in literary ones and for a rank (第一名).'}}
- {id: 'sense:姓', gloss: {en: to be surnamed; surname}, forms: {yue-Hant-HK/standard: [姓]}}
- {id: 'sense:乜嘢', gloss: {en: what}, forms: {yue-Hant-HK/standard: [乜嘢]}, notes: {en: The full form of 咩. Often typed 乜野.}}
- {id: 'sense:先生', gloss: {en: Mr; sir; husband}, forms: {yue-Hant-HK/standard: [先生]}, notes: {en: 'After a surname: 陳先生 Mr Chan, or 陳生, the usual form of address.'}}
- {id: 'sense:小姐', gloss: {en: Miss; Ms}, forms: {yue-Hant-HK/standard: [小姐]}, notes: {en: 'After a surname: 李小姐 Miss Lee.'}}
- {id: 'sense:呢-sfp', gloss: {en: 'sentence-final particle: and …? what about …? where is …?'}, forms: {yue-Hant-HK/standard: [呢]}, notes: {en: '你呢？ ''and you?''; 我本書呢？ ''where is my book?''. The same character before a classifier means ''this'' (呢個).'}}
- {id: 'sense:爸爸', gloss: {en: dad; father}, forms: {yue-Hant-HK/standard: [爸爸]}}
- {id: 'sense:媽媽', gloss: {en: mum; mother}, forms: {yue-Hant-HK/standard: [媽媽]}}
- {id: 'sense:個', gloss: {en: 'the general classifier (for people and many things); with a noun before the verb: the'}, forms: {yue-Hant-HK/standard: [個]}, notes: {en: 'Cantonese counts and points with a classifier: 一個人 one person, 呢個 this one. 個老師好好 ''the teacher is nice''; after the verb it is ''a'': 我有個哥哥.'}}
- {id: 'sense:呢', gloss: {en: 'this (before a classifier)'}, forms: {yue-Hant-HK/standard: [呢]}, notes: {en: 'Before a classifier: 呢個 "this one". Pronounced ni1 here (also nei1, and li1 where n and l merge). At the end of a question the same character is the particle ne1 (你呢？).'}}
- {id: 'sense:屋企人', gloss: {en: family; family members}, forms: {yue-Hant-HK/standard: [屋企人]}}
- {id: 'sense:哥哥', gloss: {en: older brother}, forms: {yue-Hant-HK/standard: [哥哥]}}
- {id: 'sense:家姐', gloss: {en: older sister}, forms: {yue-Hant-HK/standard: [家姐]}}
- {id: 'sense:有', gloss: {en: 'to have; there is, there are'}, forms: {yue-Hant-HK/standard: [有]}}
- {id: 'sense:冇', gloss: {en: not to have; there isn't; (before a verb) didn't}, forms: {yue-Hant-HK/standard: [冇]}, notes: {en: 'The negative of 有: 有冇? ''is there…? do you have…?''. Often typed 無.'}}
- {id: 'sense:弟弟', gloss: {en: younger brother}, forms: {yue-Hant-HK/standard: [弟弟]}, notes: {en: Read dai4 dai2 in everyday speech. Hong Kong people also say 細佬 sai3 lou2.}}
- {id: 'sense:細妹', gloss: {en: younger sister}, forms: {yue-Hant-HK/standard: [細妹]}}
- {id: 'sense:朋友', gloss: {en: friend}, forms: {yue-Hant-HK/standard: [朋友]}}
- {id: 'sense:都', gloss: {en: 'also, too; both, all'}, forms: {yue-Hant-HK/standard: [都]}, notes: {en: 'Comes before the verb: 我都係學生 ''I''m a student too''.'}}
- {id: 'sense:同事', gloss: {en: colleague}, forms: {yue-Hant-HK/standard: [同事]}}
- {id: 'sense:醫生', gloss: {en: doctor}, forms: {yue-Hant-HK/standard: [醫生]}}
- {id: 'sense:人', gloss: {en: person; people}, forms: {yue-Hant-HK/standard: [人]}}
- {id: 'sense:高', gloss: {en: tall; high}, forms: {yue-Hant-HK/standard: [高]}}
- {id: 'sense:靚', gloss: {en: pretty; good-looking; nice}, forms: {yue-Hant-HK/standard: [靚]}}
- {id: 'sense:開心', gloss: {en: happy}, forms: {yue-Hant-HK/standard: [開心]}, image: {file: ../images/smile.svg, license: CC0-1.0, provenance: {author: 'llm:claude@d6c9379209cc', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:攰', gloss: {en: tired}, forms: {yue-Hant-HK/standard: [攰]}}
