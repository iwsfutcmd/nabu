          tokens: [{surface: m4, lexeme: 唔, readings: {characters: 唔}}, {surface: sau1, lexeme: 收, readings: {characters: 收}}, {surface: jiu3, lexeme: 要, readings: {characters: 要}}, {surface: jin6 gam1, lexeme: 現金, readings: {characters: 現金}}]
      translations:
