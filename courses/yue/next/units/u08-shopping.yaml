          tokens: [{surface: hou2, lexeme: 好, readings: {characters: 好}}, {surface: bei2, lexeme: 俾, readings: {characters: 俾}}, {surface: baat3 sap6, lexemes: [{lexeme: 八, surface: 'baat3 '}, {lexeme: 十, surface: sap6}], readings: {characters: 八十}}, {surface: man1, lexeme: 蚊, readings: {characters: 蚊}}, {surface: nei5, lexeme: 你, readings: {characters: 你}}]
      translations:
