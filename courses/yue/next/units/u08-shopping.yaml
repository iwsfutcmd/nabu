stories:
- id: yue.story.market
  node: yue.shopping-story
  title:
    en: Bargaining at the market
  provenance:
    author: llm:claude@4c3f4acef278
    status: draft
  characters:
  - id: mei-ling
    name:
      yue-Hant-HK/standard: 美玲
      yue-Latn/jyutping: mei5 ling4
  - id: si-tau
    name:
      yue-Hant-HK/standard: 檔主
      yue-Latn/jyutping: dong3 zyu2
  steps:
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 唔該，呢件衫幾多錢呀？
          tokens: [{surface: 唔該, lexeme: 唔該, readings: {jyutping: m4 goi1}}, {surface: 呢件, lexemes: [{lexeme: 呢, surface: 呢, base: true}, {lexeme: 件, surface: 件}], readings: {jyutping: ni1 gin6}}, {surface: 衫, lexeme: 衫, readings: {jyutping: saam1}}, {surface: 幾多, lexeme: 幾多, readings: {jyutping: gei2 do1}}, {surface: 錢, lexeme: 錢, readings: {jyutping: cin2}}, {surface: 呀, lexeme: 呀, readings: {jyutping: aa3}}]
        yue-Latn/jyutping:
          text: m4 goi1, ni1 gin6 saam1 gei2 do1 cin2 aa3?
          tokens: [{surface: m4 goi1, lexeme: 唔該, readings: {characters: 唔該}}, {surface: ni1 gin6, lexemes: [{lexeme: 呢, surface: 'ni1 ', base: true}, {lexeme: 件, surface: gin6}], readings: {characters: 呢件}}, {surface: saam1, lexeme: 衫, readings: {characters: 衫}}, {surface: gei2 do1, lexeme: 幾多, readings: {characters: 幾多}}, {surface: cin2, lexeme: 錢, readings: {characters: 錢}}, {surface: aa3, lexeme: 呀, readings: {characters: 呀}}]
      translations:
        en: Excuse me, how much is this top?
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 一百蚊。
          tokens: [{surface: 一百, lexemes: [{lexeme: 一, surface: 一}, {lexeme: 百, surface: 百}], readings: {jyutping: jat1 baak3}}, {surface: 蚊, lexeme: 蚊, readings: {jyutping: man1}}]
        yue-Latn/jyutping:
          text: jat1 baak3 man1.
          tokens: [{surface: jat1 baak3, lexemes: [{lexeme: 一, surface: 'jat1 '}, {lexeme: 百, surface: baak3}], readings: {characters: 一百}}, {surface: man1, lexeme: 蚊, readings: {characters: 蚊}}]
      translations:
        en: A hundred dollars.
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 太貴喇！平啲得唔得呀？
          tokens: [{surface: 太, lexeme: 太, readings: {jyutping: taai3}}, {surface: 貴, lexeme: 貴, readings: {jyutping: gwai3}}, {surface: 喇, lexeme: 喇, readings: {jyutping: laa3}}, {surface: 平, lexeme: 平, readings: {jyutping: peng4}}, {surface: 啲, lexeme: 啲, readings: {jyutping: di1}}, {surface: 得, lexeme: 得, readings: {jyutping: dak1}}, {surface: 唔, lexeme: 唔, readings: {jyutping: m4}}, {surface: 得, lexeme: 得, readings: {jyutping: dak1}}, {surface: 呀, lexeme: 呀, readings: {jyutping: aa3}}]
        yue-Latn/jyutping:
          text: taai3 gwai3 laa3! peng4 di1 dak1 m4 dak1 aa3?
          tokens: [{surface: taai3, lexeme: 太, readings: {characters: 太}}, {surface: gwai3, lexeme: 貴, readings: {characters: 貴}}, {surface: laa3, lexeme: 喇, readings: {characters: 喇}}, {surface: peng4, lexeme: 平, readings: {characters: 平}}, {surface: di1, lexeme: 啲, readings: {characters: 啲}}, {surface: dak1, lexeme: 得, readings: {characters: 得}}, {surface: m4, lexeme: 唔, readings: {characters: 唔}}, {surface: dak1, lexeme: 得, readings: {characters: 得}}, {surface: aa3, lexeme: 呀, readings: {characters: 呀}}]
      translations:
        en: That's too expensive! Can you make it cheaper?
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 八十蚊啦。
          tokens: [{surface: 八十, lexemes: [{lexeme: 八, surface: 八}, {lexeme: 十, surface: 十}], readings: {jyutping: baat3 sap6}}, {surface: 蚊, lexeme: 蚊, readings: {jyutping: man1}}, {surface: 啦, lexeme: 啦, readings: {jyutping: laa1}}]
        yue-Latn/jyutping:
          text: baat3 sap6 man1 laa1.
          tokens: [{surface: baat3 sap6, lexemes: [{lexeme: 八, surface: 'baat3 '}, {lexeme: 十, surface: sap6}], readings: {characters: 八十}}, {surface: man1, lexeme: 蚊, readings: {characters: 蚊}}, {surface: laa1, lexeme: 啦, readings: {characters: 啦}}]
      translations:
        en: Eighty, then.
  - choose:
      prompt:
        en: What price does the stallholder ask first?
      options:
      - en: 100 dollars
      - en: 80 dollars
      - en: 50 dollars
      answer: 0
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 有冇細啲呀？
          tokens: [{surface: 有, lexeme: 有, readings: {jyutping: jau5}}, {surface: 冇, lexeme: 冇, readings: {jyutping: mou5}}, {surface: 細, lexeme: 細, readings: {jyutping: sai3}}, {surface: 啲, lexeme: 啲, readings: {jyutping: di1}}, {surface: 呀, lexeme: 呀, readings: {jyutping: aa3}}]
        yue-Latn/jyutping:
          text: jau5 mou5 sai3 di1 aa3?
          tokens: [{surface: jau5, lexeme: 有, readings: {characters: 有}}, {surface: mou5, lexeme: 冇, readings: {characters: 冇}}, {surface: sai3, lexeme: 細, readings: {characters: 細}}, {surface: di1, lexeme: 啲, readings: {characters: 啲}}, {surface: aa3, lexeme: 呀, readings: {characters: 呀}}]
      translations:
        en: Do you have a smaller one?
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 有。你鍾意咩顏色呀？
          tokens: [{surface: 有, lexeme: 有, readings: {jyutping: jau5}}, {surface: 你, lexeme: 你, readings: {jyutping: nei5}}, {surface: 鍾意, lexeme: 鍾意, readings: {jyutping: zung1 ji3}}, {surface: 咩, lexeme: 咩, readings: {jyutping: me1}}, {surface: 顏色, lexeme: 顏色, readings: {jyutping: ngaan4 sik1}}, {surface: 呀, lexeme: 呀, readings: {jyutping: aa3}}]
        yue-Latn/jyutping:
          text: jau5. nei5 zung1 ji3 me1 ngaan4 sik1 aa3?
          tokens: [{surface: jau5, lexeme: 有, readings: {characters: 有}}, {surface: nei5, lexeme: 你, readings: {characters: 你}}, {surface: zung1 ji3, lexeme: 鍾意, readings: {characters: 鍾意}}, {surface: me1, lexeme: 咩, readings: {characters: 咩}}, {surface: ngaan4 sik1, lexeme: 顏色, readings: {characters: 顏色}}, {surface: aa3, lexeme: 呀, readings: {characters: 呀}}]
      translations:
        en: Yes. What colour do you like?
  - line:
      speaker: mei-ling
      ask: complete
      gap: lexeme:紅色
      distractors:
      - lexeme:牛肉
      - lexeme:現金
      forms:
        yue-Hant-HK/standard:
          text: 我要紅色嘅。
          tokens: [{surface: 我, lexeme: 我, readings: {jyutping: ngo5}}, {surface: 要, lexeme: 要, readings: {jyutping: jiu3}}, {surface: 紅色, lexeme: 紅色, readings: {jyutping: hung4 sik1}}, {surface: 嘅, lexeme: 嘅, readings: {jyutping: ge3}}]
        yue-Latn/jyutping:
          text: ngo5 jiu3 hung4 sik1 ge3.
          tokens: [{surface: ngo5, lexeme: 我, readings: {characters: 我}}, {surface: jiu3, lexeme: 要, readings: {characters: 要}}, {surface: hung4 sik1, lexeme: 紅色, readings: {characters: 紅色}}, {surface: ge3, lexeme: 嘅, readings: {characters: 嘅}}]
      translations:
        en: I'll take the red one.
  - line:
      speaker: mei-ling
      forms:
        yue-Hant-HK/standard:
          text: 收唔收八達通呀？
          tokens: [{surface: 收, lexeme: 收, readings: {jyutping: sau1}}, {surface: 唔, lexeme: 唔, readings: {jyutping: m4}}, {surface: 收, lexeme: 收, readings: {jyutping: sau1}}, {surface: 八達通, lexeme: 八達通, readings: {jyutping: baat3 daat6 tung1}}, {surface: 呀, lexeme: 呀, readings: {jyutping: aa3}}]
        yue-Latn/jyutping:
          text: sau1 m4 sau1 baat3 daat6 tung1 aa3?
          tokens: [{surface: sau1, lexeme: 收, readings: {characters: 收}}, {surface: m4, lexeme: 唔, readings: {characters: 唔}}, {surface: sau1, lexeme: 收, readings: {characters: 收}}, {surface: baat3 daat6 tung1, lexeme: 八達通, readings: {characters: 八達通}}, {surface: aa3, lexeme: 呀, readings: {characters: 呀}}]
      translations:
        en: Do you take Octopus?
  - line:
      speaker: si-tau
      forms:
        yue-Hant-HK/standard:
          text: 唔收，要現金。
          tokens: [{surface: 唔, lexeme: 唔, readings: {jyutping: m4}}, {surface: 收, lexeme: 收, readings: {jyutping: sau1}}, {surface: 要, lexeme: 要, readings: {jyutping: jiu3}}, {surface: 現金, lexeme: 現金, readings: {jyutping: jin6 gam1}}]
