  - line:
      speaker: mei-ling
      ask: arrange
      forms:
        yue-Hant-HK/standard:
          text: 好，俾八十蚊你。
          tokens: [{surface: 好, lexeme: 好, readings: {jyutping: hou2}}, {surface: 俾, lexeme: 俾, readings: {jyutping: bei2}}, {surface: 八十, lexemes: [{lexeme: 八, surface: 八}, {lexeme: 十, surface: 十}], readings: {jyutping: baat3 sap6}}, {surface: 蚊, lexeme: 蚊, readings: {jyutping: man1}}, {surface: 你, lexeme: 你, readings: {jyutping: nei5}}]
