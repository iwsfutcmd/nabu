          text: Қаҳва ичасизми?
          tokens: [{surface: Қаҳва, lexeme: qahva}, {surface: ичасизми, lexemes: [{lexeme: ichmoq, surface: ич, base: true}, {lexeme: pres, surface: а}, {lexeme: cop-2, surface: сиз}, {lexeme: q, surface: ми}]}]
      translations:
        en: Will you have some coffee?
  - line:
      speaker: aziz
      ask: complete
      gap: lexeme:qahva
      distractors:
      - lexeme:non
      - lexeme:gosht
      forms:
        uz-Latn/standard:
          text: Yoʻq, rahmat. Men qahva ichmayman.
          tokens: [{surface: Yoʻq, lexeme: yoq}, {surface: rahmat, lexeme: rahmat}, {surface: Men, lexeme: men}, {surface: qahva, lexeme: qahva}, {surface: ichmayman, lexemes: [{lexeme: ichmoq, surface: ich, base: true}, {lexeme: neg, surface: ma}, {lexeme: pres, surface: y}, {lexeme: cop-1sg, surface: man}]}]
        uz-Cyrl/standard:
          text: Йўқ, раҳмат. Мен қаҳва ичмайман.
          tokens: [{surface: Йўқ, lexeme: yoq}, {surface: раҳмат, lexeme: rahmat}, {surface: Мен, lexeme: men}, {surface: қаҳва, lexeme: qahva}, {surface: ичмайман, lexemes: [{lexeme: ichmoq, surface: ич, base: true}, {lexeme: neg, surface: ма}, {lexeme: pres, surface: й}, {lexeme: cop-1sg, surface: ман}]}]
      translations:
        en: No, thank you. I don't drink coffee.
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Mana issiq choy.
          tokens: [{surface: Mana, lexeme: mana}, {surface: issiq, lexeme: issiq}, {surface: choy, lexeme: choy}]
        uz-Cyrl/standard:
          text: Мана иссиқ чой.
          tokens: [{surface: Мана, lexeme: mana}, {surface: иссиқ, lexeme: issiq}, {surface: чой, lexeme: choy}]
      translations:
        en: Here is some hot tea.
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Yana osh yeng!
          tokens: [{surface: Yana, lexeme: yana}, {surface: osh, lexeme: osh}, {surface: yeng, lexemes: [{lexeme: yemoq, surface: ye, base: true}, {lexeme: imp, surface: ng}]}]
        uz-Cyrl/standard:
          text: Яна ош енг!
          tokens: [{surface: Яна, lexeme: yana}, {surface: ош, lexeme: osh}, {surface: енг, lexemes: [{lexeme: yemoq, surface: е, base: true}, {lexeme: imp, surface: нг}]}]
      translations:
        en: Have some more plov!
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat, buvi! Juda mazali!
          tokens: [{surface: Rahmat, lexeme: rahmat}, {surface: buvi, lexeme: buvi}, {surface: Juda, lexeme: juda}, {surface: mazali, lexeme: mazali}]
        uz-Cyrl/standard:
