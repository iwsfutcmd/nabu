  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat, buvi!
          tokens: [{surface: Rahmat, lexeme: rahmat}, {surface: buvi, lexeme: buvi}]
        uz-Cyrl/standard:
          text: Раҳмат, буви!
          tokens: [{surface: Раҳмат, lexeme: rahmat}, {surface: буви, lexeme: buvi}]
      translations:
        en: Thank you, Grandma!
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Aziz, non oling, osh yeng.
          tokens: [{surface: Aziz, lexeme: aziz}, {surface: non, lexeme: non}, {surface: oling, lexemes: [{lexeme: olmoq, surface: ol, base: true}, {lexeme: imp, surface: ing}]}, {surface: osh, lexeme: osh}, {surface: yeng, lexemes: [{lexeme: yemoq, surface: ye, base: true}, {lexeme: imp, surface: ng}]}]
        uz-Cyrl/standard:
