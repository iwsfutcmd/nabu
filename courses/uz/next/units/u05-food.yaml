          tokens: [{surface: Азиз, lexeme: aziz}, {surface: нон, lexeme: non}, {surface: олинг, lexemes: [{lexeme: olmoq, surface: ол, base: true}, {lexeme: imp, surface: инг}]}, {surface: ош, lexeme: osh}, {surface: енг, lexemes: [{lexeme: yemoq, surface: е, base: true}, {lexeme: imp, surface: нг}]}]
      translations:
        en: Aziz, take some bread, have some plov.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Osh juda mazali!
          tokens: [{surface: Osh, lexeme: osh}, {surface: juda, lexeme: juda}, {surface: mazali, lexeme: mazali}]
        uz-Cyrl/standard:
          text: Ош жуда мазали!
          tokens: [{surface: Ош, lexeme: osh}, {surface: жуда, lexeme: juda}, {surface: мазали, lexeme: mazali}]
      translations:
        en: The plov is delicious!
  - line:
      speaker: malika
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Buvim oshni juda yaxshi pishiradi.
          tokens: [{surface: Buvim, lexemes: [{lexeme: buvi, surface: Buvi, base: true}, {lexeme: poss-1sg, surface: m}]}, {surface: oshni, lexemes: [{lexeme: osh, surface: osh, base: true}, {lexeme: acc, surface: ni}]}, {surface: juda, lexeme: juda}, {surface: yaxshi, lexeme: yaxshi}, {surface: pishiradi, lexemes: [{lexeme: pishirmoq, surface: pishir, base: true}, {lexeme: pres, surface: a}, {lexeme: pres-3sg, surface: di}]}]
        uz-Cyrl/standard:
          text: Бувим ошни жуда яхши пиширади.
          tokens: [{surface: Бувим, lexemes: [{lexeme: buvi, surface: Буви, base: true}, {lexeme: poss-1sg, surface: м}]}, {surface: ошни, lexemes: [{lexeme: osh, surface: ош, base: true}, {lexeme: acc, surface: ни}]}, {surface: жуда, lexeme: juda}, {surface: яхши, lexeme: yaxshi}, {surface: пиширади, lexemes: [{lexeme: pishirmoq, surface: пишир, base: true}, {lexeme: pres, surface: а}, {lexeme: pres-3sg, surface: ди}]}]
      translations:
        en: My grandmother cooks plov very well.
  - choose:
      prompt:
        en: Who cooked the plov?
      options:
      - en: Grandma
      - en: Aziz
      - en: Malika
      answer: 0
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Qahva ichasizmi?
          tokens: [{surface: Qahva, lexeme: qahva}, {surface: ichasizmi, lexemes: [{lexeme: ichmoq, surface: ich, base: true}, {lexeme: pres, surface: a}, {lexeme: cop-2, surface: siz}, {lexeme: q, surface: mi}]}]
