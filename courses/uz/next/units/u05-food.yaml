      uz-Cyrl/standard: Азиз
  - id: malika
    name:
      uz-Latn/standard: Malika
      uz-Cyrl/standard: Малика
  steps:
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Osh tayyor! Marhamat!
          tokens: [{surface: Osh, lexeme: osh}, {surface: tayyor, lexeme: tayyor}, {surface: Marhamat, lexeme: marhamat}]
