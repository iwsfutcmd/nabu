  title:
    en: At the teahouse
  setting:
    en: 'A choyxona (teahouse) in Samarkand at lunchtime: low tables, pots of green tea and a big pot of plov.'
  character:
    en: 'The choyxona''s owner: hospitable and a little teasing, who wants every guest to eat and drink a lot.'
