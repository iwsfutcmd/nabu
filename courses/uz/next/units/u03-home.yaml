          tokens: [{surface: Stol, lexeme: stol}, {surface: ustidami, lexemes: [{lexeme: ust, surface: ust, base: true}, {lexeme: poss-3, surface: i}, {lexeme: loc, surface: da}, {lexeme: q, surface: mi}]}]
