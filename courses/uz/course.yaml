# Fixture course (uz): Uzbek, Latin script first with every sentence also pinned in Cyrillic, and a Latin→Cyrillic script-convert node.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: uz
target: uz-Latn-UZ
orthographies: [uz-Latn/standard, uz-Cyrl/standard]
support: [en-Latn/standard]
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@887599f213ef', status: draft}
units: [units/intro.yaml]
# Audio (§10.1): one recording per sentence, read from the Latin forms; the Cyrillic orthography shares it.
audio:
  voices:
  - {id: narrator, provider: espeak-ng, voice: uz, orthography: uz-Latn/standard, reading: text, license: CC0-1.0}
