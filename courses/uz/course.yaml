# Fixture course (uz): Uzbek, Latin script first with every sentence also pinned in Cyrillic, and a Latin→Cyrillic script-convert node.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: uz
target: uz-Latn-UZ
orthographies: [uz-Latn/standard, uz-Cyrl/standard]
support: [en-Latn/standard]
# What the app calls the course and its orthographies, by language (ADR 0109).
names:
  en:
    course: Uzbek
    orthographies:
      uz-Latn/standard: Latin
      uz-Cyrl/standard: Cyrillic
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@887599f213ef', status: draft}
units: [units/intro.yaml, units/u02-family.yaml, units/u03-home.yaml, units/u04-numbers.yaml, units/u05-food.yaml, units/u06-city.yaml, units/u07-day.yaml, units/u08-bazaar.yaml, units/u09-past.yaml, units/u10-travel.yaml]
# Audio (§10.1): one recording per sentence, read from the Latin forms; the Cyrillic orthography shares it.
# Navoiy (ADR 0059): a CosyVoice2 fine-tune for Uzbek, every clip cloning one cast reference
# (audio/voices/toshkent-f.wav, `nabu audio cast`). Word timings by `nabu audio align`.
audio:
  voices:
  - {id: toshkent, provider: navoiy, voice: toshkent-f, model: 'aisha-org/navoiy-tts@9445f41ee5f38bd3a34eb16b0279dc05f9997fc2',
    language: uz, orthography: uz-Latn/standard, reading: text, finalStop: true, license: Apache-2.0}
