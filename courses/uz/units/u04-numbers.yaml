stories:
- id: uz.story.numbers
  node: uz.numbers.story
  title: {en: Grandmother's questions}
  provenance: {author: 'llm:claude@887599f213ef', status: draft}
  characters:
  - {id: buvi, speaker: f, name: {uz-Latn/standard: Buvi, uz-Cyrl/standard: Буви}}
  - {id: aziz, name: {uz-Latn/standard: Aziz, uz-Cyrl/standard: Азиз}}
  - {id: malika, name: {uz-Latn/standard: Malika, uz-Cyrl/standard: Малика}}
  steps:
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Salom, bolam! Ismingiz nima?
          tokens: [{surface: Salom, sense: salom}, {surface: bolam, sense: bola, morphs: [{surface: bola, kc: 'sense:bola'}, {surface: m, kc: 'form:poss-1sg-im'}]}, {surface: Ismingiz, sense: ism, morphs: [{surface: Ism, kc: 'sense:ism'}, {surface: ingiz, kc: 'form:poss-2-ingiz'}]}, {surface: nima, sense: nima}]
        uz-Cyrl/standard:
          text: Салом, болам! Исмингиз нима?
          tokens: [{surface: Салом, sense: salom}, {surface: болам, sense: bola, morphs: [{surface: бола, kc: 'sense:bola'}, {surface: м, kc: 'form:poss-1sg-im'}]}, {surface: Исмингиз, sense: ism, morphs: [{surface: Исм, kc: 'sense:ism'}, {surface: ингиз, kc: 'form:poss-2-ingiz'}]}, {surface: нима, sense: nima}]
      translations: {en: 'Hello, my child! What is your name?'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Ismim Aziz.
          tokens: [{surface: Ismim, sense: ism, morphs: [{surface: Ism, kc: 'sense:ism'}, {surface: im, kc: 'form:poss-1sg-im'}]}, {surface: Aziz, sense: aziz}]
        uz-Cyrl/standard:
          text: Исмим Азиз.
          tokens: [{surface: Исмим, sense: ism, morphs: [{surface: Исм, kc: 'sense:ism'}, {surface: им, kc: 'form:poss-1sg-im'}]}, {surface: Азиз, sense: aziz}]
      translations: {en: My name is Aziz.}
  - line:
      speaker: buvi
      ask: complete
      gap: sense:necha
      distractors: ['sense:kim', 'sense:nima']
      forms:
        uz-Latn/standard:
          text: Necha yoshdasiz?
          tokens: [{surface: Necha, sense: necha}, {surface: yoshdasiz, sense: yosh, morphs: [{surface: yosh, kc: 'sense:yosh'}, {surface: da, kc: 'form:loc-da'}, {surface: siz, kc: 'form:cop-2-siz'}]}]
        uz-Cyrl/standard:
          text: Неча ёшдасиз?
          tokens: [{surface: Неча, sense: necha}, {surface: ёшдасиз, sense: yosh, morphs: [{surface: ёш, kc: 'sense:yosh'}, {surface: да, kc: 'form:loc-da'}, {surface: сиз, kc: 'form:cop-2-siz'}]}]
      translations: {en: 'How old are you?'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Yigirma yoshdaman. Sizchi?
          tokens: [{surface: Yigirma, sense: yigirma}, {surface: yoshdaman, sense: yosh, morphs: [{surface: yosh, kc: 'sense:yosh'}, {surface: da, kc: 'form:loc-da'}, {surface: man, kc: 'form:cop-1sg-man'}]}, {surface: Sizchi, sense: siz, morphs: [{surface: Siz, kc: 'sense:siz'}, {surface: chi, kc: 'form:part-chi'}]}]
