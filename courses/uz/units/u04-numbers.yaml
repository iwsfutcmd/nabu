stories:
- id: uz.story.numbers
  node: uz.numbers.story
  title:
    en: Grandmother's questions
  provenance:
    author: llm:claude@887599f213ef
    status: draft
  characters:
  - id: buvi
    speaker: f
    name:
      uz-Latn/standard: Buvi
      uz-Cyrl/standard: Буви
  - id: aziz
    name:
      uz-Latn/standard: Aziz
      uz-Cyrl/standard: Азиз
  - id: malika
    name:
      uz-Latn/standard: Malika
      uz-Cyrl/standard: Малика
  steps:
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Salom, bolam! Ismingiz nima?
          tokens: [{surface: Salom, lexeme: salom}, {surface: bolam, lexemes: [{lexeme: bola, surface: bola, base: true}, {lexeme: poss-1sg, surface: m}, {lexeme: nom}]}, {surface: Ismingiz, lexemes: [{lexeme: ism, surface: Ism, base: true}, {lexeme: poss-2, surface: ingiz}, {lexeme: nom}]}, {surface: nima, lexemes: [{lexeme: nima, base: true}, {lexeme: nom}]}]
        uz-Cyrl/standard:
          text: Салом, болам! Исмингиз нима?
          tokens: [{surface: Салом, lexeme: salom}, {surface: болам, lexemes: [{lexeme: bola, surface: бола, base: true}, {lexeme: poss-1sg, surface: м}, {lexeme: nom}]}, {surface: Исмингиз, lexemes: [{lexeme: ism, surface: Исм, base: true}, {lexeme: poss-2, surface: ингиз}, {lexeme: nom}]}, {surface: нима, lexemes: [{lexeme: nima, base: true}, {lexeme: nom}]}]
      translations:
        en: Hello, my child! What is your name?
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Ismim Aziz.
          tokens: [{surface: Ismim, lexemes: [{lexeme: ism, surface: Ism, base: true}, {lexeme: poss-1sg, surface: im}, {lexeme: nom}]}, {surface: Aziz, lexemes: [{lexeme: aziz, base: true}, {lexeme: nom}]}]
        uz-Cyrl/standard:
          text: Исмим Азиз.
          tokens: [{surface: Исмим, lexemes: [{lexeme: ism, surface: Исм, base: true}, {lexeme: poss-1sg, surface: им}, {lexeme: nom}]}, {surface: Азиз, lexemes: [{lexeme: aziz, base: true}, {lexeme: nom}]}]
      translations:
        en: My name is Aziz.
  - line:
      speaker: buvi
      ask: complete
      gap: lexeme:yosh
      asks: form
      forms:
        uz-Latn/standard:
          text: Necha yoshdasiz?
          tokens: [{surface: Necha, lexeme: necha}, {surface: yoshdasiz, lexemes: [{lexeme: yosh, surface: yosh, base: true}, {lexeme: loc, surface: da}, {lexeme: cop-2, surface: siz}]}]
        uz-Cyrl/standard:
          text: Неча ёшдасиз?
          tokens: [{surface: Неча, lexeme: necha}, {surface: ёшдасиз, lexemes: [{lexeme: yosh, surface: ёш, base: true}, {lexeme: loc, surface: да}, {lexeme: cop-2, surface: сиз}]}]
      translations:
        en: How old are you?
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Yigirma yoshdaman. Sizchi?
          tokens: [{surface: Yigirma, lexeme: yigirma}, {surface: yoshdaman, lexemes: [{lexeme: yosh, surface: yosh, base: true}, {lexeme: loc, surface: da}, {lexeme: cop-1sg, surface: man}]}, {surface: Sizchi, lexemes: [{lexeme: siz, surface: Siz, base: true}, {lexeme: nom}, {lexeme: chi, surface: chi}]}]
        uz-Cyrl/standard:
          text: Йигирма ёшдаман. Сизчи?
          tokens: [{surface: Йигирма, lexeme: yigirma}, {surface: ёшдаман, lexemes: [{lexeme: yosh, surface: ёш, base: true}, {lexeme: loc, surface: да}, {lexeme: cop-1sg, surface: ман}]}, {surface: Сизчи, lexemes: [{lexeme: siz, surface: Сиз, base: true}, {lexeme: nom}, {lexeme: chi, surface: чи}]}]
      translations:
        en: I'm twenty. And you?
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Men yetmish yoshdaman!
          tokens: [{surface: Men, lexemes: [{lexeme: men, base: true}, {lexeme: nom}]}, {surface: yetmish, lexeme: yetmish}, {surface: yoshdaman, lexemes: [{lexeme: yosh, surface: yosh, base: true}, {lexeme: loc, surface: da}, {lexeme: cop-1sg, surface: man}]}]
        uz-Cyrl/standard:
          text: Мен етмиш ёшдаман!
          tokens: [{surface: Мен, lexemes: [{lexeme: men, base: true}, {lexeme: nom}]}, {surface: етмиш, lexeme: yetmish}, {surface: ёшдаман, lexemes: [{lexeme: yosh, surface: ёш, base: true}, {lexeme: loc, surface: да}, {lexeme: cop-1sg, surface: ман}]}]
      translations:
        en: I'm seventy!
  - choose:
      prompt:
        en: How old is Aziz?
      options:
      - en: twenty
      - en: seventy
      - en: ten
      answer: 0
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Nechta akangiz bor?
          tokens: [{surface: Nechta, lexemes: [{lexeme: necha, surface: Nech, base: true}, {lexeme: count, surface: ta}]}, {surface: akangiz, lexemes: [{lexeme: aka, surface: aka, base: true}, {lexeme: poss-2, surface: ngiz}, {lexeme: nom}]}, {surface: bor, lexeme: bor}]
        uz-Cyrl/standard:
          text: Нечта акангиз бор?
          tokens: [{surface: Нечта, lexemes: [{lexeme: necha, surface: Неч, base: true}, {lexeme: count, surface: та}]}, {surface: акангиз, lexemes: [{lexeme: aka, surface: ака, base: true}, {lexeme: poss-2, surface: нгиз}, {lexeme: nom}]}, {surface: бор, lexeme: bor}]
      translations:
        en: How many older brothers do you have?
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Mening ikki akam bor. Ukam yoʻq.
          tokens: [{surface: Mening, lexemes: [{lexeme: men, surface: Men, base: true}, {lexeme: gen, surface: ing}]}, {surface: ikki, lexeme: ikki}, {surface: akam, lexemes: [{lexeme: aka, surface: aka, base: true}, {lexeme: poss-1sg, surface: m}, {lexeme: nom}]}, {surface: bor, lexeme: bor}, {surface: Ukam, lexemes: [{lexeme: uka, surface: Uka, base: true}, {lexeme: poss-1sg, surface: m}, {lexeme: nom}]}, {surface: yoʻq, lexeme: yoq}]
        uz-Cyrl/standard:
          text: Менинг икки акам бор. Укам йўқ.
          tokens: [{surface: Менинг, lexemes: [{lexeme: men, surface: Мен, base: true}, {lexeme: gen, surface: инг}]}, {surface: икки, lexeme: ikki}, {surface: акам, lexemes: [{lexeme: aka, surface: ака, base: true}, {lexeme: poss-1sg, surface: м}, {lexeme: nom}]}, {surface: бор, lexeme: bor}, {surface: Укам, lexemes: [{lexeme: uka, surface: Ука, base: true}, {lexeme: poss-1sg, surface: м}, {lexeme: nom}]}, {surface: йўқ, lexeme: yoq}]
      translations:
        en: I have two older brothers. I don't have a younger brother.
  - line:
      speaker: malika
      forms:
