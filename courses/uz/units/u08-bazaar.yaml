stories:
- id: uz.story.bazaar
  node: uz.bazaar.story
  title:
    en: Grapes at the bazaar
  provenance:
    author: llm:claude@887599f213ef
    status: draft
  characters:
  - id: sotuvchi
    name:
      uz-Latn/standard: Sotuvchi
      uz-Cyrl/standard: Сотувчи
  - id: aziz
    name:
      uz-Latn/standard: Aziz
      uz-Cyrl/standard: Азиз
  steps:
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Marhamat! Nima xohlaysiz?
          tokens: [{surface: Marhamat, lexeme: marhamat}, {surface: Nima, lexemes: [{lexeme: nima, base: true}, {lexeme: nom}]}, {surface: xohlaysiz, lexemes: [{lexeme: xohlamoq, surface: xohla, base: true}, {lexeme: pres, surface: y}, {lexeme: cop-2, surface: siz}]}]
        uz-Cyrl/standard:
          text: Марҳамат! Нима хоҳлайсиз?
          tokens: [{surface: Марҳамат, lexeme: marhamat}, {surface: Нима, lexemes: [{lexeme: nima, base: true}, {lexeme: nom}]}, {surface: хоҳлайсиз, lexemes: [{lexeme: xohlamoq, surface: хоҳла, base: true}, {lexeme: pres, surface: й}, {lexeme: cop-2, surface: сиз}]}]
      translations:
        en: Welcome! What would you like?
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Uzum bormi?
          tokens: [{surface: Uzum, lexemes: [{lexeme: uzum, base: true}, {lexeme: nom}]}, {surface: bormi, lexemes: [{lexeme: bor, surface: bor, base: true}, {lexeme: q, surface: mi}]}]
        uz-Cyrl/standard:
          text: Узум борми?
          tokens: [{surface: Узум, lexemes: [{lexeme: uzum, base: true}, {lexeme: nom}]}, {surface: борми, lexemes: [{lexeme: bor, surface: бор, base: true}, {lexeme: q, surface: ми}]}]
      translations:
        en: Do you have grapes?
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Ha, mana uzum. Juda shirin!
          tokens: [{surface: Ha, lexeme: ha}, {surface: mana, lexeme: mana}, {surface: uzum, lexemes: [{lexeme: uzum, base: true}, {lexeme: nom}]}, {surface: Juda, lexeme: juda}, {surface: shirin, lexeme: shirin}]
        uz-Cyrl/standard:
          text: Ҳа, мана узум. Жуда ширин!
          tokens: [{surface: Ҳа, lexeme: ha}, {surface: мана, lexeme: mana}, {surface: узум, lexemes: [{lexeme: uzum, base: true}, {lexeme: nom}]}, {surface: Жуда, lexeme: juda}, {surface: ширин, lexeme: shirin}]
      translations:
        en: Yes, here are the grapes. Very sweet!
  - line:
      speaker: aziz
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Uzumning kilosi necha pul?
          tokens: [{surface: Uzumning, lexemes: [{lexeme: uzum, surface: Uzum, base: true}, {lexeme: gen, surface: ning}]}, {surface: kilosi, lexemes: [{lexeme: kilo, surface: kilo, base: true}, {lexeme: poss-3, surface: si}, {lexeme: nom}]}, {surface: necha, lexeme: necha}, {surface: pul, lexemes: [{lexeme: pul, base: true}, {lexeme: nom}]}]
        uz-Cyrl/standard:
          text: Узумнинг килоси неча пул?
          tokens: [{surface: Узумнинг, lexemes: [{lexeme: uzum, surface: Узум, base: true}, {lexeme: gen, surface: нинг}]}, {surface: килоси, lexemes: [{lexeme: kilo, surface: кило, base: true}, {lexeme: poss-3, surface: си}, {lexeme: nom}]}, {surface: неча, lexeme: necha}, {surface: пул, lexemes: [{lexeme: pul, base: true}, {lexeme: nom}]}]
      translations:
        en: How much is a kilo of grapes?
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Yigirma ming soʻm.
          tokens: [{surface: Yigirma, lexeme: yigirma}, {surface: ming, lexeme: ming}, {surface: soʻm, lexemes: [{lexeme: som, base: true}, {lexeme: nom}]}]
        uz-Cyrl/standard:
          text: Йигирма минг сўм.
          tokens: [{surface: Йигирма, lexeme: yigirma}, {surface: минг, lexeme: ming}, {surface: сўм, lexemes: [{lexeme: som, base: true}, {lexeme: nom}]}]
      translations:
        en: Twenty thousand soʻm.
  - line:
      speaker: aziz
      ask: complete
      gap: lexeme:qimmat
      distractors:
      - lexeme:arzon
      - lexeme:yaqin
      forms:
        uz-Latn/standard:
          text: Juda qimmat! Arzonroq qiling!
          tokens: [{surface: Juda, lexeme: juda}, {surface: qimmat, lexeme: qimmat}, {surface: Arzonroq, lexemes: [{lexeme: arzon, surface: Arzon, base: true}, {lexeme: comp, surface: roq}]}, {surface: qiling, lexemes: [{lexeme: qilmoq, surface: qil, base: true}, {lexeme: imp, surface: ing}]}]
        uz-Cyrl/standard:
          text: Жуда қиммат! Арзонроқ қилинг!
          tokens: [{surface: Жуда, lexeme: juda}, {surface: қиммат, lexeme: qimmat}, {surface: Арзонроқ, lexemes: [{lexeme: arzon, surface: Арзон, base: true}, {lexeme: comp, surface: роқ}]}, {surface: қилинг, lexemes: [{lexeme: qilmoq, surface: қил, base: true}, {lexeme: imp, surface: инг}]}]
      translations:
        en: That's too expensive! Make it cheaper!
  - choose:
      prompt:
        en: What does Aziz think of the price?
      options:
      - en: It's too expensive.
      - en: It's cheap.
      - en: It's fine.
      answer: 0
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Yaxshi. Oʻn besh ming soʻm.
          tokens: [{surface: Yaxshi, lexeme: yaxshi}, {surface: Oʻn, lexeme: 'on'}, {surface: besh, lexeme: besh}, {surface: ming, lexeme: ming}, {surface: soʻm, lexemes: [{lexeme: som, base: true}, {lexeme: nom}]}]
        uz-Cyrl/standard:
          text: Яхши. Ўн беш минг сўм.
          tokens: [{surface: Яхши, lexeme: yaxshi}, {surface: Ўн, lexeme: 'on'}, {surface: беш, lexeme: besh}, {surface: минг, lexeme: ming}, {surface: сўм, lexemes: [{lexeme: som, base: true}, {lexeme: nom}]}]
      translations:
        en: All right. Fifteen thousand soʻm.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat! Ikki kilo bering.
          tokens: [{surface: Rahmat, lexeme: rahmat}, {surface: Ikki, lexeme: ikki}, {surface: kilo, lexemes: [{lexeme: kilo, base: true}, {lexeme: nom}]}, {surface: bering, lexemes: [{lexeme: bermoq, surface: ber, base: true}, {lexeme: imp, surface: ing}]}]
        uz-Cyrl/standard:
          text: Раҳмат! Икки кило беринг.
          tokens: [{surface: Раҳмат, lexeme: rahmat}, {surface: Икки, lexeme: ikki}, {surface: кило, lexemes: [{lexeme: kilo, base: true}, {lexeme: nom}]}, {surface: беринг, lexemes: [{lexeme: bermoq, surface: бер, base: true}, {lexeme: imp, surface: инг}]}]
      translations:
        en: Thank you! Give me two kilos.
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Yana nima kerak? Qovun ham bor.
          tokens: [{surface: Yana, lexeme: yana}, {surface: nima, lexemes: [{lexeme: nima, base: true}, {lexeme: nom}]}, {surface: kerak, lexeme: kerak}, {surface: Qovun, lexemes: [{lexeme: qovun, base: true}, {lexeme: nom}]}, {surface: ham, lexeme: ham}, {surface: bor, lexeme: bor}]
        uz-Cyrl/standard:
          text: Яна нима керак? Қовун ҳам бор.
          tokens: [{surface: Яна, lexeme: yana}, {surface: нима, lexemes: [{lexeme: nima, base: true}, {lexeme: nom}]}, {surface: керак, lexeme: kerak}, {surface: Қовун, lexemes: [{lexeme: qovun, base: true}, {lexeme: nom}]}, {surface: ҳам, lexeme: ham}, {surface: бор, lexeme: bor}]
      translations:
        en: What else do you need? There's melon too.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Yoʻq, rahmat. Menga qovun yoqmaydi.
          tokens: [{surface: Yoʻq, lexeme: yoq}, {surface: rahmat, lexeme: rahmat}, {surface: Menga, lexemes: [{lexeme: men, surface: Men, base: true}, {lexeme: dat, surface: ga}]}, {surface: qovun, lexemes: [{lexeme: qovun, base: true}, {lexeme: nom}]}, {surface: yoqmaydi, lexemes: [{lexeme: yoqmoq, surface: yoq, base: true}, {lexeme: neg, surface: ma}, {lexeme: pres, surface: y}, {lexeme: pres-3sg, surface: di}]}]
        uz-Cyrl/standard:
          text: Йўқ, раҳмат. Менга қовун ёқмайди.
          tokens: [{surface: Йўқ, lexeme: yoq}, {surface: раҳмат, lexeme: rahmat}, {surface: Менга, lexemes: [{lexeme: men, surface: Мен, base: true}, {lexeme: dat, surface: га}]}, {surface: қовун, lexemes: [{lexeme: qovun, base: true}, {lexeme: nom}]}, {surface: ёқмайди, lexemes: [{lexeme: yoqmoq, surface: ёқ, base: true}, {lexeme: neg, surface: ма}, {lexeme: pres, surface: й}, {lexeme: pres-3sg, surface: ди}]}]
      translations:
        en: No, thank you. I don't like melon.
  - choose:
      prompt:
        en: How many kilos of grapes does Aziz buy?
      options:
      - en: two
