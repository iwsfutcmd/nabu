stories:
- id: uz.story.bazaar
  node: uz.bazaar.story
  title: {en: Grapes at the bazaar}
  provenance: {author: 'llm:claude@887599f213ef', status: draft}
  characters:
  - {id: sotuvchi, name: {uz-Latn/standard: Sotuvchi, uz-Cyrl/standard: Сотувчи}}
  - {id: aziz, name: {uz-Latn/standard: Aziz, uz-Cyrl/standard: Азиз}}
  steps:
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Marhamat! Nima xohlaysiz?
          tokens: [{surface: Marhamat, sense: marhamat}, {surface: Nima, sense: nima}, {surface: xohlaysiz, sense: xohlamoq, morphs: [{surface: xohla, kc: 'sense:xohlamoq'}, {surface: y, kc: 'form:pres-a'}, {surface: siz, kc: 'form:cop-2-siz'}]}]
        uz-Cyrl/standard:
          text: Марҳамат! Нима хоҳлайсиз?
          tokens: [{surface: Марҳамат, sense: marhamat}, {surface: Нима, sense: nima}, {surface: хоҳлайсиз, sense: xohlamoq, morphs: [{surface: хоҳла, kc: 'sense:xohlamoq'}, {surface: й, kc: 'form:pres-a'}, {surface: сиз, kc: 'form:cop-2-siz'}]}]
      translations: {en: 'Welcome! What would you like?'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Uzum bormi?
          tokens: [{surface: Uzum, sense: uzum}, {surface: bormi, sense: bor, morphs: [{surface: bor, kc: 'sense:bor'}, {surface: mi, kc: 'form:q-mi'}]}]
        uz-Cyrl/standard:
          text: Узум борми?
          tokens: [{surface: Узум, sense: uzum}, {surface: борми, sense: bor, morphs: [{surface: бор, kc: 'sense:bor'}, {surface: ми, kc: 'form:q-mi'}]}]
      translations: {en: 'Do you have grapes?'}
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Ha, mana uzum. Juda shirin!
          tokens: [{surface: Ha, sense: ha}, {surface: mana, sense: mana}, {surface: uzum, sense: uzum}, {surface: Juda, sense: juda}, {surface: shirin, sense: shirin}]
        uz-Cyrl/standard:
          text: Ҳа, мана узум. Жуда ширин!
          tokens: [{surface: Ҳа, sense: ha}, {surface: мана, sense: mana}, {surface: узум, sense: uzum}, {surface: Жуда, sense: juda}, {surface: ширин, sense: shirin}]
      translations: {en: 'Yes, here are the grapes. Very sweet!'}
  - line:
      speaker: aziz
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Uzumning kilosi necha pul?
          tokens: [{surface: Uzumning, sense: uzum, morphs: [{surface: Uzum, kc: 'sense:uzum'}, {surface: ning, kc: 'form:gen-ning'}]}, {surface: kilosi, sense: kilo, morphs: [{surface: kilo, kc: 'sense:kilo'}, {surface: si, kc: 'form:poss-3-si'}]}, {surface: necha, sense: necha}, {surface: pul, sense: pul}]
        uz-Cyrl/standard:
          text: Узумнинг килоси неча пул?
          tokens: [{surface: Узумнинг, sense: uzum, morphs: [{surface: Узум, kc: 'sense:uzum'}, {surface: нинг, kc: 'form:gen-ning'}]}, {surface: килоси, sense: kilo, morphs: [{surface: кило, kc: 'sense:kilo'}, {surface: си, kc: 'form:poss-3-si'}]}, {surface: неча, sense: necha}, {surface: пул, sense: pul}]
      translations: {en: 'How much is a kilo of grapes?'}
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Yigirma ming soʻm.
          tokens: [{surface: Yigirma, sense: yigirma}, {surface: ming, sense: ming}, {surface: soʻm, sense: som}]
        uz-Cyrl/standard:
          text: Йигирма минг сўм.
          tokens: [{surface: Йигирма, sense: yigirma}, {surface: минг, sense: ming}, {surface: сўм, sense: som}]
      translations: {en: Twenty thousand soʻm.}
  - line:
      speaker: aziz
      ask: complete
      gap: sense:qimmat
      distractors: ['sense:arzon', 'sense:shirin']
      forms:
        uz-Latn/standard:
          text: Juda qimmat! Arzonroq qiling!
          tokens: [{surface: Juda, sense: juda}, {surface: qimmat, sense: qimmat}, {surface: Arzonroq, sense: arzon, morphs: [{surface: Arzon, kc: 'sense:arzon'}, {surface: roq, kc: 'form:comp-roq'}]}, {surface: qiling, sense: qilmoq, morphs: [{surface: qil, kc: 'sense:qilmoq'}, {surface: ing, kc: 'form:imp-ing'}]}]
        uz-Cyrl/standard:
          text: Жуда қиммат! Арзонроқ қилинг!
          tokens: [{surface: Жуда, sense: juda}, {surface: қиммат, sense: qimmat}, {surface: Арзонроқ, sense: arzon, morphs: [{surface: Арзон, kc: 'sense:arzon'}, {surface: роқ, kc: 'form:comp-roq'}]}, {surface: қилинг, sense: qilmoq, morphs: [{surface: қил, kc: 'sense:qilmoq'}, {surface: инг, kc: 'form:imp-ing'}]}]
      translations: {en: That's too expensive! Make it cheaper!}
  - choose:
      prompt: {en: 'What does Aziz think of the price?'}
      options: [{en: It's too expensive.}, {en: It's cheap.}, {en: It's fine.}]
      answer: 0
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Yaxshi. Oʻn besh ming soʻm.
          tokens: [{surface: Yaxshi, sense: yaxshi}, {surface: Oʻn, sense: 'on'}, {surface: besh, sense: besh}, {surface: ming, sense: ming}, {surface: soʻm, sense: som}]
        uz-Cyrl/standard:
          text: Яхши. Ўн беш минг сўм.
          tokens: [{surface: Яхши, sense: yaxshi}, {surface: Ўн, sense: 'on'}, {surface: беш, sense: besh}, {surface: минг, sense: ming}, {surface: сўм, sense: som}]
      translations: {en: All right. Fifteen thousand soʻm.}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat! Ikki kilo bering.
          tokens: [{surface: Rahmat, sense: rahmat}, {surface: Ikki, sense: ikki}, {surface: kilo, sense: kilo}, {surface: bering, sense: bermoq, morphs: [{surface: ber, kc: 'sense:bermoq'}, {surface: ing, kc: 'form:imp-ing'}]}]
        uz-Cyrl/standard:
          text: Раҳмат! Икки кило беринг.
          tokens: [{surface: Раҳмат, sense: rahmat}, {surface: Икки, sense: ikki}, {surface: кило, sense: kilo}, {surface: беринг, sense: bermoq, morphs: [{surface: бер, kc: 'sense:bermoq'}, {surface: инг, kc: 'form:imp-ing'}]}]
      translations: {en: Thank you! Give me two kilos.}
  - line:
      speaker: sotuvchi
      forms:
        uz-Latn/standard:
          text: Yana nima kerak? Qovun ham bor.
          tokens: [{surface: Yana, sense: yana}, {surface: nima, sense: nima}, {surface: kerak, sense: kerak}, {surface: Qovun, sense: qovun}, {surface: ham, sense: ham}, {surface: bor, sense: bor}]
        uz-Cyrl/standard:
          text: Яна нима керак? Қовун ҳам бор.
          tokens: [{surface: Яна, sense: yana}, {surface: нима, sense: nima}, {surface: керак, sense: kerak}, {surface: Қовун, sense: qovun}, {surface: ҳам, sense: ham}, {surface: бор, sense: bor}]
      translations: {en: 'What else do you need? There''s melon too.'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Yoʻq, rahmat. Menga qovun yoqmaydi.
          tokens: [{surface: Yoʻq, sense: yoq}, {surface: rahmat, sense: rahmat}, {surface: Menga, sense: men, morphs: [{surface: Men, kc: 'sense:men'}, {surface: ga, kc: 'form:dat-ga'}]}, {surface: qovun, sense: qovun}, {surface: yoqmaydi, sense: yoqmoq, morphs: [{surface: yoq, kc: 'sense:yoqmoq'}, {surface: ma, kc: 'form:neg-ma'}, {surface: y, kc: 'form:pres-a'}, {surface: di, kc: 'form:pres-3sg-di'}]}]
        uz-Cyrl/standard:
          text: Йўқ, раҳмат. Менга қовун ёқмайди.
          tokens: [{surface: Йўқ, sense: yoq}, {surface: раҳмат, sense: rahmat}, {surface: Менга, sense: men, morphs: [{surface: Мен, kc: 'sense:men'}, {surface: га, kc: 'form:dat-ga'}]}, {surface: қовун, sense: qovun}, {surface: ёқмайди, sense: yoqmoq, morphs: [{surface: ёқ, kc: 'sense:yoqmoq'}, {surface: ма, kc: 'form:neg-ma'}, {surface: й, kc: 'form:pres-a'}, {surface: ди, kc: 'form:pres-3sg-di'}]}]
      translations: {en: 'No, thank you. I don''t like melon.'}
  - choose:
      prompt: {en: 'How many kilos of grapes does Aziz buy?'}
      options: [{en: two}, {en: one}, {en: fifteen}]
      answer: 0
scenarios:
- id: uz.bazaar-haggle
  after: uz.bazaar.pay
  title: {en: Haggling at Chorsu}
  setting: {en: 'Chorsu Bazaar in Tashkent on a busy Saturday morning, at a fruit and vegetable stall.'}
  character: {en: A cheerful stallholder who starts every price high and enjoys a good haggle.}
  goal: {en: 'Ask what things cost, say what you need for plov, bargain for a better price, and pay.'}
  provenance: {author: 'llm:claude@887599f213ef', status: draft}
