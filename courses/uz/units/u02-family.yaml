stories:
- id: uz.story.family
  node: uz.family.story
  title:
    en: Malika's family
  provenance:
    author: llm:claude@887599f213ef
    status: draft
  characters:
  - id: aziz
    name:
      uz-Latn/standard: Aziz
      uz-Cyrl/standard: Азиз
  - id: malika
    name:
      uz-Latn/standard: Malika
      uz-Cyrl/standard: Малика
  steps:
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Salom, Malika! Bu kim?
          tokens: [{surface: Salom, lexeme: salom}, {surface: Malika, lexeme: malika}, {surface: Bu, lexeme: bu}, {surface: kim, lexeme: kim}]
        uz-Cyrl/standard:
          text: Салом, Малика! Бу ким?
          tokens: [{surface: Салом, lexeme: salom}, {surface: Малика, lexeme: malika}, {surface: Бу, lexeme: bu}, {surface: ким, lexeme: kim}]
      translations:
        en: Hi, Malika! Who is this?
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Bu mening akam.
          tokens: [{surface: Bu, lexeme: bu}, {surface: mening, lexemes: [{lexeme: men, surface: men, base: true}, {lexeme: gen, surface: ing}]}, {surface: akam, lexemes: [{lexeme: aka, surface: aka, base: true}, {lexeme: poss-1sg, surface: m}]}]
        uz-Cyrl/standard:
          text: Бу менинг акам.
          tokens: [{surface: Бу, lexeme: bu}, {surface: менинг, lexemes: [{lexeme: men, surface: мен, base: true}, {lexeme: gen, surface: инг}]}, {surface: акам, lexemes: [{lexeme: aka, surface: ака, base: true}, {lexeme: poss-1sg, surface: м}]}]
      translations:
        en: This is my older brother.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Uning ismi nima?
          tokens: [{surface: Uning, lexemes: [{lexeme: u, surface: U, base: true}, {lexeme: gen, surface: ning}]}, {surface: ismi, lexemes: [{lexeme: ism, surface: ism, base: true}, {lexeme: poss-3, surface: i}]}, {surface: nima, lexeme: nima}]
        uz-Cyrl/standard:
          text: Унинг исми нима?
          tokens: [{surface: Унинг, lexemes: [{lexeme: u, surface: У, base: true}, {lexeme: gen, surface: нинг}]}, {surface: исми, lexemes: [{lexeme: ism, surface: исм, base: true}, {lexeme: poss-3, surface: и}]}, {surface: нима, lexeme: nima}]
      translations:
        en: What is his name?
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Uning ismi Bobur. U talaba.
          tokens: [{surface: Uning, lexemes: [{lexeme: u, surface: U, base: true}, {lexeme: gen, surface: ning}]}, {surface: ismi, lexemes: [{lexeme: ism, surface: ism, base: true}, {lexeme: poss-3, surface: i}]}, {surface: Bobur, lexeme: bobur}, {surface: U, lexeme: u}, {surface: talaba, lexeme: talaba}]
        uz-Cyrl/standard:
          text: Унинг исми Бобур. У талаба.
          tokens: [{surface: Унинг, lexemes: [{lexeme: u, surface: У, base: true}, {lexeme: gen, surface: нинг}]}, {surface: исми, lexemes: [{lexeme: ism, surface: исм, base: true}, {lexeme: poss-3, surface: и}]}, {surface: Бобур, lexeme: bobur}, {surface: У, lexeme: u}, {surface: талаба, lexeme: talaba}]
      translations:
        en: His name is Bobur. He is a student.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Opangiz bormi?
          tokens: [{surface: Opangiz, lexemes: [{lexeme: opa, surface: Opa, base: true}, {lexeme: poss-2, surface: ngiz}]}, {surface: bormi, lexemes: [{lexeme: bor, surface: bor, base: true}, {lexeme: q, surface: mi}]}]
        uz-Cyrl/standard:
          text: Опангиз борми?
          tokens: [{surface: Опангиз, lexemes: [{lexeme: opa, surface: Опа, base: true}, {lexeme: poss-2, surface: нгиз}]}, {surface: борми, lexemes: [{lexeme: bor, surface: бор, base: true}, {lexeme: q, surface: ми}]}]
      translations:
        en: Do you have an older sister?
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Yoʻq. Singlim bor.
          tokens: [{surface: Yoʻq, lexeme: yoq}, {surface: Singlim, lexemes: [{lexeme: singil, surface: Singl, base: true}, {lexeme: poss-1sg, surface: im}]}, {surface: bor, lexeme: bor}]
        uz-Cyrl/standard:
          text: Йўқ. Синглим бор.
          tokens: [{surface: Йўқ, lexeme: yoq}, {surface: Синглим, lexemes: [{lexeme: singil, surface: Сингл, base: true}, {lexeme: poss-1sg, surface: им}]}, {surface: бор, lexeme: bor}]
      translations:
        en: No. I have a younger sister.
  - choose:
      prompt:
        en: Does Malika have an older sister?
      options:
      - en: No, she has a younger sister.
      - en: Yes, she has two.
      - en: Yes, her name is Bobur.
      answer: 0
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Bu bizning oilamiz.
          tokens: [{surface: Bu, lexeme: bu}, {surface: bizning, lexemes: [{lexeme: biz, surface: biz, base: true}, {lexeme: gen, surface: ning}]}, {surface: oilamiz, lexemes: [{lexeme: oila, surface: oila, base: true}, {lexeme: poss-1pl, surface: miz}]}]
        uz-Cyrl/standard:
          text: Бу бизнинг оиламиз.
          tokens: [{surface: Бу, lexeme: bu}, {surface: бизнинг, lexemes: [{lexeme: biz, surface: биз, base: true}, {lexeme: gen, surface: нинг}]}, {surface: оиламиз, lexemes: [{lexeme: oila, surface: оила, base: true}, {lexeme: poss-1pl, surface: миз}]}]
      translations:
        en: This is our family.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Oilangiz katta!
          tokens: [{surface: Oilangiz, lexemes: [{lexeme: oila, surface: Oila, base: true}, {lexeme: poss-2, surface: ngiz}]}, {surface: katta, lexeme: katta}]
        uz-Cyrl/standard:
          text: Оилангиз катта!
          tokens: [{surface: Оилангиз, lexemes: [{lexeme: oila, surface: Оила, base: true}, {lexeme: poss-2, surface: нгиз}]}, {surface: катта, lexeme: katta}]
      translations:
        en: Your family is big!
  - line:
      speaker: malika
      ask: complete
      gap: lexeme:katta
      distractors:
      - lexeme:kichik
      forms:
        uz-Latn/standard:
          text: Ha, oilamiz katta. Sizchi?
          tokens: [{surface: Ha, lexeme: ha}, {surface: oilamiz, lexemes: [{lexeme: oila, surface: oila, base: true}, {lexeme: poss-1pl, surface: miz}]}, {surface: katta, lexeme: katta}, {surface: Sizchi, lexemes: [{lexeme: siz, surface: Siz, base: true}, {lexeme: chi, surface: chi}]}]
        uz-Cyrl/standard:
          text: Ҳа, оиламиз катта. Сизчи?
          tokens: [{surface: Ҳа, lexeme: ha}, {surface: оиламиз, lexemes: [{lexeme: oila, surface: оила, base: true}, {lexeme: poss-1pl, surface: миз}]}, {surface: катта, lexeme: katta}, {surface: Сизчи, lexemes: [{lexeme: siz, surface: Сиз, base: true}, {lexeme: chi, surface: чи}]}]
      translations:
        en: Yes, our family is big. And you?
  - line:
      speaker: aziz
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Mening oilam kichik.
          tokens: [{surface: Mening, lexemes: [{lexeme: men, surface: Men, base: true}, {lexeme: gen, surface: ing}]}, {surface: oilam, lexemes: [{lexeme: oila, surface: oila, base: true}, {lexeme: poss-1sg, surface: m}]}, {surface: kichik, lexeme: kichik}]
        uz-Cyrl/standard:
          text: Менинг оилам кичик.
          tokens: [{surface: Менинг, lexemes: [{lexeme: men, surface: Мен, base: true}, {lexeme: gen, surface: инг}]}, {surface: оилам, lexemes: [{lexeme: oila, surface: оила, base: true}, {lexeme: poss-1sg, surface: м}]}, {surface: кичик, lexeme: kichik}]
      translations:
        en: My family is small.
  - choose:
      prompt:
        en: Whose family is small?
      options:
      - en: Aziz's
      - en: Malika's
      - en: Bobur's
      answer: 0
