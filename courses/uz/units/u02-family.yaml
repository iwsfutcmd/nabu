      translations: {en: 'Hi, Malika! Who is this?'}
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Bu mening akam.
          tokens: [{surface: Bu, sense: bu}, {surface: mening, sense: men, morphs: [{surface: men, kc: 'sense:men'}, {surface: ing, kc: 'form:gen-ning'}]}, {surface: akam, sense: aka, morphs: [{surface: aka, kc: 'sense:aka'}, {surface: m, kc: 'form:poss-1sg-im'}]}]
        uz-Cyrl/standard:
