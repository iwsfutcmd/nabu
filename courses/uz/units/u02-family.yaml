  - {id: malika, name: {uz-Latn/standard: Malika, uz-Cyrl/standard: Малика}}
  steps:
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Salom, Malika! Bu kim?
          tokens: [{surface: Salom, sense: salom}, {surface: Malika, sense: malika}, {surface: Bu, sense: bu}, {surface: kim, sense: kim}]
        uz-Cyrl/standard:
          text: Салом, Малика! Бу ким?
