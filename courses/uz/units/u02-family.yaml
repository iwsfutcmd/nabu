# Unit 2 (uz): family members and the possessive suffixes -(i)m, -(i)ngiz, -(s)i, -(i)miz; plural -lar;
# bor / yoʻq for "have"; the question suffix -mi; -miz "we are"; emas.
# Drafted by an LLM (provenance llm:..., status draft): every sentence awaits review by a native speaker.
id: family
title: {en: My family}
cefr: A1
kcs:
- {id: 'sense:ona', gloss: {en: mother}, forms: {uz-Latn/standard: [onam, onangizning], uz-Cyrl/standard: [онам, онангизнинг]}}
- {id: 'sense:ota', gloss: {en: father}, forms: {uz-Latn/standard: [otam, otangiz], uz-Cyrl/standard: [отам, отангиз]}}
- {id: 'sense:ham', gloss: {en: 'also, too'}, forms: {uz-Latn/standard: [ham], uz-Cyrl/standard: [ҳам]}}
- {id: 'sense:aka', gloss: {en: older brother}, forms: {uz-Latn/standard: [aka, akam, akamning, akalarim, akangiz], uz-Cyrl/standard: [ака, акам, акамнинг, акаларим, акангиз]}}
- {id: 'sense:opa', gloss: {en: older sister}, forms: {uz-Latn/standard: [opam, opangiz, opamning, opamga], uz-Cyrl/standard: [опам, опангиз, опамнинг, опамга]}}
- {id: 'sense:kim', gloss: {en: who}, forms: {uz-Latn/standard: [kim], uz-Cyrl/standard: [ким]}}
- {id: 'sense:malika', gloss: {en: Malika (a name)}, forms: {uz-Latn/standard: [Malika], uz-Cyrl/standard: [Малика]}}
- {id: 'sense:u', gloss: {en: 'he, she, it; that'}, forms: {uz-Latn/standard: [u, uning], uz-Cyrl/standard: [у, унинг]}, notes: {en: 'Uzbek has one third-person pronoun for he, she and it.'}}
- {id: 'form:poss-3-si', gloss: {en: '-(s)i: his, her, its'}, notes: {en: '-i after a consonant (ismi), -si after a vowel (onasi).'}}
- {id: 'sense:bobur', gloss: {en: Bobur (a name)}, forms: {uz-Latn/standard: [Bobur], uz-Cyrl/standard: [Бобур]}}
- {id: 'sense:uka', gloss: {en: younger brother}, forms: {uz-Latn/standard: [ukam], uz-Cyrl/standard: [укам]}}
- {id: 'sense:bor', gloss: {en: there is; (with a possessive) to have}, forms: {uz-Latn/standard: [bor, bormi], uz-Cyrl/standard: [бор, борми]}, notes: {en: 'Akam bor: I have an older brother (my older brother exists). Its opposite is yoʻq.'}}
- {id: 'sense:singil', gloss: {en: younger sister}, forms: {uz-Latn/standard: [singlim], uz-Cyrl/standard: [синглим]}, notes: {en: 'The second i drops before a vowel: singil + -im = singlim.'}}
- {id: 'form:q-mi', gloss: {en: '-mi: yes/no question'}, notes: {en: 'Bormi? Is there? Yaxshimisiz? Are you well?'}}
- {id: 'form:plural-lar', gloss: {en: '-lar: plural (-s)'}, notes: {en: 'Not used after numbers: ikki kitob, two books.'}}
- {id: 'form:cop-1pl-miz', gloss: {en: '-miz: we are (suffix on the predicate)'}}
- {id: 'sense:biz', gloss: {en: we}, forms: {uz-Latn/standard: [biz, bizning], uz-Cyrl/standard: [биз, бизнинг]}}
- {id: 'sense:oila', gloss: {en: family}, forms: {uz-Latn/standard: [oilam, oilamiz, oilangiz, oilamizda, oilasi], uz-Cyrl/standard: [оилам, оиламиз, оилангиз, оиламизда, оиласи]}}
- {id: 'form:poss-1pl-imiz', gloss: {en: '-(i)miz: our'}, notes: {en: '-imiz after a consonant (uyimiz), -miz after a vowel (oilamiz).'}}
- {id: 'sense:katta', gloss: {en: big; older}, forms: {uz-Latn/standard: [katta], uz-Cyrl/standard: [катта]}}
- {id: 'sense:kichik', gloss: {en: 'small, little; younger'}, forms: {uz-Latn/standard: [kichik], uz-Cyrl/standard: [кичик]}}
- {id: 'sense:chiroyli', gloss: {en: 'beautiful, pretty, nice'}, forms: {uz-Latn/standard: [chiroyli], uz-Cyrl/standard: [чиройли]}}
- {id: 'sense:va', gloss: {en: and}, forms: {uz-Latn/standard: [va], uz-Cyrl/standard: [ва]}}
- {id: 'sense:bola', gloss: {en: 'child, kid; boy'}, forms: {uz-Latn/standard: [bola, bolam, bolalarim], uz-Cyrl/standard: [бола, болам, болаларим]}}
- {id: 'form:part-chi', gloss: {en: '-chi: and ...? what about ...?'}, notes: {en: 'Sizchi? And you?'}}
- {id: 'sense:emas', gloss: {en: not (with nouns and adjectives)}, forms: {uz-Latn/standard: [emas, emasman, emasmi], uz-Cyrl/standard: [эмас, эмасман, эмасми]}, notes: {en: 'Men talaba emasman: I am not a student. The person suffix goes on emas.'}}
nodes:
- {id: uz.family.parents, kind: lesson, introduces: ['sense:ona', 'sense:ota', 'sense:ham', 'sense:aka', 'sense:opa']}
- {id: uz.family.who, kind: lesson, introduces: ['sense:kim', 'sense:malika', 'sense:u', 'form:poss-3-si', 'sense:bobur']}
- {id: uz.family.siblings, kind: lesson, introduces: ['sense:uka', 'sense:bor', 'sense:singil', 'form:q-mi', 'form:plural-lar']}
- {id: uz.family.we, kind: lesson, introduces: ['form:cop-1pl-miz', 'sense:biz', 'sense:oila', 'form:poss-1pl-imiz', 'sense:katta']}
- {id: uz.family.describe, kind: lesson, introduces: ['sense:kichik', 'sense:chiroyli', 'sense:va', 'sense:bola']}
- {id: uz.family.and-you, kind: lesson, introduces: ['form:part-chi', 'sense:emas']}
- {id: uz.family.story, kind: story}
