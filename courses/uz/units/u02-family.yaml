          tokens: [{surface: Бу, sense: bu}, {surface: менинг, sense: men, morphs: [{surface: мен, kc: 'sense:men'}, {surface: инг, kc: 'form:gen-ning'}]}, {surface: акам, sense: aka, morphs: [{surface: ака, kc: 'sense:aka'}, {surface: м, kc: 'form:poss-1sg-im'}]}]
      translations: {en: This is my older brother.}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Uning ismi nima?
          tokens: [{surface: Uning, sense: u, morphs: [{surface: U, kc: 'sense:u'}, {surface: ning, kc: 'form:gen-ning'}]}, {surface: ismi, sense: ism, morphs: [{surface: ism, kc: 'sense:ism'}, {surface: i, kc: 'form:poss-3-si'}]}, {surface: nima, sense: nima}]
