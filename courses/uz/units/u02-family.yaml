          tokens: [{surface: Yoʻq, sense: yoq}, {surface: Singlim, sense: singil, morphs: [{surface: Singl, kc: 'sense:singil'}, {surface: im, kc: 'form:poss-1sg-im'}]}, {surface: bor, sense: bor}]
