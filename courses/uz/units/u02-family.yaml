      translations: {en: 'What is his name?'}
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Uning ismi Bobur. U talaba.
          tokens: [{surface: Uning, sense: u, morphs: [{surface: U, kc: 'sense:u'}, {surface: ning, kc: 'form:gen-ning'}]}, {surface: ismi, sense: ism, morphs: [{surface: ism, kc: 'sense:ism'}, {surface: i, kc: 'form:poss-3-si'}]}, {surface: Bobur, sense: bobur}, {surface: U, sense: u}, {surface: talaba, sense: talaba}]
        uz-Cyrl/standard:
          text: Унинг исми Бобур. У талаба.
          tokens: [{surface: Унинг, sense: u, morphs: [{surface: У, kc: 'sense:u'}, {surface: нинг, kc: 'form:gen-ning'}]}, {surface: исми, sense: ism, morphs: [{surface: исм, kc: 'sense:ism'}, {surface: и, kc: 'form:poss-3-si'}]}, {surface: Бобур, sense: bobur}, {surface: У, sense: u}, {surface: талаба, sense: talaba}]
      translations: {en: His name is Bobur. He is a student.}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Opangiz bormi?
          tokens: [{surface: Opangiz, sense: opa, morphs: [{surface: Opa, kc: 'sense:opa'}, {surface: ngiz, kc: 'form:poss-2-ingiz'}]}, {surface: bormi, sense: bor, morphs: [{surface: bor, kc: 'sense:bor'}, {surface: mi, kc: 'form:q-mi'}]}]
