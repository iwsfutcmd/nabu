          tokens: [{surface: Bu, sense: bu}, {surface: bizning, sense: biz, morphs: [{surface: biz, kc: 'sense:biz'}, {surface: ning, kc: 'form:gen-ning'}]}, {surface: oilamiz, sense: oila, morphs: [{surface: oila, kc: 'sense:oila'}, {surface: miz, kc: 'form:poss-1pl-imiz'}]}]
