        uz-Latn/standard:
          text: Oilangiz katta!
          tokens: [{surface: Oilangiz, sense: oila, morphs: [{surface: Oila, kc: 'sense:oila'}, {surface: ngiz, kc: 'form:poss-2-ingiz'}]}, {surface: katta, sense: katta}]
        uz-Cyrl/standard:
          text: Оилангиз катта!
          tokens: [{surface: Оилангиз, sense: oila, morphs: [{surface: Оила, kc: 'sense:oila'}, {surface: нгиз, kc: 'form:poss-2-ingiz'}]}, {surface: катта, sense: katta}]
