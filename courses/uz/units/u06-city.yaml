stories:
- id: uz.story.city
  node: uz.city.story
  title:
    en: Excuse me, where is the bazaar?
  provenance:
    author: llm:claude@887599f213ef
    status: draft
  characters:
  - id: aziz
    name:
      uz-Latn/standard: Aziz
      uz-Cyrl/standard: Азиз
  - id: yolovchi
    name:
      uz-Latn/standard: Yoʻlovchi
      uz-Cyrl/standard: Йўловчи
  steps:
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Kechirasiz! Bozor qayerda?
          tokens: [{surface: Kechirasiz, lexemes: [{lexeme: kechirmoq, surface: Kechir, base: true}, {lexeme: pres, surface: a}, {lexeme: cop-2, surface: siz}]}, {surface: Bozor, lexemes: [{lexeme: bozor, base: true}, {lexeme: nom}]}, {surface: qayerda, lexemes: [{lexeme: qayer, surface: qayer, base: true}, {lexeme: loc, surface: da}]}]
        uz-Cyrl/standard:
          text: Кечирасиз! Бозор қаерда?
          tokens: [{surface: Кечирасиз, lexemes: [{lexeme: kechirmoq, surface: Кечир, base: true}, {lexeme: pres, surface: а}, {lexeme: cop-2, surface: сиз}]}, {surface: Бозор, lexemes: [{lexeme: bozor, base: true}, {lexeme: nom}]}, {surface: қаерда, lexemes: [{lexeme: qayer, surface: қаер, base: true}, {lexeme: loc, surface: да}]}]
      translations:
        en: Excuse me! Where is the bazaar?
  - line:
      speaker: yolovchi
      forms:
        uz-Latn/standard:
          text: Bozormi? U yer uzoq emas.
          tokens: [{surface: Bozormi, lexemes: [{lexeme: bozor, surface: Bozor, base: true}, {lexeme: nom}, {lexeme: q, surface: mi}]}, {surface: U, lexemes: [{lexeme: u, base: true}, {lexeme: nom}]}, {surface: yer, lexemes: [{lexeme: yer, base: true}, {lexeme: nom}]}, {surface: uzoq, lexeme: uzoq}, {surface: emas, lexeme: emas}]
        uz-Cyrl/standard:
          text: Бозорми? У ер узоқ эмас.
          tokens: [{surface: Бозорми, lexemes: [{lexeme: bozor, surface: Бозор, base: true}, {lexeme: nom}, {lexeme: q, surface: ми}]}, {surface: У, lexemes: [{lexeme: u, base: true}, {lexeme: nom}]}, {surface: ер, lexemes: [{lexeme: yer, base: true}, {lexeme: nom}]}, {surface: узоқ, lexeme: uzoq}, {surface: эмас, lexeme: emas}]
      translations:
        en: The bazaar? It's not far.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Men piyoda boraman.
          tokens: [{surface: Men, lexemes: [{lexeme: men, base: true}, {lexeme: nom}]}, {surface: piyoda, lexeme: piyoda}, {surface: boraman, lexemes: [{lexeme: bormoq, surface: bor, base: true}, {lexeme: pres, surface: a}, {lexeme: cop-1sg, surface: man}]}]
        uz-Cyrl/standard:
          text: Мен пиёда бораман.
          tokens: [{surface: Мен, lexemes: [{lexeme: men, base: true}, {lexeme: nom}]}, {surface: пиёда, lexeme: piyoda}, {surface: бораман, lexemes: [{lexeme: bormoq, surface: бор, base: true}, {lexeme: pres, surface: а}, {lexeme: cop-1sg, surface: ман}]}]
      translations:
        en: I'm going on foot.
  - line:
      speaker: yolovchi
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Yaxshi. Toʻgʻri boring, keyin chapga buriling.
          tokens: [{surface: Yaxshi, lexeme: yaxshi}, {surface: Toʻgʻri, lexeme: togri}, {surface: boring, lexemes: [{lexeme: bormoq, surface: bor, base: true}, {lexeme: imp, surface: ing}]}, {surface: keyin, lexeme: keyin}, {surface: chapga, lexemes: [{lexeme: chap, surface: chap, base: true}, {lexeme: dat, surface: ga}]}, {surface: buriling, lexemes: [{lexeme: burilmoq, surface: buril, base: true}, {lexeme: imp, surface: ing}]}]
        uz-Cyrl/standard:
          text: Яхши. Тўғри боринг, кейин чапга бурилинг.
          tokens: [{surface: Яхши, lexeme: yaxshi}, {surface: Тўғри, lexeme: togri}, {surface: боринг, lexemes: [{lexeme: bormoq, surface: бор, base: true}, {lexeme: imp, surface: инг}]}, {surface: кейин, lexeme: keyin}, {surface: чапга, lexemes: [{lexeme: chap, surface: чап, base: true}, {lexeme: dat, surface: га}]}, {surface: бурилинг, lexemes: [{lexeme: burilmoq, surface: бурил, base: true}, {lexeme: imp, surface: инг}]}]
      translations:
        en: Good. Go straight on, then turn left.
  - choose:
      prompt:
        en: Which way does Aziz have to turn?
      options:
      - en: left
      - en: right
      - en: back
      answer: 0
  - line:
      speaker: yolovchi
      forms:
        uz-Latn/standard:
          text: Bozor metro bekati yonida.
          tokens: [{surface: Bozor, lexemes: [{lexeme: bozor, base: true}, {lexeme: nom}]}, {surface: metro, lexemes: [{lexeme: metro, base: true}, {lexeme: nom}]}, {surface: bekati, lexemes: [{lexeme: bekat, surface: bekat, base: true}, {lexeme: poss-3, surface: i}, {lexeme: nom}]}, {surface: yonida, lexemes: [{lexeme: yon, surface: yon, base: true}, {lexeme: poss-3, surface: i}, {lexeme: loc, surface: da}]}]
        uz-Cyrl/standard:
          text: Бозор метро бекати ёнида.
          tokens: [{surface: Бозор, lexemes: [{lexeme: bozor, base: true}, {lexeme: nom}]}, {surface: метро, lexemes: [{lexeme: metro, base: true}, {lexeme: nom}]}, {surface: бекати, lexemes: [{lexeme: bekat, surface: бекат, base: true}, {lexeme: poss-3, surface: и}, {lexeme: nom}]}, {surface: ёнида, lexemes: [{lexeme: yon, surface: ён, base: true}, {lexeme: poss-3, surface: и}, {lexeme: loc, surface: да}]}]
      translations:
        en: The bazaar is next to the metro station.
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat! Siz ham bozorga borasizmi?
          tokens: [{surface: Rahmat, lexeme: rahmat}, {surface: Siz, lexemes: [{lexeme: siz, base: true}, {lexeme: nom}]}, {surface: ham, lexeme: ham}, {surface: bozorga, lexemes: [{lexeme: bozor, surface: bozor, base: true}, {lexeme: dat, surface: ga}]}, {surface: borasizmi, lexemes: [{lexeme: bormoq, surface: bor, base: true}, {lexeme: pres, surface: a}, {lexeme: cop-2, surface: siz}, {lexeme: q, surface: mi}]}]
        uz-Cyrl/standard:
          text: Раҳмат! Сиз ҳам бозорга борасизми?
          tokens: [{surface: Раҳмат, lexeme: rahmat}, {surface: Сиз, lexemes: [{lexeme: siz, base: true}, {lexeme: nom}]}, {surface: ҳам, lexeme: ham}, {surface: бозорга, lexemes: [{lexeme: bozor, surface: бозор, base: true}, {lexeme: dat, surface: га}]}, {surface: борасизми, lexemes: [{lexeme: bormoq, surface: бор, base: true}, {lexeme: pres, surface: а}, {lexeme: cop-2, surface: сиз}, {lexeme: q, surface: ми}]}]
      translations:
        en: Thank you! Are you going to the bazaar too?
  - line:
      speaker: yolovchi
      forms:
        uz-Latn/standard:
          text: Yoʻq, men ishga boraman.
          tokens: [{surface: Yoʻq, lexeme: yoq}, {surface: men, lexemes: [{lexeme: men, base: true}, {lexeme: nom}]}, {surface: ishga, lexemes: [{lexeme: ish, surface: ish, base: true}, {lexeme: dat, surface: ga}]}, {surface: boraman, lexemes: [{lexeme: bormoq, surface: bor, base: true}, {lexeme: pres, surface: a}, {lexeme: cop-1sg, surface: man}]}]
        uz-Cyrl/standard:
          text: Йўқ, мен ишга бораман.
          tokens: [{surface: Йўқ, lexeme: yoq}, {surface: мен, lexemes: [{lexeme: men, base: true}, {lexeme: nom}]}, {surface: ишга, lexemes: [{lexeme: ish, surface: иш, base: true}, {lexeme: dat, surface: га}]}, {surface: бораман, lexemes: [{lexeme: bormoq, surface: бор, base: true}, {lexeme: pres, surface: а}, {lexeme: cop-1sg, surface: ман}]}]
      translations:
        en: No, I'm going to work.
  - line:
      speaker: aziz
      ask: complete
      gap: lexeme:chap
      distractors:
      - lexeme:maktab
      - lexeme:ish
      forms:
