# Unit 6 (uz): places and directions; the dative -ga (-ka, -qa) and the ablative -dan, bormoq / kelmoq,
# getting around (avtobusda, piyoda), asking the way (Kechirasiz, ... qayerda?), left, right, straight on.
# Drafted by an LLM (provenance llm:..., status draft): every sentence awaits review by a native speaker.
id: city
title: {en: Around town}
cefr: A1
kcs:
- {id: 'sense:bozor', gloss: {en: 'bazaar, market'}, forms: {uz-Latn/standard: [bozor, bozorga, bozormi, bozorda], uz-Cyrl/standard: [бозор, бозорга, бозорми, бозорда]}}
- {id: 'sense:bormoq', gloss: {en: to go}, forms: {uz-Latn/standard: [boraman, borasiz, boradi, boramiz, boring, borasizmi, bormoqchimiz, bordim, bordingiz, bordik, boramizmi, bormoqchiman], uz-Cyrl/standard: [бораман, борасиз, боради, борамиз, боринг, борасизми, бормоқчимиз, бордим, бордингиз, бордик, борамизми, бормоқчиман]}, notes: {en: 'Boraman: I go, I will go. Boring: go (polite).'}}
