- {id: uz.city.go, kind: lesson, introduces: ['lexeme:bozor', 'lexeme:bormoq', 'lexeme:dat', 'lexeme:ish', 'lexeme:maktab']}
- {id: uz.city.from, kind: lesson, introduces: ['lexeme:kelmoq', 'lexeme:abl', 'lexeme:ozbekiston', 'lexeme:angliya']}
