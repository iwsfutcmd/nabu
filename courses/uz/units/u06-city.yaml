stories:
- id: uz.story.city
  node: uz.city.story
  title: {en: 'Excuse me, where is the bazaar?'}
  provenance: {author: 'llm:claude@887599f213ef', status: draft}
  characters:
  - {id: aziz, name: {uz-Latn/standard: Aziz, uz-Cyrl/standard: Азиз}}
  - {id: yolovchi, name: {uz-Latn/standard: Yoʻlovchi, uz-Cyrl/standard: Йўловчи}}
  steps:
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Kechirasiz! Bozor qayerda?
          tokens: [{surface: Kechirasiz, sense: kechirmoq, morphs: [{surface: Kechir, kc: 'sense:kechirmoq'}, {surface: a, kc: 'form:pres-a'}, {surface: siz, kc: 'form:cop-2-siz'}]}, {surface: Bozor, sense: bozor}, {surface: qayerda, sense: qayer, morphs: [{surface: qayer, kc: 'sense:qayer'}, {surface: da, kc: 'form:loc-da'}]}]
        uz-Cyrl/standard:
          text: Кечирасиз! Бозор қаерда?
          tokens: [{surface: Кечирасиз, sense: kechirmoq, morphs: [{surface: Кечир, kc: 'sense:kechirmoq'}, {surface: а, kc: 'form:pres-a'}, {surface: сиз, kc: 'form:cop-2-siz'}]}, {surface: Бозор, sense: bozor}, {surface: қаерда, sense: qayer, morphs: [{surface: қаер, kc: 'sense:qayer'}, {surface: да, kc: 'form:loc-da'}]}]
      translations: {en: 'Excuse me! Where is the bazaar?'}
  - line:
      speaker: yolovchi
      forms:
        uz-Latn/standard:
          text: Bozormi? U yer uzoq emas.
          tokens: [{surface: Bozormi, sense: bozor, morphs: [{surface: Bozor, kc: 'sense:bozor'}, {surface: mi, kc: 'form:q-mi'}]}, {surface: U, sense: u}, {surface: yer, sense: yer}, {surface: uzoq, sense: uzoq}, {surface: emas, sense: emas}]
        uz-Cyrl/standard:
          text: Бозорми? У ер узоқ эмас.
          tokens: [{surface: Бозорми, sense: bozor, morphs: [{surface: Бозор, kc: 'sense:bozor'}, {surface: ми, kc: 'form:q-mi'}]}, {surface: У, sense: u}, {surface: ер, sense: yer}, {surface: узоқ, sense: uzoq}, {surface: эмас, sense: emas}]
      translations: {en: 'The bazaar? It''s not far.'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Men piyoda boraman.
          tokens: [{surface: Men, sense: men}, {surface: piyoda, sense: piyoda}, {surface: boraman, sense: bormoq, morphs: [{surface: bor, kc: 'sense:bormoq'}, {surface: a, kc: 'form:pres-a'}, {surface: man, kc: 'form:cop-1sg-man'}]}]
        uz-Cyrl/standard:
          text: Мен пиёда бораман.
          tokens: [{surface: Мен, sense: men}, {surface: пиёда, sense: piyoda}, {surface: бораман, sense: bormoq, morphs: [{surface: бор, kc: 'sense:bormoq'}, {surface: а, kc: 'form:pres-a'}, {surface: ман, kc: 'form:cop-1sg-man'}]}]
      translations: {en: I'm going on foot.}
  - line:
      speaker: yolovchi
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Yaxshi. Toʻgʻri boring, keyin chapga buriling.
          tokens: [{surface: Yaxshi, sense: yaxshi}, {surface: Toʻgʻri, sense: togri}, {surface: boring, sense: bormoq, morphs: [{surface: bor, kc: 'sense:bormoq'}, {surface: ing, kc: 'form:imp-ing'}]}, {surface: keyin, sense: keyin}, {surface: chapga, sense: chap, morphs: [{surface: chap, kc: 'sense:chap'}, {surface: ga, kc: 'form:dat-ga'}]}, {surface: buriling, sense: burilmoq, morphs: [{surface: buril, kc: 'sense:burilmoq'}, {surface: ing, kc: 'form:imp-ing'}]}]
        uz-Cyrl/standard:
          text: Яхши. Тўғри боринг, кейин чапга бурилинг.
          tokens: [{surface: Яхши, sense: yaxshi}, {surface: Тўғри, sense: togri}, {surface: боринг, sense: bormoq, morphs: [{surface: бор, kc: 'sense:bormoq'}, {surface: инг, kc: 'form:imp-ing'}]}, {surface: кейин, sense: keyin}, {surface: чапга, sense: chap, morphs: [{surface: чап, kc: 'sense:chap'}, {surface: га, kc: 'form:dat-ga'}]}, {surface: бурилинг, sense: burilmoq, morphs: [{surface: бурил, kc: 'sense:burilmoq'}, {surface: инг, kc: 'form:imp-ing'}]}]
      translations: {en: 'Good. Go straight on, then turn left.'}
  - choose:
      prompt: {en: 'Which way does Aziz have to turn?'}
      options: [{en: left}, {en: right}, {en: back}]
      answer: 0
  - line:
      speaker: yolovchi
      forms:
        uz-Latn/standard:
          text: Bozor metro bekati yonida.
          tokens: [{surface: Bozor, sense: bozor}, {surface: metro, sense: metro}, {surface: bekati, sense: bekat, morphs: [{surface: bekat, kc: 'sense:bekat'}, {surface: i, kc: 'form:poss-3-si'}]}, {surface: yonida, sense: yon, morphs: [{surface: yon, kc: 'sense:yon'}, {surface: i, kc: 'form:poss-3-si'}, {surface: da, kc: 'form:loc-da'}]}]
        uz-Cyrl/standard:
          text: Бозор метро бекати ёнида.
          tokens: [{surface: Бозор, sense: bozor}, {surface: метро, sense: metro}, {surface: бекати, sense: bekat, morphs: [{surface: бекат, kc: 'sense:bekat'}, {surface: и, kc: 'form:poss-3-si'}]}, {surface: ёнида, sense: yon, morphs: [{surface: ён, kc: 'sense:yon'}, {surface: и, kc: 'form:poss-3-si'}, {surface: да, kc: 'form:loc-da'}]}]
      translations: {en: The bazaar is next to the metro station.}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat! Siz ham bozorga borasizmi?
          tokens: [{surface: Rahmat, sense: rahmat}, {surface: Siz, sense: siz}, {surface: ham, sense: ham}, {surface: bozorga, sense: bozor, morphs: [{surface: bozor, kc: 'sense:bozor'}, {surface: ga, kc: 'form:dat-ga'}]}, {surface: borasizmi, sense: bormoq, morphs: [{surface: bor, kc: 'sense:bormoq'}, {surface: a, kc: 'form:pres-a'}, {surface: siz, kc: 'form:cop-2-siz'}, {surface: mi, kc: 'form:q-mi'}]}]
        uz-Cyrl/standard:
          text: Раҳмат! Сиз ҳам бозорга борасизми?
          tokens: [{surface: Раҳмат, sense: rahmat}, {surface: Сиз, sense: siz}, {surface: ҳам, sense: ham}, {surface: бозорга, sense: bozor, morphs: [{surface: бозор, kc: 'sense:bozor'}, {surface: га, kc: 'form:dat-ga'}]}, {surface: борасизми, sense: bormoq, morphs: [{surface: бор, kc: 'sense:bormoq'}, {surface: а, kc: 'form:pres-a'}, {surface: сиз, kc: 'form:cop-2-siz'}, {surface: ми, kc: 'form:q-mi'}]}]
      translations: {en: 'Thank you! Are you going to the bazaar too?'}
  - line:
      speaker: yolovchi
      forms:
