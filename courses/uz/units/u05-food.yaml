          tokens: [{surface: Ош, sense: osh}, {surface: тайёр, sense: tayyor}, {surface: Марҳамат, sense: marhamat}]
      translations: {en: 'The plov is ready! Please, come and eat!'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat, buvi!
          tokens: [{surface: Rahmat, sense: rahmat}, {surface: buvi, sense: buvi}]
        uz-Cyrl/standard:
          text: Раҳмат, буви!
          tokens: [{surface: Раҳмат, sense: rahmat}, {surface: буви, sense: buvi}]
      translations: {en: 'Thank you, Grandma!'}
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Aziz, non oling, osh yeng.
          tokens: [{surface: Aziz, sense: aziz}, {surface: non, sense: non}, {surface: oling, sense: olmoq, morphs: [{surface: ol, kc: 'sense:olmoq'}, {surface: ing, kc: 'form:imp-ing'}]}, {surface: osh, sense: osh}, {surface: yeng, sense: yemoq, morphs: [{surface: ye, kc: 'sense:yemoq'}, {surface: ng, kc: 'form:imp-ing'}]}]
        uz-Cyrl/standard:
          text: Азиз, нон олинг, ош енг.
          tokens: [{surface: Азиз, sense: aziz}, {surface: нон, sense: non}, {surface: олинг, sense: olmoq, morphs: [{surface: ол, kc: 'sense:olmoq'}, {surface: инг, kc: 'form:imp-ing'}]}, {surface: ош, sense: osh}, {surface: енг, sense: yemoq, morphs: [{surface: е, kc: 'sense:yemoq'}, {surface: нг, kc: 'form:imp-ing'}]}]
      translations: {en: 'Aziz, take some bread, have some plov.'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Osh juda mazali!
          tokens: [{surface: Osh, sense: osh}, {surface: juda, sense: juda}, {surface: mazali, sense: mazali}]
        uz-Cyrl/standard:
          text: Ош жуда мазали!
          tokens: [{surface: Ош, sense: osh}, {surface: жуда, sense: juda}, {surface: мазали, sense: mazali}]
      translations: {en: The plov is delicious!}
  - line:
      speaker: malika
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Buvim oshni juda yaxshi pishiradi.
          tokens: [{surface: Buvim, sense: buvi, morphs: [{surface: Buvi, kc: 'sense:buvi'}, {surface: m, kc: 'form:poss-1sg-im'}]}, {surface: oshni, sense: osh, morphs: [{surface: osh, kc: 'sense:osh'}, {surface: ni, kc: 'form:acc-ni'}]}, {surface: juda, sense: juda}, {surface: yaxshi, sense: yaxshi}, {surface: pishiradi, sense: pishirmoq, morphs: [{surface: pishir, kc: 'sense:pishirmoq'}, {surface: a, kc: 'form:pres-a'}, {surface: di, kc: 'form:pres-3sg-di'}]}]
        uz-Cyrl/standard:
          text: Бувим ошни жуда яхши пиширади.
          tokens: [{surface: Бувим, sense: buvi, morphs: [{surface: Буви, kc: 'sense:buvi'}, {surface: м, kc: 'form:poss-1sg-im'}]}, {surface: ошни, sense: osh, morphs: [{surface: ош, kc: 'sense:osh'}, {surface: ни, kc: 'form:acc-ni'}]}, {surface: жуда, sense: juda}, {surface: яхши, sense: yaxshi}, {surface: пиширади, sense: pishirmoq, morphs: [{surface: пишир, kc: 'sense:pishirmoq'}, {surface: а, kc: 'form:pres-a'}, {surface: ди, kc: 'form:pres-3sg-di'}]}]
      translations: {en: My grandmother cooks plov very well.}
  - choose:
      prompt: {en: 'Who cooked the plov?'}
      options: [{en: Grandma}, {en: Aziz}, {en: Malika}]
      answer: 0
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Qahva ichasizmi?
          tokens: [{surface: Qahva, sense: qahva}, {surface: ichasizmi, sense: ichmoq, morphs: [{surface: ich, kc: 'sense:ichmoq'}, {surface: a, kc: 'form:pres-a'}, {surface: siz, kc: 'form:cop-2-siz'}, {surface: mi, kc: 'form:q-mi'}]}]
        uz-Cyrl/standard:
          text: Қаҳва ичасизми?
          tokens: [{surface: Қаҳва, sense: qahva}, {surface: ичасизми, sense: ichmoq, morphs: [{surface: ич, kc: 'sense:ichmoq'}, {surface: а, kc: 'form:pres-a'}, {surface: сиз, kc: 'form:cop-2-siz'}, {surface: ми, kc: 'form:q-mi'}]}]
      translations: {en: 'Will you have some coffee?'}
  - line:
      speaker: aziz
      ask: complete
      gap: sense:qahva
      distractors: ['sense:non', 'sense:osh']
      forms:
        uz-Latn/standard:
          text: Yoʻq, rahmat. Men qahva ichmayman.
          tokens: [{surface: Yoʻq, sense: yoq}, {surface: rahmat, sense: rahmat}, {surface: Men, sense: men}, {surface: qahva, sense: qahva}, {surface: ichmayman, sense: ichmoq, morphs: [{surface: ich, kc: 'sense:ichmoq'}, {surface: ma, kc: 'form:neg-ma'}, {surface: y, kc: 'form:pres-a'}, {surface: man, kc: 'form:cop-1sg-man'}]}]
        uz-Cyrl/standard:
          text: Йўқ, раҳмат. Мен қаҳва ичмайман.
          tokens: [{surface: Йўқ, sense: yoq}, {surface: раҳмат, sense: rahmat}, {surface: Мен, sense: men}, {surface: қаҳва, sense: qahva}, {surface: ичмайман, sense: ichmoq, morphs: [{surface: ич, kc: 'sense:ichmoq'}, {surface: ма, kc: 'form:neg-ma'}, {surface: й, kc: 'form:pres-a'}, {surface: ман, kc: 'form:cop-1sg-man'}]}]
      translations: {en: 'No, thank you. I don''t drink coffee.'}
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Mana issiq choy.
          tokens: [{surface: Mana, sense: mana}, {surface: issiq, sense: issiq}, {surface: choy, sense: choy}]
        uz-Cyrl/standard:
          text: Мана иссиқ чой.
          tokens: [{surface: Мана, sense: mana}, {surface: иссиқ, sense: issiq}, {surface: чой, sense: choy}]
      translations: {en: Here is some hot tea.}
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Yana osh yeng!
          tokens: [{surface: Yana, sense: yana}, {surface: osh, sense: osh}, {surface: yeng, sense: yemoq, morphs: [{surface: ye, kc: 'sense:yemoq'}, {surface: ng, kc: 'form:imp-ing'}]}]
        uz-Cyrl/standard:
          text: Яна ош енг!
          tokens: [{surface: Яна, sense: yana}, {surface: ош, sense: osh}, {surface: енг, sense: yemoq, morphs: [{surface: е, kc: 'sense:yemoq'}, {surface: нг, kc: 'form:imp-ing'}]}]
