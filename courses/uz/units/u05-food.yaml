- {id: 'sense:iltimos', gloss: {en: please}, forms: {uz-Latn/standard: [iltimos], uz-Cyrl/standard: [илтимос]}}
- {id: 'sense:sovuq', gloss: {en: cold}, forms: {uz-Latn/standard: [sovuq], uz-Cyrl/standard: [совуқ]}}
- {id: 'sense:yana', gloss: {en: 'more, again; else'}, forms: {uz-Latn/standard: [yana], uz-Cyrl/standard: [яна]}}
