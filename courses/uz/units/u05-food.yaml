- {id: 'form:neg-ma', gloss: {en: '-ma: not (on verbs)'}, notes: {en: 'Ye + -ma + -y + -man = yemayman: I don''t eat.'}}
- {id: 'sense:shakar', gloss: {en: sugar}, forms: {uz-Latn/standard: [shakar], uz-Cyrl/standard: [шакар]}}
- {id: 'sense:suv', gloss: {en: water}, forms: {uz-Latn/standard: [suv], uz-Cyrl/standard: [сув]}}
