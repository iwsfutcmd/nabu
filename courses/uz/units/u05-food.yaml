  - {id: aziz, name: {uz-Latn/standard: Aziz, uz-Cyrl/standard: Азиз}}
  - {id: malika, name: {uz-Latn/standard: Malika, uz-Cyrl/standard: Малика}}
  steps:
  - line:
      speaker: buvi
      forms:
        uz-Latn/standard:
          text: Osh tayyor! Marhamat!
          tokens: [{surface: Osh, sense: osh}, {surface: tayyor, sense: tayyor}, {surface: Marhamat, sense: marhamat}]
