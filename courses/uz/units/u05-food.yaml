# Unit 5 (uz): food and drink at the table; the polite imperative -(i)ng (iching, yeng), the present-future
# tense -a / -y with person endings (ichaman, ichasiz, ichadi), the object suffix -ni, negation -ma.
# Drafted by an LLM (provenance llm:..., status draft): every sentence awaits review by a native speaker.
id: food
title: {en: Tea and plov}
cefr: A1
kcs:
- {id: 'sense:choy', gloss: {en: tea}, forms: {uz-Latn/standard: [choy, choyingizni], uz-Cyrl/standard: [чой, чойингизни]}, image: {file: ../images/tea.svg, license: CC0-1.0, provenance: {author: 'llm:claude@3715ffdb2952', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:issiq', gloss: {en: 'hot, warm'}, forms: {uz-Latn/standard: [issiq], uz-Cyrl/standard: [иссиқ]}}
- {id: 'sense:ichmoq', gloss: {en: to drink}, forms: {uz-Latn/standard: [iching, ich, ichaman, ichasizmi, ichadi, ichmayman, ichdik], uz-Cyrl/standard: [ичинг, ич, ичаман, ичасизми, ичади, ичмайман, ичдик]}, notes: {en: 'Ich! Drink! (to a friend or a child). Iching! (polite). Ichaman: I drink.'}}
- {id: 'form:imp-ing', gloss: {en: '-(i)ng: please do (polite imperative)'}, notes: {en: '-ing after a consonant (iching, oling), -ng after a vowel (yeng).'}}
- {id: 'sense:marhamat', gloss: {en: please; here you are; go ahead}, forms: {uz-Latn/standard: [marhamat], uz-Cyrl/standard: [марҳамат]}}
- {id: 'sense:non', gloss: {en: bread (round flatbread)}, forms: {uz-Latn/standard: [non], uz-Cyrl/standard: [нон]}}
- {id: 'sense:yemoq', gloss: {en: to eat}, forms: {uz-Latn/standard: [yeng, yeyman, yeymiz, yemayman, yemaydi, yedik], uz-Cyrl/standard: [енг, ейман, еймиз, емайман, емайди, едик]}}
- {id: 'form:pres-a', gloss: {en: '-a / -y: present-future tense'}, notes: {en: '-a after a consonant (ichaman), -y after a vowel (yeyman, ishlayman), then a person ending: -man I, -siz you, -di he/she, -miz we.'}}
- {id: 'sense:qahva', gloss: {en: coffee}, forms: {uz-Latn/standard: [qahva], uz-Cyrl/standard: [қаҳва]}, image: {file: ../images/coffee.svg, license: CC0-1.0, provenance: {author: 'llm:claude@0b7ee10fe47d', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'form:pres-3sg-di', gloss: {en: '-di: he, she, it (present tense)'}, notes: {en: 'Ichadi: he/she drinks. After -yap it is -ti: uxlayapti.'}}
- {id: 'sense:kop', gloss: {en: 'much, many; a lot'}, forms: {uz-Latn/standard: [koʻp], uz-Cyrl/standard: [кўп]}}
- {id: 'sense:osh', gloss: {en: 'plov, pilaf; a meal'}, forms: {uz-Latn/standard: [osh, oshda, oshni], uz-Cyrl/standard: [ош, ошда, ошни]}, notes: {en: 'Osh (also palov) is rice cooked with carrots, onions and meat.'}}
- {id: 'sense:tayyor', gloss: {en: ready}, forms: {uz-Latn/standard: [tayyor], uz-Cyrl/standard: [тайёр]}}
- {id: 'sense:mazali', gloss: {en: 'tasty, delicious'}, forms: {uz-Latn/standard: [mazali], uz-Cyrl/standard: [мазали]}}
- {id: 'sense:pishirmoq', gloss: {en: to cook}, forms: {uz-Latn/standard: [pishiradi, pishiramiz, pishiryapti, pishirdim], uz-Cyrl/standard: [пиширади, пиширамиз, пиширяпти, пиширдим]}}
- {id: 'form:acc-ni', gloss: {en: '-ni: the (definite object)'}, notes: {en: 'Choyingizni iching: drink your tea. An object that is not definite takes nothing: choy iching.'}}
- {id: 'sense:olmoq', gloss: {en: 'to take; to buy, get'}, forms: {uz-Latn/standard: [oling, olaman, olamiz, olmoqchiman, olmoqchisiz, oldim], uz-Cyrl/standard: [олинг, оламан, оламиз, олмоқчиман, олмоқчисиз, олдим]}}
