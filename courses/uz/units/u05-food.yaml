  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Rahmat, buvi! Juda mazali!
          tokens: [{surface: Rahmat, sense: rahmat}, {surface: buvi, sense: buvi}, {surface: Juda, sense: juda}, {surface: mazali, sense: mazali}]
        uz-Cyrl/standard:
          text: Раҳмат, буви! Жуда мазали!
          tokens: [{surface: Раҳмат, sense: rahmat}, {surface: буви, sense: buvi}, {surface: Жуда, sense: juda}, {surface: мазали, sense: mazali}]
      translations: {en: 'Thank you, Grandma! It''s delicious!'}
  - choose:
      prompt: {en: 'What does Aziz not drink?'}
      options: [{en: coffee}, {en: tea}, {en: water}]
      answer: 0
scenarios:
- id: uz.choyxona
  after: uz.food.please
  title: {en: At the teahouse}
  setting: {en: 'A choyxona (teahouse) in Samarkand at lunchtime: low tables, pots of green tea and a big pot of plov.'}
  character: {en: 'The choyxona''s owner: hospitable and a little teasing, who wants every guest to eat and drink a lot.'}
  goal: {en: 'Order tea and plov, say what you do and don''t eat or drink, and ask for water or more bread.'}
  provenance: {author: 'llm:claude@887599f213ef', status: draft}
