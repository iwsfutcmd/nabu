          text: Ака, ҳозир нима қиляпсиз?
          tokens: [{surface: Ака, sense: aka}, {surface: ҳозир, sense: hozir}, {surface: нима, sense: nima}, {surface: қиляпсиз, sense: qilmoq, morphs: [{surface: қил, kc: 'sense:qilmoq'}, {surface: яп, kc: 'form:prog-yap'}, {surface: сиз, kc: 'form:cop-2-siz'}]}]
