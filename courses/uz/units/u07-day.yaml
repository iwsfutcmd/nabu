  - {id: bobur, name: {uz-Latn/standard: Bobur, uz-Cyrl/standard: Бобур}}
  steps:
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Aka, hozir nima qilyapsiz?
