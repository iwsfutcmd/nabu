stories:
- id: uz.story.day
  node: uz.day.story
  title:
    en: Bobur's week
  provenance:
    author: llm:claude@887599f213ef
    status: draft
  characters:
  - id: malika
    name:
      uz-Latn/standard: Malika
      uz-Cyrl/standard: Малика
  - id: bobur
    name:
      uz-Latn/standard: Bobur
      uz-Cyrl/standard: Бобур
  steps:
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Aka, hozir nima qilyapsiz?
          tokens: [{surface: Aka, lexeme: aka}, {surface: hozir, lexeme: hozir}, {surface: nima, lexeme: nima}, {surface: qilyapsiz, lexemes: [{lexeme: qilmoq, surface: qil, base: true}, {lexeme: prog, surface: yap}, {lexeme: cop-2, surface: siz}]}]
        uz-Cyrl/standard:
          text: Ака, ҳозир нима қиляпсиз?
          tokens: [{surface: Ака, lexeme: aka}, {surface: ҳозир, lexeme: hozir}, {surface: нима, lexeme: nima}, {surface: қиляпсиз, lexemes: [{lexeme: qilmoq, surface: қил, base: true}, {lexeme: prog, surface: яп}, {lexeme: cop-2, surface: сиз}]}]
      translations:
        en: Brother, what are you doing now?
  - line:
      speaker: bobur
      forms:
        uz-Latn/standard:
          text: Kitob oʻqiyapman.
          tokens: [{surface: Kitob, lexeme: kitob}, {surface: oʻqiyapman, lexemes: [{lexeme: oqimoq, surface: oʻqi, base: true}, {lexeme: prog, surface: yap}, {lexeme: cop-1sg, surface: man}]}]
        uz-Cyrl/standard:
          text: Китоб ўқияпман.
          tokens: [{surface: Китоб, lexeme: kitob}, {surface: ўқияпман, lexemes: [{lexeme: oqimoq, surface: ўқи, base: true}, {lexeme: prog, surface: яп}, {lexeme: cop-1sg, surface: ман}]}]
      translations:
        en: I'm reading a book.
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Ertaga ishga borasizmi?
          tokens: [{surface: Ertaga, lexeme: ertaga}, {surface: ishga, lexemes: [{lexeme: ish, surface: ish, base: true}, {lexeme: dat, surface: ga}]}, {surface: borasizmi, lexemes: [{lexeme: bormoq, surface: bor, base: true}, {lexeme: pres, surface: a}, {lexeme: cop-2, surface: siz}, {lexeme: q, surface: mi}]}]
        uz-Cyrl/standard:
          text: Эртага ишга борасизми?
          tokens: [{surface: Эртага, lexeme: ertaga}, {surface: ишга, lexemes: [{lexeme: ish, surface: иш, base: true}, {lexeme: dat, surface: га}]}, {surface: борасизми, lexemes: [{lexeme: bormoq, surface: бор, base: true}, {lexeme: pres, surface: а}, {lexeme: cop-2, surface: сиз}, {lexeme: q, surface: ми}]}]
      translations:
        en: Are you going to work tomorrow?
  - line:
      speaker: bobur
      ask: complete
      gap: lexeme:ishlamoq
      asks: form
      distractors:
      - lexeme:cop-2
      forms:
        uz-Latn/standard:
          text: Ha. Men har kuni ishlayman.
          tokens: [{surface: Ha, lexeme: ha}, {surface: Men, lexeme: men}, {surface: har, lexeme: har}, {surface: kuni, lexemes: [{lexeme: kun, surface: kun, base: true}, {lexeme: poss-3, surface: i}]}, {surface: ishlayman, lexemes: [{lexeme: ishlamoq, surface: ishla, base: true}, {lexeme: pres, surface: y}, {lexeme: cop-1sg, surface: man}]}]
        uz-Cyrl/standard:
          text: Ҳа. Мен ҳар куни ишлайман.
          tokens: [{surface: Ҳа, lexeme: ha}, {surface: Мен, lexeme: men}, {surface: ҳар, lexeme: har}, {surface: куни, lexemes: [{lexeme: kun, surface: кун, base: true}, {lexeme: poss-3, surface: и}]}, {surface: ишлайман, lexemes: [{lexeme: ishlamoq, surface: ишла, base: true}, {lexeme: pres, surface: й}, {lexeme: cop-1sg, surface: ман}]}]
      translations:
        en: Yes. I work every day.
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Shanba kuni ham ishlaysizmi?
          tokens: [{surface: Shanba, lexeme: shanba}, {surface: kuni, lexemes: [{lexeme: kun, surface: kun, base: true}, {lexeme: poss-3, surface: i}]}, {surface: ham, lexeme: ham}, {surface: ishlaysizmi, lexemes: [{lexeme: ishlamoq, surface: ishla, base: true}, {lexeme: pres, surface: y}, {lexeme: cop-2, surface: siz}, {lexeme: q, surface: mi}]}]
        uz-Cyrl/standard:
          text: Шанба куни ҳам ишлайсизми?
          tokens: [{surface: Шанба, lexeme: shanba}, {surface: куни, lexemes: [{lexeme: kun, surface: кун, base: true}, {lexeme: poss-3, surface: и}]}, {surface: ҳам, lexeme: ham}, {surface: ишлайсизми, lexemes: [{lexeme: ishlamoq, surface: ишла, base: true}, {lexeme: pres, surface: й}, {lexeme: cop-2, surface: сиз}, {lexeme: q, surface: ми}]}]
      translations:
        en: Do you work on Saturday too?
  - line:
      speaker: bobur
      forms:
        uz-Latn/standard:
          text: Yoʻq, shanba va yakshanba kuni dam olaman.
          tokens: [{surface: Yoʻq, lexeme: yoq}, {surface: shanba, lexeme: shanba}, {surface: va, lexeme: va}, {surface: yakshanba, lexeme: yakshanba}, {surface: kuni, lexemes: [{lexeme: kun, surface: kun, base: true}, {lexeme: poss-3, surface: i}]}, {surface: dam, lexeme: dam}, {surface: olaman, lexemes: [{lexeme: olmoq, surface: ol, base: true}, {lexeme: pres, surface: a}, {lexeme: cop-1sg, surface: man}]}]
        uz-Cyrl/standard:
          text: Йўқ, шанба ва якшанба куни дам оламан.
          tokens: [{surface: Йўқ, lexeme: yoq}, {surface: шанба, lexeme: shanba}, {surface: ва, lexeme: va}, {surface: якшанба, lexeme: yakshanba}, {surface: куни, lexemes: [{lexeme: kun, surface: кун, base: true}, {lexeme: poss-3, surface: и}]}, {surface: дам, lexeme: dam}, {surface: оламан, lexemes: [{lexeme: olmoq, surface: ол, base: true}, {lexeme: pres, surface: а}, {lexeme: cop-1sg, surface: ман}]}]
      translations:
        en: No, on Saturday and Sunday I rest.
  - choose:
      prompt:
        en: When does Bobur rest?
      options:
      - en: on Saturday and Sunday
      - en: every day
      - en: on Monday
      answer: 0
  - line:
      speaker: malika
      forms:
