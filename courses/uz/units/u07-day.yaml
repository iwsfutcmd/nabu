          text: Соат еттида. Кейин нонушта қиламан.
          tokens: [{surface: Соат, sense: soat}, {surface: еттида, sense: yetti, morphs: [{surface: етти, kc: 'sense:yetti'}, {surface: да, kc: 'form:loc-da'}]}, {surface: Кейин, sense: keyin}, {surface: нонушта, sense: nonushta}, {surface: қиламан, sense: qilmoq, morphs: [{surface: қил, kc: 'sense:qilmoq'}, {surface: а, kc: 'form:pres-a'}, {surface: ман, kc: 'form:cop-1sg-man'}]}]
