# Unit 7 (uz): daily routine and time; the present-future tense on more verbs (turaman, ishlayman, oʻqiyman),
# soat necha?, -dan ... -gacha, the days of the week, and -yap for what is happening right now.
# Drafted by an LLM (provenance llm:..., status draft): every sentence awaits review by a native speaker.
id: day
title: {en: My day and my week}
cefr: A1
kcs:
- {id: 'sense:ertalab', gloss: {en: in the morning}, forms: {uz-Latn/standard: [ertalab], uz-Cyrl/standard: [эрталаб]}, image: {file: ../images/sunrise.svg, license: CC0-1.0, provenance: {author: 'llm:claude@6e8439dc1c29', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:turmoq', gloss: {en: to get up; to stand}, forms: {uz-Latn/standard: [turaman, turasiz, turdim], uz-Cyrl/standard: [тураман, турасиз, турдим]}}
- {id: 'sense:soat', gloss: {en: 'hour; o''clock; clock, watch'}, forms: {uz-Latn/standard: [soat], uz-Cyrl/standard: [соат]}, notes: {en: 'Soat necha? What time is it? Soat yettida: at seven o''clock.'}}
- {id: 'sense:qilmoq', gloss: {en: 'to do, to make'}, forms: {uz-Latn/standard: [qilasiz, qilaman, qilamiz, qilyapsiz, qiling, qildingiz, qildim, qilmoqchiman], uz-Cyrl/standard: [қиласиз, қиламан, қиламиз, қиляпсиз, қилинг, қилдингиз, қилдим, қилмоқчиман]}, notes: {en: 'Many verbs are a noun + qilmoq: nonushta qilmoq, telefon qilmoq.'}}
- {id: 'sense:nonushta', gloss: {en: breakfast}, forms: {uz-Latn/standard: [nonushta], uz-Cyrl/standard: [нонушта]}, notes: {en: 'Nonushta qilmoq: to have breakfast.'}}
- {id: 'sense:ishlamoq', gloss: {en: to work}, forms: {uz-Latn/standard: [ishlayman, ishlaysiz, ishlaysizmi, ishlamadim], uz-Cyrl/standard: [ишлайман, ишлайсиз, ишлайсизми, ишламадим]}}
- {id: 'form:term-gacha', gloss: {en: '-gacha: until, up to, as far as'}, notes: {en: 'Toʻqqizdan beshgacha: from nine to five.'}}
- {id: 'sense:tushlik', gloss: {en: lunch}, forms: {uz-Latn/standard: [tushlik], uz-Cyrl/standard: [тушлик]}, notes: {en: 'Tushlik qilmoq: to have lunch.'}}
- {id: 'sense:kechqurun', gloss: {en: in the evening}, forms: {uz-Latn/standard: [kechqurun], uz-Cyrl/standard: [кечқурун]}}
- {id: 'sense:oqimoq', gloss: {en: to read; to study}, forms: {uz-Latn/standard: [oʻqiyman, oʻqiyapman, oʻqidim], uz-Cyrl/standard: [ўқийман, ўқияпман, ўқидим]}}
- {id: 'sense:uxlamoq', gloss: {en: to sleep}, forms: {uz-Latn/standard: [uxlayman, uxlayapti, uxlaysiz, uxladim], uz-Cyrl/standard: [ухлайман, ухлаяпти, ухлайсиз, ухладим]}}
- {id: 'sense:bugun', gloss: {en: today}, forms: {uz-Latn/standard: [bugun], uz-Cyrl/standard: [бугун]}}
- {id: 'sense:kun', gloss: {en: day}, forms: {uz-Latn/standard: [kun, kuni], uz-Cyrl/standard: [кун, куни]}}
- {id: 'sense:har', gloss: {en: 'every, each'}, forms: {uz-Latn/standard: [har], uz-Cyrl/standard: [ҳар]}, notes: {en: 'Har kuni: every day.'}}
- {id: 'sense:dushanba', gloss: {en: Monday}, forms: {uz-Latn/standard: [dushanba], uz-Cyrl/standard: [душанба]}}
- {id: 'sense:ertaga', gloss: {en: tomorrow}, forms: {uz-Latn/standard: [ertaga], uz-Cyrl/standard: [эртага]}}
- {id: 'sense:seshanba', gloss: {en: Tuesday}, forms: {uz-Latn/standard: [seshanba], uz-Cyrl/standard: [сешанба]}}
- {id: 'sense:chorshanba', gloss: {en: Wednesday}, forms: {uz-Latn/standard: [chorshanba], uz-Cyrl/standard: [чоршанба]}, notes: {en: 'Chorshanba kuni: on Wednesday.'}}
- {id: 'sense:payshanba', gloss: {en: Thursday}, forms: {uz-Latn/standard: [payshanba], uz-Cyrl/standard: [пайшанба]}}
- {id: 'sense:juma', gloss: {en: Friday}, forms: {uz-Latn/standard: [juma], uz-Cyrl/standard: [жума]}}
- {id: 'sense:dam', gloss: {en: rest}, forms: {uz-Latn/standard: [dam], uz-Cyrl/standard: [дам]}, notes: {en: 'Dam olmoq: to rest, to have time off.'}}
- {id: 'sense:shanba', gloss: {en: Saturday}, forms: {uz-Latn/standard: [shanba], uz-Cyrl/standard: [шанба]}}
- {id: 'sense:yakshanba', gloss: {en: Sunday}, forms: {uz-Latn/standard: [yakshanba], uz-Cyrl/standard: [якшанба]}}
- {id: 'sense:hafta', gloss: {en: week}, forms: {uz-Latn/standard: [hafta, haftada], uz-Cyrl/standard: [ҳафта, ҳафтада]}}
- {id: 'sense:hozir', gloss: {en: now}, forms: {uz-Latn/standard: [hozir], uz-Cyrl/standard: [ҳозир]}}
- {id: 'form:prog-yap', gloss: {en: '-yap: right now (present continuous)'}, notes: {en: 'Nima qilyapsiz? What are you doing? Kitob oʻqiyapman: I am reading. He/she: -yapti.'}}
