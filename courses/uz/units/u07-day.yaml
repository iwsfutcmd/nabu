# Unit 7 (uz): daily routine and time; the present-future tense on more verbs (turaman, ishlayman, oʻqiyman),
# soat necha?, -dan ... -gacha, the days of the week, and -yap for what is happening right now.
# Drafted by an LLM (provenance llm:..., status draft): every sentence awaits review by a native speaker.
id: day
title:
  en: My day and my week
cefr: A1
nodes:
- {id: uz.day.morning, kind: lesson, introduces: ['lexeme:ertalab', 'lexeme:turmoq', 'lexeme:soat', 'lexeme:qilmoq', 'lexeme:nonushta']}
- {id: uz.day.work, kind: lesson, introduces: ['lexeme:ishlamoq', 'lexeme:term', 'lexeme:tushlik']}
- {id: uz.day.evening, kind: lesson, introduces: ['lexeme:kechqurun', 'lexeme:oqimoq', 'lexeme:uxlamoq', 'lexeme:bugun', 'lexeme:kun', 'lexeme:har']}
- {id: uz.day.week, kind: lesson, introduces: ['lexeme:dushanba', 'lexeme:ertaga', 'lexeme:seshanba', 'lexeme:chorshanba', 'lexeme:payshanba', 'lexeme:juma']}
- {id: uz.day.weekend, kind: lesson, introduces: ['lexeme:dam', 'lexeme:shanba', 'lexeme:yakshanba', 'lexeme:hafta']}
- {id: uz.day.now, kind: lesson, introduces: ['lexeme:hozir', 'lexeme:prog']}
- {id: uz.day.story, kind: story}
