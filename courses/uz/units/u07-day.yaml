  - line:
      speaker: bobur
      ask: complete
      gap: sense:har
      distractors: ['sense:ertaga', 'sense:hozir']
      forms:
        uz-Latn/standard:
          text: Ha. Men har kuni ishlayman.
          tokens: [{surface: Ha, sense: ha}, {surface: Men, sense: men}, {surface: har, sense: har}, {surface: kuni, sense: kun, morphs: [{surface: kun, kc: 'sense:kun'}, {surface: i, kc: 'form:poss-3-si'}]}, {surface: ishlayman, sense: ishlamoq, morphs: [{surface: ishla, kc: 'sense:ishlamoq'}, {surface: y, kc: 'form:pres-a'}, {surface: man, kc: 'form:cop-1sg-man'}]}]
        uz-Cyrl/standard:
          text: Ҳа. Мен ҳар куни ишлайман.
          tokens: [{surface: Ҳа, sense: ha}, {surface: Мен, sense: men}, {surface: ҳар, sense: har}, {surface: куни, sense: kun, morphs: [{surface: кун, kc: 'sense:kun'}, {surface: и, kc: 'form:poss-3-si'}]}, {surface: ишлайман, sense: ishlamoq, morphs: [{surface: ишла, kc: 'sense:ishlamoq'}, {surface: й, kc: 'form:pres-a'}, {surface: ман, kc: 'form:cop-1sg-man'}]}]
      translations: {en: Yes. I work every day.}
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Shanba kuni ham ishlaysizmi?
