      translations: {en: 'Do you work on Saturday too?'}
  - line:
      speaker: bobur
      forms:
        uz-Latn/standard:
          text: Yoʻq, shanba va yakshanba kuni dam olaman.
          tokens: [{surface: Yoʻq, sense: yoq}, {surface: shanba, sense: shanba}, {surface: va, sense: va}, {surface: yakshanba, sense: yakshanba}, {surface: kuni, sense: kun, morphs: [{surface: kun, kc: 'sense:kun'}, {surface: i, kc: 'form:poss-3-si'}]}, {surface: dam, sense: dam}, {surface: olaman, sense: olmoq, morphs: [{surface: ol, kc: 'sense:olmoq'}, {surface: a, kc: 'form:pres-a'}, {surface: man, kc: 'form:cop-1sg-man'}]}]
