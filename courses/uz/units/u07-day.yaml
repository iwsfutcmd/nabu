  - line:
      speaker: malika
      ask: arrange
      forms:
        uz-Latn/standard:
          text: Men soat sakkizda turaman!
          tokens: [{surface: Men, sense: men}, {surface: soat, sense: soat}, {surface: sakkizda, sense: sakkiz, morphs: [{surface: sakkiz, kc: 'sense:sakkiz'}, {surface: da, kc: 'form:loc-da'}]}, {surface: turaman, sense: turmoq, morphs: [{surface: tur, kc: 'sense:turmoq'}, {surface: a, kc: 'form:pres-a'}, {surface: man, kc: 'form:cop-1sg-man'}]}]
