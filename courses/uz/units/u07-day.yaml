          text: Эртага ишга борасизми?
          tokens: [{surface: Эртага, sense: ertaga}, {surface: ишга, sense: ish, morphs: [{surface: иш, kc: 'sense:ish'}, {surface: га, kc: 'form:dat-ga'}]}, {surface: борасизми, sense: bormoq, morphs: [{surface: бор, kc: 'sense:bormoq'}, {surface: а, kc: 'form:pres-a'}, {surface: сиз, kc: 'form:cop-2-siz'}, {surface: ми, kc: 'form:q-mi'}]}]
