          tokens: [{surface: Йўқ, sense: yoq}, {surface: шанба, sense: shanba}, {surface: ва, sense: va}, {surface: якшанба, sense: yakshanba}, {surface: куни, sense: kun, morphs: [{surface: кун, kc: 'sense:kun'}, {surface: и, kc: 'form:poss-3-si'}]}, {surface: дам, sense: dam}, {surface: оламан, sense: olmoq, morphs: [{surface: ол, kc: 'sense:olmoq'}, {surface: а, kc: 'form:pres-a'}, {surface: ман, kc: 'form:cop-1sg-man'}]}]
      translations: {en: 'No, on Saturday and Sunday I rest.'}
  - choose:
      prompt: {en: 'When does Bobur rest?'}
      options: [{en: on Saturday and Sunday}, {en: every day}, {en: on Monday}]
      answer: 0
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Soat nechada turasiz?
