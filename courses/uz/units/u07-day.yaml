          tokens: [{surface: Kitob, sense: kitob}, {surface: oʻqiyapman, sense: oqimoq, morphs: [{surface: oʻqi, kc: 'sense:oqimoq'}, {surface: yap, kc: 'form:prog-yap'}, {surface: man, kc: 'form:cop-1sg-man'}]}]
