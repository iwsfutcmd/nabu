  - line:
      speaker: bobur
      forms:
        uz-Latn/standard:
          text: Siz juda koʻp uxlaysiz!
          tokens: [{surface: Siz, sense: siz}, {surface: juda, sense: juda}, {surface: koʻp, sense: kop}, {surface: uxlaysiz, sense: uxlamoq, morphs: [{surface: uxla, kc: 'sense:uxlamoq'}, {surface: y, kc: 'form:pres-a'}, {surface: siz, kc: 'form:cop-2-siz'}]}]
