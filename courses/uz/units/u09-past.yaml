      speaker: malika
      forms:
        uz-Latn/standard:
          text: Samarqandgami? Nima qildingiz?
          tokens: [{surface: Samarqandgami, lexemes: [{lexeme: samarqand, surface: Samarqand, base: true}, {lexeme: dat, surface: ga}, {lexeme: q, surface: mi}]}, {surface: Nima, lexemes: [{lexeme: nima, base: true}, {lexeme: nom}]}, {surface: qildingiz, lexemes: [{lexeme: qilmoq, surface: qil, base: true}, {lexeme: past, surface: di}, {lexeme: past-2, surface: ngiz}]}]
