- id: uz.story.past
  node: uz.past.story
  title:
    en: A day in Samarkand
  provenance:
    author: llm:claude@887599f213ef
    status: draft
  characters:
  - id: malika
    name:
      uz-Latn/standard: Malika
      uz-Cyrl/standard: Малика
  - id: aziz
    name:
      uz-Latn/standard: Aziz
      uz-Cyrl/standard: Азиз
  steps:
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Aziz, kecha qayerda edingiz?
          tokens: [{surface: Aziz, lexemes: [{lexeme: aziz, base: true}, {lexeme: nom}]}, {surface: kecha, lexeme: kecha}, {surface: qayerda, lexemes: [{lexeme: qayer, surface: qayer, base: true}, {lexeme: loc, surface: da}]}, {surface: edingiz, lexemes: [{lexeme: edi, surface: e, base: true}, {lexeme: past, surface: di}, {lexeme: past-2, surface: ngiz}]}]
