          text: Kecha Samarqandga bordim.
          tokens: [{surface: Kecha, lexeme: kecha}, {surface: Samarqandga, lexemes: [{lexeme: samarqand, surface: Samarqand, base: true}, {lexeme: dat, surface: ga}]}, {surface: bordim, lexemes: [{lexeme: bormoq, surface: bor, base: true}, {lexeme: past, surface: di}, {lexeme: past-1sg, surface: m}]}]
        uz-Cyrl/standard:
          text: Кеча Самарқандга бордим.
          tokens: [{surface: Кеча, lexeme: kecha}, {surface: Самарқандга, lexemes: [{lexeme: samarqand, surface: Самарқанд, base: true}, {lexeme: dat, surface: га}]}, {surface: бордим, lexemes: [{lexeme: bormoq, surface: бор, base: true}, {lexeme: past, surface: ди}, {lexeme: past-1sg, surface: м}]}]
