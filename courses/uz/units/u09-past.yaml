# Unit 9 (uz): the past tense -di with its person endings (keldim, keldingiz, keldi, keldik) and its negative
# (tushunmadim); kecha, oʻtgan hafta, qachon?; everyday past forms (charchadim, toʻydim); edi "was".
# Drafted by an LLM (provenance llm:..., status draft): every sentence awaits review by a native speaker.
