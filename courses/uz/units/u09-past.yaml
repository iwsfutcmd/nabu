          tokens: [{surface: Азиз, lexemes: [{lexeme: aziz, base: true}, {lexeme: nom}]}, {surface: кеча, lexeme: kecha}, {surface: қаерда, lexemes: [{lexeme: qayer, surface: қаер, base: true}, {lexeme: loc, surface: да}]}, {surface: эдингиз, lexemes: [{lexeme: edi, surface: э, base: true}, {lexeme: past, surface: ди}, {lexeme: past-2, surface: нгиз}]}]
