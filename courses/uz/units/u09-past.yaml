          tokens: [{surface: Doʻstim, lexemes: [{lexeme: dost, surface: Doʻst, base: true}, {lexeme: poss-1sg, surface: im}, {lexeme: nom}]}, {surface: bilan, lexeme: bilan}, {surface: uchrashdim, lexemes: [{lexeme: uchrashmoq, surface: uchrash, base: true}, {lexeme: past, surface: di}, {lexeme: past-1sg, surface: m}]}]
