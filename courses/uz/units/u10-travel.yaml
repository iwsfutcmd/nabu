# Unit 10 (uz): the weather and the seasons (havo qanday?, yomgʻir yogʻyapti, yozda), and travel plans: trains and
# tickets, a hotel, -moqchi for plans, and talking about a trip afterwards (qanday oʻtdi?).
# Drafted by an LLM (provenance llm:..., status draft): every sentence awaits review by a native speaker.
id: travel
title: {en: Weather and travel}
cefr: A2
kcs:
- {id: 'sense:havo', gloss: {en: weather; air}, forms: {uz-Latn/standard: [havo], uz-Cyrl/standard: [ҳаво]}}
- {id: 'sense:qanday', gloss: {en: how; what kind of}, forms: {uz-Latn/standard: [qanday], uz-Cyrl/standard: [қандай]}, notes: {en: 'Havo qanday? What is the weather like?'}}
