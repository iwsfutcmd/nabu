stories:
- id: uz.story.travel
  node: uz.travel.story
  title: {en: A trip to Bukhara}
  provenance: {author: 'llm:claude@887599f213ef', status: draft}
  characters:
  - {id: malika, name: {uz-Latn/standard: Malika, uz-Cyrl/standard: Малика}}
  - {id: aziz, name: {uz-Latn/standard: Aziz, uz-Cyrl/standard: Азиз}}
  - {id: buvi, name: {uz-Latn/standard: Buvi, uz-Cyrl/standard: Буви}}
  steps:
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Aziz, kelasi hafta Buxoroga bormoqchiman.
          tokens: [{surface: Aziz, sense: aziz}, {surface: kelasi, sense: kelasi}, {surface: hafta, sense: hafta}, {surface: Buxoroga, sense: buxoro, morphs: [{surface: Buxoro, kc: 'sense:buxoro'}, {surface: ga, kc: 'form:dat-ga'}]}, {surface: bormoqchiman, sense: bormoq, morphs: [{surface: bor, kc: 'sense:bormoq'}, {surface: moqchi, kc: 'form:want-moqchi'}, {surface: man, kc: 'form:cop-1sg-man'}]}]
