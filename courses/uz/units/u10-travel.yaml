      ask: complete
      gap: sense:qanday
      distractors: ['sense:kim', 'sense:necha']
      forms:
        uz-Latn/standard:
          text: Buxoroda havo qanday?
          tokens: [{surface: Buxoroda, sense: buxoro, morphs: [{surface: Buxoro, kc: 'sense:buxoro'}, {surface: da, kc: 'form:loc-da'}]}, {surface: havo, sense: havo}, {surface: qanday, sense: qanday}]
        uz-Cyrl/standard:
          text: Бухорода ҳаво қандай?
          tokens: [{surface: Бухорода, sense: buxoro, morphs: [{surface: Бухоро, kc: 'sense:buxoro'}, {surface: да, kc: 'form:loc-da'}]}, {surface: ҳаво, sense: havo}, {surface: қандай, sense: qanday}]
      translations: {en: 'What is the weather like in Bukhara?'}
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Hozir juda issiq. Yozda Buxoroda havo issiq.
          tokens: [{surface: Hozir, sense: hozir}, {surface: juda, sense: juda}, {surface: issiq, sense: issiq}, {surface: Yozda, sense: yoz, morphs: [{surface: Yoz, kc: 'sense:yoz'}, {surface: da, kc: 'form:loc-da'}]}, {surface: Buxoroda, sense: buxoro, morphs: [{surface: Buxoro, kc: 'sense:buxoro'}, {surface: da, kc: 'form:loc-da'}]}, {surface: havo, sense: havo}, {surface: issiq, sense: issiq}]
