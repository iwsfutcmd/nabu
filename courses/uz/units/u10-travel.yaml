          tokens: [{surface: Азиз, sense: aziz}, {surface: келаси, sense: kelasi}, {surface: ҳафта, sense: hafta}, {surface: Бухорога, sense: buxoro, morphs: [{surface: Бухоро, kc: 'sense:buxoro'}, {surface: га, kc: 'form:dat-ga'}]}, {surface: бормоқчиман, sense: bormoq, morphs: [{surface: бор, kc: 'sense:bormoq'}, {surface: моқчи, kc: 'form:want-moqchi'}, {surface: ман, kc: 'form:cop-1sg-man'}]}]
      translations: {en: 'Aziz, I want to go to Bukhara next week.'}
  - line:
      speaker: aziz
      forms:
        uz-Latn/standard:
          text: Juda yaxshi! Poyezddami?
          tokens: [{surface: Juda, sense: juda}, {surface: yaxshi, sense: yaxshi}, {surface: Poyezddami, sense: poyezd, morphs: [{surface: Poyezd, kc: 'sense:poyezd'}, {surface: da, kc: 'form:loc-da'}, {surface: mi, kc: 'form:q-mi'}]}]
        uz-Cyrl/standard:
          text: Жуда яхши! Поезддами?
          tokens: [{surface: Жуда, sense: juda}, {surface: яхши, sense: yaxshi}, {surface: Поезддами, sense: poyezd, morphs: [{surface: Поезд, kc: 'sense:poyezd'}, {surface: да, kc: 'form:loc-da'}, {surface: ми, kc: 'form:q-mi'}]}]
      translations: {en: 'Great! By train?'}
  - line:
      speaker: malika
      forms:
        uz-Latn/standard:
          text: Ha, poyezdda. Bilet arzon.
          tokens: [{surface: Ha, sense: ha}, {surface: poyezdda, sense: poyezd, morphs: [{surface: poyezd, kc: 'sense:poyezd'}, {surface: da, kc: 'form:loc-da'}]}, {surface: Bilet, sense: bilet}, {surface: arzon, sense: arzon}]
        uz-Cyrl/standard:
          text: Ҳа, поездда. Билет арзон.
          tokens: [{surface: Ҳа, sense: ha}, {surface: поездда, sense: poyezd, morphs: [{surface: поезд, kc: 'sense:poyezd'}, {surface: да, kc: 'form:loc-da'}]}, {surface: Билет, sense: bilet}, {surface: арзон, sense: arzon}]
