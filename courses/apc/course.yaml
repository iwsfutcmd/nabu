# Fixture course (apc): North Levantine Arabic (Beirut speech). Learners pick Arabic script or Arabizi; a script-convert node teaches 7, 3 and 2.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: apc
target: apc-Arab-LB
orthographies:
- apc-Arab/standard
- apc-Latn/arabizi
support:
- en-Latn/standard
lexicon: apc
variety: apc-LB
registers:
- colloquial
# What the app calls the course and its orthographies, and what the course list says of them, by
# language (ADR 0109).
names:
  en:
    course: Lebanese Arabic
    blurb: The Arabic of Lebanon, as people speak it every day.
    orthographies:
      apc-Arab/standard: Arabic script
      apc-Latn/arabizi: Arabizi (Latin letters and numbers)
    hints:
      apc-Arab/standard: Arabic letters, right to left, with vowel marks to help you read.
      apc-Latn/arabizi: Latin letters and digits, as many Lebanese write in messages.
  # The other languages' names are an LLM's drafts, made for the draft UI catalogs (ADR 0070), and
  # await review as those do.
  ar:
    course: العربية اللبنانية
    orthographies:
      apc-Arab/standard: الحروف العربية
      apc-Latn/arabizi: العربيزي (حروف لاتينية وأرقام)
    provenance:
      author: llm:claude@baa6bf1d5e24
      status: draft
  fa:
    course: عربی لبنانی
    orthographies:
      apc-Arab/standard: خط عربی
      apc-Latn/arabizi: عربیزی (حروف و اعداد لاتین)
    provenance:
      author: llm:claude@baa6bf1d5e24
      status: draft
  uz:
    course: Livan arab tili
    orthographies:
      apc-Arab/standard: Arab yozuvi
      apc-Latn/arabizi: Arabizi (lotin harflari va raqamlar)
    provenance:
      author: llm:claude@baa6bf1d5e24
      status: draft
  uz-Cyrl:
    course: Ливан араб тили
    orthographies:
      apc-Arab/standard: Араб ёзуви
      apc-Latn/arabizi: Арабизи (лотин ҳарфлари ва рақамлар)
    provenance:
      author: llm:claude@baa6bf1d5e24
      status: draft
  zh-Hant-HK:
    course: 黎巴嫩阿拉伯語
    orthographies:
      apc-Arab/standard: 阿拉伯字母
      apc-Latn/arabizi: Arabizi（拉丁字母和數字）
    provenance:
      author: llm:claude@baa6bf1d5e24
      status: draft
license: CC-BY-SA-4.0
provenance:
  author: llm:claude@6914f241714e
  status: draft
# Every reading is fixed by its word's spelling, sense, form and morphs (ADR 0135): one read otherwise is an error.
consistentReadings: true
# A noun pins its gender and number (ADR 0132 amendment): a new feminine or plural noun is two KCs on
# one word (sense + form), so a sentence may bring in two.
iPlusOne: 2
# The course asks words by their parts (ADR 0152): a word built from its own word and the forms it
# carries (parts-whole), and a word's parts picked out (whole-parts). REVIEW: the forms its tokens
# carry, and the glossary entries that name them, have not been checked for this by a reader.
wordParts: true
