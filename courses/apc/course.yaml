# Fixture course (apc): North Levantine Arabic (Beirut speech). Learners pick Arabic script or Arabizi; a script-convert node teaches 7, 3 and 2.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: apc
target: apc-Arab-LB
orthographies: [apc-Arab/standard, apc-Latn/arabizi]
support: [en-Latn/standard]
# What the app calls the course and its orthographies, and what the course list says of them, by
# language (ADR 0109).
names:
  en:
    course: Lebanese Arabic
    blurb: "The Arabic of Lebanon, as people speak it every day."
    orthographies:
      apc-Arab/standard: Arabic script
      apc-Latn/arabizi: "Arabizi (Latin letters and numbers)"
    hints:
      apc-Arab/standard: "Arabic letters, right to left, with vowel marks to help you read."
      apc-Latn/arabizi: "Latin letters and digits, as many Lebanese write in messages."
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@6914f241714e', status: draft}
units: [units/intro.yaml, units/u02-family.yaml, units/u03-food.yaml, units/u04-home.yaml, units/u05-numbers.yaml, units/u06-day.yaml, units/u07-likes.yaml, units/u08-time.yaml, units/u09-past.yaml, units/u10-plans.yaml, units/u11-people.yaml, units/u12-trip.yaml, units/u13-health.yaml, units/u14-phone.yaml, units/u15-shopping.yaml, units/u16-dates.yaml, units/u17-childhood.yaml, units/u18-getting-around.yaml, units/u19-work.yaml, units/u20-celebrations.yaml]
# Vowel marks (ADR 0053): the compiler marks each Arabic-script word from vocalization.yaml; Arabizi is untouched.
vocalization: [vocalization.yaml]
# Audio (§10.1, ADR 0058): a synthetic Beirut voice, Lahgtna on OmniVoice, reading the vowel-marked Arabic
# and cloning a reference (`nabu audio cast`). Two voices, a man's and a woman's: each item gets one at random
# (seeded by its id), and a sentence or story character whose grammar says who speaks gets that one (ADR 0078).
# The model's weights are CC-BY-NC (OmniVoice's training data), so its clips are too.
audio:
  # ADR 0091: a voice made for the language (Lahgtna): clips play everywhere, listening exercises included.
  quality: good
  voices:
  - {id: beirut, provider: omnivoice, voice: beirut-m, speaker: m, model: 'oddadmix/lahgtna-omnivoice-v2@55c38a613e316499829eef60b006edc6da9499e2',
    language: lb, orthography: apc-Arab/standard, reading: text, vowelMarks: true, license: CC-BY-NC-4.0}
  - {id: beirut-f, provider: omnivoice, voice: beirut-f, speaker: f, model: 'oddadmix/lahgtna-omnivoice-v2@55c38a613e316499829eef60b006edc6da9499e2',
    language: lb, orthography: apc-Arab/standard, reading: text, vowelMarks: true, license: CC-BY-NC-4.0}
