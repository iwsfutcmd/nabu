# Fixture course (apc): North Levantine Arabic (Beirut speech). Learners pick Arabic script or Arabizi; a script-convert node teaches 7, 3 and 2.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: apc
target: apc-Arab-LB
orthographies: [apc-Arab/standard, apc-Latn/arabizi]
support: [en-Latn/standard]
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@6914f241714e', status: draft}
units: [units/intro.yaml, units/u02-family.yaml, units/u03-food.yaml, units/u04-home.yaml, units/u05-numbers.yaml, units/u06-day.yaml, units/u07-likes.yaml, units/u08-time.yaml, units/u09-past.yaml, units/u10-plans.yaml]
# Vowel marks (ADR 0053): the compiler marks each Arabic-script word from vocalization.yaml; Arabizi is untouched.
vocalization: [vocalization.yaml]
# Audio (§10.1, ADR 0058): a synthetic Beirut voice, Lahgtna on OmniVoice, reading the vowel-marked Arabic
# and cloning one reference (`nabu audio cast`). A man's voice (`speaker: m`): a sentence a woman says gets no
# clip from it (ADR 0075) until a woman's voice is cast.
# The model's weights are CC-BY-NC (OmniVoice's training data), so its clips are too.
audio:
  voices:
  - {id: beirut, provider: omnivoice, voice: beirut-m, speaker: m, model: 'oddadmix/lahgtna-omnivoice-v2@55c38a613e316499829eef60b006edc6da9499e2',
    language: lb, orthography: apc-Arab/standard, reading: text, vowelMarks: true, license: CC-BY-NC-4.0}
