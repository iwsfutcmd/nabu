stories:
- id: apc.story.sea-or-mountain
  node: apc.like.story
  title:
    en: Sea or mountains?
  provenance:
    author: llm:claude@6914f241714e
    status: draft
  characters:
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي، بْتْحِبّ البَحِر؟
          tokens: [{surface: سامي, lexeme: sami, feats: {Number: Sing}}, {surface: بْتْحِبّ, lexeme: 7abb, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {surface: البَحِر, lexemes: [{lexeme: el, surface: ال, n: 3, head: 4, rel: det}, {lexeme: ba7r, surface: بَحِر, base: true, feats: {Number: Sing}, n: 4}]}]
        apc-Latn/arabizi:
          text: Sami, bt7ebb el ba7r?
          tokens: [{surface: Sami, lexeme: sami, feats: {Number: Sing}}, {surface: bt7ebb, lexeme: 7abb, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {surface: el, lexeme: el}, {surface: ba7r, lexeme: ba7r, feats: {Number: Sing}}]
      translations:
        en: Sami, do you like the sea?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: لأ، ما بْحِبّ البَحِر أَبَداً. بْحِبّ الجَبَل.
          tokens: [{surface: لأ, lexeme: la2}, {surface: ما, lexeme: ma}, {surface: بْحِبّ, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: البَحِر, lexemes: [{lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: ba7r, surface: بَحِر, base: true, feats: {Number: Sing}, n: 5}]}, {surface: أَبَداً, lexeme: abadan}, {surface: بْحِبّ, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: الجَبَل, lexemes: [{lexeme: el, surface: ال, n: 8, head: 9, rel: det}, {lexeme: jabal, surface: جَبَل, base: true, feats: {Number: Sing}, n: 9}]}]
        apc-Latn/arabizi:
          text: la2, ma b7ebb el ba7r abadan. b7ebb el jabal.
          tokens: [{surface: la2, lexeme: la2}, {surface: ma, lexeme: ma}, {surface: b7ebb, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: el, lexeme: el}, {surface: ba7r, lexeme: ba7r, feats: {Number: Sing}}, {surface: abadan, lexeme: abadan}, {surface: b7ebb, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: el, lexeme: el}, {surface: jabal, lexeme: jabal, feats: {Number: Sing}}]
      translations:
        en: No, I don't like the sea at all. I like the mountains.
  - line:
      speaker: maya
      ask: complete
      gap: lexeme:7abb
      distractors:
      - lexeme:akal
      - lexeme:shereb
      forms:
        apc-Arab/standard:
          text: أَنا بْحِبّ البَحِر أَكْتَر!
          tokens: [{surface: أَنا, lexeme: ana}, {surface: بْحِبّ, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: البَحِر, lexemes: [{lexeme: el, surface: ال, n: 3, head: 4, rel: det}, {lexeme: ba7r, surface: بَحِر, base: true, feats: {Number: Sing}, n: 4}]}, {surface: أَكْتَر, lexeme: aktar}]
        apc-Latn/arabizi:
          text: ana b7ebb el ba7r aktar!
          tokens: [{surface: ana, lexeme: ana}, {surface: b7ebb, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: el, lexeme: el}, {surface: ba7r, lexeme: ba7r, feats: {Number: Sing}}, {surface: aktar, lexeme: aktar}]
      translations:
        en: I like the sea more!
  - choose:
      prompt:
        en: What does Sami like?
      options:
      - en: The mountains
      - en: The sea
      - en: Football
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وشو بْتْحِبّي كَمان؟
          tokens: [{surface: وشو, lexemes: [{lexeme: w, surface: و}, {lexeme: shu, surface: شو, base: true}]}, {surface: بْتْحِبّي, lexeme: 7abb, feats: {Aspect: Imp, Gender: Fem, Mood: Ind, Number: Sing, Person: '2'}}, {surface: كَمان, lexeme: kamen}]
        apc-Latn/arabizi:
          text: w shu bt7ebbi kamen?
          tokens: [{surface: w, lexeme: w}, {surface: shu, lexeme: shu}, {surface: bt7ebbi, lexeme: 7abb, feats: {Aspect: Imp, Gender: Fem, Mood: Ind, Number: Sing, Person: '2'}}, {surface: kamen, lexeme: kamen}]
      translations:
        en: And what else do you like?
  - line:
      speaker: maya
      forms:
