scenarios:
- id: apc.new-friend
  after: apc.like.story
  title:
    en: Getting to know someone
  setting:
    en: A friend's birthday get-together at a café in Mar Mikhael, Beirut. You are sitting next to someone you have just met.
  character:
    en: Nour, a friendly guest who loves music, the sea and football, and is curious about you.
  goal:
    en: Ask Nour what she likes and doesn't like, say what you like (food, music, the sea or the mountains, films, football), and suggest something to do together.
  provenance:
    author: llm:claude@6914f241714e
    status: draft
