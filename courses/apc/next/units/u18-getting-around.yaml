      translations:
        en: Hello Sami, where are you?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: أَنا بِالسِّرْفيس، جاي.
          tokens: [{surface: أَنا, lexeme: ana}, {surface: بِالسِّرْفيس, lexemes: [{lexeme: b, surface: بِ, n: 2, head: 4, rel: case}, {lexeme: el, surface: ال, n: 3, head: 4, rel: det}, {lexeme: servees, surface: سِّرْفيس, base: true, feats: {Number: Sing}, n: 4}]}, {surface: جاي, lexeme: jeye, feats: {Gender: Masc, Number: Sing}}]
        apc-Latn/arabizi:
          text: ana bel servees, jey.
          tokens: [{surface: ana, lexeme: ana}, {surface: bel, lexemes: [{lexeme: b, surface: b, base: true, n: 2, head: 4, rel: case}, {lexeme: el, surface: el, n: 3, head: 4, rel: det}]}, {surface: servees, lexeme: servees, feats: {Number: Sing}, n: 4}, {surface: jey, lexeme: jeye, feats: {Gender: Masc, Number: Sing}}]
      translations:
        en: I'm in the service, I'm coming.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: في عَجْقَة؟
          tokens: [{surface: في, lexeme: fi}, {surface: عَجْقَة, lexeme: 3aj2a, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: fi 3aj2a?
          tokens: [{surface: fi, lexeme: fi}, {surface: 3aj2a, lexeme: 3aj2a, feats: {Number: Sing}}]
      translations:
        en: Is there traffic?
  - line:
      speaker: sami
      ask: complete
      gap: lexeme:3aj2a
      distractors:
      - lexeme:jebne
      - lexeme:man2oushe
      forms:
        apc-Arab/standard:
          text: إيه، في عَجْقَة كْتير!
          tokens: [{surface: إيه, lexeme: eh}, {surface: في, lexeme: fi}, {surface: عَجْقَة, lexeme: 3aj2a, feats: {Number: Sing}}, {surface: كْتير, lexeme: ktir}]
        apc-Latn/arabizi:
          text: eh, fi 3aj2a ktir!
          tokens: [{surface: eh, lexeme: eh}, {surface: fi, lexeme: fi}, {surface: 3aj2a, lexeme: 3aj2a, feats: {Number: Sing}}, {surface: ktir, lexeme: ktir}]
      translations:
        en: Yes, there's a lot of traffic!
  - choose:
      prompt:
        en: How is Sami travelling?
      options:
      - en: By service taxi
      - en: By bus
      - en: On foot
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَنا قاعْدِة بِالمَطْعَم حَدّ البَحِر.
          tokens: [{surface: أَنا, lexeme: ana}, {surface: قاعْدِة, lexeme: 2a3ed, feats: {Aspect: Part, Gender: Fem, Number: Sing}}, {surface: بِالمَطْعَم, lexemes: [{lexeme: b, surface: بِ, n: 3, head: 5, rel: case}, {lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: mat3am, surface: مَطْعَم, base: true, feats: {Number: Sing}, n: 5}]}, {surface: حَدّ, lexeme: 7add, n: 6, head: 8, rel: case}, {surface: البَحِر, lexemes: [{lexeme: el, surface: ال, n: 7, head: 8, rel: det}, {lexeme: ba7r, surface: بَحِر, base: true, feats: {Number: Sing}, n: 8}]}]
        apc-Latn/arabizi:
          text: ana 2a3de bel mat3am 7add el ba7r.
          tokens: [{surface: ana, lexeme: ana}, {surface: 2a3de, lexeme: 2a3ed, feats: {Aspect: Part, Gender: Fem, Number: Sing}}, {surface: bel, lexemes: [{lexeme: b, surface: b, base: true, n: 3, head: 5, rel: case}, {lexeme: el, surface: el, n: 4, head: 5, rel: det}]}, {surface: mat3am, lexeme: mat3am, feats: {Number: Sing}, n: 5}, {surface: 7add, lexeme: 7add, n: 6, head: 8, rel: case}, {surface: el, lexeme: el, n: 7, head: 8, rel: det}, {surface: ba7r, lexeme: ba7r, feats: {Number: Sing}, n: 8}]
      translations:
        en: I'm sitting in the restaurant by the sea.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: كيف بوصَل عَالمَطْعَم؟
          tokens: [{surface: كيف, lexeme: kif}, {surface: بوصَل, lexeme: wesel, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: عَالمَطْعَم, lexemes: [{lexeme: 3a, surface: عَ, n: 3, head: 5, rel: case}, {lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: mat3am, surface: مَطْعَم, base: true, feats: {Number: Sing}, n: 5}]}]
        apc-Latn/arabizi:
          text: kif busal 3al mat3am?
          tokens: [{surface: kif, lexeme: kif}, {surface: busal, lexeme: wesel, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: 3al, lexemes: [{lexeme: 3a, surface: 3a, base: true, n: 3, head: 5, rel: case}, {lexeme: el, surface: l, n: 4, head: 5, rel: det}]}, {surface: mat3am, lexeme: mat3am, feats: {Number: Sing}, n: 5}]
      translations:
        en: How do I get to the restaurant?
  - line:
      speaker: maya
      ask: arrange
      forms:
        apc-Arab/standard:
          text: بَعْد الإِشارَة، لِفّ عَاليَمين.
          tokens: [{surface: بَعْد, lexeme: ba3d, n: 1, head: 3, rel: case}, {surface: الإِشارَة, lexemes: [{lexeme: el, surface: ال, n: 2, head: 3, rel: det}, {lexeme: ishara, surface: إِشارَة, base: true, feats: {Number: Sing}, n: 3}]}, {surface: لِفّ, lexeme: laff, feats: {Gender: Masc, Mood: Imp, Number: Sing, Person: '2'}}, {surface: عَاليَمين, lexemes: [{lexeme: 3a, surface: عَ, n: 5, head: 7, rel: case}, {lexeme: el, surface: ال, n: 6, head: 7, rel: det}, {lexeme: yamin, surface: يَمين, base: true, feats: {Number: Sing}, n: 7}]}]
        apc-Latn/arabizi:
          text: ba3d el ishara, liff 3al yamin.
          tokens: [{surface: ba3d, lexeme: ba3d, n: 1, head: 3, rel: case}, {surface: el, lexeme: el, n: 2, head: 3, rel: det}, {surface: ishara, lexeme: ishara, feats: {Number: Sing}, n: 3}, {surface: liff, lexeme: laff, feats: {Gender: Masc, Mood: Imp, Number: Sing, Person: '2'}}, {surface: 3al, lexemes: [{lexeme: 3a, surface: 3a, base: true, n: 5, head: 7, rel: case}, {lexeme: el, surface: l, n: 6, head: 7, rel: det}]}, {surface: yamin, lexeme: yamin, feats: {Number: Sing}, n: 7}]
      translations:
        en: After the traffic lights, turn right.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وَقِّف هون، عْمول مَعْروف!
          tokens: [{surface: وَقِّف, lexeme: wa22ef, feats: {Gender: Masc, Mood: Imp, Number: Sing, Person: '2'}}, {surface: هون, lexeme: hon}, {surface: عْمول, lexeme: 3mol-ma3rouf}, {surface: مَعْروف, lexeme: 3mol-ma3rouf}]
        apc-Latn/arabizi:
          text: wa22ef hon, 3mol ma3rouf!
          tokens: [{surface: wa22ef, lexeme: wa22ef, feats: {Gender: Masc, Mood: Imp, Number: Sing, Person: '2'}}, {surface: hon, lexeme: hon}, {surface: 3mol, lexeme: 3mol-ma3rouf}, {surface: ma3rouf, lexeme: 3mol-ma3rouf}]
      translations:
