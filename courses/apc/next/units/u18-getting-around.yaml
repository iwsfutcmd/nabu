scenarios:
- id: apc.taxi-ride
  after: apc.road.story
  title:
    en: Taking a service
  setting:
    en: A street corner in Beirut; a service with one free seat slows down.
  character:
    en: The driver, in a hurry, who asks where you are going and talks about the traffic.
  goal:
    en: Ask whether the service goes where you want, agree on the fare, give directions (straight on, turn right or left, after the traffic light) and ask him to stop.
  provenance:
    author: llm:claude@a659420f546f
    status: draft
