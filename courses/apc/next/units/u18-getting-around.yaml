stories:
- id: apc.story.service
  node: apc.road.story
  title:
    en: In the service
  provenance:
    author: llm:claude@a659420f546f
    status: draft
  characters:
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَلو سامي، وينَك؟
