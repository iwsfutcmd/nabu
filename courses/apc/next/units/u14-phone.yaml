stories:
- id: apc.story.teta-calls
  node: apc.phone.story
  title:
    en: Teta calls
  provenance:
    author: llm:claude@99d8501c54f6
    status: draft
  characters:
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  - id: teta
    speaker: f
    name:
      apc-Arab/standard: تيتا
      apc-Latn/arabizi: Teta
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: أَلو؟
          tokens: [{surface: أَلو, lexeme: alo}]
        apc-Latn/arabizi:
          text: alo?
          tokens: [{surface: alo, lexeme: alo}]
      translations:
        en: Hello?
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: أَلو سامي! أَنا تيتا. سْمِعْتْني؟
          tokens: [{surface: أَلو, lexeme: alo}, {surface: سامي, lexeme: sami}, {surface: أَنا, lexeme: ana}, {surface: تيتا, lexeme: teta, feats: {Number: Sing}}, {surface: سْمِعْتْني, lexemes: [{lexeme: sama3, surface: سْمِعْتْ, base: true, feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '2'}}, {lexeme: obj-1sg, surface: ني}]}]
        apc-Latn/arabizi:
          text: alo Sami! ana teta. sme3tni?
          tokens: [{surface: alo, lexeme: alo}, {surface: Sami, lexeme: sami}, {surface: ana, lexeme: ana}, {surface: teta, lexeme: teta, feats: {Number: Sing}}, {surface: sme3tni, lexemes: [{lexeme: sama3, surface: sme3t, base: true, feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '2'}}, {lexeme: obj-1sg, surface: ni}]}]
      translations:
        en: Hello Sami! It's grandma. Can you hear me?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: إيه تيتا، كيفِك؟
          tokens: [{surface: إيه, lexeme: eh}, {surface: تيتا, lexeme: teta, feats: {Number: Sing}}, {surface: كيفِك, lexemes: [{lexeme: kif, surface: كيفِ, base: true}, {lexeme: poss-2fs, surface: ك}]}]
        apc-Latn/arabizi:
          text: eh teta, kifik?
          tokens: [{surface: eh, lexeme: eh}, {surface: teta, lexeme: teta, feats: {Number: Sing}}, {surface: kifik, lexemes: [{lexeme: kif, surface: kif, base: true}, {lexeme: poss-2fs, surface: ik}]}]
      translations:
        en: Yes, grandma, how are you?
  - line:
      speaker: teta
      ask: complete
      gap: lexeme:telefon
      distractors:
      - lexeme:talj
      - lexeme:matar
      forms:
        apc-Arab/standard:
          text: مْنيحَة. ما عِنْدَك تِلِفون؟ ما بْتْدِقِّلّي أَبَداً!
          tokens: [{surface: مْنيحَة, lexeme: mni7, feats: {Gender: Fem, Number: Sing}}, {surface: ما, lexeme: ma}, {surface: عِنْدَك, lexemes: [{lexeme: 3end, surface: عِنْدَ, base: true, n: 3, head: 4, rel: case}, {lexeme: poss-2ms, surface: ك, n: 4}]}, {surface: تِلِفون, lexeme: telefon, feats: {Number: Sing}}, {surface: ما, lexeme: ma}, {surface: بْتْدِقِّلّي, lexemes: [{lexeme: de22, surface: بْتْدِقِّ, base: true, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {lexeme: la-1sg, surface: لّي}]}, {surface: أَبَداً, lexeme: abadan}]
        apc-Latn/arabizi:
          text: mni7a. ma 3endak telefon? ma btde22elli abadan!
          tokens: [{surface: mni7a, lexeme: mni7, feats: {Gender: Fem, Number: Sing}}, {surface: ma, lexeme: ma}, {surface: 3endak, lexemes: [{lexeme: 3end, surface: 3end, base: true, n: 3, head: 4, rel: case}, {lexeme: poss-2ms, surface: ak, n: 4}]}, {surface: telefon, lexeme: telefon, feats: {Number: Sing}}, {surface: ma, lexeme: ma}, {surface: btde22elli, lexemes: [{lexeme: de22, surface: btde22, base: true, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {lexeme: la-1sg, surface: elli}]}, {surface: abadan, lexeme: abadan}]
      translations:
        en: Fine. Don't you have a phone? You never call me!
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَعْليش تيتا، كِنْت مَشْغول كْتير.
          tokens: [{surface: مَعْليش, lexeme: ma3lesh}, {surface: تيتا, lexeme: teta, feats: {Number: Sing}}, {surface: كِنْت, lexeme: kan, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: مَشْغول, lexeme: mashghoul, feats: {Gender: Masc, Number: Sing}}, {surface: كْتير, lexeme: ktir}]
        apc-Latn/arabizi:
          text: ma3lesh teta, kent mashghoul ktir.
          tokens: [{surface: ma3lesh, lexeme: ma3lesh}, {surface: teta, lexeme: teta, feats: {Number: Sing}}, {surface: kent, lexeme: kan, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: mashghoul, lexeme: mashghoul, feats: {Gender: Masc, Number: Sing}}, {surface: ktir, lexeme: ktir}]
      translations:
        en: Sorry, grandma, I was very busy.
  - choose:
      prompt:
        en: Why is Teta upset?
      options:
      - en: Sami never calls her
      - en: Sami is sick
      - en: Sami lost his phone
      answer: 0
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: قِلّي، رَح تْزورْني الأَحَد؟
          tokens: [{surface: قِلّي, lexemes: [{lexeme: 2al, surface: قِ, base: true, feats: {Gender: Masc, Mood: Imp, Number: Sing, Person: '2'}}, {lexeme: la-1sg, surface: لّي}]}, {surface: رَح, lexeme: ra7.fut}, {surface: تْزورْني, lexemes: [{lexeme: zar, surface: تْزورْ, base: true, feats: {Aspect: Imp, Gender: Masc, Mood: Sub, Number: Sing, Person: '2'}}, {lexeme: obj-1sg, surface: ني}]}, {surface: الأَحَد, lexemes: [{lexeme: el, surface: ال, n: 6, head: 7, rel: det}, {lexeme: a7ad, surface: أَحَد, base: true, feats: {Number: Sing}, n: 7}]}]
        apc-Latn/arabizi:
          text: 2elli, ra7 tzurni el a7ad?
          tokens: [{surface: 2elli, lexemes: [{lexeme: 2al, surface: '2', base: true, feats: {Gender: Masc, Mood: Imp, Number: Sing, Person: '2'}}, {lexeme: la-1sg, surface: elli}]}, {surface: ra7, lexeme: ra7.fut}, {surface: tzurni, lexemes: [{lexeme: zar, surface: tzur, base: true, feats: {Aspect: Imp, Gender: Masc, Mood: Sub, Number: Sing, Person: '2'}}, {lexeme: obj-1sg, surface: ni}]}, {surface: el, lexeme: el, n: 6, head: 7, rel: det}, {surface: a7ad, lexeme: a7ad, feats: {Number: Sing}, n: 7}]
      translations:
        en: Tell me, are you going to visit me on Sunday?
  - line:
      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: أَكيد، رَح زورِك الأَحَد.
          tokens: [{surface: أَكيد, lexeme: akid}, {surface: رَح, lexeme: ra7.fut}, {surface: زورِك, lexemes: [{lexeme: zar, surface: زورِ, base: true, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}, {lexeme: obj-2fs, surface: ك}]}, {surface: الأَحَد, lexemes: [{lexeme: el, surface: ال, n: 5, head: 6, rel: det}, {lexeme: a7ad, surface: أَحَد, base: true, feats: {Number: Sing}, n: 6}]}]
        apc-Latn/arabizi:
          text: akid, ra7 zurik el a7ad.
          tokens: [{surface: akid, lexeme: akid}, {surface: ra7, lexeme: ra7.fut}, {surface: zurik, lexemes: [{lexeme: zar, surface: zur, base: true, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}, {lexeme: obj-2fs, surface: ik}]}, {surface: el, lexeme: el, n: 5, head: 6, rel: det}, {surface: a7ad, lexeme: a7ad, feats: {Number: Sing}, n: 6}]
      translations:
        en: Of course, I'll visit you on Sunday.
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: يَلّا حَبيبي، بْحِبَّك!
          tokens: [{surface: يَلّا, lexeme: yalla}, {surface: حَبيبي, lexeme: 7abibi, feats: {Gender: Masc, Number: Sing}}, {surface: بْحِبَّك, lexemes: [{lexeme: 7abb, surface: بْحِبَّ, base: true, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {lexeme: obj-2ms, surface: ك}]}]
        apc-Latn/arabizi:
          text: yalla 7abibi, b7ebbak!
          tokens: [{surface: yalla, lexeme: yalla}, {surface: 7abibi, lexeme: 7abibi, feats: {Gender: Masc, Number: Sing}}, {surface: b7ebbak, lexemes: [{lexeme: 7abb, surface: b7ebb, base: true, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {lexeme: obj-2ms, surface: ak}]}]
      translations:
        en: OK, sweetheart, I love you!
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وأَنا كَمان بْحِبِّك، تيتا!
          tokens: [{surface: وأَنا, lexemes: [{lexeme: w, surface: و}, {lexeme: ana, surface: أَنا, base: true}]}, {surface: كَمان, lexeme: kamen}, {surface: بْحِبِّك, lexemes: [{lexeme: 7abb, surface: بْحِبِّ, base: true, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {lexeme: obj-2fs, surface: ك}]}, {surface: تيتا, lexeme: teta, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: w ana kamen b7ebbik, teta!
          tokens: [{surface: w, lexeme: w}, {surface: ana, lexeme: ana}, {surface: kamen, lexeme: kamen}, {surface: b7ebbik, lexemes: [{lexeme: 7abb, surface: b7ebb, base: true, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {lexeme: obj-2fs, surface: ik}]}, {surface: teta, lexeme: teta, feats: {Number: Sing}}]
      translations:
        en: I love you too, grandma!
  - choose:
      prompt:
        en: When will Sami visit Teta?
      options:
