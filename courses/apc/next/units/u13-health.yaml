stories:
- id: apc.story.sick-day
  node: apc.health.story
  title:
    en: A sick day
  provenance:
    author: llm:claude@a92756874d1e
    status: draft
  characters:
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَرْحَبا مايا، كيفِك؟
          tokens: [{surface: مَرْحَبا, lexeme: marhaba}, {surface: مايا, lexeme: maya}, {surface: كيفِك, lexemes: [{lexeme: kif, surface: كيفِ, base: true}, {lexeme: poss-2fs, surface: ك}]}]
        apc-Latn/arabizi:
          text: mar7aba Maya, kifik?
          tokens: [{surface: mar7aba, lexeme: marhaba}, {surface: Maya, lexeme: maya}, {surface: kifik, lexemes: [{lexeme: kif, surface: kif, base: true}, {lexeme: poss-2fs, surface: ik}]}]
      translations:
        en: Hi Maya, how are you?
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: مِش مْنيحَة، أَنا مْريضَة.
          tokens: [{surface: مِش, lexeme: mish}, {surface: مْنيحَة, lexeme: mni7, feats: {Gender: Fem, Number: Sing}}, {surface: أَنا, lexeme: ana}, {surface: مْريضَة, lexeme: mrid, feats: {Gender: Fem, Number: Sing}}]
        apc-Latn/arabizi:
          text: mish mni7a, ana mrida.
          tokens: [{surface: mish, lexeme: mish}, {surface: mni7a, lexeme: mni7, feats: {Gender: Fem, Number: Sing}}, {surface: ana, lexeme: ana}, {surface: mrida, lexeme: mrid, feats: {Gender: Fem, Number: Sing}}]
      translations:
        en: Not good, I'm sick.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: شو بِكي؟
          tokens: [{surface: شو, lexeme: shu-bak}, {surface: بِكي, lexeme: shu-bak, feats: {'Gender[psor]': Fem, 'Number[psor]': Sing, 'Person[psor]': '2'}}]
        apc-Latn/arabizi:
          text: shu biki?
          tokens: [{surface: shu, lexeme: shu-bak}, {surface: biki, lexeme: shu-bak, feats: {'Gender[psor]': Fem, 'Number[psor]': Sing, 'Person[psor]': '2'}}]
      translations:
        en: What's wrong?
  - line:
      speaker: maya
      ask: complete
      gap: lexeme:ras
      distractors:
      - lexeme:dollar
      - lexeme:ktab
      forms:
        apc-Arab/standard:
          text: مَعي وْجَع راس، وما فِيّي نام.
          tokens: [{surface: مَعي, lexemes: [{lexeme: ma3, surface: مَع, base: true, n: 1, head: 2, rel: case}, {lexeme: poss-1sg, surface: ي, n: 2}]}, {surface: وْجَع, lexeme: wja3, feats: {Number: Sing}}, {surface: راس, lexeme: ras, feats: {Number: Sing}}, {surface: وما, lexemes: [{lexeme: w, surface: و}, {lexeme: ma, surface: ما, base: true}]}, {surface: فِيّي, lexemes: [{lexeme: fi.can, surface: فِيّ, base: true}, {lexeme: poss-1sg, surface: ي}]}, {surface: نام, lexeme: nem, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}]
        apc-Latn/arabizi:
          text: ma3i wja3 ras, w ma fiyyi nem.
          tokens: [{surface: ma3i, lexemes: [{lexeme: ma3, surface: ma3, base: true, n: 1, head: 2, rel: case}, {lexeme: poss-1sg, surface: i, n: 2}]}, {surface: wja3, lexeme: wja3, feats: {Number: Sing}}, {surface: ras, lexeme: ras, feats: {Number: Sing}}, {surface: w, lexeme: w}, {surface: ma, lexeme: ma}, {surface: fiyyi, lexemes: [{lexeme: fi.can, surface: fiyy, base: true}, {lexeme: poss-1sg, surface: i}]}, {surface: nem, lexeme: nem, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}]
      translations:
        en: I have a headache, and I can't sleep.
  - choose:
      prompt:
        en: What's wrong with Maya?
      options:
      - en: She has a headache
      - en: She has a stomach ache
      - en: She's hungry
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: لازِم تْروحي عَالحَكيم!
          tokens: [{surface: لازِم, lexeme: lezem}, {surface: تْروحي, lexeme: ra7, feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '2'}}, {surface: عَالحَكيم, lexemes: [{lexeme: 3a, surface: عَ, n: 3, head: 5, rel: case}, {lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: 7akim, surface: حَكيم, base: true, feats: {Number: Sing}, n: 5}]}]
        apc-Latn/arabizi:
          text: lezem tru7i 3al 7akim!
          tokens: [{surface: lezem, lexeme: lezem}, {surface: tru7i, lexeme: ra7, feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '2'}}, {surface: 3al, lexemes: [{lexeme: 3a, surface: 3a, base: true, n: 3, head: 5, rel: case}, {lexeme: el, surface: l, n: 4, head: 5, rel: det}]}, {surface: 7akim, lexeme: 7akim, feats: {Number: Sing}, n: 5}]
      translations:
        en: You have to go to the doctor!
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: ما فِيّي، أَنا مَشْغولِة كْتير.
          tokens: [{surface: ما, lexeme: ma}, {surface: فِيّي, lexemes: [{lexeme: fi.can, surface: فِيّ, base: true}, {lexeme: poss-1sg, surface: ي}]}, {surface: أَنا, lexeme: ana}, {surface: مَشْغولِة, lexeme: mashghoul, feats: {Gender: Fem, Number: Sing}}, {surface: كْتير, lexeme: ktir}]
        apc-Latn/arabizi:
          text: ma fiyyi, ana mashghoule ktir.
          tokens: [{surface: ma, lexeme: ma}, {surface: fiyyi, lexemes: [{lexeme: fi.can, surface: fiyy, base: true}, {lexeme: poss-1sg, surface: i}]}, {surface: ana, lexeme: ana}, {surface: mashghoule, lexeme: mashghoul, feats: {Gender: Fem, Number: Sing}}, {surface: ktir, lexeme: ktir}]
      translations:
        en: I can't, I'm very busy.
  - line:
      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: لَأ، لازِم تِرْتاحي اليوم.
          tokens: [{surface: لَأ, lexeme: la2}, {surface: لازِم, lexeme: lezem}, {surface: تِرْتاحي, lexeme: rte7, feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '2'}}, {surface: اليوم, lexemes: [{lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: yom, surface: يوم, base: true, feats: {Number: Sing}, n: 5}]}]
        apc-Latn/arabizi:
          text: la2, lezem tirte7i el yom.
          tokens: [{surface: la2, lexeme: la2}, {surface: lezem, lexeme: lezem}, {surface: tirte7i, lexeme: rte7, feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '2'}}, {surface: el, lexeme: el, n: 4, head: 5, rel: det}, {surface: yom, lexeme: yom, feats: {Number: Sing}, n: 5}]
      translations:
        en: No, you have to rest today.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: خَلَص، رَح نام شْوَي.
          tokens: [{surface: خَلَص, lexeme: khalas}, {surface: رَح, lexeme: ra7.fut}, {surface: نام, lexeme: nem, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}, {surface: شْوَي, lexeme: shway}]
        apc-Latn/arabizi:
          text: khalas, ra7 nem shway.
          tokens: [{surface: khalas, lexeme: khalas}, {surface: ra7, lexeme: ra7.fut}, {surface: nem, lexeme: nem, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}, {surface: shway, lexeme: shway}]
      translations:
        en: OK then, I'll sleep for a bit.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: سَلامْتِك! بُكْرا أَحْسَن، إِن شاء الله.
          tokens: [{surface: سَلامْتِك, lexeme: salemtak, feats: {'Gender[psor]': Fem, 'Number[psor]': Sing, 'Person[psor]': '2'}}, {surface: بُكْرا, lexeme: bukra}, {surface: أَحْسَن, lexeme: a7san, feats: {Gender: Masc, Number: Sing}}, {surface: إِن, lexeme: inshalla}, {surface: شاء, lexeme: inshalla}, {surface: الله, lexeme: inshalla}]
