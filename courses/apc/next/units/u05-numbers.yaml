scenarios:
- id: apc.dekkene
  after: apc.num.story
  title:
    en: At the corner shop
  setting:
    en: A small dekkene (corner shop) in a Beirut neighbourhood in the morning. Prices are in dollars, or in lira by the thousand.
  character:
    en: 'Abu Ali, the shopkeeper: friendly, chatty, and happy to haggle a little.'
  goal:
    en: Ask whether there is bread, cheese or water, say what you want and how many, ask how much it costs, and pay in lira or dollars.
  provenance:
    author: llm:claude@6914f241714e
    status: draft
