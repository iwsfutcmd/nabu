stories:
- id: apc.story.dekkene
  node: apc.num.story
  title:
    en: At the corner shop
  provenance:
    author: llm:claude@6914f241714e
    status: draft
  characters:
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  - id: abu-ali
    speaker: m
    name:
      apc-Arab/standard: أبو علي
      apc-Latn/arabizi: Abu Ali
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَرْحَبا! في خِبِز؟
          tokens: [{surface: مَرْحَبا, lexeme: marhaba}, {surface: في, lexeme: fi}, {surface: خِبِز, lexeme: khebz, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: mar7aba! fi khebz?
          tokens: [{surface: mar7aba, lexeme: marhaba}, {surface: fi, lexeme: fi}, {surface: khebz, lexeme: khebz, feats: {Number: Sing}}]
      translations:
        en: Hello! Is there any bread?
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: إيه، تْفَضَّل.
          tokens: [{surface: إيه, lexeme: eh}, {surface: تْفَضَّل, lexeme: tfaddal}]
        apc-Latn/arabizi:
          text: eh, tfaddal.
          tokens: [{surface: eh, lexeme: eh}, {surface: tfaddal, lexeme: tfaddal}]
      translations:
        en: Yes, here you go.
  - line:
      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: وبَدّي جِبْنِة ولَبَن.
          tokens: [{surface: وبَدّي, lexemes: [{lexeme: w, surface: و}, {lexeme: badd, surface: بَدّ, base: true}, {lexeme: poss-1sg, surface: ي}]}, {surface: جِبْنِة, lexeme: jebne, feats: {Number: Sing}}, {surface: ولَبَن, lexemes: [{lexeme: w, surface: و}, {lexeme: laban, surface: لَبَن, base: true, feats: {Number: Sing}}]}]
        apc-Latn/arabizi:
          text: w baddi jebne w laban.
          tokens: [{surface: w, lexeme: w}, {surface: baddi, lexemes: [{lexeme: badd, surface: badd, base: true}, {lexeme: poss-1sg, surface: i}]}, {surface: jebne, lexeme: jebne, feats: {Number: Sing}}, {surface: w, lexeme: w}, {surface: laban, lexeme: laban, feats: {Number: Sing}}]
      translations:
        en: And I want cheese and yogurt.
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: بَدَّك كَمان؟
          tokens: [{surface: بَدَّك, lexemes: [{lexeme: badd, surface: بَدَّ, base: true}, {lexeme: poss-2ms, surface: ك}]}, {surface: كَمان, lexeme: kamen}]
        apc-Latn/arabizi:
          text: baddak kamen?
          tokens: [{surface: baddak, lexemes: [{lexeme: badd, surface: badd, base: true}, {lexeme: poss-2ms, surface: ak}]}, {surface: kamen, lexeme: kamen}]
      translations:
        en: Do you want anything else?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: لأ، شُكْرا. قَدّيش؟
          tokens: [{surface: لأ, lexeme: la2}, {surface: شُكْرا, lexeme: shukran}, {surface: قَدّيش, lexeme: 2addesh}]
        apc-Latn/arabizi:
          text: la2, shukran. 2addesh?
          tokens: [{surface: la2, lexeme: la2}, {surface: shukran, lexeme: shukran}, {surface: 2addesh, lexeme: 2addesh}]
      translations:
        en: No, thanks. How much?
  - line:
      speaker: abu-ali
      ask: complete
      gap: lexeme:dollar
      distractors:
      - lexeme:jeddo
      - lexeme:fenjen
      forms:
        apc-Arab/standard:
          text: عِشْرين دولار.
          tokens: [{surface: عِشْرين, lexeme: 3eshrin}, {surface: دولار, lexeme: dollar, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: 3eshrin dollar.
          tokens: [{surface: 3eshrin, lexeme: 3eshrin}, {surface: dollar, lexeme: dollar, feats: {Number: Sing}}]
      translations:
        en: Twenty dollars.
  - choose:
      prompt:
        en: What price does Abu Ali ask for?
      options:
      - en: Twenty dollars
      - en: Ten dollars
      - en: Fifty thousand lira
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: غالي كْتير!
          tokens: [{surface: غالي, lexeme: ghali, feats: {Gender: Masc, Number: Sing}}, {surface: كْتير, lexeme: ktir}]
        apc-Latn/arabizi:
          text: ghali ktir!
          tokens: [{surface: ghali, lexeme: ghali, feats: {Gender: Masc, Number: Sing}}, {surface: ktir, lexeme: ktir}]
      translations:
        en: That's very expensive!
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: لأ، مِش غالي! الجِبْنِة طَيّْبِة كْتير.
          tokens: [{surface: لأ, lexeme: la2}, {surface: مِش, lexeme: mish}, {surface: غالي, lexeme: ghali, feats: {Gender: Masc, Number: Sing}}, {surface: الجِبْنِة, lexemes: [{lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: jebne, surface: جِبْنِة, base: true, feats: {Number: Sing}, n: 5}]}, {surface: طَيّْبِة, lexeme: tayyeb, feats: {Gender: Fem, Number: Sing}, n: 6, head: 5, rel: amod}, {surface: كْتير, lexeme: ktir}]
        apc-Latn/arabizi:
          text: la2, mish ghali! el jebne tayybe ktir.
          tokens: [{surface: la2, lexeme: la2}, {surface: mish, lexeme: mish}, {surface: ghali, lexeme: ghali, feats: {Gender: Masc, Number: Sing}}, {surface: el, lexeme: el}, {surface: jebne, lexeme: jebne, feats: {Number: Sing}, n: 5}, {surface: tayybe, lexeme: tayyeb, feats: {Gender: Fem, Number: Sing}, n: 6, head: 5, rel: amod}, {surface: ktir, lexeme: ktir}]
      translations:
        en: No, it's not expensive! The cheese is very good.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَعي بَسّ عَشْرَة دولار.
          tokens: [{surface: مَعي, lexemes: [{lexeme: ma3, surface: مَع, base: true}, {lexeme: poss-1sg, surface: ي}]}, {surface: بَسّ, lexeme: bas}, {surface: عَشْرَة, lexeme: 3ashra}, {surface: دولار, lexeme: dollar, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: ma3i bas 3ashra dollar.
          tokens: [{surface: ma3i, lexemes: [{lexeme: ma3, surface: ma3, base: true}, {lexeme: poss-1sg, surface: i}]}, {surface: bas, lexeme: bas}, {surface: 3ashra, lexeme: 3ashra}, {surface: dollar, lexeme: dollar, feats: {Number: Sing}}]
      translations:
        en: I only have ten dollars on me.
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: يَلّا، عَشْرَة دولار، بَسّ الخِبِز والجِبْنِة.
          tokens: [{surface: يَلّا, lexeme: yalla}, {surface: عَشْرَة, lexeme: 3ashra}, {surface: دولار, lexeme: dollar, feats: {Number: Sing}}, {surface: بَسّ, lexeme: bas}, {surface: الخِبِز, lexemes: [{lexeme: el, surface: ال, n: 5, head: 6, rel: det}, {lexeme: khebz, surface: خِبِز, base: true, feats: {Number: Sing}, n: 6}]}, {surface: والجِبْنِة, lexemes: [{lexeme: w, surface: و}, {lexeme: el, surface: ال, n: 8, head: 9, rel: det}, {lexeme: jebne, surface: جِبْنِة, base: true, feats: {Number: Sing}, n: 9}]}]
        apc-Latn/arabizi:
          text: yalla, 3ashra dollar, bas el khebz w el jebne.
          tokens: [{surface: yalla, lexeme: yalla}, {surface: 3ashra, lexeme: 3ashra}, {surface: dollar, lexeme: dollar, feats: {Number: Sing}}, {surface: bas, lexeme: bas}, {surface: el, lexeme: el}, {surface: khebz, lexeme: khebz, feats: {Number: Sing}}, {surface: w, lexeme: w}, {surface: el, lexeme: el}, {surface: jebne, lexeme: jebne, feats: {Number: Sing}}]
      translations:
        en: OK, ten dollars, but just the bread and the cheese.
  - choose:
      prompt:
        en: What does Sami buy in the end?
      options:
      - en: Bread and cheese
      - en: Bread, cheese and yogurt
      - en: Only yogurt
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: ميرسي! مَع السَّلامِة!
          tokens: [{surface: ميرسي, lexeme: merci}, {surface: مَع, lexeme: ma3-essalame}, {surface: السَّلامِة, lexeme: ma3-essalame}]
        apc-Latn/arabizi:
          text: merci! ma3 essalame!
          tokens: [{surface: merci, lexeme: merci}, {surface: ma3, lexeme: ma3-essalame}, {surface: essalame, lexeme: ma3-essalame}]
      translations:
