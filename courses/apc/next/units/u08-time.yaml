- id: apc.story.free-on-saturday
  node: apc.time.story
  title:
    en: Are you free on Saturday?
  provenance:
    author: llm:claude@6914f241714e
    status: draft
  characters:
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، إِنْتي فاضْيِة نْهار السَّبْت؟
          tokens: [{surface: مايا, lexeme: maya}, {surface: إِنْتي, lexeme: enti, feats: {Gender: Fem, Number: Sing}}, {surface: فاضْيِة, lexeme: fadi, feats: {Gender: Fem, Number: Sing}}, {surface: نْهار, lexeme: nhar, feats: {Number: Sing}}, {surface: السَّبْت, lexemes: [{lexeme: el, surface: ال, n: 5, head: 6, rel: det}, {lexeme: sabt, surface: سَّبْت, base: true, feats: {Number: Sing}, n: 6}]}]
        apc-Latn/arabizi:
          text: Maya, enti fadye nhar el sabt?
          tokens: [{surface: Maya, lexeme: maya}, {surface: enti, lexeme: enti, feats: {Gender: Fem, Number: Sing}}, {surface: fadye, lexeme: fadi, feats: {Gender: Fem, Number: Sing}}, {surface: nhar, lexeme: nhar, feats: {Number: Sing}}, {surface: el, lexeme: el, n: 5, head: 6, rel: det}, {surface: sabt, lexeme: sabt, feats: {Number: Sing}, n: 6}]
      translations:
        en: Maya, are you free on Saturday?
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: لأ، نْهار السَّبْت بِشْتِغِل. بَسّ الأَحَد فاضْيِة.
          tokens: [{surface: لأ, lexeme: la2}, {surface: نْهار, lexeme: nhar, feats: {Number: Sing}}, {surface: السَّبْت, lexemes: [{lexeme: el, surface: ال, n: 3, head: 4, rel: det}, {lexeme: sabt, surface: سَّبْت, base: true, feats: {Number: Sing}, n: 4}]}, {surface: بِشْتِغِل, lexeme: eshteghel, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: بَسّ, lexeme: bas}, {surface: الأَحَد, lexemes: [{lexeme: el, surface: ال, n: 7, head: 8, rel: det}, {lexeme: a7ad, surface: أَحَد, base: true, feats: {Number: Sing}, n: 8}]}, {surface: فاضْيِة, lexeme: fadi, feats: {Gender: Fem, Number: Sing}}]
