      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: مَعْليش! البيت قَريب.
          tokens: [{surface: مَعْليش, lexeme: ma3lesh}, {surface: البيت, lexemes: [{lexeme: el, surface: ال, n: 2, head: 3, rel: det}, {lexeme: bet, surface: بيت, base: true, feats: {Number: Sing}, n: 3}]}, {surface: قَريب, lexeme: 2arib, feats: {Gender: Masc, Number: Sing}, n: 4, head: 3, rel: amod}]
        apc-Latn/arabizi:
          text: ma3lesh! el bet 2arib.
          tokens: [{surface: ma3lesh, lexeme: ma3lesh}, {surface: el, lexeme: el, n: 2, head: 3, rel: det}, {surface: bet, lexeme: bet, feats: {Number: Sing}, n: 3}, {surface: 2arib, lexeme: 2arib, feats: {Gender: Masc, Number: Sing}, n: 4, head: 3, rel: amod}]
      translations:
        en: Never mind! The house is close.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: خَلَص، رايْحَة! بَسّ ما بْحِبّ اُرْقُص.
          tokens: [{surface: خَلَص, lexeme: khalas}, {surface: رايْحَة, lexeme: ra7, feats: {Aspect: Part, Gender: Fem, Number: Sing}}, {surface: بَسّ, lexeme: bas}, {surface: ما, lexeme: ma}, {surface: بْحِبّ, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: اُرْقُص, lexeme: ra2as, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}]
        apc-Latn/arabizi:
          text: khalas, ray7a! bas ma b7ebb or2os.
          tokens: [{surface: khalas, lexeme: khalas}, {surface: ray7a, lexeme: ra7, feats: {Aspect: Part, Gender: Fem, Number: Sing}}, {surface: bas, lexeme: bas}, {surface: ma, lexeme: ma}, {surface: b7ebb, lexeme: 7abb, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: or2os, lexeme: ra2as, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}]
