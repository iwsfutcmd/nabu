      translations:
        en: At eight o'clock.
  - choose:
      prompt:
        en: Where is the party?
      options:
      - en: At Sami's brother's
      - en: At Maya's house
      - en: At the beach
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بَسّ في مَطَر وبَرْد كْتير!
          tokens: [{surface: بَسّ, lexeme: bas}, {surface: في, lexeme: fi}, {surface: مَطَر, lexeme: matar, feats: {Number: Sing}}, {surface: وبَرْد, lexemes: [{lexeme: w, surface: و}, {lexeme: bard, surface: بَرْد, base: true, feats: {Number: Sing}}]}, {surface: كْتير, lexeme: ktir}]
        apc-Latn/arabizi:
          text: bas fi matar w bard ktir!
          tokens: [{surface: bas, lexeme: bas}, {surface: fi, lexeme: fi}, {surface: matar, lexeme: matar, feats: {Number: Sing}}, {surface: w, lexeme: w}, {surface: bard, lexeme: bard, feats: {Number: Sing}}, {surface: ktir, lexeme: ktir}]
      translations:
        en: But it's raining and it's very cold!
