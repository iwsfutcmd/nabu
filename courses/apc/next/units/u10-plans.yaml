        apc-Latn/arabizi:
          text: Maya, shu bta3mli el lele?
          tokens: [{surface: Maya, lexeme: maya}, {surface: shu, lexeme: shu}, {surface: bta3mli, lexeme: 3emel, feats: {Aspect: Imp, Gender: Fem, Mood: Ind, Number: Sing, Person: '2'}}, {surface: el, lexeme: el, n: 4, head: 5, rel: det}, {surface: lele, lexeme: lele, feats: {Number: Sing}, n: 5}]
      translations:
        en: Maya, what are you doing tonight?
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: ما بَعْرِف، يَعْني… فاضْيِة.
          tokens: [{surface: ما, lexeme: ma}, {surface: بَعْرِف, lexeme: 3eref, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: يَعْني, lexeme: ya3ni}, {surface: فاضْيِة, lexeme: fadi, feats: {Gender: Fem, Number: Sing}}]
        apc-Latn/arabizi:
          text: ma ba3ref, ya3ni... fadye.
          tokens: [{surface: ma, lexeme: ma}, {surface: ba3ref, lexeme: 3eref, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: ya3ni, lexeme: ya3ni}, {surface: fadye, lexeme: fadi, feats: {Gender: Fem, Number: Sing}}]
      translations:
        en: I don't know, well… I'm free.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: في سَهْرَة عِنْد خَيّي. يَلّا تا نْروح!
          tokens: [{surface: في, lexeme: fi}, {surface: سَهْرَة, lexeme: sahra, feats: {Number: Sing}}, {surface: عِنْد, lexeme: 3end, n: 3, head: 4, rel: case}, {surface: خَيّي, lexemes: [{lexeme: khayy, surface: خَيّ, base: true, feats: {Number: Sing}, n: 4}, {lexeme: poss-1sg, surface: ي}]}, {surface: يَلّا, lexeme: yalla}, {surface: تا, lexeme: ta}, {surface: نْروح, lexeme: ra7, feats: {Aspect: Imp, Mood: Sub, Number: Plur, Person: '1'}}]
        apc-Latn/arabizi:
          text: fi sahra 3end khayyi. yalla ta nru7!
          tokens: [{surface: fi, lexeme: fi}, {surface: sahra, lexeme: sahra, feats: {Number: Sing}}, {surface: 3end, lexeme: 3end, n: 3, head: 4, rel: case}, {surface: khayyi, lexemes: [{lexeme: khayy, surface: khayy, base: true, feats: {Number: Sing}, n: 4}, {lexeme: poss-1sg, surface: i}]}, {surface: yalla, lexeme: yalla}, {surface: ta, lexeme: ta}, {surface: nru7, lexeme: ra7, feats: {Aspect: Imp, Mood: Sub, Number: Plur, Person: '1'}}]
      translations:
        en: There's a party at my brother's. Come on, let's go!
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: والله؟ إِمْتى؟
          tokens: [{surface: والله, lexeme: walla}, {surface: إِمْتى, lexeme: emta}]
        apc-Latn/arabizi:
          text: walla? emta?
          tokens: [{surface: walla, lexeme: walla}, {surface: emta, lexeme: emta}]
      translations:
        en: Really? When?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: السّاعَة تْمانِة.
          tokens: [{surface: السّاعَة, lexemes: [{lexeme: el, surface: ال, n: 1, head: 2, rel: det}, {lexeme: sa3a, surface: سّاعَة, base: true, feats: {Number: Sing}, n: 2}]}, {surface: تْمانِة, lexeme: tmene}]
