      - lexeme:jebne
      forms:
        apc-Arab/standard:
          text: مْنيح! مْنِسْمَع موسيقى ومْناكُل.
          tokens: [{surface: مْنيح, lexeme: mni7, feats: {Gender: Masc, Number: Sing}}, {surface: مْنِسْمَع, lexeme: sama3, feats: {Aspect: Imp, Mood: Ind, Number: Plur, Person: '1'}}, {surface: موسيقى, lexeme: musi2a, feats: {Number: Sing}}, {surface: ومْناكُل, lexemes: [{lexeme: w, surface: و}, {lexeme: akal, surface: مْناكُل, base: true, feats: {Aspect: Imp, Mood: Ind, Number: Plur, Person: '1'}}]}]
