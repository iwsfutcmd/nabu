  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَنا كِنْت بِالبيت. كِنْت تَعْبانِة.
          tokens: [{surface: أَنا, lexeme: ana}, {surface: كِنْت, lexeme: kan, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: بِالبيت, lexemes: [{lexeme: b, surface: بِ}, {lexeme: el, surface: ال}, {lexeme: bet, surface: بيت, base: true, feats: {Number: Sing}}]}, {surface: كِنْت, lexeme: kan, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: تَعْبانِة, lexeme: ta3ban, feats: {Gender: Fem, Number: Sing}}]
