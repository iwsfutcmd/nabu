          tokens: [{surface: 7elo, lexeme: 7elo, feats: {Gender: Masc, Number: Sing}}, {surface: kent, lexeme: kan, feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '2'}}, {surface: mabsout, lexeme: mabsout, feats: {Gender: Masc, Number: Sing}}]
      translations:
        en: Nice! Did you have a good time?
