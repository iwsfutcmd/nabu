          tokens: [{surface: رُحْت, lexeme: ra7, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: عَالجَبَل, lexemes: [{lexeme: 3a, surface: عَ}, {lexeme: el, surface: ال}, {lexeme: jabal, surface: جَبَل, base: true, feats: {Number: Sing}}]}, {surface: مَع, lexeme: ma3}, {surface: خَيّي, lexemes: [{lexeme: khayy, surface: خَيّ, base: true, feats: {Number: Sing}}, {lexeme: poss-1sg, surface: ي}]}]
        apc-Latn/arabizi:
