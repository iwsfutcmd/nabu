          text: eh, ktir! akalna terwi2a tayybe w shrebna ahwe.
          tokens: [{surface: eh, lexeme: eh}, {surface: ktir, lexeme: ktir}, {surface: akalna, lexeme: akal, feats: {Aspect: Perf, Number: Plur, Person: '1'}}, {surface: terwi2a, lexeme: terwi2a, feats: {Number: Sing}}, {surface: tayybe, lexeme: tayyeb, feats: {Gender: Fem, Number: Sing}}, {surface: w, lexeme: w}, {surface: shrebna, lexeme: shereb, feats: {Aspect: Perf, Number: Plur, Person: '1'}}, {surface: ahwe, lexeme: ahwe, feats: {Number: Sing}}]
      translations:
