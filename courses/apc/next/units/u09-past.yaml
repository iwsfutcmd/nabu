          tokens: [{surface: ru7t, lexeme: ra7, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: 3al, lexemes: [{lexeme: 3a, surface: 3a, base: true}, {lexeme: el, surface: l}]}, {surface: jabal, lexeme: jabal, feats: {Number: Sing}}, {surface: ma3, lexeme: ma3}, {surface: khayyi, lexemes: [{lexeme: khayy, surface: khayy, base: true, feats: {Number: Sing}}, {lexeme: poss-1sg, surface: i}]}]
      translations:
        en: I went to the mountains with my brother.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: حِلو! كِنْت مَبْسوط؟
          tokens: [{surface: حِلو, lexeme: 7elo, feats: {Gender: Masc, Number: Sing}}, {surface: كِنْت, lexeme: kan, feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '2'}}, {surface: مَبْسوط, lexeme: mabsout, feats: {Gender: Masc, Number: Sing}}]
