scenarios:
- id: apc.weekend-catch-up
  after: apc.past.story
  title:
    en: How was your weekend?
  setting:
    en: Monday morning at the office in Beirut. A colleague stops by your desk with two coffees.
  character:
    en: Rami, a talkative colleague who wants to hear all about your weekend and to tell you about his.
  goal:
    en: Tell Rami where you went and what you did (what you ate, who you saw, whether you were tired or had a good time), and ask about his weekend.
  provenance:
    author: llm:claude@6914f241714e
    status: draft
