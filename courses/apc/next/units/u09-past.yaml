          tokens: [{surface: إيه, lexeme: eh}, {surface: كْتير, lexeme: ktir}, {surface: أَكَلْنا, lexeme: akal, feats: {Aspect: Perf, Number: Plur, Person: '1'}}, {surface: تِرْويقَة, lexeme: terwi2a, feats: {Number: Sing}}, {surface: طَيّْبِة, lexeme: tayyeb, feats: {Gender: Fem, Number: Sing}}, {surface: وشْرِبْنا, lexemes: [{lexeme: w, surface: و}, {lexeme: shereb, surface: شْرِبْنا, base: true, feats: {Aspect: Perf, Number: Plur, Person: '1'}}]}, {surface: قَهْوِة, lexeme: ahwe, feats: {Number: Sing}}]
