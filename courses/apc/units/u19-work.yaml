scenarios:
- id: apc.job-chat
  after: apc.work.story
  title: {en: Small talk about work}
  setting: {en: A friend's dinner party; you are seated next to someone you have just met.}
  character: {en: 'Karim, an engineer who likes to talk about his job and asks about yours.'}
  goal: {en: 'Say what you do or study and where, how long you have been doing it, what you think of it and why, and ask Karim the same.'}
  provenance: {author: 'llm:claude@6792dcb39d8e', status: draft}
