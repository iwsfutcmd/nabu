stories:
- id: apc.story.new-job
  node: apc.work.story
  title:
    en: Sami's new job
  provenance:
    author: llm:claude@6792dcb39d8e
    status: draft
  characters:
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي، شو بْتِشْتِغِل هَلَّق؟
          tokens: [{surface: سامي, lexeme: sami}, {surface: شو, lexeme: shu}, {surface: بْتِشْتِغِل, lexeme: eshteghel, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {surface: هَلَّق, lexeme: hala2}]
        apc-Latn/arabizi:
          text: Sami, shu btishteghel hala2?
          tokens: [{surface: Sami, lexeme: sami}, {surface: shu, lexeme: shu}, {surface: btishteghel, lexeme: eshteghel, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {surface: hala2, lexeme: hala2}]
      translations:
        en: Sami, what do you do now?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: صِرِت مْهَنْدِس بْشِرْكِة كْبيرِة بْبيروت.
          tokens: [{surface: صِرِت, lexeme: sar, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: مْهَنْدِس, lexeme: mhandes, feats: {Gender: Masc, Number: Sing}}, {surface: بْشِرْكِة, lexemes: [{lexeme: b, surface: بْ, n: 3, head: 4, rel: case}, {lexeme: sherke, surface: شِرْكِة, base: true, feats: {Number: Sing}, n: 4}]}, {surface: كْبيرِة, lexeme: kbir, feats: {Gender: Fem, Number: Sing}, n: 5, head: 4, rel: amod}, {surface: بْبيروت, lexemes: [{lexeme: b, surface: بْ, n: 6, head: 7, rel: case}, {lexeme: beirut, surface: بيروت, base: true, n: 7}]}]
        apc-Latn/arabizi:
          text: sert mhandes b sherke kbire b Beirut.
          tokens: [{surface: sert, lexeme: sar, feats: {Aspect: Perf, Number: Sing, Person: '1'}}, {surface: mhandes, lexeme: mhandes, feats: {Gender: Masc, Number: Sing}}, {surface: b, lexeme: b, n: 3, head: 4, rel: case}, {surface: sherke, lexeme: sherke, feats: {Number: Sing}, n: 4}, {surface: kbire, lexeme: kbir, feats: {Gender: Fem, Number: Sing}, n: 5, head: 4, rel: amod}, {surface: b, lexeme: b, n: 6, head: 7, rel: case}, {surface: Beirut, lexeme: beirut, n: 7}]
      translations:
        en: I've become an engineer at a big company in Beirut.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: والله؟ حِلو كْتير! والمُدير مْنيح؟
          tokens: [{surface: والله, lexeme: walla}, {surface: حِلو, lexeme: 7elo, feats: {Gender: Masc, Number: Sing}}, {surface: كْتير, lexeme: ktir}, {surface: والمُدير, lexemes: [{lexeme: w, surface: و}, {lexeme: el, surface: ال, n: 5, head: 6, rel: det}, {lexeme: mudir, surface: مُدير, base: true, feats: {Number: Sing}, n: 6}]}, {surface: مْنيح, lexeme: mni7, feats: {Gender: Masc, Number: Sing}, n: 7, head: 6, rel: amod}]
        apc-Latn/arabizi:
          text: walla? 7elo ktir! w el mudir mni7?
          tokens: [{surface: walla, lexeme: walla}, {surface: 7elo, lexeme: 7elo, feats: {Gender: Masc, Number: Sing}}, {surface: ktir, lexeme: ktir}, {surface: w, lexeme: w}, {surface: el, lexeme: el, n: 5, head: 6, rel: det}, {surface: mudir, lexeme: mudir, feats: {Number: Sing}, n: 6}, {surface: mni7, lexeme: mni7, feats: {Gender: Masc, Number: Sing}, n: 7, head: 6, rel: amod}]
      translations:
        en: Really? That's great! And is the boss nice?
  - line:
      speaker: sami
      ask: complete
      gap: lexeme:mni7
