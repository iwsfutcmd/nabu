stories:
- id: apc.story.new-job
  node: apc.work.story
  title: {en: Sami's new job}
  provenance: {author: 'llm:claude@6792dcb39d8e', status: draft}
  characters:
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي، شو بْتِشْتِغِل هَلَّق؟
          tokens: [{surface: سامي, sense: sami}, {surface: شو, sense: shu}, {surface: بْتِشْتِغِل, sense: eshteghel, form: 'form:impf-2ms'}, {surface: هَلَّق, sense: hala2}]
