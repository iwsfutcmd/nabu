          text: Sami, shu btishteghel hala2?
          tokens: [{surface: Sami, sense: sami}, {surface: shu, sense: shu}, {surface: btishteghel, sense: eshteghel, form: 'form:impf-2ms'}, {surface: hala2, sense: hala2}]
      translations: {en: 'Sami, what do you do now?'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: صِرْت مْهَنْدِس بْشِرْكِة كْبيرِة بْبيروت.
          tokens: [{surface: صِرْت, sense: sar, form: 'form:past-1sg'}, {surface: مْهَنْدِس, sense: mhandes}, {surface: بْشِرْكِة, sense: sherke, morphs: [{surface: بْ, kc: 'sense:b'}, {surface: شِرْكِة,
                  kc: 'sense:sherke'}]}, {surface: كْبيرِة, sense: kbir, form: 'form:fem'}, {surface: بْبيروت, sense: beirut, morphs: [{surface: بْ, kc: 'sense:b'}, {surface: بيروت, kc: 'sense:beirut'}]}]
        apc-Latn/arabizi:
          text: sert mhandes b sherke kbire b Beirut.
          tokens: [{surface: sert, sense: sar, form: 'form:past-1sg'}, {surface: mhandes, sense: mhandes}, {surface: b, sense: b}, {surface: sherke, sense: sherke}, {surface: kbire, sense: kbir, form: 'form:fem'},
            {surface: b, sense: b}, {surface: Beirut, sense: beirut}]
      translations: {en: I've become an engineer at a big company in Beirut.}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: والله؟ حِلو كْتير! والمُدير مْنيح؟
          tokens: [{surface: والله, sense: walla}, {surface: حِلو, sense: 7elo}, {surface: كْتير, sense: ktir}, {surface: والمُدير, sense: mudir, morphs: [{surface: و, kc: 'sense:w'}, {surface: ال, kc: 'sense:el'},
                {surface: مُدير, kc: 'sense:mudir'}]}, {surface: مْنيح, sense: mni7}]
        apc-Latn/arabizi:
          text: walla? 7elo ktir! w el mudir mni7?
          tokens: [{surface: walla, sense: walla}, {surface: 7elo, sense: 7elo}, {surface: ktir, sense: ktir}, {surface: w, sense: w}, {surface: el, sense: el}, {surface: mudir, sense: mudir}, {surface: mni7,
              sense: mni7}]
      translations: {en: 'Really? That''s great! And is the boss nice?'}
  - line:
      speaker: sami
      ask: complete
      gap: sense:mudir
      distractors: ['sense:m3allem']
      forms:
        apc-Arab/standard:
          text: إيه، المُدير مْنيح، بَسّ في شُغُل كْتير.
          tokens: [{surface: إيه, sense: eh}, {surface: المُدير, sense: mudir, morphs: [{surface: ال, kc: 'sense:el'}, {surface: مُدير, kc: 'sense:mudir'}]}, {surface: مْنيح, sense: mni7}, {surface: بَسّ,
              sense: bas}, {surface: في, sense: fi}, {surface: شُغُل, sense: shoghl}, {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: eh, el mudir mni7, bas fi shoghl ktir.
          tokens: [{surface: eh, sense: eh}, {surface: el, sense: el}, {surface: mudir, sense: mudir}, {surface: mni7, sense: mni7}, {surface: bas, sense: bas}, {surface: fi, sense: fi}, {surface: shoghl,
              sense: shoghl}, {surface: ktir, sense: ktir}]
      translations: {en: 'Yes, the boss is nice, but there''s a lot of work.'}
  - choose:
      prompt: {en: 'What is Sami''s new job?'}
      options: [{en: Engineer}, {en: Teacher}, {en: Doctor}]
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَنا بَعْدْني تِلْميذِة بِالجّامْعَة.
          tokens: [{surface: أَنا, sense: ana}, {surface: بَعْدْني, sense: ba3d.still, morphs: [{surface: بَعْدْ, kc: 'sense:ba3d.still'}, {surface: ني, kc: 'form:obj-1sg'}]}, {surface: تِلْميذِة, sense: tilmiz,
              form: 'form:fem'}, {surface: بِالجّامْعَة, sense: jem3a.uni, morphs: [{surface: بِ, kc: 'sense:b'}, {surface: ال, kc: 'sense:el'}, {surface: جّامْعَة, kc: 'sense:jem3a.uni'}]}]
        apc-Latn/arabizi:
          text: ana ba3dni tilmize bel jem3a.
          tokens: [{surface: ana, sense: ana}, {surface: ba3dni, sense: ba3d.still, morphs: [{surface: ba3d, kc: 'sense:ba3d.still'}, {surface: ni, kc: 'form:obj-1sg'}]}, {surface: tilmize, sense: tilmiz,
              form: 'form:fem'}, {surface: bel, sense: b, morphs: [{surface: b, kc: 'sense:b'}, {surface: el, kc: 'sense:el'}]}, {surface: jem3a, sense: jem3a.uni}]
      translations: {en: I'm still a student at university.}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: عِنْدِك اِمْتِحان هَالجِمْعَة؟
          tokens: [{surface: عِنْدِك, sense: 3end, morphs: [{surface: عِنْدِ, kc: 'sense:3end'}, {surface: ك, kc: 'form:poss-2fs'}]}, {surface: اِمْتِحان, sense: emte7an}, {surface: هَالجِمْعَة, sense: jem3a,
              morphs: [{surface: هَال, kc: 'sense:hal'}, {surface: جِمْعَة, kc: 'sense:jem3a'}]}]
        apc-Latn/arabizi:
          text: 3endik emte7an hal jem3a?
          tokens: [{surface: 3endik, sense: 3end, morphs: [{surface: 3end, kc: 'sense:3end'}, {surface: ik, kc: 'form:poss-2fs'}]}, {surface: emte7an, sense: emte7an}, {surface: hal, sense: hal}, {surface: jem3a,
              sense: jem3a}]
      translations: {en: 'Do you have an exam this week?'}
  - line:
      speaker: maya
      ask: arrange
      forms:
        apc-Arab/standard:
          text: إيه، ولازِم اِدْرُس كْتير.
          tokens: [{surface: إيه, sense: eh}, {surface: ولازِم, sense: lezem, morphs: [{surface: و, kc: 'sense:w'}, {surface: لازِم, kc: 'sense:lezem'}]}, {surface: اِدْرُس, sense: daras, form: 'form:subj-1sg'},
            {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: eh, w lezem edros ktir.
          tokens: [{surface: eh, sense: eh}, {surface: w, sense: w}, {surface: lezem, sense: lezem}, {surface: edros, sense: daras, form: 'form:subj-1sg'}, {surface: ktir, sense: ktir}]
      translations: {en: 'Yes, and I have to study a lot.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: بَعْرِف إِنُّه رَح تَعْمْلي مْنيح.
          tokens: [{surface: بَعْرِف, sense: 3eref, form: 'form:impf-1sg'}, {surface: إِنُّه, sense: enno}, {surface: رَح, sense: ra7.fut}, {surface: تَعْمْلي, sense: 3emel, form: 'form:subj-2fs'}, {surface: مْنيح,
              sense: mni7}]
        apc-Latn/arabizi:
          text: ba3ref enno ra7 ta3mli mni7.
          tokens: [{surface: ba3ref, sense: 3eref, form: 'form:impf-1sg'}, {surface: enno, sense: enno}, {surface: ra7, sense: ra7.fut}, {surface: ta3mli, sense: 3emel, form: 'form:subj-2fs'}, {surface: mni7,
              sense: mni7}]
      translations: {en: I know you'll do well.}
  - choose:
      prompt: {en: 'What does Maya have this week?'}
