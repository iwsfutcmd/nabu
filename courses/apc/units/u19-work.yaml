# Fixture course (apc), unit 19: study and work, and joining sentences. The university, lessons and exams;
# jobs, a company and the boss; Sar (became, and Sarli…: I've been … for); iza (if) with the present or
# the future; la2anno (because); enno (that) after know, say and think.
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapters 10 (Sar,
# enn-), 21 (conditionals) and 4 (nouns of profession): every sentence awaits a native speaker's review.
id: u19-work
title: {en: Work and study}
cefr: A2
kcs:
- {id: 'sense:jem3a.uni', gloss: {en: university}, forms: {apc-Arab/standard: [جامعة], apc-Latn/arabizi: [jem3a]}, notes: {en: 'Arabic script tells it from الجمعة (Friday, week): جامعة. In Arabizi both
      are often jem3a; also jam3a.'}}
- {id: 'sense:tilmiz', gloss: {en: student; pupil}, forms: {apc-Arab/standard: [تلميذ], apc-Latn/arabizi: [tilmiz]}, notes: {en: 'A woman: تلميذة, tilmize.'}}
- {id: 'sense:daras', gloss: {en: study}, forms: {apc-Arab/standard: [بدرس], apc-Latn/arabizi: [bedros]}, notes: {en: 'bedros: I study; btidros: you study; lezem edros: I have to study.'}}
- {id: 'sense:dars', gloss: {en: lesson; class}, forms: {apc-Arab/standard: [درس], apc-Latn/arabizi: [dars]}}
- {id: 'sense:emte7an', gloss: {en: exam; test}, forms: {apc-Arab/standard: [امتحان], apc-Latn/arabizi: [emte7an]}}
- {id: 'sense:mhandes', gloss: {en: engineer}, forms: {apc-Arab/standard: [مهندس], apc-Latn/arabizi: [mhandes]}, notes: {en: 'A woman: مهندسة, mhandse.'}}
- {id: 'sense:sherke', gloss: {en: company; firm}, forms: {apc-Arab/standard: [شركة], apc-Latn/arabizi: [sherke]}}
- {id: 'sense:mudir', gloss: {en: boss; manager; director}, forms: {apc-Arab/standard: [مدير], apc-Latn/arabizi: [mudir]}}
- {id: 'sense:sar', gloss: {en: become; (with -li) it's been}, forms: {apc-Arab/standard: [صار], apc-Latn/arabizi: [sar]}, notes: {en: 'sar 3omri tleten: I''ve turned thirty. sarli sinten 3am eshteghel
      hon: I''ve been working here for two years (literally ''it has become two years for me'').'}}
- {id: 'form:la-2ms', gloss: {en: '-lak: to you; for you (on a verb, to a man)'}, notes: {en: 'sarlak: it''s been … for you; 2ellak: he told you. Arabic script: لك joined to the verb.'}}
- {id: 'sense:iza', gloss: {en: if}, forms: {apc-Arab/standard: [إذا], apc-Latn/arabizi: [iza]}, notes: {en: 'iza fi matar, ma ra7 nru7: if it rains, we won''t go. The verb after iza: present (with b-)
      or past.'}}
- {id: 'sense:la2anno', gloss: {en: because}, forms: {apc-Arab/standard: [لأنّه], apc-Latn/arabizi: [la2anno]}, notes: {en: Written لأنّه or لأنّو.}}
- {id: 'sense:enno', gloss: {en: 'that (after know, say, think)'}, forms: {apc-Arab/standard: [إنّه], apc-Latn/arabizi: [enno]}, notes: {en: 'ba3ref enno…: I know that…. Also a filler word, like ''I mean''.
      Written إنّه or إنّو.'}}
- {id: 'sense:fakkar', gloss: {en: think}, forms: {apc-Arab/standard: [بفكّر], apc-Latn/arabizi: [bfakker]}, notes: {en: 'bfakker enno…: I think that….'}}
nodes:
- {id: apc.work.study, kind: lesson, introduces: ['sense:jem3a.uni', 'sense:tilmiz', 'sense:daras', 'sense:dars', 'sense:emte7an']}
- {id: apc.work.job, kind: lesson, introduces: ['sense:mhandes', 'sense:sherke', 'sense:mudir', 'sense:sar', 'form:la-2ms']}
- {id: apc.work.if-because, kind: lesson, introduces: ['sense:iza', 'sense:la2anno']}
- {id: apc.work.that, kind: lesson, introduces: ['sense:enno', 'sense:fakkar']}
- {id: apc.work.story, kind: story}
