stories:
- id: apc.story.saturday-night
  node: apc.plans.story
  title: {en: Saturday night}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
  characters:
  - {id: sami, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، شو بْتَعْمْلي اللَّيْلِة؟
          tokens: [{surface: مايا, sense: maya}, {surface: شو, sense: shu}, {surface: بْتَعْمْلي, sense: 3emel, form: 'form:impf-2fs'}, {surface: اللَّيْلِة, sense: lele, morphs: [{surface: ال, kc: 'sense:el'},
                {surface: لَّيْلِة, kc: 'sense:lele'}]}]
        apc-Latn/arabizi:
          text: Maya, shu bta3mli el lele?
          tokens: [{surface: Maya, sense: maya}, {surface: shu, sense: shu}, {surface: bta3mli, sense: 3emel, form: 'form:impf-2fs'}, {surface: el, sense: el}, {surface: lele, sense: lele}]
      translations: {en: 'Maya, what are you doing tonight?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: ما بَعْرِف، يَعْني… فاضْيِة.
          tokens: [{surface: ما, sense: ma}, {surface: بَعْرِف, sense: 3eref, form: 'form:impf-1sg'}, {surface: يَعْني, sense: ya3ni}, {surface: فاضْيِة, sense: fadi, form: 'form:fem'}]
        apc-Latn/arabizi:
          text: ma ba3ref, ya3ni... fadye.
          tokens: [{surface: ma, sense: ma}, {surface: ba3ref, sense: 3eref, form: 'form:impf-1sg'}, {surface: ya3ni, sense: ya3ni}, {surface: fadye, sense: fadi, form: 'form:fem'}]
      translations: {en: 'I don''t know, well… I''m free.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: في سَهْرَة عِنْد خَيّي. يَلّا تا نْروح!
          tokens: [{surface: في, sense: fi}, {surface: سَهْرَة, sense: sahra}, {surface: عِنْد, sense: 3end}, {surface: خَيّي, sense: khayy, morphs: [{surface: خَيّ, kc: 'sense:khayy'}, {surface: ي, kc: 'form:poss-1sg'}]},
            {surface: يَلّا, sense: yalla}, {surface: تا, sense: ta}, {surface: نْروح, sense: ra7, form: 'form:subj-1pl'}]
        apc-Latn/arabizi:
          text: fi sahra 3end khayyi. yalla ta nru7!
          tokens: [{surface: fi, sense: fi}, {surface: sahra, sense: sahra}, {surface: 3end, sense: 3end}, {surface: khayyi, sense: khayy, morphs: [{surface: khayy, kc: 'sense:khayy'}, {surface: i, kc: 'form:poss-1sg'}]},
            {surface: yalla, sense: yalla}, {surface: ta, sense: ta}, {surface: nru7, sense: ra7, form: 'form:subj-1pl'}]
      translations: {en: 'There''s a party at my brother''s. Come on, let''s go!'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: والله؟ إِمْتى؟
          tokens: [{surface: والله, sense: walla}, {surface: إِمْتى, sense: emta}]
        apc-Latn/arabizi:
          text: walla? emta?
          tokens: [{surface: walla, sense: walla}, {surface: emta, sense: emta}]
      translations: {en: 'Really? When?'}
  - line:
      speaker: sami
      ask: complete
      gap: sense:tmene
      distractors: ['sense:bard', 'sense:shams']
      forms:
        apc-Arab/standard:
          text: الساعَة تْمانِة.
          tokens: [{surface: الساعَة, sense: sa3a, morphs: [{surface: ال, kc: 'sense:el'}, {surface: ساعَة, kc: 'sense:sa3a'}]}, {surface: تْمانِة, sense: tmene}]
        apc-Latn/arabizi:
          text: el sa3a tmene.
          tokens: [{surface: el, sense: el}, {surface: sa3a, sense: sa3a}, {surface: tmene, sense: tmene}]
      translations: {en: At eight o'clock.}
  - choose:
      prompt:
        en: Where is the party?
      options: [{en: At Sami's brother's}, {en: At Maya's house}, {en: At the beach}]
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بَسّ في مَطَر وبَرْد كْتير!
          tokens: [{surface: بَسّ, sense: bas}, {surface: في, sense: fi}, {surface: مَطَر, sense: matar}, {surface: وبَرْد, sense: bard, morphs: [{surface: و, kc: 'sense:w'}, {surface: بَرْد, kc: 'sense:bard'}]},
            {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: bas fi matar w bard ktir!
          tokens: [{surface: bas, sense: bas}, {surface: fi, sense: fi}, {surface: matar, sense: matar}, {surface: w, sense: w}, {surface: bard, sense: bard}, {surface: ktir, sense: ktir}]
      translations: {en: But it's raining and it's very cold!}
  - line:
      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: مَعْليش! البَيْت قَريب.
          tokens: [{surface: مَعْليش, sense: ma3lesh}, {surface: البَيْت, sense: bet, morphs: [{surface: ال, kc: 'sense:el'}, {surface: بَيْت, kc: 'sense:bet'}]}, {surface: قَريب, sense: 2arib}]
        apc-Latn/arabizi:
          text: ma3lesh! el bet 2arib.
          tokens: [{surface: ma3lesh, sense: ma3lesh}, {surface: el, sense: el}, {surface: bet, sense: bet}, {surface: 2arib, sense: 2arib}]
      translations: {en: Never mind! The house is close.}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: خَلَص، رايْحَة! بَسّ ما بْحِبّ اُرْقُص.
          tokens: [{surface: خَلَص, sense: khalas}, {surface: رايْحَة, sense: raye7, form: 'form:fem'}, {surface: بَسّ, sense: bas}, {surface: ما, sense: ma}, {surface: بْحِبّ, sense: 7abb, form: 'form:impf-1sg'},
            {surface: اُرْقُص, sense: ra2as, form: 'form:subj-1sg'}]
        apc-Latn/arabizi:
          text: khalas, ray7a! bas ma b7ebb or2os.
          tokens: [{surface: khalas, sense: khalas}, {surface: ray7a, sense: raye7, form: 'form:fem'}, {surface: bas, sense: bas}, {surface: ma, sense: ma}, {surface: b7ebb, sense: 7abb, form: 'form:impf-1sg'},
            {surface: or2os, sense: ra2as, form: 'form:subj-1sg'}]
      translations: {en: 'OK, I''m coming! But I don''t like to dance.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مْنيح! مْنِسْمَع موسيقى ومْناكُل.
          tokens: [{surface: مْنيح, sense: mni7}, {surface: مْنِسْمَع, sense: sama3, form: 'form:impf-1pl'}, {surface: موسيقى, sense: musi2a}, {surface: ومْناكُل, sense: akal, form: 'form:impf-1pl', morphs: [
                {surface: و, kc: 'sense:w'}, {surface: مْناكُل, kc: 'sense:akal'}]}]
        apc-Latn/arabizi:
          text: mni7! mnesma3 musi2a w mnekol.
          tokens: [{surface: mni7, sense: mni7}, {surface: mnesma3, sense: sama3, form: 'form:impf-1pl'}, {surface: musi2a, sense: musi2a}, {surface: w, sense: w}, {surface: mnekol, sense: akal, form: 'form:impf-1pl'}]
      translations: {en: Fine! We'll listen to music and eat.}
  - choose:
      prompt:
        en: Why doesn't Maya want to go at first?
      options: [{en: It's raining and cold}, {en: She is busy}, {en: She is tired}]
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: يَلّا، إِن شاء الله سَهْرَة حِلْوِة!
          tokens: [{surface: يَلّا, sense: yalla}, {surface: إِن, sense: inshalla}, {surface: شاء, sense: inshalla}, {surface: الله, sense: inshalla}, {surface: سَهْرَة, sense: sahra}, {surface: حِلْوِة,
              sense: 7elo, form: 'form:fem'}]
        apc-Latn/arabizi:
          text: yalla, inshalla sahra 7elwe!
          tokens: [{surface: yalla, sense: yalla}, {surface: inshalla, sense: inshalla}, {surface: sahra, sense: sahra}, {surface: 7elwe, sense: 7elo, form: 'form:fem'}]
      translations: {en: 'OK, here''s to a nice evening!'}
scenarios:
- id: apc.weekend-plans
  after: apc.plans.story
  title: {en: Plans for the weekend}
  setting: {en: Friday afternoon. You and a friend are planning the weekend in Beirut; the weather keeps changing.}
  character: {en: 'Maya, a fun-loving friend who always has an idea for going out.'}
  goal: {en: 'Make plans together: say when you are free or busy, react to the weather, suggest where to go (the sea, the mountains, a film, a night out at home) and agree on a day and a time.'}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
