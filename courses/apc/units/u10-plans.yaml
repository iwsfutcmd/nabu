# Fixture course (apc), unit 10: plans, weather and everyday expressions. raye7 / ray7a (going), ta + verb
# (let's; so that), going out tonight, the weather, and the words that hold Lebanese conversation together:
# inshalla, ya3ni, khalas, ma3lesh, walla, akid, ya reit, mazbout, ahla w sahla.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: u10-plans
title: {en: Plans for tonight}
cefr: A2
kcs:
- {id: 'sense:raye7', gloss: {en: going (a man going somewhere)}, forms: {apc-Arab/standard: [رايح, رايحة], apc-Latn/arabizi: [raye7, ray7a]}, notes: {en: 'wen raye7? Where are you going? To a woman: wen
      ray7a?'}}
- {id: 'sense:ta', gloss: {en: let's; so that (before a verb without b-)}, forms: {apc-Arab/standard: [تا], apc-Latn/arabizi: [ta]}, notes: {en: 'yalla ta nru7: come on, let''s go.'}}
- {id: 'sense:lele', gloss: {en: night; tonight (el lele)}, forms: {apc-Arab/standard: [الليلة], apc-Latn/arabizi: [lele]}, notes: {en: 'el lele: tonight.'}}
