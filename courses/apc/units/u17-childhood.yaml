stories:
- id: apc.story.teta-childhood
  node: apc.child.story
  title: {en: When Teta was little}
  provenance: {author: 'llm:claude@490b6002424f', status: draft}
  characters:
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  - {id: teta, speaker: f, name: {apc-Arab/standard: تيتا, apc-Latn/arabizi: Teta}}
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: تيتا، شو كِنْتي تَعْمْلي لَمّا كِنْتي زْغيرِة؟
          tokens: [{surface: تيتا, sense: teta}, {surface: شو, sense: shu}, {surface: كِنْتي, sense: kan, form: 'form:past-2fs'}, {surface: تَعْمْلي, sense: 3emel, form: 'form:subj-2fs'}, {surface: لَمّا,
              sense: lamma}, {surface: كِنْتي, sense: kan, form: 'form:past-2fs'}, {surface: زْغيرِة, sense: zghir, form: 'form:fem'}]
        apc-Latn/arabizi:
          text: teta, shu kenti ta3mli lamma kenti zghire?
          tokens: [{surface: teta, sense: teta}, {surface: shu, sense: shu}, {surface: kenti, sense: kan, form: 'form:past-2fs'}, {surface: ta3mli, sense: 3emel, form: 'form:subj-2fs'}, {surface: lamma,
              sense: lamma}, {surface: kenti, sense: kan, form: 'form:past-2fs'}, {surface: zghire, sense: zghir, form: 'form:fem'}]
      translations: {en: 'Grandma, what did you use to do when you were little?'}
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: كِنّا نْعيش بِالضَّيْعَة. كِنْت روح عَالمَدْرَسِة لَحالي.
          tokens: [{surface: كِنّا, sense: kan, form: 'form:past-1pl'}, {surface: نْعيش, sense: 3ash, form: 'form:subj-1pl'}, {surface: بِالضَّيْعَة, sense: day3a, morphs: [{surface: بِ, kc: 'sense:b'},
                {surface: ال, kc: 'sense:el'}, {surface: ضَّيْعَة, kc: 'sense:day3a'}]}, {surface: كِنْت, sense: kan, form: 'form:past-1sg'}, {surface: روح, sense: ra7, form: 'form:subj-1sg'}, {surface: عَالمَدْرَسِة,
              sense: madrase, morphs: [{surface: عَ, kc: 'sense:3a'}, {surface: ال, kc: 'sense:el'}, {surface: مَدْرَسِة, kc: 'sense:madrase'}]}, {surface: لَحالي, sense: la7al, morphs: [{surface: لَحال,
                  kc: 'sense:la7al'}, {surface: ي, kc: 'form:poss-1sg'}]}]
        apc-Latn/arabizi:
          text: kenna n3ish bel day3a. kent ru7 3al madrase la7ali.
          tokens: [{surface: kenna, sense: kan, form: 'form:past-1pl'}, {surface: n3ish, sense: 3ash, form: 'form:subj-1pl'}, {surface: bel, sense: b, morphs: [{surface: b, kc: 'sense:b'}, {surface: el,
                  kc: 'sense:el'}]}, {surface: day3a, sense: day3a}, {surface: kent, sense: kan, form: 'form:past-1sg'}, {surface: ru7, sense: ra7, form: 'form:subj-1sg'}, {surface: 3al, sense: 3a, morphs: [
                {surface: 3a, kc: 'sense:3a'}, {surface: l, kc: 'sense:el'}]}, {surface: madrase, sense: madrase}, {surface: la7ali, sense: la7al, morphs: [{surface: la7al, kc: 'sense:la7al'}, {surface: i,
                  kc: 'form:poss-1sg'}]}]
      translations: {en: We used to live in the village. I used to walk to school by myself.}
  - line:
      speaker: maya
      ask: complete
      gap: sense:la7al
      distractors: ['sense:sawa']
      forms:
        apc-Arab/standard:
          text: لَحالِك؟
          tokens: [{surface: لَحالِك, sense: la7al, morphs: [{surface: لَحالِ, kc: 'sense:la7al'}, {surface: ك, kc: 'form:poss-2fs'}]}]
        apc-Latn/arabizi:
          text: la7alik?
          tokens: [{surface: la7alik, sense: la7al, morphs: [{surface: la7al, kc: 'sense:la7al'}, {surface: ik, kc: 'form:poss-2fs'}]}]
      translations: {en: 'By yourself?'}
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: إيه. وبَعْد المَدْرَسِة كِنّا نِلْعَب بِالضَّيْعَة.
          tokens: [{surface: إيه, sense: eh}, {surface: وبَعْد, sense: ba3d, morphs: [{surface: و, kc: 'sense:w'}, {surface: بَعْد, kc: 'sense:ba3d'}]}, {surface: المَدْرَسِة, sense: madrase, morphs: [
                {surface: ال, kc: 'sense:el'}, {surface: مَدْرَسِة, kc: 'sense:madrase'}]}, {surface: كِنّا, sense: kan, form: 'form:past-1pl'}, {surface: نِلْعَب, sense: le3eb, form: 'form:subj-1pl'},
            {surface: بِالضَّيْعَة, sense: day3a, morphs: [{surface: بِ, kc: 'sense:b'}, {surface: ال, kc: 'sense:el'}, {surface: ضَّيْعَة, kc: 'sense:day3a'}]}]
        apc-Latn/arabizi:
          text: eh. w ba3d el madrase kenna nel3ab bel day3a.
          tokens: [{surface: eh, sense: eh}, {surface: w, sense: w}, {surface: ba3d, sense: ba3d}, {surface: el, sense: el}, {surface: madrase, sense: madrase}, {surface: kenna, sense: kan, form: 'form:past-1pl'},
            {surface: nel3ab, sense: le3eb, form: 'form:subj-1pl'}, {surface: bel, sense: b, morphs: [{surface: b, kc: 'sense:b'}, {surface: el, kc: 'sense:el'}]}, {surface: day3a, sense: day3a}]
      translations: {en: Yes. And after school we used to play in the village.}
