          text: وكان في تِلِفون؟
          tokens: [{surface: وكان, sense: kan, form: 'form:past-3ms', morphs: [{surface: و, kc: 'sense:w'}, {surface: كان, kc: 'sense:kan'}]}, {surface: في, sense: fi}, {surface: تِلِفون, sense: telefon}]
