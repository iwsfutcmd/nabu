          tokens: [{surface: تيتا, sense: teta}, {surface: شو, sense: shu}, {surface: كِنْتي, sense: kan, form: 'form:past-2fs'}, {surface: تَعْمْلي, sense: 3emel, form: 'form:subj-2fs'}, {surface: لَمّا,
