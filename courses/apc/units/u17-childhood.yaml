# Fixture course (apc), unit 17: the past of habits and of what was going on. kent + a verb without b- (kent ru7:
# I used to go), kent 3am + verb (kent 3am e2ra: I was reading), lamma (when), ba3d- with an ending (ba3dni:
# I'm still), la7al- (la7ali: by myself) and ma 3ad (no longer).
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapters 6 (ba3d-,
# ma 3ad), 16 (3am), 22 (the imperfect past) and 26 (lamma): every sentence awaits a native speaker's review.
id: u17-childhood
title: {en: When I was little}
cefr: A2
kcs:
- {id: 'construction:used-to', gloss: {en: 'kent + a verb without b-: used to; would'}, notes: {en: 'kent ru7: I used to go; kenna nekol: we used to eat; ken yishteghel: he used to work. Both verbs agree
      with who did it.'}}
- {id: 'sense:lamma', gloss: {en: when (not a question)}, forms: {apc-Arab/standard: [لمّا], apc-Latn/arabizi: [lamma]}, notes: {en: 'lamma kent zghir: when I was little. In a question, when is emta.'}}
- {id: 'sense:3ash', gloss: {en: live (one's life); live somewhere}, forms: {apc-Arab/standard: [عاش], apc-Latn/arabizi: [3ash]}, notes: {en: 'kenna n3ish bel day3a: we used to live in the village. Where
      someone lives now: seken.'}}
- {id: 'construction:was-doing', gloss: {en: 'kent 3am + verb: was …ing'}, notes: {en: 'kent 3am e2ra: I was reading; keno 3am yeklo: they were eating.'}}
- {id: 'sense:m3allem', gloss: {en: teacher}, forms: {apc-Arab/standard: [معلّم], apc-Latn/arabizi: [m3allem]}, notes: {en: 'A woman: معلّمة, m3allme.'}}
- {id: 'sense:ba3d.still', gloss: {en: 'still (with an ending: ba3dni, ba3dak…)'}, forms: {apc-Arab/standard: [بعد], apc-Latn/arabizi: [ba3d]}, notes: {en: 'ba3dni (I''m still), ba3dak / ba3dik (you), ba3do
      (he), ba3da (she), ba3dna (we), ba3dkon (you, several), ba3don (they). ''I'' takes -ni, as on a verb.'}}
- {id: 'sense:la7al', gloss: {en: 'alone; by oneself (with an ending: la7ali, la7alo…)'}, forms: {apc-Arab/standard: [لحال], apc-Latn/arabizi: [la7al]}, notes: {en: 'la7ali: by myself; la7alo: by himself.'}}
- {id: 'sense:ma-3ad', gloss: {en: no longer; not … any more}, forms: {apc-Arab/standard: [ما عاد], apc-Latn/arabizi: [ma 3ad]}, notes: {en: 'ma 3ad 3endi wa2t: I don''t have time any more. Also ma 3ash
      (Kline 2022).'}}
nodes:
- {id: apc.child.used-to, kind: lesson, introduces: ['construction:used-to', 'sense:lamma', 'sense:3ash']}
- {id: apc.child.was-doing, kind: lesson, introduces: ['construction:was-doing', 'sense:m3allem']}
- {id: apc.child.still, kind: lesson, introduces: ['sense:ba3d.still', 'sense:la7al', 'sense:ma-3ad']}
- {id: apc.child.story, kind: story}
