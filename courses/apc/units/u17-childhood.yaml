          tokens: [{surface: teta, sense: teta}, {surface: shu, sense: shu}, {surface: kenti, sense: kan, form: 'form:past-2fs'}, {surface: ta3mli, sense: 3emel, form: 'form:subj-2fs'}, {surface: lamma,
