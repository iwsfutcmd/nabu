  register: colloquial
  forms:
    apc-Arab/standard:
      text: باكل منقوشة.
      tokens: [{surface: باكل, sense: akal, form: 'form:impf-1sg'}, {surface: منقوشة, sense: man2oushe}]
      reverse: (باكل|أنا باكل) منقوشة
    apc-Latn/arabizi:
      text: bekol man2oushe.
      tokens: [{surface: bekol, sense: akal, form: 'form:impf-1sg'}, {surface: man2oushe, sense: man2oushe}]
      reverse: ((bekol|bakol|b2akol)|ana (bekol|bakol|b2akol)) (man2oushe|manoushe|man2ushi|mankoushe)
  translations:
    en: |-
      I eat a (man'oushe|manakish).
      I('ll| will) (eat|have) a (man'oushe|manakish).
      I('m| am) having a (man'oushe|manakish).
