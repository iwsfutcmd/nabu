# Fixture course (apc), unit 6: my day. The b- present: each person is a form KC on the verb token
# (b- I, bt- you, bi- he, bt- she, mn- we, bt-…-i you to a woman); the verb's sense is the lexeme.
# Arabic-script bt- forms are ambiguous (you / she): the token says which. Morning, evening, every day.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: u06-day
title: {en: My day}
cefr: A1
kcs:
- {id: 'form:impf-1sg', gloss: {en: 'b-: I (present)'}, notes: {en: 'bekol: I eat; bishrab: I drink. Present, habit, or what I''m about to do.'}}
- {id: 'sense:sob7', gloss: {en: morning}, forms: {apc-Arab/standard: [صبح], apc-Latn/arabizi: [sob7]}, image: {file: ../images/sunrise.svg, license: CC0-1.0, provenance: {author: 'llm:claude@6e8439dc1c29',
      status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'el sob7: in the morning.'}}
- {id: 'sense:fi2', gloss: {en: wake up}, forms: {apc-Arab/standard: [بفيق], apc-Latn/arabizi: [bfi2]}}
- {id: 'sense:bakkir', gloss: {en: early}, forms: {apc-Arab/standard: [بكّير], apc-Latn/arabizi: [bakkir]}}
- {id: 'sense:ra7', gloss: {en: go}, forms: {apc-Arab/standard: [بروح, منروح, بتروحي, نروح, بتروح, رحت, راح, راحت, رحنا, رحتي], apc-Latn/arabizi: [bru7, mnru7, btru7i, nru7, btru7, ru7t, ra7, ra7et, ru7na,
      ru7ti]}}
- {id: 'sense:3emel', gloss: {en: do; make}, forms: {apc-Arab/standard: [بعمل, بتعمل, بتعملي, تعمل, عملت, منعمل], apc-Latn/arabizi: [ba3mel, bta3mel, bta3mli, ta3mel, 3melt, mna3mel]}}
- {id: 'form:impf-2ms', gloss: {en: 'bt-: you (present, to a man)'}, notes: {en: 'btishrab: you drink. The same form means ''she'': bt- is both.'}}
- {id: 'sense:eshteghel', gloss: {en: work}, forms: {apc-Arab/standard: [بشتغل, بتشتغل, بيشتغل], apc-Latn/arabizi: [bishteghel, btishteghel, byishteghel]}}
- {id: 'sense:2ara', gloss: {en: read}, forms: {apc-Arab/standard: [بقرا, بتقرا, بيقرا, اقرا], apc-Latn/arabizi: [b2ra, bti2ra, byi2ra, e2ra]}}
- {id: 'form:impf-3ms', gloss: {en: 'bi-: he (present)'}, notes: {en: 'byishteghel: he works. Arabic script: بي joined to the verb (بيشتغل).'}}
- {id: 'form:impf-3fs', gloss: {en: 'bt-: she (present)'}, notes: {en: 'btishteghel: she works; the same form as ''you'' to a man.'}}
- {id: 'sense:nem', gloss: {en: sleep; go to bed}, forms: {apc-Arab/standard: [بنام, بتنام], apc-Latn/arabizi: [bnem, btnem]}}
- {id: 'sense:masa', gloss: {en: evening}, forms: {apc-Arab/standard: [مسا], apc-Latn/arabizi: [masa]}, notes: {en: 'el masa: in the evening.'}}
- {id: 'form:impf-1pl', gloss: {en: 'mn-: we (present)'}, notes: {en: 'mnru7: we go; mnishrab: we drink. Arabic script: من joined to the verb (منروح).'}}
- {id: 'sense:yom', gloss: {en: day}, forms: {apc-Arab/standard: [يوم], apc-Latn/arabizi: [yom]}, notes: {en: 'el yom: today.'}}
- {id: 'sense:kell', gloss: {en: every; all}, forms: {apc-Arab/standard: [كلّ], apc-Latn/arabizi: [kell]}, notes: {en: 'kell yom: every day.'}}
- {id: 'sense:dayman', gloss: {en: always}, forms: {apc-Arab/standard: [دايما], apc-Latn/arabizi: [dayman]}}
- {id: 'sense:ba3dein', gloss: {en: then; later; afterwards}, forms: {apc-Arab/standard: [بعدين], apc-Latn/arabizi: [ba3dein]}}
- {id: 'sense:hala2', gloss: {en: now}, forms: {apc-Arab/standard: [هلّق], apc-Latn/arabizi: [hala2]}}
- {id: 'sense:7aka', gloss: {en: speak; talk}, forms: {apc-Arab/standard: [بحكي, بتحكي], apc-Latn/arabizi: [b7ki, bt7ki]}}
- {id: 'sense:3arabe', gloss: {en: Arabic}, forms: {apc-Arab/standard: [عربي], apc-Latn/arabizi: [3arabe]}}
- {id: 'sense:englize', gloss: {en: English}, forms: {apc-Arab/standard: [إنكليزي], apc-Latn/arabizi: [englize]}}
- {id: 'form:impf-2fs', gloss: {en: 'bt-…-i: you (present, to a woman)'}, notes: {en: 'btishrabi: you drink; bta3mli: you do. Arabic script: بت before the verb and ي after it (بتشربي).'}}
- {id: 'sense:enti', gloss: {en: you (to a woman)}, forms: {apc-Arab/standard: [إنتي], apc-Latn/arabizi: [enti]}}
- {id: 'sense:m2akhkhar', gloss: {en: late}, forms: {apc-Arab/standard: [مأخّر, مأخّرة], apc-Latn/arabizi: [m2akhkhar, m2akhkhra]}}
- {id: 'form:impf-2pl', gloss: {en: 'bt-…-o: you (present, to several people)'}, notes: {en: 'btishrabo: you drink; bta3mlo: you do. Arabic script: بت before the verb and وا after it (بتشربوا).'}}
- {id: 'sense:ento', gloss: {en: you (to several people)}, forms: {apc-Arab/standard: [إنتو], apc-Latn/arabizi: [ento]}}
