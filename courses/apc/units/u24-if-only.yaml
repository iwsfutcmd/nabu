        apc-Latn/arabizi:
          text: ba3mel 7afle kbire la kell el ahl.
          tokens: [{surface: ba3mel, lexeme: 3emel, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: 7afle, lexeme: 7afle, feats: {Number: Sing}}, {surface: kbire, lexeme: kbir, feats: {
                Gender: Fem, Number: Sing}}, {surface: la, lexeme: la, n: 4, head: 5, rel: case}, {surface: kell, lexeme: kell, n: 5}, {surface: el, lexeme: el, n: 6, head: 7, rel: det}, {surface: ahl,
              lexeme: ahl, feats: {Number: Plur}, n: 7}]
      translations:
        en: I'd throw a big party for all the family.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: يا ريت!
          tokens: [{surface: يا, lexeme: ya-reit}, {surface: ريت, lexeme: ya-reit}]
        apc-Latn/arabizi:
          text: ya reit!
          tokens: [{surface: ya, lexeme: ya-reit}, {surface: reit, lexeme: ya-reit}]
      translations:
        en: If only!
  - choose:
      prompt:
        en: What would Maya do?
      options:
      - en: Throw a party for the family
      - en: Buy a house
      - en: Travel every month
      answer: 0
