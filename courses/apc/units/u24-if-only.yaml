# Fixture course (apc), unit 24: imaginary conditions and wishes (Kline, chapter 21). law with the b-present for
# what would happen (law ma3i masari, beshtere bet); law with ken and the past for what would have happened (law
# 3reft, kent re7t); iza with the b-present for a real condition (iza btshatti bukra, ma mnenzal); wishes with ya
# reit; and ken lezem, 'should have' (ken lezem ruh bakkir). Drafted by an LLM (provenance llm:…, status draft) and
# checked against Kline (2022), chapters 15 and 21: every sentence awaits a native speaker's review.
id: u24-if-only
title:
  en: If only…
cefr: B1
nodes:
- {id: apc.if.would, kind: lesson, introduces: ['lexeme:law']}
- {id: apc.if.would-have, kind: lesson}
- {id: apc.if.wish, kind: lesson, introduces: ['lexeme:jdid']}
- {id: apc.if.should, kind: lesson}
- {id: apc.if.for, kind: lesson, introduces: ['lexeme:la', 'lexeme:rebe7', 'lexeme:yansib']}
- {id: apc.if.story, kind: story}
