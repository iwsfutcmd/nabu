stories:
- id: apc.story.lottery
  node: apc.if.story
  title:
    en: The lottery
  provenance:
    author: llm:claude@apc-b1
    status: draft
  characters:
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي، لَو بْتِرْبَح اليانَصيب، شو بْتَعْمِل؟
          tokens: [{surface: سامي, lexeme: sami}, {surface: لَو, lexeme: law}, {surface: بْتِرْبَح, lexeme: rebe7, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {surface: اليانَصيب,
              lexemes: [{lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: yansib, surface: يانَصيب, base: true, feats: {Number: Sing}, n: 5}]}, {surface: شو, lexeme: shu}, {surface: بْتَعْمِل,
              lexeme: 3emel, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}]
        apc-Latn/arabizi:
          text: Sami, law bterba7 el yanasib, shu bta3mel?
          tokens: [{surface: Sami, lexeme: sami}, {surface: law, lexeme: law}, {surface: bterba7, lexeme: rebe7, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}, {surface: el,
              lexeme: el, n: 4, head: 5, rel: det}, {surface: yanasib, lexeme: yansib, feats: {Number: Sing}, n: 5}, {surface: shu, lexeme: shu}, {surface: bta3mel, lexeme: 3emel, feats: {Aspect: Imp, Gender: Masc,
                Mood: Ind, Number: Sing, Person: '2'}}]
      translations:
        en: Sami, if you won the lottery, what would you do?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: بِشْتِري بيت عَالبَحِر.
          tokens: [{surface: بِشْتِري, lexeme: eshtara, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: بيت, lexeme: bet, feats: {Number: Sing}}, {surface: عَالبَحِر, lexemes: [{
                  lexeme: 3a, surface: عَ, n: 3, head: 5, rel: case}, {lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: ba7r, surface: بَحِر, base: true, feats: {Number: Sing}, n: 5}]}]
        apc-Latn/arabizi:
          text: beshteri bet 3al ba7r.
          tokens: [{surface: beshteri, lexeme: eshtara, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: bet, lexeme: bet, feats: {Number: Sing}}, {surface: 3al, lexemes: [{lexeme: 3a,
                  surface: 3a, n: 3, head: 5, rel: case, base: true}, {lexeme: el, surface: l, n: 4, head: 5, rel: det}]}, {surface: ba7r, lexeme: ba7r, feats: {Number: Sing}, n: 5}]
      translations:
        en: I'd buy a house by the sea.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: وإِنْتَ؟ ما بْتْسافِر؟
          tokens: [{surface: وإِنْتَ, lexemes: [{lexeme: w, surface: و}, {lexeme: enta, surface: إِنْتَ, base: true}]}, {surface: ما, lexeme: ma}, {surface: بْتْسافِر, lexeme: safar, feats: {Aspect: Imp,
                Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}]
        apc-Latn/arabizi:
          text: w enta? ma btsefer?
          tokens: [{surface: w, lexeme: w}, {surface: enta, lexeme: enta}, {surface: ma, lexeme: ma}, {surface: btsefer, lexeme: safar, feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}}]
      translations:
        en: And you? You wouldn't travel?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: أَكيد! بْسافِر كِلّ شَهِر.
          tokens: [{surface: أَكيد, lexeme: akid}, {surface: بْسافِر, lexeme: safar, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: كِلّ, lexeme: kell}, {surface: شَهِر, lexeme: shahr,
              feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: akid! bsefer kell shahr.
          tokens: [{surface: akid, lexeme: akid}, {surface: bsefer, lexeme: safar, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: kell, lexeme: kell}, {surface: shahr, lexeme: shahr,
              feats: {Number: Sing}}]
      translations:
        en: Of course! I'd travel every month.
  - choose:
      prompt:
        en: What would Sami buy?
      options:
      - en: A house by the sea
      - en: A new car
      - en: A ticket to Paris
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وإِنْتي، لَو بْتِرْبَحي؟
          tokens: [{surface: وإِنْتي, lexemes: [{lexeme: w, surface: و}, {lexeme: enti, surface: إِنْتي, base: true}]}, {surface: لَو, lexeme: law}, {surface: بْتِرْبَحي, lexeme: rebe7, feats: {Aspect: Imp,
                Gender: Fem, Mood: Ind, Number: Sing, Person: '2'}}]
        apc-Latn/arabizi:
          text: w enti, law bterba7i?
          tokens: [{surface: w, lexeme: w}, {surface: enti, lexeme: enti}, {surface: law, lexeme: law}, {surface: bterba7i, lexeme: rebe7, feats: {Aspect: Imp, Gender: Fem, Mood: Ind, Number: Sing, Person: '2'}}]
      translations:
        en: And you, if you won?
  - line:
      speaker: maya
      ask: complete
      gap: lexeme:ahl
      distractors:
      - lexeme:jiren
      - lexeme:shabeb
      forms:
        apc-Arab/standard:
          text: بَعْمِل حَفْلِة كْبيرِة لَكِلّ الأَهِل.
          tokens: [{surface: بَعْمِل, lexeme: 3emel, feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}}, {surface: حَفْلِة, lexeme: 7afle, feats: {Number: Sing}}, {surface: كْبيرِة, lexeme: kbir,
              feats: {Gender: Fem, Number: Sing}}, {surface: لَكِلّ, lexemes: [{lexeme: la, surface: لَ, n: 4, head: 5, rel: case}, {lexeme: kell, surface: كِلّ, base: true, n: 5}]}, {surface: الأَهِل,
