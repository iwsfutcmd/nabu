# Fixture course (apc), unit 16: numbers 11–19 and 30, the months (the Levantine names: kanoun el tene, shbat,
# adar… as used in Lebanon), awwal and tene (first, second), marra (a time), birthdays and kell sene w enta salem.
# 11–19 take a singular noun and keep their r before it (7da3shar sene) but not alone (7da3sh); the time
# drops it (el sa3a tna3sh).
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapter 25 (numbers,
# ordinals, telling the time): every sentence awaits a native speaker's review.
id: u16-dates
title: {en: 'When''s your birthday?'}
cefr: A2
