stories:
- id: apc.story.birthday
  node: apc.date.story
  title:
    en: Maya's birthday
  provenance:
    author: llm:claude@c50163d7a2cb
    status: draft
  characters:
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، إِمْتى عيد ميلادِك؟
          tokens: [{surface: مايا, lexeme: maya}, {surface: إِمْتى, lexeme: emta}, {surface: عيد, lexeme: 3id-milad}, {surface: ميلادِك, lexemes: [{lexeme: 3id-milad, surface: ميلادِ, base: true}, {lexeme: poss-2fs, surface: ك}]}]
        apc-Latn/arabizi:
          text: Maya, emta 3id miladik?
          tokens: [{surface: Maya, lexeme: maya}, {surface: emta, lexeme: emta}, {surface: 3id, lexeme: 3id-milad}, {surface: miladik, lexemes: [{lexeme: 3id-milad, surface: milad, base: true}, {lexeme: poss-2fs, surface: ik}]}]
      translations:
        en: Maya, when's your birthday?
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بَعِد بُكْرا! تْلاتَعْشْر نيسان.
          tokens: [{surface: بَعِد, lexeme: ba3d-bukra}, {surface: بُكْرا, lexeme: ba3d-bukra}, {surface: تْلاتَعْشْر, lexeme: tleta3sh, context: alone}, {surface: نيسان, lexeme: nisan}]
        apc-Latn/arabizi:
          text: ba3d bukra! tleta3sh nisan.
          tokens: [{surface: ba3d, lexeme: ba3d-bukra}, {surface: bukra, lexeme: ba3d-bukra}, {surface: tleta3sh, lexeme: tleta3sh}, {surface: nisan, lexeme: nisan}]
      translations:
        en: The day after tomorrow! The thirteenth of April.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: والله؟ قَدّيش رَح يْكون عُمْرِك؟
          tokens: [{surface: والله, lexeme: walla}, {surface: قَدّيش, lexeme: 2addesh}, {surface: رَح, lexeme: ra7.fut}, {surface: يْكون, lexeme: kan, feats: {Aspect: Imp, Gender: Masc, Mood: Sub, Number: Sing, Person: '3'}}, {surface: عُمْرِك, lexemes: [{lexeme: 3omr, surface: عُمْرِ, base: true, feats: {Number: Sing}}, {lexeme: poss-2fs, surface: ك}]}]
        apc-Latn/arabizi:
          text: walla? 2addesh ra7 ykoun 3omrik?
