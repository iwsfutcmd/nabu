stories:
- id: apc.story.birthday
  node: apc.date.story
  title: {en: Maya's birthday}
  provenance: {author: 'llm:claude@c50163d7a2cb', status: draft}
  characters:
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، إِمْتى عيد ميلادِك؟
          tokens: [{surface: مايا, sense: maya}, {surface: إِمْتى, sense: emta}, {surface: عيد, sense: 3id-milad}, {surface: ميلادِك, sense: 3id-milad, morphs: [{surface: ميلادِ, kc: 'sense:3id-milad'},
                {surface: ك, kc: 'form:poss-2fs'}]}]
        apc-Latn/arabizi:
          text: Maya, emta 3id miladik?
          tokens: [{surface: Maya, sense: maya}, {surface: emta, sense: emta}, {surface: 3id, sense: 3id-milad}, {surface: miladik, sense: 3id-milad, morphs: [{surface: milad, kc: 'sense:3id-milad'}, {
                  surface: ik, kc: 'form:poss-2fs'}]}]
      translations: {en: 'Maya, when''s your birthday?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بَعْد بُكْرا! تْلاتَعْشَر نيسان.
          tokens: [{surface: بَعْد, sense: ba3d-bukra}, {surface: بُكْرا, sense: ba3d-bukra}, {surface: تْلاتَعْشَر, sense: tleta3sh}, {surface: نيسان, sense: nisan}]
        apc-Latn/arabizi:
          text: ba3d bukra! tleta3sh nisan.
          tokens: [{surface: ba3d, sense: ba3d-bukra}, {surface: bukra, sense: ba3d-bukra}, {surface: tleta3sh, sense: tleta3sh}, {surface: nisan, sense: nisan}]
      translations: {en: The day after tomorrow! The thirteenth of April.}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: والله؟ قَدّيش رَح يْكون عُمْرِك؟
          tokens: [{surface: والله, sense: walla}, {surface: قَدّيش, sense: 2addesh}, {surface: رَح, sense: ra7.fut}, {surface: يْكون, sense: kan, form: 'form:subj-3ms'}, {surface: عُمْرِك, sense: 3omr,
              morphs: [{surface: عُمْرِ, kc: 'sense:3omr'}, {surface: ك, kc: 'form:poss-2fs'}]}]
        apc-Latn/arabizi:
          text: walla? 2addesh ra7 ykoun 3omrik?
          tokens: [{surface: walla, sense: walla}, {surface: 2addesh, sense: 2addesh}, {surface: ra7, sense: ra7.fut}, {surface: ykoun, sense: kan, form: 'form:subj-3ms'}, {surface: 3omrik, sense: 3omr,
              morphs: [{surface: 3omr, kc: 'sense:3omr'}, {surface: ik, kc: 'form:poss-2fs'}]}]
      translations: {en: 'Really? How old will you be?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: واحَد وعِشْرين.
          tokens: [{surface: واحَد, sense: wa7ad}, {surface: وعِشْرين, sense: 3eshrin, morphs: [{surface: و, kc: 'sense:w'}, {surface: عِشْرين, kc: 'sense:3eshrin'}]}]
        apc-Latn/arabizi:
          text: wa7ad w 3eshrin.
          tokens: [{surface: wa7ad, sense: wa7ad}, {surface: w, sense: w}, {surface: 3eshrin, sense: 3eshrin}]
      translations: {en: Twenty-one.}
  - choose:
      prompt: {en: 'When is Maya''s birthday?'}
      options: [{en: The day after tomorrow}, {en: Tomorrow}, {en: Next month}]
      answer: 0
