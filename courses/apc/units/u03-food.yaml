stories:
- id: apc.story.teta-lunch
  node: apc.food.story
  title: {en: Lunch at Teta's}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
  characters:
  - {id: teta, name: {apc-Arab/standard: تيتا, apc-Latn/arabizi: Teta}}
  - {id: sami, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: سامي، تْفَضَّل! كول!
          tokens: [{surface: سامي, sense: sami}, {surface: تْفَضَّل, sense: tfaddal}, {surface: كول, sense: akal}]
        apc-Latn/arabizi:
          text: Sami, tfaddal! kol!
          tokens: [{surface: Sami, sense: sami}, {surface: tfaddal, sense: tfaddal}, {surface: kol, sense: akal}]
      translations: {en: 'Sami, help yourself! Eat!'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: شُكْرا تيتا. الأَكِل طَيِّب كْتير!
          tokens: [{surface: شُكْرا, sense: shukran}, {surface: تيتا, sense: teta}, {surface: الأَكِل, sense: akl, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَكِل, kc: 'sense:akl'}]}, {surface: طَيِّب,
              sense: tayyeb}, {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: shukran teta. el akl tayyeb ktir!
          tokens: [{surface: shukran, sense: shukran}, {surface: teta, sense: teta}, {surface: el, sense: el}, {surface: akl, sense: akl}, {surface: tayyeb, sense: tayyeb}, {surface: ktir, sense: ktir}]
      translations: {en: 'Thanks, grandma. The food is really tasty!'}
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: صَحْتين!
          tokens: [{surface: صَحْتين, sense: sa77tein}]
        apc-Latn/arabizi:
          text: sa77tein!
          tokens: [{surface: sa77tein, sense: sa77tein}]
      translations: {en: Enjoy!}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: على قَلْبِك!
          tokens: [{surface: على, sense: 3a-albak}, {surface: قَلْبِك, sense: 3a-albak, form: 'form:poss-2fs'}]
        apc-Latn/arabizi:
          text: 3a albik!
          tokens: [{surface: 3a, sense: 3a-albak}, {surface: albik, sense: 3a-albak, form: 'form:poss-2fs'}]
      translations: {en: And to you!}
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: مايا، جوعانة؟ كِلي!
          tokens: [{surface: مايا, sense: maya}, {surface: جوعانة, sense: jou3an, form: 'form:fem'}, {surface: كِلي, sense: akal, form: 'form:imp-2fs'}]
        apc-Latn/arabizi:
          text: Maya, jou3ane? kili!
          tokens: [{surface: Maya, sense: maya}, {surface: jou3ane, sense: jou3an, form: 'form:fem'}, {surface: kili, sense: akal, form: 'form:imp-2fs'}]
      translations: {en: 'Maya, are you hungry? Eat!'}
  - line:
      speaker: maya
      ask: complete
      gap: sense:shway
      distractors: ['sense:ktir', 'sense:kamen']
      forms:
        apc-Arab/standard:
          text: لأ تيتا، بَسّ شْوَي.
          tokens: [{surface: لأ, sense: la2}, {surface: تيتا, sense: teta}, {surface: بَسّ, sense: bas}, {surface: شْوَي, sense: shway}]
        apc-Latn/arabizi:
          text: la2 teta, bas shway.
          tokens: [{surface: la2, sense: la2}, {surface: teta, sense: teta}, {surface: bas, sense: bas}, {surface: shway, sense: shway}]
      translations: {en: 'No, grandma, just a little.'}
  - choose:
      prompt:
        en: How much does Maya want to eat?
      options: [{en: Just a little}, {en: A lot}, {en: Nothing at all}]
      answer: 0
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: بَدِّك مَي؟
          tokens: [{surface: بَدِّك, sense: baddak, form: 'form:poss-2fs'}, {surface: مَي, sense: may}]
        apc-Latn/arabizi:
          text: baddik may?
          tokens: [{surface: baddik, sense: baddak, form: 'form:poss-2fs'}, {surface: may, sense: may}]
      translations: {en: 'Do you want water?'}
  - line:
      speaker: maya
      ask: arrange
      forms:
        apc-Arab/standard:
          text: إيه، وشاي بَلا سُكَّر.
          tokens: [{surface: إيه, sense: eh}, {surface: وشاي, sense: shay, morphs: [{surface: و, kc: 'sense:w'}, {surface: شاي, kc: 'sense:shay'}]}, {surface: بَلا, sense: bala}, {surface: سُكَّر, sense: sukkar}]
        apc-Latn/arabizi:
          text: eh, w shay bala sukkar.
          tokens: [{surface: eh, sense: eh}, {surface: w, sense: w}, {surface: shay, sense: shay}, {surface: bala, sense: bala}, {surface: sukkar, sense: sukkar}]
      translations: {en: 'Yes, and tea without sugar.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: تيتا، بَدّي كَمان مَنْقوشة!
          tokens: [{surface: تيتا, sense: teta}, {surface: بَدّي, sense: baddi}, {surface: كَمان, sense: kamen}, {surface: مَنْقوشة, sense: man2oushe}]
        apc-Latn/arabizi:
          text: teta, baddi kamen man2oushe!
          tokens: [{surface: teta, sense: teta}, {surface: baddi, sense: baddi}, {surface: kamen, sense: kamen}, {surface: man2oushe, sense: man2oushe}]
      translations: {en: 'Grandma, I want another man''oushe!'}
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: يَلّا، تْفَضَّل!
          tokens: [{surface: يَلّا, sense: yalla}, {surface: تْفَضَّل, sense: tfaddal}]
        apc-Latn/arabizi:
          text: yalla, tfaddal!
          tokens: [{surface: yalla, sense: yalla}, {surface: tfaddal, sense: tfaddal}]
      translations: {en: 'Sure, here you go!'}
  - choose:
      prompt:
        en: What does Sami ask for?
      options: [{en: Another man'oushe}, {en: Tea without sugar}, {en: Some water}]
      answer: 0
scenarios:
- id: apc.teta-lunch
  after: apc.food.story
  title: {en: Lunch at Teta's}
  setting: {en: 'Sunday lunch at grandma''s flat in Beirut. The table is covered in mezze: hummus, tabbouleh, man''oushe and bread.'}
  character: {en: 'Teta, a loving grandmother who keeps offering more food and is hard to say no to.'}
  goal: {en: 'Answer Teta''s offers: say whether you are hungry or thirsty, accept a little or politely say no, ask for tea or coffee without sugar, and praise the food.'}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
