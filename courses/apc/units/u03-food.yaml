# Fixture course (apc), unit 3: food and the table. Hospitality (tfaddal, sa77tein / 3a albak, kol!),
# the article el- (joined in Arabic script, a word of its own in Arabizi), breakfast and mezze.
# The first verbs come as imperatives (kol, eshrab): the bare stem, before the b- present of unit 6.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: u03-food
title: {en: At the table}
cefr: A1
kcs:
- {id: 'sense:tfaddal', gloss: {en: 'here you are; please, go ahead; come in'}, forms: {apc-Arab/standard: [تفضّل, تفضّلي], apc-Latn/arabizi: [tfaddal, tfaddali]}, notes: {en: 'Offering something or inviting
      someone in. To a woman: تفضّلي, tfaddali.'}}
- {id: 'sense:akal', gloss: {en: eat}, forms: {apc-Arab/standard: [كول, باكل, آكل, مناكل, أكلت, أكل, أكلنا], apc-Latn/arabizi: [kol, bekol, ekol, mnekol, akalt, akal, akalna]}, notes: {en: 'kol! eat! (to
      a man); kili! (to a woman). I eat: bekol (unit 6).'}}
- {id: 'sense:shereb', gloss: {en: drink}, forms: {apc-Arab/standard: [اشرب, بشرب, منشرب, بتشربي, تشرب, شربت], apc-Latn/arabizi: [eshrab, bishrab, mnishrab, btishrabi, tishrab, shrebt]}, notes: {en: eshrab!
      drink! (to a man); eshrabi! (to a woman).}}
- {id: 'sense:sa77tein', gloss: {en: enjoy your meal; to your health}, forms: {apc-Arab/standard: [صحتين], apc-Latn/arabizi: [sa77tein]}, notes: {en: 'Said to someone eating or drinking. The answer: على
      قلبك, 3a albak.'}}
- {id: 'sense:3a-albak', gloss: {en: and to you (the answer to sa77tein)}, forms: {apc-Arab/standard: [على قلبك], apc-Latn/arabizi: [3a albak]}, notes: {en: 'Literally ''on your heart''. To a woman: 3a
      albik.'}}
- {id: 'form:imp-2fs', gloss: {en: '-i: telling a woman to do something'}, notes: {en: 'tfaddal → tfaddali, eshrab → eshrabi, kol → kili.'}}
- {id: 'sense:khebz', gloss: {en: bread}, forms: {apc-Arab/standard: [خبز], apc-Latn/arabizi: [khebz]}}
- {id: 'sense:may', gloss: {en: water}, forms: {apc-Arab/standard: [مي], apc-Latn/arabizi: [may]}}
- {id: 'sense:sukkar', gloss: {en: sugar}, forms: {apc-Arab/standard: [سكّر], apc-Latn/arabizi: [sukkar]}}
- {id: 'sense:ma3', gloss: {en: with}, forms: {apc-Arab/standard: [مع], apc-Latn/arabizi: [ma3]}, notes: {en: 'With an ending: ma3i (with me; on me), ma3ak (with you).'}}
- {id: 'sense:el', gloss: {en: the}, forms: {apc-Latn/arabizi: [el]}, notes: {en: 'Written joined to its noun in Arabic script: الشاي. Before t, d, s, sh, z, n, r… it sounds like the noun''s first letter:
      esh-shay.'}}
- {id: 'sense:akl', gloss: {en: food}, forms: {apc-Arab/standard: [الأكل], apc-Latn/arabizi: [akl]}}
- {id: 'sense:man2oushe', gloss: {en: man'oushe (flatbread with za'atar or cheese)}, forms: {apc-Arab/standard: [منقوشة], apc-Latn/arabizi: [man2oushe]}}
- {id: 'sense:za3tar', gloss: {en: za'atar (thyme and sesame mix)}, forms: {apc-Arab/standard: [زعتر], apc-Latn/arabizi: [za3tar]}}
- {id: 'sense:jebne', gloss: {en: cheese}, forms: {apc-Arab/standard: [جبنة], apc-Latn/arabizi: [jebne]}}
- {id: 'sense:laban', gloss: {en: yogurt}, forms: {apc-Arab/standard: [لبن], apc-Latn/arabizi: [laban]}}
- {id: 'sense:bala', gloss: {en: without}, forms: {apc-Arab/standard: [بلا], apc-Latn/arabizi: [bala]}}
- {id: 'sense:tayyeb', gloss: {en: tasty; delicious}, forms: {apc-Arab/standard: [طيّب, طيّبة], apc-Latn/arabizi: [tayyeb, tayybe]}}
- {id: 'sense:ktir', gloss: {en: very; a lot; too}, forms: {apc-Arab/standard: [كتير], apc-Latn/arabizi: [ktir]}}
- {id: 'sense:shway', gloss: {en: a little; a bit}, forms: {apc-Arab/standard: [شوي], apc-Latn/arabizi: [shway]}}
- {id: 'sense:bas', gloss: {en: only; just; but}, forms: {apc-Arab/standard: [بس], apc-Latn/arabizi: [bas]}}
- {id: 'sense:jou3an', gloss: {en: hungry}, forms: {apc-Arab/standard: [جوعان, جوعانة], apc-Latn/arabizi: [jou3an, jou3ane]}}
- {id: 'sense:3atshan', gloss: {en: thirsty}, forms: {apc-Arab/standard: [عطشان], apc-Latn/arabizi: [3atshan]}}
- {id: 'sense:kamen', gloss: {en: more; another; also}, forms: {apc-Arab/standard: [كمان], apc-Latn/arabizi: [kamen]}}
- {id: 'sense:fenjen', gloss: {en: cup (for coffee)}, forms: {apc-Arab/standard: [فنجان], apc-Latn/arabizi: [fenjen]}}
- {id: 'sense:7ummus', gloss: {en: hummus}, forms: {apc-Arab/standard: [حمّص], apc-Latn/arabizi: [7ummus]}}
- {id: 'sense:tabbouleh', gloss: {en: tabbouleh (parsley salad)}, forms: {apc-Arab/standard: [التبّولة], apc-Latn/arabizi: [tabbouleh]}}
- {id: 'sense:sa7n', gloss: {en: plate; dish}, forms: {apc-Arab/standard: [صحن], apc-Latn/arabizi: [sa7n]}}
nodes:
