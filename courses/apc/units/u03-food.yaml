scenarios:
- id: apc.teta-lunch
  after: apc.food.story
  title:
    en: Lunch at Teta's
  setting:
    en: 'Sunday lunch at grandma''s flat in Beirut. The table is covered in mezze: hummus, tabbouleh, fattoush and bread.'
  character:
    en: Teta, a loving grandmother who keeps offering more food and is hard to say no to.
  goal:
    en: 'Answer Teta''s offers: say whether you are hungry or thirsty, accept a little or politely say no, ask for tea or coffee without sugar, and praise the food.'
  provenance:
    author: llm:claude@6914f241714e
    status: draft
