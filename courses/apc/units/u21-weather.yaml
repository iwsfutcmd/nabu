              lexemes: [{lexeme: el, surface: ال, n: 7, head: 8, rel: det}, {lexeme: yom, surface: يوم, base: true, feats: {Number: Sing}, n: 8}]}]
        apc-Latn/arabizi:
          text: Sami, ra7 nenzal 3al ba7r el yom?
          tokens: [{surface: Sami, lexeme: sami}, {surface: ra7, lexeme: ra7.fut}, {surface: nenzal, lexeme: nezel, feats: {Aspect: Imp, Mood: Sub, Number: Plur, Person: '1'}}, {surface: 3al, lexemes: [
                {lexeme: 3a, surface: 3a, n: 4, head: 6, rel: case, base: true}, {lexeme: el, surface: l, n: 5, head: 6, rel: det}]}, {surface: ba7r, lexeme: ba7r, feats: {Number: Sing}, n: 6}, {surface: el,
              lexeme: el, n: 7, head: 8, rel: det}, {surface: yom, lexeme: yom, feats: {Number: Sing}, n: 8}]
      translations:
        en: Sami, are we going (down|) to the beach today?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: لَأ، ليك! عَم تْشَتّي.
          tokens: [{surface: لَأ, lexeme: la2}, {surface: ليك, lexeme: lek}, {surface: عَم, lexeme: 3am}, {surface: تْشَتّي, lexeme: shatta, feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '3'}}]
        apc-Latn/arabizi:
          text: la2, lek! 3am tshatti.
          tokens: [{surface: la2, lexeme: la2}, {surface: lek, lexeme: lek}, {surface: 3am, lexeme: 3am}, {surface: tshatti, lexeme: shatta, feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '3'}}]
      translations:
        en: No, look! It's raining.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: مَعْليش. مْبارِح كان في شَمِس.
          tokens: [{surface: مَعْليش, lexeme: ma3lesh}, {surface: مْبارِح, lexeme: mbere7}, {surface: كان, lexeme: kan, feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '3'}}, {surface: في, lexeme: fi},
            {surface: شَمِس, lexeme: shams, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: ma3lesh. mbere7 ken fi shams.
          tokens: [{surface: ma3lesh, lexeme: ma3lesh}, {surface: mbere7, lexeme: mbere7}, {surface: ken, lexeme: kan, feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '3'}}, {surface: fi, lexeme: fi},
            {surface: shams, lexeme: shams, feats: {Number: Sing}}]
      translations:
        en: Never mind. Yesterday it was sunny.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: إيه، بَسّ بِالشِّتي الطَّقِس هيك.
          tokens: [{surface: إيه, lexeme: eh}, {surface: بَسّ, lexeme: bas}, {surface: بِالشِّتي, lexemes: [{lexeme: b, surface: بِ, n: 3, head: 5, rel: case}, {lexeme: el, surface: ال, n: 4, head: 5, rel: det},
                {lexeme: shiti, surface: شِّتي, base: true, feats: {Number: Sing}, n: 5}]}, {surface: الطَّقِس, lexemes: [{lexeme: el, surface: ال, n: 6, head: 7, rel: det}, {lexeme: ta2s, surface: طَّقِس,
                  base: true, feats: {Number: Sing}, n: 7}]}, {surface: هيك, lexeme: hek}]
        apc-Latn/arabizi:
          text: eh, bas bel sheti el ta2s hek.
          tokens: [{surface: eh, lexeme: eh}, {surface: bas, lexeme: bas}, {surface: bel, lexemes: [{lexeme: b, surface: b, n: 3, head: 5, rel: case, base: true}, {lexeme: el, surface: el, n: 4, head: 5,
                  rel: det}]}, {surface: sheti, lexeme: shiti, feats: {Number: Sing}, n: 5}, {surface: el, lexeme: el, n: 6, head: 7, rel: det}, {surface: ta2s, lexeme: ta2s, feats: {Number: Sing}, n: 7},
            {surface: hek, lexeme: hek}]
      translations:
        en: Yes, but in winter the weather's like that.
  - choose:
      prompt:
        en: Why don't they go to the beach?
      options:
      - en: It's raining
      - en: It's too hot
      - en: Sami is sick
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَنا بَرْدانِة شْوَي.
          tokens: [{surface: أَنا, lexeme: ana}, {surface: بَرْدانِة, lexeme: bardan, feats: {Gender: Fem, Number: Sing}}, {surface: شْوَي, lexeme: shway}]
        apc-Latn/arabizi:
          text: ana bardane shway.
          tokens: [{surface: ana, lexeme: ana}, {surface: bardane, lexeme: bardan, feats: {Gender: Fem, Number: Sing}}, {surface: shway, lexeme: shway}]
      translations:
        en: I'm a bit cold.
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: يَلّا، اَعْمِل قَهْوِة.
          tokens: [{surface: يَلّا, lexeme: yalla}, {surface: اَعْمِل, lexeme: 3emel, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}, {surface: قَهْوِة, lexeme: ahwe, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: yalla, a3mel ahwe.
          tokens: [{surface: yalla, lexeme: yalla}, {surface: a3mel, lexeme: 3emel, feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}}, {surface: ahwe, lexeme: ahwe, feats: {Number: Sing}}]
      translations:
        en: Come on, I'll make (some|) coffee.
  - line:
      speaker: maya
      ask: complete
      gap: lexeme:ahwe
      distractors:
      - lexeme:shanta
      - lexeme:jebne
      forms:
        apc-Arab/standard:
          text: أَكيد! قَهْوِة سُخْنِة.
          tokens: [{surface: أَكيد, lexeme: akid}, {surface: قَهْوِة, lexeme: ahwe, feats: {Number: Sing}}, {surface: سُخْنِة, lexeme: sokhn, feats: {Gender: Fem, Number: Sing}}]
        apc-Latn/arabizi:
          text: akid! ahwe sokhne.
          tokens: [{surface: akid, lexeme: akid}, {surface: ahwe, lexeme: ahwe, feats: {Number: Sing}}, {surface: sokhne, lexeme: sokhn, feats: {Gender: Fem, Number: Sing}}]
      translations:
        en: Of course! A hot coffee.
  - choose:
      prompt:
        en: What does Sami offer?
      options:
      - en: To make coffee
      - en: To go to the mountains
      - en: To call grandma
      answer: 0
