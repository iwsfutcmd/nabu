# Fixture course (apc), unit 21: the weather and the seasons. kif el ta2s? fi shams, fi ghaym, fi hawa; 3am
# tshatti (it's raining: the verb shatta, Form II, in the feminine, as Kline gives weather verbs); el shiti
# (winter, and the rain itself), el rabi3, el sayfiyye, el kharif; quantifiers (Kline, chapter 24): kell (every;
# with el, all of), ba3d (some, with ض: بعض), wala (not a single). Drafted by an LLM (provenance llm:…, status
# draft) and checked against Kline (2022), chapters 4, 13 and 24: every sentence awaits a native speaker's review.
