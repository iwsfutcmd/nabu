  characters:
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  steps:
  - line:
      speaker: maya
