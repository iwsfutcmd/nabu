  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَعْليش، هَلَّق إِنْتي هون.
          tokens: [{surface: مَعْليش, lexeme: ma3lesh}, {surface: هَلَّق, lexeme: hala2}, {surface: إِنْتي, lexeme: enti}, {surface: هون, lexeme: hon}]
