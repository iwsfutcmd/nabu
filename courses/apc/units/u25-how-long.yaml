# Fixture course (apc), unit 25: how long, just, yet, ever (Kline, chapter 18). sar with -la- and a person's
# ending for how long something has gone on (sarlo sa3a 3am yestanna; sarla zamen ma zaret teta), with the rest of the
# endings (-lo, -la, -lna, -lik, -lkon, -lon); ba3d with an ending and a participle for what has just happened
# (ba3dni wasel), and with ma and the past for what has not happened yet (ba3dni ma akalt); shi marra (ever), wala
# marra (never) and sar with a participle (saro ray7in marrten); 2abelma and ba3dma (before, after). Drafted by an LLM
# (provenance llm:…, status draft) and checked against Kline (2022), chapters 4 and 18: every sentence awaits a native
# speaker's review.
