stories:
- id: apc.story.waiting
  node: apc.long.story
  title:
    en: An hour late
  provenance:
    author: llm:claude@apc-b1
    status: draft
  characters:
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا! صارْلي ساعَة عَم اِسْتَنّى!
          tokens: [{surface: مايا, lexeme: maya}, {surface: صارْلي, lexemes: [{lexeme: sar, surface: صارْ, base: true}, {lexeme: perf-3ms}, {lexeme: la-1sg, surface: لي}]},
            {surface: ساعَة, lexemes: [{lexeme: sa3a, base: true}, {lexeme: sg}]}, {surface: عَم, lexeme: 3am}, {surface: اِسْتَنّى, lexemes: [{lexeme: sub}, {lexeme: impf-1sg}, {lexeme: stanna, base: true}]}]
        apc-Latn/arabizi:
          text: Maya! sarli sa3a 3am estanna!
          tokens: [{surface: Maya, lexeme: maya}, {surface: sarli, lexemes: [{lexeme: sar, surface: sar, base: true}, {lexeme: perf-3ms}, {lexeme: la-1sg, surface: li}]},
            {surface: sa3a, lexemes: [{lexeme: sa3a, base: true}, {lexeme: sg}]}, {surface: 3am, lexeme: 3am}, {surface: estanna, lexemes: [{lexeme: sub}, {lexeme: impf-1sg}, {lexeme: stanna, base: true}]}]
      translations:
        en: Maya! I've been waiting for an hour!
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: مَعْليش! كِنِت بِالشُّغُل، وبَعِدْني واصْلِة.
          tokens: [{surface: مَعْليش, lexeme: ma3lesh}, {surface: كِنِت, lexemes: [{lexeme: kan, base: true}, {lexeme: perf-1sg}]}, {surface: بِالشُّغُل, lexemes: [{lexeme: b, surface: بِ, n: 3, head: 5, rel: case}, {lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: shoghl, surface: شُّغُل, base: true, n: 5}, {lexeme: sg}]}, {surface: وبَعِدْني, lexemes: [{lexeme: w,
                  surface: و}, {lexeme: ba3d.still, surface: بَعِدْ, base: true}, {lexeme: obj-1sg, surface: ني}]}, {surface: واصْلِة, lexemes: [{lexeme: wesel, base: true}, {lexeme: ptcp}, {lexeme: fs}]}]
        apc-Latn/arabizi:
          text: ma3lesh! kent bel shoghl, w ba3dni wasle.
          tokens: [{surface: ma3lesh, lexeme: ma3lesh}, {surface: kent, lexemes: [{lexeme: kan, base: true}, {lexeme: perf-1sg}]}, {surface: bel, lexemes: [{lexeme: b, surface: b, n: 3, head: 5, rel: case,
                  base: true}, {lexeme: el, surface: el, n: 4, head: 5, rel: det}]}, {surface: shoghl, lexemes: [{lexeme: shoghl, base: true, n: 5}, {lexeme: sg}]}, {surface: w, lexeme: w}, {surface: ba3dni, lexemes: [
                {lexeme: ba3d.still, surface: ba3d, base: true}, {lexeme: obj-1sg, surface: ni}]}, {surface: wasle, lexemes: [{lexeme: wesel, base: true}, {lexeme: ptcp}, {lexeme: fs}]}]
      translations:
        en: Sorry! I was at work, and I've only just got here.
  - choose:
      prompt:
        en: Where was Maya?
      options:
      - en: At work
      - en: At the beach
      - en: At home
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَعْليش. شي مَرَّة أَكَلْتي بْهَالمَطْعَم؟
          tokens: [{surface: مَعْليش, lexeme: ma3lesh}, {surface: شي, lexeme: shi}, {surface: مَرَّة, lexeme: marra}, {surface: أَكَلْتي, lexemes: [{lexeme: akal, base: true}, {lexeme: perf-2fs}]},
            {surface: بْهَالمَطْعَم, lexemes: [{lexeme: b, surface: بْ, n: 5, head: 7, rel: case}, {lexeme: hal, surface: هَال, n: 6, head: 7, rel: det}, {lexeme: mat3am, surface: مَطْعَم, base: true, n: 7}, {lexeme: sg}]}]
        apc-Latn/arabizi:
          text: ma3lesh. shi marra akalti b hal mat3am?
          tokens: [{surface: ma3lesh, lexeme: ma3lesh}, {surface: shi, lexeme: shi}, {surface: marra, lexeme: marra}, {surface: akalti, lexemes: [{lexeme: akal, base: true}, {lexeme: perf-2fs}]},
            {surface: b, lexeme: b, n: 5, head: 7, rel: case}, {surface: hal, lexeme: hal, n: 6, head: 7, rel: det}, {surface: mat3am, lexemes: [{lexeme: mat3am, base: true, n: 7}, {lexeme: sg}]}]
      translations:
        en: Never mind. Have you ever eaten at this restaurant?
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: لأ، وَلا مَرَّة. وإِنْتَ؟
          tokens: [{surface: لأ, lexeme: la2}, {surface: وَلا, lexeme: wala}, {surface: مَرَّة, lexeme: marra}, {surface: وإِنْتَ, lexemes: [{lexeme: w, surface: و}, {lexeme: enta, surface: إِنْتَ, base: true}]}]
        apc-Latn/arabizi:
          text: la2, wala marra. w enta?
          tokens: [{surface: la2, lexeme: la2}, {surface: wala, lexeme: wala}, {surface: marra, lexeme: marra}, {surface: w, lexeme: w}, {surface: enta, lexeme: enta}]
      translations:
        en: No, never. And you?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: أَكَلِت هون مَرّْتين. الأَكِل كْتير طَيِّب.
          tokens: [{surface: أَكَلِت, lexemes: [{lexeme: akal, base: true}, {lexeme: perf-1sg}]}, {surface: هون, lexeme: hon}, {surface: مَرّْتين, lexemes: [{lexeme: marra, surface: مَرّْت, base: true,
                  feats: {Number: Sing}}, {lexeme: dual, surface: ين}]}, {surface: الأَكِل, lexemes: [{lexeme: el, surface: ال, n: 5, head: 6, rel: det}, {lexeme: akl, surface: أَكِل, base: true, n: 6}, {lexeme: sg}]}, {surface: كْتير, lexeme: ktir}, {surface: طَيِّب, lexeme: tayyeb}]
        apc-Latn/arabizi:
          text: akalt hon marrten. el akl ktir tayyeb.
          tokens: [{surface: akalt, lexemes: [{lexeme: akal, base: true}, {lexeme: perf-1sg}]}, {surface: hon, lexeme: hon}, {surface: marrten, lexemes: [{lexeme: marra, surface: marrt, base: true,
                  feats: {Number: Sing}}, {lexeme: dual, surface: en}]}, {surface: el, lexeme: el, n: 5, head: 6, rel: det}, {surface: akl, lexemes: [{lexeme: akl, base: true, n: 6}, {lexeme: sg}]}, {surface: ktir, lexeme: ktir},
            {surface: tayyeb, lexeme: tayyeb}]
      translations:
        en: I've eaten here twice. The food is very good.
  - choose:
      prompt:
        en: How many times has Sami eaten here?
      options:
      - en: Twice
      - en: Never
      - en: Every week
      answer: 0
  - line:
      speaker: maya
      ask: complete
      gap: lexeme:sa3a
      distractors:
      - lexeme:sene
      - lexeme:da2i2a
      forms:
        apc-Arab/standard:
          text: صارْلَك ساعَة عَم تِسْتَنّى؟ يا حَرام!
          tokens: [{surface: صارْلَك, lexemes: [{lexeme: sar, surface: صارْ, base: true}, {lexeme: perf-3ms}, {lexeme: la-2ms, surface: لَك}]}, {surface: ساعَة, lexemes: [{lexeme: sa3a, base: true}, {lexeme: sg}]}, {surface: عَم, lexeme: 3am}, {surface: تِسْتَنّى, lexemes: [{lexeme: sub}, {lexeme: impf-2}, {lexeme: stanna, base: true}, {lexeme: ms.verb}]}, {surface: يا,
              lexeme: ya-7aram}, {surface: حَرام, lexeme: ya-7aram}]
        apc-Latn/arabizi:
          text: sarlak sa3a 3am testanna? ya 7aram!
          tokens: [{surface: sarlak, lexemes: [{lexeme: sar, surface: sar, base: true}, {lexeme: perf-3ms}, {lexeme: la-2ms, surface: lak}]}, {surface: sa3a, lexemes: [{lexeme: sa3a, base: true}, {lexeme: sg}]}, {surface: 3am, lexeme: 3am}, {surface: testanna, lexemes: [{lexeme: sub}, {lexeme: impf-2}, {lexeme: stanna, base: true}, {lexeme: ms.verb}]}, {surface: ya,
              lexeme: ya-7aram}, {surface: 7aram, lexeme: ya-7aram}]
      translations:
