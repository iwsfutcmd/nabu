stories:
- id: apc.story.service
  node: apc.road.story
  title: {en: In the service}
  provenance: {author: 'llm:claude@a659420f546f', status: draft}
  characters:
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَلو سامي، وينَك؟
          tokens: [{surface: أَلو, sense: alo}, {surface: سامي, sense: sami}, {surface: وينَك, sense: wen, morphs: [{surface: وينَ, kc: 'sense:wen'}, {surface: ك, kc: 'form:poss-2ms'}]}]
        apc-Latn/arabizi:
          text: alo Sami, wenak?
          tokens: [{surface: alo, sense: alo}, {surface: Sami, sense: sami}, {surface: wenak, sense: wen, morphs: [{surface: wen, kc: 'sense:wen'}, {surface: ak, kc: 'form:poss-2ms'}]}]
      translations: {en: 'Hello Sami, where are you?'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: أَنا بِالسِّرْفيس، جاي.
          tokens: [{surface: أَنا, sense: ana}, {surface: بِالسِّرْفيس, sense: servees, morphs: [{surface: بِ, kc: 'sense:b'}, {surface: ال, kc: 'sense:el'}, {surface: سِّرْفيس, kc: 'sense:servees'}]},
            {surface: جاي, sense: jeye}]
        apc-Latn/arabizi:
          text: ana bel servees, jey.
          tokens: [{surface: ana, sense: ana}, {surface: bel, sense: b, morphs: [{surface: b, kc: 'sense:b'}, {surface: el, kc: 'sense:el'}]}, {surface: servees, sense: servees}, {surface: jey, sense: jeye}]
      translations: {en: 'I''m in the service, I''m coming.'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: في عَجْقَة؟
          tokens: [{surface: في, sense: fi}, {surface: عَجْقَة, sense: 3aj2a}]
        apc-Latn/arabizi:
          text: fi 3aj2a?
          tokens: [{surface: fi, sense: fi}, {surface: 3aj2a, sense: 3aj2a}]
      translations: {en: 'Is there traffic?'}
  - line:
      speaker: sami
      ask: complete
      gap: sense:3aj2a
      distractors: ['sense:tari2']
      forms:
        apc-Arab/standard:
          text: إيه، في عَجْقَة كْتير!
          tokens: [{surface: إيه, sense: eh}, {surface: في, sense: fi}, {surface: عَجْقَة, sense: 3aj2a}, {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: eh, fi 3aj2a ktir!
          tokens: [{surface: eh, sense: eh}, {surface: fi, sense: fi}, {surface: 3aj2a, sense: 3aj2a}, {surface: ktir, sense: ktir}]
      translations: {en: 'Yes, there''s a lot of traffic!'}
  - choose:
      prompt: {en: 'How is Sami travelling?'}
      options: [{en: By service taxi}, {en: By bus}, {en: On foot}]
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَنا قاعْدِة بِالمَطْعَم حَدّ البَحِر.
          tokens: [{surface: أَنا, sense: ana}, {surface: قاعْدِة, sense: 2a3ed, form: 'form:fem'}, {surface: بِالمَطْعَم, sense: mat3am, morphs: [{surface: بِ, kc: 'sense:b'}, {surface: ال, kc: 'sense:el'},
                {surface: مَطْعَم, kc: 'sense:mat3am'}]}, {surface: حَدّ, sense: 7add}, {surface: البَحِر, sense: ba7r, morphs: [{surface: ال, kc: 'sense:el'}, {surface: بَحِر, kc: 'sense:ba7r'}]}]
        apc-Latn/arabizi:
          text: ana 2a3de bel mat3am 7add el ba7r.
          tokens: [{surface: ana, sense: ana}, {surface: 2a3de, sense: 2a3ed, form: 'form:fem'}, {surface: bel, sense: b, morphs: [{surface: b, kc: 'sense:b'}, {surface: el, kc: 'sense:el'}]}, {surface: mat3am,
              sense: mat3am}, {surface: 7add, sense: 7add}, {surface: el, sense: el}, {surface: ba7r, sense: ba7r}]
      translations: {en: I'm sitting in the restaurant by the sea.}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: كيف بوصَل عَالمَطْعَم؟
          tokens: [{surface: كيف, sense: kif}, {surface: بوصَل, sense: wesel, form: 'form:impf-1sg'}, {surface: عَالمَطْعَم, sense: mat3am, morphs: [{surface: عَ, kc: 'sense:3a'}, {surface: ال, kc: 'sense:el'},
                {surface: مَطْعَم, kc: 'sense:mat3am'}]}]
        apc-Latn/arabizi:
          text: kif busal 3al mat3am?
          tokens: [{surface: kif, sense: kif}, {surface: busal, sense: wesel, form: 'form:impf-1sg'}, {surface: 3al, sense: 3a, morphs: [{surface: 3a, kc: 'sense:3a'}, {surface: l, kc: 'sense:el'}]}, {
              surface: mat3am, sense: mat3am}]
      translations: {en: 'How do I get to the restaurant?'}
  - line:
      speaker: maya
      ask: arrange
      forms:
        apc-Arab/standard:
          text: بَعْد الإِشارَة، لِفّ عَاليَمين.
          tokens: [{surface: بَعْد, sense: ba3d}, {surface: الإِشارَة, sense: ishara, morphs: [{surface: ال, kc: 'sense:el'}, {surface: إِشارَة, kc: 'sense:ishara'}]}, {surface: لِفّ, sense: laff}, {surface: عَاليَمين,
              sense: yamin, morphs: [{surface: عَ, kc: 'sense:3a'}, {surface: ال, kc: 'sense:el'}, {surface: يَمين, kc: 'sense:yamin'}]}]
        apc-Latn/arabizi:
          text: ba3d el ishara, liff 3al yamin.
          tokens: [{surface: ba3d, sense: ba3d}, {surface: el, sense: el}, {surface: ishara, sense: ishara}, {surface: liff, sense: laff}, {surface: 3al, sense: 3a, morphs: [{surface: 3a, kc: 'sense:3a'},
                {surface: l, kc: 'sense:el'}]}, {surface: yamin, sense: yamin}]
      translations: {en: 'After the traffic lights, turn right.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وَقِّف هون، عْمول مَعْروف!
          tokens: [{surface: وَقِّف, sense: wa22ef}, {surface: هون, sense: hon}, {surface: عْمول, sense: 3mol-ma3rouf}, {surface: مَعْروف, sense: 3mol-ma3rouf}]
        apc-Latn/arabizi:
          text: wa22ef hon, 3mol ma3rouf!
          tokens: [{surface: wa22ef, sense: wa22ef}, {surface: hon, sense: hon}, {surface: 3mol, sense: 3mol-ma3rouf}, {surface: ma3rouf, sense: 3mol-ma3rouf}]
      translations: {en: 'Stop here, please! (to the driver)'}
  - choose:
      prompt: {en: 'Where is Maya waiting?'}
      options: [{en: In a restaurant by the sea}, {en: At home}, {en: On the bus}]
      answer: 0
scenarios:
- id: apc.taxi-ride
  after: apc.road.story
  title: {en: Taking a service}
  setting: {en: A street corner in Beirut; a service with one free seat slows down.}
  character: {en: 'The driver, in a hurry, who asks where you are going and talks about the traffic.'}
  goal: {en: 'Ask whether the service goes where you want, agree on the fare, give directions (straight on, turn right or left, after the traffic light) and ask him to stop.'}
  provenance: {author: 'llm:claude@a659420f546f', status: draft}
