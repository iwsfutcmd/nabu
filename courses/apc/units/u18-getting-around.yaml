# Fixture course (apc), unit 18: getting around Beirut. The service (shared taxi), taxi and bus, the road and
# the traffic (3aj2a); where someone is right now with active participles (2a3ed, wa2ef, jey, nezel, raye7),
# which agree like adjectives; asking the way (kif busal?), turning (liff 3al yamin) and stopping (wa22ef hon).
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapters 17 (active
# participles), 8 (prepositions) and 23 (the imperative): every sentence awaits a native speaker's review.
id: u18-getting-around
title: {en: Getting around}
cefr: A2
kcs:
- {id: 'sense:servees', gloss: {en: service (a shared taxi on a fixed route)}, forms: {apc-Arab/standard: [سرفيس], apc-Latn/arabizi: [servees]}, notes: {en: A red-plated car that picks up several passengers
      along its route for a fixed fare.}}
- {id: 'sense:taxi', gloss: {en: taxi}, forms: {apc-Arab/standard: [تاكسي], apc-Latn/arabizi: [taxi]}}
- {id: 'sense:bus', gloss: {en: bus}, forms: {apc-Arab/standard: [باص], apc-Latn/arabizi: [bus]}, notes: {en: Also written bas or baS; bas alone is 'only; but'.}}
- {id: 'sense:tari2', gloss: {en: road; way}, forms: {apc-Arab/standard: [طريق], apc-Latn/arabizi: [tari2]}, notes: {en: '3al tari2: on the way.'}}
- {id: 'sense:3aj2a', gloss: {en: traffic; traffic jam; crowd}, forms: {apc-Arab/standard: [عجقة], apc-Latn/arabizi: [3aj2a]}}
- {id: 'sense:2a3ed', gloss: {en: sitting; staying (somewhere)}, forms: {apc-Arab/standard: [قاعد], apc-Latn/arabizi: [2a3ed]}, notes: {en: 'An active participle: 2a3de (a woman), 2a3din (several people).
      wen 2a3ed? Where are you (sitting)?'}}
- {id: 'sense:wa2ef', gloss: {en: standing; stopped; waiting}, forms: {apc-Arab/standard: [واقف], apc-Latn/arabizi: [wa2ef]}, notes: {en: 'An active participle: wa2fe (a woman), wa2fin (several people).'}}
- {id: 'sense:laff', gloss: {en: turn}, forms: {apc-Arab/standard: [لفّ], apc-Latn/arabizi: [liff]}, notes: {en: 'liff 3al yamin: turn right (to a man); liffi (to a woman); liffo (to several people).'}}
- {id: 'sense:ishara', gloss: {en: traffic light; sign}, forms: {apc-Arab/standard: [إشارة], apc-Latn/arabizi: [ishara]}}
- {id: 'sense:wa22ef', gloss: {en: 'stop (a car, someone)'}, forms: {apc-Arab/standard: [وقّف], apc-Latn/arabizi: [wa22ef]}, notes: {en: 'wa22ef hon!: stop here! (to a driver). To a woman: wa22fi.'}}
nodes:
- {id: apc.road.transport, kind: lesson, introduces: ['sense:servees', 'sense:taxi', 'sense:bus', 'sense:tari2', 'sense:3aj2a']}
- {id: apc.road.where, kind: lesson, introduces: ['sense:2a3ed', 'sense:wa2ef']}
- {id: apc.road.directions, kind: lesson, introduces: ['sense:laff', 'sense:ishara', 'sense:wa22ef']}
- {id: apc.road.story, kind: story}
