# Fixture course (apc), unit 8: time and the week. bukra, emta?, free and busy, the days (nhar el sabt…),
# hal- (this: hal jem3a), telling the time (el sa3a tlete w nos), before and after, holidays.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: u08-time
title: {en: Days and times}
cefr: A2
kcs:
- {id: 'sense:bukra', gloss: {en: tomorrow}, forms: {apc-Arab/standard: [بكرا], apc-Latn/arabizi: [bukra]}}
- {id: 'sense:emta', gloss: {en: when}, forms: {apc-Arab/standard: [إمتى], apc-Latn/arabizi: [emta]}}
- {id: 'sense:sawa', gloss: {en: together}, forms: {apc-Arab/standard: [سوا], apc-Latn/arabizi: [sawa]}}
- {id: 'sense:fadi', gloss: {en: free (not busy)}, forms: {apc-Arab/standard: [فاضي], apc-Latn/arabizi: [fadi]}}
- {id: 'sense:mashghoul', gloss: {en: busy}, forms: {apc-Arab/standard: [مشغول], apc-Latn/arabizi: [mashghoul]}}
- {id: 'sense:nhar', gloss: {en: day; daytime}, forms: {apc-Arab/standard: [نهار], apc-Latn/arabizi: [nhar]}, notes: {en: 'nhar el sabt: (on) Saturday.'}}
- {id: 'sense:sabt', gloss: {en: Saturday}, forms: {apc-Arab/standard: [سبت], apc-Latn/arabizi: [sabt]}, notes: {en: 'el sabt, nhar el sabt: (on) Saturday.'}}
- {id: 'sense:a7ad', gloss: {en: Sunday}, forms: {apc-Arab/standard: [أحد], apc-Latn/arabizi: [a7ad]}}
- {id: 'sense:jem3a', gloss: {en: Friday; week}, forms: {apc-Arab/standard: [جمعة], apc-Latn/arabizi: [jem3a]}, notes: {en: 'el jem3a: Friday; hal jem3a: this week.'}}
- {id: 'sense:hal', gloss: {en: this (joined to a noun)}, forms: {apc-Latn/arabizi: [hal]}, notes: {en: 'Written joined in Arabic script: هالجمعة, this week.'}}
- {id: 'sense:khamis', gloss: {en: Thursday}, forms: {apc-Arab/standard: [خميس], apc-Latn/arabizi: [khamis]}}
- {id: 'sense:sa3a', gloss: {en: hour; o'clock; watch}, forms: {apc-Arab/standard: [ساعة], apc-Latn/arabizi: [sa3a]}, notes: {en: '2addesh el sa3a? What time is it? el sa3a tlete: it''s three o''clock.'}}
- {id: 'sense:nos', gloss: {en: half}, forms: {apc-Arab/standard: [نصّ], apc-Latn/arabizi: [nos]}, notes: {en: 'w nos: and a half (half past).'}}
- {id: 'sense:rebe3', gloss: {en: quarter}, forms: {apc-Arab/standard: [ربع], apc-Latn/arabizi: [rebe3]}, notes: {en: 'w rebe3: and a quarter (quarter past).'}}
- {id: 'sense:da2i2a', gloss: {en: minute}, forms: {apc-Arab/standard: [دقيقة], apc-Latn/arabizi: [da2i2a]}}
- {id: 'sense:stanna', gloss: {en: wait (to a man)}, forms: {apc-Arab/standard: [استنّى], apc-Latn/arabizi: [stanna]}, notes: {en: 'To a woman: استنّي, stanne.'}}
- {id: 'sense:2abel', gloss: {en: before}, forms: {apc-Arab/standard: [قبل], apc-Latn/arabizi: [2abel]}}
- {id: 'sense:dohr', gloss: {en: noon; midday}, forms: {apc-Arab/standard: [ضهر], apc-Latn/arabizi: [dohr]}, notes: {en: '3al dohr: at noon; ba3d el dohr: in the afternoon.'}}
- {id: 'sense:ba3d', gloss: {en: after}, forms: {apc-Arab/standard: [بعد], apc-Latn/arabizi: [ba3d]}}
- {id: 'sense:lel', gloss: {en: night}, forms: {apc-Arab/standard: [ليل], apc-Latn/arabizi: [lel]}, notes: {en: 'bel lel: at night.'}}
- {id: 'sense:3otle', gloss: {en: holiday; day off}, forms: {apc-Arab/standard: [عطلة], apc-Latn/arabizi: [3otle]}}
- {id: 'sense:kam', gloss: {en: how many; a few}, forms: {apc-Arab/standard: [كم], apc-Latn/arabizi: [kam]}}
- {id: 'sense:shahr', gloss: {en: month}, forms: {apc-Arab/standard: [شهر], apc-Latn/arabizi: [shahr]}}
