stories:
- id: apc.story.free-on-saturday
  node: apc.time.story
  title: {en: 'Are you free on Saturday?'}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
  characters:
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، إِنْتي فاضْيِة نْهار السَّبْت؟
          tokens: [{surface: مايا, sense: maya}, {surface: إِنْتي, sense: enti}, {surface: فاضْيِة, sense: fadi, form: 'form:fem'}, {surface: نْهار, sense: nhar}, {surface: السَّبْت, sense: sabt, morphs: [
                {surface: ال, kc: 'sense:el'}, {surface: سَّبْت, kc: 'sense:sabt'}]}]
        apc-Latn/arabizi:
          text: Maya, enti fadye nhar el sabt?
          tokens: [{surface: Maya, sense: maya}, {surface: enti, sense: enti}, {surface: fadye, sense: fadi, form: 'form:fem'}, {surface: nhar, sense: nhar}, {surface: el, sense: el}, {surface: sabt, sense: sabt}]
      translations: {en: 'Maya, are you free on Saturday?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: لأ، نْهار السَّبْت بِشْتِغِل. بَسّ الأَحَد فاضْيِة.
          tokens: [{surface: لأ, sense: la2}, {surface: نْهار, sense: nhar}, {surface: السَّبْت, sense: sabt, morphs: [{surface: ال, kc: 'sense:el'}, {surface: سَّبْت, kc: 'sense:sabt'}]}, {surface: بِشْتِغِل,
              sense: eshteghel, form: 'form:impf-1sg'}, {surface: بَسّ, sense: bas}, {surface: الأَحَد, sense: a7ad, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَحَد, kc: 'sense:a7ad'}]}, {surface: فاضْيِة,
              sense: fadi, form: 'form:fem'}]
        apc-Latn/arabizi:
          text: la2, nhar el sabt bishteghel. bas el a7ad fadye.
          tokens: [{surface: la2, sense: la2}, {surface: nhar, sense: nhar}, {surface: el, sense: el}, {surface: sabt, sense: sabt}, {surface: bishteghel, sense: eshteghel, form: 'form:impf-1sg'}, {surface: bas,
              sense: bas}, {surface: el, sense: el}, {surface: a7ad, sense: a7ad}, {surface: fadye, sense: fadi, form: 'form:fem'}]
      translations: {en: 'No, on Saturday I work. But on Sunday I''m free.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: يَلّا، الأَحَد مْنْروح عَالجَبَل سَوا؟
          tokens: [{surface: يَلّا, sense: yalla}, {surface: الأَحَد, sense: a7ad, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَحَد, kc: 'sense:a7ad'}]}, {surface: مْنْروح, sense: ra7, form: 'form:impf-1pl'},
            {surface: عَالجَبَل, sense: jabal, morphs: [{surface: عَ, kc: 'sense:3a'}, {surface: ال, kc: 'sense:el'}, {surface: جَبَل, kc: 'sense:jabal'}]}, {surface: سَوا, sense: sawa}]
        apc-Latn/arabizi:
          text: yalla, el a7ad mnru7 3al jabal sawa?
          tokens: [{surface: yalla, sense: yalla}, {surface: el, sense: el}, {surface: a7ad, sense: a7ad}, {surface: mnru7, sense: ra7, form: 'form:impf-1pl'}, {surface: 3al, sense: 3a, morphs: [{surface: 3a,
                  kc: 'sense:3a'}, {surface: l, kc: 'sense:el'}]}, {surface: jabal, sense: jabal}, {surface: sawa, sense: sawa}]
      translations: {en: 'OK, on Sunday shall we go to the mountains together?'}
  - choose:
      prompt:
        en: When is Maya free?
      options: [{en: On Sunday}, {en: On Saturday}, {en: Every day}]
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: إيه! إِمْتى؟
          tokens: [{surface: إيه, sense: eh}, {surface: إِمْتى, sense: emta}]
        apc-Latn/arabizi:
          text: eh! emta?
          tokens: [{surface: eh, sense: eh}, {surface: emta, sense: emta}]
      translations: {en: 'Yes! When?'}
  - line:
      speaker: sami
      ask: complete
      gap: sense:tes3a
      distractors: ['sense:sab3a', 'sense:khamse']
      forms:
