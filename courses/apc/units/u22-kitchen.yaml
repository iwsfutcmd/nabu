- {id: apc.cook.bring, kind: lesson, introduces: ['lexeme:jab', 'lexeme:7arrak', 'lexeme:ma3la2a', 'lexeme:ruz', 'lexeme:tabakh']}
- {id: apc.cook.tabbouleh, kind: lesson, introduces: ['lexeme:ba2dounes', 'lexeme:tabbouleh']}
- {id: apc.cook.story, kind: story}
