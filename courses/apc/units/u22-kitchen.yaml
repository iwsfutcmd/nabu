stories:
- id: apc.story.tabbouleh
  node: apc.cook.story
  title:
    en: Teta's tabbouleh
  provenance:
    author: llm:claude@apc-b1
    status: draft
  characters:
  - id: teta
    speaker: f
    name:
      apc-Arab/standard: تيتا
      apc-Latn/arabizi: teta
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  steps:
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: مايا، يَلّا نَعْمِل تَبّولِة!
          tokens: [{surface: مايا, lexeme: maya}, {surface: يَلّا, lexeme: yalla}, {surface: نَعْمِل, lexemes: [{lexeme: sub}, {lexeme: impf-1pl}, {lexeme: 3emel, base: true}]}, {surface: تَبّولِة, lexemes: [{lexeme: tabbouleh, base: true}, {lexeme: sg}]}]
        apc-Latn/arabizi:
          text: Maya, yalla na3mel tabboule!
          tokens: [{surface: Maya, lexeme: maya}, {surface: yalla, lexeme: yalla}, {surface: na3mel, lexemes: [{lexeme: sub}, {lexeme: impf-1pl}, {lexeme: 3emel, base: true}]}, {surface: tabboule, lexemes: [{lexeme: tabbouleh, base: true}, {lexeme: sg}]}]
      translations:
        en: Maya, come on, let's make tabbouleh!
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: يَلّا! شو لازِم اَعْمِل؟
          tokens: [{surface: يَلّا, lexeme: yalla}, {surface: شو, lexeme: shu}, {surface: لازِم, lexeme: lezem}, {surface: اَعْمِل, lexemes: [{lexeme: sub}, {lexeme: impf-1sg}, {lexeme: 3emel, base: true}]}]
        apc-Latn/arabizi:
          text: yalla! shu lezem a3mel?
          tokens: [{surface: yalla, lexeme: yalla}, {surface: shu, lexeme: shu}, {surface: lezem, lexeme: lezem}, {surface: a3mel, lexemes: [{lexeme: sub}, {lexeme: impf-1sg}, {lexeme: 3emel, base: true}]}]
      translations:
        en: OK! What do I have to do?
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: غَسّْلي البَقْدونِس والبَنَدورَة.
          tokens: [{surface: غَسّْلي, lexemes: [{lexeme: ghassal, base: true}, {lexeme: imp}, {lexeme: fs.verb}]}, {surface: البَقْدونِس, lexemes: [{lexeme: el, surface: ال, n: 2, head: 3, rel: det}, {
                  lexeme: ba2dounes, surface: بَقْدونِس, base: true, feats: {Number: Sing}, n: 3}]}, {surface: والبَنَدورَة, lexemes: [{lexeme: w, surface: و, n: 4}, {lexeme: el, surface: ال, n: 5, head: 6, rel: det}, {lexeme: bandoura, surface: بَنَدورَة, base: true, n: 6}, {lexeme: sg}]}]
        apc-Latn/arabizi:
          text: ghassli el ba2dunes w el banadura.
          tokens: [{surface: ghassli, lexemes: [{lexeme: ghassal, base: true}, {lexeme: imp}, {lexeme: fs.verb}]}, {surface: el, lexeme: el, n: 2, head: 3, rel: det}, {surface: ba2dunes, lexemes: [{lexeme: ba2dounes, base: true, n: 3}, {lexeme: sg}]}, {surface: w, lexeme: w, n: 4}, {surface: el, lexeme: el, n: 5, head: 6, rel: det}, {surface: banadura, lexemes: [{lexeme: bandoura, base: true, n: 6}, {lexeme: sg}]}]
      translations:
        en: Wash the parsley and the tomatoes.
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: بَعْدين قْطَعي البَصَل.
          tokens: [{surface: بَعْدين, lexeme: ba3dein}, {surface: قْطَعي, lexemes: [{lexeme: 2ata3, base: true}, {lexeme: imp}, {lexeme: fs.verb}]}, {surface: البَصَل, lexemes: [{lexeme: el, surface: ال, n: 3, head: 4, rel: det}, {lexeme: basal, surface: بَصَل, base: true, n: 4}, {lexeme: sg}]}]
        apc-Latn/arabizi:
          text: ba3dein 2ta3i el basal.
          tokens: [{surface: ba3dein, lexeme: ba3dein}, {surface: 2ta3i, lexemes: [{lexeme: 2ata3, base: true}, {lexeme: imp}, {lexeme: fs.verb}]}, {surface: el, lexeme: el, n: 3, head: 4, rel: det}, {surface: basal, lexemes: [{lexeme: basal, base: true, n: 4}, {lexeme: sg}]}]
      translations:
        en: Then cut the onion.
  - choose:
      prompt:
        en: What does Maya wash?
      options:
      - en: The parsley and the tomatoes
      - en: The rice
      - en: The pot
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: غَسَّلِت كِلّ شي. زيد الزّيت هَلَّق؟
          tokens: [{surface: غَسَّلِت, lexemes: [{lexeme: ghassal, base: true}, {lexeme: perf-1sg}]}, {surface: كِلّ, lexeme: kell}, {surface: شي, lexeme: shi}, {surface: زيد, lexemes: [{lexeme: sub}, {lexeme: impf-1sg}, {lexeme: zad, base: true}]}, {surface: الزّيت, lexemes: [{lexeme: el, surface: ال, n: 5, head: 6, rel: det}, {lexeme: zet, surface: زّيت, base: true, n: 6}, {lexeme: sg}]}, {surface: هَلَّق, lexeme: hala2}]
        apc-Latn/arabizi:
          text: ghassalt kell shi. zid el zet hala2?
          tokens: [{surface: ghassalt, lexemes: [{lexeme: ghassal, base: true}, {lexeme: perf-1sg}]}, {surface: kell, lexeme: kell}, {surface: shi, lexeme: shi}, {surface: zid, lexemes: [{lexeme: sub}, {lexeme: impf-1sg}, {lexeme: zad, base: true}]}, {surface: el, lexeme: el, n: 5, head: 6, rel: det}, {surface: zet, lexemes: [{lexeme: zet, base: true, n: 6}, {lexeme: sg}]}, {surface: hala2, lexeme: hala2}]
      translations:
        en: I washed everything. Shall I add the oil now?
  - line:
      speaker: teta
      ask: complete
      gap: lexeme:laymoun
      distractors:
      - lexeme:ruz
      - lexeme:toum
      forms:
        apc-Arab/standard:
          text: إيه، زيدي اللَّيْمون. ما تِنْسي المِلِح!
          tokens: [{surface: إيه, lexeme: eh}, {surface: زيدي, lexemes: [{lexeme: zad, base: true}, {lexeme: imp}, {lexeme: fs.verb}]}, {surface: اللَّيْمون, lexemes: [{lexeme: el, surface: ال, n: 3, head: 4, rel: det}, {lexeme: laymoun, surface: لَّيْمون, base: true, n: 4}, {lexeme: sg}]}, {surface: ما, lexeme: ma}, {surface: تِنْسي, lexemes: [{lexeme: sub}, {lexeme: impf-2}, {lexeme: nisi, base: true}, {lexeme: fs.verb}]}, {surface: المِلِح, lexemes: [{lexeme: el, surface: ال, n: 7, head: 8, rel: det}, {lexeme: mele7, surface: مِلِح, base: true, n: 8}, {lexeme: sg}]}]
        apc-Latn/arabizi:
          text: eh, zidi el laymun. ma tensi el mel7!
          tokens: [{surface: eh, lexeme: eh}, {surface: zidi, lexemes: [{lexeme: zad, base: true}, {lexeme: imp}, {lexeme: fs.verb}]}, {surface: el, lexeme: el, n: 3, head: 4, rel: det}, {surface: laymun, lexemes: [{lexeme: laymoun, base: true, n: 4}, {lexeme: sg}]}, {surface: ma, lexeme: ma}, {surface: tensi, lexemes: [{lexeme: sub}, {lexeme: impf-2}, {lexeme: nisi, base: true}, {lexeme: fs.verb}]}, {surface: el,
              lexeme: el, n: 7, head: 8, rel: det}, {surface: mel7, lexemes: [{lexeme: mele7, base: true, n: 8}, {lexeme: sg}]}]
      translations:
        en: Yes, add the lemon. Don't forget the salt!
  - choose:
      prompt:
        en: What must Maya not forget?
      options:
      - en: The salt
      - en: The garlic
      - en: The oven
      answer: 0
