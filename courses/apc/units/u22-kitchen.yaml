# Fixture course (apc), unit 22: cooking at home, and the imperative (Kline, chapter 23): commands to a man, a
# woman and several people (ghassel, ghassle, ghasslo; 2ta3, 2ta3e; zid, zide), formed from the bare present
# without its t-; "don't" as ma with the bare present (ma tensa!, ma t7otte); commands with -li, "for me" (jibli).
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapters 22 and 23: every
# sentence awaits a native speaker's review.
id: u22-kitchen
title:
  en: In the kitchen
cefr: B1
nodes:
- {id: apc.cook.wash-cut, kind: lesson, introduces: ['lexeme:ghassal', 'lexeme:2ata3', 'lexeme:bandoura', 'lexeme:basal', 'lexeme:toum', 'lexeme:sekkine']}
