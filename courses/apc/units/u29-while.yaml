# Fixture course (apc), unit 29: the circumstance of an action, calling someone, and words that keep talk going (Kline,
# chapters 26 and 30). A pronoun and w before a participle, an adjective, a place or 3am and a verb for what was going
# on (shefta hiyye w raj3a men el shoghl; weslet hiyye w ta3bane); lamma with ken for when it was (lamma kent zghir,
# kent 7ebb el ba7r); ya before a name (ya Sami!); dakhlak, dakhlkon (excuse me); ya3ni, lek and w hek. Drafted by
# an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapters 26 and 30: every sentence awaits
# a native speaker's review.
