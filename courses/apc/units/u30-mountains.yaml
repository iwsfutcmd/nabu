# Fixture course (apc), unit 30: diminutives of affection and a review of units 21 to 29 (Kline, chapter 31). 3assoul
# (from 3asal, honey) and tayyoub (from tayyeb), said to a child or a loved one; then a weekend in a mountain house
# that brings back sarlna, ba3dni wasle, yalli, the passive participle, law with ken, dall, illa, shi marra,
# 2abelma and ba3dma. Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022): every
# sentence awaits a native speaker's review.
