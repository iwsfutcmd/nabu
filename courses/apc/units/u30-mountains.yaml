- {id: apc.mountains.dim, kind: lesson, introduces: ['lexeme:3asal', 'lexeme:3assoul', 'lexeme:tayyoub']}
- {id: apc.mountains.house, kind: lesson}
- {id: apc.mountains.night, kind: lesson}
- {id: apc.mountains.story, kind: story}
