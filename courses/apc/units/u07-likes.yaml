stories:
- id: apc.story.sea-or-mountain
  node: apc.like.story
  title: {en: 'Sea or mountains?'}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
  characters:
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي، بْتْحِبّ البَحِر؟
          tokens: [{surface: سامي, sense: sami}, {surface: بْتْحِبّ, sense: 7abb, form: 'form:impf-2ms'}, {surface: البَحِر, sense: ba7r, morphs: [{surface: ال, kc: 'sense:el'}, {surface: بَحِر, kc: 'sense:ba7r'}]}]
        apc-Latn/arabizi:
          text: Sami, bt7ebb el ba7r?
          tokens: [{surface: Sami, sense: sami}, {surface: bt7ebb, sense: 7abb, form: 'form:impf-2ms'}, {surface: el, sense: el}, {surface: ba7r, sense: ba7r}]
      translations: {en: 'Sami, do you like the sea?'}
  - line:
      speaker: sami
      ask: complete
      gap: sense:abadan
      distractors: ['sense:ktir', 'sense:kamen']
      forms:
        apc-Arab/standard:
          text: لأ، ما بْحِبّ البَحِر أَبَداً. بْحِبّ الجَبَل.
          tokens: [{surface: لأ, sense: la2}, {surface: ما, sense: ma}, {surface: بْحِبّ, sense: 7abb, form: 'form:impf-1sg'}, {surface: البَحِر, sense: ba7r, morphs: [{surface: ال, kc: 'sense:el'}, {surface: بَحِر,
                  kc: 'sense:ba7r'}]}, {surface: أَبَداً, sense: abadan}, {surface: بْحِبّ, sense: 7abb, form: 'form:impf-1sg'}, {surface: الجَبَل, sense: jabal, morphs: [{surface: ال, kc: 'sense:el'},
                {surface: جَبَل, kc: 'sense:jabal'}]}]
        apc-Latn/arabizi:
          text: la2, ma b7ebb el ba7r abadan. b7ebb el jabal.
          tokens: [{surface: la2, sense: la2}, {surface: ma, sense: ma}, {surface: b7ebb, sense: 7abb, form: 'form:impf-1sg'}, {surface: el, sense: el}, {surface: ba7r, sense: ba7r}, {surface: abadan, sense: abadan},
            {surface: b7ebb, sense: 7abb, form: 'form:impf-1sg'}, {surface: el, sense: el}, {surface: jabal, sense: jabal}]
      translations: {en: 'No, I don''t like the sea at all. I like the mountains.'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَنا بْحِبّ البَحِر أَكْتَر!
          tokens: [{surface: أَنا, sense: ana}, {surface: بْحِبّ, sense: 7abb, form: 'form:impf-1sg'}, {surface: البَحِر, sense: ba7r, morphs: [{surface: ال, kc: 'sense:el'}, {surface: بَحِر, kc: 'sense:ba7r'}]},
            {surface: أَكْتَر, sense: aktar}]
        apc-Latn/arabizi:
          text: ana b7ebb el ba7r aktar!
          tokens: [{surface: ana, sense: ana}, {surface: b7ebb, sense: 7abb, form: 'form:impf-1sg'}, {surface: el, sense: el}, {surface: ba7r, sense: ba7r}, {surface: aktar, sense: aktar}]
      translations: {en: I like the sea more!}
  - choose:
      prompt:
        en: What does Sami like?
      options: [{en: The mountains}, {en: The sea}, {en: Football}]
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وشو بْتْحِبّي كَمان؟
          tokens: [{surface: وشو, sense: shu, morphs: [{surface: و, kc: 'sense:w'}, {surface: شو, kc: 'sense:shu'}]}, {surface: بْتْحِبّي, sense: 7abb, form: 'form:impf-2fs'}, {surface: كَمان, sense: kamen}]
        apc-Latn/arabizi:
          text: w shu bt7ebbi kamen?
          tokens: [{surface: w, sense: w}, {surface: shu, sense: shu}, {surface: bt7ebbi, sense: 7abb, form: 'form:impf-2fs'}, {surface: kamen, sense: kamen}]
      translations: {en: 'And what else do you like?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بْحِبّ الموسيقى. بِسْمَع موسيقى كِلّ يوم.
          tokens: [{surface: بْحِبّ, sense: 7abb, form: 'form:impf-1sg'}, {surface: الموسيقى, sense: musi2a, morphs: [{surface: ال, kc: 'sense:el'}, {surface: موسيقى, kc: 'sense:musi2a'}]}, {surface: بِسْمَع,
              sense: sama3, form: 'form:impf-1sg'}, {surface: موسيقى, sense: musi2a}, {surface: كِلّ, sense: kell}, {surface: يوم, sense: yom}]
        apc-Latn/arabizi:
          text: b7ebb el musi2a. bisma3 musi2a kell yom.
          tokens: [{surface: b7ebb, sense: 7abb, form: 'form:impf-1sg'}, {surface: el, sense: el}, {surface: musi2a, sense: musi2a}, {surface: bisma3, sense: sama3, form: 'form:impf-1sg'}, {surface: musi2a,
              sense: musi2a}, {surface: kell, sense: kell}, {surface: yom, sense: yom}]
      translations: {en: I love music. I listen to music every day.}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وبْتْغَنّي؟
          tokens: [{surface: وبْتْغَنّي, sense: ghanne, form: 'form:impf-2fs', morphs: [{surface: و, kc: 'sense:w'}, {surface: بْتْغَنّي, kc: 'sense:ghanne'}]}]
        apc-Latn/arabizi:
          text: w btghanne?
          tokens: [{surface: w, sense: w}, {surface: btghanne, sense: ghanne, form: 'form:impf-2fs'}]
      translations: {en: 'And do you sing?'}
  - line:
      speaker: maya
      ask: arrange
      forms:
        apc-Arab/standard:
          text: إيه، وبْحِبّ اُرْقُص كَمان!
          tokens: [{surface: إيه, sense: eh}, {surface: وبْحِبّ, sense: 7abb, form: 'form:impf-1sg', morphs: [{surface: و, kc: 'sense:w'}, {surface: بْحِبّ, kc: 'sense:7abb'}]}, {surface: اُرْقُص, sense: ra2as,
              form: 'form:subj-1sg'}, {surface: كَمان, sense: kamen}]
