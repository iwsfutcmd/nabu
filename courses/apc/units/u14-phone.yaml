stories:
- id: apc.story.teta-calls
  node: apc.phone.story
  title: {en: Teta calls}
  provenance: {author: 'llm:claude@99d8501c54f6', status: draft}
  characters:
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: teta, speaker: f, name: {apc-Arab/standard: تيتا, apc-Latn/arabizi: Teta}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: أَلو؟
          tokens: [{surface: أَلو, sense: alo}]
        apc-Latn/arabizi:
          text: alo?
          tokens: [{surface: alo, sense: alo}]
      translations: {en: 'Hello?'}
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: أَلو سامي! أَنا تيتا. سْمِعْتْني؟
          tokens: [{surface: أَلو, sense: alo}, {surface: سامي, sense: sami}, {surface: أَنا, sense: ana}, {surface: تيتا, sense: teta}, {surface: سْمِعْتْني, sense: sama3, form: 'form:past-2ms', morphs: [
                {surface: سْمِعْتْ, kc: 'sense:sama3'}, {surface: ني, kc: 'form:obj-1sg'}]}]
        apc-Latn/arabizi:
          text: alo Sami! ana teta. sme3tni?
          tokens: [{surface: alo, sense: alo}, {surface: Sami, sense: sami}, {surface: ana, sense: ana}, {surface: teta, sense: teta}, {surface: sme3tni, sense: sama3, form: 'form:past-2ms', morphs: [{
                  surface: sme3t, kc: 'sense:sama3'}, {surface: ni, kc: 'form:obj-1sg'}]}]
      translations: {en: 'Hello Sami! It''s grandma. Can you hear me?'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: إيه تيتا، كيفِك؟
          tokens: [{surface: إيه, sense: eh}, {surface: تيتا, sense: teta}, {surface: كيفِك, sense: kif, morphs: [{surface: كيفِ, kc: 'sense:kif'}, {surface: ك, kc: 'form:poss-2fs'}]}]
        apc-Latn/arabizi:
          text: eh teta, kifik?
          tokens: [{surface: eh, sense: eh}, {surface: teta, sense: teta}, {surface: kifik, sense: kif, morphs: [{surface: kif, kc: 'sense:kif'}, {surface: ik, kc: 'form:poss-2fs'}]}]
      translations: {en: 'Yes, grandma, how are you?'}
  - line:
      speaker: teta
      ask: complete
      gap: sense:de22
      distractors: ['sense:b3at']
      forms:
        apc-Arab/standard:
          text: مْنيحَة. ما عِنْدَك تِلِفون؟ ما بْتْدِقِّلّي أَبَداً!
          tokens: [{surface: مْنيحَة, sense: mni7, form: 'form:fem'}, {surface: ما, sense: ma}, {surface: عِنْدَك, sense: 3end, morphs: [{surface: عِنْدَ, kc: 'sense:3end'}, {surface: ك, kc: 'form:poss-2ms'}]},
            {surface: تِلِفون, sense: telefon}, {surface: ما, sense: ma}, {surface: بْتْدِقِّلّي, sense: de22, form: 'form:impf-2ms', morphs: [{surface: بْتْدِقِّ, kc: 'sense:de22'}, {surface: لّي, kc: 'form:la-1sg'}]},
            {surface: أَبَداً, sense: abadan}]
        apc-Latn/arabizi:
          text: mni7a. ma 3endak telefon? ma btde22elli abadan!
          tokens: [{surface: mni7a, sense: mni7, form: 'form:fem'}, {surface: ma, sense: ma}, {surface: 3endak, sense: 3end, morphs: [{surface: 3end, kc: 'sense:3end'}, {surface: ak, kc: 'form:poss-2ms'}]},
            {surface: telefon, sense: telefon}, {surface: ma, sense: ma}, {surface: btde22elli, sense: de22, form: 'form:impf-2ms', morphs: [{surface: btde22, kc: 'sense:de22'}, {surface: elli, kc: 'form:la-1sg'}]},
            {surface: abadan, sense: abadan}]
      translations: {en: 'Fine. Don''t you have a phone? You never call me!'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَعْليش تيتا، كِنْت مَشْغول كْتير.
          tokens: [{surface: مَعْليش, sense: ma3lesh}, {surface: تيتا, sense: teta}, {surface: كِنْت, sense: kan, form: 'form:past-1sg'}, {surface: مَشْغول, sense: mashghoul}, {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: ma3lesh teta, kent mashghoul ktir.
          tokens: [{surface: ma3lesh, sense: ma3lesh}, {surface: teta, sense: teta}, {surface: kent, sense: kan, form: 'form:past-1sg'}, {surface: mashghoul, sense: mashghoul}, {surface: ktir, sense: ktir}]
      translations: {en: 'Sorry, grandma, I was very busy.'}
  - choose:
      prompt: {en: 'Why is Teta upset?'}
      options: [{en: Sami never calls her}, {en: Sami is sick}, {en: Sami lost his phone}]
      answer: 0
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: قِلّي، رَح تْزورْني الأَحَد؟
          tokens: [{surface: قِلّي, sense: 2al, morphs: [{surface: قِ, kc: 'sense:2al'}, {surface: لّي, kc: 'form:la-1sg'}]}, {surface: رَح, sense: ra7.fut}, {surface: تْزورْني, sense: zar, form: 'form:subj-2ms',
              morphs: [{surface: تْزورْ, kc: 'sense:zar'}, {surface: ني, kc: 'form:obj-1sg'}]}, {surface: الأَحَد, sense: a7ad, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَحَد, kc: 'sense:a7ad'}]}]
        apc-Latn/arabizi:
          text: 2elli, ra7 tzurni el a7ad?
          tokens: [{surface: 2elli, sense: 2al, morphs: [{surface: '2', kc: 'sense:2al'}, {surface: elli, kc: 'form:la-1sg'}]}, {surface: ra7, sense: ra7.fut}, {surface: tzurni, sense: zar, form: 'form:subj-2ms',
              morphs: [{surface: tzur, kc: 'sense:zar'}, {surface: ni, kc: 'form:obj-1sg'}]}, {surface: el, sense: el}, {surface: a7ad, sense: a7ad}]
      translations: {en: 'Tell me, are you going to visit me on Sunday?'}
  - line:
      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: أَكيد، رَح زورِك الأَحَد.
          tokens: [{surface: أَكيد, sense: akid}, {surface: رَح, sense: ra7.fut}, {surface: زورِك, sense: zar, form: 'form:subj-1sg', morphs: [{surface: زورِ, kc: 'sense:zar'}, {surface: ك, kc: 'form:obj-2fs'}]},
            {surface: الأَحَد, sense: a7ad, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَحَد, kc: 'sense:a7ad'}]}]
        apc-Latn/arabizi:
          text: akid, ra7 zurik el a7ad.
          tokens: [{surface: akid, sense: akid}, {surface: ra7, sense: ra7.fut}, {surface: zurik, sense: zar, form: 'form:subj-1sg', morphs: [{surface: zur, kc: 'sense:zar'}, {surface: ik, kc: 'form:obj-2fs'}]},
            {surface: el, sense: el}, {surface: a7ad, sense: a7ad}]
      translations: {en: 'Of course, I''ll visit you on Sunday.'}
  - line:
      speaker: teta
      forms:
        apc-Arab/standard:
          text: يَلّا حَبيبي، بْحِبَّك!
          tokens: [{surface: يَلّا, sense: yalla}, {surface: حَبيبي, sense: 7abibi}, {surface: بْحِبَّك, sense: 7abb, form: 'form:impf-1sg', morphs: [{surface: بْحِبَّ, kc: 'sense:7abb'}, {surface: ك, kc: 'form:obj-2ms'}]}]
        apc-Latn/arabizi:
          text: yalla 7abibi, b7ebbak!
          tokens: [{surface: yalla, sense: yalla}, {surface: 7abibi, sense: 7abibi}, {surface: b7ebbak, sense: 7abb, form: 'form:impf-1sg', morphs: [{surface: b7ebb, kc: 'sense:7abb'}, {surface: ak, kc: 'form:obj-2ms'}]}]
      translations: {en: 'OK, sweetheart, I love you!'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وأَنا كَمان بْحِبَّك، تيتا!
          tokens: [{surface: وأَنا, sense: ana, morphs: [{surface: و, kc: 'sense:w'}, {surface: أَنا, kc: 'sense:ana'}]}, {surface: كَمان, sense: kamen}, {surface: بْحِبَّك, sense: 7abb, form: 'form:impf-1sg',
              morphs: [{surface: بْحِبَّ, kc: 'sense:7abb'}, {surface: ك, kc: 'form:obj-2fs'}]}, {surface: تيتا, sense: teta}]
        apc-Latn/arabizi:
          text: w ana kamen b7ebbik, teta!
          tokens: [{surface: w, sense: w}, {surface: ana, sense: ana}, {surface: kamen, sense: kamen}, {surface: b7ebbik, sense: 7abb, form: 'form:impf-1sg', morphs: [{surface: b7ebb, kc: 'sense:7abb'},
                {surface: ik, kc: 'form:obj-2fs'}]}, {surface: teta, sense: teta}]
      translations: {en: 'I love you too, grandma!'}
  - choose:
      prompt: {en: 'When will Sami visit Teta?'}
      options: [{en: On Sunday}, {en: Tomorrow}, {en: Next week}]
      answer: 0
scenarios:
- id: apc.phone-call
  after: apc.phone.story
  title: {en: A phone call}
  setting: {en: Your phone rings on a Saturday afternoon; the line is bad.}
  character: {en: 'Nour, a friend who wants to make plans and keeps asking whether you can hear her.'}
  goal: {en: 'Answer the phone, say who you are, say when you can''t hear or understand, ask her to call or message you later, and agree when to talk again.'}
  provenance: {author: 'llm:claude@99d8501c54f6', status: draft}
