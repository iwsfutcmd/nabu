- {id: 'sense:2arib', gloss: {en: near; close}, forms: {apc-Arab/standard: [قريب], apc-Latn/arabizi: [2arib]}}
- {id: 'sense:b3id', gloss: {en: far}, forms: {apc-Arab/standard: [بعيد, بعيدة], apc-Latn/arabizi: [b3id, b3ide]}}
