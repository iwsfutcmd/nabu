# Fixture course (apc), unit 4: home and places. wen / hon / honik, fi (there is) and ma fi, the clitic
# prepositions b- (in, at) and 3a (to, on), rooms, near and far, left and right; the ending -na (our).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: u04-home
title: {en: 'Where''s the house?'}
cefr: A1
kcs:
- {id: 'sense:wen', gloss: {en: where}, forms: {apc-Arab/standard: [وين], apc-Latn/arabizi: [wen]}}
- {id: 'sense:bet', gloss: {en: house; home}, forms: {apc-Arab/standard: [البيت], apc-Latn/arabizi: [bet]}}
- {id: 'sense:hon', gloss: {en: here}, forms: {apc-Arab/standard: [هون], apc-Latn/arabizi: [hon]}}
