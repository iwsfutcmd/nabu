- {id: 'form:poss-1pl', gloss: {en: '-na: our'}, notes: {en: 'betna: our house. Arabic script: نا joined to the noun (بيتنا).'}}
- {id: 'sense:fo2', gloss: {en: upstairs; up; above}, forms: {apc-Arab/standard: [فوق], apc-Latn/arabizi: [fo2]}}
- {id: 'sense:ta7t', gloss: {en: downstairs; down; under}, forms: {apc-Arab/standard: [تحت], apc-Latn/arabizi: [ta7t]}}
- {id: 'sense:7add', gloss: {en: next to}, forms: {apc-Arab/standard: [حدّ], apc-Latn/arabizi: [7add]}}
