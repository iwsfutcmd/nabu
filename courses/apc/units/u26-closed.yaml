# Fixture course (apc), unit 26: passive participles (Kline, chapter 19). Form I verbs take ma- and a long u
# (maftou7, maksour, maktoub, ma3rouf, ma7boub, ma2tou3, ma7tout, ma3zoum, mamnou3), Form II verbs m- and an a before
# the last letter (msakkar); like adjectives they agree (maftou7a, ma3zoumin) and tell the state an action left
# (el beb msakkar: the door is shut), with ken for the past (el beb ken msakkar). The verb's own forms stand beside
# them (kasar el fenjen: he broke the cup). Drafted by an LLM (provenance llm:…, status draft) and checked against
# Kline (2022), chapter 19: every sentence awaits a native speaker's review.
