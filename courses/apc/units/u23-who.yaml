# Fixture course (apc), unit 23: relative clauses and the genitive construct. yalli (Kline's li / lli / yalle) as
# subject (el zalame yalli seken fo2) and as object, with the pronoun ending that points back (el ktab yalli
# 2rito: the book I read, literally 'that I read it'); two nouns side by side for 'of' (bet jeddo, esm el
# m3allem: Kline, chapter 9), the first one never taking el; nafs (same). Drafted by an LLM (provenance llm:…,
# status draft) and checked against Kline (2022), chapters 7 and 9: every sentence awaits a native speaker's review.
id: u23-who
title:
  en: The one who…
cefr: B1
nodes:
- {id: apc.who.subject, kind: lesson, introduces: ['lexeme:yalli']}
- {id: apc.who.object, kind: lesson}
- {id: apc.who.of, kind: lesson, introduces: ['lexeme:tawle']}
- {id: apc.who.same, kind: lesson, introduces: ['lexeme:nafs']}
- {id: apc.who.story, kind: story}
