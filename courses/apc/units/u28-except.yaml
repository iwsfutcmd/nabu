# Fixture course (apc), unit 28: exception, without, and exclamations (Kline, chapters 27 and 28). illa after a
# negative for "only, nothing but" (ma akalt shi illa khebz); ghayr for "other than", with an ending too (ghayrak);
# bala and bidoun for "without" (ahwe bala sukkar; bidouni, without me); w bas and bas hek (that's all); and how
# something is, with shu (shu 7elo hal bet!) and 2addesh with an ending (2addesha tayybe!). Drafted by an LLM
# (provenance llm:…, status draft) and checked against Kline (2022), chapters 27 and 28: every sentence awaits a
# native speaker's review.
id: u28-except
title:
  en: Without sugar
cefr: B1
nodes:
- {id: apc.except.illa, kind: lesson, introduces: ['lexeme:illa']}
- {id: apc.except.ghayr, kind: lesson, introduces: ['lexeme:ghayr']}
- {id: apc.except.without, kind: lesson, introduces: ['lexeme:bidoun']}
- {id: apc.except.all, kind: lesson}
- {id: apc.except.how, kind: lesson}
- {id: apc.except.story, kind: story}
