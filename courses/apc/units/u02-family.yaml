stories:
- id: apc.story.family
  node: apc.fam.story
  title: {en: 'Who''s this?'}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
  characters:
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، مين هَيدا؟
          tokens: [{surface: مايا, sense: maya}, {surface: مين, sense: meen}, {surface: هَيدا, sense: hayda}]
        apc-Latn/arabizi:
          text: Maya, meen hayda?
          tokens: [{surface: Maya, sense: maya}, {surface: meen, sense: meen}, {surface: hayda, sense: hayda}]
      translations: {en: 'Maya, who''s this?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: هَيدا بَيّي، وهَيدي إِمّي.
          tokens: [{surface: هَيدا, sense: hayda}, {surface: بَيّي, sense: bayy, morphs: [{surface: بَيّ, kc: 'sense:bayy'}, {surface: ي, kc: 'form:poss-1sg'}]}, {surface: وهَيدي, sense: hayde, morphs: [
                {surface: و, kc: 'sense:w'}, {surface: هَيدي, kc: 'sense:hayde'}]}, {surface: إِمّي, sense: emm, morphs: [{surface: إِمّ, kc: 'sense:emm'}, {surface: ي, kc: 'form:poss-1sg'}]}]
        apc-Latn/arabizi:
          text: hayda bayyi, w hayde emmi.
          tokens: [{surface: hayda, sense: hayda}, {surface: bayyi, sense: bayy, morphs: [{surface: bayy, kc: 'sense:bayy'}, {surface: i, kc: 'form:poss-1sg'}]}, {surface: w, sense: w}, {surface: hayde,
              sense: hayde}, {surface: emmi, sense: emm, morphs: [{surface: emm, kc: 'sense:emm'}, {surface: i, kc: 'form:poss-1sg'}]}]
      translations: {en: 'This is my dad, and this is my mom.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: وهَيدا مين؟ خَيِّك؟
          tokens: [{surface: وهَيدا, sense: hayda, morphs: [{surface: و, kc: 'sense:w'}, {surface: هَيدا, kc: 'sense:hayda'}]}, {surface: مين, sense: meen}, {surface: خَيِّك, sense: khayy, morphs: [{surface: خَيِّ,
                  kc: 'sense:khayy'}, {surface: ك, kc: 'form:poss-2fs'}]}]
        apc-Latn/arabizi:
          text: w hayda meen? khayyik?
          tokens: [{surface: w, sense: w}, {surface: hayda, sense: hayda}, {surface: meen, sense: meen}, {surface: khayyik, sense: khayy, morphs: [{surface: khayy, kc: 'sense:khayy'}, {surface: ik, kc: 'form:poss-2fs'}]}]
      translations: {en: 'And who''s this? Your brother?'}
  - line:
      speaker: maya
      ask: complete
      gap: sense:ekht
      distractors: ['sense:bent', 'sense:teta']
      forms:
        apc-Arab/standard:
          text: إيه، خَيّي. عِنْدي خَيّ وإِخْت.
          tokens: [{surface: إيه, sense: eh}, {surface: خَيّي, sense: khayy, morphs: [{surface: خَيّ, kc: 'sense:khayy'}, {surface: ي, kc: 'form:poss-1sg'}]}, {surface: عِنْدي, sense: 3end, morphs: [{surface: عِنْد,
                  kc: 'sense:3end'}, {surface: ي, kc: 'form:poss-1sg'}]}, {surface: خَيّ, sense: khayy}, {surface: وإِخْت, sense: ekht, morphs: [{surface: و, kc: 'sense:w'}, {surface: إِخْت, kc: 'sense:ekht'}]}]
        apc-Latn/arabizi:
          text: eh, khayyi. 3endi khayy w ekht.
          tokens: [{surface: eh, sense: eh}, {surface: khayyi, sense: khayy, morphs: [{surface: khayy, kc: 'sense:khayy'}, {surface: i, kc: 'form:poss-1sg'}]}, {surface: 3endi, sense: 3end, morphs: [{surface: 3end,
                  kc: 'sense:3end'}, {surface: i, kc: 'form:poss-1sg'}]}, {surface: khayy, sense: khayy}, {surface: w, sense: w}, {surface: ekht, sense: ekht}]
      translations: {en: 'Yes, my brother. I have a brother and a sister.'}
  - choose:
