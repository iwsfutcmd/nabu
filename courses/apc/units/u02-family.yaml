# Fixture course (apc), unit 2: family. This (hayda/hayde), who (meen), and the possessive
# suffixes -i, -ak, -ik, -o, -a as morphs; adjectives take the feminine -e (form:fem) as a token form.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: u02-family
title: {en: My family}
cefr: A1
kcs:
- {id: 'sense:hayda', gloss: {en: this (masculine)}, forms: {apc-Arab/standard: [هيدا], apc-Latn/arabizi: [hayda]}, notes: {en: 'Feminine: هيدي, hayde.'}}
- {id: 'sense:meen', gloss: {en: who}, forms: {apc-Arab/standard: [مين], apc-Latn/arabizi: [meen]}}
- {id: 'sense:maya', gloss: {en: Maya (a name)}, forms: {apc-Arab/standard: [مايا], apc-Latn/arabizi: [Maya]}}
- {id: 'sense:hayde', gloss: {en: this (feminine)}, forms: {apc-Arab/standard: [هيدي], apc-Latn/arabizi: [hayde]}}
- {id: 'sense:bayy', gloss: {en: father; dad}, forms: {apc-Arab/standard: [بيّ], apc-Latn/arabizi: [bayy]}, notes: {en: 'Usually with an ending (bayyi, my dad) or before a name (bayy Sami, Sami''s dad).'}}
- {id: 'form:poss-1sg', gloss: {en: '-i: my (ending on a noun)'}, notes: {en: 'Arabic script: ي joined to the noun (بيّي). Often heard and typed -e: bayye, emme.'}}
- {id: 'sense:emm', gloss: {en: mother; mom}, forms: {apc-Arab/standard: [إمّ], apc-Latn/arabizi: [emm]}}
- {id: 'form:poss-2ms', gloss: {en: '-ak: your (to a man)'}, notes: {en: 'Arabic script: ك joined to the noun (بيّك). To a woman: -ik, written with the same ك.'}}
- {id: 'sense:khayy', gloss: {en: brother}, forms: {apc-Arab/standard: [خيّ], apc-Latn/arabizi: [khayy]}}
- {id: 'sense:ekht', gloss: {en: sister}, forms: {apc-Arab/standard: [إخت], apc-Latn/arabizi: [ekht]}}
- {id: 'sense:3end', gloss: {en: 'at; have (with an ending: 3endi, I have)'}, forms: {apc-Arab/standard: [عند], apc-Latn/arabizi: [3end]}, notes: {en: '3endi: I have; 3endak: you have. Not a verb: the ending
      says who has.'}}
- {id: 'sense:ma', gloss: {en: not (before a verb or 3endi)}, forms: {apc-Arab/standard: [ما], apc-Latn/arabizi: [ma]}}
- {id: 'form:poss-3ms', gloss: {en: '-o: his'}, notes: {en: 'Arabic script: ه joined to the noun (بيّه), also written و (بيّو).'}}
- {id: 'sense:esm', gloss: {en: name}, forms: {apc-Arab/standard: [اسم], apc-Latn/arabizi: [esm]}, image: {file: ../images/name-tag.svg, license: CC0-1.0, provenance: {author: 'llm:claude@949422768931',
      status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'esmo: his name; esma: her name. Compare اسمي (esmi) and اسمك (esmak).'}}
- {id: 'form:poss-3fs', gloss: {en: '-a: her'}, notes: {en: 'Arabic script: ها joined to the noun (إمّها), also written ا (إمّا).'}}
- {id: 'sense:kif', gloss: {en: how}, forms: {apc-Arab/standard: [كيف], apc-Latn/arabizi: [kif]}, notes: {en: 'kifo? how is he?; kifa? how is she?; kifik? how are you? (to a woman); kifkon? (to several people).'}}
- {id: 'form:poss-2fs', gloss: {en: '-ik: your (to a woman)'}, notes: {en: 'Arabic script: the same ك as -ak, so كيفك reads kifak to a man and kifik to a woman.'}}
- {id: 'sense:teta', gloss: {en: grandma}, forms: {apc-Arab/standard: [تيتا], apc-Latn/arabizi: [teta]}}
- {id: 'sense:jeddo', gloss: {en: grandpa}, forms: {apc-Arab/standard: [جدّو], apc-Latn/arabizi: [jeddo]}}
- {id: 'sense:3ayle', gloss: {en: family}, forms: {apc-Arab/standard: [عيلة], apc-Latn/arabizi: [3ayle]}}
- {id: 'sense:kbir', gloss: {en: big; old (of people); older}, forms: {apc-Arab/standard: [كبير, كبيرة], apc-Latn/arabizi: [kbir, kbire]}}
- {id: 'sense:zghir', gloss: {en: small; little; young}, forms: {apc-Arab/standard: [زغير, زغيرة], apc-Latn/arabizi: [zghir, zghire]}}
- {id: 'form:fem', gloss: {en: '-e / -a: feminine ending on an adjective'}, notes: {en: 'kbir → kbire, zghir → zghire. Arabic script: ة (كبيرة).'}}
- {id: 'sense:ebn', gloss: {en: son}, forms: {apc-Arab/standard: [إبن], apc-Latn/arabizi: [ebn]}}
- {id: 'sense:bent', gloss: {en: daughter; girl}, forms: {apc-Arab/standard: [بنت], apc-Latn/arabizi: [bent]}}
- {id: 'sense:7elo', gloss: {en: nice; pretty; sweet}, forms: {apc-Arab/standard: [حلو, حلوة], apc-Latn/arabizi: [7elo, 7elwe]}}
- {id: 'sense:wlad', gloss: {en: children; kids}, forms: {apc-Arab/standard: [ولاد], apc-Latn/arabizi: [wlad]}}
- {id: 'form:poss-2pl', gloss: {en: '-kon: your (to several people)'}, notes: {en: 'kifkon? how are you (all)?; 3endkon: you have. Arabic script: كن joined to the word (كيفكن).'}}
nodes:
- {id: apc.fam.this, kind: lesson, introduces: ['sense:hayda', 'sense:meen', 'sense:maya', 'sense:hayde']}
- {id: apc.fam.parents, kind: lesson, introduces: ['sense:bayy', 'form:poss-1sg', 'sense:emm', 'form:poss-2ms']}
- {id: apc.fam.siblings, kind: lesson, introduces: ['sense:khayy', 'sense:ekht', 'sense:3end', 'sense:ma']}
- {id: apc.fam.his-her, kind: lesson, introduces: ['form:poss-3ms', 'sense:esm', 'form:poss-3fs', 'sense:kif', 'form:poss-2fs']}
- {id: apc.fam.grandparents, kind: lesson, introduces: ['sense:teta', 'sense:jeddo', 'sense:3ayle', 'sense:kbir', 'sense:zghir', 'form:fem']}
- {id: apc.fam.children, kind: lesson, introduces: ['sense:ebn', 'sense:bent', 'sense:7elo', 'sense:wlad']}
- {id: apc.fam.you-pl, kind: lesson, introduces: ['form:poss-2pl']}
- {id: apc.fam.story, kind: story}
