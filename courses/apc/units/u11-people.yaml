stories:
- id: apc.story.neighbours
  node: apc.ppl.story
  title: {en: The new neighbours}
  provenance: {author: 'llm:claude@8a5567b189a3', status: draft}
  characters:
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي، مين هَالمَرَة؟
          tokens: [{surface: سامي, sense: sami}, {surface: مين, sense: meen}, {surface: هَالمَرَة, sense: mara, morphs: [{surface: هَال, kc: 'sense:hal'}, {surface: مَرَة, kc: 'sense:mara'}]}]
        apc-Latn/arabizi:
          text: Sami, meen hal mara?
          tokens: [{surface: Sami, sense: sami}, {surface: meen, sense: meen}, {surface: hal, sense: hal}, {surface: mara, sense: mara}]
      translations: {en: 'Sami, who''s that woman?'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
