scenarios:
- id: apc.new-neighbour
  after: apc.ppl.story
  title:
    en: Meeting a neighbour
  setting:
    en: The stairwell of a building in Beirut, on a Saturday morning.
  character:
    en: Um Karim, a talkative neighbour from the third floor, who knows everyone in the building.
  goal:
    en: Say who you are and where you live, ask who lives in the building, where people are from and what they do, and talk about your family and friends.
  provenance:
    author: llm:claude@8a5567b189a3
    status: draft
