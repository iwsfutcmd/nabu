      forms:
        apc-Arab/standard:
          text: وإِنْتي؟ وين رِحْتي؟
          tokens: [{surface: وإِنْتي, lexemes: [{lexeme: w, surface: و}, {lexeme: enti, surface: إِنْتي, base: true, feats: {Gender: Fem, Number: Sing}}]}, {surface: وين, lexeme: wen}, {surface: رِحْتي, lexemes: [{lexeme: ra7, base: true}, {lexeme: perf-2fs}]}]
