        apc-Latn/arabizi:
          text: eh, ktir! akalna terwi2a tayybe w shrebna ahwe.
          tokens: [{surface: eh, sense: eh}, {surface: ktir, sense: ktir}, {surface: akalna, sense: akal, form: 'form:past-1pl'}, {surface: terwi2a, sense: terwi2a}, {surface: tayybe, sense: tayyeb, form: 'form:fem'},
