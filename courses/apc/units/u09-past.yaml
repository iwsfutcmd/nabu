  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: حِلو! كِنْت مَبْسوط؟
          tokens: [{surface: حِلو, sense: 7elo}, {surface: كِنْت, sense: kan, form: 'form:past-2ms'}, {surface: مَبْسوط, sense: mabsout}]
        apc-Latn/arabizi:
