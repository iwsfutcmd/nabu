      speaker: maya
      forms:
        apc-Arab/standard:
          text: أَنا كِنِت بِالبيت. كِنِت تَعْبانِة.
          tokens: [{surface: أَنا, lexeme: ana}, {surface: كِنِت, lexemes: [{lexeme: kan, base: true}, {lexeme: perf-1sg}]}, {surface: بِالبيت, lexemes: [{lexeme: b, surface: بِ, n: 3, head: 5, rel: case}, {lexeme: el, surface: ال, n: 4, head: 5, rel: det}, {lexeme: bet, surface: بيت, base: true, n: 5}, {lexeme: sg}]}, {surface: كِنِت, lexemes: [{lexeme: kan, base: true}, {lexeme: perf-1sg}]}, {surface: تَعْبانِة, lexemes: [{lexeme: ta3ban, base: true}, {lexeme: fs}]}]
        apc-Latn/arabizi:
