  characters:
  - {id: maya, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  - {id: sami, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي! شو عْمِلْت الجِمْعَة الماضْيِة؟
          tokens: [{surface: سامي, sense: sami}, {surface: شو, sense: shu}, {surface: عْمِلْت, sense: 3emel, form: 'form:past-2ms'}, {surface: الجِمْعَة, sense: jem3a, morphs: [{surface: ال, kc: 'sense:el'},
                {surface: جِمْعَة, kc: 'sense:jem3a'}]}, {surface: الماضْيِة, sense: madi, form: 'form:fem', morphs: [{surface: ال, kc: 'sense:el'}, {surface: ماضْيِة, kc: 'sense:madi'}]}]
        apc-Latn/arabizi:
          text: Sami! shu 3melt el jem3a el madye?
          tokens: [{surface: Sami, sense: sami}, {surface: shu, sense: shu}, {surface: 3melt, sense: 3emel, form: 'form:past-2ms'}, {surface: el, sense: el}, {surface: jem3a, sense: jem3a}, {surface: el,
              sense: el}, {surface: madye, sense: madi, form: 'form:fem'}]
      translations: {en: 'Sami! What did you do last week?'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: رُحْت عَالجَبَل مَع خَيّي.
          tokens: [{surface: رُحْت, sense: ra7, form: 'form:past-1sg'}, {surface: عَالجَبَل, sense: jabal, morphs: [{surface: عَ, kc: 'sense:3a'}, {surface: ال, kc: 'sense:el'}, {surface: جَبَل, kc: 'sense:jabal'}]},
            {surface: مَع, sense: ma3}, {surface: خَيّي, sense: khayy, morphs: [{surface: خَيّ, kc: 'sense:khayy'}, {surface: ي, kc: 'form:poss-1sg'}]}]
