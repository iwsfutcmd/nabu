        en: Nice! Did you have a good time?
  - line:
      speaker: sami
      ask: complete
      gap: lexeme:terwi2a
      distractors:
      - lexeme:ghorfe
      - lexeme:dekkene
      forms:
        apc-Arab/standard:
          text: إيه، كْتير! أَكَلْنا تِرْويقَة طَيّْبِة وشْرِبْنا قَهْوِة.
          tokens: [{surface: إيه, lexeme: eh}, {surface: كْتير, lexeme: ktir}, {surface: أَكَلْنا, lexemes: [{lexeme: akal, base: true}, {lexeme: perf-1pl}]}, {surface: تِرْويقَة, lexemes: [{lexeme: terwi2a, base: true, n: 4}, {lexeme: sg}]}, {surface: طَيّْبِة, lexemes: [{lexeme: tayyeb, base: true, n: 5, head: 4, rel: amod}, {lexeme: fs}]}, {surface: وشْرِبْنا, lexemes: [{lexeme: w, surface: و}, {lexeme: shereb, surface: شْرِبْنا, base: true}, {lexeme: perf-1pl}]}, {surface: قَهْوِة, lexemes: [{lexeme: ahwe, base: true}, {lexeme: sg}]}]
        apc-Latn/arabizi:
