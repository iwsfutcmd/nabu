          tokens: [{surface: eh, lexeme: eh}, {surface: ktir, lexeme: ktir}, {surface: akalna, lexemes: [{lexeme: akal, base: true}, {lexeme: perf-1pl}]}, {surface: terwi2a, lexemes: [{lexeme: terwi2a, base: true, n: 4}, {lexeme: sg}]}, {surface: tayybe, lexemes: [{lexeme: tayyeb, base: true, n: 5, head: 4, rel: amod}, {lexeme: fs}]}, {surface: w, lexeme: w}, {surface: shrebna, lexemes: [{lexeme: shereb, base: true}, {lexeme: perf-1pl}]}, {surface: ahwe, lexemes: [{lexeme: ahwe, base: true}, {lexeme: sg}]}]
