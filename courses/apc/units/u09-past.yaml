          tokens: [{surface: re7t, lexemes: [{lexeme: ra7, base: true}, {lexeme: perf-1sg}]}, {surface: 3al, lexemes: [{lexeme: 3a, surface: 3a, base: true, n: 2, head: 4, rel: case}, {lexeme: el, surface: l, n: 3, head: 4, rel: det}]}, {surface: jabal, lexemes: [{lexeme: jabal, base: true, n: 4}, {lexeme: sg}]}, {surface: ma3, lexeme: ma3, n: 5, head: 6, rel: case}, {surface: khayyi, lexemes: [{lexeme: khayy, surface: khayy, base: true, n: 6}, {lexeme: sg}, {lexeme: poss-1sg, surface: i}]}]
      translations:
        en: I went to the mountains with my brother.
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: حِلو! كِنِت مَبْسوط؟
          tokens: [{surface: حِلو, lexemes: [{lexeme: 7elo, base: true}, {lexeme: ms}]}, {surface: كِنِت, lexemes: [{lexeme: kan, base: true}, {lexeme: perf-2ms}]}, {surface: مَبْسوط, lexemes: [{lexeme: mabsout, base: true}, {lexeme: ms}]}]
