      ask: complete
      gap: sense:terwi2a
      distractors: ['sense:ghada', 'sense:man2oushe']
      forms:
        apc-Arab/standard:
          text: إيه، كْتير! أَكَلْنا تِرْويقَة طَيّْبِة وشْرِبْنا قَهْوِة.
          tokens: [{surface: إيه, sense: eh}, {surface: كْتير, sense: ktir}, {surface: أَكَلْنا, sense: akal, form: 'form:past-1pl'}, {surface: تِرْويقَة, sense: terwi2a}, {surface: طَيّْبِة, sense: tayyeb,
