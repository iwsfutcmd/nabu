          tokens: [{surface: ana, lexeme: ana}, {surface: kent, lexemes: [{lexeme: kan, base: true}, {lexeme: perf-1sg}]}, {surface: bel, lexemes: [{lexeme: b, surface: b, base: true, n: 3, head: 5, rel: case}, {lexeme: el, surface: el, n: 4, head: 5, rel: det}]}, {surface: bet, lexemes: [{lexeme: bet, base: true, n: 5}, {lexeme: sg}]}, {surface: kent, lexemes: [{lexeme: kan, base: true}, {lexeme: perf-1sg}]}, {surface: ta3bane, lexemes: [{lexeme: ta3ban, base: true}, {lexeme: fs}]}]
