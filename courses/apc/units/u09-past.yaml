# Fixture course (apc), unit 9: yesterday. The past tense as form KCs on the verb token: -t (I, and you to
# a man: the same word, so the token says which), the bare stem (he), -et (she), -na (we), -ti (you to a
# woman); kan (was); meals, the market, last week.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
