stories:
- id: apc.story.wedding
  node: apc.party.story
  title: {en: The wedding invitation}
  provenance: {author: 'llm:claude@54fd03d0864d', status: draft}
  characters:
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، مَبْروك عِرْس خَيِّك!
          tokens: [{surface: مايا, sense: maya}, {surface: مَبْروك, sense: mabrouk}, {surface: عِرْس, sense: 3irs}, {surface: خَيِّك, sense: khayy, morphs: [{surface: خَيِّ, kc: 'sense:khayy'}, {surface: ك,
                  kc: 'form:poss-2fs'}]}]
        apc-Latn/arabizi:
          text: Maya, mabrouk 3irs khayyik!
          tokens: [{surface: Maya, sense: maya}, {surface: mabrouk, sense: mabrouk}, {surface: 3irs, sense: 3irs}, {surface: khayyik, sense: khayy, morphs: [{surface: khayy, kc: 'sense:khayy'}, {surface: ik,
                  kc: 'form:poss-2fs'}]}]
      translations: {en: 'Maya, congratulations on your brother''s wedding!'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: الله يْبارِك فيك!
          tokens: [{surface: الله, sense: allah-ybarek}, {surface: يْبارِك, sense: allah-ybarek}, {surface: فيك, sense: allah-ybarek}]
        apc-Latn/arabizi:
          text: allah ybarek fik!
          tokens: [{surface: allah, sense: allah-ybarek}, {surface: ybarek, sense: allah-ybarek}, {surface: fik, sense: allah-ybarek}]
      translations: {en: Thank you!}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: إِمْتى العِرْس؟
          tokens: [{surface: إِمْتى, sense: emta}, {surface: العِرْس, sense: 3irs, morphs: [{surface: ال, kc: 'sense:el'}, {surface: عِرْس, kc: 'sense:3irs'}]}]
        apc-Latn/arabizi:
          text: emta el 3irs?
          tokens: [{surface: emta, sense: emta}, {surface: el, sense: el}, {surface: 3irs, sense: 3irs}]
      translations: {en: 'When''s the wedding?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بْأَيْلول. وبَدّي اِعْزْمَك!
          tokens: [{surface: بْأَيْلول, sense: aylul, morphs: [{surface: بْ, kc: 'sense:b'}, {surface: أَيْلول, kc: 'sense:aylul'}]}, {surface: وبَدّي, sense: baddi, morphs: [{surface: و, kc: 'sense:w'},
                {surface: بَدّي, kc: 'sense:baddi'}]}, {surface: اِعْزْمَك, sense: 3azam, form: 'form:subj-1sg', morphs: [{surface: اِعْزْمَ, kc: 'sense:3azam'}, {surface: ك, kc: 'form:obj-2ms'}]}]
        apc-Latn/arabizi:
          text: b aylul. w baddi e3zmak!
          tokens: [{surface: b, sense: b}, {surface: aylul, sense: aylul}, {surface: w, sense: w}, {surface: baddi, sense: baddi}, {surface: e3zmak, sense: 3azam, form: 'form:subj-1sg', morphs: [{surface: e3zm,
                  kc: 'sense:3azam'}, {surface: ak, kc: 'form:obj-2ms'}]}]
      translations: {en: In September. And I want to invite you!}
  - line:
      speaker: sami
      ask: complete
      gap: sense:hdiyye
      distractors: ['sense:3irs']
      forms:
        apc-Arab/standard:
          text: أَكيد! رَح اِشْتِري هْدِيِّة حِلْوِة.
          tokens: [{surface: أَكيد, sense: akid}, {surface: رَح, sense: ra7.fut}, {surface: اِشْتِري, sense: eshtara, form: 'form:subj-1sg'}, {surface: هْدِيِّة, sense: hdiyye}, {surface: حِلْوِة, sense: 7elo,
              form: 'form:fem'}]
        apc-Latn/arabizi:
          text: akid! ra7 eshtiri hdiyye 7elwe.
          tokens: [{surface: akid, sense: akid}, {surface: ra7, sense: ra7.fut}, {surface: eshtiri, sense: eshtara, form: 'form:subj-1sg'}, {surface: hdiyye, sense: hdiyye}, {surface: 7elwe, sense: 7elo,
              form: 'form:fem'}]
      translations: {en: Of course! I'll buy a nice present.}
  - choose:
      prompt: {en: 'When is the wedding?'}
      options: [{en: In September}, {en: Next week}, {en: In April}]
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بَسّ أَنا خايْفِة شْوَي.
          tokens: [{surface: بَسّ, sense: bas}, {surface: أَنا, sense: ana}, {surface: خايْفِة, sense: khayef, form: 'form:fem'}, {surface: شْوَي, sense: shway}]
        apc-Latn/arabizi:
          text: bas ana khayfe shway.
          tokens: [{surface: bas, sense: bas}, {surface: ana, sense: ana}, {surface: khayfe, sense: khayef, form: 'form:fem'}, {surface: shway, sense: shway}]
      translations: {en: But I'm a bit worried.}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: ليش؟
          tokens: [{surface: ليش, sense: lesh}]
        apc-Latn/arabizi:
          text: lesh?
          tokens: [{surface: lesh, sense: lesh}]
      translations: {en: 'Why?'}
  - line:
      speaker: maya
      ask: arrange
      forms:
        apc-Arab/standard:
          text: لَأَنُّه ما بَعْرِف اُرْقُص!
          tokens: [{surface: لَأَنُّه, sense: la2anno}, {surface: ما, sense: ma}, {surface: بَعْرِف, sense: 3eref, form: 'form:impf-1sg'}, {surface: اُرْقُص, sense: ra2as, form: 'form:subj-1sg'}]
        apc-Latn/arabizi:
          text: la2anno ma ba3ref or2os!
          tokens: [{surface: la2anno, sense: la2anno}, {surface: ma, sense: ma}, {surface: ba3ref, sense: 3eref, form: 'form:impf-1sg'}, {surface: or2os, sense: ra2as, form: 'form:subj-1sg'}]
      translations: {en: Because I don't know how to dance!}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: يا حَرام! ما تْخافي، أَنا كَمان ما بَعْرِف!
          tokens: [{surface: يا, sense: ya-7aram}, {surface: حَرام, sense: ya-7aram}, {surface: ما, sense: ma}, {surface: تْخافي, sense: khayef, form: 'form:subj-2fs'}, {surface: أَنا, sense: ana}, {surface: كَمان,
              sense: kamen}, {surface: ما, sense: ma}, {surface: بَعْرِف, sense: 3eref, form: 'form:impf-1sg'}]
        apc-Latn/arabizi:
          text: ya 7aram! ma tkhafi, ana kamen ma ba3ref!
          tokens: [{surface: ya, sense: ya-7aram}, {surface: 7aram, sense: ya-7aram}, {surface: ma, sense: ma}, {surface: tkhafi, sense: khayef, form: 'form:subj-2fs'}, {surface: ana, sense: ana}, {surface: kamen,
              sense: kamen}, {surface: ma, sense: ma}, {surface: ba3ref, sense: 3eref, form: 'form:impf-1sg'}]
      translations: {en: 'Oh dear! Don''t worry, I don''t know how either!'}
  - choose:
      prompt: {en: 'Why is Maya a bit worried?'}
      options: [{en: She can't dance}, {en: She is sick}, {en: She has no dress}]
      answer: 0
scenarios:
- id: apc.wedding
  after: apc.party.story
  title: {en: At a wedding}
  setting: {en: A Lebanese wedding in a hall in the mountains; the dabke has just started.}
  character: {en: 'Tante Nada, the bride''s aunt, who is delighted to meet you and wants you to dance.'}
  goal: {en: 'Congratulate the family, answer when you are congratulated, say what you like about the wedding (the food, the music, the dress), say how you feel, and politely say no to dancing, or yes.'}
  provenance: {author: 'llm:claude@54fd03d0864d', status: draft}
