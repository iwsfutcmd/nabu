# Fixture course (apc), unit 20: celebrations and feelings. mabrouk and allah ybarek fik, a wedding and a
# present; inviting (3azamni, he invited me; 3azmetna, she invited us) and liking (3ajabni: I liked it,
# literally 'it pleased me'), with the object endings -na and -kon; feelings (za3len, m3asseb, khayef),
# lesh (why) and ya 7aram; exclamations with shu + adjective (shu 7elo!) and lek! (look!).
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapters 7, 17, 28
# (exclamation) and 30 (discourse markers): every sentence awaits a native speaker's review.
id: u20-celebrations
title: {en: Congratulations!}
cefr: A2
kcs:
- {id: 'sense:mabrouk', gloss: {en: congratulations!}, forms: {apc-Arab/standard: [مبروك], apc-Latn/arabizi: [mabrouk]}, notes: {en: 'The answer: allah ybarek fik (fiki to a woman).'}}
- {id: 'sense:allah-ybarek', gloss: {en: thank you (the answer to mabrouk)}, forms: {apc-Arab/standard: [الله يبارك فيك], apc-Latn/arabizi: [allah ybarek fik]}, notes: {en: 'Literally ''God bless you''.
      To a woman: allah ybarek fiki; to several people: allah ybarek fikon.'}}
- {id: 'sense:3irs', gloss: {en: wedding}, forms: {apc-Arab/standard: [عرس], apc-Latn/arabizi: [3irs]}}
- {id: 'sense:hdiyye', gloss: {en: present; gift}, forms: {apc-Arab/standard: [هديّة], apc-Latn/arabizi: [hdiyye]}}
- {id: 'sense:3azam', gloss: {en: invite}, forms: {apc-Arab/standard: [عزم], apc-Latn/arabizi: [3azam]}, notes: {en: '3azamni: he invited me; 3azmetna: she invited us.'}}
- {id: 'form:obj-1pl', gloss: {en: '-na: us (on a verb)'}, notes: {en: '3azmetna: she invited us. Arabic script: نا (عزمتنا). The same ending as ''our''.'}}
- {id: 'sense:3ajab', gloss: {en: 'please (3ajabni: I liked it)'}, forms: {apc-Arab/standard: [عجب], apc-Latn/arabizi: [3ajab]}, notes: {en: 'The thing liked is the subject: 3ajabni el fostan, I liked the
      dress (the dress pleased me); 3ajabetni el 7afle, I liked the party.'}}
- {id: 'form:obj-2pl', gloss: {en: '-kon: you (on a verb, to several people)'}, notes: {en: '3ajabetkon? Did you like it? Arabic script: كن.'}}
- {id: 'sense:za3len', gloss: {en: upset; sad; cross}, forms: {apc-Arab/standard: [زعلان], apc-Latn/arabizi: [za3len]}, notes: {en: 'A woman: زعلانة, za3lene.'}}
- {id: 'sense:lesh', gloss: {en: why}, forms: {apc-Arab/standard: [ليش], apc-Latn/arabizi: [lesh]}, notes: {en: Also le (ليه).}}
- {id: 'sense:m3asseb', gloss: {en: angry; annoyed}, forms: {apc-Arab/standard: [معصّب], apc-Latn/arabizi: [m3asseb]}, notes: {en: 'A woman: معصّبة, m3assbe.'}}
- {id: 'sense:khayef', gloss: {en: afraid; scared; worried}, forms: {apc-Arab/standard: [خايف], apc-Latn/arabizi: [khayef]}, notes: {en: 'A woman: خايفة, khayfe. ma tkhaf!: don''t be afraid (to a woman:
      ma tkhafi!).'}}
- {id: 'sense:ya-7aram', gloss: {en: what a pity!; poor thing!}, forms: {apc-Arab/standard: [يا حرام], apc-Latn/arabizi: [ya 7aram]}}
- {id: 'construction:shu-excl', gloss: {en: 'shu + adjective: how …!'}, notes: {en: 'shu 7elo!: how nice!; shu 7elwe hal hdiyye!: what a lovely present! The adjective agrees with what it describes.'}}
- {id: 'sense:lek', gloss: {en: look!; hey (to a man)}, forms: {apc-Arab/standard: [ليك], apc-Latn/arabizi: [lek]}, notes: {en: 'To draw attention: to a woman leke (ليكي), to several people leko (ليكو).'}}
nodes:
- {id: apc.party.congrats, kind: lesson, introduces: ['sense:mabrouk', 'sense:allah-ybarek', 'sense:3irs', 'sense:hdiyye']}
- {id: apc.party.invite, kind: lesson, introduces: ['sense:3azam', 'form:obj-1pl', 'sense:3ajab', 'form:obj-2pl']}
- {id: apc.party.feelings, kind: lesson, introduces: ['sense:za3len', 'sense:lesh', 'sense:m3asseb', 'sense:khayef', 'sense:ya-7aram']}
- {id: apc.party.how, kind: lesson, introduces: ['construction:shu-excl', 'sense:lek']}
- {id: apc.party.story, kind: story}
