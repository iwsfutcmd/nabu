stories:
- id: apc.story.wedding
  node: apc.party.story
  title:
    en: The wedding invitation
  provenance:
    author: llm:claude@54fd03d0864d
    status: draft
  characters:
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مايا، مَبْروك عِرِس خَيِّك!
          tokens: [{surface: مايا, lexeme: maya}, {surface: مَبْروك, lexeme: mabrouk}, {surface: عِرِس, lexemes: [{lexeme: 3irs, base: true}, {lexeme: sg}]}, {surface: خَيِّك, lexemes: [{lexeme: khayy, surface: خَيِّ, base: true}, {lexeme: sg}, {lexeme: poss-2fs, surface: ك}]}]
        apc-Latn/arabizi:
          text: Maya, mabrouk 3irs khayyik!
          tokens: [{surface: Maya, lexeme: maya}, {surface: mabrouk, lexeme: mabrouk}, {surface: 3irs, lexemes: [{lexeme: 3irs, base: true}, {lexeme: sg}]}, {surface: khayyik, lexemes: [{lexeme: khayy, surface: khayy, base: true}, {lexeme: sg}, {lexeme: poss-2fs, surface: ik}]}]
      translations:
        en: Maya, congratulations on your brother's wedding!
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: الله يْبارِك فيك!
          tokens: [{surface: الله, lexeme: allah-ybarek}, {surface: يْبارِك, lexeme: allah-ybarek}, {surface: فيك, lexeme: allah-ybarek}]
        apc-Latn/arabizi:
          text: allah ybarek fik!
          tokens: [{surface: allah, lexeme: allah-ybarek}, {surface: ybarek, lexeme: allah-ybarek}, {surface: fik, lexeme: allah-ybarek}]
      translations:
        en: Thank you!
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: إِمْتى العِرِس؟
          tokens: [{surface: إِمْتى, lexeme: emta}, {surface: العِرِس, lexemes: [{lexeme: el, surface: ال, n: 2, head: 3, rel: det}, {lexeme: 3irs, surface: عِرِس, base: true, n: 3}, {lexeme: sg}]}]
        apc-Latn/arabizi:
          text: emta el 3irs?
          tokens: [{surface: emta, lexeme: emta}, {surface: el, lexeme: el, n: 2, head: 3, rel: det}, {surface: 3irs, lexemes: [{lexeme: 3irs, base: true, n: 3}, {lexeme: sg}]}]
      translations:
        en: When's the wedding?
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: بْأَيْلول. وبَدّي اَعْزْمَك!
          tokens: [{surface: بْأَيْلول, lexemes: [{lexeme: b, surface: بْ, n: 1, head: 2, rel: case}, {lexeme: aylul, surface: أَيْلول, base: true, n: 2}]}, {surface: وبَدّي, lexemes: [{lexeme: w, surface: و}, {lexeme: badd, surface: بَدّ, base: true}, {lexeme: poss-1sg, surface: ي}]}, {surface: اَعْزْمَك, lexemes: [{lexeme: sub}, {lexeme: impf-1sg}, {lexeme: 3azam, surface: اَعْزْمَ, base: true}, {lexeme: obj-2ms, surface: ك}]}]
