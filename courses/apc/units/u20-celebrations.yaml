scenarios:
- id: apc.wedding
  after: apc.party.story
  title:
    en: At a wedding
  setting:
    en: A Lebanese wedding in a hall in the mountains; the dabke has just started.
  character:
    en: Tante Nada, the bride's aunt, who is delighted to meet you and wants you to dance.
  goal:
    en: Congratulate the family, answer when you are congratulated, say what you like about the wedding (the food, the music, the dress), say how you feel, and politely say no to dancing, or yes.
  provenance:
    author: llm:claude@54fd03d0864d
    status: draft
