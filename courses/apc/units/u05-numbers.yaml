stories:
- id: apc.story.dekkene
  node: apc.num.story
  title: {en: At the corner shop}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
  characters:
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: abu-ali, speaker: m, name: {apc-Arab/standard: أبو علي, apc-Latn/arabizi: Abu Ali}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَرْحَبا! في خِبِز؟
          tokens: [{surface: مَرْحَبا, sense: marhaba}, {surface: في, sense: fi}, {surface: خِبِز, sense: khebz}]
        apc-Latn/arabizi:
          text: mar7aba! fi khebz?
          tokens: [{surface: mar7aba, sense: marhaba}, {surface: fi, sense: fi}, {surface: khebz, sense: khebz}]
      translations: {en: 'Hello! Is there any bread?'}
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: إيه، تْفَضَّل.
          tokens: [{surface: إيه, sense: eh}, {surface: تْفَضَّل, sense: tfaddal}]
        apc-Latn/arabizi:
          text: eh, tfaddal.
          tokens: [{surface: eh, sense: eh}, {surface: tfaddal, sense: tfaddal}]
      translations: {en: 'Yes, here you go.'}
  - line:
      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: وبَدّي جِبْنِة ولَبَن.
          tokens: [{surface: وبَدّي, sense: baddi, morphs: [{surface: و, kc: 'sense:w'}, {surface: بَدّي, kc: 'sense:baddi'}]}, {surface: جِبْنِة, sense: jebne}, {surface: ولَبَن, sense: laban, morphs: [
                {surface: و, kc: 'sense:w'}, {surface: لَبَن, kc: 'sense:laban'}]}]
        apc-Latn/arabizi:
          text: w baddi jebne w laban.
          tokens: [{surface: w, sense: w}, {surface: baddi, sense: baddi}, {surface: jebne, sense: jebne}, {surface: w, sense: w}, {surface: laban, sense: laban}]
      translations: {en: And I want cheese and yogurt.}
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: بَدَّك كَمان؟
          tokens: [{surface: بَدَّك, sense: baddak}, {surface: كَمان, sense: kamen}]
        apc-Latn/arabizi:
          text: baddak kamen?
          tokens: [{surface: baddak, sense: baddak}, {surface: kamen, sense: kamen}]
      translations: {en: 'Do you want anything else?'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: لأ، شُكْرا. قَدّيش؟
          tokens: [{surface: لأ, sense: la2}, {surface: شُكْرا, sense: shukran}, {surface: قَدّيش, sense: 2addesh}]
        apc-Latn/arabizi:
          text: la2, shukran. 2addesh?
          tokens: [{surface: la2, sense: la2}, {surface: shukran, sense: shukran}, {surface: 2addesh, sense: 2addesh}]
      translations: {en: 'No, thanks. How much?'}
  - line:
      speaker: abu-ali
      ask: complete
      gap: sense:3eshrin
      distractors: ['sense:khamsin', 'sense:miyye']
      forms:
        apc-Arab/standard:
          text: عِشْرين دولار.
          tokens: [{surface: عِشْرين, sense: 3eshrin}, {surface: دولار, sense: dollar}]
        apc-Latn/arabizi:
          text: 3eshrin dollar.
          tokens: [{surface: 3eshrin, sense: 3eshrin}, {surface: dollar, sense: dollar}]
      translations: {en: Twenty dollars.}
  - choose:
      prompt:
        en: What price does Abu Ali ask for?
      options: [{en: Twenty dollars}, {en: Ten dollars}, {en: Fifty thousand lira}]
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: غالي كْتير!
          tokens: [{surface: غالي, sense: ghali}, {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: ghali ktir!
          tokens: [{surface: ghali, sense: ghali}, {surface: ktir, sense: ktir}]
      translations: {en: That's very expensive!}
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: لأ، مِش غالي! الجِبْنِة طَيّْبِة كْتير.
          tokens: [{surface: لأ, sense: la2}, {surface: مِش, sense: mish}, {surface: غالي, sense: ghali}, {surface: الجِبْنِة, sense: jebne, morphs: [{surface: ال, kc: 'sense:el'}, {surface: جِبْنِة, kc: 'sense:jebne'}]},
            {surface: طَيّْبِة, sense: tayyeb, form: 'form:fem'}, {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: la2, mish ghali! el jebne tayybe ktir.
          tokens: [{surface: la2, sense: la2}, {surface: mish, sense: mish}, {surface: ghali, sense: ghali}, {surface: el, sense: el}, {surface: jebne, sense: jebne}, {surface: tayybe, sense: tayyeb, form: 'form:fem'},
            {surface: ktir, sense: ktir}]
      translations: {en: 'No, it''s not expensive! The cheese is very good.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَعي بَسّ عَشْرَة دولار.
          tokens: [{surface: مَعي, sense: ma3, morphs: [{surface: مَع, kc: 'sense:ma3'}, {surface: ي, kc: 'form:poss-1sg'}]}, {surface: بَسّ, sense: bas}, {surface: عَشْرَة, sense: 3ashra}, {surface: دولار,
              sense: dollar}]
        apc-Latn/arabizi:
          text: ma3i bas 3ashra dollar.
          tokens: [{surface: ma3i, sense: ma3, morphs: [{surface: ma3, kc: 'sense:ma3'}, {surface: i, kc: 'form:poss-1sg'}]}, {surface: bas, sense: bas}, {surface: 3ashra, sense: 3ashra}, {surface: dollar,
              sense: dollar}]
      translations: {en: I only have ten dollars on me.}
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: يَلّا، عَشْرَة دولار، بَسّ الخِبِز والجِبْنِة.
          tokens: [{surface: يَلّا, sense: yalla}, {surface: عَشْرَة, sense: 3ashra}, {surface: دولار, sense: dollar}, {surface: بَسّ, sense: bas}, {surface: الخِبِز, sense: khebz, morphs: [{surface: ال,
                  kc: 'sense:el'}, {surface: خِبِز, kc: 'sense:khebz'}]}, {surface: والجِبْنِة, sense: jebne, morphs: [{surface: و, kc: 'sense:w'}, {surface: ال, kc: 'sense:el'}, {surface: جِبْنِة, kc: 'sense:jebne'}]}]
        apc-Latn/arabizi:
          text: yalla, 3ashra dollar, bas el khebz w el jebne.
          tokens: [{surface: yalla, sense: yalla}, {surface: 3ashra, sense: 3ashra}, {surface: dollar, sense: dollar}, {surface: bas, sense: bas}, {surface: el, sense: el}, {surface: khebz, sense: khebz}, {
              surface: w, sense: w}, {surface: el, sense: el}, {surface: jebne, sense: jebne}]
      translations: {en: 'OK, ten dollars, but just the bread and the cheese.'}
  - choose:
      prompt:
        en: What does Sami buy in the end?
      options: [{en: Bread and cheese}, {en: 'Bread, cheese and yogurt'}, {en: Only yogurt}]
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: ميرسي! مَع السَّلامِة!
          tokens: [{surface: ميرسي, sense: merci}, {surface: مَع, sense: ma3-essalame}, {surface: السَّلامِة, sense: ma3-essalame}]
        apc-Latn/arabizi:
          text: merci! ma3 essalame!
          tokens: [{surface: merci, sense: merci}, {surface: ma3, sense: ma3-essalame}, {surface: essalame, sense: ma3-essalame}]
      translations: {en: Thanks! Bye!}
scenarios:
- id: apc.dekkene
  after: apc.num.story
  title: {en: At the corner shop}
  setting: {en: 'A small dekkene (corner shop) in a Beirut neighbourhood in the morning. Prices are in dollars, or in lira by the thousand.'}
  character: {en: 'Abu Ali, the shopkeeper: friendly, chatty, and happy to haggle a little.'}
  goal: {en: 'Ask whether there is bread, cheese or water, say what you want and how many, ask how much it costs, and pay in lira or dollars.'}
  provenance: {author: 'llm:claude@6914f241714e', status: draft}
