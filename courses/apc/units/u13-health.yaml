stories:
- id: apc.story.sick-day
  node: apc.health.story
  title: {en: A sick day}
  provenance: {author: 'llm:claude@a92756874d1e', status: draft}
  characters:
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَرْحَبا مايا، كيفِك؟
          tokens: [{surface: مَرْحَبا, sense: marhaba}, {surface: مايا, sense: maya}, {surface: كيفِك, sense: kif, morphs: [{surface: كيفِ, kc: 'sense:kif'}, {surface: ك, kc: 'form:poss-2fs'}]}]
        apc-Latn/arabizi:
          text: mar7aba Maya, kifik?
          tokens: [{surface: mar7aba, sense: marhaba}, {surface: Maya, sense: maya}, {surface: kifik, sense: kif, morphs: [{surface: kif, kc: 'sense:kif'}, {surface: ik, kc: 'form:poss-2fs'}]}]
      translations: {en: 'Hi Maya, how are you?'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: مِش مْنيحَة، أَنا مْريضَة.
          tokens: [{surface: مِش, sense: mish}, {surface: مْنيحَة, sense: mni7, form: 'form:fem'}, {surface: أَنا, sense: ana}, {surface: مْريضَة, sense: mrid, form: 'form:fem'}]
        apc-Latn/arabizi:
          text: mish mni7a, ana mrida.
          tokens: [{surface: mish, sense: mish}, {surface: mni7a, sense: mni7, form: 'form:fem'}, {surface: ana, sense: ana}, {surface: mrida, sense: mrid, form: 'form:fem'}]
      translations: {en: 'Not good, I''m sick.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: شو بِكي؟
          tokens: [{surface: شو, sense: shu-bak}, {surface: بِكي, sense: shu-bak, form: 'form:poss-2fs'}]
        apc-Latn/arabizi:
          text: shu biki?
          tokens: [{surface: shu, sense: shu-bak}, {surface: biki, sense: shu-bak, form: 'form:poss-2fs'}]
      translations: {en: 'What''s wrong?'}
  - line:
      speaker: maya
      ask: complete
      gap: sense:ras
      distractors: ['sense:batn']
      forms:
        apc-Arab/standard:
          text: مَعي وْجَع راس، وما فِيّي نام.
          tokens: [{surface: مَعي, sense: ma3, morphs: [{surface: مَع, kc: 'sense:ma3'}, {surface: ي, kc: 'form:poss-1sg'}]}, {surface: وْجَع, sense: wja3}, {surface: راس, sense: ras}, {surface: وما, sense: ma,
              morphs: [{surface: و, kc: 'sense:w'}, {surface: ما, kc: 'sense:ma'}]}, {surface: فِيّي, sense: fi.can, morphs: [{surface: فِيّ, kc: 'sense:fi.can'}, {surface: ي, kc: 'form:poss-1sg'}]}, {
              surface: نام, sense: nem, form: 'form:subj-1sg'}]
        apc-Latn/arabizi:
          text: ma3i wja3 ras, w ma fiyyi nem.
          tokens: [{surface: ma3i, sense: ma3, morphs: [{surface: ma3, kc: 'sense:ma3'}, {surface: i, kc: 'form:poss-1sg'}]}, {surface: wja3, sense: wja3}, {surface: ras, sense: ras}, {surface: w, sense: w},
            {surface: ma, sense: ma}, {surface: fiyyi, sense: fi.can, morphs: [{surface: fiyy, kc: 'sense:fi.can'}, {surface: i, kc: 'form:poss-1sg'}]}, {surface: nem, sense: nem, form: 'form:subj-1sg'}]
      translations: {en: 'I have a headache, and I can''t sleep.'}
  - choose:
      prompt: {en: 'What''s wrong with Maya?'}
      options: [{en: She has a headache}, {en: She has a stomach ache}, {en: She's hungry}]
      answer: 0
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: لازِم تْروحي عَالحَكيم!
          tokens: [{surface: لازِم, sense: lezem}, {surface: تْروحي, sense: ra7, form: 'form:subj-2fs'}, {surface: عَالحَكيم, sense: 7akim, morphs: [{surface: عَ, kc: 'sense:3a'}, {surface: ال, kc: 'sense:el'},
                {surface: حَكيم, kc: 'sense:7akim'}]}]
        apc-Latn/arabizi:
          text: lezem tru7i 3al 7akim!
          tokens: [{surface: lezem, sense: lezem}, {surface: tru7i, sense: ra7, form: 'form:subj-2fs'}, {surface: 3al, sense: 3a, morphs: [{surface: 3a, kc: 'sense:3a'}, {surface: l, kc: 'sense:el'}]},
            {surface: 7akim, sense: 7akim}]
      translations: {en: You have to go to the doctor!}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: ما فِيّي، أَنا مَشْغولِة كْتير.
          tokens: [{surface: ما, sense: ma}, {surface: فِيّي, sense: fi.can, morphs: [{surface: فِيّ, kc: 'sense:fi.can'}, {surface: ي, kc: 'form:poss-1sg'}]}, {surface: أَنا, sense: ana}, {surface: مَشْغولِة,
              sense: mashghoul, form: 'form:fem'}, {surface: كْتير, sense: ktir}]
        apc-Latn/arabizi:
          text: ma fiyyi, ana mashghoule ktir.
          tokens: [{surface: ma, sense: ma}, {surface: fiyyi, sense: fi.can, morphs: [{surface: fiyy, kc: 'sense:fi.can'}, {surface: i, kc: 'form:poss-1sg'}]}, {surface: ana, sense: ana}, {surface: mashghoule,
              sense: mashghoul, form: 'form:fem'}, {surface: ktir, sense: ktir}]
      translations: {en: 'I can''t, I''m very busy.'}
  - line:
      speaker: sami
      ask: arrange
      forms:
        apc-Arab/standard:
          text: لَأ، لازِم تِرْتاحي اليوم.
          tokens: [{surface: لَأ, sense: la2}, {surface: لازِم, sense: lezem}, {surface: تِرْتاحي, sense: rte7, form: 'form:subj-2fs'}, {surface: اليوم, sense: yom, morphs: [{surface: ال, kc: 'sense:el'},
                {surface: يوم, kc: 'sense:yom'}]}]
        apc-Latn/arabizi:
          text: la2, lezem tirte7i el yom.
          tokens: [{surface: la2, sense: la2}, {surface: lezem, sense: lezem}, {surface: tirte7i, sense: rte7, form: 'form:subj-2fs'}, {surface: el, sense: el}, {surface: yom, sense: yom}]
      translations: {en: 'No, you have to rest today.'}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: خَلَص، رَح نام شْوَي.
          tokens: [{surface: خَلَص, sense: khalas}, {surface: رَح, sense: ra7.fut}, {surface: نام, sense: nem, form: 'form:subj-1sg'}, {surface: شْوَي, sense: shway}]
        apc-Latn/arabizi:
          text: khalas, ra7 nem shway.
          tokens: [{surface: khalas, sense: khalas}, {surface: ra7, sense: ra7.fut}, {surface: nem, sense: nem, form: 'form:subj-1sg'}, {surface: shway, sense: shway}]
      translations: {en: 'OK then, I''ll sleep for a bit.'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: سَلامْتِك! بُكْرا أَحْسَن، إِن شاء الله.
          tokens: [{surface: سَلامْتِك, sense: salemtak, form: 'form:poss-2fs'}, {surface: بُكْرا, sense: bukra}, {surface: أَحْسَن, sense: a7san}, {surface: إِن, sense: inshalla}, {surface: شاء, sense: inshalla},
            {surface: الله, sense: inshalla}]
        apc-Latn/arabizi:
          text: salemtik! bukra a7san, inshalla.
          tokens: [{surface: salemtik, sense: salemtak, form: 'form:poss-2fs'}, {surface: bukra, sense: bukra}, {surface: a7san, sense: a7san}, {surface: inshalla, sense: inshalla}]
      translations: {en: 'Get well soon! Tomorrow will be better, hopefully.'}
  - choose:
      prompt: {en: 'What does Maya decide to do?'}
      options: [{en: Sleep for a bit}, {en: Go to the doctor}, {en: Go to work}]
      answer: 0
scenarios:
- id: apc.pharmacy
  after: apc.health.story
  title: {en: At the pharmacy}
  setting: {en: 'A small pharmacy in Hamra, Beirut, in the evening.'}
  character: {en: 'The pharmacist, calm and careful, who asks what is wrong before giving anything.'}
  goal: {en: 'Say what is wrong (a headache, a stomach ache, you can''t sleep), answer the pharmacist''s questions, ask what you must and mustn''t do, and thank them.'}
  provenance: {author: 'llm:claude@a92756874d1e', status: draft}
