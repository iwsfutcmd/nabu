# Fixture course (apc), unit 13: can and must. fi- with the possessive endings (fiyyi, fik, fiki, fiya,
# fina, fikon: I can, you can…), lezem + a verb without b- (lezem ru7: I have to go; ma lezem: you shouldn't),
# being ill (mrid, ma3i wja3 ras, shu bak?), the doctor, medicine, resting and salemtak.
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapter 15 (fi,
# badd-, lezem) and chapter 3 (a7san): every sentence awaits a native speaker's review.
id: u13-health
title: {en: I don't feel well}
cefr: A2
kcs:
- {id: 'sense:mrid', gloss: {en: sick; ill}, forms: {apc-Arab/standard: [مريض], apc-Latn/arabizi: [mrid]}, notes: {en: 'A woman: مريضة, mrida.'}}
- {id: 'sense:shu-bak', gloss: {en: 'what''s wrong? (to a man)'}, forms: {apc-Arab/standard: [شو بك], apc-Latn/arabizi: [shu bak]}, notes: {en: 'Literally ''what is in you?''. To a woman: شو بكي, shu biki;
      to several people: شو بكن, shu bkon.'}}
- {id: 'sense:ras', gloss: {en: head}, forms: {apc-Arab/standard: [راس], apc-Latn/arabizi: [ras]}}
- {id: 'sense:wja3', gloss: {en: pain; ache}, forms: {apc-Arab/standard: [وجع], apc-Latn/arabizi: [wja3]}, notes: {en: 'ma3i wja3 ras: I have a headache (ma3, as for what you have on you right now).'}}
- {id: 'sense:batn', gloss: {en: stomach; belly}, forms: {apc-Arab/standard: [بطن], apc-Latn/arabizi: [batn]}}
- {id: 'sense:fi.can', gloss: {en: 'can (with an ending: fiyyi, fik…)'}, forms: {apc-Arab/standard: [في], apc-Latn/arabizi: [fi]}, notes: {en: 'fi + the possessive ending says who can: fiyyi (I, also fini),
      fik (you, to a man), fiki (to a woman), fih (he), fiya (she), fina (we), fikon (you, several), fiyon (they). The verb after it has no b-: ma fiyyi nem, I can''t sleep. Without an ending, في is ''there
      is''.'}}
- {id: 'sense:a7san', gloss: {en: better; best}, forms: {apc-Arab/standard: [أحسن], apc-Latn/arabizi: [a7san]}}
- {id: 'sense:lezem', gloss: {en: must; have to; should}, forms: {apc-Arab/standard: [لازم], apc-Latn/arabizi: [lezem]}, notes: {en: 'lezem + a verb without b-: lezem ru7, I have to go. ma lezem: you shouldn''t;
      lezem ma: you must not (Kline 2022).'}}
- {id: 'sense:rte7', gloss: {en: rest}, forms: {apc-Arab/standard: [ارتاح], apc-Latn/arabizi: [rte7]}, notes: {en: 'lezem tirte7: you should rest (to a woman: tirte7i).'}}
- {id: 'sense:7akim', gloss: {en: doctor}, forms: {apc-Arab/standard: [حكيم], apc-Latn/arabizi: [7akim]}, notes: {en: 'Also دكتور, doktor.'}}
- {id: 'sense:dawa', gloss: {en: medicine}, forms: {apc-Arab/standard: [دوا], apc-Latn/arabizi: [dawa]}}
- {id: 'sense:salemtak', gloss: {en: get well soon (to a man)}, forms: {apc-Arab/standard: [سلامتك], apc-Latn/arabizi: [salemtak]}, notes: {en: 'Literally ''your safety''. To a woman: salemtik; to several
      people: salemetkon.'}}
nodes:
