# Fixture course (apc), unit 27: ken's sisters and verbs of phase (Kline, chapters 10 and 15). dall for staying and
# keeping on (dall 3am yedros kell el lel; lezem ndall bel bet), sar 3am for starting to (sar 3am yeshteghel),
# ballash and khallas (start, finish), rje3 with a verb for doing it again (rje3et 2aret el ktab), ma 3ad for no
# longer (ma 3ad seken hon), and tele3 for turning out (tele3 el mat3am msakkar). Drafted by an LLM (provenance
# llm:…, status draft) and checked against Kline (2022), chapters 10 and 15: every sentence awaits a native speaker's
# review.
id: u27-keep-going
title:
  en: Keep going
cefr: B1
nodes:
- {id: apc.keep.stay, kind: lesson, introduces: ['lexeme:dall']}
- {id: apc.keep.start, kind: lesson, introduces: ['lexeme:ballash']}
- {id: apc.keep.finish, kind: lesson, introduces: ['lexeme:khallas']}
- {id: apc.keep.again, kind: lesson}
- {id: apc.keep.no-longer, kind: lesson}
- {id: apc.keep.story, kind: story}
