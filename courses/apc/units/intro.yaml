- id: s.4
  node: apc.greetings
  register: colloquial
  forms:
    apc-Arab/standard:
      text: مع السلامة!
      tokens: [&id001 {surface: مع, sense: ma3-essalame}, &id002 {surface: السلامة, sense: ma3-essalame}]
      reverse: مع السلامة
    apc-Latn/arabizi:
      text: ma3 essalame!
      tokens: [&id003 {surface: ma3, sense: ma3-essalame}, &id004 {surface: essalame, sense: ma3-essalame}]
      reverse: (ma3|ma3a) (essalame|el salame|salame|essaleme|el saleme|saleme)
  translations:
    en: |-
      Goodbye!
      Bye!
- id: s.5
  node: apc.greetings
  register: colloquial
  forms:
    apc-Arab/standard:
      text: يلّا، مع السلامة!
      tokens: [{surface: يلّا, sense: yalla}, *id001, *id002]
      reverse: (يلّا|يلا) مع السلامة
    apc-Latn/arabizi:
      text: yalla, ma3 essalame!
      tokens: [{surface: yalla, sense: yalla}, *id003, *id004]
      reverse: (yalla|yala|yallah) (ma3|ma3a) (essalame|el salame|salame|essaleme|el saleme|saleme)
  translations:
    en: |-
      OK, (bye|goodbye)!
      (Okay|Right|Alright|All right|Well), (bye|goodbye)!
      (OK|Okay|Right|Well) then, (bye|goodbye)!
- id: s.6
  node: apc.how-are-you
  register: colloquial
  forms:
    apc-Arab/standard:
      text: كيفك؟
      tokens: [{surface: كيفك, sense: kifak, vocalized: كيفَك}]
      reverse: كيفك
    apc-Latn/arabizi:
      text: kifak?
      tokens: [{surface: kifak, sense: kifak}]
      reverse: (kifak|keefak|kifik|keefik|kifek)
  translations:
    en: |-
      How are you?
      How are you doing?
      How's it going?
- id: s.7
  node: apc.how-are-you
  register: colloquial
  forms:
    apc-Arab/standard:
      text: منيح!
      tokens: [{surface: منيح, sense: mni7}]
      reverse: منيح
    apc-Latn/arabizi:
      text: mni7!
      tokens: [{surface: mni7, sense: mni7}]
      reverse: (mni7|mnih|mnee7)
  translations:
    en: |-
      Fine!
      Good!
      Well!
      I('m| am) (fine|good|well)!
- id: s.8
  node: apc.how-are-you
  register: colloquial
  forms:
    apc-Arab/standard:
      text: منيح، الحمدلله.
      tokens: [{surface: منيح, sense: mni7}, {surface: الحمدلله, sense: el7amdella}]
      reverse: منيح (الحمدلله|الحمد لله)
    apc-Latn/arabizi:
      text: mni7, el7amdella.
      tokens: [{surface: mni7, sense: mni7}, {surface: el7amdella, sense: el7amdella}]
      reverse: (mni7|mnih|mnee7) (el7amdella|l7amdella|el7amdellah|7amdella|el7amdulillah|al7amdulillah|alhamdulillah|elhamdella)
  translations:
    en: |-
      (Fine|Good|Well), thank (God|goodness).
      (Fine|Good|Well), praise (God|be to God).
      I('m| am) (fine|good|well), thank (God|goodness).
- id: s.9
  node: apc.how-are-you
  register: colloquial
  forms:
    apc-Arab/standard:
      text: أنا منيح.
      tokens: [{surface: أنا, sense: ana}, {surface: منيح, sense: mni7}]
      reverse: '[أنا] منيح'
    apc-Latn/arabizi:
      text: ana mni7.
      tokens: [{surface: ana, sense: ana}, {surface: mni7, sense: mni7}]
      reverse: '[ana] (mni7|mnih|mnee7)'
  translations:
    en: |-
      I('m| am) (fine|good|well).
      I('m| am) doing (fine|good|well).
- id: s.10
