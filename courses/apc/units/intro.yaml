- id: s.24
  node: apc.cafe
  register: colloquial
  forms:
    apc-Arab/standard:
      text: بدّي شاي، شكرا.
      tokens: [{surface: بدّي, sense: baddi}, {surface: شاي, sense: shay}, {surface: شكرا, sense: shukran}]
