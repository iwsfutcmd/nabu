# Fixture course (apc): North Levantine Arabic (Beirut speech). Learners pick Arabic script or Arabizi; a script-convert node teaches 7, 3 and 2.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: intro
title: {en: 'Hi! Coffee or tea?'}
cefr: A1
kcs:
- {id: 'sense:marhaba', gloss: {en: hello}, forms: {apc-Arab/standard: [مرحبا], apc-Latn/arabizi: [mar7aba]}, image: {file: ../images/wave.svg, license: CC0-1.0, provenance: {author: 'llm:claude@17fb3acb2f3b', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:shukran', gloss: {en: thank you}, forms: {apc-Arab/standard: [شكرا], apc-Latn/arabizi: [shukran]}}
- {id: 'sense:merci', gloss: {en: thanks (from French)}, forms: {apc-Arab/standard: [ميرسي], apc-Latn/arabizi: [merci]}}
- {id: 'sense:ma3-essalame', gloss: {en: goodbye (literally 'with safety')}, forms: {apc-Arab/standard: [مع السلامة], apc-Latn/arabizi: [ma3 essalame]}}
- {id: 'sense:yalla', gloss: {en: come on; OK then; let's go}, forms: {apc-Arab/standard: [يلّا], apc-Latn/arabizi: [yalla]}}
- {id: 'sense:kifak', gloss: {en: 'how are you?'}, forms: {apc-Arab/standard: [كيفك], apc-Latn/arabizi: [kifak]}, notes: {en: 'Said to a man; to a woman: كيفك, kifik.'}}
- {id: 'sense:mni7', gloss: {en: good; fine}, forms: {apc-Arab/standard: [منيح], apc-Latn/arabizi: [mni7]}, image: {file: ../images/smile.svg, license: CC0-1.0, provenance: {author: 'llm:claude@d6c9379209cc', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:el7amdella', gloss: {en: thank God}, forms: {apc-Arab/standard: [الحمدلله], apc-Latn/arabizi: [el7amdella]}}
- {id: 'sense:ana', gloss: {en: I}, forms: {apc-Arab/standard: [أنا], apc-Latn/arabizi: [ana]}}
- {id: 'sense:enta', gloss: {en: you}, forms: {apc-Arab/standard: [إنت, وإنت], apc-Latn/arabizi: [enta]}, notes: {en: 'Said to a man; to a woman: إنتي, enti.'}}
- {id: 'sense:w', gloss: {en: and}, forms: {apc-Latn/arabizi: [w]}, notes: {en: 'Written joined to the next word in Arabic script: وإنت.'}}
- {id: 'sense:sami', gloss: {en: Sami (a name)}, forms: {apc-Arab/standard: [سامي], apc-Latn/arabizi: [Sami]}}
- {id: 'sense:shu', gloss: {en: what}, forms: {apc-Arab/standard: [شو], apc-Latn/arabizi: [shu]}}
- {id: 'sense:esmak', gloss: {en: your name}, forms: {apc-Arab/standard: [اسمك], apc-Latn/arabizi: [esmak]}, notes: {en: 'Said to a man; to a woman: اسمِك, esmik.'}}
- {id: 'sense:esmi', gloss: {en: my name}, forms: {apc-Arab/standard: [اسمي], apc-Latn/arabizi: [esmi]}}
- {id: 'sense:ahwe', gloss: {en: coffee}, forms: {apc-Arab/standard: [قهوة], apc-Latn/arabizi: [ahwe]}, image: {file: ../images/coffee.svg, license: CC0-1.0, provenance: {author: 'llm:claude@0b7ee10fe47d', status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'ق is a glottal stop in Beirut speech: ahwe, also written 2ahwe.'}}
- {id: 'sense:shay', gloss: {en: tea}, forms: {apc-Arab/standard: [شاي], apc-Latn/arabizi: [shay]}, image: {file: ../images/tea.svg, license: CC0-1.0, provenance: {author: 'llm:claude@3715ffdb2952', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:baddi', gloss: {en: I want}, forms: {apc-Arab/standard: [بدّي], apc-Latn/arabizi: [baddi]}}
- {id: 'sense:baddak', gloss: {en: you want}, forms: {apc-Arab/standard: [بدّك], apc-Latn/arabizi: [baddak]}, notes: {en: 'Said to a man; to a woman: بدِّك, baddik.'}}
- {id: 'sense:la2', gloss: {en: 'no'}, forms: {apc-Arab/standard: [لأ], apc-Latn/arabizi: [la2]}}
- {id: 'sense:eh', gloss: {en: 'yes'}, forms: {apc-Arab/standard: [إيه], apc-Latn/arabizi: [eh]}}
- {id: 'grapheme:7', gloss: {en: Arabizi 7 for ح}, notes: {en: 'mni7 منيح, mar7aba مرحبا'}}
- {id: 'grapheme:3', gloss: {en: Arabizi 3 for ع}, notes: {en: ma3 مع}}
- {id: 'grapheme:2', gloss: {en: 'Arabizi 2 for the glottal stop (ء, or ق in Beirut speech)'}, notes: {en: 'la2 لأ, 2ahwe قهوة'}}
nodes:
- {id: apc.greetings, kind: lesson, introduces: ['sense:marhaba', 'sense:shukran', 'sense:merci', 'sense:ma3-essalame', 'sense:yalla']}
- {id: apc.how-are-you, kind: lesson, introduces: ['sense:kifak', 'sense:mni7', 'sense:el7amdella', 'sense:ana', 'sense:enta', 'sense:w']}
- {id: apc.names, kind: lesson, introduces: ['sense:sami', 'sense:shu', 'sense:esmak', 'sense:esmi']}
- {id: apc.cafe, kind: lesson, introduces: ['sense:ahwe', 'sense:shay', 'sense:baddi', 'sense:baddak', 'sense:la2', 'sense:eh']}
- {id: apc.story, kind: story}
- {id: apc.arabizi, kind: script, introduces: ['grapheme:7', 'grapheme:3', 'grapheme:2'], convert: {from: apc-Arab/standard, to: apc-Latn/arabizi, sentences: [s.1, s.4, s.7, s.8, s.21]}}
sentences:
- id: s.1
  node: apc.greetings
  register: colloquial
  forms:
    apc-Arab/standard:
      text: مرحبا!
      tokens: [{surface: مرحبا, sense: marhaba}]
      reverse: مرحبا
    apc-Latn/arabizi:
      text: mar7aba!
      tokens: [{surface: mar7aba, sense: marhaba}]
      reverse: (mar7aba|marhaba|mar7ba)
  translations:
    en: |-
      Hello!
      Hi!
- id: s.2
  node: apc.greetings
  register: colloquial
  forms:
    apc-Arab/standard:
      text: شكرا!
      tokens: [{surface: شكرا, sense: shukran}]
      reverse: شكرا
    apc-Latn/arabizi:
      text: shukran!
      tokens: [{surface: shukran, sense: shukran}]
      reverse: (shukran|shokran)
  translations:
