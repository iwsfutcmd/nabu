  translations:
    en: |-
      I want (tea|some tea|a tea), (thanks|thank you).
      I('d| would) like (tea|some tea|a tea), (thanks|thank you).
stories:
# Vocalized throughout (harakat on the Arabic-script lines); the glossary keys are unvocalized, so
# tap-for-gloss finds them through the folded pass (Phase 6 acceptance).
- id: apc.story.cafe
  node: apc.story
  title: {en: "Coffee or tea?"}
  provenance: {author: 'llm:claude@ec206a97f12b', status: draft}
  characters:
  - {id: sami, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: maya, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَرْحَبا!
          tokens: [{surface: مَرْحَبا, sense: marhaba}]
        apc-Latn/arabizi:
          text: mar7aba!
          tokens: [{surface: mar7aba, sense: marhaba}]
      translations: {en: "Hi!"}
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: مَرْحَبا سامي! كِيفَك؟
          tokens: [{surface: مَرْحَبا, sense: marhaba}, {surface: سامي, sense: sami}, {surface: كِيفَك, sense: kifak}]
        apc-Latn/arabizi:
          text: mar7aba Sami! kifak?
          tokens: [{surface: mar7aba, sense: marhaba}, {surface: Sami, sense: sami}, {surface: kifak, sense: kifak}]
      translations: {en: "Hi Sami! How are you?"}
  - line:
      speaker: sami
      ask: complete
      gap: 'sense:mni7'
      distractors: ['sense:shukran']
      forms:
        apc-Arab/standard:
          text: مْنيح، الحَمْدِلله!
          tokens: [{surface: مْنيح, sense: mni7}, {surface: الحَمْدِلله, sense: el7amdella}]
        apc-Latn/arabizi:
          text: mni7, el7amdella!
          tokens: [{surface: mni7, sense: mni7}, {surface: el7amdella, sense: el7amdella}]
      translations: {en: "Fine, thank God!"}
  - choose:
      prompt: {en: "How is Sami?"}
      options: [{en: "He's fine."}, {en: "He's sad."}, {en: "He's in a hurry."}]
      answer: 0
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
