stories:
# Vocalized throughout (harakat on the Arabic-script lines); the glossary keys are unvocalized, so
# tap-for-gloss finds them through the folded pass (Phase 6 acceptance).
- id: apc.story.cafe
  node: apc.story
  title:
    en: Coffee or tea?
  provenance:
    author: llm:claude@ec206a97f12b
    status: draft
  characters:
  - id: sami
    speaker: m
    name:
      apc-Arab/standard: سامي
      apc-Latn/arabizi: Sami
  - id: maya
    speaker: f
    name:
      apc-Arab/standard: مايا
      apc-Latn/arabizi: Maya
  steps:
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مَرْحَبا!
          tokens: [{surface: مَرْحَبا, lexeme: marhaba}]
        apc-Latn/arabizi:
          text: mar7aba!
          tokens: [{surface: mar7aba, lexeme: marhaba}]
      translations:
        en: Hi!
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: مَرْحَبا سامي! كيفَك؟
          tokens: [{surface: مَرْحَبا, lexeme: marhaba}, {surface: سامي, lexeme: sami}, {surface: كيفَك, lexemes: [{lexeme: kif, surface: كيفَ, base: true}, {lexeme: poss-2ms, surface: ك}]}]
        apc-Latn/arabizi:
          text: mar7aba Sami! kifak?
          tokens: [{surface: mar7aba, lexeme: marhaba}, {surface: Sami, lexeme: sami}, {surface: kifak, lexemes: [{lexeme: kif, surface: kif, base: true}, {lexeme: poss-2ms, surface: ak}]}]
      translations:
        en: Hi Sami! How are you?
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: مْنيح، الحَمْدِلله!
          tokens: [{surface: مْنيح, lexeme: mni7, feats: {Gender: Masc, Number: Sing}}, {surface: الحَمْدِلله, lexeme: el7amdella}]
        apc-Latn/arabizi:
          text: mni7, el7amdella!
          tokens: [{surface: mni7, lexeme: mni7, feats: {Gender: Masc, Number: Sing}}, {surface: el7amdella, lexeme: el7amdella}]
      translations:
        en: Fine, thank God!
  - choose:
      prompt:
        en: How is Sami?
      options:
      - en: He's fine.
      - en: He's sad.
      - en: He's in a hurry.
      answer: 0
  - line:
      speaker: maya
      ask: arrange
      forms:
        apc-Arab/standard:
          text: شو بَدَّك؟ قَهْوِة؟
          tokens: [{surface: شو, lexeme: shu}, {surface: بَدَّك, lexemes: [{lexeme: badd, surface: بَدَّ, base: true}, {lexeme: poss-2ms, surface: ك}]}, {surface: قَهْوِة, lexeme: ahwe, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: shu baddak? ahwe?
          tokens: [{surface: shu, lexeme: shu}, {surface: baddak, lexemes: [{lexeme: badd, surface: badd, base: true}, {lexeme: poss-2ms, surface: ak}]}, {surface: ahwe, lexeme: ahwe, feats: {Number: Sing}}]
      translations:
        en: What do you want? Coffee?
  - line:
      speaker: sami
      ask: complete
      gap: lexeme:shay
      distractors:
      - ['lexeme:esm', 'lexeme:poss-2ms']
      - ['lexeme:esm', 'lexeme:poss-1sg']
      forms:
        apc-Arab/standard:
          text: لأ، بَدّي شاي.
          tokens: [{surface: لأ, lexeme: la2}, {surface: بَدّي, lexemes: [{lexeme: badd, surface: بَدّ, base: true}, {lexeme: poss-1sg, surface: ي}]}, {surface: شاي, lexeme: shay, feats: {Number: Sing}}]
        apc-Latn/arabizi:
          text: la2, baddi shay.
          tokens: [{surface: la2, lexeme: la2}, {surface: baddi, lexemes: [{lexeme: badd, surface: badd, base: true}, {lexeme: poss-1sg, surface: i}]}, {surface: shay, lexeme: shay, feats: {Number: Sing}}]
      translations:
