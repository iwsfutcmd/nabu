# Fixture course (apc), unit 15: clothes, colours and comparing. Colours have their own feminine (abyad →
# bayda, a7mar → 7amra); comparatives (arkhas, aghla, akbar, azghar) with men, than (akbar menni: older
# than me); 2addesh 7a22o? (how much is it?), trying things on (fiyyi jarrbo?) and sizes.
# Drafted by an LLM (provenance llm:…, status draft) and checked against Kline (2022), chapter 3 (feminine
# and comparative adjectives, colours) and chapter 15: every sentence awaits a native speaker's review.
id: u15-shopping
title: {en: At the clothes shop}
cefr: A2
kcs:
- {id: 'sense:tyeb', gloss: {en: clothes}, forms: {apc-Arab/standard: [تياب], apc-Latn/arabizi: [tyeb]}}
- {id: 'sense:2amis', gloss: {en: shirt}, forms: {apc-Arab/standard: [قميص], apc-Latn/arabizi: [2amis]}}
- {id: 'sense:bantalon', gloss: {en: trousers; pants}, forms: {apc-Arab/standard: [بنطلون], apc-Latn/arabizi: [bantalon]}}
- {id: 'sense:fostan', gloss: {en: dress}, forms: {apc-Arab/standard: [فستان], apc-Latn/arabizi: [fostan]}}
- {id: 'sense:sobbat', gloss: {en: shoe; shoes}, forms: {apc-Arab/standard: [صبّاط], apc-Latn/arabizi: [sobbat]}}
- {id: 'sense:lon', gloss: {en: colour}, forms: {apc-Arab/standard: [لون], apc-Latn/arabizi: [lon]}, notes: {en: 'shu lono? What colour is it?'}}
- {id: 'sense:abyad', gloss: {en: white}, forms: {apc-Arab/standard: [أبيض, بيضا], apc-Latn/arabizi: [abyad, bayda]}, notes: {en: 'Colours have their own feminine: abyad → bayda (بيضا).'}}
- {id: 'sense:aswad', gloss: {en: black}, forms: {apc-Arab/standard: [أسود, سودا], apc-Latn/arabizi: [aswad, sawda]}}
- {id: 'sense:a7mar', gloss: {en: red}, forms: {apc-Arab/standard: [أحمر, حمرا], apc-Latn/arabizi: [a7mar, 7amra]}}
- {id: 'sense:azra2', gloss: {en: blue}, forms: {apc-Arab/standard: [أزرق, زرقا], apc-Latn/arabizi: [azra2, zar2a]}}
- {id: 'sense:akhdar', gloss: {en: green}, forms: {apc-Arab/standard: [أخضر, خضرا], apc-Latn/arabizi: [akhdar, khadra]}}
- {id: 'sense:arkhas', gloss: {en: cheaper; cheapest}, forms: {apc-Arab/standard: [أرخص], apc-Latn/arabizi: [arkhas]}, notes: {en: 'rkhis → arkhas. A comparative does not change for a feminine noun: el
      fostan arkhas, el siyyara arkhas.'}}
- {id: 'sense:men.than', gloss: {en: than}, forms: {apc-Arab/standard: [من], apc-Latn/arabizi: [men]}, notes: {en: 'akbar men el day3a: bigger than the village; akbar menni: older than me.'}}
- {id: 'sense:aghla', gloss: {en: more expensive; most expensive}, forms: {apc-Arab/standard: [أغلى], apc-Latn/arabizi: [aghla]}, notes: {en: ghali → aghla.}}
- {id: 'sense:akbar', gloss: {en: bigger; older}, forms: {apc-Arab/standard: [أكبر], apc-Latn/arabizi: [akbar]}, notes: {en: kbir → akbar.}}
- {id: 'sense:azghar', gloss: {en: smaller; younger}, forms: {apc-Arab/standard: [أزغر], apc-Latn/arabizi: [azghar]}, notes: {en: zghir → azghar.}}
- {id: 'sense:7a22', gloss: {en: price (what something costs)}, forms: {apc-Arab/standard: [حقّ], apc-Latn/arabizi: [7a22]}, notes: {en: '2addesh 7a22o? How much is it? (7a22a for a feminine noun).'}}
- {id: 'sense:jarrab', gloss: {en: try; try on}, forms: {apc-Arab/standard: [جرّب], apc-Latn/arabizi: [jarreb]}, notes: {en: 'fiyyi jarrbo? Can I try it on?'}}
- {id: 'sense:2yes', gloss: {en: size}, forms: {apc-Arab/standard: [قياس], apc-Latn/arabizi: [2yes]}}
- {id: 'sense:lebes', gloss: {en: wear; put on (clothes)}, forms: {apc-Arab/standard: [البس], apc-Latn/arabizi: [elbos]}, notes: {en: 'shu ra7 tilbos? What are you going to wear?'}}
nodes:
