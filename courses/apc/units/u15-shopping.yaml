stories:
- id: apc.story.dress
  node: apc.shop.story
  title: {en: The blue dress}
  provenance: {author: 'llm:claude@d214e4396eeb', status: draft}
  characters:
  - {id: maya, speaker: f, name: {apc-Arab/standard: مايا, apc-Latn/arabizi: Maya}}
  - {id: sami, speaker: m, name: {apc-Arab/standard: سامي, apc-Latn/arabizi: Sami}}
  - {id: abu-ali, speaker: m, name: {apc-Arab/standard: أبو علي, apc-Latn/arabizi: Abu Ali}}
  steps:
  - line:
      speaker: maya
      forms:
        apc-Arab/standard:
          text: سامي، بْتْحِبّ هَالفُسْتان؟
          tokens: [{surface: سامي, sense: sami}, {surface: بْتْحِبّ, sense: 7abb, form: 'form:impf-2ms'}, {surface: هَالفُسْتان, sense: fostan, morphs: [{surface: هَال, kc: 'sense:hal'}, {surface: فُسْتان,
                  kc: 'sense:fostan'}]}]
        apc-Latn/arabizi:
          text: Sami, bt7ebb hal fostan?
          tokens: [{surface: Sami, sense: sami}, {surface: bt7ebb, sense: 7abb, form: 'form:impf-2ms'}, {surface: hal, sense: hal}, {surface: fostan, sense: fostan}]
      translations: {en: 'Sami, do you like this dress?'}
  - line:
      speaker: sami
      forms:
        apc-Arab/standard:
          text: حِلو، بَسّ الأَحْمَر أَحْلى.
          tokens: [{surface: حِلو, sense: 7elo}, {surface: بَسّ, sense: bas}, {surface: الأَحْمَر, sense: a7mar, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَحْمَر, kc: 'sense:a7mar'}]}, {surface: أَحْلى,
              sense: a7la}]
        apc-Latn/arabizi:
          text: 7elo, bas el a7mar a7la.
          tokens: [{surface: 7elo, sense: 7elo}, {surface: bas, sense: bas}, {surface: el, sense: el}, {surface: a7mar, sense: a7mar}, {surface: a7la, sense: a7la}]
      translations: {en: 'It''s nice, but the red one is nicer.'}
  - line:
      speaker: abu-ali
      forms:
        apc-Arab/standard:
          text: الأَحْمَر بْخَمْسين دولار، والأَزْرَق بْعِشْرين.
          tokens: [{surface: الأَحْمَر, sense: a7mar, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَحْمَر, kc: 'sense:a7mar'}]}, {surface: بْخَمْسين, sense: khamsin, morphs: [{surface: بْ, kc: 'sense:b'},
                {surface: خَمْسين, kc: 'sense:khamsin'}]}, {surface: دولار, sense: dollar}, {surface: والأَزْرَق, sense: azra2, morphs: [{surface: و, kc: 'sense:w'}, {surface: ال, kc: 'sense:el'}, {surface: أَزْرَق,
                  kc: 'sense:azra2'}]}, {surface: بْعِشْرين, sense: 3eshrin, morphs: [{surface: بْ, kc: 'sense:b'}, {surface: عِشْرين, kc: 'sense:3eshrin'}]}]
        apc-Latn/arabizi:
          text: el a7mar b khamsin dollar, w el azra2 b 3eshrin.
          tokens: [{surface: el, sense: el}, {surface: a7mar, sense: a7mar}, {surface: b, sense: b}, {surface: khamsin, sense: khamsin}, {surface: dollar, sense: dollar}, {surface: w, sense: w}, {surface: el,
              sense: el}, {surface: azra2, sense: azra2}, {surface: b, sense: b}, {surface: 3eshrin, sense: 3eshrin}]
      translations: {en: 'The red one is fifty dollars, and the blue one is twenty.'}
  - line:
      speaker: maya
      ask: complete
      gap: sense:arkhas
      distractors: ['sense:aghla']
      forms:
        apc-Arab/standard:
          text: الأَزْرَق أَرْخَص. فِيّي جَرّْبُه؟
          tokens: [{surface: الأَزْرَق, sense: azra2, morphs: [{surface: ال, kc: 'sense:el'}, {surface: أَزْرَق, kc: 'sense:azra2'}]}, {surface: أَرْخَص, sense: arkhas}, {surface: فِيّي, sense: fi.can,
              morphs: [{surface: فِيّ, kc: 'sense:fi.can'}, {surface: ي, kc: 'form:poss-1sg'}]}, {surface: جَرّْبُه, sense: jarrab, form: 'form:subj-1sg', morphs: [{surface: جَرّْبُ, kc: 'sense:jarrab'},
                {surface: ه, kc: 'form:obj-3ms'}]}]
