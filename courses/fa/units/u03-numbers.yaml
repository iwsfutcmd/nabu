# Fixture course (fa), unit 3: numbers, age and prices. داشتن 'to have' (no mi- in the present), the -ad ending,
# the negative prefix na-, a singular noun after a number, and tomans.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: numbers
title: {en: 'Numbers, age and money'}
cefr: A1
kcs:
- {id: 'sense:yek', gloss: {en: 'one; a, an'}, forms: {fa-Arab/standard: [یک]}}
- {id: 'sense:dashtan', gloss: {en: to have (present stem دار-)}, forms: {fa-Arab/standard: [دارم, دارد, داری, داریم, دارند, ندارم, ندارد, دارید]}, notes: {en: "No می\u200c in the present: دارم, داری, دارد, داریم, دارید, دارند. Age is 'had': بیست سال دارم, I am twenty."}}
- {id: 'form:3sg-ad', gloss: {en: '-ad: he, she, it (verb ending)'}, notes: {en: 'دارد (dārad): has. In speech it is -e: داره (dāre).'}}
- {id: 'sense:do', gloss: {en: two}, forms: {fa-Arab/standard: [دو]}, notes: {en: 'After a number the noun stays singular: دو کتاب, two books.'}}
- {id: 'sense:se', gloss: {en: three}, forms: {fa-Arab/standard: [سه]}}
- {id: 'sense:chahar', gloss: {en: four}, forms: {fa-Arab/standard: [چهار]}}
- {id: 'sense:panj', gloss: {en: five}, forms: {fa-Arab/standard: [پنج]}}
- {id: 'sense:shesh', gloss: {en: six}, forms: {fa-Arab/standard: [شش]}}
- {id: 'sense:haft', gloss: {en: seven}, forms: {fa-Arab/standard: [هفت]}}
- {id: 'sense:daftar', gloss: {en: notebook}, forms: {fa-Arab/standard: [دفتر]}}
- {id: 'sense:hasht', gloss: {en: eight}, forms: {fa-Arab/standard: [هشت]}}
- {id: 'sense:dah', gloss: {en: ten}, forms: {fa-Arab/standard: [ده]}}
- {id: 'form:neg-na', gloss: {en: 'na-, ne-: not (verb prefix)'}, notes: {en: "ندارم: I don't have. Before می\u200c it is ne-: نمی\u200cخورم, I don't eat."}}
- {id: 'sense:khodkar', gloss: {en: (ballpoint) pen}, forms: {fa-Arab/standard: [خودکار]}}
- {id: 'sense:bist', gloss: {en: twenty}, forms: {fa-Arab/standard: [بیست]}, notes: {en: 'Tens and units are joined with و: بیست و پنج, twenty-five.'}}
- {id: 'sense:sal', gloss: {en: year; years (of age)}, forms: {fa-Arab/standard: [سال]}}
- {id: 'sense:chand', gloss: {en: how many; how much (price)}, forms: {fa-Arab/standard: [چند]}, notes: {en: 'Spoken: چند تا (chand tā), how many.'}}
- {id: 'sense:si', gloss: {en: thirty}, forms: {fa-Arab/standard: [سی]}}
- {id: 'sense:panjah', gloss: {en: fifty}, forms: {fa-Arab/standard: [پنجاه]}}
- {id: 'sense:sad', gloss: {en: hundred}, forms: {fa-Arab/standard: [صد]}}
- {id: 'sense:hezar', gloss: {en: thousand}, forms: {fa-Arab/standard: [هزار]}}
- {id: 'sense:pool', gloss: {en: money}, forms: {fa-Arab/standard: [پول]}}
- {id: 'sense:gheymat', gloss: {en: price}, forms: {fa-Arab/standard: [قیمت]}}
- {id: 'sense:toman', gloss: {en: toman}, forms: {fa-Arab/standard: [تومان]}, notes: {en: 'Prices are said in tomans; one toman is ten rials, the official unit on banknotes.'}}
- {id: 'sense:cheghadr', gloss: {en: how much}, forms: {fa-Arab/standard: [چقدر]}, notes: {en: 'Spoken: چقدره؟ (cheqadre?) How much is it?'}}
- {id: 'sense:geran', gloss: {en: expensive}, forms: {fa-Arab/standard: [گران, "گران\u200cتر"]}}
- {id: 'sense:arzan', gloss: {en: cheap; inexpensive}, forms: {fa-Arab/standard: [ارزان, "ارزان\u200cتر"]}}
