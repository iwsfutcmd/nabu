      forms:
        fa-Arab/standard:
          text: ممنون، آقا. خداحافظ!
          tokens: [{surface: ممنون, lexeme: mamnun}, {surface: آقا, lexeme: agha}, {surface: خداحافظ, lexeme: khodahafez}]
      translations:
