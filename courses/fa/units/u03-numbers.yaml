stories:
- id: fa.story.notebook
  node: fa.numbers.story
  title:
    en: A new notebook
  provenance:
    author: llm:claude@83a16c835c32
    status: draft
  characters:
  - id: maryam
    name:
      fa-Arab/standard: مریم
  - id: seller
    name:
      fa-Arab/standard: فروشنده
  steps:
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: سلام آقا!
          tokens: [{surface: سلام, lexeme: salam}, {surface: آقا, lexeme: agha}]
      translations:
        en: Hello, sir!
  - line:
      speaker: seller
      forms:
        fa-Arab/standard:
          text: سلام خانم! حالِ شما چطور است؟
          tokens: [{surface: سلام, lexeme: salam}, {surface: خانم, lexeme: khanom}, {surface: حالِ, lexemes: [{lexeme: hal, surface: حالِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: شما, lexeme: shoma}, {surface: چطور, lexeme: chetor}, {surface: است, lexemes: [{lexeme: budan, base: true}, {lexeme: pres}, {lexeme: 3sg.zero}]}]
      translations:
        en: Hello, madam! How are you?
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: ممنون، خوب هستم. شما دفتر دارید؟
          tokens: [{surface: ممنون, lexeme: mamnun}, {surface: خوب, lexeme: khub}, {surface: هستم, lexemes: [{lexeme: budan, surface: هست, base: true}, {lexeme: pres}, {lexeme: 1sg, surface: م}]}, {surface: شما, lexeme: shoma}, {surface: دفتر, lexeme: daftar}, {surface: دارید, lexemes: [{lexeme: dashtan, surface: دار, base: true}, {lexeme: pres}, {lexeme: 2pl, surface: ید}]}]
      translations:
        en: Fine, thank you. Do you have notebooks?
  - line:
      speaker: seller
      forms:
        fa-Arab/standard:
          text: بله، این دفتر خیلی خوب است.
          tokens: [{surface: بله, lexeme: bale}, {surface: این, lexeme: in}, {surface: دفتر, lexeme: daftar}, {surface: خیلی, lexeme: kheyli}, {surface: خوب, lexeme: khub}, {surface: است, lexemes: [{lexeme: budan, base: true}, {lexeme: pres}, {lexeme: 3sg.zero}]}]
      translations:
        en: Yes, this notebook is very good.
  - line:
      speaker: maryam
      ask: complete
      gap: lexeme:gheymat
      distractors:
      - lexeme:esm
      - lexeme:hal
      forms:
        fa-Arab/standard:
          text: قیمتِ آن چقدر است؟
          tokens: [{surface: قیمتِ, lexemes: [{lexeme: gheymat, surface: قیمتِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: آن, lexeme: an}, {surface: چقدر, lexeme: cheghadr}, {surface: است, lexemes: [{lexeme: budan, base: true}, {lexeme: pres}, {lexeme: 3sg.zero}]}]
      translations:
        en: How much is it?
  - line:
      speaker: seller
      forms:
        fa-Arab/standard:
          text: پنجاه هزار تومان.
          tokens: [{surface: پنجاه, lexeme: panjah}, {surface: هزار, lexeme: hezar}, {surface: تومان, lexeme: toman}]
      translations:
        en: Fifty thousand tomans.
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: خیلی گران است!
          tokens: [{surface: خیلی, lexeme: kheyli}, {surface: گران, lexeme: geran}, {surface: است, lexemes: [{lexeme: budan, base: true}, {lexeme: pres}, {lexeme: 3sg.zero}]}]
      translations:
        en: That's very expensive!
  - line:
      speaker: seller
      ask: arrange
      forms:
        fa-Arab/standard:
          text: این دفتر ارزان است. بیست هزار تومان.
          tokens: [{surface: این, lexeme: in}, {surface: دفتر, lexeme: daftar}, {surface: ارزان, lexeme: arzan}, {surface: است, lexemes: [{lexeme: budan, base: true}, {lexeme: pres}, {lexeme: 3sg.zero}]}, {surface: بیست, lexeme: bist}, {surface: هزار, lexeme: hezar}, {surface: تومان, lexeme: toman}]
      translations:
        en: This notebook is cheap. Twenty thousand tomans.
  - choose:
      prompt:
        en: How much is the cheaper notebook?
      options:
      - en: 20,000 tomans
      - en: 50,000 tomans
      - en: 100,000 tomans
      answer: 0
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: خوب است. خودکار هم دارید؟
          tokens: [{surface: خوب, lexeme: khub}, {surface: است, lexemes: [{lexeme: budan, base: true}, {lexeme: pres}, {lexeme: 3sg.zero}]}, {surface: خودکار, lexeme: khodkar}, {surface: هم, lexeme: ham}, {surface: دارید, lexemes: [{lexeme: dashtan, surface: دار, base: true}, {lexeme: pres}, {lexeme: 2pl, surface: ید}]}]
      translations:
        en: Good. Do you have pens too?
  - line:
      speaker: seller
      forms:
        fa-Arab/standard:
          text: بله. قیمتِ این خودکار ده هزار تومان است.
          tokens: [{surface: بله, lexeme: bale}, {surface: قیمتِ, lexemes: [{lexeme: gheymat, surface: قیمتِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: این, lexeme: in}, {surface: خودکار, lexeme: khodkar}, {surface: ده, lexeme: dah}, {surface: هزار, lexeme: hezar}, {surface: تومان, lexeme: toman}, {surface: است, lexemes: [{lexeme: budan, base: true}, {lexeme: pres}, {lexeme: 3sg.zero}]}]
      translations:
        en: Yes. This pen is ten thousand tomans.
  - choose:
      prompt:
        en: Why doesn't Maryam take the first notebook?
      options:
      - en: It's too expensive.
      - en: It's too small.
      - en: It isn't pretty.
      answer: 0
  - line:
