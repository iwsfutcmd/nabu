# Fixture course (fa), unit 5: the home. Where things are (کجاست، اینجاست), prepositions, possessive -at,
# and existential هست 'there is' with its negative نیست.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: home
title: {en: At home}
cefr: A1
kcs:
- {id: 'sense:khane', gloss: {en: house; home}, forms: {fa-Arab/standard: [خانه, خانهٔ]}, notes: {en: 'Spoken Tehrani: خونه (khune). The ezafe after its silent -e is written ـٔ: خانهٔ من.'}}
- {id: 'sense:bozorg', gloss: {en: big; large; (of siblings) older}, forms: {fa-Arab/standard: [بزرگ]}}
- {id: 'sense:kuchak', gloss: {en: small; little; (of siblings) younger}, forms: {fa-Arab/standard: [کوچک]}}
- {id: 'sense:aparteman', gloss: {en: apartment; flat}, forms: {fa-Arab/standard: [آپارتمان]}}
- {id: 'sense:ghashang', gloss: {en: pretty; beautiful; nice}, forms: {fa-Arab/standard: [قشنگ]}}
- {id: 'sense:jadid', gloss: {en: new}, forms: {fa-Arab/standard: [جدید]}}
- {id: 'sense:ghadimi', gloss: {en: old (of things)}, forms: {fa-Arab/standard: [قدیمی]}, notes: {en: 'For people, old is پیر (pir).'}}
- {id: 'sense:otagh', gloss: {en: room}, forms: {fa-Arab/standard: [اتاق, اتاقت, اتاقم]}}
- {id: 'sense:amma', gloss: {en: but}, forms: {fa-Arab/standard: [اما]}, notes: {en: ولی (vali) is a common alternative.}}
- {id: 'form:poss-2sg', gloss: {en: '-at: your (one person, familiar; joined to a noun)'}, notes: {en: 'اتاقت (otāq-at) means the same as اتاقِ تو. Spoken: -et (otāqet).'}}
- {id: 'sense:ashpazkhane', gloss: {en: kitchen}, forms: {fa-Arab/standard: [آشپزخانه]}, notes: {en: Literally 'cook-house'.}}
- {id: 'sense:panjere', gloss: {en: window}, forms: {fa-Arab/standard: [پنجره]}}
- {id: 'sense:koja', gloss: {en: where}, forms: {fa-Arab/standard: [کجا, کجاست]}, notes: {en: 'کجاست = کجا + است: where is …?'}}
- {id: 'sense:inja', gloss: {en: here}, forms: {fa-Arab/standard: [اینجا, اینجاست]}, notes: {en: 'اینجاست = اینجا + است. Spoken: اینجاس (injās).'}}
- {id: 'sense:anja', gloss: {en: there}, forms: {fa-Arab/standard: [آنجا, آنجاست]}, notes: {en: 'آنجاست = آنجا + است. Spoken: اونجا (unjā).'}}
- {id: 'sense:dastshui', gloss: {en: toilet; restroom}, forms: {fa-Arab/standard: [دستشویی]}, notes: {en: Literally 'hand-washing'. The bathroom with a shower is حمام (hammām).}}
- {id: 'sense:dar', gloss: {en: in; at}, forms: {fa-Arab/standard: [در]}, notes: {en: 'Everyday speech uses توی or تو (tu): توی آشپزخانه, in the kitchen.'}}
- {id: 'sense:miz', gloss: {en: table; desk}, forms: {fa-Arab/standard: [میز]}}
- {id: 'sense:ruye', gloss: {en: on (top of)}, forms: {fa-Arab/standard: [روی]}}
- {id: 'sense:zir', gloss: {en: under}, forms: {fa-Arab/standard: [زیر]}, notes: {en: 'With the ezafe: زیرِ میز, under the table.'}}
- {id: 'sense:sandali', gloss: {en: chair}, forms: {fa-Arab/standard: [صندلی]}}
- {id: 'sense:takht', gloss: {en: bed}, forms: {fa-Arab/standard: [تخت]}}
- {id: 'sense:kenar', gloss: {en: next to; beside; by}, forms: {fa-Arab/standard: [کنار]}, notes: {en: 'With the ezafe: کنارِ پنجره, by the window.'}}
- {id: 'sense:yakhchal', gloss: {en: fridge; refrigerator}, forms: {fa-Arab/standard: [یخچال]}, notes: {en: 'Literally ''ice pit'', the old desert ice-houses.'}}
- {id: 'construction:existential-hast', gloss: {en: 'هست: there is, there are'}, forms: {fa-Arab/standard: [هست]}, notes: {en: 'در آشپزخانه یک میز هست: there is a table in the kitchen. The negative is نیست: نان نیست, there is no bread.'}}
nodes:
- {id: fa.home.house, kind: lesson, introduces: ['sense:khane', 'sense:bozorg', 'sense:kuchak', 'sense:aparteman', 'sense:ghashang', 'sense:jadid', 'sense:ghadimi']}
- {id: fa.home.rooms, kind: lesson, introduces: ['sense:otagh', 'sense:amma', 'form:poss-2sg', 'sense:ashpazkhane', 'sense:panjere']}
- {id: fa.home.where, kind: lesson, introduces: ['sense:koja', 'sense:inja', 'sense:anja', 'sense:dastshui']}
- {id: fa.home.in, kind: lesson, introduces: ['sense:dar', 'sense:miz', 'sense:ruye', 'sense:zir']}
- {id: fa.home.furniture, kind: lesson, introduces: ['sense:sandali', 'sense:takht', 'sense:kenar', 'sense:yakhchal']}
- {id: fa.home.there-is, kind: lesson, introduces: ['construction:existential-hast']}
- {id: fa.home.story, kind: story}
