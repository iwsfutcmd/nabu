stories:
- id: fa.story.flat
  node: fa.home.story
  title: {en: Ali's new flat}
  provenance: {author: 'llm:claude@83a16c835c32', status: draft}
  characters:
  - {id: ali, name: {fa-Arab/standard: علی}}
  - {id: maryam, name: {fa-Arab/standard: مریم}}
  steps:
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: سلام مریم! بفرمایید!
          tokens: [{surface: سلام, sense: salam}, {surface: مریم, sense: maryam}, {surface: بفرمایید, sense: befarmayid}]
      translations: {en: Hi Maryam! Come in!}
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: سلام! آپارتمانِ تو خیلی قشنگ است!
          tokens: [{surface: سلام, sense: salam}, {surface: آپارتمانِ, sense: aparteman}, {surface: تو, sense: to}, {surface: خیلی, sense: kheyli}, {surface: قشنگ, sense: ghashang}, {surface: است, sense: budan}]
      translations: {en: Hi! Your flat is really nice!}
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: ممنون. آپارتمانِ من کوچک است، اما جدید است.
          tokens: [{surface: ممنون, sense: mamnun}, {surface: آپارتمانِ, sense: aparteman}, {surface: من, sense: man}, {surface: کوچک, sense: kuchak}, {surface: است, sense: budan}, {surface: اما, sense: amma}, {surface: جدید, sense: jadid}, {surface: است, sense: budan}]
      translations: {en: 'Thanks. My flat is small, but it''s new.'}
  - line:
      speaker: maryam
      forms:
