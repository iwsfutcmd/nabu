  node: fa.time.plans
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: ساعتِ چهار خوب است؟
      tokens: [{surface: ساعتِ, sense: saat}, {surface: چهار, sense: chahar}, {surface: خوب, sense: khub}, {surface: است, sense: budan}]
      reverse: ساعت چهار (خوب است|خوبه)
  translations:
    en: |-
      Is (four|4) [o'clock] (OK|okay|good|fine)?
      Does (four|4) [o'clock] (work|suit you)?
- id: s.time.30
  node: fa.time.plans
  forms:
