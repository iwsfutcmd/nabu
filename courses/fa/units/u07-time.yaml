stories:
- id: fa.story.tomorrow
  node: fa.time.story
  title:
    en: See you tomorrow
  provenance:
    author: llm:claude@83a16c835c32
    status: draft
  characters:
  - id: ali
    name:
      fa-Arab/standard: علی
  - id: sara
    name:
      fa-Arab/standard: سارا
  steps:
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: سلام سارا! فردا وقت داری؟
          tokens: [{surface: سلام, lexeme: salam}, {surface: سارا, lexeme: sara}, {surface: فردا, lexeme: farda}, {surface: وقت, lexeme: vaght}, {surface: داری, lexemes: [{lexeme: dashtan, surface: دار, base: true, feats: {Tense: Pres}}, {lexeme: 2sg, surface: ی}]}]
      translations:
        en: Hi Sara! Do you have time tomorrow?
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: فردا چندشنبه است؟
          tokens: [{surface: فردا, lexeme: farda}, {surface: چندشنبه, lexeme: chandshanbe}, {surface: است, lexeme: budan}]
      translations:
        en: What day is it tomorrow?
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: فردا پنجشنبه است. تولدِ من است!
          tokens: [{surface: فردا, lexeme: farda}, {surface: پنجشنبه, lexeme: panjshanbe}, {surface: است, lexeme: budan}, {surface: تولدِ, lexemes: [{lexeme: tavallod, surface: تولدِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: من, lexeme: man}, {surface: است, lexeme: budan}]
      translations:
        en: Tomorrow is Thursday. It's my birthday!
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: تولدت مبارک، علی!
          tokens: [{surface: تولدت, lexemes: [{lexeme: tavallod, surface: تولد, base: true}, {lexeme: poss-2sg, surface: ت}]}, {surface: مبارک, lexeme: mobarak}, {surface: علی, lexeme: ali}]
      translations:
        en: Happy birthday, Ali!
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: پنجشنبه صبح کلاس دارم، اما عصر وقت دارم.
          tokens: [{surface: پنجشنبه, lexeme: panjshanbe}, {surface: صبح, lexeme: sobh}, {surface: کلاس, lexeme: kelas}, {surface: دارم, lexemes: [{lexeme: dashtan, surface: دار, base: true, feats: {Tense: Pres}}, {lexeme: 1sg, surface: م}]}, {surface: اما, lexeme: amma}, {surface: عصر, lexeme: asr}, {surface: وقت, lexeme: vaght}, {surface: دارم, lexemes: [{lexeme: dashtan, surface: دار, base: true, feats: {Tense: Pres}}, {lexeme: 1sg, surface: م}]}]
      translations:
        en: On Thursday morning I have class, but I'm free in the afternoon.
  - choose:
      prompt:
        en: When is Sara free on Thursday?
      options:
      - en: in the late afternoon
      - en: in the morning
      - en: at noon
      answer: 0
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: ساعتِ چهار خوب است؟
          tokens: [{surface: ساعتِ, lexemes: [{lexeme: saat, surface: ساعتِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: چهار, lexeme: chahar}, {surface: خوب, lexeme: khub}, {surface: است, lexeme: budan}]
      translations:
        en: Is four o'clock OK?
  - line:
      speaker: sara
      ask: complete
      gap: lexeme:khub
      distractors:
      - lexeme:mehraban
      - lexeme:khoshmaze
      forms:
        fa-Arab/standard:
          text: نه، ساعتِ پنج خوب است.
          tokens: [{surface: نه, lexeme: na, vocalized: نَه}, {surface: ساعتِ, lexemes: [{lexeme: saat, surface: ساعتِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: پنج, lexeme: panj}, {surface: خوب, lexeme: khub}, {surface: است, lexeme: budan}]
      translations:
        en: No, five o'clock is good.
  - line:
      speaker: ali
      ask: arrange
      forms:
        fa-Arab/standard:
          text: خوب است. تا فردا!
          tokens: [{surface: خوب, lexeme: khub}, {surface: است, lexeme: budan}, {surface: تا, lexeme: ta}, {surface: فردا, lexeme: farda}]
      translations:
        en: Fine. See you tomorrow!
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: تا فردا، خداحافظ!
          tokens: [{surface: تا, lexeme: ta}, {surface: فردا, lexeme: farda}, {surface: خداحافظ, lexeme: khodahafez}]
      translations:
        en: See you tomorrow, bye!
  - choose:
      prompt:
        en: What time will they meet?
      options:
      - en: at five
      - en: at four
      - en: at eight
      answer: 0
