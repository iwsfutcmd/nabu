  node: fa.time.plans
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: تولدِ من جمعه است.
      tokens: [{surface: تولدِ, sense: tavallod}, {surface: من, sense: man}, {surface: جمعه, sense: jome}, {surface: است, sense: budan}]
      reverse: (تولد من|تولدم) جمعه است
  translations:
    en: My birthday is (on|this) Friday.
- id: s.time.28
  node: fa.time.plans
  forms:
    fa-Arab/standard:
      text: تولدت مبارک!
      tokens: [{surface: تولدت, sense: tavallod, morphs: [{surface: تولد, kc: 'sense:tavallod'}, {surface: ت, kc: 'form:poss-2sg'}]}, {surface: مبارک, sense: mobarak}]
      reverse: (تولدت|تولد تو|تولدتان|تولد شما) مبارک
  translations:
    en: Happy birthday!
