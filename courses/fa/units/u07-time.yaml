# Fixture course (fa), unit 7: telling the time, parts of the day and the Iranian week (Saturday to Friday).
# Clock times take the ezafe (ساعتِ هشت); از … تا …; the present used for plans.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: time
title:
  en: Time and the week
cefr: A1
nodes:
- {id: fa.time.clock, kind: lesson, introduces: ['lexeme:saat', 'lexeme:nim', 'lexeme:alan', 'lexeme:kelas', 'lexeme:daghighe']}
- {id: fa.time.today, kind: lesson, introduces: ['lexeme:emruz', 'lexeme:farda', 'lexeme:vaght']}
- {id: fa.time.parts, kind: lesson, introduces: ['lexeme:zohr', 'lexeme:asr', 'lexeme:hafte', 'lexeme:shanbe', 'lexeme:chandshanbe']}
- {id: fa.time.week, kind: lesson, introduces: ['lexeme:yekshanbe', 'lexeme:doshanbe', 'lexeme:seshanbe', 'lexeme:chaharshanbe', 'lexeme:panjshanbe']}
- {id: fa.time.weekend, kind: lesson, introduces: ['lexeme:jome', 'lexeme:tatil', 'lexeme:az', 'lexeme:ta', 'lexeme:akhar']}
- {id: fa.time.plans, kind: lesson, introduces: ['lexeme:tavallod', 'lexeme:mobarak']}
- {id: fa.time.story, kind: story}
sentences:
