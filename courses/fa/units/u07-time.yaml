- {id: fa.time.today, kind: lesson, introduces: ['sense:emruz', 'sense:farda', 'sense:vaght']}
- {id: fa.time.parts, kind: lesson, introduces: ['sense:zohr', 'sense:asr', 'sense:hafte', 'sense:shanbe', 'sense:chandshanbe']}
- {id: fa.time.week, kind: lesson, introduces: ['sense:yekshanbe', 'sense:doshanbe', 'sense:seshanbe', 'sense:chaharshanbe', 'sense:panjshanbe']}
- {id: fa.time.weekend, kind: lesson, introduces: ['sense:jome', 'sense:tatil', 'sense:az', 'sense:ta', 'sense:akhar']}
