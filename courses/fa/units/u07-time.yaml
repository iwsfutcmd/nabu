- {id: fa.time.story, kind: story}
sentences:
- id: s.time.1
  node: fa.time.clock
  forms:
    fa-Arab/standard:
      text: ساعت چند است؟
      tokens: [{surface: ساعت, sense: saat}, {surface: چند, sense: chand}, {surface: است, sense: budan}]
      reverse: ساعت (چند است|چنده)
  translations:
    en: |-
      What time is it?
      What('s| is) the time?
- id: s.time.2
  node: fa.time.clock
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: ساعتِ هشت است.
      tokens: [{surface: ساعتِ, sense: saat}, {surface: هشت, sense: hasht}, {surface: است, sense: budan}]
      reverse: ساعت (هشت است|هشته)
  translations:
    en: It('s| is) (eight|8) [o'clock].
- id: s.time.3
  node: fa.time.clock
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: ساعتِ ده و نیم است.
      tokens: [{surface: ساعتِ, sense: saat}, {surface: ده, sense: dah}, {surface: و, sense: va}, {surface: نیم, sense: nim}, {surface: است, sense: budan}]
      reverse: ساعت ده و (نیم است|نیمه)
  translations:
    en: |-
      It('s| is) half past (ten|10).
      It('s| is) (ten|10) thirty.
      It('s| is) 10:30.
- id: s.time.4
  node: fa.time.clock
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: الان ساعتِ سه است.
      tokens: [{surface: الان, sense: alan}, {surface: ساعتِ, sense: saat}, {surface: سه, sense: se}, {surface: است, sense: budan}]
      reverse: (الان ساعت|ساعت الان) سه است
  translations:
    en: |-
      It('s| is) (three|3) [o'clock] now.
      Now it('s| is) (three|3) [o'clock].
- id: s.time.5
  node: fa.time.clock
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: کلاس ساعتِ هشت است.
      tokens: [{surface: کلاس, sense: kelas}, {surface: ساعتِ, sense: saat}, {surface: هشت, sense: hasht}, {surface: است, sense: budan}]
      reverse: کلاس ساعت هشت است
  translations:
    en: (The|Our) class is at (eight|8) [o'clock].
- id: s.time.6
  node: fa.time.clock
  forms:
    fa-Arab/standard:
      text: کلاس پنجاه دقیقه است.
      tokens: [{surface: کلاس, sense: kelas}, {surface: پنجاه, sense: panjah}, {surface: دقیقه, sense: daghighe}, {surface: است, sense: budan}]
      reverse: کلاس پنجاه دقیقه است
  translations:
    en: (The|Our) class is (fifty|50) minutes [long].
- id: s.time.7
  node: fa.time.today
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: "ساعتِ چند می\u200cآیی؟"
      tokens: [{surface: ساعتِ, sense: saat}, {surface: چند, sense: chand}, {surface: "می\u200cآیی", sense: amadan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: آی, kc: 'sense:amadan'}, {surface: ی, kc: 'form:2sg-i'}]}]
      reverse: "[تو] ساعت چند می\u200cآیی\n[شما] ساعت چند می\u200cآیید"
  translations:
    en: |-
      (What time|When) are you coming?
      (What time|When) will you come?
- id: s.time.8
  node: fa.time.today
  forms:
    fa-Arab/standard:
      text: امروز کار دارم.
      tokens: [{surface: امروز, sense: emruz}, {surface: کار, sense: kar}, {surface: دارم, sense: dashtan, morphs: [{surface: دار, kc: 'sense:dashtan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: |-
        [من] امروز کار دارم
        امروز من کار دارم
  translations:
    en: |-
      I('m| am) busy today.
      Today I('m| am) busy.
      I have (work|things to do) today.
- id: s.time.9
  node: fa.time.today
  forms:
    fa-Arab/standard:
      text: "فردا می\u200cآیم."
      tokens: [{surface: فردا, sense: farda}, {surface: "می\u200cآیم", sense: amadan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: آی, kc: 'sense:amadan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: "[من] فردا می\u200cآیم"
  translations:
    en: |-
      I('ll| will) come tomorrow.
      I('m| am) coming tomorrow.
- id: s.time.10
  node: fa.time.today
  register: formal
  forms:
    fa-Arab/standard:
      text: امروز وقت دارید؟
      tokens: [{surface: امروز, sense: emruz}, {surface: وقت, sense: vaght}, {surface: دارید, sense: dashtan, morphs: [{surface: دار, kc: 'sense:dashtan'}, {surface: ید, kc: 'form:2pl-id'}]}]
      reverse: |-
        [شما] امروز وقت دارید
        [تو] امروز وقت داری
  translations:
    en: |-
      Do you have time today?
      Are you free today?
- id: s.time.11
  node: fa.time.today
  forms:
    fa-Arab/standard:
      text: نه، امروز وقت ندارم، اما فردا وقت دارم.
      tokens: [{surface: نه, sense: na, vocalized: نَه}, {surface: امروز, sense: emruz}, {surface: وقت, sense: vaght}, {surface: ندارم, sense: dashtan, morphs: [{surface: ن, kc: 'form:neg-na'}, {surface: دار, kc: 'sense:dashtan'}, {surface: م, kc: 'form:1sg-am'}]}, {surface: اما, sense: amma}, {surface: فردا, sense: farda}, {surface: وقت, sense: vaght}, {surface: دارم, sense: dashtan, morphs: [{surface: دار, kc: 'sense:dashtan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: نه [من] امروز وقت ندارم (اما|ولی) فردا وقت دارم
  translations:
    en: |-
      No, I (don't|do not) have time today, but I (do|have time) tomorrow.
      No, I('m| am) not free today, but I('m| am) free tomorrow.
- id: s.time.12
  node: fa.time.parts
  forms:
    fa-Arab/standard:
      text: "ظهر ناهار می\u200cخوریم."
      tokens: [{surface: ظهر, sense: zohr}, {surface: ناهار, sense: nahar}, {surface: "می\u200cخوریم", sense: khordan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خور, kc: 'sense:khordan'}, {surface: یم, kc: 'form:1pl-im'}]}]
      reverse: "[ما] ظهر (ناهار|نهار) می\u200cخوریم"
  translations:
    en: We (have|eat) lunch at noon.
- id: s.time.13
  node: fa.time.parts
  forms:
    fa-Arab/standard:
      text: "عصر چای می\u200cخوریم."
      tokens: [{surface: عصر, sense: asr}, {surface: چای, sense: chay}, {surface: "می\u200cخوریم", sense: khordan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خور, kc: 'sense:khordan'}, {surface: یم, kc: 'form:1pl-im'}]}]
      reverse: "[ما] عصر چای می\u200cخوریم"
  translations:
    en: We (drink|have) tea in the [late] afternoon.
- id: s.time.14
  node: fa.time.parts
  forms:
    fa-Arab/standard:
      text: یک هفته هفت روز دارد.
      tokens: [{surface: یک, sense: yek}, {surface: هفته, sense: hafte}, {surface: هفت, sense: haft}, {surface: روز, sense: ruz}, {surface: دارد, sense: dashtan, morphs: [{surface: دار, kc: 'sense:dashtan'}, {surface: د, kc: 'form:3sg-ad'}]}]
      reverse: '[یک] هفته هفت روز دارد'
  translations:
    en: |-
      A week has (seven|7) days.
      There are (seven|7) days in a week.
- id: s.time.15
  node: fa.time.parts
  forms:
    fa-Arab/standard:
      text: امروز شنبه است.
      tokens: [{surface: امروز, sense: emruz}, {surface: شنبه, sense: shanbe}, {surface: است, sense: budan}]
      reverse: امروز شنبه است
  translations:
    en: |-
      Today is Saturday.
      It('s| is) Saturday today.
- id: s.time.16
  node: fa.time.parts
  forms:
    fa-Arab/standard:
      text: امروز چندشنبه است؟
      tokens: [{surface: امروز, sense: emruz}, {surface: چندشنبه, sense: chandshanbe}, {surface: است, sense: budan}]
      reverse: امروز (چندشنبه است|چه روزی است)
  translations:
    en: |-
      What day is (it today|today)?
      What day of the week is (it|it today|today)?
- id: s.time.17
  node: fa.time.week
  forms:
    fa-Arab/standard:
      text: فردا یکشنبه است.
      tokens: [{surface: فردا, sense: farda}, {surface: یکشنبه, sense: yekshanbe}, {surface: است, sense: budan}]
      reverse: "فردا (یکشنبه|یک\u200cشنبه) است"
  translations:
    en: |-
      Tomorrow is Sunday.
      It('s| is) Sunday tomorrow.
- id: s.time.18
  node: fa.time.week
  forms:
    fa-Arab/standard:
      text: دوشنبه کلاس داریم.
      tokens: [{surface: دوشنبه, sense: doshanbe}, {surface: کلاس, sense: kelas}, {surface: داریم, sense: dashtan, morphs: [{surface: دار, kc: 'sense:dashtan'}, {surface: یم, kc: 'form:1pl-im'}]}]
      reverse: "[ما] (دوشنبه|دو\u200cشنبه) کلاس داریم"
  translations:
    en: |-
      We have (a class|class|classes) on Monday.
      On Monday we have (a class|class|classes).
- id: s.time.19
  node: fa.time.week
  forms:
    fa-Arab/standard:
      text: "سه\u200cشنبه به دانشگاه می\u200cروم."
      tokens: [{surface: "سه\u200cشنبه", sense: seshanbe}, {surface: به, sense: be}, {surface: دانشگاه, sense: daneshgah}, {surface: "می\u200cروم", sense: raftan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: رو, kc: 'sense:raftan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: "[من] سه\u200cشنبه [به] دانشگاه می\u200cروم"
  translations:
    en: |-
      (On Tuesday|Tuesday) I('m going| am going| go) to [the] university.
      I('m going| am going| go) to [the] university on Tuesday.
- id: s.time.20
  node: fa.time.week
  forms:
    fa-Arab/standard:
      text: چهارشنبه وقت دارم.
      tokens: [{surface: چهارشنبه, sense: chaharshanbe}, {surface: وقت, sense: vaght}, {surface: دارم, sense: dashtan, morphs: [{surface: دار, kc: 'sense:dashtan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: "[من] (چهارشنبه|چهار\u200cشنبه) وقت دارم"
  translations:
    en: |-
      I have time on Wednesday.
      I('m| am) free on Wednesday.
      On Wednesday I (have time|am free).
- id: s.time.21
  node: fa.time.week
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: "پنجشنبه به خانهٔ مادرم می\u200cروم."
      tokens: [{surface: پنجشنبه, sense: panjshanbe}, {surface: به, sense: be}, {surface: خانهٔ, sense: khane}, {surface: مادرم, sense: madar, morphs: [{surface: مادر, kc: 'sense:madar'}, {surface: م, kc: 'form:poss-1sg'}]}, {surface: "می\u200cروم", sense: raftan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: رو, kc: 'sense:raftan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: "[من] (پنجشنبه|پنج\u200cشنبه) [به] خان(هٔ|ه\u200cی|ه) (مادرم|مادر من) می\u200cروم"
  translations:
    en: |-
      On Thursday I('m going| am going| go) to my (mother's|mom's|mum's) [house].
      I('m going| am going| go) to my (mother's|mom's|mum's) [house] on Thursday.
- id: s.time.22
  node: fa.time.weekend
  forms:
    fa-Arab/standard:
      text: "جمعه کار نمی\u200cکنم."
      tokens: [{surface: جمعه, sense: jome}, {surface: کار, sense: kar}, {surface: "نمی\u200cکنم", sense: kardan, morphs: [{surface: ن, kc: 'form:neg-na'}, {surface: "می\u200c", kc: 'form:mi-present'}, {surface: کن, kc: 'sense:kardan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: "[من] (جمعه|جمعه\u200cها) کار نمی\u200cکنم"
  translations:
    en: |-
      I (don't|do not) work on Friday[s].
      On Friday[s] I (don't|do not) work.
- id: s.time.23
  node: fa.time.weekend
  forms:
    fa-Arab/standard:
      text: جمعه تعطیل است.
      tokens: [{surface: جمعه, sense: jome}, {surface: تعطیل, sense: tatil}, {surface: است, sense: budan}]
      reverse: جمعه تعطیل است
  translations:
    en: |-
      Friday is a (holiday|day off).
      Friday is the weekend.
      Friday is (off|an off day).
      (It's|It is) closed on Friday[s].
- id: s.time.24
  node: fa.time.weekend
  forms:
    fa-Arab/standard:
      text: "علی از دانشگاه می\u200cآید."
      tokens: [{surface: علی, sense: ali}, {surface: از, sense: az}, {surface: دانشگاه, sense: daneshgah}, {surface: "می\u200cآید", sense: amadan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: آی, kc: 'sense:amadan'}, {surface: د, kc: 'form:3sg-ad'}]}]
      reverse: "علی از دانشگاه می\u200cآید"
  translations:
    en: Ali('s coming| is coming| comes) from [the] university.
- id: s.time.25
  node: fa.time.weekend
  forms:
    fa-Arab/standard:
      text: "از شنبه تا چهارشنبه کار می\u200cکنم."
      tokens: [{surface: از, sense: az}, {surface: شنبه, sense: shanbe}, {surface: تا, sense: ta}, {surface: چهارشنبه, sense: chaharshanbe}, {surface: کار, sense: kar}, {surface: "می\u200cکنم", sense: kardan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: کن, kc: 'sense:kardan'}, {surface: م, kc: 'form:1sg-am'}]}]
      reverse: "[من] از شنبه تا چهارشنبه کار می\u200cکنم"
  translations:
    en: I work from Saturday (to|until|till|through) Wednesday.
- id: s.time.26
  node: fa.time.weekend
  constructions: ['construction:ezafe']
  forms:
    fa-Arab/standard:
      text: "آخرِ هفته کجا می\u200cروی؟"
      tokens: [{surface: آخرِ, sense: akhar}, {surface: هفته, sense: hafte}, {surface: کجا, sense: koja}, {surface: "می\u200cروی", sense: raftan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: رو, kc: 'sense:raftan'}, {surface: ی, kc: 'form:2sg-i'}]}]
      reverse: "[تو] آخر هفته کجا می\u200cروی\n[شما] آخر هفته کجا می\u200cروید"
  translations:
    en: |-
      Where are you going (at the|on the|this) weekend?
      Where do you go (at|on) the weekend?
