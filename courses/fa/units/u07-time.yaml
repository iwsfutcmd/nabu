# Fixture course (fa), unit 7: telling the time, parts of the day and the Iranian week (Saturday to Friday).
# Clock times take the ezafe (ساعتِ هشت); از … تا …; the present used for plans.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: time
title: {en: Time and the week}
cefr: A1
kcs:
- {id: 'sense:saat', gloss: {en: 'hour; o''clock; clock, watch'}, forms: {fa-Arab/standard: [ساعت]}, notes: {en: 'ساعت چند است؟ What time is it? With a number it takes the ezafe: ساعتِ هشت, eight o''clock.'}}
- {id: 'sense:nim', gloss: {en: half}, forms: {fa-Arab/standard: [نیم]}, notes: {en: 'ده و نیم: half past ten.'}}
- {id: 'sense:alan', gloss: {en: now}, forms: {fa-Arab/standard: [الان]}}
- {id: 'sense:kelas', gloss: {en: class}, forms: {fa-Arab/standard: [کلاس]}}
- {id: 'sense:daghighe', gloss: {en: minute}, forms: {fa-Arab/standard: [دقیقه]}}
- {id: 'sense:emruz', gloss: {en: today}, forms: {fa-Arab/standard: [امروز]}}
- {id: 'sense:farda', gloss: {en: tomorrow}, forms: {fa-Arab/standard: [فردا]}}
- {id: 'sense:vaght', gloss: {en: time (to do something)}, forms: {fa-Arab/standard: [وقت]}, notes: {en: 'وقت دارید؟ Do you have time? Clock time is ساعت.'}}
- {id: 'sense:zohr', gloss: {en: noon; midday}, forms: {fa-Arab/standard: [ظهر]}}
- {id: 'sense:asr', gloss: {en: late afternoon; early evening}, forms: {fa-Arab/standard: [عصر]}}
- {id: 'sense:hafte', gloss: {en: week}, forms: {fa-Arab/standard: [هفته, هفتهٔ]}}
- {id: 'sense:shanbe', gloss: {en: Saturday}, forms: {fa-Arab/standard: [شنبه]}, notes: {en: The Iranian week starts on Saturday; Friday is the weekly day off.}}
- {id: 'sense:chandshanbe', gloss: {en: 'which day of the week?'}, forms: {fa-Arab/standard: [چندشنبه]}, notes: {en: 'Literally ''how-many-shanbe'': the weekdays count up from شنبه.'}}
- {id: 'sense:yekshanbe', gloss: {en: Sunday}, forms: {fa-Arab/standard: [یکشنبه]}}
- {id: 'sense:doshanbe', gloss: {en: Monday}, forms: {fa-Arab/standard: [دوشنبه]}}
- {id: 'sense:seshanbe', gloss: {en: Tuesday}, forms: {fa-Arab/standard: ["سه\u200cشنبه"]}}
- {id: 'sense:chaharshanbe', gloss: {en: Wednesday}, forms: {fa-Arab/standard: [چهارشنبه]}}
- {id: 'sense:panjshanbe', gloss: {en: Thursday}, forms: {fa-Arab/standard: [پنجشنبه]}, notes: {en: "Also written پنج\u200cشنبه."}}
- {id: 'sense:jome', gloss: {en: Friday}, forms: {fa-Arab/standard: [جمعه]}}
- {id: 'sense:tatil', gloss: {en: closed; off (a holiday)}, forms: {fa-Arab/standard: [تعطیل]}}
- {id: 'sense:az', gloss: {en: from; than}, forms: {fa-Arab/standard: [از]}}
- {id: 'sense:ta', gloss: {en: until; to (a time or place)}, forms: {fa-Arab/standard: [تا]}, notes: {en: تا فردا! See you tomorrow!}}
- {id: 'sense:akhar', gloss: {en: end; last}, forms: {fa-Arab/standard: [آخر]}, notes: {en: 'آخرِ هفته: the weekend.'}}
- {id: 'sense:tavallod', gloss: {en: birth; birthday}, forms: {fa-Arab/standard: [تولد, تولدت]}}
- {id: 'sense:mobarak', gloss: {en: blessed; congratulations}, forms: {fa-Arab/standard: [مبارک]}, notes: {en: تولدت مبارک! Happy birthday! عید مبارک! Happy holiday!}}
