# Fixture course (fa), unit 2: family and friends. Possessive -am, the negative copula نیست, -hā and -ān plurals,
# and the ezafe written ـٔ after a silent -e (خانوادهٔ من).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: family
title:
  en: My family
cefr: A1
graphemes:
- {id: 'grapheme:hamze-ezafe', gloss: {en: 'ـٔ: the small hamza that writes the ezafe after a silent -e (خانوادهٔ من)'}, notes: {en: "Also written \u200cی (خانواده\u200cی من), or left out; answers with any of the three are accepted."}}
nodes:
- {id: fa.family.parents, kind: lesson, introduces: ['lexeme:pedar', 'lexeme:madar', 'lexeme:u', 'lexeme:poss-1sg']}
- {id: fa.family.siblings, kind: lesson, introduces: ['lexeme:baradar', 'lexeme:khahar', 'lexeme:ma', 'lexeme:1pl']}
- {id: fa.family.who, kind: lesson, introduces: ['lexeme:kist', 'lexeme:reza', 'lexeme:sara', 'lexeme:an']}
- {id: fa.family.friends, kind: lesson, introduces: ['lexeme:doost', 'lexeme:ham', 'lexeme:hal', 'lexeme:chetor', 'lexeme:pl-an']}
- {id: fa.family.children, kind: lesson, introduces: ['lexeme:pesar', 'lexeme:dokhtar', 'lexeme:bachche', 'lexeme:khanevade', 'grapheme:hamze-ezafe']}
- {id: fa.family.work, kind: lesson, introduces: ['lexeme:daneshju', 'lexeme:moallem', 'lexeme:pezeshk', 'lexeme:agha', 'lexeme:khanom', 'lexeme:mehraban']}
- {id: fa.family.story, kind: story}
