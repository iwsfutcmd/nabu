# Fixture course (fa), unit 2: family and friends. Possessive -am, the negative copula نیست, -hā and -ān plurals,
# and the ezafe written ـٔ after a silent -e (خانوادهٔ من).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: family
title: {en: My family}
cefr: A1
kcs:
- {id: 'sense:pedar', gloss: {en: father}, forms: {fa-Arab/standard: [پدر, پدرم]}, notes: {en: 'Everyday speech also says بابا (bābā), dad.'}}
- {id: 'sense:madar', gloss: {en: mother}, forms: {fa-Arab/standard: [مادر, مادرم]}, notes: {en: 'Everyday speech also says مامان (māmān), mum.'}}
- {id: 'sense:u', gloss: {en: he; she}, forms: {fa-Arab/standard: [او]}, notes: {en: 'Persian has no grammatical gender: او is he or she. Spoken Tehrani often says اون (un).'}}
- {id: 'form:poss-1sg', gloss: {en: '-am: my (joined to a noun)'}, notes: {en: "پدرم (pedar-am) means the same as پدرِ من. After a silent -e it is written \u200cام: خانه\u200cام."}}
- {id: 'sense:baradar', gloss: {en: brother}, forms: {fa-Arab/standard: [برادر, برادرم]}}
- {id: 'sense:khahar', gloss: {en: sister}, forms: {fa-Arab/standard: [خواهر, خواهرم]}, notes: {en: 'The و of خواهر is not pronounced: khāhar.'}}
- {id: 'sense:ma', gloss: {en: we; our (after a noun)}, forms: {fa-Arab/standard: [ما]}}
- {id: 'form:1pl-im', gloss: {en: '-im: we (verb ending; هستیم: we are)'}, forms: {fa-Arab/standard: [هستیم]}}
- {id: 'sense:kist', gloss: {en: 'who is …?'}, forms: {fa-Arab/standard: [کیست]}, notes: {en: 'کی + است. Spoken: کیه (kiye)?'}}
- {id: 'sense:reza', gloss: {en: Reza (a name)}, forms: {fa-Arab/standard: [رضا]}}
- {id: 'sense:sara', gloss: {en: Sara (a name)}, forms: {fa-Arab/standard: [سارا]}}
- {id: 'sense:an', gloss: {en: "that; those (آن\u200cها: they)"}, forms: {fa-Arab/standard: [آن, "آن\u200cها"]}, notes: {en: 'Spoken Tehrani: اون (un), اونا (unā).'}}
- {id: 'sense:doost', gloss: {en: 'friend (also in دوست داشتن: to like)'}, forms: {fa-Arab/standard: [دوست, دوستان]}}
- {id: 'sense:ham', gloss: {en: also; too}, forms: {fa-Arab/standard: [هم]}, notes: {en: 'It follows the word it adds to: سارا هم, Sara too.'}}
- {id: 'sense:nist', gloss: {en: 'is not; am not, are not'}, forms: {fa-Arab/standard: [نیست]}, notes: {en: 'The negative of است and هستم: نیست, نیستم, نیستی, نیستیم, نیستید, نیستند. It also means ''there is no …''.'}}
- {id: 'sense:hal', gloss: {en: 'state; how someone is (حالِ شما: how you are)'}, forms: {fa-Arab/standard: [حال]}}
- {id: 'sense:chetor', gloss: {en: how}, forms: {fa-Arab/standard: [چطور]}, notes: {en: 'Spoken, to a friend: چطوری؟ (chetori?) How are you?'}}
- {id: 'form:plural-an', gloss: {en: '-ān: plural (people and living things)'}, notes: {en: "دوستان (friends) is more formal than دوست\u200cها."}}
- {id: 'sense:pesar', gloss: {en: son; boy}, forms: {fa-Arab/standard: [پسر]}}
- {id: 'sense:dokhtar', gloss: {en: daughter; girl}, forms: {fa-Arab/standard: [دختر]}}
- {id: 'sense:bachche', gloss: {en: child; kid}, forms: {fa-Arab/standard: [بچه, "بچه\u200cها"]}, notes: {en: "بچه\u200cها: children; also a friendly 'guys'."}}
- {id: 'sense:khanevade', gloss: {en: family}, forms: {fa-Arab/standard: [خانواده, خانوادهٔ]}, notes: {en: 'Usually takes a plural verb when it means the people: خانوادهٔ شما خوب هستند؟'}}
- {id: 'grapheme:hamze-ezafe', gloss: {en: 'ـٔ: the small hamza that writes the ezafe after a silent -e (خانوادهٔ من)'}, notes: {en: "Also written \u200cی (خانواده\u200cی من), or left out; answers with any of the three are accepted."}}
- {id: 'sense:daneshju', gloss: {en: (university) student}, forms: {fa-Arab/standard: [دانشجو]}, image: {file: ../images/student.svg, license: CC0-1.0, provenance: {author: 'llm:claude@db6a47561192', status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: "A school pupil is دانش\u200cآموز."}}
- {id: 'sense:moallem', gloss: {en: teacher}, forms: {fa-Arab/standard: [معلم]}, image: {file: ../images/teacher.svg, license: CC0-1.0, provenance: {author: 'llm:claude@ff0d70b80db5', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:pezeshk', gloss: {en: doctor; physician}, forms: {fa-Arab/standard: [پزشک]}, notes: {en: Everyday speech often says دکتر (doktor).}}
- {id: 'sense:agha', gloss: {en: Mr.; sir; gentleman}, forms: {fa-Arab/standard: [آقا]}, notes: {en: 'Before a surname with the ezafe: آقای رضایی. After a first name it is friendly: علی آقا.'}}
- {id: 'sense:khanom', gloss: {en: Mrs.; Ms.; lady}, forms: {fa-Arab/standard: [خانم]}, notes: {en: 'Before a surname: خانمِ احمدی. After a first name it is polite: مریم خانم.'}}
- {id: 'sense:mehraban', gloss: {en: kind}, forms: {fa-Arab/standard: [مهربان]}}
nodes:
- {id: fa.family.parents, kind: lesson, introduces: ['sense:pedar', 'sense:madar', 'sense:u', 'form:poss-1sg']}
- {id: fa.family.siblings, kind: lesson, introduces: ['sense:baradar', 'sense:khahar', 'sense:ma', 'form:1pl-im']}
- {id: fa.family.who, kind: lesson, introduces: ['sense:kist', 'sense:reza', 'sense:sara', 'sense:an']}
- {id: fa.family.friends, kind: lesson, introduces: ['sense:doost', 'sense:ham', 'sense:nist', 'sense:hal', 'sense:chetor', 'form:plural-an']}
- {id: fa.family.children, kind: lesson, introduces: ['sense:pesar', 'sense:dokhtar', 'sense:bachche', 'sense:khanevade', 'grapheme:hamze-ezafe']}
- {id: fa.family.work, kind: lesson, introduces: ['sense:daneshju', 'sense:moallem', 'sense:pezeshk', 'sense:agha', 'sense:khanom', 'sense:mehraban']}
- {id: fa.family.story, kind: story}
sentences:
- id: s.family.1
