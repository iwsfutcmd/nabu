# Fixture course (fa), unit 8: cities, places, transport and directions. The imperative with be- (بروید، بپیچید),
# اهلِ کجا 'where from', and the ezafe on place words (نزدیکِ بانک، سمتِ چپ).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: city
title: {en: In the city}
cefr: A1
kcs:
- {id: 'sense:tehran', gloss: {en: Tehran}, forms: {fa-Arab/standard: [تهران]}, notes: {en: 'Spoken: تهرون (tehrun).'}}
- {id: 'sense:zendegi', gloss: {en: 'life (زندگی کردن: to live)'}, forms: {fa-Arab/standard: [زندگی]}}
- {id: 'sense:shahr', gloss: {en: city; town}, forms: {fa-Arab/standard: [شهر]}}
- {id: 'sense:esfahan', gloss: {en: Isfahan (Esfahan)}, forms: {fa-Arab/standard: [اصفهان]}}
- {id: 'sense:ahl', gloss: {en: 'native of; from (اهلِ کجا؟ where from?)'}, forms: {fa-Arab/standard: [اهل]}}
- {id: 'sense:shiraz', gloss: {en: Shiraz}, forms: {fa-Arab/standard: [شیراز]}}
- {id: 'sense:khiyaban', gloss: {en: street; avenue}, forms: {fa-Arab/standard: [خیابان]}}
- {id: 'sense:bank', gloss: {en: bank}, forms: {fa-Arab/standard: [بانک]}}
- {id: 'sense:restoran', gloss: {en: restaurant}, forms: {fa-Arab/standard: [رستوران]}}
- {id: 'sense:park', gloss: {en: park}, forms: {fa-Arab/standard: [پارک]}}
- {id: 'sense:nazdik', gloss: {en: near; close}, forms: {fa-Arab/standard: [نزدیک]}, notes: {en: 'With a place it takes the ezafe: نزدیکِ بانک, near the bank.'}}
- {id: 'sense:dur', gloss: {en: far}, forms: {fa-Arab/standard: [دور]}}
- {id: 'sense:bebakhshid', gloss: {en: excuse me; sorry}, forms: {fa-Arab/standard: [ببخشید]}, notes: {en: 'Used to get attention and to apologize. Spoken: ببخشین (bebakhshin).'}}
- {id: 'sense:darukhane', gloss: {en: pharmacy; chemist's}, forms: {fa-Arab/standard: [داروخانه]}}
- {id: 'sense:metro', gloss: {en: metro; subway}, forms: {fa-Arab/standard: [مترو]}}
