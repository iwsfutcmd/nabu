stories:
- id: fa.story.metro
  node: fa.city.story
  title: {en: 'Where''s the metro?'}
  provenance: {author: 'llm:claude@83a16c835c32', status: draft}
  characters:
  - {id: ali, name: {fa-Arab/standard: علی}}
  - {id: zahra, name: {fa-Arab/standard: زهرا}}
  steps:
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: ببخشید، خانم!
          tokens: [{surface: ببخشید, sense: bebakhshid}, {surface: خانم, sense: khanom}]
      translations: {en: 'Excuse me, madam!'}
  - line:
      speaker: zahra
      forms:
        fa-Arab/standard:
          text: بله؟
          tokens: [{surface: بله, sense: bale}]
      translations: {en: 'Yes?'}
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: ایستگاهِ مترو کجاست؟
          tokens: [{surface: ایستگاهِ, sense: istgah}, {surface: مترو, sense: metro}, {surface: کجاست, sense: koja, morphs: [{surface: کجا, kc: 'sense:koja'}, {surface: ست, kc: 'sense:budan'}]}]
      translations: {en: 'Where''s the metro station?'}
  - line:
      speaker: zahra
      forms:
        fa-Arab/standard:
          text: نزدیک است. مستقیم بروید، بعد به چپ بپیچید.
          tokens: [{surface: نزدیک, sense: nazdik}, {surface: است, sense: budan}, {surface: مستقیم, sense: mostaghim}, {surface: بروید, sense: raftan, morphs: [{surface: ب, kc: 'form:subj-be'}, {surface: رو, kc: 'sense:raftan'}, {surface: ید, kc: 'form:2pl-id'}]}, {surface: بعد, sense: bad}, {surface: به, sense: be}, {surface: چپ, sense: chap}, {surface: بپیچید, sense: pichidan, morphs: [{surface: ب, kc: 'form:subj-be'}, {surface: پیچ, kc: 'sense:pichidan'}, {surface: ید, kc: 'form:2pl-id'}]}]
      translations: {en: 'It''s close. Go straight ahead, then turn left.'}
  - choose:
      prompt: {en: 'Which way should Ali turn?'}
      options: [{en: left}, {en: right}, {en: He shouldn't turn.}]
      answer: 0
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: خیلی دور است؟
          tokens: [{surface: خیلی, sense: kheyli}, {surface: دور, sense: dur}, {surface: است, sense: budan}]
      translations: {en: 'Is it very far?'}
  - line:
      speaker: zahra
      ask: complete
      gap: sense:daghighe
      distractors: ['sense:ruz', 'sense:saat']
      forms:
        fa-Arab/standard:
          text: نه، ده دقیقه پیاده.
          tokens: [{surface: نه, sense: na, vocalized: نَه}, {surface: ده, sense: dah}, {surface: دقیقه, sense: daghighe}, {surface: پیاده, sense: piyade}]
      translations: {en: 'No, ten minutes on foot.'}
  - line:
      speaker: ali
      forms:
        fa-Arab/standard:
          text: ممنون! شما اهلِ تهران هستید؟
          tokens: [{surface: ممنون, sense: mamnun}, {surface: شما, sense: shoma}, {surface: اهلِ, sense: ahl}, {surface: تهران, sense: tehran}, {surface: هستید, sense: budan, morphs: [{surface: هست, kc: 'sense:budan'}, {surface: ید, kc: 'form:2pl-id'}]}]
      translations: {en: 'Thank you! Are you from Tehran?'}
  - line:
      speaker: zahra
      forms:
        fa-Arab/standard:
          text: نه، من اهلِ اصفهان هستم. اصفهان خیلی قشنگ است!
          tokens: [{surface: نه, sense: na, vocalized: نَه}, {surface: من, sense: man}, {surface: اهلِ, sense: ahl}, {surface: اصفهان, sense: esfahan}, {surface: هستم, sense: budan, morphs: [{surface: هست, kc: 'sense:budan'}, {surface: م, kc: 'form:1sg-am'}]}, {surface: اصفهان, sense: esfahan}, {surface: خیلی, sense: kheyli}, {surface: قشنگ, sense: ghashang}, {surface: است, sense: budan}]
      translations: {en: 'No, I''m from Isfahan. Isfahan is very beautiful!'}
  - line:
      speaker: ali
      ask: arrange
      forms:
        fa-Arab/standard:
          text: من اهلِ شیراز هستم.
          tokens: [{surface: من, sense: man}, {surface: اهلِ, sense: ahl}, {surface: شیراز, sense: shiraz}, {surface: هستم, sense: budan, morphs: [{surface: هست, kc: 'sense:budan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: I'm from Shiraz.}
  - line:
      speaker: zahra
      forms:
        fa-Arab/standard:
          text: شیراز هم خیلی قشنگ است!
          tokens: [{surface: شیراز, sense: shiraz}, {surface: هم, sense: ham}, {surface: خیلی, sense: kheyli}, {surface: قشنگ, sense: ghashang}, {surface: است, sense: budan}]
      translations: {en: Shiraz is very beautiful too!}
  - choose:
      prompt: {en: 'Where is Zahra from?'}
      options: [{en: Isfahan}, {en: Tehran}, {en: Shiraz}]
      answer: 0
scenarios:
- id: fa.directions
  after: fa.city.story
  title: {en: Asking the way}
  setting: {en: A busy street in central Tehran. You are looking for the nearest metro station and a pharmacy.}
  character: {en: 'A shopkeeper standing outside his shop, helpful and happy to give directions.'}
  goal: {en: 'Politely ask where the metro station and a pharmacy are, ask whether they are far, and follow ''straight'', ''left'' and ''right''.'}
  provenance: {author: 'llm:claude@83a16c835c32', status: draft}
