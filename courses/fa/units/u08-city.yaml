- {id: 'sense:taksi', gloss: {en: taxi}, forms: {fa-Arab/standard: [تاکسی]}}
- {id: 'sense:istgah', gloss: {en: station; stop}, forms: {fa-Arab/standard: [ایستگاه]}}
- {id: 'sense:meydan', gloss: {en: square (in a city)}, forms: {fa-Arab/standard: [میدان]}}
- {id: 'sense:piyade', gloss: {en: on foot}, forms: {fa-Arab/standard: [پیاده]}, notes: {en: 'پیاده رفتن: to walk (somewhere).'}}
- {id: 'form:subj-be', gloss: {en: 'be-: imperative and subjunctive (verb prefix)'}, notes: {en: 'بروید: go (polite)! بپیچید: turn! برو: go (to a friend)! The same form follows verbs like ''want'' and ''can''.'}}
- {id: 'sense:mostaghim', gloss: {en: straight (ahead)}, forms: {fa-Arab/standard: [مستقیم]}}
- {id: 'sense:pichidan', gloss: {en: to turn (present stem پیچ-)}, forms: {fa-Arab/standard: [بپیچید]}}
- {id: 'sense:rast', gloss: {en: right (direction); also true}, forms: {fa-Arab/standard: [راست]}}
- {id: 'sense:chap', gloss: {en: left}, forms: {fa-Arab/standard: [چپ]}}
- {id: 'sense:samt', gloss: {en: side; direction}, forms: {fa-Arab/standard: [سمت]}, notes: {en: 'سمتِ چپ: on the left.'}}
- {id: 'sense:bad', gloss: {en: then; after; later}, forms: {fa-Arab/standard: [بعد]}, notes: {en: 'بعد از: after.'}}
