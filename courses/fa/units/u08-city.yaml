# Fixture course (fa), unit 8: cities, places, transport and directions. The imperative with be- (بروید، بپیچید),
# اهلِ کجا 'where from', and the ezafe on place words (نزدیکِ بانک، سمتِ چپ).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: city
title:
  en: In the city
cefr: A1
nodes:
- {id: fa.city.cities, kind: lesson, introduces: ['lexeme:tehran', 'lexeme:zendegi', 'lexeme:shahr', 'lexeme:esfahan', 'lexeme:ahl', 'lexeme:shiraz']}
- {id: fa.city.places, kind: lesson, introduces: ['lexeme:khiyaban', 'lexeme:bank', 'lexeme:restoran', 'lexeme:park', 'lexeme:nazdik']}
- {id: fa.city.asking, kind: lesson, introduces: ['lexeme:dur', 'lexeme:bebakhshid', 'lexeme:darukhane']}
- {id: fa.city.transport, kind: lesson, introduces: ['lexeme:metro', 'lexeme:otobus', 'lexeme:taksi', 'lexeme:istgah', 'lexeme:meydan', 'lexeme:piyade']}
- {id: fa.city.turns, kind: lesson, introduces: ['lexeme:subj', 'lexeme:mostaghim', 'lexeme:pichidan', 'lexeme:rast', 'lexeme:chap']}
- {id: fa.city.directions, kind: lesson, introduces: ['lexeme:samt', 'lexeme:bad']}
- {id: fa.city.story, kind: story}
