# Fixture course (fa), unit 4: tea, food and the table. دوست داشتن 'to like', polite offers (بفرمایید, لطفاً),
# and the ezafe written ی after a final ـا (غذای ایرانی).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: food
title: {en: Tea and food}
cefr: A1
kcs:
- {id: 'sense:chay', gloss: {en: tea}, forms: {fa-Arab/standard: [چای]}, image: {file: ../images/tea.svg, license: CC0-1.0, provenance: {author: 'llm:claude@3715ffdb2952', status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'Served in small glasses, often with sugar cubes (قند).'}}
- {id: 'sense:lotfan', gloss: {en: please}, forms: {fa-Arab/standard: [لطفاً]}, notes: {en: 'The ending -an is written ـاً, with a small mark over the alef.'}}
- {id: 'sense:ba', gloss: {en: 'with; by (bus, metro)'}, forms: {fa-Arab/standard: [با]}}
- {id: 'sense:ghand', gloss: {en: sugar cube; lump sugar}, forms: {fa-Arab/standard: [قند]}, notes: {en: Held in the mouth while sipping tea.}}
- {id: 'sense:befarmayid', gloss: {en: please (go ahead); here you are; come in}, forms: {fa-Arab/standard: [بفرمایید]}, notes: {en: 'The polite word for offering something, inviting someone in, or letting them go first.'}}
- {id: 'sense:ghahve', gloss: {en: coffee}, forms: {fa-Arab/standard: [قهوه]}, image: {file: ../images/coffee.svg, license: CC0-1.0, provenance: {author: 'llm:claude@0b7ee10fe47d', status: draft}, source: Drawn for Nabu (courses/images)}}
- {id: 'sense:ya', gloss: {en: or}, forms: {fa-Arab/standard: [یا]}}
- {id: 'construction:doost-dashtan', gloss: {en: 'دوست داشتن: to like, to love'}, notes: {en: 'Literally ''to hold as a friend'': چای دوست دارم, I like tea. A definite object takes را: این کتاب را دوست دارم.'}}
- {id: 'sense:shir', gloss: {en: milk}, forms: {fa-Arab/standard: [شیر]}, notes: {en: The same word means lion; the context tells.}}
- {id: 'sense:ab', gloss: {en: water}, forms: {fa-Arab/standard: [آب]}}
- {id: 'sense:sard', gloss: {en: cold}, forms: {fa-Arab/standard: [سرد]}}
- {id: 'sense:nan', gloss: {en: bread}, forms: {fa-Arab/standard: [نان]}, notes: {en: 'Spoken Tehrani: نون (nun).'}}
- {id: 'sense:panir', gloss: {en: cheese}, forms: {fa-Arab/standard: [پنیر]}}
- {id: 'sense:sobhane', gloss: {en: breakfast}, forms: {fa-Arab/standard: [صبحانه, صبحانهٔ]}, notes: {en: 'A classic Iranian breakfast: bread, cheese and tea.'}}
- {id: 'sense:mast', gloss: {en: yogurt}, forms: {fa-Arab/standard: [ماست]}}
- {id: 'sense:ghaza', gloss: {en: food; meal}, forms: {fa-Arab/standard: [غذا, غذای]}, notes: {en: 'After a final ـا the ezafe is written ی: غذای ایرانی, Iranian food.'}}
- {id: 'sense:khoshmaze', gloss: {en: delicious; tasty}, forms: {fa-Arab/standard: [خوشمزه]}}
- {id: 'sense:berenj', gloss: {en: rice}, forms: {fa-Arab/standard: [برنج]}, notes: {en: 'Plain steamed rice is چلو (chelow); rice cooked with other ingredients is پلو (polow).'}}
- {id: 'sense:kabab', gloss: {en: kebab}, forms: {fa-Arab/standard: [کباب]}}
- {id: 'sense:morgh', gloss: {en: chicken}, forms: {fa-Arab/standard: [مرغ]}}
- {id: 'sense:irani', gloss: {en: Iranian}, forms: {fa-Arab/standard: [ایرانی]}}
- {id: 'sense:nooshjan', gloss: {en: Enjoy! (to someone eating or drinking)}, forms: {fa-Arab/standard: [نوش جان]}, notes: {en: Literally 'may it nourish your soul'. Also the polite reply when someone thanks you for food.}}
- {id: 'sense:mive', gloss: {en: fruit}, forms: {fa-Arab/standard: [میوه]}}
- {id: 'sense:sib', gloss: {en: apple}, forms: {fa-Arab/standard: [سیب, "سیب\u200cها"]}}
- {id: 'sense:porteghal', gloss: {en: orange}, forms: {fa-Arab/standard: [پرتقال]}}
