- {id: fa.day.work, kind: lesson, introduces: ['lexeme:kar', 'lexeme:kardan', 'lexeme:mi', 'lexeme:daneshgah', 'lexeme:sherkat']}
- {id: fa.day.go, kind: lesson, introduces: ['lexeme:raftan', 'lexeme:be', 'lexeme:amadan', 'lexeme:madrese']}
