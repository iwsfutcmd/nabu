stories:
- id: fa.story.reza-day
  node: fa.day.story
  title: {en: Reza's day}
  provenance: {author: 'llm:claude@83a16c835c32', status: draft}
  characters:
  - {id: maryam, name: {fa-Arab/standard: مریم}}
  - {id: reza, name: {fa-Arab/standard: رضا}}
  steps:
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: "سلام رضا! کجا می\u200cروی؟"
          tokens: [{surface: سلام, sense: salam}, {surface: رضا, sense: reza}, {surface: کجا, sense: koja}, {surface: "می\u200cروی", sense: raftan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: رو, kc: 'sense:raftan'}, {surface: ی, kc: 'form:2sg-i'}]}]
      translations: {en: 'Hi Reza! Where are you going?'}
  - line:
      speaker: reza
      forms:
        fa-Arab/standard:
          text: "سلام! به دانشگاه می\u200cروم."
          tokens: [{surface: سلام, sense: salam}, {surface: به, sense: be}, {surface: دانشگاه, sense: daneshgah}, {surface: "می\u200cروم", sense: raftan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: رو, kc: 'sense:raftan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: Hi! I'm going to the university.}
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: "تو هر روز به دانشگاه می\u200cروی؟"
          tokens: [{surface: تو, sense: to}, {surface: هر, sense: har}, {surface: روز, sense: ruz}, {surface: به, sense: be}, {surface: دانشگاه, sense: daneshgah}, {surface: "می\u200cروی", sense: raftan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: رو, kc: 'sense:raftan'}, {surface: ی, kc: 'form:2sg-i'}]}]
      translations: {en: 'Do you go to the university every day?'}
  - line:
      speaker: reza
      forms:
        fa-Arab/standard:
          text: "بله، من دانشجو هستم. در دانشگاه درس می\u200cخوانم."
          tokens: [{surface: بله, sense: bale}, {surface: من, sense: man}, {surface: دانشجو, sense: daneshju}, {surface: هستم, sense: budan, morphs: [{surface: هست, kc: 'sense:budan'}, {surface: م, kc: 'form:1sg-am'}]}, {surface: در, sense: dar}, {surface: دانشگاه, sense: daneshgah}, {surface: درس, sense: dars}, {surface: "می\u200cخوانم", sense: khandan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خوان, kc: 'sense:khandan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: 'Yes, I''m a student. I study at the university.'}
  - choose:
      prompt: {en: 'Why does Reza go to the university every day?'}
      options: [{en: He's a student there.}, {en: He's a teacher there.}, {en: He works in a company there.}]
      answer: 0
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: "ناهار کجا می\u200cخوری؟"
          tokens: [{surface: ناهار, sense: nahar}, {surface: کجا, sense: koja}, {surface: "می\u200cخوری", sense: khordan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خور, kc: 'sense:khordan'}, {surface: ی, kc: 'form:2sg-i'}]}]
      translations: {en: 'Where do you have lunch?'}
  - line:
      speaker: reza
      ask: complete
      gap: sense:daneshgah
      distractors: ['sense:madrese', 'sense:sherkat']
      forms:
        fa-Arab/standard:
          text: "در دانشگاه ناهار می\u200cخورم."
          tokens: [{surface: در, sense: dar}, {surface: دانشگاه, sense: daneshgah}, {surface: ناهار, sense: nahar}, {surface: "می\u200cخورم", sense: khordan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خور, kc: 'sense:khordan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: I have lunch at the university.}
  - line:
      speaker: maryam
      forms:
        fa-Arab/standard:
          text: "شب کتاب می\u200cخوانی؟"
          tokens: [{surface: شب, sense: shab}, {surface: کتاب, sense: ketab}, {surface: "می\u200cخوانی", sense: khandan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خوان, kc: 'sense:khandan'}, {surface: ی, kc: 'form:2sg-i'}]}]
      translations: {en: 'Do you read in the evening?'}
  - line:
      speaker: reza
      forms:
        fa-Arab/standard:
          text: "بله، شب کتاب می\u200cخوانم و زود می\u200cخوابم."
          tokens: [{surface: بله, sense: bale}, {surface: شب, sense: shab}, {surface: کتاب, sense: ketab}, {surface: "می\u200cخوانم", sense: khandan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خوان, kc: 'sense:khandan'}, {surface: م, kc: 'form:1sg-am'}]}, {surface: و, sense: va}, {surface: زود, sense: zud}, {surface: "می\u200cخوابم", sense: khabidan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خواب, kc: 'sense:khabidan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: 'Yes, I read in the evening and go to bed early.'}
  - line:
      speaker: maryam
      ask: arrange
      forms:
        fa-Arab/standard:
          text: "من همیشه دیر می\u200cخوابم!"
          tokens: [{surface: من, sense: man}, {surface: همیشه, sense: hamishe}, {surface: دیر, sense: dir}, {surface: "می\u200cخوابم", sense: khabidan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خواب, kc: 'sense:khabidan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: I always go to bed late!}
  - line:
      speaker: reza
      forms:
        fa-Arab/standard:
          text: خداحافظ، مریم!
          tokens: [{surface: خداحافظ, sense: khodahafez}, {surface: مریم, sense: maryam}]
      translations: {en: 'Bye, Maryam!'}
  - choose:
      prompt: {en: 'What does Reza do in the evening?'}
      options: [{en: He reads and goes to bed early.}, {en: He works late.}, {en: He has dinner at the university.}]
      answer: 0
