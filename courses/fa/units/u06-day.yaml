          tokens: [{surface: ناهار, lexeme: nahar}, {surface: کجا, lexeme: koja}, {surface: "می\u200cخوری", lexemes: [{lexeme: mi, surface: "می\u200c"}, {lexeme: khordan, surface: خور, base: true, feats: {Tense: Pres}}, {lexeme: 2sg, surface: ی}]}]
      translations:
