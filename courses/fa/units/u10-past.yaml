          tokens: [{surface: سلام, sense: salam}, {surface: با, sense: ba}, {surface: خانواده, sense: khanevade}, {surface: به, sense: be}, {surface: شمال, sense: shomal}, {surface: رفتیم, sense: raftan, morphs: [{surface: رفت, kc: 'sense:raftan'}, {surface: یم, kc: 'form:1pl-im'}]}]
