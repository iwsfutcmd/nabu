# Fixture course (fa), unit 10: the simple past (past stem + ending, no ending for he/she), بود 'was',
# weather and seasons, and talking about a trip (خوش گذشت؟).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: past
title: {en: Last weekend}
cefr: A2
kcs:
- {id: 'sense:bud', gloss: {en: 'was, were (past of ''to be'', stem بود-)'}, forms: {fa-Arab/standard: [بود]}, notes: {en: 'بودم, بودی, بود, بودیم, بودید, بودند.'}}
- {id: 'sense:dirooz', gloss: {en: yesterday}, forms: {fa-Arab/standard: [دیروز]}}
- {id: 'construction:past', gloss: {en: 'the simple past: past stem + ending (رفتم, I went)'}, notes: {en: 'Each verb has a past stem: رفت- (go), آمد- (come), خورد- (eat), کرد- (do), خرید- (buy), دید- (see). He/she has no ending: رفت, he went. The negative adds na-: نرفتم.'}}
- {id: 'sense:film', gloss: {en: film; movie}, forms: {fa-Arab/standard: [فیلم]}}
- {id: 'sense:dishab', gloss: {en: last night}, forms: {fa-Arab/standard: [دیشب]}}
- {id: 'sense:gozashte', gloss: {en: 'last; past (هفتهٔ گذشته: last week)'}, forms: {fa-Arab/standard: [گذشته]}}
- {id: 'sense:hava', gloss: {en: weather; air}, forms: {fa-Arab/standard: [هوا]}, notes: {en: 'هوا چطور است؟ What''s the weather like?'}}
- {id: 'sense:garm', gloss: {en: warm; hot}, forms: {fa-Arab/standard: [گرم]}}
- {id: 'sense:aftabi', gloss: {en: sunny}, forms: {fa-Arab/standard: [آفتابی]}, notes: {en: 'From آفتاب, sunshine.'}}
- {id: 'sense:baran', gloss: {en: rain}, forms: {fa-Arab/standard: [باران]}, notes: {en: "باران می\u200cآید: it's raining (literally 'rain comes')."}}
- {id: 'sense:barf', gloss: {en: snow}, forms: {fa-Arab/standard: [برف]}, notes: {en: "برف می\u200cآید: it's snowing."}}
- {id: 'sense:abri', gloss: {en: cloudy}, forms: {fa-Arab/standard: [ابری]}, notes: {en: 'From ابر, cloud.'}}
- {id: 'sense:bahar', gloss: {en: spring}, forms: {fa-Arab/standard: [بهار]}}
- {id: 'sense:fasl', gloss: {en: season}, forms: {fa-Arab/standard: [فصل]}}
- {id: 'sense:tabestan', gloss: {en: summer}, forms: {fa-Arab/standard: [تابستان]}}
- {id: 'sense:zemestan', gloss: {en: winter}, forms: {fa-Arab/standard: [زمستان]}}
- {id: 'sense:paeez', gloss: {en: autumn; fall}, forms: {fa-Arab/standard: [پاییز]}, notes: {en: Also spelled پائیز.}}
- {id: 'sense:nowruz', gloss: {en: 'Nowruz, the Persian New Year'}, forms: {fa-Arab/standard: [نوروز]}, notes: {en: 'Celebrated at the spring equinox, around 21 March.'}}
- {id: 'sense:shomal', gloss: {en: north}, forms: {fa-Arab/standard: [شمال]}, notes: {en: In Iran 'the north' usually means the green Caspian coast.}}
- {id: 'sense:darya', gloss: {en: sea}, forms: {fa-Arab/standard: [دریا]}}
- {id: 'sense:aks', gloss: {en: photo; picture}, forms: {fa-Arab/standard: [عکس]}}
- {id: 'sense:gereftan', gloss: {en: to take; to get (present stem گیر-)}, forms: {fa-Arab/standard: [گرفتن]}, notes: {en: 'عکس گرفتن: to take a photo.'}}
- {id: 'sense:safar', gloss: {en: trip; journey; travel}, forms: {fa-Arab/standard: [سفر]}}
- {id: 'sense:khosh', gloss: {en: 'pleasant; good (خوش آمدید: welcome)'}, forms: {fa-Arab/standard: [خوش]}}
- {id: 'sense:gozashtan', gloss: {en: to pass (of time) (past stem گذشت-)}, forms: {fa-Arab/standard: [گذشت]}, notes: {en: 'به شما خوش گذشت؟ Did you have a good time? Literally ''did it pass pleasantly for you?'''}}
