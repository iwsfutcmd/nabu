          tokens: [{surface: خیلی, sense: kheyli}, {surface: عکس, sense: aks}, {surface: گرفتی, sense: gereftan, morphs: [{surface: گرفت, kc: 'sense:gereftan'}, {surface: ی, kc: 'form:2sg-i'}]}]
