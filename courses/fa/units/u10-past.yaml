          tokens: [{surface: سلام, sense: salam}, {surface: علی, sense: ali}, {surface: آخرِ, sense: akhar}, {surface: هفته, sense: hafte}, {surface: کجا, sense: koja}, {surface: بودی, sense: bud, morphs: [{surface: بود, kc: 'sense:bud'}, {surface: ی, kc: 'form:2sg-i'}]}]
      translations: {en: 'Hi Ali! Where were you at the weekend?'}
  - line:
