          tokens: [{surface: بله, sense: bale}, {surface: خیلی, sense: kheyli}, {surface: خوش, sense: khosh}, {surface: گذشت, sense: gozashtan}, {surface: کنارِ, sense: kenar}, {surface: دریا, sense: darya}, {surface: بودیم, sense: bud, morphs: [{surface: بود, kc: 'sense:bud'}, {surface: یم, kc: 'form:1pl-im'}]}]
      translations: {en: 'Yes, we had a great time! We were by the sea.'}
  - choose:
      prompt: {en: 'Where was Ali at the weekend?'}
