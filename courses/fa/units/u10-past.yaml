          tokens: [{surface: بله, sense: bale}, {surface: این, sense: in}, {surface: عکسِ, sense: aks}, {surface: دریاست, sense: darya, morphs: [{surface: دریا, kc: 'sense:darya'}, {surface: ست, kc: 'sense:budan'}]}, {surface: ببین, sense: didan, morphs: [{surface: ب, kc: 'form:subj-be'}, {surface: بین, kc: 'sense:didan'}]}]
