stories:
- id: fa.story.shirt
  node: fa.shop.story
  title:
    en: The blue shirt
  provenance:
    author: llm:claude@83a16c835c32
    status: draft
  characters:
  - id: hasan
    name:
      fa-Arab/standard: حسن
  - id: sara
    name:
      fa-Arab/standard: سارا
  steps:
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: "سلام خانم، بفرمایید! چه می\u200cخواهید؟"
          tokens: [{surface: سلام, lexeme: salam}, {surface: خانم, lexeme: khanom}, {surface: بفرمایید, lexeme: befarmayid}, {surface: چه, lexeme: che}, {surface: "می\u200cخواهید", lexemes: [{lexeme: mi, surface: "می\u200c"}, {lexeme: khastan, surface: خواه, base: true}, {lexeme: 2pl, surface: ید}]}]
      translations:
        en: Hello, madam, come in! What would you like?
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: "سلام. یک پیراهن می\u200cخواهم."
          tokens: [{surface: سلام, lexeme: salam}, {surface: یک, lexeme: yek}, {surface: پیراهن, lexeme: pirahan}, {surface: "می\u200cخواهم", lexemes: [{lexeme: mi, surface: "می\u200c"}, {lexeme: khastan, surface: خواه, base: true}, {lexeme: 1sg, surface: م}]}]
      translations:
        en: Hello. I'd like a shirt.
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: چه رنگی دوست دارید؟
          tokens: [{surface: چه, lexeme: che}, {surface: رنگی, lexemes: [{lexeme: rang, surface: رنگ, base: true}, {lexeme: indef, surface: ی}]}, {surface: دوست, lexeme: doost}, {surface: دارید, lexemes: [{lexeme: dashtan, surface: دار, base: true}, {lexeme: 2pl, surface: ید}]}]
      translations:
        en: What colour do you like?
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: آبی یا سبز.
          tokens: [{surface: آبی, lexeme: abi}, {surface: یا, lexeme: ya}, {surface: سبز, lexeme: sabz}]
      translations:
        en: Blue or green.
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: این پیراهنِ آبی خیلی قشنگ است.
          tokens: [{surface: این, lexeme: in}, {surface: پیراهنِ, lexemes: [{lexeme: pirahan, surface: پیراهنِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: آبی, lexeme: abi}, {surface: خیلی, lexeme: kheyli}, {surface: قشنگ, lexeme: ghashang}, {surface: است, lexeme: budan}]
      translations:
        en: This blue shirt is very pretty.
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: بله، قشنگ است. قیمتِ آن چقدر است؟
          tokens: [{surface: بله, lexeme: bale}, {surface: قشنگ, lexeme: ghashang}, {surface: است, lexeme: budan}, {surface: قیمتِ, lexemes: [{lexeme: gheymat, surface: قیمتِ, base: true}, {lexeme: ezafe, surface: ''}]}, {surface: آن, lexeme: an}, {surface: چقدر, lexeme: cheghadr}, {surface: است, lexeme: budan}]
      translations:
        en: Yes, it's pretty. How much is it?
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: صد و پنجاه هزار تومان.
          tokens: [{surface: صد, lexeme: sad}, {surface: و, lexeme: va}, {surface: پنجاه, lexeme: panjah}, {surface: هزار, lexeme: hezar}, {surface: تومان, lexeme: toman}]
      translations:
        en: A hundred and fifty thousand tomans.
  - line:
      speaker: sara
      ask: complete
      gap: lexeme:geran
      distractors:
      - lexeme:ghermez
      - lexeme:sabz
      forms:
        fa-Arab/standard:
          text: "خیلی گران است! تخفیف می\u200cدهید؟"
          tokens: [{surface: خیلی, lexeme: kheyli}, {surface: گران, lexeme: geran}, {surface: است, lexeme: budan}, {surface: تخفیف, lexeme: takhfif}, {surface: "می\u200cدهید", lexemes: [{lexeme: mi, surface: "می\u200c"}, {lexeme: dadan, surface: ده, base: true}, {lexeme: 2pl, surface: ید}]}]
      translations:
        en: That's very expensive! Will you give me a discount?
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: صد و بیست هزار تومان. خوب است؟
          tokens: [{surface: صد, lexeme: sad}, {surface: و, lexeme: va}, {surface: بیست, lexeme: bist}, {surface: هزار, lexeme: hezar}, {surface: تومان, lexeme: toman}, {surface: خوب, lexeme: khub}, {surface: است, lexeme: budan}]
      translations:
        en: A hundred and twenty thousand tomans. Is that OK?
  - choose:
      prompt:
        en: What price does Hasan ask at first?
      options:
      - en: 150,000 tomans
      - en: 120,000 tomans
      - en: 100,000 tomans
      answer: 0
  - line:
      speaker: sara
      ask: arrange
      forms:
        fa-Arab/standard:
          text: "بله، خوب است. این را می\u200cخرم."
          tokens: [{surface: بله, lexeme: bale}, {surface: خوب, lexeme: khub}, {surface: است, lexeme: budan}, {surface: این, lexeme: in}, {surface: را, lexeme: ra}, {surface: "می\u200cخرم", lexemes: [{lexeme: mi, surface: "می\u200c"}, {lexeme: kharidan, surface: خر, base: true}, {lexeme: 1sg, surface: م}]}]
      translations:
        en: Yes, that's fine. I'll take it.
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: ممنون، خانم. خداحافظ!
          tokens: [{surface: ممنون, lexeme: mamnun}, {surface: خانم, lexeme: khanom}, {surface: خداحافظ, lexeme: khodahafez}]
      translations:
        en: Thank you, madam. Goodbye!
  - choose:
      prompt:
        en: What colour is the shirt Sara buys?
      options:
      - en: blue
      - en: green
      - en: black
      answer: 0
scenarios:
- id: fa.bazaar
  after: fa.shop.story
  title:
    en: Bargaining in the bazaar
  setting:
    en: A clothes shop in the Grand Bazaar of Tehran on a busy afternoon. Prices are not fixed.
  character:
    en: Hasan, a cheerful shopkeeper who praises everything and always starts with a high price.
  goal:
    en: Ask for a shirt in a colour you like, ask the price, ask for a discount or something cheaper, and agree on a price or politely say no.
  provenance:
    author: llm:claude@83a16c835c32
    status: draft
