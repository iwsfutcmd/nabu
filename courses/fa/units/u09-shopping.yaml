stories:
- id: fa.story.shirt
  node: fa.shop.story
  title: {en: The blue shirt}
  provenance: {author: 'llm:claude@83a16c835c32', status: draft}
  characters:
  - {id: hasan, name: {fa-Arab/standard: حسن}}
  - {id: sara, name: {fa-Arab/standard: سارا}}
  steps:
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: "سلام خانم، بفرمایید! چه می\u200cخواهید؟"
          tokens: [{surface: سلام, sense: salam}, {surface: خانم, sense: khanom}, {surface: بفرمایید, sense: befarmayid}, {surface: چه, sense: che}, {surface: "می\u200cخواهید", sense: khastan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خواه, kc: 'sense:khastan'}, {surface: ید, kc: 'form:2pl-id'}]}]
      translations: {en: 'Hello, madam, come in! What would you like?'}
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: "سلام. یک پیراهن می\u200cخواهم."
          tokens: [{surface: سلام, sense: salam}, {surface: یک, sense: yek}, {surface: پیراهن, sense: pirahan}, {surface: "می\u200cخواهم", sense: khastan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خواه, kc: 'sense:khastan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: Hello. I'd like a shirt.}
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: چه رنگی دوست دارید؟
          tokens: [{surface: چه, sense: che}, {surface: رنگی, sense: rang, morphs: [{surface: رنگ, kc: 'sense:rang'}, {surface: ی, kc: 'form:indef-i'}]}, {surface: دوست, sense: doost}, {surface: دارید, sense: dashtan, morphs: [{surface: دار, kc: 'sense:dashtan'}, {surface: ید, kc: 'form:2pl-id'}]}]
      translations: {en: 'What colour do you like?'}
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: آبی یا سبز.
          tokens: [{surface: آبی, sense: abi}, {surface: یا, sense: ya}, {surface: سبز, sense: sabz}]
      translations: {en: Blue or green.}
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: این پیراهنِ آبی خیلی قشنگ است.
          tokens: [{surface: این, sense: in}, {surface: پیراهنِ, sense: pirahan}, {surface: آبی, sense: abi}, {surface: خیلی, sense: kheyli}, {surface: قشنگ, sense: ghashang}, {surface: است, sense: budan}]
      translations: {en: This blue shirt is very pretty.}
  - line:
      speaker: sara
      forms:
        fa-Arab/standard:
          text: بله، قشنگ است. قیمتِ آن چقدر است؟
          tokens: [{surface: بله, sense: bale}, {surface: قشنگ, sense: ghashang}, {surface: است, sense: budan}, {surface: قیمتِ, sense: gheymat}, {surface: آن, sense: an}, {surface: چقدر, sense: cheghadr}, {surface: است, sense: budan}]
      translations: {en: 'Yes, it''s pretty. How much is it?'}
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: صد و پنجاه هزار تومان.
          tokens: [{surface: صد, sense: sad}, {surface: و, sense: va}, {surface: پنجاه, sense: panjah}, {surface: هزار, sense: hezar}, {surface: تومان, sense: toman}]
      translations: {en: A hundred and fifty thousand tomans.}
  - line:
      speaker: sara
      ask: complete
      gap: sense:geran
      distractors: ['sense:ghermez', 'sense:sabz']
      forms:
        fa-Arab/standard:
          text: "خیلی گران است! تخفیف می\u200cدهید؟"
          tokens: [{surface: خیلی, sense: kheyli}, {surface: گران, sense: geran}, {surface: است, sense: budan}, {surface: تخفیف, sense: takhfif}, {surface: "می\u200cدهید", sense: dadan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: ده, kc: 'sense:dadan'}, {surface: ید, kc: 'form:2pl-id'}]}]
      translations: {en: 'That''s very expensive! Will you give me a discount?'}
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: صد و بیست هزار تومان. خوب است؟
          tokens: [{surface: صد, sense: sad}, {surface: و, sense: va}, {surface: بیست, sense: bist}, {surface: هزار, sense: hezar}, {surface: تومان, sense: toman}, {surface: خوب, sense: khub}, {surface: است, sense: budan}]
      translations: {en: 'A hundred and twenty thousand tomans. Is that OK?'}
  - choose:
      prompt: {en: 'What price does Hasan ask at first?'}
      options: [{en: '150,000 tomans'}, {en: '120,000 tomans'}, {en: '100,000 tomans'}]
      answer: 0
  - line:
      speaker: sara
      ask: arrange
      forms:
        fa-Arab/standard:
          text: "بله، خوب است. این را می\u200cخرم."
          tokens: [{surface: بله, sense: bale}, {surface: خوب, sense: khub}, {surface: است, sense: budan}, {surface: این, sense: in}, {surface: را, sense: ra}, {surface: "می\u200cخرم", sense: kharidan, morphs: [{surface: "می\u200c", kc: 'form:mi-present'}, {surface: خر, kc: 'sense:kharidan'}, {surface: م, kc: 'form:1sg-am'}]}]
      translations: {en: 'Yes, that''s fine. I''ll take it.'}
  - line:
      speaker: hasan
      forms:
        fa-Arab/standard:
          text: ممنون، خانم. خداحافظ!
          tokens: [{surface: ممنون, sense: mamnun}, {surface: خانم, sense: khanom}, {surface: خداحافظ, sense: khodahafez}]
      translations: {en: 'Thank you, madam. Goodbye!'}
  - choose:
      prompt: {en: 'What colour is the shirt Sara buys?'}
      options: [{en: blue}, {en: green}, {en: black}]
      answer: 0
scenarios:
- id: fa.bazaar
  after: fa.shop.story
  title: {en: Bargaining in the bazaar}
  setting: {en: A clothes shop in the Grand Bazaar of Tehran on a busy afternoon. Prices are not fixed.}
  character: {en: 'Hasan, a cheerful shopkeeper who praises everything and always starts with a high price.'}
  goal: {en: 'Ask for a shirt in a colour you like, ask the price, ask for a discount or something cheaper, and agree on a price or politely say no.'}
  provenance: {author: 'llm:claude@83a16c835c32', status: draft}
