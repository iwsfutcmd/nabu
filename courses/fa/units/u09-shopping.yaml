# Fixture course (fa), unit 9: shopping and bargaining. خواستن 'to want' and توانستن 'can' with the subjunctive
# (mikhāham bekharam, I want to buy), colours, the indefinite -i (چه رنگی؟), and the comparative -tar joined with a ZWNJ.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: shopping
title: {en: Shopping}
cefr: A2
kcs:
- {id: 'sense:khastan', gloss: {en: to want (present stem خواه-)}, forms: {fa-Arab/standard: [خواستن]}, notes: {en: "The و is silent: mikhāham. Spoken Tehrani: می\u200cخوام (mikhām)."}}
- {id: 'sense:che', gloss: {en: what}, forms: {fa-Arab/standard: [چه]}, notes: {en: 'Spoken: چی (chi).'}}
- {id: 'sense:pirahan', gloss: {en: shirt; dress}, forms: {fa-Arab/standard: [پیراهن]}}
- {id: 'sense:kafsh', gloss: {en: shoe; shoes}, forms: {fa-Arab/standard: [کفش]}, notes: {en: A pair of shoes is usually just کفش.}}
- {id: 'sense:lebas', gloss: {en: 'clothes; garment; outfit, dress'}, forms: {fa-Arab/standard: [لباس]}}
- {id: 'sense:kif', gloss: {en: bag; handbag}, forms: {fa-Arab/standard: [کیف]}}
- {id: 'sense:bazar', gloss: {en: bazaar; market}, forms: {fa-Arab/standard: [بازار]}}
- {id: 'sense:kharidan', gloss: {en: to buy (present stem خر-)}, forms: {fa-Arab/standard: [خریدن]}, notes: {en: 'خرید (kharid): shopping; also the past stem.'}}
- {id: 'sense:maghaze', gloss: {en: shop; store}, forms: {fa-Arab/standard: [مغازه]}}
- {id: 'construction:subjunctive', gloss: {en: 'the subjunctive: be- + present stem + ending after ''want'' and ''can'''}, notes: {en: "می\u200cخواهم یک کتاب بخرم: I want to buy a book. می\u200cتوانم ببینم؟ Can I see?"}}
- {id: 'sense:rang', gloss: {en: colour}, forms: {fa-Arab/standard: [رنگ]}}
- {id: 'sense:ghermez', gloss: {en: red}, forms: {fa-Arab/standard: [قرمز]}}
- {id: 'sense:abi', gloss: {en: blue}, forms: {fa-Arab/standard: [آبی]}, notes: {en: 'From آب, water.'}}
- {id: 'sense:sefid', gloss: {en: white}, forms: {fa-Arab/standard: [سفید]}}
- {id: 'sense:siyah', gloss: {en: black}, forms: {fa-Arab/standard: [سیاه]}}
- {id: 'sense:shalvar', gloss: {en: trousers; pants}, forms: {fa-Arab/standard: [شلوار]}}
- {id: 'sense:sabz', gloss: {en: green}, forms: {fa-Arab/standard: [سبز]}}
- {id: 'form:indef-i', gloss: {en: '-i: a, some, any (indefinite ending)'}, notes: {en: 'رنگی: a colour; چه رنگی؟ what colour? On a noun with an adjective it goes on the adjective: شهرِ بزرگی, a big city.'}}
- {id: 'sense:digar', gloss: {en: other; another}, forms: {fa-Arab/standard: [دیگر]}}
- {id: 'sense:didan', gloss: {en: to see (present stem بین-)}, forms: {fa-Arab/standard: [دیدن]}, notes: {en: ببین! Look! See!}}
- {id: 'sense:tavanestan', gloss: {en: can; to be able (present stem توان-)}, forms: {fa-Arab/standard: [توانستن]}, notes: {en: "Followed by the subjunctive: می\u200cتوانم ببینم؟ Can I see?"}}
- {id: 'form:comparative-tar', gloss: {en: '-tar: -er, more (comparative)'}, notes: {en: "Joined with a ZWNJ: گران\u200cتر, more expensive; ارزان\u200cتر, cheaper."}}
- {id: 'sense:dadan', gloss: {en: to give (present stem ده-)}, forms: {fa-Arab/standard: [دادن]}, notes: {en: "Spoken: می\u200cدم (midam), I give."}}
- {id: 'sense:takhfif', gloss: {en: discount}, forms: {fa-Arab/standard: [تخفیف]}}
