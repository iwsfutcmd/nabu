scenarios:
- id: sk.koliba
  after: sk.u06.pozvat
  title:
    en: Ordering at a koliba
  setting:
    en: A koliba, a log-cabin inn in the hills above Žilina, on a Sunday at lunchtime. It is warm inside and smells of smoke and bacon.
  character:
    en: The waitress, a cheerful young woman in a folk-style apron, busy but happy to recommend the halušky.
  goal:
    en: Greet the waitress, order something to eat and something to drink (Dám si …), ask what she recommends, and thank her.
