scenarios:
- id: sk.plany
  after: sk.u19.keby
  title:
    en: Making weekend plans
  setting:
    en: A café in Žilina on a Thursday evening. You and a friend are deciding what to do on Saturday if the weather is good, and what to do if it rains.
  character:
    en: Your friend Tereza, chatty and full of ideas.
  goal:
    en: Say what you would like to do, ask what she would do, and agree on a plan (keby bolo pekne, išli by sme …).
