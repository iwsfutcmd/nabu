scenarios:
- id: sk.cestovka
  after: sk.u18.strany
  title:
    en: Choosing a trip
  setting:
    en: A travel agency in Žilina on a Saturday morning. You want a weekend away and cannot decide between the High Tatras and Bratislava.
  character:
    en: Pani Kováčová, a cheerful travel agent who likes to compare everything.
  goal:
    en: Ask which trip is cheaper and which is nicer, where it is warmer, say what you would rather do, and choose one.
