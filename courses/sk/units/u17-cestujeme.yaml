          tokens: [{surface: Za, lexeme: za}, {surface: starých, lexeme: starý, feats: {Animacy: Inan, Case: Gen, Gender: Masc, Number: Plur}}, {surface: časov, lexeme: čas, feats: {Case: Gen, Number: Plur}},
