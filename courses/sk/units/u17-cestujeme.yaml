scenarios:
- id: sk.vlak
  after: sk.u17.prist
  title:
    en: Buying a train ticket
  setting:
    en: The ticket office at Žilina station on a Friday afternoon. You want to go to Košice for the weekend and back.
  character:
    en: The ticket clerk, a brisk but helpful woman in her forties behind a glass window.
  goal:
    en: Greet her, ask for a ticket to Košice and back (tam a späť), ask when the train leaves and from which platform, pay, and thank her.
