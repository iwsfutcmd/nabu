# Unit 17 (sk): verbs of motion (ísť / chodiť, niesť / nosiť, viezť / voziť; pôjdem), prefixes (prísť, odísť),
# travelling by train; and the first Slovak a learner reads that was not written for learners.
# The story is the start of "Ako šlo vajce na vandrovku" from Pavol Dobšinský's Prostonárodnie slovenské povesti
# (Turčiansky Svätý Martin, 1880-1883; public domain), sent in by J. R. (Kežmarský zábavník) and Miss J. Sz. of
# Banská Bystrica: page 75 of Google's 1881 scan on archive.org (prostonrodniesl01dobgoog), read on the page image,
# from its second paragraph ("Za starých časov išlo teda vajce…", after the tale's opening words to the reader) to
# "Všetko dobré do tretice!". Today's spelling: jim is im; tyže and vyže are written ty že, vy že; „ “ for the
# nested quotation marks; a question mark after "A ty že kde" (the page has none). The words are the tale's: kde
# for kam (where to) and rečie (says) as it has them.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u17
title:
  en: Cestujeme Travelling
cefr: B1
nodes:
- {id: sk.u17.pohyb, kind: lesson, introduces: ['lexeme:chodiť', 'lexeme:každý', 'lexeme:voziť', 'lexeme:viezť', 'lexeme:nosiť', 'lexeme:cestovať']}
- {id: sk.u17.prist, kind: lesson, introduces: ['lexeme:kedy', 'lexeme:prísť', 'lexeme:odísť', 'lexeme:cesta', 'lexeme:dlhý', 'lexeme:poprad']}
- {id: sk.u17.rozpravka, kind: lesson, introduces: ['lexeme:rozprávka', 'lexeme:vandrovka', 'lexeme:rak', 'lexeme:ono', 'lexeme:kačica', 'lexeme:riecť', 'lexeme:teda']}
- {id: sk.u17.slova, kind: lesson, introduces: ['lexeme:veď', 'lexeme:ani', 'lexeme:zlý', 'lexeme:i', 'lexeme:hneď', 'lexeme:smelo', 'lexeme:opytovať-sa', 'lexeme:pristať', 'lexeme:tretica', 'lexeme:že.part']}
- {id: sk.u17.story, kind: story}
