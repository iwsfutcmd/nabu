          tokens: [{surface: Kde, lexeme: kde}, {surface: ty, lexeme: ty, feats: {Case: Nom, Number: Sing}}, {surface: ideš, lexeme: ísť, feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}},
