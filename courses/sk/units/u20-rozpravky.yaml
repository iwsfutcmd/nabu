scenarios:
- id: sk.babka
  after: sk.u20.treba
  title:
    en: Asking for a tale
  setting:
    en: Your grandmother's kitchen in a village near Martin on a winter evening.
  character:
    en: Babka, seventy-eight, who knows many of the tales Dobšinský collected by heart and loves to be asked.
  goal:
    en: Ask her which tale she liked best as a child and who told it to her, ask her to tell it, and say what you would like to hear.
