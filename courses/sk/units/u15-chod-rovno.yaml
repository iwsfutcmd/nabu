scenarios:
- id: sk.stanica
  after: sk.u15.velka-noc
  title:
    en: At the doctor's
  setting:
    en: A paediatrician's surgery in Žilina on a weekday morning. You have brought a child who has a temperature and a sore throat.
  character:
    en: Doktor Baláž, a calm, kind paediatrician in his fifties who speaks formally to parents and gently to children.
  goal:
    en: Greet the doctor politely (with vy), say who you are and who the child is, describe how the child is (Je mu zle, má horúčku), and follow the doctor's instructions (Sadnite si, ľahni si).
