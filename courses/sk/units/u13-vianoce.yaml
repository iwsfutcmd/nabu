scenarios:
- id: sk.trh
  after: sk.u13.rodina
  title:
    en: A Christmas market
  setting:
    en: 'The Christmas market on the main square of Žilina in December: wooden stalls, mulled wine, honey and wooden toys. You want a present for an older relative.'
  character:
    en: A stallholder selling honey, candles and wooden toys, a kind man in his sixties who likes to chat.
  goal:
    en: Greet him, say who the present is for, ask what something costs (Koľko to stojí?), choose a present and thank him.
