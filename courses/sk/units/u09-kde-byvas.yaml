scenarios:
- id: sk.byt
  after: sk.u09.mesiace
  title:
    en: Viewing a flat
  setting:
    en: A flat on the third floor of an old building in the centre of Bratislava, on a weekday afternoon. You are a student looking for somewhere to live.
  character:
    en: The owner, a polite but businesslike man in his sixties, who wants a quiet tenant.
  goal:
    en: Greet him politely (with vy), ask which floor the flat is on, whether there is a lift and a balcony, whether it is expensive, and say whether you want it.
