        chg-Latn/schluessel:
          text: Bir altun ǧurra ǧurraliq tayǧan aldida yatipdur.
          tokens:
          - {surface: Bir, sense: bir}
          - {surface: altun, sense: altun}
          - {surface: ǧurra, sense: ghurra}
          - {surface: ǧurraliq, sense: ghurra, morphs: [{surface: ǧurra, kc: 'sense:ghurra'}, {surface: liq, kc: 'form:liq'}]}
          - {surface: tayǧan, sense: taygan}
          - {surface: aldida, sense: ald, morphs: [{surface: ald, kc: 'sense:ald'}, {surface: i, kc: 'form:poss3'}, {surface: da, kc: 'form:loc'}]}
          - {surface: yatipdur, sense: yat.lie, morphs: [{surface: yat, kc: 'sense:yat.lie'}, {surface: ipdur, kc: 'form:narr'}]}
      translations:
        en: A golden hunting dog with white spots lay before him.
  - choose:
      prompt:
        en: What lay in front of the khan?
      options:
      - en: A spotted hunting dog
      - en: A sleeping Kalmyk
      - en: A golden sword
      answer: 0
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: اول ایکی شر مرد کلیب، روبرولاریده اولتوردیلار.
          tokens:
