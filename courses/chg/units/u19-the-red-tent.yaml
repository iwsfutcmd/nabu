          - {surface: حضرت, sense: hazrat}
          - {surface: مولانا, sense: mawlana}
          - {surface: "کوردی\u200cلار", sense: kor, morphs: [{surface: کور, kc: 'sense:kor'}, {surface: "دی\u200cلار", kc: 'form:past-3pl'}]}
