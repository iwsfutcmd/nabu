        chg-Latn/schluessel:
          text: Yätmiš yättä Qalmaq aldida qol baǧlap uraturadur.
          tokens:
          - {surface: Yätmiš, sense: yatmish}
          - {surface: yättä, sense: yatti}
          - {surface: Qalmaq, sense: qalmaq}
          - {surface: aldida, sense: ald, morphs: [{surface: ald, kc: 'sense:ald'}, {surface: i, kc: 'form:poss3'}, {surface: da, kc: 'form:loc'}]}
          - {surface: qol, sense: qol}
