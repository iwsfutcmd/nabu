stories:
- id: chg.story.the-red-tent
  node: chg.u19.story
  title:
    en: The red tent (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "حضرت مولانا کوردی\u200cلار کم، توغلوق تمور خان دیکان بر قزیل اوی اتیب، اوی\u200cنینک باقشیدا التون کرسیغه… اولتوروب\u200cدور."
          tokens: [{surface: حضرت, lexeme: hazrat, readings: {schluessel: ḥażrat-i}}, {surface: مولانا, lexeme: mawlana, readings: {schluessel: Mawlānā}}, {surface: "کوردی\u200cلار", lexemes: [{lexeme: kor, surface: کور, base: true}, {lexeme: past-3pl, surface: "دی\u200cلار"}], readings: {schluessel: kördilär}}, {surface: کم, lexeme: kim.that, readings: {schluessel: kim}}, {surface: توغلوق, lexeme: tughluq, readings: {schluessel: Tuǧluq}}, {surface: تمور, lexeme: temur, readings: {schluessel: Temür}}, {surface: خان, lexeme: khan, readings: {schluessel: Ḫan}}, {surface: دیکان, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: pcp, surface: کان}], readings: {schluessel: degän}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: قزیل, lexeme: qizil, readings: {schluessel: qizil}}, {surface: اوی, lexeme: oy, readings: {schluessel: öy}}, {surface: اتیب, lexemes: [{lexeme: et, surface: ات, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: etip}}, {surface: "اوی\u200cنینک", lexemes: [{lexeme: oy, surface: "اوی\u200c", base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: öyniŋ}}, {surface: باقشیدا, lexemes: [{lexeme: baqish, surface: باقش, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: baqišida}}, {surface: التون, lexeme: altun, readings: {schluessel: altun}}, {surface: کرسیغه, lexemes: [{lexeme: kursi, surface: کرسی, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: kursīǧa}}, {surface: "اولتوروب\u200cدور", lexemes: [{lexeme: oltur, surface: اولتور, base: true}, {lexeme: narr, surface: "وب\u200cدور"}], readings: {schluessel: olturupdur}}]
      translations:
        en: The Master saw that Tughluq Temür Khan had set up a red tent and sat … on a golden chair in its frame.
  - line:
      forms:
        chg-Arab/standard:
          text: یتمش یته قالماق الدیدا قول باغلاب اوراتورادور.
          tokens: [{surface: یتمش, lexeme: yatmish, readings: {schluessel: yätmiš}}, {surface: یته, lexeme: yatti, readings: {schluessel: yättä}}, {surface: قالماق, lexeme: qalmaq, readings: {schluessel: Qalmaq}}, {surface: الدیدا, lexemes: [{lexeme: ald, surface: الد, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: aldida}}, {surface: قول, lexeme: qol, readings: {schluessel: qol}}, {surface: باغلاب, lexemes: [{lexeme: bagla, surface: باغلا, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: baǧlap}}, {surface: اوراتورادور, lexemes: [{lexeme: uratur, surface: اوراتور, base: true}, {lexeme: pres, surface: ا}, {lexeme: dur, surface: دور}], readings: {schluessel: uraturadur}}]
      translations:
        en: Seventy-seven Kalmyks stood before him with their hands clasped, holding everyone back.
  - line:
      ask: complete
      gap: lexeme:taygan
      distractors:
      - lexeme:qol
      - lexeme:sut
      forms:
        chg-Arab/standard:
          text: "بر التون غره غره\u200cلیق تایغان الدیدا یاتیب\u200cدور."
          tokens: [{surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: التون, lexeme: altun, readings: {schluessel: altun}}, {surface: غره, lexeme: ghurra, readings: {schluessel: ǧurra}}, {surface: "غره\u200cلیق", lexemes: [{lexeme: ghurra, surface: "غره\u200c", base: true}, {lexeme: liq, surface: لیق}], readings: {schluessel: ǧurraliq}}, {surface: تایغان, lexeme: taygan, readings: {schluessel: tayǧan}}, {surface: الدیدا, lexemes: [{lexeme: ald, surface: الد, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: aldida}}, {surface: "یاتیب\u200cدور", lexemes: [{lexeme: yat.lie, surface: یات, base: true}, {lexeme: narr, surface: "یب\u200cدور"}], readings: {schluessel: yatipdur}}]
      translations:
        en: A golden hunting dog with white spots lay before him.
  - choose:
      prompt:
        en: What lay in front of the khan?
      options:
      - en: A spotted hunting dog
      - en: A sleeping Kalmyk
      - en: A golden sword
      answer: 0
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: اول ایکی شر مرد کلیب، روبرولاریده اولتوردیلار.
          tokens: [{surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: ایکی, lexeme: ikki, readings: {schluessel: ikki}}, {surface: شر, lexeme: sharr, readings: {schluessel: šarr}}, {surface: مرد, lexeme: mard, readings: {schluessel: mard}}, {surface: کلیب, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: kelip}}, {surface: روبرولاریده, lexemes: [{lexeme: rubaru, surface: روبرو, base: true}, {lexeme: pl, surface: لار}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: ده}], readings: {schluessel: rū-ba-rūlarida}}, {surface: اولتوردیلار, lexemes: [{lexeme: oltur, surface: اولتور, base: true}, {lexeme: past-3pl, surface: دیلار}], readings: {schluessel: olturdilar}}]
      translations:
        en: Those two grim fellows came in and sat face to face with them.
  - line:
