      ask: complete
      gap: sense:taygan
      distractors:
      - sense:qalmaq
      - sense:rikabdar
      forms:
        chg-Arab/standard:
          text: "بر التون غره غره\u200cلیق تایغان الدیدا یاتیب\u200cدور."
