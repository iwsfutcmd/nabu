          - {surface: توغلوق, sense: tughluq}
          - {surface: تمور, sense: temur}
          - {surface: خان, sense: khan}
          - {surface: دیکان, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: بر, sense: bir}
          - {surface: قزیل, sense: qizil}
          - {surface: اوی, sense: oy}
          - {surface: اتیب, sense: et, morphs: [{surface: ات, kc: 'sense:et'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: "اوی\u200cنینک", sense: oy, morphs: [{surface: "اوی\u200c", kc: 'sense:oy'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: باقشیدا, sense: baqish, morphs: [{surface: باقش, kc: 'sense:baqish'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: التون, sense: altun}
          - {surface: کرسیغه, sense: kursi, morphs: [{surface: کرسی, kc: 'sense:kursi'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: "اولتوروب\u200cدور", sense: oltur, morphs: [{surface: اولتور, kc: 'sense:oltur'}, {surface: "وب\u200cدور", kc: 'form:narr'}]}
        chg-Latn/schluessel:
          text: Ḥażrat-i Mawlānā kördilär kim, Tuǧluq Temür Ḫan degän bir qizil öy etip, öyniŋ baqišida altun kursīǧa… olturupdur.
          tokens:
          - {surface: Ḥażrat-i, sense: hazrat}
          - {surface: Mawlānā, sense: mawlana}
          - {surface: kördilär, sense: kor, morphs: [{surface: kör, kc: 'sense:kor'}, {surface: dilär, kc: 'form:past-3pl'}]}
          - {surface: kim, sense: kim.that}
          - {surface: Tuǧluq, sense: tughluq}
          - {surface: Temür, sense: temur}
          - {surface: Ḫan, sense: khan}
          - {surface: degän, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: gän, kc: 'form:pcp'}]}
          - {surface: bir, sense: bir}
          - {surface: qizil, sense: qizil}
          - {surface: öy, sense: oy}
          - {surface: etip, sense: et, morphs: [{surface: et, kc: 'sense:et'}, {surface: ip, kc: 'form:cv-p'}]}
          - {surface: öyniŋ, sense: oy, morphs: [{surface: öy, kc: 'sense:oy'}, {surface: niŋ, kc: 'form:gen'}]}
          - {surface: baqišida, sense: baqish, morphs: [{surface: baqiš, kc: 'sense:baqish'}, {surface: i, kc: 'form:poss3'}, {surface: da, kc: 'form:loc'}]}
          - {surface: altun, sense: altun}
          - {surface: kursīǧa, sense: kursi, morphs: [{surface: kursī, kc: 'sense:kursi'}, {surface: ǧa, kc: 'form:dat'}]}
          - {surface: olturupdur, sense: oltur, morphs: [{surface: oltur, kc: 'sense:oltur'}, {surface: updur, kc: 'form:narr'}]}
      translations:
        en: The Master saw that Tughluq Temür Khan had set up a red tent and sat … on a golden chair in its frame.
  - line:
      forms:
        chg-Arab/standard:
          text: یتمش یته قالماق الدیدا قول باغلاب اوراتورادور.
          tokens:
          - {surface: یتمش, sense: yatmish}
          - {surface: یته, sense: yatti}
          - {surface: قالماق, sense: qalmaq}
          - {surface: الدیدا, sense: ald, morphs: [{surface: الد, kc: 'sense:ald'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
