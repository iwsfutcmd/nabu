          - {surface: olturdilar, sense: oltur, morphs: [{surface: oltur, kc: 'sense:oltur'}, {surface: dilar, kc: 'form:past-3pl'}]}
      translations:
        en: Those two grim fellows came in and sat face to face with them.
  - line:
      forms:
        chg-Arab/standard:
          text: "رکابدار ایدی، «ای، تورام! منادی\u200cکرلار شبو کشی\u200cلار ایکان. کلدی،» دیدی."
