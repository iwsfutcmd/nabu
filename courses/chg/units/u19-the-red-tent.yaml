scenarios:
- id: chg.the-guard-at-the-tent
  after: chg.u19.face-to-face
  title:
    en: The guard at the tent
  setting:
    en: The khan’s red tent at Moon Lake. Kalmyk guards stand before it with their hands clasped.
  character:
    en: A Kalmyk guard, polite but unbending, who speaks only Turki.
  goal:
    en: Say who you are and why you have come, ask him to let you in, and describe what you can see of the tent.
