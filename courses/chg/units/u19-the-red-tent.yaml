stories:
- id: chg.story.the-red-tent
  node: chg.u19.story
  title:
    en: The red tent (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "حضرت مولانا کوردی\u200cلار کم، توغلوق تمور خان دیکان بر قزیل اوی اتیب، اوی\u200cنینک باقشیدا التون کرسیغه… اولتوروب\u200cدور."
