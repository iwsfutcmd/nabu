# Chaghatay (chg), unit 19: The red tent (The Tadhkira of Jalāl ud-Dīn Katakī, part two).
# The narrative past -ipdur (olturupdur, yatipdur); aldida "before him"; gold and red; seventy; qol baǧla- "to clasp
# one's hands"; the causative uratur- "to hold back"; rū-ba-rū "face to face"; šubu "this very".
# The passage is the anonymous Tadhkira of Jalāl ud-Dīn Katakī (Lund University Library, Jarring Prov. 328,
# 7v:6-10; public domain), as Schluessel (2018, ch. 15) types it; the story leaves out one coarse word (…). The rest
# was drafted by an LLM (provenance llm:…, status draft) and awaits a reviewer.
