# Chaghatay (chg): the Arabo-Persian alphabet as Chaghatay writes it, a script track beside the units (ADR 0088, 0128).
# Eight nodes teach the letters in Schluessel's groups (2018, xi-xxxii: letters that share a shape and differ in their
# dots), reordered so that words can be read from the first node: alif and the be family first, then the letters that
# do not join, then ye. Each node drills words of the course spelled with the letters taught by then, each with its
# Latin spelling in Schluessel's transliteration (its chg-Latn form). Drafted by an LLM (provenance llm:…, status
# draft); awaits a reviewer.
id: abc
title:
  en: The Arabic alphabet
cefr: A1
graphemes:
- {id: 'grapheme:alef', gloss: {en: 'alif: a, ä, ā; at the start of a word, any vowel'}, forms: {chg-Arab/standard: [ا, آ], chg-Latn/schluessel: [a / ä / ā]}, notes: {en: 'In a word, ا is a long ā or an a, ä (tam, bar). At the start of a word it carries whatever vowel comes first: ا alone a or ä, او u, o, ü, ö, ای i, e. آ (alif madda) begins a long ā, or an a (آط aṭ). It does not join the next letter.'}}
- {id: 'grapheme:be', gloss: {en: 'be: b'}, forms: {chg-Arab/standard: [ب], chg-Latn/schluessel: [b]}, notes: {en: One dot below. Scribes also write p with it.}}
- {id: 'grapheme:pe', gloss: {en: 'pe: p'}, forms: {chg-Arab/standard: [پ], chg-Latn/schluessel: [p]}, notes: {en: 'Three dots below: the Persian p. Rare in Chaghatay hands, which often write ب or ف for it.'}}
- {id: 'grapheme:te', gloss: {en: 'te: t'}, forms: {chg-Arab/standard: [ت], chg-Latn/schluessel: [t]}, notes: {en: Two dots above.}}
- {id: 'grapheme:se', gloss: {en: 'se: s̱ (said s)'}, forms: {chg-Arab/standard: [ث], chg-Latn/schluessel: [s̱]}, notes: {en: 'Three dots above: an Arabic letter, said s, in Arabic words only (mis̱l).'}}
- {id: 'grapheme:nun', gloss: {en: 'nun: n'}, forms: {chg-Arab/standard: [ن], chg-Latn/schluessel: [n]}, notes: {en: 'One dot above, a deeper bowl than be or te.'}}
- {id: 'grapheme:waw', gloss: {en: 'waw: w; the vowels u, o, ü, ö, ū'}, forms: {chg-Arab/standard: [و], chg-Latn/schluessel: [w / u / o / ü / ö / ū]}, notes: {en: 'Any rounded vowel, or w (said v): بو bu, کوک kök, سوز söz. o and ö stand only in a word''s first syllable. It does not join the next letter.'}}
- {id: 'grapheme:re', gloss: {en: 're: r'}, forms: {chg-Arab/standard: [ر], chg-Latn/schluessel: [r]}, notes: {en: 'A long, thin stroke with no tooth where it joins. It does not join the next letter.'}}
- {id: 'grapheme:ze', gloss: {en: 'ze: z'}, forms: {chg-Arab/standard: [ز], chg-Latn/schluessel: [z]}, notes: {en: re with a dot. It does not join the next letter.}}
- {id: 'grapheme:zhe', gloss: {en: 'zhe: ž (zh)'}, forms: {chg-Arab/standard: [ژ], chg-Latn/schluessel: [ž]}, notes: {en: 'Very rare: loanwords from Russian and French.'}}
- {id: 'grapheme:dal', gloss: {en: 'dal: d'}, forms: {chg-Arab/standard: [د], chg-Latn/schluessel: [d]}, notes: {en: 'Rounder than re, with a small tooth where it joins. It does not join the next letter.'}}
- {id: 'grapheme:zal', gloss: {en: 'zal: ź (said z)'}, forms: {chg-Arab/standard: [ذ], chg-Latn/schluessel: [ź]}, notes: {en: 'dal with a dot: an Arabic letter, said z (maźkūr).'}}
- {id: 'grapheme:ye', gloss: {en: 'ye: y; the vowels i, e, ī'}, forms: {chg-Arab/standard: [ی], chg-Latn/schluessel: [y / i / e / ī]}, notes: {en: 'Two dots below inside a word; at its end Chaghatay writes it without dots: ی. Also à at the end of some Arabic words (Mūsà).'}}
- {id: 'grapheme:lam', gloss: {en: 'lam: l'}, forms: {chg-Arab/standard: [ل], chg-Latn/schluessel: [l]}, notes: {en: 'A tall stroke that, unlike alif, joins on both sides. lam and alif together make لا.'}}
- {id: 'grapheme:jim', gloss: {en: 'jim: j (and often č)'}, forms: {chg-Arab/standard: [ج], chg-Latn/schluessel: [j / č]}, notes: {en: One dot below the bowl. Scribes write č with it too.}}
- {id: 'grapheme:che', gloss: {en: 'che: č (ch)'}, forms: {chg-Arab/standard: [چ], chg-Latn/schluessel: [č]}, notes: {en: 'Three dots below: the Persian č.'}}
- {id: 'grapheme:he.hoti', gloss: {en: 'ḥe: ḥ (said h)'}, forms: {chg-Arab/standard: [ح], chg-Latn/schluessel: [ḥ]}, notes: {en: 'No dot: an Arabic letter, said h (ḥujra).'}}
- {id: 'grapheme:khe', gloss: {en: 'khe: ḫ (as in Bach)'}, forms: {chg-Arab/standard: [خ], chg-Latn/schluessel: [ḫ]}, notes: {en: 'One dot above the bowl (ḫan, yaḫši).'}}
- {id: 'grapheme:sin', gloss: {en: 'sin: s'}, forms: {chg-Arab/standard: [س], chg-Latn/schluessel: [s]}, notes: {en: 'Three teeth, or a long stroke in a hurried hand.'}}
- {id: 'grapheme:shin', gloss: {en: 'shin: š (sh)'}, forms: {chg-Arab/standard: [ش], chg-Latn/schluessel: [š]}, notes: {en: sin with three dots above.}}
- {id: 'grapheme:sad', gloss: {en: 'ṣad: ṣ (said s)'}, forms: {chg-Arab/standard: [ص], chg-Latn/schluessel: [ṣ]}, notes: {en: 'A loop: an Arabic letter, said s (qaṣaba).'}}
- {id: 'grapheme:zad', gloss: {en: 'żad: ż (said z)'}, forms: {chg-Arab/standard: [ض], chg-Latn/schluessel: [ż]}, notes: {en: 'ṣad with a dot: an Arabic letter, said z (Ramżān).'}}
- {id: 'grapheme:ta.ta', gloss: {en: 'ṭa: ṭ (said t)'}, forms: {chg-Arab/standard: [ط], chg-Latn/schluessel: [ṭ]}, notes: {en: 'A loop with an upright stroke: said t (aṭ "horse", ṭaraf).'}}
- {id: 'grapheme:za.za', gloss: {en: 'ẓa: ẓ (said z)'}, forms: {chg-Arab/standard: [ظ], chg-Latn/schluessel: [ẓ]}, notes: {en: 'ṭa with a dot: said z (lafaẓ).'}}
- {id: 'grapheme:ayn', gloss: {en: 'ʿayn: ʿ'}, forms: {chg-Arab/standard: [ع], chg-Latn/schluessel: [ʿ]}, notes: {en: 'An Arabic letter with no sound of its own in Chaghatay (ʿālim, ʿajab).'}}
- {id: 'grapheme:ghayn', gloss: {en: 'ghayn: ǧ (gh)'}, forms: {chg-Arab/standard: [غ], chg-Latn/schluessel: [ǧ]}, notes: {en: 'ʿayn with a dot: a growl at the back of the throat (taǧ, bāǧ).'}}
- {id: 'grapheme:fe', gloss: {en: 'fe: f (and p, written ṗ)'}, forms: {chg-Arab/standard: [ف], chg-Latn/schluessel: [f / ṗ]}, notes: {en: 'One dot above a round loop. Scribes also write p with it: Schluessel writes that ṗ (ṗādišāh).'}}
- {id: 'grapheme:qaf', gloss: {en: 'qaf: q'}, forms: {chg-Arab/standard: [ق], chg-Latn/schluessel: [q]}, notes: {en: 'Two dots above a deeper loop: a k at the back of the mouth (qand, aq).'}}
- {id: 'grapheme:kaf', gloss: {en: 'kaf: k (and often g)'}, forms: {chg-Arab/standard: [ک], chg-Latn/schluessel: [k / g]}, notes: {en: The scribes write g with it too (کوشت göšt).}}
- {id: 'grapheme:gaf', gloss: {en: 'gaf: g'}, forms: {chg-Arab/standard: [گ], chg-Latn/schluessel: [g]}, notes: {en: 'kaf with a second stroke: the Persian g, rare until late hands.'}}
- {id: 'grapheme:eng', gloss: {en: 'nun-kaf: ŋ (ng, as in singer)'}, forms: {chg-Arab/standard: [نک], chg-Latn/schluessel: [ŋ]}, notes: {en: 'Two letters, n and k, for one sound: چونک čoŋ, مینک miŋ. Some prints write ڭ.'}}
- {id: 'grapheme:mim', gloss: {en: 'mim: m'}, forms: {chg-Arab/standard: [م], chg-Latn/schluessel: [m]}, notes: {en: A small round loop.}}
- {id: 'grapheme:he', gloss: {en: 'he: h; at the end of a word, a or ä'}, forms: {chg-Arab/standard: [ه], chg-Latn/schluessel: [h / a / ä]}, notes: {en: "In a word it is h (شهر šahar). At the end of a Turkic word it is the vowel a or ä (میوه mewä), and the next suffix then stands apart: میوه\u200cسی."}}
