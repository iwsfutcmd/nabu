stories:
- id: chg.story.four-men-and-a-pheasant
  node: chg.u07.story
  title:
    en: 'Four men and a pheasant (Babur, Bāburnāma: Andijan)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: اوی قوشی داغی کوب بولور.
          tokens:
          - {surface: اوی, sense: awi, readings: {schluessel: awī}}
          - {surface: قوشی, sense: qush, readings: {schluessel: quši}, morphs: [{surface: قوش, kc: 'sense:qush'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: داغی, sense: daghi, readings: {schluessel: daǧi}}
          - {surface: کوب, sense: kop, readings: {schluessel: köp}}
          - {surface: بولور, sense: bol, readings: {schluessel: bolur}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ور, kc: 'form:aor'}]}
      translations:
        en: Its game birds are also plentiful.
  - line:
      ask: complete
      gap: sense:semiz
      distractors:
      - sense:kitab
      - sense:bazar
      forms:
        chg-Arab/standard:
          text: قیرغاولی بیحد سیمیز بولور.
          tokens:
          - {surface: قیرغاولی, sense: qirghawul, readings: {schluessel: qirǧawuli}, morphs: [{surface: قیرغاول, kc: 'sense:qirghawul'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: بیحد, sense: behadd, readings: {schluessel: bē-ḥadd}}
          - {surface: سیمیز, sense: semiz, readings: {schluessel: semiz}}
          - {surface: بولور, sense: bol, readings: {schluessel: bolur}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ور, kc: 'form:aor'}]}
      translations:
        en: Its pheasants are endlessly fat.
  - line:
      forms:
        chg-Arab/standard:
          text: "انداق روایت قیلدیلار کیم، بیر قیرغاولنی اشکنه\u200cسی بیله تورت کیشی ییب توکاتا المایدور."
          tokens:
          - {surface: انداق, sense: andaq, readings: {schluessel: andaq}}
          - {surface: روایت, sense: riwayat, readings: {schluessel: riwāyat}}
          - {surface: قیلدیلار, sense: qil, readings: {schluessel: qildilar}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دیلار, kc: 'form:past-3pl'}]}
          - {surface: کیم, sense: kim.that, readings: {schluessel: kim}}
          - {surface: بیر, sense: bir, readings: {schluessel: bir}}
          - {surface: قیرغاولنی, sense: qirghawul, readings: {schluessel: qirǧawulni}, morphs: [{surface: قیرغاول, kc: 'sense:qirghawul'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: "اشکنه\u200cسی", sense: ishkina, readings: {schluessel: iškinasi}, morphs: [{surface: "اشکنه\u200c", kc: 'sense:ishkina'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: بیله, sense: bila, readings: {schluessel: bilä}}
          - {surface: تورت, sense: tort, readings: {schluessel: tört}}
          - {surface: کیشی, sense: kishi, readings: {schluessel: kiši}}
          - {surface: ییب, sense: ye, readings: {schluessel: yep}, morphs: [{surface: یی, kc: 'sense:ye'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: توکاتا, sense: tugat, readings: {schluessel: tügätä}, morphs: [{surface: توکات, kc: 'sense:tugat'}, {surface: ا, kc: 'form:cv-a'}]}
          - {surface: المایدور, sense: al, readings: {schluessel: almaydur}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: مای, kc: 'form:pres-neg'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: They tell that four men cannot finish one pheasant with its stew.
  - choose:
      prompt:
        en: What can four men not finish?
      options:
      - en: One pheasant with its stew
      - en: A sack of pears
      - en: A pot of tea
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "شهری و بازاری\u200cسیدا ترکی بیلماس کیشی یوقتور."
          tokens:
          - {surface: شهری, sense: shahar, readings: {schluessel: šaharī}, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: ی, kc: 'form:nisba'}]}
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: "بازاری\u200cسیدا", sense: bazar, readings: {schluessel: bāzārīsida}, morphs: [{surface: بازار, kc: 'sense:bazar'}, {surface: "ی\u200c", kc: 'form:nisba'}, {surface: سی, kc: 'form:poss3'}, {
                surface: دا, kc: 'form:loc'}]}
          - {surface: ترکی, sense: turki, readings: {schluessel: Turkī}}
          - {surface: بیلماس, sense: bil, readings: {schluessel: bilmäs}, morphs: [{surface: بیل, kc: 'sense:bil'}, {surface: ماس, kc: 'form:aor-neg'}]}
          - {surface: کیشی, sense: kishi, readings: {schluessel: kiši}}
          - {surface: یوقتور, sense: yoq, readings: {schluessel: yoqtur}, morphs: [{surface: یوق, kc: 'sense:yoq'}, {surface: تور, kc: 'form:dur'}]}
      translations:
        en: There is no one in its city or its market who does not know Turki.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "ایلی\u200cنینک لفظی قلم بیله راست\u200cتور."
          tokens:
          - {surface: "ایلی\u200cنینک", sense: el, readings: {schluessel: eliniŋ}, morphs: [{surface: ایل, kc: 'sense:el'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: لفظی, sense: lafaz, readings: {schluessel: lafaẓi}, morphs: [{surface: لفظ, kc: 'sense:lafaz'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: قلم, sense: qalam, readings: {schluessel: qalam}}
          - {surface: بیله, sense: bila, readings: {schluessel: bilä}}
          - {surface: "راست\u200cتور", sense: rast, readings: {schluessel: rāsttur}, morphs: [{surface: "راست\u200c", kc: 'sense:rast'}, {surface: تور, kc: 'form:dur'}]}
      translations:
        en: The people's speech is the same as the written word.
  - choose:
      prompt:
        en: What language do the people of Andijan speak?
      options:
      - en: Turki, as it is written
      - en: Only Persian
      - en: Arabic
      answer: 0
scenarios:
- id: chg.the-hunting-party
  after: chg.u07.and-then
  title:
    en: The hunting party
  setting:
    en: A hunt in the hills above Andijan, about 1500. The falconers have brought back pheasants.
  character:
    en: A cook at the hunting camp, who loves to boast about the local game and speaks only Turki.
  goal:
    en: Ask what birds there are and whether they are fat, say what you ate and drank, and say what you can and cannot finish.
