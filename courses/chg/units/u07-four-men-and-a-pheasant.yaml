# Chaghatay (chg), unit 7: Four men and a pheasant (Babur, Bāburnāma: Andijan).
# The aorist in every person (bilürmän "I know", ičmäsmiz "we do not drink"), and as an adjective (bilmäs kiši
# "someone who does not know"); "can" (-a al-); -p "and then"; -ī "of" (šaharī); riwāyat qil- "to tell".
# The passage is Babur's own text (died 1530; the Hyderabad manuscript, in Beveridge's 1905 facsimile), as
# Schluessel (2018, ch. 11) types it; the rest was drafted by an LLM (provenance llm:…, status draft) and awaits
# a reviewer.
id: u07-four-men-and-a-pheasant
title:
  en: Four men and a pheasant
cefr: A2
kcs:
- id: sense:qush
  gloss:
    en: bird
  forms:
    chg-Arab/standard:
    - قوش
    chg-Latn/schluessel:
    - quš
  image:
    file: ../images/bird.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@chg-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: sense:qirghawul
  gloss:
    en: pheasant
  forms:
    chg-Arab/standard:
    - قیرغاول
    chg-Latn/schluessel:
