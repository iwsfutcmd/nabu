stories:
- id: chg.story.four-men-and-a-pheasant
  node: chg.u07.story
  title:
    en: 'Four men and a pheasant (Babur, Bāburnāma: Andijan)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: اوی قوشی داغی کوب بولور.
          tokens:
          - {surface: اوی, sense: awi}
          - {surface: قوشی, sense: qush, morphs: [{surface: قوش, kc: 'sense:qush'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: داغی, sense: daghi}
          - {surface: کوب, sense: kop}
          - {surface: بولور, sense: bol, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ور, kc: 'form:aor'}]}
        chg-Latn/schluessel:
          text: Awī quši daǧi köp bolur.
          tokens:
          - {surface: Awī, sense: awi}
          - {surface: quši, sense: qush, morphs: [{surface: quš, kc: 'sense:qush'}, {surface: i, kc: 'form:poss3'}]}
          - {surface: daǧi, sense: daghi}
          - {surface: köp, sense: kop}
          - {surface: bolur, sense: bol, morphs: [{surface: bol, kc: 'sense:bol'}, {surface: ur, kc: 'form:aor'}]}
      translations:
        en: Its game birds are also plentiful.
  - line:
      ask: complete
      gap: sense:semiz
      distractors:
      - sense:kichik
      - sense:aq
      forms:
        chg-Arab/standard:
          text: قیرغاولی بیحد سیمیز بولور.
          tokens:
          - {surface: قیرغاولی, sense: qirghawul, morphs: [{surface: قیرغاول, kc: 'sense:qirghawul'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: بیحد, sense: behadd}
          - {surface: سیمیز, sense: semiz}
          - {surface: بولور, sense: bol, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ور, kc: 'form:aor'}]}
        chg-Latn/schluessel:
          text: Qirǧawuli bē-ḥadd semiz bolur.
          tokens:
          - {surface: Qirǧawuli, sense: qirghawul, morphs: [{surface: Qirǧawul, kc: 'sense:qirghawul'}, {surface: i, kc: 'form:poss3'}]}
          - {surface: bē-ḥadd, sense: behadd}
          - {surface: semiz, sense: semiz}
          - {surface: bolur, sense: bol, morphs: [{surface: bol, kc: 'sense:bol'}, {surface: ur, kc: 'form:aor'}]}
      translations:
        en: Its pheasants are endlessly fat.
  - line:
      forms:
        chg-Arab/standard:
          text: "انداق روایت قیلدیلار کیم، بیر قیرغاولنی اشکنه\u200cسی بیله تورت کیشی ییب توکاتا المایدور."
          tokens:
          - {surface: انداق, sense: andaq}
          - {surface: روایت, sense: riwayat}
          - {surface: قیلدیلار, sense: qil, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دیلار, kc: 'form:past-3pl'}]}
          - {surface: کیم, sense: kim.that}
          - {surface: بیر, sense: bir}
          - {surface: قیرغاولنی, sense: qirghawul, morphs: [{surface: قیرغاول, kc: 'sense:qirghawul'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: "اشکنه\u200cسی", sense: ishkina, morphs: [{surface: "اشکنه\u200c", kc: 'sense:ishkina'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: بیله, sense: bila}
          - {surface: تورت, sense: tort}
          - {surface: کیشی, sense: kishi}
          - {surface: ییب, sense: ye, morphs: [{surface: یی, kc: 'sense:ye'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: توکاتا, sense: tugat, morphs: [{surface: توکات, kc: 'sense:tugat'}, {surface: ا, kc: 'form:cv-a'}]}
          - {surface: المایدور, sense: al, morphs: [{surface: ال, kc: 'sense:al'}, {surface: مای, kc: 'form:pres-neg'}, {surface: دور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Andaq riwāyat qildilar kim, bir qirǧawulni iškinasi bilä tört kiši yep tügätä almaydur.
          tokens:
          - {surface: Andaq, sense: andaq}
          - {surface: riwāyat, sense: riwayat}
          - {surface: qildilar, sense: qil, morphs: [{surface: qil, kc: 'sense:qil'}, {surface: dilar, kc: 'form:past-3pl'}]}
          - {surface: kim, sense: kim.that}
          - {surface: bir, sense: bir}
          - {surface: qirǧawulni, sense: qirghawul, morphs: [{surface: qirǧawul, kc: 'sense:qirghawul'}, {surface: ni, kc: 'form:acc'}]}
          - {surface: iškinasi, sense: ishkina, morphs: [{surface: iškina, kc: 'sense:ishkina'}, {surface: si, kc: 'form:poss3'}]}
          - {surface: bilä, sense: bila}
          - {surface: tört, sense: tort}
          - {surface: kiši, sense: kishi}
          - {surface: yep, sense: ye, morphs: [{surface: ye, kc: 'sense:ye'}, {surface: p, kc: 'form:cv-p'}]}
          - {surface: tügätä, sense: tugat, morphs: [{surface: tügät, kc: 'sense:tugat'}, {surface: ä, kc: 'form:cv-a'}]}
          - {surface: almaydur, sense: al, morphs: [{surface: al, kc: 'sense:al'}, {surface: may, kc: 'form:pres-neg'}, {surface: dur, kc: 'form:dur'}]}
      translations:
        en: They tell that four men cannot finish one pheasant with its stew.
  - choose:
      prompt:
        en: What can four men not finish?
      options:
      - en: One pheasant with its stew
      - en: A sack of pears
      - en: A pot of tea
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "شهری و بازاری\u200cسیدا ترکی بیلماس کیشی یوقتور."
          tokens:
          - {surface: شهری, sense: shahar, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: ی, kc: 'form:nisba'}]}
          - {surface: و, sense: wa}
          - {surface: "بازاری\u200cسیدا", sense: bazar, morphs: [{surface: بازار, kc: 'sense:bazar'}, {surface: "ی\u200c", kc: 'form:nisba'}, {surface: سی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: ترکی, sense: turki}
          - {surface: بیلماس, sense: bil, morphs: [{surface: بیل, kc: 'sense:bil'}, {surface: ماس, kc: 'form:aor-neg'}]}
          - {surface: کیشی, sense: kishi}
          - {surface: یوقتور, sense: yoq, morphs: [{surface: یوق, kc: 'sense:yoq'}, {surface: تور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Šaharī wä bāzārīsida Turkī bilmäs kiši yoqtur.
          tokens:
          - {surface: Šaharī, sense: shahar, morphs: [{surface: Šahar, kc: 'sense:shahar'}, {surface: ī, kc: 'form:nisba'}]}
          - {surface: wä, sense: wa}
          - {surface: bāzārīsida, sense: bazar, morphs: [{surface: bāzār, kc: 'sense:bazar'}, {surface: ī, kc: 'form:nisba'}, {surface: si, kc: 'form:poss3'}, {surface: da, kc: 'form:loc'}]}
          - {surface: Turkī, sense: turki}
          - {surface: bilmäs, sense: bil, morphs: [{surface: bil, kc: 'sense:bil'}, {surface: mäs, kc: 'form:aor-neg'}]}
          - {surface: kiši, sense: kishi}
          - {surface: yoqtur, sense: yoq, morphs: [{surface: yoq, kc: 'sense:yoq'}, {surface: tur, kc: 'form:dur'}]}
      translations:
        en: There is no one in its city or its market who does not know Turki.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "ایلی\u200cنینک لفظی قلم بیله راست\u200cتور."
          tokens:
          - {surface: "ایلی\u200cنینک", sense: el, morphs: [{surface: ایل, kc: 'sense:el'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: لفظی, sense: lafaz, morphs: [{surface: لفظ, kc: 'sense:lafaz'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: قلم, sense: qalam}
          - {surface: بیله, sense: bila}
          - {surface: "راست\u200cتور", sense: rast, morphs: [{surface: "راست\u200c", kc: 'sense:rast'}, {surface: تور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Eliniŋ lafaẓi qalam bilä rāsttur.
          tokens:
          - {surface: Eliniŋ, sense: el, morphs: [{surface: El, kc: 'sense:el'}, {surface: i, kc: 'form:poss3'}, {surface: niŋ, kc: 'form:gen'}]}
          - {surface: lafaẓi, sense: lafaz, morphs: [{surface: lafaẓ, kc: 'sense:lafaz'}, {surface: i, kc: 'form:poss3'}]}
          - {surface: qalam, sense: qalam}
          - {surface: bilä, sense: bila}
          - {surface: rāsttur, sense: rast, morphs: [{surface: rāst, kc: 'sense:rast'}, {surface: tur, kc: 'form:dur'}]}
      translations:
        en: The people's speech is the same as the written word.
  - choose:
      prompt:
        en: What language do the people of Andijan speak?
      options:
      - en: Turki, as it is written
      - en: Only Persian
      - en: Arabic
      answer: 0
scenarios:
- id: chg.the-hunting-party
  after: chg.u07.and-then
  title:
    en: The hunting party
  setting:
    en: A hunt in the hills above Andijan, about 1500. The falconers have brought back pheasants.
  character:
    en: A cook at the hunting camp, who loves to boast about the local game and speaks only Turki.
  goal:
    en: Ask what birds there are and whether they are fat, say what you ate and drank, and say what you can and cannot finish.
