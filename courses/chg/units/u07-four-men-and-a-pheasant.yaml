    - سیمیز
    chg-Latn/schluessel:
    - semiz
- id: sense:daghi
  gloss:
    en: also, too
  forms:
    chg-Arab/standard:
    - داغی
    chg-Latn/schluessel:
    - daǧi
- id: sense:awi
  gloss:
    en: for hunting, game (of birds)
  forms:
    chg-Arab/standard:
    - اوی
    chg-Latn/schluessel:
    - awī
  notes:
    en: 'Spelled as öy "house": the context tells them apart.'
- id: sense:behadd
  gloss:
    en: endless; endlessly, beyond measure
  forms:
    chg-Arab/standard:
    - بیحد
    chg-Latn/schluessel:
    - bē-ḥadd
  notes:
    en: The Persian bē- "without" and ḥadd "limit".
- id: sense:oltur
  gloss:
