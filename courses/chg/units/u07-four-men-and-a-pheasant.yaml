- id: form:cv-p
  gloss:
    en: '-p, -ip, -up, -üp: and (then); having done'
  notes:
    en: 'Chaghatay joins sentences with -p, not wä: Bazārǧa barip, nan aldim "I went to the market and bought bread". The last verb carries the tense and the person.'
- id: form:cv-a
  gloss:
    en: '-a, -ä (-y after a vowel): doing; with al-: can'
  notes:
    en: 'yazä alamän "I can write", tügätä almaydur "they cannot finish": the verb in -a, then al- "to take" in any tense.'
- id: form:nisba
  gloss:
    en: '-ī: of, from (on Arabic and Persian words)'
  notes:
    en: šahar "city", šaharī "of the city"; bāzār, bāzārī "of the market".
