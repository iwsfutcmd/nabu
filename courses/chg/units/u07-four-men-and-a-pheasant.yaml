    chg-Latn/schluessel:
    - ye-
- id: sense:tugat
  gloss:
    en: to finish, use up
  forms:
    chg-Arab/standard:
    - توکات-
    chg-Latn/schluessel:
    - tügät-
- id: sense:andaq
  gloss:
    en: so, thus, like that
  forms:
    chg-Arab/standard:
    - انداق
    chg-Latn/schluessel:
    - andaq
- id: sense:riwayat
  gloss:
    en: story, account
  forms:
    chg-Arab/standard:
    - روایت
    chg-Latn/schluessel:
    - riwāyat
  notes:
    en: riwāyat qil- "to tell, relate".
- id: sense:kim.that
  gloss:
    en: that (introducing what is said or told)
  forms:
    chg-Arab/standard:
    - کیم
    chg-Latn/schluessel:
    - kim
  notes:
    en: 'As Persian ke: andaq riwāyat qildilar kim … "they tell that …". kim is also "who?".'
- id: sense:ishkina
  gloss:
    en: stew, soup (Persian eškene)
  forms:
    chg-Arab/standard:
    - اشکنه
    chg-Latn/schluessel:
    - iškina
- id: sense:bila
  gloss:
    en: with; by means of
  forms:
    chg-Arab/standard:
    - بیله
    chg-Latn/schluessel:
    - bilä
- id: sense:lafaz
  gloss:
    en: word, speech
  forms:
    chg-Arab/standard:
    - لفظ
    chg-Latn/schluessel:
    - lafaẓ
- id: sense:qalam
  gloss:
    en: pen; writing
  forms:
    chg-Arab/standard:
    - قلم
    chg-Latn/schluessel:
    - qalam
- id: sense:rast
  gloss:
    en: true, right, straight
  forms:
    chg-Arab/standard:
    - راست
    chg-Latn/schluessel:
    - rāst
- id: form:cv-p
  gloss:
    en: '-p, -ip, -up, -üp: and (then); having done'
  notes:
    en: 'Chaghatay joins sentences with -p, not wä: Bazārǧa barip, nan aldim "I went to the market and bought bread". The last verb carries the tense and the person.'
- id: form:cv-a
  gloss:
    en: '-a, -ä (-y after a vowel): doing; with al-: can'
  notes:
    en: 'yazä alamän "I can write", tügätä almaydur "they cannot finish": the verb in -a, then al- "to take" in any tense.'
- id: form:nisba
  gloss:
    en: '-ī: of, from (on Arabic and Persian words)'
  notes:
    en: šahar "city", šaharī "of the city"; bāzār, bāzārī "of the market".
