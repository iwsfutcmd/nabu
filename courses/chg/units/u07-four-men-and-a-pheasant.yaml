stories:
- id: chg.story.four-men-and-a-pheasant
  node: chg.u07.story
  title:
    en: 'Four men and a pheasant (Babur, Bāburnāma: Andijan)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: اوی قوشی داغی کوب بولور.
          tokens: [{surface: اوی, lexeme: awi, readings: {schluessel: awī}}, {surface: قوشی, lexemes: [{lexeme: qush, surface: قوش, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: quši}}, {surface: داغی, lexeme: daghi, readings: {schluessel: daǧi}}, {surface: کوب, lexeme: kop, readings: {schluessel: köp}}, {surface: بولور, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: aor, surface: ور}], readings: {schluessel: bolur}}]
      translations:
        en: Its game birds are also plentiful.
  - line:
      ask: complete
      gap: lexeme:semiz
      distractors:
      - lexeme:sawuq
      - lexeme:mukhtasar
      forms:
        chg-Arab/standard:
          text: قیرغاولی بیحد سیمیز بولور.
          tokens: [{surface: قیرغاولی, lexemes: [{lexeme: qirghawul, surface: قیرغاول, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: qirǧawuli}}, {surface: بیحد, lexeme: behadd, readings: {schluessel: bē-ḥadd}}, {surface: سیمیز, lexeme: semiz, readings: {schluessel: semiz}}, {surface: بولور, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: aor, surface: ور}], readings: {schluessel: bolur}}]
      translations:
        en: Its pheasants are endlessly fat.
  - line:
      forms:
        chg-Arab/standard:
          text: "انداق روایت قیلدیلار کیم، بیر قیرغاولنی اشکنه\u200cسی بیله تورت کیشی ییب توکاتا المایدور."
          tokens: [{surface: انداق, lexeme: andaq, readings: {schluessel: andaq}}, {surface: روایت, lexeme: riwayat, readings: {schluessel: riwāyat}}, {surface: قیلدیلار, lexemes: [{lexeme: qil, surface: قیل, base: true}, {lexeme: past, surface: دی}, {lexeme: p3pl, surface: لار}], readings: {schluessel: qildilar}}, {surface: کیم, lexeme: kim.that, readings: {schluessel: kim}}, {surface: بیر, lexeme: bir, readings: {schluessel: bir}}, {surface: قیرغاولنی, lexemes: [{lexeme: qirghawul, surface: قیرغاول, base: true}, {lexeme: acc, surface: نی}], readings: {schluessel: qirǧawulni}}, {surface: "اشکنه\u200cسی", lexemes: [{lexeme: ishkina, surface: "اشکنه\u200c", base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: iškinasi}}, {surface: بیله, lexeme: bila, readings: {schluessel: bilä}}, {surface: تورت, lexeme: tort, readings: {schluessel: tört}}, {surface: کیشی, lexeme: kishi, readings: {schluessel: kiši}}, {surface: ییب, lexemes: [{lexeme: ye, surface: یی, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: yep}}, {surface: توکاتا, lexemes: [{lexeme: tugat, surface: توکات, base: true}, {lexeme: cv-a, surface: ا}], readings: {schluessel: tügätä}}, {surface: المایدور, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: pres-neg, surface: مای}, {lexeme: dur, surface: دور}], readings: {schluessel: almaydur}}]
      translations:
        en: They tell that four men cannot finish one pheasant with its stew.
  - choose:
      prompt:
        en: What can four men not finish?
      options:
      - en: One pheasant with its stew
      - en: A sack of pears
      - en: A pot of tea
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "شهری و بازاری\u200cسیدا ترکی بیلماس کیشی یوقتور."
          tokens: [{surface: شهری, lexemes: [{lexeme: shahar, surface: شهر, base: true}, {lexeme: nisba, surface: ی}], readings: {schluessel: šaharī}}, {surface: و, lexeme: wa, readings: {schluessel: wä}}, {surface: "بازاری\u200cسیدا", lexemes: [{lexeme: bazar, surface: بازار, base: true}, {lexeme: nisba, surface: "ی\u200c"}, {lexeme: poss3, surface: سی}, {lexeme: loc, surface: دا}], readings: {schluessel: bāzārīsida}}, {surface: ترکی, lexeme: turki, readings: {schluessel: Turkī}}, {surface: بیلماس, lexemes: [{lexeme: bil, surface: بیل, base: true}, {lexeme: aor-neg, surface: ماس}], readings: {schluessel: bilmäs}}, {surface: کیشی, lexeme: kishi, readings: {schluessel: kiši}}, {surface: یوقتور, lexemes: [{lexeme: yoq, surface: یوق, base: true}, {lexeme: dur, surface: تور}], readings: {schluessel: yoqtur}}]
      translations:
        en: There is no one in its city or its market who does not know Turki.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "ایلی\u200cنینک لفظی قلم بیله راست\u200cتور."
          tokens: [{surface: "ایلی\u200cنینک", lexemes: [{lexeme: el, surface: ایل, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: gen, surface: نینک}], readings: {schluessel: eliniŋ}}, {surface: لفظی, lexemes: [{lexeme: lafaz, surface: لفظ, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: lafaẓi}}, {surface: قلم, lexeme: qalam, readings: {schluessel: qalam}}, {surface: بیله, lexeme: bila, readings: {schluessel: bilä}}, {surface: "راست\u200cتور", lexemes: [{lexeme: rast, surface: "راست\u200c", base: true}, {lexeme: dur, surface: تور}], readings: {schluessel: rāsttur}}]
      translations:
        en: The people's speech is the same as the written word.
  - choose:
      prompt:
        en: What language do the people of Andijan speak?
      options:
      - en: Turki, as it is written
      - en: Only Persian
      - en: Arabic
      answer: 0
scenarios:
- id: chg.the-hunting-party
  after: chg.u07.and-then
  title:
    en: The hunting party
  setting:
    en: A hunt in the hills above Andijan, about 1500. The falconers have brought back pheasants.
  character:
    en: A cook at the hunting camp, who loves to boast about the local game and speaks only Turki.
  goal:
    en: Ask what birds there are and whether they are fat, say what you ate and drank, and say what you can and cannot finish.
