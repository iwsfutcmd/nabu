stories:
- id: chg.story.the-kalmyks-came
  node: chg.u12.story
  title:
    en: The Kalmyks came (Qasim Beg, Events in Ghulja)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "کوب کیشی قاچیب، بلالارینی الیب یماتوغه کلسه، کیمه\u200cجی یوق."
          tokens:
          - {surface: کوب, sense: kop}
          - {surface: کیشی, sense: kishi}
          - {surface: قاچیب, sense: qach, morphs: [{surface: قاچ, kc: 'sense:qach'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: بلالارینی, sense: bala, morphs: [{surface: بلا, kc: 'sense:bala'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: الیب, sense: al, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: یماتوغه, sense: yamatu, morphs: [{surface: یماتو, kc: 'sense:yamatu'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: کلسه, sense: kal, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: سه, kc: 'form:cond'}]}
          - {surface: "کیمه\u200cجی", sense: kema, morphs: [{surface: "کیمه\u200c", kc: 'sense:kema'}, {surface: جی, kc: 'form:ci'}]}
          - {surface: یوق, sense: yoq}
        chg-Latn/schluessel:
          text: Köp kiši qačip, balalarini alip Yamatuǧa kälsä, kemäči yoq.
          tokens:
          - {surface: Köp, sense: kop}
          - {surface: kiši, sense: kishi}
          - {surface: qačip, sense: qach, morphs: [{surface: qač, kc: 'sense:qach'}, {surface: ip, kc: 'form:cv-p'}]}
          - {surface: balalarini, sense: bala, morphs: [{surface: bala, kc: 'sense:bala'}, {surface: lar, kc: 'form:pl'}, {surface: i, kc: 'form:poss3'}, {surface: ni, kc: 'form:acc'}]}
          - {surface: alip, sense: al, morphs: [{surface: al, kc: 'sense:al'}, {surface: ip, kc: 'form:cv-p'}]}
          - {surface: Yamatuǧa, sense: yamatu, morphs: [{surface: Yamatu, kc: 'sense:yamatu'}, {surface: ǧa, kc: 'form:dat'}]}
          - {surface: kälsä, sense: kal, morphs: [{surface: käl, kc: 'sense:kal'}, {surface: sä, kc: 'form:cond'}]}
          - {surface: kemäči, sense: kema, morphs: [{surface: kemä, kc: 'sense:kema'}, {surface: či, kc: 'form:ci'}]}
          - {surface: yoq, sense: yoq}
      translations:
        en: Many people fled, and when they came to Yamatu with their children, there was no ferryman.
  - choose:
      prompt:
        en: Why could the people not cross the river at Yamatu?
      options:
      - en: There was no ferryman.
      - en: The river was frozen.
      - en: The Kalmyks held the ferry.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … توقّوز تراغه بارسه، قالماق یوق.
          tokens:
          - {surface: توقّوز, sense: toqquz}
          - {surface: تراغه, sense: tara, morphs: [{surface: ترا, kc: 'sense:tara'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: بارسه, sense: bar.go, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: سه, kc: 'form:cond'}]}
          - {surface: قالماق, sense: qalmaq}
          - {surface: یوق, sense: yoq}
        chg-Latn/schluessel:
          text: … Toqquz Taraǧa barsa, Qalmaq yoq.
          tokens:
          - {surface: Toqquz, sense: toqquz}
          - {surface: Taraǧa, sense: tara, morphs: [{surface: Tara, kc: 'sense:tara'}, {surface: ǧa, kc: 'form:dat'}]}
          - {surface: barsa, sense: bar.go, morphs: [{surface: bar, kc: 'sense:bar.go'}, {surface: sa, kc: 'form:cond'}]}
          - {surface: Qalmaq, sense: qalmaq}
          - {surface: yoq, sense: yoq}
      translations:
        en: … when they went to Toqquz Tara, there were no Kalmyks.
  - line:
      ask: complete
      gap: sense:khabar
      distractors:
      - sense:lashkar
      - sense:urush
      forms:
        chg-Arab/standard:
          text: "نیلخه\u200cدین خبر کلدی: «کوب قالماق لشکری کلیب، چافان باشین دیکان یرکه توشتی،» دیب…"
          tokens:
          - {surface: "نیلخه\u200cدین", sense: nilkha, morphs: [{surface: "نیلخه\u200c", kc: 'sense:nilkha'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: خبر, sense: khabar}
          - {surface: کلدی, sense: kal, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: دی, kc: 'form:past-3'}]}
          - {surface: کوب, sense: kop}
          - {surface: قالماق, sense: qalmaq}
          - {surface: لشکری, sense: lashkar, morphs: [{surface: لشکر, kc: 'sense:lashkar'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: کلیب, sense: kal, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: چافان, sense: chapan}
          - {surface: باشین, sense: bashin}
          - {surface: دیکان, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: یرکه, sense: yar, morphs: [{surface: یر, kc: 'sense:yar'}, {surface: که, kc: 'form:dat'}]}
          - {surface: توشتی, sense: tush, morphs: [{surface: توش, kc: 'sense:tush'}, {surface: تی, kc: 'form:past-3'}]}
          - {surface: دیب, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ب, kc: 'form:cv-p'}]}
        chg-Latn/schluessel:
          text: 'Nilḫadin ḫabar käldi: “Köp Qalmaq laškari kelip, Čaṗan Bašin degän yärgä tüšti,” dep…'
          tokens:
          - {surface: Nilḫadin, sense: nilkha, morphs: [{surface: Nilḫa, kc: 'sense:nilkha'}, {surface: din, kc: 'form:abl'}]}
          - {surface: ḫabar, sense: khabar}
          - {surface: käldi, sense: kal, morphs: [{surface: käl, kc: 'sense:kal'}, {surface: di, kc: 'form:past-3'}]}
          - {surface: Köp, sense: kop}
          - {surface: Qalmaq, sense: qalmaq}
          - {surface: laškari, sense: lashkar, morphs: [{surface: laškar, kc: 'sense:lashkar'}, {surface: i, kc: 'form:poss3'}]}
          - {surface: kelip, sense: kal, morphs: [{surface: kel, kc: 'sense:kal'}, {surface: ip, kc: 'form:cv-p'}]}
          - {surface: Čaṗan, sense: chapan}
          - {surface: Bašin, sense: bashin}
          - {surface: degän, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: gän, kc: 'form:pcp'}]}
          - {surface: yärgä, sense: yar, morphs: [{surface: yär, kc: 'sense:yar'}, {surface: gä, kc: 'form:dat'}]}
          - {surface: tüšti, sense: tush, morphs: [{surface: tüš, kc: 'sense:tush'}, {surface: ti, kc: 'form:past-3'}]}
          - {surface: dep, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: p, kc: 'form:cv-p'}]}
      translations:
        en: 'News came from Nilkha: “Many Kalmyk soldiers have come and camped at a place called Chapan Bashin.”'
  - line:
      forms:
        chg-Arab/standard:
          text: … تاش دابان دیکان یرده اوچ کون قاتتیق اوروش قیلیب، تورتونجی کونی قالماقلار غلبه قیلمای قاشتی.
          tokens:
          - {surface: تاش, sense: tash}
          - {surface: دابان, sense: daban}
          - {surface: دیکان, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: یرده, sense: yar, morphs: [{surface: یر, kc: 'sense:yar'}, {surface: ده, kc: 'form:loc'}]}
          - {surface: اوچ, sense: uch}
          - {surface: کون, sense: kun}
          - {surface: قاتتیق, sense: qattiq}
          - {surface: اوروش, sense: urush}
          - {surface: قیلیب, sense: qil, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: تورتونجی, sense: tort, morphs: [{surface: تورت, kc: 'sense:tort'}, {surface: ونجی, kc: 'form:ord'}]}
          - {surface: کونی, sense: kun, morphs: [{surface: کون, kc: 'sense:kun'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: قالماقلار, sense: qalmaq, morphs: [{surface: قالماق, kc: 'sense:qalmaq'}, {surface: لار, kc: 'form:pl'}]}
