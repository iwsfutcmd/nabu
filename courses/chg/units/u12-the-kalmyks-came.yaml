stories:
- id: chg.story.the-kalmyks-came
  node: chg.u12.story
  title:
    en: The Kalmyks came (Qasim Beg, Events in Ghulja)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "کوب کیشی قاچیب، بلالارینی الیب یماتوغه کلسه، کیمه\u200cجی یوق."
          tokens: [{surface: کوب, lexeme: kop, readings: {schluessel: köp}}, {surface: کیشی, lexeme: kishi, readings: {schluessel: kiši}}, {surface: قاچیب, lexemes: [{lexeme: qach, surface: قاچ, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: qačip}}, {surface: بلالارینی, lexemes: [{lexeme: bala, surface: بلا, base: true}, {lexeme: pl, surface: لار}, {lexeme: poss3, surface: ی}, {lexeme: acc, surface: نی}], readings: {schluessel: balalarini}}, {surface: الیب, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: alip}}, {surface: یماتوغه, lexemes: [{lexeme: yamatu, surface: یماتو, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: Yamatuǧa}}, {surface: کلسه, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: cond, surface: سه}], readings: {schluessel: kälsä}}, {surface: "کیمه\u200cجی", lexeme: kemachi, readings: {schluessel: kemäči}}, {surface: یوق, lexeme: yoq, readings: {schluessel: yoq}}]
      translations:
        en: Many people fled, and when they came to Yamatu with their children, there was no ferryman.
  - choose:
      prompt:
        en: Why could the people not cross the river at Yamatu?
      options:
      - en: There was no ferryman.
      - en: The river was frozen.
      - en: The Kalmyks held the ferry.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … توقّوز تراغه بارسه، قالماق یوق.
          tokens: [{surface: توقّوز, lexeme: toqquz, readings: {schluessel: toqquz}}, {surface: تراغه, lexemes: [{lexeme: tara, surface: ترا, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: Taraǧa}}, {surface: بارسه, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: cond, surface: سه}], readings: {schluessel: barsa}}, {surface: قالماق, lexeme: qalmaq, readings: {schluessel: Qalmaq}}, {surface: یوق, lexeme: yoq, readings: {schluessel: yoq}}]
      translations:
        en: … when they went to Toqquz Tara, there were no Kalmyks.
  - line:
      ask: complete
      gap: lexeme:khabar
      distractors:
      - lexeme:tash
      - lexeme:darya
      forms:
