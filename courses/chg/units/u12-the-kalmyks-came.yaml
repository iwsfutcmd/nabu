stories:
- id: chg.story.the-kalmyks-came
  node: chg.u12.story
  title:
    en: The Kalmyks came (Qasim Beg, Events in Ghulja)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "کوب کیشی قاچیب، بلالارینی الیب یماتوغه کلسه، کیمه\u200cجی یوق."
          tokens:
          - {surface: کوب, sense: kop, readings: {schluessel: köp}}
          - {surface: کیشی, sense: kishi, readings: {schluessel: kiši}}
          - {surface: قاچیب, sense: qach, readings: {schluessel: qačip}, morphs: [{surface: قاچ, kc: 'sense:qach'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: بلالارینی, sense: bala, readings: {schluessel: balalarini}, morphs: [{surface: بلا, kc: 'sense:bala'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}, {surface: نی,
                kc: 'form:acc'}]}
          - {surface: الیب, sense: al, readings: {schluessel: alip}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: یماتوغه, sense: yamatu, readings: {schluessel: Yamatuǧa}, morphs: [{surface: یماتو, kc: 'sense:yamatu'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: کلسه, sense: kal, readings: {schluessel: kälsä}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: سه, kc: 'form:cond'}]}
          - {surface: "کیمه\u200cجی", sense: kema, readings: {schluessel: kemäči}, morphs: [{surface: "کیمه\u200c", kc: 'sense:kema'}, {surface: جی, kc: 'form:ci'}]}
          - {surface: یوق, sense: yoq, readings: {schluessel: yoq}}
      translations:
        en: Many people fled, and when they came to Yamatu with their children, there was no ferryman.
  - choose:
      prompt:
        en: Why could the people not cross the river at Yamatu?
      options:
      - en: There was no ferryman.
      - en: The river was frozen.
      - en: The Kalmyks held the ferry.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … توقّوز تراغه بارسه، قالماق یوق.
          tokens:
          - {surface: توقّوز, sense: toqquz, readings: {schluessel: toqquz}}
          - {surface: تراغه, sense: tara, readings: {schluessel: Taraǧa}, morphs: [{surface: ترا, kc: 'sense:tara'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: بارسه, sense: bar.go, readings: {schluessel: barsa}, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: سه, kc: 'form:cond'}]}
          - {surface: قالماق, sense: qalmaq, readings: {schluessel: Qalmaq}}
          - {surface: یوق, sense: yoq, readings: {schluessel: yoq}}
      translations:
        en: … when they went to Toqquz Tara, there were no Kalmyks.
  - line:
      ask: complete
      gap: sense:khabar
      distractors:
      - sense:tash
      - sense:darya
      forms:
        chg-Arab/standard:
          text: "نیلخه\u200cدین خبر کلدی: «کوب قالماق لشکری کلیب، چافان باشین دیکان یرکه توشتی،» دیب…"
          tokens:
          - {surface: "نیلخه\u200cدین", sense: nilkha, readings: {schluessel: Nilḫadin}, morphs: [{surface: "نیلخه\u200c", kc: 'sense:nilkha'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: خبر, sense: khabar, readings: {schluessel: ḫabar}}
          - {surface: کلدی, sense: kal, readings: {schluessel: käldi}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: دی, kc: 'form:past-3'}]}
          - {surface: کوب, sense: kop, readings: {schluessel: köp}}
          - {surface: قالماق, sense: qalmaq, readings: {schluessel: Qalmaq}}
          - {surface: لشکری, sense: lashkar, readings: {schluessel: laškari}, morphs: [{surface: لشکر, kc: 'sense:lashkar'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: کلیب, sense: kal, readings: {schluessel: kelip}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: چافان, sense: chapan, readings: {schluessel: Čaṗan}}
          - {surface: باشین, sense: bashin, readings: {schluessel: Bašin}}
          - {surface: دیکان, sense: de, readings: {schluessel: degän}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: یرکه, sense: yar, readings: {schluessel: yärgä}, morphs: [{surface: یر, kc: 'sense:yar'}, {surface: که, kc: 'form:dat'}]}
          - {surface: توشتی, sense: tush, readings: {schluessel: tüšti}, morphs: [{surface: توش, kc: 'sense:tush'}, {surface: تی, kc: 'form:past-3'}]}
          - {surface: دیب, sense: de, readings: {schluessel: dep}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ب, kc: 'form:cv-p'}]}
      translations:
        en: 'News came from Nilkha: “Many Kalmyk soldiers have come and camped at a place called Chapan Bashin.”'
  - line:
      forms:
        chg-Arab/standard:
          text: … تاش دابان دیکان یرده اوچ کون قاتتیق اوروش قیلیب، تورتونجی کونی قالماقلار غلبه قیلمای قاشتی.
          tokens:
          - {surface: تاش, sense: tash, readings: {schluessel: taš}}
          - {surface: دابان, sense: daban, readings: {schluessel: daban}}
          - {surface: دیکان, sense: de, readings: {schluessel: degän}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: یرده, sense: yar, readings: {schluessel: yärdä}, morphs: [{surface: یر, kc: 'sense:yar'}, {surface: ده, kc: 'form:loc'}]}
          - {surface: اوچ, sense: uch, readings: {schluessel: üč}}
          - {surface: کون, sense: kun, readings: {schluessel: kün}}
          - {surface: قاتتیق, sense: qattiq, readings: {schluessel: qattiq}}
          - {surface: اوروش, sense: urush, readings: {schluessel: uruš}}
          - {surface: قیلیب, sense: qil, readings: {schluessel: qilip}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: تورتونجی, sense: tort, readings: {schluessel: törtünči}, morphs: [{surface: تورت, kc: 'sense:tort'}, {surface: ونجی, kc: 'form:ord'}]}
          - {surface: کونی, sense: kun, readings: {schluessel: küni}, morphs: [{surface: کون, kc: 'sense:kun'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: قالماقلار, sense: qalmaq, readings: {schluessel: Qalmaqlar}, morphs: [{surface: قالماق, kc: 'sense:qalmaq'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: غلبه, sense: ghalaba, readings: {schluessel: ǧalaba}}
          - {surface: قیلمای, sense: qil, readings: {schluessel: qilmay}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: مای, kc: 'form:cv-may'}]}
          - {surface: قاشتی, sense: qash, readings: {schluessel: qašti}, morphs: [{surface: قاش, kc: 'sense:qash'}, {surface: تی, kc: 'form:past-3'}]}
      translations:
        en: … at a place called Tash Daban they fought hard for three days, and on the fourth day the Kalmyks fled without winning.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: ایکینچی مراتبه کلمادی.
          tokens:
          - {surface: ایکینچی, sense: ikki, readings: {schluessel: ikkinči}, morphs: [{surface: ایکی, kc: 'sense:ikki'}, {surface: نچی, kc: 'form:ord'}]}
          - {surface: مراتبه, sense: murataba, readings: {schluessel: murātaba}}
          - {surface: کلمادی, sense: kal, readings: {schluessel: kälmädi}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: ما, kc: 'form:neg'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: They did not come a second time.
  - choose:
      prompt:
        en: How did the battle end?
      options:
      - en: The Kalmyks fled on the fourth day and never came back.
      - en: The Kalmyks took Ghulja.
      - en: The sultan fled to Nilkha.
      answer: 0
scenarios:
- id: chg.at-the-ferry
  after: chg.u12.no-ferryman
  title:
    en: At the ferry
  setting:
    en: The bank of the Ili at Yamatu, in the 1860s. You and your family need to cross before the Kalmyks come.
  character:
    en: An old fisherman with a small boat, frightened by the news, who speaks only Turki.
  goal:
    en: Tell him where you came from and what news you have heard, ask whether there is a boat or a ferryman, and ask where the soldiers went.
