# Chaghatay (chg), unit 12: The Kalmyks came (Qasim Beg, A Narrative of Events in Ghulja).
# -sa "when" in a story (kälsä "when they came"); degän yär "a place called"; news and armies; ordinals (törtünči);
# ǧalaba qilmay "without winning"; qaš-, Qasim Beg's spelling of qač-.
# The passage is Qasim Beg's account of the 1860s in the Ili valley (Institute of Oriental Manuscripts, St
# Petersburg, B 4018; public domain), as Schluessel (2018, ch. 9) types it, slightly altered by him; the rest was
# drafted by an LLM (provenance llm:…, status draft) and awaits a reviewer.
