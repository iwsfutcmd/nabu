stories:
- id: chg.story.the-seven-sleepers
  node: chg.u10.story
  title:
    en: The Seven Sleepers (Navai, Tārīḫ-i anbiyā)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: یونان ملکیدا افسوس شهریدا دقیانوس اتلیغ ملک جبّار بار ایرمیش.
          tokens:
          - {surface: یونان, sense: yunan}
