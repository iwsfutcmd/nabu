scenarios:
- id: chg.a-strange-coin
  after: chg.u10.by-gods-command
  title:
    en: A strange coin
  setting:
    en: The bazaar of Ephesus, three hundred years after Decius. A stranger in old clothes wants to buy bread with a very old coin.
  character:
    en: A baker of Ephesus, astonished and suspicious, who speaks only Turki.
  goal:
    en: Tell the baker who you are, where you slept and for how long, who the king was "in your day", and why you were sent to the city.
