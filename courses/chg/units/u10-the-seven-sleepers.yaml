  gloss:
    en: it turns out; (they) were, it seems
  forms:
    chg-Arab/standard:
    - ایکان
    chg-Latn/schluessel:
    - ikän
  notes:
    en: 'ikän says what one has found out: musulmān ikändurlar "they were Muslims, it turned out".'
- id: sense:yunan
