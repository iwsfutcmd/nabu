          - {surface: قویچی, sense: qoy, morphs: [{surface: قوی, kc: 'sense:qoy'}, {surface: چی, kc: 'form:ci'}]}
          - {surface: داغی, sense: daghi}
          - {surface: الارغه, sense: ular, morphs: [{surface: الار, kc: 'sense:ular'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: قوشولوب, sense: qoshul, morphs: [{surface: قوشول, kc: 'sense:qoshul'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: "قویچی\u200cنینک", sense: qoy, morphs: [{surface: قوی, kc: 'sense:qoy'}, {surface: "چی\u200c", kc: 'form:ci'}, {surface: نینک, kc: 'form:gen'}]}
