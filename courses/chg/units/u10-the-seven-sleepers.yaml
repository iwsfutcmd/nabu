          - {surface: هم, sense: ham}
          - {surface: قوشولوب, sense: qoshul, morphs: [{surface: قوشول, kc: 'sense:qoshul'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: رقیم, sense: raqim}
          - {surface: اتلیغ, sense: at.name, morphs: [{surface: ات, kc: 'sense:at.name'}, {surface: لیغ, kc: 'form:liq'}]}
