          - {surface: کرمیشلار, sense: kir, morphs: [{surface: کر, kc: 'sense:kir'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
        chg-Latn/schluessel:
          text: Šaharlaridin qačip… bir qoyčiǧa učrap, qoyči daǧi alarǧa qošulup, qoyčiniŋ iti häm qošulup, Raqīm atliǧ ǧārǧa kirmišlär.
          tokens:
          - {surface: Šaharlaridin, sense: shahar, morphs: [{surface: Šahar, kc: 'sense:shahar'}, {surface: lar, kc: 'form:pl'}, {surface: i, kc: 'form:poss3'}, {surface: din, kc: 'form:abl'}]}
