stories:
- id: chg.story.the-seven-sleepers
  node: chg.u10.story
  title:
    en: The Seven Sleepers (Navai, Tārīḫ-i anbiyā)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: یونان ملکیدا افسوس شهریدا دقیانوس اتلیغ ملک جبّار بار ایرمیش.
          tokens: [{surface: یونان, lexeme: yunan, readings: {schluessel: Yūnān}}, {surface: ملکیدا, lexemes: [{lexeme: mulk, surface: ملک, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: mulkida}}, {surface: افسوس, lexeme: afsus, readings: {schluessel: Afsūs}}, {surface: شهریدا, lexemes: [{lexeme: shahar, surface: شهر, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: šaharida}}, {surface: دقیانوس, lexeme: daqyanus, readings: {schluessel: Daqyānūs}}, {surface: اتلیغ, lexeme: atligh, readings: {schluessel: atliǧ}}, {surface: ملک, lexemes: [{lexeme: malik, surface: ملک, base: true}, {lexeme: ezafe, surface: ''}], readings: {schluessel: malik-i}}, {surface: جبّار, lexeme: jabbar, readings: {schluessel: jabbār}}, {surface: بار, lexeme: bar, readings: {schluessel: bar}}, {surface: ایرمیش, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: mis, surface: میش}], readings: {schluessel: ermiš}}]
      translations:
        en: In the kingdom of Greece, in the city of Ephesus, there was a tyrant king named Decius.
  - line:
      forms:
        chg-Arab/standard:
          text: "و مسلمان ایکان\u200cدورلار."
          tokens: [{surface: و, lexeme: wa, readings: {schluessel: wä}}, {surface: مسلمان, lexeme: musulman, readings: {schluessel: musulmān}}, {surface: "ایکان\u200cدورلار", lexemes: [{lexeme: ikan, surface: "ایکان\u200c", base: true}, {lexeme: dur, surface: دور}, {lexeme: p3pl, surface: لار}], readings: {schluessel: ikändurlar}}]
      translations:
        en: And they were Muslims.
  - choose:
      prompt:
        en: Who were the Companions of the Cave?
      options:
      - en: Muslims in the service of King Decius
      - en: Shepherds from Greece
      - en: Kings of Ephesus
      answer: 0
  - line:
      ask: complete
      gap: lexeme:it
      distractors:
      - lexeme:darwaza
      - lexeme:ishkina
      forms:
        chg-Arab/standard:
          text: "شهرلاریدین قاچیب… بر قویچیغه اوچراب، قویچی داغی الارغه قوشولوب، قویچی\u200cنینک ایتی هم قوشولوب، رقیم اتلیغ غارغه کرمیشلار."
          tokens: [{surface: شهرلاریدین, lexemes: [{lexeme: shahar, surface: شهر, base: true}, {lexeme: pl, surface: لار}, {lexeme: poss3, surface: ی}, {lexeme: abl, surface: دین}], readings: {schluessel: šaharlaridin}}, {surface: قاچیب, lexemes: [{lexeme: qach, surface: قاچ, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: qačip}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: قویچیغه, lexemes: [{lexeme: qoychi, surface: قویچی, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: qoyčiǧa}}, {surface: اوچراب, lexemes: [{lexeme: uchra, surface: اوچرا, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: učrap}}, {surface: قویچی, lexeme: qoychi, readings: {schluessel: qoyči}}, {surface: داغی, lexeme: daghi, readings: {schluessel: daǧi}}, {surface: الارغه, lexemes: [{lexeme: ular, surface: الار, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: alarǧa}}, {surface: قوشولوب, lexemes: [{lexeme: qoshul, surface: قوشول, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: qošulup}}, {surface: "قویچی\u200cنینک", lexemes: [{lexeme: qoychi, surface: "قویچی\u200c", base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: qoyčiniŋ}}, {surface: ایتی, lexemes: [{lexeme: it, surface: ایت, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: iti}}, {surface: هم, lexeme: ham, readings: {schluessel: häm}}, {surface: قوشولوب, lexemes: [{lexeme: qoshul, surface: قوشول, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: qošulup}}, {surface: رقیم, lexeme: raqim, readings: {schluessel: Raqīm}}, {surface: اتلیغ, lexeme: atligh, readings: {schluessel: atliǧ}}, {surface: غارغه, lexemes: [{lexeme: ghar, surface: غار, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: ǧārǧa}}, {surface: کرمیشلار, lexemes: [{lexeme: kir, surface: کر, base: true}, {lexeme: mis, surface: میش}, {lexeme: p3pl, surface: لار}], readings: {schluessel: kirmišlär}}]
      translations:
        en: They fled their city … they met a shepherd, and the shepherd joined them, and the shepherd's dog joined them too, and they went into a cave called Raqim.
  - choose:
      prompt:
        en: Who went into the cave with them?
      options:
      - en: A shepherd and his dog
      - en: The king's soldiers
      - en: No one
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … اوچ یوز توقوز یل اویومیشلار.
          tokens: [{surface: اوچ, lexeme: uch, readings: {schluessel: üč}}, {surface: یوز, lexeme: yuz, readings: {schluessel: yüz}}, {surface: توقوز, lexeme: toqquz, readings: {schluessel: toqquz}}, {surface: یل, lexeme: yil, readings: {schluessel: yil}}, {surface: اویومیشلار, lexemes: [{lexeme: oyu, surface: اویو, base: true}, {lexeme: mis, surface: میش}, {lexeme: p3pl, surface: لار}], readings: {schluessel: oyumišlar}}]
      translations:
        en: … they slept for three hundred and nine years.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: اصحاب کهف تنکری تعالی امری بله اویغانمیشلار.
          tokens: [{surface: اصحاب, lexemes: [{lexeme: ashab, surface: اصحاب, base: true}, {lexeme: ezafe, surface: ''}], readings: {schluessel: aṣḥāb-i}}, {surface: کهف, lexeme: kahf, readings: {schluessel: kahf}}, {surface: تنکری, lexeme: tangri, readings: {schluessel: Täŋri}}, {surface: تعالی, lexeme: taala, readings: {schluessel: taʿālà}}, {surface: امری, lexemes: [{lexeme: amr, surface: امر, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: amri}}, {surface: بله, lexeme: bila, readings: {schluessel: billä}}, {surface: اویغانمیشلار, lexemes: [{lexeme: oyghan, surface: اویغان, base: true}, {lexeme: mis, surface: میش}, {lexeme: p3pl, surface: لار}], readings: {schluessel: oyǧanmišlar}}]
      translations:
        en: By the command of God the Exalted, the Companions of the Cave woke up.
  - line:
      forms:
        chg-Arab/standard:
          text: و تملیخا دیکان رفیقلارین شهرغه یبارمیشلار.
          tokens: [{surface: و, lexeme: wa, readings: {schluessel: wä}}, {surface: تملیخا, lexeme: tamlikha, readings: {schluessel: Tamlīḫā}}, {surface: دیکان, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: pcp, surface: کان}], readings: {schluessel: degän}}, {surface: رفیقلارین, lexemes: [{lexeme: rafiq, surface: رفیق, base: true}, {lexeme: pl, surface: لار}, {lexeme: poss3, surface: ی}, {lexeme: acc, surface: ن}], readings: {schluessel: rafīqlarin}}, {surface: شهرغه, lexemes: [{lexeme: shahar, surface: شهر, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: šaharǧa}}, {surface: یبارمیشلار, lexemes: [{lexeme: yebar, surface: یبار, base: true}, {lexeme: mis, surface: میش}, {lexeme: p3pl, surface: لار}], readings: {schluessel: yebarmišlär}}]
      translations:
        en: And they sent their companion called Tamlikha to the city.
  - choose:
      prompt:
        en: How long did the Sleepers sleep?
      options:
      - en: Three hundred and nine years
      - en: Nine days
      - en: Three years
      answer: 0
scenarios:
- id: chg.a-strange-coin
  after: chg.u10.by-gods-command
  title:
    en: A strange coin
  setting:
    en: The bazaar of Ephesus, three hundred years after Decius. A stranger in old clothes wants to buy bread with a very old coin.
  character:
    en: A baker of Ephesus, astonished and suspicious, who speaks only Turki.
  goal:
    en: Tell the baker who you are, where you slept and for how long, who the king was "in your day", and why you were sent to the city.
