      translations:
        en: They fled their city … they met a shepherd, and the shepherd joined them, and the shepherd's dog joined them too, and they went into a cave called Raqim.
  - choose:
      prompt:
        en: Who went into the cave with them?
      options:
      - en: A shepherd and his dog
      - en: The king's soldiers
      - en: No one
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … اوچ یوز توقوز یل اویومیشلار.
          tokens:
