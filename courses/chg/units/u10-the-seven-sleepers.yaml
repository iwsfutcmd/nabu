stories:
- id: chg.story.the-seven-sleepers
  node: chg.u10.story
  title:
    en: The Seven Sleepers (Navai, Tārīḫ-i anbiyā)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: یونان ملکیدا افسوس شهریدا دقیانوس اتلیغ ملک جبّار بار ایرمیش.
          tokens:
          - {surface: یونان, sense: yunan, readings: {schluessel: Yūnān}}
          - {surface: ملکیدا, sense: mulk, readings: {schluessel: mulkida}, morphs: [{surface: ملک, kc: 'sense:mulk'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: افسوس, sense: afsus, readings: {schluessel: Afsūs}}
          - {surface: شهریدا, sense: shahar, readings: {schluessel: šaharida}, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: دقیانوس, sense: daqyanus, readings: {schluessel: Daqyānūs}}
          - {surface: اتلیغ, sense: at.name, readings: {schluessel: atliǧ}, morphs: [{surface: ات, kc: 'sense:at.name'}, {surface: لیغ, kc: 'form:liq'}]}
          - {surface: ملک, sense: malik, readings: {schluessel: malik-i}}
          - {surface: جبّار, sense: jabbar, readings: {schluessel: jabbār}}
          - {surface: بار, sense: bar, readings: {schluessel: bar}}
          - {surface: ایرمیش, sense: er, readings: {schluessel: ermiš}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: میش, kc: 'form:mis'}]}
      translations:
        en: In the kingdom of Greece, in the city of Ephesus, there was a tyrant king named Decius.
  - line:
      forms:
        chg-Arab/standard:
          text: "و مسلمان ایکان\u200cدورلار."
          tokens:
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: مسلمان, sense: musulman, readings: {schluessel: musulmān}}
          - {surface: "ایکان\u200cدورلار", sense: ikan, readings: {schluessel: ikändurlar}, morphs: [{surface: "ایکان\u200c", kc: 'sense:ikan'}, {surface: دور, kc: 'form:dur'}, {surface: لار, kc: 'form:p3pl'}]}
      translations:
        en: And they were Muslims.
  - choose:
      prompt:
        en: Who were the Companions of the Cave?
      options:
      - en: Muslims in the service of King Decius
      - en: Shepherds from Greece
      - en: Kings of Ephesus
      answer: 0
  - line:
      ask: complete
      gap: sense:it
      distractors:
      - sense:at
      - sense:qush
      forms:
        chg-Arab/standard:
          text: "شهرلاریدین قاچیب… بر قویچیغه اوچراب، قویچی داغی الارغه قوشولوب، قویچی\u200cنینک ایتی هم قوشولوب، رقیم اتلیغ غارغه کرمیشلار."
          tokens:
          - {surface: شهرلاریدین, sense: shahar, readings: {schluessel: šaharlaridin}, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}, {surface: دین,
                kc: 'form:abl'}]}
          - {surface: قاچیب, sense: qach, readings: {schluessel: qačip}, morphs: [{surface: قاچ, kc: 'sense:qach'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: قویچیغه, sense: qoy, readings: {schluessel: qoyčiǧa}, morphs: [{surface: قوی, kc: 'sense:qoy'}, {surface: چی, kc: 'form:ci'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: اوچراب, sense: uchra, readings: {schluessel: učrap}, morphs: [{surface: اوچرا, kc: 'sense:uchra'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: قویچی, sense: qoy, readings: {schluessel: qoyči}, morphs: [{surface: قوی, kc: 'sense:qoy'}, {surface: چی, kc: 'form:ci'}]}
          - {surface: داغی, sense: daghi, readings: {schluessel: daǧi}}
          - {surface: الارغه, sense: ular, readings: {schluessel: alarǧa}, morphs: [{surface: الار, kc: 'sense:ular'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: قوشولوب, sense: qoshul, readings: {schluessel: qošulup}, morphs: [{surface: قوشول, kc: 'sense:qoshul'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: "قویچی\u200cنینک", sense: qoy, readings: {schluessel: qoyčiniŋ}, morphs: [{surface: قوی, kc: 'sense:qoy'}, {surface: "چی\u200c", kc: 'form:ci'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: ایتی, sense: it, readings: {schluessel: iti}, morphs: [{surface: ایت, kc: 'sense:it'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: هم, sense: ham, readings: {schluessel: häm}}
          - {surface: قوشولوب, sense: qoshul, readings: {schluessel: qošulup}, morphs: [{surface: قوشول, kc: 'sense:qoshul'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: رقیم, sense: raqim, readings: {schluessel: Raqīm}}
          - {surface: اتلیغ, sense: at.name, readings: {schluessel: atliǧ}, morphs: [{surface: ات, kc: 'sense:at.name'}, {surface: لیغ, kc: 'form:liq'}]}
          - {surface: غارغه, sense: ghar, readings: {schluessel: ǧārǧa}, morphs: [{surface: غار, kc: 'sense:ghar'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: کرمیشلار, sense: kir, readings: {schluessel: kirmišlär}, morphs: [{surface: کر, kc: 'sense:kir'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
      translations:
        en: They fled their city … they met a shepherd, and the shepherd joined them, and the shepherd's dog joined them too, and they went into a cave called Raqim.
  - choose:
      prompt:
        en: Who went into the cave with them?
      options:
      - en: A shepherd and his dog
      - en: The king's soldiers
      - en: No one
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … اوچ یوز توقوز یل اویومیشلار.
          tokens:
          - {surface: اوچ, sense: uch, readings: {schluessel: üč}}
          - {surface: یوز, sense: yuz, readings: {schluessel: yüz}}
          - {surface: توقوز, sense: toqquz, readings: {schluessel: toqquz}}
          - {surface: یل, sense: yil, readings: {schluessel: yil}}
          - {surface: اویومیشلار, sense: oyu, readings: {schluessel: oyumišlar}, morphs: [{surface: اویو, kc: 'sense:oyu'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
      translations:
        en: … they slept for three hundred and nine years.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: اصحاب کهف تنکری تعالی امری بله اویغانمیشلار.
          tokens:
          - {surface: اصحاب, sense: ashab, readings: {schluessel: aṣḥāb-i}}
          - {surface: کهف, sense: kahf, readings: {schluessel: kahf}}
          - {surface: تنکری, sense: tangri, readings: {schluessel: Täŋri}}
          - {surface: تعالی, sense: taala, readings: {schluessel: taʿālà}}
          - {surface: امری, sense: amr, readings: {schluessel: amri}, morphs: [{surface: امر, kc: 'sense:amr'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: بله, sense: bila, readings: {schluessel: billä}}
          - {surface: اویغانمیشلار, sense: oyghan, readings: {schluessel: oyǧanmišlar}, morphs: [{surface: اویغان, kc: 'sense:oyghan'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
      translations:
        en: By the command of God the Exalted, the Companions of the Cave woke up.
  - line:
      forms:
        chg-Arab/standard:
          text: و تملیخا دیکان رفیقلارین شهرغه یبارمیشلار.
          tokens:
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: تملیخا, sense: tamlikha, readings: {schluessel: Tamlīḫā}}
          - {surface: دیکان, sense: de, readings: {schluessel: degän}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: رفیقلارین, sense: rafiq, readings: {schluessel: rafīqlarin}, morphs: [{surface: رفیق, kc: 'sense:rafiq'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}, {surface: ن,
                kc: 'form:acc'}]}
          - {surface: شهرغه, sense: shahar, readings: {schluessel: šaharǧa}, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: یبارمیشلار, sense: yebar, readings: {schluessel: yebarmišlär}, morphs: [{surface: یبار, kc: 'sense:yebar'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
      translations:
        en: And they sent their companion called Tamlikha to the city.
  - choose:
      prompt:
        en: How long did the Sleepers sleep?
      options:
      - en: Three hundred and nine years
      - en: Nine days
      - en: Three years
      answer: 0
scenarios:
- id: chg.a-strange-coin
  after: chg.u10.by-gods-command
  title:
    en: A strange coin
  setting:
    en: The bazaar of Ephesus, three hundred years after Decius. A stranger in old clothes wants to buy bread with a very old coin.
  character:
    en: A baker of Ephesus, astonished and suspicious, who speaks only Turki.
  goal:
    en: Tell the baker who you are, where you slept and for how long, who the king was "in your day", and why you were sent to the city.
