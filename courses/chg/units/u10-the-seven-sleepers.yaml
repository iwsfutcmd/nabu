          - {surface: بار, sense: bar}
          - {surface: ایرمیش, sense: er, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: میش, kc: 'form:mis'}]}
        chg-Latn/schluessel:
          text: Yūnān mulkida Afsūs šaharida Daqyānūs atliǧ malik-i jabbār bar ermiš.
          tokens:
          - {surface: Yūnān, sense: yunan}
          - {surface: mulkida, sense: mulk, morphs: [{surface: mulk, kc: 'sense:mulk'}, {surface: i, kc: 'form:poss3'}, {surface: da, kc: 'form:loc'}]}
          - {surface: Afsūs, sense: afsus}
          - {surface: šaharida, sense: shahar, morphs: [{surface: šahar, kc: 'sense:shahar'}, {surface: i, kc: 'form:poss3'}, {surface: da, kc: 'form:loc'}]}
          - {surface: Daqyānūs, sense: daqyanus}
          - {surface: atliǧ, sense: at.name, morphs: [{surface: at, kc: 'sense:at.name'}, {surface: liǧ, kc: 'form:liq'}]}
          - {surface: malik-i, sense: malik}
          - {surface: jabbār, sense: jabbar}
          - {surface: bar, sense: bar}
          - {surface: ermiš, sense: er, morphs: [{surface: er, kc: 'sense:er'}, {surface: miš, kc: 'form:mis'}]}
      translations:
        en: In the kingdom of Greece, in the city of Ephesus, there was a tyrant king named Decius.
  - line:
      forms:
        chg-Arab/standard:
          text: "و مسلمان ایکان\u200cدورلار."
          tokens:
          - {surface: و, sense: wa}
          - {surface: مسلمان, sense: musulman}
          - {surface: "ایکان\u200cدورلار", sense: ikan, morphs: [{surface: "ایکان\u200c", kc: 'sense:ikan'}, {surface: دور, kc: 'form:dur'}, {surface: لار, kc: 'form:p3pl'}]}
        chg-Latn/schluessel:
          text: Wä musulmān ikändurlar.
          tokens:
          - {surface: Wä, sense: wa}
          - {surface: musulmān, sense: musulman}
          - {surface: ikändurlar, sense: ikan, morphs: [{surface: ikän, kc: 'sense:ikan'}, {surface: dur, kc: 'form:dur'}, {surface: lar, kc: 'form:p3pl'}]}
      translations:
        en: And they were Muslims.
  - choose:
      prompt:
        en: Who were the Companions of the Cave?
      options:
      - en: Muslims in the service of King Decius
      - en: Shepherds from Greece
      - en: Kings of Ephesus
      answer: 0
  - line:
      ask: complete
      gap: sense:it
      distractors:
      - sense:at
      - sense:qush
      forms:
        chg-Arab/standard:
          text: "شهرلاریدین قاچیب… بر قویچیغه اوچراب، قویچی داغی الارغه قوشولوب، قویچی\u200cنینک ایتی هم قوشولوب، رقیم اتلیغ غارغه کرمیشلار."
          tokens:
          - {surface: شهرلاریدین, sense: shahar, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: قاچیب, sense: qach, morphs: [{surface: قاچ, kc: 'sense:qach'}, {surface: یب, kc: 'form:cv-p'}]}
