          - {surface: alarǧa, sense: ular, morphs: [{surface: alar, kc: 'sense:ular'}, {surface: ǧa, kc: 'form:dat'}]}
          - {surface: qošulup, sense: qoshul, morphs: [{surface: qošul, kc: 'sense:qoshul'}, {surface: up, kc: 'form:cv-p'}]}
          - {surface: qoyčiniŋ, sense: qoy, morphs: [{surface: qoy, kc: 'sense:qoy'}, {surface: či, kc: 'form:ci'}, {surface: niŋ, kc: 'form:gen'}]}
          - {surface: iti, sense: it, morphs: [{surface: it, kc: 'sense:it'}, {surface: i, kc: 'form:poss3'}]}
          - {surface: häm, sense: ham}
          - {surface: qošulup, sense: qoshul, morphs: [{surface: qošul, kc: 'sense:qoshul'}, {surface: up, kc: 'form:cv-p'}]}
          - {surface: Raqīm, sense: raqim}
          - {surface: atliǧ, sense: at.name, morphs: [{surface: at, kc: 'sense:at.name'}, {surface: liǧ, kc: 'form:liq'}]}
          - {surface: ǧārǧa, sense: ghar, morphs: [{surface: ǧār, kc: 'sense:ghar'}, {surface: ǧa, kc: 'form:dat'}]}
