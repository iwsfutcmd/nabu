stories:
- id: chg.story.the-giant
  node: chg.u13.story
  title:
    en: The giant ʿĀj (The Stories of the Prophets)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: عنوق دیکان حضرت آدم… قیزلاری ایردی.
          tokens:
          - {surface: عنوق, sense: anuq, readings: {schluessel: ʿAnūq}}
          - {surface: دیکان, sense: de, readings: {schluessel: degän}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: حضرت, sense: hazrat, readings: {schluessel: ḥażrat-i}}
          - {surface: آدم, sense: adam, readings: {schluessel: Ādam}}
          - {surface: قیزلاری, sense: qiz, readings: {schluessel: qizlari}, morphs: [{surface: قیز, kc: 'sense:qiz'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: ʿAnūq was a daughter of Adam (peace be upon him).
  - line:
      forms:
        chg-Arab/standard:
          text: عاج دیکان انینک اوغلی ایردی.
          tokens:
          - {surface: عاج, sense: aj, readings: {schluessel: ʿĀj}}
          - {surface: دیکان, sense: de, readings: {schluessel: degän}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: انینک, sense: ul, readings: {schluessel: aniŋ}, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: اوغلی, sense: oghul, readings: {schluessel: oǧli}, morphs: [{surface: اوغل, kc: 'sense:oghul'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: ʿĀj was her son.
  - line:
      ask: complete
      gap: sense:adi
      distractors:
      - sense:keyin
      - sense:bila
      forms:
        chg-Arab/standard:
          text: اوزی بسیار اولوغ عادی ایردی.
          tokens:
          - {surface: اوزی, sense: oz, readings: {schluessel: özi}, morphs: [{surface: اوز, kc: 'sense:oz'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: بسیار, sense: besyar, readings: {schluessel: besyār}}
          - {surface: اولوغ, sense: ulugh, readings: {schluessel: uluǧ}}
          - {surface: عادی, sense: adi, readings: {schluessel: ʿādī}}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: He was a very great giant.
  - line:
      forms:
        chg-Arab/standard:
          text: "یول یورسه، بو ایاغی\u200cنینک اول ایاغی\u200cنینک اراسی بر کونجلوک یول ایردی."
          tokens:
          - {surface: یول, sense: yol, readings: {schluessel: yul}}
          - {surface: یورسه, sense: yur, readings: {schluessel: yürsä}, morphs: [{surface: یور, kc: 'sense:yur'}, {surface: سه, kc: 'form:cond'}]}
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: "ایاغی\u200cنینک", sense: ayaq, readings: {schluessel: ayaǧiniŋ}, morphs: [{surface: ایاغ, kc: 'sense:ayaq'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: اول, sense: ul, readings: {schluessel: ul}}
          - {surface: "ایاغی\u200cنینک", sense: ayaq, readings: {schluessel: ayaǧiniŋ}, morphs: [{surface: ایاغ, kc: 'sense:ayaq'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: اراسی, sense: ara, readings: {schluessel: arasi}, morphs: [{surface: ارا, kc: 'sense:ara'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: کونجلوک, sense: kun, readings: {schluessel: künčülük}, morphs: [{surface: کون, kc: 'sense:kun'}, {surface: جلوک, kc: 'form:cilik'}]}
          - {surface: یول, sense: yol, readings: {schluessel: yol}}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: When he walked, between this foot and that foot was a day's journey.
  - choose:
      prompt:
        en: How big was ʿĀj?
      options:
      - en: One step of his was a day's journey.
      - en: He was as tall as a house.
      - en: He was a small boy.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: خوراکی جانکالداقی آلقات ایردی.
          tokens:
          - {surface: خوراکی, sense: khorak, readings: {schluessel: ḫorāki}, morphs: [{surface: خوراک, kc: 'sense:khorak'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: جانکالداقی, sense: jangal, readings: {schluessel: jaŋgaldaqi}, morphs: [{surface: جانکال, kc: 'sense:jangal'}, {surface: داقی, kc: 'form:daki'}]}
          - {surface: آلقات, sense: alqat, readings: {schluessel: alqat}}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: His food was the scrub of the wilderness.
  - line:
      forms:
        chg-Arab/standard:
          text: دریادین اولوغ بالیقلارنی توتوب الیب، آفتابغه توتوب، فیشوروب، یر ایردی.
          tokens:
          - {surface: دریادین, sense: darya, readings: {schluessel: daryādin}, morphs: [{surface: دریا, kc: 'sense:darya'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: اولوغ, sense: ulugh, readings: {schluessel: uluǧ}}
          - {surface: بالیقلارنی, sense: baliq, readings: {schluessel: baliqlarni}, morphs: [{surface: بالیق, kc: 'sense:baliq'}, {surface: لار, kc: 'form:pl'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: توتوب, sense: tut, readings: {schluessel: tutup}, morphs: [{surface: توت, kc: 'sense:tut'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: الیب, sense: al, readings: {schluessel: alip}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: آفتابغه, sense: aftab, readings: {schluessel: āftābǧa}, morphs: [{surface: آفتاب, kc: 'sense:aftab'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: توتوب, sense: tut, readings: {schluessel: tutup}, morphs: [{surface: توت, kc: 'sense:tut'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: فیشوروب, sense: pishur, readings: {schluessel: ṗišürüp}, morphs: [{surface: فیشور, kc: 'sense:pishur'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: یر, sense: ye, readings: {schluessel: yär}, morphs: [{surface: ی, kc: 'sense:ye'}, {surface: ر, kc: 'form:aor'}]}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: He would catch great fish from the river, hold them up to the sun, cook them, and eat them.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: بلکه اوستخوانلاری پله یوتار ایردی.
          tokens:
          - {surface: بلکه, sense: balke, readings: {schluessel: balke}}
          - {surface: اوستخوانلاری, sense: ustikhwan, readings: {schluessel: ustiḫwānlari}, morphs: [{surface: اوستخوان, kc: 'sense:ustikhwan'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: پله, sense: bila, readings: {schluessel: billä}}
          - {surface: یوتار, sense: yot, readings: {schluessel: yötär}, morphs: [{surface: یوت, kc: 'sense:yot'}, {surface: ار, kc: 'form:aor'}]}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: Indeed, he would swallow them bones and all.
  - choose:
      prompt:
        en: How did ʿĀj cook his fish?
      options:
      - en: He held them up to the sun.
      - en: He boiled them in the river.
      - en: He did not cook them at all.
      answer: 0
scenarios:
- id: chg.the-storyteller
  after: chg.u13.used-to
  title:
    en: The storyteller
  setting:
    en: A teahouse in Kashgar, around 1800, in the evening. A storyteller is telling the stories of the prophets.
  character:
    en: The storyteller, who loves to exaggerate and speaks only Turki.
  goal:
    en: Ask him who ʿĀj was and whose son he was, what he used to eat, and how big he was; say what you used to do as a child.
