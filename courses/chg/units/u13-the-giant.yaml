# Chaghatay (chg), unit 13: The giant ʿĀj (The Stories of the Prophets).
# What used to be (the aorist with erdi: yär erdi "he would eat"); -daki "that is in"; -čülük "a day's worth";
# sons and daughters (oǧul, oǧli); ibn-i and ḥażrat-i; fish, the sun and cooking.
# The passage is an anonymous Kashgar telling of the Stories of the Prophets after Rabghuzi (Lund University
# Library, Jarring Prov. 431, 72v-73r; public domain), as Schluessel (2018, ch. 16) types it; the rest was drafted by
# an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u13-the-giant
title:
  en: The giant
cefr: A2
kcs:
- id: sense:oghul
  gloss:
    en: son; boy
  forms:
    chg-Arab/standard:
    - اوغول
    chg-Latn/schluessel:
    - oǧul
  notes:
    en: 'oǧul loses its second vowel before a vowel: oǧli "his son", oǧlum "my son".'
- id: sense:adam
  gloss:
