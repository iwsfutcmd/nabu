stories:
- id: chg.story.the-giant
  node: chg.u13.story
  title:
    en: The giant ʿĀj (The Stories of the Prophets)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: عنوق دیکان حضرت آدم… قیزلاری ایردی.
          tokens:
          - {surface: عنوق, sense: anuq}
          - {surface: دیکان, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: حضرت, sense: hazrat}
          - {surface: آدم, sense: adam}
          - {surface: قیزلاری, sense: qiz, morphs: [{surface: قیز, kc: 'sense:qiz'}, {surface: لار, kc: 'form:pl'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: ایردی, sense: er, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
        chg-Latn/schluessel:
          text: ʿAnūq degän ḥażrat-i Ādam… qizlari erdi.
          tokens:
          - {surface: ʿAnūq, sense: anuq}
          - {surface: degän, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: gän, kc: 'form:pcp'}]}
          - {surface: ḥażrat-i, sense: hazrat}
          - {surface: Ādam, sense: adam}
          - {surface: qizlari, sense: qiz, morphs: [{surface: qiz, kc: 'sense:qiz'}, {surface: lar, kc: 'form:pl'}, {surface: i, kc: 'form:poss3'}]}
          - {surface: erdi, sense: er, morphs: [{surface: er, kc: 'sense:er'}, {surface: di, kc: 'form:past-3'}]}
      translations:
        en: ʿAnūq was a daughter of Adam (peace be upon him).
  - line:
      forms:
        chg-Arab/standard:
          text: عاج دیکان انینک اوغلی ایردی.
          tokens:
          - {surface: عاج, sense: aj}
          - {surface: دیکان, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: انینک, sense: ul, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: اوغلی, sense: oghul, morphs: [{surface: اوغل, kc: 'sense:oghul'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: ایردی, sense: er, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
        chg-Latn/schluessel:
