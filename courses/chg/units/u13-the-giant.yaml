stories:
- id: chg.story.the-giant
  node: chg.u13.story
  title:
    en: The giant ʿĀj (The Stories of the Prophets)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: عنوق دیکان حضرت آدم… قیزلاری ایردی.
          tokens: [{surface: عنوق, lexeme: anuq, readings: {schluessel: ʿAnūq}}, {surface: دیکان, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: pcp, surface: کان}], readings: {schluessel: degän}}, {surface: حضرت, lexeme: hazrat, readings: {schluessel: ḥażrat-i}}, {surface: آدم, lexeme: adam, readings: {schluessel: Ādam}}, {surface: قیزلاری, lexemes: [{lexeme: qiz, surface: قیز, base: true}, {lexeme: pl, surface: لار}, {lexeme: poss3, surface: ی}], readings: {schluessel: qizlari}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: ʿAnūq was a daughter of Adam (peace be upon him).
  - line:
      forms:
        chg-Arab/standard:
          text: عاج دیکان انینک اوغلی ایردی.
          tokens: [{surface: عاج, lexeme: aj, readings: {schluessel: ʿĀj}}, {surface: دیکان, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: pcp, surface: کان}], readings: {schluessel: degän}}, {surface: انینک, lexemes: [{lexeme: ul, surface: ا, base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: aniŋ}}, {surface: اوغلی, lexemes: [{lexeme: oghul, surface: اوغل, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: oǧli}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: ʿĀj was her son.
  - line:
      ask: complete
      gap: lexeme:adi
      distractors:
      - lexeme:nan
      - lexeme:darwaza
      forms:
        chg-Arab/standard:
          text: اوزی بسیار اولوغ عادی ایردی.
          tokens: [{surface: اوزی, lexemes: [{lexeme: oz, surface: اوز, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: özi}}, {surface: بسیار, lexeme: besyar, readings: {schluessel: besyār}}, {surface: اولوغ, lexeme: ulugh, readings: {schluessel: uluǧ}}, {surface: عادی, lexeme: adi, readings: {schluessel: ʿādī}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: He was a very great giant.
  - line:
      forms:
        chg-Arab/standard:
          text: "یول یورسه، بو ایاغی\u200cنینک اول ایاغی\u200cنینک اراسی بر کونجلوک یول ایردی."
          tokens: [{surface: یول, lexeme: yol, readings: {schluessel: yul}}, {surface: یورسه, lexemes: [{lexeme: yur, surface: یور, base: true}, {lexeme: cond, surface: سه}], readings: {schluessel: yürsä}}, {surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: "ایاغی\u200cنینک", lexemes: [{lexeme: ayaq, surface: ایاغ, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: gen, surface: نینک}], readings: {schluessel: ayaǧiniŋ}}, {surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: "ایاغی\u200cنینک", lexemes: [{lexeme: ayaq, surface: ایاغ, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: gen, surface: نینک}], readings: {schluessel: ayaǧiniŋ}}, {surface: اراسی, lexemes: [{lexeme: ara, surface: ارا, base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: arasi}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: کونجلوک, lexemes: [{lexeme: kun, surface: کون, base: true}, {lexeme: cilik, surface: جلوک}], readings: {schluessel: künčülük}}, {surface: یول, lexeme: yol, readings: {schluessel: yol}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: When he walked, between this foot and that foot was a day's journey.
  - choose:
      prompt:
        en: How big was ʿĀj?
      options:
      - en: One step of his was a day's journey.
      - en: He was as tall as a house.
      - en: He was a small boy.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: خوراکی جانکالداقی آلقات ایردی.
          tokens: [{surface: خوراکی, lexemes: [{lexeme: khorak, surface: خوراک, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: ḫorāki}}, {surface: جانکالداقی, lexemes: [{lexeme: jangal, surface: جانکال, base: true}, {lexeme: daki, surface: داقی}], readings: {schluessel: jaŋgaldaqi}}, {surface: آلقات, lexeme: alqat, readings: {schluessel: alqat}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: His food was the scrub of the wilderness.
  - line:
      forms:
        chg-Arab/standard:
          text: دریادین اولوغ بالیقلارنی توتوب الیب، آفتابغه توتوب، فیشوروب، یر ایردی.
          tokens: [{surface: دریادین, lexemes: [{lexeme: darya, surface: دریا, base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: daryādin}}, {surface: اولوغ, lexeme: ulugh, readings: {schluessel: uluǧ}}, {surface: بالیقلارنی, lexemes: [{lexeme: baliq, surface: بالیق, base: true}, {lexeme: pl, surface: لار}, {lexeme: acc, surface: نی}], readings: {schluessel: baliqlarni}}, {surface: توتوب, lexemes: [{lexeme: tut, surface: توت, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: tutup}}, {surface: الیب, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: alip}}, {surface: آفتابغه, lexemes: [{lexeme: aftab, surface: آفتاب, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: āftābǧa}}, {surface: توتوب, lexemes: [{lexeme: tut, surface: توت, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: tutup}}, {surface: فیشوروب, lexemes: [{lexeme: pishur, surface: فیشور, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: ṗišürüp}}, {surface: یر, lexemes: [{lexeme: ye, surface: ی, base: true}, {lexeme: aor, surface: ر}], readings: {schluessel: yär}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: He would catch great fish from the river, hold them up to the sun, cook them, and eat them.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: بلکه اوستخوانلاری پله یوتار ایردی.
          tokens: [{surface: بلکه, lexeme: balke, readings: {schluessel: balke}}, {surface: اوستخوانلاری, lexemes: [{lexeme: ustikhwan, surface: اوستخوان, base: true}, {lexeme: pl, surface: لار}, {lexeme: poss3, surface: ی}], readings: {schluessel: ustiḫwānlari}}, {surface: پله, lexeme: bila, readings: {schluessel: billä}}, {surface: یوتار, lexemes: [{lexeme: yot, surface: یوت, base: true}, {lexeme: aor, surface: ار}], readings: {schluessel: yötär}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: Indeed, he would swallow them bones and all.
  - choose:
      prompt:
        en: How did ʿĀj cook his fish?
      options:
      - en: He held them up to the sun.
      - en: He boiled them in the river.
      - en: He did not cook them at all.
      answer: 0
scenarios:
- id: chg.the-storyteller
  after: chg.u13.used-to
  title:
    en: The storyteller
  setting:
    en: A teahouse in Kashgar, around 1800, in the evening. A storyteller is telling the stories of the prophets.
  character:
    en: The storyteller, who loves to exaggerate and speaks only Turki.
  goal:
    en: Ask him who ʿĀj was and whose son he was, what he used to eat, and how big he was; say what you used to do as a child.
