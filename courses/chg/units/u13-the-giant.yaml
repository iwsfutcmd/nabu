scenarios:
- id: chg.the-storyteller
  after: chg.u13.used-to
  title:
    en: The storyteller
  setting:
    en: A teahouse in Kashgar, around 1800, in the evening. A storyteller is telling the stories of the prophets.
  character:
    en: The storyteller, who loves to exaggerate and speaks only Turki.
  goal:
    en: Ask him who ʿĀj was and whose son he was, what he used to eat, and how big he was; say what you used to do as a child.
