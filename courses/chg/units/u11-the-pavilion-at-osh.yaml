stories:
- id: chg.story.the-pavilion-at-osh
  node: chg.u11.story
  title:
    en: 'The pavilion at Osh (Babur, Bāburnāma: Osh)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cنینک شرق جنوبی طرفی\u200cدور."
          tokens:
          - {surface: "اندجان\u200cنینک", sense: andijan, morphs: [{surface: "اندجان\u200c", kc: 'sense:andijan'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: شرق, sense: sharq}
          - {surface: جنوبی, sense: janub, morphs: [{surface: جنوب, kc: 'sense:janub'}, {surface: ی, kc: 'form:nisba'}]}
          - {surface: "طرفی\u200cدور", sense: taraf, morphs: [{surface: طرف, kc: 'sense:taraf'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: دور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Andijānniŋ šarq janūbī ṭarafidur.
          tokens:
          - {surface: Andijānniŋ, sense: andijan, morphs: [{surface: Andijān, kc: 'sense:andijan'}, {surface: niŋ, kc: 'form:gen'}]}
          - {surface: šarq, sense: sharq}
          - {surface: janūbī, sense: janub, morphs: [{surface: janūb, kc: 'sense:janub'}, {surface: ī, kc: 'form:nisba'}]}
          - {surface: ṭarafidur, sense: taraf, morphs: [{surface: ṭaraf, kc: 'sense:taraf'}, {surface: i, kc: 'form:poss3'}, {surface: dur, kc: 'form:dur'}]}
      translations:
        en: It lies to the southeast of Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cدین تورت یغاچ یول\u200cدور."
          tokens:
          - {surface: "اندجان\u200cدین", sense: andijan, morphs: [{surface: "اندجان\u200c", kc: 'sense:andijan'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: تورت, sense: tort}
          - {surface: یغاچ, sense: yaghach}
          - {surface: "یول\u200cدور", sense: yol, morphs: [{surface: "یول\u200c", kc: 'sense:yol'}, {surface: دور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Andijāndin tört yaǧač yoldur.
          tokens:
          - {surface: Andijāndin, sense: andijan, morphs: [{surface: Andijān, kc: 'sense:andijan'}, {surface: din, kc: 'form:abl'}]}
          - {surface: tört, sense: tort}
          - {surface: yaǧač, sense: yaghach}
          - {surface: yoldur, sense: yol, morphs: [{surface: yol, kc: 'sense:yol'}, {surface: dur, kc: 'form:dur'}]}
      translations:
        en: It is four leagues' journey from Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: "اقار سُوی فراوان\u200cدور."
          tokens:
          - {surface: اقار, sense: aq.flow, morphs: [{surface: اق, kc: 'sense:aq.flow'}, {surface: ار, kc: 'form:aor'}]}
          - {surface: سُوی, sense: su, morphs: [{surface: سُو, kc: 'sense:su'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: "فراوان\u200cدور", sense: farawan, morphs: [{surface: "فراوان\u200c", kc: 'sense:farawan'}, {surface: دور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Aqar süyi farāwāndur.
          tokens:
          - {surface: Aqar, sense: aq.flow, morphs: [{surface: Aq, kc: 'sense:aq.flow'}, {surface: ar, kc: 'form:aor'}]}
          - {surface: süyi, sense: su, morphs: [{surface: sü, kc: 'sense:su'}, {surface: yi, kc: 'form:poss3'}]}
          - {surface: farāwāndur, sense: farawan, morphs: [{surface: farāwān, kc: 'sense:farawan'}, {surface: dur, kc: 'form:dur'}]}
      translations:
        en: Its running water is plentiful.
  - line:
