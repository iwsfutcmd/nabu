scenarios:
- id: chg.the-road-to-osh
  after: chg.u11.although
  title:
    en: The road to Osh
  setting:
    en: A caravan road out of Andijan in spring, about 1500. You are travelling to Osh.
  character:
    en: A carter who drives this road every week and speaks only Turki.
