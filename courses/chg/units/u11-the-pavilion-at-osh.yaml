stories:
- id: chg.story.the-pavilion-at-osh
  node: chg.u11.story
  title:
    en: 'The pavilion at Osh (Babur, Bāburnāma: Osh)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cنینک شرق جنوبی طرفی\u200cدور."
          tokens:
          - {surface: "اندجان\u200cنینک", sense: andijan, readings: {schluessel: Andijānniŋ}, morphs: [{surface: "اندجان\u200c", kc: 'sense:andijan'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: شرق, sense: sharq, readings: {schluessel: šarq}}
          - {surface: جنوبی, sense: janub, readings: {schluessel: janūbī}, morphs: [{surface: جنوب, kc: 'sense:janub'}, {surface: ی, kc: 'form:nisba'}]}
          - {surface: "طرفی\u200cدور", sense: taraf, readings: {schluessel: ṭarafidur}, morphs: [{surface: طرف, kc: 'sense:taraf'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: It lies to the southeast of Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cدین تورت یغاچ یول\u200cدور."
          tokens:
          - {surface: "اندجان\u200cدین", sense: andijan, readings: {schluessel: Andijāndin}, morphs: [{surface: "اندجان\u200c", kc: 'sense:andijan'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: تورت, sense: tort, readings: {schluessel: tört}}
          - {surface: یغاچ, sense: yaghach, readings: {schluessel: yaǧač}}
          - {surface: "یول\u200cدور", sense: yol, readings: {schluessel: yoldur}, morphs: [{surface: "یول\u200c", kc: 'sense:yol'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: It is four leagues' journey from Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: "اقار سُوی فراوان\u200cدور."
          tokens:
          - {surface: اقار, sense: aq.flow, readings: {schluessel: aqar}, morphs: [{surface: اق, kc: 'sense:aq.flow'}, {surface: ار, kc: 'form:aor'}]}
          - {surface: سُوی, sense: su, readings: {schluessel: süyi}, morphs: [{surface: سُو, kc: 'sense:su'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: "فراوان\u200cدور", sense: farawan, readings: {schluessel: farāwāndur}, morphs: [{surface: "فراوان\u200c", kc: 'sense:farawan'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: Its running water is plentiful.
  - line:
      ask: complete
      gap: sense:mawzun
      distractors:
      - sense:kitab
      - sense:sut
      forms:
        chg-Arab/standard:
          text: "قورغانی\u200cنینک شرق جنوبی جانبی\u200cدا بر موزون تاغ توشوبتور."
          tokens:
          - {surface: "قورغانی\u200cنینک", sense: qurghan, readings: {schluessel: qurǧaniniŋ}, morphs: [{surface: قورغان, kc: 'sense:qurghan'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: شرق, sense: sharq, readings: {schluessel: šarq}}
          - {surface: جنوبی, sense: janub, readings: {schluessel: janūbī}, morphs: [{surface: جنوب, kc: 'sense:janub'}, {surface: ی, kc: 'form:nisba'}]}
          - {surface: "جانبی\u200cدا", sense: janib, readings: {schluessel: jānibida}, morphs: [{surface: جانب, kc: 'sense:janib'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: موزون, sense: mawzun, readings: {schluessel: mawzūn}}
          - {surface: تاغ, sense: tagh, readings: {schluessel: taǧ}}
          - {surface: توشوبتور, sense: tush, readings: {schluessel: tüšüptur}, morphs: [{surface: توش, kc: 'sense:tush'}, {surface: وبتور, kc: 'form:narr'}]}
      translations:
        en: To the southeast of its fortress lies a well-shaped mountain.
  - line:
      forms:
        chg-Arab/standard:
          text: "بو تاغ\u200cنینک قله\u200cسی\u200cدا سلطان محمود خان بر حجره سالیب\u200cتور."
          tokens:
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: "تاغ\u200cنینک", sense: tagh, readings: {schluessel: taǧniŋ}, morphs: [{surface: "تاغ\u200c", kc: 'sense:tagh'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: "قله\u200cسی\u200cدا", sense: qulla, readings: {schluessel: qullasida}, morphs: [{surface: "قله\u200c", kc: 'sense:qulla'}, {surface: "سی\u200c", kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: سلطان, sense: sultan, readings: {schluessel: Sulṭān}}
          - {surface: محمود, sense: mahmud, readings: {schluessel: Maḥmūd}}
          - {surface: خان, sense: khan, readings: {schluessel: Ḫan}}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: حجره, sense: hujra, readings: {schluessel: ḥujra}}
          - {surface: "سالیب\u200cتور", sense: sal, readings: {schluessel: saliptur}, morphs: [{surface: "سالیب\u200c", kc: 'sense:sal'}, {surface: تور, kc: 'form:narr'}]}
      translations:
        en: On the peak of this mountain Sultan Mahmud Khan built a pavilion.
  - choose:
      prompt:
        en: Who built the pavilion on the peak?
      options:
      - en: Sultan Mahmud Khan
      - en: Babur himself
      - en: The people of Osh
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "اکرچه اول حجره موندین مرتفع\u200cدور، ولی بو حجره بسیار یخشیراق واقع بولوبتور."
          tokens:
          - {surface: اکرچه, sense: agarcha, readings: {schluessel: ägärčä}}
          - {surface: اول, sense: ul, readings: {schluessel: ul}}
          - {surface: حجره, sense: hujra, readings: {schluessel: ḥujra}}
          - {surface: موندین, sense: bu, readings: {schluessel: mundin}, morphs: [{surface: مون, kc: 'sense:bu'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: "مرتفع\u200cدور", sense: murtafi, readings: {schluessel: murtafiʿdur}, morphs: [{surface: "مرتفع\u200c", kc: 'sense:murtafi'}, {surface: دور, kc: 'form:dur'}]}
          - {surface: ولی, sense: wali, readings: {schluessel: walī}}
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: حجره, sense: hujra, readings: {schluessel: ḥujra}}
          - {surface: بسیار, sense: besyar, readings: {schluessel: besyār}}
          - {surface: یخشیراق, sense: yakhshi, readings: {schluessel: yaḫširaq}, morphs: [{surface: یخشی, kc: 'sense:yakhshi'}, {surface: راق, kc: 'form:cmp'}]}
          - {surface: واقع, sense: waqi, readings: {schluessel: wāqiʿ}}
          - {surface: بولوبتور, sense: bol, readings: {schluessel: boluptur}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: وبتور, kc: 'form:narr'}]}
      translations:
        en: Although that pavilion is higher than this one, this pavilion is placed much better.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: تمام شهر و محلات ایاق آستیدا.
          tokens:
          - {surface: تمام, sense: tamam, readings: {schluessel: tamām}}
          - {surface: شهر, sense: shahar, readings: {schluessel: šahar}}
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: محلات, sense: mahallat, readings: {schluessel: maḥallāt}}
          - {surface: ایاق, sense: ayaq, readings: {schluessel: ayaq}}
          - {surface: آستیدا, sense: ast, readings: {schluessel: astida}, morphs: [{surface: آست, kc: 'sense:ast'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
      translations:
        en: The whole city and its quarters lie at its feet.
  - choose:
      prompt:
        en: Why does Babur like his own pavilion better?
      options:
      - en: It is placed better, with the whole town at its feet.
      - en: It is higher than the khan's.
      - en: It is bigger.
      answer: 0
scenarios:
- id: chg.the-road-to-osh
  after: chg.u11.although
  title:
    en: The road to Osh
  setting:
    en: A caravan road out of Andijan in spring, about 1500. You are travelling to Osh.
  character:
    en: A carter who drives this road every week and speaks only Turki.
  goal:
    en: Ask how far Osh is and which way it lies, what there is to see there (the mountain, the pavilions, the running water), and say which you would rather visit, and why.
