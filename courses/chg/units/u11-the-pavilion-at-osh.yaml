# Chaghatay (chg), unit 11: The pavilion at Osh (Babur, Bāburnāma: Osh).
# The narrative past -ptur (tüšüptur "lies", saliptur "he built"); the aorist as an adjective (aqar su "running
# water"); ägärčä … walī "although … yet"; roads and leagues; -ī "of" (janūbī "southern").
# The passage is Babur's own text (died 1530; the Hyderabad manuscript, in Beveridge's 1905 facsimile), as
# Schluessel (2018, ch. 11) types it; the rest was drafted by an LLM (provenance llm:…, status draft) and awaits
# a reviewer.
