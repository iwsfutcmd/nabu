stories:
- id: chg.story.the-call-at-dawn
  node: chg.u16.story
  title:
    en: The call at dawn (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "توغلوق تمور خان موغالستان\u200cغه تورا ایردی."
          tokens: [{surface: توغلوق, lexeme: tughluq, readings: {schluessel: Tuǧluq}}, {surface: تمور, lexeme: temur, readings: {schluessel: Temür}}, {surface: خان, lexeme: khan, readings: {schluessel: Ḫan}}, {surface: "موغالستان\u200cغه", lexemes: [{lexeme: moghulistan, surface: "موغالستان\u200c", base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: Moǧulistānǧa}}, {surface: تورا, lexeme: tora, readings: {schluessel: törä}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: Tughluq Temür Khan was the ruler of Moghulistan.
  - line:
      forms:
        chg-Arab/standard:
          text: اوزی بولغاسوندا ایردی.
          tokens: [{surface: اوزی, lexemes: [{lexeme: oz, surface: اوز, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: özi}}, {surface: بولغاسوندا, lexemes: [{lexeme: bolghasun, surface: بولغاسون, base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: Bolǧasunda}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: He himself was in Balasaghun.
  - line:
      forms:
        chg-Arab/standard:
          text: "بر یل اردویل\u200cدین آوغه بر منک یته یوز کشی بیله کلدی."
          tokens: [{surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: یل, lexeme: yil, readings: {schluessel: yil}}, {surface: "اردویل\u200cدین", lexemes: [{lexeme: ardawil, surface: "اردویل\u200c", base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: Ardawīldin}}, {surface: آوغه, lexemes: [{lexeme: aw, surface: آو, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: awǧa}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: منک, lexeme: ming, readings: {schluessel: miŋ}}, {surface: یته, lexeme: yatti, readings: {schluessel: yättä}}, {surface: یوز, lexeme: yuz, readings: {schluessel: yüz}}, {surface: کشی, lexeme: kishi, readings: {schluessel: kiši}}, {surface: بیله, lexeme: bila, readings: {schluessel: bilä}}, {surface: کلدی, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: käldi}}]
      translations:
        en: One year he came from Erdabil to hunt with seventeen hundred men.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: الته کون اولاب کلیب، آی کولکه توشتی.
          tokens: [{surface: الته, lexeme: alta, readings: {schluessel: altä}}, {surface: کون, lexeme: kun, readings: {schluessel: kün}}, {surface: اولاب, lexemes: [{lexeme: aw, surface: او, base: true}, {lexeme: la, surface: لا}, {lexeme: cv-p, surface: ب}], readings: {schluessel: awlap}}, {surface: کلیب, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: kelip}}, {surface: آی, lexeme: ay.month, readings: {schluessel: Ay}}, {surface: کولکه, lexemes: [{lexeme: kol, surface: کول, base: true}, {lexeme: dat, surface: که}], readings: {schluessel: Kölgä}}, {surface: توشتی, lexemes: [{lexeme: tush, surface: توش, base: true}, {lexeme: past, surface: تی}], readings: {schluessel: tüšti}}]
      translations:
        en: They hunted for six days, then came and camped at Moon Lake.
  - line:
      forms:
        chg-Arab/standard:
          text: کجه قوندی.
          tokens: [{surface: کجه, lexeme: kecha, readings: {schluessel: kečä}}, {surface: قوندی, lexemes: [{lexeme: qon, surface: قون, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: qondi}}]
      translations:
        en: They spent the night.
  - line:
      forms:
        chg-Arab/standard:
          text: "خانقه\u200cدا شیخ شهاب الدین ازان اوقودی."
          tokens: [{surface: "خانقه\u200cدا", lexemes: [{lexeme: khanqa, surface: "خانقه\u200c", base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: ḫānqada}}, {surface: شیخ, lexeme: shaykh, readings: {schluessel: Šayḫ}}, {surface: شهاب, lexeme: shahab, readings: {schluessel: Šahāb}}, {surface: الدین, lexeme: uddin, readings: {schluessel: ud-Dīn}}, {surface: ازان, lexeme: azan, readings: {schluessel: azān}}, {surface: اوقودی, lexemes: [{lexeme: oqu, surface: اوقو, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: oqudi}}]
      translations:
        en: In the lodge, Shaykh Shahab ud-Din gave the call to prayer.
  - choose:
      prompt:
        en: What did Shaykh Shahab ud-Din do at dawn?
      options:
      - en: He gave the call to prayer.
      - en: He went hunting.
      - en: He left for Erdabil.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: توغلوق تمور خان… یتار ایردی.
          tokens: [{surface: توغلوق, lexeme: tughluq, readings: {schluessel: Tuǧluq}}, {surface: تمور, lexeme: temur, readings: {schluessel: Temür}}, {surface: خان, lexeme: khan, readings: {schluessel: Ḫan}}, {surface: یتار, lexemes: [{lexeme: yat.lie, surface: یت, base: true}, {lexeme: aor, surface: ار}], readings: {schluessel: yatar}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: Tughluq Temür Khan was lying asleep.
  - line:
      ask: complete
      gap: lexeme:awaz
      distractors:
      - lexeme:tarikh
      - lexeme:sajdat
      forms:
        chg-Arab/standard:
          text: قولاقیغه آواز خوش اشتلدی.
          tokens: [{surface: قولاقیغه, lexemes: [{lexeme: qulaq, surface: قولاق, base: true}, {lexeme: poss3, surface: ی}, {lexeme: dat, surface: غه}], readings: {schluessel: qulaqiǧa}}, {surface: آواز, lexemes: [{lexeme: awaz, surface: آواز, base: true}, {lexeme: ezafe, surface: ''}], readings: {schluessel: āwāz-i}}, {surface: خوش, lexeme: khosh, readings: {schluessel: ḫoš}}, {surface: اشتلدی, lexemes: [{lexeme: ishit, surface: اشت, base: true}, {lexeme: pass, surface: ل}, {lexeme: past, surface: دی}], readings: {schluessel: išitildi}}]
      translations:
        en: A sweet voice reached his ears.
  - line:
      forms:
        chg-Arab/standard:
          text: "بی\u200cاختیار قوفوب اولتوردی."
          tokens: [{surface: "بی\u200cاختیار", lexeme: beikhtiyar, readings: {schluessel: bē-iḫtiyār}}, {surface: قوفوب, lexemes: [{lexeme: qop, surface: قوف, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: qoṗup}}, {surface: اولتوردی, lexemes: [{lexeme: oltur, surface: اولتور, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: olturdi}}]
      translations:
        en: Without thinking, he got up and sat.
  - line:
      forms:
        chg-Arab/standard:
          text: کونکلی یومشادی.
          tokens: [{surface: کونکلی, lexemes: [{lexeme: kongul, surface: کونکل, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: köŋli}}, {surface: یومشادی, lexemes: [{lexeme: yumsha, surface: یومشا, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: yumšadi}}]
      translations:
        en: His heart softened.
  - line:
      forms:
        chg-Arab/standard:
          text: "رکابدار دیب بر کشی\u200cسینی بویرودی."
          tokens: [{surface: رکابدار, lexeme: rikabdar, readings: {schluessel: rikābdār}}, {surface: دیب, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: dep}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: "کشی\u200cسینی", lexemes: [{lexeme: kishi, surface: "کشی\u200c", base: true}, {lexeme: poss3, surface: سی}, {lexeme: acc, surface: نی}], readings: {schluessel: kišisini}}, {surface: بویرودی, lexemes: [{lexeme: buyru, surface: بویرو, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: buyrudi}}]
      translations:
        en: He gave an order to one of his men, the stirrup-holder.
  - line:
      forms:
        chg-Arab/standard:
          text: "ایدیکه، «ای، رکابدار! سین باریب، اول منادی\u200cکرنی الیب کلکل! سوز سوراین،» دیدی."
          tokens: [{surface: ایدیکه, lexemes: [{lexeme: eyt, surface: ای, base: true}, {lexeme: past, surface: دی}, {lexeme: ke, surface: که}], readings: {schluessel: aydike}}, {surface: ای, lexeme: ay.voc, readings: {schluessel: ay}}, {surface: رکابدار, lexeme: rikabdar, readings: {schluessel: rikābdār}}, {surface: سین, lexeme: san, readings: {schluessel: sen}}, {surface: باریب, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: barip}}, {surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: "منادی\u200cکرنی", lexemes: [{lexeme: munadagar, surface: "منادی\u200cکر", base: true}, {lexeme: acc, surface: نی}], readings: {schluessel: munādàgarni}}, {surface: الیب, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: alip}}, {surface: کلکل, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: imp, surface: کل}], readings: {schluessel: kälgil}}, {surface: سوز, lexeme: soz, readings: {schluessel: söz}}, {surface: سوراین, lexemes: [{lexeme: sor, surface: سور, base: true}, {lexeme: vol-1s, surface: این}], readings: {schluessel: sorayin}}, {surface: دیدی, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: dedi}}]
      translations:
        en: He said, “Oh, stirrup-holder! Go and bring that crier. I want to ask him something.”
  - choose:
      prompt:
        en: What did the khan want?
      options:
      - en: To ask the man who gave the call something
      - en: To go hunting again
      - en: To sleep
      answer: 0
scenarios:
- id: chg.the-khans-tent
  after: chg.u16.go-and-bring
  title:
    en: In the khan’s tent
  setting:
    en: The camp of Tughluq Temür Khan at Moon Lake, at dawn, in the 1350s. The stirrup-holder has brought you in.
  character:
    en: The khan, half awake, curious and a little stern, who speaks only Turki.
  goal:
    en: Say who you are and where you came from, tell him what you were calling out at dawn, and answer what he asks.
