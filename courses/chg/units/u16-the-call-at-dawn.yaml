stories:
- id: chg.story.the-call-at-dawn
  node: chg.u16.story
  title:
    en: The call at dawn (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "توغلوق تمور خان موغالستان\u200cغه تورا ایردی."
          tokens:
          - {surface: توغلوق, sense: tughluq, readings: {schluessel: Tuǧluq}}
          - {surface: تمور, sense: temur, readings: {schluessel: Temür}}
          - {surface: خان, sense: khan, readings: {schluessel: Ḫan}}
          - {surface: "موغالستان\u200cغه", sense: moghulistan, readings: {schluessel: Moǧulistānǧa}, morphs: [{surface: "موغالستان\u200c", kc: 'sense:moghulistan'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: تورا, sense: tora, readings: {schluessel: törä}}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: Tughluq Temür Khan was the ruler of Moghulistan.
  - line:
      forms:
        chg-Arab/standard:
          text: اوزی بولغاسوندا ایردی.
          tokens:
          - {surface: اوزی, sense: oz, readings: {schluessel: özi}, morphs: [{surface: اوز, kc: 'sense:oz'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: بولغاسوندا, sense: bolghasun, readings: {schluessel: Bolǧasunda}, morphs: [{surface: بولغاسون, kc: 'sense:bolghasun'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: He himself was in Balasaghun.
  - line:
      forms:
        chg-Arab/standard:
          text: "بر یل اردویل\u200cدین آوغه بر منک یته یوز کشی بیله کلدی."
          tokens:
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: یل, sense: yil, readings: {schluessel: yil}}
          - {surface: "اردویل\u200cدین", sense: ardawil, readings: {schluessel: Ardawīldin}, morphs: [{surface: "اردویل\u200c", kc: 'sense:ardawil'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: آوغه, sense: aw, readings: {schluessel: awǧa}, morphs: [{surface: آو, kc: 'sense:aw'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: منک, sense: ming, readings: {schluessel: miŋ}}
          - {surface: یته, sense: yatti, readings: {schluessel: yättä}}
          - {surface: یوز, sense: yuz, readings: {schluessel: yüz}}
          - {surface: کشی, sense: kishi, readings: {schluessel: kiši}}
          - {surface: بیله, sense: bila, readings: {schluessel: bilä}}
          - {surface: کلدی, sense: kal, readings: {schluessel: käldi}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: One year he came from Erdabil to hunt with seventeen hundred men.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: الته کون اولاب کلیب، آی کولکه توشتی.
          tokens:
          - {surface: الته, sense: alta, readings: {schluessel: altä}}
          - {surface: کون, sense: kun, readings: {schluessel: kün}}
          - {surface: اولاب, sense: aw, readings: {schluessel: awlap}, morphs: [{surface: او, kc: 'sense:aw'}, {surface: لا, kc: 'form:la'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: کلیب, sense: kal, readings: {schluessel: kelip}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: آی, sense: ay.month, readings: {schluessel: Ay}}
          - {surface: کولکه, sense: kol, readings: {schluessel: Kölgä}, morphs: [{surface: کول, kc: 'sense:kol'}, {surface: که, kc: 'form:dat'}]}
          - {surface: توشتی, sense: tush, readings: {schluessel: tüšti}, morphs: [{surface: توش, kc: 'sense:tush'}, {surface: تی, kc: 'form:past-3'}]}
      translations:
        en: They hunted for six days, then came and camped at Moon Lake.
  - line:
      forms:
        chg-Arab/standard:
          text: کجه قوندی.
          tokens:
          - {surface: کجه, sense: kecha, readings: {schluessel: kečä}}
          - {surface: قوندی, sense: qon, readings: {schluessel: qondi}, morphs: [{surface: قون, kc: 'sense:qon'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: They spent the night.
  - line:
      forms:
        chg-Arab/standard:
          text: "خانقه\u200cدا شیخ شهاب الدین ازان اوقودی."
          tokens:
          - {surface: "خانقه\u200cدا", sense: khanqa, readings: {schluessel: ḫānqada}, morphs: [{surface: "خانقه\u200c", kc: 'sense:khanqa'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: شیخ, sense: shaykh, readings: {schluessel: Šayḫ}}
          - {surface: شهاب, sense: shahab, readings: {schluessel: Šahāb}}
          - {surface: الدین, sense: uddin, readings: {schluessel: ud-Dīn}}
          - {surface: ازان, sense: azan, readings: {schluessel: azān}}
          - {surface: اوقودی, sense: oqu, readings: {schluessel: oqudi}, morphs: [{surface: اوقو, kc: 'sense:oqu'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: In the lodge, Shaykh Shahab ud-Din gave the call to prayer.
  - choose:
      prompt:
        en: What did Shaykh Shahab ud-Din do at dawn?
      options:
      - en: He gave the call to prayer.
      - en: He went hunting.
      - en: He left for Erdabil.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: توغلوق تمور خان… یتار ایردی.
          tokens:
          - {surface: توغلوق, sense: tughluq, readings: {schluessel: Tuǧluq}}
          - {surface: تمور, sense: temur, readings: {schluessel: Temür}}
          - {surface: خان, sense: khan, readings: {schluessel: Ḫan}}
          - {surface: یتار, sense: yat.lie, readings: {schluessel: yatar}, morphs: [{surface: یت, kc: 'sense:yat.lie'}, {surface: ار, kc: 'form:aor'}]}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: Tughluq Temür Khan was lying asleep.
  - line:
      ask: complete
      gap: sense:awaz
      distractors:
      - sense:kol
      - sense:tash
      forms:
        chg-Arab/standard:
          text: قولاقیغه آواز خوش اشتلدی.
          tokens:
          - {surface: قولاقیغه, sense: qulaq, readings: {schluessel: qulaqiǧa}, morphs: [{surface: قولاق, kc: 'sense:qulaq'}, {surface: ی, kc: 'form:poss3'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: آواز, sense: awaz, readings: {schluessel: āwāz-i}}
          - {surface: خوش, sense: khosh, readings: {schluessel: ḫoš}}
          - {surface: اشتلدی, sense: ishit, readings: {schluessel: išitildi}, morphs: [{surface: اشت, kc: 'sense:ishit'}, {surface: ل, kc: 'form:pass'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: A sweet voice reached his ears.
  - line:
      forms:
        chg-Arab/standard:
          text: "بی\u200cاختیار قوفوب اولتوردی."
          tokens:
          - {surface: "بی\u200cاختیار", sense: beikhtiyar, readings: {schluessel: bē-iḫtiyār}}
          - {surface: قوفوب, sense: qop, readings: {schluessel: qoṗup}, morphs: [{surface: قوف, kc: 'sense:qop'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: اولتوردی, sense: oltur, readings: {schluessel: olturdi}, morphs: [{surface: اولتور, kc: 'sense:oltur'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: Without thinking, he got up and sat.
  - line:
      forms:
        chg-Arab/standard:
          text: کونکلی یومشادی.
          tokens:
          - {surface: کونکلی, sense: kongul, readings: {schluessel: köŋli}, morphs: [{surface: کونکل, kc: 'sense:kongul'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: یومشادی, sense: yumsha, readings: {schluessel: yumšadi}, morphs: [{surface: یومشا, kc: 'sense:yumsha'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: His heart softened.
  - line:
      forms:
        chg-Arab/standard:
          text: "رکابدار دیب بر کشی\u200cسینی بویرودی."
          tokens:
          - {surface: رکابدار, sense: rikabdar, readings: {schluessel: rikābdār}}
          - {surface: دیب, sense: de, readings: {schluessel: dep}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: "کشی\u200cسینی", sense: kishi, readings: {schluessel: kišisini}, morphs: [{surface: "کشی\u200c", kc: 'sense:kishi'}, {surface: سی, kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: بویرودی, sense: buyru, readings: {schluessel: buyrudi}, morphs: [{surface: بویرو, kc: 'sense:buyru'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: He gave an order to one of his men, the stirrup-holder.
  - line:
      forms:
        chg-Arab/standard:
          text: "ایدیکه، «ای، رکابدار! سین باریب، اول منادی\u200cکرنی الیب کلکل! سوز سوراین،» دیدی."
          tokens:
          - {surface: ایدیکه, sense: eyt, readings: {schluessel: aydike}, morphs: [{surface: ای, kc: 'sense:eyt'}, {surface: دی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: ای, sense: ay.voc, readings: {schluessel: ay}}
          - {surface: رکابدار, sense: rikabdar, readings: {schluessel: rikābdār}}
          - {surface: سین, sense: san, readings: {schluessel: sen}}
          - {surface: باریب, sense: bar.go, readings: {schluessel: barip}, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: اول, sense: ul, readings: {schluessel: ul}}
          - {surface: "منادی\u200cکرنی", sense: munadagar, readings: {schluessel: munādàgarni}, morphs: [{surface: "منادی\u200cکر", kc: 'sense:munadagar'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: الیب, sense: al, readings: {schluessel: alip}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
