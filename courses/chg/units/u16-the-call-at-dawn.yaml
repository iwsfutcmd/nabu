# Chaghatay (chg), unit 16: The call at dawn (The Tadhkira of Jalāl ud-Dīn Katakī, part two).
# -la makes verbs of nouns (awla- "to hunt"); the passive -il- (išitildi "was heard"); -ayin "let me" (sorayin); the
# imperative -ǧil, -gil (kälgil "come!"); thousands and hundreds; köŋül, köŋli.
# The passage is the anonymous Tadhkira of Jalāl ud-Dīn Katakī (Lund University Library, Jarring Prov. 328,
# 7r:8-7v:6; public domain), as Schluessel (2018, ch. 15) types it; the rest was drafted by an LLM (provenance
# llm:…, status draft) and awaits a reviewer.
id: u16-the-call-at-dawn
title:
  en: The call at dawn
cefr: B1
kcs:
- id: sense:aw
  gloss:
    en: the hunt, hunting
  forms:
    chg-Arab/standard:
    - آو
    chg-Latn/schluessel:
    - aw
  notes:
    en: awǧa bar- "to go hunting"; awla- "to hunt".
- id: sense:tora
  gloss:
    en: 'lord, ruler (a title: the Tora)'
  forms:
    chg-Arab/standard:
    - تورا
    chg-Latn/schluessel:
    - törä
- id: sense:tughluq
  gloss:
    en: Tughluq (in Tughluq Temür Khan, a khan of Moghulistan, died 1363)
  forms:
    chg-Arab/standard:
    - توغلوق
    chg-Latn/schluessel:
    - Tuǧluq
- id: sense:temur
  gloss:
    en: Temür (a name; "iron")
  forms:
    chg-Arab/standard:
    - تمور
    chg-Latn/schluessel:
    - Temür
- id: sense:moghulistan
  gloss:
    en: Moghulistan (the land of the eastern Chaghatay khans)
  forms:
    chg-Arab/standard:
    - موغالستان
    chg-Latn/schluessel:
    - Moǧulistān
- id: sense:ardawil
  gloss:
    en: Erdabil (a town of the Tadhkira)
  forms:
    chg-Arab/standard:
    - اردویل
    chg-Latn/schluessel:
    - Ardawīl
- id: sense:bolghasun
  gloss:
    en: Balasaghun (a town in what is now Kyrgyzstan)
  forms:
    chg-Arab/standard:
    - بولغاسون
    chg-Latn/schluessel:
    - Bolǧasun
- id: sense:kecha
  gloss:
    en: night
  forms:
    chg-Arab/standard:
    - کیچه
    chg-Latn/schluessel:
    - kečä
- id: sense:kol
  gloss:
    en: lake
  forms:
    chg-Arab/standard:
    - کول
    chg-Latn/schluessel:
    - köl
  notes:
    en: Ay Köl "Moon Lake".
  image:
    file: ../images/wave.svg
    license: CC0-1.0
    provenance:
      author: llm:claude@chg-draft-v1
      status: draft
    source: Drawn for Nabu (courses/images)
- id: sense:yat.lie
  gloss:
    en: to lie (down)
  forms:
    chg-Arab/standard:
    - یت-
    chg-Latn/schluessel:
    - yat-
  notes:
    en: yatar erdi "he was lying". Spelled as yät- "to reach".
- id: sense:khanqa
  gloss:
    en: Sufi lodge
  forms:
    chg-Arab/standard:
    - خانقه
    chg-Latn/schluessel:
    - ḫānqa
- id: sense:shaykh
  gloss:
    en: shaykh, sheikh (a Sufi master)
  forms:
    chg-Arab/standard:
    - شیخ
    chg-Latn/schluessel:
    - šayḫ
- id: sense:shahab
  gloss:
    en: Shahab (in Šahāb ud-Dīn, a companion of Jalāl ud-Dīn)
  forms:
    chg-Arab/standard:
    - شهاب
    chg-Latn/schluessel:
    - Šahāb
- id: sense:uddin
  gloss:
    en: '"of the faith" (in names: Šahāb ud-Dīn, Jalāl ud-Dīn)'
  forms:
    chg-Arab/standard:
    - الدین
    chg-Latn/schluessel:
    - ud-Dīn
- id: sense:azan
  gloss:
    en: the call to prayer
  forms:
    chg-Arab/standard:
    - ازان
    chg-Latn/schluessel:
    - azān
  notes:
    en: azān oqu- "to give the call to prayer".
- id: sense:qulaq
  gloss:
    en: ear
  forms:
    chg-Arab/standard:
    - قولاق
    chg-Latn/schluessel:
    - qulaq
- id: sense:awaz
  gloss:
    en: sound, voice
  forms:
    chg-Arab/standard:
    - آواز
    chg-Latn/schluessel:
    - āwāz
  notes:
    en: āwāz-i ḫoš "a pleasant voice".
- id: sense:khosh
  gloss:
    en: pleasant, sweet; well
  forms:
    chg-Arab/standard:
    - خوش
    chg-Latn/schluessel:
    - ḫoš
- id: sense:beikhtiyar
  gloss:
    en: without thinking, despite oneself
  forms:
    chg-Arab/standard:
    - "بی\u200cاختیار"
    chg-Latn/schluessel:
    - bē-iḫtiyār
  notes:
    en: The Persian bē- "without" and iḫtiyār "choice".
- id: sense:kongul
  gloss:
    en: heart, mind
  forms:
    chg-Arab/standard:
    - کونکول
    chg-Latn/schluessel:
    - köŋül
  notes:
    en: 'köŋül loses its second vowel before a vowel: köŋli "his heart".'
- id: sense:yumsha
  gloss:
    en: to soften
  forms:
    chg-Arab/standard:
    - یومشا-
    chg-Latn/schluessel:
    - yumša-
- id: sense:rikabdar
  gloss:
    en: stirrup-holder (a khan's attendant)
  forms:
    chg-Arab/standard:
    - رکابدار
    chg-Latn/schluessel:
    - rikābdār
- id: sense:buyru
  gloss:
    en: to order, command
  forms:
    chg-Arab/standard:
    - بویرو-
    chg-Latn/schluessel:
    - buyru-
- id: sense:munadagar
  gloss:
    en: herald, crier (one who calls out)
  forms:
    chg-Arab/standard:
    - "منادی\u200cکر"
    chg-Latn/schluessel:
    - munādàgar
- id: sense:soz
  gloss:
    en: word; speech, something to say
  forms:
    chg-Arab/standard:
    - سوز
    chg-Latn/schluessel:
    - söz
- id: sense:sor
  gloss:
    en: to ask
  forms:
    chg-Arab/standard:
    - سور-
    chg-Latn/schluessel:
    - sor-
  notes:
    en: söz sor- "to ask (something)".
- id: form:la
  gloss:
    en: '-la, -lä: makes a verb of a noun'
  notes:
    en: aw "the hunt" → awla- "to hunt"; söz "word" → sözlä- "to speak" (Schluessel 15.18).
- id: form:pass
  gloss:
    en: '-il-, -l-, -n-: the passive'
  notes:
    en: 'išit- "to hear" → išitil- "to be heard": qulaqiǧa āwāz išitildi "a voice reached his ear".'
- id: form:vol-1s
  gloss:
    en: '-ayin, -äyin: let me, I shall'
  notes:
    en: söz sorayin "let me ask (something)" (Schluessel 15.16); the first person of -ay.
