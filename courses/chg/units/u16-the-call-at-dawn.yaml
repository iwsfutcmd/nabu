- id: chg.story.the-call-at-dawn
  node: chg.u16.story
  title:
    en: The call at dawn (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "توغلوق تمور خان موغالستان\u200cغه تورا ایردی."
          tokens:
          - {surface: توغلوق, sense: tughluq}
          - {surface: تمور, sense: temur}
          - {surface: خان, sense: khan}
          - {surface: "موغالستان\u200cغه", sense: moghulistan, morphs: [{surface: "موغالستان\u200c", kc: 'sense:moghulistan'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: تورا, sense: tora}
          - {surface: ایردی, sense: er, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
        chg-Latn/schluessel:
          text: Tuǧluq Temür Ḫan Moǧulistānǧa törä erdi.
          tokens:
          - {surface: Tuǧluq, sense: tughluq}
          - {surface: Temür, sense: temur}
          - {surface: Ḫan, sense: khan}
          - {surface: Moǧulistānǧa, sense: moghulistan, morphs: [{surface: Moǧulistān, kc: 'sense:moghulistan'}, {surface: ǧa, kc: 'form:dat'}]}
          - {surface: törä, sense: tora}
          - {surface: erdi, sense: er, morphs: [{surface: er, kc: 'sense:er'}, {surface: di, kc: 'form:past-3'}]}
      translations:
        en: Tughluq Temür Khan was the ruler of Moghulistan.
  - line:
      forms:
        chg-Arab/standard:
          text: اوزی بولغاسوندا ایردی.
          tokens:
          - {surface: اوزی, sense: oz, morphs: [{surface: اوز, kc: 'sense:oz'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: بولغاسوندا, sense: bolghasun, morphs: [{surface: بولغاسون, kc: 'sense:bolghasun'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: ایردی, sense: er, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
        chg-Latn/schluessel:
          text: Özi Bolǧasunda erdi.
          tokens:
