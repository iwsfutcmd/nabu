  readings:
    schluessel: buyru
- id: sense:munadagar
  gloss:
    en: herald, crier (one who calls out)
  forms:
    chg-Arab/standard:
    - "منادی\u200cکر"
    chg-Latn/schluessel:
    - munādàgar
  readings:
    schluessel: munādàgar
- id: sense:soz
  gloss:
    en: word; speech, something to say
  forms:
    chg-Arab/standard:
    - سوز
    chg-Latn/schluessel:
    - söz
  readings:
    schluessel: söz
- id: sense:sor
  gloss:
    en: to ask
  forms:
    chg-Arab/standard:
    - سور-
    chg-Latn/schluessel:
    - sor-
  readings:
    schluessel: sor
  notes:
    en: söz sor- "to ask (something)".
- id: form:la
  gloss:
    en: '-la, -lä: makes a verb of a noun'
  notes:
    en: aw "the hunt" → awla- "to hunt"; söz "word" → sözlä- "to speak" (Schluessel 15.18).
- id: form:pass
  gloss:
    en: '-il-, -l-, -n-: the passive'
  notes:
    en: 'išit- "to hear" → išitil- "to be heard": qulaqiǧa āwāz išitildi "a voice reached his ear".'
- id: form:vol-1s
  gloss:
    en: '-ayin, -äyin: let me, I shall'
  notes:
    en: söz sorayin "let me ask (something)" (Schluessel 15.16); the first person of -ay.
