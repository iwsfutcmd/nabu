# Chaghatay (chg), unit 16: The call at dawn (The Tadhkira of Jalāl ud-Dīn Katakī, part two).
# -la makes verbs of nouns (awla- "to hunt"); the passive -il- (išitildi "was heard"); -ayin "let me" (sorayin); the
# imperative -ǧil, -gil (kälgil "come!"); thousands and hundreds; köŋül, köŋli.
# The passage is the anonymous Tadhkira of Jalāl ud-Dīn Katakī (Lund University Library, Jarring Prov. 328,
# 7r:8-7v:6; public domain), as Schluessel (2018, ch. 15) types it; the rest was drafted by an LLM (provenance
# llm:…, status draft) and awaits a reviewer.
id: u16-the-call-at-dawn
title:
  en: The call at dawn
cefr: B1
kcs:
- id: sense:aw
  gloss:
    en: the hunt, hunting
  forms:
    chg-Arab/standard:
    - آو
    chg-Latn/schluessel:
    - aw
  readings:
    schluessel: aw
  notes:
    en: awǧa bar- "to go hunting"; awla- "to hunt".
- id: sense:tora
  gloss:
    en: 'lord, ruler (a title: the Tora)'
  forms:
    chg-Arab/standard:
