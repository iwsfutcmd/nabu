stories:
- id: chg.story.king-at-twelve
  node: chg.u06.story
  title:
    en: 'King at twelve (Babur, Bāburnāma: the opening)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "رمضان ایی، تاریخ سیکیز یوز توقسان توقوزدا، فرغانه ولایتی\u200cده اون ایکی یاشته بادشاه بولدوم."
