- id: chg.story.king-at-twelve
  node: chg.u06.story
  title:
    en: 'King at twelve (Babur, Bāburnāma: the opening)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "رمضان ایی، تاریخ سیکیز یوز توقسان توقوزدا، فرغانه ولایتی\u200cده اون ایکی یاشته بادشاه بولدوم."
          tokens:
          - {surface: رمضان, sense: ramzan, readings: {schluessel: Ramżān}}
          - {surface: ایی, sense: ay.month, readings: {schluessel: ayi}, morphs: [{surface: ای, kc: 'sense:ay.month'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: تاریخ, sense: tarikh, readings: {schluessel: tārīḫ-i}}
          - {surface: سیکیز, sense: sakkiz, readings: {schluessel: säkkiz}}
          - {surface: یوز, sense: yuz, readings: {schluessel: yüz}}
          - {surface: توقسان, sense: toqsan, readings: {schluessel: toqsan}}
          - {surface: توقوزدا, sense: toqquz, readings: {schluessel: toqquzda}, morphs: [{surface: توقوز, kc: 'sense:toqquz'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: فرغانه, sense: farghana, readings: {schluessel: Farǧāna}}
          - {surface: "ولایتی\u200cده", sense: wilayat, readings: {schluessel: wilāyatidä}, morphs: [{surface: ولایت, kc: 'sense:wilayat'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: ده, kc: 'form:loc'}]}
          - {surface: اون, sense: 'on', readings: {schluessel: 'on'}}
          - {surface: ایکی, sense: ikki, readings: {schluessel: ikki}}
          - {surface: یاشته, sense: yash, readings: {schluessel: yašta}, morphs: [{surface: یاش, kc: 'sense:yash'}, {surface: ته, kc: 'form:loc'}]}
          - {surface: بادشاه, sense: padishah, readings: {schluessel: pādišāh}}
          - {surface: بولدوم, sense: bol, readings: {schluessel: boldum}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: دوم, kc: 'form:past-1s'}]}
      translations:
        en: In the month of Ramadan, in the year 899, in the country of Ferghana, I became king at twelve years of age.
  - choose:
