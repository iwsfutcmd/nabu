- id: form:past-1s
  gloss:
    en: '-dim, -dum, -düm (-tim after a voiceless consonant): I did'
  notes:
    en: 'The simple past tells what happened: bardim "I went", boldum "I became", ičtim "I drank".'
- id: form:past-2s
  gloss:
    en: '-diŋ, -duŋ, -düŋ: you did, to a friend'
- id: form:past-2
  gloss:
    en: '-diŋiz: you did, politely or to several'
- id: form:past-3
  gloss:
    en: '-di (-ti): he, she, it did; they did'
  notes:
    en: bardi "she went". With several people it may be -dilär, or -di alone.
- id: form:past-1p
  gloss:
    en: '-duq, -dük: we did'
  notes:
    en: The scribes write -duq far more than -dük, whatever the vowels.
- id: form:past-2pl
  gloss:
    en: '-diŋlar, -duŋlar: you did, to several people'
- id: form:past-3pl
  gloss:
    en: '-dilär, -dilar: they did'
- id: form:neg
  gloss:
    en: '-ma-, -mä-: not (inside the verb)'
  notes:
    en: 'körmädim "I did not see", kälmädi "he did not come". After it the past ending always has i: barmaduq.'
- id: form:liq
  gloss:
    en: '-liq, -lik, -luq, -lük: with, having; of (a place); -ness'
  notes:
    en: aywānliq ḥujra "a pavilion with a portico"; Kašǧarliq "of Kashgar"; yaḫšiliq "goodness". Scribes write it -liq whatever the vowels.
- id: form:ord
  gloss:
    en: '-nči, -inči, -unči, -ünči: -th (ordinal numbers)'
  notes:
    en: bäšinči "fifth", ikkinči "second", toqquzunči "ninth".
