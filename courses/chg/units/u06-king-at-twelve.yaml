        chg-Arab/standard:
          text: "تاریخ توقوز یوز ایکی\u200cدا مین بیر ایوانلیق حجره سالدیم."
          tokens: [{surface: تاریخ, lexemes: [{lexeme: tarikh, surface: تاریخ, base: true}, {lexeme: nom}, {lexeme: ezafe, surface: ''}], readings: {schluessel: tārīḫ-i}}, {surface: توقوز, lexeme: toqquz, readings: {schluessel: toqquz}}, {surface: یوز, lexeme: yuz, readings: {schluessel: yüz}}, {surface: "ایکی\u200cدا", lexemes: [{lexeme: ikki, surface: "ایکی\u200c", base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: ikki·dä}}, {surface: مین, lexemes: [{lexeme: man, base: true}, {lexeme: nom}], readings: {schluessel: men}}, {surface: بیر, lexeme: bir, readings: {schluessel: bir}}, {surface: ایوانلیق, lexeme: aywanliq, readings: {schluessel: aywānliq}}, {surface: حجره, lexemes: [{lexeme: hujra, base: true}, {lexeme: nom}], readings: {schluessel: ḥujra}}, {surface: سالدیم, lexemes: [{lexeme: sal, surface: سال, base: true}, {lexeme: past, surface: دی}, {lexeme: pp1s, surface: م}], readings: {schluessel: saldim}}]
