      translations:
        en: In the month of Ramadan, in the year 899, in the country of Ferghana, I became king at twelve years of age.
  - choose:
      prompt:
        en: How old was Babur when he became king?
      options:
      - en: Twelve
      - en: Twenty
      - en: Eight
      answer: 0
  - line:
      ask: complete
      gap: lexeme:farghana
      distractors:
      - lexeme:ramzan
      - lexeme:khuma
      forms:
        chg-Arab/standard:
          text: "فرغانه ولایتی بیشینجی اقلیم\u200cدین\u200cدور."
          tokens: [{surface: فرغانه, lexemes: [{lexeme: farghana, base: true}, {lexeme: nom}], readings: {schluessel: Farǧāna}}, {surface: ولایتی, lexemes: [{lexeme: wilayat, surface: ولایت, base: true}, {lexeme: poss3, surface: ی}, {lexeme: nom}], readings: {schluessel: wilāyati}}, {surface: بیشینجی, lexeme: bashinchi, readings: {schluessel: bäšinči}}, {surface: "اقلیم\u200cدین\u200cدور", lexemes: [{lexeme: iqlim, surface: "اقلیم\u200c", base: true}, {lexeme: abl, surface: "دین\u200c"}, {lexeme: dur, surface: دور}], readings: {schluessel: iqlīm·din·dur}}]
      translations:
