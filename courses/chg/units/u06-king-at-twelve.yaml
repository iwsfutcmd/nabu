# Chaghatay (chg), unit 6: King at twelve (Babur, Bāburnāma: the opening).
# The simple past (bardim "I went", kälmädi "he did not come") in every person; numbers to a thousand; ages,
# months and years; ordinals (-inči).
# The passage is Babur's own text (died 1530; the Hyderabad manuscript, in Beveridge's 1905 facsimile), as
# Schluessel (2018, ch. 11) types it; the rest was drafted by an LLM (provenance llm:…, status draft) and awaits
# a reviewer.
id: u06-king-at-twelve
title:
  en: King at twelve
cefr: A1
