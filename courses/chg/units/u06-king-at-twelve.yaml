scenarios:
- id: chg.the-young-king
  after: chg.u06.dates
  title:
    en: The young king
  setting:
    en: Andijan, the summer of 1494 (899 of the Hijra). The boy Babur has just become king of Ferghana.
  character:
    en: An old courtier of Babur's father, who remembers every date and speaks only Turki.
  goal:
    en: Ask the courtier when and where the new king was made king, how old he is, and what he did yesterday; say what you did.
