- id: form:p1s
  gloss:
    en: '-män: I am (on the predicate); I (on the verb)'
  notes:
    en: 'Män Türkmän "I am a Turk". The pronoun may be left out: Türkmän.'
- id: form:p2s
  gloss:
    en: '-sän: you are, to a friend, a child, God (on the predicate); you (on the verb)'
  notes:
    en: sän is "you" to one person you know well; siz is the polite "you", to one person or several.
- id: form:p2
  gloss:
    en: '-siz: you are, politely, to one person or several; you (on the verb)'
  notes:
    en: 'siz is the usual "you" in the texts: polite to one person, or to several.'
- id: form:p1p
  gloss:
    en: '-miz: we are (on the predicate); we (on the verb)'
  notes:
    en: Biz Türkmiz "we are Turks".
- id: form:p2pl
  gloss:
    en: '-sizlär: you are, to several people; you (on the verb)'
- id: form:q
  gloss:
    en: '-mu: a yes-or-no question'
  notes:
    en: '-mu turns a statement into a question: barmu? "is there?". It comes before -siz and -sän (mullāmusiz? "are you a mullah?"), after -män and -miz (Türkmänmu? "am I a Turk?").'
- id: form:p3pl
  gloss:
    en: '-lar, -lär: they (on the predicate or the verb)'
  notes:
    en: 'derlär "they say, they call"; it may be left out: ular Türk "they are Turks".'
- id: form:acc
  gloss:
    en: '-ni: the object, when it is definite'
  notes:
    en: 'A definite object takes -ni: ani bilmäsmiz "we do not know it". An indefinite one takes nothing: nan aladur "she buys bread". After -i it is often just -n.'
- id: form:poss1s
  gloss:
    en: '-m (after a vowel), -im, -um, -üm: my'
  notes:
    en: anam "my mother", atim "my name", öyüm "my house".
- id: form:poss2s
  gloss:
    en: '-ŋ (after a vowel), -iŋ, -uŋ, -üŋ: your, to a friend'
- id: form:poss2
  gloss:
    en: '-ŋiz (after a vowel), -iŋiz, -uŋiz, -üŋiz: your, politely or to several'
  notes:
    en: 'atiŋiz "your name"; with -lar for several people or for respect: pādišāhiŋizlar "your king".'
- id: form:poss1p
  gloss:
    en: '-miz (after a vowel), -imiz, -umiz, -ümiz: our'
  notes:
    en: pādišāhimiz "our king".
