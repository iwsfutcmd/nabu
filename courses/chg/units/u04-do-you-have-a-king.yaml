# Chaghatay (chg), unit 4: Do you have a king? (The Tadhkira of Jalāl ud-Dīn Katakī).
# I, you, we, they; "I am", "you are" (-män, -sän, -siz, -miz); questions with -mu, nemä "what?" and kim "who?";
# my, your, our (-m, -ŋ, -ŋiz, -imiz); bilmäsmiz "we do not know".
# The passage is the anonymous Tadhkira of Jalāl ud-Dīn Katakī (Lund University Library, Jarring Prov. 328,
# 2r-2v; public domain), as Schluessel (2018, ch. 14) types it, in the scribe's spellings (فادشاه for pādišāh,
# پز for biz); the scribe's بامو is read barmu, as Schluessel reads it. The rest was drafted by an LLM
# (provenance llm:…, status draft) and awaits a reviewer.
id: u04-do-you-have-a-king
title:
  en: Do you have a king?
cefr: A1
kcs:
- id: sense:man
  gloss:
    en: I
  forms:
    chg-Arab/standard:
    - من
    chg-Latn/schluessel:
