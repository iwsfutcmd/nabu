stories:
- id: chg.story.do-you-have-a-king
  node: chg.u04.story
  title:
    en: Do you have a king? (The Tadhkira of Jalāl ud-Dīn Katakī)
  characters:
  - id: jamal
    name:
      chg-Arab/standard: جمال الدین
      chg-Latn/schluessel: Jamāl ud-Dīn
  - id: man
    name:
      chg-Arab/standard: بیر کشی
      chg-Latn/schluessel: bir kiši
  steps:
  - line:
      speaker: jamal
      forms:
        chg-Arab/standard:
          text: فادشاهینکزلار بارمو؟
          tokens: [{surface: فادشاهینکزلار, lexemes: [{lexeme: padishah, surface: فادشاه, base: true}, {lexeme: poss2pl, surface: ینکزلار}, {lexeme: nom}], readings: {schluessel: ṗādišāhiŋizlar}}, {surface: بارمو, lexemes: [{lexeme: bar, surface: بار, base: true}, {lexeme: q, surface: مو}], readings: {schluessel: barmu}}]
      translations:
        en: “Do you have a king?
  - line:
      speaker: jamal
      forms:
        chg-Arab/standard:
          text: عالمینکزلار هم بارمو؟
          tokens: [{surface: عالمینکزلار, lexemes: [{lexeme: alim, surface: عالم, base: true}, {lexeme: poss2pl, surface: ینکزلار}, {lexeme: nom}], readings: {schluessel: ʿālimiŋizlar}}, {surface: هم, lexeme: ham, readings: {schluessel: häm}}, {surface: بارمو, lexemes: [{lexeme: bar, surface: بار, base: true}, {lexeme: q, surface: مو}], readings: {schluessel: barmu}}]
      translations:
        en: Do you have scholars too?”
  - line:
      speaker: man
      forms:
        chg-Arab/standard:
          text: فادشاهمز بار.
          tokens: [{surface: فادشاهمز, lexemes: [{lexeme: padishah, surface: فادشاه, base: true}, {lexeme: poss1p, surface: مز}, {lexeme: nom}], readings: {schluessel: ṗādišāhimiz}}, {surface: بار, lexeme: bar, readings: {schluessel: bar}}]
      translations:
        en: “We have a king.
  - line:
      speaker: man
      ask: complete
      gap: lexeme:sultan
      distractors:
      - lexeme:nan
      - lexeme:qand
      forms:
        chg-Arab/standard:
          text: "اتی\u200cنی سلطان ابو قبیس… دیرلار."
          tokens: [{surface: "اتی\u200cنی", lexemes: [{lexeme: at.name, surface: ات, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: acc, surface: نی}], readings: {schluessel: atini}}, {surface: سلطان, lexemes: [{lexeme: sultan, base: true}, {lexeme: nom}], readings: {schluessel: sulṭān}}, {surface: ابو, lexemes: [{lexeme: abu, base: true}, {lexeme: nom}], readings: {schluessel: Abū}}, {surface: قبیس, lexemes: [{lexeme: qubays, base: true}, {lexeme: nom}], readings: {schluessel: Qubays}}, {surface: دیرلار, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: aor, surface: ر}, {lexeme: p3}, {lexeme: p3pl, surface: لار}], readings: {schluessel: derlär}}]
      translations:
        en: They call him Sultan Abu Qubays …
  - choose:
      prompt:
        en: What is the king called?
      options:
      - en: Sultan Abu Qubays
      - en: Tokhta
      - en: Jamal ud-Din
      answer: 0
  - line:
      speaker: man
      ask: arrange
      forms:
        chg-Arab/standard:
          text: پز انی پلماسمز.
          tokens: [{surface: پز, lexemes: [{lexeme: biz, base: true}, {lexeme: nom}], readings: {schluessel: biz}}, {surface: انی, lexemes: [{lexeme: ul, surface: ا, base: true}, {lexeme: acc, surface: نی}], readings: {schluessel: ani}}, {surface: پلماسمز, lexemes: [{lexeme: bil, surface: پل, base: true}, {lexeme: aor-neg, surface: ماس}, {lexeme: p1p, surface: مز}], readings: {schluessel: bilmäsmiz}}]
      translations:
        en: We do not know that.”
  - choose:
      prompt:
        en: What do the two travellers ask the man?
      options:
      - en: Whether his people have a king and scholars
      - en: Where the market is
      - en: What his name is
      answer: 0
scenarios:
- id: chg.a-stranger-in-town
  after: chg.u04.our-king
  title:
    en: A stranger in town
  setting:
    en: The bazaar of a strange city, in the time of the Tadhkira. You and a friend have just arrived from Bukhara.
  character:
    en: A curious townsman, polite but suspicious of newcomers, who speaks only Turki.
  goal:
    en: Tell him who you are and where you are from, ask his name, and ask whether the city has a king and scholars.
