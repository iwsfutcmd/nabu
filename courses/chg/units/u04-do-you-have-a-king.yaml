stories:
- id: chg.story.do-you-have-a-king
  node: chg.u04.story
  title:
    en: Do you have a king? (The Tadhkira of Jalāl ud-Dīn Katakī)
  characters:
  - id: jamal
    name:
      chg-Arab/standard: جمال الدین
      chg-Latn/schluessel: Jamāl ud-Dīn
  - id: man
    name:
      chg-Arab/standard: بیر کشی
      chg-Latn/schluessel: bir kiši
  steps:
  - line:
      speaker: jamal
      forms:
        chg-Arab/standard:
          text: فادشاهینکزلار بارمو؟
          tokens:
          - {surface: فادشاهینکزلار, sense: padishah, morphs: [{surface: فادشاه, kc: 'sense:padishah'}, {surface: ینکز, kc: 'form:poss2'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: بارمو, sense: bar, morphs: [{surface: بار, kc: 'sense:bar'}, {surface: مو, kc: 'form:q'}]}
        chg-Latn/schluessel:
          text: Ṗādišāhiŋizlar barmu?
          tokens:
          - {surface: Ṗādišāhiŋizlar, sense: padishah, morphs: [{surface: Ṗādišāh, kc: 'sense:padishah'}, {surface: iŋiz, kc: 'form:poss2'}, {surface: lar, kc: 'form:pl'}]}
          - {surface: barmu, sense: bar, morphs: [{surface: bar, kc: 'sense:bar'}, {surface: mu, kc: 'form:q'}]}
      translations:
        en: “Do you have a king?
  - line:
      speaker: jamal
      ask: complete
      gap: sense:alim
      distractors:
      - sense:at
      - sense:qoy
      forms:
        chg-Arab/standard:
          text: عالمینکزلار هم بارمو؟
          tokens:
          - {surface: عالمینکزلار, sense: alim, morphs: [{surface: عالم, kc: 'sense:alim'}, {surface: ینکز, kc: 'form:poss2'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: هم, sense: ham}
          - {surface: بارمو, sense: bar, morphs: [{surface: بار, kc: 'sense:bar'}, {surface: مو, kc: 'form:q'}]}
        chg-Latn/schluessel:
          text: ʿĀlimiŋizlar häm barmu?
          tokens:
          - {surface: ʿĀlimiŋizlar, sense: alim, morphs: [{surface: ʿĀlim, kc: 'sense:alim'}, {surface: iŋiz, kc: 'form:poss2'}, {surface: lar, kc: 'form:pl'}]}
          - {surface: häm, sense: ham}
          - {surface: barmu, sense: bar, morphs: [{surface: bar, kc: 'sense:bar'}, {surface: mu, kc: 'form:q'}]}
      translations:
        en: Do you have scholars too?”
  - line:
      speaker: man
      forms:
        chg-Arab/standard:
          text: فادشاهمز بار.
          tokens:
          - {surface: فادشاهمز, sense: padishah, morphs: [{surface: فادشاه, kc: 'sense:padishah'}, {surface: مز, kc: 'form:poss1p'}]}
          - {surface: بار, sense: bar}
        chg-Latn/schluessel:
          text: Ṗādišāhimiz bar.
          tokens:
          - {surface: Ṗādišāhimiz, sense: padishah, morphs: [{surface: Ṗādišāh, kc: 'sense:padishah'}, {surface: imiz, kc: 'form:poss1p'}]}
          - {surface: bar, sense: bar}
      translations:
        en: “We have a king.
  - line:
      speaker: man
      forms:
        chg-Arab/standard:
          text: "اتی\u200cنی سلطان ابو قبیس… دیرلار."
          tokens:
          - {surface: "اتی\u200cنی", sense: at.name, morphs: [{surface: ات, kc: 'sense:at.name'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: سلطان, sense: sultan}
          - {surface: ابو, sense: abu}
          - {surface: قبیس, sense: qubays}
          - {surface: دیرلار, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ر, kc: 'form:aor'}, {surface: لار, kc: 'form:p3pl'}]}
        chg-Latn/schluessel:
          text: Atini sulṭān Abū Qubays… derlär.
          tokens:
          - {surface: Atini, sense: at.name, morphs: [{surface: At, kc: 'sense:at.name'}, {surface: i, kc: 'form:poss3'}, {surface: ni, kc: 'form:acc'}]}
          - {surface: sulṭān, sense: sultan}
          - {surface: Abū, sense: abu}
          - {surface: Qubays, sense: qubays}
          - {surface: derlär, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: r, kc: 'form:aor'}, {surface: lär, kc: 'form:p3pl'}]}
      translations:
        en: They call him Sultan Abu Qubays …
  - choose:
      prompt:
        en: What is the king called?
      options:
      - en: Sultan Abu Qubays
      - en: Tokhta
      - en: Jamal ud-Din
      answer: 0
  - line:
      speaker: man
      ask: arrange
      forms:
        chg-Arab/standard:
          text: پز انی پلماسمز.
          tokens:
          - {surface: پز, sense: biz}
          - {surface: انی, sense: ul, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: پلماسمز, sense: bil, morphs: [{surface: پل, kc: 'sense:bil'}, {surface: ماس, kc: 'form:aor-neg'}, {surface: مز, kc: 'form:p1p'}]}
        chg-Latn/schluessel:
          text: Biz ani bilmäsmiz.
          tokens:
          - {surface: Biz, sense: biz}
          - {surface: ani, sense: ul, morphs: [{surface: a, kc: 'sense:ul'}, {surface: ni, kc: 'form:acc'}]}
          - {surface: bilmäsmiz, sense: bil, morphs: [{surface: bil, kc: 'sense:bil'}, {surface: mäs, kc: 'form:aor-neg'}, {surface: miz, kc: 'form:p1p'}]}
      translations:
        en: We do not know that.”
  - choose:
      prompt:
        en: What do the two travellers ask the man?
      options:
      - en: Whether his people have a king and scholars
      - en: Where the market is
      - en: What his name is
      answer: 0
scenarios:
- id: chg.a-stranger-in-town
  after: chg.u04.our-king
  title:
    en: A stranger in town
  setting:
    en: The bazaar of a strange city, in the time of the Tadhkira. You and a friend have just arrived from Bukhara.
  character:
    en: A curious townsman, polite but suspicious of newcomers, who speaks only Turki.
  goal:
    en: Tell him who you are and where you are from, ask his name, and ask whether the city has a king and scholars.
