stories:
- id: chg.story.do-you-have-a-king
  node: chg.u04.story
  title:
    en: Do you have a king? (The Tadhkira of Jalāl ud-Dīn Katakī)
  characters:
  - id: jamal
    name:
      chg-Arab/standard: جمال الدین
      chg-Latn/schluessel: Jamāl ud-Dīn
  - id: man
    name:
      chg-Arab/standard: بیر کشی
      chg-Latn/schluessel: bir kiši
  steps:
  - line:
      speaker: jamal
      forms:
        chg-Arab/standard:
          text: فادشاهینکزلار بارمو؟
          tokens:
          - {surface: فادشاهینکزلار, sense: padishah, readings: {schluessel: ṗādišāhiŋizlar}, morphs: [{surface: فادشاه, kc: 'sense:padishah'}, {surface: ینکز, kc: 'form:poss2'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: بارمو, sense: bar, readings: {schluessel: barmu}, morphs: [{surface: بار, kc: 'sense:bar'}, {surface: مو, kc: 'form:q'}]}
      translations:
        en: “Do you have a king?
  - line:
      speaker: jamal
      ask: complete
      gap: sense:alim
      distractors:
      - sense:at
      - sense:qoy
      forms:
        chg-Arab/standard:
          text: عالمینکزلار هم بارمو؟
          tokens:
          - {surface: عالمینکزلار, sense: alim, readings: {schluessel: ʿālimiŋizlar}, morphs: [{surface: عالم, kc: 'sense:alim'}, {surface: ینکز, kc: 'form:poss2'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: هم, sense: ham, readings: {schluessel: häm}}
          - {surface: بارمو, sense: bar, readings: {schluessel: barmu}, morphs: [{surface: بار, kc: 'sense:bar'}, {surface: مو, kc: 'form:q'}]}
      translations:
        en: Do you have scholars too?”
  - line:
      speaker: man
      forms:
        chg-Arab/standard:
          text: فادشاهمز بار.
          tokens:
          - {surface: فادشاهمز, sense: padishah, readings: {schluessel: ṗādišāhimiz}, morphs: [{surface: فادشاه, kc: 'sense:padishah'}, {surface: مز, kc: 'form:poss1p'}]}
          - {surface: بار, sense: bar, readings: {schluessel: bar}}
      translations:
        en: “We have a king.
  - line:
      speaker: man
      forms:
        chg-Arab/standard:
          text: "اتی\u200cنی سلطان ابو قبیس… دیرلار."
          tokens:
          - {surface: "اتی\u200cنی", sense: at.name, readings: {schluessel: atini}, morphs: [{surface: ات, kc: 'sense:at.name'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: سلطان, sense: sultan, readings: {schluessel: sulṭān}}
          - {surface: ابو, sense: abu, readings: {schluessel: Abū}}
          - {surface: قبیس, sense: qubays, readings: {schluessel: Qubays}}
          - {surface: دیرلار, sense: de, readings: {schluessel: derlär}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ر, kc: 'form:aor'}, {surface: لار, kc: 'form:p3pl'}]}
      translations:
        en: They call him Sultan Abu Qubays …
  - choose:
      prompt:
        en: What is the king called?
      options:
      - en: Sultan Abu Qubays
      - en: Tokhta
      - en: Jamal ud-Din
      answer: 0
  - line:
      speaker: man
      ask: arrange
      forms:
        chg-Arab/standard:
          text: پز انی پلماسمز.
          tokens:
          - {surface: پز, sense: biz, readings: {schluessel: biz}}
          - {surface: انی, sense: ul, readings: {schluessel: ani}, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: پلماسمز, sense: bil, readings: {schluessel: bilmäsmiz}, morphs: [{surface: پل, kc: 'sense:bil'}, {surface: ماس, kc: 'form:aor-neg'}, {surface: مز, kc: 'form:p1p'}]}
      translations:
        en: We do not know that.”
  - choose:
      prompt:
        en: What do the two travellers ask the man?
      options:
      - en: Whether his people have a king and scholars
      - en: Where the market is
      - en: What his name is
      answer: 0
scenarios:
- id: chg.a-stranger-in-town
  after: chg.u04.our-king
  title:
    en: A stranger in town
  setting:
    en: The bazaar of a strange city, in the time of the Tadhkira. You and a friend have just arrived from Bukhara.
  character:
    en: A curious townsman, polite but suspicious of newcomers, who speaks only Turki.
  goal:
    en: Tell him who you are and where you are from, ask his name, and ask whether the city has a king and scholars.
