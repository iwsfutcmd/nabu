stories:
- id: chg.story.the-pears-of-andijan
  node: chg.u03.story
  title:
    en: 'The pears of Andijan (Babur, Bāburnāma: Andijan)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "فرغانه ولایتی\u200cنینک پای\u200cتختی\u200cدور."
          tokens: [{surface: فرغانه, lexeme: farghana, readings: {schluessel: Farǧāna}}, {surface: "ولایتی\u200cنینک", lexemes: [{lexeme: wilayat, surface: ولایت, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: gen, surface: نینک}], readings: {schluessel: wilāyatiniŋ}}, {surface: "پای\u200cتختی\u200cدور", lexemes: [{lexeme: paytakht, surface: "پای\u200cتخت", base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: dur, surface: دور}], readings: {schluessel: pāytaḫtidur}}]
      translations:
        en: It is the capital of the country of Ferghana.
  - line:
      forms:
        chg-Arab/standard:
          text: اشلیغی وافر.
          tokens: [{surface: اشلیغی, lexemes: [{lexeme: ashligh, surface: اشلیغ, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: ašliǧi}}, {surface: وافر, lexeme: wafir, readings: {schluessel: wāfir}}]
      translations:
        en: Its grain is abundant.
  - line:
      ask: complete
      gap: lexeme:farawan
      distractors:
      - lexeme:issiq
      - lexeme:sawuq
      forms:
        chg-Arab/standard:
          text: "میوه\u200cسی فراوان، و اوزومی یخشی بولور."
          tokens: [{surface: "میوه\u200cسی", lexemes: [{lexeme: mewa, surface: "میوه\u200c", base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: mewäsi}}, {surface: فراوان, lexeme: farawan, readings: {schluessel: farāwān}}, {surface: و, lexeme: wa, readings: {schluessel: wä}}, {surface: اوزومی, lexemes: [{lexeme: uzum, surface: اوزوم, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: üzümi}}, {surface: یخشی, lexeme: yakhshi, readings: {schluessel: yaḫši}}, {surface: بولور, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: aor, surface: ور}], readings: {schluessel: bolur}}]
      translations:
        en: Its fruit is plentiful, and its grapes are good.
  - choose:
      prompt:
        en: What grows well in Andijan?
      options:
      - en: Grapes and other fruit
      - en: Only grain
      - en: 'Nothing: the land is poor'
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cنینک ناشپاتی\u200cسیدین یخشیراق ناشپاتی بولماس."
          tokens: [{surface: "اندجان\u200cنینک", lexemes: [{lexeme: andijan, surface: "اندجان\u200c", base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: Andijānniŋ}}, {surface: "ناشپاتی\u200cسیدین", lexemes: [{lexeme: nashpati, surface: "ناشپاتی\u200c", base: true}, {lexeme: poss3, surface: سی}, {lexeme: abl, surface: دین}], readings: {schluessel: našpatisidin}}, {surface: یخشیراق, lexemes: [{lexeme: yakhshi, surface: یخشی, base: true}, {lexeme: cmp, surface: راق}], readings: {schluessel: yaḫširaq}}, {surface: ناشپاتی, lexeme: nashpati, readings: {schluessel: našpati}}, {surface: بولماس, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: aor-neg, surface: ماس}], readings: {schluessel: bolmas}}]
      translations:
        en: There are no pears better than the pears of Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: موندین اولوغراق قورغان یوقتور.
          tokens: [{surface: موندین, lexemes: [{lexeme: bu, surface: مون, base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: mundin}}, {surface: اولوغراق, lexemes: [{lexeme: ulugh, surface: اولوغ, base: true}, {lexeme: cmp, surface: راق}], readings: {schluessel: uluǧraq}}, {surface: قورغان, lexeme: qurghan, readings: {schluessel: qurǧan}}, {surface: یوقتور, lexemes: [{lexeme: yoq, surface: یوق, base: true}, {lexeme: dur, surface: تور}], readings: {schluessel: yoqtur}}]
      translations:
        en: There is no greater fortress than this one.
  - choose:
      prompt:
        en: What does Babur say of Andijan's pears?
      options:
      - en: None are better.
      - en: They are bitter.
      - en: They come from Samarkand.
      answer: 0
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "ایلی تورک\u200cدور."
          tokens: [{surface: ایلی, lexemes: [{lexeme: el, surface: ایل, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: eli}}, {surface: "تورک\u200cدور", lexemes: [{lexeme: turk, surface: "تورک\u200c", base: true}, {lexeme: dur, surface: دور}], readings: {schluessel: Türkdur}}]
      translations:
        en: Its people are Turks.
scenarios:
- id: chg.in-the-fruit-market
  after: chg.u03.better
  title:
    en: In the fruit market
  setting:
    en: The fruit market of Andijan in late summer, about 1500. Pears, grapes and melons are piled high.
  character:
    en: A fruit seller from a village near Andijan, proud of his pears, who speaks only Turki.
  goal:
    en: Ask where the fruit comes from, say which is sweeter or better, and say where you are going next.
