# Chaghatay (chg), unit 3: The pears of Andijan (Babur, Bāburnāma: Andijan).
# The plural -lar; -din "from, than" and -raq "more"; -ǧa "to"; the aorist bolur "is (as a rule)" and bolmas;
# goes and comes (baradur, kelädur).
# The passage is Babur's own text (died 1530; the Hyderabad manuscript, in Beveridge's 1905 facsimile), as
# Schluessel (2018, ch. 11) types it; the rest was drafted by an LLM (provenance llm:…, status draft) and awaits
# a reviewer.
id: u03-the-pears-of-andijan
title:
  en: The pears of Andijan
cefr: A1
