stories:
- id: chg.story.the-pears-of-andijan
  node: chg.u03.story
  title:
    en: 'The pears of Andijan (Babur, Bāburnāma: Andijan)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "فرغانه ولایتی\u200cنینک پای\u200cتختی\u200cدور."
          tokens:
          - {surface: فرغانه, sense: farghana, readings: {schluessel: Farǧāna}}
          - {surface: "ولایتی\u200cنینک", sense: wilayat, readings: {schluessel: wilāyatiniŋ}, morphs: [{surface: ولایت, kc: 'sense:wilayat'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: "پای\u200cتختی\u200cدور", sense: paytakht, readings: {schluessel: pāytaḫtidur}, morphs: [{surface: "پای\u200cتخت", kc: 'sense:paytakht'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: It is the capital of the country of Ferghana.
  - line:
      forms:
        chg-Arab/standard:
          text: اشلیغی وافر.
          tokens:
          - {surface: اشلیغی, sense: ashligh, readings: {schluessel: ašliǧi}, morphs: [{surface: اشلیغ, kc: 'sense:ashligh'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: وافر, sense: wafir, readings: {schluessel: wāfir}}
      translations:
        en: Its grain is abundant.
  - line:
      ask: complete
      gap: sense:farawan
      distractors:
      - sense:tagh
      - sense:darwaza
      forms:
        chg-Arab/standard:
          text: "میوه\u200cسی فراوان، و اوزومی یخشی بولور."
          tokens:
          - {surface: "میوه\u200cسی", sense: mewa, readings: {schluessel: mewäsi}, morphs: [{surface: "میوه\u200c", kc: 'sense:mewa'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: فراوان, sense: farawan, readings: {schluessel: farāwān}}
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: اوزومی, sense: uzum, readings: {schluessel: üzümi}, morphs: [{surface: اوزوم, kc: 'sense:uzum'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: یخشی, sense: yakhshi, readings: {schluessel: yaḫši}}
          - {surface: بولور, sense: bol, readings: {schluessel: bolur}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ور, kc: 'form:aor'}]}
      translations:
        en: Its fruit is plentiful, and its grapes are good.
  - choose:
      prompt:
        en: What grows well in Andijan?
      options:
      - en: Grapes and other fruit
      - en: Only grain
      - en: 'Nothing: the land is poor'
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cنینک ناشپاتی\u200cسیدین یخشیراق ناشپاتی بولماس."
          tokens:
          - {surface: "اندجان\u200cنینک", sense: andijan, readings: {schluessel: Andijānniŋ}, morphs: [{surface: "اندجان\u200c", kc: 'sense:andijan'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: "ناشپاتی\u200cسیدین", sense: nashpati, readings: {schluessel: našpatisidin}, morphs: [{surface: "ناشپاتی\u200c", kc: 'sense:nashpati'}, {surface: سی, kc: 'form:poss3'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: یخشیراق, sense: yakhshi, readings: {schluessel: yaḫširaq}, morphs: [{surface: یخشی, kc: 'sense:yakhshi'}, {surface: راق, kc: 'form:cmp'}]}
          - {surface: ناشپاتی, sense: nashpati, readings: {schluessel: našpati}}
          - {surface: بولماس, sense: bol, readings: {schluessel: bolmas}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ماس, kc: 'form:aor-neg'}]}
      translations:
        en: There are no pears better than the pears of Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: موندین اولوغراق قورغان یوقتور.
          tokens:
          - {surface: موندین, sense: bu, readings: {schluessel: mundin}, morphs: [{surface: مون, kc: 'sense:bu'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: اولوغراق, sense: ulugh, readings: {schluessel: uluǧraq}, morphs: [{surface: اولوغ, kc: 'sense:ulugh'}, {surface: راق, kc: 'form:cmp'}]}
          - {surface: قورغان, sense: qurghan, readings: {schluessel: qurǧan}}
          - {surface: یوقتور, sense: yoq, readings: {schluessel: yoqtur}, morphs: [{surface: یوق, kc: 'sense:yoq'}, {surface: تور, kc: 'form:dur'}]}
      translations:
        en: There is no greater fortress than this one.
  - choose:
      prompt:
        en: What does Babur say of Andijan's pears?
      options:
      - en: None are better.
      - en: They are bitter.
      - en: They come from Samarkand.
      answer: 0
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "ایلی تورک\u200cدور."
          tokens:
          - {surface: ایلی, sense: el, readings: {schluessel: eli}, morphs: [{surface: ایل, kc: 'sense:el'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: "تورک\u200cدور", sense: turk, readings: {schluessel: Türkdur}, morphs: [{surface: "تورک\u200c", kc: 'sense:turk'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: Its people are Turks.
scenarios:
- id: chg.in-the-fruit-market
  after: chg.u03.better
  title:
    en: In the fruit market
  setting:
    en: The fruit market of Andijan in late summer, about 1500. Pears, grapes and melons are piled high.
  character:
    en: A fruit seller from a village near Andijan, proud of his pears, who speaks only Turki.
  goal:
    en: Ask where the fruit comes from, say which is sweeter or better, and say where you are going next.
