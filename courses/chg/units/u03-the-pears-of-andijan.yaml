- id: sense:samarqand
  gloss:
    en: Samarkand
  forms:
    chg-Arab/standard:
    - سمرقند
    chg-Latn/schluessel:
    - Samarqand
- id: form:pl
  gloss:
    en: '-lar, -lär: the plural'
  notes:
    en: '-lar after a back vowel (a, o, u: atlar "horses"), -lär after a front one (ä, ö, ü, and mostly i, e: öylär "houses"); the script writes both لار. After a number the noun stays singular: üč aṭ "three
      horses".'
- id: form:aor
  gloss:
    en: '-ur, -ar (-r after a vowel): does, will do; is, as a rule'
  notes:
    en: 'The aorist says what is so, or happens, as a rule or in general: üzümi yaḫši bolur "its grapes are (always) good". Babur describes his country in it.'
- id: form:aor-neg
  gloss:
    en: '-mas, -mäs: does not, will not; is not, as a rule'
  notes:
    en: 'The aorist''s negative: yaḫširaq našpati bolmas "there are no better pears". emäs "is not" is this form of the old verb e- "to be".'
- id: form:abl
  gloss:
    en: '-din (-dan, -tin): from; than'
  notes:
    en: 'Where from: Andijāndin "from Andijan". With -raq it is "than": mundin yaḫširaq "better than this".'
- id: form:dat
  gloss:
    en: '-ǧa, -gä (-qa, -kä): to, for'
  notes:
    en: 'Where to: šaharǧa "to the city". Scribes write it غه whatever the vowels (Kašǧarǧa, Ḫotangä), and قه or که after q or k.'
- id: form:cmp
  gloss:
    en: '-raq, -räk: more ..., -er'
  notes:
    en: 'yaḫši "good", yaḫširaq "better"; čoŋ "big", čoŋraq "bigger". What it is compared with takes -din: Andijāndin čoŋraq "bigger than Andijan".'
- id: form:pres
  gloss:
    en: '-a, -ä (-y after a vowel): the present-future: does, is doing, will do'
  notes:
    en: 'The stem takes -a or -ä, then a person ending: baradur "goes, is going, will go" (-dur for he, she, it). Unit 5 has the other persons.'
