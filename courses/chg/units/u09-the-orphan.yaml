- {id: chg.u09.found-no-one, kind: lesson, introduces: ['lexeme:hech', 'lexeme:tap', 'lexeme:munasib', 'lexeme:har', 'lexeme:fikir', 'lexeme:chand', 'lexeme:zurur', 'lexeme:sabab']}
