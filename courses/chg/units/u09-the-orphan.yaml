stories:
- id: chg.story.the-orphan
  node: chg.u09.story
  title:
    en: The orphan cuts his own cord (Abu 'l-Ghazi, Shajara-i Turk)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: هر چند فکر قیلدوق، هیچ مناسب کشی تابمادوق.
          tokens:
          - {surface: هر, sense: har, readings: {schluessel: här}}
          - {surface: چند, sense: chand, readings: {schluessel: čand}}
          - {surface: فکر, sense: fikir, readings: {schluessel: fikir}}
          - {surface: قیلدوق, sense: qil, readings: {schluessel: qilduq}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دوق, kc: 'form:past-1p'}]}
          - {surface: هیچ, sense: hech, readings: {schluessel: heč}}
          - {surface: مناسب, sense: munasib, readings: {schluessel: munāsib}}
          - {surface: کشی, sense: kishi, readings: {schluessel: kiši}}
          - {surface: تابمادوق, sense: tap, readings: {schluessel: tapmaduq}, morphs: [{surface: تاب, kc: 'sense:tap'}, {surface: ما, kc: 'form:neg'}, {surface: دوق, kc: 'form:past-1p'}]}
      translations:
        en: However much we thought about it, we found no one suitable.
  - line:
      forms:
        chg-Arab/standard:
          text: ضرور بولدی.
          tokens:
          - {surface: ضرور, sense: zurur, readings: {schluessel: żurūr}}
          - {surface: بولدی, sense: bol, readings: {schluessel: boldi}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: It became urgent.
  - line:
      ask: complete
      gap: sense:oz
      asks: form
      forms:
        chg-Arab/standard:
          text: "اول سبب\u200cدین اوزیمز ایتدوق."
          tokens:
          - {surface: اول, sense: ul, readings: {schluessel: ul}}
          - {surface: "سبب\u200cدین", sense: sabab, readings: {schluessel: sababdin}, morphs: [{surface: "سبب\u200c", kc: 'sense:sabab'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: اوزیمز, sense: oz, readings: {schluessel: özimiz}, morphs: [{surface: اوز, kc: 'sense:oz'}, {surface: یمز, kc: 'form:poss1p'}]}
          - {surface: ایتدوق, sense: eyt, readings: {schluessel: aytduq}, morphs: [{surface: ایت, kc: 'sense:eyt'}, {surface: دوق, kc: 'form:past-1p'}]}
      translations:
        en: For that reason we told it ourselves.
  - choose:
      prompt:
        en: Why did Abu 'l-Ghazi write the history himself?
      options:
      - en: He found no one suitable to write it.
      - en: The king ordered him to.
      - en: He found an old book.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "ترک\u200cنینک مثلی تورور: «اوکسوز اوز کندیکین کسار،» تیکان."
          tokens:
          - {surface: "ترک\u200cنینک", sense: turk, readings: {schluessel: Türkniŋ}, morphs: [{surface: "ترک\u200c", kc: 'sense:turk'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: مثلی, sense: mithl, readings: {schluessel: mis̱li}, morphs: [{surface: مثل, kc: 'sense:mithl'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: تورور, sense: turur, readings: {schluessel: turur}}
          - {surface: اوکسوز, sense: oksuz, readings: {schluessel: öksüz}}
          - {surface: اوز, sense: oz, readings: {schluessel: öz}}
          - {surface: کندیکین, sense: kindik, readings: {schluessel: kindikin}, morphs: [{surface: کندیک, kc: 'sense:kindik'}, {surface: ی, kc: 'form:poss3'}, {surface: ن, kc: 'form:acc'}]}
          - {surface: کسار, sense: kes, readings: {schluessel: kesär}, morphs: [{surface: کس, kc: 'sense:kes'}, {surface: ار, kc: 'form:aor'}]}
          - {surface: تیکان, sense: de, readings: {schluessel: tegän}, morphs: [{surface: تی, kc: 'sense:de'}, {surface: کان, kc: 'form:pcp'}]}
      translations:
        en: 'There is a proverb of the Turks that goes: “The orphan cuts his own navel cord.”'
  - choose:
      prompt:
        en: What does the proverb mean here?
      options:
      - en: 'No one else will do it for you: do it yourself.'
      - en: Orphans are unlucky.
      - en: Knives are dangerous.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: یر یوزی کینک تورور.
          tokens:
          - {surface: یر, sense: yar, readings: {schluessel: yer}}
          - {surface: یوزی, sense: yuz.face, readings: {schluessel: yüzi}, morphs: [{surface: یوز, kc: 'sense:yuz.face'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: کینک, sense: keng, readings: {schluessel: keŋ}}
          - {surface: تورور, sense: turur, readings: {schluessel: turur}}
      translations:
        en: The face of the earth is wide.
  - line:
      forms:
        chg-Arab/standard:
          text: ایشیتماکان یرلاریمزدا بولسا، عجب ایرماس.
          tokens:
          - {surface: ایشیتماکان, sense: ishit, readings: {schluessel: išitmägän}, morphs: [{surface: ایشیت, kc: 'sense:ishit'}, {surface: ما, kc: 'form:neg'}, {surface: کان, kc: 'form:pcp'}]}
          - {surface: یرلاریمزدا, sense: yar, readings: {schluessel: yerlärimizdä}, morphs: [{surface: یر, kc: 'sense:yar'}, {surface: لار, kc: 'form:pl'}, {surface: یمز, kc: 'form:poss1p'}, {surface: دا,
                kc: 'form:loc'}]}
          - {surface: بولسا, sense: bol, readings: {schluessel: bolsa}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: سا, kc: 'form:cond'}]}
          - {surface: عجب, sense: ajab, readings: {schluessel: ʿajab}}
          - {surface: ایرماس, sense: emas, readings: {schluessel: ermäs}}
      translations:
        en: If there is such a man in lands we have not heard of, it is no wonder.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: تقی «شجرهٔ ترک» تیب آت قویدوق.
          tokens:
          - {surface: تقی, sense: taqi, readings: {schluessel: taqi}}
          - {surface: شجرهٔ, sense: shajara, readings: {schluessel: šajara-i}}
          - {surface: ترک, sense: turk, readings: {schluessel: Türk}}
