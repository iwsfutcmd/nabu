# Chaghatay (chg), unit 9: The orphan cuts his own cord (Abu 'l-Ghazi, Shajara-i Turk).
# The past of "to be" (erdi "was"); öz "self, own"; heč "no"; -sa "if, when", and -sam "if I"; the participle
# as an adjective (išitmägän "unheard of") and tegän "called"; turur, an older -dur.
# The passage is Abu 'l-Ghazi Bahadur Khan's own preface (1664; Uppsala University Library, O Vet. 60; public
# domain), as Schluessel (2018, ch. 12) types it, in its spellings (tep for dep, yer for yär). The rest was
# drafted by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u09-the-orphan
title:
  en: The orphan
cefr: A2
kcs:
- id: sense:er
  gloss:
    en: 'to be (in the past: erdi "was")'
  forms:
    chg-Arab/standard:
    - ایر-
    chg-Latn/schluessel:
    - er-
  notes:
    en: 'The old verb "to be" lives on in the past: erdim "I was", erdi "he, she, it was, there was"; bar erdi "there was"; emäs erdi "was not". Also written idi.'
- id: sense:oz
  gloss:
    en: self; own
  forms:
    chg-Arab/standard:
    - اوز
    chg-Latn/schluessel:
    - öz
  notes:
    en: öz öyüm "my own house"; özüm "I myself"; özimiz aytduq "we told it ourselves".
- id: sense:tap
  gloss:
    en: to find
  forms:
    chg-Arab/standard:
    - تاپ-
    chg-Latn/schluessel:
    - tap-
- id: sense:hech
  gloss:
    en: no, not any; ever
  forms:
    chg-Arab/standard:
    - هیچ
    chg-Latn/schluessel:
    - heč
  notes:
    en: 'With a negative verb: heč kiši tapmaduq "we found no one".'
- id: sense:munasib
  gloss:
    en: fitting, suitable
  forms:
    chg-Arab/standard:
    - مناسب
    chg-Latn/schluessel:
    - munāsib
- id: sense:har
  gloss:
    en: every, each
  forms:
    chg-Arab/standard:
    - هر
    chg-Latn/schluessel:
    - här
  notes:
    en: här čand "however much, however many times".
- id: sense:chand
  gloss:
    en: how many; some (Persian)
  forms:
    chg-Arab/standard:
    - چند
    chg-Latn/schluessel:
    - čand
- id: sense:fikir
  gloss:
    en: thought; idea
  forms:
    chg-Arab/standard:
    - فکر
    chg-Latn/schluessel:
    - fikir
  notes:
    en: fikir qil- "to think, consider".
- id: sense:zurur
  gloss:
    en: necessary, urgent
  forms:
    chg-Arab/standard:
    - ضرور
    chg-Latn/schluessel:
    - żurūr
- id: sense:sabab
  gloss:
    en: reason, cause
  forms:
    chg-Arab/standard:
    - سبب
    chg-Latn/schluessel:
    - sabab
  notes:
    en: ul sababdin "for that reason".
- id: sense:mithl
  gloss:
    en: proverb, saying; likeness
  forms:
    chg-Arab/standard:
    - مثل
    chg-Latn/schluessel:
    - mis̱l
- id: sense:turur
  gloss:
    en: is, are (an older form of -dur)
  forms:
    chg-Arab/standard:
    - تورور
    chg-Latn/schluessel:
    - turur
  notes:
    en: 'turur, the aorist of tur- "to stand", stands where later texts have -dur: mis̱li turur "there is a proverb".'
- id: sense:oksuz
  gloss:
    en: orphan
  forms:
    chg-Arab/standard:
    - اوکسوز
    chg-Latn/schluessel:
    - öksüz
- id: sense:kindik
  gloss:
    en: navel; navel cord
  forms:
    chg-Arab/standard:
    - کندیک
    chg-Latn/schluessel:
    - kindik
- id: sense:kes
  gloss:
    en: to cut
  forms:
    chg-Arab/standard:
    - کس-
    chg-Latn/schluessel:
    - kes-
- id: sense:keng
  gloss:
    en: wide, broad
  forms:
    chg-Arab/standard:
    - کینک
    chg-Latn/schluessel:
    - keŋ
- id: sense:yuz.face
  gloss:
    en: face; surface
  forms:
    chg-Arab/standard:
    - یوز
    chg-Latn/schluessel:
    - yüz
  notes:
    en: yer yüzi "the face of the earth". Spelled as yüz "hundred".
- id: sense:ishit
  gloss:
    en: to hear
  forms:
    chg-Arab/standard:
    - ایشیت-
    chg-Latn/schluessel:
    - išit-
- id: sense:ajab
  gloss:
    en: wonder; strange, wonderful
  forms:
    chg-Arab/standard:
    - عجب
    chg-Latn/schluessel:
    - ʿajab
  notes:
    en: ʿajab ermäs "it is no wonder".
- id: sense:taqi
  gloss:
    en: and; also; again
  forms:
    chg-Arab/standard:
    - تقی
    chg-Latn/schluessel:
    - taqi
  notes:
    en: 'Abu ''l-Ghazi''s "and": taqi toqquz bāb qilduq "and we made nine chapters".'
- id: sense:shajara
  gloss:
    en: tree; family tree, genealogy
  forms:
    chg-Arab/standard:
    - شجره
    chg-Latn/schluessel:
    - šajara
- id: sense:qoy.put
  gloss:
    en: to put, place; to give (a name)
  forms:
    chg-Arab/standard:
    - قوی-
    chg-Latn/schluessel:
    - qoy-
  notes:
    en: 'at qoy- "to name": "Šajara-i Türk" tep at qoyduq "we named it the Genealogy of the Turks".'
- id: form:cond-1s
  gloss:
    en: '-sam, -säm: if I, when I'
  notes:
    en: 'barsam "if I go, when I went"; tesäm "if I said". The other persons follow the past: -saŋ, -saŋiz, -saq, -saŋlar, -salar.'
