stories:
- id: chg.story.the-orphan
  node: chg.u09.story
  title:
    en: The orphan cuts his own cord (Abu 'l-Ghazi, Shajara-i Turk)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: هر چند فکر قیلدوق، هیچ مناسب کشی تابمادوق.
          tokens: [{surface: هر, lexeme: har, readings: {schluessel: här}}, {surface: چند, lexeme: chand, readings: {schluessel: čand}}, {surface: فکر, lexeme: fikir, readings: {schluessel: fikir}}, {surface: قیلدوق, lexemes: [{lexeme: qil, surface: قیل, base: true}, {lexeme: past, surface: دو}, {lexeme: pp1p, surface: ق}], readings: {schluessel: qilduq}}, {surface: هیچ, lexeme: hech, readings: {schluessel: heč}}, {surface: مناسب, lexeme: munasib, readings: {schluessel: munāsib}}, {surface: کشی, lexeme: kishi, readings: {schluessel: kiši}}, {surface: تابمادوق, lexemes: [{lexeme: tap, surface: تاب, base: true}, {lexeme: neg, surface: ما}, {lexeme: past, surface: دو}, {lexeme: pp1p, surface: ق}], readings: {schluessel: tapmaduq}}]
      translations:
        en: However much we thought about it, we found no one suitable.
  - line:
      forms:
        chg-Arab/standard:
          text: ضرور بولدی.
          tokens: [{surface: ضرور, lexeme: zurur, readings: {schluessel: żurūr}}, {surface: بولدی, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: past, surface: دی}], readings: {schluessel: boldi}}]
      translations:
        en: It became urgent.
  - line:
      ask: complete
      gap: lexeme:oz
      asks: form
      forms:
        chg-Arab/standard:
          text: "اول سبب\u200cدین اوزیمز ایتدوق."
          tokens: [{surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: "سبب\u200cدین", lexemes: [{lexeme: sabab, surface: "سبب\u200c", base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: sababdin}}, {surface: اوزیمز, lexemes: [{lexeme: oz, surface: اوز, base: true}, {lexeme: poss1p, surface: یمز}], readings: {schluessel: özimiz}}, {surface: ایتدوق, lexemes: [{lexeme: eyt, surface: ایت, base: true}, {lexeme: past, surface: دو}, {lexeme: pp1p, surface: ق}], readings: {schluessel: aytduq}}]
      translations:
        en: For that reason we told it ourselves.
  - choose:
      prompt:
        en: Why did Abu 'l-Ghazi write the history himself?
      options:
      - en: He found no one suitable to write it.
      - en: The king ordered him to.
      - en: He found an old book.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "ترک\u200cنینک مثلی تورور: «اوکسوز اوز کندیکین کسار،» تیکان."
          tokens: [{surface: "ترک\u200cنینک", lexemes: [{lexeme: turk, surface: "ترک\u200c", base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: Türkniŋ}}, {surface: مثلی, lexemes: [{lexeme: mithl, surface: مثل, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: mis̱li}}, {surface: تورور, lexeme: turur, readings: {schluessel: turur}}, {surface: اوکسوز, lexeme: oksuz, readings: {schluessel: öksüz}}, {surface: اوز, lexeme: oz, readings: {schluessel: öz}}, {surface: کندیکین, lexemes: [{lexeme: kindik, surface: کندیک, base: true}, {lexeme: poss3, surface: ی}, {lexeme: acc, surface: ن}], readings: {schluessel: kindikin}}, {surface: کسار, lexemes: [{lexeme: kes, surface: کس, base: true}, {lexeme: aor, surface: ار}], readings: {schluessel: kesär}}, {surface: تیکان, lexemes: [{lexeme: de, surface: تی, base: true}, {lexeme: pcp, surface: کان}], readings: {schluessel: tegän}}]
      translations:
        en: 'There is a proverb of the Turks that goes: “The orphan cuts his own navel cord.”'
  - choose:
      prompt:
        en: What does the proverb mean here?
      options:
      - en: 'No one else will do it for you: do it yourself.'
      - en: Orphans are unlucky.
      - en: Knives are dangerous.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: یر یوزی کینک تورور.
          tokens: [{surface: یر, lexeme: yar, readings: {schluessel: yer}}, {surface: یوزی, lexemes: [{lexeme: yuz.face, surface: یوز, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: yüzi}}, {surface: کینک, lexeme: keng, readings: {schluessel: keŋ}}, {surface: تورور, lexeme: turur, readings: {schluessel: turur}}]
      translations:
        en: The face of the earth is wide.
  - line:
      forms:
        chg-Arab/standard:
          text: ایشیتماکان یرلاریمزدا بولسا، عجب ایرماس.
          tokens: [{surface: ایشیتماکان, lexemes: [{lexeme: ishit, surface: ایشیت, base: true}, {lexeme: neg, surface: ما}, {lexeme: pcp, surface: کان}], readings: {schluessel: išitmägän}}, {surface: یرلاریمزدا, lexemes: [{lexeme: yar, surface: یر, base: true}, {lexeme: pl, surface: لار}, {lexeme: poss1p, surface: یمز}, {lexeme: loc, surface: دا}], readings: {schluessel: yerlärimizdä}}, {surface: بولسا, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: cond, surface: سا}], readings: {schluessel: bolsa}}, {surface: عجب, lexeme: ajab, readings: {schluessel: ʿajab}}, {surface: ایرماس, lexeme: emas, readings: {schluessel: ermäs}}]
      translations:
        en: If there is such a man in lands we have not heard of, it is no wonder.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: تقی «شجرهٔ ترک» تیب آت قویدوق.
          tokens: [{surface: تقی, lexeme: taqi, readings: {schluessel: taqi}}, {surface: شجرهٔ, lexemes: [{lexeme: shajara, surface: شجرهٔ, base: true}, {lexeme: ezafe, surface: ''}], readings: {schluessel: šajarah-i}}, {surface: ترک, lexeme: turk, readings: {schluessel: Türk}}, {surface: تیب, lexemes: [{lexeme: de, surface: تی, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: tep}}, {surface: آت, lexeme: at.name, readings: {schluessel: at}}, {surface: قویدوق, lexemes: [{lexeme: qoy.put, surface: قوی, base: true}, {lexeme: past, surface: دو}, {lexeme: pp1p, surface: ق}], readings: {schluessel: qoyduq}}]
      translations:
        en: And we named it “The Genealogy of the Turks”.
scenarios:
- id: chg.the-historian
  after: chg.u09.the-earth
  title:
    en: The historian's study
  setting:
    en: Khiva, 1664 (1074 of the Hijra). Abu 'l-Ghazi Khan is writing the history of his forefathers.
  character:
    en: A young scribe at the khan's court, eager and a little proud, who speaks only Turki.
  goal:
    en: Ask who is writing the book and why, what it is called, and say what you would do if there were no one to write it.
