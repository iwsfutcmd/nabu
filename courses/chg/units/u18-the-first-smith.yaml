# Chaghatay (chg), unit 18: The first smith (The Manual of the Blacksmiths).
# maŋa, saŋa "to me, to you"; asān and muškil "easy and hard"; -ǧan with a person ending, "have done" (yaratkanmän "I
# have created"); -sun "let him"; crafts in -lik and -či; farmān boldi "the order came".
# The passage is a blacksmiths' risāla copied in Yarkand in 1929 (Lund University Library, Jarring Prov. 1; a
# traditional, anonymous text), as Schluessel (2018, ch. 10) types it, altered by him for clarity; the story leaves out
# the blessings after the names (…). The rest was drafted by an LLM (provenance llm:…, status draft) and awaits a
# reviewer.
id: u18-the-first-smith
