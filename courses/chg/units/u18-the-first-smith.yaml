stories:
- id: chg.story.the-first-smith
  node: chg.u18.story
  title:
    en: The first smith (The Manual of the Blacksmiths)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: حضرت جبرائیل… درکاه حقکه باریب، حضرت داود سوزینی قیلدیلار.
          tokens: [{surface: حضرت, lexeme: hazrat, readings: {schluessel: ḥażrat-i}}, {surface: جبرائیل, lexeme: jibrail, readings: {schluessel: Jibrāʾīl}}, {surface: درکاه, lexeme: dargah, readings: {schluessel: dargāh-i}}, {surface: حقکه, lexemes: [{lexeme: haqq, surface: حق, base: true}, {lexeme: dat, surface: که}], readings: {schluessel: ḥaqqgä}}, {surface: باریب, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: barip}}, {surface: حضرت, lexeme: hazrat, readings: {schluessel: ḥażrat-i}}, {surface: داود, lexeme: dawud, readings: {schluessel: Dāwud}}, {surface: سوزینی, lexemes: [{lexeme: soz, surface: سوز, base: true}, {lexeme: poss3, surface: ی}, {lexeme: acc, surface: نی}], readings: {schluessel: sözini}}, {surface: قیلدیلار, lexemes: [{lexeme: qil, surface: قیل, base: true}, {lexeme: past-3pl, surface: دیلار}], readings: {schluessel: qildilar}}]
      translations:
        en: Jibrāʾīl (peace be upon him) went into the presence of God and spoke of Dawud.
  - line:
      ask: complete
      gap: lexeme:kasb
      distractors:
      - lexeme:jannat
      - lexeme:tash
      forms:
        chg-Arab/standard:
          text: حضرت جبرائیل… حضرت داودغه کلیب دیدیکه، «ای، داود! سنکا اهنکرلیک کسب فرمان بولدیلار.»
          tokens: [{surface: حضرت, lexeme: hazrat, readings: {schluessel: ḥażrat-i}}, {surface: جبرائیل, lexeme: jibrail, readings: {schluessel: Jibrāʾīl}}, {surface: حضرت, lexeme: hazrat, readings: {schluessel: ḥażrat-i}}, {surface: داودغه, lexemes: [{lexeme: dawud, surface: داود, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: Dāwudǧa}}, {surface: کلیب, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: kelip}}, {surface: دیدیکه, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: past-3, surface: دی}, {lexeme: ke, surface: که}], readings: {schluessel: dedike}}, {surface: ای, lexeme: ay.voc, readings: {schluessel: ay}}, {surface: داود, lexeme: dawud, readings: {schluessel: Dāwud}}, {surface: سنکا, lexemes: [{lexeme: san, surface: سن, base: true}, {lexeme: dat, surface: کا}], readings: {schluessel: saŋa}}, {surface: اهنکرلیک, lexemes: [{lexeme: ahangar, surface: اهنکر, base: true}, {lexeme: liq, surface: لیک}], readings: {schluessel: ahangirlik}}, {surface: کسب, lexeme: kasb, readings: {schluessel: kasb}}, {surface: فرمان, lexeme: farman, readings: {schluessel: farmān}}, {surface: بولدیلار, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: past-3pl, surface: دیلار}], readings: {schluessel: boldilar}}]
      translations:
        en: Jibrāʾīl came to Dawud and said, “Oh, Dawud! The craft of smithing has been commanded to you.”
