stories:
- id: chg.story.the-first-smith
  node: chg.u18.story
  title:
    en: The first smith (The Manual of the Blacksmiths)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: حضرت جبرائیل… درکاه حقکه باریب، حضرت داود سوزینی قیلدیلار.
          tokens:
          - {surface: حضرت, sense: hazrat, readings: {schluessel: ḥażrat-i}}
          - {surface: جبرائیل, sense: jibrail, readings: {schluessel: Jibrāʾīl}}
          - {surface: درکاه, sense: dargah, readings: {schluessel: dargāh-i}}
          - {surface: حقکه, sense: haqq, readings: {schluessel: ḥaqqgä}, morphs: [{surface: حق, kc: 'sense:haqq'}, {surface: که, kc: 'form:dat'}]}
          - {surface: باریب, sense: bar.go, readings: {schluessel: barip}, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: حضرت, sense: hazrat, readings: {schluessel: ḥażrat-i}}
          - {surface: داود, sense: dawud, readings: {schluessel: Dāwud}}
          - {surface: سوزینی, sense: soz, readings: {schluessel: sözini}, morphs: [{surface: سوز, kc: 'sense:soz'}, {surface: ی, kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: قیلدیلار, sense: qil, readings: {schluessel: qildilar}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دیلار, kc: 'form:past-3pl'}]}
      translations:
        en: Jibrāʾīl (peace be upon him) went into the presence of God and spoke of Dawud.
  - line:
      ask: complete
      gap: sense:kasb
      distractors:
      - sense:kar
      - sense:farman
      forms:
        chg-Arab/standard:
          text: حضرت جبرائیل… حضرت داودغه کلیب دیدیکه، «ای، داود! سنکا اهنکرلیک کسب فرمان بولدیلار.»
          tokens:
          - {surface: حضرت, sense: hazrat, readings: {schluessel: ḥażrat-i}}
          - {surface: جبرائیل, sense: jibrail, readings: {schluessel: Jibrāʾīl}}
          - {surface: حضرت, sense: hazrat, readings: {schluessel: ḥażrat-i}}
          - {surface: داودغه, sense: dawud, readings: {schluessel: Dāwudǧa}, morphs: [{surface: داود, kc: 'sense:dawud'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: کلیب, sense: kal, readings: {schluessel: kelip}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: دیدیکه, sense: de, readings: {schluessel: dedike}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: دی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: ای, sense: ay.voc, readings: {schluessel: ay}}
          - {surface: داود, sense: dawud, readings: {schluessel: Dāwud}}
          - {surface: سنکا, sense: san, readings: {schluessel: saŋa}, morphs: [{surface: سن, kc: 'sense:san'}, {surface: کا, kc: 'form:dat'}]}
          - {surface: اهنکرلیک, sense: ahangar, readings: {schluessel: ahangirlik}, morphs: [{surface: اهنکر, kc: 'sense:ahangar'}, {surface: لیک, kc: 'form:liq'}]}
          - {surface: کسب, sense: kasb, readings: {schluessel: kasb}}
          - {surface: فرمان, sense: farman, readings: {schluessel: farmān}}
          - {surface: بولدیلار, sense: bol, readings: {schluessel: boldilar}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: دیلار, kc: 'form:past-3pl'}]}
      translations:
        en: Jibrāʾīl came to Dawud and said, “Oh, Dawud! The craft of smithing has been commanded to you.”
  - choose:
      prompt:
        en: What craft was Dawud given?
      options:
      - en: Smithing
      - en: Carpentry
      - en: Farming
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … حضرت داود مناجات قیلدیلار کیم، دیدیکه، «ای، فروردیکاریم، هر کارلار سنکا اسان، و بزلارکه مشکل ترور!»
          tokens:
          - {surface: حضرت, sense: hazrat, readings: {schluessel: ḥażrat-i}}
          - {surface: داود, sense: dawud, readings: {schluessel: Dāwud}}
          - {surface: مناجات, sense: munajat, readings: {schluessel: munājāt}}
          - {surface: قیلدیلار, sense: qil, readings: {schluessel: qildilar}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دیلار, kc: 'form:past-3pl'}]}
          - {surface: کیم, sense: kim.that, readings: {schluessel: kim}}
          - {surface: دیدیکه, sense: de, readings: {schluessel: dedike}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: دی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: ای, sense: ay.voc, readings: {schluessel: ay}}
          - {surface: فروردیکاریم, sense: parwardigar, readings: {schluessel: ṗarwardigārim}, morphs: [{surface: فروردیکار, kc: 'sense:parwardigar'}, {surface: یم, kc: 'form:poss1s'}]}
          - {surface: هر, sense: har, readings: {schluessel: här}}
          - {surface: کارلار, sense: kar, readings: {schluessel: kārlar}, morphs: [{surface: کار, kc: 'sense:kar'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: سنکا, sense: san, readings: {schluessel: saŋa}, morphs: [{surface: سن, kc: 'sense:san'}, {surface: کا, kc: 'form:dat'}]}
          - {surface: اسان, sense: asan, readings: {schluessel: asān}}
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: بزلارکه, sense: biz, readings: {schluessel: bizlärgä}, morphs: [{surface: بز, kc: 'sense:biz'}, {surface: لار, kc: 'form:pl'}, {surface: که, kc: 'form:dat'}]}
          - {surface: مشکل, sense: mushkil, readings: {schluessel: muškil}}
          - {surface: ترور, sense: turur, readings: {schluessel: turur}}
      translations:
        en: … Dawud prayed, saying, “Oh, my Lord, every craft is easy for you, and hard for us!”
  - line:
      forms:
        chg-Arab/standard:
          text: "شول ساعتده فرمان بولدیکه، «ای، جبرائیل! جنت\u200cده بر قوی و بر تاش یراتکان\u200cمن. انی الیب کلکیل،» دیدی."
          tokens:
          - {surface: شول, sense: shul, readings: {schluessel: šul}}
          - {surface: ساعتده, sense: saat, readings: {schluessel: sāʿatdä}, morphs: [{surface: ساعت, kc: 'sense:saat'}, {surface: ده, kc: 'form:loc'}]}
          - {surface: فرمان, sense: farman, readings: {schluessel: farmān}}
          - {surface: بولدیکه, sense: bol, readings: {schluessel: boldike}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: دی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: ای, sense: ay.voc, readings: {schluessel: ay}}
          - {surface: جبرائیل, sense: jibrail, readings: {schluessel: Jibrāʾīl}}
          - {surface: "جنت\u200cده", sense: jannat, readings: {schluessel: jannatdä}, morphs: [{surface: "جنت\u200c", kc: 'sense:jannat'}, {surface: ده, kc: 'form:loc'}]}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: قوی, sense: qoy, readings: {schluessel: qoy}}
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: تاش, sense: tash, readings: {schluessel: taš}}
          - {surface: "یراتکان\u200cمن", sense: yarat, readings: {schluessel: yaratkanmän}, morphs: [{surface: یرات, kc: 'sense:yarat'}, {surface: "کان\u200c", kc: 'form:pcp'}, {surface: من, kc: 'form:p1s'}]}
          - {surface: انی, sense: ul, readings: {schluessel: ani}, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: الیب, sense: al, readings: {schluessel: alip}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: کلکیل, sense: kal, readings: {schluessel: kälgil}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: کیل, kc: 'form:imp'}]}
          - {surface: دیدی, sense: de, readings: {schluessel: dedi}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: 'At that very hour the command came: “Oh, Jibrāʾīl! In Paradise I have created a sheep and a stone. Bring them.”'
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: درحال حضرت جبرائیل الیب کلدیلار.
          tokens:
          - {surface: درحال, sense: darhal, readings: {schluessel: darḥāl}}
          - {surface: حضرت, sense: hazrat, readings: {schluessel: ḥażrat-i}}
          - {surface: جبرائیل, sense: jibrail, readings: {schluessel: Jibrāʾīl}}
          - {surface: الیب, sense: al, readings: {schluessel: alip}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: کلدیلار, sense: kal, readings: {schluessel: käldilär}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: دیلار, kc: 'form:past-3pl'}]}
      translations:
        en: Immediately Jibrāʾīl brought them.
  - choose:
      prompt:
        en: What had God created in Paradise for the first smith?
      options:
      - en: A sheep and a stone
      - en: A horse and a sword
      - en: A tree and a river
      answer: 0
scenarios:
- id: chg.at-the-smithy
  after: chg.u18.easy-and-hard
  title:
    en: At the smithy
  setting:
    en: A smithy in the bazaar of Yarkand, around 1900. You want to learn a craft.
  character:
    en: An old blacksmith, proud of his guild and its legends, who speaks only Turki.
  goal:
    en: Ask him what his craft is and who taught it, say which crafts are easy or hard for you, and ask whether he has made the knife on his wall himself.
