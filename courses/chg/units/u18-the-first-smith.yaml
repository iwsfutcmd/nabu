      forms:
        chg-Arab/standard:
          text: "شول ساعتده فرمان بولدیکه، «ای، جبرائیل! جنت\u200cده بر قوی و بر تاش یراتکان\u200cمن. انی الیب کلکیل،» دیدی."
          tokens:
