          - {surface: سوزینی, sense: soz, morphs: [{surface: سوز, kc: 'sense:soz'}, {surface: ی, kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: قیلدیلار, sense: qil, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دیلار, kc: 'form:past-3pl'}]}
        chg-Latn/schluessel:
          text: Ḥażrat-i Jibrāʾīl… dargāh-i ḥaqqgä barip, ḥażrat-i Dāwud sözini qildilar.
          tokens:
          - {surface: Ḥażrat-i, sense: hazrat}
          - {surface: Jibrāʾīl, sense: jibrail}
          - {surface: dargāh-i, sense: dargah}
          - {surface: ḥaqqgä, sense: haqq, morphs: [{surface: ḥaqq, kc: 'sense:haqq'}, {surface: gä, kc: 'form:dat'}]}
          - {surface: barip, sense: bar.go, morphs: [{surface: bar, kc: 'sense:bar.go'}, {surface: ip, kc: 'form:cv-p'}]}
          - {surface: ḥażrat-i, sense: hazrat}
          - {surface: Dāwud, sense: dawud}
          - {surface: sözini, sense: soz, morphs: [{surface: söz, kc: 'sense:soz'}, {surface: i, kc: 'form:poss3'}, {surface: ni, kc: 'form:acc'}]}
          - {surface: qildilar, sense: qil, morphs: [{surface: qil, kc: 'sense:qil'}, {surface: dilar, kc: 'form:past-3pl'}]}
      translations:
        en: Jibrāʾīl (peace be upon him) went into the presence of God and spoke of Dawud.
  - line:
      ask: complete
      gap: sense:kasb
      distractors:
      - sense:kar
      - sense:farman
      forms:
        chg-Arab/standard:
          text: حضرت جبرائیل… حضرت داودغه کلیب دیدیکه، «ای، داود! سنکا اهنکرلیک کسب فرمان بولدیلار.»
          tokens:
          - {surface: حضرت, sense: hazrat}
          - {surface: جبرائیل, sense: jibrail}
          - {surface: حضرت, sense: hazrat}
          - {surface: داودغه, sense: dawud, morphs: [{surface: داود, kc: 'sense:dawud'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: کلیب, sense: kal, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: دیدیکه, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: دی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: ای, sense: ay.voc}
          - {surface: داود, sense: dawud}
          - {surface: سنکا, sense: san, morphs: [{surface: سن, kc: 'sense:san'}, {surface: کا, kc: 'form:dat'}]}
          - {surface: اهنکرلیک, sense: ahangar, morphs: [{surface: اهنکر, kc: 'sense:ahangar'}, {surface: لیک, kc: 'form:liq'}]}
          - {surface: کسب, sense: kasb}
          - {surface: فرمان, sense: farman}
          - {surface: بولدیلار, sense: bol, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: دیلار, kc: 'form:past-3pl'}]}
        chg-Latn/schluessel:
          text: Ḥażrat-i Jibrāʾīl… ḥażrat-i Dāwudǧa kelip dedike, “Ay, Dāwud! Saŋa ahangirlik kasb farmān boldilar.”
          tokens:
          - {surface: Ḥażrat-i, sense: hazrat}
          - {surface: Jibrāʾīl, sense: jibrail}
          - {surface: ḥażrat-i, sense: hazrat}
          - {surface: Dāwudǧa, sense: dawud, morphs: [{surface: Dāwud, kc: 'sense:dawud'}, {surface: ǧa, kc: 'form:dat'}]}
          - {surface: kelip, sense: kal, morphs: [{surface: kel, kc: 'sense:kal'}, {surface: ip, kc: 'form:cv-p'}]}
          - {surface: dedike, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: di, kc: 'form:past-3'}, {surface: ke, kc: 'form:ke'}]}
          - {surface: Ay, sense: ay.voc}
          - {surface: Dāwud, sense: dawud}
          - {surface: Saŋa, sense: san, morphs: [{surface: Sa, kc: 'sense:san'}, {surface: ŋa, kc: 'form:dat'}]}
          - {surface: ahangirlik, sense: ahangar, morphs: [{surface: ahangir, kc: 'sense:ahangar'}, {surface: lik, kc: 'form:liq'}]}
          - {surface: kasb, sense: kasb}
          - {surface: farmān, sense: farman}
          - {surface: boldilar, sense: bol, morphs: [{surface: bol, kc: 'sense:bol'}, {surface: dilar, kc: 'form:past-3pl'}]}
      translations:
        en: Jibrāʾīl came to Dawud and said, “Oh, Dawud! The craft of smithing has been commanded to you.”
  - choose:
      prompt:
        en: What craft was Dawud given?
      options:
      - en: Smithing
      - en: Carpentry
      - en: Farming
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … حضرت داود مناجات قیلدیلار کیم، دیدیکه، «ای، فروردیکاریم، هر کارلار سنکا اسان، و بزلارکه مشکل ترور!»
          tokens:
          - {surface: حضرت, sense: hazrat}
          - {surface: داود, sense: dawud}
          - {surface: مناجات, sense: munajat}
          - {surface: قیلدیلار, sense: qil, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دیلار, kc: 'form:past-3pl'}]}
          - {surface: کیم, sense: kim.that}
          - {surface: دیدیکه, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: دی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: ای, sense: ay.voc}
          - {surface: فروردیکاریم, sense: parwardigar, morphs: [{surface: فروردیکار, kc: 'sense:parwardigar'}, {surface: یم, kc: 'form:poss1s'}]}
          - {surface: هر, sense: har}
          - {surface: کارلار, sense: kar, morphs: [{surface: کار, kc: 'sense:kar'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: سنکا, sense: san, morphs: [{surface: سن, kc: 'sense:san'}, {surface: کا, kc: 'form:dat'}]}
          - {surface: اسان, sense: asan}
          - {surface: و, sense: wa}
          - {surface: بزلارکه, sense: biz, morphs: [{surface: بز, kc: 'sense:biz'}, {surface: لار, kc: 'form:pl'}, {surface: که, kc: 'form:dat'}]}
          - {surface: مشکل, sense: mushkil}
          - {surface: ترور, sense: turur}
        chg-Latn/schluessel:
          text: … Ḥażrat-i Dāwud munājāt qildilar kim, dedike, “Ay, ṗarwardigārim, här kārlar saŋa asān, wä bizlärgä muškil turur!”
          tokens:
          - {surface: Ḥażrat-i, sense: hazrat}
          - {surface: Dāwud, sense: dawud}
          - {surface: munājāt, sense: munajat}
          - {surface: qildilar, sense: qil, morphs: [{surface: qil, kc: 'sense:qil'}, {surface: dilar, kc: 'form:past-3pl'}]}
          - {surface: kim, sense: kim.that}
          - {surface: dedike, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: di, kc: 'form:past-3'}, {surface: ke, kc: 'form:ke'}]}
          - {surface: Ay, sense: ay.voc}
          - {surface: ṗarwardigārim, sense: parwardigar, morphs: [{surface: ṗarwardigār, kc: 'sense:parwardigar'}, {surface: im, kc: 'form:poss1s'}]}
          - {surface: här, sense: har}
          - {surface: kārlar, sense: kar, morphs: [{surface: kār, kc: 'sense:kar'}, {surface: lar, kc: 'form:pl'}]}
          - {surface: saŋa, sense: san, morphs: [{surface: sa, kc: 'sense:san'}, {surface: ŋa, kc: 'form:dat'}]}
          - {surface: asān, sense: asan}
          - {surface: wä, sense: wa}
          - {surface: bizlärgä, sense: biz, morphs: [{surface: biz, kc: 'sense:biz'}, {surface: lär, kc: 'form:pl'}, {surface: gä, kc: 'form:dat'}]}
          - {surface: muškil, sense: mushkil}
          - {surface: turur, sense: turur}
      translations:
        en: … Dawud prayed, saying, “Oh, my Lord, every craft is easy for you, and hard for us!”
