stories:
- id: chg.story.the-first-smith
  node: chg.u18.story
  title:
    en: The first smith (The Manual of the Blacksmiths)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: حضرت جبرائیل… درکاه حقکه باریب، حضرت داود سوزینی قیلدیلار.
          tokens:
          - {surface: حضرت, sense: hazrat}
          - {surface: جبرائیل, sense: jibrail}
          - {surface: درکاه, sense: dargah}
          - {surface: حقکه, sense: haqq, morphs: [{surface: حق, kc: 'sense:haqq'}, {surface: که, kc: 'form:dat'}]}
          - {surface: باریب, sense: bar.go, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: حضرت, sense: hazrat}
