stories:
- id: chg.story.a-small-country
  node: chg.u01.story
  title:
    en: 'A small country (Babur, Bāburnāma: Ferghana and Osh)'
  steps:
  - line:
      ask: complete
      gap: sense:mukhtasar
      distractors:
      - sense:chong
      - sense:latif
      forms:
        chg-Arab/standard:
          text: مختصر ولایتتور.
          tokens:
          - {surface: مختصر, sense: mukhtasar, readings: {schluessel: muḫtaṣar}}
          - {surface: ولایتتور, sense: wilayat, readings: {schluessel: wilāyattur}, morphs: [{surface: ولایت, kc: 'sense:wilayat'}, {surface: تور, kc: 'form:dur'}]}
      translations:
        en: It is a small country.
  - line:
      forms:
        chg-Arab/standard:
          text: "اشلیغ و میوه\u200cسی فراوان."
          tokens:
          - {surface: اشلیغ, sense: ashligh, readings: {schluessel: ašliǧ}}
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: "میوه\u200cسی", sense: mewa, readings: {schluessel: mewäsi}, morphs: [{surface: "میوه\u200c", kc: 'sense:mewa'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: فراوان, sense: farawan, readings: {schluessel: farāwān}}
      translations:
        en: Its grain and fruit are plentiful.
  - choose:
      prompt:
        en: What does Babur say about Ferghana?
      options:
      - en: It is small, with plenty of grain and fruit.
      - en: It is a large country with no fruit.
      - en: It is cold and has little grain.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "ینه بیر اوش قصبه\u200cسی\u200cدور."
          tokens:
          - {surface: ینه, sense: yana, readings: {schluessel: yänä}}
          - {surface: بیر, sense: bir, readings: {schluessel: bir}}
          - {surface: اوش, sense: osh, readings: {schluessel: Oš}}
          - {surface: "قصبه\u200cسی\u200cدور", sense: qasaba, readings: {schluessel: qaṣabasidur}, morphs: [{surface: "قصبه\u200c", kc: 'sense:qasaba'}, {surface: "سی\u200c", kc: 'form:poss3'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: Another is the town of Osh.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: هواسی خوب.
          tokens:
          - {surface: هواسی, sense: hawa, readings: {schluessel: hawāsi}, morphs: [{surface: هوا, kc: 'sense:hawa'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: خوب, sense: khub, readings: {schluessel: ḫūb}}
      translations:
        en: Its air is good.
  - line:
      forms:
        chg-Arab/standard:
          text: "بنفشه\u200cسی بسیار لطیف."
          tokens:
          - {surface: "بنفشه\u200cسی", sense: binafsha, readings: {schluessel: binafšasi}, morphs: [{surface: "بنفشه\u200c", kc: 'sense:binafsha'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: بسیار, sense: besyar, readings: {schluessel: besyār}}
          - {surface: لطیف, sense: latif, readings: {schluessel: laṭīf}}
      translations:
        en: Its violets are very lovely.
  - choose:
      prompt:
        en: What is lovely in Osh?
      options:
      - en: Its violets
      - en: Its mountains
      - en: Its bread
      answer: 0
scenarios:
- id: chg.at-the-tea-stall
  after: chg.u01.colors
  title:
    en: At the tea stall
  setting:
    en: A tea stall in the bazaar of Andijan, about 1500. Tea, bread, sugar and fruit are laid out.
  character:
    en: The stall keeper, cheerful and talkative, who speaks only Turki.
  goal:
    en: 'Say what you see: which tea is hot, which fruit is sweet, and what is cheap or dear.'
