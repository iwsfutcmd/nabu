stories:
- id: chg.story.a-small-country
  node: chg.u01.story
  title:
    en: 'A small country (Babur, Bāburnāma: Ferghana and Osh)'
  steps:
  - line:
      ask: complete
      gap: lexeme:mukhtasar
      distractors:
      - lexeme:shirin
      - lexeme:qizil
      forms:
        chg-Arab/standard:
          text: مختصر ولایتتور.
          tokens: [{surface: مختصر, lexeme: mukhtasar, readings: {schluessel: muḫtaṣar}}, {surface: ولایتتور, lexemes: [{lexeme: wilayat, surface: ولایت, base: true}, {lexeme: dur, surface: تور}], readings: {schluessel: wilāyattur}}]
      translations:
        en: It is a small country.
  - line:
      forms:
        chg-Arab/standard:
          text: "اشلیغ و میوه\u200cسی فراوان."
          tokens: [{surface: اشلیغ, lexeme: ashligh, readings: {schluessel: ašliǧ}}, {surface: و, lexeme: wa, readings: {schluessel: wä}}, {surface: "میوه\u200cسی", lexemes: [{lexeme: mewa, surface: "میوه\u200c", base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: mewäsi}}, {surface: فراوان, lexeme: farawan, readings: {schluessel: farāwān}}]
      translations:
        en: Its grain and fruit are plentiful.
  - choose:
      prompt:
        en: What does Babur say about Ferghana?
      options:
      - en: It is small, with plenty of grain and fruit.
      - en: It is a large country with no fruit.
      - en: It is cold and has little grain.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "ینه بیر اوش قصبه\u200cسی\u200cدور."
          tokens: [{surface: ینه, lexeme: yana, readings: {schluessel: yänä}}, {surface: بیر, lexeme: bir, readings: {schluessel: bir}}, {surface: اوش, lexeme: osh, readings: {schluessel: Oš}}, {surface: "قصبه\u200cسی\u200cدور", lexemes: [{lexeme: qasaba, surface: "قصبه\u200c", base: true}, {lexeme: poss3, surface: "سی\u200c"}, {lexeme: dur, surface: دور}], readings: {schluessel: qaṣabasidur}}]
      translations:
        en: Another is the town of Osh.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: هواسی خوب.
          tokens: [{surface: هواسی, lexemes: [{lexeme: hawa, surface: هوا, base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: hawāsi}}, {surface: خوب, lexeme: khub, readings: {schluessel: ḫūb}}]
      translations:
        en: Its air is good.
  - line:
      forms:
        chg-Arab/standard:
          text: "بنفشه\u200cسی بسیار لطیف."
          tokens: [{surface: "بنفشه\u200cسی", lexemes: [{lexeme: binafsha, surface: "بنفشه\u200c", base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: binafšasi}}, {surface: بسیار, lexeme: besyar, readings: {schluessel: besyār}}, {surface: لطیف, lexeme: latif, readings: {schluessel: laṭīf}}]
      translations:
        en: Its violets are very lovely.
  - choose:
      prompt:
        en: What is lovely in Osh?
      options:
      - en: Its violets
      - en: Its mountains
      - en: Its bread
      answer: 0
scenarios:
- id: chg.at-the-tea-stall
  after: chg.u01.colors
  title:
    en: At the tea stall
  setting:
    en: A tea stall in the bazaar of Andijan, about 1500. Tea, bread, sugar and fruit are laid out.
  character:
    en: The stall keeper, cheerful and talkative, who speaks only Turki.
  goal:
    en: 'Say what you see: which tea is hot, which fruit is sweet, and what is cheap or dear.'
