- id: form:dur
  gloss:
    en: '-dur (-tur after a voiceless consonant): is, are, on the end of a sentence'
  notes:
    en: 'Chaghatay puts "is" at the end, as a suffix on the last word: čay issiqdur "the tea is hot". After p, t, s, š, č, k, q it is often -tur (wilāyattur). It may be left out: hawāsi ḫūb "its air is
      good". The Arabic script writes it joined or after a half-space: issiq-dur.'
- id: form:poss3
  gloss:
    en: '-i (after a consonant), -si (after a vowel): his, her, its, their'
  notes:
    en: 'The thing owned takes the suffix: mewä "fruit", mewäsi "its fruit"; el "people", eli "its people". su "water" makes suyi.'
