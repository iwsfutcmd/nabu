stories:
- id: chg.story.they-drink-wine
  node: chg.u05.story
  title:
    en: They drink wine (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: نماز اوتامای، روزه توتمایدور.
          tokens:
          - {surface: نماز, sense: namaz, readings: {schluessel: namāz}}
          - {surface: اوتامای, sense: ota, readings: {schluessel: ötämäy}, morphs: [{surface: اوتا, kc: 'sense:ota'}, {surface: مای, kc: 'form:cv-may'}]}
          - {surface: روزه, sense: roza, readings: {schluessel: roza}}
          - {surface: توتمایدور, sense: tut, readings: {schluessel: tutmaydur}, morphs: [{surface: توت, kc: 'sense:tut'}, {surface: مای, kc: 'form:pres-neg'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: They do not perform the prayer, they do not keep the fast.
  - line:
      ask: complete
      gap: sense:sharab
      distractors:
      - sense:kitab
      - sense:at
      forms:
        chg-Arab/standard:
          text: شراب ایچادور.
          tokens:
          - {surface: شراب, sense: sharab, readings: {schluessel: šarāb}}
          - {surface: ایچادور, sense: ich, readings: {schluessel: ičädur}, morphs: [{surface: ایچ, kc: 'sense:ich'}, {surface: ا, kc: 'form:pres'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: They drink wine.
  - choose:
      prompt:
        en: What do the two travellers see the townspeople do?
      options:
      - en: They drink wine and skip the prayers.
      - en: They pray five times a day.
      - en: They keep the fast of Ramadan.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: کافر دیسه، ایمان ایتادور.
          tokens:
          - {surface: کافر, sense: kafir, readings: {schluessel: kāfir}}
          - {surface: دیسه, sense: de, readings: {schluessel: desä}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: سه, kc: 'form:cond'}]}
          - {surface: ایمان, sense: iman, readings: {schluessel: īmān}}
          - {surface: ایتادور, sense: eyt, readings: {schluessel: eytadur}, morphs: [{surface: ایت, kc: 'sense:eyt'}, {surface: ا, kc: 'form:pres'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: If you call them unbelievers, they say the creed.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: مسلمانچه سوزلایدورلار.
          tokens:
          - {surface: مسلمانچه, sense: musulman, readings: {schluessel: musulmānčä}, morphs: [{surface: مسلمان, kc: 'sense:musulman'}, {surface: چه, kc: 'form:ca'}]}
          - {surface: سوزلایدورلار, sense: sozla, readings: {schluessel: sözläydurlar}, morphs: [{surface: سوزلا, kc: 'sense:sozla'}, {surface: ی, kc: 'form:pres'}, {surface: دور, kc: 'form:dur'}, {surface: لار,
                kc: 'form:p3pl'}]}
      translations:
        en: They speak like Muslims.
  - choose:
      prompt:
        en: Are the people Muslims or unbelievers?
      options:
      - en: They say the creed and talk like Muslims, but do not live like them.
      - en: They are unbelievers who never say the creed.
      - en: They are learned mullahs.
      answer: 0
scenarios:
- id: chg.at-the-caravanserai
  after: chg.u05.what-do-you-want
  title:
    en: At the caravanserai
  setting:
    en: A caravanserai on the road to Kashgar, in the evening. Travellers sit by the fire.
  character:
    en: The innkeeper, busy and blunt, who speaks only Turki.
  goal:
    en: Say what you want to eat and drink and what you do not drink, ask what the other travellers are doing, and say where you are going tomorrow.
