stories:
- id: chg.story.they-drink-wine
  node: chg.u05.story
  title:
    en: They drink wine (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: نماز اوتامای، روزه توتمایدور.
          tokens:
          - {surface: نماز, sense: namaz}
          - {surface: اوتامای, sense: ota, morphs: [{surface: اوتا, kc: 'sense:ota'}, {surface: مای, kc: 'form:cv-may'}]}
          - {surface: روزه, sense: roza}
          - {surface: توتمایدور, sense: tut, morphs: [{surface: توت, kc: 'sense:tut'}, {surface: مای, kc: 'form:pres-neg'}, {surface: دور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Namāz ötämäy, roza tutmaydur.
          tokens:
          - {surface: Namāz, sense: namaz}
          - {surface: ötämäy, sense: ota, morphs: [{surface: ötä, kc: 'sense:ota'}, {surface: mäy, kc: 'form:cv-may'}]}
          - {surface: roza, sense: roza}
          - {surface: tutmaydur, sense: tut, morphs: [{surface: tut, kc: 'sense:tut'}, {surface: may, kc: 'form:pres-neg'}, {surface: dur, kc: 'form:dur'}]}
      translations:
        en: They do not perform the prayer, they do not keep the fast.
  - line:
      ask: complete
      gap: sense:sharab
      distractors:
      - sense:sut
      - sense:chay
      forms:
        chg-Arab/standard:
          text: شراب ایچادور.
          tokens:
          - {surface: شراب, sense: sharab}
          - {surface: ایچادور, sense: ich, morphs: [{surface: ایچ, kc: 'sense:ich'}, {surface: ا, kc: 'form:pres'}, {surface: دور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Šarāb ičädur.
          tokens:
          - {surface: Šarāb, sense: sharab}
          - {surface: ičädur, sense: ich, morphs: [{surface: ič, kc: 'sense:ich'}, {surface: ä, kc: 'form:pres'}, {surface: dur, kc: 'form:dur'}]}
      translations:
        en: They drink wine.
  - choose:
      prompt:
        en: What do the two travellers see the townspeople do?
      options:
      - en: They drink wine and skip the prayers.
      - en: They pray five times a day.
      - en: They keep the fast of Ramadan.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: کافر دیسه، ایمان ایتادور.
          tokens:
          - {surface: کافر, sense: kafir}
          - {surface: دیسه, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: سه, kc: 'form:cond'}]}
          - {surface: ایمان, sense: iman}
          - {surface: ایتادور, sense: eyt, morphs: [{surface: ایت, kc: 'sense:eyt'}, {surface: ا, kc: 'form:pres'}, {surface: دور, kc: 'form:dur'}]}
        chg-Latn/schluessel:
          text: Kāfir desä, īmān eytadur.
          tokens:
          - {surface: Kāfir, sense: kafir}
          - {surface: desä, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: sä, kc: 'form:cond'}]}
          - {surface: īmān, sense: iman}
          - {surface: eytadur, sense: eyt, morphs: [{surface: eyt, kc: 'sense:eyt'}, {surface: a, kc: 'form:pres'}, {surface: dur, kc: 'form:dur'}]}
      translations:
        en: If you call them unbelievers, they say the creed.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: مسلمانچه سوزلایدورلار.
          tokens:
          - {surface: مسلمانچه, sense: musulman, morphs: [{surface: مسلمان, kc: 'sense:musulman'}, {surface: چه, kc: 'form:ca'}]}
          - {surface: سوزلایدورلار, sense: sozla, morphs: [{surface: سوزلا, kc: 'sense:sozla'}, {surface: ی, kc: 'form:pres'}, {surface: دور, kc: 'form:dur'}, {surface: لار, kc: 'form:p3pl'}]}
        chg-Latn/schluessel:
          text: Musulmānčä sözläydurlar.
          tokens:
          - {surface: Musulmānčä, sense: musulman, morphs: [{surface: Musulmān, kc: 'sense:musulman'}, {surface: čä, kc: 'form:ca'}]}
          - {surface: sözläydurlar, sense: sozla, morphs: [{surface: sözlä, kc: 'sense:sozla'}, {surface: y, kc: 'form:pres'}, {surface: dur, kc: 'form:dur'}, {surface: lar, kc: 'form:p3pl'}]}
      translations:
        en: They speak like Muslims.
  - choose:
      prompt:
        en: Are the people Muslims or unbelievers?
      options:
      - en: They say the creed and talk like Muslims, but do not live like them.
      - en: They are unbelievers who never say the creed.
      - en: They are learned mullahs.
      answer: 0
scenarios:
- id: chg.at-the-caravanserai
  after: chg.u05.what-do-you-want
  title:
    en: At the caravanserai
  setting:
    en: A caravanserai on the road to Kashgar, in the evening. Travellers sit by the fire.
  character:
    en: The innkeeper, busy and blunt, who speaks only Turki.
  goal:
    en: Say what you want to eat and drink and what you do not drink, ask what the other travellers are doing, and say where you are going tomorrow.
