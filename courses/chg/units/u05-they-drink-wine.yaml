stories:
- id: chg.story.they-drink-wine
  node: chg.u05.story
  title:
    en: They drink wine (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: نماز اوتامای، روزه توتمایدور.
          tokens: [{surface: نماز, lexeme: namaz, readings: {schluessel: namāz}}, {surface: اوتامای, lexemes: [{lexeme: ota, surface: اوتا, base: true}, {lexeme: cv-may, surface: مای}], readings: {schluessel: ötämäy}}, {surface: روزه, lexeme: roza, readings: {schluessel: roza}}, {surface: توتمایدور, lexemes: [{lexeme: tut, surface: توت, base: true}, {lexeme: pres-neg, surface: مای}, {lexeme: dur, surface: دور}], readings: {schluessel: tutmaydur}}]
      translations:
        en: They do not perform the prayer, they do not keep the fast.
  - line:
      ask: complete
      gap: lexeme:sharab
      distractors:
      - lexeme:kitab
      - lexeme:at
      forms:
        chg-Arab/standard:
          text: شراب ایچادور.
          tokens: [{surface: شراب, lexeme: sharab, readings: {schluessel: šarāb}}, {surface: ایچادور, lexemes: [{lexeme: ich, surface: ایچ, base: true}, {lexeme: pres, surface: ا}, {lexeme: dur, surface: دور}], readings: {schluessel: ičädur}}]
      translations:
        en: They drink wine.
  - choose:
      prompt:
        en: What do the two travellers see the townspeople do?
      options:
      - en: They drink wine and skip the prayers.
      - en: They pray five times a day.
      - en: They keep the fast of Ramadan.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: کافر دیسه، ایمان ایتادور.
          tokens: [{surface: کافر, lexeme: kafir, readings: {schluessel: kāfir}}, {surface: دیسه, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: cond, surface: سه}], readings: {schluessel: desä}}, {surface: ایمان, lexeme: iman, readings: {schluessel: īmān}}, {surface: ایتادور, lexemes: [{lexeme: eyt, surface: ایت, base: true}, {lexeme: pres, surface: ا}, {lexeme: dur, surface: دور}], readings: {schluessel: eytadur}}]
      translations:
        en: If you call them unbelievers, they say the creed.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: مسلمانچه سوزلایدورلار.
          tokens: [{surface: مسلمانچه, lexemes: [{lexeme: musulman, surface: مسلمان, base: true}, {lexeme: ca, surface: چه}], readings: {schluessel: musulmānčä}}, {surface: سوزلایدورلار, lexemes: [{lexeme: sozla, surface: سوزلا, base: true}, {lexeme: pres, surface: ی}, {lexeme: dur, surface: دور}, {lexeme: p3pl, surface: لار}], readings: {schluessel: sözläydurlar}}]
      translations:
        en: They speak like Muslims.
  - choose:
      prompt:
        en: Are the people Muslims or unbelievers?
      options:
      - en: They say the creed and talk like Muslims, but do not live like them.
      - en: They are unbelievers who never say the creed.
      - en: They are learned mullahs.
      answer: 0
scenarios:
- id: chg.at-the-caravanserai
  after: chg.u05.what-do-you-want
  title:
    en: At the caravanserai
  setting:
    en: A caravanserai on the road to Kashgar, in the evening. Travellers sit by the fire.
  character:
    en: The innkeeper, busy and blunt, who speaks only Turki.
  goal:
    en: Say what you want to eat and drink and what you do not drink, ask what the other travellers are doing, and say where you are going tomorrow.
