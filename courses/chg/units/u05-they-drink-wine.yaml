# Chaghatay (chg), unit 5: They drink wine (The Tadhkira of Jalāl ud-Dīn Katakī).
# The present-future (ičämän "I drink", baradur "he goes") in every person, and its negative (ičmäymän); -mu after
# the person ending (ičäsizmu?); -čä "in the manner of"; desä "if one says".
# The passage is the anonymous Tadhkira of Jalāl ud-Dīn Katakī (Lund University Library, Jarring Prov. 328,
# 2r-2v; public domain), as Schluessel (2018, ch. 14) types it. The rest was drafted by an LLM (provenance
# llm:…, status draft) and awaits a reviewer.
