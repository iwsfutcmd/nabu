- id: form:pres-neg
  gloss:
    en: '-may, -mäy: does not, is not doing, will not (the present-future''s negative)'
  notes:
    en: 'In place of -a: ičmäymän "I do not drink", tutmaydur "he does not keep".'
- id: form:cv-may
  gloss:
    en: '-may, -mäy: without doing, not doing (and)'
  notes:
    en: 'Ties a "not" to the next verb: namāz ötämäy, roza tutmaydur "they do not pray, and they do not fast". Spelled as the negative present, without a person ending.'
- id: form:ca
  gloss:
    en: '-čä: in the manner of; in a language'
  notes:
    en: Musulmānčä "as Muslims do"; Türkčä "in Turkic".
- id: form:cond
  gloss:
    en: '-sa, -sä: if, when'
  notes:
    en: 'desä "if one says, if you call": Kāfir desä, īmān eytadur "if you call them unbelievers, they say the creed". Unit 8 has the persons (barsam "if I go").'
