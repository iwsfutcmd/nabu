scenarios:
- id: chg.at-the-carpenters
  after: chg.u15.would-you
  title:
    en: At the carpenter’s
  setting:
    en: A carpenter’s shop in the bazaar of Kashgar, around 1800. You need a box made.
  character:
    en: The carpenter, busy but polite, who speaks only Turki.
  goal:
    en: Ask him politely to make you a box, say how big it should be, ask when to come back, and ask whether he would keep your things for you until then.
