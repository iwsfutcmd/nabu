stories:
- id: chg.story.the-old-womans-box
  node: chg.u15.story
  title:
    en: The old woman’s box (The Stories of the Prophets)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: … عاج طوفاندا هلاک بولمادی.
          tokens:
          - {surface: عاج, sense: aj, readings: {schluessel: ʿĀj}}
          - {surface: طوفاندا, sense: tufan, readings: {schluessel: ṭūfānda}, morphs: [{surface: طوفان, kc: 'sense:tufan'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: هلاک, sense: halak, readings: {schluessel: halāk}}
          - {surface: بولمادی, sense: bol, readings: {schluessel: bolmadi}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ما, kc: 'form:neg'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: … ʿĀj did not perish in the Flood.
  - line:
      forms:
        chg-Arab/standard:
          text: اما کافر ایماس ایردی.
          tokens:
          - {surface: اما, sense: amma, readings: {schluessel: ammā}}
          - {surface: کافر, sense: kafir, readings: {schluessel: kāfir}}
          - {surface: ایماس, sense: emas, readings: {schluessel: emäs}}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: But he was not an unbeliever.
  - line:
      forms:
        chg-Arab/standard:
          text: دریالار یقاسیدا جنکالدا یورور ایردی.
          tokens:
          - {surface: دریالار, sense: darya, readings: {schluessel: daryālar}, morphs: [{surface: دریا, kc: 'sense:darya'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: یقاسیدا, sense: yaqa, readings: {schluessel: yaqasida}, morphs: [{surface: یقا, kc: 'sense:yaqa'}, {surface: سی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: جنکالدا, sense: jangal, readings: {schluessel: jaŋgalda}, morphs: [{surface: جنکال, kc: 'sense:jangal'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: یورور, sense: yur, readings: {schluessel: yürür}, morphs: [{surface: یور, kc: 'sense:yur'}, {surface: ور, kc: 'form:aor'}]}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: He would go about along the rivers, in the wilderness.
  - line:
      ask: complete
      gap: sense:tiz
      asks: form
      forms:
        chg-Arab/standard:
          text: طوفان سویی انینک تیزیغه یتمادی.
          tokens:
          - {surface: طوفان, sense: tufan, readings: {schluessel: ṭūfān}}
          - {surface: سویی, sense: su, readings: {schluessel: süyi}, morphs: [{surface: سو, kc: 'sense:su'}, {surface: یی, kc: 'form:poss3'}]}
          - {surface: انینک, sense: ul, readings: {schluessel: aniŋ}, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: تیزیغه, sense: tiz, readings: {schluessel: tiziǧa}, morphs: [{surface: تیز, kc: 'sense:tiz'}, {surface: ی, kc: 'form:poss3'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: یتمادی, sense: yat, readings: {schluessel: yätmädi}, morphs: [{surface: یت, kc: 'sense:yat'}, {surface: ما, kc: 'form:neg'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: The waters of the Flood did not reach his knees.
  - choose:
      prompt:
        en: How big was ʿĀj?
      options:
      - en: The Flood did not reach his knees.
      - en: He was as tall as a house.
      - en: He was as small as a boy.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … بو یکیت باریب، بیر ماماغه حالینی بیان قیلدی.
          tokens:
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: یکیت, sense: yigit, readings: {schluessel: yigit}}
          - {surface: باریب, sense: bar.go, readings: {schluessel: barip}, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: بیر, sense: bir, readings: {schluessel: bir}}
          - {surface: ماماغه, sense: mama, readings: {schluessel: mamaǧa}, morphs: [{surface: ماما, kc: 'sense:mama'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: حالینی, sense: hal, readings: {schluessel: ḥālini}, morphs: [{surface: حال, kc: 'sense:hal'}, {surface: ی, kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: بیان, sense: bayan, readings: {schluessel: bayān}}
          - {surface: قیلدی, sense: qil, readings: {schluessel: qildi}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: … This young man went and told an old woman about his situation.
  - line:
      forms:
        chg-Arab/standard:
          text: ماما ایتیکه، «یغاچی قاشیغه باریب، بیر صندوق ایتوروب، مینینک قاشیمغه الیب کلینک،» دیدی.
          tokens:
          - {surface: ماما, sense: mama, readings: {schluessel: mama}}
          - {surface: ایتیکه, sense: eyt, readings: {schluessel: eyttike}, morphs: [{surface: ای, kc: 'sense:eyt'}, {surface: تی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: یغاچی, sense: yaghach, readings: {schluessel: yaǧačči}, morphs: [{surface: یغا, kc: 'sense:yaghach'}, {surface: چی, kc: 'form:ci'}]}
          - {surface: قاشیغه, sense: qash.presence, readings: {schluessel: qašiǧa}, morphs: [{surface: قاش, kc: 'sense:qash.presence'}, {surface: ی, kc: 'form:poss3'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: باریب, sense: bar.go, readings: {schluessel: barip}, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: بیر, sense: bir, readings: {schluessel: bir}}
          - {surface: صندوق, sense: sanduq, readings: {schluessel: ṣandūq}}
          - {surface: ایتوروب, sense: ettur, readings: {schluessel: ettürüp}, morphs: [{surface: ایتور, kc: 'sense:ettur'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: مینینک, sense: man, readings: {schluessel: meniŋ}, morphs: [{surface: مین, kc: 'sense:man'}, {surface: ینک, kc: 'form:gen'}]}
          - {surface: قاشیمغه, sense: qash.presence, readings: {schluessel: qašimǧa}, morphs: [{surface: قاش, kc: 'sense:qash.presence'}, {surface: یم, kc: 'form:poss1s'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: الیب, sense: al, readings: {schluessel: alip}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: کلینک, sense: kal, readings: {schluessel: keliŋ}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: ینک, kc: 'form:imp'}]}
          - {surface: دیدی, sense: de, readings: {schluessel: dedi}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: The old woman said, “Go to the carpenter, have a box made, and bring it to me.”
  - line:
      forms:
        chg-Arab/standard:
          text: صندوق ایتوروب، مامانینک قاشیغه الیب باردی.
          tokens:
          - {surface: صندوق, sense: sanduq, readings: {schluessel: ṣandūq}}
          - {surface: ایتوروب, sense: ettur, readings: {schluessel: ettürüp}, morphs: [{surface: ایتور, kc: 'sense:ettur'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: مامانینک, sense: mama, readings: {schluessel: mamaniŋ}, morphs: [{surface: ماما, kc: 'sense:mama'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: قاشیغه, sense: qash.presence, readings: {schluessel: qašiǧa}, morphs: [{surface: قاش, kc: 'sense:qash.presence'}, {surface: ی, kc: 'form:poss3'}, {surface: غه, kc: 'form:dat'}]}
          - {surface: الیب, sense: al, readings: {schluessel: alip}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: باردی, sense: bar.go, readings: {schluessel: bardi}, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: He had the box made and took it to the old woman.
  - line:
      forms:
        chg-Arab/standard:
          text: ماما یغلاب ایتیکه، «ای، اوغلوم! بو صندوقدا کیشینینک امانتی بار ایردی!
          tokens:
          - {surface: ماما, sense: mama, readings: {schluessel: mama}}
          - {surface: یغلاب, sense: yigla, readings: {schluessel: yiǧlap}, morphs: [{surface: یغلا, kc: 'sense:yigla'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: ایتیکه, sense: eyt, readings: {schluessel: eyttike}, morphs: [{surface: ای, kc: 'sense:eyt'}, {surface: تی, kc: 'form:past-3'}, {surface: که, kc: 'form:ke'}]}
          - {surface: ای, sense: ay.voc, readings: {schluessel: ay}}
          - {surface: اوغلوم, sense: oghul, readings: {schluessel: oǧlum}, morphs: [{surface: اوغل, kc: 'sense:oghul'}, {surface: وم, kc: 'form:poss1s'}]}
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: صندوقدا, sense: sanduq, readings: {schluessel: ṣandūqta}, morphs: [{surface: صندوق, kc: 'sense:sanduq'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: کیشینینک, sense: kishi, readings: {schluessel: kišiniŋ}, morphs: [{surface: کیشی, kc: 'sense:kishi'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: امانتی, sense: amanat, readings: {schluessel: amānati}, morphs: [{surface: امانت, kc: 'sense:amanat'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: بار, sense: bar, readings: {schluessel: bar}}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: Weeping, the old woman said, “Oh, my son! In this box is something someone left in my keeping!
  - line:
      forms:
        chg-Arab/standard:
          text: شونی سین ساقلاب برسانک؟ ینه کیشیکا اعتمادیم یوق،» دیب ایردی.
          tokens:
          - {surface: شونی, sense: shu, readings: {schluessel: šuni}, morphs: [{surface: شو, kc: 'sense:shu'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: سین, sense: san, readings: {schluessel: sen}}
          - {surface: ساقلاب, sense: saqla, readings: {schluessel: saqlap}, morphs: [{surface: ساقلا, kc: 'sense:saqla'}, {surface: ب, kc: 'form:cv-p'}]}
