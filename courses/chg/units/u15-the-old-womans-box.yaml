- id: chg.story.the-old-womans-box
  node: chg.u15.story
  title:
    en: The old woman’s box (The Stories of the Prophets)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: … عاج طوفاندا هلاک بولمادی.
          tokens:
          - {surface: عاج, sense: aj}
          - {surface: طوفاندا, sense: tufan, morphs: [{surface: طوفان, kc: 'sense:tufan'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: هلاک, sense: halak}
          - {surface: بولمادی, sense: bol, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ما, kc: 'form:neg'}, {surface: دی, kc: 'form:past-3'}]}
        chg-Latn/schluessel:
          text: … ʿĀj ṭūfānda halāk bolmadi.
          tokens:
          - {surface: ʿĀj, sense: aj}
          - {surface: ṭūfānda, sense: tufan, morphs: [{surface: ṭūfān, kc: 'sense:tufan'}, {surface: da, kc: 'form:loc'}]}
          - {surface: halāk, sense: halak}
          - {surface: bolmadi, sense: bol, morphs: [{surface: bol, kc: 'sense:bol'}, {surface: ma, kc: 'form:neg'}, {surface: di, kc: 'form:past-3'}]}
      translations:
        en: … ʿĀj did not perish in the Flood.
  - line:
      forms:
        chg-Arab/standard:
          text: اما کافر ایماس ایردی.
