  forms:
    chg-Arab/standard:
    - تیز
    chg-Latn/schluessel:
    - tiz
- id: sense:yat
  gloss:
    en: to reach, arrive
  forms:
    chg-Arab/standard:
    - یت-
    chg-Latn/schluessel:
    - yät-
