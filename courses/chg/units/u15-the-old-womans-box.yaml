  forms:
    chg-Arab/standard:
    - ای
    chg-Latn/schluessel:
    - ay
  notes:
    en: 'Before a name or a word for a person: ay oǧlum "oh, my son!".'
- id: sense:hal
  gloss:
    en: state, situation, condition
  forms:
    chg-Arab/standard:
    - حال
    chg-Latn/schluessel:
    - ḥāl
- id: sense:bayan
  gloss:
    en: explanation, account
  forms:
    chg-Arab/standard:
    - بیان
    chg-Latn/schluessel:
    - bayān
  notes:
    en: bayān qil- "to explain, tell".
- id: sense:sanduq
  gloss:
    en: box, chest
  forms:
    chg-Arab/standard:
    - صندوق
    chg-Latn/schluessel:
    - ṣandūq
- id: sense:ettur
  gloss:
    en: to have (something) made
  forms:
    chg-Arab/standard:
    - ایتور-
    chg-Latn/schluessel:
    - ettür-
  notes:
    en: 'et- "to do, make" with the causative -tür: "to make (someone) make".'
- id: sense:saqla
  gloss:
    en: to keep, save, guard; to wait
  forms:
    chg-Arab/standard:
    - ساقلا-
    chg-Latn/schluessel:
    - saqla-
- id: sense:bar.give
  gloss:
    en: to give; after -p, for someone (saqlap bär- "keep for someone")
  forms:
    chg-Arab/standard:
    - بیر-
    chg-Latn/schluessel:
    - bär-
  notes:
    en: bär- and ber- are one verb; the -p converb before it does something for someone.
- id: sense:amanat
  gloss:
    en: a thing held in trust, a deposit
  forms:
    chg-Arab/standard:
    - امانت
    chg-Latn/schluessel:
    - amānat
- id: sense:itimad
  gloss:
    en: trust, confidence
  forms:
    chg-Arab/standard:
    - اعتماد
    chg-Latn/schluessel:
    - iʿtimād
  notes:
    en: kišigä iʿtimādim yoq "I trust no one".
- id: sense:shu
  gloss:
    en: this, that (just mentioned)
  forms:
    chg-Arab/standard:
    - شو
    chg-Latn/schluessel:
    - šu
- id: form:imp
  gloss:
    en: 'the imperative: -iŋ, -uŋ, -üŋ, -ŋ (politely, or to several); -ǧil, -gil (to one)'
  notes:
    en: 'keliŋ "come!", olturuŋ "sit down!", bariŋ "go!". Schluessel 12.4 gives the bare stem as the familiar imperative to one: käl! "come!".'
- id: form:cond-2s
  gloss:
    en: '-saŋ, -säŋ: if you (one person); would you …?'
  notes:
    en: 'The conditional with the person ending -ŋ. Asked as a question it is a polite request (Schluessel 16.7): saqlap bärsäŋ? "would you keep it for me?".'
- id: form:ke
  gloss:
    en: '-ke, -ki: that (after a verb of saying: eyttike "said (that)")'
  notes:
    en: The conjunction ke, written onto the verb before it; what follows is what was said, with or without dedi after it.
