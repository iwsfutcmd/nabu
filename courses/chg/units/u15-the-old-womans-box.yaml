  forms:
    chg-Arab/standard:
    - اما
    chg-Latn/schluessel:
    - ammā
- id: sense:yaqa
  gloss:
    en: edge, side; bank (of a river)
  forms:
    chg-Arab/standard:
    - یقا
    chg-Latn/schluessel:
    - yaqa
  notes:
    en: daryā yaqasida "on the bank of the river".
- id: sense:tiz
