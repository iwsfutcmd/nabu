# Chaghatay (chg), unit 15: The old woman's box (The Stories of the Prophets, the story of ʿĀj, part two).
# The imperative -iŋ (keliŋ "come!"); a request as a conditional question with -p bär- (saqlap bärsäŋ? "would you
# keep it for me?"); -ke after a verb of saying (eyttike); the causative ettür- "have made"; ay "oh!".
# The passage is the Kashgar Stories of the Prophets (Lund University Library, Jarring Prov. 431; public domain),
# as Schluessel (2018, ch. 16) reads it, its spellings taken from the manuscript; the story keeps its first part
# (the Flood, the old woman and the box) and leaves out the rest. The rest was drafted by an LLM (provenance
# llm:…, status draft) and awaits a reviewer.
id: u15-the-old-womans-box
title:
  en: The old woman’s box
cefr: B1
