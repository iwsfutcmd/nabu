- id: sense:para
  gloss:
    en: 'piece (a counting word: yätti pāra qaṣaba "seven towns")'
  forms:
    chg-Arab/standard:
    - پاره
    chg-Latn/schluessel:
    - pāra
  notes:
    en: 'Babur counts towns with pāra "piece": yätti pāra qaṣabasi bar "it has seven towns". Most counted nouns need no such word.'
- id: sense:sayhun
  gloss:
    en: the Sayhun, the Jaxartes (the Syr Darya)
  forms:
    chg-Arab/standard:
