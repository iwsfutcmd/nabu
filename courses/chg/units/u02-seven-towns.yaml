stories:
- id: chg.story.seven-towns
  node: chg.u02.story
  title:
    en: 'Seven towns (Babur, Bāburnāma: Ferghana)'
  steps:
  - line:
      ask: complete
      gap: sense:yatti
      distractors:
      - sense:tagh
      - sense:darwaza
      forms:
        chg-Arab/standard:
          text: "ییتی پاره قصبه\u200cسی بار."
          tokens:
          - {surface: ییتی, sense: yatti, readings: {schluessel: yätti}}
          - {surface: پاره, sense: para, readings: {schluessel: pāra}}
          - {surface: "قصبه\u200cسی", sense: qasaba, readings: {schluessel: qaṣabasi}, morphs: [{surface: "قصبه\u200c", kc: 'sense:qasaba'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: بار, sense: bar, readings: {schluessel: bar}}
      translations:
        en: It has seven towns.
  - line:
      forms:
        chg-Arab/standard:
          text: "بیشی سیحون سوی\u200cنینک جنوب طرفی."
          tokens:
          - {surface: بیشی, sense: bash, readings: {schluessel: Beši}, morphs: [{surface: بیش, kc: 'sense:bash'}, {surface: ی, kc: 'form:poss3'}]}
          - {surface: سیحون, sense: sayhun, readings: {schluessel: Sayḥūn}}
          - {surface: "سوی\u200cنینک", sense: su, readings: {schluessel: suyiniŋ}, morphs: [{surface: سو, kc: 'sense:su'}, {surface: "ی\u200c", kc: 'form:poss3'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: جنوب, sense: janub, readings: {schluessel: janūb}}
          - {surface: طرفی, sense: taraf, readings: {schluessel: ṭarafi}, morphs: [{surface: طرف, kc: 'sense:taraf'}, {surface: ی, kc: 'form:poss3'}]}
      translations:
        en: Five are on the south side of the Sayhun river.
  - line:
      forms:
        chg-Arab/standard:
          text: ایکی شمال جانبی.
          tokens:
          - {surface: ایکی, sense: ikki, readings: {schluessel: ikki}}
          - {surface: شمال, sense: shimal, readings: {schluessel: šimāl}}
          - {surface: جانبی, sense: janib, readings: {schluessel: jānibi}, morphs: [{surface: جانب, kc: 'sense:janib'}, {surface: ی, kc: 'form:poss3'}]}
      translations:
        en: Two are on the north side.
  - choose:
      prompt:
        en: Where are the seven towns of Ferghana?
      options:
      - en: Five south of the Sayhun, two north of it
      - en: All seven on the river's north side
      - en: Seven in the mountains
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "بیر اندجان\u200cدور."
          tokens:
          - {surface: بیر, sense: bir, readings: {schluessel: bir}}
          - {surface: "اندجان\u200cدور", sense: andijan, readings: {schluessel: Andijāndur}, morphs: [{surface: "اندجان\u200c", kc: 'sense:andijan'}, {surface: دور, kc: 'form:dur'}]}
      translations:
        en: One is Andijan.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "اوچ دروازه\u200cسی بار."
          tokens:
          - {surface: اوچ, sense: uch, readings: {schluessel: üč}}
          - {surface: "دروازه\u200cسی", sense: darwaza, readings: {schluessel: darwāzasi}, morphs: [{surface: "دروازه\u200c", kc: 'sense:darwaza'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: بار, sense: bar, readings: {schluessel: bar}}
      translations:
        en: It has three gates.
  - choose:
      prompt:
        en: How many gates does Andijan have?
      options:
      - en: Three
      - en: Seven
      - en: Five
      answer: 0
scenarios:
- id: chg.at-the-city-gate
  after: chg.u02.of-the-city
  title:
    en: At the city gate
  setting:
    en: The gate of Andijan, about 1500. You have just arrived from the south with your horse.
  character:
    en: The gatekeeper, an old soldier of the city who speaks only Turki.
  goal:
    en: 'Ask what the town has: whether there is water, bread and a garden to rest in, and how many gates the city has.'
