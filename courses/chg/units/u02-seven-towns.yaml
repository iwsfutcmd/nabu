- id: form:loc
  gloss:
    en: '-da, -dä (-ta, -tä after a voiceless consonant): in, at, on'
  notes:
    en: 'Where something is: öydä "in the house", taǧda "on the mountain". With bar it says what a place has: öydä nan bar "there is bread in the house".'
- id: form:gen
  gloss:
    en: '-niŋ: of, ''s'
  notes:
    en: 'The owner takes -niŋ, the thing owned -i/-si: šaharniŋ darwāzasi "the city''s gate". A name before what it names is no owner and takes no -niŋ, only the -i/-si: Sayḥūn suyi "the Sayhun river" (Babur:
      Sayḥūn daryāsi), Farǧāna wilāyati "the country of Ferghana", Ramżān ayi "the month of Ramadan". With -niŋ the name would own it: Sayḥūnniŋ suyi "the Sayhun''s water".'
