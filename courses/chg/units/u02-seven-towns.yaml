# Chaghatay (chg), unit 2: Seven towns (Babur, Bāburnāma: the towns of Ferghana).
# bar "there is" and yoq "there is no"; numbers to ten; -da "in, at"; directions; -niŋ "of".
# The passage is Babur's own text (died 1530; the Hyderabad manuscript, in Beveridge's 1905 facsimile), as
# Schluessel (2018, ch. 11) types it; the rest was drafted by an LLM (provenance llm:…, status draft) and awaits
# a reviewer.
id: u02-seven-towns
title:
  en: Seven towns
cefr: A1
kcs:
- id: sense:bar
  gloss:
    en: there is, there are; exists
  forms:
    chg-Arab/standard:
    - بار
    chg-Latn/schluessel:
    - bar
  readings:
    schluessel: bar
  notes:
    en: 'bar says that something is there: nan bar "there is bread". Its opposite is yoq.'
- id: sense:yoq
  gloss:
    en: there is no, there are no; no
  forms:
    chg-Arab/standard:
    - یوق
    chg-Latn/schluessel:
    - yoq
  readings:
    schluessel: yoq
  notes:
    en: 'yoq is the opposite of bar, not of -dur: nan yoq "there is no bread", but nan aq emäs "the bread is not white".'
