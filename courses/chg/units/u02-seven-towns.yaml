- id: sense:farghana
  gloss:
    en: Ferghana (the valley and country of Babur)
  forms:
    chg-Arab/standard:
    - فرغانه
    chg-Latn/schluessel:
    - Farǧāna
- id: form:loc
  gloss:
    en: '-da, -dä (-ta, -tä after a voiceless consonant): in, at, on'
  notes:
    en: 'Where something is: öydä "in the house", taǧda "on the mountain". With bar it says what a place has: öydä nan bar "there is bread in the house".'
- id: form:gen
  gloss:
    en: '-niŋ: of, ''s'
  notes:
    en: 'The owner takes -niŋ, the thing owned -i/-si: šaharniŋ darwāzasi "the city''s gate". The -niŋ may be left out: Sayḥūn suyi "the Sayhun''s water".'
