stories:
- id: chg.story.seven-towns
  node: chg.u02.story
  title:
    en: 'Seven towns (Babur, Bāburnāma: Ferghana)'
  steps:
  - line:
      ask: complete
      gap: lexeme:qasaba
      distractors:
      - lexeme:hawa
      - lexeme:taraf
      forms:
        chg-Arab/standard:
          text: "ییتی پاره قصبه\u200cسی بار."
          tokens: [{surface: ییتی, lexeme: yatti, readings: {schluessel: yätti}}, {surface: پاره, lexeme: para, readings: {schluessel: pāra}}, {surface: "قصبه\u200cسی", lexemes: [{lexeme: qasaba, surface: "قصبه\u200c", base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: qaṣabasi}}, {surface: بار, lexeme: bar, readings: {schluessel: bar}}]
      translations:
        en: It has seven towns.
  - line:
      forms:
        chg-Arab/standard:
          text: "بیشی سیحون سوی\u200cنینک جنوب طرفی."
          tokens: [{surface: بیشی, lexemes: [{lexeme: bash, surface: بیش, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: Beši}}, {surface: سیحون, lexeme: sayhun, readings: {schluessel: Sayḥūn}}, {surface: "سوی\u200cنینک", lexemes: [{lexeme: su, surface: سو, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: gen, surface: نینک}], readings: {schluessel: suyiniŋ}}, {surface: جنوب, lexeme: janub, readings: {schluessel: janūb}}, {surface: طرفی, lexemes: [{lexeme: taraf, surface: طرف, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: ṭarafi}}]
      translations:
        en: Five are on the south side of the Sayhun river.
  - line:
      forms:
        chg-Arab/standard:
          text: ایکی شمال جانبی.
          tokens: [{surface: ایکی, lexeme: ikki, readings: {schluessel: ikki}}, {surface: شمال, lexeme: shimal, readings: {schluessel: šimāl}}, {surface: جانبی, lexemes: [{lexeme: janib, surface: جانب, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: jānibi}}]
      translations:
        en: Two are on the north side.
  - choose:
      prompt:
        en: Where are the seven towns of Ferghana?
      options:
      - en: Five south of the Sayhun, two north of it
      - en: All seven on the river's north side
      - en: Seven in the mountains
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "بیر اندجان\u200cدور."
          tokens: [{surface: بیر, lexeme: bir, readings: {schluessel: bir}}, {surface: "اندجان\u200cدور", lexemes: [{lexeme: andijan, surface: "اندجان\u200c", base: true}, {lexeme: dur, surface: دور}], readings: {schluessel: Andijāndur}}]
      translations:
        en: One is Andijan.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "اوچ دروازه\u200cسی بار."
          tokens: [{surface: اوچ, lexeme: uch, readings: {schluessel: üč}}, {surface: "دروازه\u200cسی", lexemes: [{lexeme: darwaza, surface: "دروازه\u200c", base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: darwāzasi}}, {surface: بار, lexeme: bar, readings: {schluessel: bar}}]
      translations:
        en: It has three gates.
  - choose:
      prompt:
        en: How many gates does Andijan have?
      options:
      - en: Three
      - en: Seven
      - en: Five
      answer: 0
