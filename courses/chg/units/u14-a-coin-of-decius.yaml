# Chaghatay (chg), unit 14: A coin of Decius (Navai, Tārīḫ-i anbiyā: the Seven Sleepers, the end).
# -ǧač "as soon as"; -urda "when doing"; the narrative past with a person (tapipsen "you have found"); özgä
# "another"; -din soŋra "after"; the causative čiqar- "to take out"; Navai's Persian and Arabic words.
# The passage is ʿAli Sher Navai's own text (died 1501; the History of the Prophets and Kings), as Schluessel
# (2018, ch. 13) types it after Eckmann (1966, 262-263). The rest was drafted by an LLM (provenance llm:…, status
# draft) and awaits a reviewer.
