stories:
- id: chg.story.a-coin-of-decius
  node: chg.u14.story
  title:
    en: A coin of Decius (Navai, Tārīḫ-i anbiyā)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "بضروره طعام الوردا، دیرام جیقارغاج، «دقیانوس کنجینی تابیب\u200cسین!» دیب، انی توتمیشلار."
          tokens:
          - {surface: بضروره, sense: biz-zarura, readings: {schluessel: biżżarūra}}
          - {surface: طعام, sense: taam, readings: {schluessel: ṭaʿām}}
          - {surface: الوردا, sense: al, readings: {schluessel: alurda}, morphs: [{surface: ال, kc: 'sense:al'}, {surface: ور, kc: 'form:aor'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: دیرام, sense: diram, readings: {schluessel: diram}}
          - {surface: جیقارغاج, sense: chiqar, readings: {schluessel: čiqarǧač}, morphs: [{surface: جیقار, kc: 'sense:chiqar'}, {surface: غاج, kc: 'form:gac'}]}
          - {surface: دقیانوس, sense: daqyanus, readings: {schluessel: Daqyānūs}}
          - {surface: کنجینی, sense: kanj, readings: {schluessel: kanjini}, morphs: [{surface: کنج, kc: 'sense:kanj'}, {surface: ی, kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: "تابیب\u200cسین", sense: tap, readings: {schluessel: tapipsen}, morphs: [{surface: تاب, kc: 'sense:tap'}, {surface: "یب\u200c", kc: 'form:narr'}, {surface: سین, kc: 'form:p2s'}]}
          - {surface: دیب, sense: de, readings: {schluessel: dep}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: انی, sense: ul, readings: {schluessel: ani}, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: توتمیشلار, sense: tut, readings: {schluessel: tutmišlar}, morphs: [{surface: توت, kc: 'sense:tut'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
      translations:
        en: When, out of need, he went to buy food and took out a coin, they said, “You have found Decius’s treasure!” and seized him.
  - choose:
      prompt:
        en: Why did the people seize Tamlikha?
      options:
      - en: His old coin made them think he had found Decius’s treasure.
      - en: He would not pay.
      - en: He was a thief.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: کوب ماجرادین سونکرا، پادشاه قاشیغا التمیشلار.
          tokens:
          - {surface: کوب, sense: kop, readings: {schluessel: köp}}
          - {surface: ماجرادین, sense: majara, readings: {schluessel: mājarādin}, morphs: [{surface: ماجرا, kc: 'sense:majara'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: سونکرا, sense: songra, readings: {schluessel: soŋra}}
          - {surface: پادشاه, sense: padishah, readings: {schluessel: pādišāh}}
          - {surface: قاشیغا, sense: qash.presence, readings: {schluessel: qašiǧa}, morphs: [{surface: قاش, kc: 'sense:qash.presence'}, {surface: ی, kc: 'form:poss3'}, {surface: غا, kc: 'form:dat'}]}
          - {surface: التمیشلار, sense: elt, readings: {schluessel: eltmišlär}, morphs: [{surface: الت, kc: 'sense:elt'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
      translations:
        en: After much ado, they took him before the king.
  - line:
      ask: complete
      gap: sense:hayran
      distractors:
      - sense:nan
      - sense:kitab
      forms:
        chg-Arab/standard:
          text: فقیر متحیر اوزکا پادشاه و اوزکا خلق کوروب، حیران ایرمیش.
          tokens:
          - {surface: فقیر, sense: faqir, readings: {schluessel: faqīr-i}}
          - {surface: متحیر, sense: mutahayyir, readings: {schluessel: mutaḥayyir}}
          - {surface: اوزکا, sense: ozga, readings: {schluessel: özgä}}
          - {surface: پادشاه, sense: padishah, readings: {schluessel: pādišāh}}
          - {surface: و, sense: wa, readings: {schluessel: wä}}
          - {surface: اوزکا, sense: ozga, readings: {schluessel: özgä}}
          - {surface: خلق, sense: khalq, readings: {schluessel: ḫalq}}
          - {surface: کوروب, sense: kor, readings: {schluessel: körüp}, morphs: [{surface: کور, kc: 'sense:kor'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: حیران, sense: hayran, readings: {schluessel: ḥayrān}}
          - {surface: ایرمیش, sense: er, readings: {schluessel: ermiš}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: میش, kc: 'form:mis'}]}
      translations:
        en: The poor bewildered man, seeing another king and another people, was amazed.
  - line:
      forms:
        chg-Arab/standard:
          text: الار طعام ییب، تنکری تعالیغا سجدات شکر قیلیب، ینه اویقوغا بارمیشلار.
          tokens:
          - {surface: الار, sense: ular, readings: {schluessel: alar}}
          - {surface: طعام, sense: taam, readings: {schluessel: ṭaʿām}}
          - {surface: ییب, sense: ye, readings: {schluessel: yep}, morphs: [{surface: یی, kc: 'sense:ye'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: تنکری, sense: tangri, readings: {schluessel: Täŋri}}
          - {surface: تعالیغا, sense: taala, readings: {schluessel: taʿālàǧa}, morphs: [{surface: تعالی, kc: 'sense:taala'}, {surface: غا, kc: 'form:dat'}]}
          - {surface: سجدات, sense: sajdat, readings: {schluessel: sajdāt-i}}
          - {surface: شکر, sense: shukr, readings: {schluessel: šukr}}
          - {surface: قیلیب, sense: qil, readings: {schluessel: qilip}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: ینه, sense: yana, readings: {schluessel: yänä}}
          - {surface: اویقوغا, sense: oyqu, readings: {schluessel: oyquǧa}, morphs: [{surface: اویقو, kc: 'sense:oyqu'}, {surface: غا, kc: 'form:dat'}]}
          - {surface: بارمیشلار, sense: bar.go, readings: {schluessel: barmišlar}, morphs: [{surface: بار, kc: 'sense:bar.go'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
      translations:
        en: They ate, bowed down in thanks to God the Exalted, and went back to sleep.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: اول پادشاه اول غار ایشیکیدا اولوغ کنبد یاساب، الارنی مدفون قیلیب، اول یر خلایقغا عظیم معبد بولمیش.
          tokens:
          - {surface: اول, sense: ul, readings: {schluessel: ul}}
          - {surface: پادشاه, sense: padishah, readings: {schluessel: pādišāh}}
          - {surface: اول, sense: ul, readings: {schluessel: ul}}
          - {surface: غار, sense: ghar, readings: {schluessel: ǧār}}
          - {surface: ایشیکیدا, sense: ishik, readings: {schluessel: išikidä}, morphs: [{surface: ایشیک, kc: 'sense:ishik'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: اولوغ, sense: ulugh, readings: {schluessel: uluǧ}}
          - {surface: کنبد, sense: gunbad, readings: {schluessel: gunbad}}
          - {surface: یاساب, sense: yasa, readings: {schluessel: yasap}, morphs: [{surface: یاسا, kc: 'sense:yasa'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: الارنی, sense: ular, readings: {schluessel: alarni}, morphs: [{surface: الار, kc: 'sense:ular'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: مدفون, sense: madfun, readings: {schluessel: madfūn}}
          - {surface: قیلیب, sense: qil, readings: {schluessel: qilip}, morphs: [{surface: قیل, kc: 'sense:qil'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: اول, sense: ul, readings: {schluessel: ul}}
          - {surface: یر, sense: yar, readings: {schluessel: yär}}
          - {surface: خلایقغا, sense: khalayiq, readings: {schluessel: ḫalāyiqqa}, morphs: [{surface: خلایق, kc: 'sense:khalayiq'}, {surface: غا, kc: 'form:dat'}]}
          - {surface: عظیم, sense: azim, readings: {schluessel: ʿaẓīm}}
          - {surface: معبد, sense: mabad, readings: {schluessel: maʿbad}}
          - {surface: بولمیش, sense: bol, readings: {schluessel: bolmiš}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: میش, kc: 'form:mis'}]}
      translations:
        en: That king built a great dome at the mouth of the cave and buried them there, and the place became a great shrine for the people.
  - choose:
      prompt:
        en: What became of the cave?
      options:
      - en: A great shrine under a dome
      - en: A treasury of the king
      - en: A caravanserai
      answer: 0
scenarios:
- id: chg.before-the-king
  after: chg.u14.another-king
  title:
    en: Before the king
  setting:
    en: The palace of Ephesus. Guards have brought in a stranger with a three-hundred-year-old coin.
  character:
    en: The new king, God-fearing and curious, who speaks only Turki.
  goal:
    en: Tell the king where your coin came from, which king you knew, how long you slept, and ask who rules now.
