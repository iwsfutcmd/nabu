stories:
- id: chg.story.a-coin-of-decius
  node: chg.u14.story
  title:
    en: A coin of Decius (Navai, Tārīḫ-i anbiyā)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "بضروره طعام الوردا، دیرام جیقارغاج، «دقیانوس کنجینی تابیب\u200cسین!» دیب، انی توتمیشلار."
          tokens: [{surface: بضروره, lexeme: biz-zarura, readings: {schluessel: biżżarūra}}, {surface: طعام, lexeme: taam, readings: {schluessel: ṭaʿām}}, {surface: الوردا, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: aor, surface: ور}, {lexeme: loc, surface: دا}], readings: {schluessel: alurda}}, {surface: دیرام, lexeme: diram, readings: {schluessel: diram}}, {surface: جیقارغاج, lexemes: [{lexeme: chiqar, surface: جیقار, base: true}, {lexeme: gac, surface: غاج}], readings: {schluessel: čiqarǧač}}, {surface: دقیانوس, lexeme: daqyanus, readings: {schluessel: Daqyānūs}}, {surface: کنجینی, lexemes: [{lexeme: kanj, surface: کنج, base: true}, {lexeme: poss3, surface: ی}, {lexeme: acc, surface: نی}], readings: {schluessel: kanjini}}, {surface: "تابیب\u200cسین", lexemes: [{lexeme: tap, surface: تاب, base: true}, {lexeme: narr, surface: "یب\u200c"}, {lexeme: p2s, surface: سین}], readings: {schluessel: tapipsen}}, {surface: دیب, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: dep}}, {surface: انی, lexemes: [{lexeme: ul, surface: ا, base: true}, {lexeme: acc, surface: نی}], readings: {schluessel: ani}}, {surface: توتمیشلار, lexemes: [{lexeme: tut, surface: توت, base: true}, {lexeme: mis, surface: میش}, {lexeme: pl, surface: لار}], readings: {schluessel: tutmišlar}}]
      translations:
        en: When, out of need, he went to buy food and took out a coin, they said, “You have found Decius’s treasure!” and seized him.
  - choose:
      prompt:
        en: Why did the people seize Tamlikha?
      options:
      - en: His old coin made them think he had found Decius’s treasure.
      - en: He would not pay.
      - en: He was a thief.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: کوب ماجرادین سونکرا، پادشاه قاشیغا التمیشلار.
          tokens: [{surface: کوب, lexeme: kop, readings: {schluessel: köp}}, {surface: ماجرادین, lexemes: [{lexeme: majara, surface: ماجرا, base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: mājarādin}}, {surface: سونکرا, lexeme: songra, readings: {schluessel: soŋra}}, {surface: پادشاه, lexeme: padishah, readings: {schluessel: pādišāh}}, {surface: قاشیغا, lexemes: [{lexeme: qash.presence, surface: قاش, base: true}, {lexeme: poss3, surface: ی}, {lexeme: dat, surface: غا}], readings: {schluessel: qašiǧa}}, {surface: التمیشلار, lexemes: [{lexeme: elt, surface: الت, base: true}, {lexeme: mis, surface: میش}, {lexeme: pl, surface: لار}], readings: {schluessel: eltmišlär}}]
      translations:
        en: After much ado, they took him before the king.
  - line:
      ask: complete
      gap: lexeme:hayran
      distractors:
      - lexeme:shirin
      - lexeme:arzan
      forms:
        chg-Arab/standard:
          text: فقیر متحیر اوزکا پادشاه و اوزکا خلق کوروب، حیران ایرمیش.
          tokens: [{surface: فقیر, lexemes: [{lexeme: faqir, surface: فقیر, base: true}, {lexeme: ezafe, surface: ''}], readings: {schluessel: faqīr-i}}, {surface: متحیر, lexeme: mutahayyir, readings: {schluessel: mutaḥayyir}}, {surface: اوزکا, lexeme: ozga, readings: {schluessel: özgä}}, {surface: پادشاه, lexeme: padishah, readings: {schluessel: pādišāh}}, {surface: و, lexeme: wa, readings: {schluessel: wä}}, {surface: اوزکا, lexeme: ozga, readings: {schluessel: özgä}}, {surface: خلق, lexeme: khalq, readings: {schluessel: ḫalq}}, {surface: کوروب, lexemes: [{lexeme: kor, surface: کور, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: körüp}}, {surface: حیران, lexeme: hayran, readings: {schluessel: ḥayrān}}, {surface: ایرمیش, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: mis, surface: میش}], readings: {schluessel: ermiš}}]
      translations:
        en: The poor bewildered man, seeing another king and another people, was amazed.
  - line:
      forms:
        chg-Arab/standard:
          text: الار طعام ییب، تنکری تعالیغا سجدات شکر قیلیب، ینه اویقوغا بارمیشلار.
          tokens: [{surface: الار, lexeme: ular, readings: {schluessel: alar}}, {surface: طعام, lexeme: taam, readings: {schluessel: ṭaʿām}}, {surface: ییب, lexemes: [{lexeme: ye, surface: یی, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: yep}}, {surface: تنکری, lexeme: tangri, readings: {schluessel: Täŋri}}, {surface: تعالیغا, lexemes: [{lexeme: taala, surface: تعالی, base: true}, {lexeme: dat, surface: غا}], readings: {schluessel: taʿālàǧa}}, {surface: سجدات, lexemes: [{lexeme: sajdat, surface: سجدات, base: true}, {lexeme: ezafe, surface: ''}], readings: {schluessel: sajdāt-i}}, {surface: شکر, lexeme: shukr, readings: {schluessel: šukr}}, {surface: قیلیب, lexemes: [{lexeme: qil, surface: قیل, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: qilip}}, {surface: ینه, lexeme: yana, readings: {schluessel: yänä}}, {surface: اویقوغا, lexemes: [{lexeme: oyqu, surface: اویقو, base: true}, {lexeme: dat, surface: غا}], readings: {schluessel: oyquǧa}}, {surface: بارمیشلار, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: mis, surface: میش}, {lexeme: pl, surface: لار}], readings: {schluessel: barmišlar}}]
      translations:
        en: They ate, bowed down in thanks to God the Exalted, and went back to sleep.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: اول پادشاه اول غار ایشیکیدا اولوغ کنبد یاساب، الارنی مدفون قیلیب، اول یر خلایقغا عظیم معبد بولمیش.
          tokens: [{surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: پادشاه, lexeme: padishah, readings: {schluessel: pādišāh}}, {surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: غار, lexeme: ghar, readings: {schluessel: ǧār}}, {surface: ایشیکیدا, lexemes: [{lexeme: ishik, surface: ایشیک, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: išikidä}}, {surface: اولوغ, lexeme: ulugh, readings: {schluessel: uluǧ}}, {surface: کنبد, lexeme: gunbad, readings: {schluessel: gunbad}}, {surface: یاساب, lexemes: [{lexeme: yasa, surface: یاسا, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: yasap}}, {surface: الارنی, lexemes: [{lexeme: ular, surface: الار, base: true}, {lexeme: acc, surface: نی}], readings: {schluessel: alarni}}, {surface: مدفون, lexeme: madfun, readings: {schluessel: madfūn}}, {surface: قیلیب, lexemes: [{lexeme: qil, surface: قیل, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: qilip}}, {surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: یر, lexeme: yar, readings: {schluessel: yär}}, {surface: خلایقغا, lexemes: [{lexeme: khalayiq, surface: خلایق, base: true}, {lexeme: dat, surface: غا}], readings: {schluessel: ḫalāyiqqa}}, {surface: عظیم, lexeme: azim, readings: {schluessel: ʿaẓīm}}, {surface: معبد, lexeme: mabad, readings: {schluessel: maʿbad}}, {surface: بولمیش, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: mis, surface: میش}], readings: {schluessel: bolmiš}}]
      translations:
        en: That king built a great dome at the mouth of the cave and buried them there, and the place became a great shrine for the people.
  - choose:
      prompt:
        en: What became of the cave?
      options:
      - en: A great shrine under a dome
      - en: A treasury of the king
      - en: A caravanserai
      answer: 0
scenarios:
- id: chg.before-the-king
  after: chg.u14.another-king
  title:
    en: Before the king
  setting:
    en: The palace of Ephesus. Guards have brought in a stranger with a three-hundred-year-old coin.
  character:
    en: The new king, God-fearing and curious, who speaks only Turki.
  goal:
    en: Tell the king where your coin came from, which king you knew, how long you slept, and ask who rules now.
