stories:
- id: chg.story.a-coin-of-decius
  node: chg.u14.story
  title:
    en: A coin of Decius (Navai, Tārīḫ-i anbiyā)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "بضروره طعام الوردا، دیرام جیقارغاج، «دقیانوس کنجینی تابیب\u200cسین!» دیب، انی توتمیشلار."
          tokens:
          - {surface: بضروره, sense: biz-zarura}
          - {surface: طعام, sense: taam}
          - {surface: الوردا, sense: al, morphs: [{surface: ال, kc: 'sense:al'}, {surface: ور, kc: 'form:aor'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: دیرام, sense: diram}
          - {surface: جیقارغاج, sense: chiqar, morphs: [{surface: جیقار, kc: 'sense:chiqar'}, {surface: غاج, kc: 'form:gac'}]}
          - {surface: دقیانوس, sense: daqyanus}
          - {surface: کنجینی, sense: kanj, morphs: [{surface: کنج, kc: 'sense:kanj'}, {surface: ی, kc: 'form:poss3'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: "تابیب\u200cسین", sense: tap, morphs: [{surface: تاب, kc: 'sense:tap'}, {surface: "یب\u200c", kc: 'form:narr'}, {surface: سین, kc: 'form:p2s'}]}
          - {surface: دیب, sense: de, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: انی, sense: ul, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: توتمیشلار, sense: tut, morphs: [{surface: توت, kc: 'sense:tut'}, {surface: میش, kc: 'form:mis'}, {surface: لار, kc: 'form:pl'}]}
        chg-Latn/schluessel:
          text: Biżżarūra ṭaʿām alurda, diram čiqarǧač, “Daqyānūs kanjini tapipsen!” dep, ani tutmišlar.
          tokens:
          - {surface: Biżżarūra, sense: biz-zarura}
          - {surface: ṭaʿām, sense: taam}
          - {surface: alurda, sense: al, morphs: [{surface: al, kc: 'sense:al'}, {surface: ur, kc: 'form:aor'}, {surface: da, kc: 'form:loc'}]}
          - {surface: diram, sense: diram}
          - {surface: čiqarǧač, sense: chiqar, morphs: [{surface: čiqar, kc: 'sense:chiqar'}, {surface: ǧač, kc: 'form:gac'}]}
          - {surface: Daqyānūs, sense: daqyanus}
          - {surface: kanjini, sense: kanj, morphs: [{surface: kanj, kc: 'sense:kanj'}, {surface: i, kc: 'form:poss3'}, {surface: ni, kc: 'form:acc'}]}
          - {surface: tapipsen, sense: tap, morphs: [{surface: tap, kc: 'sense:tap'}, {surface: ip, kc: 'form:narr'}, {surface: sen, kc: 'form:p2s'}]}
          - {surface: dep, sense: de, morphs: [{surface: de, kc: 'sense:de'}, {surface: p, kc: 'form:cv-p'}]}
          - {surface: ani, sense: ul, morphs: [{surface: a, kc: 'sense:ul'}, {surface: ni, kc: 'form:acc'}]}
          - {surface: tutmišlar, sense: tut, morphs: [{surface: tut, kc: 'sense:tut'}, {surface: miš, kc: 'form:mis'}, {surface: lar, kc: 'form:pl'}]}
      translations:
        en: When, out of need, he went to buy food and took out a coin, they said, “You have found Decius’s treasure!” and seized him.
  - choose:
      prompt:
        en: Why did the people seize Tamlikha?
      options:
      - en: His old coin made them think he had found Decius’s treasure.
      - en: He would not pay.
      - en: He was a thief.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: کوب ماجرادین سونکرا، پادشاه قاشیغا التمیشلار.
          tokens:
          - {surface: کوب, sense: kop}
          - {surface: ماجرادین, sense: majara, morphs: [{surface: ماجرا, kc: 'sense:majara'}, {surface: دین, kc: 'form:abl'}]}
