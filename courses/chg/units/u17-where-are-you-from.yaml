stories:
- id: chg.story.where-are-you-from
  node: chg.u17.story
  title:
    en: Where are you from? (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: اما زیور شاه اولوغ فادشاه ایردی.
          tokens: [{surface: اما, lexeme: amma, readings: {schluessel: ammā}}, {surface: زیور, lexeme: ziwar, readings: {schluessel: Zīwar}}, {surface: شاه, lexeme: shah, readings: {schluessel: Šāh}}, {surface: اولوغ, lexeme: ulugh, readings: {schluessel: uluǧ}}, {surface: فادشاه, lexeme: padishah, readings: {schluessel: ṗādišāh}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: Now, Ziwar Shah was a great king.
  - line:
      forms:
        chg-Arab/standard:
          text: "زیور شاه\u200cنینک اونک یانیدا الیک فهلوان…، سول یانیدا اللیک فهلوان…."
          tokens: [{surface: زیور, lexeme: ziwar, readings: {schluessel: Zīwar}}, {surface: "شاه\u200cنینک", lexemes: [{lexeme: shah, surface: "شاه\u200c", base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: Šahniŋ}}, {surface: اونک, lexeme: on.right, readings: {schluessel: oŋ}}, {surface: یانیدا, lexemes: [{lexeme: yan, surface: یان, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: yanida}}, {surface: الیک, lexeme: allik, readings: {schluessel: ällik}}, {surface: فهلوان, lexeme: pahlawan, readings: {schluessel: ṗahlawān}}, {surface: سول, lexeme: sol, readings: {schluessel: sol}}, {surface: یانیدا, lexemes: [{lexeme: yan, surface: یان, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: yanida}}, {surface: اللیک, lexeme: allik, readings: {schluessel: ällik}}, {surface: فهلوان, lexeme: pahlawan, readings: {schluessel: ṗahlawān}}]
      translations:
        en: On Ziwar Shah’s right were fifty champions …, and on his left fifty champions …
  - line:
      ask: complete
      gap: lexeme:yigit
      distractors:
      - lexeme:nashpati
      - lexeme:darwaza
      forms:
        chg-Arab/standard:
          text: "القصّه، زیور شاه ایدی، «ای، یکت\u200cلار! نه یرلیک بولورسیزلار؟ موندا نچه یورورسیزلار؟» دیدی."
          tokens: [{surface: القصّه, lexeme: alqissa, readings: {schluessel: al-qiṣṣa}}, {surface: زیور, lexeme: ziwar, readings: {schluessel: Zīwar}}, {surface: شاه, lexeme: shah, readings: {schluessel: Šāh}}, {surface: ایدی, lexemes: [{lexeme: eyt, surface: ای, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: aydi}}, {surface: ای, lexeme: ay.voc, readings: {schluessel: ay}}, {surface: "یکت\u200cلار", lexemes: [{lexeme: yigit, surface: "یکت\u200c", base: true}, {lexeme: pl, surface: لار}], readings: {schluessel: yigitlär}}, {surface: نه, lexeme: ne, readings: {schluessel: ne}}, {surface: یرلیک, lexemes: [{lexeme: yar, surface: یر, base: true}, {lexeme: liq, surface: لیک}], readings: {schluessel: yärlik}}, {surface: بولورسیزلار, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: aor, surface: ور}, {lexeme: p2pl, surface: سیزلار}], readings: {schluessel: bolursizlär}}, {surface: موندا, lexemes: [{lexeme: bu, surface: مون, base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: munda}}, {surface: نچه, lexeme: nachcha, readings: {schluessel: näččä}}, {surface: یورورسیزلار, lexemes: [{lexeme: yur, surface: یور, base: true}, {lexeme: aor, surface: ور}, {lexeme: p2pl, surface: سیزلار}], readings: {schluessel: yürürsizlär}}, {surface: دیدی, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: dedi}}]
      translations:
        en: 'Back to our story: Ziwar Shah said, “Oh, young men! Where are you from? How long will you be here?”'
  - choose:
      prompt:
        en: What did Ziwar Shah ask the young men?
      options:
      - en: Where they were from and how long they would stay
      - en: Whether they were hungry
      - en: Who their king was
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … پز بخارادین جقیب کلیب ایردوک.
          tokens: [{surface: پز, lexeme: biz, readings: {schluessel: biz}}, {surface: بخارادین, lexemes: [{lexeme: bukhara, surface: بخارا, base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: Buḫārādin}}, {surface: جقیب, lexemes: [{lexeme: chiq, surface: جق, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: čiqip}}, {surface: کلیب, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: kelip}}, {surface: ایردوک, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past-1p, surface: دوک}], readings: {schluessel: erdük}}]
      translations:
        en: … “We came from Bukhara.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: بو شهرکه کلکالی نچه کون بولدی.
          tokens: [{surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: شهرکه, lexemes: [{lexeme: shahar, surface: شهر, base: true}, {lexeme: dat, surface: که}], readings: {schluessel: šahargä}}, {surface: کلکالی, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: gali, surface: کالی}], readings: {schluessel: kälgäli}}, {surface: نچه, lexeme: nachcha, readings: {schluessel: näččä}}, {surface: کون, lexeme: kun, readings: {schluessel: kün}}, {surface: بولدی, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: boldi}}]
      translations:
        en: It has been some days since we came to this city.
  - line:
      forms:
        chg-Arab/standard:
          text: "اما مقصود مدعّایمز بو کم، روی عالم\u200cنی سیر قلیب یورکای\u200cمز."
          tokens: [{surface: اما, lexeme: amma, readings: {schluessel: ammā}}, {surface: مقصود, lexeme: maqsud, readings: {schluessel: maqṣūd}}, {surface: مدعّایمز, lexemes: [{lexeme: mudda, surface: مدعّا, base: true}, {lexeme: poss1p, surface: یمز}], readings: {schluessel: mudaʿʿāymiz}}, {surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: کم, lexeme: kim.that, readings: {schluessel: kim}}, {surface: روی, lexeme: ruy, readings: {schluessel: rūy-i}}, {surface: "عالم\u200cنی", lexemes: [{lexeme: alam, surface: "عالم\u200c", base: true}, {lexeme: acc, surface: نی}], readings: {schluessel: ʿālamni}}, {surface: سیر, lexeme: sayr, readings: {schluessel: sayr}}, {surface: قلیب, lexemes: [{lexeme: qil, surface: قل, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: qilip}}, {surface: "یورکای\u200cمز", lexemes: [{lexeme: yur, surface: یور, base: true}, {lexeme: gay, surface: "کای\u200c"}, {lexeme: p1p, surface: مز}], readings: {schluessel: yürgäymiz}}]
      translations:
        en: 'But our aim and purpose is this: we shall travel the face of the world.'
  - line:
      forms:
        chg-Arab/standard:
          text: … ای، زیور شاه! جوابنک نه ترور؟ ایغیل!»
          tokens: [{surface: ای, lexeme: ay.voc, readings: {schluessel: ay}}, {surface: زیور, lexeme: ziwar, readings: {schluessel: Zīwar}}, {surface: شاه, lexeme: shah, readings: {schluessel: Šāh}}, {surface: جوابنک, lexemes: [{lexeme: jawab, surface: جواب, base: true}, {lexeme: poss2s, surface: نک}], readings: {schluessel: jawābiŋ}}, {surface: نه, lexeme: ne, readings: {schluessel: ne}}, {surface: ترور, lexeme: turur, readings: {schluessel: turur}}, {surface: ایغیل, lexemes: [{lexeme: eyt, surface: ای, base: true}, {lexeme: imp, surface: غیل}], readings: {schluessel: ayǧil}}]
      translations:
        en: … Oh, Ziwar Shah! What is your answer? Tell us!”
  - choose:
      prompt:
        en: Why had the travellers come?
      options:
      - en: To travel the world
      - en: To trade in the bazaar
      - en: To serve the king
      answer: 0
scenarios:
- id: chg.at-court
  after: chg.u17.your-answer
  title:
    en: At court
  setting:
    en: The throne room of a king of the Tadhkira, with champions on his right and left. You are a traveller.
  character:
    en: The king, proud and suspicious of strangers, who speaks only Turki.
  goal:
    en: Say where you are from, how long ago you came to his city and how long you will stay, and what you mean to do; then ask him for his answer.
