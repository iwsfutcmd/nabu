- id: chg.story.where-are-you-from
  node: chg.u17.story
  title:
    en: Where are you from? (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: اما زیور شاه اولوغ فادشاه ایردی.
          tokens:
          - {surface: اما, sense: amma}
          - {surface: زیور, sense: ziwar}
          - {surface: شاه, sense: shah}
          - {surface: اولوغ, sense: ulugh}
          - {surface: فادشاه, sense: padishah}
          - {surface: ایردی, sense: er, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
        chg-Latn/schluessel:
          text: Ammā Zīwar Šāh uluǧ ṗādišāh erdi.
          tokens:
          - {surface: Ammā, sense: amma}
          - {surface: Zīwar, sense: ziwar}
          - {surface: Šāh, sense: shah}
          - {surface: uluǧ, sense: ulugh}
          - {surface: ṗādišāh, sense: padishah}
          - {surface: erdi, sense: er, morphs: [{surface: er, kc: 'sense:er'}, {surface: di, kc: 'form:past-3'}]}
      translations:
        en: Now, Ziwar Shah was a great king.
  - line:
      forms:
        chg-Arab/standard:
          text: "زیور شاه\u200cنینک اونک یانیدا الیک فهلوان…، سول یانیدا اللیک فهلوان…."
          tokens:
          - {surface: زیور, sense: ziwar}
          - {surface: "شاه\u200cنینک", sense: shah, morphs: [{surface: "شاه\u200c", kc: 'sense:shah'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: اونک, sense: on.right}
