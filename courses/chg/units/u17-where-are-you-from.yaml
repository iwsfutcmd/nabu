stories:
- id: chg.story.where-are-you-from
  node: chg.u17.story
  title:
    en: Where are you from? (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: اما زیور شاه اولوغ فادشاه ایردی.
          tokens:
          - {surface: اما, sense: amma, readings: {schluessel: ammā}}
          - {surface: زیور, sense: ziwar, readings: {schluessel: Zīwar}}
          - {surface: شاه, sense: shah, readings: {schluessel: Šāh}}
          - {surface: اولوغ, sense: ulugh, readings: {schluessel: uluǧ}}
          - {surface: فادشاه, sense: padishah, readings: {schluessel: ṗādišāh}}
          - {surface: ایردی, sense: er, readings: {schluessel: erdi}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: Now, Ziwar Shah was a great king.
  - line:
      forms:
        chg-Arab/standard:
          text: "زیور شاه\u200cنینک اونک یانیدا الیک فهلوان…، سول یانیدا اللیک فهلوان…."
          tokens:
          - {surface: زیور, sense: ziwar, readings: {schluessel: Zīwar}}
          - {surface: "شاه\u200cنینک", sense: shah, readings: {schluessel: Šahniŋ}, morphs: [{surface: "شاه\u200c", kc: 'sense:shah'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: اونک, sense: on.right, readings: {schluessel: oŋ}}
          - {surface: یانیدا, sense: yan, readings: {schluessel: yanida}, morphs: [{surface: یان, kc: 'sense:yan'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: الیک, sense: allik, readings: {schluessel: ällik}}
          - {surface: فهلوان, sense: pahlawan, readings: {schluessel: ṗahlawān}}
          - {surface: سول, sense: sol, readings: {schluessel: sol}}
          - {surface: یانیدا, sense: yan, readings: {schluessel: yanida}, morphs: [{surface: یان, kc: 'sense:yan'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: اللیک, sense: allik, readings: {schluessel: ällik}}
          - {surface: فهلوان, sense: pahlawan, readings: {schluessel: ṗahlawān}}
      translations:
        en: On Ziwar Shah’s right were fifty champions …, and on his left fifty champions …
  - line:
      ask: complete
      gap: sense:ne
      distractors:
      - sense:kim
      - sense:nachcha
      forms:
        chg-Arab/standard:
          text: "القصّه، زیور شاه ایدی، «ای، یکت\u200cلار! نه یرلیک بولورسیزلار؟ موندا نچه یورورسیزلار؟» دیدی."
          tokens:
          - {surface: القصّه, sense: alqissa, readings: {schluessel: al-qiṣṣa}}
          - {surface: زیور, sense: ziwar, readings: {schluessel: Zīwar}}
          - {surface: شاه, sense: shah, readings: {schluessel: Šāh}}
          - {surface: ایدی, sense: eyt, readings: {schluessel: aydi}, morphs: [{surface: ای, kc: 'sense:eyt'}, {surface: دی, kc: 'form:past-3'}]}
          - {surface: ای, sense: ay.voc, readings: {schluessel: ay}}
          - {surface: "یکت\u200cلار", sense: yigit, readings: {schluessel: yigitlär}, morphs: [{surface: "یکت\u200c", kc: 'sense:yigit'}, {surface: لار, kc: 'form:pl'}]}
          - {surface: نه, sense: ne, readings: {schluessel: ne}}
          - {surface: یرلیک, sense: yar, readings: {schluessel: yärlik}, morphs: [{surface: یر, kc: 'sense:yar'}, {surface: لیک, kc: 'form:liq'}]}
          - {surface: بولورسیزلار, sense: bol, readings: {schluessel: bolursizlär}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: ور, kc: 'form:aor'}, {surface: سیزلار, kc: 'form:p2pl'}]}
          - {surface: موندا, sense: bu, readings: {schluessel: munda}, morphs: [{surface: مون, kc: 'sense:bu'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: نچه, sense: nachcha, readings: {schluessel: näččä}}
          - {surface: یورورسیزلار, sense: yur, readings: {schluessel: yürürsizlär}, morphs: [{surface: یور, kc: 'sense:yur'}, {surface: ور, kc: 'form:aor'}, {surface: سیزلار, kc: 'form:p2pl'}]}
          - {surface: دیدی, sense: de, readings: {schluessel: dedi}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: 'Back to our story: Ziwar Shah said, “Oh, young men! Where are you from? How long will you be here?”'
  - choose:
      prompt:
        en: What did Ziwar Shah ask the young men?
      options:
      - en: Where they were from and how long they would stay
      - en: Whether they were hungry
      - en: Who their king was
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … پز بخارادین جقیب کلیب ایردوک.
          tokens:
          - {surface: پز, sense: biz, readings: {schluessel: biz}}
          - {surface: بخارادین, sense: bukhara, readings: {schluessel: Buḫārādin}, morphs: [{surface: بخارا, kc: 'sense:bukhara'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: جقیب, sense: chiq, readings: {schluessel: čiqip}, morphs: [{surface: جق, kc: 'sense:chiq'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: کلیب, sense: kal, readings: {schluessel: kelip}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: ایردوک, sense: er, readings: {schluessel: erdük}, morphs: [{surface: ایر, kc: 'sense:er'}, {surface: دوک, kc: 'form:past-1p'}]}
      translations:
        en: … “We came from Bukhara.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: بو شهرکه کلکالی نچه کون بولدی.
          tokens:
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: شهرکه, sense: shahar, readings: {schluessel: šahargä}, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: که, kc: 'form:dat'}]}
          - {surface: کلکالی, sense: kal, readings: {schluessel: kälgäli}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: کالی, kc: 'form:gali'}]}
          - {surface: نچه, sense: nachcha, readings: {schluessel: näččä}}
          - {surface: کون, sense: kun, readings: {schluessel: kün}}
          - {surface: بولدی, sense: bol, readings: {schluessel: boldi}, morphs: [{surface: بول, kc: 'sense:bol'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: It has been some days since we came to this city.
  - line:
      forms:
        chg-Arab/standard:
          text: "اما مقصود مدعّایمز بو کم، روی عالم\u200cنی سیر قلیب یورکای\u200cمز."
          tokens:
          - {surface: اما, sense: amma, readings: {schluessel: ammā}}
          - {surface: مقصود, sense: maqsud, readings: {schluessel: maqṣūd}}
          - {surface: مدعّایمز, sense: mudda, readings: {schluessel: mudaʿʿāymiz}, morphs: [{surface: مدعّا, kc: 'sense:mudda'}, {surface: یمز, kc: 'form:poss1p'}]}
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: کم, sense: kim.that, readings: {schluessel: kim}}
          - {surface: روی, sense: ruy, readings: {schluessel: rūy-i}}
          - {surface: "عالم\u200cنی", sense: alam, readings: {schluessel: ʿālamni}, morphs: [{surface: "عالم\u200c", kc: 'sense:alam'}, {surface: نی, kc: 'form:acc'}]}
          - {surface: سیر, sense: sayr, readings: {schluessel: sayr}}
          - {surface: قلیب, sense: qil, readings: {schluessel: qilip}, morphs: [{surface: قل, kc: 'sense:qil'}, {surface: یب, kc: 'form:cv-p'}]}
          - {surface: "یورکای\u200cمز", sense: yur, readings: {schluessel: yürgäymiz}, morphs: [{surface: یور, kc: 'sense:yur'}, {surface: "کای\u200c", kc: 'form:gay'}, {surface: مز, kc: 'form:p1p'}]}
      translations:
        en: 'But our aim and purpose is this: we shall travel the face of the world.'
  - line:
      forms:
        chg-Arab/standard:
          text: … ای، زیور شاه! جوابنک نه ترور؟ ایغیل!»
          tokens:
          - {surface: ای, sense: ay.voc, readings: {schluessel: ay}}
          - {surface: زیور, sense: ziwar, readings: {schluessel: Zīwar}}
          - {surface: شاه, sense: shah, readings: {schluessel: Šāh}}
          - {surface: جوابنک, sense: jawab, readings: {schluessel: jawābiŋ}, morphs: [{surface: جواب, kc: 'sense:jawab'}, {surface: نک, kc: 'form:poss2s'}]}
          - {surface: نه, sense: ne, readings: {schluessel: ne}}
          - {surface: ترور, sense: turur, readings: {schluessel: turur}}
          - {surface: ایغیل, sense: eyt, readings: {schluessel: ayǧil}, morphs: [{surface: ای, kc: 'sense:eyt'}, {surface: غیل, kc: 'form:imp'}]}
      translations:
        en: … Oh, Ziwar Shah! What is your answer? Tell us!”
  - choose:
      prompt:
        en: Why had the travellers come?
      options:
      - en: To travel the world
      - en: To trade in the bazaar
      - en: To serve the king
      answer: 0
scenarios:
- id: chg.at-court
  after: chg.u17.your-answer
  title:
    en: At court
  setting:
    en: The throne room of a king of the Tadhkira, with champions on his right and left. You are a traveller.
  character:
    en: The king, proud and suspicious of strangers, who speaks only Turki.
  goal:
    en: Say where you are from, how long ago you came to his city and how long you will stay, and what you mean to do; then ask him for his answer.
