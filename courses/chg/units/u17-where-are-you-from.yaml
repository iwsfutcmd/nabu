# Chaghatay (chg), unit 17: Where are you from? (The Tadhkira of Jalāl ud-Dīn Katakī, part two).
# -ǧay with person endings, "shall" (yürgäymiz); -ǧali "since" (kälgäli näččä kün boldi); -lik "from" (ne yärlik?
# Buḫārālik); oŋ and sol; munda "here"; the -ǧil imperative of ay- "say"; Persian and Arabic words of the court.
# The passage is the anonymous Tadhkira of Jalāl ud-Dīn Katakī (Lund University Library, Jarring Prov. 328,
# 3v:6-4r:2; public domain), as Schluessel (2018, ch. 15) types it; the story keeps its first part and leaves out
# the threat that ends it. The rest was drafted by an LLM (provenance llm:…, status draft) and awaits a reviewer.
