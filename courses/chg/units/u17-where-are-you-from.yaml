          - {surface: الیک, sense: allik}
          - {surface: فهلوان, sense: pahlawan}
          - {surface: سول, sense: sol}
          - {surface: یانیدا, sense: yan, morphs: [{surface: یان, kc: 'sense:yan'}, {surface: ی, kc: 'form:poss3'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: اللیک, sense: allik}
          - {surface: فهلوان, sense: pahlawan}
        chg-Latn/schluessel:
          text: Zīwar Šahniŋ oŋ yanida ällik ṗahlawān…, sol yanida ällik ṗahlawān….
          tokens:
          - {surface: Zīwar, sense: ziwar}
          - {surface: Šahniŋ, sense: shah, morphs: [{surface: Šah, kc: 'sense:shah'}, {surface: niŋ, kc: 'form:gen'}]}
          - {surface: oŋ, sense: on.right}
