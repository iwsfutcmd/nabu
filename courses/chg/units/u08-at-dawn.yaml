- id: chg.story.at-dawn
  node: chg.u08.story
  title:
    en: Let's go in at dawn (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "انینک بلان ایکولان شهرنینک دروازه\u200cسیدین جقتی."
          tokens:
          - {surface: انینک, sense: ul, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: بلان, sense: bila}
