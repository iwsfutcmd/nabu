          - {surface: شهرنینک, sense: shahar, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: "دروازه\u200cسیدین", sense: darwaza, morphs: [{surface: "دروازه\u200c", kc: 'sense:darwaza'}, {surface: سی, kc: 'form:poss3'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: جقتی, sense: chiq, morphs: [{surface: جق, kc: 'sense:chiq'}, {surface: تی, kc: 'form:past-3'}]}
        chg-Latn/schluessel:
          text: Aniŋ bilän ikkäwlän šaharniŋ darwāzasidin čiqti.
          tokens:
          - {surface: Aniŋ, sense: ul, morphs: [{surface: A, kc: 'sense:ul'}, {surface: niŋ, kc: 'form:gen'}]}
          - {surface: bilän, sense: bila}
          - {surface: ikkäwlän, sense: ikkawlan}
          - {surface: šaharniŋ, sense: shahar, morphs: [{surface: šahar, kc: 'sense:shahar'}, {surface: niŋ, kc: 'form:gen'}]}
          - {surface: darwāzasidin, sense: darwaza, morphs: [{surface: darwāza, kc: 'sense:darwaza'}, {surface: si, kc: 'form:poss3'}, {surface: din, kc: 'form:abl'}]}
          - {surface: čiqti, sense: chiq, morphs: [{surface: čiq, kc: 'sense:chiq'}, {surface: ti, kc: 'form:past-3'}]}
      translations:
        en: With him, the two of them went out of the city gate.
  - line:
      forms:
