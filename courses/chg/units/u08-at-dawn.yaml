stories:
- id: chg.story.at-dawn
  node: chg.u08.story
  title:
    en: Let's go in at dawn (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "انینک بلان ایکولان شهرنینک دروازه\u200cسیدین جقتی."
          tokens: [{surface: انینک, lexemes: [{lexeme: ul, surface: ا, base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: aniŋ}}, {surface: بلان, lexeme: bila, readings: {schluessel: bilän}}, {surface: ایکولان, lexeme: ikkawlan, readings: {schluessel: ikkäwlän}}, {surface: شهرنینک, lexemes: [{lexeme: shahar, surface: شهر, base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: šaharniŋ}}, {surface: "دروازه\u200cسیدین", lexemes: [{lexeme: darwaza, surface: "دروازه\u200c", base: true}, {lexeme: poss3, surface: سی}, {lexeme: abl, surface: دین}], readings: {schluessel: darwāzasidin}}, {surface: جقتی, lexemes: [{lexeme: chiq, surface: جق, base: true}, {lexeme: past-3, surface: تی}], readings: {schluessel: čiqti}}]
      translations:
        en: With him, the two of them went out of the city gate.
  - line:
      forms:
        chg-Arab/standard:
          text: "سفرکا عزم قلدی\u200cلار."
          tokens: [{surface: سفرکا, lexemes: [{lexeme: safar, surface: سفر, base: true}, {lexeme: dat, surface: کا}], readings: {schluessel: safargä}}, {surface: عزم, lexeme: azm, readings: {schluessel: ʿazm}}, {surface: "قلدی\u200cلار", lexemes: [{lexeme: qil, surface: قل, base: true}, {lexeme: past-3pl, surface: "دی\u200cلار"}], readings: {schluessel: qildilar}}]
      translations:
        en: They set out on a journey.
  - line:
      ask: complete
      gap: lexeme:kal
      asks: form
      distractors:
      - lexeme:cv-p
      - lexeme:loc
      forms:
        chg-Arab/standard:
          text: "نجنده کوندین کین، بر شهرکه کلدی\u200cلار."
          tokens: [{surface: نجنده, lexeme: nachcha, readings: {schluessel: näččändä}}, {surface: کوندین, lexemes: [{lexeme: kun, surface: کون, base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: kündin}}, {surface: کین, lexeme: keyin, readings: {schluessel: keyin}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: شهرکه, lexemes: [{lexeme: shahar, surface: شهر, base: true}, {lexeme: dat, surface: که}], readings: {schluessel: šahargä}}, {surface: "کلدی\u200cلار", lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: past-3pl, surface: "دی\u200cلار"}], readings: {schluessel: käldilär}}]
      translations:
        en: Some days later they came to a city.
  - choose:
      prompt:
        en: How long did the journey take?
      options:
      - en: Some days
      - en: One night
      - en: A year
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "«تانک اتقاندا، کرالی،» دیب، بر کناره\u200cدا قوندی\u200cلار."
          tokens: [{surface: تانک, lexeme: tang, readings: {schluessel: taŋ}}, {surface: اتقاندا, lexemes: [{lexeme: at.shoot, surface: ات, base: true}, {lexeme: pcp, surface: قان}, {lexeme: loc, surface: دا}], readings: {schluessel: atqanda}}, {surface: کرالی, lexemes: [{lexeme: kir, surface: کر, base: true}, {lexeme: let, surface: الی}], readings: {schluessel: kiräli}}, {surface: دیب, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: dep}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: "کناره\u200cدا", lexemes: [{lexeme: kanara, surface: "کناره\u200c", base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: kanārada}}, {surface: "قوندی\u200cلار", lexemes: [{lexeme: qon, surface: قون, base: true}, {lexeme: past-3pl, surface: "دی\u200cلار"}], readings: {schluessel: qondilar}}]
      translations:
        en: “When dawn breaks, let us go in,” they said, and they stopped for the night at the edge of the city.
  - line:
      forms:
        chg-Arab/standard:
          text: "ارته\u200cسی تانک یارودی."
          tokens: [{surface: "ارته\u200cسی", lexemes: [{lexeme: arta, surface: "ارته\u200c", base: true}, {lexeme: poss3, surface: سی}], readings: {schluessel: ärtäsi}}, {surface: تانک, lexeme: tang, readings: {schluessel: taŋ}}, {surface: یارودی, lexemes: [{lexeme: yaru, surface: یارو, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: yarudi}}]
      translations:
        en: The next morning, dawn broke.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "بو ایکولان قوفوب، شهریکه کردی\u200cلار."
          tokens: [{surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: ایکولان, lexeme: ikkawlan, readings: {schluessel: ikkäwlän}}, {surface: قوفوب, lexemes: [{lexeme: qop, surface: قوف, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: qoṗup}}, {surface: شهریکه, lexemes: [{lexeme: shahar, surface: شهری, base: true}, {lexeme: dat, surface: که}], readings: {schluessel: šahargä}}, {surface: "کردی\u200cلار", lexemes: [{lexeme: kir, surface: کر, base: true}, {lexeme: past-3pl, surface: "دی\u200cلار"}], readings: {schluessel: kirdilär}}]
      translations:
        en: The two of them got up and went into the city.
  - choose:
      prompt:
        en: Why did they wait outside the city?
      options:
      - en: They would not go into a strange city by night.
      - en: The gate was closed for good.
      - en: They were lost.
      answer: 0
scenarios:
- id: chg.arriving-at-night
  after: chg.u08.lets-go
  title:
    en: Arriving at night
  setting:
    en: Outside the walls of a strange city, at nightfall. You and a friend have travelled for days from Bukhara.
  character:
    en: Your travelling companion, cautious and tired, who speaks only Turki.
  goal:
    en: Say where you came from and when, suggest what to do ("let us…") before and after dawn, and agree on a plan.
