stories:
- id: chg.story.at-dawn
  node: chg.u08.story
  title:
    en: Let's go in at dawn (The Tadhkira of Jalāl ud-Dīn Katakī)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "انینک بلان ایکولان شهرنینک دروازه\u200cسیدین جقتی."
          tokens:
          - {surface: انینک, sense: ul, readings: {schluessel: aniŋ}, morphs: [{surface: ا, kc: 'sense:ul'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: بلان, sense: bila, readings: {schluessel: bilän}}
          - {surface: ایکولان, sense: ikkawlan, readings: {schluessel: ikkäwlän}}
          - {surface: شهرنینک, sense: shahar, readings: {schluessel: šaharniŋ}, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: نینک, kc: 'form:gen'}]}
          - {surface: "دروازه\u200cسیدین", sense: darwaza, readings: {schluessel: darwāzasidin}, morphs: [{surface: "دروازه\u200c", kc: 'sense:darwaza'}, {surface: سی, kc: 'form:poss3'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: جقتی, sense: chiq, readings: {schluessel: čiqti}, morphs: [{surface: جق, kc: 'sense:chiq'}, {surface: تی, kc: 'form:past-3'}]}
      translations:
        en: With him, the two of them went out of the city gate.
  - line:
      forms:
        chg-Arab/standard:
          text: "سفرکا عزم قلدی\u200cلار."
          tokens:
          - {surface: سفرکا, sense: safar, readings: {schluessel: safargä}, morphs: [{surface: سفر, kc: 'sense:safar'}, {surface: کا, kc: 'form:dat'}]}
          - {surface: عزم, sense: azm, readings: {schluessel: ʿazm}}
          - {surface: "قلدی\u200cلار", sense: qil, readings: {schluessel: qildilar}, morphs: [{surface: قل, kc: 'sense:qil'}, {surface: "دی\u200cلار", kc: 'form:past-3pl'}]}
      translations:
        en: They set out on a journey.
  - line:
      ask: complete
      gap: sense:kal
      asks: form
      distractors:
      - form:cv-p
      - form:loc
      forms:
        chg-Arab/standard:
          text: "نجنده کوندین کین، بر شهرکه کلدی\u200cلار."
          tokens:
          - {surface: نجنده, sense: nachcha, readings: {schluessel: näččändä}}
          - {surface: کوندین, sense: kun, readings: {schluessel: kündin}, morphs: [{surface: کون, kc: 'sense:kun'}, {surface: دین, kc: 'form:abl'}]}
          - {surface: کین, sense: keyin, readings: {schluessel: keyin}}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: شهرکه, sense: shahar, readings: {schluessel: šahargä}, morphs: [{surface: شهر, kc: 'sense:shahar'}, {surface: که, kc: 'form:dat'}]}
          - {surface: "کلدی\u200cلار", sense: kal, readings: {schluessel: käldilär}, morphs: [{surface: کل, kc: 'sense:kal'}, {surface: "دی\u200cلار", kc: 'form:past-3pl'}]}
      translations:
        en: Some days later they came to a city.
  - choose:
      prompt:
        en: How long did the journey take?
      options:
      - en: Some days
      - en: One night
      - en: A year
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "«تانک اتقاندا، کرالی،» دیب، بر کناره\u200cدا قوندی\u200cلار."
          tokens:
          - {surface: تانک, sense: tang, readings: {schluessel: taŋ}}
          - {surface: اتقاندا, sense: at.shoot, readings: {schluessel: atqanda}, morphs: [{surface: ات, kc: 'sense:at.shoot'}, {surface: قان, kc: 'form:pcp'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: کرالی, sense: kir, readings: {schluessel: kiräli}, morphs: [{surface: کر, kc: 'sense:kir'}, {surface: الی, kc: 'form:let'}]}
          - {surface: دیب, sense: de, readings: {schluessel: dep}, morphs: [{surface: دی, kc: 'sense:de'}, {surface: ب, kc: 'form:cv-p'}]}
          - {surface: بر, sense: bir, readings: {schluessel: bir}}
          - {surface: "کناره\u200cدا", sense: kanara, readings: {schluessel: kanārada}, morphs: [{surface: "کناره\u200c", kc: 'sense:kanara'}, {surface: دا, kc: 'form:loc'}]}
          - {surface: "قوندی\u200cلار", sense: qon, readings: {schluessel: qondilar}, morphs: [{surface: قون, kc: 'sense:qon'}, {surface: "دی\u200cلار", kc: 'form:past-3pl'}]}
      translations:
        en: “When dawn breaks, let us go in,” they said, and they stopped for the night at the edge of the city.
  - line:
      forms:
        chg-Arab/standard:
          text: "ارته\u200cسی تانک یارودی."
          tokens:
          - {surface: "ارته\u200cسی", sense: arta, readings: {schluessel: ärtäsi}, morphs: [{surface: "ارته\u200c", kc: 'sense:arta'}, {surface: سی, kc: 'form:poss3'}]}
          - {surface: تانک, sense: tang, readings: {schluessel: taŋ}}
          - {surface: یارودی, sense: yaru, readings: {schluessel: yarudi}, morphs: [{surface: یارو, kc: 'sense:yaru'}, {surface: دی, kc: 'form:past-3'}]}
      translations:
        en: The next morning, dawn broke.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: "بو ایکولان قوفوب، شهریکه کردی\u200cلار."
          tokens:
          - {surface: بو, sense: bu, readings: {schluessel: bu}}
          - {surface: ایکولان, sense: ikkawlan, readings: {schluessel: ikkäwlän}}
          - {surface: قوفوب, sense: qop, readings: {schluessel: qoṗup}, morphs: [{surface: قوف, kc: 'sense:qop'}, {surface: وب, kc: 'form:cv-p'}]}
          - {surface: شهریکه, sense: shahar, readings: {schluessel: šahargä}, morphs: [{surface: شهری, kc: 'sense:shahar'}, {surface: که, kc: 'form:dat'}]}
          - {surface: "کردی\u200cلار", sense: kir, readings: {schluessel: kirdilär}, morphs: [{surface: کر, kc: 'sense:kir'}, {surface: "دی\u200cلار", kc: 'form:past-3pl'}]}
      translations:
        en: The two of them got up and went into the city.
  - choose:
      prompt:
        en: Why did they wait outside the city?
      options:
      - en: They would not go into a strange city by night.
      - en: The gate was closed for good.
      - en: They were lost.
      answer: 0
scenarios:
- id: chg.arriving-at-night
  after: chg.u08.lets-go
  title:
    en: Arriving at night
  setting:
    en: Outside the walls of a strange city, at nightfall. You and a friend have travelled for days from Bukhara.
  character:
    en: Your travelling companion, cautious and tired, who speaks only Turki.
  goal:
    en: Say where you came from and when, suggest what to do ("let us…") before and after dawn, and agree on a plan.
