# Chaghatay (chg), unit 8: Let's go in at dawn (The Tadhkira of Jalāl ud-Dīn Katakī).
# Stories in a chain of -p; the past participle -ǧan and "when" (-ǧanda); "let us" (-äli); "after" (-din keyin);
# dep "saying"; going out and in, setting out and stopping for the night.
# The passage is the anonymous Tadhkira of Jalāl ud-Dīn Katakī (Lund University Library, Jarring Prov. 328,
# 1v-2r; public domain), as Schluessel (2018, ch. 14) types it, in the scribe's spellings. The rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u08-at-dawn
title:
  en: At dawn
cefr: A2
kcs:
- id: sense:ikkawlan
  gloss:
    en: the two of them, both together
  forms:
    chg-Arab/standard:
    - ایکاولان
    chg-Latn/schluessel:
    - ikkäwlän
- id: sense:chiq
  gloss:
    en: to go out, come out; to climb
  forms:
    chg-Arab/standard:
    - چیق-
    chg-Latn/schluessel:
    - čiq-
- id: sense:kir
  gloss:
    en: to go in, enter
  forms:
    chg-Arab/standard:
    - کیر-
    chg-Latn/schluessel:
    - kir-
- id: sense:safar
  gloss:
    en: journey
  forms:
    chg-Arab/standard:
    - سفر
    chg-Latn/schluessel:
    - safar
- id: sense:azm
  gloss:
    en: resolve, intention
  forms:
    chg-Arab/standard:
    - عزم
    chg-Latn/schluessel:
    - ʿazm
  notes:
    en: 'ʿazm qil- "to set out (for)": safargä ʿazm qildi "he set out on a journey".'
- id: sense:nachcha
  gloss:
    en: some, several; how many?
  forms:
    chg-Arab/standard:
    - نچه
    chg-Latn/schluessel:
    - näččä
  notes:
    en: näččändä kündin keyin "some days later". In the Tadhkira it is näččändä.
- id: sense:keyin
  gloss:
    en: after, later
  forms:
    chg-Arab/standard:
    - کیین
    chg-Latn/schluessel:
    - keyin
  notes:
    en: 'After a noun with -din: üč kündin keyin "after three days".'
- id: sense:tang
  gloss:
    en: dawn
  forms:
    chg-Arab/standard:
    - تانک
    chg-Latn/schluessel:
    - taŋ
- id: sense:at.shoot
  gloss:
    en: to shoot; (of the dawn) to break
  forms:
    chg-Arab/standard:
    - ات-
    chg-Latn/schluessel:
    - at-
  notes:
    en: taŋ at- "dawn breaks".
- id: sense:yaru
  gloss:
    en: to grow light, shine
  forms:
    chg-Arab/standard:
    - یارو-
    chg-Latn/schluessel:
    - yaru-
- id: sense:arta
  gloss:
    en: early morning; the next day
  forms:
    chg-Arab/standard:
    - ارته
    chg-Latn/schluessel:
    - ärtä
  notes:
    en: ärtäsi "the next morning".
- id: sense:kanara
  gloss:
    en: edge, side; an out-of-the-way place
  forms:
    chg-Arab/standard:
    - کناره
    chg-Latn/schluessel:
    - kanāra
- id: sense:qon
  gloss:
    en: to stop for the night, camp
  forms:
    chg-Arab/standard:
    - قون-
    chg-Latn/schluessel:
    - qon-
- id: sense:qop
  gloss:
    en: to get up, rise
  forms:
    chg-Arab/standard:
    - قوپ-
    chg-Latn/schluessel:
    - qoṗ-
- id: form:pcp
  gloss:
    en: '-ǧan, -gän (-qan, -kän): who did, which was; (with -da) when'
  notes:
    en: 'The past participle: kälgän kiši "the man who came". With -da it says when: taŋ atqanda "when dawn broke", šaharǧa kälgändä "when he came to the city".'
- id: form:let
  gloss:
    en: '-ali, -äli (-li after a vowel): let us …!'
  notes:
    en: kiräli "let us go in", barali "let us go", turmayli "let us not stay".
