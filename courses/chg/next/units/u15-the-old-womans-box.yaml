stories:
- id: chg.story.the-old-womans-box
  node: chg.u15.story
  title:
    en: The old woman’s box (The Stories of the Prophets)
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: … عاج طوفاندا هلاک بولمادی.
          tokens: [{surface: عاج, lexeme: aj, readings: {schluessel: ʿĀj}}, {surface: طوفاندا, lexemes: [{lexeme: tufan, surface: طوفان, base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: ṭūfānda}}, {surface: هلاک, lexeme: halak, readings: {schluessel: halāk}}, {surface: بولمادی, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: neg, surface: ما}, {lexeme: past-3, surface: دی}], readings: {schluessel: bolmadi}}]
      translations:
        en: … ʿĀj did not perish in the Flood.
  - line:
      forms:
        chg-Arab/standard:
          text: اما کافر ایماس ایردی.
          tokens: [{surface: اما, lexeme: amma, readings: {schluessel: ammā}}, {surface: کافر, lexeme: kafir, readings: {schluessel: kāfir}}, {surface: ایماس, lexeme: emas, readings: {schluessel: emäs}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: But he was not an unbeliever.
  - line:
      forms:
        chg-Arab/standard:
          text: دریالار یقاسیدا جنکالدا یورور ایردی.
          tokens: [{surface: دریالار, lexemes: [{lexeme: darya, surface: دریا, base: true}, {lexeme: pl, surface: لار}], readings: {schluessel: daryālar}}, {surface: یقاسیدا, lexemes: [{lexeme: yaqa, surface: یقا, base: true}, {lexeme: poss3, surface: سی}, {lexeme: loc, surface: دا}], readings: {schluessel: yaqasida}}, {surface: جنکالدا, lexemes: [{lexeme: jangal, surface: جنکال, base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: jaŋgalda}}, {surface: یورور, lexemes: [{lexeme: yur, surface: یور, base: true}, {lexeme: aor, surface: ور}], readings: {schluessel: yürür}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: He would go about along the rivers, in the wilderness.
  - line:
      ask: complete
      gap: lexeme:tiz
      asks: form
      forms:
        chg-Arab/standard:
          text: طوفان سویی انینک تیزیغه یتمادی.
          tokens: [{surface: طوفان, lexeme: tufan, readings: {schluessel: ṭūfān}}, {surface: سویی, lexemes: [{lexeme: su, surface: سو, base: true}, {lexeme: poss3, surface: یی}], readings: {schluessel: süyi}}, {surface: انینک, lexemes: [{lexeme: ul, surface: ا, base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: aniŋ}}, {surface: تیزیغه, lexemes: [{lexeme: tiz, surface: تیز, base: true}, {lexeme: poss3, surface: ی}, {lexeme: dat, surface: غه}], readings: {schluessel: tiziǧa}}, {surface: یتمادی, lexemes: [{lexeme: yat, surface: یت, base: true}, {lexeme: neg, surface: ما}, {lexeme: past-3, surface: دی}], readings: {schluessel: yätmädi}}]
      translations:
        en: The waters of the Flood did not reach his knees.
  - choose:
      prompt:
        en: How big was ʿĀj?
      options:
      - en: The Flood did not reach his knees.
      - en: He was as tall as a house.
      - en: He was as small as a boy.
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: … بو یکیت باریب، بیر ماماغه حالینی بیان قیلدی.
          tokens: [{surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: یکیت, lexeme: yigit, readings: {schluessel: yigit}}, {surface: باریب, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: barip}}, {surface: بیر, lexeme: bir, readings: {schluessel: bir}}, {surface: ماماغه, lexemes: [{lexeme: mama, surface: ماما, base: true}, {lexeme: dat, surface: غه}], readings: {schluessel: mamaǧa}}, {surface: حالینی, lexemes: [{lexeme: hal, surface: حال, base: true}, {lexeme: poss3, surface: ی}, {lexeme: acc, surface: نی}], readings: {schluessel: ḥālini}}, {surface: بیان, lexeme: bayan, readings: {schluessel: bayān}}, {surface: قیلدی, lexemes: [{lexeme: qil, surface: قیل, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: qildi}}]
      translations:
        en: … This young man went and told an old woman about his situation.
  - line:
      forms:
        chg-Arab/standard:
          text: ماما ایتیکه، «یغاچی قاشیغه باریب، بیر صندوق ایتوروب، مینینک قاشیمغه الیب کلینک،» دیدی.
          tokens: [{surface: ماما, lexeme: mama, readings: {schluessel: mama}}, {surface: ایتیکه, lexemes: [{lexeme: eyt, surface: ای, base: true}, {lexeme: past-3, surface: تی}, {lexeme: ke, surface: که}], readings: {schluessel: eyttike}}, {surface: یغاچی, lexemes: [{lexeme: yaghach, surface: یغا, base: true}, {lexeme: ci, surface: چی}], readings: {schluessel: yaǧačči}}, {surface: قاشیغه, lexemes: [{lexeme: qash.presence, surface: قاش, base: true}, {lexeme: poss3, surface: ی}, {lexeme: dat, surface: غه}], readings: {schluessel: qašiǧa}}, {surface: باریب, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: barip}}, {surface: بیر, lexeme: bir, readings: {schluessel: bir}}, {surface: صندوق, lexeme: sanduq, readings: {schluessel: ṣandūq}}, {surface: ایتوروب, lexemes: [{lexeme: ettur, surface: ایتور, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: ettürüp}}, {surface: مینینک, lexemes: [{lexeme: man, surface: مین, base: true}, {lexeme: gen, surface: ینک}], readings: {schluessel: meniŋ}}, {surface: قاشیمغه, lexemes: [{lexeme: qash.presence, surface: قاش, base: true}, {lexeme: poss1s, surface: یم}, {lexeme: dat, surface: غه}], readings: {schluessel: qašimǧa}}, {surface: الیب, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: alip}}, {surface: کلینک, lexemes: [{lexeme: kal, surface: کل, base: true}, {lexeme: imp, surface: ینک}], readings: {schluessel: keliŋ}}, {surface: دیدی, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: dedi}}]
      translations:
        en: The old woman said, “Go to the carpenter, have a box made, and bring it to me.”
  - line:
      forms:
        chg-Arab/standard:
          text: صندوق ایتوروب، مامانینک قاشیغه الیب باردی.
          tokens: [{surface: صندوق, lexeme: sanduq, readings: {schluessel: ṣandūq}}, {surface: ایتوروب, lexemes: [{lexeme: ettur, surface: ایتور, base: true}, {lexeme: cv-p, surface: وب}], readings: {schluessel: ettürüp}}, {surface: مامانینک, lexemes: [{lexeme: mama, surface: ماما, base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: mamaniŋ}}, {surface: قاشیغه, lexemes: [{lexeme: qash.presence, surface: قاش, base: true}, {lexeme: poss3, surface: ی}, {lexeme: dat, surface: غه}], readings: {schluessel: qašiǧa}}, {surface: الیب, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: alip}}, {surface: باردی, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: bardi}}]
      translations:
        en: He had the box made and took it to the old woman.
  - line:
      forms:
        chg-Arab/standard:
          text: ماما یغلاب ایتیکه، «ای، اوغلوم! بو صندوقدا کیشینینک امانتی بار ایردی!
          tokens: [{surface: ماما, lexeme: mama, readings: {schluessel: mama}}, {surface: یغلاب, lexemes: [{lexeme: yigla, surface: یغلا, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: yiǧlap}}, {surface: ایتیکه, lexemes: [{lexeme: eyt, surface: ای, base: true}, {lexeme: past-3, surface: تی}, {lexeme: ke, surface: که}], readings: {schluessel: eyttike}}, {surface: ای, lexeme: ay.voc, readings: {schluessel: ay}}, {surface: اوغلوم, lexemes: [{lexeme: oghul, surface: اوغل, base: true}, {lexeme: poss1s, surface: وم}], readings: {schluessel: oǧlum}}, {surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: صندوقدا, lexemes: [{lexeme: sanduq, surface: صندوق, base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: ṣandūqta}}, {surface: کیشینینک, lexemes: [{lexeme: kishi, surface: کیشی, base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: kišiniŋ}}, {surface: امانتی, lexemes: [{lexeme: amanat, surface: امانت, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: amānati}}, {surface: بار, lexeme: bar, readings: {schluessel: bar}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: Weeping, the old woman said, “Oh, my son! In this box is something someone left in my keeping!
  - line:
      forms:
        chg-Arab/standard:
          text: شونی سین ساقلاب برسانک؟ ینه کیشیکا اعتمادیم یوق،» دیب ایردی.
          tokens: [{surface: شونی, lexemes: [{lexeme: shu, surface: شو, base: true}, {lexeme: acc, surface: نی}], readings: {schluessel: šuni}}, {surface: سین, lexeme: san, readings: {schluessel: sen}}, {surface: ساقلاب, lexemes: [{lexeme: saqla, surface: ساقلا, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: saqlap}}, {surface: برسانک, lexemes: [{lexeme: bar.give, surface: بر, base: true}, {lexeme: cond-2s, surface: سانک}], readings: {schluessel: bärsäŋ}}, {surface: ینه, lexeme: yana, readings: {schluessel: yänä}}, {surface: کیشیکا, lexemes: [{lexeme: kishi, surface: کیشی, base: true}, {lexeme: dat, surface: کا}], readings: {schluessel: kišigä}}, {surface: اعتمادیم, lexemes: [{lexeme: itimad, surface: اعتماد, base: true}, {lexeme: poss1s, surface: یم}], readings: {schluessel: iʿtimādim}}, {surface: یوق, lexeme: yoq, readings: {schluessel: yoq}}, {surface: دیب, lexemes: [{lexeme: de, surface: دی, base: true}, {lexeme: cv-p, surface: ب}], readings: {schluessel: dep}}, {surface: ایردی, lexemes: [{lexeme: er, surface: ایر, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: erdi}}]
      translations:
        en: Would you keep it for me? I trust no one else.”
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: عاج الیب باریب، اویدا قویدی.
          tokens: [{surface: عاج, lexeme: aj, readings: {schluessel: ʿĀj}}, {surface: الیب, lexemes: [{lexeme: al, surface: ال, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: alip}}, {surface: باریب, lexemes: [{lexeme: bar.go, surface: بار, base: true}, {lexeme: cv-p, surface: یب}], readings: {schluessel: barip}}, {surface: اویدا, lexemes: [{lexeme: oy, surface: اوی, base: true}, {lexeme: loc, surface: دا}], readings: {schluessel: öydä}}, {surface: قویدی, lexemes: [{lexeme: qoy.put, surface: قوی, base: true}, {lexeme: past-3, surface: دی}], readings: {schluessel: qoydi}}]
      translations:
        en: ʿĀj took it home and put it in his house.
  - choose:
      prompt:
        en: What did the old woman ask ʿĀj to do?
      options:
      - en: To keep a box for her
      - en: To build her a house
      - en: To find her son
      answer: 0
scenarios:
- id: chg.at-the-carpenters
  after: chg.u15.would-you
  title:
    en: At the carpenter’s
  setting:
    en: A carpenter’s shop in the bazaar of Kashgar, around 1800. You need a box made.
  character:
    en: The carpenter, busy but polite, who speaks only Turki.
  goal:
    en: Ask him politely to make you a box, say how big it should be, ask when to come back, and ask whether he would keep your things for you until then.
