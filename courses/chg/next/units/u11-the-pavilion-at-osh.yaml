stories:
- id: chg.story.the-pavilion-at-osh
  node: chg.u11.story
  title:
    en: 'The pavilion at Osh (Babur, Bāburnāma: Osh)'
  steps:
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cنینک شرق جنوبی طرفی\u200cدور."
          tokens: [{surface: "اندجان\u200cنینک", lexemes: [{lexeme: andijan, surface: "اندجان\u200c", base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: Andijānniŋ}}, {surface: شرق, lexeme: sharq, readings: {schluessel: šarq}}, {surface: جنوبی, lexemes: [{lexeme: janub, surface: جنوب, base: true}, {lexeme: nisba, surface: ی}], readings: {schluessel: janūbī}}, {surface: "طرفی\u200cدور", lexemes: [{lexeme: taraf, surface: طرف, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: dur, surface: دور}], readings: {schluessel: ṭarafidur}}]
      translations:
        en: It lies to the southeast of Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: "اندجان\u200cدین تورت یغاچ یول\u200cدور."
          tokens: [{surface: "اندجان\u200cدین", lexemes: [{lexeme: andijan, surface: "اندجان\u200c", base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: Andijāndin}}, {surface: تورت, lexeme: tort, readings: {schluessel: tört}}, {surface: یغاچ, lexeme: yaghach, readings: {schluessel: yaǧač}}, {surface: "یول\u200cدور", lexemes: [{lexeme: yol, surface: "یول\u200c", base: true}, {lexeme: dur, surface: دور}], readings: {schluessel: yoldur}}]
      translations:
        en: It is four leagues' journey from Andijan.
  - line:
      forms:
        chg-Arab/standard:
          text: "اقار سُوی فراوان\u200cدور."
          tokens: [{surface: اقار, lexemes: [{lexeme: aq.flow, surface: اق, base: true}, {lexeme: aor, surface: ار}], readings: {schluessel: aqar}}, {surface: سُوی, lexemes: [{lexeme: su, surface: سُو, base: true}, {lexeme: poss3, surface: ی}], readings: {schluessel: süyi}}, {surface: "فراوان\u200cدور", lexemes: [{lexeme: farawan, surface: "فراوان\u200c", base: true}, {lexeme: dur, surface: دور}], readings: {schluessel: farāwāndur}}]
      translations:
        en: Its running water is plentiful.
  - line:
      ask: complete
      gap: lexeme:mawzun
      distractors:
      - lexeme:shirin
      - lexeme:semiz
      forms:
        chg-Arab/standard:
          text: "قورغانی\u200cنینک شرق جنوبی جانبی\u200cدا بر موزون تاغ توشوبتور."
          tokens: [{surface: "قورغانی\u200cنینک", lexemes: [{lexeme: qurghan, surface: قورغان, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: gen, surface: نینک}], readings: {schluessel: qurǧaniniŋ}}, {surface: شرق, lexeme: sharq, readings: {schluessel: šarq}}, {surface: جنوبی, lexemes: [{lexeme: janub, surface: جنوب, base: true}, {lexeme: nisba, surface: ی}], readings: {schluessel: janūbī}}, {surface: "جانبی\u200cدا", lexemes: [{lexeme: janib, surface: جانب, base: true}, {lexeme: poss3, surface: "ی\u200c"}, {lexeme: loc, surface: دا}], readings: {schluessel: jānibida}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: موزون, lexeme: mawzun, readings: {schluessel: mawzūn}}, {surface: تاغ, lexeme: tagh, readings: {schluessel: taǧ}}, {surface: توشوبتور, lexemes: [{lexeme: tush, surface: توش, base: true}, {lexeme: narr, surface: وبتور}], readings: {schluessel: tüšüptur}}]
      translations:
        en: To the southeast of its fortress lies a well-shaped mountain.
  - line:
      forms:
        chg-Arab/standard:
          text: "بو تاغ\u200cنینک قله\u200cسی\u200cدا سلطان محمود خان بر حجره سالیب\u200cتور."
          tokens: [{surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: "تاغ\u200cنینک", lexemes: [{lexeme: tagh, surface: "تاغ\u200c", base: true}, {lexeme: gen, surface: نینک}], readings: {schluessel: taǧniŋ}}, {surface: "قله\u200cسی\u200cدا", lexemes: [{lexeme: qulla, surface: "قله\u200c", base: true}, {lexeme: poss3, surface: "سی\u200c"}, {lexeme: loc, surface: دا}], readings: {schluessel: qullasida}}, {surface: سلطان, lexeme: sultan, readings: {schluessel: Sulṭān}}, {surface: محمود, lexeme: mahmud, readings: {schluessel: Maḥmūd}}, {surface: خان, lexeme: khan, readings: {schluessel: Ḫan}}, {surface: بر, lexeme: bir, readings: {schluessel: bir}}, {surface: حجره, lexeme: hujra, readings: {schluessel: ḥujra}}, {surface: "سالیب\u200cتور", lexemes: [{lexeme: sal, surface: "سالیب\u200c", base: true}, {lexeme: narr, surface: تور}], readings: {schluessel: saliptur}}]
      translations:
        en: On the peak of this mountain Sultan Mahmud Khan built a pavilion.
  - choose:
      prompt:
        en: Who built the pavilion on the peak?
      options:
      - en: Sultan Mahmud Khan
      - en: Babur himself
      - en: The people of Osh
      answer: 0
  - line:
      forms:
        chg-Arab/standard:
          text: "اکرچه اول حجره موندین مرتفع\u200cدور، ولی بو حجره بسیار یخشیراق واقع بولوبتور."
          tokens: [{surface: اکرچه, lexeme: agarcha, readings: {schluessel: ägärčä}}, {surface: اول, lexeme: ul, readings: {schluessel: ul}}, {surface: حجره, lexeme: hujra, readings: {schluessel: ḥujra}}, {surface: موندین, lexemes: [{lexeme: bu, surface: مون, base: true}, {lexeme: abl, surface: دین}], readings: {schluessel: mundin}}, {surface: "مرتفع\u200cدور", lexemes: [{lexeme: murtafi, surface: "مرتفع\u200c", base: true}, {lexeme: dur, surface: دور}], readings: {schluessel: murtafiʿdur}}, {surface: ولی, lexeme: wali, readings: {schluessel: walī}}, {surface: بو, lexeme: bu, readings: {schluessel: bu}}, {surface: حجره, lexeme: hujra, readings: {schluessel: ḥujra}}, {surface: بسیار, lexeme: besyar, readings: {schluessel: besyār}}, {surface: یخشیراق, lexemes: [{lexeme: yakhshi, surface: یخشی, base: true}, {lexeme: cmp, surface: راق}], readings: {schluessel: yaḫširaq}}, {surface: واقع, lexeme: waqi, readings: {schluessel: wāqiʿ}}, {surface: بولوبتور, lexemes: [{lexeme: bol, surface: بول, base: true}, {lexeme: narr, surface: وبتور}], readings: {schluessel: boluptur}}]
      translations:
        en: Although that pavilion is higher than this one, this pavilion is placed much better.
  - line:
      ask: arrange
      forms:
        chg-Arab/standard:
          text: تمام شهر و محلات ایاق آستیدا.
          tokens: [{surface: تمام, lexeme: tamam, readings: {schluessel: tamām}}, {surface: شهر, lexeme: shahar, readings: {schluessel: šahar}}, {surface: و, lexeme: wa, readings: {schluessel: wä}}, {surface: محلات, lexeme: mahallat, readings: {schluessel: maḥallāt}}, {surface: ایاق, lexeme: ayaq, readings: {schluessel: ayaq}}, {surface: آستیدا, lexemes: [{lexeme: ast, surface: آست, base: true}, {lexeme: poss3, surface: ی}, {lexeme: loc, surface: دا}], readings: {schluessel: astida}}]
      translations:
        en: The whole city and its quarters lie at its feet.
  - choose:
      prompt:
        en: Why does Babur like his own pavilion better?
      options:
      - en: It is placed better, with the whole town at its feet.
      - en: It is higher than the khan's.
      - en: It is bigger.
      answer: 0
scenarios:
- id: chg.the-road-to-osh
  after: chg.u11.although
  title:
    en: The road to Osh
  setting:
    en: A caravan road out of Andijan in spring, about 1500. You are travelling to Osh.
  character:
    en: A carter who drives this road every week and speaks only Turki.
  goal:
    en: Ask how far Osh is and which way it lies, what there is to see there (the mountain, the pavilions, the running water), and say which you would rather visit, and why.
