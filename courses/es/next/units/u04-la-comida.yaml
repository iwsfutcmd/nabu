scenarios:
- id: es.ventanita
  after: es.u04.tengo-hambre
  title:
    en: At la ventanita
  setting:
    en: The walk-up coffee window (la ventanita) of a Cuban café on Calle Ocho in Little Havana, Miami, at eight in the morning. People on their way to work wait for their coffee; behind the glass there are pastelitos, croquetas and Cuban bread.
  character:
    en: 'Mayra, who has worked the ventanita for twenty years: quick, warm and teasing. She calls everyone mi vida or mi amor, speaks fast Miami Cuban Spanish, and switches to English only if you are really lost.'
  goal:
    en: Greet Mayra, order a cafecito for yourself and a colada for the office, ask for something to eat, say what you like, and thank her.
