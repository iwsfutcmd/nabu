scenarios:
- id: es.consultorio
  after: es.u19.por-telefono
  title:
    en: Calling the doctor's office
  setting:
    en: A Monday morning in Hialeah. Abuelo Pepe needs a check-up for his blood pressure (la presión), and he has asked you to phone the consultorio of his doctor, Dr. Hernández, because he cannot hear well on the phone.
  character:
    en: 'Mercedes, the receptionist at the consultorio: a polite, busy Cuban-American woman in her fifties who answers with Consultorio, buenos días, speaks formally (usted) and expects the same. She asks for the patient''s name, date of birth and insurance (el seguro), and offers only a few times.'
  goal:
    en: Using usted throughout, say who you are and that you are calling for your grandfather, ask politely for an appointment (quisiera…, ¿sería posible…?, ¿me podría…?), agree on a day and time, spell Abuelo's name if she asks, and thank her.
