        es-Latn/standard:
          text: ¡Oigan todos! Mi nieto quiere decir unas palabras.
          tokens: [{surface: Oigan, lexeme: oír, feats: {Mood: Imp, Number: Plur, Person: '3', VerbForm: Fin}}, {surface: todos, lexeme: todo, feats: {Gender: Masc, Number: Plur}}, {surface: Mi, lexeme: mi, feats: {Gender: Masc, Number: Sing}, n: 3, head: 4, rel: det}, {surface: nieto, lexeme: nieto, feats: {Number: Sing}, n: 4}, {surface: quiere, lexeme: querer, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: decir, lexeme: decir, feats: {VerbForm: Inf}}, {surface: unas, lexeme: un, feats: {Gender: Fem, Number: Plur}, n: 7, head: 8, rel: det}, {surface: palabras, lexeme: palabra, feats: {Number: Plur}, n: 8}]
