        en: It's the night of Grandma's birthday, and the whole family is in the yard.
  - line:
      speaker: lili
      forms:
        es-Latn/standard:
          text: Daniel, ¿tú vas a hacer el brindis en español o en espanglish?
          tokens: [{surface: Daniel, lexeme: daniel}, {surface: tú, lexeme: tú}, {surface: vas, lexeme: ir, feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}}, {surface: a, lexeme: a}, {surface: hacer, lexeme: hacer, feats: {VerbForm: Inf}}, {surface: el, lexeme: el, feats: {Gender: Masc, Number: Sing}, n: 6, head: 7, rel: det}, {surface: brindis, lexeme: brindis, feats: {Number: Sing}, n: 7}, {surface: en, lexeme: en}, {surface: español, lexeme: español, feats: {Number: Sing}}, {surface: o, lexeme: o}, {surface: en, lexeme: en}, {surface: espanglish, lexeme: espanglish, feats: {Number: Sing}}]
