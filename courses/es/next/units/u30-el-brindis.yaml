        en: Daniel, are you going to make the toast in Spanish or in Spanglish?
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: En español. Aunque me da miedo, lo voy a hacer.
          tokens: [{surface: En, lexeme: en}, {surface: español, lexeme: español, feats: {Number: Sing}}, {surface: Aunque, lexeme: aunque}, {surface: me, lexeme: me}, {surface: da, lexeme: dar, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: miedo, lexeme: miedo, feats: {Number: Sing}}, {surface: lo, lexeme: lo}, {surface: voy, lexeme: ir, feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}}, {surface: a, lexeme: a}, {surface: hacer, lexeme: hacer, feats: {VerbForm: Inf}}]
