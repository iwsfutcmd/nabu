scenarios:
- id: es.porch
  after: es.u01.mi-abuela
  title:
    en: On Abuela's porch
  setting:
    en: The front porch (el portal) of a small house in Hialeah, Miami, on a hot afternoon. Abuela Cachita is in her rocking chair with two friends from the neighbourhood.
  character:
    en: Abuela Cachita's friend Mirta, a warm and nosy Cuban grandmother in her seventies, delighted to meet the young people in the family.
  goal:
    en: Greet Mirta politely (with usted), say your name and where you are from, ask how she is, and say goodbye.
