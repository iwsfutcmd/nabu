# Unit 20 (es): Nochebuena and the holidays, with the future (será, habrá, vendrán, comeremos): el lechón asado in the
# caja china, la yuca and los frijoles negros, los turrones and el vino; las doce uvas at midnight on New Year's Eve,
# the water thrown out of the house and the suitcase walked round the block; el Día de Reyes; los quince (la
# quinceañera, el vals).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u20
title: {en: 'Nochebuena: Christmas Eve'}
cefr: B1
kcs:
- {id: 'sense:nochebuena', gloss: {en: 'Christmas Eve'}, forms: {es-Latn/standard: [Nochebuena]}, notes: {en: 'The big night for Cubans: the whole family at the table, lechón, and in Cuba la misa del gallo (midnight mass). One word, with a capital: la Nochebuena. ¡Feliz Nochebuena!'}}
- {id: 'sense:diciembre', gloss: {en: 'December'}, forms: {es-Latn/standard: [diciembre]}, notes: {en: 'Months take no capital in Spanish: el veinticuatro de diciembre. Written with c: diciembre.'}}
- {id: 'form:fut', gloss: {en: 'future: will (hablará, será)'}, notes: {en: 'Endings on the whole infinitive: hablaré, hablarás, hablará, hablaremos, hablarán. All but -emos carry an accent, and hablara without it is another tense. Some stems shorten: tendré, vendré, haré, podré; hay becomes habrá. In everyday Cuban speech voy a + infinitive is more common, and the future also guesses: ¿Qué hora será? I wonder what time it is.'}}
- {id: 'sense:entero', gloss: {en: 'whole; entire'}, forms: {es-Latn/standard: [entero]}, notes: {en: 'La familia entera says the same as toda la familia. It agrees: el día entero, la noche entera.'}}
- {id: 'sense:fiesta', gloss: {en: 'party; celebration'}, forms: {es-Latn/standard: [fiesta]}, notes: {en: 'Dar una fiesta: to throw a party. A big one is un fiestón. Las fiestas: the holidays.'}}
- {id: 'sense:navidad', gloss: {en: 'Christmas'}, forms: {es-Latn/standard: [Navidad]}, notes: {en: 'With a capital. ¡Feliz Navidad! In Cuba Christmas stopped being a public holiday in 1969 and came back in 1997, before the Pope''s visit; families kept Nochebuena at home all the same.'}}
- {id: 'sense:asar', gloss: {en: 'to roast; to grill'}, forms: {es-Latn/standard: [asar]}, notes: {en: 'Asar un lechón. With s: asar, asado. Azar, with z, is chance; Cubans say both the same way, so spelling is the only difference.'}}
- {id: 'sense:lechón', gloss: {en: 'roast pig; suckling pig'}, forms: {es-Latn/standard: [lechón]}, notes: {en: 'The heart of a Cuban Nochebuena: a whole pig marinated in mojo (sour orange and garlic) and roasted for hours. Lechón has an accent; the plural lechones does not.'}}
- {id: 'sense:asado', gloss: {en: 'roast; roasted'}, forms: {es-Latn/standard: [asado]}, notes: {en: 'Lechón asado, pollo asado. Un asado is also a barbecue, above all in Argentina.'}}
- {id: 'sense:caja-china', gloss: {en: 'caja china (a box for roasting a whole pig)'}, forms: {es-Latn/standard: [caja china]}, notes: {en: 'A wooden box lined with metal, with the coals on the lid. Miami made it popular; in Cuba the pig is roasted on a spit (en púa) or in a pit dug in the yard.'}}
- {id: 'sense:preparar', gloss: {en: 'to prepare; to make (food)'}, forms: {es-Latn/standard: [preparar]}, notes: {en: 'Preparar la comida, preparar una fiesta. For food Cubans also say hacer: hacer el congrí.'}}
- {id: 'sense:invitar', gloss: {en: 'to invite'}, forms: {es-Latn/standard: [invitar]}, notes: {en: 'Invitar a alguien, with a. Te invito also means I''m paying: te invito a un café.'}}
- {id: 'sense:turrón', gloss: {en: 'turrón (nougat)'}, forms: {es-Latn/standard: [turrón]}, notes: {en: 'Almond nougat from Spain, hard (de Alicante) or soft (de Jijona): every Cuban Christmas table has it. Turrón has an accent; turrones does not.'}}
- {id: 'sense:vino', gloss: {en: 'wine'}, forms: {es-Latn/standard: [vino]}, notes: {en: 'Red wine is vino tinto, not vino rojo. Vino is also he came (venir): Yasiel vino ayer.'}}
- {id: 'sense:celebrar', gloss: {en: 'to celebrate'}, forms: {es-Latn/standard: [celebrar]}, notes: {en: 'Celebrar la Nochebuena, celebrar un cumpleaños. Festejar says the same.'}}
- {id: 'sense:doce', gloss: {en: 'twelve'}, forms: {es-Latn/standard: [doce]}, notes: {en: 'A las doce: at twelve o''clock. Written with c: doce, trece.'}}
- {id: 'sense:uva', gloss: {en: 'grape'}, forms: {es-Latn/standard: [uva]}, notes: {en: 'Las doce uvas, a custom from Spain: one grape with each stroke of midnight on New Year''s Eve, and a wish for each month of the year.'}}
- {id: 'sense:medianoche', gloss: {en: 'midnight'}, forms: {es-Latn/standard: [medianoche]}, notes: {en: 'One word: a medianoche, a la medianoche. In Miami una medianoche is also a sandwich, a Cuban sandwich on sweet egg bread.'}}
- {id: 'sense:tirar', gloss: {en: 'to throw; to throw out'}, forms: {es-Latn/standard: [tirar]}, notes: {en: 'At midnight on New Year''s Eve many Cubans throw a bucket of water out of the house: out goes the bad of the old year. Others walk round the block with a suitcase, for a year of travel.'}}
- {id: 'sense:enero', gloss: {en: 'January'}, forms: {es-Latn/standard: [enero]}, notes: {en: 'No capital: el seis de enero.'}}
- {id: 'sense:rey', gloss: {en: 'king; los Reyes (Magos): the Three Kings'}, forms: {es-Latn/standard: [rey]}, notes: {en: 'On the night of January 5 children leave grass and water for the camels, and los Reyes Magos leave presents. Before 1959 this, not Christmas, was the day of presents in Cuba; Little Havana holds a Three Kings parade every year.'}}
- {id: 'sense:regalo', gloss: {en: 'present; gift'}, forms: {es-Latn/standard: [regalo]}, notes: {en: 'Regalar: to give as a present. A present is un regalo, never un presente, which is the present time.'}}
- {id: 'sense:quinceañera', gloss: {en: 'quinceañera (a girl turning fifteen)'}, forms: {es-Latn/standard: [quinceañera]}, notes: {en: 'Quince + año, with ñ. In Cuba la quinceañera is the girl, and the party is los quince or la fiesta de quince: a big dance, photos and a gown.'}}
- {id: 'sense:vals', gloss: {en: 'waltz'}, forms: {es-Latn/standard: [vals]}, notes: {en: 'At los quince the girl dances el vals with her father first, then the couples of her court join in.'}}
