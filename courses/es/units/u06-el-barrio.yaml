# Unit 6 (es): the neighbourhood and getting around. ir a (voy, vas, va, vamos), ¿dónde está?, aquí, cerca and
# lejos, a la derecha and a la izquierda, hay; regular -ar verbs (trabajar, caminar) and vivir; la guagua, la
# bodega, la Calle Ocho, la ventanita.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u06
title: {en: 'El barrio: the neighbourhood'}
cefr: A1
kcs:
- {id: 'sense:ir', gloss: {en: to go}, forms: {es-Latn/standard: [ir]}, notes: {en: 'Irregular: voy, vas, va, vamos, van. ¡Voy! also answers a call: Coming!'}}
- {id: 'sense:bodega', gloss: {en: corner store; bodega}, forms: {es-Latn/standard: [bodega]}, notes: {en: 'The little grocery on the corner. In Cuba la bodega is also the state store where families get their rations with la libreta. In Spain a bodega is a wine cellar.'}}
- {id: 'sense:tienda', gloss: {en: store; shop}, forms: {es-Latn/standard: [tienda]}, notes: {en: 'Any store or shop: una tienda de ropa, a clothes shop. In Spanglish you may also hear el store.'}}
- {id: 'sense:guagua', gloss: {en: bus}, forms: {es-Latn/standard: [guagua]}, notes: {en: 'The bus in Cuba, Puerto Rico, the Dominican Republic and the Canaries; elsewhere el autobús (el camión in Mexico, el colectivo in Argentina). In Chile and the Andes a guagua is a baby!'}}
- {id: 'sense:cerca', gloss: {en: near; close; nearby}, forms: {es-Latn/standard: [cerca]}, notes: {en: 'Cerca de: near (to). Cerca de aquí: near here.'}}
- {id: 'sense:lejos', gloss: {en: far; far away}, forms: {es-Latn/standard: [lejos]}, notes: {en: 'Lejos de: far from.'}}
- {id: 'sense:calle', gloss: {en: street}, forms: {es-Latn/standard: [calle]}, notes: {en: 'Where English lives on a street, Spanish uses en: vive en mi calle, she lives on my street.'}}
- {id: 'sense:barrio', gloss: {en: neighbourhood; neighborhood}, forms: {es-Latn/standard: [barrio]}, notes: {en: 'In Cuba el barrio is where you grew up and everybody knows your family. In US English a barrio is a Spanish-speaking neighbourhood.'}}
- {id: 'sense:coger', gloss: {en: to take; to catch (a bus); to get}, forms: {es-Latn/standard: [coger]}, notes: {en: 'Cubans (and Spaniards) say coger la guagua. In Mexico and much of Latin America coger is vulgar: say tomar el autobús there. Cojo is spelled with j: coges, coge, but cojo.'}}
- {id: 'sense:parada', gloss: {en: stop (bus stop)}, forms: {es-Latn/standard: [parada]}, notes: {en: 'La parada de la guagua: the bus stop.'}}
- {id: 'sense:esquina', gloss: {en: corner (of a street)}, forms: {es-Latn/standard: [esquina]}, notes: {en: 'En la esquina: on the corner, where the bodega always is. The inside corner of a room is el rincón.'}}
- {id: 'sense:caminar', gloss: {en: to walk}, forms: {es-Latn/standard: [caminar]}, notes: {en: 'A regular -ar verb: camino, caminas, camina, caminamos, caminan.'}}
- {id: 'sense:derecha', gloss: {en: right (side)}, forms: {es-Latn/standard: [derecha]}, notes: {en: 'A la derecha: on the right, to the right. Derecho means straight ahead: sigue derecho.'}}
- {id: 'sense:izquierda', gloss: {en: left (side)}, forms: {es-Latn/standard: [izquierda]}, notes: {en: 'A la izquierda: on the left, to the left.'}}
- {id: 'sense:calle-ocho', gloss: {en: 'Calle Ocho (SW 8th Street, Little Havana)'}, forms: {es-Latn/standard: [Calle Ocho]}, notes: {en: 'Southwest 8th Street, the heart of La Pequeña Habana (Little Havana) in Miami: its cafés, Domino Park (Parque Máximo Gómez) and the Calle Ocho festival.'}}
- {id: 'sense:ventanita', gloss: {en: walk-up coffee window (Miami)}, forms: {es-Latn/standard: [ventanita]}, notes: {en: 'Little window: the counter on the street side of a Cuban café in Miami, where people stand for a cafecito, a colada or a pastelito, and talk politics.'}}
- {id: 'sense:trabajar', gloss: {en: to work}, forms: {es-Latn/standard: [trabajar]}, notes: {en: 'A regular -ar verb: trabajo, trabajas, trabaja, trabajamos, trabajan.'}}
nodes:
