# Unit 16 (es): Cuban music: verbs that work like gustar (encantar, fascinar, molestar, interesar) with me, te, le, nos,
# les; comparatives and superlatives (más… que, menos… que, tan… como, mejor, peor, el mejor, la más grande); son,
# salsa, bolero and danzón; la clave, las maracas, el bongó (tocar, not jugar); Celia Cruz (¡Azúcar!), Benny Moré,
# the Buena Vista Social Club and Compay Segundo; Abuelo's records.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u16
title: {en: 'La música: Music'}
cefr: B1
kcs:
- {id: 'sense:encantar', gloss: {en: 'to love (a thing); me encanta: I love it'}, forms: {es-Latn/standard: [encantar]}, notes: {en: 'Works like gustar: what you love is the subject, so the verb agrees with it (me encanta la salsa, me encantan los boleros). Stronger than me gusta. Said to a person, me encantas means I''m crazy about you; for family, te quiero.'}}
- {id: 'sense:salsa', gloss: {en: 'salsa (music and dance); sauce'}, forms: {es-Latn/standard: [salsa]}, notes: {en: 'Built on the Cuban son by Cuban and Puerto Rican musicians in New York in the 1960s and 70s. Also any sauce.'}}
- {id: 'sense:son', gloss: {en: 'son (Cuban music)'}, forms: {es-Latn/standard: [son]}, notes: {en: 'Born in eastern Cuba (el Oriente), the root of salsa: guitar and tres, bongó, maracas, clave and voices. Plural sones. Son is also ser: ellos son, they are.'}}
- {id: 'sense:cantar', gloss: {en: 'to sing'}, forms: {es-Latn/standard: [cantar]}, notes: {en: 'Un cantante, una cantante: a singer. Canto, cantas, canta; in the past canté, cantó.'}}
- {id: 'sense:canción', gloss: {en: 'song'}, forms: {es-Latn/standard: [canción]}, notes: {en: 'With c twice and an accent on the last syllable: can-ción. The plural drops the accent: canciones.'}}
- {id: 'sense:bolero', gloss: {en: 'bolero (a slow love song)'}, forms: {es-Latn/standard: [bolero]}, notes: {en: 'With b. The Cuban bolero was born in Santiago de Cuba in the 1880s; the Spanish bolero is another thing, a dance. The music grandparents danced to, cheek to cheek.'}}
- {id: 'sense:benny-moré', gloss: {en: 'Benny Moré (a singer)'}, forms: {es-Latn/standard: [Benny Moré]}, notes: {en: 'Bartolomé Maximiliano Moré (1919–1963), el Bárbaro del Ritmo, from Santa Isabel de las Lajas, in Cienfuegos province: son, mambo and boleros with his Banda Gigante. Moré with an accent.'}}
- {id: 'sense:disco', gloss: {en: 'record; album; disc'}, forms: {es-Latn/standard: [disco]}, notes: {en: 'Abuelo''s discos are LPs. To put on a record: poner un disco.'}}
- {id: 'sense:fascinar', gloss: {en: 'to fascinate; me fascina: I love it'}, forms: {es-Latn/standard: [fascinar]}, notes: {en: 'Like gustar: me fascina el danzón, me fascinan los discos. Stronger still than encantar. With sc: fas-ci-nar.'}}
- {id: 'sense:danzón', gloss: {en: 'danzón (a Cuban ballroom dance)'}, forms: {es-Latn/standard: [danzón]}, notes: {en: 'Slow and elegant, born in Matanzas: Miguel Failde played the first one, Las alturas de Simpson, in 1879. Called the national dance of Cuba. With z and an accent: dan-zón.'}}
- {id: 'sense:molestar', gloss: {en: 'to bother; to annoy'}, forms: {es-Latn/standard: [molestar]}, notes: {en: 'Like gustar: me molesta la música, the music bothers me. A false friend: it never means to molest. ¿Le molesta…? is a polite do you mind…?'}}
- {id: 'sense:interesar', gloss: {en: 'to interest; me interesa: I''m interested in it'}, forms: {es-Latn/standard: [interesar]}, notes: {en: 'Like gustar: me interesa la música, me interesan los discos. Estoy interesado en… is correct too, but me interesa is what people say.'}}
- {id: 'sense:celia-cruz', gloss: {en: 'Celia Cruz (a singer)'}, forms: {es-Latn/standard: [Celia Cruz]}, notes: {en: 'The Queen of Salsa (1925–2003), born in Havana. She left Cuba in 1960 and never went back; when she died, Miami said goodbye to her at the Freedom Tower.'}}
- {id: 'sense:azúcar', gloss: {en: 'sugar; blood sugar (tener azúcar: to have diabetes); ¡Azúcar!: Celia Cruz''s cry'}, forms: {es-Latn/standard: [azúcar]}, notes: {en: 'Celia told how it began: a waiter in Miami asked her if she took sugar in her coffee, and of course a Cuban does. Stressed on zú and ending in r, so written with an accent: a-zú-car. El azúcar and la azúcar are both correct.'}}
- {id: 'sense:tocar', gloss: {en: 'to play (an instrument); to touch'}, forms: {es-Latn/standard: [tocar]}, notes: {en: 'You play an instrument with tocar: tocar el bongó, tocar la guitarra. Jugar is for games and sports (jugar dominó, jugar pelota); jugar el piano is English in Spanish words. Toqué, with qu: I played.'}}
- {id: 'sense:bongó', gloss: {en: 'bongos; bongo drums'}, forms: {es-Latn/standard: [bongó]}, notes: {en: 'In Cuba el bongó: one instrument, two small drums held between the knees; elsewhere los bongós. It was born with the son in eastern Cuba. Its player is el bongosero.'}}
- {id: 'sense:maraca', gloss: {en: 'maraca'}, forms: {es-Latn/standard: [maraca]}, notes: {en: 'Usually plural, las maracas, played in pairs: rattles made from dried gourds with seeds inside.'}}
- {id: 'sense:clave', gloss: {en: 'claves (two wooden sticks); the clave rhythm; key; password'}, forms: {es-Latn/standard: [clave]}, notes: {en: 'Two hardwood sticks, and the five-stroke pattern they play (three and two) that holds son and salsa together. Also a key or a password: la clave del wifi.'}}
- {id: 'sense:que.than', gloss: {en: 'than (más… que)'}, forms: {es-Latn/standard: [que]}, notes: {en: 'The que of comparisons: más viejo que tú, mejor que yo (yo and tú, not mí and ti). Before a number, de: más de cien discos.'}}
- {id: 'sense:menos', gloss: {en: 'less; fewer; least'}, forms: {es-Latn/standard: [menos]}, notes: {en: 'Menos… que: less… than. Echar de menos, in Spain: to miss.'}}
- {id: 'sense:tan', gloss: {en: 'as; so'}, forms: {es-Latn/standard: [tan]}, notes: {en: 'Tan… como: as… as (tan bien como Lili). With a noun, tanto… como: tanta música como tú. ¡Tan lindo!: so sweet!'}}
- {id: 'sense:mejor', gloss: {en: 'better; best'}, forms: {es-Latn/standard: [mejor]}, notes: {en: 'Mejor already means more good: say mejor, never más mejor. El mejor, la mejor: the best. Also an adverb: Lili baila mejor, Lili dances better.'}}
- {id: 'sense:peor', gloss: {en: 'worse; worst'}, forms: {es-Latn/standard: [peor]}, notes: {en: 'Never más peor. El peor, la peor: the worst. Of age, mayor and menor: older, younger.'}}
- {id: 'sense:buena-vista', gloss: {en: 'Buena Vista Social Club (a band and album)'}, forms: {es-Latn/standard: [Buena Vista Social Club]}, notes: {en: 'Named after a 1940s members'' club in Marianao, Havana. In 1996 old masters of son and bolero recorded an album under the name; with Wim Wenders''s film (1999) it took Cuban music around the world.'}}
- {id: 'sense:compay-segundo', gloss: {en: 'Compay Segundo (a musician)'}, forms: {es-Latn/standard: [Compay Segundo]}, notes: {en: 'Francisco Repilado (1907–2003), from Santiago de Cuba, who wrote Chan Chan. Compay is compadre in the speech of eastern Cuba; Segundo because he sang the second voice.'}}
