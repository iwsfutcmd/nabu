# Unit 17 (es): the present perfect (he jugado, ¿has visto?, nunca he ido, todavía no, ya) with haber and the past
# participle, regular and irregular (visto, hecho, dicho, vuelto); pelota (the pelotero, the jonrón, batear, ponchar,
# los Industriales and los Marlins) and dominó on Calle Ocho (la ficha, el doble nueve, la data, paso, el tranque,
# ¡capicúa!, la pareja).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u17
title: {en: 'Pelota y dominó: Baseball and dominoes'}
cefr: B1
kcs:
- {id: 'form:part', gloss: {en: 'past participle (hablado, comido, hecho; he hablado)'}, notes: {en: '-ado for -ar verbs, -ido for -er and -ir verbs: jugado, comido, vivido. Cubans often drop the d (jugao, comío, ponchao); it is always written. Irregular: visto, hecho, dicho, vuelto, puesto, escrito. Hecho (done) has an h; echo (I throw) has none. After haber it never changes: Lili ha jugado, ellas han jugado.'}}
- {id: 'sense:perder', gloss: {en: 'to lose; to miss (a bus, a flight)'}, forms: {es-Latn/standard: [perder]}, notes: {en: 'Pierdo, pierdes, pierde, pierden (e becomes ie), but perdemos. Perder con or perder contra: to lose to. Perderse: to get lost.'}}
- {id: 'sense:todavía', gloss: {en: 'still; todavía no: not yet'}, forms: {es-Latn/standard: [todavía]}, notes: {en: 'Written with an accent on the í. Todavía no he comido: I haven''t eaten yet. Aún means the same.'}}
- {id: 'sense:nunca', gloss: {en: never}, forms: {es-Latn/standard: [nunca]}, notes: {en: 'Before the verb (nunca he ido) or after it with no (no he ido nunca). Spanish keeps the double negative: no he visto nunca nada.'}}
- {id: 'sense:volver', gloss: {en: 'to come back; to go back; to return'}, forms: {es-Latn/standard: [volver]}, notes: {en: 'Vuelvo, vuelves, vuelve (o becomes ue); the participle is vuelto. Regresar means the same. Volver a + infinitive: to do again (volver a jugar, to play again).'}}
- {id: 'sense:juego', gloss: {en: 'game; match'}, forms: {es-Latn/standard: [juego]}, notes: {en: 'Un juego de pelota: a baseball game; Cubans keep partido for football (soccer). Juego is also I play (jugar).'}}
- {id: 'sense:estadio', gloss: {en: 'stadium; ballpark'}, forms: {es-Latn/standard: [estadio]}, notes: {en: 'Havana''s is el Latinoamericano (el Latino), home of Industriales. The Marlins play in Little Havana, where the old Orange Bowl stood.'}}
- {id: 'sense:industriales', gloss: {en: 'Industriales (Havana''s baseball team)'}, forms: {es-Latn/standard: [Industriales]}, notes: {en: 'Los Industriales, also los Azules (the Blues): the most famous team of Cuba''s Serie Nacional, and the one every other province loves to beat. Ser de los Industriales: to root for them.'}}
- {id: 'sense:marlins', gloss: {en: 'the Marlins (Miami''s baseball team)'}, forms: {es-Latn/standard: [Marlins]}, notes: {en: 'Los Marlins, said as in English. Many Cuban families in Miami root for the Marlins and for a team back in Cuba.'}}
- {id: 'sense:pelotero', gloss: {en: 'baseball player'}, forms: {es-Latn/standard: [pelotero]}, notes: {en: 'From la pelota; beisbolista elsewhere. Cuban peloteros in the Major Leagues include Tony Pérez and José Abreu, who, like Papi, comes from Cienfuegos.'}}
- {id: 'sense:batear', gloss: {en: 'to bat; to hit (in baseball)'}, forms: {es-Latn/standard: [batear]}, notes: {en: 'From English bat. El bate is the bat and el bateador the batter. Bateó: he hit; ha bateado: he has hit.'}}
- {id: 'sense:jonrón', gloss: {en: 'home run'}, forms: {es-Latn/standard: [jonrón]}, notes: {en: 'English home run, spelled the Spanish way, with an accent; the plural jonrones has none. Batear un jonrón: to hit a home run. Commentators also say cuadrangular.'}}
- {id: 'sense:ponchar', gloss: {en: 'to strike out (a batter)'}, forms: {es-Latn/standard: [ponchar]}, notes: {en: 'Ponchar a alguien: to strike someone out; poncharse: to strike out. In Cuba and Mexico a flat tyre is also ponchada: se ponchó la goma.'}}
- {id: 'sense:parque', gloss: {en: park}, forms: {es-Latn/standard: [parque]}, notes: {en: 'Domino Park on Calle Ocho is Parque Máximo Gómez, named for the general of Cuba''s wars of independence.'}}
- {id: 'sense:pareja', gloss: {en: 'partner; pair; couple'}, forms: {es-Latn/standard: [pareja]}, notes: {en: 'Always feminine, for a man too: Yasiel es mi pareja. In dominó the four players are two parejas, partners facing each other across the table.'}}
- {id: 'sense:doble', gloss: {en: 'double; el doble nueve: the double-nine (set, or its 9-9 tile)'}, forms: {es-Latn/standard: [doble]}, notes: {en: 'Cubans play doble nueve: 55 tiles, ten to each player. Doble seis (28 tiles) is usual elsewhere. Un doble is a tile with the same number on both halves.'}}
- {id: 'sense:data', gloss: {en: 'hand (your ten tiles, in Cuban dominó)'}, forms: {es-Latn/standard: [data]}, notes: {en: 'Cuban dominó talk: ¡qué data más mala! What a bad hand! At the table you never say what your data is: your pareja has to read it from what you play.'}}
- {id: 'sense:ficha', gloss: {en: 'tile (domino); piece; token'}, forms: {es-Latn/standard: [ficha]}, notes: {en: 'Las fichas are shuffled face down on the table (Cubans call it dar agua). In Cuba a sly, cheeky person is also una ficha.'}}
- {id: 'sense:pasar', gloss: {en: 'to pass; to happen; to spend (time)'}, forms: {es-Latn/standard: [pasar]}, notes: {en: 'In dominó, ¡paso!: I pass, nothing fits. ¿Qué pasó? What happened? To have a good time is pasarla bien (not "tener un buen tiempo", which is English).'}}
- {id: 'sense:tranque', gloss: {en: 'blocked game (dominó: nobody can play)'}, forms: {es-Latn/standard: [tranque]}, notes: {en: 'From trancar, to bar a door: se trancó el juego. Then the points left in each hand are counted, and the lowest wins.'}}
- {id: 'sense:capicúa', gloss: {en: 'a winning last tile that fits at both ends (dominó)'}, forms: {es-Latn/standard: [capicúa]}, notes: {en: 'From Catalan cap i cua, head and tail. A number that reads the same backwards (1221) is capicúa too. With an accent on the ú.'}}
