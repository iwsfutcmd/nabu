scenarios:
- id: es.domino-park
  after: es.u17.capicua
  title: {en: 'At the dominó tables on Calle Ocho'}
  setting: {en: 'Domino Park (Parque Máximo Gómez) on Calle Ocho in Little Havana, Miami, on a Saturday morning. Old men slap tiles down on the shaded tables, argue about pelota and send someone to the ventanita for cafecitos. One table is a player short, and Abuelo Pepe has told his friends that his grandson plays.'}
  character: {en: 'Cheo, Abuelo Pepe''s friend from Santiago de Cuba, a retired bus driver (guagüero) in his seventies. He plays doble nueve seriously, teases newcomers, talks fast about the Industriales and the Marlins, and is pleased when a young man speaks to him with usted.'}
  goal: {en: 'Greet Cheo politely, say whose grandson you are, ask to join the game as his partner, say whether you have ever played doble nueve, follow the game (paso, tranque, capicúa) and talk about pelota, and say goodbye.'}
