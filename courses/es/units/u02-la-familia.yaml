# Unit 2 (es): the family. Mami and Papi, Lili, Abuelo Pepe, Tía Marisol and Yunior in Havana; tener in the
# present; el and un; mi, tu, su; este; gender and number (hermano, hermana, hermanos); nosotros, ellos and
# ustedes with the plural forms of the present; mi'ja, and el puro and la pura for parents.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u02
title: {en: 'La familia: The family'}
cefr: A1
kcs:
- {id: 'sense:este', gloss: {en: this}, forms: {es-Latn/standard: [este]}, notes: {en: 'Este, esta, estos, estas: este es mi papi, esta es mi mami. Esta (this) has no accent; está, with one, means is (from estar).'}}
- {id: 'sense:mami', gloss: {en: mom; mommy (what Cubans call their mother at any age)}, forms: {es-Latn/standard: [mami]}, notes: {en: 'Grown Cuban men still say mami; mamá is more usual elsewhere, and madre is formal. Mami is also a pet name for a girl or a girlfriend.'}}
- {id: 'sense:papi', gloss: {en: 'dad; daddy (Cuban, at any age)'}, forms: {es-Latn/standard: [papi]}, notes: {en: 'Papá is more usual elsewhere; padre is formal. Papi is also a pet name for a little boy or a boyfriend.'}}
- {id: 'sense:familia', gloss: {en: family}, forms: {es-Latn/standard: [familia]}, notes: {en: 'La familia, mi familia. Relatives are familiares or parientes.'}}
- {id: 'sense:quién', gloss: {en: who}, forms: {es-Latn/standard: [quién]}, notes: {en: 'With the accent when it asks: ¿Quién es? Who is it? For more than one person: ¿quiénes?'}}
- {id: 'sense:tu', gloss: {en: your (tú)}, forms: {es-Latn/standard: [tu]}, notes: {en: 'Tus before a plural: tus primos. Without the accent it means your; with it, tú means you: ¿Tú tienes tu teléfono?'}}
- {id: 'sense:hermano', gloss: {en: 'brother (hermana: sister)'}, forms: {es-Latn/standard: [hermano]}, notes: {en: 'Hermanos is brothers, or brothers and sisters: siblings. Cubans also call a close friend mi hermano, or mi herma.'}}
- {id: 'sense:lili', gloss: {en: Lili (a name)}, forms: {es-Latn/standard: [Lili]}}
- {id: 'sense:tener', gloss: {en: 'to have; tener … años: to be … years old'}, forms: {es-Latn/standard: [tener]}, notes: {en: 'Irregular: tengo, tienes, tiene, tenemos, tienen. Tener also says how you feel: tengo calor, I''m hot.'}}
- {id: 'sense:un', gloss: {en: a; an; some}, forms: {es-Latn/standard: [un]}, notes: {en: 'Un, una, unos, unas: un hermano, una hermana; unos primos, some cousins.'}}
- {id: 'sense:abuelo', gloss: {en: grandfather; grandpa}, forms: {es-Latn/standard: [abuelo]}, notes: {en: 'Los abuelos: the grandparents, grandma and grandpa. Abuelito and abuelita are the loving forms.'}}
- {id: 'sense:pepe', gloss: {en: Pepe (a name)}, forms: {es-Latn/standard: [Pepe]}, notes: {en: 'The usual nickname for José, as Cachita is for Caridad.'}}
- {id: 'sense:el', gloss: {en: the}, forms: {es-Latn/standard: [el]}, notes: {en: 'El, la, los, las: el abuelo, la abuela, los abuelos, las primas. With an accent, él means he. La Habana keeps its article.'}}
- {id: 'sense:su', gloss: {en: 'his; her; its; their; your (usted, ustedes)'}, forms: {es-Latn/standard: [su]}, notes: {en: 'Sus before a plural. Su hijo can be his, her, their or your son: what comes before tells you whose.'}}
- {id: 'sense:tío', gloss: {en: 'uncle (tía: aunt)'}, forms: {es-Latn/standard: [tío]}, notes: {en: 'Los tíos: uncles, or aunts and uncles. Like abuela, tía goes before a name: tía Marisol.'}}
- {id: 'sense:marisol', gloss: {en: Marisol (a name)}, forms: {es-Latn/standard: [Marisol]}, notes: {en: 'Short for María de la Soledad; it also reads as mar y sol, sea and sun.'}}
- {id: 'sense:habana', gloss: {en: Havana (La Habana)}, forms: {es-Latn/standard: [Habana]}, notes: {en: 'Always with its article, written with a capital: La Habana, de La Habana. Someone from Havana is habanero, habanera.'}}
- {id: 'sense:primo', gloss: {en: cousin}, forms: {es-Latn/standard: [primo]}, notes: {en: 'Prima for a woman; los primos, cousins. A first cousin is a primo hermano.'}}
- {id: 'sense:yunior', gloss: {en: Yunior (a name)}, forms: {es-Latn/standard: [Yunior]}, notes: {en: 'English Junior spelled the Spanish way; many Cuban boys born from the 1970s on got it as a name.'}}
- {id: 'sense:hijo', gloss: {en: 'son (hija: daughter)'}, forms: {es-Latn/standard: [hijo]}, notes: {en: 'Los hijos: sons, or children. Said fast, mi hijo and mi hija become mi''jo and mi''ja.'}}
- {id: 'sense:nosotros', gloss: {en: we}, forms: {es-Latn/standard: [nosotros]}, notes: {en: 'Nosotras if the group is all women. Usually left out: somos, tenemos.'}}
- {id: 'form:pres-1p', gloss: {en: 'present tense: we (nosotros)'}, notes: {en: 'Somos, tenemos, vivimos: we are, we have, we live. Always ends in -mos.'}}
- {id: 'sense:grande', gloss: {en: big; large}, forms: {es-Latn/standard: [grande]}, notes: {en: 'Before a noun it becomes gran and means great: una gran familia is a great family, una familia grande a big one.'}}
- {id: 'sense:ellos', gloss: {en: they}, forms: {es-Latn/standard: [ellos]}, notes: {en: 'Ellas if they are all women.'}}
- {id: 'form:pres-3p', gloss: {en: 'present tense: they, you all (ellos, ustedes)'}, notes: {en: 'Son, tienen, están: they are, they have. Always ends in -n.'}}
- {id: 'sense:ustedes', gloss: {en: you (plural)}, forms: {es-Latn/standard: [ustedes]}, notes: {en: 'Cuba, like all of Latin America, has no vosotros: ustedes is you all, for family and strangers alike. Its verb is like ellos'': ustedes son.'}}
- {id: 'sense:padre', gloss: {en: 'father; padres: parents'}, forms: {es-Latn/standard: [padre]}, notes: {en: 'Mis padres: my parents. Parientes is a false friend: it means relatives. At home Cubans say papi and mami.'}}
- {id: 'sense:puro', gloss: {en: 'dad, the old man (Cuban slang; la pura: mom)'}, forms: {es-Latn/standard: [puro]}, notes: {en: 'Los puros: your folks, your parents. Young Cubans'' slang, said with affection. Un puro is also a cigar.'}}
- {id: 'sense:mijo', gloss: {en: 'honey; sweetie (mi hijo said fast; mi''ja to a girl)'}, forms: {es-Latn/standard: [mi'jo]}, notes: {en: 'What parents, grandparents and older neighbours call the young: mi''jo to a boy or a man, mi''ja to a girl or a woman. Also written mijo, mija.'}}
nodes:
