scenarios:
- id: es.agro
  after: es.u08.el-agro
  title: {en: At the agro in Havana}
  setting: {en: 'An agromercado in Centro Habana on a busy morning: wooden stalls of mangoes, avocados, plantains, malanga and peppers (ají), prices chalked on cardboard in Cuban pesos. You are visiting Tía Marisol, and she has sent you out with her jaba.'}
  character: {en: 'Osmany, a fast-talking stallholder in his fifties who calls everyone mi amor or asere, quotes prices in pesos per libra, and enjoys a little haggling.'}
  goal: {en: 'Greet the stallholder, ask what things cost (¿Cuánto cuesta…? ¿A cómo está…?), buy mangoes and tomatoes for Tía Marisol, say when something is too expensive, pay, and say goodbye. You brought your own jaba.'}
