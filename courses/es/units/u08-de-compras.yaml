# Unit 8 (es): shopping. All present persons of regular verbs (comprar, necesitar, pagar, vender), ¿cuánto
# cuesta?, colours, ese; la jaba, el pomo, la shopping, el agromercado.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u08
title: {en: 'De compras: Shopping'}
cefr: A2
kcs:
- {id: 'sense:jaba', gloss: {en: bag; shopping bag (Cuban)}, forms: {es-Latn/standard: [jaba]}, notes: {en: 'Cuban for a bag, above all a plastic shopping bag (una jaba de nylon); elsewhere bolsa. Cuban grandmothers fold and keep every jaba for the next trip to the store.'}}
- {id: 'sense:necesitar', gloss: {en: to need}, forms: {es-Latn/standard: [necesitar]}, notes: {en: 'A regular -ar verb: necesito, necesitas, necesita, necesitamos, necesitan.'}}
- {id: 'sense:comprar', gloss: {en: to buy}, forms: {es-Latn/standard: [comprar]}, notes: {en: 'Ir de compras: to go shopping. Miami Spanglish has shopear; comprar is the word.'}}
- {id: 'sense:pomo', gloss: {en: bottle; jar (Cuban)}, forms: {es-Latn/standard: [pomo]}, notes: {en: 'Cuban for any bottle or jar: un pomo de agua, un pomo de ron. Elsewhere botella or frasco; in Spain a pomo is a doorknob or a perfume bottle.'}}
- {id: 'sense:costar', gloss: {en: to cost}, forms: {es-Latn/standard: [costar]}, notes: {en: 'Its o becomes ue when stressed: cuesta, cuestan. ¿Cuánto cuesta? How much is it? At a market Cubans also ask ¿A cómo está…?'}}
- {id: 'sense:caro', gloss: {en: expensive; dear}, forms: {es-Latn/standard: [caro]}, notes: {en: '¡Qué caro! is what every Cuban grandmother says at the register.'}}
- {id: 'sense:barato', gloss: {en: cheap; inexpensive}, forms: {es-Latn/standard: [barato]}}
- {id: 'sense:pulóver', gloss: {en: T-shirt (Cuban)}, forms: {es-Latn/standard: [pulóver]}, notes: {en: 'Cuban for a T-shirt, from English pullover (a sweater!). Elsewhere camiseta, playera or remera. Written with an accent; plural pulóveres.'}}
- {id: 'sense:ese', gloss: {en: that}, forms: {es-Latn/standard: [ese]}, notes: {en: 'Ese, esa, esos, esas: that, those (near you). Este, esta: this (near me).'}}
- {id: 'sense:rojo', gloss: {en: red}, forms: {es-Latn/standard: [rojo]}, notes: {en: 'Colours agree like other adjectives: un pulóver rojo, una jaba roja.'}}
- {id: 'sense:blanco', gloss: {en: white}, forms: {es-Latn/standard: [blanco]}}
- {id: 'sense:azul', gloss: {en: blue}, forms: {es-Latn/standard: [azul]}, notes: {en: 'The same for both genders: un pulóver azul, una jaba azul; plural azules. The Cuban flag is azul, blanca y roja.'}}
- {id: 'sense:pagar', gloss: {en: to pay; to pay for}, forms: {es-Latn/standard: [pagar]}, notes: {en: 'Pagar el pomo: to pay for the bottle, with no word for for. In a Cuban family everyone fights to pay: ¡No, no, yo pago!'}}
- {id: 'sense:agromercado', gloss: {en: farmers' market (Cuba)}, forms: {es-Latn/standard: [agromercado, agro]}, notes: {en: 'Cuba''s farmers'' markets, where prices follow supply and demand. Everyone says el agro. Bring your own jaba.'}}
- {id: 'sense:vender', gloss: {en: to sell}, forms: {es-Latn/standard: [vender]}, notes: {en: 'A regular -er verb: vendo, vendes, vende, vendemos, venden. Venden mangos: they sell mangoes, or mangoes are sold.'}}
- {id: 'sense:shopping', gloss: {en: hard-currency store (Cuba)}, forms: {es-Latn/standard: [shopping]}, notes: {en: 'La shopping (feminine, said chópin): in Cuba, a state store that sells in hard currency. In Miami people say el mall.'}}
nodes:
