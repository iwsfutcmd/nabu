      ask: arrange
      forms:
        es-Latn/standard:
          text: Ahora estoy desayunando, mami.
          tokens: [{surface: Ahora, sense: ahora}, {surface: estoy, sense: estar, form: 'form:pres-1s'}, {surface: desayunando, sense: desayunar, form: 'form:ger'}, {surface: mami, sense: mami}]
