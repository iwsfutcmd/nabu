stories:
- id: es.story.u07
  node: es.u07.story
  title: {en: Saturday morning}
  characters:
  - {id: cachita, name: {es-Latn/standard: Abuela Cachita}}
  - {id: daniel, name: {es-Latn/standard: Daniel}}
  - {id: lili, name: {es-Latn/standard: Lili}}
  - {id: mami, name: {es-Latn/standard: Mami}}
  steps:
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: ¡Daniel! ¿Tú estás durmiendo?
          tokens: [{surface: Daniel, sense: daniel}, {surface: Tú, sense: tú}, {surface: estás, sense: estar, form: 'form:pres-2s'}, {surface: durmiendo, sense: dormir, form: 'form:ger'}]
      translations: {en: 'Daniel! Are you sleeping?'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Sí, abuela. Hoy es sábado.
          tokens: [{surface: Sí, sense: sí}, {surface: abuela, sense: abuela}, {surface: Hoy, sense: hoy}, {surface: es, sense: ser, form: 'form:pres-3s'}, {surface: sábado, sense: sábado}]
      translations: {en: 'Yes, Grandma. Today is Saturday.'}
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: ¿Y qué? Los sábados yo me levanto temprano.
          tokens: [{surface: 'Y', sense: 'y'}, {surface: qué, sense: qué}, {surface: Los, sense: el}, {surface: sábados, sense: sábado}, {surface: yo, sense: yo}, {surface: me, sense: me}, {surface: levanto, sense: levantarse, form: 'form:pres-1s'}, {surface: temprano, sense: temprano}]
      translations: {en: 'So what? On Saturdays I get up early.'}
  - line:
      speaker: daniel
      ask: arrange
      forms:
        es-Latn/standard:
          text: Y yo me levanto tarde.
          tokens: [{surface: 'Y', sense: 'y'}, {surface: yo, sense: yo}, {surface: me, sense: me}, {surface: levanto, sense: levantarse, form: 'form:pres-1s'}, {surface: tarde, sense: tarde}]
      translations: {en: And I get up late.}
  - choose:
      prompt: {en: 'What day is it?'}
      options: [{en: Saturday}, {en: Sunday}, {en: Monday}]
      answer: 0
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: Hay café, mi vida.
          tokens: [{surface: Hay, sense: hay}, {surface: café, sense: café}, {surface: mi, sense: mi}, {surface: vida, sense: vida}]
      translations: {en: 'There''s coffee, darling.'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Voy, abuela. Me baño y después desayuno.
          tokens: [{surface: Voy, sense: ir, form: 'form:pres-1s'}, {surface: abuela, sense: abuela}, {surface: Me, sense: me}, {surface: baño, sense: bañarse, form: 'form:pres-1s'}, {surface: 'y', sense: 'y'}, {surface: después, sense: después}, {surface: desayuno, sense: desayunar, form: 'form:pres-1s'}]
      translations: {en: 'Coming, Grandma. I''ll take a shower and then have breakfast.'}
  - line:
      speaker: lili
      forms:
        es-Latn/standard:
          text: ¡No, Daniel! ¡Yo me estoy bañando!
          tokens: [{surface: 'No', sense: 'no'}, {surface: Daniel, sense: daniel}, {surface: Yo, sense: yo}, {surface: me, sense: me}, {surface: estoy, sense: estar, form: 'form:pres-1s'}, {surface: bañando, sense: bañarse, form: 'form:ger'}]
      translations: {en: 'No, Daniel! I''m in the shower!'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: ¡Lili! ¡Tú siempre te bañas por la mañana!
          tokens: [{surface: Lili, sense: lili}, {surface: Tú, sense: tú}, {surface: siempre, sense: siempre}, {surface: te, sense: te}, {surface: bañas, sense: bañarse, form: 'form:pres-2s'}, {surface: por, sense: por}, {surface: la, sense: el}, {surface: mañana, sense: mañana}]
      translations: {en: 'Lili! You always shower in the morning!'}
