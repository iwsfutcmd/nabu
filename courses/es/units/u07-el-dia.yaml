      speaker: lili
      ask: complete
      gap: sense:noche
      distractors: ['sense:novela', 'sense:calle']
      forms:
        es-Latn/standard:
          text: Sí, y tú te bañas por la noche.
          tokens: [{surface: Sí, sense: sí}, {surface: 'y', sense: 'y'}, {surface: tú, sense: tú}, {surface: te, sense: te}, {surface: bañas, sense: bañarse, form: 'form:pres-2s'}, {surface: por, sense: por}, {surface: la, sense: el}, {surface: noche, sense: noche}]
      translations: {en: 'Yes, and you shower at night.'}
  - choose:
      prompt: {en: 'Who is in the shower?'}
      options: [{en: Lili}, {en: Daniel}, {en: Abuela}]
      answer: 0
  - line:
      speaker: mami
      forms:
        es-Latn/standard:
          text: Daniel, ¿hoy tú trabajas?
          tokens: [{surface: Daniel, sense: daniel}, {surface: hoy, sense: hoy}, {surface: tú, sense: tú}, {surface: trabajas, sense: trabajar, form: 'form:pres-2s'}]
      translations: {en: 'Daniel, are you working today?'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Sí, mami. Trabajo por la tarde.
          tokens: [{surface: Sí, sense: sí}, {surface: mami, sense: mami}, {surface: Trabajo, sense: trabajar, form: 'form:pres-1s'}, {surface: por, sense: por}, {surface: la, sense: el}, {surface: tarde, sense: tarde}]
      translations: {en: 'Yes, Mom. I work in the afternoon.'}
  - line:
      speaker: mami
      forms:
        es-Latn/standard:
          text: ¿Y ahora qué tú estás haciendo?
          tokens: [{surface: 'Y', sense: 'y'}, {surface: ahora, sense: ahora}, {surface: qué, sense: qué}, {surface: tú, sense: tú}, {surface: estás, sense: estar, form: 'form:pres-2s'}, {surface: haciendo, sense: hacer, form: 'form:ger'}]
      translations: {en: 'And what are you doing now?'}
  - line:
