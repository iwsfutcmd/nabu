      gap: sense:novela
      distractors: ['sense:guagua', 'sense:tienda']
      forms:
        es-Latn/standard:
          text: Y por la noche, ¡la novela!
          tokens: [{surface: 'Y', sense: 'y'}, {surface: por, sense: por}, {surface: la, sense: el}, {surface: noche, sense: noche}, {surface: la, sense: el}, {surface: novela, sense: novela}]
      translations: {en: 'And at night, the soap opera!'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Abuela, ¡tú siempre ves la novela!
          tokens: [{surface: Abuela, sense: abuela}, {surface: tú, sense: tú}, {surface: siempre, sense: siempre}, {surface: ves, sense: ver, form: 'form:pres-2s'}, {surface: la, sense: el}, {surface: novela, sense: novela}]
      translations: {en: 'Grandma, you always watch the soap opera!'}
