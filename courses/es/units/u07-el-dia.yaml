- {id: es.u07.por-la-manana, kind: lesson, introduces: ['sense:por', 'sense:mañana', 'sense:hacer', 'sense:tarde', 'sense:noche', 'sense:colada', 'sense:trabajo']}
- {id: es.u07.los-dias, kind: lesson, introduces: ['sense:hoy', 'sense:lunes', 'sense:qué', 'sense:día', 'sense:martes', 'sense:miércoles']}
- {id: es.u07.los-domingos, kind: lesson, introduces: ['sense:jueves', 'sense:viernes', 'sense:sábado', 'sense:domingo']}
- {id: es.u07.la-novela, kind: lesson, introduces: ['sense:ver', 'sense:novela', 'sense:siempre', 'sense:acostarse']}
- {id: es.u07.estoy-trabajando, kind: lesson, introduces: ['form:ger', 'sense:ahora', 'sense:lili', 'sense:dormir']}
