# Unit 7 (es): a day in the family. Reflexive verbs (me levanto, me baño, me acuesto), desayunar, por la mañana,
# por la tarde, por la noche, temprano and tarde, the days of the week, estar + gerund (estoy trabajando);
# Mami's coffee in the morning, the colada at work, Abuela's novela at night.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u07
title: {en: 'Un día: a day'}
cefr: A2
kcs:
- {id: 'sense:levantarse', gloss: {en: to get up}, forms: {es-Latn/standard: [levantarse]}, notes: {en: 'Reflexive: me levanto, te levantas, se levanta. To wake up is despertarse.'}}
- {id: 'sense:temprano', gloss: {en: early}, forms: {es-Latn/standard: [temprano]}, notes: {en: 'Its opposite is tarde, late.'}}
- {id: 'sense:bañarse', gloss: {en: to take a shower; to bathe}, forms: {es-Latn/standard: [bañarse]}, notes: {en: 'Cubans, like most Latin Americans, say bañarse for a shower; ducharse is more usual in Spain. Without se, bañar is to bathe someone else.'}}
- {id: 'sense:después', gloss: {en: after; afterwards; then; later}, forms: {es-Latn/standard: [después]}, notes: {en: 'Written with an accent on the é. Después de: after (después de la novela).'}}
- {id: 'sense:desayunar', gloss: {en: to have breakfast}, forms: {es-Latn/standard: [desayunar]}, notes: {en: 'Desayuno: I have breakfast; el desayuno is breakfast. The Cuban one: café con leche, with buttered Cuban toast (tostada) to dip in it.'}}
- {id: 'sense:por', gloss: {en: 'by; through; for (por la mañana: in the morning)'}, forms: {es-Latn/standard: [por]}, notes: {en: 'Por la mañana, por la tarde, por la noche: in the morning, in the afternoon, at night. In the Caribbean and the US you also hear en la mañana.'}}
- {id: 'sense:mañana', gloss: {en: morning; tomorrow}, forms: {es-Latn/standard: [mañana]}, notes: {en: 'La mañana is the morning; mañana alone is tomorrow. Tomorrow morning: mañana por la mañana.'}}
- {id: 'sense:hacer', gloss: {en: to do; to make}, forms: {es-Latn/standard: [hacer]}, notes: {en: 'Hago, haces, hace; haciendo. The h is written but never said.'}}
- {id: 'sense:tarde', gloss: {en: afternoon; evening; late}, forms: {es-Latn/standard: [tarde]}, notes: {en: 'La tarde lasts until dark: por la tarde, in the afternoon. Tarde alone means late: me levanto tarde.'}}
- {id: 'sense:noche', gloss: {en: night; evening}, forms: {es-Latn/standard: [noche]}, notes: {en: 'Por la noche: at night, in the evening. Buenas noches: good evening, good night.'}}
- {id: 'sense:colada', gloss: {en: colada (Cuban coffee to share)}, forms: {es-Latn/standard: [colada]}, notes: {en: 'A big shot of café cubano in a foam cup, with tiny plastic cups to share it out. In Miami someone brings la colada from the ventanita to work in the afternoon. From colar, to brew: Mami cuela el café.'}}
- {id: 'sense:trabajo', gloss: {en: work; job}, forms: {es-Latn/standard: [trabajo]}, notes: {en: 'En el trabajo: at work. Trabajo is also I work, from trabajar.'}}
- {id: 'sense:hoy', gloss: {en: today}, forms: {es-Latn/standard: [hoy]}, notes: {en: 'With an h that is never said.'}}
- {id: 'sense:lunes', gloss: {en: Monday}, forms: {es-Latn/standard: [lunes]}, notes: {en: 'Days take no capital in Spanish. El lunes: on Monday; los lunes: on Mondays. Lunes to viernes are the same in the plural.'}}
- {id: 'sense:qué', gloss: {en: 'what; how (¡qué…!)'}, forms: {es-Latn/standard: [qué]}, notes: {en: 'With an accent when it asks or exclaims; que without one means that. Cubans keep tú before the verb: ¿Qué tú haces?'}}
- {id: 'sense:día', gloss: {en: day}, forms: {es-Latn/standard: [día]}, notes: {en: 'Masculine though it ends in -a: el día, buenos días. Written with an accent on the í.'}}
- {id: 'sense:martes', gloss: {en: Tuesday}, forms: {es-Latn/standard: [martes]}}
- {id: 'sense:miércoles', gloss: {en: Wednesday}, forms: {es-Latn/standard: [miércoles]}, notes: {en: 'With an accent on the é.'}}
- {id: 'sense:jueves', gloss: {en: Thursday}, forms: {es-Latn/standard: [jueves]}}
- {id: 'sense:viernes', gloss: {en: Friday}, forms: {es-Latn/standard: [viernes]}}
- {id: 'sense:sábado', gloss: {en: Saturday}, forms: {es-Latn/standard: [sábado]}, notes: {en: 'With an accent on the first á. On Saturdays: los sábados.'}}
- {id: 'sense:domingo', gloss: {en: Sunday}, forms: {es-Latn/standard: [domingo]}, notes: {en: 'On Sundays: los domingos. The Spanish week starts on Monday.'}}
- {id: 'sense:ver', gloss: {en: to see; to watch}, forms: {es-Latn/standard: [ver]}, notes: {en: 'Veo, ves, ve; viendo. Ver la novela, ver la pelota: to watch the soap opera, the ball game.'}}
- {id: 'sense:novela', gloss: {en: soap opera; telenovela; novel}, forms: {es-Latn/standard: [novela]}, notes: {en: 'On TV, la novela is the telenovela the whole family watches at night. A novel you read is also una novela.'}}
- {id: 'sense:siempre', gloss: {en: always}, forms: {es-Latn/standard: [siempre]}}
- {id: 'sense:acostarse', gloss: {en: to go to bed; to lie down}, forms: {es-Latn/standard: [acostarse]}, notes: {en: 'The o becomes ue when stressed: me acuesto, te acuestas, se acuesta.'}}
- {id: 'form:ger', gloss: {en: 'gerund, -ando, -iendo (estoy trabajando: I''m working)'}, notes: {en: 'Estar + gerund is for what is going on right now. Not for plans as in English: I''m working tomorrow is trabajo mañana. With me, te or se on the end it takes an accent: bañándose.'}}
- {id: 'sense:ahora', gloss: {en: now}, forms: {es-Latn/standard: [ahora]}, notes: {en: 'Cubans also say ahorita, which can mean right now or in a little while, depending on who says it.'}}
- {id: 'sense:lili', gloss: {en: Lili (a name)}, forms: {es-Latn/standard: [Lili]}}
- {id: 'sense:dormir', gloss: {en: to sleep}, forms: {es-Latn/standard: [dormir]}, notes: {en: 'The o becomes ue (duermo, duermes, duerme) and u in the gerund: durmiendo.'}}
nodes:
