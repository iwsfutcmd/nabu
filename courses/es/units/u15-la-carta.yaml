# Unit 15 (es): a letter to Tía Marisol in Havana, a WhatsApp message to Yunior and a paquete: the spelling a heritage
# speaker never learned, in the words they write. The silent h (hola, hay, ahí, hablar, hermano), b and v (bueno, viejo,
# beber, vivir, recibir), c, s and z (zapato, decir, hacer), ll and y (llamar, llegar, ya, llueve), g and j (gente, jabón,
# mensaje, dijo, llegué); and words that sound alike: hay, ahí, ¡ay!; hola, ola; a ver, haber; echo, hecho; tuvo, tubo.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u15
title: {en: 'Una carta a Cuba: A letter to Cuba'}
cefr: B1
kcs:
- {id: 'sense:carta', gloss: {en: 'letter (that you send)'}, forms: {es-Latn/standard: [carta]}, notes: {en: 'A letter you write is una carta; a letter of the alphabet is una letra. La carta is also a playing card, and a restaurant''s menu.'}}
- {id: 'sense:querido', gloss: {en: 'dear; beloved'}, forms: {es-Latn/standard: [querido]}, notes: {en: 'How a letter opens: Querida tía (to a woman), Querido Yunior (to a man). In Spanish a colon follows, not a comma: Querida tía: … From querer, to love.'}}
- {id: 'sense:extrañar', gloss: {en: 'to miss (someone or something)'}, forms: {es-Latn/standard: [extrañar]}, notes: {en: 'Te extraño: I miss you, as Cubans and most of Latin America say it; in Spain, te echo de menos. With x and ñ: ex-tra-ñar.'}}
- {id: 'sense:abrazo', gloss: {en: 'hug; embrace'}, forms: {es-Latn/standard: [abrazo]}, notes: {en: 'With b and z. Un abrazo, or un abrazo fuerte, closes letters and messages between family and friends.'}}
- {id: 'sense:beso', gloss: {en: 'kiss'}, forms: {es-Latn/standard: [beso]}, notes: {en: 'With b and s. Cubans greet family and friends with a kiss on the cheek, and end a message with besos.'}}
- {id: 'sense:paquete', gloss: {en: 'package; parcel'}, forms: {es-Latn/standard: [paquete]}, notes: {en: 'Families in Miami send paquetes to Cuba through shipping agencies: medicine, food, soap, clothes. With qu before e. In Cuba, el paquete (semanal) is also the weekly hard drive of films and series passed from hand to hand.'}}
- {id: 'sense:jabón', gloss: {en: 'soap'}, forms: {es-Latn/standard: [jabón]}, notes: {en: 'With j and b, and an accent on the o; the plural drops it: jabones. Soap is one of the first things in a paquete to Cuba.'}}
- {id: 'sense:zapato', gloss: {en: 'shoe'}, forms: {es-Latn/standard: [zapato]}, notes: {en: 'With z. In Cuba, as all over Latin America, s, z and the soft c sound the same, so only the spelling tells casa (house) from caza (hunt). Z goes before a, o, u and turns into c before e, i: la vez, las veces.'}}
- {id: 'sense:ya', gloss: {en: 'already; now; ya no: not anymore'}, forms: {es-Latn/standard: ['ya']}, notes: {en: 'With y. ¿Ya llegó?: has it arrived yet? ¡Ya voy!: I''m coming! It goes before or after the verb: ya llegó, llegó ya.'}}
- {id: 'sense:recibir', gloss: {en: 'to receive; to get'}, forms: {es-Latn/standard: [recibir]}, notes: {en: 'With c and b: re-ci-bir, like every verb in -bir but hervir, servir and vivir. Recibí: I received; recibió: she received.'}}
- {id: 'sense:ay', gloss: {en: 'oh!; ow!; oh no!'}, forms: {es-Latn/standard: [ay]}, notes: {en: 'A cry, with no h: ¡Ay, mi madre! ¡Ay, Dios mío! Hay (with h) is there is; ahí (with h and an accent) is there. Hay and ay sound the same.'}}
- {id: 'sense:ahí', gloss: {en: 'there; over there'}, forms: {es-Latn/standard: [ahí]}, notes: {en: 'Two syllables, a-hí, with a silent h and an accent on the í. Not hay (there is) or ¡ay! (oh!), though texts often write all three as ai. Allí and allá also mean there.'}}
- {id: 'sense:hache', gloss: {en: 'aitch (the letter h)'}, forms: {es-Latn/standard: [hache]}, notes: {en: 'The h is silent in Spanish, so it is learned word by word: hola, hay, hoy, hacer, hablar, hermano, ahora, ahí. Lleva hache: it has an h. To tell b from v, people say b de burro, v de vaca.'}}
- {id: 'sense:ola', gloss: {en: 'wave (in the sea)'}, forms: {es-Latn/standard: [ola]}, notes: {en: '¡Hola! (hello) has an h; la ola (the wave) has none. In winter the waves (las olas) of the Malecón in Havana leap the sea wall.'}}
- {id: 'sense:bueno', gloss: {en: 'good'}, forms: {es-Latn/standard: [bueno]}, notes: {en: 'With b. Buen before a masculine noun: un buen viaje. ¡Qué bueno!: great!, how nice! Bueno… at the start: well…, OK…'}}
- {id: 'sense:beber', gloss: {en: 'to drink'}, forms: {es-Latn/standard: [beber]}, notes: {en: 'With two b''s. Cubans mostly say tomar (tomar café); beber is the more written word. Bebé, with an accent, is a baby.'}}
- {id: 'sense:tubo', gloss: {en: 'tube; pipe; (Cuba) the phone'}, forms: {es-Latn/standard: [tubo]}, notes: {en: 'With b. Coger el tubo: to pick up the phone; te doy un tubazo: I''ll give you a call. Tuvo, with v, is from tener (no tuvo tiempo, she had no time): they sound the same.'}}
- {id: 'sense:haber', gloss: {en: 'to have (helper verb: he comido); there to be (va a haber)'}, forms: {es-Latn/standard: [haber]}, notes: {en: 'Hay (there is) is a form of haber. Va a haber fiesta: there''s going to be a party. Haber sounds just like a ver (let''s see), which is two words: A ver, ¿qué hay?'}}
- {id: 'sense:hecho', gloss: {en: 'done; a fact; ¡hecho!: deal!'}, forms: {es-Latn/standard: [hecho]}, notes: {en: 'With h, from hacer: ¡Hecho! (it''s a deal!, done!). Echo, without an h, is from echar: echo la carta en el paquete.'}}
