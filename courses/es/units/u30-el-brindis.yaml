      forms:
        es-Latn/standard:
          text: Mi español viene de tu cocina, abuela, y de tus refranes.
          tokens: [{surface: Mi, sense: mi}, {surface: español, sense: español}, {surface: viene, sense: venir, form: 'form:pres-3s'}, {surface: de, sense: de}, {surface: tu, sense: tu}, {surface: cocina, sense: cocina}, {surface: abuela, sense: abuela}, {surface: 'y', sense: 'y'}, {surface: de, sense: de}, {surface: tus, sense: tu}, {surface: refranes, sense: refrán}]
