          tokens: [{surface: En, sense: en}, {surface: español, sense: español}, {surface: Aunque, sense: aunque}, {surface: me, sense: me}, {surface: da, sense: dar, form: 'form:pres-3s'}, {surface: miedo, sense: miedo}, {surface: lo, sense: lo}, {surface: voy, sense: ir, form: 'form:pres-1s'}, {surface: a, sense: a}, {surface: hacer, sense: hacer}]
