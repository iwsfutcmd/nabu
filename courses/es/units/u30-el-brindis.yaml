          tokens: [{surface: Tía, sense: tío}, {surface: Marisol, sense: marisol}, {surface: aunque, sense: aunque}, {surface: estés, sense: estar, form: 'form:subj'}, {surface: lejos, sense: lejos}, {surface: siempre, sense: siempre}, {surface: tienes, sense: tener, form: 'form:pres-2s'}, {surface: un, sense: un}, {surface: lugar, sense: lugar}, {surface: en, sense: en}, {surface: esta, sense: este}, {surface: mesa, sense: mesa}]
      translations: {en: 'Aunt Marisol, even though you''re far away, you always have a place at this table.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
