# Unit 30 (es): El brindis. Abuela Cachita's eightieth birthday in the patio in Hialeah (el cake, la mesa, los nietos,
# Tía Marisol and Yunior on a video call) and Daniel's toast, in Spanish, to the whole family. Formal speech: quisiera
# decir unas palabras, en primer lugar, me gustaría agradecerles…, les agradezco que…, por último, levantemos las
# copas, brindemos por…, ¡que cumplas muchos más! Connectors: sin embargo, aunque with the indicative (a fact) and the
# subjunctive (what may be), a pesar de que, además, por lo tanto. The toast gathers the family's story: Mariel,
# Marisol, who stayed, Papi the balsero, the bohío in Matanzas, Martí's white rose.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u30
title: {en: 'El brindis: The toast'}
cefr: B2
kcs:
- {id: 'sense:cumplir', gloss: {en: to turn (an age); to keep (a promise)}, forms: {es-Latn/standard: [cumplir]}, notes: {en: 'Abuela cumple ochenta (años): Grandma turns eighty. English turns an age; Spanish cumple it. ¡Que cumplas muchos más!: many happy returns. Cumplir una promesa: to keep a promise.'}}
- {id: 'sense:nuestro', gloss: {en: our}, forms: {es-Latn/standard: [nuestro]}, notes: {en: 'It agrees with what is owned, not with the owners: nuestra familia, nuestros abuelos, nuestras raíces. El nuestro: ours.'}}
- {id: 'sense:cake', gloss: {en: cake; birthday cake (Cuban)}, forms: {es-Latn/standard: [cake]}, notes: {en: 'What Cubans call a birthday cake, from English, said as in English: el cake de cumpleaños, usually with merengue on top. Elsewhere el pastel, la torta, la tarta or el bizcocho, which are accepted too. A plain sponge cake is una panetela.'}}
- {id: 'sense:mesa', gloss: {en: table}, forms: {es-Latn/standard: [mesa]}, notes: {en: 'La mesa. Poner la mesa: to set the table; sentarse a la mesa: to sit down to eat. Tener un lugar en la mesa: to be one of the family.'}}
- {id: 'sense:brindis', gloss: {en: toast (to someone's health)}, forms: {es-Latn/standard: [brindis]}, notes: {en: 'Hacer un brindis por alguien: to make a toast to someone. The same in the plural: los brindis. Toast you eat is pan tostado, or una tostada.'}}
- {id: 'sense:brindar', gloss: {en: to toast; to drink to (brindar por)}, forms: {es-Latn/standard: [brindar]}, notes: {en: '¡Brindemos por abuela!: let''s drink to Grandma. Brindar is also to offer: brindar ayuda.'}}
- {id: 'sense:agradecer', gloss: {en: to thank; to be grateful for}, forms: {es-Latn/standard: [agradecer]}, notes: {en: 'Le agradezco su ayuda: I thank you for your help (in careful Spanish, no por before what you are grateful for). Les agradezco que estén aquí, with the subjunctive. Agradezco has zc, like conozco. Everyday: darle las gracias a alguien.'}}
- {id: 'sense:sin-embargo', gloss: {en: however; nevertheless}, forms: {es-Latn/standard: [sin embargo]}, notes: {en: 'For a speech or for writing, after a full stop or a semicolon and followed by a comma: llegó sin nada; sin embargo, nos dio todo. In conversation Cubans more often say pero, or aun así.'}}
- {id: 'sense:difícil', gloss: {en: difficult; hard}, forms: {es-Latn/standard: [difícil]}, notes: {en: 'With an accent on the first í: di-fí-cil, like fácil (easy); the plurals difíciles and fáciles keep it.'}}
- {id: 'sense:aunque', gloss: {en: although; even though; even if}, forms: {es-Latn/standard: [aunque]}, notes: {en: 'With the indicative for a fact: aunque vivían lejos, le escribía (although they lived far apart). With the subjunctive for what may be or does not matter: aunque pasen los años (even if the years go by), aunque estés lejos.'}}
- {id: 'sense:a-pesar-de', gloss: {en: 'despite; in spite of (a pesar de que: even though)'}, forms: {es-Latn/standard: [a pesar de]}, notes: {en: 'A pesar de + a noun or an infinitive: a pesar del calor, a pesar de trabajar tanto. A pesar de que + a verb: a pesar de que trabajaba mucho. Keep the de before que.'}}
- {id: 'sense:sacrificio', gloss: {en: sacrifice}, forms: {es-Latn/standard: [sacrificio]}, notes: {en: 'With c twice: sa-cri-fi-cio. Hacer sacrificios: to make sacrifices. Children of exiles grow up hearing about los sacrificios de los viejos.'}}
- {id: 'sense:mujer', gloss: {en: woman; wife}, forms: {es-Latn/standard: [mujer]}, notes: {en: 'Mi mujer: my wife (also mi esposa). With j: mu-jer; plural mujeres.'}}
- {id: 'sense:fuerte', gloss: {en: strong}, forms: {es-Latn/standard: [fuerte]}, notes: {en: 'The same for men and women: una mujer fuerte. Also loud (no hables tan fuerte) and heavy (un aguacero fuerte, a heavy downpour).'}}
- {id: 'sense:además', gloss: {en: besides; also; in addition}, forms: {es-Latn/standard: [además]}, notes: {en: 'With an accent on the last syllable: a-de-más. Además de: as well as (además de cocinar, cosía). In a speech it adds one more point.'}}
- {id: 'sense:enseñar', gloss: {en: to teach; to show}, forms: {es-Latn/standard: [enseñar]}, notes: {en: 'Enseñarle a alguien a + infinitive: abuela me enseñó a cocinar. Also to show: enséñame la foto. The one who learns aprende; the one who teaches enseña (never me aprendió for she taught me).'}}
- {id: 'sense:por-lo-tanto', gloss: {en: therefore; so}, forms: {es-Latn/standard: [por lo tanto]}, notes: {en: 'Introduces what follows from what you just said. More formal than por eso or así que, which everyday Cuban Spanish prefers; right for a speech or a letter.'}}
- {id: 'sense:recordar', gloss: {en: to remember; to remind}, forms: {es-Latn/standard: [recordar]}, notes: {en: 'O becomes ue: recuerdo, recuerdas. Recordar algo, or acordarse de algo: to remember it (me acuerdo de Cuba). Recordarle algo a alguien: to remind someone of it. Un recuerdo: a memory; a keepsake.'}}
- {id: 'sense:raíz', gloss: {en: root}, forms: {es-Latn/standard: [raíz]}, notes: {en: 'Plural raíces: z becomes c before e, and both keep the accent on the í. Mis raíces están en Cuba: my roots are in Cuba.'}}
- {id: 'sense:levantar', gloss: {en: to raise; to lift}, forms: {es-Latn/standard: [levantar]}, notes: {en: 'Levantar la copa, levantar la mano. With se, levantarse is to get up (me levanto a las siete). Levantemos las copas: let''s raise our glasses, the nosotros form of the subjunctive used for let''s.'}}
- {id: 'sense:copa', gloss: {en: glass (with a stem); cup (a trophy)}, forms: {es-Latn/standard: [copa]}, notes: {en: 'Una copa de vino has a stem; a glass without one is un vaso. Also a trophy: la Copa del Mundo. Tomarse una copa: to have a drink.'}}
- {id: 'sense:felicidades', gloss: {en: congratulations; happy birthday}, forms: {es-Latn/standard: [felicidades]}, notes: {en: 'Always plural: ¡Felicidades, abuela! is how most Cubans wish someone a happy birthday, along with ¡Feliz cumpleaños! Also congratulations on any good news.'}}
