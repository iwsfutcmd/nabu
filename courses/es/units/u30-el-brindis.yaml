scenarios:
- id: es.brindis
  after: es.u30.levantemos
  title: {en: 'The toast at Abuela''s eightieth'}
  setting: {en: 'Abuela Cachita''s eightieth birthday, on a warm Saturday night in the backyard of her house in Hialeah: lights strung in the mango tree, a long table with lechón, congrí, yuca con mojo and a big cake with merengue, the dominó table pushed to one side, Celia Cruz on the speaker. Tía Marisol and Yunior are on a WhatsApp video call from Centro Habana, on a phone propped against a bottle. Everyone has a glass in hand, and it is your turn to give the toast, in Spanish.'}
  character: {en: 'Abuelo Pepe, Abuela Cachita''s husband, a retired mechanic in his eighties: proud, teasing and sentimental. He taps his glass to quiet everyone and introduces you as el nieto que va a hablar en español. While you speak he chimes in with a memory or a refrán of his own (the motorboat at Mariel, Matanzas, the 1957 car he left with a cousin), asks you to say more, and teases you kindly when you slip into Spanglish, telling you the word a Cuban from the island would use.'}
  goal: {en: 'Ask for everyone''s attention and say you would like to say a few words (quisiera decir unas palabras); thank everyone for coming (en primer lugar, me gustaría agradecerles…); say something about Abuela''s life and the family''s story with connectors (aunque, sin embargo, a pesar de que, además, por lo tanto); greet Tía Marisol and Yunior on the call; then close (por último) by raising your glass (¡Levantemos las copas! ¡Que cumpla muchos más!) and answer Abuelo''s questions.'}
