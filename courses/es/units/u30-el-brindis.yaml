          tokens: [{surface: Buenas, sense: bueno}, {surface: noches, sense: noche}, {surface: a, sense: a}, {surface: todos, sense: todo}, {surface: Quisiera, sense: querer, form: 'form:subj-past'}, {surface: hacer, sense: hacer}, {surface: un, sense: un}, {surface: brindis, sense: brindis}, {surface: por, sense: por}, {surface: abuela, sense: abuela}]
