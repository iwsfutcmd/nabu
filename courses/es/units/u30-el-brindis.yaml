          tokens: [{surface: Ay, sense: ay}, {surface: mi, sense: mi}, {surface: niño, sense: niño}, {surface: me, sense: me}, {surface: vas, sense: ir, form: 'form:pres-2s'}, {surface: a, sense: a}, {surface: hacer, sense: hacer}, {surface: llorar, sense: llorar}]
