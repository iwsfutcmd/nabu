          tokens: [{surface: Primero, lexeme: primero, feats: {Gender: Masc, Number: Sing}}, {surface: se, lexeme: se.impersonal}, {surface: siembra, lexeme: sembrar, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: el, lexeme: el, feats: {Gender: Masc, Number: Sing}, n: 4, head: 5, rel: det}, {surface: tabaco, lexeme: tabaco, feats: {Number: Sing}, n: 5}, {surface: y, lexeme: y}, {surface: después, lexeme: después}, {surface: se, lexeme: se.impersonal}, {surface: cosechan, lexeme: cosechar, feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: las, lexeme: el, feats: {Gender: Fem, Number: Plur}, n: 10, head: 11, rel: det}, {surface: hojas, lexeme: hoja, feats: {Number: Plur}, n: 11}]
