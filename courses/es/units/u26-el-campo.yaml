# Unit 26 (es): the Cuban countryside, on a trip to Viñales and to Abuela's Matanzas. The passive with ser (la casa fue
# construida por…) and the passive se (el tabaco se cultiva en Pinar del Río): el guajiro and el campesino; tobacco
# (la vega, sembrar, cosechar, the leaves dried in the casa de tabaco); sugar cane, el central and the machete; the
# national symbols (la palma real, el tocororo, la mariposa); el sombrero de yarey and the arroyo by the bohío.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u26
title: {en: 'El campo: the countryside'}
cefr: B2
kcs:
- {id: 'sense:viñales', gloss: {en: 'Viñales (a valley and town in Pinar del Río)'}, forms: {es-Latn/standard: [Viñales]}, notes: {en: 'In the far west of Cuba: red earth, tobacco fields, bohíos and mogotes, a UNESCO World Heritage landscape since 1999. Vi-ña-les, with ñ.'}}
- {id: 'sense:pinar-del-río', gloss: {en: 'Pinar del Río (Cuba''s westernmost province)'}, forms: {es-Latn/standard: [Pinar del Río]}, notes: {en: 'Un pinar is a pine wood: the town was named for a pine grove by a river. Its Vuelta Abajo district grows the tobacco of the most famous Cuban cigars. Someone from there is pinareño, pinareña.'}}
- {id: 'sense:valle', gloss: {en: 'valley'}, forms: {es-Latn/standard: [valle]}, notes: {en: 'El valle, masculine, with v and ll. El Valle de Viñales: flat fields of red earth between steep mogotes.'}}
- {id: 'sense:mogote', gloss: {en: 'mogote (a steep, round-topped limestone hill)'}, forms: {es-Latn/standard: [mogote]}, notes: {en: 'The sheer-sided, round-topped limestone hills of the Viñales valley, green with forest and full of caves. Geologists all over the world now use the Cuban word for hills of this shape.'}}
- {id: 'sense:guajiro', gloss: {en: 'guajiro: a Cuban country person; a farmer'}, forms: {es-Latn/standard: [guajiro]}, notes: {en: 'Said with pride: el guajiro is the Cuban countryman, with his sombrero de yarey and his machete, and la música guajira (el punto, la guajira) is his music: Guantanamera is the guajira from Guantánamo. A popular story derives the word from English war hero, in 1898, but it is older than that. In Miami, calling someone guajiro can also mean a bit of a hick.'}}
- {id: 'sense:campesino', gloss: {en: 'farmer; peasant; country person'}, forms: {es-Latn/standard: [campesino]}, notes: {en: 'The general word for someone who lives and works on the land, from el campo; guajiro is the Cuban, warmer word. Campesina for a woman.'}}
- {id: 'sense:tabaco', gloss: {en: 'tobacco; cigar (Cuban)'}, forms: {es-Latn/standard: [tabaco]}, notes: {en: 'In Cuba un tabaco is a cigar (Spain says un puro) and un cigarro is a cigarette. The man or woman who rolls cigars is un torcedor, una torcedora. With b: tabaco.'}}
- {id: 'sense:cultivar', gloss: {en: 'to grow (crops); to cultivate'}, forms: {es-Latn/standard: [cultivar]}, notes: {en: 'Se cultiva tabaco: tobacco is grown. In everyday speech Cubans also say sembrar: aquí se siembra tabaco. Martí''s poem begins Cultivo una rosa blanca.'}}
- {id: 'sense:mundo', gloss: {en: 'world; todo el mundo: everybody'}, forms: {es-Latn/standard: [mundo]}, notes: {en: 'Todo el mundo usually means everybody: todo el mundo lo sabe. The best in the world is el mejor del mundo, with del, not en el mundo.'}}
- {id: 'sense:vega', gloss: {en: 'tobacco field (Cuban); fertile river plain'}, forms: {es-Latn/standard: [vega]}, notes: {en: 'In Cuba una vega is a tobacco plantation, and el veguero the farmer who grows it. Elsewhere a vega is any fertile plain by a river. With v: vega.'}}
- {id: 'sense:sembrar', gloss: {en: 'to sow; to plant'}, forms: {es-Latn/standard: [sembrar]}, notes: {en: 'E becomes ie: siembro, siembras, siembra. Cubans use it for any planting: sembrar una mata de mango, sembrar frijoles. Plantar exists but is less common.'}}
- {id: 'sense:cosechar', gloss: {en: 'to harvest'}, forms: {es-Latn/standard: [cosechar]}, notes: {en: 'La cosecha: the harvest. Tobacco is harvested leaf by leaf, from the bottom of the plant up, over several weeks.'}}
- {id: 'sense:hoja', gloss: {en: 'leaf; sheet (of paper)'}, forms: {es-Latn/standard: [hoja]}, notes: {en: 'With a silent h: la hoja. Una hoja de papel: a sheet of paper. A cigar is made of three kinds of leaf: the filler (la tripa), the binder (el capote) and the wrapper (la capa).'}}
- {id: 'sense:secar', gloss: {en: 'to dry'}, forms: {es-Latn/standard: [secar]}, notes: {en: 'The leaves dry for weeks, hung on poles in the casa de tabaco, a tall barn thatched with palm whose doors are opened and shut to let the air in. Before e, c becomes qu: sequé.'}}
- {id: 'sense:caña', gloss: {en: 'cane; caña de azúcar: sugar cane'}, forms: {es-Latn/standard: [caña]}, notes: {en: 'With ñ: caña. Without it, una cana is a grey hair. For two centuries sugar was Cuba''s wealth (sin azúcar no hay país, the saying went), and the cane was cut by hand in la zafra, the harvest of winter and spring.'}}
- {id: 'sense:central', gloss: {en: 'sugar mill (Cuban)'}, forms: {es-Latn/standard: [central]}, notes: {en: 'Un central (azucarero): a sugar mill with its cane fields and its village, el batey, where the workers lived. Matanzas had dozens. Nearly half of Cuba''s centrales closed in 2002.'}}
- {id: 'sense:bisabuelo', gloss: {en: 'great-grandfather (bisabuela: great-grandmother)'}, forms: {es-Latn/standard: [bisabuelo]}, notes: {en: 'Bis- means twice: bisabuelo, bisnieto (great-grandson). With b in both places: bi-sa-bue-lo. One more generation back: el tatarabuelo.'}}
- {id: 'sense:cortar', gloss: {en: 'to cut'}, forms: {es-Latn/standard: [cortar]}, notes: {en: 'Cortar caña: to cut cane; a cane cutter was un machetero. Cortarse el pelo: to get a haircut. Se cortó la llamada: the call got cut off.'}}
- {id: 'sense:machete', gloss: {en: 'machete'}, forms: {es-Latn/standard: [machete]}, notes: {en: 'The cane cutter''s tool, and the weapon of the mambises, the fighters of Cuba''s wars of independence, famous for their charges: la carga al machete. Ma-che-te, with ch.'}}
- {id: 'sense:construir', gloss: {en: 'to build'}, forms: {es-Latn/standard: [construir]}, notes: {en: 'A y comes in before a, e or o: construyo, construyen, construyó. Passive with ser: fue construido por mi bisabuelo, it was built by my great-grandfather; the participle agrees: la casa fue construida.'}}
- {id: 'sense:palma-real', gloss: {en: 'royal palm (Cuba''s national tree)'}, forms: {es-Latn/standard: [palma real]}, notes: {en: 'Tall, straight and grey-trunked, it stands on Cuba''s coat of arms. Every part of it has a use: its leaves (el guano) thatch the bohío, its trunk gives boards (tablas de palma) for the walls, its leaf sheaths (las yaguas) wrap tobacco, and its fruit (el palmiche) feeds the pigs. Plural palmas reales.'}}
- {id: 'sense:árbol', gloss: {en: 'tree'}, forms: {es-Latn/standard: [árbol]}, notes: {en: 'With an accent: ár-bol is stressed on ár and ends in l. Plural árboles. In Cuba a tree or any plant is often una mata: una mata de mango.'}}
- {id: 'sense:nacional', gloss: {en: 'national'}, forms: {es-Latn/standard: [nacional]}, notes: {en: 'No accent: na-cio-nal ends in l and is stressed on the last syllable. Cuba''s national symbols: the flag (la bandera de la estrella solitaria), the coat of arms, the anthem (La Bayamesa), the royal palm, the tocororo and the mariposa.'}}
- {id: 'sense:tocororo', gloss: {en: 'tocororo (the Cuban trogon, the national bird)'}, forms: {es-Latn/standard: [tocororo]}, notes: {en: 'Found only in Cuba, it wears blue, white and red, the colours of the flag. It is said to die in a cage, so it stands for freedom. Its name copies its call: to-co-ro, to-co-ro.'}}
- {id: 'sense:ave', gloss: {en: 'bird (more formal than pájaro)'}, forms: {es-Latn/standard: [ave]}, notes: {en: 'Feminine, but el ave and un ave, because it starts with a stressed a, like el agua; the adjective stays feminine: un ave blanca, las aves. The everyday word is el pájaro; el ave nacional is the official phrase.'}}
- {id: 'sense:flor', gloss: {en: 'flower'}, forms: {es-Latn/standard: [flor]}, notes: {en: 'La flor, feminine; plural flores. Cuba''s national flower is la flor de mariposa, or just la mariposa.'}}
- {id: 'sense:mariposa', gloss: {en: 'butterfly; (Cuba) white ginger lily, the national flower'}, forms: {es-Latn/standard: [mariposa]}, notes: {en: 'Una mariposa is a butterfly, in Cuba too; but la mariposa is also the white, scented flower that grows by rivers and streams, Cuba''s national flower. Women in the wars of independence wore it in their hair, and are said to have hidden messages in it.'}}
- {id: 'sense:sombrero', gloss: {en: 'hat'}, forms: {es-Latn/standard: [sombrero]}, notes: {en: 'Any hat with a brim, not only a Mexican one. El sombrero de yarey is the guajiro''s woven palm hat. A cap is una gorra.'}}
- {id: 'sense:yarey', gloss: {en: 'yarey (a Cuban palm whose leaves are woven into hats)'}, forms: {es-Latn/standard: [yarey]}, notes: {en: 'A fan palm of the Cuban countryside; its dried leaves are woven into the guajiro''s hat, and into bags and baskets. Ya-rey, with y.'}}
- {id: 'sense:arroyo', gloss: {en: 'stream; brook; creek'}, forms: {es-Latn/standard: [arroyo]}, notes: {en: 'Smaller than un río. Spelled with rr and y. Cubans say y and ll the same, so watch the spelling: arrollo, with ll, is I run over (arrollar).'}}
