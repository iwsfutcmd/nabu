  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: Mi primo es de Miami y quiere ver cómo se hace un tabaco.
          tokens: [{surface: Mi, lexeme: mi, feats: {Gender: Masc, Number: Sing}, n: 1, head: 2, rel: det}, {surface: primo, lexeme: primo, feats: {Gender: Masc, Number: Sing}, n: 2}, {surface: es, lexeme: ser, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: de, lexeme: de, n: 4, head: 5, rel: case}, {surface: Miami, lexeme: miami, n: 5}, {surface: y, lexeme: y}, {surface: quiere, lexeme: querer, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: ver, lexeme: ver, feats: {VerbForm: Inf}}, {surface: cómo, lexeme: cómo}, {surface: se, lexeme: se.impersonal}, {surface: hace, lexeme: hacer, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: un, lexeme: un, feats: {Gender: Masc, Number: Sing}, n: 12, head: 13, rel: det}, {surface: tabaco, lexeme: tabaco, feats: {Number: Sing}, n: 13}]
