# Unit 22 (es): a WhatsApp video call to Havana with Tía Marisol and Yunior, and the subjunctive of feeling and doubt:
# me alegra que, siento que, me preocupa que, ¡qué bueno que…!, dudo que, no creo que (but creo que + indicative), es
# posible que. The call itself: la videollamada, la conexión, el wifi, no te oigo, te congelaste, se cayó la llamada,
# no cuelgues; los apagones and la corriente, la cola, el paquete, la recarga, extrañar.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u22
title: {en: 'La llamada: The call'}
cefr: B2
kcs:
- {id: 'sense:videollamada', gloss: {en: 'video call'}, forms: {es-Latn/standard: [videollamada]}, notes: {en: 'One word: video + llamada. Hacer una videollamada. Cuban families talk over WhatsApp, or over IMO, the app many Cubans used first.'}}
- {id: 'sense:oír', gloss: {en: 'to hear'}, forms: {es-Latn/standard: [oír]}, notes: {en: 'Oigo, oyes, oye, oímos, oyen; que oiga. No te oigo: I can''t hear you, with no can in Spanish. ¡Oye!: hey!, listen! Oír is to hear; escuchar is to listen.'}}
- {id: 'sense:conexión', gloss: {en: 'connection'}, forms: {es-Latn/standard: [conexión]}, notes: {en: 'With x and an accent: co-ne-xión; conexiones has none. Cubans say la conexión está mala, or malísima.'}}
- {id: 'sense:wifi', gloss: {en: 'wifi'}, forms: {es-Latn/standard: [wifi]}, notes: {en: 'Written wifi or wi-fi, and said uaifai. For years Cubans got online only in parks and plazas with public wifi, with prepaid cards from ETECSA, the state phone company.'}}
- {id: 'sense:allá', gloss: {en: 'there; over there'}, forms: {es-Latn/standard: [allá]}, notes: {en: 'Farther away than ahí. In a Cuban family in Miami, allá often just means Cuba: ¿Cómo está la cosa allá? With an accent, like aquí, ahí and acá.'}}
- {id: 'sense:llamada', gloss: {en: 'call; phone call'}, forms: {es-Latn/standard: [llamada]}, notes: {en: 'Hacer una llamada: to make a call. To call back is devolver la llamada, not llamar para atrás, which comes from English (unit 29). With ll: lla-ma-da.'}}
- {id: 'sense:caerse', gloss: {en: 'to fall (down); to drop (a call)'}, forms: {es-Latn/standard: [caerse]}, notes: {en: 'Se cayó la llamada: the call dropped. Se me cayó el teléfono: I dropped my phone (it fell from me). Cayó and cayeron are written with y.'}}
- {id: 'sense:congelarse', gloss: {en: 'to freeze'}, forms: {es-Latn/standard: [congelarse]}, notes: {en: 'Te congelaste: you froze (on the screen). Se congeló la imagen; se congeló el agua. With g before e: con-ge-lar.'}}
- {id: 'sense:apagón', gloss: {en: 'blackout; power cut'}, forms: {es-Latn/standard: [apagón]}, notes: {en: 'Cuba''s apagones can last hours or days, announced or not: no fan, no fridge, no wifi. Apagón has an accent; apagones has none. Apagar: to turn off.'}}
- {id: 'sense:corriente', gloss: {en: 'power; electricity (Cuban); current'}, forms: {es-Latn/standard: [corriente]}, notes: {en: 'Cubans call the power la corriente or la luz: se fue la corriente (it went out), vino la corriente (it came back). Elsewhere: la electricidad. Also a current in a river or the sea.'}}
- {id: 'sense:nada', gloss: {en: 'nothing; (not) anything'}, forms: {es-Latn/standard: [nada]}, notes: {en: 'Spanish keeps no before the verb as well: no oigo nada, I can''t hear anything. Nada más: nothing else, that''s all. De nada: you''re welcome.'}}
- {id: 'sense:colgar', gloss: {en: 'to hang up; to hang'}, forms: {es-Latn/standard: [colgar]}, notes: {en: '¡No cuelgues!: don''t hang up! The o becomes ue when stressed (cuelgo, cuelga), and the g takes a u before e: cuelgue, cuelgues.'}}
- {id: 'sense:alegrar', gloss: {en: 'to make happy; me alegra que…: I''m glad that…'}, forms: {es-Latn/standard: [alegrar]}, notes: {en: 'Like gustar: in me alegra que estés bien, what pleases is the subject. Me alegro de que estés bien says the same. Both take the subjunctive.'}}
- {id: 'sense:sentir', gloss: {en: 'to be sorry; to feel'}, forms: {es-Latn/standard: [sentir]}, notes: {en: 'Lo siento: I''m sorry. Siento que no puedas venir: I''m sorry you can''t come, with the subjunctive. The e becomes ie: siento, sientes. Feeling well or ill is sentirse: me siento bien.'}}
- {id: 'sense:preocupar', gloss: {en: 'to worry (me preocupa que…: I''m worried that…)'}, forms: {es-Latn/standard: [preocupar]}, notes: {en: 'Like gustar: me preocupa que no tengan corriente. With se, preocuparse por: to worry about; ¡no te preocupes!: don''t worry! After que it takes the subjunctive.'}}
- {id: 'sense:cosa', gloss: {en: 'thing; la cosa: how things are'}, forms: {es-Latn/standard: [cosa]}, notes: {en: '¿Cómo está la cosa?: how are things?, the question every Cuban asks about Cuba. The answer is often la cosa está mala, or aquí, en la lucha (getting by).'}}
- {id: 'sense:recarga', gloss: {en: 'top-up; phone credit'}, forms: {es-Latn/standard: [recarga]}, notes: {en: 'Families abroad send recargas to relatives'' phones in Cuba, above all when ETECSA offers double credit. Recargar: to top up; to recharge.'}}
- {id: 'sense:creer', gloss: {en: 'to believe; to think'}, forms: {es-Latn/standard: [creer]}, notes: {en: 'Creo que viene, with the indicative, but no creo que venga, with the subjunctive: doubt takes the subjunctive. Heritage speakers often say no creo que viene. Creyó and creyeron are written with y.'}}
- {id: 'sense:dudar', gloss: {en: 'to doubt'}, forms: {es-Latn/standard: [dudar]}, notes: {en: 'Dudo que + subjunctive: I doubt that (dudo que llegue). Lo dudo: I doubt it. Sin duda: without a doubt.'}}
