scenarios:
- id: es.videollamada
  after: es.u22.no-creo
  title: {en: 'A video call with Tía Marisol'}
  setting: {en: 'A Sunday evening. You are on a WhatsApp video call from Hialeah to Centro Habana, where Tía Marisol stands on her balcony, the only spot in the apartment with a signal. The picture freezes now and then, there was a blackout last night, and the package the family sent two weeks ago has not arrived.'}
  character: {en: 'Tía Marisol, Abuela Cachita''s daughter, in her fifties, who stayed in Havana: warm, funny, a little dramatic, and proud of making do with little. She speaks fast Havana Spanish, calls you mi amor, asks about everyone in Miami, and complains cheerfully about the apagones, the colas and the prices. When the line breaks up she says ¿Me oyes? ¿Te congelaste?'}
  goal: {en: 'Greet her, make sure you can hear and see each other (¿Me oyes?, no te oigo bien, te congelaste), ask how things are in Havana, react to her news with the subjunctive (me alegra que…, siento que…, me preocupa que…, ¡qué bueno que…!), say what you doubt about the package (dudo que…, no creo que…), and say goodbye before the call drops again.'}
