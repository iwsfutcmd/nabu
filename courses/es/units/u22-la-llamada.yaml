stories:
- id: es.story.u22
  node: es.u22.story
  title: {en: 'The video call'}
  characters:
  - {id: daniel, speaker: m, name: {es-Latn/standard: Daniel}}
  - {id: cachita, speaker: f, name: {es-Latn/standard: Abuela Cachita}}
  - {id: marisol, speaker: f, name: {es-Latn/standard: Tía Marisol}}
  - {id: yunior, speaker: m, name: {es-Latn/standard: Yunior}}
  steps:
  - line:
      forms:
        es-Latn/standard:
          text: Es domingo. Daniel y Abuela hacen una videollamada a La Habana.
          tokens: [{surface: Es, sense: ser, form: 'form:pres-3s'}, {surface: domingo, sense: domingo}, {surface: Daniel, sense: daniel}, {surface: 'y', sense: 'y'}, {surface: Abuela, sense: abuela}, {surface: hacen, sense: hacer, form: 'form:pres-3p'}, {surface: una, sense: un}, {surface: videollamada, sense: videollamada}, {surface: a, sense: a}, {surface: La, sense: el}, {surface: Habana, sense: habana}]
      translations: {en: 'It''s Sunday. Daniel and Grandma are making a video call to Havana.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: ¡Mami! ¡Daniel! ¿Ustedes me oyen?
          tokens: [{surface: Mami, sense: mami}, {surface: Daniel, sense: daniel}, {surface: Ustedes, sense: ustedes}, {surface: me, sense: me}, {surface: oyen, sense: oír, form: 'form:pres-3p'}]
      translations: {en: 'Mom! Daniel! Can you hear me?'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Sí, tía, te oímos. ¿Cómo está la cosa por allá?
          tokens: [{surface: Sí, sense: sí}, {surface: tía, sense: tío}, {surface: te, sense: te}, {surface: oímos, sense: oír, form: 'form:pres-1p'}, {surface: Cómo, sense: cómo}, {surface: está, sense: estar, form: 'form:pres-3s'}, {surface: la, sense: el}, {surface: cosa, sense: cosa}, {surface: por, sense: por}, {surface: allá, sense: allá}]
      translations: {en: 'Yes, Auntie, we can hear you. How are things over there?'}
  - line:
      speaker: marisol
      ask: complete
      gap: sense:apagón
      distractors: ['sense:paquete', 'sense:regalo']
      forms:
        es-Latn/standard:
          text: Bien, pero anoche hubo un apagón de diez horas.
          tokens: [{surface: Bien, sense: bien}, {surface: pero, sense: pero}, {surface: anoche, sense: anoche}, {surface: hubo, sense: haber, form: 'form:pret-3s'}, {surface: un, sense: un}, {surface: apagón, sense: apagón}, {surface: de, sense: de}, {surface: diez, sense: diez}, {surface: horas, sense: hora}]
      translations: {en: 'Fine, but last night there was a ten-hour blackout.'}
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: ¡Ay, mi'ja! Me preocupa que no tengan corriente con este calor.
          tokens: [{surface: Ay, sense: ay}, {surface: "mi'ja", sense: mijo}, {surface: Me, sense: me}, {surface: preocupa, sense: preocupar, form: 'form:pres-3s'}, {surface: que, sense: que}, {surface: 'no', sense: 'no'}, {surface: tengan, sense: tener, form: 'form:subj'}, {surface: corriente, sense: corriente}, {surface: con, sense: con}, {surface: este, sense: este}, {surface: calor, sense: calor}]
      translations: {en: 'Oh, honey! I worry that you have no power in this heat.'}
  - line:
      speaker: yunior
      ask: complete
      gap: sense:corriente
      distractors: ['sense:cola', 'sense:pelota']
      forms:
        es-Latn/standard:
          text: No te preocupes, abuela. Ya vino la corriente.
          tokens: [{surface: 'No', sense: 'no'}, {surface: te, sense: te}, {surface: preocupes, sense: preocupar, form: 'form:imp-neg'}, {surface: abuela, sense: abuela}, {surface: Ya, sense: ya}, {surface: vino, sense: venir, form: 'form:pret-3s'}, {surface: la, sense: el}, {surface: corriente, sense: corriente}]
      translations: {en: 'Don''t worry, Grandma. The power''s back now.'}
  - choose:
      prompt: {en: 'What happened in Havana last night?'}
      options: [{en: There was a ten-hour blackout.}, {en: The package arrived.}, {en: Yunior lost his phone.}]
      answer: 0
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: ¡Qué bueno, primo! ¿Y el paquete? ¿Ya llegó?
          tokens: [{surface: Qué, sense: qué}, {surface: bueno, sense: bueno}, {surface: primo, sense: primo}, {surface: 'Y', sense: 'y'}, {surface: el, sense: el}, {surface: paquete, sense: paquete}, {surface: Ya, sense: ya}, {surface: llegó, sense: llegar, form: 'form:pret-3s'}]
      translations: {en: 'Great, cousin! And the package? Has it arrived yet?'}
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: Todavía no. Mami cree que llega el jueves, pero yo lo dudo.
          tokens: [{surface: Todavía, sense: todavía}, {surface: 'no', sense: 'no'}, {surface: Mami, sense: mami}, {surface: cree, sense: creer, form: 'form:pres-3s'}, {surface: que, sense: que}, {surface: llega, sense: llegar, form: 'form:pres-3s'}, {surface: el, sense: el}, {surface: jueves, sense: jueves}, {surface: pero, sense: pero}, {surface: yo, sense: yo}, {surface: lo, sense: lo}, {surface: dudo, sense: dudar, form: 'form:pres-1s'}]
      translations: {en: 'Not yet. Mom thinks it''s coming on Thursday, but I doubt it.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: Yunior, tú no crees nada.
          tokens: [{surface: Yunior, sense: yunior}, {surface: tú, sense: tú}, {surface: 'no', sense: 'no'}, {surface: crees, sense: creer, form: 'form:pres-2s'}, {surface: nada, sense: nada}]
      translations: {en: 'Yunior, you never believe anything.'}
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: Es que aquí todo llega tarde, mami.
          tokens: [{surface: Es, sense: ser, form: 'form:pres-3s'}, {surface: que, sense: que}, {surface: aquí, sense: aquí}, {surface: todo, sense: todo}, {surface: llega, sense: llegar, form: 'form:pres-3s'}, {surface: tarde, sense: tarde}, {surface: mami, sense: mami}]
      translations: {en: 'It''s just that everything gets here late, Mom.'}
  - choose:
      prompt: {en: 'Who doubts that the package will come on Thursday?'}
      options: [{en: Yunior}, {en: Tía Marisol}, {en: Abuela}]
      answer: 0
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Yunior, te congelaste. No te veo.
          tokens: [{surface: Yunior, sense: yunior}, {surface: te, sense: te}, {surface: congelaste, sense: congelarse, form: 'form:pret-2s'}, {surface: 'No', sense: 'no'}, {surface: te, sense: te}, {surface: veo, sense: ver, form: 'form:pres-1s'}]
      translations: {en: 'Yunior, you froze. I can''t see you.'}
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: ¡Ay, esta conexión! ¿Y ahora?
          tokens: [{surface: Ay, sense: ay}, {surface: esta, sense: este}, {surface: conexión, sense: conexión}, {surface: 'Y', sense: 'y'}, {surface: ahora, sense: ahora}]
      translations: {en: 'Ugh, this connection! What about now?'}
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: Ahora sí te vemos. Mi'ja, siento mucho que no puedas venir a la Nochebuena.
          tokens: [{surface: Ahora, sense: ahora}, {surface: sí, sense: sí}, {surface: te, sense: te}, {surface: vemos, sense: ver, form: 'form:pres-1p'}, {surface: "Mi'ja", sense: mijo}, {surface: siento, sense: sentir, form: 'form:pres-1s'}, {surface: mucho, sense: mucho}, {surface: que, sense: que}, {surface: 'no', sense: 'no'}, {surface: puedas, sense: poder, form: 'form:subj'}, {surface: venir, sense: venir}, {surface: a, sense: a}, {surface: la, sense: el}, {surface: Nochebuena, sense: nochebuena}]
      translations: {en: 'Now we can see you. Honey, I''m so sorry you can''t come for Christmas Eve.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: Yo también, mami. Los extraño mucho a todos.
          tokens: [{surface: Yo, sense: yo}, {surface: también, sense: también}, {surface: mami, sense: mami}, {surface: Los, sense: lo}, {surface: extraño, sense: extrañar, form: 'form:pres-1s'}, {surface: mucho, sense: mucho}, {surface: a, sense: a}, {surface: todos, sense: todo}]
      translations: {en: 'So am I, Mom. I miss you all so much.'}
  - line:
      speaker: daniel
      ask: arrange
      forms:
        es-Latn/standard:
          text: Es posible que yo vaya a Cuba en el verano.
          tokens: [{surface: Es, sense: ser, form: 'form:pres-3s'}, {surface: posible, sense: posible}, {surface: que, sense: que}, {surface: yo, sense: yo}, {surface: vaya, sense: ir, form: 'form:subj'}, {surface: a, sense: a}, {surface: Cuba, sense: cuba}, {surface: en, sense: en}, {surface: el, sense: el}, {surface: verano, sense: verano}]
      translations: {en: 'I might go to Cuba in the summer.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: ¡Qué bueno que vengas, mi amor!
          tokens: [{surface: Qué, sense: qué}, {surface: bueno, sense: bueno}, {surface: que, sense: que}, {surface: vengas, sense: venir, form: 'form:subj'}, {surface: mi, sense: mi}, {surface: amor, sense: amor}]
      translations: {en: 'How wonderful that you''re coming, my love!'}
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: ¡Ojalá que vengas, primo! Aquí te espero.
          tokens: [{surface: Ojalá, sense: ojalá}, {surface: que, sense: que}, {surface: vengas, sense: venir, form: 'form:subj'}, {surface: primo, sense: primo}, {surface: Aquí, sense: aquí}, {surface: te, sense: te}, {surface: espero, sense: esperar, form: 'form:pres-1s'}]
