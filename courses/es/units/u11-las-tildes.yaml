# Unit 11 (es): written accents, through texting Tía Marisol on WhatsApp. The pairs a missing tilde turns into
# another word (tú/tu, él/el, sí/si, mí/mi, té/te, sé/se, más), the question words (qué, cómo, dónde, cuándo,
# quién, cuál, cuánto, por qué) against their unaccented relatives (que, como, donde, cuando, porque), and the
# stress that is the tense (hablo/habló, llego/llegó, compro/compró).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u11
title: {en: 'Las tildes: Accent marks'}
cefr: A2
kcs:
- {id: 'sense:teléfono', gloss: {en: 'phone; telephone; phone number'}, forms: {es-Latn/standard: [teléfono]}, notes: {en: 'Stressed and written on the lé: te-LÉ-fo-no. ¿Cuál es tu teléfono? asks for the number. A mobile is el celular in Miami and most of Latin America, el móvil in Cuba and Spain.'}}
- {id: 'sense:nuevo', gloss: {en: 'new'}, forms: {es-Latn/standard: [nuevo]}, notes: {en: 'Nueva for a feminine noun. After the noun it means brand-new (mi teléfono nuevo); before it, another one (mi nuevo teléfono, my latest phone).'}}
- {id: 'sense:whatsapp', gloss: {en: 'WhatsApp'}, forms: {es-Latn/standard: [WhatsApp]}, notes: {en: 'How Cuban families talk across the Florida Straits: mensajes, audios (voice notes), fotos and video calls. In Cuba mobile data is expensive and the connection comes and goes, so short audios beat long calls.'}}
- {id: 'sense:mensaje', gloss: {en: 'message; text'}, forms: {es-Latn/standard: [mensaje]}, notes: {en: 'Spelled with j, like viaje. Un mensaje de texto, or just un mensaje: a text.'}}
- {id: 'sense:le', gloss: {en: '(to) him; (to) her; (to) you (usted); les: (to) them, (to) you all'}, forms: {es-Latn/standard: [le]}, notes: {en: 'Le escribo a mi tía: Spanish keeps le even when a mi tía follows. Les for more than one person, though in speech many Cubans say le for both.'}}
- {id: 'sense:escribir', gloss: {en: 'to write; to text'}, forms: {es-Latn/standard: [escribir]}, notes: {en: 'Escribirle a alguien: to text or write to someone. Textear is Miami Spanglish. Escribió (he wrote) has its accent; escribo (I write) has none.'}}
- {id: 'sense:llamar', gloss: {en: 'to call (on the phone); to call, to name'}, forms: {es-Latn/standard: [llamar]}, notes: {en: 'Te llamo: I''ll call you. Llamó (she called) and llamo (I call) differ only in the accent. To call back is devolver la llamada; llamar para atrás is English in Spanish words.'}}
- {id: 'sense:o', gloss: {en: 'or'}, forms: {es-Latn/standard: [o]}, notes: {en: 'Never with an accent: since 2010 not even between numbers (2 o 3). Before a word starting with o it becomes u: siete u ocho.'}}
- {id: 'sense:si', gloss: {en: 'if'}, forms: {es-Latn/standard: [si]}, notes: {en: 'No accent: si tú quieres, if you want. Sí, with its accent, is yes, and the yo sí of yo sí sé (I do know). Sí, si tú quieres: yes, if you want.'}}
- {id: 'sense:mandar', gloss: {en: 'to send; to order'}, forms: {es-Latn/standard: [mandar]}, notes: {en: 'Cubans send everything with mandar: un mensaje, una foto, un paquete a Cuba. Enviar is the formal word. Mandó (she sent) needs its accent; mando is I send.'}}
- {id: 'sense:foto', gloss: {en: 'photo; picture'}, forms: {es-Latn/standard: [foto]}, notes: {en: 'La foto, feminine though it ends in -o: it is short for la fotografía. Like la mano.'}}
- {id: 'sense:audio', gloss: {en: 'voice message; audio'}, forms: {es-Latn/standard: [audio]}, notes: {en: 'Mándame un audio: send me a voice note. Many Cuban relatives would rather talk than type, so the family chat fills up with audios.'}}
- {id: 'sense:más', gloss: {en: 'more; most; plus'}, forms: {es-Latn/standard: [más]}, notes: {en: 'Always with its accent when it means more: más que yo, more than me; el más rico, the tastiest. Mas without one is an old word for but (pero), met only in books.'}}
- {id: 'sense:mí', gloss: {en: 'me (after a preposition: para mí, a mí)'}, forms: {es-Latn/standard: [mí]}, notes: {en: 'With an accent: para mí, a mí me gusta. Without one, mi is my: para mí, mi abuela… With con it becomes conmigo.'}}
- {id: 'sense:ti', gloss: {en: 'you (after a preposition: para ti, a ti)'}, forms: {es-Latn/standard: [ti]}, notes: {en: 'Never with an accent, though many write tí: ti has no twin to be told apart from, unlike mí (me) and mi (my). With con it becomes contigo.'}}
- {id: 'sense:té', gloss: {en: 'tea'}, forms: {es-Latn/standard: [té]}, notes: {en: 'With an accent, to tell it from te (you: te llamo). Cubans drink coffee; tea, like tilo and manzanilla, is what Abuela makes when you are sick or nervous.'}}
- {id: 'sense:sin', gloss: {en: 'without'}, forms: {es-Latn/standard: [sin]}, notes: {en: 'The opposite of con: café con leche, café sin leche.'}}
- {id: 'sense:saber', gloss: {en: 'to know (a fact); to know how to'}, forms: {es-Latn/standard: [saber]}, notes: {en: 'Sé (I know) has an accent, to tell it from se (himself, herself: se llama). Sabes, sabe, sabemos, saben. Knowing a person or a place is conocer.'}}
- {id: 'sense:cuál', gloss: {en: 'which; what (¿cuál es…?)'}, forms: {es-Latn/standard: [cuál]}, notes: {en: 'English what before is is usually cuál: ¿Cuál es tu teléfono? What''s your number? Like every question word, it keeps its accent in questions inside a sentence: no sé cuál es.'}}
- {id: 'sense:porque', gloss: {en: 'because'}, forms: {es-Latn/standard: [porque]}, notes: {en: 'One word, no accent: porque, because. The question ¿por qué? (why) is two words, with an accent on qué. ¿Por qué no me llamas? Porque no tengo tu teléfono.'}}
- {id: 'sense:como.like', gloss: {en: 'like; as'}, forms: {es-Latn/standard: [como]}, notes: {en: 'No accent when it compares: como tu abuela, like your grandmother; escribo como hablo. With one it asks: ¿cómo?, no sé cómo. Como is also I eat (comer).'}}
- {id: 'sense:cuando', gloss: {en: 'when (not asking)'}, forms: {es-Latn/standard: [cuando]}, notes: {en: 'No accent when it joins two ideas: cuando llego, te escribo. With one when it asks, directly or not: ¿Cuándo llegas? No sé cuándo llega.'}}
- {id: 'sense:llegar', gloss: {en: 'to arrive; to get (somewhere)'}, forms: {es-Latn/standard: [llegar]}, notes: {en: 'Llego (I arrive) and llegó (he arrived) differ only by the accent, and the accent is the tense. Llegué (I arrived) keeps a u after the g. ¿Te llegó mi mensaje? Did you get my message? Llegar a la casa: to get home.'}}
- {id: 'sense:donde', gloss: {en: 'where (not asking): la casa donde vivo'}, forms: {es-Latn/standard: [donde]}, notes: {en: 'No accent when it joins: la casa donde vive. With one when it asks, directly or not: ¿Dónde vives? ¿Tú sabes dónde vive?'}}
- {id: 'sense:español', gloss: {en: 'Spanish (the language); Spanish (from Spain)'}, forms: {es-Latn/standard: [español]}, notes: {en: 'No capital in Spanish, like cubano and inglés. Many also call the language castellano. With ñ, which is a letter of its own.'}}
- {id: 'sense:tilde', gloss: {en: 'written accent mark (á, é, í, ó, ú)'}, forms: {es-Latn/standard: [tilde]}, notes: {en: 'La tilde is the mark you write; el acento is the stress you hear. Every word has a stressed syllable, but only some write it: those stressed on the last syllable that end in a vowel, n or s (café, llegó, avión); those stressed on the one before that end in anything else (fácil, lápiz); and every word stressed earlier (teléfono, sábado). Short words write one to tell twins apart: tú/tu, él/el, sí/si, mí/mi, té/te, sé/se, más/mas, dé/de.'}}
nodes:
- {id: es.u11.el-mensaje, kind: lesson, introduces: ['sense:teléfono', 'sense:nuevo', 'sense:whatsapp', 'sense:mensaje', 'sense:le', 'sense:escribir', 'sense:llamar', 'sense:o']}
- {id: es.u11.si-tu-quieres, kind: lesson, introduces: ['sense:si', 'sense:mandar', 'sense:foto', 'sense:audio', 'sense:más']}
- {id: es.u11.para-mi, kind: lesson, introduces: ['sense:mí', 'sense:ti', 'sense:té', 'sense:sin', 'sense:saber']}
- {id: es.u11.por-que, kind: lesson, introduces: ['sense:cuál', 'sense:porque']}
- {id: es.u11.cuando-llego, kind: lesson, introduces: ['sense:como.like', 'sense:cuando', 'sense:llegar', 'sense:donde']}
- {id: es.u11.hablo-hablo, kind: lesson, introduces: ['sense:español', 'sense:tilde']}
