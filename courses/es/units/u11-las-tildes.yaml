stories:
- id: es.story.u11
  node: es.u11.story
  title: {en: 'With accents'}
  characters:
  - {id: daniel, speaker: m, name: {es-Latn/standard: Daniel}}
  - {id: marisol, speaker: f, name: {es-Latn/standard: Tía Marisol}}
  - {id: yunior, speaker: m, name: {es-Latn/standard: Yunior}}
  steps:
  - line:
      forms:
        es-Latn/standard:
          text: Daniel le escribe a tía Marisol por WhatsApp.
          tokens: [{surface: Daniel, sense: daniel}, {surface: le, sense: le}, {surface: escribe, sense: escribir, form: 'form:pres-3s'}, {surface: a, sense: a}, {surface: tía, sense: tío}, {surface: Marisol, sense: marisol}, {surface: por, sense: por}, {surface: WhatsApp, sense: whatsapp}]
      translations: {en: Daniel texts Aunt Marisol on WhatsApp.}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Hola, tía. ¿Cómo tú estás? Te escribo en español.
          tokens: [{surface: Hola, sense: hola}, {surface: tía, sense: tío}, {surface: Cómo, sense: cómo}, {surface: tú, sense: tú}, {surface: estás, sense: estar, form: 'form:pres-2s'}, {surface: Te, sense: te}, {surface: escribo, sense: escribir, form: 'form:pres-1s'}, {surface: en, sense: en}, {surface: español, sense: español}]
      translations: {en: 'Hi, Auntie. How are you? I''m writing to you in Spanish.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: ¡Qué bien, mi vida! Y con tildes. Tú escribes como tu abuela.
          tokens: [{surface: Qué, sense: qué}, {surface: bien, sense: bien}, {surface: mi, sense: mi}, {surface: vida, sense: vida}, {surface: 'Y', sense: 'y'}, {surface: con, sense: con}, {surface: tildes, sense: tilde}, {surface: Tú, sense: tú}, {surface: escribes, sense: escribir, form: 'form:pres-2s'}, {surface: como, sense: como.like}, {surface: tu, sense: tu}, {surface: abuela, sense: abuela}]
      translations: {en: 'How nice, darling! And with accents. You write like your grandmother.'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Gracias, tía, pero yo no sé dónde van las tildes.
          tokens: [{surface: Gracias, sense: gracias}, {surface: tía, sense: tío}, {surface: pero, sense: pero}, {surface: yo, sense: yo}, {surface: 'no', sense: 'no'}, {surface: sé, sense: saber, form: 'form:pres-1s'}, {surface: dónde, sense: dónde}, {surface: van, sense: ir, form: 'form:pres-3p'}, {surface: las, sense: el}, {surface: tildes, sense: tilde}]
      translations: {en: 'Thanks, Auntie, but I don''t know where the accents go.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: Yo sí sé, mi vida. Tu mensaje está muy bien.
          tokens: [{surface: Yo, sense: yo}, {surface: sí, sense: sí}, {surface: sé, sense: saber, form: 'form:pres-1s'}, {surface: mi, sense: mi}, {surface: vida, sense: vida}, {surface: Tu, sense: tu}, {surface: mensaje, sense: mensaje}, {surface: está, sense: estar, form: 'form:pres-3s'}, {surface: muy, sense: muy}, {surface: bien, sense: bien}]
      translations: {en: 'I do, darling. Your message is just fine.'}
  - choose:
      prompt: {en: 'Why is Tía Marisol pleased?'}
      options: [{en: 'Daniel writes to her in Spanish, with accents.'}, {en: Daniel calls her on WhatsApp.}, {en: Daniel sends her a photo.}]
      answer: 0
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: ¿Cuándo tú llegas a La Habana?
          tokens: [{surface: Cuándo, sense: cuándo}, {surface: tú, sense: tú}, {surface: llegas, sense: llegar, form: 'form:pres-2s'}, {surface: a, sense: a}, {surface: La, sense: el}, {surface: Habana, sense: habana}]
      translations: {en: 'When do you get to Havana?'}
  - line:
      speaker: daniel
      ask: arrange
      forms:
        es-Latn/standard:
          text: Llego el sábado por la mañana.
          tokens: [{surface: Llego, sense: llegar, form: 'form:pres-1s'}, {surface: el, sense: el}, {surface: sábado, sense: sábado}, {surface: por, sense: por}, {surface: la, sense: el}, {surface: mañana, sense: mañana}]
      translations: {en: I get there on Saturday morning.}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: ¿Y tu mami? ¿Ella viene también?
          tokens: [{surface: 'Y', sense: 'y'}, {surface: tu, sense: tu}, {surface: mami, sense: mami}, {surface: Ella, sense: ella}, {surface: viene, sense: venir, form: 'form:pres-3s'}, {surface: también, sense: también}]
      translations: {en: 'And your mom? Is she coming too?'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: No, ella no puede. Pero te mandó café cubano.
          tokens: [{surface: 'No', sense: 'no'}, {surface: ella, sense: ella}, {surface: 'no', sense: 'no'}, {surface: puede, sense: poder, form: 'form:pres-3s'}, {surface: Pero, sense: pero}, {surface: te, sense: te}, {surface: mandó, sense: mandar, form: 'form:pret-3s'}, {surface: café, sense: café}, {surface: cubano, sense: cubano}]
      translations: {en: 'No, she can''t. But she sent you Cuban coffee.'}
  - line:
      speaker: marisol
      ask: complete
      gap: sense:mí
      distractors: ['sense:ti', 'sense:él']
      forms:
        es-Latn/standard:
          text: ¿Para mí? ¡Gracias, mi vida!
          tokens: [{surface: Para, sense: para}, {surface: mí, sense: mí}, {surface: Gracias, sense: gracias}, {surface: mi, sense: mi}, {surface: vida, sense: vida}]
      translations: {en: 'For me? Thank you, darling!'}
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: ¿Y para mí qué hay, primo?
          tokens: [{surface: 'Y', sense: 'y'}, {surface: para, sense: para}, {surface: mí, sense: mí}, {surface: qué, sense: qué}, {surface: hay, sense: hay}, {surface: primo, sense: primo}]
      translations: {en: 'And what is there for me, cousin?'}
  - line:
      speaker: daniel
      ask: complete
      gap: sense:nuevo
      distractors: ['sense:barato', 'sense:chiquito']
      forms:
        es-Latn/standard:
          text: Para ti hay un teléfono nuevo.
          tokens: [{surface: Para, sense: para}, {surface: ti, sense: ti}, {surface: hay, sense: hay}, {surface: un, sense: un}, {surface: teléfono, sense: teléfono}, {surface: nuevo, sense: nuevo}]
      translations: {en: 'For you, there''s a new phone.'}
  - choose:
      prompt: {en: 'What is Daniel bringing for Yunior?'}
      options: [{en: A new phone}, {en: Cuban coffee}, {en: A T-shirt}]
      answer: 0
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: ¡Asere, gracias! Aquí un teléfono cuesta mucho.
          tokens: [{surface: Asere, sense: asere}, {surface: gracias, sense: gracias}, {surface: Aquí, sense: aquí}, {surface: un, sense: un}, {surface: teléfono, sense: teléfono}, {surface: cuesta, sense: costar, form: 'form:pres-3s'}, {surface: mucho, sense: mucho}]
      translations: {en: 'Man, thanks! A phone costs a lot here.'}
  - line:
      speaker: yunior
      ask: arrange
      forms:
        es-Latn/standard:
          text: Primo, tú escribes con más tildes que yo.
          tokens: [{surface: Primo, sense: primo}, {surface: tú, sense: tú}, {surface: escribes, sense: escribir, form: 'form:pres-2s'}, {surface: con, sense: con}, {surface: más, sense: más}, {surface: tildes, sense: tilde}, {surface: que, sense: que}, {surface: yo, sense: yo}]
      translations: {en: 'Cousin, you write with more accents than I do.'}
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: ¡Porque tú no sabes dónde van, Yunior!
          tokens: [{surface: Porque, sense: porque}, {surface: tú, sense: tú}, {surface: 'no', sense: 'no'}, {surface: sabes, sense: saber, form: 'form:pres-2s'}, {surface: dónde, sense: dónde}, {surface: van, sense: ir, form: 'form:pres-3p'}, {surface: Yunior, sense: yunior}]
      translations: {en: 'Because you don''t know where they go, Yunior!'}
  - choose:
      prompt: {en: 'Who writes with more accents?'}
      options: [{en: Daniel}, {en: Yunior}, {en: They write the same.}]
      answer: 0
