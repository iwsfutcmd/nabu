# Unit 5 (es): numbers to a hundred, ¿cuánto?, tener … años, telling the time; prices in dollars and pesos,
# la cola (¿el último?) and birthdays; Lili's birthday.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u05
title: {en: 'Los números: numbers, prices and time'}
cefr: A1
kcs:
- {id: 'sense:dos', gloss: {en: two}, forms: {es-Latn/standard: [dos]}, notes: {en: 'In Cuban speech a final s is often softened or dropped (do'' cafecito''), but it is always written: dos.'}}
- {id: 'sense:tres', gloss: {en: three}, forms: {es-Latn/standard: [tres]}, notes: {en: 'Then trece (13) and treinta (30).'}}
- {id: 'sense:cuánto', gloss: {en: how much; how many}, forms: {es-Latn/standard: [cuánto]}, notes: {en: 'With its accent in questions. It agrees with its noun: ¿cuánta agua?, ¿cuántos tostones? ¿Cuánto es?: how much is it?'}}
- {id: 'sense:cuatro', gloss: {en: four}, forms: {es-Latn/standard: [cuatro]}, notes: {en: 'Fourteen is catorce and forty is cuarenta: no u in catorce.'}}
- {id: 'sense:cinco', gloss: {en: five}, forms: {es-Latn/standard: [cinco]}, notes: {en: 'Fifty is cincuenta, but fifteen is quince.'}}
- {id: 'sense:seis', gloss: {en: six}, forms: {es-Latn/standard: [seis]}, notes: {en: 'Seis has no accent, but dieciséis (16) and veintiséis (26) do.'}}
- {id: 'sense:siete', gloss: {en: seven}, forms: {es-Latn/standard: [siete]}, notes: {en: 'Seventy is setenta: the ie of siete becomes e.'}}
- {id: 'sense:ocho', gloss: {en: eight}, forms: {es-Latn/standard: [ocho]}, notes: {en: 'Eighty is ochenta.'}}
- {id: 'sense:nueve', gloss: {en: nine}, forms: {es-Latn/standard: [nueve]}, notes: {en: 'Ninety is noventa: nueve becomes nov-.'}}
- {id: 'sense:diez', gloss: {en: ten}, forms: {es-Latn/standard: [diez]}, notes: {en: 'Eleven to fifteen have names of their own: once, doce, trece, catorce, quince. Then dieciséis, diecisiete, dieciocho, diecinueve.'}}
- {id: 'sense:hora', gloss: {en: hour; time (of day)}, forms: {es-Latn/standard: [hora]}, notes: {en: 'The h is never said but always written. ¿Qué hora es? Es la una (one o''clock is singular); son las dos, son las tres.'}}
- {id: 'sense:uno', gloss: {en: one}, forms: {es-Latn/standard: [uno]}, notes: {en: 'Before a noun it is un or una: un dólar, una hora. Es la una: it''s one o''clock.'}}
- {id: 'sense:medio', gloss: {en: 'half; y media: half past'}, forms: {es-Latn/standard: [medio]}, notes: {en: 'Son las dos y media: it''s half past two. It agrees with its noun: media hora, half an hour.'}}
- {id: 'sense:veinte', gloss: {en: twenty}, forms: {es-Latn/standard: [veinte]}, notes: {en: 'Twenty-one to twenty-nine are one word: veintiuno, veintidós, veintitrés, veinticuatro… Mind the accents on veintidós, veintitrés and veintiséis.'}}
- {id: 'sense:quince', gloss: {en: fifteen}, forms: {es-Latn/standard: [quince]}, notes: {en: 'Y quince, or y cuarto: a quarter past. Los quince is a girl''s fifteenth-birthday party, the Cuban quinceañera.'}}
- {id: 'sense:a', gloss: {en: to; at}, forms: {es-Latn/standard: [a]}, notes: {en: 'A las dos: at two o''clock. ¿A qué hora?: at what time? ¡A comer!: let''s eat!'}}
- {id: 'sense:año', gloss: {en: year}, forms: {es-Latn/standard: [año]}, notes: {en: 'Tener … años: to be … years old (tengo veinticuatro años). Always write the ñ: without it, año becomes ano, a rude word (anus).'}}
- {id: 'sense:veinticuatro', gloss: {en: twenty-four}, forms: {es-Latn/standard: [veinticuatro]}, notes: {en: 'One word, like every number from 21 to 29.'}}
- {id: 'sense:diecinueve', gloss: {en: nineteen}, forms: {es-Latn/standard: [diecinueve]}, notes: {en: 'One word, like dieciséis, diecisiete and dieciocho: diez y nueve run together.'}}
- {id: 'sense:setenta', gloss: {en: seventy}, forms: {es-Latn/standard: [setenta]}, notes: {en: 'Setenta y nueve: from thirty-one on, tens and units are separate words joined by y.'}}
- {id: 'sense:dólar', gloss: {en: dollar}, forms: {es-Latn/standard: [dólar]}, notes: {en: 'Plural dólares, accent and all. Cuban slang for dollars: fulas.'}}
- {id: 'sense:cien', gloss: {en: a hundred; one hundred}, forms: {es-Latn/standard: [cien]}, notes: {en: 'Cien on its own and before a noun (cien pesos); ciento before other numbers: ciento uno, ciento veinte.'}}
- {id: 'sense:peso', gloss: {en: peso (money); weight}, forms: {es-Latn/standard: [peso]}, notes: {en: 'Cuba''s money is the peso cubano. In Miami, pesos often just means dollars: me costó veinte pesos.'}}
- {id: 'sense:treinta', gloss: {en: thirty}, forms: {es-Latn/standard: [treinta]}, notes: {en: 'Treinta y uno, treinta y dos: from thirty-one on, numbers are three words.'}}
- {id: 'sense:cincuenta', gloss: {en: fifty}, forms: {es-Latn/standard: [cincuenta]}, notes: {en: 'From cinco: cincuenta (50). But fifteen is quince.'}}
- {id: 'sense:feliz', gloss: {en: happy}, forms: {es-Latn/standard: [feliz]}, notes: {en: 'Plural felices: z becomes c before e. Besides Happy Birthday, Cubans sing Felicidades at a birthday.'}}
- {id: 'sense:cumpleaños', gloss: {en: birthday}, forms: {es-Latn/standard: [cumpleaños]}, notes: {en: 'Cumple + años: one word, the same in the singular and the plural. Write the ñ. Often shortened to el cumple; it also means the birthday party.'}}
- {id: 'sense:cola', gloss: {en: line; queue}, forms: {es-Latn/standard: [cola]}, notes: {en: 'Fila in Mexico and elsewhere. Cubans have stood in colas for bread, gasoline and everything else, and a cola has its etiquette: see último.'}}
- {id: 'sense:último', gloss: {en: last}, forms: {es-Latn/standard: [último]}, notes: {en: 'Joining a Cuban cola you ask ¿el último? (who''s last?). Whoever is last answers yo (yo soy el último; la última for a woman), you follow them, and you answer the next person. Written with its accent: ÚL-ti-mo.'}}
