# Unit 3 (es): the house in Hialeah. Estar for where things are, hay, en, al and del, aquí and ¿dónde?; the rooms
# (la sala, la cocina, el cuarto, el baño), el portal with Abuela's sillón, el patio with its mata de mango, and
# Abuela's ventilador. Tener calor, never estar caliente.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u03
title: {en: 'La casa: The house'}
cefr: A1
kcs:
- {id: 'sense:casa', gloss: {en: house; home}, forms: {es-Latn/standard: [casa]}, notes: {en: 'Mi casa: my house, my home. En casa: at home.'}}
- {id: 'sense:en', gloss: {en: in; on; at}, forms: {es-Latn/standard: [en]}, notes: {en: 'One word for in, on and at: en la casa, en el portal, en Hialeah.'}}
- {id: 'sense:hialeah', gloss: {en: Hialeah (a city in Miami-Dade)}, forms: {es-Latn/standard: [Hialeah]}, notes: {en: 'Next to Miami; most of its people are Cuban or of Cuban descent.'}}
- {id: 'sense:vivir', gloss: {en: to live}, forms: {es-Latn/standard: [vivir]}, notes: {en: 'Vivo, vives, vive, vivimos, viven. B and v sound the same in Spanish; vivir is spelled with two v''s.'}}
- {id: 'sense:dónde', gloss: {en: where}, forms: {es-Latn/standard: [dónde]}, notes: {en: 'With the accent when it asks. Cubans keep the subject before the verb: ¿Dónde tú vives?'}}
- {id: 'sense:aquí', gloss: {en: here}, forms: {es-Latn/standard: [aquí]}, notes: {en: 'Written with an accent on the í. Cubans say aquí far more than acá.'}}
- {id: 'sense:qué', gloss: {en: 'what; how (¡qué…!)'}, forms: {es-Latn/standard: [qué]}, notes: {en: '¡Qué calor!: it''s so hot! ¿Qué…? asks what. Written with the accent in both.'}}
- {id: 'sense:calor', gloss: {en: 'heat; tener calor: to be hot'}, forms: {es-Latn/standard: [calor]}, notes: {en: 'Tengo calor: I''m hot, I feel the heat. Never estoy caliente: that means aroused. El calor is masculine.'}}
- {id: 'sense:hay', gloss: {en: there is; there are}, forms: {es-Latn/standard: [hay]}, notes: {en: 'One form for both: hay un ventilador, hay dos cuartos. It sounds like ay (oh!), and close to ahí (there): three spellings to keep apart.'}}
- {id: 'sense:ventilador', gloss: {en: fan (electric)}, forms: {es-Latn/standard: [ventilador]}, notes: {en: 'Every Cuban grandmother has one, pointed straight at her. An abanico is a hand fan.'}}
- {id: 'sense:sala', gloss: {en: living room}, forms: {es-Latn/standard: [sala]}, notes: {en: 'The front room of a Cuban house: visits, the TV, the novela.'}}
- {id: 'sense:cocina', gloss: {en: kitchen; stove}, forms: {es-Latn/standard: [cocina]}, notes: {en: 'Also the stove itself, where the cafetera goes. Cocinar: to cook.'}}
- {id: 'sense:café', gloss: {en: coffee}, forms: {es-Latn/standard: [café]}, image: {file: ../images/coffee.svg, license: CC0-1.0, provenance: {author: 'llm:claude@0b7ee10fe47d', status: draft}, source: Drawn for Nabu (courses/images)}, notes: {en: 'Cuban coffee is espresso brewed with sugar: a cafecito is one shot; a colada is a larger cup, poured out to share in thimble-sized cups.'}}
- {id: 'sense:al', gloss: {en: to the; at the (a + el)}, forms: {es-Latn/standard: [al]}, notes: {en: 'A + el always becomes al: al lado, al patio. Not before la: a la cocina.'}}
- {id: 'sense:lado', gloss: {en: 'side; al lado de: next to'}, forms: {es-Latn/standard: [lado]}, notes: {en: 'Al lado de la sala: next to the living room. Al lado alone: next door.'}}
- {id: 'sense:cuarto', gloss: {en: room; bedroom}, forms: {es-Latn/standard: [cuarto]}, notes: {en: 'In Cuba el cuarto is the bedroom; habitación and dormitorio sound more formal. Cuarto is also a quarter.'}}
- {id: 'sense:baño', gloss: {en: bathroom}, forms: {es-Latn/standard: [baño]}, notes: {en: 'The ñ is a letter of its own: baño, never bano.'}}
- {id: 'sense:del', gloss: {en: of the; from the (de + el)}, forms: {es-Latn/standard: [del]}, notes: {en: 'De + el always becomes del: el cuarto del abuelo. Not before la (de la casa), nor before él, he (de él).'}}
- {id: 'sense:chiquito', gloss: {en: small; little}, forms: {es-Latn/standard: [chiquito]}, notes: {en: 'Cubans love -ico after a t: chiquitico, and ahoritica for right now. Pequeño is the textbook word.'}}
- {id: 'sense:pero', gloss: {en: but}, forms: {es-Latn/standard: [pero]}, notes: {en: 'One r. Perro, with a rolled double r, is a dog.'}}
- {id: 'sense:portal', gloss: {en: front porch}, forms: {es-Latn/standard: [portal]}, notes: {en: 'The Cuban portal: the porch in front of the house, with its rocking chairs. Porche elsewhere.'}}
- {id: 'sense:sillón', gloss: {en: rocking chair}, forms: {es-Latn/standard: [sillón]}, notes: {en: 'In Cuba a sillón is a rocking chair, the kind on every portal. Elsewhere sillón is an armchair, and a rocking chair a mecedora.'}}
- {id: 'sense:patio', gloss: {en: yard; backyard}, forms: {es-Latn/standard: [patio]}, notes: {en: 'A Cuban patio is the yard behind the house: the mango tree, the clothesline, the dominó table.'}}
- {id: 'sense:mata', gloss: {en: plant; tree (Cuban)}, forms: {es-Latn/standard: [mata]}, notes: {en: 'Cubans say mata de mango, mata de aguacate, where others say árbol (tree) or planta.'}}
- {id: 'sense:mango', gloss: {en: mango}, forms: {es-Latn/standard: [mango]}, notes: {en: 'The fruit, and in Cuban slang a good-looking person: ¡Qué mango!'}}
nodes:
