stories:
- id: es.story.u14
  node: es.u14.story
  title: {en: Frijoles dormidos}
  characters:
  - {id: daniel, speaker: m, name: {es-Latn/standard: Daniel}}
  - {id: cachita, speaker: f, name: {es-Latn/standard: Abuela Cachita}}
  - {id: lili, speaker: f, name: {es-Latn/standard: Lili}}
  - {id: pepe, speaker: m, name: {es-Latn/standard: Abuelo Pepe}}
  steps:
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Abuela, quiero hacer frijoles negros. ¿Cómo se hacen?
          tokens: [{surface: Abuela, sense: abuela}, {surface: quiero, sense: querer, form: 'form:pres-1s'}, {surface: hacer, sense: hacer}, {surface: frijoles, sense: frijol}, {surface: negros, sense: negro}, {surface: Cómo, sense: cómo}, {surface: se, sense: se.impersonal}, {surface: hacen, sense: hacer, form: 'form:pres-3p'}]
      translations: {en: 'Grandma, I want to make black beans. How do you make them?'}
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: Ven a la cocina, mi'jo. Primero, pon los frijoles en la olla de presión.
          tokens: [{surface: Ven, sense: venir, form: 'form:imp-tu'}, {surface: a, sense: a}, {surface: la, sense: el}, {surface: cocina, sense: cocina}, {surface: "mi'jo", sense: mijo}, {surface: Primero, sense: primero}, {surface: pon, sense: poner, form: 'form:imp-tu'}, {surface: los, sense: el}, {surface: frijoles, sense: frijol}, {surface: en, sense: en}, {surface: la, sense: el}, {surface: olla, sense: olla-de-presión}, {surface: de, sense: olla-de-presión}, {surface: presión, sense: olla-de-presión}]
      translations: {en: 'Come to the kitchen, honey. First, put the beans in the pressure cooker.'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: ¿Y el sofrito? ¿Cómo se hace?
          tokens: [{surface: 'Y', sense: 'y'}, {surface: el, sense: el}, {surface: sofrito, sense: sofrito}, {surface: Cómo, sense: cómo}, {surface: se, sense: se.impersonal}, {surface: hace, sense: hacer, form: 'form:pres-3s'}]
      translations: {en: 'And the sofrito? How do you make it?'}
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: Pica la cebolla, el ají y el ajo.
          tokens: [{surface: Pica, sense: picar, form: 'form:imp-tu'}, {surface: la, sense: el}, {surface: cebolla, sense: cebolla}, {surface: el, sense: el}, {surface: ají, sense: ají}, {surface: 'y', sense: 'y'}, {surface: el, sense: el}, {surface: ajo, sense: ajo}]
      translations: {en: 'Chop the onion, the pepper and the garlic.'}
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: Después, fríe todo en un poco de aceite.
          tokens: [{surface: Después, sense: después}, {surface: fríe, sense: freír, form: 'form:imp-tu'}, {surface: todo, sense: todo}, {surface: en, sense: en}, {surface: un, sense: un}, {surface: poco, sense: poco}, {surface: de, sense: de}, {surface: aceite, sense: aceite}]
      translations: {en: 'Then fry it all in a little oil.'}
  - line:
      speaker: lili
      ask: arrange
      forms:
        es-Latn/standard:
          text: Abuela, ¿cuánto comino se echa?
          tokens: [{surface: Abuela, sense: abuela}, {surface: cuánto, sense: cuánto}, {surface: comino, sense: comino}, {surface: se, sense: se.impersonal}, {surface: echa, sense: echar, form: 'form:pres-3s'}]
      translations: {en: 'Grandma, how much cumin do you put in?'}
  - line:
      speaker: cachita
      ask: complete
      gap: sense:echar
      distractors: ['sense:picar', 'sense:abrir']
      forms:
        es-Latn/standard:
          text: Un poco. ¡No eches mucho!
          tokens: [{surface: Un, sense: un}, {surface: poco, sense: poco}, {surface: 'No', sense: 'no'}, {surface: eches, sense: echar, form: 'form:imp-neg'}, {surface: mucho, sense: mucho}]
      translations: {en: 'A little. Don''t put in too much!'}
  - choose:
      prompt: {en: 'What goes into Abuela''s sofrito?'}
      options: [{en: 'Onion, pepper and garlic'}, {en: Yuca and sour orange}, {en: Rice and black beans}]
      answer: 0
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Abuela, ¿puedo abrir la olla de presión ahora?
          tokens: [{surface: Abuela, sense: abuela}, {surface: puedo, sense: poder, form: 'form:pres-1s'}, {surface: abrir, sense: abrir}, {surface: la, sense: el}, {surface: olla, sense: olla-de-presión}, {surface: de, sense: olla-de-presión}, {surface: presión, sense: olla-de-presión}, {surface: ahora, sense: ahora}]
      translations: {en: 'Grandma, can I open the pressure cooker now?'}
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: ¡No, no la abras!
          tokens: [{surface: 'No', sense: 'no'}, {surface: 'no', sense: 'no'}, {surface: la, sense: lo}, {surface: abras, sense: abrir, form: 'form:imp-neg'}]
      translations: {en: 'No, don''t open it!'}
  - line:
      speaker: pepe
      forms:
        es-Latn/standard:
          text: Una vez yo la abrí, y tu abuela no me habló por una semana.
          tokens: [{surface: Una, sense: un}, {surface: vez, sense: vez}, {surface: yo, sense: yo}, {surface: la, sense: lo}, {surface: abrí, sense: abrir, form: 'form:pret-1s'}, {surface: 'y', sense: 'y'}, {surface: tu, sense: tu}, {surface: abuela, sense: abuela}, {surface: 'no', sense: 'no'}, {surface: me, sense: me}, {surface: habló, sense: hablar, form: 'form:pret-3s'}, {surface: por, sense: por}, {surface: una, sense: un}, {surface: semana, sense: semana}]
      translations: {en: 'I opened it once, and your grandmother didn''t speak to me for a week.'}
  - choose:
      prompt: {en: 'What happened when Abuelo Pepe opened the pressure cooker?'}
      options: [{en: Abuela didn't speak to him for a week.}, {en: The beans were ready to eat.}, {en: Abuela gave him a cafecito.}]
      answer: 0
  - line:
      speaker: cachita
      forms:
        es-Latn/standard:
          text: Los frijoles no se comen hoy.
          tokens: [{surface: Los, sense: el}, {surface: frijoles, sense: frijol}, {surface: 'no', sense: 'no'}, {surface: se, sense: se.impersonal}, {surface: comen, sense: comer, form: 'form:pres-3p'}, {surface: hoy, sense: hoy}]
      translations: {en: 'The beans don''t get eaten today.'}
  - line:
      speaker: lili
      forms:
        es-Latn/standard:
          text: ¿No? ¿Y cuándo se comen?
          tokens: [{surface: 'No', sense: 'no'}, {surface: 'Y', sense: 'y'}, {surface: cuándo, sense: cuándo}, {surface: se, sense: se.impersonal}, {surface: comen, sense: comer, form: 'form:pres-3p'}]
      translations: {en: 'No? Then when do we eat them?'}
  - line:
      speaker: cachita
      ask: complete
      gap: sense:dormido
      distractors: ['sense:viejo', 'sense:rico']
      forms:
        es-Latn/standard:
          text: 'Mañana. Son frijoles dormidos: duermen toda la noche.'
          tokens: [{surface: Mañana, sense: mañana}, {surface: Son, sense: ser, form: 'form:pres-3p'}, {surface: frijoles, sense: frijol}, {surface: dormidos, sense: dormido}, {surface: duermen, sense: dormir, form: 'form:pres-3p'}, {surface: toda, sense: todo}, {surface: la, sense: el}, {surface: noche, sense: noche}]
      translations: {en: 'Tomorrow. They''re frijoles dormidos: they sleep all night.'}
  - line:
      speaker: pepe
      forms:
        es-Latn/standard:
          text: ¡Y mañana están muy ricos!
          tokens: [{surface: 'Y', sense: 'y'}, {surface: mañana, sense: mañana}, {surface: están, sense: estar, form: 'form:pres-3p'}, {surface: muy, sense: muy}, {surface: ricos, sense: rico}]
      translations: {en: 'And tomorrow they''re delicious!'}
  - choose:
      prompt: {en: 'Why does the family eat the beans tomorrow?'}
      options: [{en: Beans that rest overnight taste better.}, {en: The pressure cooker is broken.}, {en: There is no rice today.}]
      answer: 0
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: Mañana vengo a comer, abuela.
          tokens: [{surface: Mañana, sense: mañana}, {surface: vengo, sense: venir, form: 'form:pres-1s'}, {surface: a, sense: a}, {surface: comer, sense: comer}, {surface: abuela, sense: abuela}]
      translations: {en: 'I''m coming to eat tomorrow, Grandma.'}
  - line:
      speaker: pepe
      forms:
        es-Latn/standard:
          text: Ven, mi'jo. ¡Pero no abras la olla de presión!
          tokens: [{surface: Ven, sense: venir, form: 'form:imp-tu'}, {surface: "mi'jo", sense: mijo}, {surface: Pero, sense: pero}, {surface: 'no', sense: 'no'}, {surface: abras, sense: abrir, form: 'form:imp-neg'}, {surface: la, sense: el}, {surface: olla, sense: olla-de-presión}, {surface: de, sense: olla-de-presión}, {surface: presión, sense: olla-de-presión}]
      translations: {en: 'Come, kiddo. But don''t open the pressure cooker!'}
