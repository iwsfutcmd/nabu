# Unit 14 (es): cooking Cuban food with Abuela. Commands (tú: pica, échale, pon; usted and ustedes: venga, coman;
# negative: no eches, no abras) and the impersonal se of recipes (se pica, se fríe, se echa); picadillo, sofrito,
# mojo, yuca con mojo, ropa vieja, frijoles negros dormidos and the olla de presión.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u14
title: {en: 'La cocina cubana: Cuban cooking'}
cefr: B1
kcs:
- {id: 'form:imp-tu', gloss: {en: 'command, tú (¡habla!, ¡come!, ¡ven!)'}, notes: {en: 'Like the él form of the present: pica, echa, revuelve, fríe. Irregular: ven, pon, haz, di, sal, ten, ve. With a pronoun on the end it takes a written accent: échale, cómelos. Haz (do!) is not has (you have).'}}
- {id: 'sense:cocinar', gloss: {en: to cook}, forms: {es-Latn/standard: [cocinar]}, notes: {en: 'La cocina is the kitchen (and the stove); cocina is also she cooks. Generations of Cubans learned from Nitza Villapol''s cookbook and TV show, Cocina al minuto.'}}
- {id: 'sense:picadillo', gloss: {en: Cuban ground beef hash}, forms: {es-Latn/standard: [picadillo]}, notes: {en: 'Ground beef cooked in sofrito with tomato, olives and raisins (picadillo a la habanera), with white rice, black beans and maduros. From picar, to chop.'}}
- {id: 'sense:picar', gloss: {en: to chop; to dice; to cut up}, forms: {es-Latn/standard: [picar]}, notes: {en: 'In the Cuban kitchen picar is to chop: pica la cebolla. Pique, no piques: c becomes qu before e. Also to sting or to itch; spicy is picante (in Mexico, pica means it''s hot).'}}
- {id: 'sense:cebolla', gloss: {en: onion}, forms: {es-Latn/standard: [cebolla]}, notes: {en: 'With ll, though Cubans say it with a y sound. A heritage writer''s slip: ceboya.'}}
- {id: 'sense:ajo', gloss: {en: garlic}, forms: {es-Latn/standard: [ajo]}, notes: {en: 'Un diente de ajo: a clove of garlic. With j. Cuban cooking runs on it: mojo, sofrito, frijoles.'}}
- {id: 'sense:carne', gloss: {en: meat; beef}, forms: {es-Latn/standard: [carne]}, notes: {en: 'Carne alone often means beef (carne de res); carne molida is ground beef, carne de puerco is pork. Cubans say puerco where Spain says cerdo.'}}
- {id: 'sense:se.impersonal', gloss: {en: 'one; you (impersonal se: se pica, you chop)'}, forms: {es-Latn/standard: [se]}, notes: {en: 'The se of recipes and rules: se pica la cebolla, you chop the onion (the onion is chopped). With a plural the verb is plural: se pican la cebolla y el ají. Sé, with an accent, is I know.'}}
- {id: 'sense:ají', gloss: {en: sweet pepper; bell pepper (Cuban)}, forms: {es-Latn/standard: [ají]}, notes: {en: 'In Cuba ají is the sweet pepper (the little ají cachucha is the soul of a sofrito); a hot one is ají picante. Pimiento elsewhere. Plural: ajíes.'}}
- {id: 'sense:freír', gloss: {en: to fry}, forms: {es-Latn/standard: [freír]}, notes: {en: 'Fríe (it fries; fry!) keeps a written accent on the í, and so do fríes, frío and fría. Frito: fried (plátanos fritos).'}}
- {id: 'sense:aceite', gloss: {en: oil}, forms: {es-Latn/standard: [aceite]}, notes: {en: 'Aceite de oliva: olive oil. Abuela''s mother fried in manteca (lard).'}}
- {id: 'sense:sofrito', gloss: {en: 'sofrito: onion, garlic and pepper fried slowly'}, forms: {es-Latn/standard: [sofrito]}, notes: {en: 'Onion, garlic and ají fried slowly in oil, often with tomato, cumin and oregano: the start of picadillo, frijoles negros and ropa vieja.'}}
- {id: 'sense:echar', gloss: {en: to put in; to add; to throw}, forms: {es-Latn/standard: [echar]}, notes: {en: 'No h: echar, echa, eché (hecho, with an h, is from hacer). Échale sal: put some salt in it; adding le brings a written accent. Echar is what Cubans say for adding to a pot.'}}
- {id: 'sense:poco', gloss: {en: 'little; a little, a bit (un poco)'}, forms: {es-Latn/standard: [poco]}, notes: {en: 'Un poco de sal: a little salt. Un poquito: a tiny bit. Cubans also say un chin: un chin de sal.'}}
- {id: 'sense:sal', gloss: {en: salt}, forms: {es-Latn/standard: [sal]}, notes: {en: 'La sal: feminine. Sal is also the tú command of salir: ¡sal de la cocina!, get out of the kitchen.'}}
- {id: 'sense:comino', gloss: {en: cumin}, forms: {es-Latn/standard: [comino]}, notes: {en: 'With oregano and bay leaf (laurel), it seasons Cuban beans and picadillo. Me importa un comino: I couldn''t care less.'}}
- {id: 'sense:yuca', gloss: {en: cassava; yuca}, forms: {es-Latn/standard: [yuca]}, notes: {en: 'The starchy root, boiled and served con mojo, at every Nochebuena. Not the yucca plant of American gardens.'}}
- {id: 'sense:mojo', gloss: {en: Cuban garlic and sour-orange sauce}, forms: {es-Latn/standard: [mojo]}, notes: {en: 'Garlic crushed with salt, sour orange juice and hot oil, sometimes with cumin and onion. For yuca, and to marinate pork. Miami supermarkets sell it bottled; abuelas make it.'}}
- {id: 'sense:naranja-agria', gloss: {en: sour orange; bitter orange}, forms: {es-Latn/standard: [naranja agria]}, notes: {en: 'The Seville orange: too sour to eat, the juice of mojo. When there is none, Cubans in the US mix orange juice with lime. Agrio: sour.'}}
- {id: 'form:imp-ud', gloss: {en: 'command, usted or ustedes (¡hable!, ¡coman!)'}, notes: {en: '-ar verbs take e, -er and -ir verbs take a: pique, eche; coma, abra. Ustedes adds n: coman, vengan. Irregular: venga, ponga, haga. For elders and strangers (doña Ofelia), and for more than one person.'}}
- {id: 'sense:ropa-vieja', gloss: {en: ropa vieja (shredded beef stew)}, forms: {es-Latn/standard: [ropa vieja]}, notes: {en: 'Literally old clothes: beef cooked until it shreds like rags, then stewed in sofrito with tomato. With white rice, black beans and maduros, the Cuban plate.'}}
- {id: 'sense:don', gloss: {en: 'Don, Doña (title of respect before a first name)'}, forms: {es-Latn/standard: [don]}, notes: {en: 'Doña for a woman: doña Ofelia, don Pepe. Before a first name, never a surname alone, and lowercase inside a sentence. It shows respect, and goes with usted. With an ñ.'}}
- {id: 'sense:ofelia', gloss: {en: Ofelia (a name)}, forms: {es-Latn/standard: [Ofelia]}, notes: {en: 'Doña Ofelia, the neighbour in Hialeah, eighty years old. Everyone says usted to her, Abuela too.'}}
- {id: 'sense:olla-de-presión', gloss: {en: pressure cooker}, forms: {es-Latn/standard: [olla de presión]}, notes: {en: 'Every Cuban kitchen has one, for frijoles, carne and yuca, and every family has a story of one that blew. Una olla alone is a pot.'}}
- {id: 'form:imp-neg', gloss: {en: 'negative command (¡no hables!, ¡no coma!)'}, notes: {en: 'Tú: no eches, no abras, no revuelvas (the vowel swaps and an s is added). Usted: no eche, no abra. Spelling changes: no piques (c to qu), no pongas, no hagas.'}}
- {id: 'sense:revolver', gloss: {en: to stir; to mix}, forms: {es-Latn/standard: [revolver]}, notes: {en: 'Revuelve, no revuelvas: the o becomes ue when stressed. Cubans never stir the rice once the pot is covered. Revólver, with an accent, is a gun.'}}
- {id: 'sense:poner', gloss: {en: to put; to place}, forms: {es-Latn/standard: [poner]}, notes: {en: 'Pon (tú), ponga (usted), no pongas. Pongo: I put; puse, puso: I put, he put. Poner la mesa: to set the table.'}}
- {id: 'sense:abrir', gloss: {en: to open}, forms: {es-Latn/standard: [abrir]}, notes: {en: 'Abre (tú), abra (usted), no abras. Never open an olla de presión until it stops hissing.'}}
- {id: 'sense:dormido', gloss: {en: 'asleep; frijoles dormidos: beans left overnight'}, forms: {es-Latn/standard: [dormido]}, notes: {en: 'Frijoles negros dormidos: black beans cooked the day before and left to sleep overnight, so they come out thicker and tastier. Every Cuban cook swears by it.'}}
