# Unit 23 (es): Abuela's refranes and por and para. Camarón que se duerme se lo lleva la corriente; No hay mal que
# por bien no venga; Más vale tarde que nunca; Al que madruga, Dios lo ayuda (and No por mucho madrugar…); Dime con
# quién andas…; El que no llora no mama; Más sabe el diablo por viejo que por diablo; En casa del herrero, cuchillo de
# palo. Por and para side by side (gracias por, para ti; por la mañana, para mañana; por ti, para que + the present
# subjunctive), and Cuban idioms: estar en talla, coger lucha (¡no cojas lucha!), tirar un cabo, estar en el aire,
# dar muela.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u23
title: {en: 'Refranes: Abuela''s sayings'}
cefr: B2
kcs:
- {id: 'sense:refrán', gloss: {en: saying; proverb}, forms: {es-Latn/standard: [refrán]}, notes: {en: 'Refrán has an accent; the plural refranes does not. Un dicho says the same: como dice el dicho, as the saying goes. Cuban grandmothers end arguments with them, and a heritage speaker often knows the first half and not the second.'}}
- {id: 'sense:dormirse', gloss: {en: to fall asleep; to doze off}, forms: {es-Latn/standard: [dormirse]}, notes: {en: 'Dormir is to sleep; dormirse is to drop off: me dormí en la guagua. Overslept is me quedé dormido. The o becomes ue (se duerme) and, in the past, u (se durmió).'}}
- {id: 'sense:llevarse', gloss: {en: 'to take away; to carry off; llevarse bien: to get along'}, forms: {es-Latn/standard: [llevarse]}, notes: {en: 'Llevar is to take or carry; llevarse is to take away for good: la corriente se lo lleva. Me llevo bien con mi primo: I get along with my cousin.'}}
- {id: 'sense:camarón', gloss: {en: shrimp}, forms: {es-Latn/standard: [camarón]}, notes: {en: 'Camarón has an accent; camarones does not. Camarón que se duerme se lo lleva la corriente: the shrimp that dozes off is swept away by the current, you snooze, you lose. Cubans often say just the first half: ¡Camarón que se duerme…!'}}
- {id: 'sense:otro', gloss: {en: other; another}, forms: {es-Latn/standard: [otro]}, notes: {en: 'Never un otro: otro día, another day; otra vez, again; otro más, one more. Un otro comes from English another; in Spanish it is just otro.'}}
- {id: 'sense:examen', gloss: {en: exam; test}, forms: {es-Latn/standard: [examen]}, notes: {en: 'With x. No accent on examen, but the plural has one: exámenes, because the stress stays on the a.'}}
- {id: 'sense:aprender', gloss: {en: to learn}, forms: {es-Latn/standard: [aprender]}, notes: {en: 'Aprender a + infinitive: aprender a cocinar. Learn is aprender, teach is enseñar. Aprendemos (we learn) and aprendamos (that we learn): one letter is the mood.'}}
- {id: 'sense:mal.harm', gloss: {en: 'harm; a bad thing; evil (un mal, el mal)'}, forms: {es-Latn/standard: [mal]}, notes: {en: 'The noun: el bien y el mal, good and evil; un mal, a misfortune. No hay mal que por bien no venga: every cloud has a silver lining. The adverb mal (badly, ill) is spelled the same.'}}
- {id: 'sense:madrugar', gloss: {en: to get up very early; to be up before dawn}, forms: {es-Latn/standard: [madrugar]}, notes: {en: 'From la madrugada, the small hours. Al que madruga, Dios lo ayuda: the early bird catches the worm. But also no por mucho madrugar amanece más temprano: getting up earlier does not bring the dawn. Cubans keep both handy, to win either side of an argument.'}}
- {id: 'sense:dios', gloss: {en: God}, forms: {es-Latn/standard: [Dios]}, notes: {en: 'With a capital for God: ¡Ay, Dios mío!, gracias a Dios, si Dios quiere (God willing), which Cubans add to any plan. Dios te bendiga is one set expression.'}}
- {id: 'sense:valer', gloss: {en: 'to be worth; to cost; más vale: it''s better'}, forms: {es-Latn/standard: [valer]}, notes: {en: '¿Cuánto vale?: how much is it? (cuesta says the same). Más vale tarde que nunca: better late than never. ¡Vale! for OK is from Spain; Cubans and Miami say ¡dale! or ¡está bien!'}}
- {id: 'sense:diablo', gloss: {en: devil}, forms: {es-Latn/standard: [diablo]}, notes: {en: 'Más sabe el diablo por viejo que por diablo: the devil knows more from being old than from being the devil; wisdom comes with age. Here por gives the reason: because of.'}}
- {id: 'sense:andar', gloss: {en: 'to walk; to go around; andar con: to hang out with'}, forms: {es-Latn/standard: [andar]}, notes: {en: 'Andar con alguien: to go around with someone. ¿Con quién tú andas?: who are you hanging out with? The past is irregular: anduve, anduvo, never andé, andó.'}}
- {id: 'sense:llorar', gloss: {en: to cry}, forms: {es-Latn/standard: [llorar]}, notes: {en: 'Llorar is to cry tears; to cry out is gritar. With ll: llora, lloró.'}}
- {id: 'sense:mamar', gloss: {en: to suckle; to nurse (of a baby)}, forms: {es-Latn/standard: [mamar]}, notes: {en: 'El que no llora no mama: the baby who does not cry does not get fed; if you don''t ask, you don''t get. Mama (it nurses) has no accent; mamá (mom) has one on the last a.'}}
- {id: 'sense:cuchillo', gloss: {en: knife}, forms: {es-Latn/standard: [cuchillo]}, notes: {en: 'With ll. Cuchillo de palo: a wooden knife.'}}
- {id: 'sense:herrero', gloss: {en: blacksmith}, forms: {es-Latn/standard: [herrero]}, notes: {en: 'From hierro, iron; both with h, which no one says. En casa del herrero, cuchillo de palo: the blacksmith''s house has wooden knives; the shoemaker''s children go barefoot.'}}
- {id: 'sense:palo', gloss: {en: 'stick; wood; de palo: wooden'}, forms: {es-Latn/standard: [palo]}, notes: {en: 'Un palo de escoba: a broomstick. De palo: made of wood (cuchillo de palo).'}}
- {id: 'sense:talla', gloss: {en: 'size (of clothes); estar en talla: to be with it, looking sharp (Cuban)'}, forms: {es-Latn/standard: [talla]}, notes: {en: '¿Qué talla tú usas?: what size do you wear? In Cuban slang estar en talla is to be up to date, with it, looking good: ese pulóver está en talla. Ponerse en talla: to get up to speed.'}}
- {id: 'sense:lucha', gloss: {en: 'fight; struggle; coger lucha: to get stressed (Cuban)'}, forms: {es-Latn/standard: [lucha]}, notes: {en: 'La lucha is the daily struggle: estamos en la lucha. Coger lucha, Cuban: to get stressed, worked up; ¡no cojas lucha!: don''t sweat it! Cojas is written with j, like cojo.'}}
- {id: 'sense:salir', gloss: {en: 'to go out; to leave; to come out; salir bien: to turn out well'}, forms: {es-Latn/standard: [salir]}, notes: {en: 'Salir de Cuba: to leave Cuba. Yo salgo, with a g. Todo va a salir bien: everything will turn out fine. Leaving something behind is dejar: dejé las llaves en la casa, I left my keys at home.'}}
- {id: 'sense:cabo', gloss: {en: 'end (of a rope); rope; tirar un cabo: to help out (Cuban)'}, forms: {es-Latn/standard: [cabo]}, notes: {en: 'A sailor''s word: un cabo is a rope. Tirar un cabo, Cuban: to throw someone a rope, to give them a hand: ¡tírame un cabo! Elsewhere echar una mano. Also a cape (Cabo de San Antonio) and a corporal.'}}
- {id: 'sense:aire', gloss: {en: 'air; estar en el aire: to be lost, not to get it (Cuban)'}, forms: {es-Latn/standard: [aire]}, notes: {en: 'Cubans in Miami say el aire for the air conditioning (el aire acondicionado). Estar en el aire, Cuban: to have no idea what is going on; elsewhere a plan that is en el aire is up in the air.'}}
- {id: 'sense:dar', gloss: {en: to give}, forms: {es-Latn/standard: [dar]}, notes: {en: 'Doy, das, da; di, dio, without accents. Dé, with one, is the subjunctive: que te dé. ¡Dale!: OK, go ahead, let''s go (Cuba and Miami). Dar muela: to talk someone''s ear off.'}}
- {id: 'sense:muela', gloss: {en: 'molar (tooth); dar muela: to talk on and on (Cuban)'}, forms: {es-Latn/standard: [muela]}, notes: {en: 'Me duele una muela: I have a toothache. Dar muela, Cuban: to talk and talk, to sweet-talk or talk someone into something; ¡qué muela!: what a lot of talk.'}}
