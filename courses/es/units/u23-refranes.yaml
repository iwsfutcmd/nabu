          tokens: [{surface: Daniel, lexeme: daniel}, {surface: se, lexeme: se}, {surface: levanta, lexeme: levantarse, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: tarde, lexeme: tarde}, {surface: y, lexeme: y}, {surface: llega, lexeme: llegar, feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}}, {surface: a, lexeme: a, n: 7, head: 9, rel: case}, {surface: la, lexeme: el, feats: {Gender: Fem, Number: Sing}, n: 8, head: 9, rel: det}, {surface: cocina, lexeme: cocina, feats: {Number: Sing}, n: 9}]
