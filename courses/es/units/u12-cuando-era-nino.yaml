# Unit 12 (es): the imperfect (era, iba, había, vivía, jugaba, tenía) through childhood memories. Daniel growing up
# in Hialeah (pelota in the street, Saturdays at Abuela's, la novela at night); Abuela Cachita's childhood in the
# Matanzas countryside (el bohío, no light, las gallinas, el río, el papalote, la quimbumbia).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u12
title: {en: 'Cuando era niño: When I was a boy'}
cefr: A2
kcs:
- {id: 'form:impf', gloss: {en: 'imperfect: was …ing, used to (hablaba, comía, era, iba)'}, notes: {en: 'For what used to happen or was going on, and to describe the past: cuando era niño, vivía en Hialeah. -aba for -ar verbs (jugaba; the we form writes an accent: jugábamos), -ía for -er and -ir verbs (tenía, vivía: always an accent on the í). Only three are irregular: era (ser), iba (ir), veía (ver). Hay becomes había, there was or there were. Many say habían muchos niños; it is written había, singular.'}}
- {id: 'sense:niño', gloss: {en: 'child; boy (niña: girl)'}, forms: {es-Latn/standard: [niño]}, notes: {en: 'De niño: as a child (de niña for a girl). Cubans often say chiquito instead: cuando yo era chiquito. With ñ: niño, never nino.'}}
- {id: 'sense:escuela', gloss: {en: 'school'}, forms: {es-Latn/standard: [escuela]}, notes: {en: 'Ir a la escuela: to go to school. In Cuba the uniform shows the level: wine red in primaria, mustard yellow in secundaria, blue in the pre (high school).'}}
- {id: 'sense:todo', gloss: {en: 'all; every; everything; everyone (todos)'}, forms: {es-Latn/standard: [todo]}, notes: {en: 'Todos los días: every day. Todo el día: all day long. Toda la familia: the whole family.'}}
- {id: 'sense:amigo', gloss: {en: 'friend'}, forms: {es-Latn/standard: [amigo]}, notes: {en: 'Amiga for a woman. Cubans also say mi socio, and asere among men.'}}
- {id: 'sense:montar', gloss: {en: 'to ride; to get on'}, forms: {es-Latn/standard: [montar]}, notes: {en: 'Cubans say montar bicicleta and montar caballo, with no en: montábamos bicicleta. Montarse en la guagua: to get on the bus.'}}
- {id: 'sense:bicicleta', gloss: {en: 'bicycle; bike'}, forms: {es-Latn/standard: [bicicleta]}, notes: {en: 'La bici for short. In the hard 1990s (el Período Especial), when there was no fuel for the buses, Chinese bicycles filled the streets of Havana.'}}
- {id: 'sense:campo', gloss: {en: 'countryside; the country; field'}, forms: {es-Latn/standard: [campo]}, notes: {en: 'In Cuba el campo is everywhere outside the towns, and a guajiro is someone from it. Un campo de pelota: a baseball field.'}}
- {id: 'sense:pobre', gloss: {en: 'poor'}, forms: {es-Latn/standard: [pobre]}, notes: {en: 'Before a noun it means unfortunate: ¡pobre Yunior!, poor Yunior.'}}
- {id: 'sense:bohío', gloss: {en: 'thatched hut (rural Cuba)'}, forms: {es-Latn/standard: [bohío]}, notes: {en: 'The Taíno word for the Cuban country house: walls of palm boards, a roof of palm leaves (guano), a dirt floor. Bo-hí-o: the í is stressed, so it takes the accent.'}}
- {id: 'sense:pueblo', gloss: {en: 'town; village; people'}, forms: {es-Latn/standard: [pueblo]}, notes: {en: 'Mi pueblo: my home town. It is also a people: el pueblo cubano.'}}
- {id: 'sense:luz', gloss: {en: 'light; electricity, power (Cuban)'}, forms: {es-Latn/standard: [luz]}, notes: {en: 'Cubans call electricity la luz: se fue la luz, the power went out; no hay luz, there is no power. Plural luces: z becomes c before e.'}}
- {id: 'sense:gallina', gloss: {en: 'hen; chicken (the bird)'}, forms: {es-Latn/standard: [gallina]}, notes: {en: 'The live bird; on the table it is pollo. El gallo: the rooster. Acostarse con las gallinas: to go to bed very early.'}}
- {id: 'sense:caballo', gloss: {en: 'horse'}, forms: {es-Latn/standard: [caballo]}, notes: {en: 'A caballo: on horseback. Montar caballo (or a caballo): to ride. Spelled with b and ll.'}}
- {id: 'sense:río', gloss: {en: 'river'}, forms: {es-Latn/standard: [río]}, notes: {en: 'Rí-o, with an accent. Matanzas, the city of bridges, stands where the rivers San Juan and Yumurí reach the bay.'}}
- {id: 'sense:quimbumbia', gloss: {en: 'quimbumbia, a Cuban stick game (tipcat)'}, forms: {es-Latn/standard: [quimbumbia]}, notes: {en: 'Played with two sticks: a short one, pointed at both ends, is struck on its tip so it jumps up, then batted as far as it will go. A game of Cuban streets and yards from before video games.'}}
- {id: 'sense:papalote', gloss: {en: 'kite (Cuba, Mexico)'}, forms: {es-Latn/standard: [papalote]}, notes: {en: 'From Nahuatl papalotl, butterfly. Elsewhere it is a cometa, a volantín or a barrilete. Cuban children made their own, of paper, thread and thin sticks.'}}
- {id: 'sense:empinar', gloss: {en: 'to fly (a kite) (Cuban); to raise; to tip up'}, forms: {es-Latn/standard: [empinar]}, notes: {en: 'Empinar papalote is Cuban; most other countries say volar una cometa.'}}
- {id: 'sense:nos', gloss: {en: 'us; ourselves; each other'}, forms: {es-Latn/standard: [nos]}, notes: {en: 'Nos bañábamos: we bathed (ourselves). Abuelo nos hacía papalotes: Grandpa made kites for us.'}}
- {id: 'sense:antes', gloss: {en: 'before; in the old days'}, forms: {es-Latn/standard: [antes]}, notes: {en: 'With the imperfect it is the old days: antes no había teléfono. Antes de: before something (antes de comer).'}}
- {id: 'sense:contestar', gloss: {en: 'to answer; to reply'}, forms: {es-Latn/standard: [contestar]}, notes: {en: 'Contestar el teléfono, contestar un mensaje. Responder is more formal.'}}
- {id: 'sense:inglés', gloss: {en: 'English'}, forms: {es-Latn/standard: [inglés]}, notes: {en: 'No capital in Spanish, and an accent on the singular only: inglés, but inglesa, ingleses. Many Cuban-American children answer their grandparents in English while understanding every word.'}}
