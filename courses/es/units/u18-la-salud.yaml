# Unit 18 (es): health. Doler (me duele la cabeza, le duelen las rodillas), sentirse, tener que and deber; the body;
# Abuelo Pepe's check-up, talking to the doctor with usted and following her usted commands (tome, camine, vaya);
# la presión, el azúcar, la pastilla, la receta, la farmacia, el turno; Abuela's remedies (el tilo, la manzanilla,
# el cocimiento).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u18
title: {en: 'La salud: Health'}
cefr: B1
kcs:
- {id: 'sense:doler', gloss: {en: 'to hurt; to ache (me duele: it hurts me)'}, forms: {es-Latn/standard: [doler]}, notes: {en: 'Works like gustar: me duele la cabeza (my head hurts), me duelen los pies (my feet hurt). Spanish says la cabeza, not mi cabeza: "mi cabeza duele" is English in Spanish words. O becomes ue: duele, duelen.'}}
- {id: 'sense:cabeza', gloss: {en: head}, forms: {es-Latn/standard: [cabeza]}, notes: {en: 'Written with z. Dolor de cabeza: a headache. Cubans say tengo tremendo dolor de cabeza, with no un.'}}
- {id: 'sense:estómago', gloss: {en: stomach}, forms: {es-Latn/standard: [estómago]}, notes: {en: 'With an accent on the first o. La barriga is the belly, the word for children and for home.'}}
- {id: 'sense:espalda', gloss: {en: back (of the body)}, forms: {es-Latn/standard: [espalda]}, notes: {en: 'Only the body part. Coming back is volver, and the back of a house is el fondo.'}}
- {id: 'sense:cuerpo', gloss: {en: body}, forms: {es-Latn/standard: [cuerpo]}, notes: {en: 'Me duele el cuerpo (or todo el cuerpo): I ache all over, the first sign of a catarro (cold) or a gripe (flu).'}}
- {id: 'sense:sentirse', gloss: {en: 'to feel (well, ill, tired)'}, forms: {es-Latn/standard: [sentirse]}, notes: {en: 'Me siento bien, ¿cómo se siente usted? E becomes ie: siento, sientes. Without se, sentir is to feel something or to be sorry (lo siento). Me siento is also I sit down (sentarse).'}}
- {id: 'sense:mal', gloss: {en: 'badly; ill; unwell'}, forms: {es-Latn/standard: [mal]}, notes: {en: 'The opposite of bien: me siento mal. Before a masculine noun malo becomes mal too: un mal día. ¡Qué mal!: how awful.'}}
- {id: 'sense:pecho', gloss: {en: chest}, forms: {es-Latn/standard: [pecho]}, notes: {en: 'A pain in the chest (un dolor en el pecho) is a reason to call 911 in Miami, not to wait for the turno.'}}
- {id: 'sense:rodilla', gloss: {en: knee}, forms: {es-Latn/standard: [rodilla]}, notes: {en: 'With ll. De rodillas: on your knees.'}}
- {id: 'sense:corazón', gloss: {en: heart}, forms: {es-Latn/standard: [corazón]}, notes: {en: 'Accent on the last syllable; the plural corazones has none. Also a pet name: mi corazón, sweetheart.'}}
- {id: 'sense:médico', gloss: {en: doctor; physician}, forms: {es-Latn/standard: [médico]}, notes: {en: 'With an accent on the é: medico without it is I medicate. Ir al médico: to go to the doctor''s. A woman is la médica (or la doctora). In Cuba every neighbourhood has its médico de la familia.'}}
- {id: 'sense:turno', gloss: {en: 'appointment (Cuban); turn'}, forms: {es-Latn/standard: [turno]}, notes: {en: 'Cubans say tener turno con el médico; most other places, and many in Miami, say tener cita. Also your turn in a game or a line: ahora es mi turno.'}}
- {id: 'sense:salud', gloss: {en: 'health; ¡salud!: bless you; cheers'}, forms: {es-Latn/standard: [salud]}, notes: {en: '¡Salud! after a sneeze, and when glasses are raised. La salud es lo primero: health comes first.'}}
- {id: 'sense:doctor', gloss: {en: 'doctor (what you call one: doctora for a woman)'}, forms: {es-Latn/standard: [doctor]}, notes: {en: 'What a patient calls a physician to their face: Buenos días, doctora. Written in small letters in a sentence; Dr. and Dra. before a name. El médico is the job; doctor is the title.'}}
- {id: 'sense:presión', gloss: {en: 'pressure; blood pressure'}, forms: {es-Latn/standard: [presión]}, notes: {en: 'Short for la presión arterial. Tener la presión alta: to have high blood pressure. The doctor''s next question is about el azúcar: tener azúcar, or tener el azúcar alta, is how Cubans say diabetes.'}}
- {id: 'sense:alto', gloss: {en: 'high; tall; loud'}, forms: {es-Latn/standard: [alto]}, notes: {en: 'Alta with feminine nouns: la presión alta. Daniel es alto: Daniel is tall. Hablar alto: to talk loudly.'}}
- {id: 'sense:tener-que', gloss: {en: 'to have to (tener que + infinitive)'}, forms: {es-Latn/standard: [tener que]}, notes: {en: 'Tengo que ir: I have to go; tener changes, que does not. Stronger than deber (should). With nobody in particular: hay que caminar, one has to walk.'}}
- {id: 'sense:pastilla', gloss: {en: pill; tablet}, forms: {es-Latn/standard: [pastilla]}, notes: {en: 'La pastilla de la presión: the blood-pressure pill. Also a lozenge or a hard sweet: una pastilla de menta.'}}
- {id: 'sense:deber', gloss: {en: 'should; must; to owe'}, forms: {es-Latn/standard: [deber]}, notes: {en: 'Usted debe descansar: you should rest. No debe: you shouldn''t. Debo cien dólares: I owe a hundred dollars.'}}
- {id: 'sense:descansar', gloss: {en: to rest}, forms: {es-Latn/standard: [descansar]}, notes: {en: 'Descanse: rest (usted). ¡Que descanses!: sleep well, to someone going to bed.'}}
- {id: 'sense:receta', gloss: {en: 'prescription; recipe'}, forms: {es-Latn/standard: [receta]}, notes: {en: 'Both the doctor''s prescription and Abuela''s recipe for flan. Sin receta: over the counter.'}}
- {id: 'sense:farmacia', gloss: {en: 'pharmacy; drugstore'}, forms: {es-Latn/standard: [farmacia]}, notes: {en: 'Written with f, never ph. Families in Miami send medicines from the farmacia to relatives in Cuba.'}}
- {id: 'sense:cocimiento', gloss: {en: 'herbal tea (a home remedy, boiled)'}, forms: {es-Latn/standard: [cocimiento]}, notes: {en: 'Cuban for a remedy of boiled leaves or flowers: un cocimiento de caña santa (lemongrass) for a cold, de manzanilla for the stomach. Elsewhere un té or una infusión.'}}
- {id: 'sense:manzanilla', gloss: {en: 'chamomile; chamomile tea'}, forms: {es-Latn/standard: [manzanilla]}, notes: {en: 'For the stomach and for sleep. In Spain it is also a dry sherry.'}}
- {id: 'sense:tilo', gloss: {en: 'linden tea (for the nerves)'}, forms: {es-Latn/standard: [tilo]}, notes: {en: 'The Cuban remedy for nerves: bad news, a scare or a family fight, and someone runs to make un tilo. ¡Tómate un tilo!: calm down!'}}
