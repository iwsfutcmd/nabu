# Unit 27 (es): José Martí, read as a Cuban family reads him. His life (Havana 1853, prison and exile, New York,
# Dos Ríos 1895; el Apóstol, el héroe nacional, la patria libre); the poet of Versos sencillos (1891) and La Edad de
# Oro; the words of the two poems every Cuban knows, Yo soy un hombre sincero (I) and Cultivo una rosa blanca (XXXIX);
# the Guantanamera, which sings the first; the imperfect subjunctive met in reading (quería que Cuba fuera libre, me
# pidió que leyera, como si hablara). The story's verse lines come from Wikisource through marti_story.py (public domain).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u27
title: {en: 'José Martí: the poet of Cuba'}
cefr: B2
kcs:
- {id: 'sense:martí', gloss: {en: 'José Martí (1853–1895), Cuba''s national hero and poet'}, forms: {es-Latn/standard: [Martí]}, notes: {en: 'Born in Havana in 1853, jailed at sixteen for his ideas and deported to Spain, he spent most of his life in exile, from 1880 mostly in New York, writing and organizing the war of independence. He landed in Cuba in April 1895 and was killed at Dos Ríos, in the east, on 19 May. Mar-tí, with the accent on the í. Cubans call him el Apóstol, and the best-known verses of Guantanamera are his.'}}
- {id: 'sense:héroe', gloss: {en: 'hero'}, forms: {es-Latn/standard: [héroe]}, notes: {en: 'With an accent: hé-ro-e, three syllables. Martí is el Héroe Nacional: his birthday, 28 January, is marked in Cuban schools, and his bust stands in schools and parks in Havana and in Miami. A woman is una heroína.'}}
- {id: 'sense:josé', gloss: {en: 'José (a name; Pepe for short)'}, forms: {es-Latn/standard: [José]}, notes: {en: 'At home a José is Pepe, like Abuelo Pepe; Martí was Pepe to his family too. Jo-sé, with the accent on the é.'}}
- {id: 'sense:apóstol', gloss: {en: 'apostle; el Apóstol: José Martí'}, forms: {es-Latn/standard: [apóstol]}, notes: {en: 'El Apóstol (de la independencia) is what Cubans call Martí, who gave his life to preaching it. A-pós-tol, with an accent; plural apóstoles. A Martí le dicen el Apóstol: le dicen, they call him, is how Cubans say it.'}}
- {id: 'sense:morir', gloss: {en: 'to die (morirse: to die, to pass away)'}, forms: {es-Latn/standard: [morir]}, notes: {en: 'O becomes ue (muere, mueren) or u (murió, murieron, muriendo); the participle is muerto. Morirse is the everyday word for a death (se murió anoche), and the one in Martí''s verse antes de morirme. Me muero de hambre: I''m starving.'}}
- {id: 'sense:luchar', gloss: {en: 'to fight; to struggle; (Cuban) to hustle, to get by'}, forms: {es-Latn/standard: [luchar]}, notes: {en: 'Luchar por: to fight for (luchó por la independencia). In Cuba luchar is also the daily struggle to get by: ¿Qué haces? Aquí, luchando. La lucha: the fight (coger lucha, unit 23).'}}
- {id: 'sense:libre', gloss: {en: 'free'}, forms: {es-Latn/standard: [libre]}, notes: {en: 'Free as in freedom: un país libre, un día libre. Free of charge is gratis. The same for a man or a woman. A Cuba libre is also rum and cola, a drink named for Cuba''s independence around 1900. After quería que the verb goes into the past subjunctive: Martí quería que Cuba fuera libre.'}}
- {id: 'sense:patria', gloss: {en: 'homeland; fatherland'}, forms: {es-Latn/standard: [patria]}, notes: {en: 'La patria, feminine, though it comes from padre. It was Martí''s word: Patria was the newspaper he founded in New York in 1892, and Patria es humanidad one of his sayings. Cubans abroad say la patria, or mi tierra, of the island.'}}
- {id: 'sense:nueva-york', gloss: {en: 'New York'}, forms: {es-Latn/standard: [Nueva York]}, notes: {en: 'Two words, both with capitals. Martí lived there from 1880 to 1895, with a stay in Venezuela: he wrote for newspapers all over Latin America and organized the Cuban exiles of New York, Tampa and Key West for the war. A New Yorker is un neoyorquino.'}}
- {id: 'sense:poeta', gloss: {en: 'poet'}, forms: {es-Latn/standard: [poeta]}, notes: {en: 'Ends in -a but is masculine: el poeta, like el turista; a woman is la poeta or la poetisa. Gran before a noun means great: un gran poeta. After it, grande means big.'}}
- {id: 'sense:poema', gloss: {en: 'poem'}, forms: {es-Latn/standard: [poema]}, notes: {en: 'Masculine despite the -a: el poema, like el problema and el idioma. La poesía is poetry, and also a single poem. Recitar un poema: to recite one.'}}
- {id: 'sense:verso', gloss: {en: 'line (of a poem); los versos: poems, poetry'}, forms: {es-Latn/standard: [verso]}, notes: {en: 'Un verso is one line of a poem; a stanza is una estrofa. Los versos is also poetry in general: los versos de Martí. With v. The Versos sencillos have eight syllables a line, the meter of the décima and of Cuban country song.'}}
- {id: 'sense:sencillo', gloss: {en: 'simple; plain; modest'}, forms: {es-Latn/standard: [sencillo]}, notes: {en: 'Una persona sencilla: a modest, down-to-earth person. Versos sencillos (Simple Verses, New York, 1891): forty-six short poems that Martí says came to him in the Catskill mountains, where he went to rest in 1890. With c and ll: sen-ci-llo, though Cubans say s and y.'}}
- {id: 'sense:leer', gloss: {en: 'to read'}, forms: {es-Latn/standard: [leer]}, notes: {en: 'Between vowels the i becomes y: leyó, leyeron, leyendo, leyera. Leer a Martí: the personal a goes before an author you read. Leer en voz alta: to read aloud.'}}
- {id: 'sense:libro', gloss: {en: 'book'}, forms: {es-Latn/standard: [libro]}, notes: {en: 'Un libro. A false friend: una librería is a bookshop; a library is una biblioteca.'}}
- {id: 'sense:edad-de-oro', gloss: {en: 'La Edad de Oro (The Golden Age), Martí''s magazine for children'}, forms: {es-Latn/standard: [Edad de Oro]}, notes: {en: 'A monthly magazine for the children of America that Martí wrote almost alone in New York in 1889: four issues of stories, poems and articles (Los zapaticos de rosa, Tres héroes). Gathered into a book, it is still what Cuban children read first of Martí.'}}
- {id: 'sense:hombre', gloss: {en: 'man'}, forms: {es-Latn/standard: [hombre]}, notes: {en: 'With a silent h: hom-bre; plural hombres. ¡Hombre! is also an exclamation: ¡Claro, hombre!, of course! Martí''s first poem in Versos sencillos opens with a sincere man saying who he is.'}}
- {id: 'sense:sincero', gloss: {en: 'sincere; honest'}, forms: {es-Latn/standard: [sincero]}, notes: {en: 'Sincera for a woman. Written with c, though Cubans say it with an s: sin-ce-ro. Para serte sincero: to be honest with you.'}}
- {id: 'sense:crecer', gloss: {en: 'to grow; to grow up'}, forms: {es-Latn/standard: [crecer]}, notes: {en: 'Plants and people grow: crecí en Hialeah, I grew up in Hialeah. Growing crops is cultivar or sembrar. Yo crezco, with zc; everything else with c: crece, creció. Criarse says the same of people: me crié en Hialeah.'}}
- {id: 'sense:palma', gloss: {en: 'palm (tree); palm (of the hand)'}, forms: {es-Latn/standard: [palma]}, notes: {en: 'In Cuba la palma is above all the royal palm (la palma real), the emblem of the island: Martí names it to say he comes from Cuba. La palma de la mano: the palm of the hand.'}}
- {id: 'sense:alma', gloss: {en: 'soul'}, forms: {es-Latn/standard: [alma]}, notes: {en: 'Feminine, but el alma and un alma, because it begins with a stressed a (like el agua): el alma cubana, las almas. Con el alma: with all my heart. Me llegó al alma: it moved me deeply.'}}
- {id: 'sense:guantanamera', gloss: {en: 'Guantanamera (the song: the girl from Guantánamo)'}, forms: {es-Latn/standard: [Guantanamera]}, notes: {en: 'Guajira guantanamera, a country song about a girl from Guantánamo, sung on Havana radio by Joseíto Fernández from the 1930s. The verses everyone knows were fitted to it later from Versos sencillos (the arrangement is credited to the composer Julián Orbón), and Pete Seeger took that version around the world in the 1960s.'}}
- {id: 'sense:memoria', gloss: {en: 'memory; de memoria: by heart'}, forms: {es-Latn/standard: [memoria]}, notes: {en: 'Saberse algo de memoria: to know it by heart; aprender de memoria: to learn it by heart, as Cuban schoolchildren learn Martí. A souvenir, or a memory of something, is un recuerdo.'}}
- {id: 'sense:entender', gloss: {en: 'to understand'}, forms: {es-Latn/standard: [entender]}, notes: {en: 'E becomes ie: entiendo, entiendes, entiende, entienden (but entendemos). ¿Me entiendes? Comprender means the same and sounds a little more formal. Many heritage speakers say entiendo todo, pero no lo hablo bien: understanding comes first, and speaking follows.'}}
- {id: 'sense:palabra', gloss: {en: 'word'}, forms: {es-Latn/standard: [palabra]}, notes: {en: 'La palabra, feminine. Dar la palabra: to give your word. Una palabrota: a swear word. ¿Qué quiere decir esta palabra?: what does this word mean? Unas palabras: a few words (quisiera decir unas palabras).'}}
- {id: 'sense:rosa', gloss: {en: 'rose; pink'}, forms: {es-Latn/standard: [rosa]}, notes: {en: 'La rosa, the flower; as a colour, rosa or rosado is pink. Martí''s best-known poem, XXXIX of Versos sencillos, is about the white rose he grows for friend and enemy alike.'}}
- {id: 'sense:julio', gloss: {en: 'July'}, forms: {es-Latn/standard: [julio]}, notes: {en: 'Months take no capital in Spanish: en julio, el 4 de julio. With j, which Cubans say softly, like an English h.'}}
- {id: 'sense:mano', gloss: {en: 'hand'}, forms: {es-Latn/standard: [mano]}, notes: {en: 'Feminine, though it ends in -o: la mano, las manos. Dar la mano: to shake hands, and to give a hand. Echar una mano: to help out. A mano: by hand. Among Cuban friends mano, from hermano, also means bro.'}}
- {id: 'sense:franco', gloss: {en: 'frank; open; candid'}, forms: {es-Latn/standard: [franco]}, notes: {en: 'Franca for a woman. Una mano franca is a hand held out openly, in friendship. Para serte franco: to be frank with you.'}}
- {id: 'sense:cruel', gloss: {en: 'cruel'}, forms: {es-Latn/standard: [cruel]}, notes: {en: 'The same for a man or a woman; plural crueles. El cruel: the cruel one. In the second half of the rose poem, Martí grows the white rose for the cruel one too: neither thistles nor nettles.'}}
