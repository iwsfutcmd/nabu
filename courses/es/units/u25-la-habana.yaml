scenarios:
- id: es.botero
  after: es.u25.el-almendron
  title: {en: 'A ride with a botero'}
  setting: {en: 'A hot morning on a corner of Calle San Lázaro in Centro Habana. Shared taxis (almendrones: 1950s American cars) run along fixed routes; you flag one down, say how far you are going, squeeze in with the other passengers and pay when you get out.'}
  character: {en: 'Reinaldo, a botero in his fifties who drives a 1956 Chevrolet he keeps running himself. Talkative and proud of his car and his city, he speaks fast and very Cuban (asere, mi hermano, ¿qué bolá?), and loves to test Cubans from Miami on their Spanish.'}
  goal: {en: 'Stop the almendrón and ask if it goes to El Capitolio, ask how much he charges, chat about the car and the city (describe the places you want to see with que, donde and lo que), ask him to let you off at a corner, then pay and thank him.'}
