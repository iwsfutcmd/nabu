stories:
- id: es.story.u25
  node: es.u25.story
  title: {en: 'By almendrón to the Capitolio'}
  characters:
  - {id: daniel, speaker: m, name: {es-Latn/standard: Daniel}}
  - {id: yunior, speaker: m, name: {es-Latn/standard: Yunior}}
  - {id: marisol, speaker: f, name: {es-Latn/standard: Tía Marisol}}
  - {id: botero, speaker: m, name: {es-Latn/standard: El botero}}
  steps:
  - line:
      speaker: marisol
      forms:
        es-Latn/standard:
          text: ¡Daniel, Yunior! El almendrón que va a La Habana Vieja está en la esquina.
          tokens: [{surface: Daniel, sense: daniel}, {surface: Yunior, sense: yunior}, {surface: El, sense: el}, {surface: almendrón, sense: almendrón}, {surface: que, sense: que}, {surface: va, sense: ir, form: 'form:pres-3s'}, {surface: a, sense: a}, {surface: La, sense: el}, {surface: Habana, sense: habana}, {surface: Vieja, sense: viejo}, {surface: está, sense: estar, form: 'form:pres-3s'}, {surface: en, sense: en}, {surface: la, sense: el}, {surface: esquina, sense: esquina}]
      translations: {en: 'Daniel, Yunior! The almendrón that goes to Old Havana is at the corner.'}
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: Vamos, primo. Ese botero es el que siempre me lleva.
          tokens: [{surface: Vamos, sense: ir, form: 'form:pres-1p'}, {surface: primo, sense: primo}, {surface: Ese, sense: ese}, {surface: botero, sense: botero}, {surface: es, sense: ser, form: 'form:pres-3s'}, {surface: el, sense: el}, {surface: que, sense: que}, {surface: siempre, sense: siempre}, {surface: me, sense: me}, {surface: lleva, sense: llevar, form: 'form:pres-3s'}]
      translations: {en: 'Let''s go, cousin. That driver is the one who always takes me.'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: ¿Y cuánto cobra?
          tokens: [{surface: 'Y', sense: 'y'}, {surface: cuánto, sense: cuánto}, {surface: cobra, sense: cobrar, form: 'form:pres-3s'}]
      translations: {en: 'And how much does he charge?'}
  - line:
      speaker: yunior
      ask: complete
      gap: sense:cobrar
      distractors: ['sense:pescar', 'sense:tender']
      forms:
        es-Latn/standard:
          text: 'Lo que cobran todos: cien pesos hasta el Capitolio.'
          tokens: [{surface: Lo, sense: lo-que}, {surface: que, sense: lo-que}, {surface: cobran, sense: cobrar, form: 'form:pres-3p'}, {surface: todos, sense: todo}, {surface: cien, sense: cien}, {surface: pesos, sense: peso}, {surface: hasta, sense: hasta}, {surface: el, sense: el}, {surface: Capitolio, sense: capitolio}]
      translations: {en: 'What they all charge: a hundred pesos to the Capitolio.'}
  - line:
      speaker: botero
      forms:
        es-Latn/standard:
          text: ¿Qué bolá? ¿Hasta dónde van?
          tokens: [{surface: Qué, sense: qué-bolá}, {surface: bolá, sense: qué-bolá}, {surface: Hasta, sense: hasta}, {surface: dónde, sense: dónde}, {surface: van, sense: ir, form: 'form:pres-3p'}]
      translations: {en: 'What''s up? How far are you going?'}
  - line:
      speaker: yunior
      forms:
        es-Latn/standard:
          text: Hasta el Capitolio, asere. Él es mi primo de Miami.
          tokens: [{surface: Hasta, sense: hasta}, {surface: el, sense: el}, {surface: Capitolio, sense: capitolio}, {surface: asere, sense: asere}, {surface: Él, sense: él}, {surface: es, sense: ser, form: 'form:pres-3s'}, {surface: mi, sense: mi}, {surface: primo, sense: primo}, {surface: de, sense: de}, {surface: Miami, sense: miami}]
      translations: {en: 'To the Capitolio, man. He''s my cousin from Miami.'}
  - line:
      speaker: botero
      forms:
        es-Latn/standard:
          text: ¿De Miami? ¿Y qué es lo que más te gusta de La Habana?
          tokens: [{surface: De, sense: de}, {surface: Miami, sense: miami}, {surface: 'Y', sense: 'y'}, {surface: qué, sense: qué}, {surface: es, sense: ser, form: 'form:pres-3s'}, {surface: lo, sense: lo-que}, {surface: que, sense: lo-que}, {surface: más, sense: más}, {surface: te, sense: te}, {surface: gusta, sense: gustar, form: 'form:pres-3s'}, {surface: de, sense: de}, {surface: La, sense: el}, {surface: Habana, sense: habana}]
      translations: {en: 'From Miami? And what do you like most about Havana?'}
  - line:
      speaker: daniel
      ask: arrange
      forms:
        es-Latn/standard:
          text: Lo que más me gusta es el Malecón.
          tokens: [{surface: Lo, sense: lo-que}, {surface: que, sense: lo-que}, {surface: más, sense: más}, {surface: me, sense: me}, {surface: gusta, sense: gustar, form: 'form:pres-3s'}, {surface: es, sense: ser, form: 'form:pres-3s'}, {surface: el, sense: el}, {surface: Malecón, sense: malecón}]
      translations: {en: 'What I like most is the Malecón.'}
  - choose:
      prompt: {en: 'What does Daniel like most about Havana?'}
      options: [{en: The Malecón}, {en: El Capitolio}, {en: The almendrones}]
      answer: 0
  - line:
      speaker: botero
      forms:
        es-Latn/standard:
          text: Esta máquina era de mi abuelo. Tiene setenta años.
          tokens: [{surface: Esta, sense: este}, {surface: máquina, sense: máquina}, {surface: era, sense: ser, form: 'form:impf'}, {surface: de, sense: de}, {surface: mi, sense: mi}, {surface: abuelo, sense: abuelo}, {surface: Tiene, sense: tener, form: 'form:pres-3s'}, {surface: setenta, sense: setenta}, {surface: años, sense: año}]
      translations: {en: 'This car was my grandfather''s. It''s seventy years old.'}
  - line:
      speaker: daniel
      forms:
        es-Latn/standard:
          text: ¡Qué linda! Mi abuelo Pepe, que era mecánico, tenía una máquina como esta.
          tokens: [{surface: Qué, sense: qué}, {surface: linda, sense: lindo}, {surface: Mi, sense: mi}, {surface: abuelo, sense: abuelo}, {surface: Pepe, sense: pepe}, {surface: que, sense: que}, {surface: era, sense: ser, form: 'form:impf'}, {surface: mecánico, sense: mecánico}, {surface: tenía, sense: tener, form: 'form:impf'}, {surface: una, sense: un}, {surface: máquina, sense: máquina}, {surface: como, sense: como.like}, {surface: esta, sense: este}]
      translations: {en: 'How beautiful! My grandfather Pepe, who was a mechanic, had a car like this one.'}
  - line:
      speaker: botero
      forms:
