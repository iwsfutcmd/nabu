# Unit 25 (es): Daniel's first trip to Havana, staying with Tía Marisol in Centro Habana. Relative clauses (que,
# donde, quien, lo que, el que / la que, el cual) describing places and people: the building, the balcony, the
# solar and the azotea; el Malecón and the sea; La Habana Vieja, la Plaza de la Catedral and la Bodeguita del Medio;
# el Capitolio and el Morro; getting around by almendrón, botero and bicitaxi.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u25
title: {en: 'La Habana: Havana'}
cefr: B2
kcs:
- {id: 'sense:centro', gloss: {en: 'centre; center; downtown'}, forms: {es-Latn/standard: [centro]}, notes: {en: 'Centro Habana, the crowded neighbourhood between La Habana Vieja and El Vedado, is where Tía Marisol lives. Ir al centro: to go downtown. With c: centro, céntrico.'}}
- {id: 'sense:edificio', gloss: {en: 'building'}, forms: {es-Latn/standard: [edificio]}, notes: {en: 'E-di-fi-cio: with d, f and c, and no accent. Most buildings in Centro Habana are from the early 1900s: high ceilings, columns, iron balconies, and many in need of repair.'}}
- {id: 'sense:balcón', gloss: {en: 'balcony'}, forms: {es-Latn/standard: [balcón]}, notes: {en: 'With an accent; the plural balcones has none. In Centro Habana life happens on the balcony: neighbours talk across the street, and a bag goes down on a string to buy bread from the vendor below.'}}
- {id: 'sense:solar', gloss: {en: 'tenement (Cuban): an old house divided into rooms'}, forms: {es-Latn/standard: [solar]}, notes: {en: 'In Cuba un solar is a big old house split into rooms, one family to a room, round a shared courtyard; also called una cuartería. Un solar is also a plot of land, and a solar yermo an empty lot. The rumba was born in the solares of Havana and Matanzas.'}}
- {id: 'sense:tender', gloss: {en: 'to hang out (laundry); to spread out'}, forms: {es-Latn/standard: [tender]}, notes: {en: 'Tender la ropa: to hang out the washing. Cubans also say tender la cama for making the bed (hacer la cama elsewhere). E becomes ie: tiendo, tiendes, tiende.'}}
- {id: 'sense:azotea', gloss: {en: 'flat roof; rooftop'}, forms: {es-Latn/standard: [azotea]}, notes: {en: 'The flat roof of a Havana building, where people hang the washing, keep the water tank and catch the breeze on hot nights. With z: a-zo-te-a. El techo is the ceiling, or a roof in general.'}}
- {id: 'sense:lugar', gloss: {en: 'place; spot'}, forms: {es-Latn/standard: [lugar]}, notes: {en: 'El lugar, masculine; plural lugares. En lugar de: instead of. A town square is una plaza, not un lugar.'}}
- {id: 'sense:ciudad', gloss: {en: 'city'}, forms: {es-Latn/standard: [ciudad]}, notes: {en: 'Cubans often drop the final d in speech (ciudá, like verdá and usté), but it is always written. Feminine, like every noun in -dad: la ciudad; plural ciudades.'}}
- {id: 'sense:malecón', gloss: {en: 'seawall; el Malecón: Havana''s seafront drive'}, forms: {es-Latn/standard: [malecón]}, notes: {en: 'Eight kilometres of seawall, road and pavement along Havana''s shore, begun in 1901. At night it is the city''s sofa: couples, friends, fishermen and musicians sit on the wall. When a cold front comes in, the waves jump it and flood the street. With an accent; malecones without.'}}
- {id: 'sense:sentarse', gloss: {en: 'to sit down; to sit'}, forms: {es-Latn/standard: [sentarse]}, notes: {en: 'E becomes ie: me siento, te sientas, se sienta. Me siento is also I feel (from sentirse): me siento bien. Telling someone to sit: siéntate (tú), siéntese (usted).'}}
- {id: 'sense:pescar', gloss: {en: 'to fish; to catch (a fish)'}, forms: {es-Latn/standard: [pescar]}, notes: {en: 'Un pez is a live fish, un pescado one you eat. On the Malecón men fish with a line wound round a can, or float out on a tyre inner tube to fish further out. Before e, c becomes qu: pesqué.'}}
- {id: 'sense:quien', gloss: {en: 'who; whom (relative: la tía con quien vivo)'}, forms: {es-Latn/standard: [quien]}, notes: {en: 'No accent when it joins; ¿quién?, with one, asks. Use it after a preposition (con quien, a quien, de quien) or between commas. Right after a noun Spanish uses que: la tía que vive en La Habana, not la tía quien vive, a common slip from English who.'}}
- {id: 'sense:lo-que', gloss: {en: 'what; the thing that (lo que quiero: what I want)'}, forms: {es-Latn/standard: [lo que]}, notes: {en: 'English what in a statement is lo que, with no accent: eso es lo que quiero, lo que pasa es que… Qué, with an accent, asks: ¿Qué quieres? A common heritage slip is que alone, from English: eso es que quiero. Say eso es lo que quiero.'}}
- {id: 'sense:plaza', gloss: {en: 'square; plaza'}, forms: {es-Latn/standard: [plaza]}, notes: {en: 'La Habana Vieja grew around four old squares: la Plaza de Armas, la Plaza de San Francisco, la Plaza Vieja and la Plaza de la Catedral. With z: plaza, plazas.'}}
- {id: 'sense:catedral', gloss: {en: 'cathedral'}, forms: {es-Latn/standard: [catedral]}, notes: {en: 'Havana''s cathedral, finished in 1777, has a baroque front of coral stone in which you can still see fossil shells. Ca-te-dral ends in l and is stressed on the last syllable, so it needs no accent.'}}
- {id: 'sense:turista', gloss: {en: 'tourist'}, forms: {es-Latn/standard: [turista]}, notes: {en: 'Ends in -a for a man or a woman: el turista, la turista, like el artista. Cubans also call a foreigner, above all an American, un yuma (slang).'}}
- {id: 'sense:bodeguita-del-medio', gloss: {en: 'La Bodeguita del Medio (a bar in Old Havana)'}, forms: {es-Latn/standard: [Bodeguita del Medio]}, notes: {en: 'A small bar and restaurant on Calle Empedrado, near the cathedral, opened in 1942; its walls are covered with visitors'' names. A bodeguita is a little bodega, and del medio because it stood in the middle of the block. A line attributed to Hemingway: Mi mojito en La Bodeguita, mi daiquirí en El Floridita.'}}
- {id: 'sense:mojito', gloss: {en: 'mojito (a rum cocktail)'}, forms: {es-Latn/standard: [mojito]}, notes: {en: 'White rum, lime juice, sugar, soda water and hierbabuena, the mint Cubans grow in a pot on the balcony. Not to be confused with mojo, the garlic and sour-orange sauce.'}}
- {id: 'sense:desde', gloss: {en: 'from; since'}, forms: {es-Latn/standard: [desde]}, notes: {en: 'Desde el balcón se ve el mar: from the balcony you can see the sea. Desde… hasta: from… to. Desde ayer: since yesterday. Desde hace un año: for a year (and still).'}}
- {id: 'sense:capitolio', gloss: {en: 'El Capitolio (Havana''s Capitol)'}, forms: {es-Latn/standard: [Capitolio]}, notes: {en: 'Finished in 1929, it looks like the Capitol in Washington, and habaneros will tell you it is a little taller. Under its dome a diamond (now a copy) marks kilómetro cero, from which road distances in Cuba are measured.'}}
- {id: 'sense:morro', gloss: {en: 'El Morro (the castle at the mouth of Havana''s bay)'}, forms: {es-Latn/standard: [Morro]}, notes: {en: 'El Castillo de los Tres Reyes del Morro, built by the Spanish from 1589 to guard the harbour; its lighthouse is a symbol of the city. Across the bay, at La Cabaña, a cannon is still fired every night at nine: el cañonazo de las nueve. Santiago de Cuba has a Morro too.'}}
- {id: 'sense:cual', gloss: {en: 'which; who (relative: el cual, la cual)'}, forms: {es-Latn/standard: [cual]}, notes: {en: 'Formal, and mostly after a preposition: el balcón desde el cual se ve el mar. It takes the article of its noun: el cual, la cual, los cuales, las cuales. No accent when it joins; ¿cuál? asks. In speech Cubans say el que or donde: el balcón desde el que se ve el mar.'}}
- {id: 'sense:bahía', gloss: {en: 'bay'}, forms: {es-Latn/standard: [bahía]}, notes: {en: 'Ba-hí-a: the stressed í carries an accent, as in día and tía. El Morro guards the mouth of la bahía de La Habana, and the Malecón runs west from it.'}}
- {id: 'sense:almendrón', gloss: {en: 'almendrón: an old American car used as a shared taxi (Cuban)'}, forms: {es-Latn/standard: [almendrón]}, notes: {en: 'A 1940s or 1950s Chevrolet, Ford or Buick kept running for decades with parts from anything, used as a taxi de ruta that picks people up and drops them off along a fixed route. Named for its almond (almendra) shape. With an accent; almendrones without. Also just una máquina or un carro.'}}
- {id: 'sense:botero', gloss: {en: 'shared-taxi driver (Cuban)'}, forms: {es-Latn/standard: [botero]}, notes: {en: 'The driver of an almendrón or another taxi de ruta. You flag him down and say how far you are going: ¿Hasta el Capitolio? Coger un botero: to take a shared taxi. Elsewhere a botero is a boatman.'}}
- {id: 'sense:hasta', gloss: {en: 'until; as far as; up to; even'}, forms: {es-Latn/standard: [hasta]}, notes: {en: '¿Hasta dónde va? How far are you going? Hasta luego, hasta mañana. With h and s: hasta. Asta, without h, is a flagpole or an antler.'}}
- {id: 'sense:cobrar', gloss: {en: 'to charge (money); to get paid'}, forms: {es-Latn/standard: [cobrar]}, notes: {en: '¿Cuánto cobra? How much do you charge? Cobrar el sueldo: to get paid. To charge a phone is cargar, never chargear.'}}
- {id: 'sense:bicitaxi', gloss: {en: 'bicycle taxi; pedicab'}, forms: {es-Latn/standard: [bicitaxi]}, notes: {en: 'A tricycle with a covered seat for two behind the driver, for the narrow streets of La Habana Vieja and Centro Habana. One word: bicitaxi, bicitaxis.'}}
