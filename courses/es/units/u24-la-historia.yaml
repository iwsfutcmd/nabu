# Unit 24 (es): the family's history of leaving Cuba, with the past perfect (había salido, habían llegado: haber in
# the imperfect + the participle). The exile of the 1960s (Doña Ofelia); Abuela Cachita and Abuelo Pepe in the
# Mariel boatlift (1980): la lancha, el puerto del Mariel, Cayo Hueso, la Pequeña Habana, los papeles; Tía Marisol,
# who stayed; Papi and his father, balseros from Cienfuegos in 1994, by way of Guantánamo; separarse, reunirse,
# extrañar, la libertad. Told from the family's point of view; KC notes give the dates.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u24
title: {en: 'La historia: the family''s story'}
cefr: B2
kcs:
- {id: 'sense:historia', gloss: {en: history; story}, forms: {es-Latn/standard: [historia]}, notes: {en: 'With an h that no one says. La historia is both history and a story; un cuento is a tale (los cuentos de Abuela). La historia de Cuba: Cuban history.'}}
- {id: 'sense:irse', gloss: {en: to leave; to go away}, forms: {es-Latn/standard: [irse]}, notes: {en: 'Ir is to go somewhere; irse is to go away: me voy, I''m off; se fueron de Cuba, they left Cuba. Of someone who left the island for good, Cubans say just se fue.'}}
- {id: 'sense:ochenta', gloss: {en: eighty}, forms: {es-Latn/standard: [ochenta]}, notes: {en: 'En el ochenta: in 1980. Cubans name a year by its last two digits: el Mariel del ochenta. In full, mil novecientos ochenta.'}}
- {id: 'sense:nacer', gloss: {en: to be born}, forms: {es-Latn/standard: [nacer]}, notes: {en: 'Nací en Miami: I was born in Miami (never fui nacido, from English). Yo nazco has a z; nació and nacimos have a c.'}}
- {id: 'sense:exilio', gloss: {en: exile}, forms: {es-Latn/standard: [exilio]}, notes: {en: 'El exilio: the Cubans who left after 1959, and their life away from the island; one of them is un exiliado. With x and no h. The first wave came in 1959–62; the Freedom Flights (los vuelos de la libertad, 1965–73) brought over 260,000 more.'}}
- {id: 'sense:sesenta', gloss: {en: 'sixty; los (años) sesenta: the sixties'}, forms: {es-Latn/standard: [sesenta]}, notes: {en: 'Los sesenta: the first great wave of the exile, from the Pedro Pan children (1960–62) to the Freedom Flights. Sesenta (60) and setenta (70) are easy to mix up: s as in seis, t as in siete.'}}
- {id: 'sense:puerto', gloss: {en: port; harbour}, forms: {es-Latn/standard: [puerto]}, notes: {en: 'El puerto del Mariel, el puerto de La Habana. Puerto Rico: rich port.'}}
- {id: 'sense:mariel', gloss: {en: 'Mariel (a port west of Havana; el Mariel: the 1980 boatlift)'}, forms: {es-Latn/standard: [Mariel]}, notes: {en: 'From April to October 1980 about 125,000 Cubans left from the port of Mariel, in boats their relatives brought from Florida; it began after thousands crowded into the Peruvian embassy in Havana that April. People say vino por el Mariel; marielito is heard too, but many who came find it a slur.'}}
- {id: 'sense:buscar', gloss: {en: to look for; to pick up (someone)}, forms: {es-Latn/standard: [buscar]}, notes: {en: 'It already means look for: busco las llaves, with no para (that is English). Buscar a alguien: to pick someone up, te busco a las ocho. Busqué, with qu.'}}
- {id: 'sense:lancha', gloss: {en: motorboat; launch}, forms: {es-Latn/standard: [lancha]}, notes: {en: A small motorboat. In 1980 Cuban families in Florida hired lanchas and shrimp boats and crossed to Mariel to fetch their relatives. In Havana la lanchita de Regla is the little ferry across the bay.}}
- {id: 'sense:mar', gloss: {en: sea}, forms: {es-Latn/standard: [mar]}, notes: {en: 'El mar; sailors and poets say la mar. Cuba is about 90 miles (145 km) from Key West: las noventa millas.'}}
- {id: 'sense:cayo-hueso', gloss: {en: Key West}, forms: {es-Latn/standard: [Cayo Hueso]}, notes: {en: 'Bone Key: English Key West comes from the Spanish name. Most Mariel boats landed there.'}}
- {id: 'sense:mil', gloss: {en: thousand}, forms: {es-Latn/standard: [mil]}, notes: {en: 'Never un mil: mil cubanos; cien mil, a hundred thousand. Miles de: thousands of. Years: mil novecientos ochenta (1980), dos mil veintiséis.'}}
- {id: 'sense:quedarse', gloss: {en: to stay; to remain}, forms: {es-Latn/standard: [quedarse]}, notes: {en: 'Quedarse en Cuba: to stay in Cuba. Without se, quedar is to be (somewhere) or to arrange to meet: ¿dónde queda? Me quedé dormido: I overslept.'}}
- {id: 'sense:dejar', gloss: {en: to leave (behind); to let}, forms: {es-Latn/standard: [dejar]}, notes: {en: 'To leave someone or something behind is dejar, never salir: dejó a su hija en Cuba. Dejar de + infinitive: to stop doing (nunca dejó de llamar). Déjame ver: let me see.'}}
- {id: 'sense:pensar', gloss: {en: to think}, forms: {es-Latn/standard: [pensar]}, notes: {en: 'Pienso, piensas, piensa: e becomes ie, except in pensamos. Pensar en: to think about (pienso en ti). Pensar que: to think that.'}}
- {id: 'sense:cienfuegos', gloss: {en: Cienfuegos (a city on Cuba's south coast)}, forms: {es-Latn/standard: [Cienfuegos]}, notes: {en: 'La Perla del Sur, on a bay on the south coast, founded in 1819 by French settlers from Bordeaux and Louisiana. Benny Moré came from the province.'}}
- {id: 'sense:noventa', gloss: {en: ninety}, forms: {es-Latn/standard: [noventa]}, notes: {en: 'With v, like nueve. El noventa y cuatro: 1994, the summer of the balseros.'}}
- {id: 'sense:balsa', gloss: {en: raft}, forms: {es-Latn/standard: [balsa]}, notes: {en: 'Homemade, from truck inner tubes, planks and oil drums. Someone who left Cuba on one is un balsero, una balsera.'}}
- {id: 'sense:miedo', gloss: {en: 'fear; tener miedo: to be afraid'}, forms: {es-Latn/standard: [miedo]}, notes: {en: 'Tengo miedo: I''m afraid (never estoy miedo). Me da miedo: it scares me. Tener miedo de: to be afraid of.'}}
- {id: 'sense:balsero', gloss: {en: rafter (someone who left Cuba on a raft)}, forms: {es-Latn/standard: [balsero]}, notes: {en: 'In August 1994, after the Maleconazo protest in Havana, Cuba stopped holding back those who left, and some 35,000 Cubans set out on rafts. The US Coast Guard took those it picked up to the naval base at Guantánamo; most were let into the US in 1995. Many died at sea.'}}
- {id: 'sense:guardacostas', gloss: {en: 'coast guard (the service, its ships, its crews)'}, forms: {es-Latn/standard: [guardacostas]}, notes: {en: 'One word, the same in the singular and the plural: el guardacostas, los guardacostas. In Miami el Coast Guard is heard too.'}}
- {id: 'sense:guantánamo', gloss: {en: Guantánamo (a city and province; the US naval base there)}, forms: {es-Latn/standard: [Guantánamo]}, notes: {en: 'In the far east of Cuba. The US has kept a naval base on Guantánamo Bay since 1903; in 1994–95 it held tens of thousands of balseros. A guantanamera is a woman from Guantánamo, as in the song.'}}
- {id: 'sense:pequeña-habana', gloss: {en: Little Havana (a Miami neighbourhood)}, forms: {es-Latn/standard: [Pequeña Habana]}, notes: {en: 'Around Calle Ocho, west of downtown Miami: the heart of the Cuban exile from the 1960s on. Pequeña with ñ. Older Cubans also call it la Sagüesera, from southwest.'}}
- {id: 'sense:factoría', gloss: {en: factory (Miami Spanish)}, forms: {es-Latn/standard: [factoría]}, notes: {en: 'Miami Spanish, from English factory; in Cuba and the rest of the Spanish-speaking world, una fábrica. Many exiles started out in the garment factories of Hialeah.'}}
- {id: 'sense:papel', gloss: {en: 'paper; los papeles: (immigration) papers'}, forms: {es-Latn/standard: [papel]}, notes: {en: 'Tener los papeles: to have legal residence; sacar los papeles: to get them. Most who came through Mariel waited years for theirs.'}}
- {id: 'sense:libertad', gloss: {en: freedom; liberty}, forms: {es-Latn/standard: [libertad]}, notes: {en: 'Feminine: la libertad. Many exiles say they came por la libertad, for freedom. Miami''s Freedom Tower, where Cuban refugees were received from 1962 to 1974, is la Torre de la Libertad.'}}
- {id: 'sense:separarse', gloss: {en: to be separated; to split up}, forms: {es-Latn/standard: [separarse]}, notes: {en: 'La familia se separó: the family was split up. Of a couple: to separate. Spelled with a after the p, like English separate.'}}
- {id: 'sense:reunirse', gloss: {en: to get together; to be reunited}, forms: {es-Latn/standard: [reunirse]}, notes: {en: 'Reunirse con alguien: to get together with someone. Reúne and reúnen carry an accent on the ú. Una reunión: a gathering or a meeting.'}}
