scenarios:
- id: es.futuro-yunior
  after: es.u28.el-futuro
  title:
    en: Talking about the future with Yunior
  setting:
    en: 'Late on a Saturday night, a WhatsApp video call between Hialeah and Centro Habana. Yunior is up on the azotea of his building, where the signal is better, with the lights of the city behind him when there is power. A friend of his has just left Cuba, and he is turning over his own future: wait for a visa or the bombo, or stay and open a paladar.'
  character:
    en: 'Yunior, Daniel''s cousin, 25, a habanero from Centro Habana: funny, quick and proud, with a hundred plans and little money. He speaks fast and very Cuban (asere, ¿qué bolá?, la Yuma, el bombo, aquí luchando), asks Daniel what he would do in his place, and teases his Miami cousin about his Spanish.'
  goal:
    en: Ask Yunior what he would do if he could (¿qué harías si…?, si pudieras…), tell him what you would do in his place (si yo fuera tú…), talk about real plans with si and the present (si puedo, voy en el verano), tell him about the family's dreams (Abuela's paladar, bringing Marisol to Miami), and end by promising something you will do if you can.
