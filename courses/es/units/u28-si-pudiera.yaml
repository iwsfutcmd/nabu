# Unit 28 (es): si clauses. Real conditions with si + present (si puedo, voy; si Yunior consigue la visa, viene), set
# against unreal ones with the imperfect subjunctive and the conditional (si pudiera, volvería a Cuba; si tuviera
# dinero, abriría un paladar). The family's dreams: Papi going back to his tierra, Abuela bringing Marisol to Miami
# (reclamar, la visa), a paladar with Abuela's ropa vieja, Yunior's future in Havana or in la Yuma (el bombo, luchar).
# KC notes cover what heritage speakers say: si tendría for si tuviera, haiga for haya, trajiera for trajera; the -se
# forms (tuviese, pudiese) are accepted as written alternatives.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u28
title: {en: 'Si pudiera: if I could'}
cefr: B2
kcs:
- {id: 'sense:conseguir', gloss: {en: 'to get; to obtain; to manage to'}, forms: {es-Latn/standard: [conseguir]}, notes: {en: 'E becomes i: consigo, consigue, consiguió, consiguiera; yo consigo, with g before o. Cubans use it for anything hard to find: ¿Conseguiste pollo? Conseguir + infinitive: to manage to (consiguió salir).'}}
- {id: 'sense:visa', gloss: {en: 'visa'}, forms: {es-Latn/standard: [visa]}, notes: {en: 'La visa in Cuba and the Americas; Spain says el visado. Sacar la visa: to get a visa. For a young Cuban a US visa is hard to get: most come through a relative''s petition (see reclamar) or the visa lottery (el bombo).'}}
- {id: 'sense:entonces', gloss: {en: 'then; so'}, forms: {es-Latn/standard: [entonces]}, notes: {en: 'Si no puedes, entonces voy yo: if you can''t, then I''ll go. It also moves a story on: Entonces, ¿qué hacemos? Said fast it can sound like tonces; write entonces.'}}
- {id: 'sense:bombo', gloss: {en: 'bass drum; el bombo: the US visa lottery (Cuban)'}, forms: {es-Latn/standard: [bombo]}, notes: {en: 'Colloquial. In Cuba el bombo is the lottery for US visas, after the drum the names are drawn from: meterse en el bombo, to enter it; sacarse el bombo, to win it. Since the 1990s it has been the dream of many young Cubans. With b and b.'}}
- {id: 'sense:yuma', gloss: {en: 'la Yuma: the United States (Cuban slang); un yuma: a foreigner, an American'}, forms: {es-Latn/standard: [Yuma]}, notes: {en: 'Irse pa'' la Yuma: to leave for the US. People say it comes from the western 3:10 to Yuma, popular in Cuba in the late 1950s. Slang: on a form or at an office, say Estados Unidos. Cousins on the island tease a Cuban from Miami as medio yuma.'}}
- {id: 'sense:tierra', gloss: {en: 'land; earth; mi tierra: my homeland'}, forms: {es-Latn/standard: [tierra]}, notes: {en: 'Mi tierra: my homeland, where I come from; Cubans abroad say it of the island (volver a mi tierra), as in Gloria Estefan''s Mi tierra (1993). La tierra is also soil and the ground; the planet is la Tierra.'}}
- {id: 'sense:jubilarse', gloss: {en: 'to retire (from work)'}, forms: {es-Latn/standard: [jubilarse]}, notes: {en: 'Un jubilado, una jubilada: a retiree, like Abuelo Pepe. La jubilación: retirement, or the pension. Retirarse is heard too, above all of sportsmen and soldiers.'}}
- {id: 'sense:mudarse', gloss: {en: 'to move (house)'}, forms: {es-Latn/standard: [mudarse]}, notes: {en: 'Nos mudamos a Hialeah: we moved to Hialeah. Never moverse for this, from English move: moverse is to move your body. La mudanza: the move. Si pudiese, me mudaría: the -se forms (pudiese, tuviese) mean the same as pudiera, tuviera, and are more formal and written; Cubans say the -ra forms.'}}
- {id: 'sense:lotería', gloss: {en: 'lottery'}, forms: {es-Latn/standard: [lotería]}, notes: {en: 'The test of this unit: ¿Qué harías si te ganaras la lotería? After si comes the -ra form (ganaras, tuviera, pudiera), never the conditional: si tendría and si ganaría are heard at home, in Miami and elsewhere, but in writing they are wrong. Cubans say ganarse la lotería. Cuba has had no legal lottery since the early 1960s; la bolita, the old numbers game, lives on underground. Lo-te-rí-a, with an accent.'}}
- {id: 'sense:país', gloss: {en: 'country'}, forms: {es-Latn/standard: [país]}, notes: {en: 'With an accent: pa-ís, two syllables; plural países. Un país is a nation; the countryside is el campo, never el país. Mi país can be Cuba, the United States or both, depending on whom you ask.'}}
- {id: 'sense:paladar', gloss: {en: 'palate; (Cuba) paladar: a private family restaurant'}, forms: {es-Latn/standard: [paladar]}, notes: {en: 'Cuba allowed small family restaurants in people''s homes in the 1990s, and they were named after Paladar, the restaurant chain a heroine builds up in the Brazilian telenovela Vale tudo, a hit in Cuba at the time. El paladar is also the palate, the sense of taste.'}}
- {id: 'sense:propio', gloss: {en: 'own'}, forms: {es-Latn/standard: [propio]}, notes: {en: 'Before the noun it means own: mi propio negocio, su propia casa; propia with a feminine noun. After the noun it means proper or typical.'}}
- {id: 'sense:cliente', gloss: {en: 'customer; client'}, forms: {es-Latn/standard: [cliente]}, notes: {en: 'Ends in -e for a man or a woman: el cliente, la cliente (also la clienta). Ojalá que haya clientes: haya is the subjunctive of hay; haiga is heard at home, but write haya.'}}
- {id: 'sense:plato', gloss: {en: 'plate; dish (food)'}, forms: {es-Latn/standard: [plato]}, notes: {en: 'Both the plate and what is on it: un plato de arroz, un plato típico. El plato fuerte: the main course, or the highlight. Fregar los platos: to do the dishes.'}}
- {id: 'sense:negocio', gloss: {en: 'business; a deal'}, forms: {es-Latn/standard: [negocio]}, notes: {en: 'Spelled with g and c: ne-go-cio. Un negocio propio: your own business. Since 2010 many Cubans have opened small private businesses as cuentapropistas, the self-employed.'}}
- {id: 'sense:sueño', gloss: {en: 'dream; sleep (tener sueño: to be sleepy)'}, forms: {es-Latn/standard: [sueño]}, notes: {en: 'Mi sueño es volver: my dream is to go back. El sueño americano: the American dream. Tengo sueño: I''m sleepy (never estoy sueño). With ñ.'}}
- {id: 'sense:soñar', gloss: {en: 'to dream (soñar con: to dream of)'}, forms: {es-Latn/standard: [soñar]}, notes: {en: 'O becomes ue: sueño, sueñas, sueña. Soñar con, never soñar de (from English dream of): sueño con volver, I dream of going back; anoche soñé contigo.'}}
- {id: 'sense:traer', gloss: {en: 'to bring'}, forms: {es-Latn/standard: [traer]}, notes: {en: 'Traigo, with g; the past is traje, trajo, trajeron, and so trajera, trajéramos (si la trajéramos). Trajiera and trayera are heard at home, but never write them. Traer is to bring here; llevar is to take there.'}}
- {id: 'sense:reclamar', gloss: {en: 'to claim; to demand; (Cuban American) to petition for a relative to immigrate'}, forms: {es-Latn/standard: [reclamar]}, notes: {en: 'In Miami reclamar a alguien is to file the papers for a relative in Cuba to come (la reclamación): Abuela reclamó a Marisol. Elsewhere reclamar is to complain or to claim: reclamar el equipaje.'}}
- {id: 'sense:nieto', gloss: {en: 'grandson (nieta: granddaughter; nietos: grandchildren)'}, forms: {es-Latn/standard: [nieto]}, notes: {en: 'Abuela Cachita''s nietos: Daniel, Lili and Yunior. A great-grandchild is un bisnieto. Mi nieto lindo: what every Cuban grandmother says.'}}
- {id: 'sense:orgulloso', gloss: {en: 'proud'}, forms: {es-Latn/standard: [orgulloso]}, notes: {en: 'Orgullosa for a woman. Orgulloso de: proud of (estoy orgullosa de ti). El orgullo: pride. With one r and ll: or-gu-llo-so.'}}
- {id: 'sense:futuro', gloss: {en: 'future'}, forms: {es-Latn/standard: [futuro]}, notes: {en: 'El futuro; en el futuro: in the future. The future tense (unit 20) is el futuro too, but for plans Cubans mostly say voy a…'}}
- {id: 'sense:cambiar', gloss: {en: 'to change; to exchange'}, forms: {es-Latn/standard: [cambiar]}, notes: {en: 'Cambiar de casa, de trabajo: to move, to change jobs (with de). Cambiar dinero: to exchange money. Cambiarse: to change your clothes. Las cosas cambian: things change.'}}
- {id: 'sense:así', gloss: {en: 'like this; like that; so'}, forms: {es-Latn/standard: [así]}, notes: {en: 'With an accent on the í. Así es: that''s right; así es la vida: that''s life; así así: so-so.'}}
