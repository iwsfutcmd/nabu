# Unit 9 (es): the past. The preterite of regular verbs in every person, ir and ser (fui, fue), hacer (hice,
# hizo), tener (tuve, tuvo); a Sunday at Abuela's: dominó with Abuelo Pepe, pelota on TV.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u09
title: {en: 'Ayer: Yesterday'}
cefr: A2
kcs:
- {id: 'sense:ayer', gloss: {en: yesterday}, forms: {es-Latn/standard: [ayer]}, notes: {en: 'Antier (antes de ayer) is the day before yesterday, in Cuba and much of Latin America.'}}
- {id: 'form:pret-1s', gloss: {en: 'past tense (preterite): I (yo)'}, notes: {en: '-é, -í: compré, comí. The accent matters: compré is I bought, compre is buy! Irregular: fui, hice, tuve, vi.'}}
- {id: 'form:pret-3s', gloss: {en: 'past tense (preterite): he, she, it, you (usted)'}, notes: {en: '-ó, -ió: compró, comió. Without its accent compró is compro, I buy. Irregular, and with no accent: fue, hizo, tuvo, vio.'}}
- {id: 'form:pret-2s', gloss: {en: 'past tense (preterite): you (tú)'}, notes: {en: '-aste, -iste: compraste, comiste, fuiste. Many Cubans say comprastes, fuistes, with an s; it is written without one.'}}
- {id: 'sense:hablar', gloss: {en: to speak; to talk}, forms: {es-Latn/standard: [hablar]}, notes: {en: 'Hablar con: to talk to someone. Written with a silent h. Hablo (I speak) and habló (he spoke) differ only by the accent.'}}
- {id: 'sense:jugar', gloss: {en: to play (a game or sport)}, forms: {es-Latn/standard: [jugar]}, notes: {en: 'Cubans say jugar dominó, jugar pelota, with no al. U becomes ue when stressed (juego, juegas), and jugué keeps a u after the g. An instrument is tocar.'}}
- {id: 'sense:dominó', gloss: {en: dominoes (the game); a domino}, forms: {es-Latn/standard: [dominó]}, notes: {en: 'With an accent. Cubans play doble nueve (55 tiles), in pairs, slapping the tiles down. On Calle Ocho the tables of Domino Park (Parque Máximo Gómez) are always full.'}}
- {id: 'sense:ganar', gloss: {en: to win; to earn}, forms: {es-Latn/standard: [ganar]}, notes: {en: 'Ganar dinero: to earn money. Gané (I won) and ganó (he won) need their accents.'}}
- {id: 'sense:fin-de-semana', gloss: {en: weekend}, forms: {es-Latn/standard: [fin de semana]}, notes: {en: 'Three words, one idea: el fin de semana. In Miami some say el weekend.'}}
- {id: 'sense:anoche', gloss: {en: last night}, forms: {es-Latn/standard: [anoche]}, notes: {en: 'One word. Ayer por la noche says the same.'}}
- {id: 'sense:pelota', gloss: {en: baseball (Cuban); ball}, forms: {es-Latn/standard: [pelota]}, notes: {en: 'In Cuba la pelota is baseball, the national sport; elsewhere béisbol. Jugar pelota, ver la pelota; a player is un pelotero.'}}
- {id: 'sense:televisión', gloss: {en: television; TV}, forms: {es-Latn/standard: [televisión, tele]}, notes: {en: 'La tele for short. En la tele: on TV.'}}
- {id: 'form:pret-1p', gloss: {en: 'past tense (preterite): we (nosotros)'}, notes: {en: 'For -ar and -ir verbs it is the same as the present (compramos), and ayer or anoche tells them apart; -er verbs differ: comemos, comimos. Irregular: fuimos, hicimos, tuvimos, vimos.'}}
- {id: 'form:pret-3p', gloss: {en: 'past tense (preterite): they, you all (ellos, ustedes)'}, notes: {en: '-aron, -ieron: compraron, comieron. Irregular: fueron, hicieron, tuvieron, vieron.'}}
- {id: 'sense:suerte', gloss: {en: luck}, forms: {es-Latn/standard: [suerte]}, notes: {en: 'Tener suerte: to be lucky. ¡Qué suerte! What luck!'}}
