          tokens: [{surface: Sí, sense: sí}, {surface: mi, sense: mi}, {surface: vida, sense: vida}, {surface: 'y', sense: 'y'}, {surface: llueve, sense: llover, form: 'form:pres-3s'}, {surface: mucho, sense: mucho}, {surface: Pero, sense: pero}, {surface: es, sense: ser, form: 'form:pres-3s'}, {surface: Cuba, sense: cuba}]
