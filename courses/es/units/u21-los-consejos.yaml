      - lexeme:cocina
      forms:
        es-Latn/standard:
          text: Ojalá que encuentres una muchacha seria y trabajadora.
          tokens: [{surface: Ojalá, lexeme: ojalá}, {surface: que, lexeme: que}, {surface: encuentres, lexeme: encontrar, feats: {Mood: Sub, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}}, {surface: una, lexeme: un, feats: {Gender: Fem, Number: Sing}, n: 4, head: 5, rel: det}, {surface: muchacha, lexeme: muchacho, feats: {Gender: Fem, Number: Sing}, n: 5}, {surface: seria, lexeme: serio, feats: {Gender: Fem, Number: Sing}, n: 6, head: 5, rel: amod}, {surface: y, lexeme: y}, {surface: trabajadora, lexeme: trabajador, feats: {Gender: Fem, Number: Sing}}]
