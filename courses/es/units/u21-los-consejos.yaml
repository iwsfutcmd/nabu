# Unit 21 (es): the present subjunctive through Abuela Cachita's advice on love, work, money and family: quiero que,
# no quiero que, espero que, ojalá (que), te aconsejo que, es importante que, para que; the irregulars sea, esté, vaya,
# tenga, haga, diga, sepa. Same subject, infinitive (quiero ir); another subject, que + subjunctive (quiero que vayas).
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u21
title: {en: 'Los consejos de Abuela: Grandma''s advice'}
cefr: B1
kcs:
- {id: 'form:subj', gloss: {en: 'present subjunctive (que hable, que coma)'}, notes: {en: 'After a wish, a hope, advice or a purpose aimed at someone else (quiero que, espero que, ojalá, te aconsejo que, es importante que, para que), the verb swaps its vowel: -ar verbs take e (hable, hables, hablen), -er and -ir verbs take a (coma, viva). The stem is the yo form''s: tengo, tenga; hago, haga; digo, diga; vengo, venga. Sea, esté, vaya and sepa are irregular. Spelling keeps the sound: llegue, saque. Heritage speakers often keep the present (quiero que tú vienes); written Spanish needs quiero que vengas. With one subject there is no que: quiero ir.'}}
- {id: 'sense:consejo', gloss: {en: 'piece of advice; los consejos: advice'}, forms: {es-Latn/standard: [consejo]}, notes: {en: 'Advice is counted in Spanish: un consejo, dos consejos, and Abuela gives muchos consejos. Dar un consejo: to give (a piece of) advice. With j: consejo, aconsejar.'}}
- {id: 'sense:aconsejar', gloss: {en: 'to advise'}, forms: {es-Latn/standard: [aconsejar]}, notes: {en: 'Te aconsejo que + subjunctive: I advise you to. To an elder, with usted: le aconsejo que descanse. Spelled with c and j: a-con-se-jar.'}}
- {id: 'sense:estudiar', gloss: {en: 'to study'}, forms: {es-Latn/standard: [estudiar]}, notes: {en: 'Estudiar medicina, estudiar en la universidad. ¿Qué tú estudias?: what are you studying?, what''s your major? (the Cuban order, subject before the verb).'}}
- {id: 'sense:olvidar', gloss: {en: 'to forget'}, forms: {es-Latn/standard: [olvidar]}, notes: {en: 'Olvidar algo or olvidarse de algo: both are right. Cubans most often say se me olvidó: I forgot (it slipped my mind). ¡No te olvides!: don''t forget!'}}
- {id: 'sense:ojalá', gloss: {en: 'I hope; hopefully; if only'}, forms: {es-Latn/standard: [ojalá]}, notes: {en: 'From the Arabic for if God wills, a word left by the centuries of Muslim Spain. It always takes the subjunctive: ojalá (que) llueva. The que is optional, and Cubans often say it. The accent falls on the last a: ojalá, never ojala.'}}
- {id: 'sense:esperar', gloss: {en: 'to hope; to wait (for); to expect'}, forms: {es-Latn/standard: [esperar]}, notes: {en: 'Espero que + subjunctive: I hope (espero que estés bien). Esperar la guagua: to wait for the bus, with no word for for. Espérame: wait for me.'}}
- {id: 'sense:pronto', gloss: {en: 'soon'}, forms: {es-Latn/standard: [pronto]}, notes: {en: 'Hasta pronto: see you soon. Pronto means soon, not quickly (that is rápido); de pronto: suddenly.'}}
- {id: 'sense:encontrar', gloss: {en: 'to find'}, forms: {es-Latn/standard: [encontrar]}, notes: {en: 'The o becomes ue when stressed: encuentro, encuentras, que encuentres. Encontrarse con alguien: to run into someone.'}}
- {id: 'sense:muchacho', gloss: {en: 'boy; young man (muchacha: girl, young woman)'}, forms: {es-Latn/standard: [muchacho]}, notes: {en: 'The everyday Cuban word for a young person, up to about forty: una muchacha seria; ¡muchachos, a comer! Chico and chica are used too.'}}
- {id: 'sense:serio', gloss: {en: 'serious; reliable, responsible'}, forms: {es-Latn/standard: [serio]}, notes: {en: 'Un muchacho serio, una muchacha seria: high praise from a Cuban abuela. Seria (serious) has no accent; sería, with one, is would be (ser).'}}
- {id: 'sense:amor', gloss: {en: 'love; mi amor: my love, darling'}, forms: {es-Latn/standard: [amor]}, notes: {en: 'Mi amor is what Cubans call partners, children, grandchildren and now and then the cashier. El amor is masculine. Un amor de persona: a lovely person.'}}
- {id: 'sense:sufrir', gloss: {en: 'to suffer'}, forms: {es-Latn/standard: [sufrir]}, notes: {en: 'Sufrir por amor: to suffer for love, the subject of every bolero. Sufrir de: to suffer from (sufre de la presión).'}}
- {id: 'sense:verdad', gloss: {en: 'truth; ¿verdad?: right?'}, forms: {es-Latn/standard: [verdad]}, notes: {en: 'Decir la verdad: to tell the truth. ¿Verdad? at the end of a sentence asks for agreement: right?, isn''t it? De verdad: really. Written with v and a final d that Cubans barely say (verdá).'}}
- {id: 'sense:importante', gloss: {en: 'important'}, forms: {es-Latn/standard: [importante]}, notes: {en: 'Es importante que + subjunctive: it''s important that… Lo importante es…: the important thing is… One form for both genders.'}}
- {id: 'sense:terminar', gloss: {en: 'to finish; to end'}, forms: {es-Latn/standard: [terminar]}, notes: {en: 'Terminar la universidad, or terminar la carrera: to finish college. Terminar con alguien: to break up with someone.'}}
- {id: 'sense:universidad', gloss: {en: 'university; college'}, forms: {es-Latn/standard: [universidad]}, notes: {en: 'Going to college is ir a la universidad. El colegio is a school for children, never a college: a false friend. With v: uni-ver-si-dad.'}}
- {id: 'sense:trabajador', gloss: {en: 'hard-working; worker'}, forms: {es-Latn/standard: [trabajador]}, notes: {en: 'Es muy trabajador: he works hard, another of Abuela''s highest compliments. A woman is trabajadora. With j: trabajar, trabajo, trabajador.'}}
- {id: 'sense:dinero', gloss: {en: 'money'}, forms: {es-Latn/standard: [dinero]}, notes: {en: 'Singular in Spanish: el dinero está en el banco, never están. Cubans also say la plata, and in slang los baros. Cash is efectivo.'}}
- {id: 'sense:ahorrar', gloss: {en: 'to save (money, time)'}, forms: {es-Latn/standard: [ahorrar]}, notes: {en: 'Ahorrar dinero. With h and rr: a-ho-rrar. Salvar is to save a life or to rescue, never money: salvar dinero is an anglicism.'}}
- {id: 'sense:gastar', gloss: {en: 'to spend (money); to use up'}, forms: {es-Latn/standard: [gastar]}, notes: {en: 'Gastar dinero en ropa: to spend money on clothes, with en. Spending time is pasar: pasé el día con abuela.'}}
- {id: 'sense:guardar', gloss: {en: 'to keep; to put away; to save (for later)'}, forms: {es-Latn/standard: [guardar]}, notes: {en: 'Guardar el dinero, guardar la ropa. Guárdame un poco: save me some. A guard is un guardia.'}}
- {id: 'sense:banco', gloss: {en: 'bank; bench'}, forms: {es-Latn/standard: [banco]}, notes: {en: 'El banco is the bank, and also a bench in the park. Many Cuban grandparents still keep their savings at home instead.'}}
- {id: 'sense:debajo', gloss: {en: 'under; underneath (debajo de)'}, forms: {es-Latn/standard: [debajo]}, notes: {en: 'Debajo de la mesa: under the table; debajo del colchón, with del (de + el). Abajo, on its own, is downstairs or down below.'}}
- {id: 'sense:colchón', gloss: {en: 'mattress'}, forms: {es-Latn/standard: [colchón]}, notes: {en: 'Debajo del colchón: where abuelas keep their savings. Colchón has an accent; colchones does not.'}}
- {id: 'sense:unido', gloss: {en: 'close (of a family); united'}, forms: {es-Latn/standard: [unido]}, notes: {en: 'Una familia muy unida: a very close family. Los Estados Unidos: the United States.'}}
- {id: 'sense:junto', gloss: {en: 'together (juntos)'}, forms: {es-Latn/standard: [junto]}, notes: {en: 'It agrees with who is together: juntos, juntas (todas juntas: all the women together). Junto a: next to.'}}
- {id: 'sense:pelear', gloss: {en: 'to fight; to argue'}, forms: {es-Latn/standard: [pelear]}, notes: {en: 'Pelear, or pelearse, con alguien: to fight or argue with someone. For a fistfight Cubans say fajarse. In the subjunctive the e doubles: que no peleen.'}}
- {id: 'sense:cuidarse', gloss: {en: 'to take care of yourself'}, forms: {es-Latn/standard: [cuidarse]}, notes: {en: '¡Cuídate (mucho)!: take care!, how a Cuban family says goodbye. Cuídate carries an accent. Without se, cuidar a alguien is to look after someone.'}}
- {id: 'sense:portarse', gloss: {en: 'to behave (portarse bien: to behave yourself)'}, forms: {es-Latn/standard: [portarse]}, notes: {en: '¡Pórtate bien!: what every Cuban mother says at the door, at any age. Portarse mal: to misbehave. Pórtate carries an accent.'}}
