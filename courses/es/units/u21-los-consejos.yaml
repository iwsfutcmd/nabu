          tokens: [{surface: Mi'jo, lexeme: mijo, feats: {Gender: Masc, Number: Sing}}, {surface: yo, lexeme: yo}, {surface: tengo, lexeme: tener, feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}}, {surface: unos, lexeme: un, feats: {Gender: Masc, Number: Plur}, n: 4, head: 5, rel: det}, {surface: consejos, lexeme: consejo, feats: {Number: Plur}, n: 5}, {surface: para, lexeme: para, n: 6, head: 7, rel: case}, {surface: ti, lexeme: ti, n: 7}]
