        es-Latn/standard:
          text: Primero, el amor. ¿Tú tienes novia?
          tokens: [{surface: Primero, lexeme: primero, feats: {Gender: Masc, Number: Sing}}, {surface: el, lexeme: el, feats: {Gender: Masc, Number: Sing}, n: 2, head: 3, rel: det}, {surface: amor, lexeme: amor, feats: {Number: Sing}, n: 3}, {surface: Tú, lexeme: tú}, {surface: tienes, lexeme: tener, feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}}, {surface: novia, lexeme: novio, feats: {Gender: Fem, Number: Sing}}]
