# Unit 19 (es): register and respect, the heritage speaker's weakest spot. usted and ustedes with elders, neighbours
# and offices; señor, don and doña; la bendición (¡Bendición, abuela! ¡Dios te bendiga!); con permiso, disculpe,
# perdone; polite requests with the conditional (me gustaría, ¿podría…?, ¿sería posible…?) and quisiera; Doña Ofelia
# next door; calling the doctor's office for Abuelo.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u19
title: {en: 'Con respeto: With respect'}
cefr: B1
kcs:
- {id: 'sense:señor', gloss: {en: 'sir; Mr; gentleman'}, forms: {es-Latn/standard: [señor]}, notes: {en: 'Señora for a woman, señorita for a young one. Before a surname it takes el when you talk about him (el señor Díaz) but not when you talk to him (buenos días, señor Díaz).'}}
- {id: 'sense:vecino', gloss: {en: 'neighbour (vecina: a woman)'}, forms: {es-Latn/standard: [vecino]}, notes: {en: 'La vecina de al lado: the next-door neighbour. With v, and c before i: vecino, vecina.'}}
- {id: 'sense:amanecer', gloss: {en: 'to wake up; to dawn'}, forms: {es-Latn/standard: [amanecer]}, notes: {en: '¿Cómo amaneció? (usted) or ¿Cómo amaneciste? (tú): how are you this morning? A Cuban morning greeting, above all to elders. El amanecer: dawn.'}}
- {id: 'sense:bendición', gloss: {en: 'blessing'}, forms: {es-Latn/standard: [bendición]}, notes: {en: '¡La bendición! or ¡Bendición, abuela!: what Cuban children say to grandparents, parents and godparents when they arrive and when they leave, and many grown men still do. The answer is ¡Dios te bendiga!'}}
- {id: 'sense:dios-te-bendiga', gloss: {en: 'God bless you'}, forms: {es-Latn/standard: [Dios te bendiga]}, notes: {en: 'The answer to ¡Bendición! To someone you call usted: Dios lo bendiga (a man), Dios la bendiga (a woman). Bendiga is the subjunctive of bendecir (unit 21).'}}
- {id: 'sense:pedir', gloss: {en: 'to ask for; to order (food)'}, forms: {es-Latn/standard: [pedir]}, notes: {en: 'Pido, pides, pide, piden: the e becomes i. Pedir is to ask for something (pedir la bendición, pedir una cita); to ask a question is preguntar.'}}
- {id: 'sense:mayor', gloss: {en: 'older; elder; los mayores: elders, grown-ups'}, forms: {es-Latn/standard: [mayor]}, notes: {en: 'Mi hermano mayor: my older brother. Una persona mayor: an older person, the polite way to say old. Respect for los mayores is the first rule of a Cuban house.'}}
- {id: 'sense:respeto', gloss: {en: 'respect'}, forms: {es-Latn/standard: [respeto]}, notes: {en: 'Con respeto; con todo respeto. ¡Más respeto! is what an abuela says when you answer back. The verb is respetar.'}}
- {id: 'sense:permiso', gloss: {en: 'permission; con permiso: excuse me (to pass, come in or leave)'}, forms: {es-Latn/standard: [permiso]}, notes: {en: 'Say con permiso when you walk past someone, come into a house or get up from the table. Cubans answer ¡propio! or ¡adelante!'}}
- {id: 'sense:disculpar', gloss: {en: 'to excuse; disculpe: excuse me, sorry (usted)'}, forms: {es-Latn/standard: [disculpar]}, notes: {en: 'Disculpe to get someone''s attention or to say sorry; disculpa to a friend. Heritage speakers often say excúseme, after English; Cubans say disculpe, perdone or con permiso.'}}
- {id: 'sense:perdonar', gloss: {en: 'to forgive; perdone: sorry, pardon me (usted)'}, forms: {es-Latn/standard: [perdonar]}, notes: {en: 'Perdone or perdón: sorry, pardon me. Perdona to a friend. ¿Perdón? also asks someone to say it again.'}}
- {id: 'sense:molestia', gloss: {en: 'bother; trouble'}, forms: {es-Latn/standard: [molestia]}, notes: {en: 'Disculpe la molestia: sorry to bother you. No es molestia: it''s no trouble. A false friend: molestar is to bother, never to molest.'}}
- {id: 'sense:momento', gloss: {en: 'moment'}, forms: {es-Latn/standard: [momento]}, notes: {en: 'Un momento, por favor: one moment, please. Cubans make words ending in -to smaller with -ico: un momentico, chiquitico.'}}
- {id: 'form:cond', gloss: {en: 'conditional: would (hablaría, podría)'}, notes: {en: 'The infinitive plus -ía, always with its accent: hablaría, comería, iría. Some stems shorten as in the future: podría, tendría, haría, vendría. Me gustaría, ¿podría…? and ¿sería posible…? are the polite way to ask.'}}
- {id: 'form:subj-past', gloss: {en: 'imperfect subjunctive (si hablara, si tuviera)'}, notes: {en: 'Here only quisiera, I would like: the politest way to ask (quisiera una cita). Units 27 and 28 teach the rest.'}}
- {id: 'sense:ayudar', gloss: {en: 'to help'}, forms: {es-Latn/standard: [ayudar]}, notes: {en: 'Ayudar a alguien. Spelled with y. ¿Me podría ayudar?: could you help me? La ayuda: help.'}}
- {id: 'sense:favor', gloss: {en: 'favour; ¿me hace el favor de…?: would you please…?'}, forms: {es-Latn/standard: [favor]}, notes: {en: '¿Me hace el favor de…? is how Cubans ask an elder or a stranger; ¿me haces el favor? to a friend. Por favor: please. El favor is masculine.'}}
- {id: 'sense:amable', gloss: {en: 'kind; nice'}, forms: {es-Latn/standard: [amable]}, notes: {en: 'Muy amable, or es usted muy amable: how kind of you. One form for men and women.'}}
- {id: 'sense:consultorio', gloss: {en: 'doctor''s office; clinic'}, forms: {es-Latn/standard: [consultorio]}, notes: {en: 'El consultorio del médico. In Miami you hear la oficina del doctor, from English; una oficina is where people work at desks.'}}
- {id: 'sense:cita', gloss: {en: 'appointment; date'}, forms: {es-Latn/standard: [cita]}, notes: {en: 'Hacer una cita: to make an appointment (not hacer un appointment). Also a date with someone. In Cuba a doctor''s appointment is often un turno.'}}
- {id: 'sense:posible', gloss: {en: 'possible'}, forms: {es-Latn/standard: [posible]}, notes: {en: '¿Sería posible…?: would it be possible…? The politest way to ask an office for something. Lo antes posible: as soon as possible.'}}
