# Unit 29 (es): ¿Quién soy? Being Cuban-American: ni de aquí ni de allá, ¿De dónde tú eres?, medio yuma. Spanglish
# is how the family talks at home, and nothing here corrects it; the unit adds the Spanish a form, a job interview or
# a cousin in Havana expects: la carpeta and la alfombra, el rufo and el techo, vacunar la carpeta and pasar la
# aspiradora, aplicar and solicitar (la planilla, el puesto bilingüe), llamar para atrás and devolver la llamada,
# hacer sentido and tener sentido, realizar and darse cuenta. Reported speech with the shift of tenses: dijo que era,
# me dijo que me llamarían, me preguntó si podía, me preguntó de dónde era, me pidió que le contara.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u29
title: {en: '¿Quién soy? Who am I?'}
cefr: B2
kcs:
- {id: 'sense:americano', gloss: {en: American (from the US)}, forms: {es-Latn/standard: [americano]}, notes: {en: 'In Cuba and in Miami, americano means from the United States. Formal Spanish also says estadounidense, and many Latin Americans will remind you that they are americanos too. No capital: los americanos, el inglés americano.'}}
- {id: 'sense:cubanoamericano', gloss: {en: Cuban-American}, forms: {es-Latn/standard: [cubanoamericano]}, notes: {en: 'One word, no hyphen and no capital: cubanoamericano, and for a woman cubanoamericana (the first part keeps its o). Some write cubano-americano.'}}
- {id: 'sense:ni', gloss: {en: 'neither; nor; not even (ni… ni…: neither… nor…)'}, forms: {es-Latn/standard: [ni]}, notes: {en: 'Ni de aquí ni de allá: neither from here nor from there, how many children of exiles feel. Ni una palabra: not a single word. After a verb with no, the second item takes ni: no hablo francés ni alemán.'}}
- {id: 'sense:espanglish', gloss: {en: Spanglish}, forms: {es-Latn/standard: [espanglish]}, notes: {en: 'The RAE spells it espanglish; Spanglish is just as common. Switching between English and Spanish, even inside one sentence, takes two languages and real skill (linguists call it code-switching). It is how many Cuban families in Miami talk at home.'}}
- {id: 'sense:idioma', gloss: {en: language}, forms: {es-Latn/standard: [idioma]}, notes: {en: 'Masculine though it ends in -a: el idioma, like el día and el problema. La lengua says the same (and is also the tongue). Languages take no capital: el inglés, el español.'}}
- {id: 'sense:alfombra', gloss: {en: carpet; rug}, forms: {es-Latn/standard: [alfombra]}, notes: {en: 'La alfombra: a carpet or a rug. With f, never ph. In Miami many say la carpeta, from English carpet; in Spanish una carpeta is a folder.'}}
- {id: 'sense:techo', gloss: {en: roof; ceiling}, forms: {es-Latn/standard: [techo]}, notes: {en: 'El techo is both the roof and the ceiling inside; la azotea is a flat roof you can walk on. Miami Spanglish says el rufo.'}}
- {id: 'sense:aspiradora', gloss: {en: 'vacuum cleaner; pasar la aspiradora: to vacuum'}, forms: {es-Latn/standard: [aspiradora]}, notes: {en: 'Pasar la aspiradora (por la alfombra): to vacuum (the carpet). Aspirar: to breathe in; to suck up. In Hialeah you may hear vacunar la carpeta, which in Spanish would be to vaccinate the folder.'}}
- {id: 'sense:carpeta', gloss: {en: 'folder; (Miami Spanglish) carpet'}, forms: {es-Latn/standard: [carpeta]}, notes: {en: 'In Spanish una carpeta is a folder for papers, and in Cuba also the front desk of a hotel. Carpeta for carpet is Miami Spanglish, from English; the carpet is la alfombra.'}}
- {id: 'sense:rufo', gloss: {en: 'roof (Miami Spanglish)'}, forms: {es-Latn/standard: [rufo]}, notes: {en: 'Miami Spanglish, from English roof. In Spanish, el techo. Hialeah understands el rufo; Havana does not.'}}
- {id: 'sense:vacunar', gloss: {en: 'to vaccinate; (Miami Spanglish) to vacuum'}, forms: {es-Latn/standard: [vacunar]}, notes: {en: 'Vacunar is to vaccinate: vacunar a los niños; la vacuna, the vaccine. Vacunar la carpeta (to vacuum the carpet) is the classic Miami Spanglish joke: a Cuban from the island pictures someone giving a folder a shot. Say pasar la aspiradora por la alfombra.'}}
- {id: 'sense:solicitar', gloss: {en: to apply for; to request}, forms: {es-Latn/standard: [solicitar]}, notes: {en: 'Solicitar un puesto, el pasaporte, una beca: to apply for a job, a passport, a scholarship. La solicitud: the application. In Miami you hear aplicar para un trabajo, from English apply for.'}}
- {id: 'sense:puesto', gloss: {en: 'job; position; post'}, forms: {es-Latn/standard: [puesto]}, notes: {en: 'Un puesto (de trabajo): a job, a position; un trabajo and un empleo say the same. Also a stall at a market (un puesto de frutas). Puesto is also the participle of poner: he puesto la mesa.'}}
- {id: 'sense:aplicar', gloss: {en: 'to apply (a cream, a rule); (Miami Spanglish) to apply for'}, forms: {es-Latn/standard: [aplicar]}, notes: {en: 'In Spanish you aplicar a cream, a rule or a discount: aplicar la ley. Aplicar para un trabajo comes from English; in a job interview, say solicitar un puesto (aplicar a un puesto is spreading in Latin America). Apliqué, with qu.'}}
- {id: 'sense:entrevista', gloss: {en: interview}, forms: {es-Latn/standard: [entrevista]}, notes: {en: 'Una entrevista de trabajo: a job interview. Entrevistar: to interview. With v: entre + vista.'}}
- {id: 'sense:bilingüe', gloss: {en: bilingual}, forms: {es-Latn/standard: [bilingüe]}, notes: {en: 'With ü: the two dots (la diéresis) tell you to say the u, bi-lin-güe, as in pingüino and vergüenza. Without them, gue sounds as in guerra. In Miami, un puesto bilingüe often pays more.'}}
- {id: 'sense:llenar', gloss: {en: 'to fill; to fill in, fill out (a form)'}, forms: {es-Latn/standard: [llenar]}, notes: {en: 'Llenar un vaso: to fill a glass; llenar la planilla: to fill in (or out) the form, with nothing after the verb. With ll, like llamar and llegar.'}}
- {id: 'sense:planilla', gloss: {en: 'form (to fill in) (Cuban)'}, forms: {es-Latn/standard: [planilla]}, notes: {en: 'What Cubans call a form you fill in: llenar una planilla. Elsewhere el formulario, which is accepted too. In Spain una planilla is a template.'}}
- {id: 'sense:devolver', gloss: {en: 'to give back; to return (something); devolver la llamada: to call back'}, forms: {es-Latn/standard: [devolver]}, notes: {en: 'Devolver un libro: to return a book. Devolver la llamada: to call back (te devuelvo la llamada). O becomes ue: devuelvo, devuelve; the participle is devuelto. Llamar para atrás is English call back, word for word.'}}
- {id: 'sense:atrás', gloss: {en: 'back; behind (para atrás: backwards)'}, forms: {es-Latn/standard: [atrás]}, notes: {en: 'With an accent on the á. Está atrás: it''s at the back. Te llamo para atrás (I''ll call you back) is Miami Spanglish: a Cuban on the island hears I''ll call you backwards. In Spanish: te devuelvo la llamada, or ahorita te llamo.'}}
- {id: 'sense:sentido', gloss: {en: 'sense; meaning; tener sentido: to make sense'}, forms: {es-Latn/standard: [sentido]}, notes: {en: 'Eso tiene sentido: that makes sense. Hace sentido, from English makes sense, is heard all over Miami; in an interview or in writing, say tiene sentido. Also el sentido del humor, a sense of humour.'}}
- {id: 'sense:cuenta', gloss: {en: 'bill; account; darse cuenta: to realize'}, forms: {es-Latn/standard: [cuenta]}, notes: {en: 'La cuenta: the bill (la cuenta, por favor) and an account (una cuenta de banco). Darse cuenta de que…: to realize that… (me di cuenta de que era tarde); keep the de before que. To realize is never realizar.'}}
- {id: 'sense:realizar', gloss: {en: 'to carry out; to hold; to make come true'}, forms: {es-Latn/standard: [realizar]}, notes: {en: 'A formal verb: realizar una entrevista, to hold an interview; realizar un sueño, to make a dream come true. It never means to realize: that is darse cuenta. Realicé, with c before e.'}}
- {id: 'sense:preguntar', gloss: {en: 'to ask (a question); preguntar si: to ask whether'}, forms: {es-Latn/standard: [preguntar]}, notes: {en: 'Me preguntó si era cubano; me preguntó dónde vivía (the question word keeps its accent inside the sentence). To ask for something, or to ask someone to do it, is pedir: me pidió un favor, me pidió que lo llamara. Me preguntó por un favor is English asked for.'}}
- {id: 'sense:contar', gloss: {en: to tell (a story); to count}, forms: {es-Latn/standard: [contar]}, notes: {en: 'O becomes ue: cuento, cuentas. Contarle algo a alguien: to tell someone about something (cuéntame todo). ¿Qué me cuentas?: what''s new? Un cuento is a story, as in los cuentos de Abuela.'}}
