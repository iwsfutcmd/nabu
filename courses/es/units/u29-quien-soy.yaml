- {id: es.u29.espanglish, kind: lesson, introduces: ['sense:espanglish', 'sense:idioma']}
- {id: es.u29.la-alfombra, kind: lesson, introduces: ['sense:alfombra', 'sense:techo', 'sense:aspiradora', 'sense:carpeta', 'sense:rufo', 'sense:vacunar']}
- {id: es.u29.la-entrevista, kind: lesson, introduces: ['sense:solicitar', 'sense:puesto', 'sense:aplicar', 'sense:entrevista', 'sense:bilingüe', 'sense:llenar', 'sense:planilla']}
- {id: es.u29.te-devuelvo, kind: lesson, introduces: ['sense:devolver', 'sense:atrás', 'sense:sentido', 'sense:cuenta', 'sense:realizar']}
- {id: es.u29.me-dijo, kind: lesson, introduces: ['sense:preguntar', 'sense:contar']}
