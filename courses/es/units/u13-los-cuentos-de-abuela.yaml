# Unit 13 (es): the preterite and the imperfect together. Abuela Cachita tells how she met Abuelo Pepe at a guateque
# in the Matanzas countryside: what life was like (the imperfect: vivía, había, bailaba) and what happened that
# night (the preterite: llegó, se rompió, me sacó a bailar); his 1957 máquina, the music, the first dance.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u13
title: {en: 'Los cuentos de Abuela: Grandma''s stories'}
cefr: B1
kcs:
- {id: 'sense:joven', gloss: {en: young; young person}, forms: {es-Latn/standard: [joven]}, notes: {en: 'The same for men and women: un joven, una joven. The plural takes an accent: jóvenes.'}}
- {id: 'sense:guateque', gloss: {en: country party with music and dancing (Cuban)}, forms: {es-Latn/standard: [guateque]}, notes: {en: 'A Cuban country party: a roast pig, son played on the tres, décimas improvised by guajiros, dancing till dawn. Now also any lively party at home.'}}
- {id: 'sense:música', gloss: {en: music}, forms: {es-Latn/standard: [música]}, notes: {en: 'With the accent on the mú, which heritage writers often leave out. Cuban music: son, danzón, bolero, guaracha.'}}
- {id: 'sense:bailar', gloss: {en: to dance}, forms: {es-Latn/standard: [bailar]}, notes: {en: 'Bailar con alguien: to dance with someone. Cubans dance casino (Cuban salsa) and, in Abuela''s day, son and danzón. Bailábamos: we used to dance, with its accent.'}}
- {id: 'sense:gente', gloss: {en: people}, forms: {es-Latn/standard: [gente]}, notes: {en: 'Singular in Spanish: la gente baila, la gente bailaba. La gente bailaban is a common slip. Mucha gente: a lot of people.'}}
- {id: 'sense:viejo', gloss: {en: 'old; old man (los viejos: old folks)'}, forms: {es-Latn/standard: [viejo]}, notes: {en: 'In Cuba mis viejos is my parents, said with love, and mi vieja my mom (or my wife). For people, mayor is the polite word: una señora mayor.'}}
- {id: 'sense:penoso', gloss: {en: shy; easily embarrassed (Cuban)}, forms: {es-Latn/standard: [penoso]}, notes: {en: 'In Cuba and the Caribbean, ser penoso is to be shy, and me da pena is I''m embarrassed. In Spain and Mexico penoso means painful or pitiful, and shy is tímido.'}}
- {id: 'sense:máquina', gloss: {en: car (Cuban); machine}, forms: {es-Latn/standard: [máquina]}, notes: {en: 'Older Cubans call a car una máquina; carro is common too (coche in Spain). The 1950s American cars still running in Cuba are almendrones; Abuelo Pepe''s was a 1957 Chevrolet.'}}
- {id: 'sense:lindo', gloss: {en: pretty; lovely; handsome}, forms: {es-Latn/standard: [lindo]}, notes: {en: 'Cubans say lindo of people and things: una máquina linda, un muchacho lindo. In Cuba guapo often means tough or angry (se puso guapo: he got mad); a handsome man is lindo or buen mozo.'}}
- {id: 'sense:lo', gloss: {en: 'him; it (la: her, it; los, las: them)'}, forms: {es-Latn/standard: [lo]}, notes: {en: 'Lo for a man or a masculine word, la for a woman or a feminine one: la arregló (the máquina). It goes before the verb: todos lo miraron, everyone looked at him.'}}
- {id: 'sense:mirar', gloss: {en: to look (at); to watch}, forms: {es-Latn/standard: [mirar]}, notes: {en: 'Mirar is to look at, ver to see. A before a person (mirar a Pepe), not before a thing (mirar la máquina). Cubans open sentences with ¡Mira…!: look, listen.'}}
- {id: 'sense:mecánico', gloss: {en: mechanic}, forms: {es-Latn/standard: [mecánico]}, notes: {en: 'Stress and accent on the cá. In Cuba a good mechanic keeps a seventy-year-old car running with parts he makes himself.'}}
- {id: 'sense:romperse', gloss: {en: to break; to break down}, forms: {es-Latn/standard: [romperse]}, notes: {en: 'La máquina se rompió: the car broke down. Cubans also say se descompuso. Without se, romper is to break something: rompí el vaso.'}}
- {id: 'sense:arreglar', gloss: {en: to fix; to repair}, forms: {es-Latn/standard: [arreglar]}, notes: {en: 'Arreglar la máquina: to fix the car. Arreglarse is to get dressed up: Abuela se arreglaba para los guateques.'}}
- {id: 'sense:mientras', gloss: {en: while}, forms: {es-Latn/standard: [mientras]}, notes: {en: 'Mientras todos miraban: while everyone watched. What goes on in the background is in the imperfect.'}}
- {id: 'sense:conocer', gloss: {en: 'to know (a person, a place); to meet (conocí: I met)'}, forms: {es-Latn/standard: [conocer]}, notes: {en: 'In the preterite it is to meet for the first time: conocí a tu abuelo. A before a person. To know a fact is saber. Conozco, I know, is spelled with zc.'}}
- {id: 'sense:sacar', gloss: {en: 'to take out; sacar a bailar: to ask to dance'}, forms: {es-Latn/standard: [sacar]}, notes: {en: 'Sacar a bailar: to ask someone to dance, to lead them onto the floor. Saqué, I took out: c becomes qu before e.'}}
- {id: 'sense:primero', gloss: {en: first}, forms: {es-Latn/standard: [primero]}, notes: {en: 'Primer before a masculine noun: mi primer novio, el primer baile; but la primera vez. On its own it also means first of all.'}}
- {id: 'sense:vez', gloss: {en: 'time (an occasion); una vez: once'}, forms: {es-Latn/standard: [vez]}, notes: {en: 'La primera vez: the first time. The plural is veces, with c. Clock time is la hora, and time that passes is el tiempo.'}}
- {id: 'sense:decir', gloss: {en: to say; to tell}, forms: {es-Latn/standard: [decir]}, notes: {en: 'Me dijo que…: he told me that… No i after the j: dijeron, not dijieron; dijiste, not dijistes.'}}
- {id: 'sense:novio', gloss: {en: 'boyfriend; fiancé; groom (novia: girlfriend; bride)'}, forms: {es-Latn/standard: [novio]}, notes: {en: 'One word for boyfriend, fiancé and groom. In Abuela''s day a novio visited at the house, with the family in the sala.'}}
- {id: 'sense:enamorarse', gloss: {en: to fall in love}, forms: {es-Latn/standard: [enamorarse]}, notes: {en: 'Enamorarse de alguien: to fall in love with someone. De, not con: me enamoré de él.'}}
- {id: 'sense:casarse', gloss: {en: to get married}, forms: {es-Latn/standard: [casarse]}, notes: {en: 'Casarse con alguien: to marry someone. Casar (to marry) and cazar (to hunt) sound the same in Cuba; the spelling tells them apart.'}}
