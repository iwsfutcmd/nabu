scenarios:
- id: es.como-conociste
  after: es.u13.nos-casamos
  title: {en: 'How did you meet Abuela?'}
  setting: {en: 'A Saturday afternoon in the carport of the family house in Hialeah. Abuelo Pepe, a retired mechanic, has his head under the hood of a neighbour''s old car; a radio plays boleros, and there is a cafecito on the toolbox.'}
  character: {en: 'Abuelo Pepe, in his eighties, born in Matanzas: a retired mechanic who loves to tell stories and improves them a little each time. His version of how he met Cachita (a guateque in the Matanzas countryside, his 1957 Chevrolet, the first dance) is not quite hers. He speaks warm, fast Cuban Spanish and says tú to his grandchildren.'}
  goal: {en: 'Ask Abuelo Pepe where and how he met Abuela, what she was like then, what the guateque and his car were like, and what happened that night. Use the imperfect for how things were and the preterite for what happened, and tell him one thing Abuela tells differently.'}
