# Unit 4 (es): food and drink the Cuban way (arroz con frijoles negros, congrí, maduros, tostones, fruta bomba,
# cafecito, colada), gustar, querer, comer and tomar in every present person; lunch at Abuela's.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits review by a native speaker.
id: u04
title: {en: 'La comida: food and drink'}
cefr: A1
kcs:
- {id: 'sense:comer', gloss: {en: to eat}, forms: {es-Latn/standard: [comer]}, notes: {en: 'Como, comes, come, comemos, comen: the model for regular -er verbs (beber, to drink, goes the same way). Como without an accent is I eat; cómo with one asks how.'}}
- {id: 'sense:arroz', gloss: {en: rice}, forms: {es-Latn/standard: [arroz]}, notes: {en: 'Written with z, though Cubans say it with an s sound. Arroz blanco with frijoles negros is the everyday Cuban plate.'}}
- {id: 'sense:con', gloss: {en: with}, forms: {es-Latn/standard: [con]}, notes: {en: 'Arroz con pollo, café con leche.'}}
- {id: 'sense:pollo', gloss: {en: chicken}, forms: {es-Latn/standard: [pollo]}, notes: {en: 'Written with ll, said like y in Cuba and most of the Americas. Arroz con pollo is a Sunday dish.'}}
- {id: 'sense:frijol', gloss: {en: bean}, forms: {es-Latn/standard: [frijol]}, notes: {en: 'Frijoles in Cuba, Mexico and Central America; habichuelas in Puerto Rico and the Dominican Republic, caraotas in Venezuela, porotos in the Southern Cone, judías or alubias in Spain.'}}
- {id: 'sense:negro', gloss: {en: black}, forms: {es-Latn/standard: [negro]}, notes: {en: 'Frijoles negros: black beans, the Cuban default. In Cuban families mi negro, mi negra is also a term of endearment.'}}
- {id: 'sense:congrí', gloss: {en: rice and beans cooked together}, forms: {es-Latn/standard: [congrí]}, notes: {en: 'Rice cooked in one pot with beans. Strictly, congrí is made with red beans, as in eastern Cuba, and moros y cristianos with black beans, but many families call both congrí. Write the accent: con-GRÍ.'}}
- {id: 'sense:gustar', gloss: {en: 'to like (me gusta: I like)'}, forms: {es-Latn/standard: [gustar]}, notes: {en: 'Me gusta el café: literally, coffee pleases me. With something plural the verb is plural too: me gustan los tostones, not me gusta los tostones. Te gusta: you like.'}}
- {id: 'sense:mucho', gloss: {en: a lot; much; many}, forms: {es-Latn/standard: [mucho]}, notes: {en: 'It agrees with its noun: mucho café, mucha hambre, muchos frijoles. After a verb it stays mucho: me gusta mucho.'}}
- {id: 'sense:plátano', gloss: {en: plantain; banana}, forms: {es-Latn/standard: [plátano]}, notes: {en: 'In Cuba the plátano is the plantain, cooked green (tostones) or ripe (maduros). A sweet banana is a plátano fruta (guineo in Puerto Rico and the Dominican Republic, banana elsewhere). The accent is on the first a: PLÁ-ta-no.'}}
- {id: 'sense:maduro', gloss: {en: 'ripe; maduros: fried sweet plantains'}, forms: {es-Latn/standard: [maduro]}, notes: {en: 'Plátanos maduros, or just maduros: ripe plantains fried until sweet and dark at the edges. Maduro also means mature, of people.'}}
- {id: 'sense:tostón', gloss: {en: fried green plantain slice}, forms: {es-Latn/standard: [tostón]}, notes: {en: 'Green plantain cut in thick slices, fried, flattened and fried again. The accent goes away in the plural: tostón, tostones. Patacón in Colombia and Venezuela.'}}
- {id: 'sense:querer', gloss: {en: to want; to love}, forms: {es-Latn/standard: [querer]}, notes: {en: 'Quiero, quieres, quiere, quieren: e becomes ie, except in queremos. Te quiero: I love you (family, friends, a partner).'}}
- {id: 'sense:agua', gloss: {en: water}, forms: {es-Latn/standard: [agua]}, notes: {en: 'Feminine, but el agua: el comes before a stressed a-, as in el hambre. Agua fría: cold water.'}}
- {id: 'sense:por-favor', gloss: {en: please}, forms: {es-Latn/standard: [por favor]}}
- {id: 'sense:rico', gloss: {en: delicious; tasty; rich}, forms: {es-Latn/standard: [rico]}, notes: {en: '¡Qué rico!: how delicious! Cubans say it about food, a breeze, a nap, anything good. Está rico: it tastes good; es rico: he is rich.'}}
- {id: 'sense:fruta-bomba', gloss: {en: papaya (Cuban)}, forms: {es-Latn/standard: [fruta bomba]}, notes: {en: 'In Cuba papaya is a vulgar slang word, so the fruit is called fruta bomba. Everywhere else it is papaya.'}}
- {id: 'sense:cafecito', gloss: {en: Cuban coffee; a shot of Cuban espresso}, forms: {es-Latn/standard: [cafecito]}, notes: {en: 'Café plus -ito, which makes things small or dear (Danielito, ahorita). A cafecito is a shot of strong espresso with sugar whipped into a foam, la espumita.'}}
- {id: 'sense:tomar', gloss: {en: to drink; to take}, forms: {es-Latn/standard: [tomar]}, notes: {en: 'Cubans usually say tomar for drinks: tomar café, tomar agua. Beber means the same and is understood everywhere.'}}
- {id: 'sense:leche', gloss: {en: milk}, forms: {es-Latn/standard: [leche]}, notes: {en: 'Café con leche, with buttered and toasted Cuban bread to dip in it, is the Cuban breakfast.'}}
- {id: 'sense:colada', gloss: {en: a big Cuban coffee to share}, forms: {es-Latn/standard: [colada]}, notes: {en: 'A large Cuban coffee in a foam cup, sold with a stack of thimble-sized plastic cups so it can go round the office: a Miami ritual.'}}
- {id: 'sense:hambre', gloss: {en: 'hunger; tener hambre: to be hungry'}, forms: {es-Latn/standard: [hambre]}, notes: {en: 'Written with an h that is never said. Feminine, though it takes el (el hambre): mucha hambre.'}}
- {id: 'sense:cerveza', gloss: {en: beer}, forms: {es-Latn/standard: [cerveza]}, notes: {en: 'Written with v and z: cer-VE-za. Una cerveza bien fría: an ice-cold beer (bien: very).'}}
