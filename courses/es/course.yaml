# Cuban Spanish (es) for heritage speakers, A1 to B2 in thirty units (ADR 0074; the brief is README.md).
# The canonical answers are Cuban (guagua, ¿Qué tú quieres?); pan-Hispanic forms are accepted too.
# A heritage speaker places with the adaptive placement test (ADR 0075), which has them type their answers.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a native speaker's review.
id: es
target: es-Latn-CU
orthographies: [es-Latn/standard]
support: [en-Latn/standard]
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@1ebc6e7db77a', status: draft}
# A Spanish verb is fusional: a new verb in a new tense is two KCs on one word (sense + form), so a
# sentence may bring in two.
iPlusOne: 2
# Placement (ADR 0075) has production typed, so it also checks spelling and accent marks.
placement: {production: typed}
units: [units/u01-que-bola.yaml, units/u02-la-familia.yaml, units/u03-la-casa.yaml, units/u04-la-comida.yaml, units/u05-los-numeros.yaml, units/u06-el-barrio.yaml, units/u07-el-dia.yaml, units/u08-de-compras.yaml, units/u09-ayer.yaml, units/u10-el-viaje.yaml]
