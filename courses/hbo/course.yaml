# Biblical Hebrew (hbo): the Hebrew of the Bible, read in the Tiberian pointing (ADR 0082). Not Modern Hebrew.
# Each unit's lessons teach the words of a passage of the Hebrew Bible, and its story reads it: the text of
# the Westminster Leningrad Codex (public domain), without its accents. Vowel points are shown by default;
# "Vowel marks" off shows the consonantal text alone.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a reviewer.
id: hbo
target: hbo-Hebr
orthographies: [hbo-Hebr/tiberian]
support: [en-Latn/standard]
# What the app calls the course and its orthographies, and what the course list says of them, by
# language (ADR 0109).
names:
  en:
    course: Biblical Hebrew
    blurb: "The Hebrew of the Bible, with its vowel points, learned through its own passages."
    orthographies:
      hbo-Hebr/tiberian: "Hebrew script, Tiberian pointing"
  # The other languages' names are an LLM's drafts, made for the draft UI catalogs (ADR 0070), and
  # await review as those do.
  ar:
    course: "العبرية التوراتية"
    orthographies:
      hbo-Hebr/tiberian: "الخط العبري بالتشكيل الطبري"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  fa:
    course: "عبری کتاب مقدس"
    orthographies:
      hbo-Hebr/tiberian: "خط عبری با اعراب طبری"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  uz:
    course: "Bibliya ibroniy tili"
    orthographies:
      hbo-Hebr/tiberian: "Ibroniy yozuvi, Tiberiya harakatlari"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  uz-Cyrl:
    course: "Библия иброний тили"
    orthographies:
      hbo-Hebr/tiberian: "Иброний ёзуви, Тиберия ҳаракатлари"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  zh-Hant-HK:
    course: "聖經希伯來文"
    orthographies:
      hbo-Hebr/tiberian: "希伯來字母（提比利亞標音）"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@hbo-draft-v1', status: draft}
# A Hebrew verb is a root and a form: a new verb in a new form is two KCs on one word (sense + form).
iPlusOne: 2
# Every facet but listen (ADR 0071): Biblical Hebrew is read, not heard, so no listening exercises. The clips
# still say each card once it is answered, and speaking cards stay (reading aloud).
facets: [recognize, produce, speak, read-script, write-script]
# Audio (ADR 0082, 0089): never Modern Hebrew. Each word's pinned Tiberian reading is given as IPA phonemes
# (nabu.audio.tiberian.piper) to Piper's Arabic voice, ar_JO-kareem: the vowels and the stress as Khan describes
# the Masoretes' reading, the consonants Arabic-bent (vav [w], alveolar [r], the Arabic emphatics, all six
# begadkefat spirants). A word card ends with a full stop, as a sentence does (finalStop). One voice, a man's,
# reads everything (ADR 0078). The clips are MIT, the model's license.
audio:
  # ADR 0091: a stopgap voice (an Arabic voice given Tiberian phonemes): its clips reinforce what is read, and no exercise relies on hearing them.
  quality: iffy
  voices:
  - {id: kareem, provider: piper, voice: ar_JO-kareem-medium, speaker: m, orthography: hbo-Hebr/tiberian, reading: tiberian, finalStop: true, license: MIT}
units: [units/u01-let-there-be-light.yaml, units/u02-in-the-beginning.yaml, units/u03-where-are-you.yaml, units/u04-what-have-you-done.yaml, units/u05-my-brothers-keeper.yaml, units/u06-go-forth.yaml, units/u07-here-i-am.yaml, units/u08-at-the-well.yaml, units/u09-seeking-my-brothers.yaml, units/u10-the-burning-bush.yaml, units/u11-the-ten-words.yaml, units/u12-hear-o-israel.yaml, units/u13-where-you-go.yaml, units/u14-speak-lord.yaml, units/u15-in-the-name-of-the-lord.yaml, units/u16-the-wise-king.yaml, units/u17-jonah-runs-away.yaml, units/u18-i-am-a-hebrew.yaml, units/u19-my-shepherd.yaml, units/u20-a-time-for-everything.yaml]
