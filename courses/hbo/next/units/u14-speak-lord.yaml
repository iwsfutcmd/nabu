scenarios:
- id: hbo.in-the-temple-at-shiloh
  after: hbo.u14.he-stood-and-called
  title:
    en: In the temple at Shiloh
  setting:
    en: The house of the LORD at Shiloh, before dawn; the lamp of God has not yet gone out.
  character:
    en: Eli the old priest, half asleep and nearly blind, who speaks only Biblical Hebrew.
  goal:
    en: Tell Eli that someone called you three times, ask him what to say, and say that you will go back and lie down.
