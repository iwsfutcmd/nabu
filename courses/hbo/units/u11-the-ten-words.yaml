      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: אָנֹכִי יְהוָה אֱלֹהֶיךָ אֲשֶׁר הוֹצֵאתִיךָ מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים׃
          tokens: [{surface: אָנֹכִי, sense: anokhi, readings: {tiberian: ʾānōḵî}}, {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֱלֹהֶיךָ, sense: elohim, morphs: [{surface: אֱלֹהֶי,
                  kc: 'sense:elohim'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ʾĕlōhếḵā}}, {surface: אֲשֶׁר, sense: asher, readings: {tiberian: ʾăšer}}, {surface: הוֹצֵאתִיךָ, sense: hotsi,
              form: 'form:qatal-1cs', morphs: [{surface: הוֹצֵאתִי, kc: 'sense:hotsi'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: hôṣēʾṯî́ḵā}}, {surface: מֵאֶרֶץ, sense: erets, form: 'form:cstr',
              morphs: [{surface: מֵ, kc: 'sense:min'}, {surface: אֶרֶץ, kc: 'sense:erets'}], readings: {tiberian: mēʾéreṣ}}, {surface: מִצְרַיִם, sense: mitsrayim, readings: {tiberian: miṣráyim}}, {surface: מִבֵּית,
              sense: bayit, form: 'form:cstr', morphs: [{surface: מִ, kc: 'sense:min'}, {surface: בֵּית, kc: 'sense:bayit'}], readings: {tiberian: mibbêṯ}}, {surface: עֲבָדִים, sense: eved, form: 'form:pl',
              readings: {tiberian: ʿăḇāḏîm}}]
      translations:
        en: “I am the LORD your God, who brought you out of the land of Egypt, out of the house of slavery.
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: לֹא יִהְיֶה־לְךָ אֱלֹהִים אֲחֵרִים עַל־פָּנָיַ׃
          tokens: [{surface: לֹא, sense: lo, readings: {tiberian: lōʾ}}, {surface: יִהְיֶה, sense: hayah, form: 'form:yiqtol-3ms', readings: {tiberian: yihyeh-}}, {surface: לְךָ, sense: le, morphs: [{surface: לְ,
                  kc: 'sense:le'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ləḵā}}, {surface: אֱלֹהִים, sense: elohim, readings: {tiberian: ʾĕlōhîm}}, {surface: אֲחֵרִים, sense: aher, form: 'form:pl',
              readings: {tiberian: ʾăḥērîm}}, {surface: עַל, sense: al, readings: {tiberian: ʿal-}}, {surface: פָּנָיַ, sense: panim, morphs: [{surface: פָּנָ, kc: 'sense:panim'}, {surface: יַ, kc: 'form:sfx-1cs'}],
              readings: {tiberian: pānā́y}}]
      translations:
        en: You shall have no other gods before me.
  - choose:
      prompt:
        en: Who speaks these words?
      options: [{en: 'the LORD, who brought Israel out of Egypt'}, {en: 'Moses, to his father-in-law'}, {en: a king of Egypt}]
      answer: 0
  - line:
      speaker: god
      ask: complete
      gap: sense:em
      distractors: ['sense:ah', 'sense:ben']
      forms:
        hbo-Hebr/tiberian:
          text: כַּבֵּד אֶת־אָבִיךָ וְאֶת־אִמֶּךָ לְמַעַן יַאֲרִכוּן יָמֶיךָ עַל הָאֲדָמָה אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ׃
          tokens: [{surface: כַּבֵּד, sense: kibbed, form: 'form:inf-abs', readings: {tiberian: kabbēḏ}}, {surface: אֶת, sense: et, readings: {tiberian: ʾeṯ-}}, {surface: אָבִיךָ, sense: av, morphs: [{
                  surface: אָבִי, kc: 'sense:av'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ʾāḇî́ḵā}}, {surface: וְאֶת, sense: et, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: אֶת,
                  kc: 'sense:et'}], readings: {tiberian: wəʾeṯ-}}, {surface: אִמֶּךָ, sense: em, morphs: [{surface: אִמֶּ, kc: 'sense:em'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ʾimméḵā}},
            {surface: לְמַעַן, sense: lemaan, readings: {tiberian: ləmáʿan}}, {surface: יַאֲרִכוּן, sense: heerikh, form: 'form:yiqtol-3mp', readings: {tiberian: yaʾăriḵûn}}, {surface: יָמֶיךָ, sense: yom,
              form: 'form:pl', morphs: [{surface: יָמֶי, kc: 'sense:yom'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: yāmếḵā}}, {surface: עַל, sense: al, readings: {tiberian: ʿal}}, {surface: הָאֲדָמָה,
              sense: adamah, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: אֲדָמָה, kc: 'sense:adamah'}], readings: {tiberian: hāʾăḏāmâ}}, {surface: אֲשֶׁר, sense: asher, readings: {tiberian: ʾăšer-}},
            {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֱלֹהֶיךָ, sense: elohim, morphs: [{surface: אֱלֹהֶי, kc: 'sense:elohim'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {
                tiberian: ʾĕlōhếḵā}}, {surface: נֹתֵן, sense: natan, form: 'form:ptc-ms', readings: {tiberian: nōṯēn}}, {surface: לָךְ, sense: le, morphs: [{surface: לָ, kc: 'sense:le'}, {surface: ךְ, kc: 'form:sfx-2ms'}],
              readings: {tiberian: lāḵ}}]
      translations:
        en: Honour your father and your mother, so that your days may be long on the land that the LORD your God is giving you.
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: לֹא תִּרְצָח׃
          tokens: [{surface: לֹא, sense: lo, readings: {tiberian: lōʾ}}, {surface: תִּרְצָח, sense: ratsach, form: 'form:yiqtol-2ms', readings: {tiberian: tirṣāḥ}}]
      translations:
        en: You shall not murder.
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: לֹא תִּנְאָף׃
          tokens: [{surface: לֹא, sense: lo, readings: {tiberian: lōʾ}}, {surface: תִּנְאָף, sense: naaf, form: 'form:yiqtol-2ms', readings: {tiberian: tinʾāp̄}}]
      translations:
        en: You shall not commit adultery.
  - line:
      speaker: god
      ask: complete
      gap: sense:ganav
      distractors: ['sense:ratsach', 'sense:naaf']
      forms:
        hbo-Hebr/tiberian:
          text: לֹא תִּגְנֹב׃
          tokens: [{surface: לֹא, sense: lo, readings: {tiberian: lōʾ}}, {surface: תִּגְנֹב, sense: ganav, form: 'form:yiqtol-2ms', readings: {tiberian: tiḡnōḇ}}]
      translations:
        en: You shall not steal.
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: לֹא־תַעֲנֶה בְרֵעֲךָ עֵד שָׁקֶר׃
          tokens: [{surface: לֹא, sense: lo, readings: {tiberian: lōʾ-}}, {surface: תַעֲנֶה, sense: anah, form: 'form:yiqtol-2ms', readings: {tiberian: ṯaʿăneh}}, {surface: בְרֵעֲךָ, sense: rea, morphs: [
                {surface: בְ, kc: 'sense:be'}, {surface: רֵעֲ, kc: 'sense:rea'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ḇərēʿăḵā}}, {surface: עֵד, sense: ed, form: 'form:cstr', readings: {
                tiberian: ʿēḏ}}, {surface: שָׁקֶר, sense: sheqer, readings: {tiberian: šā́qer}}]
      translations:
