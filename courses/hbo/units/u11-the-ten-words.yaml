# Biblical Hebrew (hbo), unit 11: The ten words (Exodus 20:2-3, 12-16).
# Commands and prohibitions: לֹא with the imperfect ("you shall not"), the infinitive absolute as a
# command (כַּבֵּד "honour"), the converted perfect "and you shall", "so that", plural imperfects.
# The passage is the Westminster Leningrad Codex (public domain), without its accents (the Decalogue has
# two sets; one reading follows the lower), and the rest was drafted by an LLM (provenance llm:…, status
# draft) and awaits a reviewer.
id: u11-the-ten-words
title:
  en: The ten words
cefr: A2
kcs:
- id: sense:mitsrayim
  gloss:
    en: Egypt
  forms:
    hbo-Hebr/tiberian: [מִצְרַיִם]
- id: sense:yatsa
  gloss:
    en: to go out, come out
  forms:
    hbo-Hebr/tiberian: [יָצָא]
- id: sense:hotsi
  gloss:
    en: to bring out, lead out (hiphil of יָצָא)
  forms:
    hbo-Hebr/tiberian: [הוֹצִיא]
- id: sense:aher
  gloss:
    en: other, another
  forms:
    hbo-Hebr/tiberian: [אַחֵר]
- id: sense:em
  gloss:
    en: mother
  forms:
    hbo-Hebr/tiberian: [אֵם]
  notes:
    en: With suffixes אִמִּי ʾimmî 'my mother', אִמְּךָ / אִמֶּךָ 'your mother'.
- id: sense:kibbed
  gloss:
    en: to honour (piel of כָּבֵד)
  forms:
    hbo-Hebr/tiberian: [כִּבֵּד]
- id: form:inf-abs
  gloss:
    en: 'the infinitive absolute: as a command, ''do!'' (כַּבֵּד ''honour!'')'
- id: sense:lemaan
  gloss:
    en: so that, in order that; for the sake of
  forms:
    hbo-Hebr/tiberian: [מַעַן]
- id: sense:heerikh
  gloss:
    en: to make long, prolong (hiphil)
  forms:
    hbo-Hebr/tiberian: [הֶאֱרִיךְ]
- id: form:yiqtol-3mp
  gloss:
    en: 'they will do: the imperfect (yiqtol), they'
- id: sense:ratsach
  gloss:
    en: to murder
  forms:
    hbo-Hebr/tiberian: [רָצַח]
- id: sense:naaf
  gloss:
    en: to commit adultery
  forms:
    hbo-Hebr/tiberian: [נָאַף]
- id: sense:ganav
  gloss:
    en: to steal
  forms:
    hbo-Hebr/tiberian: [גָּנַב]
- id: form:yiqtol-2mp
  gloss:
    en: 'you will do: the imperfect (yiqtol), you (to several people)'
- id: sense:anah
  gloss:
    en: to answer; to testify
  forms:
    hbo-Hebr/tiberian: [עָנָה]
- id: sense:rea
  gloss:
    en: neighbour, fellow, friend
  forms:
    hbo-Hebr/tiberian: [רֵעַ]
- id: sense:ed
  gloss:
    en: witness
  forms:
    hbo-Hebr/tiberian: [עֵד]
- id: sense:sheqer
  gloss:
    en: 'lie, falsehood (עֵד שָׁקֶר: a false witness)'
  forms:
    hbo-Hebr/tiberian: [שֶׁקֶר]
- id: form:weqatal-2ms
  gloss:
    en: 'and you shall do: the converted perfect (weqatal), you'
- id: sense:kemo
  gloss:
    en: 'like, as (with suffixes: כָּמוֹךָ ''like you, as yourself'')'
  forms:
    hbo-Hebr/tiberian: [כְּמוֹ]
