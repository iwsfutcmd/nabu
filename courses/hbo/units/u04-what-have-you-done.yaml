# Biblical Hebrew (hbo), unit 4: What is this you have done? (Genesis 3:11-13).
# Questions (מִי, מָה, הֲ), "you" to a man and to a woman, he and she, אֲשֶׁר "who, which",
# the perfect "you did" (m. and f.), "she did" in the narrative past, and the infinitive "to eat".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u04-what-have-you-done
title:
  en: What have you done?
cefr: A1
kcs:
- id: sense:mi
  gloss:
    en: who?
  forms:
    hbo-Hebr/tiberian: [מִי]
- id: sense:atta
  gloss:
    en: you (to a man)
  forms:
    hbo-Hebr/tiberian: [אַתָּה]
- id: sense:at
  gloss:
    en: you (to a woman)
  forms:
    hbo-Hebr/tiberian: [אַתְּ]
  notes:
    en: 'אַתְּ ʾatt, at a pause אָתְּ ʾātt: ''you'' said to a woman. To a man: אַתָּה ʾattâ.'
- id: sense:nagad
  gloss:
    en: to tell, declare (hiphil)
  forms:
    hbo-Hebr/tiberian: [הִגִּיד]
- id: sense:hu
  gloss:
    en: he; it
  forms:
    hbo-Hebr/tiberian: [הוּא]
- id: sense:hi
  gloss:
    en: she; it
  forms:
    hbo-Hebr/tiberian: [הִיא]
  notes:
    en: In the five books of Moses it is usually written הִוא and read hîʾ.
- id: sense:asher
  gloss:
    en: who, which, that (relative)
  forms:
    hbo-Hebr/tiberian: [אֲשֶׁר]
- id: sense:ha.q
  gloss:
    en: '(marks a yes-no question: הֲ, written joined to the next word)'
  forms:
    hbo-Hebr/tiberian: [הֲ]
  notes:
    en: 'הֲ hă- turns a sentence into a question: הֲמִן־הָעֵץ אָכַלְתָּ ''did you eat from the tree?''.'
- id: sense:akhal
  gloss:
    en: to eat
  forms:
    hbo-Hebr/tiberian: [אָכַל]
  image: {file: ../images/bread.svg, license: CC0-1.0, provenance: {author: 'llm:claude@5e86bf893364', status: draft}, source: Drawn for Nabu (courses/images)}
- id: form:qatal-2ms
  gloss:
    en: 'you did: the perfect (qatal), you (to a man: -tā)'
- id: form:inf
  gloss:
    en: 'infinitive (construct): to do; doing (לֶאֱכֹל ''to eat'')'
- id: sense:tsivvah
  gloss:
    en: to command (piel)
  forms:
    hbo-Hebr/tiberian: [צִוָּה]
- id: sense:bilti
  gloss:
    en: 'not (לְבִלְתִּי + infinitive: not to)'
  forms:
    hbo-Hebr/tiberian: [בִּלְתִּי]
- id: sense:natan
  gloss:
    en: to give; to put
  forms:
    hbo-Hebr/tiberian: [נָתַן]
- id: sense:immad
  gloss:
    en: 'with (only with suffixes: עִמָּדִי ''with me'')'
  forms:
    hbo-Hebr/tiberian: [עִמָּד]
- id: form:sfx-1cs
  gloss:
    en: my; me (the suffix -î, -nî)
- id: sense:mah
  gloss:
    en: what? (מַה־, also מֶה)
  forms:
    hbo-Hebr/tiberian: [מָה]
- id: sense:zot
  gloss:
    en: this (f.); this thing
  forms:
    hbo-Hebr/tiberian: [זֹאת]
- id: sense:asah
  gloss:
    en: to do; to make
  forms:
    hbo-Hebr/tiberian: [עָשָׂה]
- id: form:qatal-2fs
  gloss:
    en: 'you did: the perfect (qatal), you (to a woman: -t)'
- id: form:wayyiqtol-3fs
  gloss:
    en: 'and she did: the narrative past, she or it (f.)'
- id: sense:nahash
  gloss:
    en: serpent, snake
  forms:
    hbo-Hebr/tiberian: [נָחָשׁ]
- id: sense:nasha
  gloss:
    en: to deceive (hiphil הִשִּׁיא)
  forms:
    hbo-Hebr/tiberian: [הִשִּׁיא]
nodes:
