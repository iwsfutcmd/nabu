stories:
- id: hbo.story.what-have-you-done
  node: hbo.u04.story
  title:
    en: What have you done? (Genesis 3:11–13)
  characters:
  - {id: god, name: {hbo-Hebr/tiberian: יְהוָה}}
  - {id: adam, speaker: m, name: {hbo-Hebr/tiberian: הָאָדָם}}
  - {id: woman, speaker: f, name: {hbo-Hebr/tiberian: הָאִשָּׁה}}
  steps:
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}]
      translations:
        en: And he said,
  - line:
      speaker: god
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: מִי הִגִּיד לְךָ כִּי עֵירֹם אָתָּה
          tokens: [{surface: מִי, sense: mi, readings: {tiberian: mî}}, {surface: הִגִּיד, sense: nagad, form: 'form:qatal-3ms', readings: {tiberian: higgîḏ}}, {surface: לְךָ, sense: le, morphs: [{surface: לְ,
                  kc: 'sense:le'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ləḵā}}, {surface: כִּי, sense: ki, readings: {tiberian: kî}}, {surface: עֵירֹם, sense: erom, readings: {tiberian: ʿêrōm}},
            {surface: אָתָּה, sense: atta, readings: {tiberian: ʾā́ttâ}}]
      translations:
        en: “Who told you that you were naked?
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: הֲמִן־הָעֵץ אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל־מִמֶּנּוּ אָכָלְתָּ׃
          tokens: [{surface: הֲמִן, sense: min, morphs: [{surface: הֲ, kc: 'sense:ha.q'}, {surface: מִן, kc: 'sense:min'}], readings: {tiberian: hămin-}}, {surface: הָעֵץ, sense: ets, morphs: [{surface: הָ,
                  kc: 'sense:ha'}, {surface: עֵץ, kc: 'sense:ets'}], readings: {tiberian: hāʿēṣ}}, {surface: אֲשֶׁר, sense: asher, readings: {tiberian: ʾăšer}}, {surface: צִוִּיתִיךָ, sense: tsivvah, form: 'form:qatal-1cs',
              morphs: [{surface: צִוִּיתִי, kc: 'sense:tsivvah'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ṣiwwîṯî́ḵā}}, {surface: לְבִלְתִּי, sense: bilti, morphs: [{surface: לְ, kc: 'sense:le'},
                {surface: בִלְתִּי, kc: 'sense:bilti'}], readings: {tiberian: ləḇiltî}}, {surface: אֲכָל, sense: akhal, form: 'form:inf', readings: {tiberian: ʾăḵol-}}, {surface: מִמֶּנּוּ, sense: min,
              morphs: [{surface: מִמֶּ, kc: 'sense:min'}, {surface: נּוּ, kc: 'form:sfx-3ms'}], readings: {tiberian: mimménnû}}, {surface: אָכָלְתָּ, sense: akhal, form: 'form:qatal-2ms', readings: {tiberian: ʾāḵā́ltā}}]
      translations:
        en: Have you eaten from the tree that I commanded you not to eat from?”
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר הָאָדָם
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}, {surface: הָאָדָם, sense: adam, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: אָדָם,
                  kc: 'sense:adam'}], readings: {tiberian: hāʾāḏām}}]
      translations:
        en: And the man said,
  - line:
      speaker: adam
      ask: complete
      gap: sense:ets
      distractors: ['sense:gan', 'sense:qol']
      forms:
        hbo-Hebr/tiberian:
          text: הָאִשָּׁה אֲשֶׁר נָתַתָּה עִמָּדִי הִוא נָתְנָה־לִּי מִן־הָעֵץ וָאֹכֵל׃
          tokens: [{surface: הָאִשָּׁה, sense: ishah, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: אִשָּׁה, kc: 'sense:ishah'}], readings: {tiberian: hāʾiššâ}}, {surface: אֲשֶׁר, sense: asher, readings: {
                tiberian: ʾăšer}}, {surface: נָתַתָּה, sense: natan, form: 'form:qatal-2ms', readings: {tiberian: nāṯáttâ}}, {surface: עִמָּדִי, sense: immad, morphs: [{surface: עִמָּדִ, kc: 'sense:immad'},
                {surface: י, kc: 'form:sfx-1cs'}], readings: {tiberian: ʿimmāḏî}}, {surface: הִוא, sense: hi, readings: {tiberian: hîʾ}}, {surface: נָתְנָה, sense: natan, form: 'form:qatal-3fs', readings: {
                tiberian: nāṯənâ-}}, {surface: לִּי, sense: le, morphs: [{surface: לִּ, kc: 'sense:le'}, {surface: י, kc: 'form:sfx-1cs'}], readings: {tiberian: lî}}, {surface: מִן, sense: min, readings: {
                tiberian: min-}}, {surface: הָעֵץ, sense: ets, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: עֵץ, kc: 'sense:ets'}], readings: {tiberian: hāʿēṣ}}, {surface: וָאֹכֵל, sense: akhal, form: 'form:wayyiqtol-1cs',
              readings: {tiberian: wāʾōḵēl}}]
      translations:
        en: “The woman whom you gave to be with me, she gave me (fruit) from the tree, and I ate.”
  - choose:
      prompt:
        en: Who gave the man fruit from the tree, as he tells it?
      options: [{en: the woman}, {en: the serpent}, {en: the LORD God}]
      answer: 0
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר יְהוָה אֱלֹהִים לָאִשָּׁה
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}, {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֱלֹהִים, sense: elohim,
              readings: {tiberian: ʾĕlōhîm}}, {surface: לָאִשָּׁה, sense: ishah, morphs: [{surface: לָ, kc: 'sense:le'}, {surface: אִשָּׁה, kc: 'sense:ishah'}], readings: {tiberian: lāʾiššâ}}]
      translations:
        en: And the LORD God said to the woman,
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: מַה־זֹּאת עָשִׂית
          tokens: [{surface: מַה, sense: mah, readings: {tiberian: mah-}}, {surface: זֹּאת, sense: zot, readings: {tiberian: zōʾṯ}}, {surface: עָשִׂית, sense: asah, form: 'form:qatal-2fs', readings: {tiberian: ʿāśîṯ}}]
      translations:
        en: “What is this that you have done?”
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַתֹּאמֶר הָאִשָּׁה
          tokens: [{surface: וַתֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3fs', readings: {tiberian: wattṓʾmer}}, {surface: הָאִשָּׁה, sense: ishah, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: אִשָּׁה,
                  kc: 'sense:ishah'}], readings: {tiberian: hāʾiššâ}}]
      translations:
        en: And the woman said,
  - line:
      speaker: woman
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: הַנָּחָשׁ הִשִּׁיאַנִי וָאֹכֵל׃
          tokens: [{surface: הַנָּחָשׁ, sense: nahash, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: נָּחָשׁ, kc: 'sense:nahash'}], readings: {tiberian: hannāḥāš}}, {surface: הִשִּׁיאַנִי, sense: nasha,
              form: 'form:qatal-3ms', morphs: [{surface: הִשִּׁיאַ, kc: 'sense:nasha'}, {surface: נִי, kc: 'form:sfx-1cs'}], readings: {tiberian: hiššîʾánî}}, {surface: וָאֹכֵל, sense: akhal, form: 'form:wayyiqtol-1cs',
              readings: {tiberian: wāʾōḵēl}}]
      translations:
        en: “The serpent deceived me, and I ate.”
  - choose:
      prompt:
        en: Whom does the woman blame?
      options: [{en: the serpent}, {en: the man}, {en: herself}]
      answer: 0
