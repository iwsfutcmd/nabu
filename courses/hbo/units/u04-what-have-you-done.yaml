- {id: hbo.u04.the-tree, kind: lesson, introduces: ['sense:asher', 'sense:ha.q', 'sense:akhal', 'form:qatal-2ms', 'form:inf', 'sense:tsivvah', 'sense:bilti']}
- {id: hbo.u04.she-gave, kind: lesson, introduces: ['sense:natan', 'sense:immad', 'form:sfx-1cs']}
