          tokens: [{surface: הָאִשָּׁה, lexemes: [{lexeme: ha, surface: הָ, n: 1, head: 2, rel: det}, {lexeme: ishah, surface: אִשָּׁה, base: true, feats: {Number: Sing}, n: 2}], readings: {tiberian: hāʾiššâ}}, {surface: אֲשֶׁר, lexeme: asher, readings: {tiberian: ʾăšer}}, {surface: נָתַתָּה, lexeme: natan, feats: {Aspect: Perf, Gender: Masc, Mood: Ind, Number: Sing, Person: '2', VerbForm: Fin}, readings: {tiberian: nāṯáttâ}}, {surface: עִמָּדִי, lexemes: [{lexeme: immad, surface: עִמָּדִ, base: true, n: 5, head: 6, rel: case}, {lexeme: sfx-1cs, surface: י, n: 6}], readings: {tiberian: ʿimmāḏî}}, {surface: הִוא, lexeme: hi, feats: {Gender: Fem, Number: Sing}, readings: {tiberian: hîʾ}}, {surface: נָתְנָה, lexeme: natan, feats: {Aspect: Perf, Gender: Fem, Mood: Ind, Number: Sing, Person: '3', VerbForm: Fin}, readings: {tiberian: nāṯənâ-}}, {surface: לִּי, lexemes: [{lexeme: le, surface: לִּ, base: true, n: 9, head: 10, rel: case}, {lexeme: sfx-1cs, surface: י, n: 10}], readings: {tiberian: lî}}, {surface: מִן, lexeme: min, readings: {tiberian: min-}}, {surface: הָעֵץ, lexemes: [{lexeme: ha, surface: הָ, n: 12, head: 13, rel: det}, {lexeme: ets, surface: עֵץ, base: true, feats: {Number: Sing}, n: 13}], readings: {tiberian: hāʿēṣ}}, {surface: וָאֹכֵל, lexeme: akhal, feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, readings: {tiberian: wāʾōḵēl}}]
      translations:
