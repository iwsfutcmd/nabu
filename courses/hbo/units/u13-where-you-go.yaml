# Biblical Hebrew (hbo), unit 13: Where you go, I will go (Ruth 1:15-17).
# A woman speaking to a woman: "you" (f.) in the imperative, the imperfect and the suffixes; hollow verbs
# (return, lodge, die); the imperfect of wishes and oaths (כֹּה יַעֲשֶׂה); the niphal "be buried".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
