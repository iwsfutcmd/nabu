          tokens: [{surface: הִנֵּה, sense: hinneh, readings: {tiberian: hinnēh}}, {surface: שָׁבָה, sense: shuv, form: 'form:qatal-3fs', readings: {tiberian: šā́ḇâ}}, {surface: יְבִמְתֵּךְ, sense: yevemet,
              morphs: [{surface: יְבִמְתֵּ, kc: 'sense:yevemet'}, {surface: ךְ, kc: 'form:sfx-2fs'}], readings: {tiberian: yəḇimtēḵ}}, {surface: אֶל, sense: el, readings: {tiberian: ʾel-}}, {surface: עַמָּהּ,
