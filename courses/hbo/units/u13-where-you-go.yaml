                tiberian: ʾĕlōhếhā}}]
      translations:
        en: “Look, your sister-in-law has gone back to her people and to her gods;
  - line:
      speaker: naomi
      ask: complete
      gap: sense:shuv
      distractors: ['sense:halakh', 'sense:lun']
      forms:
        hbo-Hebr/tiberian:
          text: שׁוּבִי אַחֲרֵי יְבִמְתֵּךְ׃
          tokens: [{surface: שׁוּבִי, sense: shuv, form: 'form:impv-fs', readings: {tiberian: šû́ḇî}}, {surface: אַחֲרֵי, sense: ahar, readings: {tiberian: ʾaḥărê}}, {surface: יְבִמְתֵּךְ, sense: yevemet,
              morphs: [{surface: יְבִמְתֵּ, kc: 'sense:yevemet'}, {surface: ךְ, kc: 'form:sfx-2fs'}], readings: {tiberian: yəḇimtēḵ}}]
      translations:
        en: go back after your sister-in-law.”
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַתֹּאמֶר רוּת
          tokens: [{surface: וַתֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3fs', readings: {tiberian: wattṓʾmer}}, {surface: רוּת, sense: rut, readings: {tiberian: rûṯ}}]
      translations:
        en: But Ruth said,
  - line:
      speaker: ruth
      forms:
        hbo-Hebr/tiberian:
          text: אַל־תִּפְגְּעִי־בִי לְעָזְבֵךְ לָשׁוּב מֵאַחֲרָיִךְ כִּי
          tokens: [{surface: אַל, sense: al.neg, readings: {tiberian: ʾal-}}, {surface: תִּפְגְּעִי, sense: paga, form: 'form:juss', readings: {tiberian: tip̄gəʿî-}}, {surface: בִי, sense: be, morphs: [
                {surface: בִ, kc: 'sense:be'}, {surface: י, kc: 'form:sfx-1cs'}], readings: {tiberian: ḇî}}, {surface: לְעָזְבֵךְ, sense: azav, form: 'form:inf', morphs: [{surface: לְ, kc: 'sense:le'},
                {surface: עָזְבֵ, kc: 'sense:azav'}, {surface: ךְ, kc: 'form:sfx-2fs'}], readings: {tiberian: ləʿozḇēḵ}}, {surface: לָשׁוּב, sense: shuv, form: 'form:inf', morphs: [{surface: לָ, kc: 'sense:le'},
                {surface: שׁוּב, kc: 'sense:shuv'}], readings: {tiberian: lāšûḇ}}, {surface: מֵאַחֲרָיִךְ, sense: ahar, morphs: [{surface: מֵ, kc: 'sense:min'}, {surface: אַחֲרָיִ, kc: 'sense:ahar'}, {
                  surface: ךְ, kc: 'form:sfx-2fs'}], readings: {tiberian: mēʾaḥărā́yiḵ}}, {surface: כִּי, sense: ki, readings: {tiberian: kî}}]
      translations:
        en: “Do not urge me to leave you, to turn back from following you;
  - line:
      speaker: ruth
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: אֶל־אֲשֶׁר תֵּלְכִי אֵלֵךְ וּבַאֲשֶׁר תָּלִינִי אָלִין עַמֵּךְ עַמִּי וֵאלֹהַיִךְ אֱלֹהָי׃
          tokens: [{surface: אֶל, sense: el, readings: {tiberian: ʾel-}}, {surface: אֲשֶׁר, sense: asher, readings: {tiberian: ʾăšer}}, {surface: תֵּלְכִי, sense: halakh, form: 'form:yiqtol-2fs', readings: {
                tiberian: tēləḵî}}, {surface: אֵלֵךְ, sense: halakh, form: 'form:yiqtol-1cs', readings: {tiberian: ʾēlēḵ}}, {surface: וּבַאֲשֶׁר, sense: asher, morphs: [{surface: וּ, kc: 'sense:we'}, {
                  surface: בַ, kc: 'sense:be'}, {surface: אֲשֶׁר, kc: 'sense:asher'}], readings: {tiberian: ûḇaʾăšer}}, {surface: תָּלִינִי, sense: lun, form: 'form:yiqtol-2fs', readings: {tiberian: tālî́nî}},
            {surface: אָלִין, sense: lun, form: 'form:yiqtol-1cs', readings: {tiberian: ʾālîn}}, {surface: עַמֵּךְ, sense: am, morphs: [{surface: עַמֵּ, kc: 'sense:am'}, {surface: ךְ, kc: 'form:sfx-2fs'}],
              readings: {tiberian: ʿammēḵ}}, {surface: עַמִּי, sense: am, morphs: [{surface: עַמִּ, kc: 'sense:am'}, {surface: י, kc: 'form:sfx-1cs'}], readings: {tiberian: ʿammî}}, {surface: וֵאלֹהַיִךְ,
              sense: elohim, morphs: [{surface: וֵ, kc: 'sense:we'}, {surface: אלֹהַיִ, kc: 'sense:elohim'}, {surface: ךְ, kc: 'form:sfx-2fs'}], readings: {tiberian: wēʾlōháyiḵ}}, {surface: אֱלֹהָי, sense: elohim,
              morphs: [{surface: אֱלֹהָ, kc: 'sense:elohim'}, {surface: י, kc: 'form:sfx-1cs'}], readings: {tiberian: ʾĕlōhāy}}]
      translations:
        en: for where you go I will go, and where you lodge I will lodge; your people shall be my people, and your God my God.
  - choose:
      prompt:
        en: What does Ruth decide?
      options: [{en: to go with Naomi wherever she goes}, {en: to go back to her own people}, {en: to stay in the field}]
      answer: 0
  - line:
      speaker: ruth
      ask: complete
      gap: sense:nikbar
      distractors: ['sense:lun', 'sense:azav']
      forms:
        hbo-Hebr/tiberian:
          text: בַּאֲשֶׁר תָּמוּתִי אָמוּת וְשָׁם אֶקָּבֵר׃
          tokens: [{surface: בַּאֲשֶׁר, sense: asher, morphs: [{surface: בַּ, kc: 'sense:be'}, {surface: אֲשֶׁר, kc: 'sense:asher'}], readings: {tiberian: baʾăšer}}, {surface: תָּמוּתִי, sense: mut, form: 'form:yiqtol-2fs',
              readings: {tiberian: tāmû́ṯî}}, {surface: אָמוּת, sense: mut, form: 'form:yiqtol-1cs', readings: {tiberian: ʾāmûṯ}}, {surface: וְשָׁם, sense: sham, morphs: [{surface: וְ, kc: 'sense:we'},
                {surface: שָׁם, kc: 'sense:sham'}], readings: {tiberian: wəšām}}, {surface: אֶקָּבֵר, sense: nikbar, form: 'form:yiqtol-1cs', readings: {tiberian: ʾeqqāḇēr}}]
      translations:
        en: Where you die I will die, and there I will be buried.
  - line:
      speaker: ruth
      forms:
        hbo-Hebr/tiberian:
          text: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף כִּי הַמָּוֶת יַפְרִיד בֵּינִי וּבֵינֵךְ׃
          tokens: [{surface: כֹּה, sense: koh, readings: {tiberian: kōh}}, {surface: יַעֲשֶׂה, sense: asah, form: 'form:yiqtol-3ms', readings: {tiberian: yaʿăśeh}}, {surface: יְהוָה, sense: yhwh, readings: {
                tiberian: ʾăḏōnāy}}, {surface: לִי, sense: le, morphs: [{surface: לִ, kc: 'sense:le'}, {surface: י, kc: 'form:sfx-1cs'}], readings: {tiberian: lî}}, {surface: וְכֹה, sense: koh, morphs: [
                {surface: וְ, kc: 'sense:we'}, {surface: כֹה, kc: 'sense:koh'}], readings: {tiberian: wəḵōh}}, {surface: יֹסִיף, sense: hosif, form: 'form:yiqtol-3ms', readings: {tiberian: yōsîp̄}}, {surface: כִּי,
              sense: ki, readings: {tiberian: kî}}, {surface: הַמָּוֶת, sense: mawet, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: מָּוֶת, kc: 'sense:mawet'}], readings: {tiberian: hammā́weṯ}}, {surface: יַפְרִיד,
              sense: hifrid, form: 'form:yiqtol-3ms', readings: {tiberian: yap̄rîḏ}}, {surface: בֵּינִי, sense: beyn, morphs: [{surface: בֵּינִ, kc: 'sense:beyn'}, {surface: י, kc: 'form:sfx-1cs'}], readings: {
                tiberian: bênî}}, {surface: וּבֵינֵךְ, sense: beyn, morphs: [{surface: וּ, kc: 'sense:we'}, {surface: בֵינֵ, kc: 'sense:beyn'}, {surface: ךְ, kc: 'form:sfx-2fs'}], readings: {tiberian: ûḇênēḵ}}]
      translations:
        en: May the LORD do so to me and more besides, if anything but death parts me from you.”
  - choose:
      prompt:
        en: What alone will part Ruth from Naomi?
      options: [{en: death}, {en: a king}, {en: her own gods}]
      answer: 0
scenarios:
- id: hbo.on-the-road-to-bethlehem
  after: hbo.u13.where-you-die
  title:
    en: On the road to Bethlehem
  setting:
    en: 'The road from Moab to Bethlehem, at the start of the barley harvest: two widows walk with their bundles.'
  character:
    en: Naomi, tired and grieving but kind, who speaks only Biblical Hebrew; she is about to send you back home.
  goal:
    en: 'Tell her you will not go back: where she goes you will go, her people will be your people.'
