      speaker: rebekah
      ask: complete
      gap: sense:gamal
      distractors: ['sense:eved', 'sense:seh']
      forms:
        hbo-Hebr/tiberian:
          text: גַּם לִגְמַלֶּיךָ אֶשְׁאָב עַד אִם־כִּלּוּ לִשְׁתֹּת׃
          tokens: [{surface: גַּם, sense: gam, readings: {tiberian: gam}}, {surface: לִגְמַלֶּיךָ, sense: gamal, form: 'form:pl', morphs: [{surface: לִ, kc: 'sense:le'}, {surface: גְמַלֶּי, kc: 'sense:gamal'},
                {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: liḡmallếḵā}}, {surface: אֶשְׁאָב, sense: shaav, form: 'form:yiqtol-1cs', readings: {tiberian: ʾešʾāḇ}}, {surface: עַד, sense: ad,
              readings: {tiberian: ʿaḏ}}, {surface: אִם, sense: im, readings: {tiberian: ʾim-}}, {surface: כִּלּוּ, sense: killah, form: 'form:qatal-3cp', readings: {tiberian: killû}}, {surface: לִשְׁתֹּת,
              sense: shatah, form: 'form:inf', morphs: [{surface: לִ, kc: 'sense:le'}, {surface: שְׁתֹּת, kc: 'sense:shatah'}], readings: {tiberian: lištōṯ}}]
      translations:
        en: “I will draw for your camels too, until they have finished drinking.”
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַתְּמַהֵר וַתְּעַר כַּדָּהּ אֶל־הַשֹּׁקֶת וַתָּרָץ עוֹד אֶל־הַבְּאֵר לִשְׁאֹב וַתִּשְׁאַב לְכָל־גְּמַלָּיו׃
          tokens: [{surface: וַתְּמַהֵר, sense: mahar, form: 'form:wayyiqtol-3fs', readings: {tiberian: wattəmahēr}}, {surface: וַתְּעַר, sense: arah, form: 'form:wayyiqtol-3fs', readings: {tiberian: wattəʿar}},
            {surface: כַּדָּהּ, sense: kad, morphs: [{surface: כַּדָּ, kc: 'sense:kad'}, {surface: הּ, kc: 'form:sfx-3fs'}], readings: {tiberian: kaddāh}}, {surface: אֶל, sense: el, readings: {tiberian: ʾel-}},
