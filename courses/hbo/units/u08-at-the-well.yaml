              surface: נָא, sense: na, readings: {tiberian: nāʾ}}, {surface: מְעַט, sense: meat, form: 'form:cstr', readings: {tiberian: məʿaṭ-}}, {surface: מַיִם, sense: mayim, readings: {tiberian: máyim}},
            {surface: מִכַּדֵּךְ, sense: kad, morphs: [{surface: מִ, kc: 'sense:min'}, {surface: כַּדֵּ, kc: 'sense:kad'}, {surface: ךְ, kc: 'form:sfx-2fs'}], readings: {tiberian: mikkaddēḵ}}]
      translations:
        en: “Please let me drink a little water from your jar.”
