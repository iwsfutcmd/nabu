# Biblical Hebrew (hbo), unit 8: At the well (Genesis 24:17-20).
# A woman's narrative past (she ran, she hurried, she drew), "her" and "your" said to a woman,
# "all", "also", "until", "again", the perfect "they did", and infinitives of purpose (to drink, to draw).
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u08-at-the-well
title:
  en: At the well
cefr: A2
