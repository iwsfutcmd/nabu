      translations:
        en: And she quickly lowered her jar onto her hand and gave him a drink.
  - choose:
      prompt:
        en: What does Rebekah say to the servant?
      options: [{en: '“Drink, my lord.”'}, {en: '“Who are you?”'}, {en: “Go to the well.”}]
      answer: 0
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַתְּכַל לְהַשְׁקֹתוֹ
