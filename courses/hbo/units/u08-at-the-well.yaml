scenarios:
- id: hbo.at-the-well
  after: hbo.u08.to-the-well
  title:
    en: At the well
  setting:
    en: A well outside the city of Nahor at evening, when the women come out to draw water.
  character:
    en: Rebekah, kind and quick, who speaks only Biblical Hebrew.
  goal:
    en: Ask her for a little water from her jar, thank her, and tell her that your camels are thirsty too.
