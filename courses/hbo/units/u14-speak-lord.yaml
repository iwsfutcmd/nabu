# Biblical Hebrew (hbo), unit 14: Speak, for your servant is listening (1 Samuel 3:4-5, 9-10).
# Dialogue: "you called me", "I did not call", commands in a row (go back, lie down), the converted
# perfect for what will happen (וְהָיָה אִם … וְאָמַרְתָּ "if he calls, you shall say"), "your servant".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u14-speak-lord
title:
  en: Speak, LORD
cefr: A2
