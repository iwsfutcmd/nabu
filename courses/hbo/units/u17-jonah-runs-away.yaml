# Biblical Hebrew (hbo), unit 17: Jonah runs away (Jonah 1:1-3).
# Narrative: "the word of the LORD came to …", commands in a row (get up, go, call out), going up and going
# down, fleeing, "with" and its suffixes, the directional -â (to Tarshish).
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
