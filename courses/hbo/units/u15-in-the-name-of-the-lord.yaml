    hbo-Hebr/tiberian: [סִגֵּר]
- id: sense:yesh
  gloss:
    en: there is, there are
  forms:
    hbo-Hebr/tiberian: [יֵשׁ]
- id: construction:yesh-le
  gloss:
    en: 'יֵשׁ לְ…: … has (there is to …); אֵין לְ…: … has no'
- id: sense:qahal
  gloss:
    en: assembly, gathering
  forms:
    hbo-Hebr/tiberian: [קָהָל]
- id: sense:milhamah
  gloss:
    en: battle, war
  forms:
    hbo-Hebr/tiberian: [מִלְחָמָה]
- id: sense:hoshia
  gloss:
    en: to save, deliver (hiphil)
  forms:
    hbo-Hebr/tiberian: [הוֹשִׁיעַ]
nodes:
