# Biblical Hebrew (hbo), unit 15: In the name of the LORD (1 Samuel 17:45-47).
# The participle for what is happening now (אַתָּה בָּא "you are coming"), יֵשׁ "there is" and possession
# (יֵשׁ לִי "I have"), "this day", weapons and war, the hiphil "save".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u15-in-the-name-of-the-lord
title:
  en: In the name of the LORD
cefr: A2
kcs:
- id: sense:david
  gloss:
    en: David
  forms:
    hbo-Hebr/tiberian: [דָּוִד]
- id: sense:pelishti
  gloss:
    en: Philistine
  forms:
    hbo-Hebr/tiberian: [פְּלִשְׁתִּי]
- id: sense:herev
  gloss:
    en: sword
  forms:
    hbo-Hebr/tiberian: [חֶרֶב]
  image: {file: ../images/sword.svg, license: CC0-1.0, provenance: {author: 'llm:claude@974a394d608f', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:hanit
  gloss:
    en: spear
  forms:
    hbo-Hebr/tiberian: [חֲנִית]
- id: sense:kidon
  gloss:
    en: javelin
  forms:
    hbo-Hebr/tiberian: [כִּידוֹן]
- id: sense:tsava
  gloss:
    en: 'army, host (יְהוָה צְבָאוֹת: the LORD of hosts)'
  forms:
    hbo-Hebr/tiberian: [צָבָא]
- id: sense:maarakhah
  gloss:
    en: battle line, rank of an army
  forms:
    hbo-Hebr/tiberian: [מַעֲרָכָה]
- id: sense:heref
  gloss:
    en: to taunt, defy (piel)
  forms:
    hbo-Hebr/tiberian: [חֵרֵף]
- id: sense:siggar
  gloss:
    en: to deliver up, hand over (piel)
