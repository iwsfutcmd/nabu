# Biblical Hebrew (hbo), unit 7: Here I am (Genesis 22:1-2, 7-8).
# הִנֵּה and הִנֵּנִי, the polite נָא, plural nouns, demonstratives (these), the imperfect "he will",
# adverbs of place and manner (there, together), and the hiphil "offer up".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u07-here-i-am
title:
  en: Here I am
cefr: A2
kcs:
- id: sense:davar
  gloss:
    en: word; thing, matter
  forms:
    hbo-Hebr/tiberian: [דָּבָר]
- id: sense:elleh
  gloss:
