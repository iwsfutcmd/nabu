        hbo-Hebr/tiberian:
          text: וְזֹאת אֹמֶרֶת
          tokens: [{surface: וְזֹאת, sense: zot, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: זֹאת, kc: 'sense:zot'}], readings: {tiberian: wəzōʾṯ}}, {surface: אֹמֶרֶת, sense: amar, form: 'form:ptc-fs',
