# Biblical Hebrew (hbo), unit 16: The wise king (1 Kings 3:22, 24-27).
# Two women before King Solomon: "they (f.) spoke", the feminine participle, commands to several people
# (take, cut, give), the hiphil "bring" and "kill", living and dead, half and two.
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u16-the-wise-king
title:
  en: The wise king
cefr: A2
kcs:
- id: sense:melekh
  gloss:
    en: king
  forms:
    hbo-Hebr/tiberian: [מֶלֶךְ]
- id: sense:chai
  gloss:
    en: living, alive; (חַי יְהוָה) as the LORD lives
  forms:
    hbo-Hebr/tiberian: [חַי]
- id: sense:yeled
  gloss:
    en: child, boy
  forms:
    hbo-Hebr/tiberian: [יֶלֶד]
- id: form:wayyiqtol-3fp
  gloss:
    en: 'and they (f.) did: the narrative past, they (women)'
- id: sense:hevi
  gloss:
    en: to bring (hiphil of בּוֹא)
  forms:
    hbo-Hebr/tiberian: [הֵבִיא]
- id: sense:gazar
  gloss:
    en: to cut, divide
  forms:
    hbo-Hebr/tiberian: [גָּזַר]
- id: sense:hatsi
  gloss:
    en: half
  forms:
    hbo-Hebr/tiberian: [חֵצִי]
- id: sense:yalad
  gloss:
    en: to bear, give birth; (passive participle) born, a child
  forms:
    hbo-Hebr/tiberian: [יָלַד]
- id: sense:nikhmar
  gloss:
    en: to grow warm, be stirred (niphal)
  forms:
    hbo-Hebr/tiberian: [נִכְמַר]
- id: sense:rahamim
  gloss:
    en: compassion, mercy
  forms:
    hbo-Hebr/tiberian: [רַחֲמִים]
- id: sense:bi
  gloss:
    en: 'please, pardon (בִּי אֲדֹנִי: please, my lord)'
  forms:
    hbo-Hebr/tiberian: [בִּי]
- id: sense:hemit
  gloss:
    en: to kill, put to death (hiphil of מוּת)
  forms:
    hbo-Hebr/tiberian: [הֵמִית]
nodes:
- {id: hbo.u16.the-king, kind: lesson, introduces: ['sense:melekh', 'sense:chai', 'sense:yeled']}
- {id: hbo.u16.two-women, kind: lesson, introduces: ['form:wayyiqtol-3fp']}
- {id: hbo.u16.bring-a-sword, kind: lesson, introduces: ['sense:hevi', 'sense:gazar', 'sense:hatsi']}
