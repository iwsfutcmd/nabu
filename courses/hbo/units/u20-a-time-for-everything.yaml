# Biblical Hebrew (hbo), unit 20: A time for everything (Ecclesiastes 3:1-4; Numbers 6:24-26).
# Infinitives in pairs (a time to be born and a time to die), "under", the jussive of blessing
# (may the LORD bless you), the passive participle "blessed", and the lifted face and eyes.
# The passages are the Westminster Leningrad Codex (public domain), without accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u20-a-time-for-everything
title:
  en: A time for everything
cefr: A2
