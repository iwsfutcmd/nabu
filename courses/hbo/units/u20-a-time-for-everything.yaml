stories:
- id: hbo.story.a-time-for-everything
  node: hbo.u20.story
  title:
    en: A time for everything (Ecclesiastes 3:1–4) and the blessing (Numbers 6:24–26)
  steps:
  - line:
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: לַכֹּל זְמָן וְעֵת לְכָל־חֵפֶץ תַּחַת הַשָּׁמָיִם׃
          tokens: [{surface: לַכֹּל, sense: kol, morphs: [{surface: לַ, kc: 'sense:le'}, {surface: כֹּל, kc: 'sense:kol'}], readings: {tiberian: lakkōl}}, {surface: זְמָן, sense: zeman, readings: {tiberian: zəmān}},
            {surface: וְעֵת, sense: et.time, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: עֵת, kc: 'sense:et.time'}], readings: {tiberian: wəʿēṯ}}, {surface: לְכָל, sense: kol, form: 'form:cstr', morphs: [
                {surface: לְ, kc: 'sense:le'}, {surface: כָל, kc: 'sense:kol'}], readings: {tiberian: ləḵol-}}, {surface: חֵפֶץ, sense: hefets, readings: {tiberian: ḥḗp̄eṣ}}, {surface: תַּחַת, sense: tahat,
              readings: {tiberian: táḥaṯ}}, {surface: הַשָּׁמָיִם, sense: shamayim, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: שָּׁמָיִם, kc: 'sense:shamayim'}], readings: {tiberian: haššāmā́yim}}]
      translations:
        en: 'For everything there is a season, and a time for every matter under heaven:'
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: עֵת לָלֶדֶת וְעֵת לָמוּת עֵת לָטַעַת וְעֵת לַעֲקוֹר נָטוּעַ׃
          tokens: [{surface: עֵת, sense: et.time, readings: {tiberian: ʿēṯ}}, {surface: לָלֶדֶת, sense: yalad, form: 'form:inf', morphs: [{surface: לָ, kc: 'sense:le'}, {surface: לֶדֶת, kc: 'sense:yalad'}],
              readings: {tiberian: lāléḏeṯ}}, {surface: וְעֵת, sense: et.time, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: עֵת, kc: 'sense:et.time'}], readings: {tiberian: wəʿēṯ}}, {surface: לָמוּת,
              sense: mut, form: 'form:inf', morphs: [{surface: לָ, kc: 'sense:le'}, {surface: מוּת, kc: 'sense:mut'}], readings: {tiberian: lāmûṯ}}, {surface: עֵת, sense: et.time, readings: {tiberian: ʿēṯ}},
            {surface: לָטַעַת, sense: nata, form: 'form:inf', morphs: [{surface: לָ, kc: 'sense:le'}, {surface: טַעַת, kc: 'sense:nata'}], readings: {tiberian: lāṭáʿaṯ}}, {surface: וְעֵת, sense: et.time,
              morphs: [{surface: וְ, kc: 'sense:we'}, {surface: עֵת, kc: 'sense:et.time'}], readings: {tiberian: wəʿēṯ}}, {surface: לַעֲקוֹר, sense: aqar, form: 'form:inf', morphs: [{surface: לַ, kc: 'sense:le'},
                {surface: עֲקוֹר, kc: 'sense:aqar'}], readings: {tiberian: laʿăqôr}}, {surface: נָטוּעַ, sense: nata, form: 'form:ptc-pass', readings: {tiberian: nāṭûaʿ}}]
      translations:
        en: a time to be born and a time to die, a time to plant and a time to uproot what is planted;
  - line:
      ask: complete
      gap: sense:rafa
      distractors: ['sense:banah', 'sense:harag']
      forms:
        hbo-Hebr/tiberian:
          text: עֵת לַהֲרוֹג וְעֵת לִרְפּוֹא עֵת לִפְרוֹץ וְעֵת לִבְנוֹת׃
          tokens: [{surface: עֵת, sense: et.time, readings: {tiberian: ʿēṯ}}, {surface: לַהֲרוֹג, sense: harag, form: 'form:inf', morphs: [{surface: לַ, kc: 'sense:le'}, {surface: הֲרוֹג, kc: 'sense:harag'}],
              readings: {tiberian: lahărôḡ}}, {surface: וְעֵת, sense: et.time, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: עֵת, kc: 'sense:et.time'}], readings: {tiberian: wəʿēṯ}}, {surface: לִרְפּוֹא,
              sense: rafa, form: 'form:inf', morphs: [{surface: לִ, kc: 'sense:le'}, {surface: רְפּוֹא, kc: 'sense:rafa'}], readings: {tiberian: lirpôʾ}}, {surface: עֵת, sense: et.time, readings: {tiberian: ʿēṯ}},
            {surface: לִפְרוֹץ, sense: parats, form: 'form:inf', morphs: [{surface: לִ, kc: 'sense:le'}, {surface: פְרוֹץ, kc: 'sense:parats'}], readings: {tiberian: lip̄rôṣ}}, {surface: וְעֵת, sense: et.time,
              morphs: [{surface: וְ, kc: 'sense:we'}, {surface: עֵת, kc: 'sense:et.time'}], readings: {tiberian: wəʿēṯ}}, {surface: לִבְנוֹת, sense: banah, form: 'form:inf', morphs: [{surface: לִ, kc: 'sense:le'},
                {surface: בְנוֹת, kc: 'sense:banah'}], readings: {tiberian: liḇnôṯ}}]
      translations:
        en: a time to kill and a time to heal, a time to break down and a time to build up;
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: עֵת לִבְכּוֹת וְעֵת לִשְׂחוֹק עֵת סְפוֹד וְעֵת רְקוֹד׃
          tokens: [{surface: עֵת, sense: et.time, readings: {tiberian: ʿēṯ}}, {surface: לִבְכּוֹת, sense: bakhah, form: 'form:inf', morphs: [{surface: לִ, kc: 'sense:le'}, {surface: בְכּוֹת, kc: 'sense:bakhah'}],
              readings: {tiberian: liḇkôṯ}}, {surface: וְעֵת, sense: et.time, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: עֵת, kc: 'sense:et.time'}], readings: {tiberian: wəʿēṯ}}, {surface: לִשְׂחוֹק,
              sense: sachaq, form: 'form:inf', morphs: [{surface: לִ, kc: 'sense:le'}, {surface: שְׂחוֹק, kc: 'sense:sachaq'}], readings: {tiberian: liśḥôq}}, {surface: עֵת, sense: et.time, form: 'form:cstr',
              readings: {tiberian: ʿēṯ}}, {surface: סְפוֹד, sense: safad, form: 'form:inf', readings: {tiberian: səp̄ôḏ}}, {surface: וְעֵת, sense: et.time, form: 'form:cstr', morphs: [{surface: וְ, kc: 'sense:we'},
                {surface: עֵת, kc: 'sense:et.time'}], readings: {tiberian: wəʿēṯ}}, {surface: רְקוֹד, sense: raqad, form: 'form:inf', readings: {tiberian: rəqôḏ}}]
      translations:
        en: a time to weep and a time to laugh, a time to mourn and a time to dance.
  - choose:
      prompt:
        en: What does the Teacher say there is for every matter?
      options: [{en: a time}, {en: a king}, {en: a reward}]
      answer: 0
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: יְבָרֶכְךָ יְהוָה וְיִשְׁמְרֶךָ׃
          tokens: [{surface: יְבָרֶכְךָ, sense: barakh, form: 'form:juss', morphs: [{surface: יְבָרֶכְ, kc: 'sense:barakh'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: yəḇāreḵḵā}}, {surface: יְהוָה,
              sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: וְיִשְׁמְרֶךָ, sense: shamar, form: 'form:juss', morphs: [{surface: וְ, kc: 'sense:we'}, {surface: יִשְׁמְרֶ, kc: 'sense:shamar'}, {
                  surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: wəyišməréḵā}}]
      translations:
        en: May the LORD bless you and keep you;
  - line:
      ask: complete
      gap: sense:panim
      distractors: ['sense:yad', 'sense:ayin.eye']
      forms:
        hbo-Hebr/tiberian:
          text: יָאֵר יְהוָה פָּנָיו אֵלֶיךָ וִיחֻנֶּךָּ׃
          tokens: [{surface: יָאֵר, sense: heir, form: 'form:juss', readings: {tiberian: yāʾēr}}, {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: פָּנָיו, sense: panim, morphs: [
                {surface: פָּנָי, kc: 'sense:panim'}, {surface: ו, kc: 'form:sfx-3ms'}], readings: {tiberian: pānāyw}}, {surface: אֵלֶיךָ, sense: el, morphs: [{surface: אֵלֶי, kc: 'sense:el'}, {surface: ךָ,
                  kc: 'form:sfx-2ms'}], readings: {tiberian: ʾēlếḵā}}, {surface: וִיחֻנֶּךָּ, sense: hanan, form: 'form:juss', morphs: [{surface: וִ, kc: 'sense:we'}, {surface: יחֻנֶּ, kc: 'sense:hanan'},
                {surface: ךָּ, kc: 'form:sfx-2ms'}], readings: {tiberian: wîḥunnékkā}}]
      translations:
        en: may the LORD make his face shine upon you and be gracious to you;
  - line:
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: יִשָּׂא יְהוָה פָּנָיו אֵלֶיךָ וְיָשֵׂם לְךָ שָׁלוֹם׃
          tokens: [{surface: יִשָּׂא, sense: nasa, form: 'form:juss', readings: {tiberian: yiśśāʾ}}, {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: פָּנָיו, sense: panim, morphs: [
                {surface: פָּנָי, kc: 'sense:panim'}, {surface: ו, kc: 'form:sfx-3ms'}], readings: {tiberian: pānāyw}}, {surface: אֵלֶיךָ, sense: el, morphs: [{surface: אֵלֶי, kc: 'sense:el'}, {surface: ךָ,
                  kc: 'form:sfx-2ms'}], readings: {tiberian: ʾēlếḵā}}, {surface: וְיָשֵׂם, sense: sim, form: 'form:juss', morphs: [{surface: וְ, kc: 'sense:we'}, {surface: יָשֵׂם, kc: 'sense:sim'}], readings: {
                tiberian: wəyāśēm}}, {surface: לְךָ, sense: le, morphs: [{surface: לְ, kc: 'sense:le'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ləḵā}}, {surface: שָׁלוֹם, sense: shalom,
              readings: {tiberian: šālôm}}]
      translations:
        en: may the LORD lift up his face upon you and give you peace.
  - choose:
      prompt:
        en: What does the blessing ask the LORD to give last?
      options: [{en: peace}, {en: rain}, {en: a son}]
      answer: 0
scenarios:
- id: hbo.a-blessing-for-the-road
  after: hbo.u20.the-blessing
  title:
    en: A blessing for the road
  setting:
    en: 'The gate of Jerusalem at dawn: a friend is setting out on a long journey.'
  character:
    en: An old priest at the gate, warm and unhurried, who speaks only Biblical Hebrew.
  goal:
    en: Tell him where you are going, ask him to bless you, and bless him in return.
