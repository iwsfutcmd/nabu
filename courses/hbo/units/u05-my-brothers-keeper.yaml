# Biblical Hebrew (hbo), unit 5: My brother's keeper (Genesis 4:8-10).
# Family nouns with suffixes (my, your, his; your to a woman), the negative לֹא, "I know",
# the active participle ("keeper", "crying out") and plural nouns in the construct state.
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
