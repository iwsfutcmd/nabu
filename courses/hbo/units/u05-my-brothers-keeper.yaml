              readings: {tiberian: bihyôṯām}}]
      translations:
        en: And when they were in the field,
  - line:
      ask: complete
      gap: sense:harag
      distractors: ['sense:shamar', 'sense:yada']
      forms:
        hbo-Hebr/tiberian:
          text: בַּשָּׂדֶה וַיָּקָם קַיִן אֶל־הֶבֶל אָחִיו וַיַּהַרְגֵהוּ׃
          tokens: [{surface: בַּשָּׂדֶה, sense: sadeh, morphs: [{surface: בַּ, kc: 'sense:be'}, {surface: שָּׂדֶה, kc: 'sense:sadeh'}], readings: {tiberian: baśśāḏeh}}, {surface: וַיָּקָם, sense: qum, form: 'form:wayyiqtol-3ms',
              readings: {tiberian: wayyā́qom}}, {surface: קַיִן, sense: qayin, readings: {tiberian: qáyin}}, {surface: אֶל, sense: el, readings: {tiberian: ʾel-}}, {surface: הֶבֶל, sense: hevel, readings: {
                tiberian: héḇel}}, {surface: אָחִיו, sense: ah, morphs: [{surface: אָחִי, kc: 'sense:ah'}, {surface: ו, kc: 'form:sfx-3ms'}], readings: {tiberian: ʾāḥîw}}, {surface: וַיַּהַרְגֵהוּ, sense: harag,
              form: 'form:wayyiqtol-3ms', morphs: [{surface: וַיַּהַרְגֵ, kc: 'sense:harag'}, {surface: הוּ, kc: 'form:sfx-3ms'}], readings: {tiberian: wayyaharḡḗhû}}]
      translations:
        en: Cain rose up against his brother Abel and killed him.
  - choose:
      prompt:
        en: Where were the brothers when Cain killed Abel?
      options: [{en: in the field}, {en: in the garden}, {en: at home}]
      answer: 0
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר יְהוָה אֶל־קַיִן
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}, {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֶל, sense: el,
              readings: {tiberian: ʾel-}}, {surface: קַיִן, sense: qayin, readings: {tiberian: qáyin}}]
      translations:
        en: And the LORD said to Cain,
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: אֵי הֶבֶל אָחִיךָ
          tokens: [{surface: אֵי, sense: ay, readings: {tiberian: ʾê}}, {surface: הֶבֶל, sense: hevel, readings: {tiberian: héḇel}}, {surface: אָחִיךָ, sense: ah, morphs: [{surface: אָחִי, kc: 'sense:ah'},
                {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ʾāḥî́ḵā}}]
      translations:
        en: “Where is your brother Abel?”
  - line:
