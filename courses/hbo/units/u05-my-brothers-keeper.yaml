stories:
- id: hbo.story.my-brothers-keeper
  node: hbo.u05.story
  title:
    en: My brother's keeper (Genesis 4:8–10)
  characters:
  - {id: god, name: {hbo-Hebr/tiberian: יְהוָה}}
  - {id: cain, speaker: m, name: {hbo-Hebr/tiberian: קַיִן}}
  steps:
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר קַיִן אֶל־הֶבֶל׃
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}, {surface: קַיִן, sense: qayin, readings: {tiberian: qáyin}}, {surface: אֶל, sense: el,
              readings: {tiberian: ʾel-}}, {surface: הֶבֶל, sense: hevel, readings: {tiberian: héḇel}}]
      translations:
        en: And Cain spoke to his brother Abel.
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: אָחִיו וַיְהִי בִּהְיוֹתָם
