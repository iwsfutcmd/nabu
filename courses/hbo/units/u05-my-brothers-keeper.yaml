        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}]
      translations:
        en: And he said,
  - line:
      speaker: cain
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: לֹא יָדַעְתִּי הֲשֹׁמֵר אָחִי אָנֹכִי׃
          tokens: [{surface: לֹא, sense: lo, readings: {tiberian: lōʾ}}, {surface: יָדַעְתִּי, sense: yada, form: 'form:qatal-1cs', readings: {tiberian: yāḏáʿtî}}, {surface: הֲשֹׁמֵר, sense: shamar, form: 'form:ptc-ms',
              morphs: [{surface: הֲ, kc: 'sense:ha.q'}, {surface: שֹׁמֵר, kc: 'sense:shamar'}], readings: {tiberian: hăšōmēr}}, {surface: אָחִי, sense: ah, morphs: [{surface: אָחִ, kc: 'sense:ah'}, {surface: י,
                  kc: 'form:sfx-1cs'}], readings: {tiberian: ʾāḥî}}, {surface: אָנֹכִי, sense: anokhi, readings: {tiberian: ʾānṓḵî}}]
      translations:
        en: “I do not know. Am I my brother's keeper?”
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}]
      translations:
        en: And he said,
  - line:
      speaker: god
      ask: complete
      gap: sense:dam
      distractors: ['sense:qol', 'sense:ah']
      forms:
        hbo-Hebr/tiberian:
          text: מֶה עָשִׂיתָ קוֹל דְּמֵי אָחִיךָ צֹעֲקִים אֵלַי מִן־הָאֲדָמָה׃
          tokens: [{surface: מֶה, sense: mah, readings: {tiberian: meh}}, {surface: עָשִׂיתָ, sense: asah, form: 'form:qatal-2ms', readings: {tiberian: ʿāśî́ṯā}}, {surface: קוֹל, sense: qol, form: 'form:cstr',
              readings: {tiberian: qôl}}, {surface: דְּמֵי, sense: dam, form: 'form:pl-cstr', readings: {tiberian: dəmê}}, {surface: אָחִיךָ, sense: ah, morphs: [{surface: אָחִי, kc: 'sense:ah'}, {surface: ךָ,
                  kc: 'form:sfx-2ms'}], readings: {tiberian: ʾāḥî́ḵā}}, {surface: צֹעֲקִים, sense: tsaaq, form: 'form:ptc-mp', readings: {tiberian: ṣōʿăqîm}}, {surface: אֵלַי, sense: el, morphs: [{surface: אֵלַ,
                  kc: 'sense:el'}, {surface: י, kc: 'form:sfx-1cs'}], readings: {tiberian: ʾēlay}}, {surface: מִן, sense: min, readings: {tiberian: min-}}, {surface: הָאֲדָמָה, sense: adamah, morphs: [
                {surface: הָ, kc: 'sense:ha'}, {surface: אֲדָמָה, kc: 'sense:adamah'}], readings: {tiberian: hāʾăḏāmâ}}]
      translations:
        en: “What have you done? The voice of your brother's blood is crying out to me from the ground.”
  - choose:
      prompt:
        en: What does Cain answer when the LORD asks where Abel is?
      options: [{en: that he does not know}, {en: that Abel is in the field}, {en: that Abel is asleep}]
      answer: 0
