# Biblical Hebrew (hbo), unit 1: Let there be light (Genesis 1:3-5).
# Nouns, the article, "and", noun sentences, and the narrative past (wayyiqtol) of say, see and call.
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u01-let-there-be-light
title:
  en: Let there be light
cefr: A1
kcs:
- id: sense:or
  gloss:
    en: light
  forms:
    hbo-Hebr/tiberian: [אוֹר]
  image: {file: ../images/sun.svg, license: CC0-1.0, provenance: {author: 'llm:claude@bc6746e0390b', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:hoshekh
  gloss:
    en: darkness
  forms:
    hbo-Hebr/tiberian: [חֹשֶׁךְ]
- id: sense:we
  gloss:
    en: and (written joined to the next word)
  forms:
    hbo-Hebr/tiberian: [וְ]
  notes:
    en: 'וְ wə- is written on the word it joins: וְחֹשֶׁךְ ''and darkness''. Before a stressed first syllable it is often וָ wā- (יוֹם וָלַיְלָה), before b, m, p and a shewa וּ û-.'
- id: sense:yom
  gloss:
    en: day; daytime
  forms:
    hbo-Hebr/tiberian: [יוֹם]
- id: sense:layla
  gloss:
    en: night
  forms:
    hbo-Hebr/tiberian: [לַיְלָה]
  image: {file: ../images/moon.svg, license: CC0-1.0, provenance: {author: 'llm:claude@2c94300bb951', status: draft}, source: Drawn for Nabu (courses/images)}
  notes:
    en: 'At a pause in the verse it is לָיְלָה lā́ylâ. The stress is on the first syllable: láylâ.'
- id: sense:ha
  gloss:
    en: the (written joined to the next word)
  forms:
    hbo-Hebr/tiberian: [הַ]
  notes:
    en: 'The article הַ ha- doubles the next letter (a dagesh): הַיּוֹם hayyôm ''the day''. Before א ע ר, which do not double, it is הָ hā-: הָאוֹר.'
- id: sense:tov
  gloss:
    en: good; well
  forms:
    hbo-Hebr/tiberian: [טוֹב]
  image: {file: ../images/smile.svg, license: CC0-1.0, provenance: {author: 'llm:claude@d6c9379209cc', status: draft}, source: Drawn for Nabu (courses/images)}
- id: construction:nominal
  gloss:
    en: 'a noun sentence: no verb ''to be'' (הָאוֹר טוֹב ''the light is good'')'
- id: sense:erev
  gloss:
    en: evening
  forms:
    hbo-Hebr/tiberian: [עֶרֶב]
- id: sense:boqer
  gloss:
    en: morning
  forms:
    hbo-Hebr/tiberian: [בֹּקֶר]
  image: {file: ../images/sunrise.svg, license: CC0-1.0, provenance: {author: 'llm:claude@6e8439dc1c29', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:elohim
  gloss:
    en: God; gods
  forms:
    hbo-Hebr/tiberian: [אֱלֹהִים]
  notes:
    en: 'Plural in form (-îm), but as the name of Israel''s God it takes singular verbs: וַיֹּאמֶר אֱלֹהִים ''and God said''.'
- id: sense:amar
  gloss:
    en: to say
  forms:
    hbo-Hebr/tiberian: [אָמַר]
- id: form:wayyiqtol-3ms
  gloss:
    en: 'and he did: the narrative past (wayyiqtol), he or it'
- id: sense:hayah
  gloss:
    en: to be; to become, happen
  forms:
    hbo-Hebr/tiberian: [הָיָה]
- id: form:juss
  gloss:
    en: 'let him (it) do: the jussive'
- id: sense:raah
  gloss:
    en: to see
  forms:
    hbo-Hebr/tiberian: [רָאָה]
- id: sense:et
  gloss:
    en: the mark of a definite direct object (not translated)
  forms:
    hbo-Hebr/tiberian: [אֵת]
  notes:
    en: 'אֵת ʾēṯ, joined by maqaf אֶת־ ʾeṯ-, stands before a definite object: וַיַּרְא אֶת־הָאוֹר ''he saw the light''.'
- id: sense:ki
  gloss:
    en: that; because, for
  forms:
    hbo-Hebr/tiberian: [כִּי]
- id: sense:qara
  gloss:
    en: 'to call; to name (call X Y: קָרָא לְX Y)'
  forms:
    hbo-Hebr/tiberian: [קָרָא]
- id: form:qatal-3ms
  gloss:
    en: 'he did: the perfect (qatal), he or it'
- id: sense:le
  gloss:
    en: to, for (written joined to the next word)
  forms:
    hbo-Hebr/tiberian: [לְ]
  notes:
    en: 'לְ lə- is written on its noun; with the article it takes the article''s vowel: לָאוֹר lāʾôr ''to the light''.'
- id: sense:ehad
  gloss:
    en: one
  forms:
    hbo-Hebr/tiberian: [אֶחָד]
- id: sense:beyn
  gloss:
    en: 'between (בֵּין X וּבֵין Y: between X and Y)'
  forms:
    hbo-Hebr/tiberian: [בֵּין]
- id: sense:badal
  gloss:
    en: to separate, divide (hiphil)
  forms:
    hbo-Hebr/tiberian: [הִבְדִּיל]
nodes:
- {id: hbo.u01.light, kind: lesson, introduces: ['sense:or', 'sense:hoshekh', 'sense:we', 'sense:yom', 'sense:layla']}
- {id: hbo.u01.the-day, kind: lesson, introduces: ['sense:ha', 'sense:tov', 'construction:nominal', 'sense:erev', 'sense:boqer']}
- {id: hbo.u01.god-said, kind: lesson, introduces: ['sense:elohim', 'sense:amar', 'form:wayyiqtol-3ms', 'sense:hayah', 'form:juss']}
- {id: hbo.u01.god-saw, kind: lesson, introduces: ['sense:raah', 'sense:et', 'sense:ki']}
- {id: hbo.u01.god-called, kind: lesson, introduces: ['sense:qara', 'sense:le', 'form:qatal-3ms', 'sense:ehad', 'sense:beyn', 'sense:badal']}
- {id: hbo.u01.story, kind: story}
