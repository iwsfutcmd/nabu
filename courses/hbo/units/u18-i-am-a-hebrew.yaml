# Biblical Hebrew (hbo), unit 18: I am a Hebrew (Jonah 1:4, 7-9).
# A storm at sea: "let us" (the cohortative plural), each to his fellow, questions of identity (what is your
# work, where do you come from, of what people are you), the short relative שֶׁ-, and אֲנִי "I".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u18-i-am-a-hebrew
title:
  en: I am a Hebrew
cefr: A2
kcs:
- id: sense:yam
  gloss:
    en: sea
  forms:
    hbo-Hebr/tiberian: [יָם]
  image: {file: ../images/fish.svg, license: CC0-1.0, provenance: {author: 'llm:claude@39173f79ba6d', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:saar
  gloss:
    en: storm, tempest
  forms:
    hbo-Hebr/tiberian: [סַעַר]
- id: sense:hetil
  gloss:
    en: to hurl, throw (hiphil)
  forms:
    hbo-Hebr/tiberian: [הֵטִיל]
- id: sense:hishev
  gloss:
    en: to think, intend; be about to (piel)
  forms:
    hbo-Hebr/tiberian: [חִשֵּׁב]
- id: sense:nishbar
  gloss:
    en: to be broken, break up (niphal of שָׁבַר)
  forms:
    hbo-Hebr/tiberian: [נִשְׁבַּר]
- id: sense:goral
  gloss:
    en: lot (for casting)
  forms:
    hbo-Hebr/tiberian: [גּוֹרָל]
- id: sense:hippil
  gloss:
    en: to cast, make fall (hiphil of נָפַל)
  forms:
    hbo-Hebr/tiberian: [הִפִּיל]
- id: sense:nafal
  gloss:
    en: to fall
  forms:
    hbo-Hebr/tiberian: [נָפַל]
- id: sense:she
  gloss:
    en: 'who, which, that (the short relative, written joined: שֶׁ־)'
  forms:
    hbo-Hebr/tiberian: [שֶׁ]
- id: sense:melakhah
  gloss:
    en: work, occupation
  forms:
    hbo-Hebr/tiberian: [מְלָאכָה]
- id: sense:ayin.whence
  gloss:
    en: 'where? (מֵאַיִן: from where?)'
  forms:
    hbo-Hebr/tiberian: [אַיִן]
- id: sense:ivri
  gloss:
    en: Hebrew; a Hebrew
  forms:
    hbo-Hebr/tiberian: [עִבְרִי]
- id: sense:ani
  gloss:
    en: I
  forms:
    hbo-Hebr/tiberian: [אֲנִי]
- id: sense:yabbashah
  gloss:
    en: dry land
  forms:
    hbo-Hebr/tiberian: [יַבָּשָׁה]
