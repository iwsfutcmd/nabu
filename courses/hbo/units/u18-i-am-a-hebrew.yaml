stories:
- id: hbo.story.i-am-a-hebrew
  node: hbo.u18.story
  title:
    en: I am a Hebrew (Jonah 1:4, 7–9)
  characters:
  - {id: jonah, speaker: m, name: {hbo-Hebr/tiberian: יוֹנָה}}
  - {id: sailors, speaker: m, name: {hbo-Hebr/tiberian: הָאֲנָשִׁים}}
  steps:
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיהוָה הֵטִיל רוּחַ־גְּדוֹלָה אֶל־הַיָּם
          tokens: [{surface: וַיהוָה, sense: yhwh, morphs: [{surface: וַ, kc: 'sense:we'}, {surface: יהוָה, kc: 'sense:yhwh'}], readings: {tiberian: waʾḏōnāy}}, {surface: הֵטִיל, sense: hetil, form: 'form:qatal-3ms',
              readings: {tiberian: hēṭîl}}, {surface: רוּחַ, sense: ruach, readings: {tiberian: rûaḥ-}}, {surface: גְּדוֹלָה, sense: gadol, form: 'form:f', readings: {tiberian: gəḏôlâ}}, {surface: אֶל,
              sense: el, readings: {tiberian: ʾel-}}, {surface: הַיָּם, sense: yam, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: יָּם, kc: 'sense:yam'}], readings: {tiberian: hayyām}}]
      translations:
        en: But the LORD hurled a great wind onto the sea,
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיְהִי סַעַר־גָּדוֹל בַּיָּם
          tokens: [{surface: וַיְהִי, sense: hayah, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayhî}}, {surface: סַעַר, sense: saar, readings: {tiberian: saʿar-}}, {surface: גָּדוֹל, sense: gadol,
              readings: {tiberian: gāḏôl}}, {surface: בַּיָּם, sense: yam, morphs: [{surface: בַּ, kc: 'sense:be'}, {surface: יָּם, kc: 'sense:yam'}], readings: {tiberian: bayyām}}]
      translations:
        en: and there was a great storm on the sea,
  - line:
      ask: complete
      gap: sense:oniyyah
      distractors: ['sense:yam', 'sense:ir']
      forms:
        hbo-Hebr/tiberian:
          text: וְהָאֳנִיָּה חִשְּׁבָה לְהִשָּׁבֵר׃
          tokens: [{surface: וְהָאֳנִיָּה, sense: oniyyah, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: הָ, kc: 'sense:ha'}, {surface: אֳנִיָּה, kc: 'sense:oniyyah'}], readings: {tiberian: wəhāʾŏniyyâ}},
            {surface: חִשְּׁבָה, sense: hishev, form: 'form:qatal-3fs', readings: {tiberian: ḥiššəḇâ}}, {surface: לְהִשָּׁבֵר, sense: nishbar, form: 'form:inf', morphs: [{surface: לְ, kc: 'sense:le'}, {
                  surface: הִשָּׁבֵר, kc: 'sense:nishbar'}], readings: {tiberian: ləhiššāḇēr}}]
      translations:
        en: and the ship was about to break up.
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ
          tokens: [{surface: וַיֹּאמְרוּ, sense: amar, form: 'form:wayyiqtol-3mp', readings: {tiberian: wayyōʾmərû}}, {surface: אִישׁ, sense: ish, readings: {tiberian: ʾîš}}, {surface: אֶל, sense: el, readings: {
                tiberian: ʾel-}}, {surface: רֵעֵהוּ, sense: rea, morphs: [{surface: רֵעֵ, kc: 'sense:rea'}, {surface: הוּ, kc: 'form:sfx-3ms'}], readings: {tiberian: rēʿḗhû}}]
      translations:
        en: And they said to one another,
  - line:
      speaker: sailors
      forms:
        hbo-Hebr/tiberian:
          text: לְכוּ וְנַפִּילָה גוֹרָלוֹת וְנֵדְעָה בְּשֶׁלְּמִי הָרָעָה הַזֹּאת לָנוּ וַיַּפִּלוּ
          tokens: [{surface: לְכוּ, sense: halakh, form: 'form:impv-mp', readings: {tiberian: ləḵû}}, {surface: וְנַפִּילָה, sense: hippil, form: 'form:coh', morphs: [{surface: וְ, kc: 'sense:we'}, {surface: נַפִּילָה,
                  kc: 'sense:hippil'}], readings: {tiberian: wənappî́lâ}}, {surface: גוֹרָלוֹת, sense: goral, form: 'form:pl', readings: {tiberian: ḡôrālôṯ}}, {surface: וְנֵדְעָה, sense: yada, form: 'form:coh',
              morphs: [{surface: וְ, kc: 'sense:we'}, {surface: נֵדְעָה, kc: 'sense:yada'}], readings: {tiberian: wənēḏʿâ}}, {surface: בְּשֶׁלְּמִי, sense: mi, morphs: [{surface: בְּ, kc: 'sense:be'}, {
                  surface: שֶׁ, kc: 'sense:she'}, {surface: לְּ, kc: 'sense:le'}, {surface: מִי, kc: 'sense:mi'}], readings: {tiberian: bəšelləmî}}, {surface: הָרָעָה, sense: raah.evil, morphs: [{surface: הָ,
                  kc: 'sense:ha'}, {surface: רָעָה, kc: 'sense:raah.evil'}], readings: {tiberian: hārāʿâ}}, {surface: הַזֹּאת, sense: zot, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: זֹּאת, kc: 'sense:zot'}],
              readings: {tiberian: hazzōʾṯ}}, {surface: לָנוּ, sense: le, morphs: [{surface: לָ, kc: 'sense:le'}, {surface: נוּ, kc: 'form:sfx-1cp'}], readings: {tiberian: lā́nû}}, {surface: וַיַּפִּלוּ,
              sense: hippil, form: 'form:wayyiqtol-3mp', readings: {tiberian: wayyappílû}}]
      translations:
        en: “Come, let us cast lots, so that we may know on whose account this evil has come upon us.”
  - line:
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: גּוֹרָלוֹת וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה׃
          tokens: [{surface: גּוֹרָלוֹת, sense: goral, form: 'form:pl', readings: {tiberian: gôrālôṯ}}, {surface: וַיִּפֹּל, sense: nafal, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyippōl}}, {
              surface: הַגּוֹרָל, sense: goral, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: גּוֹרָל, kc: 'sense:goral'}], readings: {tiberian: haggôrāl}}, {surface: עַל, sense: al, readings: {tiberian: ʿal-}},
            {surface: יוֹנָה, sense: yonah, readings: {tiberian: yônâ}}]
      translations:
        en: So they cast lots, and the lot fell on Jonah.
  - choose:
      prompt:
        en: On whom did the lot fall?
      options: [{en: on Jonah}, {en: on the captain}, {en: on no one}]
      answer: 0
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמְרוּ אֵלָיו
          tokens: [{surface: וַיֹּאמְרוּ, sense: amar, form: 'form:wayyiqtol-3mp', readings: {tiberian: wayyōʾmərû}}, {surface: אֵלָיו, sense: el, morphs: [{surface: אֵלָי, kc: 'sense:el'}, {surface: ו,
                  kc: 'form:sfx-3ms'}], readings: {tiberian: ʾēlāyw}}]
      translations:
        en: Then they said to him,
  - line:
      speaker: sailors
      forms:
        hbo-Hebr/tiberian:
          text: הַגִּידָה־נָּא לָנוּ בַּאֲשֶׁר לְמִי־הָרָעָה הַזֹּאת לָנוּ מַה־מְּלַאכְתְּךָ וּמֵאַיִן תָּבוֹא מָה אַרְצֶךָ וְאֵי־מִזֶּה עַם אָתָּה׃
          tokens: [{surface: הַגִּידָה, sense: nagad, form: 'form:impv-ms', readings: {tiberian: haggîḏâ-}}, {surface: נָּא, sense: na, readings: {tiberian: nāʾ}}, {surface: לָנוּ, sense: le, morphs: [
                {surface: לָ, kc: 'sense:le'}, {surface: נוּ, kc: 'form:sfx-1cp'}], readings: {tiberian: lā́nû}}, {surface: בַּאֲשֶׁר, sense: asher, morphs: [{surface: בַּ, kc: 'sense:be'}, {surface: אֲשֶׁר,
                  kc: 'sense:asher'}], readings: {tiberian: baʾăšer}}, {surface: לְמִי, sense: mi, morphs: [{surface: לְ, kc: 'sense:le'}, {surface: מִי, kc: 'sense:mi'}], readings: {tiberian: ləmî-}},
            {surface: הָרָעָה, sense: raah.evil, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: רָעָה, kc: 'sense:raah.evil'}], readings: {tiberian: hārāʿâ}}, {surface: הַזֹּאת, sense: zot, morphs: [
                {surface: הַ, kc: 'sense:ha'}, {surface: זֹּאת, kc: 'sense:zot'}], readings: {tiberian: hazzōʾṯ}}, {surface: לָנוּ, sense: le, morphs: [{surface: לָ, kc: 'sense:le'}, {surface: נוּ, kc: 'form:sfx-1cp'}],
              readings: {tiberian: lā́nû}}, {surface: מַה, sense: mah, readings: {tiberian: mah-}}, {surface: מְּלַאכְתְּךָ, sense: melakhah, morphs: [{surface: מְּלַאכְתְּ, kc: 'sense:melakhah'}, {surface: ךָ,
                  kc: 'form:sfx-2ms'}], readings: {tiberian: məlaʾḵtəḵā}}, {surface: וּמֵאַיִן, sense: ayin.whence, morphs: [{surface: וּ, kc: 'sense:we'}, {surface: מֵ, kc: 'sense:min'}, {surface: אַיִן,
                  kc: 'sense:ayin.whence'}], readings: {tiberian: ûmēʾáyin}}, {surface: תָּבוֹא, sense: bo, form: 'form:yiqtol-2ms', readings: {tiberian: tāḇôʾ}}, {surface: מָה, sense: mah, readings: {
                tiberian: mâ}}, {surface: אַרְצֶךָ, sense: erets, morphs: [{surface: אַרְצֶ, kc: 'sense:erets'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ʾarṣéḵā}}, {surface: וְאֵי, sense: ay,
              morphs: [{surface: וְ, kc: 'sense:we'}, {surface: אֵי, kc: 'sense:ay'}], readings: {tiberian: wəʾê-}}, {surface: מִזֶּה, sense: zeh, morphs: [{surface: מִ, kc: 'sense:min'}, {surface: זֶּה,
                  kc: 'sense:zeh'}], readings: {tiberian: mizzeh}}, {surface: עַם, sense: am, readings: {tiberian: ʿam}}, {surface: אָתָּה, sense: atta, readings: {tiberian: ʾā́ttâ}}]
      translations:
        en: “Tell us, on whose account has this evil come upon us? What is your occupation, and where do you come from? What is your country, and of what people are you?”
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר אֲלֵיהֶם
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}, {surface: אֲלֵיהֶם, sense: el, morphs: [{surface: אֲלֵי, kc: 'sense:el'}, {surface: הֶם,
                  kc: 'form:sfx-3mp'}], readings: {tiberian: ʾălêhem}}]
      translations:
        en: And he said to them,
  - line:
      speaker: jonah
      ask: complete
      gap: sense:yam
      distractors: ['sense:har', 'sense:sadeh']
      forms:
        hbo-Hebr/tiberian:
          text: עִבְרִי אָנֹכִי וְאֶת־יְהוָה אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא אֲשֶׁר־עָשָׂה אֶת־הַיָּם וְאֶת־הַיַּבָּשָׁה׃
          tokens: [{surface: עִבְרִי, sense: ivri, readings: {tiberian: ʿiḇrî}}, {surface: אָנֹכִי, sense: anokhi, readings: {tiberian: ʾānṓḵî}}, {surface: וְאֶת, sense: et, morphs: [{surface: וְ, kc: 'sense:we'},
                {surface: אֶת, kc: 'sense:et'}], readings: {tiberian: wəʾeṯ-}}, {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֱלֹהֵי, sense: elohim, form: 'form:pl-cstr', readings: {
                tiberian: ʾĕlōhê}}, {surface: הַשָּׁמַיִם, sense: shamayim, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: שָּׁמַיִם, kc: 'sense:shamayim'}], readings: {tiberian: haššāmáyim}}, {surface: אֲנִי,
