              sense: asah, form: 'form:qatal-3ms', readings: {tiberian: ʿāśâ}}, {surface: אֶת, sense: et, readings: {tiberian: ʾeṯ-}}, {surface: הַיָּם, sense: yam, morphs: [{surface: הַ, kc: 'sense:ha'},
