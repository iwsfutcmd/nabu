# Biblical Hebrew (hbo), unit 10: The burning bush (Exodus 3:2-6).
# The niphal "appeared", אֵין "there is not", the demonstrative זֶה, "why?", prohibitions with אַל
# (to a man, a woman, several people), the cohortative "let me", the dual (feet), and "the God of …".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u10-the-burning-bush
title:
  en: The burning bush
cefr: A2
kcs:
- id: sense:malakh
  gloss:
    en: messenger; angel
  forms:
    hbo-Hebr/tiberian: [מַלְאָךְ]
- id: sense:nirah
  gloss:
    en: to appear, be seen (niphal of רָאָה)
  forms:
    hbo-Hebr/tiberian: [נִרְאָה]
- id: sense:seneh
  gloss:
    en: bush, thornbush
  forms:
    hbo-Hebr/tiberian: [סְנֶה]
- id: sense:labbah
  gloss:
    en: flame
  forms:
    hbo-Hebr/tiberian: [לַבָּה]
- id: sense:baar
  gloss:
    en: to burn
  forms:
    hbo-Hebr/tiberian: [בָּעַר]
- id: sense:eyn
  gloss:
    en: there is not; is not (אֵין, with suffixes אֵינֶנּוּ 'he is not')
  forms:
    hbo-Hebr/tiberian: [אַיִן]
- id: form:ptc-pass
  gloss:
    en: 'passive participle: done, -ed (בָּרוּךְ ''blessed''; אֻכָּל ''consumed'' is an older kind)'
- id: sense:moshe
  gloss:
    en: Moses
  forms:
    hbo-Hebr/tiberian: [מֹשֶׁה]
- id: sense:sur
  gloss:
    en: to turn aside
  forms:
    hbo-Hebr/tiberian: [סוּר]
- id: sense:marah
  gloss:
    en: sight, appearance; vision
  forms:
    hbo-Hebr/tiberian: [מַרְאֶה]
- id: sense:zeh
  gloss:
    en: this (m.)
  forms:
    hbo-Hebr/tiberian: [זֶה]
- id: sense:maddua
  gloss:
    en: why?
  forms:
    hbo-Hebr/tiberian: [מַדּוּעַ]
- id: sense:al.neg
  gloss:
    en: 'do not (with the jussive: אַל־תִּירָא ''do not fear'')'
  forms:
    hbo-Hebr/tiberian: [אַל]
- id: sense:qarav
  gloss:
    en: to come near, approach
  forms:
    hbo-Hebr/tiberian: [קָרַב]
- id: sense:halom
  gloss:
    en: here, to this place
  forms:
    hbo-Hebr/tiberian: [הֲלֹם]
- id: sense:nashal
  gloss:
    en: to take off, slip off (sandals)
  forms:
    hbo-Hebr/tiberian: [נָשַׁל]
- id: sense:naal
  gloss:
    en: sandal
  forms:
    hbo-Hebr/tiberian: [נַעַל]
- id: sense:regel
  gloss:
    en: foot
  forms:
    hbo-Hebr/tiberian: [רֶגֶל]
- id: form:du
  gloss:
    en: 'dual (-áyim): two of a pair (רַגְלַיִם ''feet'')'
- id: sense:maqom
  gloss:
    en: place
  forms:
    hbo-Hebr/tiberian: [מָקוֹם]
- id: sense:amad
  gloss:
    en: to stand
  forms:
    hbo-Hebr/tiberian: [עָמַד]
- id: sense:qodesh
  gloss:
    en: holiness; holy thing (אַדְמַת־קֹדֶשׁ 'holy ground')
  forms:
    hbo-Hebr/tiberian: [קֹדֶשׁ]
- id: sense:yaaqov
  gloss:
    en: Jacob
  forms:
    hbo-Hebr/tiberian: [יַעֲקֹב]
- id: sense:histir
  gloss:
    en: to hide (hiphil)
  forms:
    hbo-Hebr/tiberian: [הִסְתִּיר]
- id: sense:hibbit
  gloss:
    en: to look (hiphil)
  forms:
    hbo-Hebr/tiberian: [הִבִּיט]
