# Biblical Hebrew (hbo), unit 2: In the beginning (Genesis 1:1-2).
# The preposition בְּ, the construct state ("the face of"), the perfect of הָיָה with a feminine subject,
# feminine adjectives and the participle.
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u02-in-the-beginning
title:
  en: In the beginning
cefr: A1
kcs:
- id: sense:shamayim
  gloss:
    en: heaven, heavens; sky
  forms:
    hbo-Hebr/tiberian: [שָׁמַיִם]
  image: {file: ../images/star.svg, license: CC0-1.0, provenance: {author: 'llm:claude@216a08b1b4a4', status: draft}, source: Drawn for Nabu (courses/images)}
  notes:
    en: 'Always plural in form: הַשָּׁמַיִם haššāmáyim, ''the heavens'', also ''the sky''.'
- id: sense:erets
  gloss:
    en: earth; land, country
  forms:
    hbo-Hebr/tiberian: [אֶרֶץ]
  notes:
    en: Feminine. With the article הָאָרֶץ hāʾā́reṣ.
- id: sense:bara
  gloss:
    en: to create (only God creates)
  forms:
    hbo-Hebr/tiberian: [בָּרָא]
- id: sense:be
  gloss:
    en: in; at; with, by (written joined to the next word)
  forms:
    hbo-Hebr/tiberian: [בְּ]
  notes:
    en: 'בְּ bə- is written on its noun; with the article it takes the article''s vowel: בַּיּוֹם bayyôm ''in the day''.'
- id: sense:reshit
  gloss:
    en: beginning; first, best part
  forms:
    hbo-Hebr/tiberian: [רֵאשִׁית]
- id: form:qatal-3fs
  gloss:
    en: 'she did: the perfect (qatal), she or it (f.)'
- id: form:f
  gloss:
    en: 'feminine adjective (-â): טוֹבָה ''good'' with a feminine noun'
- id: sense:tohu
  gloss:
    en: formlessness, emptiness; a waste
  forms:
    hbo-Hebr/tiberian: [תֹּהוּ]
- id: sense:bohu
  gloss:
    en: emptiness, void (only in תֹהוּ וָבֹהוּ)
  forms:
    hbo-Hebr/tiberian: [בֹּהוּ]
- id: sense:al
  gloss:
    en: on, upon; over; about, concerning
  forms:
    hbo-Hebr/tiberian: [עַל]
- id: sense:panim
  gloss:
    en: face; front, surface
  forms:
    hbo-Hebr/tiberian: [פָּנִים]
  notes:
    en: 'Always plural in form. Before another noun it is פְּנֵי pənê, ''the face of'': עַל־פְּנֵי הַמָּיִם.'
- id: form:cstr
  gloss:
    en: 'construct state: ''X of …'', the noun bound to the next (פְּנֵי ''the face of'')'
- id: sense:tehom
  gloss:
    en: the deep, the primeval ocean
  forms:
    hbo-Hebr/tiberian: [תְּהוֹם]
- id: sense:mayim
  gloss:
    en: water, waters
  forms:
    hbo-Hebr/tiberian: [מַיִם]
  image: {file: ../images/water.svg, license: CC0-1.0, provenance: {author: 'llm:claude@e7d707f749db', status: draft}, source: Drawn for Nabu (courses/images)}
  notes:
    en: 'Always plural in form: מַיִם máyim, ''water''.'
- id: sense:ruach
  gloss:
    en: wind; spirit; breath
  forms:
    hbo-Hebr/tiberian: [רוּחַ]
- id: sense:rachaf
  gloss:
    en: to hover, flutter (piel)
  forms:
    hbo-Hebr/tiberian: [רִחֵף]
- id: form:ptc-fs
  gloss:
    en: 'participle, feminine singular: she/it is doing'
- id: form:pl
  gloss:
    en: 'plural: masculine -îm, feminine -ôṯ'
nodes:
- {id: hbo.u02.heaven-and-earth, kind: lesson, introduces: ['sense:shamayim', 'sense:erets', 'sense:bara', 'sense:be', 'sense:reshit']}
- {id: hbo.u02.the-earth-was, kind: lesson, introduces: ['form:qatal-3fs', 'form:f', 'sense:tohu', 'sense:bohu']}
- {id: hbo.u02.the-deep, kind: lesson, introduces: ['sense:al', 'sense:panim', 'form:cstr', 'sense:tehom']}
- {id: hbo.u02.the-spirit, kind: lesson, introduces: ['sense:mayim', 'form:pl', 'sense:ruach', 'sense:rachaf', 'form:ptc-fs']}
- {id: hbo.u02.story, kind: story}
