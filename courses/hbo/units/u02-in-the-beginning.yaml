stories:
- id: hbo.story.in-the-beginning
  node: hbo.u02.story
  title:
    en: In the beginning (Genesis 1:1–3)
  characters:
  - {id: god, name: {hbo-Hebr/tiberian: אֱלֹהִים}}
  steps:
  - line:
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: בְּרֵאשִׁית בָּרָא אֱלֹהִים אֵת הַשָּׁמַיִם וְאֵת הָאָרֶץ׃
          tokens: [{surface: בְּרֵאשִׁית, sense: reshit, morphs: [{surface: בְּ, kc: 'sense:be'}, {surface: רֵאשִׁית, kc: 'sense:reshit'}], readings: {tiberian: bərēʾšîṯ}}, {surface: בָּרָא, sense: bara,
              form: 'form:qatal-3ms', readings: {tiberian: bārāʾ}}, {surface: אֱלֹהִים, sense: elohim, readings: {tiberian: ʾĕlōhîm}}, {surface: אֵת, sense: et, readings: {tiberian: ʾēṯ}}, {surface: הַשָּׁמַיִם,
              sense: shamayim, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: שָּׁמַיִם, kc: 'sense:shamayim'}], readings: {tiberian: haššāmáyim}}, {surface: וְאֵת, sense: et, morphs: [{surface: וְ,
                  kc: 'sense:we'}, {surface: אֵת, kc: 'sense:et'}], readings: {tiberian: wəʾēṯ}}, {surface: הָאָרֶץ, sense: erets, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: אָרֶץ, kc: 'sense:erets'}],
              readings: {tiberian: hāʾā́reṣ}}]
      translations:
        en: In the beginning God created the heavens and the earth.
  - choose:
      prompt:
        en: What did God create in the beginning?
      options: [{en: the heavens and the earth}, {en: the light and the darkness}, {en: the water and the wind}]
      answer: 0
  - line:
      ask: complete
      gap: sense:erets
      distractors: ['sense:shamayim', 'sense:mayim']
      forms:
        hbo-Hebr/tiberian:
          text: וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ
          tokens: [{surface: וְהָאָרֶץ, sense: erets, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: הָ, kc: 'sense:ha'}, {surface: אָרֶץ, kc: 'sense:erets'}], readings: {tiberian: wəhāʾā́reṣ}}, {surface: הָיְתָה,
              sense: hayah, form: 'form:qatal-3fs', readings: {tiberian: hāyəṯâ}}, {surface: תֹהוּ, sense: tohu, readings: {tiberian: ṯṓhû}}, {surface: וָבֹהוּ, sense: bohu, morphs: [{surface: וָ, kc: 'sense:we'},
                {surface: בֹהוּ, kc: 'sense:bohu'}], readings: {tiberian: wāḇṓhû}}]
      translations:
        en: Now the earth was formless and empty,
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וְחֹשֶׁךְ עַל־פְּנֵי תְהוֹם
          tokens: [{surface: וְחֹשֶׁךְ, sense: hoshekh, morphs: [{surface: וְ, kc: 'sense:we'}, {surface: חֹשֶׁךְ, kc: 'sense:hoshekh'}], readings: {tiberian: wəḥṓšeḵ}}, {surface: עַל, sense: al, readings: {
                tiberian: ʿal-}}, {surface: פְּנֵי, sense: panim, form: 'form:cstr', readings: {tiberian: pənê}}, {surface: תְהוֹם, sense: tehom, readings: {tiberian: ṯəhôm}}]
      translations:
        en: and darkness was over the face of the deep,
  - line:
      ask: complete
      gap: sense:mayim
      distractors: ['sense:erets', 'sense:tehom']
      forms:
        hbo-Hebr/tiberian:
          text: וְרוּחַ אֱלֹהִים מְרַחֶפֶת עַל־פְּנֵי הַמָּיִם׃
          tokens: [{surface: וְרוּחַ, sense: ruach, form: 'form:cstr', morphs: [{surface: וְ, kc: 'sense:we'}, {surface: רוּחַ, kc: 'sense:ruach'}], readings: {tiberian: wərûaḥ}}, {surface: אֱלֹהִים, sense: elohim,
              readings: {tiberian: ʾĕlōhîm}}, {surface: מְרַחֶפֶת, sense: rachaf, form: 'form:ptc-fs', readings: {tiberian: məraḥép̄eṯ}}, {surface: עַל, sense: al, readings: {tiberian: ʿal-}}, {surface: פְּנֵי,
              sense: panim, form: 'form:cstr', readings: {tiberian: pənê}}, {surface: הַמָּיִם, sense: mayim, morphs: [{surface: הַ, kc: 'sense:ha'}, {surface: מָּיִם, kc: 'sense:mayim'}], readings: {tiberian: hammā́yim}}]
      translations:
        en: and the spirit of God was hovering over the face of the waters.
  - choose:
      prompt:
        en: What was hovering over the face of the waters?
      options: [{en: the spirit of God}, {en: the light}, {en: the earth}]
      answer: 0
  - line:
      forms:
        hbo-Hebr/tiberian:
          text: וַיֹּאמֶר אֱלֹהִים
          tokens: [{surface: וַיֹּאמֶר, sense: amar, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayyṓʾmer}}, {surface: אֱלֹהִים, sense: elohim, readings: {tiberian: ʾĕlōhîm}}]
      translations:
        en: And God said,
  - line:
      speaker: god
      forms:
        hbo-Hebr/tiberian:
          text: יְהִי אוֹר
          tokens: [{surface: יְהִי, sense: hayah, form: 'form:juss', readings: {tiberian: yəhî}}, {surface: אוֹר, sense: or, readings: {tiberian: ʾôr}}]
      translations:
        en: “Let there be light,”
  - line:
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: וַיְהִי־אוֹר׃
          tokens: [{surface: וַיְהִי, sense: hayah, form: 'form:wayyiqtol-3ms', readings: {tiberian: wayhî-}}, {surface: אוֹר, sense: or, readings: {tiberian: ʾôr}}]
      translations:
        en: and there was light.
  - choose:
      prompt:
        en: What was the earth like before God spoke?
      options: [{en: 'formless and empty, and dark'}, {en: full of light}, {en: good}]
      answer: 0
