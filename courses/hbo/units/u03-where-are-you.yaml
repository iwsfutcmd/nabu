# Biblical Hebrew (hbo), unit 3: Where are you? (Genesis 3:8-10).
# The divine name and its reading, prepositions אֶל and מִן, pronoun suffixes (his, your, to him), "I",
# the perfect "I did", the narrative past "they" and "I", and the participle "walking about".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u03-where-are-you
title:
  en: Where are you?
cefr: A1
kcs:
- id: sense:gan
  gloss:
    en: garden
  forms:
    hbo-Hebr/tiberian: [גַּן]
  image: {file: ../images/tree.svg, license: CC0-1.0, provenance: {author: 'llm:claude@3868bb19b496', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:adam
  gloss:
    en: 'man, a human being; humankind (הָאָדָם: the man, Adam)'
  forms:
    hbo-Hebr/tiberian: [אָדָם]
- id: sense:ishah
  gloss:
    en: woman; wife
  forms:
    hbo-Hebr/tiberian: [אִשָּׁה]
  notes:
    en: 'Before a suffix or another noun: אֵשֶׁת ʾēšeṯ, אִשְׁתּוֹ ʾištô ''his wife''.'
- id: sense:yhwh
  gloss:
    en: the LORD (the name of Israel's God)
  forms:
    hbo-Hebr/tiberian: [יְהוָה]
  notes:
    en: 'The four letters YHWH are not read as written: the Masoretes read the word אֲדֹנָי ʾăḏōnāy, ''my Lord'', and gave the letters its vowels. The course''s reading and audio say ʾăḏōnāy, as the Tiberian
      readers did.'
- id: sense:el
  gloss:
    en: to, toward (written אֶל־, joined to the next word)
  forms:
    hbo-Hebr/tiberian: [אֵל]
- id: sense:qol
  gloss:
    en: voice; sound
  forms:
    hbo-Hebr/tiberian: [קוֹל]
- id: sense:shama
  gloss:
    en: to hear; to listen, obey
  forms:
    hbo-Hebr/tiberian: [שָׁמַע]
- id: form:wayyiqtol-3mp
  gloss:
    en: 'and they did: the narrative past, they'
- id: form:qatal-1cs
  gloss:
    en: 'I did: the perfect (qatal), I (-tî)'
- id: sense:ets
  gloss:
    en: tree; wood
  forms:
    hbo-Hebr/tiberian: [עֵץ]
- id: sense:tokh
  gloss:
    en: 'middle (בְּתוֹךְ: in the middle of, among)'
  forms:
    hbo-Hebr/tiberian: [תָּוֶךְ]
- id: sense:hithallekh
  gloss:
    en: to walk about, go to and fro (hithpael of הָלַךְ)
  forms:
    hbo-Hebr/tiberian: [הִתְהַלֵּךְ]
- id: form:ptc-ms
  gloss:
    en: 'participle, masculine singular: he/it is doing; one who does (of a verb of state, its adjective: יָרֵא ''afraid'')'
- id: sense:hava
  gloss:
    en: to hide (oneself) (niphal)
  forms:
    hbo-Hebr/tiberian: [נֶחְבָּא]
- id: sense:hitchabbe
  gloss:
    en: to hide oneself (hithpael)
  forms:
    hbo-Hebr/tiberian: [הִתְחַבֵּא]
- id: sense:min
  gloss:
    en: from; out of; than (מִן־, or מִ- joined to the word)
  forms:
    hbo-Hebr/tiberian: [מִן]
  notes:
    en: 'Written apart as מִן־ min-, or joined with the next letter doubled: מִפְּנֵי mippənê ''from before''. Before a guttural it is מֵ mē-.'
- id: form:sfx-3ms
  gloss:
    en: his; him (the suffix -ô, -w, -hû)
- id: sense:ay
  gloss:
    en: where? (אֵי; with a suffix אַיֶּכָּה 'where are you?')
  forms:
    hbo-Hebr/tiberian: [אֵי]
- id: form:sfx-2ms
  gloss:
    en: 'your; you (said to a man: the suffix -ḵā)'
- id: sense:anokhi
  gloss:
    en: I
  forms:
    hbo-Hebr/tiberian: [אָנֹכִי]
- id: sense:yare
  gloss:
    en: to fear, be afraid; (adjective) fearing
  forms:
    hbo-Hebr/tiberian: [יָרֵא]
- id: form:wayyiqtol-1cs
  gloss:
    en: 'and I did: the narrative past, I'
- id: sense:erom
  gloss:
    en: naked
  forms:
    hbo-Hebr/tiberian: [עֵירֹם]
nodes:
- {id: hbo.u03.the-garden, kind: lesson, introduces: ['sense:gan', 'sense:adam', 'sense:ishah', 'sense:yhwh', 'sense:el']}
- {id: hbo.u03.the-voice, kind: lesson, introduces: ['sense:qol', 'sense:shama', 'form:wayyiqtol-3mp', 'form:qatal-1cs']}
- {id: hbo.u03.walking, kind: lesson, introduces: ['sense:ets', 'sense:tokh', 'sense:hithallekh', 'form:ptc-ms']}
- {id: hbo.u03.hiding, kind: lesson, introduces: ['sense:hitchabbe', 'sense:hava', 'sense:min', 'form:sfx-3ms']}
