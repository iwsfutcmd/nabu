              sense: erom, readings: {tiberian: ʿêrōm}}, {surface: אָנֹכִי, sense: anokhi, readings: {tiberian: ʾānṓḵî}}, {surface: וָאֵחָבֵא, sense: hava, form: 'form:wayyiqtol-1cs', readings: {tiberian: wāʾēḥāḇēʾ}}]
