          tokens: [{surface: אֶת, sense: et, readings: {tiberian: ʾeṯ-}}, {surface: קֹלְךָ, sense: qol, morphs: [{surface: קֹלְ, kc: 'sense:qol'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: qōləḵā}},
            {surface: שָׁמַעְתִּי, sense: shama, form: 'form:qatal-1cs', readings: {tiberian: šāmáʿtî}}, {surface: בַּגָּן, sense: gan, morphs: [{surface: בַּ, kc: 'sense:be'}, {surface: גָּן, kc: 'sense:gan'}],
