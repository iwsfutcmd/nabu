# Biblical Hebrew (hbo), unit 6: Go forth (Genesis 12:1-2, 4).
# The imperative (to a man, a woman, several people), the imperfect "I will", the piel (bless, speak,
# make great), the preposition כְּ "as, like", and nouns in the construct state with suffixes.
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u06-go-forth
title:
  en: Go forth
cefr: A1
kcs:
- id: sense:avram
  gloss:
    en: Abram (later Abraham)
  forms:
    hbo-Hebr/tiberian: [אַבְרָם]
- id: sense:halakh
  gloss:
    en: to go, walk
  forms:
    hbo-Hebr/tiberian: [הָלַךְ]
- id: form:impv-ms
  gloss:
    en: 'imperative, to a man: do!'
- id: form:impv-fs
  gloss:
    en: 'imperative, to a woman: do!'
- id: form:impv-mp
  gloss:
    en: 'imperative, to several people: do!'
- id: sense:bayit
  gloss:
    en: house; household, family
  forms:
    hbo-Hebr/tiberian: [בַּיִת]
  image: {file: ../images/house.svg, license: CC0-1.0, provenance: {author: 'llm:claude@0d95656f8477', status: draft}, source: Drawn for Nabu (courses/images)}
  notes:
    en: 'Before another noun: בֵּית bêṯ, ''the house of''. בֵּית אָבִיךָ ''your father''s house'' is your family.'
- id: sense:av
  gloss:
    en: father
  forms:
    hbo-Hebr/tiberian: [אָב]
  notes:
    en: 'With suffixes אָבִי- ʾāḇî-: אָבִי ''my father'', אָבִיךָ ''your father''.'
- id: sense:moledet
  gloss:
    en: kindred, relatives; birthplace
  forms:
    hbo-Hebr/tiberian: [מוֹלֶדֶת]
- id: sense:hirah
  gloss:
    en: to show (hiphil of רָאָה)
  forms:
    hbo-Hebr/tiberian: [הֶרְאָה]
- id: form:yiqtol-1cs
  gloss:
    en: 'I will do: the imperfect (yiqtol), I'
- id: sense:goy
  gloss:
    en: nation, people
  forms:
    hbo-Hebr/tiberian: [גּוֹי]
- id: sense:gadol
  gloss:
    en: great, big
  forms:
    hbo-Hebr/tiberian: [גָּדוֹל]
- id: sense:shem
  gloss:
    en: name
  forms:
    hbo-Hebr/tiberian: [שֵׁם]
  image: {file: ../images/name-tag.svg, license: CC0-1.0, provenance: {author: 'llm:claude@949422768931', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:berakhah
  gloss:
    en: blessing
  forms:
    hbo-Hebr/tiberian: [בְּרָכָה]
- id: sense:barakh
  gloss:
    en: to bless (piel)
  forms:
    hbo-Hebr/tiberian: [בֵּרַךְ]
- id: sense:gadal
  gloss:
    en: to make great, magnify; to bring up (a child) (piel)
  forms:
    hbo-Hebr/tiberian: [גִּדֵּל]
- id: form:coh
  gloss:
    en: 'let me do, let us do: the cohortative (-â); ''I will …'' after a command'
- id: sense:ke
  gloss:
    en: like, as (written joined to the next word)
  forms:
    hbo-Hebr/tiberian: [כְּ]
  notes:
    en: 'כְּ kə- is written on its noun: כַּיּוֹם ''like the day''. כַּאֲשֶׁר kaʾăšer: ''as, just as''.'
- id: sense:dibber
  gloss:
    en: to speak (piel)
  forms:
    hbo-Hebr/tiberian: [דִּבֶּר]
nodes:
- {id: hbo.u06.go, kind: lesson, introduces: ['sense:avram', 'sense:halakh', 'form:impv-ms', 'form:impv-fs', 'form:impv-mp']}
- {id: hbo.u06.your-fathers-house, kind: lesson, introduces: ['sense:bayit', 'sense:av', 'sense:moledet']}
- {id: hbo.u06.i-will-show-you, kind: lesson, introduces: ['sense:hirah', 'form:yiqtol-1cs']}
- {id: hbo.u06.a-great-nation, kind: lesson, introduces: ['form:coh', 'sense:goy', 'sense:gadol', 'sense:shem', 'sense:berakhah', 'sense:barakh', 'sense:gadal']}
- {id: hbo.u06.as-he-said, kind: lesson, introduces: ['sense:ke', 'sense:dibber']}
- {id: hbo.u06.story, kind: story}
