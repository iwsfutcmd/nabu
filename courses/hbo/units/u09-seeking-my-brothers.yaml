# Biblical Hebrew (hbo), unit 9: I am looking for my brothers (Genesis 37:13-16).
# "They", greetings with שָׁלוֹם (to a man, a woman, several people), the directional -â (to Shechem,
# home), the imperfect "you will / are you …?", object suffixes on the narrative past, and the piel
# participle "seeking".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u09-seeking-my-brothers
title:
  en: Seeking my brothers
cefr: A2
kcs:
- id: sense:yisrael
  gloss:
