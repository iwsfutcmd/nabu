- id: sense:emeq
  gloss:
    en: valley
  forms:
    hbo-Hebr/tiberian: [עֵמֶק]
- id: sense:shekhem
  gloss:
    en: Shechem
  forms:
    hbo-Hebr/tiberian: [שְׁכֶם]
- id: form:dir
  gloss:
    en: 'toward: the directional -â (שְׁכֶמָה ''to Shechem'', הַבַּיְתָה ''home'')'
- id: sense:ish
  gloss:
    en: man; husband; each one
  forms:
    hbo-Hebr/tiberian: [אִישׁ]
- id: sense:matsa
  gloss:
    en: to find
  forms:
    hbo-Hebr/tiberian: [מָצָא]
- id: sense:taah
  gloss:
    en: to wander, go astray
  forms:
    hbo-Hebr/tiberian: [תָּעָה]
- id: sense:shaal
  gloss:
    en: to ask
  forms:
    hbo-Hebr/tiberian: [שָׁאַל]
- id: sense:biqqesh
  gloss:
    en: to seek, look for (piel)
  forms:
