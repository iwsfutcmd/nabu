  notes:
    en: 'רְאֵה אֶת־שְׁלוֹם אַחֶיךָ ''see the welfare of your brothers'': see how they are. שָׁלוֹם לְךָ ''peace to you'' is a greeting.'
- id: form:sfx-2mp
  gloss:
    en: 'your; you (said to several people: the suffix -ḵem)'
- id: sense:shalach
  gloss:
    en: to send
  forms:
    hbo-Hebr/tiberian: [שָׁלַח]
- id: sense:heshiv
  gloss:
    en: to bring back, return (hiphil of שׁוּב)
  forms:
    hbo-Hebr/tiberian: [הֵשִׁיב]
- id: sense:bo
  gloss:
    en: to come; to go in, enter
  forms:
