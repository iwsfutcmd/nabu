# Biblical Hebrew (hbo), unit 19: The LORD is my shepherd (Psalm 23:1-4).
# Poetry: the imperfect for what the LORD does again and again (he makes me lie down, he leads me), object
# suffixes "me" on verbs, the construct chain in images (green pastures, still waters, paths of righteousness),
# the polel (restore) and the hiphil (lead, make lie down).
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u19-my-shepherd
title:
  en: The LORD is my shepherd
cefr: A2
kcs:
- id: sense:mizmor
  gloss:
    en: psalm, song
  forms:
    hbo-Hebr/tiberian: [מִזְמוֹר]
- id: sense:hasar
  gloss:
    en: to lack, be in want
  forms:
    hbo-Hebr/tiberian: [חָסֵר]
- id: sense:naah
  gloss:
    en: 'pasture, meadow (only plural: נְאוֹת)'
  forms:
    hbo-Hebr/tiberian: [נָאָה]
- id: sense:deshe
  gloss:
    en: fresh grass, green growth
  forms:
    hbo-Hebr/tiberian: [דֶּשֶׁא]
- id: sense:hirbits
  gloss:
    en: to make lie down (hiphil of רָבַץ)
  forms:
    hbo-Hebr/tiberian: [הִרְבִּיץ]
- id: sense:menuchah
  gloss:
    en: 'rest, resting place (מֵי מְנֻחוֹת: still waters)'
  forms:
    hbo-Hebr/tiberian: [מְנוּחָה]
- id: sense:nihel
  gloss:
    en: to lead, guide (to water) (piel)
  forms:
    hbo-Hebr/tiberian: [נִהֵל]
- id: sense:shovev
  gloss:
    en: to restore, bring back (polel of שׁוּב)
  forms:
    hbo-Hebr/tiberian: [שׁוֹבֵב]
- id: sense:hinchah
  gloss:
    en: to lead, guide (hiphil of נָחָה)
  forms:
    hbo-Hebr/tiberian: [הִנְחָה]
- id: sense:magal
  gloss:
    en: track, path
  forms:
    hbo-Hebr/tiberian: [מַעְגָּל]
- id: sense:tsedeq
  gloss:
    en: righteousness; what is right, justice
  forms:
    hbo-Hebr/tiberian: [צֶדֶק]
- id: sense:gay
  gloss:
    en: valley
  forms:
    hbo-Hebr/tiberian: [גַּיְא]
- id: sense:tsalmawet
  gloss:
    en: deep darkness (traditionally 'the shadow of death')
  forms:
    hbo-Hebr/tiberian: [צַלְמָוֶת]
- id: sense:shevet
  gloss:
    en: rod; staff; tribe
  forms:
    hbo-Hebr/tiberian: [שֵׁבֶט]
- id: sense:mishenet
  gloss:
    en: staff (to lean on)
  forms:
    hbo-Hebr/tiberian: [מִשְׁעֶנֶת]
- id: sense:nicham
  gloss:
    en: to comfort (piel)
  forms:
    hbo-Hebr/tiberian: [נִחַם]
nodes:
- {id: hbo.u19.my-shepherd, kind: lesson, introduces: ['sense:mizmor', 'sense:hasar']}
