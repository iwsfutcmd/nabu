- id: form:weqatal-3cp
  gloss:
    en: 'and they shall: the converted perfect (weqatal), they'
- id: sense:shinnen
  gloss:
    en: to repeat, say again and again (piel)
  forms:
    hbo-Hebr/tiberian: [שִׁנֵּן]
- id: sense:yashav
  gloss:
    en: to sit; to dwell, live
  forms:
