- id: hbo.story.hear-o-israel
  node: hbo.u12.story
  title:
    en: Hear, O Israel (Deuteronomy 6:4–7)
  characters:
  - {id: moses, speaker: m, name: {hbo-Hebr/tiberian: מֹשֶׁה}}
  steps:
  - line:
      speaker: moses
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד׃
          tokens: [{surface: שְׁמַע, sense: shama, form: 'form:impv-ms', readings: {tiberian: šəmaʿ}}, {surface: יִשְׂרָאֵל, sense: yisrael, readings: {tiberian: yiśrāʾēl}}, {surface: יְהוָה, sense: yhwh,
              readings: {tiberian: ʾăḏōnāy}}, {surface: אֱלֹהֵינוּ, sense: elohim, morphs: [{surface: אֱלֹהֵי, kc: 'sense:elohim'}, {surface: נוּ, kc: 'form:sfx-1cp'}], readings: {tiberian: ʾĕlōhếnû}},
            {surface: יְהוָה, sense: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֶחָד, sense: ehad, readings: {tiberian: ʾeḥāḏ}}]
      translations:
        en: '“Hear, O Israel: the LORD our God, the LORD is one.'
  - line:
      speaker: moses
      ask: complete
      gap: sense:nefesh
      distractors: ['sense:levav', 'sense:derekh']
      forms:
        hbo-Hebr/tiberian:
          text: וְאָהַבְתָּ אֵת יְהוָה אֱלֹהֶיךָ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶךָ׃
          tokens: [{surface: וְאָהַבְתָּ, sense: ahav, form: 'form:weqatal-2ms', readings: {tiberian: wəʾāhaḇtā}}, {surface: אֵת, sense: et, readings: {tiberian: ʾēṯ}}, {surface: יְהוָה, sense: yhwh, readings: {
                tiberian: ʾăḏōnāy}}, {surface: אֱלֹהֶיךָ, sense: elohim, morphs: [{surface: אֱלֹהֶי, kc: 'sense:elohim'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ʾĕlōhếḵā}}, {surface: בְּכָל,
              sense: kol, form: 'form:cstr', morphs: [{surface: בְּ, kc: 'sense:be'}, {surface: כָל, kc: 'sense:kol'}], readings: {tiberian: bəḵol-}}, {surface: לְבָבְךָ, sense: levav, morphs: [{surface: לְבָבְ,
                  kc: 'sense:levav'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ləḇāḇəḵā}}, {surface: וּבְכָל, sense: kol, form: 'form:cstr', morphs: [{surface: וּ, kc: 'sense:we'}, {surface: בְ,
                  kc: 'sense:be'}, {surface: כָל, kc: 'sense:kol'}], readings: {tiberian: ûḇəḵol-}}, {surface: נַפְשְׁךָ, sense: nefesh, morphs: [{surface: נַפְשְׁ, kc: 'sense:nefesh'}, {surface: ךָ, kc: 'form:sfx-2ms'}],
              readings: {tiberian: nap̄šəḵā}}, {surface: וּבְכָל, sense: kol, form: 'form:cstr', morphs: [{surface: וּ, kc: 'sense:we'}, {surface: בְ, kc: 'sense:be'}, {surface: כָל, kc: 'sense:kol'}],
              readings: {tiberian: ûḇəḵol-}}, {surface: מְאֹדֶךָ, sense: meod, morphs: [{surface: מְאֹדֶ, kc: 'sense:meod'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: məʾōḏéḵā}}]
      translations:
        en: And you shall love the LORD your God with all your heart and with all your soul and with all your strength.
  - choose:
      prompt:
        en: With what shall Israel love the LORD?
      options: [{en: 'with all their heart, soul and strength'}, {en: with gold and silver}, {en: with songs only}]
      answer: 0
  - line:
      speaker: moses
      forms:
        hbo-Hebr/tiberian:
          text: וְהָיוּ הַדְּבָרִים הָאֵלֶּה אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם עַל־לְבָבֶךָ׃
          tokens: [{surface: וְהָיוּ, sense: hayah, form: 'form:weqatal-3cp', readings: {tiberian: wəhāyû}}, {surface: הַדְּבָרִים, sense: davar, form: 'form:pl', morphs: [{surface: הַ, kc: 'sense:ha'},
                {surface: דְּבָרִים, kc: 'sense:davar'}], readings: {tiberian: haddəḇārîm}}, {surface: הָאֵלֶּה, sense: elleh, morphs: [{surface: הָ, kc: 'sense:ha'}, {surface: אֵלֶּה, kc: 'sense:elleh'}],
              readings: {tiberian: hāʾḗlleh}}, {surface: אֲשֶׁר, sense: asher, readings: {tiberian: ʾăšer}}, {surface: אָנֹכִי, sense: anokhi, readings: {tiberian: ʾānōḵî}}, {surface: מְצַוְּךָ, sense: tsivvah,
              form: 'form:ptc-ms', morphs: [{surface: מְצַוְּ, kc: 'sense:tsivvah'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: məṣawwəḵā}}, {surface: הַיּוֹם, sense: yom, morphs: [{surface: הַ,
                  kc: 'sense:ha'}, {surface: יּוֹם, kc: 'sense:yom'}], readings: {tiberian: hayyôm}}, {surface: עַל, sense: al, readings: {tiberian: ʿal-}}, {surface: לְבָבֶךָ, sense: levav, morphs: [{
                  surface: לְבָבֶ, kc: 'sense:levav'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ləḇāḇéḵā}}]
      translations:
        en: And these words that I command you today shall be on your heart.
  - line:
      speaker: moses
      forms:
        hbo-Hebr/tiberian:
          text: וְשִׁנַּנְתָּם לְבָנֶיךָ וְדִבַּרְתָּ בָּם
          tokens: [{surface: וְשִׁנַּנְתָּם, sense: shinnen, form: 'form:weqatal-2ms', morphs: [{surface: וְשִׁנַּנְתָּ, kc: 'sense:shinnen'}, {surface: ם, kc: 'form:sfx-3mp'}], readings: {tiberian: wəšinnantām}},
            {surface: לְבָנֶיךָ, sense: ben, form: 'form:pl', morphs: [{surface: לְ, kc: 'sense:le'}, {surface: בָנֶי, kc: 'sense:ben'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: ləḇānếḵā}},
            {surface: וְדִבַּרְתָּ, sense: dibber, form: 'form:weqatal-2ms', readings: {tiberian: wəḏibbartā}}, {surface: בָּם, sense: be, morphs: [{surface: בָּ, kc: 'sense:be'}, {surface: ם, kc: 'form:sfx-3mp'}],
              readings: {tiberian: bām}}]
      translations:
        en: You shall teach them diligently to your children and talk of them
  - line:
      speaker: moses
      ask: complete
      gap: sense:derekh
      distractors: ['sense:sadeh', 'sense:har']
      forms:
        hbo-Hebr/tiberian:
          text: בְּשִׁבְתְּךָ בְּבֵיתֶךָ וּבְלֶכְתְּךָ בַדֶּרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶךָ׃
          tokens: [{surface: בְּשִׁבְתְּךָ, sense: yashav, form: 'form:inf', morphs: [{surface: בְּ, kc: 'sense:be'}, {surface: שִׁבְתְּ, kc: 'sense:yashav'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {
                tiberian: bəšiḇtəḵā}}, {surface: בְּבֵיתֶךָ, sense: bayit, morphs: [{surface: בְּ, kc: 'sense:be'}, {surface: בֵיתֶ, kc: 'sense:bayit'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {tiberian: bəḇêṯéḵā}},
            {surface: וּבְלֶכְתְּךָ, sense: halakh, form: 'form:inf', morphs: [{surface: וּ, kc: 'sense:we'}, {surface: בְ, kc: 'sense:be'}, {surface: לֶכְתְּ, kc: 'sense:halakh'}, {surface: ךָ, kc: 'form:sfx-2ms'}],
              readings: {tiberian: ûḇəleḵtəḵā}}, {surface: בַדֶּרֶךְ, sense: derekh, morphs: [{surface: בַ, kc: 'sense:be'}, {surface: דֶּרֶךְ, kc: 'sense:derekh'}], readings: {tiberian: ḇaddéreḵ}}, {surface: וּבְשָׁכְבְּךָ,
              sense: shakhav, form: 'form:inf', morphs: [{surface: וּ, kc: 'sense:we'}, {surface: בְ, kc: 'sense:be'}, {surface: שָׁכְבְּ, kc: 'sense:shakhav'}, {surface: ךָ, kc: 'form:sfx-2ms'}], readings: {
                tiberian: ûḇəšoḵbəḵā}}, {surface: וּבְקוּמֶךָ, sense: qum, form: 'form:inf', morphs: [{surface: וּ, kc: 'sense:we'}, {surface: בְ, kc: 'sense:be'}, {surface: קוּמֶ, kc: 'sense:qum'}, {surface: ךָ,
                  kc: 'form:sfx-2ms'}], readings: {tiberian: ûḇəqûméḵā}}]
      translations:
        en: when you sit in your house and when you walk by the way, when you lie down and when you rise.”
  - choose:
      prompt:
        en: To whom are these words to be taught?
      options: [{en: to your children}, {en: to the king}, {en: to the priests only}]
      answer: 0
