- id: sense:derekh
  gloss:
    en: way, road; journey
  forms:
    hbo-Hebr/tiberian: [דֶּרֶךְ]
- id: sense:shakhav
  gloss:
    en: to lie down
  forms:
    hbo-Hebr/tiberian: [שָׁכַב]
