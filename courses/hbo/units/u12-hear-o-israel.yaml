stories:
- id: hbo.story.hear-o-israel
  node: hbo.u12.story
  title:
    en: Hear, O Israel (Deuteronomy 6:4–7)
  characters:
  - id: moses
    speaker: m
    name:
      hbo-Hebr/tiberian: מֹשֶׁה
  steps:
  - line:
      speaker: moses
      ask: arrange
      forms:
        hbo-Hebr/tiberian:
          text: שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד׃
          tokens: [{surface: שְׁמַע, lexeme: shama, feats: {Gender: Masc, Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, readings: {tiberian: šəmaʿ}}, {surface: יִשְׂרָאֵל, lexeme: yisrael, readings: {tiberian: yiśrāʾēl}}, {surface: יְהוָה, lexeme: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֱלֹהֵינוּ, lexemes: [{lexeme: elohim, surface: אֱלֹהֵי, base: true, feats: {Number: Sing}}, {lexeme: sfx-1cp, surface: נוּ}], readings: {tiberian: ʾĕlōhếnû}}, {surface: יְהוָה, lexeme: yhwh, readings: {tiberian: ʾăḏōnāy}}, {surface: אֶחָד, lexeme: ehad, readings: {tiberian: ʾeḥāḏ}}]
      translations:
        en: '“Hear, O Israel: the LORD our God, the LORD is one.'
  - line:
      speaker: moses
      ask: complete
      gap: lexeme:nefesh
      distractors:
      - lexeme:erets
      - lexeme:em
      forms:
        hbo-Hebr/tiberian:
          text: וְאָהַבְתָּ אֵת יְהוָה אֱלֹהֶיךָ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶךָ׃
          tokens: [{surface: וְאָהַבְתָּ, lexeme: ahav, feats: {Gender: Masc, Mood: Ind, Number: Sing, Person: '2', Tense: Fut, VerbForm: Fin}, readings: {tiberian: wəʾāhaḇtā}}, {surface: אֵת, lexeme: et, n: 2, head: 3, rel: case, readings: {tiberian: ʾēṯ}}, {surface: יְהוָה, lexeme: yhwh, n: 3, readings: {tiberian: ʾăḏōnāy}}, {surface: אֱלֹהֶיךָ, lexemes: [{lexeme: elohim, surface: אֱלֹהֶי, base: true, feats: {Number: Sing}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: ʾĕlōhếḵā}}, {surface: בְּכָל, lexemes: [{lexeme: be, surface: בְּ, n: 6, head: 7, rel: case}, {lexeme: kol, surface: כָל, base: true, feats: {Definite: Cons, Number: Sing}, n: 7}], readings: {tiberian: bəḵol-}}, {surface: לְבָבְךָ, lexemes: [{lexeme: levav, surface: לְבָבְ, base: true, feats: {Number: Sing}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: ləḇāḇəḵā}}, {surface: וּבְכָל, lexemes: [{lexeme: we, surface: וּ}, {lexeme: be, surface: בְ, n: 11, head: 12, rel: case}, {lexeme: kol, surface: כָל, base: true, feats: {Definite: Cons, Number: Sing}, n: 12}], readings: {tiberian: ûḇəḵol-}}, {surface: נַפְשְׁךָ, lexemes: [{lexeme: nefesh, surface: נַפְשְׁ, base: true, feats: {Number: Sing}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: nap̄šəḵā}}, {surface: וּבְכָל, lexemes: [{lexeme: we, surface: וּ}, {lexeme: be, surface: בְ, n: 16, head: 17, rel: case}, {lexeme: kol, surface: כָל, base: true, feats: {Definite: Cons, Number: Sing}, n: 17}], readings: {tiberian: ûḇəḵol-}}, {surface: מְאֹדֶךָ, lexemes: [{lexeme: meod, surface: מְאֹדֶ, base: true}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: məʾōḏéḵā}}]
      translations:
        en: And you shall love the LORD your God with all your heart and with all your soul and with all your strength.
  - choose:
      prompt:
        en: With what shall Israel love the LORD?
      options:
      - en: with all their heart, soul and strength
      - en: with gold and silver
      - en: with songs only
      answer: 0
  - line:
      speaker: moses
      ask: complete
      gap: lexeme:davar
      distractors:
      - lexeme:har
      - lexeme:gamal
      forms:
        hbo-Hebr/tiberian:
