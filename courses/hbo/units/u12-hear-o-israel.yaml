          tokens: [{surface: וְהָיוּ, lexeme: hayah, feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Fut, VerbForm: Fin}, readings: {tiberian: wəhāyû}}, {surface: הַדְּבָרִים, lexemes: [{lexeme: ha, surface: הַ, n: 2, head: 3, rel: det}, {lexeme: davar, surface: דְּבָרִים, base: true, feats: {Number: Plur}, n: 3}], readings: {tiberian: haddəḇārîm}}, {surface: הָאֵלֶּה, lexemes: [{lexeme: ha, surface: הָ}, {lexeme: elleh, surface: אֵלֶּה, base: true, feats: {Number: Plur}}], readings: {tiberian: hāʾḗlleh}}, {surface: אֲשֶׁר, lexeme: asher, readings: {tiberian: ʾăšer}}, {surface: אָנֹכִי, lexeme: anokhi, readings: {tiberian: ʾānōḵî}}, {surface: מְצַוְּךָ, lexemes: [{lexeme: tsivvah, surface: מְצַוְּ, base: true, feats: {Gender: Masc, Number: Sing, VerbForm: Part}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: məṣawwəḵā}}, {surface: הַיּוֹם, lexemes: [{lexeme: ha, surface: הַ, n: 10, head: 11, rel: det}, {lexeme: yom, surface: יּוֹם, base: true, feats: {Number: Sing}, n: 11}], readings: {tiberian: hayyôm}}, {surface: עַל, lexeme: al, readings: {tiberian: ʿal-}}, {surface: לְבָבֶךָ, lexemes: [{lexeme: levav, surface: לְבָבֶ, base: true, feats: {Number: Sing}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: ləḇāḇéḵā}}]
      translations:
        en: And these words that I command you today shall be on your heart.
  - line:
      speaker: moses
      forms:
        hbo-Hebr/tiberian:
          text: וְשִׁנַּנְתָּם לְבָנֶיךָ וְדִבַּרְתָּ בָּם
          tokens: [{surface: וְשִׁנַּנְתָּם, lexemes: [{lexeme: shinnen, surface: וְשִׁנַּנְתָּ, base: true, feats: {Gender: Masc, Mood: Ind, Number: Sing, Person: '2', Tense: Fut, VerbForm: Fin}}, {lexeme: sfx-3mp, surface: ם}], readings: {tiberian: wəšinnantām}}, {surface: לְבָנֶיךָ, lexemes: [{lexeme: le, surface: לְ, n: 3, head: 4, rel: case}, {lexeme: ben, surface: בָנֶי, base: true, feats: {Number: Plur}, n: 4}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: ləḇānếḵā}}, {surface: וְדִבַּרְתָּ, lexeme: dibber, feats: {Gender: Masc, Mood: Ind, Number: Sing, Person: '2', Tense: Fut, VerbForm: Fin}, readings: {tiberian: wəḏibbartā}}, {surface: בָּם, lexemes: [{lexeme: be, surface: בָּ, base: true, n: 7, head: 8, rel: case}, {lexeme: sfx-3mp, surface: ם, n: 8}], readings: {tiberian: bām}}]
      translations:
        en: You shall teach them diligently to your children and talk of them
  - line:
      speaker: moses
      forms:
        hbo-Hebr/tiberian:
          text: בְּשִׁבְתְּךָ בְּבֵיתֶךָ וּבְלֶכְתְּךָ בַדֶּרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶךָ׃
          tokens: [{surface: בְּשִׁבְתְּךָ, lexemes: [{lexeme: be, surface: בְּ}, {lexeme: yashav, surface: שִׁבְתְּ, base: true, feats: {VerbForm: Inf}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: bəšiḇtəḵā}}, {surface: בְּבֵיתֶךָ, lexemes: [{lexeme: be, surface: בְּ, n: 4, head: 5, rel: case}, {lexeme: bayit, surface: בֵיתֶ, base: true, feats: {Number: Sing}, n: 5}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: bəḇêṯéḵā}}, {surface: וּבְלֶכְתְּךָ, lexemes: [{lexeme: we, surface: וּ}, {lexeme: be, surface: בְ}, {lexeme: halakh, surface: לֶכְתְּ, base: true, feats: {VerbForm: Inf}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: ûḇəleḵtəḵā}}, {surface: בַדֶּרֶךְ, lexemes: [{lexeme: be, surface: בַ, n: 11, head: 12, rel: case}, {lexeme: derekh, surface: דֶּרֶךְ, base: true, feats: {Number: Sing}, n: 12}], readings: {tiberian: ḇaddéreḵ}}, {surface: וּבְשָׁכְבְּךָ, lexemes: [{lexeme: we, surface: וּ}, {lexeme: be, surface: בְ}, {lexeme: shakhav, surface: שָׁכְבְּ, base: true, feats: {VerbForm: Inf}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: ûḇəšoḵbəḵā}}, {surface: וּבְקוּמֶךָ, lexemes: [{lexeme: we, surface: וּ}, {lexeme: be, surface: בְ}, {lexeme: qum, surface: קוּמֶ, base: true, feats: {VerbForm: Inf}}, {lexeme: sfx-2ms, surface: ךָ}], readings: {tiberian: ûḇəqûméḵā}}]
      translations:
        en: when you sit in your house and when you walk by the way, when you lie down and when you rise.”
  - choose:
      prompt:
