# Biblical Hebrew (hbo), unit 12: Hear, O Israel (Deuteronomy 6:4-7).
# "Our", the converted perfect (and you shall love, and they shall be, and you shall teach), infinitives with
# suffixes for "when you …" (בְּשִׁבְתְּךָ "when you sit"), heart and soul, "very".
# The passage is the Westminster Leningrad Codex (public domain), without its accents; the rest was drafted
# by an LLM (provenance llm:…, status draft) and awaits a reviewer.
id: u12-hear-o-israel
title:
  en: Hear, O Israel
cefr: A2
kcs:
- id: form:sfx-1cp
  gloss:
    en: our; us (the suffix -ēnû, -nû)
- id: sense:levav
  gloss:
    en: heart, mind (= לֵב)
  forms:
    hbo-Hebr/tiberian: [לֵבָב]
- id: sense:nefesh
  gloss:
    en: soul, life; self; a living being
  forms:
