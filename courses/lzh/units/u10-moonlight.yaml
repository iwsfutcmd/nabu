sentences:
- id: s.10.1
  node: lzh.u10.night
  forms:
    lzh-Hant/standard:
      text: 月明。
      tokens: [{surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}, {surface: 明, sense: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}]
      reverse: 月明
  translations:
    en: |-
      The moon is bright.
      The moon (shines|is shining|is clear).
- id: s.10.2
  node: lzh.u10.night
  forms:
    lzh-Hant/standard:
      text: 月光明。
      tokens: [{surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}, {surface: 光, sense: 光, readings: {pinyin: guāng, jyutping: gwong1, baxter: kwang}}, {surface: 明, sense: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}]
      reverse: 月光明
  translations:
    en: |-
      The moonlight is bright.
      The moon's light is bright.
      The moonlight is (clear|shining).
- id: s.10.3
  node: lzh.u10.night
  forms:
    lzh-Hant/standard:
      text: 月出。
      tokens: [{surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}, {surface: 出, sense: 出, readings: {pinyin: chū, jyutping: ceot1, baxter: tsyhwit}}]
      reverse: 月出
  translations:
    en: |-
      The moon rises.
      The moon (comes out|has risen|is rising|came out|rose).
- id: s.10.4
  node: lzh.u10.night
  forms:
    lzh-Hant/standard:
      text: 夜，月明。
      tokens: [{surface: 夜, sense: 夜, readings: {pinyin: yè, jyutping: je6, baxter: yaeH}}, {surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}, {surface: 明, sense: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}]
      reverse: 夜月明
  translations:
    en: |-
      (At night|In the night|Tonight), the moon (is bright|shines|is shining).
      The moon is bright (at night|in the night|tonight).
      The night is moonlit.
- id: s.10.5
  node: lzh.u10.night
  forms:
    lzh-Hant/standard:
      text: 道大，天大，地大，王亦大。
      tokens: [{surface: 道, sense: 道, readings: {pinyin: dào, jyutping: dou6, baxter: dawX}}, {surface: 大, sense: 大, readings: {pinyin: dà, jyutping: daai6, baxter: dajH}}, {surface: 天, sense: 天, readings: {pinyin: tiān, jyutping: tin1, baxter: then}}, {surface: 大, sense: 大, readings: {pinyin: dà, jyutping: daai6, baxter: dajH}}, {surface: 地, sense: 地, readings: {pinyin: dì, jyutping: dei6, baxter: dijH}}, {surface: 大, sense: 大, readings: {pinyin: dà, jyutping: daai6, baxter: dajH}}, {surface: 王, sense: 王, readings: {pinyin: wáng, jyutping: wong4, baxter: hjwang}}, {surface: 亦, sense: 亦, readings: {pinyin: yì, jyutping: jik6, baxter: yek}}, {surface: 大, sense: 大, readings: {pinyin: dà, jyutping: daai6, baxter: dajH}}]
      reverse: 道大天大地大王亦大
  translations:
    en: |-
      The Way is great, Heaven is great, Earth is great, and the king (is also|too is|is) great.
      The Dao is great, Heaven is great, Earth is great, and the king (is also|too is|is) great.
- id: s.10.6
  node: lzh.u10.night
  forms:
    lzh-Hant/standard:
      text: 地上有霜。
      tokens: [{surface: 地, sense: 地, readings: {pinyin: dì, jyutping: dei6, baxter: dijH}}, {surface: 上, sense: 上, readings: {pinyin: shàng, jyutping: soeng6, baxter: dzyangH}}, {surface: 有, sense: 有, readings: {pinyin: yǒu, jyutping: jau5, baxter: hjuwX}}, {surface: 霜, sense: 霜, readings: {pinyin: shuāng, jyutping: soeng1, baxter: srjang}}]
      reverse: 地上有霜
  translations:
    en: |-
      There is frost on the ground.
      The ground is (covered with|white with) frost.
      On the ground there is frost.
- id: s.10.7
  node: lzh.u10.bed
  forms:
    lzh-Hant/standard:
      text: 此，吾床也。
      tokens: [{surface: 此, sense: 此, readings: {pinyin: cǐ, jyutping: ci2, baxter: tshjeX}}, {surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 床, sense: 床, readings: {pinyin: chuáng, jyutping: cong4, baxter: dzrjang}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: 此(吾|我)床也
  translations:
    en: |-
      This is my bed.
      This bed is mine.
      That is my bed.
- id: s.10.8
  node: lzh.u10.bed
  forms:
    lzh-Hant/standard:
      text: 床前有月光。
      tokens: [{surface: 床, sense: 床, readings: {pinyin: chuáng, jyutping: cong4, baxter: dzrjang}}, {surface: 前, sense: 前, readings: {pinyin: qián, jyutping: cin4, baxter: dzen}}, {surface: 有, sense: 有, readings: {pinyin: yǒu, jyutping: jau5, baxter: hjuwX}}, {surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}, {surface: 光, sense: 光, readings: {pinyin: guāng, jyutping: gwong1, baxter: kwang}}]
      reverse: 床前有月光
  translations:
    en: |-
      There is moonlight in front of the bed.
      (In front of|Before) the bed (there is|is) moonlight.
      Moonlight (lies|falls) (in front of|before) the bed.
- id: s.10.9
  node: lzh.u10.bed
  forms:
    lzh-Hant/standard:
      text: 此是霜。
      tokens: [{surface: 此, sense: 此, readings: {pinyin: cǐ, jyutping: ci2, baxter: tshjeX}}, {surface: 是, sense: 是.cop, readings: {pinyin: shì, jyutping: si6, baxter: dzyeX}}, {surface: 霜, sense: 霜, readings: {pinyin: shuāng, jyutping: soeng1, baxter: srjang}}]
      reverse: |-
        此是霜
        此霜也
  translations:
    en: |-
      This is frost.
      That is frost.
      It is frost.
      (This|That|It)'s frost.
- id: s.10.10
  node: lzh.u10.bed
  forms:
    lzh-Hant/standard:
      text: 吾疑之。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 疑, sense: 疑, readings: {pinyin: yí, jyutping: ji4, baxter: ngi}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: (吾|我)疑之
  translations:
    en: |-
      I doubt it.
      I (suspect|wonder about|have doubts about) it.
      I am doubtful.
- id: s.10.11
  node: lzh.u10.bed
  forms:
    lzh-Hant/standard:
      text: 疑是地上霜。
      tokens: [{surface: 疑, sense: 疑, readings: {pinyin: yí, jyutping: ji4, baxter: ngi}}, {surface: 是, sense: 是.cop, readings: {pinyin: shì, jyutping: si6, baxter: dzyeX}}, {surface: 地, sense: 地, readings: {pinyin: dì, jyutping: dei6, baxter: dijH}}, {surface: 上, sense: 上, readings: {pinyin: shàng, jyutping: soeng6, baxter: dzyangH}}, {surface: 霜, sense: 霜, readings: {pinyin: shuāng, jyutping: soeng1, baxter: srjang}}]
      reverse: 疑是地上霜
  translations:
    en: |-
      I took it for frost on the ground.
      I (thought|wondered if) it was frost on the ground.
      It (looked|seemed) like frost on the ground.
      I took it for frost upon the ground.
- id: s.10.12
  node: lzh.u10.bed
  forms:
    lzh-Hant/standard:
      text: 床前明月光。
      tokens: [{surface: 床, sense: 床, readings: {pinyin: chuáng, jyutping: cong4, baxter: dzrjang}}, {surface: 前, sense: 前, readings: {pinyin: qián, jyutping: cin4, baxter: dzen}}, {surface: 明, sense: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}, {surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}, {surface: 光, sense: 光, readings: {pinyin: guāng, jyutping: gwong1, baxter: kwang}}]
      reverse: 床前明月光
  translations:
    en: |-
      Before my bed, the bright moonlight.
      (Before|In front of) (my|the) bed is (bright moonlight|the light of the bright moon).
      (In front of my bed|Before the bed|In front of the bed), the bright moonlight.
- id: s.10.13
  node: lzh.u10.bed
  forms:
    lzh-Hant/standard:
      text: 床前明月光，疑是地上霜。
      tokens: [{surface: 床, sense: 床, readings: {pinyin: chuáng, jyutping: cong4, baxter: dzrjang}}, {surface: 前, sense: 前, readings: {pinyin: qián, jyutping: cin4, baxter: dzen}}, {surface: 明, sense: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}, {surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}, {surface: 光, sense: 光, readings: {pinyin: guāng, jyutping: gwong1, baxter: kwang}}, {surface: 疑, sense: 疑, readings: {pinyin: yí, jyutping: ji4, baxter: ngi}}, {surface: 是, sense: 是.cop, readings: {pinyin: shì, jyutping: si6, baxter: dzyeX}}, {surface: 地, sense: 地, readings: {pinyin: dì, jyutping: dei6, baxter: dijH}}, {surface: 上, sense: 上, readings: {pinyin: shàng, jyutping: soeng6, baxter: dzyangH}}, {surface: 霜, sense: 霜, readings: {pinyin: shuāng, jyutping: soeng1, baxter: srjang}}]
      reverse: 床前明月光疑是地上霜
  translations:
    en: |-
      Before my bed, the bright moonlight: I took it for frost on the ground.
      (Before|In front of) (my|the) bed (is|was) bright moonlight; I (thought|wondered if) it was frost on the ground.
      The moonlight before my bed (looked|seemed) like frost on the ground.
- id: s.10.14
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 舉之。
      tokens: [{surface: 舉, sense: 舉, readings: {pinyin: jǔ, jyutping: geoi2, baxter: kjoX}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: 舉之
  translations:
    en: |-
      (Lift|Raise) it.
      Lift it up.
      (He|She) (lifted|raised) it.
- id: s.10.15
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 舉頭。
      tokens: [{surface: 舉, sense: 舉, readings: {pinyin: jǔ, jyutping: geoi2, baxter: kjoX}}, {surface: 頭, sense: 頭, readings: {pinyin: tóu, jyutping: tau4, baxter: duw}}]
      reverse: 舉頭
  translations:
    en: |-
      (He|She) (raised|raises|lifted|lifts) (his|her) head.
      I (raise|raised|lift|lifted) my head.
      (Raise|Lift) your head.
- id: s.10.16
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 望山。
      tokens: [{surface: 望, sense: 望, readings: {pinyin: wàng, jyutping: mong6, baxter: mjangH}}, {surface: 山, sense: 山, readings: {pinyin: shān, jyutping: saan1, baxter: srean}}]
      reverse: 望山
  translations:
    en: |-
      (Gaze|Look) (at|toward|towards) the (mountains|mountain).
      (He|She) (gazed|gazes|looked|looks) (at|toward|towards) the (mountains|mountain).
- id: s.10.17
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 舉頭望明月。
      tokens: [{surface: 舉, sense: 舉, readings: {pinyin: jǔ, jyutping: geoi2, baxter: kjoX}}, {surface: 頭, sense: 頭, readings: {pinyin: tóu, jyutping: tau4, baxter: duw}}, {surface: 望, sense: 望, readings: {pinyin: wàng, jyutping: mong6, baxter: mjangH}}, {surface: 明, sense: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}, {surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}]
      reverse: 舉頭望明月
  translations:
    en: |-
      I (raise|raised|lift|lifted) my head and (gaze|gazed|look|looked) at the bright moon.
      (He|She) (raises|raised|lifts|lifted) (his|her) head and (gazes|gazed|looks|looked) at the bright moon.
      Raising my head, I (gaze|look) at the bright moon.
- id: s.10.18
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 低頭。
      tokens: [{surface: 低, sense: 低, readings: {pinyin: dī, jyutping: dai1, baxter: tej}}, {surface: 頭, sense: 頭, readings: {pinyin: tóu, jyutping: tau4, baxter: duw}}]
      reverse: 低頭
  translations:
    en: |-
      (He|She) (lowered|lowers|bowed|bows) (his|her) head.
      I (lower|lowered|bow|bowed) my head.
      (Lower|Bow) your head.
- id: s.10.19
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 思故鄉。
      tokens: [{surface: 思, sense: 思, readings: {pinyin: sī, jyutping: si1, baxter: si}}, {surface: 故鄉, sense: 故鄉, readings: {pinyin: gù xiāng, jyutping: gu3 hoeng1, baxter: kuH xjang}}]
      reverse: 思故鄉
  translations:
    en: |-
      I think of (home|my home town|my hometown|my old home|my home village).
      I (miss|long for) (home|my home town|my hometown|my old home|my home village).
      (He|She) (thinks of|misses|longs for) (home|his home town|her home town|his hometown|her hometown).
- id: s.10.20
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 低頭思故鄉。
      tokens: [{surface: 低, sense: 低, readings: {pinyin: dī, jyutping: dai1, baxter: tej}}, {surface: 頭, sense: 頭, readings: {pinyin: tóu, jyutping: tau4, baxter: duw}}, {surface: 思, sense: 思, readings: {pinyin: sī, jyutping: si1, baxter: si}}, {surface: 故鄉, sense: 故鄉, readings: {pinyin: gù xiāng, jyutping: gu3 hoeng1, baxter: kuH xjang}}]
      reverse: 低頭思故鄉
  translations:
    en: |-
      I (lower|lowered|bow|bowed) my head and (think|thought) of (home|my home town|my hometown|my old home).
      Lowering my head, I (think|thought) of (home|my home town|my hometown|my old home).
      (He|She) (lowers|lowered|bows|bowed) (his|her) head and (thinks|thought) of home.
- id: s.10.21
  node: lzh.u10.looking
  forms:
    lzh-Hant/standard:
      text: 吾故鄉遠矣。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 故鄉, sense: 故鄉, readings: {pinyin: gù xiāng, jyutping: gu3 hoeng1, baxter: kuH xjang}}, {surface: 遠, sense: 遠, readings: {pinyin: yuǎn, jyutping: jyun5, baxter: hjwonX}}, {surface: 矣, sense: 矣, readings: {pinyin: yǐ, jyutping: ji5, baxter: hiX}}]
      reverse: (吾|我)故鄉遠矣
  translations:
    en: |-
      My (home town|hometown|home|old home) is far away.
      My (home town|hometown|home|old home) is (so|very) far( away|).
      My (home town|hometown|home|old home) is far away now.
- id: s.10.22
  node: lzh.u10.looking
  forms:
