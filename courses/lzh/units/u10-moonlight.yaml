      translations: {en: 'Before my bed, the bright moonlight —'}
  - line:
      speaker: li-bai
      ask: complete
      gap: sense:霜
      distractors: ['sense:花', 'sense:雨']
      forms:
        lzh-Hant/standard:
          text: 疑是地上霜。
          tokens: [{surface: 疑, sense: 疑, readings: {pinyin: yí, jyutping: ji4, baxter: ngi}}, {surface: 是, sense: 是.cop, readings: {pinyin: shì, jyutping: si6, baxter: dzyeX}}, {surface: 地, sense: 地, readings: {pinyin: dì, jyutping: dei6, baxter: dijH}}, {surface: 上, sense: 上, readings: {pinyin: shàng, jyutping: soeng6, baxter: dzyangH}}, {surface: 霜, sense: 霜, readings: {pinyin: shuāng, jyutping: soeng1, baxter: srjang}}]
      translations: {en: I took it for frost upon the ground.}
  - line:
      speaker: li-bai
      forms:
        lzh-Hant/standard:
          text: 舉頭望明月，
          tokens: [{surface: 舉, sense: 舉, readings: {pinyin: jǔ, jyutping: geoi2, baxter: kjoX}}, {surface: 頭, sense: 頭, readings: {pinyin: tóu, jyutping: tau4, baxter: duw}}, {surface: 望, sense: 望, readings: {pinyin: wàng, jyutping: mong6, baxter: mjangH}}, {surface: 明, sense: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}, {surface: 月, sense: 月, readings: {pinyin: yuè, jyutping: jyut6, baxter: ngjwot}}]
      translations: {en: 'I raise my head and gaze at the bright moon,'}
  - line:
      speaker: li-bai
      ask: arrange
      forms:
        lzh-Hant/standard:
          text: 低頭思故鄉。
          tokens: [{surface: 低, sense: 低, readings: {pinyin: dī, jyutping: dai1, baxter: tej}}, {surface: 頭, sense: 頭, readings: {pinyin: tóu, jyutping: tau4, baxter: duw}}, {surface: 思, sense: 思, readings: {pinyin: sī, jyutping: si1, baxter: si}}, {surface: 故鄉, sense: 故鄉, readings: {pinyin: gù xiāng, jyutping: gu3 hoeng1, baxter: kuH xjang}}]
      translations: {en: I lower my head and think of home.}
  - choose:
      prompt:
        en: What did the poet take the moonlight for?
      options: [{en: frost on the ground}, {en: rain}, {en: fallen blossoms}]
      answer: 0
  - choose:
      prompt:
        en: What is the poet thinking of?
      options: [{en: his home}, {en: the spring}, {en: the king}]
      answer: 0
  - line:
      speaker: meng-haoran
      forms:
        lzh-Hant/standard:
          text: 春眠不覺曉，
          tokens: [{surface: 春, sense: 春, readings: {pinyin: chūn, jyutping: ceon1, baxter: tsyhwin}}, {surface: 眠, sense: 眠, readings: {pinyin: mián, jyutping: min4, baxter: men}}, {surface: 不, sense: 不, readings: {pinyin: bù, jyutping: bat1, baxter: pjuw}}, {surface: 覺, sense: 覺, readings: {pinyin: jué, jyutping: gok3, baxter: kaewk}}, {surface: 曉, sense: 曉, readings: {pinyin: xiǎo, jyutping: hiu2, baxter: xewX}}]
      translations: {en: 'Sleeping in spring, I did not notice the dawn;'}
  - line:
      speaker: meng-haoran
      forms:
        lzh-Hant/standard:
          text: 處處聞啼鳥。
          tokens: [{surface: 處, sense: 處, readings: {pinyin: chù, jyutping: cyu3, baxter: tsyhoH}}, {surface: 處, sense: 處, readings: {pinyin: chù, jyutping: cyu3, baxter: tsyhoH}}, {surface: 聞, sense: 聞, readings: {pinyin: wén, jyutping: man4, baxter: mjun}}, {surface: 啼, sense: 啼, readings: {pinyin: tí, jyutping: tai4, baxter: dej}}, {surface: 鳥, sense: 鳥, readings: {pinyin: niǎo, jyutping: niu5, baxter: tewX}}]
      translations: {en: everywhere I hear the birds singing.}
  - line:
      speaker: meng-haoran
      forms:
        lzh-Hant/standard:
          text: 夜來風雨聲，
          tokens: [{surface: 夜, sense: 夜, readings: {pinyin: yè, jyutping: je6, baxter: yaeH}}, {surface: 來, sense: 來, readings: {pinyin: lái, jyutping: loi4, baxter: loj}}, {surface: 風, sense: 風, readings: {pinyin: fēng, jyutping: fung1, baxter: pjuwng}}, {surface: 雨, sense: 雨, readings: {pinyin: yǔ, jyutping: jyu5, baxter: hjuX}}, {surface: 聲, sense: 聲, readings: {pinyin: shēng, jyutping: sing1, baxter: syeng}}]
      translations: {en: 'In the night came the sound of wind and rain:'}
  - line:
      speaker: meng-haoran
      ask: complete
      gap: sense:落
      distractors: ['sense:來', 'sense:出']
      forms:
        lzh-Hant/standard:
          text: 花落知多少。
          tokens: [{surface: 花, sense: 花, readings: {pinyin: huā, jyutping: faa1, baxter: xwae}}, {surface: 落, sense: 落, readings: {pinyin: luò, jyutping: lok6, baxter: lak}}, {surface: 知, sense: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 多少, sense: 多少, readings: {pinyin: duō shǎo, jyutping: do1 siu2, baxter: ta syewX}}]
