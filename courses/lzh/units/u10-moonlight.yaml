- id: lzh.story.moonlight
  node: lzh.u10.story
  title:
    en: Moonlight and a spring morning (Li Bai, Meng Haoran)
  characters:
  - {id: li-bai, name: {lzh-Hant/standard: 李白}}
  - {id: meng-haoran, name: {lzh-Hant/standard: 孟浩然}}
  steps:
  - line:
