      forms:
        lzh-Hant/standard:
          text: 七十而從心所欲，不踰矩。
          tokens: [{surface: 七, sense: 七, readings: {pinyin: qī, jyutping: cat1, baxter: tshit}}, {surface: 十, sense: 十, readings: {pinyin: shí, jyutping: sap6, baxter: dzyip}}, {surface: 而, sense: 而, readings: {pinyin: ér, jyutping: ji4, baxter: nyi}}, {surface: 從, sense: 從, readings: {pinyin: cóng, jyutping: cung4, baxter: dzjowng}}, {surface: 心, sense: 心, readings: {pinyin: xīn, jyutping: sam1, baxter: sim}}, {surface: 所, sense: 所, readings: {pinyin: suǒ, jyutping: so2, baxter: srjoX}}, {surface: 欲, sense: 欲, readings: {pinyin: yù, jyutping: juk6, baxter: yowk}}, {surface: 不, sense: 不, readings: {pinyin: bù, jyutping: bat1, baxter: pjuw}}, {surface: 踰, sense: 踰, readings: {pinyin: yú, jyutping: jyu4, baxter: yu}}, {surface: 矩, sense: 矩, readings: {pinyin: jǔ, jyutping: geoi2, baxter: kjuX}}]
