  - line:
      speaker: kongzi
      forms:
        lzh-Hant/standard:
          text: 四十而不惑，
          tokens: [{surface: 四, lexeme: 四, readings: {pinyin: sì, jyutping: sei3, baxter: sijH}}, {surface: 十, lexeme: 十, readings: {pinyin: shí, jyutping: sap6, baxter: dzyip}}, {surface: 而, lexeme: 而, readings: {pinyin: ér, jyutping: ji4, baxter: nyi}}, {surface: 不, lexeme: 不, readings: {pinyin: bù, jyutping: bat1, baxter: pjuw}}, {surface: 惑, lexeme: 惑, readings: {pinyin: huò, jyutping: waak6, baxter: hwok}}]
      translations:
