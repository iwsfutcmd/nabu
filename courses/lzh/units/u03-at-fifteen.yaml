      forms:
        lzh-Hant/standard:
          text: 五十而知天命，
          tokens: [{surface: 五, lexeme: 五, readings: {pinyin: wǔ, jyutping: ng5, baxter: nguX}}, {surface: 十, lexeme: 十, readings: {pinyin: shí, jyutping: sap6, baxter: dzyip}}, {surface: 而, lexeme: 而, readings: {pinyin: ér, jyutping: ji4, baxter: nyi}}, {surface: 知, lexeme: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 天命, lexeme: 天命, readings: {pinyin: tiān mìng, jyutping: tin1 ming6, baxter: then mjaengH}}]
      translations:
