scenarios:
- id: lzh.ages
  after: lzh.u03.my-aim
  title:
    en: How old are you?
  setting:
    en: The courtyard of the Master’s school in Lu. New students give their names and ages.
  character:
    en: A senior disciple keeping the roll of students, who counts everything and speaks only Classical Chinese.
  goal:
    en: Say how old you are, how many friends came with you, and that you have set your heart on learning.
