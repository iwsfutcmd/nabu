      forms:
        lzh-Hant/standard:
          text: 六十而耳順，
          tokens: [{surface: 六, sense: 六, readings: {pinyin: liù, jyutping: luk6, baxter: ljuwk}}, {surface: 十, sense: 十, readings: {pinyin: shí, jyutping: sap6, baxter: dzyip}}, {surface: 而, sense: 而, readings: {pinyin: ér, jyutping: ji4, baxter: nyi}}, {surface: 耳, sense: 耳, readings: {pinyin: ěr, jyutping: ji5, baxter: nyiX}}, {surface: 順, sense: 順, readings: {pinyin: shùn, jyutping: seon6, baxter: zywinH}}]
