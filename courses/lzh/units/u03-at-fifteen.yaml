      speaker: kongzi
      ask: complete
      gap: lexeme:矩
      distractors:
      - lexeme:耳
      - lexeme:朋
      forms:
        lzh-Hant/standard:
          text: 七十而從心所欲，不踰矩。
          tokens: [{surface: 七, lexeme: 七, readings: {pinyin: qī, jyutping: cat1, baxter: tshit}}, {surface: 十, lexeme: 十, readings: {pinyin: shí, jyutping: sap6, baxter: dzyip}}, {surface: 而, lexeme: 而, readings: {pinyin: ér, jyutping: ji4, baxter: nyi}}, {surface: 從, lexeme: 從, readings: {pinyin: cóng, jyutping: cung4, baxter: dzjowng}}, {surface: 心, lexeme: 心, readings: {pinyin: xīn, jyutping: sam1, baxter: sim}}, {surface: 所, lexeme: 所, readings: {pinyin: suǒ, jyutping: so2, baxter: srjoX}}, {surface: 欲, lexeme: 欲, readings: {pinyin: yù, jyutping: juk6, baxter: yowk}}, {surface: 不, lexeme: 不, readings: {pinyin: bù, jyutping: bat1, baxter: pjuw}}, {surface: 踰, lexeme: 踰, readings: {pinyin: yú, jyutping: jyu4, baxter: yu}}, {surface: 矩, lexeme: 矩, readings: {pinyin: jǔ, jyutping: geoi2, baxter: kjuX}}]
