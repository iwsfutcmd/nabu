      reverse: 君子有德
  translations:
    en: |-
      (A|The) (gentleman|noble person|superior man) (has|possesses) virtue.
      Gentlemen have virtue.
      A noble man has virtue.
      A superior person has virtue.
      The gentleman is virtuous.
- id: s.04.5
  node: lzh.u04.laozi
  forms:
    lzh-Hant/standard:
