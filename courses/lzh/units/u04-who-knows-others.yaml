      I studied the Way.
- id: s.04.3
  node: lzh.u04.laozi
  forms:
    lzh-Hant/standard:
      text: 道不遠人。
      tokens: [{surface: 道, sense: 道, readings: {pinyin: dào, jyutping: dou6, baxter: dawX}}, {surface: 不, sense: 不, readings: {pinyin: bù, jyutping: bat1, baxter: pjuw}}, {surface: 遠, sense: 遠, readings: {pinyin: yuǎn, jyutping: jyun5, baxter: hjwonX}}, {surface: 人, sense: 人, readings: {pinyin: rén, jyutping: jan4, baxter: nyin}}]
      reverse: 道不遠人
  translations:
    en: |-
      The Way is not far from (people|others|man|humankind).
      The Way (isn't|does not stay|doesn't stay) far from (people|man).
      The Dao is not far from people.
      The Tao is not far from people.
