- id: sense:者
  gloss:
    en: 'the one who …, those who … (after a verb phrase); after a noun, marks the topic; after a number, “… things”'
  forms:
    lzh-Hant/standard: [者]
  notes:
    en: '者 turns what comes before it into a noun: 知人者 “the one who knows others”. After a noun it marks what the sentence is about: 仁者，人也 “humaneness: it is [being] human”. After a number it counts things: 二者 “the two”.'
- id: sense:之.de
  gloss:
    en: ’s, of (joins a noun to what it describes or owns)
  forms:
    lzh-Hant/standard: [之]
  notes:
    en: 'The same character as 之 “him, it”, read the same: between two nouns it joins them, 孔子之道 “the Way of Confucius”. Between a subject and its verb it makes the clause a noun: 吾盾之堅 “the hardness of my shield”, 魚之樂 “the joy of the fish”, 吾劍之所從墜 “the place my sword fell from”.'
