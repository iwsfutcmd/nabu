# Classical Chinese (lzh), unit 1: The Master said.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a reviewer.
id: u01-the-master-said
title:
  en: The Master said
cefr: A1
kcs:
- id: sense:善
  gloss:
    en: good; excellent; well said
  forms:
    lzh-Hant/standard: [善]
- id: sense:哉
  gloss:
    en: 'exclamation particle: how …!, … indeed!'
  forms:
    lzh-Hant/standard: [哉]
- id: sense:曰
  gloss:
    en: to say (introduces what is said)
  forms:
    lzh-Hant/standard: [曰]
- id: sense:王
  gloss:
    en: king
  forms:
    lzh-Hant/standard: [王]
- id: sense:然
  gloss:
    en: so, thus; yes, it is so
  forms:
    lzh-Hant/standard: [然]
- id: sense:也
  gloss:
    en: 'sentence-final particle: it is (after a noun predicate)'
  forms:
    lzh-Hant/standard: [也]
  notes:
    en: 'Classical Chinese has no verb "to be" between two nouns: 我，王也 is "I [am] the king", the 也 closing the statement.'
- id: construction:ye
  gloss:
    en: 'A，B也: “A is B”, a noun as the predicate'
- id: sense:我
  gloss:
    en: I; me
  forms:
    lzh-Hant/standard: [我]
- id: sense:人
  gloss:
    en: person, people; others
  forms:
    lzh-Hant/standard: [人]
- id: sense:非
  gloss:
    en: 'is not (negates a noun predicate: 非A也)'
  forms:
    lzh-Hant/standard: [非]
- id: sense:子
  gloss:
    en: the Master (Confucius); master, sir
  forms:
    lzh-Hant/standard: [子]
  image: {file: ../images/teacher.svg, license: CC0-1.0, provenance: {author: 'llm:claude@ff0d70b80db5', status: draft}, source: Drawn for Nabu (courses/images)}
  notes:
    en: In the Analects, 子曰 is always “the Master said”. Later units meet 子 as a polite “you”.
- id: sense:孔子
  gloss:
    en: Confucius (Master Kong)
  forms:
    lzh-Hant/standard: [孔子]
- id: sense:魯
  gloss:
    en: Lu, Confucius's home state
  forms:
    lzh-Hant/standard: [魯]
- id: sense:君子
  gloss:
    en: gentleman, noble person (by conduct, not birth)
  forms:
    lzh-Hant/standard: [君子]
- id: sense:不
  gloss:
    en: not (negates a verb or adjective)
  forms:
    lzh-Hant/standard: [不]
- id: sense:知
  gloss:
    en: to know; to understand; to recognize (someone)
  forms:
    lzh-Hant/standard: [知]
- id: sense:乎
  gloss:
    en: question particle (yes-or-no questions)
  forms:
    lzh-Hant/standard: [乎]
- id: sense:之
  gloss:
    en: him, her, it, them (after a verb)
  forms:
    lzh-Hant/standard: [之]
- id: sense:學
  gloss:
    en: to learn, to study
  forms:
    lzh-Hant/standard: [學]
- id: sense:而
  gloss:
    en: and; and yet (joins two verbs or clauses)
  forms:
    lzh-Hant/standard: [而]
- id: sense:時
  gloss:
    en: time, season; at the right time
  forms:
    lzh-Hant/standard: [時]
- id: sense:習
  gloss:
    en: to practise, to rehearse what one has learned
  forms:
    lzh-Hant/standard: [習]
- id: sense:亦
  gloss:
    en: also, too
  forms:
    lzh-Hant/standard: [亦]
- id: sense:說.yue
  gloss:
    en: pleased, delighted (read as 悅)
  forms:
    lzh-Hant/standard: [說]
  notes:
    en: The same character as 說 “to speak”, read differently. Later texts write 悅.
- id: construction:buyi-hu
  gloss:
    en: '不亦…乎: “isn’t it …?”, a question that expects “yes”'
- id: sense:有
  gloss:
    en: to have; there is, there are
  forms:
    lzh-Hant/standard: [有]
- id: sense:朋
  gloss:
    en: friend, companion in study
  forms:
    lzh-Hant/standard: [朋]
- id: sense:自
  gloss:
    en: from
  forms:
    lzh-Hant/standard: [自]
- id: sense:遠
  gloss:
    en: far, distant
  forms:
    lzh-Hant/standard: [遠]
- id: sense:方
  gloss:
    en: direction, region, place
  forms:
    lzh-Hant/standard: [方]
- id: sense:來
  gloss:
    en: to come
  forms:
    lzh-Hant/standard: [來]
- id: sense:樂
  gloss:
    en: joyful, happy; joy
  forms:
    lzh-Hant/standard: [樂]
  image: {file: ../images/smile.svg, license: CC0-1.0, provenance: {author: 'llm:claude@d6c9379209cc', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:慍
  gloss:
    en: resentful, indignant
  forms:
    lzh-Hant/standard: [慍]
