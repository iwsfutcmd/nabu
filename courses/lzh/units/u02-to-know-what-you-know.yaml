# Classical Chinese (lzh), unit 2: To know what you know.
# Drafted by an LLM (provenance llm:…, status draft): every sentence awaits a reviewer.
id: u02-to-know-what-you-know
title:
  en: To know what you know
cefr: A1
kcs:
- id: sense:吾
  gloss:
    en: I, my (as subject or before a noun, never as an object)
  forms:
    lzh-Hant/standard: [吾]
- id: sense:汝
  gloss:
    en: you
  forms:
    lzh-Hant/standard: [汝]
- id: sense:爾
  gloss:
    en: you
  forms:
    lzh-Hant/standard: [爾]
- id: sense:其
  gloss:
    en: his, her, its, their; that
  forms:
    lzh-Hant/standard: [其]
- id: sense:是
  gloss:
    en: this, that (pointing back)
  forms:
    lzh-Hant/standard: [是]
  notes:
    en: 'In early Classical Chinese 是 points: “this”. Later texts also use it for “to be”.'
- id: sense:此
  gloss:
    en: this, here
  forms:
    lzh-Hant/standard: [此]
- id: sense:為
  gloss:
    en: to do, to make; to be, to count as
  forms:
    lzh-Hant/standard: [為]
- id: sense:誰
  gloss:
    en: who
  forms:
    lzh-Hant/standard: [誰]
- id: sense:何
  gloss:
    en: what; why; how
  forms:
    lzh-Hant/standard: [何]
  notes:
    en: 'As an object it comes before the verb: 何學 “study what?”.'
- id: sense:問
  gloss:
    en: to ask
  forms:
    lzh-Hant/standard: [問]
- id: sense:對
  gloss:
    en: to reply (to a superior)
  forms:
    lzh-Hant/standard: [對]
- id: sense:諾
  gloss:
    en: yes (I will); very well
  forms:
    lzh-Hant/standard: [諾]
- id: sense:否
  gloss:
    en: no; not so
  forms:
    lzh-Hant/standard: [否]
- id: sense:弟子
  gloss:
    en: disciple, student
  forms:
    lzh-Hant/standard: [弟子]
  image: {file: ../images/student.svg, license: CC0-1.0, provenance: {author: 'llm:claude@db6a47561192', status: draft}, source: Drawn for Nabu (courses/images)}
- id: sense:子路
  gloss:
    en: Zilu, a disciple of Confucius
  forms:
    lzh-Hant/standard: [子路]
- id: sense:由
  gloss:
    en: 'Yu: Zilu’s personal name, used by his teacher'
  forms:
    lzh-Hant/standard: [由]
  notes:
    en: Zilu is his courtesy name; the Master calls him by his personal name, 由 (Zhong You).
- id: sense:小人
  gloss:
    en: petty person, small-minded man (the opposite of 君子)
  forms:
    lzh-Hant/standard: [小人]
- id: sense:言
  gloss:
    en: to speak; words
  forms:
    lzh-Hant/standard: [言]
- id: sense:誨
  gloss:
    en: to teach, to instruct
  forms:
    lzh-Hant/standard: [誨]
- id: sense:女.ru
  gloss:
    en: you (read rǔ, = 汝)
  forms:
    lzh-Hant/standard: [女]
  notes:
    en: The character for “woman” (nǚ), borrowed for 汝 “you” and read like it.
- id: sense:知.zhi
  gloss:
    en: wise; wisdom (read zhì, = 智)
  forms:
    lzh-Hant/standard: [知]
  notes:
    en: The character 知 “to know”, read zhì. Later texts write 智.
- id: sense:思
  gloss:
    en: to think, to reflect
  forms:
    lzh-Hant/standard: [思]
- id: sense:則
  gloss:
    en: 'then (in the second clause: if A, then B)'
  forms:
    lzh-Hant/standard: [則]
- id: sense:罔
  gloss:
    en: lost, confused; in vain
  forms:
    lzh-Hant/standard: [罔]
- id: sense:殆
  gloss:
    en: in danger, perilous
  forms:
    lzh-Hant/standard: [殆]
