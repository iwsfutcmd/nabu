sentences:
- id: s.02.1
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 吾知之。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 知, sense: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: (吾|我)知之
  translations:
    en: |-
      I know (it|this|that|him|her).
      I knew it.
      I know them.
      I understand it.
- id: s.02.2
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 汝知之乎？
      tokens: [{surface: 汝, sense: 汝, readings: {pinyin: rǔ, jyutping: jyu5, baxter: nyoX}}, {surface: 知, sense: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}, {surface: 乎, sense: 乎, readings: {pinyin: hū, jyutping: fu4, baxter: hu}}]
      reverse: (汝|爾|女|子)知之乎
  translations:
    en: |-
      Do you know (it|this|that|him|her)?
      Did you know it?
      Do you know them?
- id: s.02.3
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 吾不知汝。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 不, sense: 不, readings: {pinyin: bù, jyutping: bat1, baxter: pjuw}}, {surface: 知, sense: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 汝, sense: 汝, readings: {pinyin: rǔ, jyutping: jyu5, baxter: nyoX}}]
      reverse: (吾|我)不知(汝|爾|女|子)
  translations:
    en: |-
      I (do not|don't) know you.
      I did not know you.
      I didn't know you.
      I do not recognize you.
- id: s.02.4
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 爾，魯人也。
      tokens: [{surface: 爾, sense: 爾, readings: {pinyin: ěr, jyutping: ji5, baxter: nyeX}}, {surface: 魯, sense: 魯, readings: {pinyin: lǔ, jyutping: lou5, baxter: luX}}, {surface: 人, sense: 人, readings: {pinyin: rén, jyutping: jan4, baxter: nyin}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: (爾|汝|女|子)魯人也
  translations:
    en: |-
      You are (a man|a person|someone) (of|from) Lu.
      You're (a man|a person|someone) (of|from) Lu.
      You( are|'re) from Lu.
      You are a native of Lu.
- id: s.02.5
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 爾非王也。
      tokens: [{surface: 爾, sense: 爾, readings: {pinyin: ěr, jyutping: ji5, baxter: nyeX}}, {surface: 非, sense: 非, readings: {pinyin: fēi, jyutping: fei1, baxter: pj+j}}, {surface: 王, sense: 王, readings: {pinyin: wáng, jyutping: wong4, baxter: hjwang}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: |-
        (爾|汝|女|子)非王也
        爾非王
        汝非王
  translations:
    en: |-
      You are not the king.
      You('re not|aren't) the king.
      You are not a king.
- id: s.02.6
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 其朋來。
      tokens: [{surface: 其, sense: 其, readings: {pinyin: qí, jyutping: kei4, baxter: gi}}, {surface: 朋, sense: 朋, readings: {pinyin: péng, jyutping: pang4, baxter: bong}}, {surface: 來, sense: 來, readings: {pinyin: lái, jyutping: loi4, baxter: loj}}]
      reverse: 其朋來
  translations:
    en: (His|Her|Their) friend (comes|is coming|has come|came).
- id: s.02.7
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 吾知其人。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 知, sense: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 其, sense: 其, readings: {pinyin: qí, jyutping: kei4, baxter: gi}}, {surface: 人, sense: 人, readings: {pinyin: rén, jyutping: jan4, baxter: nyin}}]
      reverse: (吾|我)知其人
  translations:
    en: |-
      I know (the|that) (man|person).
      I knew that man.
- id: s.02.8
  node: lzh.u02.i-and-you
  forms:
    lzh-Hant/standard:
      text: 吾朋亦知之。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 朋, sense: 朋, readings: {pinyin: péng, jyutping: pang4, baxter: bong}}, {surface: 亦, sense: 亦, readings: {pinyin: yì, jyutping: jik6, baxter: yek}}, {surface: 知, sense: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: (吾|我)朋亦知之
  translations:
    en: |-
      My friend also knows (it|this|that).
      My friend knows (it|this|that) too.
      My friend also knew it.
      My friend also knows him.
- id: s.02.9
  node: lzh.u02.this-and-that
  forms:
    lzh-Hant/standard:
      text: 是王也。
      tokens: [{surface: 是, sense: 是, readings: {pinyin: shì, jyutping: si6, baxter: dzyeX}}, {surface: 王, sense: 王, readings: {pinyin: wáng, jyutping: wong4, baxter: hjwang}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: (是|此)王也
  translations:
    en: |-
      (This|That|He) is the king.
      (That's|He's) the king.
      It is the king.
- id: s.02.10
  node: lzh.u02.this-and-that
  forms:
    lzh-Hant/standard:
      text: 是吾朋也。
      tokens: [{surface: 是, sense: 是, readings: {pinyin: shì, jyutping: si6, baxter: dzyeX}}, {surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 朋, sense: 朋, readings: {pinyin: péng, jyutping: pang4, baxter: bong}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: (是|此)(吾|我)朋也
  translations:
    en: |-
      (This|That|He) is my friend.
      (That's|He's) my friend.
      She is my friend.
- id: s.02.11
  node: lzh.u02.this-and-that
  forms:
    lzh-Hant/standard:
      text: 此魯人也。
      tokens: [{surface: 此, sense: 此, readings: {pinyin: cǐ, jyutping: ci2, baxter: tshjeX}}, {surface: 魯, sense: 魯, readings: {pinyin: lǔ, jyutping: lou5, baxter: luX}}, {surface: 人, sense: 人, readings: {pinyin: rén, jyutping: jan4, baxter: nyin}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: (此|是)魯人也
  translations:
    en: |-
      This is (a man|a person|someone) (of|from) Lu.
      (This man|This person|He) is (from Lu|a man of Lu|a person of Lu).
      She is from Lu.
- id: s.02.12
  node: lzh.u02.this-and-that
  forms:
    lzh-Hant/standard:
      text: 此非吾朋也。
      tokens: [{surface: 此, sense: 此, readings: {pinyin: cǐ, jyutping: ci2, baxter: tshjeX}}, {surface: 非, sense: 非, readings: {pinyin: fēi, jyutping: fei1, baxter: pj+j}}, {surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 朋, sense: 朋, readings: {pinyin: péng, jyutping: pang4, baxter: bong}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: |-
        (此|是)非(吾|我)朋也
        此非吾朋
  translations:
    en: |-
      (This|That|He) is not my friend.
      (This|That|He) isn't my friend.
      (That's|He's) not my friend.
      She is not my friend.
- id: s.02.13
  node: lzh.u02.this-and-that
  forms:
    lzh-Hant/standard:
      text: 吾為之。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 為, sense: 為, readings: {pinyin: wéi, jyutping: wai4, baxter: hjwe}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: (吾|我)為之
  translations:
    en: |-
      I (will do|do|did) it.
      I'll do it.
      I have done it.
      I am doing it.
- id: s.02.14
  node: lzh.u02.this-and-that
  forms:
    lzh-Hant/standard:
      text: 王為之。
      tokens: [{surface: 王, sense: 王, readings: {pinyin: wáng, jyutping: wong4, baxter: hjwang}}, {surface: 為, sense: 為, readings: {pinyin: wéi, jyutping: wai4, baxter: hjwe}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: 王為之
  translations:
    en: |-
      The king (does|did|will do) it.
      The king has done it.
      The king is doing it.
- id: s.02.15
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 誰知之？
      tokens: [{surface: 誰, sense: 誰, readings: {pinyin: shuí, jyutping: seoi4, baxter: dzywij}}, {surface: 知, sense: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: 誰知之
  translations:
    en: |-
      Who knows (it|this|that)?
      Who knows about (it|this|that)?
      Who knew it?
      Who knows him?
- id: s.02.16
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 誰來？
      tokens: [{surface: 誰, sense: 誰, readings: {pinyin: shuí, jyutping: seoi4, baxter: dzywij}}, {surface: 來, sense: 來, readings: {pinyin: lái, jyutping: loi4, baxter: loj}}]
      reverse: 誰來
  translations:
    en: Who (is coming|comes|has come|came)?
- id: s.02.17
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 何也？
      tokens: [{surface: 何, sense: 何, readings: {pinyin: hé, jyutping: ho4, baxter: ha}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: 何也
  translations:
    en: |-
      Why (is that|is it|so)?
      How (so|is that)?
      Why?
      Why is this?
      What is the reason?
- id: s.02.18
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 此何人也？
      tokens: [{surface: 此, sense: 此, readings: {pinyin: cǐ, jyutping: ci2, baxter: tshjeX}}, {surface: 何, sense: 何, readings: {pinyin: hé, jyutping: ho4, baxter: ha}}, {surface: 人, sense: 人, readings: {pinyin: rén, jyutping: jan4, baxter: nyin}}, {surface: 也, sense: 也, readings: {pinyin: yě, jyutping: jaa5, baxter: yaeX}}]
      reverse: (此|是)何人也
  translations:
    en: |-
      Who is this (man|person)?
      What (man|person) is this?
      Who is this?
      Who is he?
- id: s.02.19
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 汝何學？
      tokens: [{surface: 汝, sense: 汝, readings: {pinyin: rǔ, jyutping: jyu5, baxter: nyoX}}, {surface: 何, sense: 何, readings: {pinyin: hé, jyutping: ho4, baxter: ha}}, {surface: 學, sense: 學, readings: {pinyin: xué, jyutping: hok6, baxter: haewk}}]
      reverse: (汝|爾|女|子)何學
  translations:
    en: |-
      What do you (study|learn)?
      What are you (studying|learning)?
      What did you study?
- id: s.02.20
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 吾問之。
      tokens: [{surface: 吾, sense: 吾, readings: {pinyin: wú, jyutping: ng4, baxter: ngu}}, {surface: 問, sense: 問, readings: {pinyin: wèn, jyutping: man6, baxter: mjunH}}, {surface: 之, sense: 之, readings: {pinyin: zhī, jyutping: zi1, baxter: tsyi}}]
      reverse: (吾|我)問之
  translations:
    en: |-
      I ask (him|her|them).
      I asked (him|her|them).
      I('ll| will) ask (him|her|them).
      I ask about it.
      I asked about it.
- id: s.02.21
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 王問孔子。
      tokens: [{surface: 王, sense: 王, readings: {pinyin: wáng, jyutping: wong4, baxter: hjwang}}, {surface: 問, sense: 問, readings: {pinyin: wèn, jyutping: man6, baxter: mjunH}}, {surface: 孔子, sense: 孔子, readings: {pinyin: kǒng zǐ, jyutping: hung2 zi2, baxter: khuwngX tsiX}}]
      reverse: |-
        王問孔子
        王問於孔子
  translations:
    en: |-
      The king (asked|asks) Confucius.
      The king questioned Confucius.
      The king asked Kongzi.
- id: s.02.22
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 孔子對曰：「然。」
      tokens: [{surface: 孔子, sense: 孔子, readings: {pinyin: kǒng zǐ, jyutping: hung2 zi2, baxter: khuwngX tsiX}}, {surface: 對, sense: 對, readings: {pinyin: duì, jyutping: deoi3, baxter: twojH}}, {surface: 曰, sense: 曰, readings: {pinyin: yuē, jyutping: joek6, baxter: hjwot}}, {surface: 然, sense: 然, readings: {pinyin: rán, jyutping: jin4, baxter: nyen}}]
      reverse: 孔子對曰然[也]
  translations:
    en: |-
      Confucius replied, “(It is so|That is so|So it is|Yes|Indeed).”
      Confucius answered, “(It is so|That is so|So it is|Yes|Indeed).”
      Confucius replied, “That's right.”
      Confucius answered, “That is right.”
      Kongzi replied, “Yes.”
- id: s.02.23
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 諾。
      tokens: [{surface: 諾, sense: 諾, readings: {pinyin: nuò, jyutping: nok6, baxter: nak}}]
      reverse: 諾
  translations:
    en: |-
      Yes, I will.
      (Yes|Very well|All right|Certainly|Agreed)!
- id: s.02.24
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 否。
      tokens: [{surface: 否, sense: 否, readings: {pinyin: fǒu, jyutping: fau2, baxter: pjuwX}}]
      reverse: 否
  translations:
    en: |-
      (No|Not so|It is not so|It's not so).
      That is not so.
      It isn't so.
- id: s.02.25
  node: lzh.u02.questions
  forms:
    lzh-Hant/standard:
      text: 王問曰：「汝知之乎？」對曰：「否。」
