          tokens: [{surface: 知, lexeme: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 人, lexeme: 人, readings: {pinyin: rén, jyutping: jan4, baxter: nyin}}, {surface: 者, lexeme: 者, readings: {pinyin: zhě, jyutping: ze2, baxter: tsyaeX}}, {surface: 智, lexeme: 智, readings: {pinyin: zhì, jyutping: zi3, baxter: trjeH}}, {surface: 自, lexeme: 自.self, readings: {pinyin: zì, jyutping: zi6, baxter: dzijH}}, {surface: 知, lexeme: 知, readings: {pinyin: zhī, jyutping: zi1, baxter: trje}}, {surface: 者, lexeme: 者, readings: {pinyin: zhě, jyutping: ze2, baxter: tsyaeX}}, {surface: 明, lexeme: 明, readings: {pinyin: míng, jyutping: ming4, baxter: mjaeng}}]
      translations:
        en: Those who know others are wise; those who know themselves are enlightened.
  - line:
