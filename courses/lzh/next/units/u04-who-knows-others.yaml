      - lexeme:年
      forms:
        lzh-Hant/standard:
          text: 勝人者有力，自勝者強。
          tokens: [{surface: 勝, lexeme: 勝, readings: {pinyin: shèng, jyutping: sing3, baxter: syingH}}, {surface: 人, lexeme: 人, readings: {pinyin: rén, jyutping: jan4, baxter: nyin}}, {surface: 者, lexeme: 者, readings: {pinyin: zhě, jyutping: ze2, baxter: tsyaeX}}, {surface: 有, lexeme: 有, readings: {pinyin: yǒu, jyutping: jau5, baxter: hjuwX}}, {surface: 力, lexeme: 力, readings: {pinyin: lì, jyutping: lik6, baxter: lik}}, {surface: 自, lexeme: 自.self, readings: {pinyin: zì, jyutping: zi6, baxter: dzijH}}, {surface: 勝, lexeme: 勝, readings: {pinyin: shèng, jyutping: sing3, baxter: syingH}}, {surface: 者, lexeme: 者, readings: {pinyin: zhě, jyutping: ze2, baxter: tsyaeX}}, {surface: 強, lexeme: 強, readings: {pinyin: qiáng, jyutping: koeng4, baxter: gjang}}]
