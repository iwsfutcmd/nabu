scenarios:
- id: lzh.market
  after: lzh.u08.using
  title:
    en: In the market of Chu
  setting:
    en: 'A busy market in the state of Chu in the Warring States period: stalls of bronze weapons, boats on the river behind.'
  character:
    en: A boastful weapons seller who praises everything he sells, and speaks only Classical Chinese.
  goal:
    en: Ask the seller about his spears and shields, praise or doubt them, and catch him contradicting himself.
