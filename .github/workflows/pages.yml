name: Pages

# Publishes Storybook and the demo app to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  STORYBOOK_DISABLE_TELEMETRY: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # v5 auto-caches for package.json#packageManager, but pnpm only exists after corepack enable.
          package-manager-cache: false
      - run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      # Storybook reads the demo's bundles rather than carrying a copy (packages/ui/.storybook/main.ts).
      - run: pnpm --filter @nabu/ui build-storybook
        env:
          NABU_STORYBOOK_BUNDLES: ../demo/bundles/
      - run: pnpm --filter @nabu/web exec vite build --base=./
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r packages/ui/storybook-static site/storybook
          cp -r apps/web/dist site/demo
      # The landing page, from the demo's bundles and the UI catalog (apps/web/landing.ts): every
      # course is listed as the demo has it, so the page never goes stale.
      # The Android preview's size, when ci.yml has published it (the android-preview release), so
      # the landing page can link to it.
      - name: Android preview
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bytes=$(gh api "repos/${{ github.repository }}/releases/tags/android-preview" --jq '.assets[] | select(.name == "nabu-preview.apk") | .size' 2> /dev/null || true)
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
      - name: Landing page
        env:
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          APK_BYTES: ${{ steps.apk.outputs.bytes }}
        run: |
          args=(site "$REPOSITORY")
          if [ -n "$APK_BYTES" ]; then
            args+=(--apk "$REPOSITORY/releases/download/android-preview/nabu-preview.apk" --apk-bytes "$APK_BYTES")
          fi
          node apps/web/landing.ts "${args[@]}"
      # The audio check (ADR 0060): every course's clips, held-back ones too, beside the demo. Clips
      # the demo's bundles carry are not copied again.
      - name: Audio check
        run: node apps/web/audio-check.ts site/demo/audio-check site/demo/bundles
      # The report intake (ADR 0055, docs/reports.md): only when the repository names one.
      - name: Report intake
        if: ${{ vars.NABU_FIREBASE_PROJECT != '' }}
        env:
          PROJECT: ${{ vars.NABU_FIREBASE_PROJECT }}
          API_KEY: ${{ vars.NABU_FIREBASE_API_KEY }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({ firestore: { project: process.env.PROJECT, apiKey: process.env.API_KEY } }))' > site/demo/reports.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
