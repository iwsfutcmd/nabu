name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"

jobs:
  checks:
    name: Codegen, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # v5 auto-caches for package.json#packageManager, but pnpm only exists after corepack enable.
          package-manager-cache: false
      - name: pnpm (version from package.json#packageManager)
        run: corepack enable && pnpm --version
      - name: uv
        run: pipx install uv==0.11.32 && uv --version
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: pipeline
      - name: Generated code is up to date (schemas → TS + Pydantic, CSS module types)
        run: pnpm codegen:check
      - name: Lint (ESLint incl. nabu rules, stylelint strict logical properties, ruff)
        run: pnpm lint
      - name: Typecheck (tsc, pyright)
        run: pnpm typecheck
      - name: Unit tests (Vitest, pytest; incl. lint-rule fixtures and CLDR data check)
        run: pnpm test

  visual:
    name: Visual matrix (Playwright)
    runs-on: ubuntu-24.04
    # Baselines are generated in this exact image (pnpm test:visual:update), so
    # screenshots compare pixel for pixel. Keep the tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      NABU_VISUAL_ENV: container
    steps:
      - uses: actions/checkout@v5
      - name: pnpm (version from package.json#packageManager)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 14
