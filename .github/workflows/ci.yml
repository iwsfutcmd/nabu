name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"

jobs:
  checks:
    name: Codegen, lint, typecheck, unit tests, courses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # v5 auto-caches for package.json#packageManager, but pnpm only exists after corepack enable.
          package-manager-cache: false
      - name: pnpm (version from package.json#packageManager)
        run: corepack enable && pnpm --version
      - name: uv
        run: pipx install uv==0.11.32 && uv --version
      - name: ICU headers for PyICU (CLDR RBNF drills and transforms; Ubuntu 24.04 ships ICU 74), eSpeak NG and ffmpeg (audio tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev pkg-config espeak-ng ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: What ships carries no copyleft code (pnpm license-check)
        run: pnpm license-check
      - name: UI catalogs pass the catalog check (MF2, placeholders, CLDR plurals, invisibles; ADR 0070)
        run: pnpm check:catalogs
      - name: uv sync (all groups but speech and omnivoice; committed audio needs no speech model)
        run: uv sync --frozen --all-groups --no-group speech --no-group omnivoice
        working-directory: pipeline
      - name: Generated code is up to date (schemas → TS + Pydantic, CSS module types)
        run: pnpm codegen:check
      - name: Lint (ESLint incl. nabu rules, stylelint strict logical properties, ruff)
        run: pnpm lint
      - name: Typecheck (tsc, pyright)
        run: pnpm typecheck
      - name: Unit tests (Vitest, pytest; incl. lint-rule fixtures and CLDR data check)
        run: pnpm test
        env:
          # Tests that need PyCantonese, hazm or PyICU fail instead of skipping.
          NABU_REQUIRE_TOOLS: "1"
      - name: Fixture courses compile (Phase 2; diagnostics as file:line)
        run: pnpm courses
      - name: Web bundles are up to date (pnpm bundles → apps/web/public/bundles)
        run: |
          pnpm bundles
          git diff --exit-code -- apps/web/public/bundles
          test -z "$(git status --porcelain -- apps/web/public/bundles)"

  deploy:
    name: Self-hosted instance (deploy/compose.yaml over HTTPS, smoke test)
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
      NABU_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v5
      - name: Build the images and start Caddy, the API and Postgres
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 300
      - name: Sign up, upload, sync, export and delete, through Caddy
        run: deploy/smoke.sh https://localhost
      - name: Container logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs

  api-postgres:
    name: API tests on Postgres (the image deploy/compose.yaml runs)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nabu
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nabu" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm (version from package.json#packageManager)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Every API test file on its own fresh Postgres database (test/database.ts)
        run: pnpm --filter @nabu/api test
        env:
          NABU_TEST_DATABASE_URL: postgres://nabu:ci-only-not-a-secret@localhost:5432/postgres

  visual:
    name: Visual matrix, lesson e2e and grading performance (Playwright)
    runs-on: ubuntu-24.04
    # Baselines are generated in this exact image (pnpm test:visual:update), so
    # screenshots compare pixel for pixel. Keep the tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      NABU_VISUAL_ENV: container
    steps:
      - uses: actions/checkout@v5
      - name: pnpm (version from package.json#packageManager)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      - name: Grading p95 under 5 ms with 4x CPU throttling (Phase 1 acceptance)
        run: pnpm test:perf
      - name: Lessons by keyboard and touch, IME composition, axe; local-first progress and sync against the API (Phase 3-4 acceptance)
        run: pnpm test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
            packages/core-cli/test-results
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  android:
    name: Android app builds (Capacitor shell, Phase 10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm (version from package.json#packageManager)
        run: corepack enable && pnpm --version
      # Capacitor 8 builds with JDK 21; the runner image provides the Android SDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: The web build, with every course inside, copied into the Android project
        run: pnpm --filter @nabu/web build && pnpm --filter @nabu/mobile exec cap sync android
      - name: Debug APK (no signing, no Firebase config)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: apps/mobile/android
