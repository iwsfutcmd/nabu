<!doctype html>
<!-- lang, dir and title are set from the negotiated UI locale at startup (src/main.tsx). -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nabu</title>
    <meta name="color-scheme" content="light dark" />
    <!-- The page colour of each theme (--nabu-color-page in tokens.css), for the browser's own chrome. -->
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" data-theme-for="light" />
    <meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)" data-theme-for="dark" />
    <script>
      // The theme chosen on this device (Preferences.tsx, THEME_KEY), before the first paint.
      try {
        var theme = localStorage.getItem("nabu.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <style>
      body {
        margin: 0;
        background-color: var(--nabu-color-page);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
