# The course's affixes and clitics (lexemes), the labels of its forms (feature values, as a form
# key writes them) and its rules, with every shape its sentences write for each (Arabic,
# Arabizi, how many words). These are allomorphs to be given lexical forms and conditions when
# the rules are written; a suffix's form begins with its vowel, on a tatweel (docs/lexical-forms/apc.md).
morphemes:
- id: "lexeme:poss-2ms"
  gloss: "-ak: your (to a man)"
  shapes: [{arabic: "ك", arabizi: "ak", words: "39"}, {arabic: "ك", arabizi: "k", words: "1"}]
- id: "lexeme:w"
  gloss: "and"
  shapes: [{arabic: "و", arabizi: "w", words: "65"}]
- id: "lexeme:poss-1sg"
  gloss: "-i: my (ending on a noun)"
  shapes: [{arabic: "ي", arabizi: "i", words: "115"}]
- id: "form:Gender=Fem;Number=Sing"
  gloss: "feminine: a feminine noun (ahwe, madrase, teta), or the -e / -a ending on an adjective with one (kbir becomes kbire)"
  shapes: []  # a feature a word carries with no letters of its own, or a pattern
- id: "lexeme:poss-3ms"
  gloss: "-o: his"
  shapes: [{arabic: "ه", arabizi: "o", words: "10"}]
- id: "lexeme:poss-3fs"
  gloss: "-a: her"
  shapes: [{arabic: "ها", arabizi: "a", words: "10"}, {arabic: "ها", arabizi: "ya", words: "1"}]
- id: "lexeme:poss-2fs"
  gloss: "-ik: your (to a woman)"
  shapes: [{arabic: "ك", arabizi: "ik", words: "21"}, {arabic: "كي", arabizi: "iki", words: "2"}]
- id: "form:Number=Plur"
  gloss: "plural: a plural noun (wlad, jiren), or the -in ending on an adjective with one (jou3an becomes jou3anin)"
  shapes: []  # a feature a word carries with no letters of its own, or a pattern
- id: "lexeme:poss-2pl"
  gloss: "-kon: your (to several people)"
  shapes: [{arabic: "كن", arabizi: "kon", words: "10"}]
- id: "form:Gender=Fem;Mood=Imp;Number=Sing;Person=2"
  gloss: "-i: telling a woman to do something"
  shapes: []  # a feature a word carries with no letters of its own, or a pattern
