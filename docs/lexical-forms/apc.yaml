# Worked entries for every KC of courses/apc, in apc's lexical form (docs/lexical-forms/apc.md).
# Written by docs/prototypes/apc-lexical-forms/build.py from the course, the drafting step
# (derive.py) and authored.yaml: do not edit by hand. Every entry is a draft for review.
#   form     the lexical form: Arabic script, every vowel written. U+065C is e, U+065D is o,
#            U+06DF marks a letter written and not said; they are written here as escapes.
#   gives    what the four projections make of it: the course's Arabic, the vowel-marked text
#            the voices read, Arabizi (the default spelling first), phonemes.
#   course   what courses/apc pins for the same word.
#   review   what of `course` does not come back from `form`, and why.
