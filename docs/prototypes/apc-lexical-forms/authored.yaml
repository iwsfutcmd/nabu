# What a person (here: Claude, 2026-11-20, a draft awaiting the owner's review) adds to what
# courses/apc pins, to make docs/lexical-forms/apc.yaml: each verb's radicals, Form and citation
# forms, and which head each participle-shaped word is. build.py reads it.
#
# A verb is cited as Kline cites it (2022, p. 74): the past, he, and the present without b-, he.
# Its two forms are given as the course's Arabic spelling and Arabizi; build.py drafts the lexical
# form from the pair. `source` says where the pair is from:
#   kline N    Kline gives the verb, on that page (his spelling may differ: he writes T S D Z 5 8)
#   course     the course writes that very form
#   inferred   neither: read off the course's other forms of the verb. REVIEW first.
# Forms are numbered as Arabic grammars number them (I, II, III, V, VI, VII, VIII, IX, X, and Q for
# four radicals). Kline's own "form IV" is the four-radical one (p. 84): Q here.
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@fable-5.2', status: draft}
