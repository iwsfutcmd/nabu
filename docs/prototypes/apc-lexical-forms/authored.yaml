# Words with a participle's shape (ADR 0145: the pattern carries two heads).
#   participle  a value of the verb's aspect: a form of its verb, with a feminine and a plural in -in
#   agent       the agentive noun: a derivative, a lexeme where its plural or its vowels are listed
#   listed      a word of that shape whose verb the course does not have, or whose sense has drifted
participles:
  - {id: 'lexeme:raye7', head: participle, of: 'lexeme:ra7', note: "Kline, p. 123 (raye7). Folds into ra7 at the migration."}
  - {id: 'lexeme:seken', head: participle, of: {form: I, radicals: [س, ك, ن], past: [سكن, sakan], present: [يسكن, yeskon]}, note: "The course has no other form of the verb, and Kline does not list it.", basis: "The verb is cited sakan / yeskon: its radicals are the participle's own, and its vowels are cited as those of 2a3ad / ye23od (Kline, p. 75), by analogy. No form of the course depends on them."}
  - {id: 'lexeme:2a3ed', head: participle, of: {form: I, radicals: [ق, ع, د], past: [قعد, 2a3ad], present: [يقعد, ye23od]}, note: "Kline, p. 75 (2a3ad/ye23od)."}
  - {id: 'lexeme:wa2ef', head: participle, of: {form: I, radicals: [و, ق, ف], past: [وقف, we2ef], present: [يوقف, yu2af]}, note: "Kline, p. 76 (we2ef/yu2af)."}
  - {id: 'lexeme:nezel', head: participle, of: 'lexeme:nezel', forms: [نازل], note: "The KC's first form, nezel نازل, is the participle; nenzal is the verb."}
  - {id: 'lexeme:lezem', head: listed, note: "A participle's shape (lazem), used as 'must': a listed sense, a lexeme (ADR 0145, as جاي 'next')."}
  - {id: 'lexeme:khayef', head: listed, note: "The participle of a verb the course does not have (Kline, p. 77: 5ef/y5af). An adjective here until the verb comes."}
  - {id: 'lexeme:sa7eb', head: listed, note: "A noun of the agentive shape; the course has no verb for it."}
  - {id: 'lexeme:m3allem', head: agent, of: {form: II, radicals: [ع, ل, م], past: [علّم, 3allam], present: [يعلّم, y3allem]}, note: "Kline writes the noun mo3allem (p. 18) and also l m3alme (p. 45), with the participle's shape. The course writes m3allem. Which is said in Beirut is for a speaker."}
  - {id: 'lexeme:mhandes', head: listed, note: "The agentive of a four-radical verb the course does not have."}
  - {id: 'lexeme:m3asseb', head: listed, note: "A form II participle used as an adjective (Kline, p. 67: m3asbe); the course does not have the verb."}
  - {id: 'lexeme:mudir', head: listed, note: "A Standard Arabic participle (form IV, which Lebanese lacks: Kline, p. 84), with a broken plural (mudara, p. 57): a lexeme."}
# The active participle's template, a form per root class (Kline, ch. 17). Digits stand for the
# verb's radicals; the letters and marks between them are the pattern's own, in the notation of
# docs/lexical-forms/apc.md. `a` is the pattern's long a, which is said e (written with U+065C) unless
# its first radical is one of `back`. REVIEW: Kline gives no rule for a and e; `back` is read off his
# words and the course's.
templates:
  active-participle:
    back: [ر, ق, ع, ح, خ, غ, ص, ض, ط, ظ, و]
    I:
      sound: {masculine: "1A2i3", feminine: "1A2.3E", plural: "1A2.3in", gloss: "keteb, ketbe, ketbin"}
      hollow: {masculine: "1Ayi3", feminine: "1Ay.3E", plural: "1Ay.3in", gloss: "raye7, ray7a, ray7in"}
      doubled: {masculine: "1A2i3", feminine: "1A2.3E", plural: "1A2.3in", gloss: "7atet: the doubled letter is written twice"}
      defective: {masculine: "1A2I", feminine: "1A2yE", plural: "1A2yin", gloss: "meshe, meshye, meshyin"}
    agent:
      I:
        sound: {masculine: "1A2i3", feminine: "1A2i3E", gloss: "keteb, ketibe: the short vowel stays (Kline, p. 131)"}
