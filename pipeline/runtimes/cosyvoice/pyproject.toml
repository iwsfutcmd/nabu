# The CosyVoice2 runtime, for voices fine-tuned from CosyVoice2-0.5B (Navoiy, ADR 0059).
#
# Its own environment: CosyVoice pins an older stack (transformers 4.51, numpy 1.26, torch 2.3)
# than the pipeline's. The pipeline runs worker.py here as a subprocess, so neither stack
# constrains the other. Versions follow CosyVoice's requirements.txt at the pinned commit, without
# its GPU, training and serving packages. CI never installs it: committed clips need no model.
[project]
name = "nabu-cosyvoice-runtime"
version = "0.0.0"
description = "CosyVoice2 inference for nabu audio generate, in its own environment"
license = "MIT OR Apache-2.0"
requires-python = "==3.11.*"
dependencies = [
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "gdown==5.1.0",
  "huggingface-hub==0.36.2",
  "hydra-core==1.3.2",
  "hyperpyyaml==1.2.3",
  "inflect==7.3.1",
  "librosa==0.10.2",
  "lightning==2.2.4",
  "matplotlib==3.7.5",
  "modelscope==1.20.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "onnxruntime==1.18.0",
  "openai-whisper==20231117",
  "pyarrow==18.1.0",
  "pyworld==0.3.4",
  "rich==13.7.1",
  # lightning 2.2 and Matcha-TTS import pkg_resources, gone from setuptools 81.
  "setuptools<81",
  "soundfile==0.12.1",
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "transformers==4.51.3",
  "wget==3.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# openai-whisper 20231117 imports pkg_resources in its setup.py without declaring it.
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]
