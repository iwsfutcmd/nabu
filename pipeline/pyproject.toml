[project]
name = "nabu-pipeline"
version = "0.0.0"
description = "Nabu content pipeline: compiler, analyzers, TTS and alignment, LLM authoring, training"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14,<3",
  "pyyaml>=6.0.3",
  "regex>=2026.9.29",
  "typer>=0.27",
]

[project.scripts]
nabu = "nabu.cli:app"

[dependency-groups]
# Language analyzers for compiler stage 3 (§7.5). Installed by default; the yue course needs PyCantonese.
analyzers = [
  "hazm>=0.12.1",
  "pycantonese>=5.0",
]
# CLDR RBNF drills and transforms (§7.6). Needs ICU headers: apt install libicu-dev pkg-config.
icu = [
  "pyicu>=2.17",
]
dev = [
  "datamodel-code-generator>=0.88",
  "hypothesis>=6.170",
  "jsonschema>=4.26",
  "pyright>=1.1.414",
  "pytest>=9.2",
  "ruff>=0.17",
]
# Speech (§10): neural TTS (Piper), the phoneme model for forced alignment and round-trip QA.
# Heavy (CPU PyTorch, model downloads); only `nabu audio` needs it. CI compiles committed audio
# without it. espeak-ng itself is a system package (apt install espeak-ng).
speech = [
  "faster-whisper>=1.2",
  "numpy>=2.2",
  "piper-tts>=1.3",
  "soundfile>=0.13",
  "torch>=2.9",
  "transformers>=4.57",
]
# OmniVoice (ADR 0058): runs the Lahgtna checkpoint, the apc course's Lebanese voice. It pulls
# PyTorch and Gradio, so CI leaves it out: committed audio needs no model.
omnivoice = [
  "omnivoice==0.2.1",
  "torch>=2.9",
  "torchaudio>=2.9",
]
# Learner-event analytics (§9.3 shadow mode, §14.4): DuckDB over exported JSONL logs.
analytics = [
  "duckdb>=1.4",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nabu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/nabu/schema/models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# "Ambiguous" characters (Cyrillic а, Arabic ه, Uzbek ʻ, Turkish ı) are this project's data. Confusables are
# checked where they matter, in content: the compiler's text.mixed-script audit (§7.5).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv]
default-groups = ["dev", "analyzers", "analytics"]

# PyTorch from its CPU-only index: the default wheels pull in gigabytes of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
include = ["src", "tests", "notebooks"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
