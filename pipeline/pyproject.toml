[project]
name = "nabu-pipeline"
version = "0.0.0"
description = "Nabu content pipeline: compiler, analyzers, TTS and alignment, LLM authoring, training"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14,<3",
  "pyyaml>=6.0.3",
  "typer>=0.27",
]

[project.scripts]
nabu = "nabu.cli:app"

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.88",
  "hypothesis>=6.170",
  "jsonschema>=4.26",
  "pyright>=1.1.414",
  "pytest>=9.2",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nabu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/nabu/schema/models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
