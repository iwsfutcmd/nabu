# What bar declares beside its lexicon (schemas/language.schema.json): its dimensions, features and labels.
# South Tyrolean (ADR 0156), in Universal Dependencies' terms as the German treebanks use them (Mood=Sub for the
# subjunctive II, Tense=Past with it; an adverbial adjective is ADJ; Polite=Form for Sie). Departures, stated: the
# participle is VerbForm=Part alone (the dialect has no other); a predicative adjective carries no features (it is
# its lemma); a noun's case is its phrase's (the article shows it, the noun mostly does not).
# Three cases: the dialect has no genitive (Weiß 46: none anywhere in Bavarian but one village). No defaults: a
# noun's gender is stored on every noun, since the dialect drops the endings that tell it in German (Kuchl, Schual).
id: bar
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@bar-course-v1', status: draft}
varieties: [bar-IT]
