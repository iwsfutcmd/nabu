- {feats: {Gender: Masc, Mood: Imp, Number: Plur, Person: '2', VerbForm: Fin}, gloss: {en: 'imperative, to several people: do!'}, was: 'form:impv-mp'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1', VerbForm: Fin}, gloss: {en: 'I will do: the imperfect (yiqtol), I'}, was: 'form:yiqtol-1cs'}
- {feats: {Aspect: Imp, Mood: Opt, VerbForm: Fin}, gloss: {en: 'let me do, let us do: the cohortative (-â); ''I will …'' after a command'}, was: 'form:coh'}
- {feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '3', VerbForm: Fin}, gloss: {en: 'he will do: the imperfect (yiqtol), he or it'}, was: 'form:yiqtol-3ms'}
- {feats: {Aspect: Perf, Mood: Ind, Number: Plur, Person: '3', VerbForm: Fin}, gloss: {en: 'they did: the perfect (qatal), they (-û)'}, was: 'form:qatal-3cp'}
