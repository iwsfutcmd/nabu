- {feats: {Gender: Masc, Mood: Ind, Number: Sing, Person: '2', Tense: Fut, VerbForm: Fin}, gloss: {en: 'and you shall do: the converted perfect (weqatal), you'}, was: 'form:weqatal-2ms'}
- {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Fut, VerbForm: Fin}, gloss: {en: 'and they shall: the converted perfect (weqatal), they'}, was: 'form:weqatal-3cp'}
- {feats: {Gender: Masc, Mood: Ind, Number: Sing, Person: '3', Tense: Fut, VerbForm: Fin}, gloss: {en: 'and he shall; and it will be: the converted perfect (weqatal), he or it'}, was: 'form:weqatal-3ms'}
- {feats: {Definite: Cons, Gender: Fem, Number: Plur}, gloss: {en: 'feminine plural construct (-ôṯ): ''the …s of'' (מַעַרְכוֹת יִשְׂרָאֵל ''the ranks of Israel'')'}, was: 'form:f-pl-cstr'}
- {feats: {Gender: Fem, Mood: Ind, Number: Plur, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'and they (f.) did: the narrative past, they (women)'}, was: 'form:wayyiqtol-3fp'}
