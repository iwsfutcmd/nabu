# Rules in a lexicon (docs/rules/hbo.md; docs/rules-design.md): hbo's notation, root classes, stem templates,
# realisation rules and rewrites, read by @nabu/core (`compileLanguage`, `realise`; core-cli realise, realise-token,
# paradigm; conformance/realise-hbo.json); never shipped. Every rule and branch is REVIEW: drafted from Joüon and
# Muraoka (2011, the second edition's sections: JM § n, page) and the course's own words (the Westminster Leningrad
# Codex), awaiting Ben's sign-off.
#
# The notation is the Tiberian pointing as the course writes it (WLC: no accents, no meteg), letters with their
# dagesh and shin or sin dot. What it leaves to the spelling (each profile's `spell`): a word's final letter forms,
# the shewa under a final kaf and under the last of a final cluster, the furtive patah, and the dagesh lene of a
# begadkefat that begins a word (a form writes ב, never בּ, first; the spelling writes it, or leaves it out after a
# word that ends in a vowel, JM § 19, a free alternative). The sign of no vowel is the shewa, vocal or silent alike:
# Tiberian writes one sign for both, and which a shewa is follows from where it stands (Khan I.2.8; the pinned
# reading says it); the rules read it where they must (the dagesh lene after a silent shewa: after a short vowel).
# A word's last consonant is bare. A suffix that begins with a vowel writes it on the carrier (U+0640), which puts
# it on the letter the suffix joins; a stem that begins with the carrier gives its vowel to the person prefix.
notation:
  vowels: {i: "\u05B4", ee: "\u05B5", e: "\u05B6", a: "\u05B7", aa: "\u05B8", o: "\u05B9", u: "\u05BB", ha: "\u05B2", he: "\u05B1", ho: "\u05B3"}
  # A long vowel as written: hiriq, tsere or segol and yod, qamets and he or alef (a quiescent alef takes no shewa
  # before a suffix: קָרָאתָ), holem and shureq on their vav.
  long: {i: "\u05B4י", ee: "\u05B5י", e: "\u05B6י", aa: "\u05B8ה", aa-alef: "\u05B8א", o: "ו\u05B9", u: "ו\u05BC"}
  none: "\u05B0"
  # A letter's marks: its shin or sin dot, its dagesh, then its point.
  order: "[\u05C1 \u05C2 \u05BC \u05B0-\u05BB]"
  sets:
    L: "[א-ת]"
    G: "[אהחע]"
    GR: "[אהחער]"
    AER: "[אער]"
    HH: "[הח]"
    # Letters that take a dagesh forte (not the gutturals or resh), and the begadkefat.
    NG: "[בגדזטיכלמנספצקשתךםןףץ]"
    BGD: "[בגדכפת]"
    LAB: "[במפ]"
    BKL: "[בכל]"
    TN: "[תנ]"
    Y: "[י]"
    T: "[ת]"
    N: "[נ]"
    A: "[א]"
    WY: "[וי]"
    GF: "[חע]"
    # A consonant that closes a syllable at a word's end (not a vowel letter).
    CLOSE: "[בגדזחטכלמנסעפצקרשתךםןףץ]"
    # Every letter but yod.
    NY: "[א-טך-ת]"
    # A letter's marks: each point with or without a dagesh and a shin or sin dot (a pattern matches marks
    # exactly). FULL a full vowel, SHORT a short one (hiriq, segol, patah, qibbuts: a shewa after it is silent),
    # ANYV any point, SHVND a shewa on a letter that is not doubled.
    SHV: "[{\u05B0} {\u05B0\u05BC} {\u05B0\u05C1} {\u05B0\u05C2} {\u05B0\u05BC\u05C1} {\u05B0\u05BC\u05C2}]"
    HSE: "[{\u05B1} {\u05B1\u05BC} {\u05B1\u05C1} {\u05B1\u05C2} {\u05B1\u05BC\u05C1} {\u05B1\u05BC\u05C2}]"
    HPA: "[{\u05B2} {\u05B2\u05BC} {\u05B2\u05C1} {\u05B2\u05C2} {\u05B2\u05BC\u05C1} {\u05B2\u05BC\u05C2}]"
    HQA: "[{\u05B3} {\u05B3\u05BC} {\u05B3\u05C1} {\u05B3\u05C2} {\u05B3\u05BC\u05C1} {\u05B3\u05BC\u05C2}]"
    HIR: "[{\u05B4} {\u05B4\u05BC} {\u05B4\u05C1} {\u05B4\u05C2} {\u05B4\u05BC\u05C1} {\u05B4\u05BC\u05C2}]"
    TSE: "[{\u05B5} {\u05B5\u05BC} {\u05B5\u05C1} {\u05B5\u05C2} {\u05B5\u05BC\u05C1} {\u05B5\u05BC\u05C2}]"
    SEG: "[{\u05B6} {\u05B6\u05BC} {\u05B6\u05C1} {\u05B6\u05C2} {\u05B6\u05BC\u05C1} {\u05B6\u05BC\u05C2}]"
    PAT: "[{\u05B7} {\u05B7\u05BC} {\u05B7\u05C1} {\u05B7\u05C2} {\u05B7\u05BC\u05C1} {\u05B7\u05BC\u05C2}]"
    QAM: "[{\u05B8} {\u05B8\u05BC} {\u05B8\u05C1} {\u05B8\u05C2} {\u05B8\u05BC\u05C1} {\u05B8\u05BC\u05C2}]"
    HOL: "[{\u05B9} {\u05B9\u05BC} {\u05B9\u05C1} {\u05B9\u05C2} {\u05B9\u05BC\u05C1} {\u05B9\u05BC\u05C2}]"
    QIB: "[{\u05BB} {\u05BB\u05BC} {\u05BB\u05C1} {\u05BB\u05C2} {\u05BB\u05BC\u05C1} {\u05BB\u05BC\u05C2}]"
    FULL: "[{\u05B4} {\u05B4\u05BC} {\u05B4\u05C1} {\u05B4\u05C2} {\u05B4\u05BC\u05C1} {\u05B4\u05BC\u05C2} {\u05B5} {\u05B5\u05BC} {\u05B5\u05C1} {\u05B5\u05C2} {\u05B5\u05BC\u05C1} {\u05B5\u05BC\u05C2} {\u05B6} {\u05B6\u05BC} {\u05B6\u05C1} {\u05B6\u05C2} {\u05B6\u05BC\u05C1} {\u05B6\u05BC\u05C2} {\u05B7} {\u05B7\u05BC} {\u05B7\u05C1} {\u05B7\u05C2} {\u05B7\u05BC\u05C1} {\u05B7\u05BC\u05C2} {\u05B8} {\u05B8\u05BC} {\u05B8\u05C1} {\u05B8\u05C2} {\u05B8\u05BC\u05C1} {\u05B8\u05BC\u05C2} {\u05B9} {\u05B9\u05BC} {\u05B9\u05C1} {\u05B9\u05C2} {\u05B9\u05BC\u05C1} {\u05B9\u05BC\u05C2} {\u05BB} {\u05BB\u05BC} {\u05BB\u05C1} {\u05BB\u05C2} {\u05BB\u05BC\u05C1} {\u05BB\u05BC\u05C2}]"
    SHORT: "[{\u05B4} {\u05B4\u05BC} {\u05B4\u05C1} {\u05B4\u05C2} {\u05B4\u05BC\u05C1} {\u05B4\u05BC\u05C2} {\u05B6} {\u05B6\u05BC} {\u05B6\u05C1} {\u05B6\u05C2} {\u05B6\u05BC\u05C1} {\u05B6\u05BC\u05C2} {\u05B7} {\u05B7\u05BC} {\u05B7\u05C1} {\u05B7\u05C2} {\u05B7\u05BC\u05C1} {\u05B7\u05BC\u05C2} {\u05BB} {\u05BB\u05BC} {\u05BB\u05C1} {\u05BB\u05C2} {\u05BB\u05BC\u05C1} {\u05BB\u05BC\u05C2}]"
    ANYV: "[{\u05B0} {\u05B0\u05BC} {\u05B0\u05C1} {\u05B0\u05C2} {\u05B0\u05BC\u05C1} {\u05B0\u05BC\u05C2} {\u05B1} {\u05B1\u05BC} {\u05B1\u05C1} {\u05B1\u05C2} {\u05B1\u05BC\u05C1} {\u05B1\u05BC\u05C2} {\u05B2} {\u05B2\u05BC} {\u05B2\u05C1} {\u05B2\u05C2} {\u05B2\u05BC\u05C1} {\u05B2\u05BC\u05C2} {\u05B3} {\u05B3\u05BC} {\u05B3\u05C1} {\u05B3\u05C2} {\u05B3\u05BC\u05C1} {\u05B3\u05BC\u05C2} {\u05B4} {\u05B4\u05BC} {\u05B4\u05C1} {\u05B4\u05C2} {\u05B4\u05BC\u05C1} {\u05B4\u05BC\u05C2} {\u05B5} {\u05B5\u05BC} {\u05B5\u05C1} {\u05B5\u05C2} {\u05B5\u05BC\u05C1} {\u05B5\u05BC\u05C2} {\u05B6} {\u05B6\u05BC} {\u05B6\u05C1} {\u05B6\u05C2} {\u05B6\u05BC\u05C1} {\u05B6\u05BC\u05C2} {\u05B7} {\u05B7\u05BC} {\u05B7\u05C1} {\u05B7\u05C2} {\u05B7\u05BC\u05C1} {\u05B7\u05BC\u05C2} {\u05B8} {\u05B8\u05BC} {\u05B8\u05C1} {\u05B8\u05C2} {\u05B8\u05BC\u05C1} {\u05B8\u05BC\u05C2} {\u05B9} {\u05B9\u05BC} {\u05B9\u05C1} {\u05B9\u05C2} {\u05B9\u05BC\u05C1} {\u05B9\u05BC\u05C2} {\u05BB} {\u05BB\u05BC} {\u05BB\u05C1} {\u05BB\u05C2} {\u05BB\u05BC\u05C1} {\u05BB\u05BC\u05C2}]"
    SHVND: "[{\u05B0} {\u05B0\u05C1} {\u05B0\u05C2}]"
# The stated classes the rewrites read (REVIEW; none ships).
classes:
- {id: qamets-after-article, pos: NOUN, notes: {en: 'REVIEW: a noun whose first vowel is qamets after the article (הָאָרֶץ, הָהָר, הָעָם, הַגָּן: JM § 35f): stated per noun, as the lexicon cannot say which.'}}
- {id: alef-quiescent, pos: NOUN, notes: {en: 'REVIEW: אֱלֹהִים after בְּ, כְּ, לְ, וְ: its alef quiescent, the prefix with tsere (לֵאלֹהִים, וֵאלֹהֵי: JM § 103b).'}}
- {id: alef-quiescent-verb, pos: VERB, notes: {en: 'REVIEW: אָמַר''s infinitive after לְ: לֵאמֹר (JM § 73f).'}}
- {id: suffix-plene, pos: ADV, notes: {en: 'REVIEW: the course writes this word with the 2ms suffix''s plene ketiv -ḵâ (אַיֶּכָּה, Gn 3:9: JM § 94h n. 4).'}}
- {id: suffix-hem, pos: ADP, notes: {en: 'REVIEW: the 3mp suffix -hem where -m would also do (עִמָּהֶם beside עִמָּם: JM § 103).'}}
- {id: construct-same, pos: NOUN, notes: {en: 'REVIEW: a noun whose construct singular is its absolute: a monosyllable whose vowel does not reduce, or a segolate (קוֹל, שֵׁם, אֶרֶץ: JM § 92): stated per noun.'}}
- {id: qere-adonay, pos: PROPN, notes: {en: 'REVIEW: יְהוָה, read ʾădōnāy (its qere): a prefix takes the vowel it would before אֲדֹנָי and the yod no shewa (לַיהוָה, בַּיהוָה, וַיהוָה; ADR 0084).'}}
# A verb's root class: the first that holds, never stored (docs/lexical-forms/apc.md, 'A verb's form'; JM §§ 68-82).
rootClasses:
