- {feats: {Gender: Fem, Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'and she did: the narrative past, she or it (f.)'}, was: 'form:wayyiqtol-3fs'}
- {feats: {Gender: Masc, Number: Plur, VerbForm: Part}, gloss: {en: 'participle, masculine plural: they are doing; ones who do'}, was: 'form:ptc-mp'}
