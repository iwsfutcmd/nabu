# What hbo declares beside its lexicon (schemas/language.schema.json).
# Written by `nabu migrate` from courses/hbo and its conversion plan
# (docs/migration-design.md, deliverable 2); never by hand. Nothing reads it until the
# switch.
id: hbo
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@f55f5b08fb95', status: draft}
varieties: [hbo]
registers: [formal]
dimensions:
  VERB: [Aspect, Tense, Mood, VerbForm, Person, Gender, Number]
  NOUN: [Number, Definite]
  ADJ: [Gender, Number]
lexical:
  NOUN: [Gender]
  PROPN: [Gender]
citation:
  NOUN: {Gender: Masc, Number: Sing}
  PROPN: {Gender: Masc}
  ADJ: {Gender: Masc, Number: Sing}
  VERB: {Aspect: Perf, Mood: Ind, VerbForm: Fin, Person: '3', Gender: Masc, Number: Sing}
features:
  Aspect: [Imp, Perf]
  Case: [Lat]
  Definite: [Cons]
  Gender: [Fem, Masc]
  Mood: [Imp, Ind, Jus, Opt]
  NumType: [Card]
  Number: [Dual, Plur, Sing]
