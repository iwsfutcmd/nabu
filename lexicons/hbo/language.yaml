- {feats: {Aspect: Perf, Gender: Masc, Mood: Ind, Number: Sing, Person: '2', VerbForm: Fin}, gloss: {en: 'you did: the perfect (qatal), you (to a man: -tā)'}, was: 'form:qatal-2ms'}
