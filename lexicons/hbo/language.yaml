rules:
- {id: 'rule:nominal', gloss: {en: 'a noun sentence: no verb ''to be'' (הָאוֹר טוֹב ''the light is good'')'}, was: 'construction:nominal'}
- {id: 'rule:yesh-le', gloss: {en: 'יֵשׁ לְ…: … has (there is to …); אֵין לְ…: … has no'}, was: 'construction:yesh-le'}
