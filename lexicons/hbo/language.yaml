- {feats: {VerbForm: InfAbs}, gloss: {en: 'the infinitive absolute: in laws, ''you shall …'' (כַּבֵּד ''honour''); before its own verb, ''surely'''}, was: 'form:inf-abs'}
- {feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Plur, Person: '3', VerbForm: Fin}, gloss: {en: 'they will do: the imperfect (yiqtol), they'}, was: 'form:yiqtol-3mp'}
