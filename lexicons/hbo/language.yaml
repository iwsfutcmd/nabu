defaults:
- {id: gender-ah, when: {ends: ָה}, gives: {Gender: Fem}}
- {id: gender-t, when: {ends: ת}, gives: {Gender: Fem}}
- {id: gender-none, when: {pos: NOUN}, gives: {Gender: Masc}}
- {id: gender-none-name, when: {pos: PROPN}, gives: {Gender: Masc}}
labels:
- {feats: {Gender: Masc, Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'and he did: the narrative past (wayyiqtol), he or it'}, was: 'form:wayyiqtol-3ms'}
- {feats: {Aspect: Imp, Mood: Jus, VerbForm: Fin}, gloss: {en: 'let him (it) do: the jussive; with אַל, ''do not …!'''}, was: 'form:juss'}
- {feats: {Aspect: Perf, Gender: Masc, Mood: Ind, Number: Sing, Person: '3', VerbForm: Fin}, gloss: {en: 'he did: the perfect (qatal), he or it'}, was: 'form:qatal-3ms'}
- {feats: {Aspect: Perf, Gender: Fem, Mood: Ind, Number: Sing, Person: '3', VerbForm: Fin}, gloss: {en: 'she did: the perfect (qatal), she or it (f.)'}, was: 'form:qatal-3fs'}
- {feats: {Gender: Fem, Number: Sing}, gloss: {en: 'feminine: a feminine noun (אֶרֶץ ''land'', אִשָּׁה ''woman''), or an adjective with one (-â or -eṯ: טוֹבָה ''good'')'}, was: 'form:f'}
- {feats: {Gender: Fem}, pos: PROPN, gloss: {en: 'feminine: a feminine noun (אֶרֶץ ''land'', אִשָּׁה ''woman''), or an adjective with one (-â or -eṯ: טוֹבָה ''good'')'}, was: 'form:f'}
- {feats: {Definite: Cons, Gender: Masc, Number: Plur}, gloss: {en: 'plural construct (-ê): ''the …s of''; also of nouns always plural (פְּנֵי ''the face of'')'}, was: 'form:pl-cstr'}
- {feats: {Gender: Fem, Number: Sing, VerbForm: Part}, gloss: {en: 'participle, feminine singular: she/it is doing'}, was: 'form:ptc-fs'}
- {feats: {Gender: Masc, Number: Plur}, gloss: {en: 'plural, masculine (-îm, some -ôṯ: גּוֹרָלוֹת ''lots''); also nouns always plural (שָׁמַיִם ''heaven'', מַיִם ''water'')'}, was: 'form:pl'}
- {feats: {Number: Plur}, pos: DET, gloss: {en: 'plural, masculine (-îm, some -ôṯ: גּוֹרָלוֹת ''lots''); also nouns always plural (שָׁמַיִם ''heaven'', מַיִם ''water'')'}, was: 'form:pl'}
- {feats: {Definite: Cons, Gender: Fem, Number: Sing}, gloss: {en: 'feminine construct: ''X of …'', the noun bound to the next (רוּחַ אֱלֹהִים ''the spirit of God''; -â becomes -aṯ: אַדְמַת ''the ground of'')'}, was: 'form:f-cstr'}
- {feats: {Gender: Masc, Mood: Ind, Number: Plur, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'and they did: the narrative past, they'}, was: 'form:wayyiqtol-3mp'}
- {feats: {Aspect: Perf, Mood: Ind, Number: Sing, Person: '1', VerbForm: Fin}, gloss: {en: 'I did: the perfect (qatal), I (-tî)'}, was: 'form:qatal-1cs'}
- {feats: {Gender: Masc, Number: Sing, VerbForm: Part}, gloss: {en: 'participle, masculine singular: he/it is doing; one who does (of a verb of state, its adjective: יָרֵא ''afraid'')'}, was: 'form:ptc-ms'}
