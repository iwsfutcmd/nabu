- {id: impf, form: hiphil, class: iii-he, template: "ـ\u05B71\u05B02\u05B6ה"}  # יַנְחֶה
- {id: wayy, form: hiphil, template: "ـ\u05B71\u05B02\u05B53"}  # וַיַּבְדֵּל, וַיַּסְתֵּר: the short form (JM § 54c)
- {id: wayy, form: hiphil, class: i-nun, template: "ـ\u05B72\u05B5\u05BC3"}  # וַיַּגֵּד
- {id: wayy, form: hiphil, class: i-yod, template: "ـ\u05B92\u05B63"}  # וַתֹּרֶד (JM § 75)
- {id: wayy, form: hiphil, class: hollow, template: "ـ\u05B81\u05B63"}  # וַיָּשֶׁב
- {id: impv, form: hiphil, template: "ה\u05B71\u05B02\u05B53"}  # הַבְדֵּל
- {id: impv, form: hiphil, class: i-nun, template: "ה\u05B72\u05B5\u05BC3"}  # הַגֵּד
- {id: impv-v, form: hiphil, template: "ה\u05B71\u05B02\u05B4י3"}  # הַגְמִיאִי
- {id: impv-v, form: hiphil, class: i-nun, template: "ה\u05B72\u05B4\u05BCי3"}  # הַגִּידִי
- {id: inf, form: hiphil, template: "ה\u05B71\u05B02\u05B4י3"}  # הַבְדִּיל
- {id: inf, form: hiphil, class: i-nun, template: "ה\u05B72\u05B4\u05BCי3"}  # הַבִּיט
- {id: inf, form: hiphil, class: iii-he, template: "ה\u05B71\u05B02ו\u05B9ת"}  # הַשְׁקוֹת
- {id: infabs, form: hiphil, class: hollow, template: "ה\u05B81\u05B53"}  # הָמֵת (JM § 80g)
# Niphal (JM § 51, P2 p. 620)
- {id: perf, form: niphal, template: "נ\u05B41\u05B02\u05B73"}  # נִקְבַּר, נִשְׁבַּר, נִכְמַר
- {id: perf, form: niphal, radical: 1, in: "{G}", template: "נ\u05B61\u05B02\u05B73"}
- {id: perf-v, form: niphal, template: "נ\u05B41\u05B02\u05B03"}  # נִכְמְרוּ
- {id: perf, form: niphal, radical: 1, in: "{G}", class: iii-alef, template: "נ\u05B61\u05B02\u05B83"}  # נֶחְבָּא
- {id: perf, form: niphal, class: iii-he, template: "נ\u05B41\u05B02\u05B8ה"}  # נִרְאָה (JM § 79)
- {id: impf, form: niphal, template: "ـ\u05B41\u05B8\u05BC2\u05B53"}  # יִקָּבֵר
- {id: impf, form: niphal, radical: 1, in: "{GR}", template: "ـ\u05B51\u05B82\u05B53"}  # וָאֵחָבֵא (JM § 68)
- {id: impf, form: niphal, class: iii-he, template: "ـ\u05B41\u05B8\u05BC2\u05B6ה"}
- {id: wayy, form: niphal, class: iii-he, radical: 1, in: "{GR}", template: "ـ\u05B51\u05B82"}  # וַיֵּרָא (JM § 79i)
# Hithpael (JM § 53, P2 p. 621)
- {id: perf, form: hithpael, template: "ה\u05B4ת\u05B01\u05B72\u05B5\u05BC3"}  # הִתְהַלֵּךְ, הִתְיַצֵּב
- {id: impf, form: hithpael, template: "ـ\u05B4ת\u05B01\u05B72\u05B5\u05BC3"}  # וַיִּתְחַבֵּא
- {id: ptc, form: hithpael, template: "מ\u05B4ת\u05B01\u05B72\u05B5\u05BC3"}  # מִתְהַלֵּךְ
- {id: ptc-fs, form: hithpael, template: "מ\u05B4ת\u05B01\u05B72\u05B6\u05BC3\u05B6ת"}  # מִתְהַלֶּכֶת
# Polel of a hollow verb (JM § 59a, 80h, p. 198)
- {id: perf, form: polel, template: "1ו\u05B93\u05B53"}  # שׁוֹבֵב
- {id: impf, form: polel, template: "ـ\u05B01ו\u05B93\u05B53"}  # יְשׁוֹבֵב
realisation:
- id: 'rule:hbo-participle-passive'  # the qal passive participle (JM § 50c)
  when: {pos: VERB, feats: {VerbForm: Part, Voice: Pass}}
  stem: ptcp
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "ـ\u05B8ה", stem: [ptcp-v, ptcp]}
    - {branch: mp, feats: {Gender: Masc, Number: Plur}, add: "ـ\u05B4ים", stem: [ptcp-v, ptcp]}
    - {branch: ms, feats: {Gender: Masc, Number: Sing}, add: ""}
- id: 'rule:hbo-participle'  # the active participle, of each stem (JM § 50, 89)
  when: {pos: VERB, feats: {VerbForm: Part}}
  stem: ptc
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "", stem: [ptc-fs]}
    - {branch: mp, feats: {Gender: Masc, Number: Plur}, add: "ـ\u05B4ים", stem: [ptc-v, ptc]}
    - {branch: fp, feats: {Gender: Fem, Number: Plur}, add: "ـו\u05B9ת", stem: [ptc-v, ptc]}
    - {branch: ms, feats: {Gender: Masc, Number: Sing}, add: ""}
- id: 'rule:hbo-infinitive-absolute'  # JM § 49
  when: {pos: VERB, feats: {VerbForm: InfAbs}}
  stem: infabs
  blocks:
  - suffix:
    - {branch: absolute, add: ""}
- id: 'rule:hbo-infinitive'  # the infinitive construct (JM § 49)
  when: {pos: VERB, feats: {VerbForm: Inf}}
  stem: inf
  blocks:
  - suffix:
    - {branch: construct, add: ""}
- id: 'rule:hbo-wayyiqtol'  # vav, the prefix doubled, and the short imperfect (JM § 47, pp. 128-130)
  when: {pos: VERB, feats: {Tense: Past}}
  stem: [wayy, impf]
  blocks:
  - prefix:  # who (JM § 44, p. 124; P2 p. 620)
    - {branch: 1s, feats: {Person: '1', Number: Sing}, add: "א"}
    - {branch: 1p, feats: {Person: '1', Number: Plur}, add: "נ"}
    - {branch: 3fs, feats: {Person: '3', Gender: Fem, Number: Sing}, add: "ת"}
    - {branch: 3fp, feats: {Person: '3', Gender: Fem, Number: Plur}, add: "ת"}
    - {branch: '2', feats: {Person: '2'}, add: "ת"}
    - {branch: '3', feats: {Person: '3'}, add: "י"}
  - suffix:
    - {branch: 2fs, feats: {Person: '2', Gender: Fem, Number: Sing}, add: "ـ\u05B4י", stem: [impf-v, impf]}
    - {branch: mp, feats: {Gender: Masc, Number: Plur}, add: "ـו\u05BC", stem: [impf-v, impf]}
    - {branch: fp, feats: {Gender: Fem, Number: Plur}, add: "נ\u05B8ה", stem: [impf]}
  - prefix:
    - {branch: vav, add: "ו\u05B7"}
- id: 'rule:hbo-weqatal'  # vav and the perfect (JM § 43, 119)
  when: {pos: VERB, feats: {Tense: Fut}}
  stem: perf
  blocks:
  - suffix:  # JM § 42f, p. 121
    - {branch: 1cs, feats: {Person: '1', Number: Sing}, add: "ת\u05B4י", stem: [perf-c, perf]}
    - {branch: 1cp, feats: {Person: '1', Number: Plur}, add: "נו\u05BC", stem: [perf-c, perf]}
    - {branch: 2ms, feats: {Person: '2', Gender: Masc, Number: Sing}, add: "ת\u05B8", stem: [perf-c, perf]}
    - {branch: 2fs, feats: {Person: '2', Gender: Fem, Number: Sing}, add: "ת", stem: [perf-c, perf]}
    - {branch: 2mp, feats: {Person: '2', Gender: Masc, Number: Plur}, add: "ת\u05B6ם", stem: [perf-h, perf-c, perf]}
    - {branch: 2fp, feats: {Person: '2', Gender: Fem, Number: Plur}, add: "ת\u05B6ן", stem: [perf-h, perf-c, perf]}
    - {branch: 3fs, feats: {Person: '3', Gender: Fem, Number: Sing}, add: "ـ\u05B8ה", stem: [perf-3fs, perf-v, perf]}
    - {branch: 3cp, feats: {Person: '3', Number: Plur}, add: "ـו\u05BC", stem: [perf-v, perf]}
    - {branch: 3ms, feats: {Person: '3'}, add: ""}
  - prefix:
    - {branch: vav, add: "ו\u05B0"}
- id: 'rule:hbo-qatal'  # the perfect (JM § 42, p. 120ff; P2 p. 620)
  when: {pos: VERB, feats: {Aspect: Perf}}
  stem: perf
  blocks:
  - suffix:
    - {branch: 1cs, feats: {Person: '1', Number: Sing}, add: "ת\u05B4י", stem: [perf-c, perf]}
    - {branch: 1cp, feats: {Person: '1', Number: Plur}, add: "נו\u05BC", stem: [perf-c, perf]}
    - {branch: 2ms, feats: {Person: '2', Gender: Masc, Number: Sing}, add: "ת\u05B8", stem: [perf-c, perf]}
    - {branch: 2fs, feats: {Person: '2', Gender: Fem, Number: Sing}, add: "ת", stem: [perf-c, perf]}
    - {branch: 2mp, feats: {Person: '2', Gender: Masc, Number: Plur}, add: "ת\u05B6ם", stem: [perf-h, perf-c, perf]}
    - {branch: 2fp, feats: {Person: '2', Gender: Fem, Number: Plur}, add: "ת\u05B6ן", stem: [perf-h, perf-c, perf]}
    - {branch: 3fs, feats: {Person: '3', Gender: Fem, Number: Sing}, add: "ـ\u05B8ה", stem: [perf-3fs, perf-v, perf]}
    - {branch: 3cp, feats: {Person: '3', Number: Plur}, add: "ـו\u05BC", stem: [perf-v, perf]}
    - {branch: 3ms, feats: {Person: '3'}, add: ""}
- id: 'rule:hbo-yiqtol'  # the imperfect, indicative (JM § 44, p. 124; P2 p. 620); the jussive and cohortative cells name no person
  when: {pos: VERB, feats: {Aspect: Imp, Mood: Ind}}
  stem: impf
  blocks:
  - prefix:
    - {branch: 1s, feats: {Person: '1', Number: Sing}, add: "א"}
    - {branch: 1p, feats: {Person: '1', Number: Plur}, add: "נ"}
    - {branch: 3fs, feats: {Person: '3', Gender: Fem, Number: Sing}, add: "ת"}
    - {branch: 3fp, feats: {Person: '3', Gender: Fem, Number: Plur}, add: "ת"}
    - {branch: '2', feats: {Person: '2'}, add: "ת"}
    - {branch: '3', feats: {Person: '3'}, add: "י"}
  - suffix:
    - {branch: 2fs, feats: {Person: '2', Gender: Fem, Number: Sing}, add: "ـ\u05B4י", stem: [impf-v, impf]}
    - {branch: mp, feats: {Gender: Masc, Number: Plur}, add: "ـו\u05BC", stem: [impf-v, impf]}
    - {branch: fp, feats: {Gender: Fem, Number: Plur}, add: "נ\u05B8ה", stem: [impf]}
- id: 'rule:hbo-imperative'  # JM § 48, pp. 130-132
  when: {pos: VERB, feats: {Mood: Imp}}
  stem: impv
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "ـ\u05B4י", stem: [impv-v, impv]}
    - {branch: mp, feats: {Gender: Masc, Number: Plur}, add: "ـו\u05BC", stem: [impv-v, impv]}
    - {branch: fp, feats: {Gender: Fem, Number: Plur}, add: "נ\u05B8ה", stem: [impv]}
    - {branch: ms, add: ""}
- id: 'rule:hbo-construct'  # a construct singular that is the absolute (JM § 92); bound by a maqaf, rule:hbo-maqaf shortens it (כָּל־, בֶּן־)
  when: {pos: NOUN, class: construct-same, feats: {Definite: Cons}}
  blocks:
  - suffix:
    - {branch: same, feats: {Number: Sing}, add: ""}
- id: 'rule:hbo-adjective'  # an adjective's feminine and plurals where its stem keeps its vowels (טוֹב: JM § 89)
  when: {pos: ADJ}
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "ـ\u05B8ה"}
    - {branch: mp, feats: {Gender: Masc, Number: Plur}, add: "ـ\u05B4ים"}
    - {branch: fp, feats: {Gender: Fem, Number: Plur}, add: "ـו\u05B9ת"}
# Rewrites, in order, each once over the whole token (docs/rules-design.md, section 2).
phonology:
# The prefix conjugation's 1st person singular: א with segol where the others have hiriq, with hataf patah where they
# have shewa (JM § 44, p. 124; P2 p. 620; § 52 for the piel).
- {id: 'rule:hbo-prefix-alef', branch: qal, find: "א\u05B4+", after: ["#", "#ו{FULL}+"], before: "{NY}*", to: "א\u05B6+"}  # אֶשְׁמַע, אֶתֵּן
- {id: 'rule:hbo-prefix-alef', branch: shewa, find: "א\u05B0+", to: "א\u05B2+"}  # אֲבָרֵךְ
# The prefix's alef takes the first radical's quiescent alef (JM § 73f): אֹמַר, אֹכַל
- {id: 'rule:hbo-quiescent-alef', find: "א\u05B9+א", to: "א\u05B9+"}
# wayyiqtol (JM § 47, pp. 128-130): the prefix doubled after וַ, but a yod with shewa (וַיְדַבֵּר); before א, וָ.
- {id: 'rule:hbo-wayyiqtol', branch: double, when: {feats: {Tense: Past}}, find: "ו\u05B7+{TN}{ANYV}", to: "ו\u05B7+{TN}\u05BC"}
- {id: 'rule:hbo-wayyiqtol', branch: double, when: {feats: {Tense: Past}}, find: "ו\u05B7+{Y}{FULL}", to: "ו\u05B7+{Y}\u05BC"}
- {id: 'rule:hbo-wayyiqtol', branch: alef, when: {feats: {Tense: Past}}, find: "ו\u05B7+", before: "א*", to: "ו\u05B8+"}
# The article (JM § 35, p. 102): the next letter doubled; before א ע ר, which do not double, הָ.
- {id: 'rule:hbo-article', branch: double, find: "ה\u05B7+{NG}*", after: ["#", "#{L}*+", "#{L}*+{L}*+"], to: "ה\u05B7+{NG}\u05BC"}
- {id: 'rule:hbo-article', branch: alef, find: "ה\u05B7+", before: "{AER}*", to: "ה\u05B8+"}
# The interrogative הֲ before a guttural: הַ (JM § 102l-o)
- {id: 'rule:hbo-interrogative', find: "ה\u05B2+", after: ["#", "#{L}*+"], before: "{G}*", to: "ה\u05B7+"}
# The relative שֶׁ: the next letter doubled (JM § 38)
- {id: 'rule:hbo-relative', find: "ש\u05B6\u05C1+{NG}*", after: ["#", "#{L}*+"], to: "ש\u05B6\u05C1+{NG}\u05BC"}
# A noun whose first vowel lengthens after the article (JM § 35f; stated per noun: qamets-after-article)
- {id: 'rule:hbo-article', branch: qamets, when: {class: qamets-after-article}, find: "ה{ANYV}+{L}{SEG}", to: "ה{ANYV}+{L}\u05B8"}
- {id: 'rule:hbo-article', branch: qamets, when: {class: qamets-after-article}, find: "ה{ANYV}+{L}{PAT}", to: "ה{ANYV}+{L}\u05B8"}
# Before ח with qamets and ה with an unstressed qamets, הֶ (הֶחָי, הֶהָרִים); before the stressed הָ of a
# monosyllable, הָ (הָהָר: JM § 35, p. 102). Stress is read off the shape: REVIEW.
- {id: 'rule:hbo-article', branch: he, find: "ה\u05B7+", after: ["#", "#{L}*+"], before: ["ח{QAM}", "ה{QAM}{L}{ANYV}{L}"], to: "ה\u05B6+"}
- {id: 'rule:hbo-article', branch: stressed, find: "ה\u05B7+", after: ["#", "#{L}*+"], before: "ה{QAM}", to: "ה\u05B8+"}
# בְּ כְּ לְ before the article: the article's ה goes and they take its vowel (JM § 35e)
- {id: 'rule:hbo-preposition', branch: article, find: "{BKL}\u05B0+ה{ANYV}+", to: "{BKL}{ANYV}+"}
# The quiescent alef of אֱלֹהִים and אֱמֹר after a prefix (JM § 24, 73f): לֵאלֹהִים, וֵאלֹהֵי, לֵאמֹר
- {id: 'rule:hbo-quiescent-alef', branch: prefix, when: {class: alef-quiescent}, find: "{L}\u05B0+א\u05B1", to: "{L}\u05B5+א"}
- {id: 'rule:hbo-quiescent-alef', branch: prefix, when: {class: alef-quiescent-verb}, find: "{L}\u05B0+א\u05B1", to: "{L}\u05B5+א"}
# A prefix before יְהוָה takes the vowel it would before its qere, אֲדֹנָי; the yod has no shewa (ADR 0084)
- {id: 'rule:hbo-qere', when: {class: qere-adonay}, find: "{L}\u05B0+י\u05B0", to: "{L}\u05B7+י"}
- {id: 'rule:hbo-qere', when: {class: qere-adonay}, find: "מ\u05B4+י\u05B0", to: "מ\u05B5+י"}
# וְ (JM § 104c-d, p. 319): וּ before ב מ פ and a shewa; before יְ, וִי; before a hataf, its vowel.
- {id: 'rule:hbo-conjunction', branch: yod, find: "ו\u05B0+י\u05B0", to: "ו\u05B4+י"}
- {id: 'rule:hbo-conjunction', branch: he, find: "ו\u05B0+", before: "ה{SHV}", to: "ו\u05B6+"}
- {id: 'rule:hbo-conjunction', branch: shureq, find: "ו\u05B0+", before: ["{LAB}*", "{L}{SHV}"], to: "ו\u05BC+"}
- {id: 'rule:hbo-conjunction', branch: hataf, find: "ו\u05B0+", before: "{L}{HPA}", to: "ו\u05B7+"}
- {id: 'rule:hbo-conjunction', branch: hataf, find: "ו\u05B0+", before: "{L}{HSE}", to: "ו\u05B6+"}
- {id: 'rule:hbo-conjunction', branch: hataf, find: "ו\u05B0+", before: "{L}{HQA}", to: "ו\u05B8+"}
# בְּ כְּ לְ (JM § 103b): before יְ, hiriq and the yod's shewa goes; before a shewa, hiriq; before a hataf, its vowel.
- {id: 'rule:hbo-preposition', branch: yod, find: "{BKL}\u05B0+י\u05B0", to: "{BKL}\u05B4+י"}
- {id: 'rule:hbo-preposition', branch: shewa, find: "{BKL}\u05B0+", before: "{L}{SHV}", to: "{BKL}\u05B4+"}
- {id: 'rule:hbo-preposition', branch: hataf, find: "{BKL}\u05B0+", before: "{L}{HPA}", to: "{BKL}\u05B7+"}
- {id: 'rule:hbo-preposition', branch: hataf, find: "{BKL}\u05B0+", before: "{L}{HSE}", to: "{BKL}\u05B6+"}
- {id: 'rule:hbo-preposition', branch: hataf, find: "{BKL}\u05B0+", before: "{L}{HQA}", to: "{BKL}\u05B8+"}
# מִן joined to its word: the next letter doubled (מִפְּנֵי); before a guttural or ר, מֵ (its allomorph) (JM § 103c-d)
- {id: 'rule:hbo-min', find: "מ\u05B4+{NG}*", after: ["#", "#{L}*+"], to: "מ\u05B4+{NG}\u05BC"}
# A begadkefat after a silent shewa (after a short vowel) has its dagesh lene: יִשְׁכַּב, שָׁמַרְתָּ, לִשְׁתּוֹת (JM § 19);
# in a verb only (a noun's form writes its own)
- {id: 'rule:hbo-dagesh-lene', when: {pos: VERB}, find: "{BGD}*", after: [".{SHORT}{L}{SHVND}+", ".{SHORT}+{L}{SHVND}"], to: "{BGD}\u05BC"}
# and inside a perfect's stem (הִבְדִּיל, נִקְבַּר, נֶחְבָּא); never in a qal imperative's, whose shewa stood for a vowel (שִׁכְבִי: JM § 8e)
- {id: 'rule:hbo-dagesh-lene', when: {pos: VERB, feats: {Aspect: Perf}}, find: "{BGD}*", after: ".{SHORT}{L}{SHVND}", to: "{BGD}\u05BC"}
# A guttural before the 2fs -t takes a helping patah, the -t its shewa (יָדַעַתְּ: JM § 70)
- {id: 'rule:hbo-guttural', branch: helping-vowel, when: {feats: {Person: '2', Gender: Fem, Number: Sing}}, find: "{GF}{SHV}+{T}*", at: end, to: "{GF}\u05B7+{T}\u05B0\u05BC"}
# The energic nun of a stem before a suffix goes into the suffix's ך (JM § 61f: אַרְאֶךָּ, יְחֻנֶּךָּ)
- {id: 'rule:hbo-energic', when: {pos: VERB}, find: "{N}{SHV}+ך\u05B8", to: "+ך\u05B8\u05BC"}
# A third radical nun goes into the ending's ת (JM § 72, נָתַתָּ)
- {id: 'rule:hbo-assimilation', when: {pos: VERB}, find: "{N}\u05B0+{T}*", to: "+{T}\u05BC"}
# Bound to the next word by a maqaf, a last syllable's tsere is segol (JM § 13; אֶת־, אֶל־, לֶךְ־)
- {id: 'rule:hbo-maqaf', branch: tsere, when: {context: bound}, find: "{L}{TSE}{CLOSE}", at: end, to: "{L}\u05B6{CLOSE}"}
- {id: 'rule:hbo-maqaf', branch: holem, when: {context: bound}, find: "{L}{HOL}{CLOSE}", at: end, to: "{L}\u05B8{CLOSE}"}  # כָּל־ (qamets qatan)
