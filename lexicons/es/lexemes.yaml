- id: lexeme:querido
  pos: ADJ
  gloss: {en: dear; beloved}
  notes: {en: 'How a letter opens: Querida tía (to a woman), Querido Yunior (to a man). In Spanish a colon follows, not a comma: Querida tía: … From querer, to love.'}
  form: querido
  spelled: {es-Latn/standard: [querido]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [querida]}, status: pinned}
- id: lexeme:quien
  pos: PRON
  feats: {PronType: Rel}
  gloss: {en: 'who; whom (relative: la tía con quien vivo)'}
  notes: {en: 'No accent when it joins; ¿quién?, with one, asks. Use it after a preposition (con quien, a quien, de quien) or between commas. Right after a noun Spanish uses que: la tía que vive en La Habana, not la tía quien vive, a common slip from English who.'}
  form: quien
  spelled: {es-Latn/standard: [quien]}
- id: lexeme:quimbumbia
  pos: NOUN
  gloss: {en: 'quimbumbia, a Cuban stick game (tipcat)'}
  notes: {en: 'Played with two sticks: a short one, pointed at both ends, is struck on its tip so it jumps up, then batted as far as it will go. A game of Cuban streets and yards from before video games.'}
  form: quimbumbia
  spelled: {es-Latn/standard: [quimbumbia]}
- id: lexeme:quince
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: fifteen}
  notes: {en: 'Y quince, or y cuarto: a quarter past. Los quince is a girl''s fifteenth-birthday party, the Cuban quinceañera.'}
  form: quince
  spelled: {es-Latn/standard: [quince]}
- id: lexeme:quinceañera
  pos: NOUN
  gloss: {en: quinceañera (a girl turning fifteen)}
  notes: {en: 'Quince + año, with ñ. In Cuba la quinceañera is the girl, and the party is los quince or la fiesta de quince: a big dance, photos and a gown.'}
  form: quinceañera
  spelled: {es-Latn/standard: [quinceañera]}
- id: lexeme:quién
  pos: PRON
  feats: {PronType: Int}
  gloss: {en: who}
  notes: {en: 'With the accent when it asks: ¿Quién es? Who is it? For more than one person: ¿quiénes?'}
  form: quién
  spelled: {es-Latn/standard: [quién]}
- id: lexeme:qué
  pos: PRON
  feats: {PronType: Int}
  gloss: {en: what; how (¡qué…!)}
  notes: {en: '¡Qué calor!: it''s so hot! ¿Qué…? asks what. Written with the accent in both.'}
  form: qué
  spelled: {es-Latn/standard: [qué]}
- id: lexeme:qué-bolá
  pos: INTJ
  gloss: {en: 'what''s up? (Cuban)'}
  notes: {en: 'The Cuban greeting among friends and family; also written ¿qué volá? Not for elders you don''t know.'}
  form: qué bolá
  spelled: {es-Latn/standard: [qué bolá]}
- id: lexeme:raíz
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: root}
  notes: {en: 'Plural raíces: z becomes c before e, and both keep the accent on the í. Mis raíces están en Cuba: my roots are in Cuba.'}
  form: raíz
  spelled: {es-Latn/standard: [raíz]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [raíces]}, status: pinned}
- id: lexeme:realizar
  pos: VERB
  gloss: {en: to carry out; to hold; to make come true}
  notes: {en: 'A formal verb: realizar una entrevista, to hold an interview; realizar un sueño, to make a dream come true. It never means to realize: that is darse cuenta. Realicé, with c before e.'}
  form: realizar
  spelled: {es-Latn/standard: [realizar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [realiza]}, status: pinned}
- id: lexeme:recarga
  pos: NOUN
  gloss: {en: top-up; phone credit}
  notes: {en: 'Families abroad send recargas to relatives'' phones in Cuba, above all when ETECSA offers double credit. Recargar: to top up; to recharge.'}
  form: recarga
  spelled: {es-Latn/standard: [recarga]}
- id: lexeme:receta
  pos: NOUN
  gloss: {en: prescription; recipe}
  notes: {en: 'Both the doctor''s prescription and Abuela''s recipe for flan. Sin receta: over the counter.'}
  form: receta
  spelled: {es-Latn/standard: [receta]}
- id: lexeme:recibir
  pos: VERB
  gloss: {en: to receive; to get}
  notes: {en: 'With c and b: re-ci-bir, like every verb in -bir but hervir, servir and vivir. Recibí: I received; recibió: she received.'}
  form: recibir
  spelled: {es-Latn/standard: [recibir]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [recibí]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [recibió]}, status: pinned}
- id: lexeme:reclamar
  pos: VERB
  gloss: {en: to claim; to demand; (Cuban American) to petition for a relative to immigrate}
  notes: {en: 'In Miami reclamar a alguien is to file the papers for a relative in Cuba to come (la reclamación): Abuela reclamó a Marisol. Elsewhere reclamar is to complain or to claim: reclamar el equipaje.'}
  form: reclamar
  spelled: {es-Latn/standard: [reclamar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [reclamó]}, status: pinned}
- id: lexeme:recordar
  pos: VERB
  classes: [o-ue]
  gloss: {en: to remember; to remind}
  notes: {en: 'O becomes ue: recuerdo, recuerdas. Recordar algo, or acordarse de algo: to remember it (me acuerdo de Cuba). Recordarle algo a alguien: to remind someone of it. Un recuerdo: a memory; a keepsake.'}
  form: recordar
  spelled: {es-Latn/standard: [recordar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [recordamos]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [recuerdo]}, status: pinned}
- id: lexeme:refrán
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: saying; proverb}
  notes: {en: 'Refrán has an accent; the plural refranes does not. Un dicho says the same: como dice el dicho, as the saying goes. Cuban grandmothers end arguments with them, and a heritage speaker often knows the first half and not the second.'}
  form: refrán
  spelled: {es-Latn/standard: [refrán]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [refranes]}, status: pinned}
- id: lexeme:regalo
  pos: NOUN
  gloss: {en: present; gift}
  notes: {en: 'Regalar: to give as a present. A present is un regalo, never un presente, which is the present time.'}
  form: regalo
  spelled: {es-Latn/standard: [regalo]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [regalos]}, status: pinned}
- id: lexeme:respeto
  pos: NOUN
  gloss: {en: respect}
  notes: {en: Con respeto; con todo respeto. ¡Más respeto! is what an abuela says when you answer back. The verb is respetar.}
  form: respeto
  spelled: {es-Latn/standard: [respeto]}
- id: lexeme:reunirse
  pos: VERB
  classes: [hiatus]
  gloss: {en: to get together; to be reunited}
  notes: {en: 'Reunirse con alguien: to get together with someone. Reúne and reúnen carry an accent on the ú. Una reunión: a gathering or a meeting.'}
  form: reunir+se
  spelled: {es-Latn/standard: [reunirse]}
