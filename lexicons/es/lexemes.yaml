- id: lexeme:factoría
  pos: NOUN
  gloss: {en: factory (Miami Spanish)}
  notes: {en: 'Miami Spanish, from English factory; in Cuba and the rest of the Spanish-speaking world, una fábrica. Many exiles started out in the garment factories of Hialeah.'}
  form: factoría
  spelled: {es-Latn/standard: [factoría]}
- id: lexeme:familia
  pos: NOUN
  gloss: {en: family}
  notes: {en: 'La familia, mi familia. Relatives are familiares or parientes.'}
  form: familia
  spelled: {es-Latn/standard: [familia]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [familias]}, status: pinned}
- id: lexeme:farmacia
  pos: NOUN
  gloss: {en: pharmacy; drugstore}
  notes: {en: 'Written with f, never ph. Families in Miami send medicines from the farmacia to relatives in Cuba.'}
  form: farmacia
  spelled: {es-Latn/standard: [farmacia]}
- id: lexeme:fascinar
  pos: VERB
  gloss: {en: 'to fascinate; me fascina: I love it'}
  notes: {en: 'Like gustar: me fascina el danzón, me fascinan los discos. Stronger still than encantar. With sc: fas-ci-nar.'}
  form: fascinar
  spelled: {es-Latn/standard: [fascinar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [fascinan]}, status: pinned}
