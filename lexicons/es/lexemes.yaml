- id: lexeme:tocar
  pos: VERB
  gloss: {en: to play (an instrument); to touch}
  notes: {en: 'You play an instrument with tocar: tocar el bongó, tocar la guitarra. Jugar is for games and sports (jugar dominó, jugar pelota); jugar el piano is English in Spanish words. Toqué, with qu: I played.'}
  form: tocar
  spelled: {es-Latn/standard: [tocar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [toco]}, status: pinned}
