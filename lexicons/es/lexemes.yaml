- id: lexeme:verano
  pos: NOUN
  gloss: {en: summer}
  notes: {en: 'With v. Cuba''s hot, rainy season runs from May to October. En el verano: in (the) summer.'}
  form: verano
  spelled: {es-Latn/standard: [verano]}
- id: lexeme:verdad
  pos: NOUN
  gloss: {en: 'truth; ¿verdad?: right?'}
  notes: {en: 'Decir la verdad: to tell the truth. ¿Verdad? at the end of a sentence asks for agreement: right?, isn''t it? De verdad: really. Written with v and a final d that Cubans barely say (verdá).'}
  form: verdad
  spelled: {es-Latn/standard: [verdad]}
- id: lexeme:verso
  pos: NOUN
  gloss: {en: 'line (of a poem); los versos: poems, poetry'}
  notes: {en: 'Un verso is one line of a poem; a stanza is una estrofa. Los versos is also poetry in general: los versos de Martí. With v. The Versos sencillos have eight syllables a line, the meter of the décima and of Cuban country song.'}
  form: verso
  spelled: {es-Latn/standard: [verso]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [versos]}, status: pinned}
- id: lexeme:vez
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: 'time (an occasion); una vez: once'}
  notes: {en: 'La primera vez: the first time. The plural is veces, with c. Clock time is la hora, and time that passes is el tiempo.'}
  form: vez
  spelled: {es-Latn/standard: [vez]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [veces]}, status: pinned}
- id: lexeme:viajar
  pos: VERB
  gloss: {en: to travel}
  notes: {en: 'Viajar a Cuba, or just ir a Cuba. Spelled with j, like el viaje.'}
  form: viajar
  spelled: {es-Latn/standard: [viajar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Fut, VerbForm: Fin}, spelled: {es-Latn/standard: [viajaremos]}, status: pinned}
- id: lexeme:viaje
  pos: NOUN
  gloss: {en: trip; journey}
  notes: {en: '¡Buen viaje!: have a good trip. To take a trip is hacer un viaje; tomar un viaje is English in Spanish words.'}
  form: viaje
  spelled: {es-Latn/standard: [viaje]}
- id: lexeme:vida
  pos: NOUN
  gloss: {en: 'life; mi vida: my darling'}
  notes: {en: 'Mi vida, mi amor, mi cielo: what Cuban grandmothers call everyone.'}
  form: vida
  spelled: {es-Latn/standard: [vida]}
- id: lexeme:videollamada
  pos: NOUN
  gloss: {en: video call}
  notes: {en: 'One word: video + llamada. Hacer una videollamada. Cuban families talk over WhatsApp, or over IMO, the app many Cubans used first.'}
  form: videollamada
  spelled: {es-Latn/standard: [videollamada]}
- id: lexeme:viejo
  pos: ADJ
  gloss: {en: 'old; old man (los viejos: old folks)'}
  notes: {en: 'In Cuba mis viejos is my parents, said with love, and mi vieja my mom (or my wife). For people, mayor is the polite word: una señora mayor.'}
  form: viejo
  spelled: {es-Latn/standard: [viejo]}
