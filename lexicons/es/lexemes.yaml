- id: lexeme:terminar
  pos: VERB
  gloss: {en: to finish; to end}
  notes: {en: 'Terminar la universidad, or terminar la carrera: to finish college. Terminar con alguien: to break up with someone.'}
  form: terminar
  spelled: {es-Latn/standard: [terminar]}
  forms:
  - {feats: {Mood: Sub, Number: Sing, Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [termine]}, status: pinned}
- id: lexeme:ti
  pos: PRON
  feats: {PronType: Prs}
  gloss: {en: 'you (after a preposition: para ti, a ti)'}
  notes: {en: 'Never with an accent, though many write tí: ti has no twin to be told apart from, unlike mí (me) and mi (my). With con it becomes contigo.'}
  form: ti
  spelled: {es-Latn/standard: [ti]}
- id: lexeme:tiempo
  pos: NOUN
  gloss: {en: weather; time}
  notes: {en: '¿Qué tiempo hace?: what''s the weather like? Also time: no tengo tiempo, I have no time.'}
  form: tiempo
  spelled: {es-Latn/standard: [tiempo]}
- id: lexeme:tienda
  pos: NOUN
  gloss: {en: store; shop}
  notes: {en: 'Any store or shop: una tienda de ropa, a clothes shop. In Spanglish you may also hear el store.'}
  form: tienda
  spelled: {es-Latn/standard: [tienda]}
- id: lexeme:tierra
  pos: NOUN
  gloss: {en: 'land; earth; mi tierra: my homeland'}
  notes: {en: 'Mi tierra: my homeland, where I come from; Cubans abroad say it of the island (volver a mi tierra), as in Gloria Estefan''s Mi tierra (1993). La tierra is also soil and the ground; the planet is la Tierra.'}
  form: tierra
  spelled: {es-Latn/standard: [tierra]}
- id: lexeme:tilde
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: 'written accent mark (á, é, í, ó, ú)'}
  notes: {en: 'La tilde is the mark you write; el acento is the stress you hear. Every word has a stressed syllable, but only some write it: those stressed on the last syllable that end in a vowel, n or s (café, llegó, avión); those stressed on the one before that end in anything else (fácil, lápiz); and every word stressed earlier (teléfono, sábado). Short words write one to tell twins apart: tú/tu, él/el, sí/si, mí/mi, té/te, sé/se, más/mas, dé/de.'}
  form: tilde
  spelled: {es-Latn/standard: [tilde]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [tildes]}, status: pinned}
- id: lexeme:tilo
  pos: NOUN
  gloss: {en: linden tea (for the nerves)}
  notes: {en: 'The Cuban remedy for nerves: bad news, a scare or a family fight, and someone runs to make un tilo. ¡Tómate un tilo!: calm down!'}
  form: tilo
  spelled: {es-Latn/standard: [tilo]}
- id: lexeme:tirar
  pos: VERB
  gloss: {en: to throw; to throw out}
  notes: {en: 'At midnight on New Year''s Eve many Cubans throw a bucket of water out of the house: out goes the bad of the old year. Others walk round the block with a suitcase, for a year of travel.'}
  form: tirar
  spelled: {es-Latn/standard: [tirar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, spelled: {es-Latn/standard: [tírame]}, status: pinned}
