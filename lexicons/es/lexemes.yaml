# The lexicon of es (schemas/lexicon.schema.json): every lexeme, sorted by id.
language: es
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@1ebc6e7db77a', status: draft}
lexemes:
- id: lexeme:a
  pos: ADP
  gloss: {en: to; at}
  notes: {en: 'A las dos: at two o''clock. ¿A qué hora?: at what time? ¡A comer!: let''s eat!'}
  form: a
  spelled: {es-Latn/standard: [a]}
- id: lexeme:a-pesar-de
  pos: ADP
  gloss: {en: 'despite; in spite of (a pesar de que: even though)'}
  notes: {en: 'A pesar de + a noun or an infinitive: a pesar del calor, a pesar de trabajar tanto. A pesar de que + a verb: a pesar de que trabajaba mucho. Keep the de before que.'}
  form: a pesar de
  spelled: {es-Latn/standard: [a pesar de]}
- id: lexeme:abrazo
  pos: NOUN
  gloss: {en: hug; embrace}
  notes: {en: 'With b and z. Un abrazo, or un abrazo fuerte, closes letters and messages between family and friends.'}
  form: abrazo
  spelled: {es-Latn/standard: [abrazo]}
- id: lexeme:abrir
  pos: VERB
  gloss: {en: to open}
  notes: {en: 'Abre (tú), abra (usted), no abras. Never open an olla de presión until it stops hissing.'}
  form: abrir
  spelled: {es-Latn/standard: [abrir]}
  forms:
  - {feats: {Mood: Cnd, Number: Plur, Person: '1', VerbForm: Fin}, spelled: {es-Latn/standard: [abriríamos]}, status: pinned}
  - {feats: {Mood: Cnd, Number: Sing, VerbForm: Fin}, spelled: {es-Latn/standard: [abriría]}, status: pinned}
  - {feats: {Mood: Imp, Number: Sing, Person: '2', Polarity: Neg, VerbForm: Fin}, spelled: {es-Latn/standard: [abras]}, status: pinned}
  - {feats: {Mood: Imp, Number: Sing, Polarity: Neg, VerbForm: Fin}, spelled: {es-Latn/standard: [abra]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [abrí]}, status: pinned}
  - {feats: {Mood: Sub, Number: Plur, Person: '1', Tense: Imp, VerbForm: Fin}, spelled: {es-Latn/standard: [abriéramos]}, status: pinned}
  - {feats: {Tense: Past, VerbForm: Part}, stem: abiert, status: listed, statement: {author: 'llm:claude@rules-es', status: draft}}
- id: lexeme:abuela
  pos: NOUN
  gloss: {en: grandmother; grandma}
  form: abuela
  spelled: {es-Latn/standard: [abuela]}
- id: lexeme:abuelo
  pos: NOUN
  gloss: {en: grandfather; grandpa}
  notes: {en: 'Los abuelos: the grandparents, grandma and grandpa. Abuelito and abuelita are the loving forms.'}
  form: abuelo
  spelled: {es-Latn/standard: [abuelo]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [abuelos]}, status: pinned}
- id: lexeme:aceite
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: oil}
  notes: {en: 'Aceite de oliva: olive oil. Abuela''s mother fried in manteca (lard).'}
  form: aceite
  spelled: {es-Latn/standard: [aceite]}
- id: lexeme:aconsejar
  pos: VERB
  gloss: {en: to advise}
  notes: {en: 'Te aconsejo que + subjunctive: I advise you to. To an elder, with usted: le aconsejo que descanse. Spelled with c and j: a-con-se-jar.'}
  form: aconsejar
  spelled: {es-Latn/standard: [aconsejar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [aconsejo]}, status: pinned}
- id: lexeme:acostarse
  pos: VERB
  classes: [o-ue]
  gloss: {en: to go to bed; to lie down}
  notes: {en: 'The o becomes ue when stressed: me acuesto, te acuestas, se acuesta.'}
  form: acostar+se
  spelled: {es-Latn/standard: [acostarse]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Imp, VerbForm: Fin}, spelled: {es-Latn/standard: [acostábamos]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [acuesto]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [acuesta]}, status: pinned}
- id: lexeme:además
  pos: ADV
  gloss: {en: besides; also; in addition}
  notes: {en: 'With an accent on the last syllable: a-de-más. Además de: as well as (además de cocinar, cosía). In a speech it adds one more point.'}
  form: además
  spelled: {es-Latn/standard: [además]}
- id: lexeme:adiós
  pos: INTJ
  gloss: {en: goodbye; bye}
  notes: {en: 'Among friends Cubans also say chao, or nos vemos.'}
  form: adiós
  spelled: {es-Latn/standard: [adiós]}
- id: lexeme:aeropuerto
  pos: NOUN
  gloss: {en: airport}
  notes: {en: 'Flights from Miami to Havana land at the José Martí airport, in Boyeros.'}
  form: aeropuerto
  spelled: {es-Latn/standard: [aeropuerto]}
- id: lexeme:agradecer
  pos: VERB
  classes: [zco]
  gloss: {en: to thank; to be grateful for}
  notes: {en: 'Le agradezco su ayuda: I thank you for your help (in careful Spanish, no por before what you are grateful for). Les agradezco que estén aquí, with the subjunctive. Agradezco has zc, like conozco. Everyday: darle las gracias a alguien.'}
  form: agradecer
  spelled: {es-Latn/standard: [agradecer]}
  forms:
  - {feats: {Gender: Fem, Number: Sing, Tense: Past, VerbForm: Part}, spelled: {es-Latn/standard: [agradecida]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [agradezco]}, status: pinned}
- id: lexeme:agromercado
  pos: NOUN
  gloss: {en: farmers' market (Cuba)}
  notes: {en: 'Cuba''s farmers'' markets, where prices follow supply and demand. Everyone says el agro. Bring your own jaba.'}
  form: agromercado
  spelled: {es-Latn/standard: [agromercado, agro]}
- id: lexeme:agua
  pos: NOUN
  gloss: {en: water}
  notes: {en: 'Feminine, but el agua: el comes before a stressed a-, as in el hambre. Agua fría: cold water.'}
  form: agua
  spelled: {es-Latn/standard: [agua]}
- id: lexeme:ahora
  pos: ADV
  gloss: {en: now}
  notes: {en: 'Cubans also say ahorita, which can mean right now or in a little while, depending on who says it.'}
  form: ahora
  spelled: {es-Latn/standard: [ahora]}
- id: lexeme:ahorrar
  pos: VERB
  gloss: {en: 'to save (money, time)'}
  notes: {en: 'Ahorrar dinero. With h and rr: a-ho-rrar. Salvar is to save a life or to rescue, never money: salvar dinero is an anglicism.'}
  form: ahorrar
  spelled: {es-Latn/standard: [ahorrar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, spelled: {es-Latn/standard: [ahorra]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [ahorras]}, status: pinned}
  - {feats: {Mood: Sub, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [ahorres]}, status: pinned}
- id: lexeme:ahí
  pos: ADV
  feats: {PronType: Dem}
  gloss: {en: there; over there}
  notes: {en: 'Two syllables, a-hí, with a silent h and an accent on the í. Not hay (there is) or ¡ay! (oh!), though texts often write all three as ai. Allí and allá also mean there.'}
  form: ahí
  spelled: {es-Latn/standard: [ahí]}
- id: lexeme:aire
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: 'air; estar en el aire: to be lost, not to get it (Cuban)'}
  notes: {en: 'Cubans in Miami say el aire for the air conditioning (el aire acondicionado). Estar en el aire, Cuban: to have no idea what is going on; elsewhere a plan that is en el aire is up in the air.'}
  form: aire
  spelled: {es-Latn/standard: [aire]}
- id: lexeme:ajo
  pos: NOUN
  gloss: {en: garlic}
  notes: {en: 'Un diente de ajo: a clove of garlic. With j. Cuban cooking runs on it: mojo, sofrito, frijoles.'}
  form: ajo
  spelled: {es-Latn/standard: [ajo]}
- id: lexeme:ají
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: sweet pepper; bell pepper (Cuban)}
  notes: {en: 'In Cuba ají is the sweet pepper (the little ají cachucha is the soul of a sofrito); a hot one is ají picante. Pimiento elsewhere. Plural: ajíes.'}
  form: ají
  spelled: {es-Latn/standard: [ají]}
- id: lexeme:al
  pos: ADP
  gloss: {en: to the; at the (a + el)}
  notes: {en: 'A + el always becomes al: al lado, al patio. Not before la: a la cocina.'}
  form: al
  spelled: {es-Latn/standard: [al]}
- id: lexeme:alegrar
  pos: VERB
  gloss: {en: 'to make happy; me alegra que…: I''m glad that…'}
  notes: {en: 'Like gustar: in me alegra que estés bien, what pleases is the subject. Me alegro de que estés bien says the same. Both take the subjunctive.'}
  form: alegrar
  spelled: {es-Latn/standard: [alegrar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [alegra]}, status: pinned}
- id: lexeme:alfombra
  pos: NOUN
  gloss: {en: carpet; rug}
  notes: {en: 'La alfombra: a carpet or a rug. With f, never ph. In Miami many say la carpeta, from English carpet; in Spanish una carpeta is a folder.'}
  form: alfombra
  spelled: {es-Latn/standard: [alfombra]}
- id: lexeme:allá
  pos: ADV
  feats: {PronType: Dem}
  gloss: {en: there; over there}
  notes: {en: 'Farther away than ahí. In a Cuban family in Miami, allá often just means Cuba: ¿Cómo está la cosa allá? With an accent, like aquí, ahí and acá.'}
  form: allá
  spelled: {es-Latn/standard: [allá]}
- id: lexeme:alma
  pos: NOUN
  gloss: {en: soul}
  notes: {en: 'Feminine, but el alma and un alma, because it begins with a stressed a (like el agua): el alma cubana, las almas. Con el alma: with all my heart. Me llegó al alma: it moved me deeply.'}
  form: alma
  spelled: {es-Latn/standard: [alma]}
- id: lexeme:almendrón
  pos: NOUN
  gloss: {en: 'almendrón: an old American car used as a shared taxi (Cuban)'}
  notes: {en: 'A 1940s or 1950s Chevrolet, Ford or Buick kept running for decades with parts from anything, used as a taxi de ruta that picks people up and drops them off along a fixed route. Named for its almond (almendra) shape. With an accent; almendrones without. Also just una máquina or un carro.'}
  form: almendrón
  spelled: {es-Latn/standard: [almendrón]}
- id: lexeme:alto
  pos: ADJ
  gloss: {en: high; tall; loud}
  notes: {en: 'Alta with feminine nouns: la presión alta. Daniel es alto: Daniel is tall. Hablar alto: to talk loudly.'}
  form: alto
  spelled: {es-Latn/standard: [alto]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [alta]}, status: pinned}
- id: lexeme:amable
  pos: ADJ
  gloss: {en: kind; nice}
  notes: {en: 'Muy amable, or es usted muy amable: how kind of you. One form for men and women.'}
  form: amable
  spelled: {es-Latn/standard: [amable]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [amable]}, status: pinned}
- id: lexeme:amanecer
  pos: VERB
  classes: [zco]
  gloss: {en: to wake up; to dawn}
  notes: {en: '¿Cómo amaneció? (usted) or ¿Cómo amaneciste? (tú): how are you this morning? A Cuban morning greeting, above all to elders. El amanecer: dawn.'}
  form: amanecer
  spelled: {es-Latn/standard: [amanecer]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [amaneció]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [amanece]}, status: pinned}
- id: lexeme:americano
  pos: ADJ
  gloss: {en: American (from the US)}
  notes: {en: 'In Cuba and in Miami, americano means from the United States. Formal Spanish also says estadounidense, and many Latin Americans will remind you that they are americanos too. No capital: los americanos, el inglés americano.'}
  form: americano
  spelled: {es-Latn/standard: [americano]}
- id: lexeme:amigo
  pos: NOUN
  gloss: {en: friend}
  notes: {en: 'Amiga for a woman. Cubans also say mi socio, and asere among men.'}
  form: amigo
  spelled: {es-Latn/standard: [amigo]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [amigos]}, status: pinned}
- id: lexeme:amor
  pos: NOUN
  gloss: {en: 'love; mi amor: my love, darling'}
  notes: {en: 'Mi amor is what Cubans call partners, children, grandchildren and now and then the cashier. El amor is masculine. Un amor de persona: a lovely person.'}
  form: amor
  spelled: {es-Latn/standard: [amor]}
- id: lexeme:andar
  pos: VERB
  classes: [strong]
  gloss: {en: 'to walk; to go around; andar con: to hang out with'}
  notes: {en: 'Andar con alguien: to go around with someone. ¿Con quién tú andas?: who are you hanging out with? The past is irregular: anduve, anduvo, never andé, andó.'}
  form: andar
  spelled: {es-Latn/standard: [andar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [andas]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [anda]}, status: pinned}
  - {feats: {Mood: Ind, Tense: Past}, stem: anduv, status: listed, statement: {author: 'llm:claude@rules-es', status: draft}}
  - {feats: {Mood: Sub, Tense: Imp}, stem: anduv, status: listed, statement: {author: 'llm:claude@rules-es', status: draft}}
- id: lexeme:anoche
  pos: ADV
  gloss: {en: last night}
  notes: {en: One word. Ayer por la noche says the same.}
  form: anoche
  spelled: {es-Latn/standard: [anoche]}
- id: lexeme:antes
  pos: ADV
  gloss: {en: before; in the old days}
  notes: {en: 'With the imperfect it is the old days: antes no había teléfono. Antes de: before something (antes de comer).'}
  form: antes
  spelled: {es-Latn/standard: [antes]}
- id: lexeme:apagón
  pos: NOUN
  gloss: {en: blackout; power cut}
  notes: {en: 'Cuba''s apagones can last hours or days, announced or not: no fan, no fridge, no wifi. Apagón has an accent; apagones has none. Apagar: to turn off.'}
  form: apagón
  spelled: {es-Latn/standard: [apagón]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [apagones]}, status: pinned}
- id: lexeme:aplicar
  pos: VERB
  gloss: {en: 'to apply (a cream, a rule); (Miami Spanglish) to apply for'}
  notes: {en: 'In Spanish you aplicar a cream, a rule or a discount: aplicar la ley. Aplicar para un trabajo comes from English; in a job interview, say solicitar un puesto (aplicar a un puesto is spreading in Latin America). Apliqué, with qu.'}
  form: aplicar
  spelled: {es-Latn/standard: [aplicar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [apliqué]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [aplicaste]}, status: pinned}
- id: lexeme:aprender
  pos: VERB
  gloss: {en: to learn}
  notes: {en: 'Aprender a + infinitive: aprender a cocinar. Learn is aprender, teach is enseñar. Aprendemos (we learn) and aprendamos (that we learn): one letter is the mood.'}
  form: aprender
  spelled: {es-Latn/standard: [aprender]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [aprendió]}, status: pinned}
  - {feats: {Mood: Sub, Number: Plur, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [aprendamos]}, status: pinned}
  - {feats: {Mood: Sub, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [aprendas]}, status: pinned}
- id: lexeme:apóstol
  pos: PROPN
  feats: {Gender: Masc}
  gloss: {en: 'apostle; el Apóstol: José Martí'}
  notes: {en: 'El Apóstol (de la independencia) is what Cubans call Martí, who gave his life to preaching it. A-pós-tol, with an accent; plural apóstoles. A Martí le dicen el Apóstol: le dicen, they call him, is how Cubans say it.'}
  form: apóstol
  spelled: {es-Latn/standard: [apóstol]}
- id: lexeme:aquí
  pos: ADV
  feats: {PronType: Dem}
  gloss: {en: here}
  notes: {en: Written with an accent on the í. Cubans say aquí far more than acá.}
  form: aquí
  spelled: {es-Latn/standard: [aquí]}
- id: lexeme:arreglar
  pos: VERB
  gloss: {en: to fix; to repair}
  notes: {en: 'Arreglar la máquina: to fix the car. Arreglarse is to get dressed up: Abuela se arreglaba para los guateques.'}
  form: arreglar
  spelled: {es-Latn/standard: [arreglar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [arreglaron]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [arreglé]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [arregló]}, status: pinned}
- id: lexeme:arroyo
  pos: NOUN
  gloss: {en: stream; brook; creek}
  notes: {en: 'Smaller than un río. Spelled with rr and y. Cubans say y and ll the same, so watch the spelling: arrollo, with ll, is I run over (arrollar).'}
  form: arroyo
  spelled: {es-Latn/standard: [arroyo]}
- id: lexeme:arroz
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: rice}
  notes: {en: 'Written with z, though Cubans say it with an s sound. Arroz blanco with frijoles negros is the everyday Cuban plate.'}
  form: arroz
  spelled: {es-Latn/standard: [arroz]}
- id: lexeme:asado
  pos: ADJ
  gloss: {en: roast; roasted}
  notes: {en: 'Lechón asado, pollo asado. Un asado is also a barbecue, above all in Argentina.'}
  form: asado
  spelled: {es-Latn/standard: [asado]}
- id: lexeme:asar
  pos: VERB
  gloss: {en: to roast; to grill}
  notes: {en: 'Asar un lechón. With s: asar, asado. Azar, with z, is chance; Cubans say both the same way, so spelling is the only difference.'}
  form: asar
  spelled: {es-Latn/standard: [asar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Fut, VerbForm: Fin}, spelled: {es-Latn/standard: [asaremos]}, status: pinned}
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Fut, VerbForm: Fin}, spelled: {es-Latn/standard: [asarán]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [asé]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Fut, VerbForm: Fin}, spelled: {es-Latn/standard: [asará]}, status: pinned}
- id: lexeme:asere
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: buddy; mate; man (Cuban)}
  notes: {en: 'Cuban, informal, mostly between men; also written acere.'}
  form: asere
  spelled: {es-Latn/standard: [asere]}
- id: lexeme:aspiradora
  pos: NOUN
  gloss: {en: 'vacuum cleaner; pasar la aspiradora: to vacuum'}
  notes: {en: 'Pasar la aspiradora (por la alfombra): to vacuum (the carpet). Aspirar: to breathe in; to suck up. In Hialeah you may hear vacunar la carpeta, which in Spanish would be to vaccinate the folder.'}
  form: aspiradora
  spelled: {es-Latn/standard: [aspiradora]}
- id: lexeme:así
  pos: ADV
  feats: {PronType: Dem}
  gloss: {en: like this; like that; so}
  notes: {en: 'With an accent on the í. Así es: that''s right; así es la vida: that''s life; así así: so-so.'}
  form: así
  spelled: {es-Latn/standard: [así]}
- id: lexeme:atrás
  pos: ADV
  gloss: {en: 'back; behind (para atrás: backwards)'}
  notes: {en: 'With an accent on the á. Está atrás: it''s at the back. Te llamo para atrás (I''ll call you back) is Miami Spanglish: a Cuban on the island hears I''ll call you backwards. In Spanish: te devuelvo la llamada, or ahorita te llamo.'}
  form: atrás
  spelled: {es-Latn/standard: [atrás]}
- id: lexeme:audio
  pos: NOUN
  gloss: {en: voice message; audio}
  notes: {en: 'Mándame un audio: send me a voice note. Many Cuban relatives would rather talk than type, so the family chat fills up with audios.'}
  form: audio
  spelled: {es-Latn/standard: [audio]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [audios]}, status: pinned}
- id: lexeme:aunque
  pos: SCONJ
  gloss: {en: although; even though; even if}
  notes: {en: 'With the indicative for a fact: aunque vivían lejos, le escribía (although they lived far apart). With the subjunctive for what may be or does not matter: aunque pasen los años (even if the years go by), aunque estés lejos.'}
  form: aunque
  spelled: {es-Latn/standard: [aunque]}
- id: lexeme:ave
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: bird (more formal than pájaro)}
  notes: {en: 'Feminine, but el ave and un ave, because it starts with a stressed a, like el agua; the adjective stays feminine: un ave blanca, las aves. The everyday word is el pájaro; el ave nacional is the official phrase.'}
  form: ave
  spelled: {es-Latn/standard: [ave]}
- id: lexeme:avión
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: plane; airplane}
