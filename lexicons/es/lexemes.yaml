- id: lexeme:por
  pos: ADP
  gloss: {en: 'by; through; for (por la mañana: in the morning)'}
  notes: {en: 'Por la mañana, por la tarde, por la noche: in the morning, in the afternoon, at night. In the Caribbean and the US you also hear en la mañana.'}
  form: por
  spelled: {es-Latn/standard: [por]}
- id: lexeme:por-favor
  pos: INTJ
  gloss: {en: please}
  form: por favor
  spelled: {es-Latn/standard: [por favor]}
- id: lexeme:por-lo-tanto
  pos: ADV
  gloss: {en: therefore; so}
  notes: {en: 'Introduces what follows from what you just said. More formal than por eso or así que, which everyday Cuban Spanish prefers; right for a speech or a letter.'}
  form: por lo tanto
  spelled: {es-Latn/standard: [por lo tanto]}
- id: lexeme:porque
  pos: SCONJ
  gloss: {en: because}
  notes: {en: 'One word, no accent: porque, because. The question ¿por qué? (why) is two words, with an accent on qué. ¿Por qué no me llamas? Porque no tengo tu teléfono.'}
  form: porque
  spelled: {es-Latn/standard: [porque]}
- id: lexeme:portal
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: front porch}
  notes: {en: 'The Cuban portal: the porch in front of the house, with its rocking chairs. Porche elsewhere.'}
  form: portal
  spelled: {es-Latn/standard: [portal]}
- id: lexeme:portarse
  pos: VERB
  gloss: {en: 'to behave (portarse bien: to behave yourself)'}
  notes: {en: '¡Pórtate bien!: what every Cuban mother says at the door, at any age. Portarse mal: to misbehave. Pórtate carries an accent.'}
  form: portar+se
  spelled: {es-Latn/standard: [portarse]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, spelled: {es-Latn/standard: [pórtate]}, status: pinned}
- id: lexeme:posible
  pos: ADJ
  gloss: {en: possible}
  notes: {en: '¿Sería posible…?: would it be possible…? The politest way to ask an office for something. Lo antes posible: as soon as possible.'}
  form: posible
  spelled: {es-Latn/standard: [posible]}
- id: lexeme:preguntar
  pos: VERB
  gloss: {en: 'to ask (a question); preguntar si: to ask whether'}
  notes: {en: 'Me preguntó si era cubano; me preguntó dónde vivía (the question word keeps its accent inside the sentence). To ask for something, or to ask someone to do it, is pedir: me pidió un favor, me pidió que lo llamara. Me preguntó por un favor is English asked for.'}
  form: preguntar
  spelled: {es-Latn/standard: [preguntar]}
  forms:
  - {feats: {Mood: Cnd, Number: Plur, Person: '3', VerbForm: Fin}, spelled: {es-Latn/standard: [preguntarían]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [preguntó]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [pregunta]}, status: pinned}
- id: lexeme:preocupar
  pos: VERB
  gloss: {en: 'to worry (me preocupa que…: I''m worried that…)'}
  notes: {en: 'Like gustar: me preocupa que no tengan corriente. With se, preocuparse por: to worry about; ¡no te preocupes!: don''t worry! After que it takes the subjunctive.'}
  form: preocupar
  spelled: {es-Latn/standard: [preocupar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '2', Polarity: Neg, VerbForm: Fin}, spelled: {es-Latn/standard: [preocupes]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [preocupa]}, status: pinned}
- id: lexeme:preparar
  pos: VERB
  gloss: {en: to prepare; to make (food)}
  notes: {en: 'Preparar la comida, preparar una fiesta. For food Cubans also say hacer: hacer el congrí.'}
  form: preparar
  spelled: {es-Latn/standard: [preparar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Fut, VerbForm: Fin}, spelled: {es-Latn/standard: [prepararé]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Fut, VerbForm: Fin}, spelled: {es-Latn/standard: [preparará]}, status: pinned}
- id: lexeme:presión
  pos: NOUN
  gloss: {en: pressure; blood pressure}
  notes: {en: 'Short for la presión arterial. Tener la presión alta: to have high blood pressure. The doctor''s next question is about el azúcar: tener azúcar, or tener el azúcar alta, is how Cubans say diabetes.'}
  form: presión
  spelled: {es-Latn/standard: [presión]}
- id: lexeme:primero
  pos: ADJ
  feats: {NumType: Ord}
  gloss: {en: first}
  notes: {en: 'Primer before a masculine noun: mi primer novio, el primer baile; but la primera vez. On its own it also means first of all.'}
  form: primero
  spelled: {es-Latn/standard: [primero]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [primera]}, status: pinned}
  allomorphs:
  - {form: primer, before: {pos: NOUN}, spelled: {es-Latn/standard: [primer]}}  # REVIEW: before a noun (un buen día, un gran poeta, el primer cliente)
- id: lexeme:primo
  pos: NOUN
  chooses: [Gender]
  gloss: {en: cousin}
  notes: {en: 'Prima for a woman; los primos, cousins. A first cousin is a primo hermano.'}
  form: primo
  spelled: {es-Latn/standard: [primo]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [prima]}, status: pinned}
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [primos]}, status: pinned}
- id: lexeme:pronto
  pos: ADV
  gloss: {en: soon}
  notes: {en: 'Hasta pronto: see you soon. Pronto means soon, not quickly (that is rápido); de pronto: suddenly.'}
  form: pronto
  spelled: {es-Latn/standard: [pronto]}
- id: lexeme:propio
  pos: ADJ
  gloss: {en: own}
  notes: {en: 'Before the noun it means own: mi propio negocio, su propia casa; propia with a feminine noun. After the noun it means proper or typical.'}
  form: propio
  spelled: {es-Latn/standard: [propio]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [propia]}, status: pinned}
- id: lexeme:pueblo
  pos: NOUN
  gloss: {en: town; village; people}
  notes: {en: 'Mi pueblo: my home town. It is also a people: el pueblo cubano.'}
  form: pueblo
  spelled: {es-Latn/standard: [pueblo]}
- id: lexeme:puerto
  pos: NOUN
  gloss: {en: port; harbour}
  notes: {en: 'El puerto del Mariel, el puerto de La Habana. Puerto Rico: rich port.'}
  form: puerto
  spelled: {es-Latn/standard: [puerto]}
- id: lexeme:puesto
  pos: NOUN
  gloss: {en: job; position; post}
  notes: {en: 'Un puesto (de trabajo): a job, a position; un trabajo and un empleo say the same. Also a stall at a market (un puesto de frutas). Puesto is also the participle of poner: he puesto la mesa.'}
  form: puesto
  spelled: {es-Latn/standard: [puesto]}
- id: lexeme:pulóver
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: T-shirt (Cuban)}
  notes: {en: 'Cuban for a T-shirt, from English pullover (a sweater!). Elsewhere camiseta, playera or remera. Written with an accent; plural pulóveres.'}
  form: pulóver
  spelled: {es-Latn/standard: [pulóver]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [pulóveres]}, status: pinned}
- id: lexeme:puro
  pos: NOUN
  gloss: {en: 'dad, the old man (Cuban slang; la pura: mom)'}
  notes: {en: 'Los puros: your folks, your parents. Young Cubans'' slang, said with affection. Un puro is also a cigar.'}
  form: puro
  spelled: {es-Latn/standard: [puro]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [puros]}, status: pinned}
- id: lexeme:que
  pos: SCONJ
  gloss: {en: that; which; who}
  notes: {en: 'No accent when it joins (la semana que viene); qué, with an accent, asks or exclaims.'}
  form: que
  spelled: {es-Latn/standard: [que]}
- id: lexeme:que.than
  pos: SCONJ
  gloss: {en: than (más… que)}
  notes: {en: 'The que of comparisons: más viejo que tú, mejor que yo (yo and tú, not mí and ti). Before a number, de: más de cien discos.'}
  form: que
  spelled: {es-Latn/standard: [que]}
- id: lexeme:quedarse
  pos: VERB
  gloss: {en: to stay; to remain}
  notes: {en: 'Quedarse en Cuba: to stay in Cuba. Without se, quedar is to be (somewhere) or to arrange to meet: ¿dónde queda? Me quedé dormido: I overslept.'}
  form: quedar+se
  spelled: {es-Latn/standard: [quedarse]}
