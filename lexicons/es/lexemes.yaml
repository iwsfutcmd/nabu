- id: lexeme:pastilla
  pos: NOUN
  gloss: {en: pill; tablet}
  notes: {en: 'La pastilla de la presión: the blood-pressure pill. Also a lozenge or a hard sweet: una pastilla de menta.'}
  form: pastilla
  spelled: {es-Latn/standard: [pastilla]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [pastillas]}, status: pinned}
- id: lexeme:patio
  pos: NOUN
  gloss: {en: yard; backyard}
  notes: {en: 'A Cuban patio is the yard behind the house: the mango tree, the clothesline, the dominó table.'}
  form: patio
  spelled: {es-Latn/standard: [patio]}
- id: lexeme:patria
  pos: NOUN
  gloss: {en: homeland; fatherland}
  notes: {en: 'La patria, feminine, though it comes from padre. It was Martí''s word: Patria was the newspaper he founded in New York in 1892, and Patria es humanidad one of his sayings. Cubans abroad say la patria, or mi tierra, of the island.'}
  form: patria
  spelled: {es-Latn/standard: [patria]}
- id: lexeme:país
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: country}
  notes: {en: 'With an accent: pa-ís, two syllables; plural países. Un país is a nation; the countryside is el campo, never el país. Mi país can be Cuba, the United States or both, depending on whom you ask.'}
  form: país
  spelled: {es-Latn/standard: [país]}
- id: lexeme:pecho
  pos: NOUN
  gloss: {en: chest}
  notes: {en: 'A pain in the chest (un dolor en el pecho) is a reason to call 911 in Miami, not to wait for the turno.'}
  form: pecho
  spelled: {es-Latn/standard: [pecho]}
- id: lexeme:pedir
  pos: VERB
  classes: [e-i]
  gloss: {en: to ask for; to order (food)}
  notes: {en: 'Pido, pides, pide, piden: the e becomes i. Pedir is to ask for something (pedir la bendición, pedir una cita); to ask a question is preguntar.'}
  form: pedir
  spelled: {es-Latn/standard: [pedir]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [piden]}, status: pinned}
