- id: lexeme:izquierda
  pos: NOUN
  gloss: {en: left (side)}
  notes: {en: 'A la izquierda: on the left, to the left.'}
  form: izquierda
  spelled: {es-Latn/standard: [izquierda]}
- id: lexeme:jaba
  pos: NOUN
  gloss: {en: bag; shopping bag (Cuban)}
  notes: {en: 'Cuban for a bag, above all a plastic shopping bag (una jaba de nylon); elsewhere bolsa. Cuban grandmothers fold and keep every jaba for the next trip to the store.'}
  form: jaba
  spelled: {es-Latn/standard: [jaba]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [jabas]}, status: pinned}
- id: lexeme:jabón
  pos: NOUN
  gloss: {en: soap}
  notes: {en: 'With j and b, and an accent on the o; the plural drops it: jabones. Soap is one of the first things in a paquete to Cuba.'}
  form: jabón
  spelled: {es-Latn/standard: [jabón]}
- id: lexeme:jonrón
  pos: NOUN
  gloss: {en: home run}
  notes: {en: 'English home run, spelled the Spanish way, with an accent; the plural jonrones has none. Batear un jonrón: to hit a home run. Commentators also say cuadrangular.'}
  form: jonrón
  spelled: {es-Latn/standard: [jonrón]}
- id: lexeme:josé
  pos: PROPN
  feats: {Gender: Masc}
  gloss: {en: José (a name; Pepe for short)}
  notes: {en: 'At home a José is Pepe, like Abuelo Pepe; Martí was Pepe to his family too. Jo-sé, with the accent on the é.'}
  form: José
  spelled: {es-Latn/standard: [José]}
- id: lexeme:joven
  pos: ADJ
  gloss: {en: young; young person}
  notes: {en: 'The same for men and women: un joven, una joven. The plural takes an accent: jóvenes.'}
  form: joven
  spelled: {es-Latn/standard: [joven]}
- id: lexeme:jubilarse
  pos: VERB
  gloss: {en: to retire (from work)}
  notes: {en: 'Un jubilado, una jubilada: a retiree, like Abuelo Pepe. La jubilación: retirement, or the pension. Retirarse is heard too, above all of sportsmen and soldiers.'}
  form: jubilar+se
  spelled: {es-Latn/standard: [jubilarse]}
  forms:
  - {feats: {Mood: Sub, Number: Sing, Tense: Imp, VerbForm: Fin}, spelled: {es-Latn/standard: [jubilara]}, status: pinned}
- id: lexeme:juego
  pos: NOUN
  gloss: {en: game; match}
  notes: {en: 'Un juego de pelota: a baseball game; Cubans keep partido for football (soccer). Juego is also I play (jugar).'}
  form: juego
  spelled: {es-Latn/standard: [juego]}
- id: lexeme:jueves
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: Thursday}
  form: jueves
