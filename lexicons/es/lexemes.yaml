- id: lexeme:ropa
  pos: NOUN
  gloss: {en: clothes; clothing}
  notes: {en: 'Singular in Spanish: la ropa es nueva, the clothes are new.'}
  form: ropa
  spelled: {es-Latn/standard: [ropa]}
- id: lexeme:ropa-vieja
  pos: NOUN
  gloss: {en: ropa vieja (shredded beef stew)}
  notes: {en: 'Literally old clothes: beef cooked until it shreds like rags, then stewed in sofrito with tomato. With white rice, black beans and maduros, the Cuban plate.'}
  form: ropa vieja
  spelled: {es-Latn/standard: [ropa vieja]}
- id: lexeme:rosa
  pos: NOUN
  gloss: {en: rose; pink}
  notes: {en: 'La rosa, the flower; as a colour, rosa or rosado is pink. Martí''s best-known poem, XXXIX of Versos sencillos, is about the white rose he grows for friend and enemy alike.'}
  form: rosa
  spelled: {es-Latn/standard: [rosa]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [rosas]}, status: pinned}
- id: lexeme:rufo
  pos: NOUN
  gloss: {en: roof (Miami Spanglish)}
