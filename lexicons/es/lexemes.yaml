  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [pide]}, status: pinned}
- id: lexeme:pelear
  pos: VERB
  gloss: {en: to fight; to argue}
  notes: {en: 'Pelear, or pelearse, con alguien: to fight or argue with someone. For a fistfight Cubans say fajarse. In the subjunctive the e doubles: que no peleen.'}
  form: pelear
  spelled: {es-Latn/standard: [pelear]}
  forms:
  - {feats: {Mood: Sub, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [peleen]}, status: pinned}
- id: lexeme:pelota
  pos: NOUN
  gloss: {en: baseball (Cuban); ball}
  notes: {en: 'In Cuba la pelota is baseball, the national sport; elsewhere béisbol. Jugar pelota, ver la pelota; a player is un pelotero.'}
  form: pelota
  spelled: {es-Latn/standard: [pelota]}
- id: lexeme:pelotero
  pos: NOUN
  gloss: {en: baseball player}
  notes: {en: 'From la pelota; beisbolista elsewhere. Cuban peloteros in the Major Leagues include Tony Pérez and José Abreu, who, like Papi, comes from Cienfuegos.'}
  form: pelotero
  spelled: {es-Latn/standard: [pelotero]}
- id: lexeme:penoso
  pos: ADJ
  gloss: {en: shy; easily embarrassed (Cuban)}
  notes: {en: 'In Cuba and the Caribbean, ser penoso is to be shy, and me da pena is I''m embarrassed. In Spain and Mexico penoso means painful or pitiful, and shy is tímido.'}
  form: penoso
  spelled: {es-Latn/standard: [penoso]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [penosa]}, status: pinned}
- id: lexeme:pensar
  pos: VERB
  classes: [e-ie]
  gloss: {en: to think}
  notes: {en: 'Pienso, piensas, piensa: e becomes ie, except in pensamos. Pensar en: to think about (pienso en ti). Pensar que: to think that.'}
  form: pensar
  spelled: {es-Latn/standard: [pensar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Imp, VerbForm: Fin}, spelled: {es-Latn/standard: [pensábamos]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [pienso]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [piensas]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Tense: Imp, VerbForm: Fin}, spelled: {es-Latn/standard: [pensaba]}, status: pinned}
- id: lexeme:peor
  pos: ADJ
  classes: [comparative]
  gloss: {en: worse; worst}
  notes: {en: 'Never más peor. El peor, la peor: the worst. Of age, mayor and menor: older, younger.'}
  form: peor
  spelled: {es-Latn/standard: [peor]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [peor]}, status: pinned}
- id: lexeme:pepe
  pos: PROPN
  feats: {Gender: Masc}
  gloss: {en: Pepe (a name)}
  notes: {en: 'The usual nickname for José, as Cachita is for Caridad.'}
  form: Pepe
  spelled: {es-Latn/standard: [Pepe]}
- id: lexeme:pequeña-habana
  pos: PROPN
  gloss: {en: Little Havana (a Miami neighbourhood)}
  notes: {en: 'Around Calle Ocho, west of downtown Miami: the heart of the Cuban exile from the 1960s on. Pequeña with ñ. Older Cubans also call it la Sagüesera, from southwest.'}
  form: Pequeña Habana
  spelled: {es-Latn/standard: [Pequeña Habana]}
- id: lexeme:perder
  pos: VERB
  classes: [e-ie]
  gloss: {en: 'to lose; to miss (a bus, a flight)'}
  notes: {en: 'Pierdo, pierdes, pierde, pierden (e becomes ie), but perdemos. Perder con or perder contra: to lose to. Perderse: to get lost.'}
  form: perder
  spelled: {es-Latn/standard: [perder]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [perdió]}, status: pinned}
  - {feats: {Tense: Past, VerbForm: Part}, spelled: {es-Latn/standard: [perdido]}, status: pinned}
- id: lexeme:perdonar
  pos: VERB
  gloss: {en: 'to forgive; perdone: sorry, pardon me (usted)'}
  notes: {en: 'Perdone or perdón: sorry, pardon me. Perdona to a friend. ¿Perdón? also asks someone to say it again.'}
  form: perdonar
  spelled: {es-Latn/standard: [perdonar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '3', VerbForm: Fin}, spelled: {es-Latn/standard: [perdone]}, status: pinned}
