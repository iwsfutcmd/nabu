- id: lexeme:estómago
  pos: NOUN
  gloss: {en: stomach}
  notes: {en: 'With an accent on the first o. La barriga is the belly, the word for children and for home.'}
  form: estómago
  spelled: {es-Latn/standard: [estómago]}
- id: lexeme:examen
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: exam; test}
  notes: {en: 'With x. No accent on examen, but the plural has one: exámenes, because the stress stays on the a.'}
  form: examen
  spelled: {es-Latn/standard: [examen]}
- id: lexeme:exilio
  pos: NOUN
  gloss: {en: exile}
  notes: {en: 'El exilio: the Cubans who left after 1959, and their life away from the island; one of them is un exiliado. With x and no h. The first wave came in 1959–62; the Freedom Flights (los vuelos de la libertad, 1965–73) brought over 260,000 more.'}
  form: exilio
  spelled: {es-Latn/standard: [exilio]}
- id: lexeme:extrañar
  pos: VERB
  gloss: {en: to miss (someone or something)}
  notes: {en: 'Te extraño: I miss you, as Cubans and most of Latin America say it; in Spain, te echo de menos. With x and ñ: ex-tra-ñar.'}
  form: extrañar
  spelled: {es-Latn/standard: [extrañar]}
  forms:
