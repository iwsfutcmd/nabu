  pos: NOUN
  gloss: {en: bolero (a slow love song)}
  notes: {en: 'With b. The Cuban bolero was born in Santiago de Cuba in the 1880s; the Spanish bolero is another thing, a dance. The music grandparents danced to, cheek to cheek.'}
