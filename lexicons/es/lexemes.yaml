- id: lexeme:dejar
  pos: VERB
  gloss: {en: to leave (behind); to let}
  notes: {en: 'To leave someone or something behind is dejar, never salir: dejó a su hija en Cuba. Dejar de + infinitive: to stop doing (nunca dejó de llamar). Déjame ver: let me see.'}
  form: dejar
  spelled: {es-Latn/standard: [dejar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [dejó]}, status: pinned}
- id: lexeme:del
  pos: ADP
  gloss: {en: of the; from the (de + el)}
  notes: {en: 'De + el always becomes del: el cuarto del abuelo. Not before la (de la casa), nor before él, he (de él).'}
  form: del
  spelled: {es-Latn/standard: [del]}
- id: lexeme:derecha
  pos: NOUN
  gloss: {en: right (side)}
  notes: {en: 'A la derecha: on the right, to the right. Derecho means straight ahead: sigue derecho.'}
  form: derecha
  spelled: {es-Latn/standard: [derecha]}
- id: lexeme:desayunar
  pos: VERB
  gloss: {en: to have breakfast}
  notes: {en: 'Desayuno: I have breakfast; el desayuno is breakfast. The Cuban one: café con leche, with buttered Cuban toast (tostada) to dip in it.'}
  form: desayunar
  spelled: {es-Latn/standard: [desayunar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [desayuno]}, status: pinned}
  - {feats: {VerbForm: Ger}, spelled: {es-Latn/standard: [desayunando]}, status: pinned}
- id: lexeme:descansar
  pos: VERB
  gloss: {en: to rest}
  notes: {en: 'Descanse: rest (usted). ¡Que descanses!: sleep well, to someone going to bed.'}
  form: descansar
  spelled: {es-Latn/standard: [descansar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '3', VerbForm: Fin}, spelled: {es-Latn/standard: [descanse]}, status: pinned}
- id: lexeme:desde
  pos: ADP
  gloss: {en: from; since}
  notes: {en: 'Desde el balcón se ve el mar: from the balcony you can see the sea. Desde… hasta: from… to. Desde ayer: since yesterday. Desde hace un año: for a year (and still).'}
  form: desde
  spelled: {es-Latn/standard: [desde]}
- id: lexeme:después
  pos: ADV
  gloss: {en: after; afterwards; then; later}
  notes: {en: 'Written with an accent on the é. Después de: after (después de la novela).'}
  form: después
  spelled: {es-Latn/standard: [después]}
- id: lexeme:devolver
  pos: VERB
  classes: [o-ue]
  gloss: {en: 'to give back; to return (something); devolver la llamada: to call back'}
  notes: {en: 'Devolver un libro: to return a book. Devolver la llamada: to call back (te devuelvo la llamada). O becomes ue: devuelvo, devuelve; the participle is devuelto. Llamar para atrás is English call back, word for word.'}
  form: devolver
  spelled: {es-Latn/standard: [devolver]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [devolví]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [devuelvo]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [devuelve]}, status: pinned}
  - {feats: {Tense: Past, VerbForm: Part}, stem: devuelt, status: listed, statement: {author: 'llm:claude@rules-es', status: draft}}
- id: lexeme:diablo
  pos: NOUN
  gloss: {en: devil}
  notes: {en: 'Más sabe el diablo por viejo que por diablo: the devil knows more from being old than from being the devil; wisdom comes with age. Here por gives the reason: because of.'}
  form: diablo
  spelled: {es-Latn/standard: [diablo]}
- id: lexeme:diciembre
  pos: PROPN
  feats: {Gender: Masc}
  gloss: {en: December}
  notes: {en: 'Months take no capital in Spanish: el veinticuatro de diciembre. Written with c: diciembre.'}
  form: diciembre
  spelled: {es-Latn/standard: [diciembre]}
- id: lexeme:diecinueve
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: nineteen}
  notes: {en: 'One word, like dieciséis, diecisiete and dieciocho: diez y nueve run together.'}
  form: diecinueve
  spelled: {es-Latn/standard: [diecinueve]}
- id: lexeme:diez
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: ten}
  notes: {en: 'Eleven to fifteen have names of their own: once, doce, trece, catorce, quince. Then dieciséis, diecisiete, dieciocho, diecinueve.'}
  form: diez
  spelled: {es-Latn/standard: [diez]}
- id: lexeme:difícil
  pos: ADJ
  gloss: {en: difficult; hard}
  notes: {en: 'With an accent on the first í: di-fí-cil, like fácil (easy); the plurals difíciles and fáciles keep it.'}
  form: difícil
  spelled: {es-Latn/standard: [difícil]}
- id: lexeme:dinero
  pos: NOUN
  gloss: {en: money}
  notes: {en: 'Singular in Spanish: el dinero está en el banco, never están. Cubans also say la plata, and in slang los baros. Cash is efectivo.'}
  form: dinero
  spelled: {es-Latn/standard: [dinero]}
- id: lexeme:dios
  pos: PROPN
  feats: {Gender: Masc}
  gloss: {en: God}
  notes: {en: 'With a capital for God: ¡Ay, Dios mío!, gracias a Dios, si Dios quiere (God willing), which Cubans add to any plan. Dios te bendiga is one set expression.'}
  form: Dios
  spelled: {es-Latn/standard: [Dios]}
- id: lexeme:dios-te-bendiga
  pos: INTJ
  gloss: {en: God bless you}
  notes: {en: 'The answer to ¡Bendición! To someone you call usted: Dios lo bendiga (a man), Dios la bendiga (a woman). Bendiga is the subjunctive of bendecir (unit 21).'}
  form: Dios te bendiga
  spelled: {es-Latn/standard: [Dios te bendiga]}
- id: lexeme:disco
  pos: NOUN
  gloss: {en: record; album; disc}
  notes: {en: 'Abuelo''s discos are LPs. To put on a record: poner un disco.'}
  form: disco
  spelled: {es-Latn/standard: [disco]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [discos]}, status: pinned}
- id: lexeme:disculpar
  pos: VERB
  gloss: {en: 'to excuse; disculpe: excuse me, sorry (usted)'}
  notes: {en: 'Disculpe to get someone''s attention or to say sorry; disculpa to a friend. Heritage speakers often say excúseme, after English; Cubans say disculpe, perdone or con permiso.'}
  form: disculpar
  spelled: {es-Latn/standard: [disculpar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '3', VerbForm: Fin}, spelled: {es-Latn/standard: [disculpe]}, status: pinned}
- id: lexeme:doble
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: 'double; el doble nueve: the double-nine (set, or its 9-9 tile)'}
  notes: {en: 'Cubans play doble nueve: 55 tiles, ten to each player. Doble seis (28 tiles) is usual elsewhere. Un doble is a tile with the same number on both halves.'}
  form: doble
  spelled: {es-Latn/standard: [doble]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [dobles]}, status: pinned}
- id: lexeme:doce
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: twelve}
  notes: {en: 'A las doce: at twelve o''clock. Written with c: doce, trece.'}
  form: doce
  spelled: {es-Latn/standard: [doce]}
- id: lexeme:doctor
  pos: NOUN
  chooses: [Gender]
  gloss: {en: 'doctor (what you call one: doctora for a woman)'}
  notes: {en: 'What a patient calls a physician to their face: Buenos días, doctora. Written in small letters in a sentence; Dr. and Dra. before a name. El médico is the job; doctor is the title.'}
  form: doctor
  spelled: {es-Latn/standard: [doctor]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [doctora]}, status: pinned}
- id: lexeme:doler
  pos: VERB
  classes: [o-ue]
  gloss: {en: 'to hurt; to ache (me duele: it hurts me)'}
  notes: {en: 'Works like gustar: me duele la cabeza (my head hurts), me duelen los pies (my feet hurt). Spanish says la cabeza, not mi cabeza: "mi cabeza duele" is English in Spanish words. O becomes ue: duele, duelen.'}
  form: doler
  spelled: {es-Latn/standard: [doler]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [duelen]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [duele]}, status: pinned}
- id: lexeme:domingo
  pos: NOUN
  gloss: {en: Sunday}
  notes: {en: 'On Sundays: los domingos. The Spanish week starts on Monday.'}
  form: domingo
  spelled: {es-Latn/standard: [domingo]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [domingos]}, status: pinned}
- id: lexeme:dominó
  pos: NOUN
  gloss: {en: dominoes (the game); a domino}
  notes: {en: 'With an accent. Cubans play doble nueve (55 tiles), in pairs, slapping the tiles down. On Calle Ocho the tables of Domino Park (Parque Máximo Gómez) are always full.'}
  form: dominó
  spelled: {es-Latn/standard: [dominó]}
- id: lexeme:don
  pos: NOUN
  chooses: [Gender]
  gloss: {en: 'Don, Doña (title of respect before a first name)'}
  notes: {en: 'Doña for a woman: doña Ofelia, don Pepe. Before a first name, never a surname alone, and lowercase inside a sentence. It shows respect, and goes with usted. With an ñ.'}
  form: don
  spelled: {es-Latn/standard: [don]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, form: doña, status: listed, statement: {author: 'llm:claude@rules-es', status: draft}}
- id: lexeme:donde
  pos: ADV
  feats: {PronType: Rel}
  gloss: {en: 'where (not asking): la casa donde vivo'}
  notes: {en: 'No accent when it joins: la casa donde vive. With one when it asks, directly or not: ¿Dónde vives? ¿Tú sabes dónde vive?'}
  form: donde
  spelled: {es-Latn/standard: [donde]}
- id: lexeme:dormido
  pos: ADJ
  gloss: {en: 'asleep; frijoles dormidos: beans left overnight'}
  notes: {en: 'Frijoles negros dormidos: black beans cooked the day before and left to sleep overnight, so they come out thicker and tastier. Every Cuban cook swears by it.'}
  form: dormido
  spelled: {es-Latn/standard: [dormido]}
  forms:
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [dormidos]}, status: pinned}
- id: lexeme:dormir
  pos: VERB
  classes: [o-ue]
  gloss: {en: to sleep}
  notes: {en: 'The o becomes ue (duermo, duermes, duerme) and u in the gerund: durmiendo.'}
  form: dormir
  spelled: {es-Latn/standard: [dormir]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [duermen]}, status: pinned}
  - {feats: {VerbForm: Ger}, spelled: {es-Latn/standard: [durmiendo]}, status: pinned}
- id: lexeme:dormirse
  pos: VERB
  classes: [o-ue]
  gloss: {en: to fall asleep; to doze off}
  notes: {en: 'Dormir is to sleep; dormirse is to drop off: me dormí en la guagua. Overslept is me quedé dormido. The o becomes ue (se duerme) and, in the past, u (se durmió).'}
  form: dormir+se
  spelled: {es-Latn/standard: [dormirse]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [durmió]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [duerme]}, status: pinned}
- id: lexeme:dos
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: two}
  notes: {en: 'In Cuban speech a final s is often softened or dropped (do'' cafecito''), but it is always written: dos.'}
  form: dos
  spelled: {es-Latn/standard: [dos]}
- id: lexeme:dudar
  pos: VERB
  gloss: {en: to doubt}
  notes: {en: 'Dudo que + subjunctive: I doubt that (dudo que llegue). Lo dudo: I doubt it. Sin duda: without a doubt.'}
  form: dudar
  spelled: {es-Latn/standard: [dudar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [dudo]}, status: pinned}
- id: lexeme:día
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: day}
  notes: {en: 'Masculine though it ends in -a: el día, buenos días. Written with an accent on the í.'}
  form: día
  spelled: {es-Latn/standard: [día]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [días]}, status: pinned}
- id: lexeme:dólar
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: dollar}
  notes: {en: 'Plural dólares, accent and all. Cuban slang for dollars: fulas.'}
  form: dólar
  spelled: {es-Latn/standard: [dólar]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [dólares]}, status: pinned}
- id: lexeme:dónde
  pos: ADV
  feats: {PronType: Int}
  gloss: {en: where}
  notes: {en: 'With the accent when it asks. Cubans keep the subject before the verb: ¿Dónde tú vives?'}
  form: dónde
  spelled: {es-Latn/standard: [dónde]}
- id: lexeme:echar
  pos: VERB
  gloss: {en: to put in; to add; to throw}
  notes: {en: 'No h: echar, echa, eché (hecho, with an h, is from hacer). Échale sal: put some salt in it; adding le brings a written accent. Echar is what Cubans say for adding to a pot.'}
  form: echar
  spelled: {es-Latn/standard: [echar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '2', Polarity: Neg, VerbForm: Fin}, spelled: {es-Latn/standard: [eches]}, status: pinned}
  - {feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, spelled: {es-Latn/standard: [écha]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [echo]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [echa]}, status: pinned}
- id: lexeme:edad-de-oro
  pos: PROPN
  gloss: {en: 'La Edad de Oro (The Golden Age), Martí''s magazine for children'}
  notes: {en: 'A monthly magazine for the children of America that Martí wrote almost alone in New York in 1889: four issues of stories, poems and articles (Los zapaticos de rosa, Tres héroes). Gathered into a book, it is still what Cuban children read first of Martí.'}
  form: Edad de Oro
  spelled: {es-Latn/standard: [Edad de Oro]}
- id: lexeme:edificio
  pos: NOUN
  gloss: {en: building}
  notes: {en: 'E-di-fi-cio: with d, f and c, and no accent. Most buildings in Centro Habana are from the early 1900s: high ceilings, columns, iron balconies, and many in need of repair.'}
  form: edificio
  spelled: {es-Latn/standard: [edificio]}
