  gloss: {en: thatched hut (rural Cuba)}
  notes: {en: 'The Taíno word for the Cuban country house: walls of palm boards, a roof of palm leaves (guano), a dirt floor. Bo-hí-o: the í is stressed, so it takes the accent.'}
