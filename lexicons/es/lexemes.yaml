- id: lexeme:tranque
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: 'blocked game (dominó: nobody can play)'}
  notes: {en: 'From trancar, to bar a door: se trancó el juego. Then the points left in each hand are counted, and the lowest wins.'}
  form: tranque
  spelled: {es-Latn/standard: [tranque]}
