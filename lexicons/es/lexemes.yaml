- id: lexeme:hache
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: aitch (the letter h)}
  notes: {en: 'The h is silent in Spanish, so it is learned word by word: hola, hay, hoy, hacer, hablar, hermano, ahora, ahí. Lleva hache: it has an h. To tell b from v, people say b de burro, v de vaca.'}
  form: hache
  spelled: {es-Latn/standard: [hache]}
