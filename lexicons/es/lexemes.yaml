- id: lexeme:salsa
  pos: NOUN
  gloss: {en: salsa (music and dance); sauce}
  notes: {en: Built on the Cuban son by Cuban and Puerto Rican musicians in New York in the 1960s and 70s. Also any sauce.}
  form: salsa
  spelled: {es-Latn/standard: [salsa]}
- id: lexeme:salud
  pos: INTJ
  gloss: {en: 'health; ¡salud!: bless you; cheers'}
  notes: {en: '¡Salud! after a sneeze, and when glasses are raised. La salud es lo primero: health comes first.'}
  form: salud
  spelled: {es-Latn/standard: [salud]}
- id: lexeme:se
  pos: PRON
  feats: {PronType: Prs, Reflex: 'Yes'}
  gloss: {en: 'himself, herself, yourself (usted), themselves'}
  notes: {en: 'Se llama: his or her name is. Sé with an accent is I know.'}
  form: se
  spelled: {es-Latn/standard: [se]}
- id: lexeme:se.impersonal
  pos: PRON
  feats: {PronType: Prs, Reflex: 'Yes'}
  gloss: {en: 'one; you (impersonal se: se pica, you chop)'}
  notes: {en: 'The se of recipes and rules: se pica la cebolla, you chop the onion (the onion is chopped). With a plural the verb is plural: se pican la cebolla y el ají. Sé, with an accent, is I know.'}
  form: se
  spelled: {es-Latn/standard: [se]}
- id: lexeme:secar
  pos: VERB
  gloss: {en: to dry}
  notes: {en: 'The leaves dry for weeks, hung on poles in the casa de tabaco, a tall barn thatched with palm whose doors are opened and shut to let the air in. Before e, c becomes qu: sequé.'}
  form: secar
  spelled: {es-Latn/standard: [secar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [secan]}, status: pinned}
- id: lexeme:seis
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: six}
  notes: {en: 'Seis has no accent, but dieciséis (16) and veintiséis (26) do.'}
  form: seis
  spelled: {es-Latn/standard: [seis]}
- id: lexeme:semana
  pos: NOUN
  gloss: {en: week}
  notes: {en: 'La semana que viene or la próxima semana: next week.'}
  form: semana
  spelled: {es-Latn/standard: [semana]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [semanas]}, status: pinned}
- id: lexeme:sembrar
  pos: VERB
  classes: [e-ie]
  gloss: {en: to sow; to plant}
  notes: {en: 'E becomes ie: siembro, siembras, siembra. Cubans use it for any planting: sembrar una mata de mango, sembrar frijoles. Plantar exists but is less common.'}
  form: sembrar
  spelled: {es-Latn/standard: [sembrar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [siembra]}, status: pinned}
- id: lexeme:sencillo
  pos: ADJ
  gloss: {en: simple; plain; modest}
  notes: {en: 'Una persona sencilla: a modest, down-to-earth person. Versos sencillos (Simple Verses, New York, 1891): forty-six short poems that Martí says came to him in the Catskill mountains, where he went to rest in 1890. With c and ll: sen-ci-llo, though Cubans say s and y.'}
  form: sencillo
  spelled: {es-Latn/standard: [sencillo]}
  forms:
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [sencillos]}, status: pinned}
- id: lexeme:sentarse
  pos: VERB
  classes: [e-ie]
  gloss: {en: to sit down; to sit}
  notes: {en: 'E becomes ie: me siento, te sientas, se sienta. Me siento is also I feel (from sentirse): me siento bien. Telling someone to sit: siéntate (tú), siéntese (usted).'}
  form: sentar+se
  spelled: {es-Latn/standard: [sentarse]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [sienta]}, status: pinned}
- id: lexeme:sentido
  pos: NOUN
  gloss: {en: 'sense; meaning; tener sentido: to make sense'}
  notes: {en: 'Eso tiene sentido: that makes sense. Hace sentido, from English makes sense, is heard all over Miami; in an interview or in writing, say tiene sentido. Also el sentido del humor, a sense of humour.'}
  form: sentido
  spelled: {es-Latn/standard: [sentido]}
- id: lexeme:sentir
  pos: VERB
  classes: [e-ie]
  gloss: {en: to be sorry; to feel}
  notes: {en: 'Lo siento: I''m sorry. Siento que no puedas venir: I''m sorry you can''t come, with the subjunctive. The e becomes ie: siento, sientes. Feeling well or ill is sentirse: me siento bien.'}
  form: sentir
  spelled: {es-Latn/standard: [sentir]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [siento]}, status: pinned}
- id: lexeme:sentirse
  pos: VERB
  classes: [e-ie]
  gloss: {en: 'to feel (well, ill, tired)'}
  notes: {en: 'Me siento bien, ¿cómo se siente usted? E becomes ie: siento, sientes. Without se, sentir is to feel something or to be sorry (lo siento). Me siento is also I sit down (sentarse).'}
  form: sentir+se
  spelled: {es-Latn/standard: [sentirse]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [sienten]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [siento]}, status: pinned}
