- id: lexeme:hecho
  pos: INTJ
  gloss: {en: 'done; a fact; ¡hecho!: deal!'}
  notes: {en: 'With h, from hacer: ¡Hecho! (it''s a deal!, done!). Echo, without an h, is from echar: echo la carta en el paquete.'}
  form: hecho
  spelled: {es-Latn/standard: [hecho]}
- id: lexeme:hermano
  pos: NOUN
  chooses: [Gender]
  gloss: {en: 'brother (hermana: sister)'}
  notes: {en: 'Hermanos is brothers, or brothers and sisters: siblings. Cubans also call a close friend mi hermano, or mi herma.'}
  form: hermano
  spelled: {es-Latn/standard: [hermano]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [hermana]}, status: pinned}
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [hermanos]}, status: pinned}
- id: lexeme:herrero
  pos: NOUN
  gloss: {en: blacksmith}
  notes: {en: 'From hierro, iron; both with h, which no one says. En casa del herrero, cuchillo de palo: the blacksmith''s house has wooden knives; the shoemaker''s children go barefoot.'}
  form: herrero
  spelled: {es-Latn/standard: [herrero]}
- id: lexeme:hialeah
  pos: PROPN
  feats: {Gender: Masc}
  gloss: {en: Hialeah (a city in Miami-Dade)}
  notes: {en: Next to Miami; most of its people are Cuban or of Cuban descent.}
  form: Hialeah
  spelled: {es-Latn/standard: [Hialeah]}
- id: lexeme:hijo
  pos: NOUN
  chooses: [Gender]
  gloss: {en: 'son (hija: daughter)'}
  notes: {en: 'Los hijos: sons, or children. Said fast, mi hijo and mi hija become mi''jo and mi''ja.'}
  form: hijo
  spelled: {es-Latn/standard: [hijo]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [hija]}, status: pinned}
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [hijos]}, status: pinned}
- id: lexeme:historia
  pos: NOUN
  gloss: {en: history; story}
  notes: {en: 'With an h that no one says. La historia is both history and a story; un cuento is a tale (los cuentos de Abuela). La historia de Cuba: Cuban history.'}
  form: historia
  spelled: {es-Latn/standard: [historia]}
- id: lexeme:hoja
  pos: NOUN
  gloss: {en: leaf; sheet (of paper)}
  notes: {en: 'With a silent h: la hoja. Una hoja de papel: a sheet of paper. A cigar is made of three kinds of leaf: the filler (la tripa), the binder (el capote) and the wrapper (la capa).'}
  form: hoja
  spelled: {es-Latn/standard: [hoja]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [hojas]}, status: pinned}
- id: lexeme:hola
  pos: INTJ
  gloss: {en: hello; hi}
  image: {file: ../../courses/images/wave.svg, license: CC0-1.0, provenance: {author: 'llm:claude@17fb3acb2f3b', status: draft}, source: Drawn for Nabu (courses/images)}
  form: hola
  spelled: {es-Latn/standard: [hola]}
- id: lexeme:hombre
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: man}
  notes: {en: 'With a silent h: hom-bre; plural hombres. ¡Hombre! is also an exclamation: ¡Claro, hombre!, of course! Martí''s first poem in Versos sencillos opens with a sincere man saying who he is.'}
  form: hombre
  spelled: {es-Latn/standard: [hombre]}
- id: lexeme:hora
  pos: NOUN
  gloss: {en: hour; time (of day)}
  notes: {en: 'The h is never said but always written. ¿Qué hora es? Es la una (one o''clock is singular); son las dos, son las tres.'}
  form: hora
  spelled: {es-Latn/standard: [hora]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [horas]}, status: pinned}
- id: lexeme:hoy
  pos: ADV
  gloss: {en: today}
  notes: {en: With an h that is never said.}
  form: hoy
  spelled: {es-Latn/standard: [hoy]}
- id: lexeme:héroe
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: hero}
  notes: {en: 'With an accent: hé-ro-e, three syllables. Martí is el Héroe Nacional: his birthday, 28 January, is marked in Cuban schools, and his bust stands in schools and parks in Havana and in Miami. A woman is una heroína.'}
  form: héroe
  spelled: {es-Latn/standard: [héroe]}
- id: lexeme:idioma
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: language}
  notes: {en: 'Masculine though it ends in -a: el idioma, like el día and el problema. La lengua says the same (and is also the tongue). Languages take no capital: el inglés, el español.'}
  form: idioma
  spelled: {es-Latn/standard: [idioma]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [idiomas]}, status: pinned}
- id: lexeme:importante
  pos: ADJ
  gloss: {en: important}
  notes: {en: 'Es importante que + subjunctive: it''s important that… Lo importante es…: the important thing is… One form for both genders.'}
  form: importante
  spelled: {es-Latn/standard: [importante]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [importante]}, status: pinned}
- id: lexeme:industriales
  pos: PROPN
  feats: {Gender: Masc}
  gloss: {en: Industriales (Havana's baseball team)}
  notes: {en: 'Los Industriales, also los Azules (the Blues): the most famous team of Cuba''s Serie Nacional, and the one every other province loves to beat. Ser de los Industriales: to root for them.'}
  form: Industriales
  spelled: {es-Latn/standard: [Industriales]}
- id: lexeme:inglés
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: English}
  notes: {en: 'No capital in Spanish, and an accent on the singular only: inglés, but inglesa, ingleses. Many Cuban-American children answer their grandparents in English while understanding every word.'}
  form: inglés
  spelled: {es-Latn/standard: [inglés]}
- id: lexeme:interesar
  pos: VERB
  gloss: {en: 'to interest; me interesa: I''m interested in it'}
  notes: {en: 'Like gustar: me interesa la música, me interesan los discos. Estoy interesado en… is correct too, but me interesa is what people say.'}
  form: interesar
  spelled: {es-Latn/standard: [interesar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [interesa]}, status: pinned}
- id: lexeme:invitar
  pos: VERB
