- id: lexeme:sacar
  pos: VERB
  gloss: {en: 'to take out; sacar a bailar: to ask to dance'}
  notes: {en: 'Sacar a bailar: to ask someone to dance, to lead them onto the floor. Saqué, I took out: c becomes qu before e.'}
  form: sacar
  spelled: {es-Latn/standard: [sacar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [sacó]}, status: pinned}
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [saca]}, status: pinned}
  - {feats: {Mood: Sub, Number: Sing, Tense: Imp, VerbForm: Fin}, spelled: {es-Latn/standard: [sacara]}, status: pinned}
- id: lexeme:sacrificio
  pos: NOUN
  gloss: {en: sacrifice}
  notes: {en: 'With c twice: sa-cri-fi-cio. Hacer sacrificios: to make sacrifices. Children of exiles grow up hearing about los sacrificios de los viejos.'}
  form: sacrificio
  spelled: {es-Latn/standard: [sacrificio]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [sacrificios]}, status: pinned}
- id: lexeme:sal
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: salt}
  notes: {en: 'La sal: feminine. Sal is also the tú command of salir: ¡sal de la cocina!, get out of the kitchen.'}
  form: sal
  spelled: {es-Latn/standard: [sal]}
- id: lexeme:sala
  pos: NOUN
  gloss: {en: living room}
  notes: {en: 'The front room of a Cuban house: visits, the TV, the novela.'}
  form: sala
  spelled: {es-Latn/standard: [sala]}
- id: lexeme:salir
  pos: VERB
  classes: [go, short-imperative]
  gloss: {en: 'to go out; to leave; to come out; salir bien: to turn out well'}
  notes: {en: 'Salir de Cuba: to leave Cuba. Yo salgo, with a g. Todo va a salir bien: everything will turn out fine. Leaving something behind is dejar: dejé las llaves en la casa, I left my keys at home.'}
  form: salir
  spelled: {es-Latn/standard: [salir]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [salieron]}, status: pinned}
