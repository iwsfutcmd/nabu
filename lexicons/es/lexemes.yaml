- id: lexeme:serio
  pos: ADJ
  gloss: {en: 'serious; reliable, responsible'}
  notes: {en: 'Un muchacho serio, una muchacha seria: high praise from a Cuban abuela. Seria (serious) has no accent; sería, with one, is would be (ser).'}
  form: serio
  spelled: {es-Latn/standard: [serio]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [seria]}, status: pinned}
- id: lexeme:sesenta
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: 'sixty; los (años) sesenta: the sixties'}
  notes: {en: 'Los sesenta: the first great wave of the exile, from the Pedro Pan children (1960–62) to the Freedom Flights. Sesenta (60) and setenta (70) are easy to mix up: s as in seis, t as in siete.'}
  form: sesenta
  spelled: {es-Latn/standard: [sesenta]}
- id: lexeme:setenta
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: seventy}
  notes: {en: 'Setenta y nueve: from thirty-one on, tens and units are separate words joined by y.'}
  form: setenta
  spelled: {es-Latn/standard: [setenta]}
- id: lexeme:señor
  pos: NOUN
  gloss: {en: sir; Mr; gentleman}
  notes: {en: 'Señora for a woman, señorita for a young one. Before a surname it takes el when you talk about him (el señor Díaz) but not when you talk to him (buenos días, señor Díaz).'}
  form: señor
  spelled: {es-Latn/standard: [señor]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [señores]}, status: pinned}
- id: lexeme:señora
  pos: NOUN
  gloss: {en: madam; ma'am; Mrs; lady}
  notes: {en: Señor for a man.}
  form: señora
  spelled: {es-Latn/standard: [señora]}
- id: lexeme:shopping
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: hard-currency store (Cuba)}
  notes: {en: 'La shopping (feminine, said chópin): in Cuba, a state store that sells in hard currency. In Miami people say el mall.'}
  form: shopping
  spelled: {es-Latn/standard: [shopping]}
- id: lexeme:si
  pos: SCONJ
  gloss: {en: if}
  notes: {en: 'No accent: si tú quieres, if you want. Sí, with its accent, is yes, and the yo sí of yo sí sé (I do know). Sí, si tú quieres: yes, if you want.'}
  form: si
  spelled: {es-Latn/standard: [si]}
- id: lexeme:siempre
  pos: ADV
  gloss: {en: always}
  form: siempre
  spelled: {es-Latn/standard: [siempre]}
- id: lexeme:siete
  pos: NUM
  feats: {NumType: Card}
  gloss: {en: seven}
  notes: {en: 'Seventy is setenta: the ie of siete becomes e.'}
  form: siete
  spelled: {es-Latn/standard: [siete]}
- id: lexeme:sillón
  pos: NOUN
  gloss: {en: rocking chair}
  notes: {en: 'In Cuba a sillón is a rocking chair, the kind on every portal. Elsewhere sillón is an armchair, and a rocking chair a mecedora.'}
  form: sillón
  spelled: {es-Latn/standard: [sillón]}
- id: lexeme:sin
  pos: ADP
  gloss: {en: without}
  notes: {en: 'The opposite of con: café con leche, café sin leche.'}
  form: sin
  spelled: {es-Latn/standard: [sin]}
- id: lexeme:sin-embargo
  pos: ADV
  gloss: {en: however; nevertheless}
  notes: {en: 'For a speech or for writing, after a full stop or a semicolon and followed by a comma: llegó sin nada; sin embargo, nos dio todo. In conversation Cubans more often say pero, or aun así.'}
  form: sin embargo
  spelled: {es-Latn/standard: [sin embargo]}
- id: lexeme:sincero
  pos: ADJ
  gloss: {en: sincere; honest}
  notes: {en: 'Sincera for a woman. Written with c, though Cubans say it with an s: sin-ce-ro. Para serte sincero: to be honest with you.'}
  form: sincero
  spelled: {es-Latn/standard: [sincero]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [sincera]}, status: pinned}
- id: lexeme:sofrito
  pos: NOUN
  gloss: {en: 'sofrito: onion, garlic and pepper fried slowly'}
  notes: {en: 'Onion, garlic and ají fried slowly in oil, often with tomato, cumin and oregano: the start of picadillo, frijoles negros and ropa vieja.'}
  form: sofrito
  spelled: {es-Latn/standard: [sofrito]}
- id: lexeme:solar
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: 'tenement (Cuban): an old house divided into rooms'}
  notes: {en: 'In Cuba un solar is a big old house split into rooms, one family to a room, round a shared courtyard; also called una cuartería. Un solar is also a plot of land, and a solar yermo an empty lot. The rumba was born in the solares of Havana and Matanzas.'}
  form: solar
  spelled: {es-Latn/standard: [solar]}
- id: lexeme:solicitar
  pos: VERB
  gloss: {en: to apply for; to request}
  notes: {en: 'Solicitar un puesto, el pasaporte, una beca: to apply for a job, a passport, a scholarship. La solicitud: the application. In Miami you hear aplicar para un trabajo, from English apply for.'}
  form: solicitar
  spelled: {es-Latn/standard: [solicitar]}
