- id: lexeme:permiso
  pos: NOUN
  gloss: {en: 'permission; con permiso: excuse me (to pass, come in or leave)'}
  notes: {en: 'Say con permiso when you walk past someone, come into a house or get up from the table. Cubans answer ¡propio! or ¡adelante!'}
  form: permiso
  spelled: {es-Latn/standard: [permiso]}
- id: lexeme:pero
  pos: CCONJ
  gloss: {en: but}
  notes: {en: 'One r. Perro, with a rolled double r, is a dog.'}
  form: pero
  spelled: {es-Latn/standard: [pero]}
- id: lexeme:pescar
  pos: VERB
  gloss: {en: to fish; to catch (a fish)}
  notes: {en: 'Un pez is a live fish, un pescado one you eat. On the Malecón men fish with a line wound round a can, or float out on a tyre inner tube to fish further out. Before e, c becomes qu: pesqué.'}
  form: pescar
  spelled: {es-Latn/standard: [pescar]}
  forms:
  - {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [pescan]}, status: pinned}
- id: lexeme:peso
  pos: NOUN
  gloss: {en: peso (money); weight}
  notes: {en: 'Cuba''s money is the peso cubano. In Miami, pesos often just means dollars: me costó veinte pesos.'}
  form: peso
  spelled: {es-Latn/standard: [peso]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [pesos]}, status: pinned}
- id: lexeme:picadillo
  pos: NOUN
  gloss: {en: Cuban ground beef hash}
  notes: {en: 'Ground beef cooked in sofrito with tomato, olives and raisins (picadillo a la habanera), with white rice, black beans and maduros. From picar, to chop.'}
  form: picadillo
  spelled: {es-Latn/standard: [picadillo]}
- id: lexeme:picar
  pos: VERB
  gloss: {en: to chop; to dice; to cut up}
  notes: {en: 'In the Cuban kitchen picar is to chop: pica la cebolla. Pique, no piques: c becomes qu before e. Also to sting or to itch; spicy is picante (in Mexico, pica means it''s hot).'}
  form: picar
  spelled: {es-Latn/standard: [picar]}
  forms:
  - {feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, spelled: {es-Latn/standard: [pica]}, status: pinned}
