- id: lexeme:tubo
  pos: NOUN
  gloss: {en: tube; pipe; (Cuba) the phone}
  notes: {en: 'With b. Coger el tubo: to pick up the phone; te doy un tubazo: I''ll give you a call. Tuvo, with v, is from tener (no tuvo tiempo, she had no time): they sound the same.'}
  form: tubo
  spelled: {es-Latn/standard: [tubo]}
- id: lexeme:turista
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: tourist}
  notes: {en: 'Ends in -a for a man or a woman: el turista, la turista, like el artista. Cubans also call a foreigner, above all an American, un yuma (slang).'}
  form: turista
  spelled: {es-Latn/standard: [turista]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [turistas]}, status: pinned}
- id: lexeme:turno
  pos: NOUN
  gloss: {en: appointment (Cuban); turn}
  notes: {en: 'Cubans say tener turno con el médico; most other places, and many in Miami, say tener cita. Also your turn in a game or a line: ahora es mi turno.'}
  form: turno
  spelled: {es-Latn/standard: [turno]}
- id: lexeme:turrón
  pos: NOUN
  gloss: {en: turrón (nougat)}
  notes: {en: 'Almond nougat from Spain, hard (de Alicante) or soft (de Jijona): every Cuban Christmas table has it. Turrón has an accent; turrones does not.'}
  form: turrón
  spelled: {es-Latn/standard: [turrón]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [turrones]}, status: pinned}
- id: lexeme:té
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: tea}
  notes: {en: 'With an accent, to tell it from te (you: te llamo). Cubans drink coffee; tea, like tilo and manzanilla, is what Abuela makes when you are sick or nervous.'}
  form: té
  spelled: {es-Latn/standard: [té]}
- id: lexeme:tío
  pos: NOUN
  chooses: [Gender]
  gloss: {en: 'uncle (tía: aunt)'}
  notes: {en: 'Los tíos: uncles, or aunts and uncles. Like abuela, tía goes before a name: tía Marisol.'}
  form: tío
  spelled: {es-Latn/standard: [tío]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [tía]}, status: pinned}
