  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [siente]}, status: pinned}
- id: lexeme:separarse
  pos: VERB
  gloss: {en: to be separated; to split up}
  notes: {en: 'La familia se separó: the family was split up. Of a couple: to separate. Spelled with a after the p, like English separate.'}
  form: separar+se
  spelled: {es-Latn/standard: [separarse]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, spelled: {es-Latn/standard: [separó]}, status: pinned}
