  form: rufo
  spelled: {es-Latn/standard: [rufo]}
- id: lexeme:río
  pos: NOUN
  gloss: {en: river}
  notes: {en: 'Rí-o, with an accent. Matanzas, the city of bridges, stands where the rivers San Juan and Yumurí reach the bay.'}
  form: río
  spelled: {es-Latn/standard: [río]}
  forms:
