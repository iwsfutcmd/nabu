  feats: {Gender: Masc}
  gloss: {en: 'king; los Reyes (Magos): the Three Kings'}
  notes: {en: 'On the night of January 5 children leave grass and water for the camels, and los Reyes Magos leave presents. Before 1959 this, not Christmas, was the day of presents in Cuba; Little Havana holds a Three Kings parade every year.'}
  form: rey
  spelled: {es-Latn/standard: [rey]}
  forms:
