- id: lexeme:pinar-del-río
  pos: PROPN
  gloss: {en: Pinar del Río (Cuba's westernmost province)}
  notes: {en: 'Un pinar is a pine wood: the town was named for a pine grove by a river. Its Vuelta Abajo district grows the tobacco of the most famous Cuban cigars. Someone from there is pinareño, pinareña.'}
  form: Pinar del Río
  spelled: {es-Latn/standard: [Pinar del Río]}
- id: lexeme:planilla
  pos: NOUN
  gloss: {en: form (to fill in) (Cuban)}
  notes: {en: 'What Cubans call a form you fill in: llenar una planilla. Elsewhere el formulario, which is accepted too. In Spain una planilla is a template.'}
  form: planilla
  spelled: {es-Latn/standard: [planilla]}
- id: lexeme:plato
  pos: NOUN
  gloss: {en: plate; dish (food)}
  notes: {en: 'Both the plate and what is on it: un plato de arroz, un plato típico. El plato fuerte: the main course, or the highlight. Fregar los platos: to do the dishes.'}
  form: plato
  spelled: {es-Latn/standard: [plato]}
- id: lexeme:playa
  pos: NOUN
  gloss: {en: beach}
  notes: {en: 'Habaneros go to the Playas del Este, a short ride east of the city.'}
  form: playa
  spelled: {es-Latn/standard: [playa]}
- id: lexeme:plaza
  pos: NOUN
  gloss: {en: square; plaza}
  notes: {en: 'La Habana Vieja grew around four old squares: la Plaza de Armas, la Plaza de San Francisco, la Plaza Vieja and la Plaza de la Catedral. With z: plaza, plazas.'}
  form: plaza
  spelled: {es-Latn/standard: [plaza]}
- id: lexeme:plátano
  pos: NOUN
  gloss: {en: plantain; banana}
  notes: {en: 'In Cuba the plátano is the plantain, cooked green (tostones) or ripe (maduros). A sweet banana is a plátano fruta (guineo in Puerto Rico and the Dominican Republic, banana elsewhere). The accent is on the first a: PLÁ-ta-no.'}
  form: plátano
  spelled: {es-Latn/standard: [plátano]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [plátanos]}, status: pinned}
- id: lexeme:pobre
  pos: ADJ
  gloss: {en: poor}
  notes: {en: 'Before a noun it means unfortunate: ¡pobre Yunior!, poor Yunior.'}
  form: pobre
  spelled: {es-Latn/standard: [pobre]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [pobre]}, status: pinned}
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [pobres]}, status: pinned}
- id: lexeme:poco
  pos: PRON
  feats: {PronType: Ind}
  gloss: {en: 'little; a little, a bit (un poco)'}
  notes: {en: 'Un poco de sal: a little salt. Un poquito: a tiny bit. Cubans also say un chin: un chin de sal.'}
  form: poco
  spelled: {es-Latn/standard: [poco]}
- id: lexeme:poder
  pos: VERB
  classes: [o-ue, strong]
  gloss: {en: can; to be able to}
  notes: {en: 'Puedo, puedes, puede, pueden: the o becomes ue, but not in podemos. With an infinitive: no puedo ir, I can''t go.'}
  form: poder
  spelled: {es-Latn/standard: [poder]}
