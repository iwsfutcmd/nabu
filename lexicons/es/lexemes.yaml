  notes: {en: 'Estudiar medicina, estudiar en la universidad. ¿Qué tú estudias?: what are you studying?, what''s your major? (the Cuban order, subject before the verb).'}
  form: estudiar
  spelled: {es-Latn/standard: [estudiar]}
