  notes: {en: 'En el trabajo: at work. Trabajo is also I work, from trabajar.'}
  form: trabajo
  spelled: {es-Latn/standard: [trabajo]}
- id: lexeme:traer
  pos: VERB
  classes: [go, strong]
  gloss: {en: to bring}
  notes: {en: 'Traigo, with g; the past is traje, trajo, trajeron, and so trajera, trajéramos (si la trajéramos). Trajiera and trayera are heard at home, but never write them. Traer is to bring here; llevar is to take there.'}
  form: traer
  spelled: {es-Latn/standard: [traer]}
