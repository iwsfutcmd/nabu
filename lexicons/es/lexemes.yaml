- id: lexeme:data
  pos: NOUN
  gloss: {en: 'hand (your ten tiles, in Cuban dominó)'}
  notes: {en: 'Cuban dominó talk: ¡qué data más mala! What a bad hand! At the table you never say what your data is: your pareja has to read it from what you play.'}
  form: data
  spelled: {es-Latn/standard: [data]}
- id: lexeme:de
  pos: ADP
  gloss: {en: of; from}
  form: de
  spelled: {es-Latn/standard: [de]}
- id: lexeme:debajo
  pos: ADV
  gloss: {en: under; underneath (debajo de)}
  notes: {en: 'Debajo de la mesa: under the table; debajo del colchón, with del (de + el). Abajo, on its own, is downstairs or down below.'}
  form: debajo
  spelled: {es-Latn/standard: [debajo]}
- id: lexeme:deber
  pos: VERB
  gloss: {en: should; must; to owe}
  notes: {en: 'Usted debe descansar: you should rest. No debe: you shouldn''t. Debo cien dólares: I owe a hundred dollars.'}
  form: deber
  spelled: {es-Latn/standard: [deber]}
