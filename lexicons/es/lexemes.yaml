  pos: VERB
  classes: [o-ue]
  gloss: {en: to stir; to mix}
  notes: {en: 'Revuelve, no revuelvas: the o becomes ue when stressed. Cubans never stir the rice once the pot is covered. Revólver, with an accent, is a gun.'}
  form: revolver
