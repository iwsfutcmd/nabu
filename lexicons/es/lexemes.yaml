- id: lexeme:sombrero
  pos: NOUN
  gloss: {en: hat}
  notes: {en: 'Any hat with a brim, not only a Mexican one. El sombrero de yarey is the guajiro''s woven palm hat. A cap is una gorra.'}
  form: sombrero
  spelled: {es-Latn/standard: [sombrero]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [sombreros]}, status: pinned}
- id: lexeme:son
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: son (Cuban music)}
  notes: {en: 'Born in eastern Cuba (el Oriente), the root of salsa: guitar and tres, bongó, maracas, clave and voices. Plural sones. Son is also ser: ellos son, they are.'}
  form: son
  spelled: {es-Latn/standard: [son]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [sones]}, status: pinned}
- id: lexeme:soñar
  pos: VERB
  classes: [o-ue]
  gloss: {en: 'to dream (soñar con: to dream of)'}
  notes: {en: 'O becomes ue: sueño, sueñas, sueña. Soñar con, never soñar de (from English dream of): sueño con volver, I dream of going back; anoche soñé contigo.'}
  form: soñar
  spelled: {es-Latn/standard: [soñar]}
  forms:
  - {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [sueña]}, status: pinned}
- id: lexeme:su
  pos: DET
  feats: {Poss: 'Yes', PronType: Prs}
  gloss: {en: 'his; her; its; their; your (usted, ustedes)'}
  notes: {en: 'Sus before a plural. Su hijo can be his, her, their or your son: what comes before tells you whose.'}
  form: su
  spelled: {es-Latn/standard: [su]}
  forms:
  - {feats: {Gender: Fem, Number: Plur}, spelled: {es-Latn/standard: [sus]}, status: pinned}
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [su]}, status: pinned}
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [sus]}, status: pinned}
- id: lexeme:suerte
  pos: NOUN
  feats: {Gender: Fem}
  gloss: {en: luck}
  notes: {en: 'Tener suerte: to be lucky. ¡Qué suerte! What luck!'}
  form: suerte
  spelled: {es-Latn/standard: [suerte]}
- id: lexeme:sueño
  pos: NOUN
  gloss: {en: 'dream; sleep (tener sueño: to be sleepy)'}
  notes: {en: 'Mi sueño es volver: my dream is to go back. El sueño americano: the American dream. Tengo sueño: I''m sleepy (never estoy sueño). With ñ.'}
  form: sueño
  spelled: {es-Latn/standard: [sueño]}
- id: lexeme:sufrir
  pos: VERB
  gloss: {en: to suffer}
  notes: {en: 'Sufrir por amor: to suffer for love, the subject of every bolero. Sufrir de: to suffer from (sufre de la presión).'}
  form: sufrir
  spelled: {es-Latn/standard: [sufrir]}
  forms:
  - {feats: {Mood: Sub, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, spelled: {es-Latn/standard: [sufras]}, status: pinned}
- id: lexeme:sábado
  pos: NOUN
  gloss: {en: Saturday}
  notes: {en: 'With an accent on the first á. On Saturdays: los sábados.'}
  form: sábado
  spelled: {es-Latn/standard: [sábado]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [sábados]}, status: pinned}
- id: lexeme:sí
  pos: INTJ
  gloss: {en: 'yes'}
  notes: {en: With its accent. Si without one means if.}
  form: sí
  spelled: {es-Latn/standard: [sí]}
- id: lexeme:tabaco
  pos: NOUN
  gloss: {en: tobacco; cigar (Cuban)}
  notes: {en: 'In Cuba un tabaco is a cigar (Spain says un puro) and un cigarro is a cigarette. The man or woman who rolls cigars is un torcedor, una torcedora. With b: tabaco.'}
  form: tabaco
  spelled: {es-Latn/standard: [tabaco]}
- id: lexeme:talla
  pos: NOUN
  gloss: {en: 'size (of clothes); estar en talla: to be with it, looking sharp (Cuban)'}
  notes: {en: '¿Qué talla tú usas?: what size do you wear? In Cuban slang estar en talla is to be up to date, with it, looking good: ese pulóver está en talla. Ponerse en talla: to get up to speed.'}
  form: talla
  spelled: {es-Latn/standard: [talla]}
- id: lexeme:también
  pos: ADV
  gloss: {en: also; too; as well}
  notes: {en: 'Yo también: me too.'}
  form: también
  spelled: {es-Latn/standard: [también]}
- id: lexeme:tan
  pos: ADV
  gloss: {en: as; so}
  notes: {en: 'Tan… como: as… as (tan bien como Lili). With a noun, tanto… como: tanta música como tú. ¡Tan lindo!: so sweet!'}
  form: tan
  spelled: {es-Latn/standard: [tan]}
- id: lexeme:tarde
  pos: ADV
  gloss: {en: afternoon; evening; late}
  notes: {en: 'La tarde lasts until dark: por la tarde, in the afternoon. Tarde alone means late: me levanto tarde.'}
  form: tarde
  spelled: {es-Latn/standard: [tarde]}
- id: lexeme:te
  pos: PRON
  feats: {PronType: Prs}
  gloss: {en: you; yourself (tú)}
  notes: {en: Té with an accent is tea.}
  form: te
  spelled: {es-Latn/standard: [te]}
- id: lexeme:techo
  pos: NOUN
  gloss: {en: roof; ceiling}
  notes: {en: El techo is both the roof and the ceiling inside; la azotea is a flat roof you can walk on. Miami Spanglish says el rufo.}
  form: techo
  spelled: {es-Latn/standard: [techo]}
- id: lexeme:televisión
  pos: NOUN
  gloss: {en: television; TV}
  notes: {en: 'La tele for short. En la tele: on TV.'}
  form: televisión
  spelled: {es-Latn/standard: [televisión, tele]}
- id: lexeme:teléfono
  pos: NOUN
  gloss: {en: phone; telephone; phone number}
  notes: {en: 'Stressed and written on the lé: te-LÉ-fo-no. ¿Cuál es tu teléfono? asks for the number. A mobile is el celular in Miami and most of Latin America, el móvil in Cuba and Spain.'}
  form: teléfono
  spelled: {es-Latn/standard: [teléfono]}
- id: lexeme:temprano
  pos: ADV
  gloss: {en: early}
  notes: {en: 'Its opposite is tarde, late.'}
  form: temprano
  spelled: {es-Latn/standard: [temprano]}
- id: lexeme:tender
  pos: VERB
  classes: [e-ie]
  gloss: {en: to hang out (laundry); to spread out}
  notes: {en: 'Tender la ropa: to hang out the washing. Cubans also say tender la cama for making the bed (hacer la cama elsewhere). E becomes ie: tiendo, tiendes, tiende.'}
  form: tender
  spelled: {es-Latn/standard: [tender]}
