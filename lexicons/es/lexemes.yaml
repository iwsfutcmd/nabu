  notes: {en: 'Formal, and mostly after a preposition: el balcón desde el cual se ve el mar. It takes the article of its noun: el cual, la cual, los cuales, las cuales. No accent when it joins; ¿cuál? asks. In speech Cubans say el que or donde: el balcón desde el que se ve el mar.'}
