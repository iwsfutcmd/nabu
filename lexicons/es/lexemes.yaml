- id: lexeme:poema
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: poem}
  notes: {en: 'Masculine despite the -a: el poema, like el problema and el idioma. La poesía is poetry, and also a single poem. Recitar un poema: to recite one.'}
  form: poema
  spelled: {es-Latn/standard: [poema]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [poemas]}, status: pinned}
- id: lexeme:poeta
  pos: NOUN
  feats: {Gender: Masc}
  gloss: {en: poet}
  notes: {en: 'Ends in -a but is masculine: el poeta, like el turista; a woman is la poeta or la poetisa. Gran before a noun means great: un gran poeta. After it, grande means big.'}
  form: poeta
  spelled: {es-Latn/standard: [poeta]}
- id: lexeme:pollo
  pos: NOUN
  gloss: {en: chicken}
  notes: {en: 'Written with ll, said like y in Cuba and most of the Americas. Arroz con pollo is a Sunday dish.'}
  form: pollo
  spelled: {es-Latn/standard: [pollo]}
- id: lexeme:pomo
  pos: NOUN
  gloss: {en: bottle; jar (Cuban)}
  notes: {en: 'Cuban for any bottle or jar: un pomo de agua, un pomo de ron. Elsewhere botella or frasco; in Spain a pomo is a doorknob or a perfume bottle.'}
  form: pomo
  spelled: {es-Latn/standard: [pomo]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [pomos]}, status: pinned}
- id: lexeme:ponchar
  pos: VERB
  gloss: {en: to strike out (a batter)}
  notes: {en: 'Ponchar a alguien: to strike someone out; poncharse: to strike out. In Cuba and Mexico a flat tyre is also ponchada: se ponchó la goma.'}
  form: ponchar
  spelled: {es-Latn/standard: [ponchar]}
  forms:
  - {feats: {Tense: Past, VerbForm: Part}, spelled: {es-Latn/standard: [ponchado]}, status: pinned}
- id: lexeme:poner
  pos: VERB
  classes: [go, strong, short-imperative]
  gloss: {en: to put; to place}
  notes: {en: 'Pon (tú), ponga (usted), no pongas. Pongo: I put; puse, puso: I put, he put. Poner la mesa: to set the table.'}
  form: poner
  spelled: {es-Latn/standard: [poner]}
  forms:
