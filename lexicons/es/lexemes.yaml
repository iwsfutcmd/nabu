  pos: VERB
  classes: [e-i, go, strong]
  gloss: {en: to say; to tell}
  notes: {en: 'Me dijo que…: he told me that… No i after the j: dijeron, not dijieron; dijiste, not dijistes.'}
  form: decir
  spelled: {es-Latn/standard: [decir]}
