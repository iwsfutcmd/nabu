- id: lexeme:tocororo
  pos: NOUN
  gloss: {en: 'tocororo (the Cuban trogon, the national bird)'}
  notes: {en: 'Found only in Cuba, it wears blue, white and red, the colours of the flag. It is said to die in a cage, so it stands for freedom. Its name copies its call: to-co-ro, to-co-ro.'}
  form: tocororo
  spelled: {es-Latn/standard: [tocororo]}
- id: lexeme:todavía
  pos: ADV
  gloss: {en: 'still; todavía no: not yet'}
  notes: {en: 'Written with an accent on the í. Todavía no he comido: I haven''t eaten yet. Aún means the same.'}
  form: todavía
  spelled: {es-Latn/standard: [todavía]}
- id: lexeme:todo
  pos: DET
  feats: {PronType: Tot}
  gloss: {en: all; every; everything; everyone (todos)}
  notes: {en: 'Todos los días: every day. Todo el día: all day long. Toda la familia: the whole family.'}
  form: todo
  spelled: {es-Latn/standard: [todo]}
