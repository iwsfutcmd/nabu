  gloss: {en: 'favour; ¿me hace el favor de…?: would you please…?'}
  notes: {en: '¿Me hace el favor de…? is how Cubans ask an elder or a stranger; ¿me haces el favor? to a friend. Por favor: please. El favor is masculine.'}
  form: favor
  spelled: {es-Latn/standard: [favor]}
- id: lexeme:felicidades
  pos: INTJ
  gloss: {en: congratulations; happy birthday}
  notes: {en: 'Always plural: ¡Felicidades, abuela! is how most Cubans wish someone a happy birthday, along with ¡Feliz cumpleaños! Also congratulations on any good news.'}
  form: felicidades
  spelled: {es-Latn/standard: [felicidades]}
- id: lexeme:feliz
  pos: ADJ
  gloss: {en: happy}
  notes: {en: 'Plural felices: z becomes c before e. Besides Happy Birthday, Cubans sing Felicidades at a birthday.'}
  form: feliz
  spelled: {es-Latn/standard: [feliz]}
  forms:
  - {feats: {Gender: Fem, Number: Sing}, spelled: {es-Latn/standard: [feliz]}, status: pinned}
  - {feats: {Gender: Masc, Number: Plur}, spelled: {es-Latn/standard: [felices]}, status: pinned}
- id: lexeme:ficha
  pos: NOUN
  gloss: {en: tile (domino); piece; token}
  notes: {en: 'Las fichas are shuffled face down on the table (Cubans call it dar agua). In Cuba a sly, cheeky person is also una ficha.'}
  form: ficha
  spelled: {es-Latn/standard: [ficha]}
  forms:
  - {feats: {Number: Plur}, spelled: {es-Latn/standard: [fichas]}, status: pinned}
- id: lexeme:fiesta
  pos: NOUN
  gloss: {en: party; celebration}
  notes: {en: 'Dar una fiesta: to throw a party. A big one is un fiestón. Las fiestas: the holidays.'}
  form: fiesta
  spelled: {es-Latn/standard: [fiesta]}
