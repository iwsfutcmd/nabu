  pos: VERB
  gloss: {en: to have to (tener que + infinitive)}
  notes: {en: 'Tengo que ir: I have to go; tener changes, que does not. Stronger than deber (should). With nobody in particular: hay que caminar, one has to walk.'}
  form: tener que
  spelled: {es-Latn/standard: [tener que]}
