# What es declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults, labels and named rules.
id: es
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@220c9909f93c', status: draft}
varieties: [es-CU]
registers: [formal, neutral, colloquial]
dimensions:
  VERB: [Mood, Tense, Person, Number, VerbForm, Gender, Polarity]
  AUX: [Mood, Tense, Person, Number, VerbForm]
  NOUN: [Number]
  ADJ: [Gender, Number]
  DET: [Gender, Number]
  PRON: [Gender, Number]
  NUM: [Gender, Number]
lexical:
  NOUN: [Gender]
  PROPN: [Gender]
citation:
  NOUN: {Gender: Masc, Number: Sing}
  PROPN: {Gender: Masc}
  ADJ: {Gender: Masc, Number: Sing}
  DET: {Gender: Masc, Number: Sing}
  VERB: {VerbForm: Inf}
  AUX: {VerbForm: Inf}
bare:
  NOUN: {Gender: Masc, Number: Sing}
  PROPN: {Gender: Masc}
  ADJ: {Gender: Masc, Number: Sing}
  DET: {Gender: Masc, Number: Sing}
  VERB: {VerbForm: Inf}
  AUX: {VerbForm: Inf}
features:
  Gender: [Fem, Masc, Neut]
  Mood: [Cnd, Imp, Ind, Sub]
  NumType: [Card, Ord]
  Number: [Plur, Sing]
  Person: ['1', '2', '3']
  Polarity: [Neg]
  Poss: ['Yes']
  PronType: [Dem, Ind, Int, Neg, Prs, Rel, Tot]
  Reflex: ['Yes']
  Tense: [Fut, Imp, Past, Pres]
  VerbForm: [Fin, Ger, Inf, Part]
defaults:
- {id: gender-a, when: {pos: NOUN, ends: a}, gives: {Gender: Fem}}
- {id: gender-o, when: {pos: NOUN, ends: o}, gives: {Gender: Masc}}
- {id: gender-ion, when: {pos: NOUN, ends: ión}, gives: {Gender: Fem}}
- {id: gender-on, when: {pos: NOUN, ends: ón}, gives: {Gender: Masc}}
- {id: gender-dad, when: {pos: NOUN, ends: dad}, gives: {Gender: Fem}}
- {id: gender-tad, when: {pos: NOUN, ends: tad}, gives: {Gender: Fem}}
- {id: gender-tud, when: {pos: NOUN, ends: tud}, gives: {Gender: Fem}}
- {id: gender-umbre, when: {pos: NOUN, ends: umbre}, gives: {Gender: Fem}}
- {id: gender-aje, when: {pos: NOUN, ends: aje}, gives: {Gender: Masc}}
- {id: gender-or, when: {pos: NOUN, ends: or}, gives: {Gender: Masc}}
labels:
- {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, gloss: {en: 'present tense: I (yo)'}, notes: {en: 'Estoy, soy, me llamo: I am, I''m called.'}, was: 'form:pres-1s'}
- {feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, gloss: {en: 'present tense: you (tú)'}, notes: {en: '¿Cómo estás? ¿Tú eres de Cuba?'}, was: 'form:pres-2s'}
- {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, gloss: {en: 'present tense: he, she, it, you (usted)'}, notes: {en: 'Está, es, se llama.'}, was: 'form:pres-3s'}
- {feats: {Gender: Fem, Number: Sing}, gloss: {en: 'feminine: la, una, cubana'}, notes: {en: 'A noun is masculine or feminine (la casa, el carro), and the words that go with it take its gender: la casa blanca, una amiga cubana. Words that look the same in both (grande, feliz, mi) go with it too: in mi casa, mi is feminine.'}, was: 'form:fem'}
- {feats: {Gender: Fem}, pos: PROPN, gloss: {en: 'feminine: la, una, cubana'}, notes: {en: 'A noun is masculine or feminine (la casa, el carro), and the words that go with it take its gender: la casa blanca, una amiga cubana. Words that look the same in both (grande, feliz, mi) go with it too: in mi casa, mi is feminine.'}, was: 'form:fem'}
- {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Pres, VerbForm: Fin}, gloss: {en: 'present tense: we (nosotros)'}, notes: {en: 'Somos, tenemos, vivimos: we are, we have, we live. Always ends in -mos.'}, was: 'form:pres-1p'}
- {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, gloss: {en: 'present tense: they, you all (ellos, ustedes)'}, notes: {en: 'Son, tienen, están: they are, they have. Always ends in -n.'}, was: 'form:pres-3p'}
- {feats: {Gender: Masc, Number: Plur}, gloss: {en: 'plural: los, unos, cubanos'}, notes: {en: '-s after a vowel (casas), -es after a consonant (mujeres; luz, luces). The words that go with a plural noun are plural too. A masculine plural also covers men and women together: mis padres, los cubanos.'}, was: 'form:pl'}
- {feats: {Number: Plur}, pos: PRON, gloss: {en: 'plural: los, unos, cubanos'}, notes: {en: '-s after a vowel (casas), -es after a consonant (mujeres; luz, luces). The words that go with a plural noun are plural too. A masculine plural also covers men and women together: mis padres, los cubanos.'}, was: 'form:pl'}
- {feats: {Gender: Fem, Number: Plur}, gloss: {en: 'feminine plural: las, unas, cubanas'}, notes: {en: 'Feminine and plural: las casas blancas; Lili y yo somos cubanas (two women).'}, was: 'form:fem-pl'}
- {feats: {VerbForm: Ger}, gloss: {en: 'gerund, -ando, -iendo (estoy trabajando: I''m working)'}, notes: {en: 'Estar + gerund is for what is going on right now. Not for plans as in English: I''m working tomorrow is trabajo mañana. With me, te or se on the end it takes an accent: bañándose.'}, was: 'form:ger'}
- {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, gloss: {en: 'past tense (preterite): I (yo)'}, notes: {en: '-é, -í: compré, comí. The accent matters: compré is I bought, compre is buy! Irregular: fui, hice, tuve, vi.'}, was: 'form:pret-1s'}
- {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'past tense (preterite): he, she, it, you (usted)'}, notes: {en: '-ó, -ió: compró, comió. Without its accent compró is compro, I buy. Irregular, and with no accent: fue, hizo, tuvo, vio.'}, was: 'form:pret-3s'}
- {feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Past, VerbForm: Fin}, gloss: {en: 'past tense (preterite): you (tú)'}, notes: {en: '-aste, -iste: compraste, comiste, fuiste. Many Cubans say comprastes, fuistes, with an s; it is written without one.'}, was: 'form:pret-2s'}
- {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Past, VerbForm: Fin}, gloss: {en: 'past tense (preterite): we (nosotros)'}, notes: {en: 'For -ar and -ir verbs it is the same as the present (compramos), and ayer or anoche tells them apart; -er verbs differ: comemos, comimos. Irregular: fuimos, hicimos, tuvimos, vimos.'}, was: 'form:pret-1p'}
- {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'past tense (preterite): they, you all (ellos, ustedes)'}, notes: {en: '-aron, -ieron: compraron, comieron. Irregular: fueron, hicieron, tuvieron, vieron.'}, was: 'form:pret-3p'}
- {feats: {Mood: Ind, Tense: Imp, VerbForm: Fin}, gloss: {en: 'imperfect: was …ing, used to (hablaba, comía, era, iba)'}, notes: {en: 'For what used to happen or was going on, and to describe the past: cuando era niño, vivía en Hialeah. -aba for -ar verbs (jugaba; the we form writes an accent: jugábamos), -ía for -er and -ir verbs (tenía, vivía: always an accent on the í). Only three are irregular: era (ser), iba (ir), veía (ver). Hay becomes había, there was or there were. Many say habían muchos niños; it is written había, singular.'}, was: 'form:impf'}
- {feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, gloss: {en: 'command, tú (¡habla!, ¡come!, ¡ven!)'}, notes: {en: 'Like the él form of the present: pica, echa, revuelve, fríe. Irregular: ven, pon, haz, di, sal, ten, ve. With a pronoun on the end it takes a written accent: échale, cómelos. Haz (do!) is not has (you have).'}, was: 'form:imp-tu'}
- {feats: {Mood: Imp, Person: '3', VerbForm: Fin}, gloss: {en: 'command, usted or ustedes (¡hable!, ¡coman!)'}, notes: {en: '-ar verbs take e, -er and -ir verbs take a: pique, eche; coma, abra. Ustedes adds n: coman, vengan. Irregular: venga, ponga, haga. For elders and strangers (doña Ofelia), and for more than one person.'}, was: 'form:imp-ud'}
- {feats: {Mood: Imp, Polarity: Neg, VerbForm: Fin}, gloss: {en: 'negative command (¡no hables!, ¡no coma!)'}, notes: {en: 'Tú: no eches, no abras, no revuelvas (the vowel swaps and an s is added). Usted: no eche, no abra. Spelling changes: no piques (c to qu), no pongas, no hagas.'}, was: 'form:imp-neg'}
- {feats: {Tense: Past, VerbForm: Part}, gloss: {en: 'past participle (hablado, comido, hecho; he hablado)'}, notes: {en: '-ado for -ar verbs, -ido for -er and -ir verbs: jugado, comido, vivido. Cubans often drop the d (jugao, comío, ponchao); it is always written. Irregular: visto, hecho, dicho, vuelto, puesto, escrito. Hecho (done) has an h; echo (I throw) has none. After haber it never changes: Lili ha jugado, ellas han jugado.'}, was: 'form:part'}
- {feats: {Mood: Cnd, VerbForm: Fin}, gloss: {en: 'conditional: would (hablaría, podría)'}, notes: {en: 'The infinitive plus -ía, always with its accent: hablaría, comería, iría. Some stems shorten as in the future: podría, tendría, haría, vendría. Me gustaría, ¿podría…? and ¿sería posible…? are the polite way to ask.'}, was: 'form:cond'}
- {feats: {Mood: Sub, Tense: Imp, VerbForm: Fin}, gloss: {en: 'imperfect subjunctive (si hablara, si tuviera)'}, notes: {en: 'Here only quisiera, I would like: the politest way to ask (quisiera una cita). Units 27 and 28 teach the rest.'}, was: 'form:subj-past'}
- {feats: {Mood: Ind, Tense: Fut, VerbForm: Fin}, gloss: {en: 'future: will (hablará, será)'}, notes: {en: 'Endings on the whole infinitive: hablaré, hablarás, hablará, hablaremos, hablarán. All but -emos carry an accent, and hablara without it is another tense. Some stems shorten: tendré, vendré, haré, podré; hay becomes habrá. In everyday Cuban speech voy a + infinitive is more common, and the future also guesses: ¿Qué hora será? I wonder what time it is.'}, was: 'form:fut'}
- {feats: {Mood: Sub, Tense: Pres, VerbForm: Fin}, gloss: {en: 'present subjunctive (que hable, que coma)'}, notes: {en: 'After a wish, a hope, advice or a purpose aimed at someone else (quiero que, espero que, ojalá, te aconsejo que, es importante que, para que), the verb swaps its vowel: -ar verbs take e (hable, hables, hablen), -er and -ir verbs take a (coma, viva). The stem is the yo form''s: tengo, tenga; hago, haga; digo, diga; vengo, venga. Sea, esté, vaya and sepa are irregular. Spelling keeps the sound: llegue, saque. Heritage speakers often keep the present (quiero que tú vienes); written Spanish needs quiero que vengas. With one subject there is no que: quiero ir.'}, was: 'form:subj'}
- {feats: {Mood: Imp, Number: Sing, Person: '2', Polarity: Neg, VerbForm: Fin}, gloss: {en: 'negative command (¡no hables!, ¡no coma!)'}, notes: {en: 'Tú: no eches, no abras, no revuelvas (the vowel swaps and an s is added). Usted: no eche, no abra. Spelling changes: no piques (c to qu), no pongas, no hagas.'}, was: 'form:imp-neg'}
- {feats: {Gender: Fem, Number: Plur, Tense: Past, VerbForm: Part}, gloss: {en: 'past participle (hablado, comido, hecho; he hablado)'}, notes: {en: '-ado for -ar verbs, -ido for -er and -ir verbs: jugado, comido, vivido. Cubans often drop the d (jugao, comío, ponchao); it is always written. Irregular: visto, hecho, dicho, vuelto, puesto, escrito. Hecho (done) has an h; echo (I throw) has none. After haber it never changes: Lili ha jugado, ellas han jugado.'}, was: 'form:part'}
- {feats: {Gender: Masc, Number: Plur, Tense: Past, VerbForm: Part}, gloss: {en: 'past participle (hablado, comido, hecho; he hablado)'}, notes: {en: '-ado for -ar verbs, -ido for -er and -ir verbs: jugado, comido, vivido. Cubans often drop the d (jugao, comío, ponchao); it is always written. Irregular: visto, hecho, dicho, vuelto, puesto, escrito. Hecho (done) has an h; echo (I throw) has none. After haber it never changes: Lili ha jugado, ellas han jugado.'}, was: 'form:part'}
- {feats: {Gender: Fem, Number: Sing, Tense: Past, VerbForm: Part}, gloss: {en: 'past participle (hablado, comido, hecho; he hablado)'}, notes: {en: '-ado for -ar verbs, -ido for -er and -ir verbs: jugado, comido, vivido. Cubans often drop the d (jugao, comío, ponchao); it is always written. Irregular: visto, hecho, dicho, vuelto, puesto, escrito. Hecho (done) has an h; echo (I throw) has none. After haber it never changes: Lili ha jugado, ellas han jugado.'}, was: 'form:part'}
# Classes: lexical features the rules below read and no form gives (ADR 0145). Every one is REVIEW. Spanish's verbs
# are -ar, -er or -ir by their infinitive's ending, which the rules read off the form: that is no class.
classes:
- {id: e-ie, pos: VERB, gloss: {en: 'e becomes ie when stressed (pensar: pienso, piensa)'}, notes: {en: 'REVIEW: the boot verbs, by the course''s forms (tener, querer, pensar, entender, sentir, venir).'}}
- {id: o-ue, pos: VERB, gloss: {en: 'o becomes ue when stressed (poder: puedo, puede)'}, notes: {en: 'REVIEW: the boot verbs, by the course''s forms (poder, volver, contar, dormir, morir).'}}
- {id: u-ue, pos: VERB, gloss: {en: 'u becomes ue when stressed (jugar: juego, juega)'}, notes: {en: 'REVIEW: jugar alone.'}}
- {id: e-i, pos: VERB, gloss: {en: 'e becomes i (pedir: pido, pidió)'}, notes: {en: 'REVIEW: -ir verbs only (pedir, conseguir, decir, freír).'}}
- {id: hiatus, pos: VERB, gloss: {en: 'a stressed i or u is written with its accent (reunirse: se reúne)'}, notes: {en: 'REVIEW: the -iar, -uar and -unir verbs that split the vowels (enviar: envío; reunir: reúne), against those that do not (cambiar: cambio, estudiar: estudio). The course has reunirse only.'}}
- {id: go, pos: VERB, gloss: {en: '-go: tengo, salgo, hago, digo, traigo (and tenga, salga)'}, notes: {en: 'REVIEW: a g before an ending that begins with a or o: after l or n (tengo, salgo), in place of c (hago, digo), ig after a vowel (traigo, caigo, oigo).'}}
- {id: zco, pos: VERB, gloss: {en: '-zco: conozco, agradezco (and conozca)'}, notes: {en: 'REVIEW: -cer and -cir verbs with a vowel before the c: zc before an ending that begins with a or o.'}}
- {id: strong, pos: VERB, gloss: {en: 'a strong past: tuve, tuvo; dije, dijo (no accent on I and he/she)'}, notes: {en: 'REVIEW: the past on a stem of its own (a listed stem, lexeme:tener|stem:tuv), with -e, -iste, -o, -imos, -isteis, -ieron; its imperfect subjunctive on the same stem (tuviera). After j the i of -ieron and -iera goes (dijeron, trajera).'}}
- {id: short-imperative, pos: VERB, gloss: {en: 'a short command for tú: ten, pon, ven, sal, haz'}, notes: {en: 'REVIEW: the command for tú without its -e (decir''s di is listed: no rule gives it).'}}
- {id: short-masculine, pos: DET, gloss: {en: 'a masculine singular that is not the -o form: este, ese, un (estos, esto, unos)'}, notes: {en: 'REVIEW: its other forms are those of a word in -o: esta, estos, estas, esto; una, unos, unas.'}}
- {id: comparative, pos: ADJ, gloss: {en: 'mayor, mejor, peor: the same for a feminine noun'}, notes: {en: 'REVIEW: an adjective in -or takes -a in the feminine (trabajadora, doctora), but not the comparatives.'}}
# How es writes a lexical form (docs/rules-design.md, section 3). Spanish's lexical form is its spelling, as the RAE
# and ASALE write the lemma (so an alphabet's notation names no vowel signs: its vowels are letters, its accents part
# of them in NFC), with + a boundary the form stores: a reflexive verb's se (levantar+se), its citation's clitic,
# written as a word of its own beside a finite form. es-Latn/standard's `spell` is the identity. Sets: C a consonant
# letter (y too, as the plural counts it: rey, reyes), NGQ one other than g and q (after which u is no vowel), V the
# vowel an ending after a stressed stem has (a, e, o), U an unaccented vowel, AV any vowel.
notation:
  sets:
    C: "[bcdfghjklmnñpqrstvwxyz]"
    NGQ: "[bcdfhjklmnñprstvwxyz]"
    V: "[aeo]"
    U: "[aeiou]"
    AV: "[aeiouáéíóúü]"
# Rules in a lexicon, stage 6 (docs/rules-design.md; docs/rules/es.md): es's verbs, nouns, adjectives, determiners,
# pronouns and numerals. Every branch is REVIEW until the owner signs it off. Sources: the standard paradigms of the RAE
# and ASALE (Nueva gramática, 2009, chapters 3-4; Ortografía, 2010, chapter 3 for the accents): no Spanish grammar is
# in the reference library, so no page is cited; the course's own forms where it writes them. Where a cell leaves a
# value out (hablaría: no Person; era: none), the exponent for the values it has applies.
realisation:
- id: 'rule:es-participle'  # the past participle, agreeing where it does (hablado, agradecida, hechos)
  when: {feats: {VerbForm: Part}}
  blocks:
  - suffix:
    - {branch: fem-sg, feats: {Gender: Fem, Number: Sing}, add: a}
    - {branch: fem-pl, feats: {Gender: Fem, Number: Plur}, add: as}
    - {branch: masc-pl, feats: {Gender: Masc, Number: Plur}, add: os}
    - {branch: masc-sg, add: o}
  # -ado, -ido from the infinitive's -ar, -er, -ir: rule:es-participle's rewrites below; an irregular participle is a
  # listed stem (lexeme:hacer|stem:hech), on which the endings stand as they do on -ad-.
- id: 'rule:es-strong-preterite'  # the strong past on its listed stem (tuve, tuviste, tuvo; estuve; dije)
  when: {class: strong, feats: {Mood: Ind, Tense: Past}}
  blocks:
  - suffix:
    - {branch: 1sg, feats: {Person: '1', Number: Sing}, add: e}
    - {branch: 2sg, feats: {Person: '2', Number: Sing}, add: iste}
    - {branch: 3sg, feats: {Person: '3', Number: Sing}, add: o}
    - {branch: 1pl, feats: {Person: '1', Number: Plur}, add: imos}
    - {branch: 2pl, feats: {Person: '2', Number: Plur}, add: isteis}
    - {branch: 3pl, feats: {Person: '3', Number: Plur}, add: ieron}
- id: 'rule:es-strong-subjunctive'  # the imperfect subjunctive on the strong stem, -iera whatever the infinitive (estuviera, tuviera)
  when: {class: strong, feats: {Mood: Sub, Tense: Imp}}
  blocks:
  - suffix:
    - {branch: sg, feats: {Number: Sing}, add: iera}
    - {branch: 2sg, feats: {Person: '2', Number: Sing}, add: ieras}
    - {branch: 1pl, feats: {Person: '1', Number: Plur}, add: iéramos}
    - {branch: 2pl, feats: {Person: '2', Number: Plur}, add: ierais}
    - {branch: 3pl, feats: {Person: '3', Number: Plur}, add: ieran}
- id: 'rule:es-ar'  # the first conjugation (hablar)
  when: {ends: ar, feats: {VerbForm: 'Fin,Ger'}}
  blocks:
  - suffix:
    - {branch: pres-1sg, feats: {Mood: Ind, Tense: Pres, Person: '1', Number: Sing}, add: o}
    - {branch: pres-2sg, feats: {Mood: Ind, Tense: Pres, Person: '2', Number: Sing}, add: as}
    - {branch: pres-3sg, feats: {Mood: Ind, Tense: Pres, Person: '3', Number: Sing}, add: a}
    - {branch: pres-1pl, feats: {Mood: Ind, Tense: Pres, Person: '1', Number: Plur}, add: amos}
    - {branch: pres-2pl, feats: {Mood: Ind, Tense: Pres, Person: '2', Number: Plur}, add: áis}
    - {branch: pres-3pl, feats: {Mood: Ind, Tense: Pres, Person: '3', Number: Plur}, add: an}
    - {branch: impf-sg, feats: {Mood: Ind, Tense: Imp, Number: Sing}, add: aba}
    - {branch: impf-2sg, feats: {Mood: Ind, Tense: Imp, Person: '2', Number: Sing}, add: abas}
    - {branch: impf-1pl, feats: {Mood: Ind, Tense: Imp, Person: '1', Number: Plur}, add: ábamos}
    - {branch: impf-2pl, feats: {Mood: Ind, Tense: Imp, Person: '2', Number: Plur}, add: abais}
    - {branch: impf-3pl, feats: {Mood: Ind, Tense: Imp, Person: '3', Number: Plur}, add: aban}
    - {branch: pret-1sg, feats: {Mood: Ind, Tense: Past, Person: '1', Number: Sing}, add: é}
    - {branch: pret-2sg, feats: {Mood: Ind, Tense: Past, Person: '2', Number: Sing}, add: aste}
    - {branch: pret-3sg, feats: {Mood: Ind, Tense: Past, Person: '3', Number: Sing}, add: ó}
    - {branch: pret-1pl, feats: {Mood: Ind, Tense: Past, Person: '1', Number: Plur}, add: amos}
    - {branch: pret-2pl, feats: {Mood: Ind, Tense: Past, Person: '2', Number: Plur}, add: asteis}
    - {branch: pret-3pl, feats: {Mood: Ind, Tense: Past, Person: '3', Number: Plur}, add: aron}
    - {branch: fut-1sg, feats: {Mood: Ind, Tense: Fut, Person: '1', Number: Sing}, add: é}
    - {branch: fut-2sg, feats: {Mood: Ind, Tense: Fut, Person: '2', Number: Sing}, add: ás}
    - {branch: fut-3sg, feats: {Mood: Ind, Tense: Fut, Person: '3', Number: Sing}, add: á}
    - {branch: fut-1pl, feats: {Mood: Ind, Tense: Fut, Person: '1', Number: Plur}, add: emos}
    - {branch: fut-2pl, feats: {Mood: Ind, Tense: Fut, Person: '2', Number: Plur}, add: éis}
    - {branch: fut-3pl, feats: {Mood: Ind, Tense: Fut, Person: '3', Number: Plur}, add: án}
    - {branch: cond-sg, feats: {Mood: Cnd, Number: Sing}, add: ía}
    - {branch: cond-2sg, feats: {Mood: Cnd, Person: '2', Number: Sing}, add: ías}
    - {branch: cond-1pl, feats: {Mood: Cnd, Person: '1', Number: Plur}, add: íamos}
    - {branch: cond-2pl, feats: {Mood: Cnd, Person: '2', Number: Plur}, add: íais}
    - {branch: cond-3pl, feats: {Mood: Cnd, Person: '3', Number: Plur}, add: ían}
    - {branch: subj-sg, feats: {Mood: Sub, Tense: Pres, Number: Sing}, add: e}
    - {branch: subj-2sg, feats: {Mood: Sub, Tense: Pres, Person: '2', Number: Sing}, add: es}
    - {branch: subj-1pl, feats: {Mood: Sub, Tense: Pres, Person: '1', Number: Plur}, add: emos}
    - {branch: subj-2pl, feats: {Mood: Sub, Tense: Pres, Person: '2', Number: Plur}, add: éis}
    - {branch: subj-3pl, feats: {Mood: Sub, Tense: Pres, Person: '3', Number: Plur}, add: en}
    - {branch: subj-impf-sg, feats: {Mood: Sub, Tense: Imp, Number: Sing}, add: ara}
    - {branch: subj-impf-2sg, feats: {Mood: Sub, Tense: Imp, Person: '2', Number: Sing}, add: aras}
    - {branch: subj-impf-1pl, feats: {Mood: Sub, Tense: Imp, Person: '1', Number: Plur}, add: áramos}
    - {branch: subj-impf-2pl, feats: {Mood: Sub, Tense: Imp, Person: '2', Number: Plur}, add: arais}
    - {branch: subj-impf-3pl, feats: {Mood: Sub, Tense: Imp, Person: '3', Number: Plur}, add: aran}
