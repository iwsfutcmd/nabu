# Written by `nabu migrate` from courses/es and its conversion plan
# (docs/migration-design.md, deliverable 2); never by hand. Nothing reads it until the
# switch.
id: es
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@b2c2e29b8ed1', status: draft}
