    - {branch: subj-1pl, feats: {Mood: Sub, Tense: Pres, Person: '1', Number: Plur}, add: amos}
    - {branch: subj-2pl, feats: {Mood: Sub, Tense: Pres, Person: '2', Number: Plur}, add: áis}
