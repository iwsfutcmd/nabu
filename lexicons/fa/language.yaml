# What fa declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults, labels and named rules.
id: fa
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@136c8bd66194', status: draft}
varieties: [fa-IR]
registers: [formal, neutral, colloquial]
dimensions:
  NOUN: [Number, Definite]
  ADJ: [Degree, Number, Definite]
  VERB: [VerbForm, Polarity, Mood, Aspect, Tense, Person, Number]
  AUX: [VerbForm, Polarity, Variant, Tense, Person, Number]
# A verb is cited by its infinitive (the lexical form itself: خوردن), the merge of inf (ADR 0158).
citation:
  VERB: {VerbForm: Inf}
  AUX: {VerbForm: Inf}
# What a word requires before it is whole (ADR 0158; docs/rules/fa.md): a verb or the copula a form (a tense, the
# infinitive); a tense then requires a person (an ending, or the third person singular's nothing in the past and in
# the copula's present). Nouns require nothing. REVIEW.
requires:
  VERB: [VerbForm]
  AUX: [VerbForm]
# A verb's lexical form is its infinitive, which its tense's stem rules below take apart: every cell, the citation's
# too, is the rules' (the tense comes from a merged zero, so the base chooses nothing itself).
stemmed: [VERB, AUX]
features:
  Aspect: [Imp]
  Definite: [Ind]
  Degree: [Cmp]
  Mood: [Sub]
  NumType: [Card]
  Number: [Plur, Sing]
  Person: ['1', '2', '3']
  Polarity: [Neg]
  Poss: ['Yes']
  PronType: [Dem, Int, Prs, Tot]
  Tense: [Past, Pres]
  # REVIEW: the copula's independent version (هست, hast: Yousef 2018 p. 183-185), which the three
  # existential هست tokens choose; its short version (است) is the unmarked one. Not UD's universal list: a
  # language-specific feature, as UD's Variant is elsewhere (Czech short and long forms).
  Variant: [Long]
  VerbForm: [Fin, Inf]
rules:
- {id: 'rule:past', gloss: {en: 'the simple past: past stem + ending (رفتم, I went)'}, notes: {en: 'Each verb has a past stem: رفت- (go), آمد- (come), خورد- (eat), کرد- (do), خرید- (buy), دید- (see). He/she has no ending: رفت, he went. The negative adds na-: نرفتم.'}, was: 'construction:past'}
- {id: 'rule:subjunctive', gloss: {en: 'the subjunctive: be- + present stem + ending after ''want'' and ''can'''}, notes: {en: "می\u200cخواهم یک کتاب بخرم: I want to buy a book. می\u200cتوانم ببینم؟ Can I see?"}, was: 'construction:subjunctive'}
# What the paradigms call each form (the gloss dialog, the Data page): a label for each cell, in Yousef's (2018)
# terms (docs/rules/fa.md). REVIEW, every one.
labels:
- {feats: {Definite: Ind}, gloss: {en: 'indefinite (-i: a, one)'}}
- {feats: {Degree: Cmp}, gloss: {en: 'comparative (-tar)'}}
- {feats: {Number: Plur, Person: '1', Tense: Past, VerbForm: Fin}, pos: AUX, gloss: {en: 'was (بود-): we'}}
- {feats: {Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, pos: AUX, gloss: {en: 'was (بود-): I'}}
- {feats: {Number: Plur, Person: '2', Tense: Past, VerbForm: Fin}, pos: AUX, gloss: {en: 'was (بود-): you (to several, or politely)'}}
- {feats: {Number: Sing, Person: '2', Tense: Past, VerbForm: Fin}, pos: AUX, gloss: {en: 'was (بود-): you (to one)'}}
- {feats: {Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, pos: AUX, gloss: {en: 'was (بود-): he, she, it'}}
- {feats: {Number: Plur, Person: '1', Tense: Pres, VerbForm: Fin}, pos: AUX, gloss: {en: 'is (the copula): we'}}
- {feats: {Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, pos: AUX, gloss: {en: 'is (the copula): I'}}
- {feats: {Number: Plur, Person: '2', Tense: Pres, VerbForm: Fin}, pos: AUX, gloss: {en: 'is (the copula): you (to several, or politely)'}}
