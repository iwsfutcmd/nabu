- {feats: {Number: Sing, Person: '3', Polarity: Neg, Tense: Pres, VerbForm: Fin}, pos: AUX, gloss: {en: 'negative is (the copula): he, she, it'}}
- {feats: {Number: Plur}, gloss: {en: 'plural'}}
- {feats: {Number: Plur, Person: '1', Tense: Past, VerbForm: Fin}, gloss: {en: 'past: we'}}
- {feats: {Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, gloss: {en: 'past: I'}}
- {feats: {Number: Plur, Person: '2', Tense: Past, VerbForm: Fin}, gloss: {en: 'past: you (to several, or politely)'}}
