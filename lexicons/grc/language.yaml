- id: 'rule:grc-attic-future-middle'  # CGCG 15.32-15.36: βαδιοῦμαι, a listed stem in ε, no σ, contracted
  when: {pos: VERB, class: attic-future-middle, feats: {Tense: Fut}}
  blocks:
  - suffix: &middle
    - {branch: 1sg, feats: {Mood: Ind, Person: '1', Number: Sing}, add: ομαι}
    - {branch: 2sg, feats: {Mood: Ind, Person: '2', Number: Sing}, add: ῃ}
    - {branch: 3sg, feats: {Mood: Ind, Person: '3', Number: Sing}, add: εται}
    - {branch: 1pl, feats: {Mood: Ind, Person: '1', Number: Plur}, add: ομεθᾰ}
    - {branch: 2pl, feats: {Mood: Ind, Person: '2', Number: Plur}, add: εσθε}
    - {branch: 3pl, feats: {Mood: Ind, Person: '3', Number: Plur}, add: ονται}
- id: 'rule:grc-attic-future'  # CGCG 15.32-15.36: μενῶ, ἐρῶ, νομιῶ
  when: {pos: VERB, class: attic-future, feats: {Tense: Fut}}
  blocks:
  - suffix: &active
