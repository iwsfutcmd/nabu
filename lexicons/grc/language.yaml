    - {branch: 2sg, feats: {Mood: Ind, Person: '2', Number: Sing}, add: εις}
    - {branch: 3sg, feats: {Mood: Ind, Person: '3', Number: Sing}, add: ει}
    - {branch: 1pl, feats: {Mood: Ind, Person: '1', Number: Plur}, add: ομεν}
    - {branch: 2pl, feats: {Mood: Ind, Person: '2', Number: Plur}, add: ετε}
    - {branch: 3pl, feats: {Mood: Ind, Person: '3', Number: Plur}, add: ουσῐ(ν)}
- id: 'rule:grc-future-middle'  # CGCG 15.3: a middle verb's future, σ and the middle endings
  when: {pos: VERB, ends: ομαι, feats: {Tense: Fut}}
  strip: [ομαι]
  blocks:
  - suffix:
