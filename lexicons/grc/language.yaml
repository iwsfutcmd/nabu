    - {branch: s, add: σ}
  - suffix:
    - {branch: 1sg, feats: {Mood: Ind, Person: '1', Number: Sing}, add: ᾰ}
    - {branch: 2sg, feats: {Mood: Ind, Person: '2', Number: Sing}, add: ᾰς}
    - {branch: 3sg, feats: {Mood: Ind, Person: '3', Number: Sing}, add: ε(ν)}
    - {branch: 1pl, feats: {Mood: Ind, Person: '1', Number: Plur}, add: ᾰμεν}
    - {branch: 2pl, feats: {Mood: Ind, Person: '2', Number: Plur}, add: ᾰτε}
    - {branch: 3pl, feats: {Mood: Ind, Person: '3', Number: Plur}, add: ᾰν}
