    - {branch: present, add: ειν}
# ---- Nouns, adjectives, pronouns, the article. A rule names no part of speech: it is chosen by a class, the lemma's
# ending and the cell (a noun's cell has Case and Number; an adjective's, a pronoun's and the article's Gender too).
- id: 'rule:grc-third'  # CGCG 4.31-4.35: a listed stem (the genitive's) and the endings; the nominative is the lemma
  when: {class: third, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}
  blocks:
  - suffix:
    - {branch: nom-sg, feats: {Case: Nom, Number: Sing}, add: ''}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ος}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῐ}
    - {branch: acc-sg, feats: {Case: Acc, Number: Sing}, add: ᾰ}
    - {branch: voc-sg, feats: {Case: Voc, Number: Sing}, add: ''}
    - {branch: nom-pl, feats: {Case: 'Nom,Voc', Number: Plur}, add: ες}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ων}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: σῐ(ν)}
    - {branch: acc-pl, feats: {Case: Acc, Number: Plur}, add: ᾰς}
- id: 'rule:grc-third-neuter'  # CGCG 4.40 (πρᾶγμα), 4.65 (γένος)
  when: {class: third-neuter, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}
  blocks:
  - suffix:
    - {branch: sg, feats: {Case: 'Acc,Nom,Voc', Number: Sing}, add: ''}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ος}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῐ}
    - {branch: pl, feats: {Case: 'Acc,Nom,Voc', Number: Plur}, add: ᾰ}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ων}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: σῐ(ν)}
- id: 'rule:grc-comparative'  # CGCG 5.36, 5.38: -ότερος, -ώτερος after a short syllable (rule:grc-comparative|omega)
  when: {class: comparable, feats: {Degree: Cmp}}
  strip: [ος, ός]
  blocks:
  - suffix:
    - {branch: cmp, add: οτερ}
  - suffix: &masculine
    - {branch: nom-sg-m, feats: {Case: Nom, Gender: Masc, Number: Sing}, add: ος}
    - {branch: voc-sg-m, feats: {Case: Voc, Gender: Masc, Number: Sing}, add: ε}
    - {branch: acc-sg-m, feats: {Case: Acc, Gender: Masc, Number: Sing}, add: ον}
    - {branch: gen-sg-mn, feats: {Case: Gen, Gender: 'Masc,Neut', Number: Sing}, add: ου}
    - {branch: dat-sg-mn, feats: {Case: Dat, Gender: 'Masc,Neut', Number: Sing}, add: ῳ}
    - {branch: nom-pl-m, feats: {Case: 'Nom,Voc', Gender: Masc, Number: Plur}, add: οι}
    - {branch: acc-pl-m, feats: {Case: Acc, Gender: Masc, Number: Plur}, add: ους}
    - {branch: dat-pl-mn, feats: {Case: Dat, Gender: 'Masc,Neut', Number: Plur}, add: οις}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ων}
  - suffix: &feminine
    - {branch: nom-sg-f, feats: {Case: 'Nom,Voc', Gender: Fem, Number: Sing}, add: η}
    - {branch: gen-sg-f, feats: {Case: Gen, Gender: Fem, Number: Sing}, add: ης}
    - {branch: dat-sg-f, feats: {Case: Dat, Gender: Fem, Number: Sing}, add: ῃ}
    - {branch: acc-sg-f, feats: {Case: Acc, Gender: Fem, Number: Sing}, add: ην}
    - {branch: nom-pl-f, feats: {Case: 'Nom,Voc', Gender: Fem, Number: Plur}, add: αι}
    - {branch: dat-pl-f, feats: {Case: Dat, Gender: Fem, Number: Plur}, add: αις}
    - {branch: acc-pl-f, feats: {Case: Acc, Gender: Fem, Number: Plur}, add: ᾱς}
  - suffix: &neuter
    - {branch: sg-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Sing}, add: ον}
    - {branch: pl-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Plur}, add: ᾰ}
- id: 'rule:grc-no-comparative'  # REVIEW: an adjective not stated comparable has no comparative: no branch names a cell
  when: {feats: {Degree: Cmp}}
  blocks:
  - suffix:
    - {branch: none, feats: {Degree: Sup}, add: ''}
- id: 'rule:grc-pronominal'  # CGCG 7.10 (αὐτός, αὐτή, αὐτό; ἄλλος, ἄλλο as it), 3.1 (the article on its stem τ-)
  when: {class: pronominal, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}
  strip: [ος, ός]
  blocks:
  - suffix: *masculine
  - suffix: *feminine
  - suffix:
    - {branch: sg-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Sing}, add: ο}
    - {branch: pl-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Plur}, add: ᾰ}
- id: 'rule:grc-sigma-adjective'  # CGCG 5.28-5.29: ἀληθής, ἀληθές, its endings contracted (ε-ος > οῦς)
  when: {class: sigma-stem, feats: {Gender: 'Fem,Masc,Neut'}}
  strip: [ής, ης]
  blocks:
  - suffix:
    - {branch: nom-sg-mf, feats: {Case: Nom, Gender: 'Fem,Masc', Number: Sing}, add: ής}
    - {branch: voc-sg-mf, feats: {Case: Voc, Gender: 'Fem,Masc', Number: Sing}, add: ές}
    - {branch: acc-sg-mf, feats: {Case: Acc, Gender: 'Fem,Masc', Number: Sing}, add: ῆ}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: οῦς}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: εῖ}
    - {branch: nom-pl-mf, feats: {Case: 'Nom,Voc', Gender: 'Fem,Masc', Number: Plur}, add: εῖς}
    - {branch: acc-pl-mf, feats: {Case: Acc, Gender: 'Fem,Masc', Number: Plur}, add: εῖς}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ῶν}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: έσῐ(ν)}
    - {branch: sg-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Sing}, add: ές}
    - {branch: pl-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Plur}, add: ῆ}
- id: 'rule:grc-sigma-name'  # CGCG 4.65-4.66: Σωκράτης, Σωκράτους, Σωκράτει, Σωκράτη, Σώκρατες; no plural
  when: {class: sigma-name, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}
  strip: [ης]
  blocks:
  - suffix:
    - {branch: nom-sg, feats: {Case: Nom, Number: Sing}, add: ης}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ους}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ει}
    - {branch: acc-sg, feats: {Case: Acc, Number: Sing}, add: η}
    - {branch: voc-sg, feats: {Case: Voc, Number: Sing}, add: ες}
- id: 'rule:grc-contracted'  # CGCG 5.5-5.6: χρυσοῦς, -ῆ, -οῦν, the endings contracted with the stem's ε or ο
  when: {class: contracted, feats: {Gender: 'Fem,Masc,Neut'}}
  strip: [οῦς]
  blocks:
  - suffix:
    - {branch: nom-sg-m, feats: {Case: 'Nom,Voc', Gender: Masc, Number: Sing}, add: οῦς}
    - {branch: acc-sg-m, feats: {Case: Acc, Gender: Masc, Number: Sing}, add: οῦν}
    - {branch: gen-sg-mn, feats: {Case: Gen, Gender: 'Masc,Neut', Number: Sing}, add: οῦ}
    - {branch: dat-sg-mn, feats: {Case: Dat, Gender: 'Masc,Neut', Number: Sing}, add: ῷ}
    - {branch: nom-pl-m, feats: {Case: 'Nom,Voc', Gender: Masc, Number: Plur}, add: οῖ}
    - {branch: acc-pl-m, feats: {Case: Acc, Gender: Masc, Number: Plur}, add: οῦς}
    - {branch: dat-pl-mn, feats: {Case: Dat, Gender: 'Masc,Neut', Number: Plur}, add: οῖς}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ῶν}
    - {branch: nom-sg-f, feats: {Case: 'Nom,Voc', Gender: Fem, Number: Sing}, add: ῆ}
    - {branch: gen-sg-f, feats: {Case: Gen, Gender: Fem, Number: Sing}, add: ῆς}
    - {branch: dat-sg-f, feats: {Case: Dat, Gender: Fem, Number: Sing}, add: ῇ}
    - {branch: acc-sg-f, feats: {Case: Acc, Gender: Fem, Number: Sing}, add: ῆν}
    - {branch: nom-pl-f, feats: {Case: 'Nom,Voc', Gender: Fem, Number: Plur}, add: αῖ}
    - {branch: dat-pl-f, feats: {Case: Dat, Gender: Fem, Number: Plur}, add: αῖς}
    - {branch: acc-pl-f, feats: {Case: Acc, Gender: Fem, Number: Plur}, add: ᾶς}
    - {branch: sg-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Sing}, add: οῦν}
    - {branch: pl-n, feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Plur}, add: ᾶ}
- id: 'rule:grc-two-ending'  # CGCG 5.7-5.8: ὁ καὶ ἡ βάρβαρος
  when: {class: two-ending, feats: {Gender: 'Fem,Masc,Neut'}}
  strip: [ος, ός]
  blocks:
  - suffix:
    - {branch: nom-sg-mf, feats: {Case: Nom, Gender: 'Fem,Masc', Number: Sing}, add: ος}
    - {branch: voc-sg-mf, feats: {Case: Voc, Gender: 'Fem,Masc', Number: Sing}, add: ε}
    - {branch: acc-sg-mf, feats: {Case: Acc, Gender: 'Fem,Masc', Number: Sing}, add: ον}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ου}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῳ}
    - {branch: nom-pl-mf, feats: {Case: 'Nom,Voc', Gender: 'Fem,Masc', Number: Plur}, add: οι}
    - {branch: acc-pl-mf, feats: {Case: Acc, Gender: 'Fem,Masc', Number: Plur}, add: ους}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: οις}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ων}
  - suffix: *neuter
- id: 'rule:grc-adjective'  # CGCG 5.1-5.3: ἀγαθός, -ή, -όν; δίκαιος, -ᾱ, -ον (rule:grc-alpha)
  when: {feats: {Gender: 'Fem,Masc,Neut'}, endsIn: '{OS}*ς'}
  strip: [ος, ός]
  blocks:
  - suffix: *masculine
  - suffix: *feminine
  - suffix: *neuter
- id: 'rule:grc-first'  # CGCG 4.3-4.6: τύχη, χώρᾱ (ᾱ after ε, ι, ρ: rule:grc-alpha)
  when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}, endsIn: '{FA}*'}
  strip: [η, ή, ᾱ, ᾱ́]
  blocks:
  - suffix:
    - {branch: nom-sg, feats: {Case: 'Nom,Voc', Number: Sing}, add: η}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ης}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῃ}
    - {branch: acc-sg, feats: {Case: Acc, Number: Sing}, add: ην}
    - {branch: nom-pl, feats: {Case: 'Nom,Voc', Number: Plur}, add: αι}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ῶν}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: αις}
    - {branch: acc-pl, feats: {Case: Acc, Number: Plur}, add: ᾱς}
- id: 'rule:grc-first-short'  # CGCG 4.3-4.5: θάλαττᾰ, θαλάττης
  when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}, ends: ᾰ}
  strip: [ᾰ]
  blocks:
  - suffix:
    - {branch: nom-sg, feats: {Case: 'Nom,Voc', Number: Sing}, add: ᾰ}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ης}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῃ}
    - {branch: acc-sg, feats: {Case: Acc, Number: Sing}, add: ᾰν}
    - {branch: nom-pl, feats: {Case: 'Nom,Voc', Number: Plur}, add: αι}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ῶν}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: αις}
    - {branch: acc-pl, feats: {Case: Acc, Number: Plur}, add: ᾱς}
- id: 'rule:grc-first-masculine'  # CGCG 4.8-4.12: πολίτης, νεανίᾱς; the vocative of -της in -ᾰ (rule:grc-first-vocative)
  when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}, endsIn: '{FA}*ς'}
  strip: [ης, ής, ᾱς]
  blocks:
  - suffix:
    - {branch: nom-sg, feats: {Case: Nom, Number: Sing}, add: ης}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ου}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῃ}
    - {branch: acc-sg, feats: {Case: Acc, Number: Sing}, add: ην}
    - {branch: voc-sg, feats: {Case: Voc, Number: Sing}, add: η}
    - {branch: nom-pl, feats: {Case: 'Nom,Voc', Number: Plur}, add: αι}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ῶν}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: αις}
    - {branch: acc-pl, feats: {Case: Acc, Number: Plur}, add: ᾱς}
- id: 'rule:grc-second'  # CGCG 4.19-4.22: ἄνθρωπος, θεός (and feminines: ἡ ὁδός)
  when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}, endsIn: '{OS}*ς'}
  strip: [ος, ός]
  blocks:
  - suffix:
    - {branch: nom-sg, feats: {Case: Nom, Number: Sing}, add: ος}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ου}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῳ}
    - {branch: acc-sg, feats: {Case: Acc, Number: Sing}, add: ον}
    - {branch: voc-sg, feats: {Case: Voc, Number: Sing}, add: ε}
    - {branch: nom-pl, feats: {Case: 'Nom,Voc', Number: Plur}, add: οι}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ων}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: οις}
    - {branch: acc-pl, feats: {Case: Acc, Number: Plur}, add: ους}
- id: 'rule:grc-second-neuter'  # CGCG 4.24: δῶρον
  when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}, endsIn: '{OS}*ν'}
  strip: [ον, όν]
  blocks:
  - suffix:
    - {branch: sg, feats: {Case: 'Acc,Nom,Voc', Number: Sing}, add: ον}
    - {branch: gen-sg, feats: {Case: Gen, Number: Sing}, add: ου}
    - {branch: dat-sg, feats: {Case: Dat, Number: Sing}, add: ῳ}
    - {branch: pl, feats: {Case: 'Acc,Nom,Voc', Number: Plur}, add: ᾰ}
    - {branch: gen-pl, feats: {Case: Gen, Number: Plur}, add: ων}
    - {branch: dat-pl, feats: {Case: Dat, Number: Plur}, add: οις}
phonology:  # in order, each once over the whole form
# The augment, in the indicative of the past tenses (CGCG 11.35-11.40), where the form's "-" is: ε- before a
# consonant; a vowel or diphthong lengthened (11.37-11.38). After a compound's preverb first (11.51), with no breathing
# inside the word; then a simplex's, first in the word, with its breathing. The "-" stays after the augment, which a
# recessive accent then goes no further back than (24.19).
- {id: 'rule:grc-augment', branch: syllabic, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-{C}', after: '.', to: '+ε-{C}'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-{E}', after: '.', to: '+η-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-{OS}', after: '.', to: '+ω-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ῐ', after: '.', to: '+ῑ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-α[ιί]', after: '.', to: '+ῃ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ε[ιί]', after: '.', to: '+ῃ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ο[ιί]', after: '.', to: '+ῳ-'}
- {id: 'rule:grc-augment', branch: syllabic, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-{C}', at: start, to: '+ἐ-{C}'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ἐ', at: start, to: '+ἠ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ἑ', at: start, to: '+ἡ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ᾰ̓', at: start, to: '+ἠ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ᾰ̔', at: start, to: '+ἡ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ὀ', at: start, to: '+ὠ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ὁ', at: start, to: '+ὡ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ῐ̓', at: start, to: '+ῑ̓-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ῐ̔', at: start, to: '+ῑ̔-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-α[ἰἴ]', at: start, to: '+ᾐ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ε[ἰἴ]', at: start, to: '+ᾐ-'}
- {id: 'rule:grc-augment', branch: temporal, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: '-ο[ἰἴ]', at: start, to: '+ᾠ-'}
# A preverb's last vowel goes before the augment (κατ-έ-βην, ἀπ-έ-δωκα), but περι's and προ's (CGCG 11.51).
- {id: 'rule:grc-augment', branch: elision, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: 'ᾰ+ε-', to: '+ε-'}
- {id: 'rule:grc-augment', branch: elision, when: {pos: VERB, feats: {Mood: Ind, Tense: Past}}, find: 'ο+ε-', to: '+ε-'}
# A stop before σ (CGCG 1.91, 4.37, 4.42): a dental (and ζ) goes; a labial and σ are ψ, a velar and σ ξ. ν goes before
# the dative plural's σ (4.51).
- {id: 'rule:grc-sigma', branch: dental, find: '{DEN}+σ', to: '+σ'}
- {id: 'rule:grc-sigma', branch: labial, find: '{LAB}+σ', to: '+ψ'}
- {id: 'rule:grc-sigma', branch: velar, find: '{VEL}+σ', to: '+ξ'}
- {id: 'rule:grc-sigma', branch: nasal, when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}, find: 'ν+σ', to: '+σ'}
# A contract stem's vowel is long before σ: ποιησ-, τιμησ- (CGCG 13.16, 15.16). Not written yet: ᾱ after ε, ι, ρ.
- {id: 'rule:grc-contract-length', when: {pos: VERB, class: contract}, find: '{EA}*', before: '+σ', map: {ε: η, έ: η, ᾰ: η}}
# ᾱ for η after ε, ι or ρ in a first-declension ending (CGCG 4.5, 4.9, 5.3).
- {id: 'rule:grc-alpha', when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}, find: '+η', after: '{ER}*', to: '+ᾱ'}
- {id: 'rule:grc-alpha', when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}, find: '+ῃ', after: '{ER}*', to: '+ᾳ'}
# A masculine in -της is called with -ᾰ (πολῖτᾰ: CGCG 4.12).
- {id: 'rule:grc-first-vocative', when: {feats: {Case: Voc}, endsIn: 'τ{FA}*ς'}, find: '+η', at: end, to: '+ᾰ'}
# -ώτερος after a short syllable (a short vowel and one consonant): σοφώτερος, but δεινότερος (CGCG 5.38).
- {id: 'rule:grc-comparative', branch: omega, when: {feats: {Degree: Cmp}}, find: '+ο', after: '{SH}*{C}', before: 'τερ', to: '+ω'}
# The accent (CGCG 24): a finite verb's is recessive (24.16-24.19), and so are comparatives (24.32); a noun's,
# an adjective's, a pronoun's and the article's persistent (24.14, 24.21), on the ending in the genitive and dative of
# an oxytone of the first and second declension (a circumflex: 24.22) and of a one-syllable stem (24.23); an oxytone
# whose cited ending gave way to another takes the acute on the new one (only such a lemma: an enclitic, τις, has none).
# A name is recessive (24.26), which shows in a σ-stem's vocative (Σώκρατες).
- {id: 'rule:grc-accent', branch: recessive, accent: recessive, when: {pos: VERB}}
- {id: 'rule:grc-accent', branch: comparative, accent: recessive, when: {feats: {Degree: Cmp}}}
- {id: 'rule:grc-accent', branch: vocative, accent: recessive, when: {class: sigma-name, feats: {Case: Voc}}}
- {id: 'rule:grc-accent', branch: mobile, accent: ultima, when: {class: mobile, feats: {Case: 'Dat,Gen'}}}
- {id: 'rule:grc-accent', branch: syncopated, accent: ultima, when: {class: syncopated, feats: {Case: 'Dat,Gen', Number: Sing}}}
- {id: 'rule:grc-accent', branch: genitive-dative, accent: ultima, when: {ends: ός, feats: {Case: 'Dat,Gen'}}}
- {id: 'rule:grc-accent', branch: genitive-dative, accent: ultima, when: {ends: όν, feats: {Case: 'Dat,Gen'}}}
- {id: 'rule:grc-accent', branch: genitive-dative, accent: ultima, when: {ends: ή, feats: {Case: 'Dat,Gen'}}}
- {id: 'rule:grc-accent', branch: genitive-dative, accent: ultima, when: {ends: ᾱ́, feats: {Case: 'Dat,Gen'}}}
- {id: 'rule:grc-accent', branch: genitive-dative, accent: ultima, when: {ends: ὁ, feats: {Case: 'Dat,Gen'}}}
- {id: 'rule:grc-accent', branch: oxytone, accent: oxytone, when: {ends: ός, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}}
- {id: 'rule:grc-accent', branch: oxytone, accent: oxytone, when: {ends: όν, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}}
- {id: 'rule:grc-accent', branch: oxytone, accent: oxytone, when: {ends: ή, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}}
- {id: 'rule:grc-accent', branch: oxytone, accent: oxytone, when: {ends: ᾱ́, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}}
- {id: 'rule:grc-accent', branch: oxytone, accent: oxytone, when: {ends: ὁ, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}}
- {id: 'rule:grc-accent', branch: oxytone, accent: oxytone, when: {ends: ής, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}}
- {id: 'rule:grc-accent', branch: persistent, accent: persistent, when: {feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}}
# Contraction (CGCG 1.58-1.63, 12.15-12.17), the accent as it stood (24.12): on the first vowel, a circumflex on the
# result; on the second, an acute; on neither, none. A stem's ᾰ with e-sounds is ᾱ, with genuine ει or ῃ ᾳ, with
# o-sounds ω; ε with ε or ει is ει, with ο or ου ου, and goes into a long vowel. The infinitive's ει is spurious: ᾶν.
# εε and εει contract in every verb (θεῖς, of θέω: 12.17); the rest only in a contract stem (class contract).
- {id: 'rule:grc-contraction', branch: a-ein, when: {pos: VERB, class: contract, feats: {VerbForm: Inf}}, find: 'ᾰ́+ειν', to: '+ᾶν'}
- {id: 'rule:grc-contraction', branch: a-ein, when: {pos: VERB, class: contract, feats: {VerbForm: Inf}}, find: 'ᾰ+ειν', to: '+ᾱν'}
- {id: 'rule:grc-contraction', branch: a-o, when: {class: contract}, find: 'ᾰ́+ου', to: '+ῶ'}
- {id: 'rule:grc-contraction', branch: a-o, when: {class: contract}, find: 'ᾰ+ου', to: '+ω'}
- {id: 'rule:grc-contraction', branch: a-o, when: {class: contract}, find: 'ᾰ́+[οω]', to: '+ῶ'}
- {id: 'rule:grc-contraction', branch: a-o, when: {class: contract}, find: 'ᾰ+[όώ]', to: '+ώ'}
- {id: 'rule:grc-contraction', branch: a-o, when: {class: contract}, find: 'ᾰ+[οω]', to: '+ω'}
- {id: 'rule:grc-contraction', branch: a-ei, when: {class: contract}, find: 'ᾰ́+ει', to: '+ᾷ'}
- {id: 'rule:grc-contraction', branch: a-ei, when: {class: contract}, find: 'ᾰ+ει', to: '+ᾳ'}
- {id: 'rule:grc-contraction', branch: a-ei, when: {class: contract}, find: 'ᾰ́+ῃ', to: '+ᾷ'}
- {id: 'rule:grc-contraction', branch: a-ei, when: {class: contract}, find: 'ᾰ+ῃ', to: '+ᾳ'}
# A 3sg's -ε(ν) contracted takes no movable ν (ἐτίμα, ἐποίει: CGCG 1.39, 12.3).
- {id: 'rule:grc-contraction', branch: a-e, when: {class: contract}, find: 'ᾰ́+ε(ν)', to: '+ᾶ'}
- {id: 'rule:grc-contraction', branch: a-e, when: {class: contract}, find: 'ᾰ+ε(ν)', to: '+ᾱ'}
- {id: 'rule:grc-contraction', branch: a-e, when: {class: contract}, find: 'ᾰ́+[εη]', to: '+ᾶ'}
- {id: 'rule:grc-contraction', branch: a-e, when: {class: contract}, find: 'ᾰ+[εη]', to: '+ᾱ'}
- {id: 'rule:grc-contraction', branch: e-e, when: {pos: VERB}, find: 'έ+ε(ν)', to: '+εῖ'}
- {id: 'rule:grc-contraction', branch: e-e, when: {pos: VERB}, find: 'ε+ε(ν)', to: '+ει'}
- {id: 'rule:grc-contraction', branch: e-e, when: {pos: VERB}, find: 'έ+ει', to: '+εῖ'}
- {id: 'rule:grc-contraction', branch: e-e, when: {pos: VERB}, find: 'ε+ει', to: '+ει'}
- {id: 'rule:grc-contraction', branch: e-e, when: {pos: VERB}, find: 'έ+ε', to: '+εῖ'}
- {id: 'rule:grc-contraction', branch: e-e, when: {pos: VERB}, find: 'ε+ε', to: '+ει'}
- {id: 'rule:grc-contraction', branch: e-o, when: {class: contract}, find: 'έ+ου', to: '+οῦ'}
- {id: 'rule:grc-contraction', branch: e-o, when: {class: contract}, find: 'ε+ου', to: '+ου'}
- {id: 'rule:grc-contraction', branch: e-o, when: {class: contract}, find: 'έ+ο', to: '+οῦ'}
- {id: 'rule:grc-contraction', branch: e-o, when: {class: contract}, find: 'ε+ό', to: '+ού'}
- {id: 'rule:grc-contraction', branch: e-o, when: {class: contract}, find: 'ε+ο', to: '+ου'}
- {id: 'rule:grc-contraction', branch: e-long, when: {class: contract}, find: 'έ+ω', to: '+ῶ'}
- {id: 'rule:grc-contraction', branch: e-long, when: {class: contract}, find: 'ε+ώ', to: '+ώ'}
- {id: 'rule:grc-contraction', branch: e-long, when: {class: contract}, find: 'ε+ω', to: '+ω'}
- {id: 'rule:grc-contraction', branch: e-long, when: {class: contract}, find: 'έ+ῃ', to: '+ῇ'}
- {id: 'rule:grc-contraction', branch: e-long, when: {class: contract}, find: 'ε+ῃ', to: '+ῃ'}
- {id: 'rule:grc-contraction', branch: e-long, when: {class: contract}, find: 'έ+η', to: '+ῆ'}
- {id: 'rule:grc-contraction', branch: e-long, when: {class: contract}, find: 'ε+η', to: '+η'}
# A stem in σ that lost it (τείχε-, ὄρε-: CGCG 4.65-4.66): ε with ᾰ is η, with ῐ ει (and with ο ου, ω ω, above).
- {id: 'rule:grc-contraction', branch: e-a, when: {class: contract, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}, find: 'ε+ᾰ', to: '+η'}
- {id: 'rule:grc-contraction', branch: e-i, when: {class: contract, feats: {Case: 'Acc,Dat,Gen,Nom,Voc'}}, find: 'ε+ῐ', to: '+ει'}
# A root aorist's subjunctive (CGCG 13.40, 24.18): βῶ, βῆτε.
- {id: 'rule:grc-contraction', branch: eta, when: {class: root-aorist, feats: {Mood: Sub}}, find: 'ή+ω', to: '+ῶ'}
- {id: 'rule:grc-contraction', branch: eta, when: {class: root-aorist, feats: {Mood: Sub}}, find: 'ή+ῃ', to: '+ῇ'}
- {id: 'rule:grc-contraction', branch: eta, when: {class: root-aorist, feats: {Mood: Sub}}, find: 'ή+η', to: '+ῆ'}
- {id: 'rule:grc-contraction', branch: eta, when: {class: root-aorist, feats: {Mood: Sub}}, find: 'η+ώ', to: '+ώ'}
- {id: 'rule:grc-contraction', branch: eta, when: {class: root-aorist, feats: {Mood: Sub}}, find: 'η+[ωῃη]', to: '+[ωῃη]'}
# A word ends in no stop but κ (ἐκ, οὐκ): a stem's last stop goes where nothing follows it (παῖ, ἐλπί: CGCG 1.73, 4.44).
- {id: 'rule:grc-final-stop', when: {feats: {Case: Voc}}, find: '{STOP}', at: end, to: ''}
