- id: 'rule:grc-infinitive'  # CGCG 11.31: παιδεύειν (-ε-εν, a spurious diphthong: 12.12, 12.16)
  when: {pos: VERB, feats: {VerbForm: Inf}}
  strip: [ω]
  blocks:
