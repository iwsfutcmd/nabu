  - suffix: *middle
- id: 'rule:grc-middle-future'  # CGCG 15.14, 15.40: an active verb's middle future (ἀκούσομαι)
  when: {pos: VERB, class: future-middle, feats: {Tense: Fut}}
  strip: [ω]
  blocks:
  - suffix:
