# What grc declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults, labels and named rules.
id: grc
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@e3d16bf90e73', status: draft}
varieties: [grc]
registers: [neutral]
dimensions:
  VERB: [Mood, Tense, Aspect, Voice, Person, Number, VerbForm]
  AUX: [Mood, Tense, Aspect, Person, Number, VerbForm]
  NOUN: [Case, Number]
  PROPN: [Case, Number]
  ADJ: [Gender, Case, Number, Degree]
  DET: [Gender, Case, Number]
  PRON: [Gender, Case, Number]
lexical:
  NOUN: [Gender]
  PROPN: [Gender]
citation:
  NOUN: {Gender: Masc, Case: Nom, Number: Sing}
  PROPN: {Gender: Masc, Case: Nom, Number: Sing}
  ADJ: {Gender: Masc, Case: Nom, Number: Sing}
  DET: {Gender: Masc, Case: Nom, Number: Sing}
  PRON: {Gender: Masc, Case: Nom, Number: Sing}
  VERB: {Mood: Ind, Tense: Pres, Person: '1', Number: Sing, VerbForm: Fin}
  AUX: {Mood: Ind, Tense: Pres, Person: '1', Number: Sing, VerbForm: Fin}
bare:
  NOUN: {Gender: Masc, Case: Nom, Number: Sing}
  PROPN: {Gender: Masc, Case: Nom, Number: Sing}
  ADJ: {Gender: Masc, Case: Nom, Number: Sing}
  DET: {Gender: Masc, Case: Nom, Number: Sing}
  PRON: {Gender: Masc, Case: Nom, Number: Sing}
  VERB: {Mood: Ind, Tense: Pres, Person: '1', Number: Sing, VerbForm: Fin}
# A verb is shown with its aorist and future after its present, the first of the principal parts CGCG lists (22.1:
# λέγω, εἶπον, ἐρῶ); the rules give them for every verb with a stem of each (docs/rules/grc.md). REVIEW: the course's
# aorist is Tense=Past with no Aspect (its imperfect is Aspect=Imp); the perfects and passives are not taught.
principalParts:
  VERB: [{Mood: Ind, Tense: Past, Person: '1', Number: Sing, VerbForm: Fin}, {Mood: Ind, Tense: Fut, Person: '1', Number: Sing, VerbForm: Fin}]
features:
  Aspect: [Imp, Perf]
  Case: [Acc, Dat, Gen, Nom, Voc]
  Degree: [Cmp]
  Gender: [Fem, Masc, Neut]
  Mood: [Imp, Ind, Sub]
  NumType: [Card, Ord]
  Number: [Plur, Sing]
  PartType: [Int]
  Person: ['1', '2', '3']
  Polarity: [Neg]
  Poss: ['Yes']
  PronType: [Dem, Ind, Int, Neg, Prs, Tot]
  Tense: [Fut, Past, Pres]
  VerbForm: [Fin, Inf, Part]
  Voice: [Mid]
defaults:
- {id: gender-os, when: {ends: ος}, gives: {Gender: Masc}}
- {id: gender-es, when: {ends: ης}, gives: {Gender: Masc}}
- {id: gender-e, when: {ends: η}, gives: {Gender: Fem}}
- {id: gender-a, when: {ends: α}, gives: {Gender: Fem}}
- {id: gender-is, when: {ends: ις}, gives: {Gender: Fem}}
- {id: gender-on, when: {ends: ον}, gives: {Gender: Neut}}
- {id: gender-ma, when: {ends: μα}, gives: {Gender: Neut}}
labels:
- {feats: {Mood: Imp, Number: Sing, Person: '2', VerbForm: Fin}, gloss: {en: 'the imperative, to one person: do!'}, was: 'form:impv-2s'}
- {feats: {Mood: Imp, Number: Plur, Person: '2', VerbForm: Fin}, gloss: {en: 'the imperative, to several people: do!'}, was: 'form:impv-2p'}
- {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Pres, VerbForm: Fin}, gloss: {en: 'the present, I: I do, I am doing'}, was: 'form:pres-1s'}
- {feats: {Mood: Ind, Number: Sing, Person: '2', Tense: Pres, VerbForm: Fin}, gloss: {en: 'the present, you (one person): you do, you are doing'}, was: 'form:pres-2s'}
- {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Pres, VerbForm: Fin}, gloss: {en: 'the present, he, she, it: does, is doing'}, was: 'form:pres-3s'}
- {feats: {Aspect: Perf, Mood: Ind, Number: Sing, Person: '2', VerbForm: Fin}, gloss: {en: 'the perfect, you (one person): you have done (and so it stands)'}, was: 'form:perf-2s'}
- {feats: {Case: Nom, Gender: Fem, Number: Sing}, gloss: {en: 'feminine, as subject: ἡ μήτηρ, the mother; νεωτέρα, younger (of a woman)'}, was: 'form:f'}
- {feats: {Case: Voc, Gender: Fem, Number: Sing}, gloss: {en: 'feminine vocative: calling a woman (ὦ Ξανθίππη); in -η and -α as the subject form'}, was: 'form:f-voc'}
- {feats: {Case: Voc, Gender: Masc, Number: Sing}, gloss: {en: 'the vocative (masculine): the form for calling someone (Σώκρατες, from Σωκράτης)'}, was: 'form:voc'}
- {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin}, gloss: {en: 'the present, they: they do, they are doing'}, was: 'form:pres-3p'}
- {feats: {Case: Acc, Gender: Fem, Number: Sing}, gloss: {en: 'feminine accusative: the object (ἀδελφὴν ἔχω, I have a sister; εἰς τὴν ἀγοράν)'}, was: 'form:f-acc'}
- {feats: {Case: Gen, Gender: Fem, Number: Sing}, gloss: {en: 'feminine genitive: of, from (ἐκ τῆς οἰκίας, out of the house; Παρυσάτιδος, of Parysatis)'}, was: 'form:f-gen'}
- {feats: {Case: Acc, Gender: Fem, Number: Plur}, gloss: {en: 'feminine accusative plural: the objects (ἀδελφὰς, sisters)'}, was: 'form:f-acc-pl'}
- {feats: {Case: 'Acc,Nom,Voc', Gender: Neut, Number: Sing}, gloss: {en: 'neuter: one form as subject, as object and when called (τὸ τέκνον, the child; ἐπὶ τὸ ὄρος, onto the mountain)'}, was: 'form:n'}
- {feats: {Case: Acc, Gender: Masc, Number: Sing}, gloss: {en: 'the accusative (masculine; also με, σε): the object of a verb (ἀδελφὸν ἔχω, I have a brother)'}, was: 'form:acc'}
- {feats: {Case: Gen, Gender: Masc, Number: Sing}, gloss: {en: 'the genitive (masculine): of, ''s (Δαρείου, of Darius)'}, was: 'form:gen'}
- {feats: {Case: 'Nom,Voc', Gender: Masc, Number: Plur}, gloss: {en: 'the plural (masculine; also ἡμεῖς, ὑμεῖς), as subject or called: -οι, -ες (ἀδελφοί, brothers)'}, was: 'form:pl'}
- {feats: {Case: Acc, Gender: Masc, Number: Plur}, gloss: {en: 'the accusative plural (masculine; also ἡμᾶς, ὑμᾶς): the objects (παῖδας, children)'}, was: 'form:acc-pl'}
- {feats: {Case: Dat, Gender: Fem, Number: Sing}, gloss: {en: 'feminine dative: to, for; on (a day); after ἐν, in (ἐν τῇ ἀγορᾷ, in the market place)'}, was: 'form:f-dat'}
- {feats: {Case: Gen, Gender: Neut, Number: Sing}, gloss: {en: 'neuter genitive: of; after ἔξω, outside (ἔξω τείχους, outside the wall)'}, was: 'form:n-gen'}
- {feats: {Case: Dat, Gender: Neut, Number: Sing}, gloss: {en: 'neuter dative: to, for; after ἐν, in (ἐν τῷ ἄστει, in the town)'}, was: 'form:n-dat'}
- {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Pres, VerbForm: Fin}, gloss: {en: 'the present, we: we do, we are doing'}, was: 'form:pres-1p'}
- {feats: {Mood: Ind, Number: Plur, Person: '2', Tense: Pres, VerbForm: Fin}, gloss: {en: 'the present, you (several people): you do, you are doing'}, was: 'form:pres-2p'}
- {feats: {Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, gloss: {en: 'the aorist, I: I did (once, in the past)'}, was: 'form:aor-1s'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'the imperfect, he, she, it: was doing, did'}, was: 'form:impf-3s'}
- {feats: {VerbForm: Inf}, gloss: {en: 'the infinitive: to do (κελεύει περιμεῖναι, he tells (you) to wait)'}, was: 'form:inf'}
- {feats: {Mood: Ind, Number: Plur, Person: '1', Tense: Fut, VerbForm: Fin}, gloss: {en: 'the future, we: we will do'}, was: 'form:fut-1p'}
- {feats: {Case: 'Nom,Voc', Gender: Fem, Number: Plur}, gloss: {en: 'feminine plural, as subject or called: αἱ γυναῖκες, the women'}, was: 'form:f-pl'}
- {feats: {Mood: Ind, Number: Plur, Person: '3', Tense: Pres, VerbForm: Fin, Voice: Mid}, gloss: {en: 'the present, they, with middle endings: -ονται (πορεύονται, they go)'}, was: 'form:pres-3p-mid'}
- {feats: {VerbForm: Part}, gloss: {en: 'the participle: -ing (βοώντων, shouting)'}, was: 'form:ptc'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Plur, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'the imperfect, they: they were doing, they did'}, was: 'form:impf-3p'}
- {feats: {Case: Dat, Gender: Masc, Number: Sing}, gloss: {en: 'the dative (masculine; also μοι, σοι): to, for (τῷ Ἀσκληπιῷ, to Asclepius; ὄνομά μοι, my name is)'}, was: 'form:dat'}
- {feats: {Case: Gen, Gender: Masc, Number: Plur}, gloss: {en: 'the genitive plural (masculine): of (the) … (τῶν στρατιωτῶν, of the soldiers); also after ἀκούω, hear'}, was: 'form:gen-pl'}
- {feats: {Mood: Sub, Number: Plur, Person: '2', Tense: Past, VerbForm: Fin}, gloss: {en: 'the aorist subjunctive, you (several): after μή, "don''t (do it)!"'}, was: 'form:aor-subj-2p'}
- {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Fut, VerbForm: Fin}, gloss: {en: 'the future, he, she, it: will do, will be'}, was: 'form:fut-3s'}
- {feats: {Case: 'Acc,Nom', Gender: Neut, Number: Plur}, gloss: {en: 'neuter plural: one form as subject and as object, in -α (τὰ ἄνω, the upstairs; ταῦτα, these things)'}, was: 'form:n-pl'}
- {feats: {Mood: Ind, Number: Sing, Person: '3', Tense: Past, VerbForm: Fin}, gloss: {en: 'the aorist, he, she, it: did (once, in the past)'}, was: 'form:aor-3s'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1', Tense: Past, VerbForm: Fin}, gloss: {en: 'the imperfect, I: I was doing, I used to do'}, was: 'form:impf-1s'}
- {feats: {Case: Dat, Gender: Neut, Number: Plur}, gloss: {en: 'neuter dative plural: to, for (τοῖς κάτω, to the downstairs rooms)'}, was: 'form:n-dat-pl'}
- {feats: {Case: Dat, Gender: Masc, Number: Plur}, gloss: {en: 'the dative plural (masculine; also ἡμῖν): to, for (ἡμῖν, to us)'}, was: 'form:dat-pl'}
- {feats: {Case: Nom, Degree: Cmp, Gender: Masc, Number: Sing}, gloss: {en: 'the comparative: more …, -er (σοφώτερος, wiser); the one compared in the genitive (than)'}, was: 'form:comp'}
- {feats: {Case: Nom, Degree: Cmp, Gender: Fem, Number: Sing}, gloss: {en: 'the comparative, feminine: more …, -er (σοφωτέρα, wiser, of a woman)'}, was: 'form:comp-f'}
- {feats: {Case: 'Nom,Voc', Number: Plur}, gloss: {en: 'the plural (masculine; also ἡμεῖς, ὑμεῖς), as subject or called: -οι, -ες (ἀδελφοί, brothers)'}, was: 'form:pl'}
- {feats: {Case: Acc, Number: Plur}, gloss: {en: 'the accusative plural (masculine; also ἡμᾶς, ὑμᾶς): the objects (παῖδας, children)'}, was: 'form:acc-pl'}
- {feats: {Case: Acc, Number: Sing}, gloss: {en: 'the accusative (masculine; also με, σε): the object of a verb (ἀδελφὸν ἔχω, I have a brother)'}, was: 'form:acc'}
- {feats: {Case: Dat, Number: Sing}, gloss: {en: 'the dative (masculine; also μοι, σοι): to, for (τῷ Ἀσκληπιῷ, to Asclepius; ὄνομά μοι, my name is)'}, was: 'form:dat'}
- {feats: {Case: Dat, Number: Plur}, gloss: {en: 'the dative plural (masculine; also ἡμῖν): to, for (ἡμῖν, to us)'}, was: 'form:dat-pl'}
rules:
- {id: 'rule:esti-moi', gloss: {en: 'ἔστι μοι + a noun: I have (word for word, there is to me)'}, was: 'construction:esti-moi'}
# Rules in a lexicon (docs/rules-design.md; docs/rules/grc.md): what grc's lexical forms are, and the rules that realise
# them, read by @nabu/core (`realise`, `spell`), never shipped. Every branch is REVIEW until the owner signs it off.
# Sources: van Emde Boas et al., The Cambridge Grammar of Classical Greek (2019), by section (CGCG 4.3 is chapter 4,
# section 3); the course where it writes a form the rules do not give (said so).
classes:
- {id: third, pos: NOUN, gloss: {en: 'third declension: the stem shows in the genitive (νύξ, νυκτός)'}, notes: {en: 'REVIEW: CGCG 4.31-4.91. Masculine and feminine nouns and names; the stem is listed on each (its genitive''s), and the nominative is the lemma.'}}
- {id: third-neuter, pos: NOUN, gloss: {en: 'third declension, neuter: one form as subject, object and when called (ὄνομα, ὀνόματος)'}, notes: {en: 'REVIEW: CGCG 4.40-4.41 (stems in ματ), 4.65 (stems in σ).'}}
- {id: mobile, pos: NOUN, gloss: {en: 'a one-syllable stem: the genitive and dative take the accent on the ending (νυκτός, παισί)'}, notes: {en: 'REVIEW: CGCG 24.23-24.24. παῖς''s genitive plural παίδων is listed (24.23 n.1).'}}
- {id: syncopated, pos: NOUN, gloss: {en: 'πατήρ, μήτηρ, θυγάτηρ: no ε in the genitive and dative singular, which take the accent on the ending (πατρός, μητρί)'}, notes: {en: 'REVIEW: CGCG 4.62-4.63. The stems are listed on each noun.'}}
- {id: contract, pos: VERB, gloss: {en: 'a contract stem: its last vowel merges with an ending''s (ὁράω, ὁρῶ; ἀμελέω, ἀμελῶ)'}, notes: {en: 'REVIEW: CGCG 12.15-12.17, 1.58-1.63. Also the third-declension stems in σ, which lose it before a vowel (τείχε-ος, τείχους: 4.65), and a verb whose future stem contracts (μενῶ, ἐρῶ, ἑλληνιῶ: 15.32).'}}
- {id: second-aorist, pos: VERB, gloss: {en: 'a thematic (second) aorist: the endings of the imperfect on a stem of its own (εἶπον, ἔσχον, ἦλθον)'}, notes: {en: 'REVIEW: CGCG 13.27-13.38. The stem is listed on each verb.'}}
- {id: second-aorist-middle, pos: VERB, gloss: {en: 'a thematic aorist in the middle (ἐγενόμην, ἀφικόμην)'}, notes: {en: 'REVIEW: CGCG 13.28. Not every middle verb''s aorist is middle: ἔρχομαι''s is ἦλθον (22.9, no. 66), πορεύομαι''s ἐπορεύθην.'}}
- {id: root-aorist, pos: VERB, gloss: {en: 'an aorist on a long-vowel stem with the endings -ν, -ς, -, -μεν, -τε, -σαν (κατέβην, ἐχάρην, ἐπορεύθην)'}, notes: {en: 'REVIEW: CGCG 13.39-13.50 (root aorists), 14 (the passive-form aorists of χαίρω, οἴομαι, πορεύομαι, which have the same endings).'}}
- {id: liquid-aorist, pos: VERB, gloss: {en: 'an aorist with no σ: a stem in λ, μ, ν or ρ lengthens its vowel instead (ἔμεινα)'}, notes: {en: 'REVIEW: CGCG 13.24-13.26 (pseudo-sigmatic aorists).'}}
- {id: future-middle, pos: VERB, gloss: {en: 'an active verb whose future is middle (ἀκούω, ἀκούσομαι)'}, notes: {en: 'REVIEW: CGCG 15.14, 15.40.'}}
- {id: attic-future, pos: VERB, gloss: {en: 'a future with no σ, contracted (μενῶ, ἐρῶ, ἑλληνιῶ)'}, notes: {en: 'REVIEW: CGCG 15.32-15.38; the stem is listed on each verb.'}}
- {id: attic-future-middle, pos: VERB, gloss: {en: 'a contracted future, and middle (βαδιοῦμαι)'}, notes: {en: 'REVIEW: CGCG 15.36, 15.40.'}}
- {id: pronominal, pos: PRON, gloss: {en: 'declined as an adjective, but the neuter singular ends in -ο (αὐτό, ἄλλο, τό)'}, notes: {en: 'REVIEW: CGCG 7.10; the article (3.1) and ἄλλος (an adjective, its neuter ἄλλο) too.'}}
- {id: two-ending, pos: ADJ, gloss: {en: 'one form for masculine and feminine (ὁ καὶ ἡ βάρβαρος)'}, notes: {en: 'REVIEW: CGCG 5.7-5.10.'}}
- {id: sigma-stem, pos: ADJ, gloss: {en: 'a stem in σ: -ής, -ές, genitive -οῦς (ἀληθής, οἰκογενής)'}, notes: {en: 'REVIEW: CGCG 5.28-5.29; the contracted endings as the grammar gives them.'}}
- {id: sigma-name, pos: PROPN, gloss: {en: 'a name in -ης on a stem in σ: genitive -ους, vocative -ες (Σωκράτης, Σωκράτους, Σώκρατες)'}, notes: {en: 'REVIEW: CGCG 4.65-4.66 (no plural), 24.26 (recessive: the vocative shows it).'}}
- {id: contracted, pos: ADJ, gloss: {en: 'contracted: -οῦς, -ῆ, -οῦν (διπλοῦς, χρυσοῦς)'}, notes: {en: 'REVIEW: CGCG 5.5-5.6. The forms after ε, ι, ρ (ἀργυροῦς, -ᾶ) are not written: no lexeme of the course has them.'}}
- {id: comparable, pos: ADJ, gloss: {en: 'compared with -ότερος, -ώτερος (σοφώτερος)'}, notes: {en: 'REVIEW: CGCG 5.36-5.38. An adjective not stated comparable has no comparative here (ordinals, ethnics, comparatives themselves): rule:grc-no-comparative.'}}
# How grc writes a lexical form. A lexeme's form is its lemma as its Attic reading writes it (profiles/schemes/attic.yaml):
# every α, ι, υ outside a diphthong marked long (ᾱ) or short (ᾰ) unless a circumflex or the iota subscript settles it,
# the accents as the lemma has them (an acute where the course writes a grave). Three signs of the notation's own:
# - "-" in a verb: where the augment goes (first, or after a compound's preverb: περῐ-μένω); a recessive accent goes no
#   further back than the syllable before it (CGCG 24.19). Never spelled.
# - "(ν)": the movable ν (ν ἐφελκυστικόν, CGCG 1.39), written or not.
# - a grave (U+0300): the accent an enclitic or proclitic takes only where the sentence calls for it (εἰμὶ, οὒ: CGCG
#   24.33-24.39); spelled as none, or as an acute.
# `order`: a letter's marks in the order the readings write them (length, diaeresis, breathing, accent, subscript).
notation:
  order: "[\u0304 \u0306 \u0308 \u0313 \u0314 \u0301 \u0342 \u0300 \u0345]"
  # What the accent rules (`phonology` entries with `accent`) read: a syllable's nucleus is a vowel, or a diphthong (a
  # vowel and ι or υ written with no length mark or diaeresis, in one morpheme); η, ω and a vowel with a macron, the
  # iota subscript or a circumflex are long; final -αι and -οι count short (CGCG 24.7-24.10).
  prosody:
    vowels: "[αεηιουωΑΕΗΙΟΥΩ]"
    long: "[ηωΗΩ]"
    lengthen: "[\u0304 \u0345]"
    diphthongs: "[{αι}{ει}{οι}{υι}{αυ}{ευ}{ηυ}{ου}{Αι}{Ει}{Οι}{Αυ}{Ευ}{Ου}]"
    apart: "[\u0304 \u0306 \u0308]"
    shortAtEnd: "[{αι}{οι}]"
    acute: "\u0301"
    circumflex: "\u0342"
    limit: "-"
  sets:
    # C a consonant; LAB, VEL, DEN the labial, velar and dental stops (ζ with them: CGCG 1.91); STOP any stop.
    C: "[βγδζθκλμνξπρσςτφχψῥ]"
    LAB: "[πβφ]"
    VEL: "[κγχ]"
    DEN: "[τδθζ]"
    STOP: "[πβφτδθκγχ]"
    # ER the letters after which a first-declension ending has ᾱ for η (CGCG 4.5), as a stem's last letter is written.
    ER: "[εέὲιίὶῖῐῑϊρ]"
    # FA a first-declension lemma's last vowel (η, ᾱ); OS a second-declension one's (ο); SH a short vowel (for
    # -ώτερος: CGCG 5.38); EA a contract stem's vowel (ε, ᾰ).
    FA: "[ηήᾱ]"
    OS: "[οό]"
    E: "[εέ]"
    SH: "[εέὲοόὸᾰῐῠ]"
    EA: "[εέᾰ]"
realisation:
# ---- Verbs (CGCG 11-15). A verb's form is its lemma, "-" where the augment goes; `strip` takes off its -ω or -ομαι.
# Stems the language has no rule for (a second aorist's, a future's) are listed on the lexeme; the endings are these.
# The course's cells: a finite verb's Mood, Tense (the aorist is Tense=Past with no Aspect, the imperfect Aspect=Imp,
# the perfect Aspect=Perf with no Tense), Person and Number; the imperative names no aspect (the present's endings).
- id: 'rule:grc-imperfect-middle'  # CGCG 11.22-11.30, 12.4: the secondary middle endings
  when: {pos: VERB, ends: ομαι, feats: {Aspect: Imp, Tense: Past}}
  strip: [ομαι]
  blocks:
  - suffix:
    - {branch: 1sg, feats: {Person: '1', Number: Sing}, add: ομην}
    - {branch: 2sg, feats: {Person: '2', Number: Sing}, add: ου}
    - {branch: 3sg, feats: {Person: '3', Number: Sing}, add: ετο}
    - {branch: 1pl, feats: {Person: '1', Number: Plur}, add: ομεθᾰ}
    - {branch: 2pl, feats: {Person: '2', Number: Plur}, add: εσθε}
    - {branch: 3pl, feats: {Person: '3', Number: Plur}, add: οντο}
- id: 'rule:grc-imperfect'  # CGCG 12.3, 12.8: ἐπαίδευον
  when: {pos: VERB, feats: {Aspect: Imp, Tense: Past}}
  strip: [ω]
  blocks:
  - suffix:
    - {branch: 1sg, feats: {Person: '1', Number: Sing}, add: ον}
    - {branch: 2sg, feats: {Person: '2', Number: Sing}, add: ες}
    - {branch: 3sg, feats: {Person: '3', Number: Sing}, add: ε(ν)}
    - {branch: 1pl, feats: {Person: '1', Number: Plur}, add: ομεν}
    - {branch: 2pl, feats: {Person: '2', Number: Plur}, add: ετε}
    - {branch: 3pl, feats: {Person: '3', Number: Plur}, add: ον}
- id: 'rule:grc-root-aorist'  # CGCG 13.39-13.40 (ἔβην), 14.2-14.3 (ἐπαιδεύθην, ἐχάρην): a listed stem in a long vowel
  when: {pos: VERB, class: root-aorist, feats: {Tense: Past}}
  blocks:
  - suffix:
    - {branch: 1sg, feats: {Mood: Ind, Person: '1', Number: Sing}, add: ν}
    - {branch: 2sg, feats: {Mood: Ind, Person: '2', Number: Sing}, add: ς}
    - {branch: 3sg, feats: {Mood: Ind, Person: '3', Number: Sing}, add: ''}
    - {branch: 1pl, feats: {Mood: Ind, Person: '1', Number: Plur}, add: μεν}
    - {branch: 2pl, feats: {Mood: Ind, Person: '2', Number: Plur}, add: τε}
    - {branch: 3pl, feats: {Mood: Ind, Person: '3', Number: Plur}, add: σᾰν}
    - {branch: sub-1sg, feats: {Mood: Sub, Person: '1', Number: Sing}, add: ω}
