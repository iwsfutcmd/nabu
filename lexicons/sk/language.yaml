# What sk declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults and labels. Standard Slovak (ADR 0155), in Universal Dependencies' terms as the Slovak SNK
# treebank uses them. Departures, stated: Polarity is written only where it is negative; the past
# participle carries no Animacy (UD marks it on the masculine singular; the form shows none) and no
# Gender in the plural (one form, -li, for all). The -l participle is Tense=Past in the conditional too (išiel
# by som), as UD's Slavic treebanks tag it; the conditional is by's (Mood=Cnd).
# A masculine noun stores its animacy: no ending gives it (a person or an animal is animate), and a
# default that gave it would reach the feminine nouns that end in a consonant too (noc, jar, tvár).
id: sk
license: CC-BY-SA-4.0
