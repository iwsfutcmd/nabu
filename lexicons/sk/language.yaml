# What sk declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults and labels. Standard Slovak (ADR 0155), in Universal Dependencies' terms as the Slovak SNK
# treebank uses them. Departures, stated: Polarity is written only where it is negative; the past
# participle carries no Animacy (UD marks it on the masculine singular; the form shows none) and no
# Gender in the plural (one form, -li, for all). The -l participle is Tense=Past in the conditional too (išiel
# by som), as UD's Slavic treebanks tag it; the conditional is by's (Mood=Cnd).
# A masculine noun stores its animacy: no ending gives it (a person or an animal is animate), and a
# default that gave it would reach the feminine nouns that end in a consonant too (noc, jar, tvár).
id: sk
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@sk-course-v1', status: draft}
varieties: [sk-SK]
registers: [formal, neutral, colloquial]
dimensions:
  NOUN: [Case, Number]
  PROPN: [Case, Number]
  ADJ: [Animacy, Case, Degree, Gender, Number]
  DET: [Animacy, Case, Gender, Number]
  PRON: [Animacy, Case, Gender, Number]
  NUM: [Animacy, Case, Gender, Number]
  ADV: [Degree]
  VERB: [Animacy, Case, Gender, Mood, Number, Person, Polarity, Tense, VerbForm, Voice]
  AUX: [Gender, Mood, Number, Person, Polarity, Tense, VerbForm]
lexical:
  NOUN: [Animacy, Gender]
  PROPN: [Animacy, Gender]
  VERB: [Aspect]
citation:
  NOUN: {Case: Nom, Number: Sing}
  PROPN: {Case: Nom, Number: Sing}
  ADJ: {Case: Nom, Gender: Masc, Number: Sing}
  DET: {Case: Nom, Gender: Masc, Number: Sing}
  VERB: {VerbForm: Inf}
  AUX: {VerbForm: Inf}
bare:
  NOUN: {Case: Nom, Number: Sing}
  PROPN: {Case: Nom, Number: Sing}
  ADJ: {Case: Nom, Gender: Masc, Number: Sing}
  DET: {Case: Nom, Gender: Masc, Number: Sing}
  VERB: {VerbForm: Inf}
  AUX: {VerbForm: Inf}
# The values the course uses from its first unit and never introduces as parts: the marked ones (the plural, the
# feminine, the cases, the past …) are taught against them. Read as taught where the compiler lists a paradigm's
# cells (docs/rules-design.md, stage 4), so the present, the masculine and the inanimate are listed too. REVIEW.
unmarked: {Animacy: [Inan], Case: [Nom], Gender: [Masc], Mood: [Ind], Number: [Sing], Tense: [Pres]}
features:
  Animacy: [Anim, Inan]
  Aspect: [Imp, Perf]
  Case: [Acc, Dat, Gen, Ins, Loc, Nom]
  Degree: [Cmp, Pos, Sup]
  Gender: [Fem, Masc, Neut]
  Mood: [Cnd, Imp, Ind]
  NumType: [Card, Ord]
  Number: [Plur, Sing]
  Person: ['1', '2', '3']
  Polarity: [Neg]
  Poss: ['Yes']
  PronType: [Dem, Ind, Int, Neg, Prs, Rel, Tot]
  Reflex: ['Yes']
  Tense: [Fut, Past, Pres]
  VerbForm: [Fin, Inf, Part]
  Voice: [Pass]
# A noun's gender by its ending (Mistrík 20-45): a consonant masculine, -ť feminine (kosť, chuť, pamäť),
# -a feminine, -o, -e (and -ie) neuter; a woman's surname in -ová feminine. The exceptions store theirs:
# feminines in other consonants (noc, jar, posteľ), masculines in -a (hrdina) and -o (Rudo), neuters in -a
# (dievča). REVIEW.
