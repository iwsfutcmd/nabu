# A noun's gender by its ending (Mistrík 20-45): a consonant masculine, -ť feminine (kosť, chuť, pamäť),
# -a feminine, -o, -e (and -ie) neuter; a woman's surname in -ová feminine. The exceptions store theirs:
# feminines in other consonants (noc, jar, posteľ), masculines in -a (hrdina) and -o (Rudo), neuters in -a
# (dievča). REVIEW.
