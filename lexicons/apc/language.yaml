# What apc declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults, labels and named rules.
id: apc
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@3ba6648d6c32', status: draft}
varieties: [apc-LB]
registers: [colloquial]
dimensions:
  VERB: [Aspect, Mood, Person, Gender, Number]
  AUX: [Aspect, Mood, Person, Gender, Number]
  NOUN: [Number]
  ADJ: [Gender, Number]
  PRON: [Gender, Number]
lexical:
  NOUN: [Gender]
  PROPN: [Gender]
citation:
  NOUN: {Gender: Masc, Number: Sing}
  PROPN: {Gender: Masc}
  ADJ: {Gender: Masc, Number: Sing}
  VERB: {Aspect: Perf, Person: '3', Gender: Masc, Number: Sing}
  AUX: {Aspect: Perf, Person: '3', Gender: Masc, Number: Sing}
# Shown after a verb's lemma (the owner's answer 1, 2026-11-23: the he-past first, the he-present beside it): the
# cell rule:apc-imperfect's branches 3 and ind give (Kline p. 100-101: byishrab).
principalParts:
  VERB: [{Aspect: Imp, Mood: Ind, Person: '3', Gender: Masc, Number: Sing}]
bare:
  NOUN: {Gender: Masc, Number: Sing}
  PROPN: {Gender: Masc}
  ADJ: {Gender: Masc, Number: Sing}
  VERB: {Mood: Imp, Person: '2', Gender: Masc, Number: Sing}
features:
  Aspect: [Imp, Part, Perf]
  Case: [Acc, Dat]
  Gender: [Fem, Masc]
  Gender[psor]: [Fem]
  Mood: [Imp, Ind, Sub]
  NumType: [Card, Ord]
  Number: [Dual, Plur, Sing]
  Number[psor]: [Plur, Sing]
  Person: ['1', '2', '3']
  Person[psor]: ['2']
  Polarity: [Neg]
  Poss: ['Yes']
  PronType: [Dem, Ind, Int, Prs, Rel, Tot]
defaults:
- {id: gender-ta, when: {ends: ة}, gives: {Gender: Fem}}
- {id: gender-none, when: {pos: NOUN}, gives: {Gender: Masc}}
- {id: gender-none-name, when: {pos: PROPN}, gives: {Gender: Masc}}
labels:
- {feats: {Gender: Fem, Number: Sing}, gloss: {en: 'feminine: a feminine noun (ahwe, madrase, teta), or the -e / -a ending on an adjective with one (kbir becomes kbire)'}, notes: {en: 'kbir becomes kbire, zghir becomes zghire. Arabic script: ة (كبيرة). Most nouns in -e / -a (ة) are feminine (ahwe, قهوة), not all (zalame, a man); some feminines have no ending (emm, mother; shams, the sun).'}, was: 'form:fem'}
- {feats: {Gender: Fem}, pos: PROPN, gloss: {en: 'feminine: a feminine noun (ahwe, madrase, teta), or the -e / -a ending on an adjective with one (kbir becomes kbire)'}, notes: {en: 'kbir becomes kbire, zghir becomes zghire. Arabic script: ة (كبيرة). Most nouns in -e / -a (ة) are feminine (ahwe, قهوة), not all (zalame, a man); some feminines have no ending (emm, mother; shams, the sun).'}, was: 'form:fem'}
- {feats: {'Gender[psor]': Fem, 'Number[psor]': Sing, 'Person[psor]': '2'}, gloss: {en: '-ik: your (to a woman)'}, notes: {en: 'Arabic script: the same ك as -ak, so كيفك reads kifak to a man and kifik to a woman.'}, was: 'form:poss-2fs'}
- {feats: {'Number[psor]': Plur, 'Person[psor]': '2'}, gloss: {en: '-kon: your (to several people)'}, notes: {en: 'kifkon? how are you (all)?; 3endkon: you have. Arabic script: كن joined to the word (كيفكن).'}, was: 'form:poss-2pl'}
- {feats: {Number: Plur}, gloss: {en: 'plural: a plural noun (wlad, jiren), or the -in ending on an adjective with one (jou3an becomes jou3anin)'}, notes: {en: 'jou3anin: hungry (several people); mabsoutin: happy. Arabic script: ين (جوعانين). Lebanese makes no gender in the plural: one form for men and women.'}, was: 'form:pl'}
- {feats: {Gender: Fem, Mood: Imp, Number: Sing, Person: '2'}, gloss: {en: '-i: telling a woman to do something'}, notes: {en: 'tfaddal becomes tfaddali, shrab becomes shrabi, kol becomes kili.'}, was: 'form:imp-2fs'}
- {feats: {Mood: Imp, Number: Plur, Person: '2'}, gloss: {en: '-o: telling several people to do something'}, notes: {en: 'tfaddalo! kilo! shrabo! Arabic script: وا after the verb (تفضّلوا).'}, was: 'form:imp-2pl'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Sing, Person: '1'}, gloss: {en: 'b-: I (present)'}, notes: {en: 'bekol: I eat; bishrab: I drink. Present, habit, or what I''m about to do.'}, was: 'form:impf-1sg'}
- {feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '2'}, gloss: {en: 'bt-: you (present, to a man)'}, notes: {en: 'btishrab: you drink. The same form means ''she'': bt- is both.'}, was: 'form:impf-2ms'}
- {feats: {Aspect: Imp, Gender: Masc, Mood: Ind, Number: Sing, Person: '3'}, gloss: {en: 'bi-: he (present)'}, notes: {en: 'byishteghel: he works. Arabic script: بي joined to the verb (بيشتغل).'}, was: 'form:impf-3ms'}
- {feats: {Aspect: Imp, Gender: Fem, Mood: Ind, Number: Sing, Person: '3'}, gloss: {en: 'bt-: she (present)'}, notes: {en: 'btishteghel: she works; the same form as ''you'' to a man.'}, was: 'form:impf-3fs'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Plur, Person: '1'}, gloss: {en: 'mn-: we (present)'}, notes: {en: 'mnru7: we go; mnishrab: we drink. Arabic script: من joined to the verb (منروح).'}, was: 'form:impf-1pl'}
- {feats: {Aspect: Imp, Gender: Fem, Mood: Ind, Number: Sing, Person: '2'}, gloss: {en: 'bt-…-i: you (present, to a woman)'}, notes: {en: 'btishrabi: you drink; bta3mli: you do. Arabic script: بت before the verb and ي after it (بتشربي).'}, was: 'form:impf-2fs'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Plur, Person: '2'}, gloss: {en: 'bt-…-o: you (present, to several people)'}, notes: {en: 'btishrabo: you drink; bta3mlo: you do. Arabic script: بت before the verb and وا after it (بتشربوا).'}, was: 'form:impf-2pl'}
- {feats: {Aspect: Imp, Mood: Sub, Number: Sing, Person: '1'}, gloss: {en: 'e- / no b-: I (after baddi, b7ebb, 3am…)'}, notes: {en: 'baddi ekol: I want to eat; b7ebb esma3: I like to listen. The b- of the present drops.'}, was: 'form:subj-1sg'}
- {feats: {Aspect: Imp, Gender: Masc, Mood: Sub, Number: Sing, Person: '2'}, gloss: {en: 't-: you (after baddak, 3am…; to a man)'}, notes: {en: 'baddak tishrab? Do you want to drink? 3am ta3mel: you are doing.'}, was: 'form:subj-2ms'}
- {feats: {Aspect: Imp, Mood: Sub, Number: Plur, Person: '1'}, gloss: {en: 'n-: we (after badna, ta…)'}, notes: {en: 'badna nru7: we want to go.'}, was: 'form:subj-1pl'}
- {feats: {Aspect: Perf, Number: Sing, Person: '1'}, gloss: {en: '-t: I (past)'}, notes: {en: 're7t: I went; akalt: I ate. The same word means ''you (a man)'': context decides.'}, was: 'form:past-1sg'}
- {feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '2'}, gloss: {en: '-t: you (past, to a man)'}, notes: {en: 'shu 3melt? What did you do? Spelled like ''I'': re7t, 3melt.'}, was: 'form:past-2ms'}
- {feats: {Aspect: Perf, Gender: Masc, Number: Sing, Person: '3'}, gloss: {en: 'he (past): the bare verb'}, notes: {en: 'ra7: he went; akal: he ate.'}, was: 'form:past-3ms'}
- {feats: {Aspect: Perf, Gender: Fem, Number: Sing, Person: '3'}, gloss: {en: '-et: she (past)'}, notes: {en: 'ra7et: she went; kenet: she was. Arabic script: ت at the end (راحت).'}, was: 'form:past-3fs'}
- {feats: {Aspect: Perf, Number: Plur, Person: '1'}, gloss: {en: '-na: we (past)'}, notes: {en: 're7na: we went; akalna: we ate.'}, was: 'form:past-1pl'}
- {feats: {Aspect: Perf, Gender: Fem, Number: Sing, Person: '2'}, gloss: {en: '-ti: you (past, to a woman)'}, notes: {en: 're7ti: you went; kenti: you were.'}, was: 'form:past-2fs'}
- {feats: {Aspect: Perf, Number: Plur, Person: '2'}, gloss: {en: '-to: you (past, to several people)'}, notes: {en: 're7to: you went; akalto: you ate. Arabic script: توا (رحتوا).'}, was: 'form:past-2pl'}
- {feats: {Aspect: Imp, Mood: Ind, Number: Plur, Person: '3'}, gloss: {en: 'bi-…-o: they (present)'}, notes: {en: 'byishrabo: they drink; byi7ko: they speak. Arabic script: بي before the verb and وا after it (بيشربوا), also written بيشربو.'}, was: 'form:impf-3pl'}
- {feats: {Aspect: Perf, Number: Plur, Person: '3'}, gloss: {en: '-o: they (past)'}, notes: {en: 'ra7o: they went; keno: they were; akalo: they ate. Arabic script: وا at the end (راحوا), also written راحو.'}, was: 'form:past-3pl'}
- {feats: {Aspect: Imp, Gender: Masc, Mood: Sub, Number: Sing, Person: '3'}, gloss: {en: 'y-: he (after ra7, baddo, lezem…)'}, notes: {en: 'ra7 yru7: he''ll go; ra7 yishteghel: he''ll work. The present without its b- (byru7 becomes yru7). Arabic script: ي before the verb (يروح).'}, was: 'form:subj-3ms'}
- {feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '3'}, gloss: {en: 't-: she (after ra7, badda…)'}, notes: {en: 'ra7 tishrab: she''ll drink. The same form as ''you'' to a man.'}, was: 'form:subj-3fs'}
- {feats: {Aspect: Imp, Gender: Fem, Mood: Sub, Number: Sing, Person: '2'}, gloss: {en: 't-…-i: you (to a woman, after ra7, baddik…)'}, notes: {en: 'ra7 tru7i: you''ll go. Arabic script: ت before the verb and ي after it (تروحي).'}, was: 'form:subj-2fs'}
- {feats: {Aspect: Imp, Mood: Sub, Number: Plur, Person: '2'}, gloss: {en: 't-…-o: you (to several people, after ra7, badkon…)'}, notes: {en: 'ra7 ta3mlo: you''ll do. Arabic script: ت before the verb and وا after it (تعملوا).'}, was: 'form:subj-2pl'}
- {feats: {Aspect: Imp, Mood: Sub, Number: Plur, Person: '3'}, gloss: {en: 'y-…-o: they (after ra7, baddon…)'}, notes: {en: 'ra7 ysefro: they''ll travel. Arabic script: ي before the verb and وا after it (يسافروا).'}, was: 'form:subj-3pl'}
classes:
- {id: nisba, pos: ADJ, gloss: {en: '-i adjectives: -iyye, -iyyin (lebnene, lebneniyye)'}, notes: {en: 'REVIEW: Kline p. 10-11 (the nisba).'}}
- {id: invariable, pos: ADJ, gloss: {en: 'an adjective that does not agree (akbar, awwal)'}, notes: {en: 'REVIEW: a comparative does not change for a feminine noun (Kline p. 14); the course writes awwal and tene so too.'}}
rules:
- {id: 'rule:shu-excl', gloss: {en: 'shu + adjective: how …!'}, notes: {en: 'shu 7elo!: how nice!; shu 7elwe hal hdiyye!: what a lovely present! The adjective agrees with what it describes.'}, was: 'construction:shu-excl'}
- {id: 'rule:used-to', gloss: {en: 'kent + a verb without b-: used to; would'}, notes: {en: 'kent ru7: I used to go; kenna nekol: we used to eat; ken yishteghel: he used to work. Both verbs agree with who did it.'}, was: 'construction:used-to'}
- {id: 'rule:was-doing', gloss: {en: 'kent 3am + verb: was …ing'}, notes: {en: 'kent 3am e2ra: I was reading; keno 3am yeklo: they were eating.'}, was: 'construction:was-doing'}
# How apc writes a lexical form (docs/lexical-forms/apc.md, "The notation"; docs/rules-design.md, section 3),
# read by @nabu/core `compileSpeller` for each profile's `spell`; never shipped. U+065C is e, U+065D o, U+06DF a
# letter written and not said (the owner, 2026-11-20). `order`: a letter's marks as the notation names them,
# shadda first (spaced, so the set itself stays NFC). Sets: L a letter, C a consonant (not a length letter's alef or alef maqsura, not ta marbuta), N a
# consonant that is no glide, V a short vowel's sign, H a hamza.
notation:
  vowels: {a: "\u064E", i: "\u0650", u: "\u064F", e: "\u065C", o: "\u065D"}
  long: {a: "\u064Eا", a-maqsura: "\u064Eى", e-alef: "\u065Cا", e: "\u065Cي", i: "\u0650ي", u: "\u064Fو", o: "\u065Dو"}
  none: "\u0652"
  order: "[\u0651 \u064B \u064E \u0650 \u064F \u065C \u065D \u0652 \u06DF]"
  sets:
    L: "[ء-غف-يپڤگ]"
    C: "[ءأ-ئبت-غف-ويپڤگ]"
    N: "[ءأ-ئبت-غف-هپڤگ]"
    V: "[\u064E\u064F\u0650\u065C\u065D]"
    H: "[ءأ-ئ]"
    # What the rules (below) add: K a consonant as the rules count one (no length letter, no glide), W a second
    # short vowel in one pattern.
    K: "[ء-ئب-غف-هگپڤ]"
    W: "[َُِ\u065c\u065d]"  # the same, where a pattern names a second one
    IU: "[ِ ُ {ِّ} {ُّ}]"  # i or u, doubled or not: what syncope drops
    P: "[بتينما]"  # the letters of the present's prefixes (b-, t-, y-, n-, mn-, the 1sg's alef)
    NUN: "[ن]"
    T: "[ت]"
    AYN: "[ع]"
    # REVIEW: the radicals before which a pattern's long a stays a (said back), read off Kline's words and the
    # course's (authored.yaml's `back`; ruling 3 keeps the rule for templates, which have no word to store it on).
    BACK: "[رقعحخغصضطظو]"
    # REVIEW: the letters the feminine ending is -a after: Kline p. 16 lists ر ع ق ص ض ط ظ; his own words add
    # ح غ ء (apc.md, 'A pattern's template').
    FEMA: "[رعقصضطظحغء]"
    # Stage 3: the sun letters an article's lam goes into (Kline p. 8, img; ج is one there; his table puts ن among the
    # moon letters, a slip: REVIEW), a short a with a shadda or not, a glide.
    SUN: "[تثدذرزسشصضطظلنج]"
    A: "[\u064E {\u064E\u0651}]"
    GL: "[وي]"
    FEMI: "[رص]"
# Rules in a lexicon, stage 2 (docs/rules-design.md): apc's root classes, stem
# templates, its verbs' realisation rules and its rewrite rules. Nothing reads them in the compiler yet: core's
# `realise` does (core-cli realise, conformance/realise.json). Every branch is REVIEW until the owner signs it off.
# Sources: Kline (2022), by page; the course where Kline is silent (said so); the owner's rulings in
# docs/lexical-forms/apc.md. A verb's radicals, Form and vowels are its lexeme's (stage 1 stores them).
rootClasses:  # the first that holds; never stored (apc.md, 'A verb's form')
- {id: hamzated, radical: 1, in: "[ء]"}
- {id: w-initial, radical: 1, in: "[و]"}
- {id: hollow, radical: 2, in: "[وي]"}
- {id: doubled, same: [2, 3]}
- {id: defective, radical: 3, in: "[وي]"}
- {id: sound}
stems:
- {id: perfect, form: I, template: "1{past}2{past}3"}  # daras, shereb (Kline p. 75)
- {id: perfect, form: I, class: hamzated, template: "أ{past}2{past}3"}  # akal, akhad: the course writes أ (Kline p. 75, img)
- {id: perfect, form: I, class: hollow, template: "1{past}ا3"}  # ra7, ken: the long vowel a or e is the verb's own (ruling 3: stored on each word; its `past` vowel)
- {id: perfect, form: I, class: doubled, template: "1َ2ّ"}  # 7abb, laff, da22 (Kline p. 79)
- {id: perfect, form: I, class: defective, template: "1َ2َى"}  # 7aka (Kline p. 78, 123)
- {id: perfect, form: I, class: defective, vowels: {present: a}, template: "1َ2َا"}  # 2ara, the 'irregular defective', spelled with alef (Kline p. 78)
- {id: perfect-short, form: I, template: "1{past}2{past}3"}  # akalt, akalna: an a-verb keeps both vowels (Kline p. 96)
- {id: perfect-short, form: I, vowels: {past: i}, template: "1ْ2ِ3", branch: i-short}  # REVIEW: the course's shrebt, 3melt, fhemt, sme3t, shrebna (Kline gives no i-verb paradigm)
- {id: perfect-short, form: I, class: hamzated, template: "أ{past}2{past}3"}  # akalt
- {id: perfect-short, form: I, class: hollow, template: "1ِ3", branch: hollow-short}  # Kline: kent, kente, kenna, kento (p. 60); Sert, Serte, Serna, Serto (p. 69); shifet (p. 99); re7na (p. 25, 64, 144); 3eshet (p. 159): one short vowel e/i, whatever the present's; ro7t is the Bekaa's (p. 198). The owner: follow Kline (2026-11-23)
- {id: perfect-short, form: I, class: doubled, template: "1َ2ّ\u065cي", branch: doubled-e}  # 7abbet, I and you (m.) (Kline p. 97)
- {id: perfect-short, form: I, class: defective, template: "1ْ2ِي", branch: defective-i}  # 7keet (Kline p. 98, the first of his two sets)
- {id: perfect-ay, form: I, class: doubled, template: "1َ2َّيْ", branch: doubled-ay}  # 7abbayte, 7abbayna, 7abbayto (Kline p. 97)
- {id: perfect-ay, form: I, class: defective, template: "1َ2َيْ", branch: defective-ay}  # 7akayte, 7akayna, 7akayto (Kline p. 98, the second set)
- {id: imperfect, form: I, template: "1ْ2{present}3"}  # yeshrab, ya3mel, yedros (Kline p. 75-76)
- {id: imperfect, form: I, class: hamzated, template: "ـ\u065cا2{present}3", branch: hamzated}  # yekol, yekhod: the prefix's vowel is a long e spelled with alef (ياكل; Kline p. 75, img)
- {id: imperfect, form: I, class: w-initial, template: "ـُو2{present}3", branch: w-initial}  # yusal (Kline p. 76)
- {id: imperfect, form: I, class: hollow, template: "1{long present}3"}  # yru7, ysir (Kline p. 77)
- {id: imperfect, form: I, class: hollow, vowels: {present: e}, template: "1{past}ا3", branch: hollow-unchanged}  # nem / ynem: the vowel does not change (Kline p. 77); khaf / ykhaf, present a, takes the long present as ra7 does
- {id: imperfect, form: I, class: doubled, template: "1ِ2ّ"}  # y7ebb, yleff, yde22 (Kline p. 79)
- {id: imperfect, form: I, class: defective, template: "1ْ2{long present}"}  # ye7ki, ye2ra (Kline p. 78)
- {id: command, form: I, class: hamzated, template: "2\u065dو3", branch: hamzated}  # kol, khod (Kline p. 164): an o the course writes with و (كول, خود; Kline p. 163)
- {id: command-v, form: I, class: hamzated, template: "2ِ3", branch: hamzated}  # kili, kilo (Kline p. 164: kele, kelo)
- {id: participle, form: I, template: "1\u065cا2ِ3"}  # keteb, seken, nezel
- {id: participle, form: I, radical: 1, in: "{BACK}", template: "1َا2ِ3", branch: back-a}  # 2a3ed, wa2ef: a after a back radical (REVIEW)
- {id: participle, form: I, class: hollow, template: "1\u065cايِ3", branch: hollow}  # keyin, neyem (Kline p. 123)
- {id: participle, form: I, class: hollow, radical: 1, in: "{BACK}", template: "1َايِ3", branch: hollow-back-a}  # raye7, Sayer (Kline p. 123, img)
- {id: participle, form: I, class: defective, template: "1\u065cا2ِي", branch: defective}  # meshe, 7eke, 2are (Kline p. 123, img)
- {id: perfect, form: II, template: "1َ2َّ3"}  # jarrab, fakkar, wa22af
- {id: perfect, form: II, class: defective, template: "1َ2َّى"}  # ghanna
- {id: imperfect, form: II, template: "1َ2ِّ3"}  # yjarreb, yfakker, ywa22ef
- {id: imperfect, form: II, class: defective, template: "1َ2ِّي"}  # yghanne
- {id: perfect, form: III, template: "1\u065cا2َ3"}  # sefar, se3ad (Kline p. 83); REVIEW: e or a as the participle's (BACK)
- {id: perfect, form: III, radical: 1, in: "{BACK}", template: "1َا2َ3"}  # 7afaZ (Kline p. 84)
- {id: imperfect, form: III, template: "1\u065cا2ِ3"}  # ysefir (Kline p. 83)
- {id: imperfect, form: III, radical: 1, in: "{BACK}", template: "1َا2ِ3"}  # y7afiz (Kline p. 84)
- {id: perfect, form: VIII, template: "اِ1ْتَ2َ3"}  # shta8al
- {id: perfect, form: VIII, class: hollow, template: "ا\u06df1ْت\u065cا3"}  # rte7 (Kline p. 91): no vowel before the cluster, the alef written and not said, as stanna's (REVIEW: the course's eshtara, eshteghel still say it)
- {id: perfect, form: VIII, class: defective, template: "اِ1ْتَ2َى"}  # shtara
- {id: perfect-short, form: VIII, class: defective, template: "اِ1ْتَ2ِي", branch: defective-i}  # REVIEW: the course's eshtarit; Kline writes shtareyt (p. 152)
- {id: perfect-ay, form: VIII, class: defective, template: "اِ1ْتَ2َيْ", branch: defective-ay}  # the course's eshtarayti, eshtarayna, eshtarayto
- {id: imperfect, form: VIII, template: "1ْتِ2ِ3"}  # yeshte8el
- {id: imperfect, form: VIII, class: hollow, template: "1ْت\u065cا3"}  # yrte7
- {id: imperfect, form: VIII, class: defective, template: "1ْتِ2ِي"}  # yshtere (Kline p. 91); the course's eshtiri
realisation:
- id: 'rule:apc-perfect'  # the suffix conjugation (Kline p. 95-99)
  when: {feats: {Aspect: Perf}}
  stem: perfect
  blocks:
  - suffix:
    - {branch: 1sg, feats: {Person: '1', Number: Sing}, add: "ت", stem: [perfect-short, perfect]}
    - {branch: 1pl, feats: {Person: '1', Number: Plur}, add: "نَا", stem: [perfect-ay, perfect-short, perfect]}
    - {branch: 2fs, feats: {Person: '2', Gender: Fem, Number: Sing}, add: "تِي", stem: [perfect-ay, perfect-short, perfect]}
    - {branch: 2pl, feats: {Person: '2', Number: Plur}, add: "تُوا\u06df", stem: [perfect-ay, perfect-short, perfect]}  # -to; the alef is written and not said
    - {branch: 2ms, feats: {Person: '2'}, add: "ت", stem: [perfect-short, perfect]}
    - {branch: 3fs, feats: {Person: '3', Gender: Fem, Number: Sing}, add: "ـِت"}  # -et, on the long stem (Kline p. 60, 69: kenet, Saret)
    - {branch: 3pl, feats: {Person: '3', Number: Plur}, add: "ـُوا\u06df"}  # -o (keno, Saro)
    - {branch: 3ms, feats: {Person: '3'}, add: ""}  # he: the stem alone
- id: 'rule:apc-imperfect'  # the prefix conjugation (Kline p. 100-104, 157-159)
  when: {feats: {Aspect: Imp}}
  stem: imperfect
  blocks:
  - prefix:  # who: the person prefix
    - {branch: 1sg-sub, feats: {Person: '1', Number: Sing, Mood: Sub}, add: "ا"}  # Kline p. 157: (a)-, a vowel written with alef before a cluster; the alef goes before a vowel (rule:apc-prefix-vowel)
    - {branch: 1sg, feats: {Person: '1', Number: Sing}, add: ""}  # b- alone (Kline p. 100)
    - {branch: 1pl, feats: {Person: '1', Number: Plur}, add: "ن"}
    - {branch: 3fs, feats: {Person: '3', Gender: Fem, Number: Sing}, add: "ت"}
    - {branch: '2', feats: {Person: '2'}, add: "ت"}
    - {branch: '3', feats: {Person: '3'}, add: "ي"}
  - prefix:  # the indicative's b- (the future's ra7 and the negative's ma are lexemes of their own)
    - {branch: ind, feats: {Mood: Ind}, add: "ب"}
  - suffix:
    - {branch: 2fs, feats: {Person: '2', Gender: Fem, Number: Sing}, add: "ـِي"}
    - {branch: pl, feats: {Person: '2,3', Number: Plur}, add: "ـُوا\u06df"}
- id: 'rule:apc-command'  # the command (Kline p. 161-166): the present's stem, no prefix
  when: {feats: {Mood: Imp}}
  stem: [command, imperfect]
  blocks:
  - suffix:
    - {branch: 2fs, feats: {Gender: Fem, Number: Sing}, add: "ـِي", stem: [command-v, command, imperfect]}
    - {branch: pl, feats: {Number: Plur}, add: "ـُوا\u06df", stem: [command-v, command, imperfect]}
    - {branch: 2ms, add: ""}
  # REVIEW: Kline gives the command of a sound verb with no vowel before its cluster (dros, trok: p. 161, 164;
  # 'initial clusters are allowed in and around Beirut', p. 162-163); the course writes shrab, shrabo (eshrab, eshrabo accepted: the owner, 2026-11-23).
- id: 'rule:apc-participle'  # the active participle, Form I (Kline p. 122-124, 130): a form of its verb (apc.md)
  when: {feats: {Aspect: Part}}
  stem: participle
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "ـ\u065cة"}  # -e, or -a (rule:apc-feminine)
    - {branch: pl, feats: {Number: Plur}, add: "ـِين"}  # -in
    - {branch: ms, add: ""}
# Stage 3: nouns and adjectives (Kline p. 10-16). Uninflected words, and a lexeme in its citation cell (its category's
# or its own `citation`: hayde, wlad), stand in it with no rule.
- id: 'rule:apc-invariable'  # REVIEW: an adjective that does not agree: no ending (akbar, awwal: the course; Kline p. 14)
  when: {pos: ADJ, class: invariable}
  blocks: []
- id: 'rule:apc-nisba'  # REVIEW: the nisba's feminine -iyye and plural -iyyin (Kline p. 10-11: lebnene, lebneniyye)
  when: {pos: ADJ, class: nisba}
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "ـ\u0651\u065cة"}  # its ي doubled, then -e
    - {branch: pl, feats: {Number: Plur}, add: "ـ\u0650\u0651ين"}
- id: 'rule:apc-adjective'  # an adjective's feminine and plural (Kline p. 10, 16)
  when: {pos: ADJ}
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "ـ\u065cة"}  # -e, or -a (rule:apc-feminine)
    - {branch: pl, feats: {Number: Plur}, add: "ـ\u0650ين"}  # -in
- id: 'rule:apc-noun'  # REVIEW: a noun whose tokens choose its gender, in the feminine (7abib, m3allem: Kline p. 10, 130)
  when: {pos: NOUN}
  blocks:
  - suffix:
    - {branch: fs, feats: {Gender: Fem, Number: Sing}, add: "ـ\u065cة"}
phonology:  # in order, each once over the whole form
- {id: 'rule:apc-article', branch: sun, find: "ل+{SUN}*", after: "ا\u06DF", to: "ل\u06DF+{SUN}\u0651"}  # the article's lam goes into a sun letter: said doubled, the lam written and not said (Kline p. 8-9)
- {id: 'rule:apc-article', branch: wasl, find: "+ا\u0650", after: "ا\u06DFل", to: "+ا\u06DF"}  # a word's first alef with its vowel is not said after the article (الامتحان: the course)
- {id: 'rule:apc-sukun', find: "{K}ّ+", before: "{K}*", to: "{K}ّْ+"}  # the notation: a doubled letter before a suffix's consonant takes the sign of no vowel
- {id: 'rule:apc-bn', find: "ب+{NUN}*+", to: "م+{NUN}+"}  # b- + n- is said and written mn- (Kline p. 100-101)
- {id: 'rule:apc-madda', find: "ا\u065c+ا", to: "آ\u065c+"}  # the 1sg's alef before a stem in long e: آكل (the course)
- {id: 'rule:apc-wasl', branch: prefix, when: {feats: {Aspect: Imp}}, find: "+ا\u06df", after: "{P}", to: "+"}  # REVIEW: a stem that begins with an alef written and not said (stanna's command, ا\u06dfسْتَنَّى) loses it after a person prefix, whose vowel the cluster then gives (yestanna, estanna: Kline p. 91, the course's stanna)
- {id: 'rule:apc-silent-alef', find: "ا\u06df+", to: "+"}  # the plural's silent alef is written only last in a word (Kline p. 95, img: شافوها)
- {id: 'rule:apc-prefix-vowel', branch: none, find: "ا+", at: start, before: ["{K}{V}", "{GL}{V}"], to: ""}  # no vowel before a consonant that has one: the 1sg's alef goes (ru7, nem; a glide too, REVIEW: wa22ef, as Form II's 3allem)
- {id: 'rule:apc-prefix-vowel', branch: ayn, find: "{P}+", after: ["#", "#{P}*+", "#و+", "#و+{P}*+"], before: "{AYN}ْ", to: "{P}َ+"}  # a before 3 (ba3mel, ta3mel; Kline p. 75, and a3ref for the 1sg, p. 157)
- {id: 'rule:apc-prefix-vowel', branch: cluster, find: "{P}+", after: ["#", "#{P}*+", "#و+", "#و+{P}*+"], before: "{K}ْ", to: "{P}ِ+"}  # i before a cluster (bishrab, btishrab, eshrab)
- {id: 'rule:apc-prefix-vowel', branch: none, find: "{P}+", after: ["#", "#{P}*+", "#و+", "#و+{P}*+"], to: "{P}ْ+"}  # none before a consonant with a vowel (bru7, btru7, mnru7)
- {id: 'rule:apc-defective', branch: adjective, when: {pos: ADJ}, find: "{K}*ى{W}+", to: "{K}{W}+"}  # REVIEW: an adjective written whole that ends in its vowel (a7la, aghla) gives it way to an ending's, as a defective verb does: what the regular endings make of it with its class passed over (a7le, a7lin)
- {id: 'rule:apc-syncope', branch: vowel, find: "{L}{IU}{L}{W}+", after: ".*", to: "{L}ْ{L}{W}+"}  # a stem's last i or u drops before an ending that begins with a vowel: 3emlo, ta3mli, tedrso, jarrbi, sekne (Kline p. 101-104, 130)
- {id: 'rule:apc-syncope', branch: she, find: "{K}َ{K}ِ+{T}*", to: "{K}ْ{K}ِ+{T}"}  # she-past as the speaker's áklit: 3azmet, 3ajbet (ruling 7, 2026-11-21; Kline writes katabet, p. 96)
- {id: 'rule:apc-syncope', branch: adjective, when: {pos: ADJ}, find: "{L}{A}{L}{W}+", to: "{L}\u0652{L}{W}+"}  # REVIEW: an adjective's last a drops too (m2akhkhra: the course; Kline p. 130 for participles)
- {id: 'rule:apc-defective', branch: ending, when: {feats: {Aspect: 'Imp,Perf'}}, find: "{K}*[اىي]{W}+", to: "{K}{W}+"}  # a defective stem's last vowel gives way to an ending's: 7ako, byi7ko, btghanne (Kline p. 98-99)
- {id: 'rule:apc-defective', branch: ending, when: {feats: {Mood: Imp}}, find: "{K}*[اىي]{W}+", to: "{K}{W}+"}  # the same, in the command
- {id: 'rule:apc-defective', branch: ay, when: {feats: {Aspect: Perf}}, find: "ى+", before: ["{K}", "{K}{V}"], to: "يْ+"}  # REVIEW: a stem written whole that ends in its vowel (stanna) takes -ay- before an ending that begins with a consonant, as the templates' defective-ay stem does (stannayt, stannayna; the course's eshtarayti)
- {id: 'rule:apc-geminate', find: "نْ+نَ", to: "+نَّ"}  # no doubled letter written twice: kenna (Kline p. 60; p. 73 n2)
- {id: 'rule:apc-short-stem', branch: dative, when: {feats: {Mood: Imp}}, find: "{K}[\u064F\u0650]{GL}{K}*+", before: "ل*", to: "{K}\u0650{K}+"}  # REVIEW: a hollow command's long vowel shortens before the dative (2elli: Kline p. 165-166; he gives it in the present too, the course has none)
- {id: 'rule:apc-geminate', branch: dative, find: "ل\u0652+ل\u0650", to: "+ل\u0650\u0651"}  # a stem's l and the dative's: one doubled l (2elli)
- {id: 'rule:apc-geminate', branch: dative, find: "ل\u0652+ل\u064E", to: "+ل\u064E\u0651"}
- {id: 'rule:apc-feminine', branch: e, find: "ي{FEMI}\u065c+ة", to: "ي{FEMI}\u0650+ة"}  # REVIEW: after a long i, r and S take -e (kbire, zghire, rkhise: the course; Kline's rule of thumb, p. 16, has a)
- {id: 'rule:apc-feminine', branch: a, find: "{FEMA}\u065c+ة", to: "{FEMA}َ+ة"}  # -a after the letters FEMA (Kline p. 16; REVIEW)
- {id: 'rule:apc-feminine-t', branch: vowel, find: "{L}[\u064E\u065C]+?ة{V}", to: "{L}\u0652+?ت{V}"}  # ة is t before an ending that begins with a vowel, the vowel before it gone (siyyarte, jarti: Kline p. 50, 152)
- {id: 'rule:apc-feminine-t', branch: doubled, find: "{L}\u064E\u0651+?ة{V}", to: "{L}\u0651\u0652+?ت{V}"}  # and after a doubled letter, the doubling kept (marra, marrten; 3amme, 3ammte: Kline p. 19-20, 152; REVIEW)
- {id: 'rule:apc-feminine-t', branch: consonant, find: "ة\u0652+", to: "ت\u0652+"}  # and -et- before one that begins with a consonant (jaretna, 3ayletkon: Kline p. 44-45)
- {id: 'rule:apc-helping-vowel', branch: glide, find: "{GL}\u0652{K}\u0652{K}*", to: "{GL}\u0650{K}\u0652{K}"}  # REVIEW: three consonants after a diphthong's glide: 3ayelti (the course)
# The helping vowel at a word's end (رُحِت, شْرِبِت: the owner, 2026-11-21) is not a rewrite here: the form keeps the
# cluster (رُحْ+ت), the marks layer's `spell` writes the vowel (profiles/apc-Arab.standard.yaml, `vocalized`) and the
# Arabizi's leaves it out or writes e (a free alternative: re7t), as the owner ruled ("the Arabizi stays as written").
# Inside a word it needs the boundary (سْمِعِتْني, not بْتَعْمْلي), so it stays a rewrite.
- {id: 'rule:apc-helping-vowel', branch: inside, find: "{K}ْ+?{K}ْ+{K}*", after: ".{V}", to: "{K}ِ+?{K}ْ+{K}"}  # and before an ending that begins with a said consonant (سْمِعِتْني, ruling 7); not before a vowel (none follows the cluster then)
# REVIEW, not written yet (no token of the course needs them): the dative's -ell- after the past's -t (2iltellak:
# Kline p. 43); a hollow verb's short stem before -l- in the present and the he-past (bshef lak, shaflak: Kline p. 99,
# 103; the course writes صارلي, the long stem). The helping vowel's damma after a damma inside a stem (شُغُل) is the
# marked layer's, as the stem's lexical form keeps its cluster.
