    source: 'deduced'
    basis: 'Kline does not list it. The course writes the past (3azamni) and e3zmak, where the present vowel has dropped: a vowel that drops there is i or u, never a (ta3mli, tedrso; yitla3o keeps its a), and it is cited i, as in 3emel and 3eref. Its prefix is a before ع, Kline''s (a3ref, p. 157; ba3mel, p. 75): the course wrote e3zmak until 2026-11-23, and accepts it.'
  spelled: {apc-Arab/standard: [عزم], apc-Latn/arabizi: [3azam]}
