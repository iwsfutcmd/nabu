    basis: 'Kline does not list it. The course writes only bfi2, which gives the present. The past is a hollow verb''s, and its long a is cited e, as in shef, ken and nem. Where the course''s hollow verbs keep a, a back consonant stands before it (ra7, 2al, sar, 3ash) or ر after it (zar); whether ق after it does the same is for a speaker. The course never writes the form.'
