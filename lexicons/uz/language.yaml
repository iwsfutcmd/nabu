# What uz declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults, labels and named rules.
id: uz
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@c6cfd8081cf7', status: draft}
varieties: [uz-UZ]
registers: [formal, neutral, colloquial]
dimensions:
  NOUN: [Number, Case]
  VERB: [Tense, Person, Number]
features:
  Aspect: [Prog]
  Case: [Abl, Acc, Dat, Gen, Loc, Ter]
  Degree: [Cmp]
  Mood: [Des, Imp]
  NumType: [Card]
  Number: [Plur, Sing]
  Number[psor]: [Plur, Sing]
  PartType: [Int]
  Person: ['1', '2', '3']
  Person[psor]: ['1', '2', '3']
  Polarity: [Neg]
  Polite: [Form]
  PronType: [Dem, Int, Neg, Prs, Tot]
  Tense: [Past, Pres]
