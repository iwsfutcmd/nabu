# What uz declares beside its lexicon (schemas/language.schema.json): its dimensions, features,
# defaults, labels and named rules.
id: uz
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@c6cfd8081cf7', status: draft}
varieties: [uz-UZ]
registers: [formal, neutral, colloquial]
# The features each category inflects for (docs/rules/uz.md): an affix lexeme a token lists brings the values it
# realises (bor + past + past-1sg: Tense=Past, Person=1, Number=Sing; ADR 0158).
dimensions:
  NOUN: [Number, 'Person[psor]', 'Number[psor]', Polite, Case]
  PROPN: [Case]
  PRON: ['Person[psor]', Case]
  ADJ: [Degree, 'Person[psor]']
  NUM: [Case]
  VERB: [VerbForm, Polarity, Tense, Aspect, Mood, Person, Number, Polite]
  AUX: [VerbForm, Polarity, Tense, Person, Number, Polite]
# A verb's lexical form is its stem (ich); its lemma, what a word card shows, is the infinitive in -moq, the merge
# of inf (Hancock-Parmer p. 39: the stem is the infinitive minus -moq). A noun, a name or a pronoun is cited in the
# nominative.
citation:
  VERB: {VerbForm: Inf}
  NOUN: {Case: Nom}
  PROPN: {Case: Nom}
  PRON: {Case: Nom}
# What a word requires before it is whole (ADR 0158; docs/rules/uz.md): a noun, a name or a pronoun a case (the
# nominative's is nothing), a verb a form (a finite tense or mood, the infinitive); a finite tense then requires a
# person (the set-1 endings of the present, -di, or the past's -m, -k, -ngiz, or the third person's nothing). REVIEW.
requires:
  NOUN: [Case]
  PROPN: [Case]
  PRON: [Case]
  VERB: [VerbForm]
  AUX: [VerbForm]
# A lexical form of these is a stem: a citation cell is realised by the rules as any other (ich, ichmoq), and so
# is a lemma the course cites in another cell (`citation` in lexemes.yaml: kuz, kuzda; bilmoq, bilmayman).
stemmed: [VERB, NOUN, ADJ, PRON]
features:
  Aspect: [Prog]
  Case: [Nom, Gen, Acc, Dat, Loc, Abl, Ter]
  Degree: [Cmp]
  Mood: [Des, Imp]
  NumType: [Card]
  Number: [Sing, Plur]
  Number[psor]: [Plur, Sing]
  PartType: [Int]
  Person: ['1', '2', '3']
  Person[psor]: ['1', '2', '3']
  Polarity: [Neg]
  Polite: [Form]
  PronType: [Dem, Int, Neg, Prs, Tot]
  Tense: [Past, Pres]
  VerbForm: [Inf, Fin]
classes:
- {id: vowel-drop, pos: NOUN, gloss: {en: 'a noun whose last vowel drops before an ending that begins with a vowel (singil, singlim; oʻgʻil, oʻgʻli)'}, notes: {en: 'REVIEW: Sjoberg (1963) 3.231 B, pp. 51-52: i, u, a in a final stressed syllable, after one or two consonants and before a sonant or a fricative (burun, burni; ogʻiz, ogʻzim; shahar, shahrim), not in every such word (kelin, kelini); Hancock-Parmer pp. 63-64 (fleeting vowels).'}}
