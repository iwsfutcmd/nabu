# How uz writes a lexical form (docs/rules/uz.md): Latin, as the official (1995) alphabet writes it, the
# letter after o and g (U+02BB) and the tutuq belgisi (U+02BC) letters of their own, `+` a morpheme's edge.
# Each profile's `spell` writes it in its orthography (uz-Latn as it is, uz-Cyrl letter by letter). Sets: V a
# vowel letter (oʻ is o and its sign), C a consonant letter (a digraph is two: s h, c h, n g; the sign of oʻ
# and gʻ, and the tutuq belgisi, are counted with them).
notation:
  sets:
    V: "[aeiouAEIOU]"
    C: "[bcdfghjklmnpqrstvxyzBCDFGHJKLMNPQRSTVXYZʻʼ]"
# Rules in a lexicon (docs/rules-design.md; docs/rules/uz.md). uz merges lexemes (ADR 0158, 2026-11-28): the
# course writes an inflected word as its lexemes (bor + past + past-1sg), each affix says what it merges onto
# (lexemes.yaml `on`: stem + plural + possessive + case; a verb's negative, then one tense or mood, then its
# person), and a cell is realised through the lexemes that bring it. The realisation rules that wrote those
# lexemes in a cell are gone (each branch is now an affix's `realises`; the infinitive's -moq is lexeme:inf).
# Each affix's allomorphs are still chosen by what they follow (`after`); the rewrites below run over the merged
# word. Sources: Hancock-Parmer (HP), Uzbek Language Manual, by printed page; Sjoberg (1963), Uzbek Structural
# Grammar, by page. REVIEW, every one.
phonology:  # in order, each once over the whole form
# The stem's last vowel, after one or two consonants (three units where the first vowel is oʻ: oʻgʻil), never
# an ending's (singillarim): singil + im, singlim; oʻgʻil + i, oʻgʻli (Sjoberg pp. 51-52).
- {id: 'rule:uz-vowel-drop', when: {class: vowel-drop}, find: "[aiu]{C}+", after: ["{V}{C}", "{V}{C}{C}", "{V}{C}{C}{C}"], before: "{V}", to: "{C}+"}
# REVIEW: a noun of more than one syllable writes its last k as g, its last q as gʻ, before the possessive's i
# (uzuk, uzugim; yongʻoq, yongʻogʻing: HP p. 10-11; Sjoberg p. 45-46 has it as voicing before any voiced sound,
# which the spelling does not write in verbs: yoqadi). A word of one syllable keeps it (park, parkim): the
# 1995 spelling rules, not in the library. No token of the course has it: a paradigm's forms do (mushugi).
- {id: 'rule:uz-voicing', branch: k, when: {pos: NOUN}, find: "k+", after: ["{V}{C}{V}", "{V}{C}{C}{V}", "{V}{C}{C}{C}{V}"], before: "i", to: "g+"}
- {id: 'rule:uz-voicing', branch: q, when: {pos: NOUN}, find: "q+", after: ["{V}{C}{V}", "{V}{C}{C}{V}", "{V}{C}{C}{C}{V}"], before: "i", to: "gʻ+"}
# Not written (no word of the course needs them): gʻ and the dative written qq (togʻ, toqqa: HP p. 11); -lar
# after a verb's third person; the second person singular (-san, -ding, -ng); the conditional -sa; the
# participle -gan; bir + -ta written bitta (HP p. 28).
