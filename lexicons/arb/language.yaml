phonology:
- id: rule:arb-viii
  branch: emphatic
  find: ت*
  after: '{EMPH}ْ'
  map:
    ت: ط
  when:
    pos: VERB
- id: rule:arb-viii
  branch: z
  find: ت*
  after: زْ
  map:
    ت: د
  when:
    pos: VERB
- id: rule:arb-hamza-hamza
  branch: a
  find: ءَ+?ءْ
  to: ءَا
- id: rule:arb-hamza-hamza
  branch: u
  find: ءُ+?ءْ
  to: ءُو
- id: rule:arb-hamza-hamza
  branch: i
  find: ءِ+?ءْ
  to: ءِي
- id: rule:arb-defective
  branch: wi
  find: و*
  after: '{C}{I}'
  map:
    و: ي
- id: rule:arb-defective
  branch: wa
  find: و*
  after: '{C}{A}'
  map:
    و: ي
  when:
    feats:
      Aspect: Imp
- id: rule:arb-defective
  branch: ay-end
  find: ي{AU}
  at: end
  after: '{C}{A}'
  to: ى
- id: rule:arb-defective
  branch: aw-end
  find: و{AU}
  at: end
  after: '{C}{A}'
  to: ا
- id: rule:arb-defective
  branch: iy-end
  find: يُ
  at: end
  after: '{C}{I}'
  to: ي
- id: rule:arb-defective
  branch: uw-end
  find: وُ
  at: end
  after: '{C}{U}'
  to: و
- id: rule:arb-defective
  branch: jussive-i
  find: يْ
  at: end
  after: '{C}{I}'
  to: ''
- id: rule:arb-defective
  branch: jussive-u
  find: وْ
  at: end
  after: '{C}{U}'
  to: ''
- id: rule:arb-defective
  branch: jussive-a
  find: يْ
  at: end
  after: '{C}{A}'
  to: ''
- id: rule:arb-defective
  branch: at
  find: '{W}َ+'
  after: '{C}{A}'
  before: ت*
  to: +
- id: rule:arb-defective
  branch: aw
  find: '{W}ُ+و'
  after: '{C}{A}'
  to: +وْ
- id: rule:arb-defective
  branch: u
  find: '{C}{IU}{W}ُ+و'
  to: '{C}ُ+و'
- id: rule:arb-defective
  branch: i
  find: '{C}{IU}{W}ِ+ي'
  to: '{C}ِ+ي'
- id: rule:arb-defective
  branch: ay
  find: يِ+ي
  after: '{C}{A}'
  to: يْ
- id: rule:arb-defective
  branch: long-i
  find: يْ
  after: '{C}{I}'
  to: ي
- id: rule:arb-defective
  branch: long-u
  find: وْ
  after: '{C}{U}'
  to: و
- id: rule:arb-shorten
  branch: u
  find: '{C}{U}و{C}ْ'
  to: '{C}{U}{C}ْ'
  when:
    pos: VERB
- id: rule:arb-shorten
  branch: i
  find: '{C}{I}ي{C}ْ'
  to: '{C}{I}{C}ْ'
  when:
    pos: VERB
- id: rule:arb-shorten
  branch: a
  find: '{C}{A}ا{C}ْ'
  to: '{C}{A}{C}ْ'
  when:
    pos: VERB
- id: rule:arb-geminate
  branch: n
  find: نْ+{NUN}*
  to: '{NUN}ّ'
- id: rule:arb-geminate
  branch: t
  find: تْ+{TT}*
  to: '{TT}ّ'
- id: rule:arb-doubled
  find: '{C}ّْ'
  at: end
  to: '{C}َ'
