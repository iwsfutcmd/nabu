# What a word requires before it is whole (ADR 0158; docs/rules/chg.md): a noun, a name or a pronoun a case (the
# nominative's is nothing: Schluessel 3.3.6), a verb a form (a finite tense or mood, a converb, a participle); a
# finite tense then requires a person (the past's, the present's, or the third person's nothing). REVIEW.
# A noun, a name or a pronoun is cited in the nominative, a verb as its stem (its hyphen: bar-).
citation:
  NOUN: {Case: Nom}
  PROPN: {Case: Nom}
  PRON: {Case: Nom}
requires:
  NOUN: [Case]
  PROPN: [Case]
  PRON: [Case]
  VERB: [VerbForm]
  AUX: [VerbForm]
features:
  Aspect: [Hab, Imp, Perf]
  Case: [Nom, Gen, Acc, Dat, Loc, Abl, Equ]
  Degree: [Cmp]
  Evident: [Nfh]
  Mood: [Cnd, Imp, Jus, Opt, Prp]
  NounType: [Clf]
  NumType: [Card, Ord]
  Number: [Sing, Plur]
  Number[psor]: [Plur, Sing]
  PartType: [Int]
  Person: ['1', '2', '3']
  Person[psor]: ['1', '2', '3']
  Polarity: [Neg]
  Polite: [Form]
  PronType: [Dem, Ind, Int, Neg, Prs, Tot]
  Reflex: ['Yes']
  Tense: [Fut, Past, Pres]
  VerbForm: [Fin, Conv, Part]
  Voice: [Pass]
