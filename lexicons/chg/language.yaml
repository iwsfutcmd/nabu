# How chg writes a lexical form (docs/rules/chg.md, "The form is Schluessel's reading"; the owner, 2026-11-28): Schluessel's
# reading (2018), which writes the Arabic letters' distinctions among the consonants (ṭ ṣ s̱ ẓ ż ḥ ʿ, ṗ for ف written for
# p) and more vowels than the script, with signs of its own for what only the Arabic writes, each a mark no Latin letter
# composes with: U+0329 a vowel written with its letter where the default leaves it out (in a stem a, ä, e, i; at a
# stem's end a full ا or ی for the he); U+0326 a vowel (or a consonant) not written where the default writes it; U+0334
# an initial a written آ; U+0324 a letter written as its twin (ب for p, ج for č, پ for b, گ for g, د for t); U+032F a or
# ä written ی; U+0338 a letter written and not said (its Latin letter names the Arabic one: i ی, a ا, u و, h ه, l ل, ʾ
# a hamza above); U+0359 a shadda, U+035B a damma written. And two sounds neither script writes: ï, a back i (Schluessel
# writes i), U+0364 on a vowel that takes front harmony though it looks back (šahar+gä) and U+0363 on one that takes back
# harmony though it looks front. · (U+00B7) is a half-space (ZWNJ), shown in the Latin too. In a suffix A, U, D, G, K
# are archiphonemes: a/ä, u/ü, d/t, ǧ/g/q/k, q/k by harmony and voicing in the Latin, one letter in the Arabic (ە at the
# end, غ or ک by harmony); Ğ is the dative's G, غ whatever the harmony (S 3.3.3). NJ: the letters whose Arabic joins
# nothing after it (the copula's half-space). Read by @nabu/core; never shipped. REVIEW, all of it.
