# Rules in a lexicon (docs/rules/chg.md). Every one is REVIEW.
phonology:
- {id: 'rule:chg-stem', find: "-+", to: "+"}  # a stem cited bare (al-, bar-) is written without its hyphen in a word
- {id: 'rule:chg-stem', find: "-", at: end, to: ""}  # (the ezafe's and the article's hyphens stay: tārīḫ-i, al-qiṣṣa)
