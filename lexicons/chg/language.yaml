  PROPN: [Number, 'Person[psor]', Case]
  PRON: ['Person[psor]', 'Number[psor]', Case]
  ADJ: [Degree, 'Person[psor]', Case]
  NUM: ['Person[psor]', Case]
  DET: [Case]
  ADV: [Degree, Number, 'Person[psor]', Case]
