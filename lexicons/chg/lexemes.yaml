  allomorphs:
  - {form: "ŋiz"}
- id: lexeme:pp2pl
  realises: {Number: Plur, Person: '2'}
  'on': {at: after, pos: [VERB, AUX], has: {Tense: Past, VerbForm: Fin}, lacks: [Person, Evident], or: [{pos: [VERB, AUX], has: {Mood: Cnd}, lacks: [Person]}]}
  gloss: {en: '-ŋlar: you, to several people (after the past -di and the conditional -sa)'}
