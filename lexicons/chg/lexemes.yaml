# The lexicon of chg (schemas/lexicon.schema.json): every lexeme, sorted by id.
language: chg
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@chg-draft-v1', status: draft}
lexemes:
- id: lexeme:abl
  realises: {Case: Abl}
  'on': {at: after, pos: [NOUN, PROPN, PRON, ADJ, NUM, DET, ADV], or: [{pos: [VERB, AUX], has: {VerbForm: Part}}]}
  gloss: {en: '-din (-dan, -tin): from; than'}
  notes: {en: 'Where from: Andijāndin "from Andijan". With -raq it is "than": mundin yaḫširaq "better than this".'}
  allomorphs:
  - {form: "din"}  # REVIEW: S 3.3.2 (p. 14): -din (Schluessel reads it so after any stem)
  - {form: "\u00B7din", free: true}  # REVIEW: after a half-space, as the course writes it
- id: lexeme:abu
  pos: PROPN
  gloss: {en: 'Abu ("father of", in names)'}
  form: "Abū"
  spelled: {chg-Arab/standard: [ابو], chg-Latn/schluessel: [Abū]}
  readings: {schluessel: Abū}
- id: lexeme:acc
  realises: {Case: Acc}
  'on': {at: after, pos: [NOUN, PROPN, PRON, ADJ, NUM, DET, ADV], or: [{pos: [VERB, AUX], has: {VerbForm: Part}}]}
  gloss: {en: '-ni: the object, when it is definite'}
  notes: {en: 'A definite object takes -ni: ani bilmäsmiz "we do not know it". An indefinite one takes nothing: nan aladur "she buys bread". After -i it is often just -n.'}
  allomorphs:
  - {form: "ni"}
  - {form: "n", after: {endsIn: "{I}*"}, free: true}  # REVIEW: -n after the possessive -i (atin)
  - {form: "\u00B7ni", free: true}  # REVIEW: after a half-space, as the course writes it
  - {form: "\u00B7n", after: {endsIn: "{I}*"}, free: true}  # REVIEW: after a half-space, as the course writes it
