  'on': {at: after, pos: [NOUN, PROPN, NUM, ADV, ADJ], lacks: [Case, 'Person[psor]'], or: [{pos: [PRON], has: {Reflex: 'Yes'}, lacks: [Case, 'Person[psor]']}]}  # a pronoun only as öz (özüm)
  gloss: {en: '-ŋ (after a vowel), -iŋ, -uŋ, -üŋ: your, to a friend'}
  allomorphs:
  - {form: "ŋ", after: {endsIn: "{V}*"}}
  - {form: "iŋ"}
  - {form: "ŋ", free: true}
- id: lexeme:poss3
  realises: {'Person[psor]': '3'}
  'on': {at: after, pos: [NOUN, PROPN, NUM, ADV, ADJ], lacks: [Case, 'Person[psor]'], or: [{pos: [PRON], has: {Reflex: 'Yes'}, lacks: [Case, 'Person[psor]']}]}  # a pronoun only as öz (özüm)
  gloss: {en: '-i (after a consonant), -si (after a vowel): his, her, its, their'}
  notes: {en: 'The thing owned takes the suffix: mewä "fruit", mewäsi "its fruit"; el "people", eli "its people". su "water" makes suyi.'}
  allomorphs:
  - {form: "si", after: {endsIn: "{V}*"}}  # REVIEW: S 6.1: -si after a vowel
  - {form: "i"}  # REVIEW: -i
  - {form: "i\u0326", free: true}  # REVIEW: its ی one with the stem's y (سُوی süyi)
  - {form: "\u00B7si", after: {endsIn: "{V}*"}, free: true}  # REVIEW: after a half-space, as the course writes it
  - {form: "\u00B7i", free: true}  # REVIEW: after a half-space, as the course writes it
  - {form: "\u00B7i\u0326", free: true}  # REVIEW: after a half-space, as the course writes it
  - {spelled: {chg-Arab/standard: [یی]}}  # REVIEW: the course's segmentation of a token the rules write otherwise (docs/rules/chg.md)
- id: lexeme:pp1p
  realises: {Number: Plur, Person: '1'}
  'on': {at: after, pos: [VERB, AUX], has: {Tense: Past, VerbForm: Fin}, lacks: [Person, Evident], or: [{pos: [VERB, AUX], has: {Mood: Cnd}, lacks: [Person]}]}
  gloss: {en: '-q, -k: we (after the past -di and the conditional -sa)'}
  notes: {en: 'barduq "we went", barsaq "if we go". The scribes write -q far more than -k, whatever the vowels.'}
  allomorphs:
  - {form: "K"}  # REVIEW: S 6.3.2: -q/-k
- id: lexeme:pp1s
  realises: {Number: Sing, Person: '1'}
  'on': {at: after, pos: [VERB, AUX], has: {Tense: Past, VerbForm: Fin}, lacks: [Person, Evident], or: [{pos: [VERB, AUX], has: {Mood: Cnd}, lacks: [Person]}]}
  gloss: {en: '-m: I (after the past -di and the conditional -sa)'}
  notes: {en: 'bardim "I went", barsam "if I go". These person endings follow the past and the conditional; -män, -sän, -siz, -miz, -sizlär follow the present and a predicate.'}
  allomorphs:
  - {form: "m"}
- id: lexeme:pp2
  realises: {Person: '2', Polite: Form}
  'on': {at: after, pos: [VERB, AUX], has: {Tense: Past, VerbForm: Fin}, lacks: [Person, Evident], or: [{pos: [VERB, AUX], has: {Mood: Cnd}, lacks: [Person]}]}
  gloss: {en: '-ŋiz: you, politely or to several (after the past -di and the conditional -sa)'}
