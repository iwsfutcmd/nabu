- id: lexeme:aor
  realises: {Aspect: Hab, Tense: Pres, VerbForm: Fin}
  'on': {at: after, pos: [VERB, AUX], lacks: [Polarity, Tense, Aspect, Mood, VerbForm]}  # its negative is -mas (aor-neg), never -ma- + -ur
  requires: [Person]
  gloss: {en: '-ur, -ar (-r after a vowel): does, will do; is, as a rule'}
  notes: {en: 'The aorist says what is so, or happens, as a rule or in general: üzümi yaḫši bolur "its grapes are (always) good". Babur describes his country in it.'}
  allomorphs:
  - {form: "r", after: {endsIn: "{V}*"}}  # REVIEW: S 10.7 (p. 79): -r after a vowel
  - {form: "Ar", after: {endsIn: "{VL}*"}}  # REVIEW: -ar/-är after a voiceless consonant (the course's 11 of 11)
  - {form: "Ur"}  # REVIEW: -ur/-ür: the course's elsewhere
  - {form: "Ar", free: true}  # REVIEW: -ar/-är beside -ur/-ür (yazar)
- id: lexeme:aor-neg
  realises: {Aspect: Hab, Polarity: Neg, Tense: Pres, VerbForm: Fin}
  'on': {at: after, pos: [VERB, AUX], lacks: [Polarity, Tense, Aspect, Mood, VerbForm]}
  requires: [Person]
  gloss: {en: '-mas, -mäs: does not, will not; is not, as a rule'}
  notes: {en: 'The aorist''s negative: yaḫširaq našpati bolmas "there are no better pears". emäs "is not" is this form of the old verb e- "to be".'}
  allomorphs:
  - {form: "mAs"}  # REVIEW: S 10.7.1 (p. 80): -mas/-mäs
- id: lexeme:aor.ptcp
  realises: {Aspect: Hab, VerbForm: Part}
  'on': {at: after, pos: [VERB, AUX], lacks: [Tense, Aspect, Mood, VerbForm]}
  gloss: {en: '-ur, -ar (-r after a vowel): who does, which does; with -da: while doing'}
  notes: {en: 'The aorist as a participle, with a case after it: alurda "while taking".'}
  allomorphs:
  - {form: "r", after: {endsIn: "{V}*"}}
  - {form: "Ar", after: {endsIn: "{VL}*"}}
  - {form: "Ur"}
  - {form: "Ar", free: true}
