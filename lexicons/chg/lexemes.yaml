- id: lexeme:poss3
  realises: {'Person[psor]': '3'}
  gloss: {en: '-i (after a consonant), -si (after a vowel): his, her, its, their'}
  notes: {en: 'The thing owned takes the suffix: mewä "fruit", mewäsi "its fruit"; el "people", eli "its people". su "water" makes suyi.'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [ی]}}
  - {spelled: {chg-Arab/standard: [سی]}}
  - {spelled: {chg-Arab/standard: [یی]}}
- id: lexeme:pp1p
  realises: {Number: Plur, Person: '1'}
  gloss: {en: '-q, -k: we (after the past -di and the conditional -sa)'}
  notes: {en: 'barduq "we went", barsaq "if we go". The scribes write -q far more than -k, whatever the vowels.'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [ق]}}
  - {spelled: {chg-Arab/standard: [ک]}}
- id: lexeme:pp1s
  realises: {Number: Sing, Person: '1'}
  gloss: {en: '-m: I (after the past -di and the conditional -sa)'}
  notes: {en: 'bardim "I went", barsam "if I go". These person endings follow the past and the conditional; -män, -sän, -siz, -miz, -sizlär follow the present and a predicate.'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [م]}}
- id: lexeme:pp2
  realises: {Person: '2', Polite: Form}
  gloss: {en: '-ŋiz: you, politely or to several (after the past -di and the conditional -sa)'}
  notes: {en: 'bardiŋiz "you went".'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [نکیز]}}
- id: lexeme:pp2pl
  realises: {Number: Plur, Person: '2'}
  gloss: {en: '-ŋlar: you, to several people (after the past -di and the conditional -sa)'}
  notes: {en: 'bardiŋlar "you (all) went".'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [نکلار]}}
- id: lexeme:pp2s
  realises: {Number: Sing, Person: '2'}
  gloss: {en: '-ŋ: you, to one person you know well (after the past -di and the conditional -sa)'}
  notes: {en: 'bardiŋ "you went". Asked after -sa it is a polite request (Schluessel 16.7): saqlap bärsäŋ? "would you keep it for me?".'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [نک]}}
- id: lexeme:pres
  realises: {Tense: Pres}
  gloss: {en: '-a, -ä (-y after a vowel): the present-future: does, is doing, will do'}
  notes: {en: 'The stem takes -a or -ä, then a person ending: baradur "goes, is going, will go" (-dur for he, she, it). Unit 5 has the other persons.'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [ا]}}
  - {spelled: {chg-Arab/standard: [ی]}}
- id: lexeme:pres-neg
  realises: {Polarity: Neg, Tense: Pres}
  gloss: {en: '-may, -mäy: does not, is not doing, will not (the present-future''s negative)'}
  notes: {en: 'In place of -a: ičmäymän "I do not drink", tutmaydur "he does not keep".'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [مای]}}
- id: lexeme:q
  pos: PART
  feats: {PartType: Int}
  gloss: {en: '-mu: a yes-or-no question'}
  notes: {en: '-mu turns a statement into a question: barmu? "is there?". It comes before -siz and -sän (mullāmusiz? "are you a mullah?"), after -män and -miz (Türkmänmu? "am I a Turk?").'}
  allomorphs:
  - {spelled: {chg-Arab/standard: [مو]}}
