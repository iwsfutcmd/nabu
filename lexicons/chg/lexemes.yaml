- id: lexeme:aor
  realises: {Aspect: Hab, Tense: Pres}
  gloss: {en: '-ur, -ar (-r after a vowel): does, will do; is, as a rule'}
  notes: {en: 'The aorist says what is so, or happens, as a rule or in general: üzümi yaḫši bolur "its grapes are (always) good". Babur describes his country in it.'}
  allomorphs:
  - {form: "ر", after: {endsIn: "{V}"}, spelled: {chg-Arab/standard: [ر]}}  # REVIEW: S 10.7 (p. 79): -r after a vowel (der-)
  - {form: "ار", after: {endsIn: "{VL}"}, spelled: {chg-Arab/standard: [ار]}}  # REVIEW: S 10.7 (p. 79): -ar/-är or -ur/-ür, 'a matter of preference or dialect'; the course writes -ar after a voiceless consonant (11 of 11)
  - {form: "ور", spelled: {chg-Arab/standard: [ور]}}  # REVIEW: S 10.7 (p. 79): -ur/-ür; the course's elsewhere (29 of 30)
  - {form: "ار", free: true, spelled: {chg-Arab/standard: [ار]}}  # REVIEW: S 10.7 (p. 79): -ar/-är beside -ur/-ür (yazar)
- id: lexeme:aor-neg
  realises: {Aspect: Hab, Polarity: Neg, Tense: Pres}
  gloss: {en: '-mas, -mäs: does not, will not; is not, as a rule'}
  notes: {en: 'The aorist''s negative: yaḫširaq našpati bolmas "there are no better pears". emäs "is not" is this form of the old verb e- "to be".'}
  allomorphs:
  - {form: "ماس", spelled: {chg-Arab/standard: [ماس]}}  # REVIEW: S 10.7.1 (p. 80): -mas/-mäs, one spelling
