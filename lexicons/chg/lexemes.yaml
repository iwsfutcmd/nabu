  - {form: "دو", after: {endsIn: "و{C}"}, before: {startsIn: "م#"}, spelled: {chg-Arab/standard: [دو]}}  # REVIEW: S 6.3.1 (p. 36): -dum after a stem whose last vowel is written و (roundedness harmony, S 6.2; -duŋ, -duŋlar likewise, which the course does not write)
  - {form: "تی", after: {endsIn: "{VL}"}, spelled: {chg-Arab/standard: [تی]}}  # REVIEW: S 6.3.1 (p. 37): 'sometimes, when the end of the verb stem is voiceless ... ت'
  - {form: "دی", spelled: {chg-Arab/standard: [دی]}}  # REVIEW: S 6.3.1 (p. 36): -di
  - {form: "دی", before: {startsIn: "م#"}, free: true, spelled: {chg-Arab/standard: [دی]}}  # REVIEW: -dim after a rounded stem too
  - {form: "دو", after: {endsIn: "{VL}"}, before: {startsIn: "[قک]#"}, free: true, spelled: {chg-Arab/standard: [دو]}}  # REVIEW: د after a voiceless consonant
