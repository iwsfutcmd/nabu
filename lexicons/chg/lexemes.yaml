- id: lexeme:pres
  realises: {Tense: Pres, VerbForm: Fin}
  'on': {at: after, pos: [VERB, AUX], lacks: [Tense, Aspect, Mood, VerbForm]}
  requires: [Person]
  gloss: {en: '-a, -ä (-y after a vowel): the present-future: does, is doing, will do'}
  notes: {en: 'The stem takes -a or -ä, then a person ending: baradur "goes, is going, will go" (-dur for he, she, it). Unit 5 has the other persons. After a vowel it is -y, as after the negative -ma-: qilmaydur "he does not do".'}
  allomorphs:
  - {form: "y", after: {endsIn: "{V}*"}}  # REVIEW: S 5.2.1 (p. 28): -y- after a vowel
  - {form: "A\u0329"}  # REVIEW: -a-/-ä-, ا
