# Phase 1 profile. Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
# Modern Standard Arabic (gameplan §6.3: folds hamza seats, alef maqsura/yeh and ta marbuta/ha, each with a note).
id: ar-Arab/standard
lang: ar-Arab
exemplars: cldr:ar
segmentation: { content: camel-tools, runtime: grapheme }
normalize:
  - nfc
  - fold-compat: arabic-presentation-forms
  - remove: ["\u0640"]                 # tatweel
  - digits: { canonical: latn, accept: [arab, arabext, latn] }
  - punctuation: strip
  - whitespace: collapse
match:
  case: none
  marks:
    set: "[\u064B-\u0652\u0670]"   # harakat optional in answers
    policy: ignore
    # REVIEW: sukun is optional when a learner writes the vowel marks (ADR 0054); the drafts disagree on it.
    optional: "[\u0652]"
    # REVIEW: so is a fatha before a plain alif or alif maqsura (ADR 0054 as amended): it spells the a the
    # alif writes anyway, and vocalized texts write it or not (مَرْحَبا, مَرْحَبَا). Any other mark there counts
    # (بِالبيت: bi- before the article's alif), and so does the fatha before a hamza's alif (أ).
    optionalBefore: [{ marks: "[\u064E]", letters: "[\u0627\u0649]" }]
  equivalences:
    - { id: persian-keyboard, map: { "\u06A9": "\u0643", "\u06CC": "\u064A" }, policy: accept }          # keheh/Farsi yeh typed on a Persian keyboard
    - { id: hamza-seat, map: { "\u0623": "\u0627", "\u0625": "\u0627", "\u0622": "\u0627", "\u0671": "\u0627" }, policy: accept-with-note, note: hamza }
    - { id: alef-maqsura, map: { "\u0649": "\u064A" }, policy: accept-with-note, note: alef-maqsura }
    - { id: ta-marbuta, map: { "\u0629": "\u0647" }, policy: accept-with-note, note: ta-marbuta }
  typo: { model: keyboard, layout: cldr-kbd:ar, maxRatio: 0.2 }
# What the letters write of the sound (ADR 0148). REVIEW: no course uses this profile yet. Modern Standard Arabic's
# consonant letters each say one sound, so the sound is read off the spelling, its vowel marks left aside (texts
# leave them out), and nothing is stated as lost. Considered and left out (REVIEW):
#  - ة/ه, ى/ي, the hamza seats: matching policies with their notes (`equivalences`), never restated here.
#  - Long ā as ا, ى or a dagger alif (هذا hādhā; the dagger alif is a mark the sound leaves aside); tanwin's alif
#    (كتابًا); the article's l before a sun letter; the silent alif of -ū (كتبوا): each is the one spelling the
#    norm writes, with no other a learner could be taken to choose.
#  - Regional readings of ق, ج, ث, ذ, ظ: the profile is the standard, and the standard says each one way.
sound: { from: spelling, ignores: "[ً-ْٰ]" }
correspondences: []
annotations:
  - { id: vocalized, kind: vocalization, toggle: true, default: on-for-new-words }
layout: { vertical: none }
fonts: { stack: [Noto Naskh Arabic], lineHeight: 1.9 }
