# Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
# Biblical Hebrew in Hebrew script with the Tiberian pointing (ADR 0082). Content is written pointed,
# as the Masoretic text is (vowels, dagesh, shin and sin dots, maqaf, sof pasuq), without the
# cantillation accents or meteg. "Vowel marks" off shows the consonantal text alone, as a scroll has it.
# Learners type unpointed Hebrew; any points they do type are ignored, like Arabic harakat.
id: hbo-Hebr/tiberian
lang: hbo-Hebr
exemplars: cldr:he
# REVIEW: what CLDR 49's (Modern) Hebrew exemplars lack for the Masoretic text: sof pasuq, the verse end.
exemplarsExtra: ["\u05c3"]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  # Cantillation accents, meteg, rafe, paseq and the upper and lower dots are not part of the pointing a
  # learner writes: an answer copied from an accented text compares as its letters and points.
  - remove: ["\u0591", "\u0592", "\u0593", "\u0594", "\u0595", "\u0596", "\u0597", "\u0598", "\u0599", "\u059a", "\u059b", "\u059c", "\u059d", "\u059e", "\u059f", "\u05a0", "\u05a1", "\u05a2", "\u05a3", "\u05a4", "\u05a5", "\u05a6", "\u05a7", "\u05a8", "\u05a9", "\u05aa", "\u05ab", "\u05ac", "\u05ad", "\u05ae", "\u05af", "\u05bd", "\u05bf", "\u05c0", "\u05c4", "\u05c5"]
  # Maqaf: a learner may type it, a hyphen or a space. Qamats qatan and holam haser for vav, where an
  # edition or a keyboard has them, are the qamets and holem the course writes.
  - map: { "\u05be": " ", "-": " ", "\u05c7": "\u05b8", "\u05ba": "\u05b9" }
  - punctuation: strip
  - whitespace: collapse
match:
  case: none
  # The points (vowels, shewa, dagesh, shin and sin dots) are not letters: an answer is graded by its consonants,
  # with or without points. They are also what "Show vowel marks" hides and what a vocalize card asks for.
  marks: { set: "[\u05b0-\u05b9\u05bb\u05bc\u05c1\u05c2]", policy: ignore }
  typo:
    model: keyboard
    layout: cldr-kbd:he
    maxRatio: 0.2
    # REVIEW (erratum 46, ADR 0066): endings and pronouns a letter apart that mean different things. A slip that
    # trades one for another at the end of a word (סוסו for סוסי, הוא for היא) is WRONG_WORD, not a typo.
    # Members compare without points. Suffixes (Joüon-Muraoka § 61, 94, P1): -î my, -ḵā/-ēḵ your (also plene -ḵâ),
    # -ô/-hû his, -āh her, -ēnû our, -ḵem your (pl.), -hem/-ām their. Perfect endings (§ 42), on perfects only
    # (ADR 0084): none he, -â she, -tā/-t you (2ms and 2fs are one unpointed: ת, תה), -tî I, -û they, -tem/-ten you
    # (pl.), -nû we. אתה/את stay one member: apart, a plene 2ms perfect (קראתה) would read as the pronoun.
    contrasts:
      - { id: pronoun, note: contrast-pronoun, members: [[אני, אנכי], [אתה, את], הוא, היא, [אנחנו, נחנו], אתם, [הם, המה], [הן, הנה]] }
      # The forms it is asked of: the perfect, and the perfect after vav (weqatal, Tense Fut).
      - { id: person, note: contrast-person,
          forms: [{ feats: { Aspect: Perf, VerbForm: Fin } }, { feats: { Tense: Fut, VerbForm: Fin } }],
          members: ["", ה, [ת, תה], תי, ו, תם, תן, נו] }
      - { id: suffix, note: contrast-possessive, members: [י, [ך, כה], [ו, הו], ה, נו, כם, [הם, ם]] }
      # REVIEW (ADR 0084): a verb's person prefix (Joüon-Muraoka § 44, P2), on verbs only (a noun's first letter stays
      # a typo): א I, ת you/she, י he/they, נ we, after ו (wayyiqtol, weqatal). No prefix (the perfect, imperative,
      # infinitive) and the ה of hiphil and hithpael perfects and imperatives are members too: ילך for נלך, יגיד for
      # הגיד, שמר for ישמר change the sentence. Participles are out (their מ/נ is the stem's).
      - { id: verb-prefix, note: contrast-prefix, at: start, after: [ו],
          forms: [{ feats: { VerbForm: "Fin,Inf,InfAbs" } }],
          members: [א, ת, י, נ, "", ה] }
      # REVIEW (ADR 0084): the prefix conjugation's endings (§ 44d-f): none, -î (you, to a woman), -û (they, you
      # pl.), -nâ (they f., you f. pl.), with paragogic -ûn/-în and -n for -nâ as the same member. The cohortative and
      # long imperative -â is no member: it changes no person.
      # The forms it is asked of: the imperfect with the jussive and the cohortative (Aspect Imp), the
      # wayyiqtol (Tense Past) and the imperative.
      - { id: verb-ending, note: contrast-person,
          forms: [{ feats: { Aspect: Imp, VerbForm: Fin } }, { feats: { Tense: Past, VerbForm: Fin } }, { feats: { Mood: Imp } }],
          members: ["", [י, ין], [ו, ון], [נה, ן]] }
      # REVIEW (ADR 0084): agreement and number (§ 89-90): none, the feminine -â/-eṯ (one member: a participle takes
      # either), the plurals -îm and -ôṯ, on words whose sense the course pins as feminine, participle or plural.
      # The forms it is asked of: a feminine or a plural of a noun, an adjective, a pronoun or a demonstrative
      # (never a verb's feminine or plural, whose endings are the person's), and a participle.
      - { id: agreement, note: contrast-ending,
          forms: [{ pos: [NOUN, PROPN, ADJ, PRON, DET, NUM], feats: { Gender: Fem } }, { pos: [NOUN, PROPN, ADJ, PRON, DET, NUM], feats: { Number: Plur } }, { feats: { VerbForm: Part } }],
          members: ["", [ה, ת], ים, ות] }
# REVIEW (ADR 0148): a word's sound is the Tiberian reading its token pins (SBL transliteration), and the tiberian
# scheme's relation says how the consonantal text writes it (profiles/schemes/tiberian.yaml: each consonant its
# letter, full and defective spellings free, the points passed over). So a typed spelling that relates to the
# expected word's reading is the same sound (an accepted variant where it differs only by a mater); one that does not
# (ס for ש read ś, ת for ט, כ for ק, א for ע: other sounds in the Tiberian reading, whatever later traditions merge) is
# another sound. A word with no pinned reading is not asked.
sound: { from: reading, scheme: tiberian }
# REVIEW: the profile's own losses are the points, which are its marks policy (`match.marks`, ignored in answers) and
# its vocalize and vocalize-build cards, not correspondences. No stress: the reading carries it (its acute), and no
# written mark does that a rule places otherwise.
correspondences: []
# REVIEW (docs/rules/hbo.md): how the orthography writes a lexical form (lexicons/hbo/language.yaml, `notation`), read by
# @nabu/core `spell` in the compiler only (never shipped): its letters, the points left out, as grading keys a typed
# answer; the pointed text is its vocalized layer's (below).
spell:
  from: lexical
  rules:
    # A long vowel written with or without its vowel letter, free, and the 2ms -tā as -tâ (as the vocalized layer, below).
    - {find: "ו\u05B9", after: "[א-ת][\u05BC\u05C1\u05C2]*", to: "ו\u05B9", alternatives: [{id: defective, to: "\u05B9"}]}
    - {find: "\u05B9", after: "[א-הז-ת][\u05BC\u05C1\u05C2]*", to: "\u05B9", alternatives: [{id: plene, to: "ו\u05B9"}]}
    - {find: "ו\u05BC", after: "[א-ת][\u05BC\u05C1\u05C2]*", to: "ו\u05BC", alternatives: [{id: defective, to: "\u05BB"}]}
    - {find: "\u05BB", after: "[א-ת][\u05BC\u05C1\u05C2]*", to: "\u05BB", alternatives: [{id: plene, to: "ו\u05BC"}]}
    - {find: "\u05B4י", before: "[א-ת]|$", to: "\u05B4י", alternatives: [{id: defective, to: "\u05B4"}]}
    - {find: "\u05B4", after: "[א-ת][\u05BC\u05C1\u05C2]*", before: "[א-טך-ת]", to: "\u05B4", alternatives: [{id: plene, to: "\u05B4י"}]}
    - {find: "ת\u05BC\u05B8", before: "$", to: "ת\u05BC\u05B8", alternatives: [{id: plene-ta, to: "ת\u05BC\u05B8ה"}]}
    - {find: "[\u05B0-\u05BC\u05C1\u05C2\u0640]", to: ""}
    # A final letter where a letter follows (a suffix joined), a medial one at a word's end.
    - {find: "[ךםןףץ]", before: "[\u05B0-\u05C2]*[א-ת]", map: {ך: כ, ם: מ, ן: נ, ף: פ, ץ: צ}}
    - {find: "[כמנפצ]", after: "[א-ת][\u05B0-\u05C2]*", before: "[\u05B0-\u05C2]*$", map: {כ: ך, מ: ם, נ: ן, פ: ף, צ: ץ}}
annotations:
  # REVIEW (docs/rules/hbo.md): the pointed text, as the course writes it (the Westminster Leningrad Codex: no
  # accents, no meteg). The notation leaves to it a word's final letter forms, the shewa under a final kaf and under the
  # last letter of a final cluster, the furtive patah (JM § 21c), and the dagesh lene of a begadkefat that begins a
  # word (JM § 19): left out after a word that ends in a vowel and is joined to it, which the text says and the word
  # does not (`spirant`, free). Two more variations of the text, not of the word: a first letter doubled after such a
  # word (dagesh forte conjunctive, JM § 18i: מַה־זֶּה, `dagesh-conjunctive`), and וָ before a stressed syllable, in
  # pairs and at pause (JM § 104c-d: יוֹם וָלַיְלָה, `waw-before-stress`).
  - id: vocalized
    kind: vocalization
    toggle: true
    default: "on"   # quoted: YAML 1.1 reads bare on as true
    spell:
      from: lexical
      sets: {NB: "[זטילמנסצקש]", GF: "[חע]", CL: "[ב-ת]"}
      rules:
        # A final letter where a letter follows (a suffix joined), a medial one at a word's end.
        - {find: "[ךםןףץ]", before: "[\u05B0-\u05C2]*[א-ת]", map: {ך: כ, ם: מ, ן: נ, ף: פ, ץ: צ}}
        - {find: "[כמנפצ]", after: "[א-ת][\u05B0-\u05C2]*", before: "[\u05B0-\u05C2]*$", map: {כ: ך, מ: ם, נ: ן, פ: ף, צ: ץ}}
        # The carrier is never written.
        - {find: "\u0640", to: ""}
        # A long vowel written with or without its vowel letter, free (JM § 7; the tiberian scheme's full and defective
        # spellings): holem with or without vav, shureq or qibbuts, hiriq with or without yod; and the 2ms -tā as -tâ (JM § 42f).
        - {find: "ו\u05B9", after: "[א-ת][\u05BC\u05C1\u05C2]*", to: "ו\u05B9", alternatives: [{id: defective, to: "\u05B9"}]}
        - {find: "\u05B9", after: "[א-הז-ת][\u05BC\u05C1\u05C2]*", to: "\u05B9", alternatives: [{id: plene, to: "ו\u05B9"}]}
        - {find: "ו\u05BC", after: "[א-ת][\u05BC\u05C1\u05C2]*", to: "ו\u05BC", alternatives: [{id: defective, to: "\u05BB"}]}
        - {find: "\u05BB", after: "[א-ת][\u05BC\u05C1\u05C2]*", to: "\u05BB", alternatives: [{id: plene, to: "ו\u05BC"}]}
        - {find: "\u05B4י", before: "[א-ת]|$", to: "\u05B4י", alternatives: [{id: defective, to: "\u05B4"}]}
        - {find: "\u05B4", after: "[א-ת][\u05BC\u05C1\u05C2]*", before: "[א-טך-ת]", to: "\u05B4", alternatives: [{id: plene, to: "\u05B4י"}]}
        - {find: "ת\u05BC\u05B8", before: "$", to: "ת\u05BC\u05B8", alternatives: [{id: plene-ta, to: "ת\u05BC\u05B8ה"}]}
        # A final kaf with no vowel takes the shewa (חֹשֶׁךְ); so does the last letter of a final cluster (אַתְּ, שָׁמַרְתְּ).
        - {find: "ך", before: "\u05BC?$", to: "ך\u05B0"}
        - {find: "{CL}", after: "\u05B0", before: "\u05BC?$", to: "{CL}\u05B0"}
        # The furtive patah: a final ח or ע after a long vowel (רוּחַ, שֹׁמֵעַ, הוֹשִׁיעַ).
        - {find: "{GF}", after: "[\u05B4\u05B5\u05B9\u05BB]|ו\u05BC|[\u05B4\u05B5]י", before: "$", to: "{GF}\u05B7"}
        # A word's first begadkefat: its dagesh lene, or none after a word ending in a vowel.
        - {find: "{BGD}", at: start, before: "[\u05B0-\u05BB]|ו", to: "{BGD}\u05BC", alternatives: [{id: spirant, to: "{BGD}"}]}
        - {find: "{NB}", at: start, before: "[\u05B0-\u05BB\u05C1\u05C2]|ו", to: "{NB}", alternatives: [{id: dagesh-conjunctive, to: "{NB}\u05BC"}]}
        - {find: "ו\u05B0", at: start, to: "ו\u05B0", alternatives: [{id: waw-before-stress, to: "ו\u05B8"}]}
        - {find: "ו\u05BC", at: start, before: "[א-ת]", to: "ו\u05BC", alternatives: [{id: waw-before-stress, to: "ו\u05B8"}]}
input:
  keyboard: cldr-kbd:he
  # Its vowel marks put on a word's letters from buttons, once a choice card has shown them (ADR 0137).
  markBuilder: true
layout: { vertical: none }
# Pointed text is set in a serif face (Noto Serif Hebrew, OFL-1.1) a fifth larger than the text around it:
# the points under the letters are small at the size of Latin text, and need the extra line height.
fonts: { stack: [Noto Serif Hebrew], lineHeight: 2.1, scale: 1.2 }
