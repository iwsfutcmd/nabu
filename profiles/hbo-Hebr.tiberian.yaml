# Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
# Biblical Hebrew in Hebrew script with the Tiberian pointing (ADR 0081). Content is written pointed,
# as the Masoretic text is (vowels, dagesh, shin and sin dots, maqaf, sof pasuq), without the
# cantillation accents or meteg. "Vowel marks" off shows the consonantal text alone, as a scroll has it.
# Learners type unpointed Hebrew; any points they do type are ignored, like Arabic harakat.
id: hbo-Hebr/tiberian
lang: hbo-Hebr
exemplars: cldr:he
# REVIEW: what CLDR 49's (Modern) Hebrew exemplars lack for the Masoretic text: sof pasuq, the verse end.
exemplarsExtra: ["׃"]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  - map: { "־": " " }               # maqaf: a learner may type it, a hyphen or a space
  - punctuation: strip
  - whitespace: collapse
match:
  case: none
  # Points (vowels, shewa, dagesh, shin and sin dots, rafe) and cantillation are not letters: an answer is graded
  # by its consonants, with or without points.
  marks: { set: "[֑-ׇֽֿׁׂׅׄ]", policy: ignore }
  typo:
    model: keyboard
    layout: cldr-kbd:he
    maxRatio: 0.2
    # REVIEW (erratum 46, ADR 0066): endings and pronouns a letter apart that mean different things. A slip that
    # trades one for another at the end of a word (סוסו for סוסי, הוא for היא) is WRONG_WORD, not a typo.
    # Members compare without points. Suffixes: -î my, -ḵā/-ēḵ your, -ô his, -āh her, -ēnû our, -ḵem your (pl.),
    # -hem/-ām their. Perfect endings: -tî I, -tā/-t you, -â she, -û they, -nû we, -tem you (pl.).
    contrasts:
      - { id: pronoun, note: contrast-pronoun, members: [[אני, אנכי], [אתה, את], הוא, היא, [אנחנו, נחנו], אתם, [הם, המה], [הן, הנה]] }
      - { id: suffix, note: contrast-possessive, members: [י, ך, ו, ה, נו, כם, [הם, ם]] }
      - { id: person, note: contrast-person, members: [תי, [ת, תה], נו, תם] }
annotations:
  - { id: vocalized, kind: vocalization, toggle: true, default: "on" }   # quoted: YAML 1.1 reads bare on as true
input:
  keyboard: cldr-kbd:he
layout: { vertical: none }
# Pointed text is set in a serif face (Noto Serif Hebrew, OFL-1.1) a fifth larger than the text around it:
# the points under the letters are small at the size of Latin text, and need the extra line height.
fonts: { stack: [Noto Serif Hebrew], lineHeight: 2.1, scale: 1.2 }
