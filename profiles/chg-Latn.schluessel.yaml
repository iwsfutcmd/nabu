# Chaghatay in the transliteration of Schluessel, An Introduction to Chaghatay (2018), xii-xxxii (ADR 0128). Not an
# orthography a learner can pick: the chg course shows it as ruby over its Arabic words (the reading scheme
# `schluessel`), and this profile tags and grades the Latin side of the alphabet track's letter and word cards (the
# chg-Arab profile's `romanize`). A modified IJMES system, one letter for each letter or sound, that writes the
# vowels the Arabic script leaves out:
#  - consonants b p ṗ (ف for p) t s̱ (ث) j č ḥ ḫ d ź (ذ) r z ž s š ṣ ż (ض) ṭ ẓ ʿ ǧ (غ) f q k g ŋ l m n w h y, ʾ;
#  - vowels a ä e i o ö u ü (every [i] is i, Turkic words have no length), ā ī ū in Arabic and Persian words,
#    à for alef maksura (Mūsà);
#  - a reading, not letter for letter: Babur's سیکیز is säkkiz, بادشاه pādišāh.
#  - Capitals begin sentences and names; Latin punctuation; the ezafe after a hyphen (tārīḫ-i).
# Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
#  - A vowel's marks (ä ö ü, ā ī ū ē, à) left out or misplaced make the word wrong (ADR 0134): the vowels are what the
#    Arabic leaves out, so they are what a reading card asks. So do the marks of š, ž, ḫ and ǧ (kisi for kiši, taǧ for
#    tag; the owner, 2026-11-20, ADR 0148): without the mark they are s, z, h and g, other sounds and other Arabic
#    letters. The other consonants' marks (hujra for ḥujra, sultān for sulṭān, c for č) are accepted with a note: the
#    marked letter sounds as its plain one does, and č has no plain letter to be taken for. An answer that spells
#    another word of the course (bardi "went" for bärdi "gave") is WRONG_WORD either way.
#  - ŋ and the half rings ʿ and ʾ are letters, not marks: an n for ŋ is a typo at best.
id: chg-Latn/schluessel
lang: chg-Latn
exemplars: cldr:en
# REVIEW: what Schluessel's letters need beyond English's (ä ö ü ā ī ū à are in its auxiliary set): č š ž ǧ ŋ,
# the dotted and underdotted letters, ź, the macron below of s̱ (U+0331), and the half rings for ʿayn and hamza.
exemplarsExtra: ["č", "š", "ž", "ǧ", "ŋ", "ḥ", "ḫ", "ṭ", "ṣ", "ẓ", "ż", "ź", "ṗ", "\u0331", "ʿ", "ʾ"]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  # An apostrophe typed for ʿayn's half ring (’ ' `). The ‘ of an elided Arabic article (Abū ‘l-Ǧāzī) is punctuation.
  - map: { "\u2019": "\u02BF", "'": "\u02BF", "`": "\u02BF" }
  - punctuation: strip
  - whitespace: collapse
match:
  case: { locale: chg }
  # REVIEW: the marks of Schluessel's letters (diaeresis, macron, caron, dots above and below, the breve below of ḫ,
  # acute, grave, the macron below). A vowel's (diaeresis, macron, grave) are `required` (ADR 0134): the vowels are
  # the reading the script leaves out, as the choice cards' wrong options trade them. A consonant's are noted, not
  # failed, unless they make another word, but for `requiredLetters`.
  # REVIEW (the owner's ruling, 2026-11-20; the split is Claude's reading of Schluessel's table of letters, xi-xxxii):
  # š, ž, ḫ and ǧ are sounds of their own (ش ژ خ غ), so their marks are required too. ṣ, s̱, ḥ, ṭ, ẓ, ż, ź and ṗ name
  # another Arabic letter for the same sound, and č has no plain c: those stay noted.
  marks: { set: "[\u0300\u0301\u0304\u0307\u0308\u030C\u0323\u032E\u0331]", policy: accept-with-note, note: translit-marks, distinguishes: true, wordNote: translit-marks-word,
           required: "[\u0300\u0304\u0308]", requiredNote: translit-vowels,
           requiredLetters: "[šžḫǧ]", requiredLettersNote: translit-sounds }
  equivalences:
    # REVIEW: ng typed for ŋ (Schluessel, xxv: ŋ is n + k in the script), and the hamza's half ring for ʿayn's.
    - { id: ng, map: { "ng": "ŋ" }, policy: accept-with-note, note: translit-marks }
    - { id: half-rings, map: { "\u02BE": "\u02BF" }, policy: accept }
  typo:
    model: keyboard
    layout: cldr-kbd:en
    maxRatio: 0.2
    # REVIEW (ADR 0066): endings one or two letters apart that change the meaning, compared without marks. A slip
    # that trades one for another at the end of a word (kördüm for kördi, öydä for öydin) is WRONG_WORD, not a typo.
    # A list groups the spellings of one ending (by harmony: -ǧa -gä -qa -kä; after a vowel: -m, -im).
    contrasts:
      - { id: person, note: contrast-person, members: [män, sän, siz, miz, sizlär, [lar, lär]] }
      - { id: past, note: contrast-person, members: [[dim, dum, düm, tim, tum, tüm], [diŋ, duŋ, düŋ, tiŋ, tuŋ, tüŋ], [diŋiz, tiŋiz], [di, ti], [duq, dük, tuq, tük], [dilär, dilar, tilär, tilar]] }
      - { id: possessive, note: contrast-possessive, members: [[im, um, üm, m], [iŋ, uŋ, üŋ, ŋ], [i, si], [imiz, umiz, ümiz, miz], [iŋiz, uŋiz, üŋiz, ŋiz]] }
      - { id: case, note: contrast-case, members: [ni, niŋ, [ǧa, gä, qa, kä], [da, dä, ta, tä], [din, tin, dan, dän]] }
      - { id: pronoun, note: contrast-pronoun, members: [män, sän, siz, biz, sizlär, [ular, alar]] }
# What the transliteration writes of the sound (ADR 0148). REVIEW: one letter for each letter or sound, so the
# sound is read off the spelling and nothing is lost: every letter says itself, and a wrong letter is another
# sound. The marks are matching policy, not correspondences: the vowels' and š ž ḫ ǧ's `required` (another sound),
# the rest noted (ṣ s̱ ḥ ṭ ẓ ż ź ṗ name another Arabic letter for the sound of their plain one, and the policy
# already accepts the plain letter with a note; stating them here as fixed would make a typed s for ṣ beside another
# slip an orthographic miss, stricter than ADR 0134's note). ng for ŋ is an equivalence.
sound: { from: spelling }
correspondences: []
input:
  keyboard: cldr-kbd:en
  extraKeys: ["ä", "ö", "ü", "ā", "ī", "ū", "č", "š", "ž", "ǧ", "ḫ", "ŋ", "ḥ", "ṭ", "ṣ", "ẓ", "ż", "ź", "ṗ", "ʿ"]
layout: { vertical: none }
