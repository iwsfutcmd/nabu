# profiles/lzh-Hant.standard.yaml
# Classical (Literary) Chinese in Traditional characters (ADR 0071). A written language: the course
# practises reading and writing its characters, never their sounds. Readings are three ruby layers, three
# reading traditions: the learner shows one or none, and reading cards ask the one they last chose, each
# with its own progress (ADR 0138). Over new words only, a layer shows where the learner has not yet read
# the word in that tradition.
id: lzh-Hant/standard
lang: lzh-Hant
exemplars: cldr:zh_Hant
# REVIEW: classical function words and the classics' vocabulary that CLDR 49's zh_Hant sets lack.
# These are gaps to report upstream (docs/gameplan-errata.md), not a wider audit.
exemplarsExtra: [焉, 歟, 孰, 奚, 罔, 慍, 誨, 殆, 踰, 矩, 濠, 鯈, 遽, 墜, 耕, 株, 冀, 耒, 鬻, 叟, 啼]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  - fold-width: { ascii: half, punctuation: full }
  - whitespace: remove                 # spaces carry no meaning
  - punctuation: strip                 # editors punctuate the classics differently
match:
  # 爲 for 為, 説 for 說: older and regional forms of the same character are right, with a note.
  variants:       { table: hk-tw-variants, policy: accept-with-note, note: variant-form }
  scriptMismatch: { detect: Hans, table: hans-only, policy: reject-with-note, note: use-traditional }
# REVIEW (ADR 0148): no `sound`. A written language whose sound the course never asks (ADR 0071): each character's
# readings are listed per character in three traditions (the pinyin, jyutping and baxter schemes, which state what
# the characters leave out of them), never a rule of the script. Character variants stay the matching policy above.
# Nothing is stated as lost.
correspondences: []
annotations:
  - { id: pinyin, kind: reading, scheme: pinyin, lang: zh-Latn-pinyin, toggle: true, default: "off", render: ruby, fade: by-facet }
  - { id: jyutping, kind: reading, scheme: jyutping, lang: yue-Latn-jyutping, toggle: true, default: "off", render: ruby, fade: by-facet }
  - { id: baxter, kind: reading, scheme: baxter, lang: ltc-Latn-x-baxter, toggle: true, default: "off", render: ruby, fade: by-facet }
input:
  ime: [os]
layout: { vertical: vertical-rl, verticalScope: [prompt, reading, wordbank] }
# The classics are set in a Ming (Song) face: Noto Serif CJK, Traditional Chinese, a quarter larger
# than the text around them (characters at the size of Latin text are hard to read).
fonts: { stack: [Noto Serif TC, Noto Serif CJK TC, Noto Sans HK], lineHeight: 1.7, scale: 1.25 }
# How the characters write a lexical form (docs/rules/lzh.md): as it is. A form is the word in its characters, so the
# statement has no rules; the compiler checks every lexeme's form and every token against it (`form.projection`,
# `form.unaccounted`).
spell: { from: lexical, rules: [] }
