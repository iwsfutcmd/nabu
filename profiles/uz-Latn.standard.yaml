# profiles/uz-Latn.standard.yaml
# From gameplan §6.3 with two fixes (docs/adr/0016).
#  - The apostrophe map also covers capital O and G. In §6.3 only lowercase o/g were listed,
#    so "O'zbekiston" fell through to the second map and became O + U+02BC (tutuq belgisi).
#  - letters includes U+02BC (tutuq belgisi), which the 1995 alphabet lists as a sign.
id: uz-Latn/standard
lang: uz-Latn
exemplars: cldr:uz                     # check how CLDR spells oʻ/gʻ in the exemplars and follow it
letters: [a, b, d, e, f, g, "g\u02BB", h, i, j, k, l, m, n, ng, o, "o\u02BB", p, q, r, s, sh, t, u, v, x, y, z, ch, "\u02BC"]
segmentation: { content: hand-pinned, runtime: grapheme }   # morphology pinned in source, see below
normalize:
  - nfc
  - map:                               # every apostrophe learners actually type → the canonical letters
      { "o\u2018": "o\u02BB", "o'": "o\u02BB", "o`": "o\u02BB", "o\u2019": "o\u02BB",
        "g\u2018": "g\u02BB", "g'": "g\u02BB", "g`": "g\u02BB", "g\u2019": "g\u02BB",
        "O\u2018": "O\u02BB", "O'": "O\u02BB", "O`": "O\u02BB", "O\u2019": "O\u02BB",
        "G\u2018": "G\u02BB", "G'": "G\u02BB", "G`": "G\u02BB", "G\u2019": "G\u02BB" }
  - map: { "\u2019": "\u02BC", "'": "\u02BC" }              # remaining apostrophes → tutuq belgisi
  - punctuation: strip                 # never strips U+02BB/U+02BC: they are letters (gc=Lm), not punctuation
  - whitespace: collapse               # Phase 1: missing in §6.3 (docs/gameplan-errata.md)
match:
  case: { locale: uz }
  apostrophe: { policy: accept-with-note, note: apostrophe }   # typed ASCII ' is fine, but tell them
  typo:
    model: keyboard
    unit: letters                      # distance over profile letters, not graphemes
    layout: cldr-kbd:uz
    maxRatio: 0.2
    # REVIEW (erratum 46): endings one or two letters apart that change the meaning. A slip that trades one for
    # another at the end of a word (talabasan for talabaman, kitobing for kitobim) is WRONG_WORD, not a typo. A list
    # groups the spellings of one ending: after a consonant or a vowel (im, m), or by the last sound (ga, ka, qa).
    contrasts:
      - { id: person, note: contrast-person, members: [man, san, dir, miz, siz, lar] }
      - { id: possessive, note: contrast-possessive, members: [[im, m], [ing, ng], [i, si], [imiz, miz], [ingiz, ngiz], lari] }
      - { id: case, note: contrast-case, members: [ni, ning, [ga, ka, qa], [da, ta], [dan, tan]] }
      - { id: pronoun, note: contrast-pronoun, members: [men, sen, u, biz, siz, ular] }
input:
  extraKeys: ["\u02BB", "\u02BC"]
transliterate: { to: uz-Cyrl/standard, via: cldr-transform }       # powers script-convert exercises
# What the speech service scores (ADR 0116). REVIEW: per-language choices, to revisit with recorded learners.
# Whisper writes Uzbek in Latin letters (tier 1); eSpeak NG's uz reads the spelling for the expected phones (tier 2).
speech:
  tiers: [1, 2]
