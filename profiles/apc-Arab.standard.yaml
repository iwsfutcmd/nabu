# Phase 1 profile. Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
# Lebanese Arabic in Arabic script. There is no standard spelling (gameplan §6.3), so the folds that
# MSA notes are silent here, and accept sets stay wide. No CLDR locale exists for apc (ADR 0016),
# hence no `exemplars`. Content is tagged apc-Arab-LB.
id: apc-Arab/standard
lang: apc-Arab
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  - fold-compat: arabic-presentation-forms
  - remove: ["\u0640"]                 # tatweel
  - digits: { canonical: latn, accept: [arab, arabext, latn] }
  - punctuation: strip
  - whitespace: collapse
match:
  case: none
  marks: { set: "[\u064B-\u0652\u0670]", policy: ignore, optional: "[\u0652]" }
  # REVIEW: sukun is optional when a learner writes the vowel marks (ADR 0054); the drafts disagree on it.
  equivalences:
    - { id: persian-keyboard, map: { "\u06A9": "\u0643", "\u06CC": "\u064A" }, policy: accept }
    - { id: hamza-seat, map: { "\u0623": "\u0627", "\u0625": "\u0627", "\u0622": "\u0627", "\u0671": "\u0627" }, policy: accept }      # REVIEW: silent for an unstandardized variety
    - { id: alef-maqsura, map: { "\u0649": "\u064A" }, policy: accept }
    - { id: ta-marbuta, map: { "\u0629": "\u0647" }, policy: accept }
    - { id: loan-letters, map: { "\u06A4": "\u0641", "\u067E": "\u0628" }, policy: accept }   # REVIEW: ڤ/ف (v), پ/ب (p)
  typo:
    model: keyboard
    layout: cldr-kbd:ar
    maxRatio: 0.2
    # REVIEW (erratum 46): pronouns and possessive endings a letter apart. A slip that trades one for another at the
    # end of a word (وأنا for وإنت) is WRONG_WORD, not a typo. Members compare without vowel marks and with hamza
    # seats folded, as answers do, so إنت and إنتِ are one member: inte/inti differ in writing only as إنت/إنتي.
    # Pronouns: anā, inta, inti, huwwe, hiyye, naḥna, intu, hinne. Endings: -i, -ak/-ik, -o, -a, -na, -kon, -hon.
    contrasts:
      - { id: pronoun, note: contrast-pronoun, members: [أنا, إنت, إنتي, هو, هي, [نحنا, نحن], [إنتو, إنتوا], هني] }
      - { id: possessive, note: contrast-possessive, members: [ي, ك, ه, ها, نا, [كن, كم], [هن, هم]] }
      # REVIEW (ADR 0081): on words the course inflects (a noun's first letter stays a typo). A verb's prefix says who
      # and whether it is a plain statement (Kline ch. 13, 22): b- I, bt- you/she, bi- he, mn- we; without b- (the
      # imperfect) a- or nothing, t-, y-, n-. Trading one for another, or dropping b-, changes the sentence. After و.
      - { id: verb-prefix, note: contrast-prefix, at: start, after: [و], inflected: true,
          members: [ب, بت, بي, [من, بن], ت, ي, ن, [ا, ""]] }
      # REVIEW (ADR 0081): endings that agree, on inflected words: the feminine ة (بعيدة for بعيد), -i to a woman
      # (بتشتغلي), -o to several people (بتشتغلوا). No ending is a member: the masculine, the man addressed.
      - { id: agreement, note: contrast-ending, inflected: true, members: ["", ة, ي, [وا, و]] }
annotations:
  - { id: vocalized, kind: vocalization, toggle: true, default: "on" }   # quoted: YAML 1.1 reads bare on as true. Shadda and harakat where content has them (بدّي)
input:
  keyboard: cldr-kbd:ar
layout: { vertical: none }
fonts: { stack: [Noto Naskh Arabic], lineHeight: 1.9 }
