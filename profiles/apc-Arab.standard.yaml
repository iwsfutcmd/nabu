# Phase 1 profile. Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
# Lebanese Arabic in Arabic script. There is no standard spelling (gameplan §6.3), so the folds that
# MSA notes are silent here, and accept sets stay wide. No CLDR locale exists for apc (ADR 0016),
# hence no `exemplars`. Content is tagged apc-Arab-LB.
id: apc-Arab/standard
lang: apc-Arab
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  - fold-compat: arabic-presentation-forms
  - remove: ["\u0640"]                 # tatweel
  - digits: { canonical: latn, accept: [arab, arabext, latn] }
  - punctuation: strip
  - whitespace: collapse
match:
  case: none
  marks:
    set: "[\u064B-\u0652\u0670]"
    policy: ignore
    # REVIEW: sukun is optional when a learner writes the vowel marks (ADR 0054); the drafts disagree on it.
    optional: "[\u0652]"
    # REVIEW: so is a fatha before a plain alif or alif maqsura (ADR 0054 as amended): it spells the a the
    # alif writes anyway, and vocalized texts write it or not (مَرْحَبا, مَرْحَبَا). Any other mark there counts
    # (بِالبيت: bi- before the article's alif), and so does the fatha before a hamza's alif (أ).
    optionalBefore: [{ marks: "[\u064E]", letters: "[\u0627\u0649]" }]
    spelledIn: [apc-Latn/arabizi]
  # Arabizi writes the vowels these marks leave out: a vocalize card takes the word in Arabizi too (ADR 0095).
  equivalences:
    - { id: persian-keyboard, map: { "\u06A9": "\u0643", "\u06CC": "\u064A" }, policy: accept }
    - { id: hamza-seat, map: { "\u0623": "\u0627", "\u0625": "\u0627", "\u0622": "\u0627", "\u0671": "\u0627" }, policy: accept }      # REVIEW: silent for an unstandardized variety
    - { id: alef-maqsura, map: { "\u0649": "\u064A" }, policy: accept }
    - { id: ta-marbuta, map: { "\u0629": "\u0647" }, policy: accept }
    - { id: loan-letters, map: { "\u06A4": "\u0641", "\u067E": "\u0628" }, policy: accept }   # REVIEW: ڤ/ف (v), پ/ب (p)
  typo:
    model: keyboard
    layout: cldr-kbd:ar
    maxRatio: 0.2
    # REVIEW (erratum 46): pronouns and possessive endings a letter apart. A slip that trades one for another at the
    # end of a word (وأنا for وإنت) is WRONG_WORD, not a typo. Members compare without vowel marks and with hamza
    # seats folded, as answers do, so إنت and إنتِ are one member: inte/inti differ in writing only as إنت/إنتي.
    # Pronouns: anā, inta, inti, huwwe, hiyye, naḥna, intu, hinne. Endings: -i, -ak/-ik, -o, -a, -na, -kon, -hon.
    contrasts:
      - { id: pronoun, note: contrast-pronoun, members: [أنا, إنت, إنتي, هو, هي, [نحنا, نحن], [إنتو, إنتوا], هني] }
      - { id: possessive, note: contrast-possessive, members: [ي, ك, ه, ها, نا, [كن, كم], [هن, هم]] }
      # REVIEW (ADR 0081): on the course's verbs, by their forms (a noun's or an adjective's first letter stays a typo:
      # nouns pin their gender too, ADR 0132 amendment). A verb's prefix says who
      # and whether it is a plain statement (Kline ch. 13, 22): b- I, bt- you/she, bi- he, mn- we; without b- (the
      # imperfect) a- or nothing, t-, y-, n-. Trading one for another, or dropping b-, changes the sentence. After و.
      # The forms it is asked of: the b-present and the form after ra7 or baddi (both Aspect Imp), the past, and
      # a command to a woman or to several people. REVIEW: a command to one man, the verb's bare stem, is left
      # out, as it was while forms were pinned by hand and that one never was.
      - { id: verb-prefix, note: contrast-prefix, at: start, after: [و],
          forms: [{ feats: { Aspect: "Imp,Perf" } }, { feats: { Mood: Imp, Gender: Fem } }, { feats: { Mood: Imp, Number: Plur } }],
          members: [ب, بت, بي, [من, بن], ت, ي, ن, [ا, ""]] }
      # REVIEW (ADR 0081): endings that agree, on inflected words: the feminine ة (بعيدة for بعيد), -i to a woman
      # (بتشتغلي), -o to several people (بتشتغلوا). No ending is a member: the masculine, the man addressed.
      - { id: agreement, note: contrast-ending, inflected: true, members: ["", ة, ي, [وا, و]] }
# What the letters write of the sound (ADR 0148). REVIEW: the sound is read off the spelling, its vowel marks left
# aside (the unmarked spelling is the usual one, as fa's), and nothing is stated as lost: no correspondence a rule
# could state holds for every word of an unstandardized variety, so accept sets keep carrying spellings by hand.
# Considered and left out (REVIEW):
#  - ث ذ ظ ق: each said two ways by word (ث t or s, ذ d or z, ظ ḍ or ẓ, ق a glottal stop or q in learned words), so
#    no rule says them; and ء/ق/أ for the glottal stop likewise.
#  - -o written ـه (as Kline writes it) or ـو: a word-final ه also writes -a (ta marbuta folded to it), h (الله) and
#    a silent letter, and the damma before ـه that marks -o is a vowel mark the sound leaves aside: no context
#    states it safely. The accept sets carry ـو (بيتو beside بيته).
#  - ة/ه, ى/ي, the hamza seats, ڤ/ف and پ/ب: matching policies already (`equivalences`), never restated here.
#  - The article's l before a sun letter (الشاي ish-shay): written and not said, but written in every spelling.
sound: { from: spelling, ignores: "[ً-ْٰ]" }
correspondences: []
# How the course's Arabic spells a lexical form (docs/lexical-forms/apc.md, the projections' table; docs/rules-design.md,
# section 3): the letters, no marks (a shadda is the writer's choice), a loan's گ پ ڤ as ك ب ف. Checked against each
# lexeme's first spelling by the compiler (`form.projection`, `nabu forms`). REVIEW.
spell:
  from: lexical
  rules:
    - {find: "[\u064B-\u0652\u065C\u065D\u06DF]", to: ""}
    - {find: "[گپڤ]", map: {"گ": "ك", "پ": "ب", "ڤ": "ف"}}
annotations:
  # quoted: YAML 1.1 reads bare on as true. Shadda and harakat where content has them (بدّي)
  - id: vocalized
    kind: vocalization
    toggle: true
    default: "on"
    # The marked text the voices read, from a lexical form (docs/lexical-forms/apc.md, the projections' table): what
    # courses/apc/vocalization.yaml has for the word, where the course follows its conventions. REVIEW.
    spell:
      from: lexical
      sets:
        T: "[ءأ-ئبث-غف-ويپڤگ]"   # a consonant, not ت
      rules:
        # The helping vowel (docs/lexical-forms/apc.md; the owner, 2026-11-21): a word that ends in two consonants says a
        # vowel between them, a kasra, or a damma after a short u or o (not before the past's -t). Not in a doubled letter,
        # not after a glide, not after a consonant with no vowel. Inside a word it is not written yet (the form does not say
        # where an ending begins).
        - {find: "\u0652", after: "[\u064F\u065D]{N}", before: "{T}({L}\u06DF)*$", to: "\u064F"}
        - {find: "\u0652", after: "({V}|[اىيو]){N}", before: "{C}({L}\u06DF)*$", to: "\u0650"}
        # The vowel of their (-on, a silent ه): on the ه, with a sukun before it (بيتْهُن).
        - {find: "[\u064F\u065D]ه\u06DF", before: "{C}", to: "\u0652ه\u064F"}
        # No sukun on the article's lam.
        - {find: "\u0652", after: "^ا\u06DFل", to: ""}
        - {find: "آ\u065C", to: "آ"}
        # The fathatan after its alef seat (شُكْراً).
        - {find: "\u064Bا", to: "ا\u064B"}
        # A consonant before its length letter carries no sign: long e and o are not told from long a, i and u.
        - {find: "[\u064E\u065C]", before: "({L}\u06DF)*ا", to: ""}
        - {find: "\u064E", before: "({L}\u06DF)*ى", to: ""}
        - {find: "[\u0650\u065C]", before: "({L}\u06DF)*ي({L}|$)", to: ""}
        - {find: "[\u064F\u065D]", before: "({L}\u06DF)*و({L}|$)", to: ""}
        - {find: "ة\u0652", to: "ة"}
        # U+065C is written as a kasra (U+065D is long o only: its sign goes before its و); a silent letter bare; a loan's
        # letters as the course writes them.
        - {find: "\u065C", to: "\u0650"}
        - {find: "\u06DF", to: ""}
        - {find: "[گپڤ]", map: {"گ": "ك", "پ": "ب", "ڤ": "ف"}}
input:
  keyboard: cldr-kbd:ar
  # Its vowel marks put on a word's letters from buttons, once a choice card has shown them (ADR 0137).
  markBuilder: true
layout: { vertical: none }
fonts: { stack: [Noto Naskh Arabic], lineHeight: 1.9 }
# What the speech service scores (ADR 0116). REVIEW: per-language choices, to revisit with recorded learners.
# Whisper has no Lebanese Arabic and hears it as Arabic, its macrolanguage, written in Arabic script: the words (tier 1).
# Not the phones: eSpeak NG's Arabic says Standard Arabic, not Lebanese.
speech:
  tiers: [1]
