# profiles/yue-Hant-HK.standard.yaml
# From gameplan §6.3. Phase 1: tables named explicitly (profiles/tables/), feedback notes named.
id: yue-Hant-HK/standard
lang: yue-Hant-HK
exemplars: cldr:yue_Hant
# REVIEW: CLDR 49 yue_Hant main exemplars are the zh_Hant set and lack everyday Cantonese
# characters. These are gaps to report upstream (docs/gameplan-errata.md), not a wider audit.
exemplarsExtra: [佢, 哋, 嘅, 咗, 嘢, 冇, 咩, 啲, 嚟, 喺, 噉, 乜, 嗰, 啱, 搵, 睇, 攰, 冧, 嘥, 喎, 嘞, 嗮, 咁, 揸, 瞓, 嬲, 靚, 餸, 嘈, 𨋢]
segmentation: { content: pycantonese, runtime: grapheme }
normalize:
  - nfc
  - fold-width: { ascii: half, punctuation: full }
  - whitespace: remove                 # spaces carry no meaning
  - punctuation: strip
match:
  variants:       { table: hk-tw-variants, policy: accept-with-note, note: hk-tw-variant }   # per-course policy
  scriptMismatch: { detect: Hans, table: hans-only, policy: reject-with-note, note: use-traditional }
  homophones:     { model: jyutping-ime, table: jyutping-ime, policy: partial-credit }   # IME slip, §8.4
  typo:           { model: ime-homophone }
annotations:
  - { id: jyutping, kind: reading, scheme: jyutping, toggle: true, render: ruby, fade: by-facet }
input:
  ime: [os, rime-wasm:jyutping]
layout: { vertical: vertical-rl, verticalScope: [prompt, reading, wordbank] }
strokeOrder: { target: hk, interim: tw, label: true }   # §6.9: TW order until HK data exists; always labeled
fonts: { stack: [Noto Sans HK, Noto Sans CJK HK], lineHeight: 1.6 }
# What the speech service scores (ADR 0116). REVIEW: per-language choices, to revisit with recorded learners.
# Whisper's own writes Cantonese as written Mandarin: a fine-tune (Apache-2.0) hears it, learners and the round trip of
# the clips alike (ADR 0094). Expected phones come from the pinned Jyutping.
speech:
  tiers: [1, 2]
  recognizer:
    fineTuned: { model: alvanlii/whisper-small-cantonese@b03a4e5d482f06858ce10ebbabebabec9f447a0d, token: zh }
  phones: { reading: jyutping }
# The Jyutping orthography is written from these characters' pinned readings (`nabu jyutping`, ADR 0126); the
# compiler checks each sentence's agrees.
transliterate: { to: yue-Latn/jyutping, via: jyutping }
