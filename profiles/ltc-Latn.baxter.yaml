# profiles/ltc-Latn.baxter.yaml
# Baxter's ASCII transcription of Middle Chinese as the answer of a reading card (ADR 0138), as Baxter &
# Sagart (2014) write it. Case is folded: his tone letters X and H come only at a syllable's end, where
# none of his lowercase letters does. A word's syllables typed together or apart compare alike. No typo
# leeway: a letter off is another reading.
id: ltc-Latn/baxter
lang: ltc-Latn
exemplars: cldr:en
exemplarsExtra: ["'", "+"]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  # An apostrophe typed for his glottal stop (’ or ').
  - map: { "\u2019": "'" }
  - whitespace: remove
match:
  case: { locale: en }
# REVIEW (ADR 0148): no `sound`, though Baxter's transcription writes each of his Middle Chinese categories one way (his
# ASCII, tone letters X and H at a syllable's end), so nothing is lost. A transcription of categories rather than of
# sounds, and graded letter by letter (the whitespace is removed): the sound question asked of one letter is no
# question of the word (stated, kanH for kenH was labelled lexical where it is another reading). A letter off stays
# wrong, as before (no typo leeway, above). Nothing is stated as lost.
correspondences: []
input:
  keyboard: cldr-kbd:en
  extraKeys: ["'", "+"]
layout: { vertical: none }
