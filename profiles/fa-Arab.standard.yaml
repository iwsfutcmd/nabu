# profiles/fa-Arab.standard.yaml
# From gameplan §6.3. Phase 1: typo minimum length set; otherwise as written.
id: fa-Arab/standard
lang: fa-Arab
exemplars: cldr:fa                     # main/auxiliary/punctuation/numbers exemplars drive lints (§7.5)
segmentation: { content: hazm, runtime: grapheme }
normalize:                             # applied identically to learner answers and to accept sets
  - nfc
  - fold-compat: arabic-presentation-forms         # U+FB50–U+FDFF, U+FE70–U+FEFF → base letters
  - map: { "\u0643": "\u06A9", "\u064A": "\u06CC", "\u0649": "\u06CC", "\u06C0": "\u0647\u0654" }  # Arabic kaf/yeh → keheh/Farsi yeh; ۀ → ه + hamza above (the ezafe after a silent -e, as many keyboards type it)
  - remove: ["\u0640"]                    # tatweel
  - digits: { canonical: latn, accept: [arabext, arab, latn] }
  - punctuation: strip
  - whitespace: collapse
match:
  marks: { set: "[\u064B-\u0652\u0670]", policy: ignore, optional: "[\u0652]" }   # harakat optional in answers
  # REVIEW: sukun is optional when a learner writes the vowel marks (ADR 0054); the drafts disagree on it.
  zwnj:  { equivalents: ["\u200C", " ", ""], policy: accept-with-note, note: spacing }
  case:  none
  typo:
    model: keyboard
    layout: cldr-kbd:fa
    maxRatio: 0.15
    minLength: 3
    # REVIEW (ADR 0066): endings that carry meaning, a letter or two apart. A slip that trades one for another at the
    # end of a word (کتابتان "your book" for کتابشان "their book") is WRONG_WORD, not a typo. A list groups the
    # spellings of one ending (after a consonant, or with alef after a vowel: م, ام).
    # Possessive -am -at -ash -emān -etān -eshān; verb person -am -i -ad -im -id -and; the copula am, i, ast, im, id, and.
    contrasts:
      - { id: possessive, note: contrast-possessive, members: [[م, ام], [ت, ات], [ش, اش], مان, تان, شان] }
      - { id: person, note: contrast-person, members: [م, ی, د, یم, ید, ند] }
      - { id: copula, note: contrast-person, members: [ام, ای, است, ایم, اید, اند] }
annotations:
  - { id: vocalized, kind: vocalization, toggle: true, default: on-for-new-words }
input:
  keyboard: cldr-kbd:fa
  extraKeys: ["\u200C"]          # ZWNJ on the special-character bar
layout: { vertical: none }
fonts: { stack: [Vazirmatn, Noto Naskh Arabic], lineHeight: 1.9 }
# What the speech service scores (ADR 0116). REVIEW: per-language choices, to revisit with recorded learners.
# Whisper writes Persian in Arabic script (tier 1); eSpeak NG's fa reads the spelling for the expected phones (tier 2).
speech:
  tiers: [1, 2]
