match:
  # A name typed in Latin letters (Sonja) compares with its cartouche, read as letters (sonja).
  case: { locale: tok }
annotations:
  # Each logograph's word in sitelen Lasina, as ruby above it: off until the learner asks.
  - { id: lasina, kind: reading, scheme: lasina, lang: tok-Latn, toggle: true, default: "off", render: ruby, fade: none }
# REVIEW: sitelen pona is written vertically too, logographs upright (the proposal, section 6h), but the font
# here has no vertical cartouches; linja insa has them and carries no licence file. Horizontal only for now.
layout: { vertical: none }
# sitelen seli kiwen juniko (Kreative Software, OFL-1.1): handwritten logographs after pu's, code points only
# (no ligatures that would turn Latin text into logographs). A logograph is a word: set larger than Latin.
fonts: { stack: [sitelen seli kiwen juniko], lineHeight: 1.6, scale: 1.5 }
