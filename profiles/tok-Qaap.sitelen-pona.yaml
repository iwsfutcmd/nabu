# profiles/tok-Qaap.sitelen-pona.yaml
# Toki Pona in sitelen pona, its logographic script (ADR 0086): one logograph a word, names in cartouches whose
# logographs begin with the name's letters (jan [sona olin nasin jan a] is jan Sonja).
# - Not in Unicode yet (proposal L2/24-275) and with no ISO 15924 code: the script subtag is Qaap, from the
#   private-use range Qaaa..Qabx, until one is assigned (the proposal asks for Stpn). Text is the UCSUR's
#   encoding, U+F1900..U+F19FF in the private use area, which every sitelen pona font and input method uses.
# - Written as Common Sitelen Pona (2026) has it: the words of a sentence run together with no spaces (the UCS
#   proposal gives the logographs the line breaking of ideographs), an ideographic space (U+3000) between
#   sentences, no ! or ? (o, a, seme and "X ala X" carry them), commas left out, a colon kept after ni.
# - A learner may type logographs (with a sitelen pona keyboard) or sitelen Lasina: typed Latin words become
#   their logographs, and a name typed in Latin letters compares with its cartouche.
# - Each logograph carries its sitelen Lasina word as a ruby reading (`lasina`), shown on request.
# Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
id: tok-Qaap/sitelen-pona
lang: tok-Qaap
# CLDR has no locale for the script: its whole repertoire is listed here, and the audit checks against it.
# The 120 logographs of pu and the 17 nimi ku suli (U+F1900..U+F1988), the cartouche marks, the colon.
exemplarsExtra: ["\U000F1900", "\U000F1901", "\U000F1902", "\U000F1903", "\U000F1904", "\U000F1905", "\U000F1906", "\U000F1907", "\U000F1908", "\U000F1909", "\U000F190A", "\U000F190B", "\U000F190C", "\U000F190D", "\U000F190E", "\U000F190F", "\U000F1910", "\U000F1911", "\U000F1912", "\U000F1913", "\U000F1914", "\U000F1915", "\U000F1916", "\U000F1917", "\U000F1918", "\U000F1919", "\U000F191A", "\U000F191B", "\U000F191C", "\U000F191D", "\U000F191E", "\U000F191F", "\U000F1920", "\U000F1921", "\U000F1922", "\U000F1923", "\U000F1924", "\U000F1925", "\U000F1926", "\U000F1927", "\U000F1928", "\U000F1929", "\U000F192A", "\U000F192B", "\U000F192C", "\U000F192D", "\U000F192E", "\U000F192F", "\U000F1930", "\U000F1931", "\U000F1932", "\U000F1933", "\U000F1934", "\U000F1935", "\U000F1936", "\U000F1937", "\U000F1938", "\U000F1939", "\U000F193A", "\U000F193B", "\U000F193C", "\U000F193D", "\U000F193E", "\U000F193F", "\U000F1940", "\U000F1941", "\U000F1942", "\U000F1943", "\U000F1944", "\U000F1945", "\U000F1946", "\U000F1947", "\U000F1948", "\U000F1949", "\U000F194A", "\U000F194B", "\U000F194C", "\U000F194D", "\U000F194E", "\U000F194F", "\U000F1950", "\U000F1951", "\U000F1952", "\U000F1953", "\U000F1954", "\U000F1955", "\U000F1956", "\U000F1957", "\U000F1958", "\U000F1959", "\U000F195A", "\U000F195B", "\U000F195C", "\U000F195D", "\U000F195E", "\U000F195F", "\U000F1960", "\U000F1961", "\U000F1962", "\U000F1963", "\U000F1964", "\U000F1965", "\U000F1966", "\U000F1967", "\U000F1968", "\U000F1969", "\U000F196A", "\U000F196B", "\U000F196C", "\U000F196D", "\U000F196E", "\U000F196F", "\U000F1970", "\U000F1971", "\U000F1972", "\U000F1973", "\U000F1974", "\U000F1975", "\U000F1976", "\U000F1977", "\U000F1978", "\U000F1979", "\U000F197A", "\U000F197B", "\U000F197C", "\U000F197D", "\U000F197E", "\U000F197F", "\U000F1980", "\U000F1981", "\U000F1982", "\U000F1983", "\U000F1984", "\U000F1985", "\U000F1986", "\U000F1987", "\U000F1988", "\U000F1990", "\U000F1991", ":"]
