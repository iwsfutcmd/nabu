# Ancient Greek in the Greek alphabet, written polytonic as modern editions of Attic prose print it (ADR 0087):
# lowercase with capitals for names, the acute, grave and circumflex accents, the smooth and rough breathings,
# the iota subscript and the diaeresis; the punctuation . , · ; and ’ for elision.
# Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
#  - Accents, breathings and the iota subscript left out or misplaced are accepted with a note (CORRECT_MARKS):
#    learners on phones may have no polytonic keyboard. Marks that make another word of the course (ἡ the, ἤ or;
#    τις someone, τίς who?; ἐν in, ἕν one; οὐ not, οὗ where) are WRONG_WORD.
#  - A grave is an acute that stands before another word (Cambridge Grammar of Classical Greek, ch. 24): either is
#    right, silently.
id: grc-Grek/polytonic
lang: grc-Grek
exemplars: cldr:el
# REVIEW: what CLDR 49's Modern Greek exemplars (polytonic letters are its auxiliary set) lack for Attic prose:
# the ano teleia (U+0387, NFC U+00B7) and the elision apostrophe, and the letters filled in by the course build; ῳ, ὠ,
# ᾠ, ᾤ and ῄ, which the rules' forms write (ἀνθρώπῳ, ὠφείλησα, ᾠήθην: docs/rules/grc.md).
exemplarsExtra: ["\u00b7", "\u2019", "ὀ", "ὁ", "ὅ", "ᾳ", "ᾷ", "ῃ", "ῇ", "ῲ", "ῴ", "ῷ", "ῳ", "ὠ", "ᾠ", "ᾤ", "ῄ"]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  # The elision mark (ἀλλ’, δ’) as editions and keyboards have it: modifier apostrophe, koronis, psili, the
  # typewriter apostrophe. Then it is punctuation, and goes.
  - map: { "\u02bc": "\u2019", "\u1fbd": "\u2019", "\u1fbf": "\u2019", "\u0027": "\u2019", "\u2018": "\u2019", "\u03f2": "σ", "\u03f9": "Σ" }
  - punctuation: strip
  - whitespace: collapse
match:
  case: { locale: grc }
  # REVIEW: the accents (acute, grave, circumflex), the breathings, the iota subscript, the diaeresis, and a
  # macron or breve a learner copied from a grammar.
  marks: { set: "[\u0300\u0301\u0342\u0313\u0314\u0345\u0308\u0304\u0306]", policy: accept-with-note, note: greek-marks, distinguishes: true, wordNote: greek-marks-word }
  # REVIEW: grave and acute are one accent (CGCG 24.2): a word typed alone takes the acute.
  equivalences:
    - { id: grave, policy: accept, map: { "ἂ": "ἄ", "ἃ": "ἅ", "Ἂ": "Ἄ", "Ἃ": "Ἅ", "ἒ": "ἔ", "ἓ": "ἕ", "Ἒ": "Ἔ", "Ἓ": "Ἕ", "ἢ": "ἤ", "ἣ": "ἥ", "Ἢ": "Ἤ", "Ἣ": "Ἥ", "ἲ": "ἴ", "ἳ": "ἵ", "Ἲ": "Ἴ", "Ἳ": "Ἵ", "ὂ": "ὄ", "ὃ": "ὅ", "Ὂ": "Ὄ", "Ὃ": "Ὅ", "ὒ": "ὔ", "ὓ": "ὕ", "Ὓ": "Ὕ", "ὢ": "ὤ", "ὣ": "ὥ", "Ὢ": "Ὤ", "Ὣ": "Ὥ", "ὰ": "ά", "ὲ": "έ", "ὴ": "ή", "ὶ": "ί", "ὸ": "ό", "ὺ": "ύ", "ὼ": "ώ", "ᾂ": "ᾄ", "ᾃ": "ᾅ", "ᾊ": "ᾌ", "ᾋ": "ᾍ", "ᾒ": "ᾔ", "ᾓ": "ᾕ", "ᾚ": "ᾜ", "ᾛ": "ᾝ", "ᾢ": "ᾤ", "ᾣ": "ᾥ", "ᾪ": "ᾬ", "ᾫ": "ᾭ", "ᾲ": "ᾴ", "Ὰ": "Ά", "ῂ": "ῄ", "Ὲ": "Έ", "Ὴ": "Ή", "ῒ": "ΐ", "Ὶ": "Ί", "ῢ": "ΰ", "Ὺ": "Ύ", "ῲ": "ῴ", "Ὸ": "Ό", "Ὼ": "Ώ" } }
    # REVIEW: the long diphthongs ῳ and ῃ typed with the iota beside the vowel (adscript), as some editions print
    # them (CGCG 1.22): ωι and ηι are no other diphthong. ᾳ cannot be: αι is the short diphthong.
    - { id: adscript, policy: accept, map: { "ἠι": "ᾐ", "ἡι": "ᾑ", "ἤι": "ᾔ", "ἥι": "ᾕ", "ἦι": "ᾖ", "ἧι": "ᾗ", "ὠι": "ᾠ", "ὡι": "ᾡ", "ὤι": "ᾤ", "ὥι": "ᾥ", "ὦι": "ᾦ", "ὧι": "ᾧ", "ηι": "ῃ", "ήι": "ῄ", "ῆι": "ῇ", "ωι": "ῳ", "ώι": "ῴ", "ῶι": "ῷ" } }
  typo:
    model: keyboard
    layout: cldr-kbd:el
    maxRatio: 0.2
    # REVIEW (ADR 0066): endings a letter or two apart that change the meaning, compared without marks and with
    # ς as σ. Person and number on verbs (λέγω, λέγει, λέγεις; λέγομεν, λέγετε, λέγουσι), on words the course
    # pins as a verb form; case and number on nouns, adjectives, pronouns and the article (λόγος, λόγον, λόγου,
    # λόγοι), on words it inflects. Pronouns a letter apart (ἡμεῖς, ὑμεῖς) are another word.
    contrasts:
      # The forms it is asked of: a finite verb in the present, a past or the future, and the imperative. REVIEW:
      # the perfect is left out, as it was.
      - { id: person, note: contrast-person,
          forms: [{ feats: { VerbForm: Fin, Tense: "Pres,Past,Fut" } }, { feats: { Mood: Imp } }],
          members: [ω, εις, ει, ομεν, ετε, [ουσι, ουσιν], ον, ες, [ε, εν], α, ας, αμεν, ατε, αν, ομαι, εται, ομεθα, εσθε, ονται, ομην, ου, ετο, οντο, σο] }
      - { id: pronoun, note: contrast-pronoun, members: [ἡμεῖς, ὑμεῖς, ἡμῶν, ὑμῶν, ἡμῖν, ὑμῖν, ἡμᾶς, ὑμᾶς, [μου, ἐμοῦ], [σου, σοῦ], [μοι, ἐμοί], [σοι, σοί], [με, ἐμέ], [σε, σέ]] }
      - { id: case, note: contrast-ending, inflected: true,
          members: [ος, ον, ου, ε, οι, ων, οις, ους, α, ας, αι, αις, αν, η, ης, ην, ι, ες, εις, εως, ει, [σι, σιν], εσι, εσιν, ευς, εα] }
# REVIEW (ADR 0148): Attic as editions spell it writes its sounds, letter by letter (η and ε, ω and ο, the rough
# breathing for h, the accents for pitch) but for the length of α, ι and υ, which it never writes: that is the reading
# side's loss, stated in the attic scheme (ᾱ beside ᾰ). Nothing is stated as lost here, so a wrong letter is another
# sound. Not stress: every word writes its accent, and no rule places one that is left out. The accents, breathings
# and iota subscript stay the noted matching policy above (ADR 0148: Greek waits for its buttons), decided before the
# sound question is asked: a mark left out is CORRECT_MARKS, unless it makes another word of the course. Considered and
# not stated: ει and ου as the long close vowels they had become in Attic beside ε and ο (the spurious diphthongs:
# whether a word writes ει or ε is history the spelling keeps, but in fourth-century Attic ε is a short vowel, so no
# second spelling of one sound).
sound: { from: spelling }
correspondences: []
# How this orthography writes a lexical form (docs/rules-design.md, section 3; docs/rules/grc.md), read by the compiler
# only. The form is read decomposed: each letter and its marks apart (ά is α and an acute), in the notation's order. The
# spelling drops the notation's own signs (the augment's "-", a vowel's length) and writes the movable ν; the free
# spellings (`alternatives`) are what a word becomes beside the next one in a sentence, which a token writes and a
# lexical form never says: a final acute written grave (CGCG 24.2), an enclitic's or a proclitic's accent written
# (24.33-24.39), a word before an enclitic taking a second accent (24.38), a final short vowel elided (24.40, 1.34-1.38),
# the movable ν left out (1.39), and words of the course written otherwise before a vowel or in a clause of their own
# (οὐκ, οὐχ; ἐξ; ἔστι: 24.34 n.1; ἐνταυθοῖ). Every rule and alternative is REVIEW. Grading never reads them: the profile's
# `equivalences` (the grave) and `marks` policy are what it reads.
spell:
  from: lexical
  decompose: true
  sets:
    # V a vowel letter, C a consonant, M a mark; NV what is no vowel (a consonant or a mark); EO, AI the short vowels a
    # word may elide (α and ι marked short); ACU the acute.
    V: "[αεηιουωΑΕΗΙΟΥΩ]"
    C: "[βγδζθκλμνξπρσςτφχψΒΓΔΖΘΚΛΜΝΞΠΡΣΤΦΧΨ]"
    M: "[\u0300-\u036f]"
    NV: "[βγδζθκλμνξπρσςτφχψΒΓΔΖΘΚΛΜΝΞΠΡΣΤΦΧΨ\u0300-\u036f]"
    EO: "[εο]"
    AI: "[αι]"
    ACU: "[\u0301]"
  rules:
    # The augment's place (the notation's "-") is not written.
    - {find: "-", to: ""}
    # Words of the course written otherwise before what follows them (CGCG 24.34-24.36): οὐ as οὐκ before a smooth
    # breathing, οὐχ before a rough one; ἐκ as ἐξ before a vowel; ἐστι(ν) as ἔστι(ν) where it begins its clause or
    # means "there is" (24.34 n.1); ἐνταῦθα and ἐνταυθοῖ (thither) are one lexeme of the course (REVIEW: two words).
    - {find: "^οὒ$", to: "οὒ", alternatives: [{id: ouk, to: "οὐκ"}, {id: ouk, to: "οὐχ"}]}
    - {find: "^ἐκ$", to: "ἐκ", alternatives: [{id: ek, to: "ἐξ"}]}
    - {find: "^ἐστῐ̀\\(ν\\)$", to: "ἐστῐ̀(ν)", alternatives: [{id: esti, to: "ἔστῐ(ν)"}]}
    - {find: "^ἐνταῦθᾰ$", to: "ἐνταῦθᾰ", alternatives: [{id: entauthoi, to: "ἐνταυθοῖ"}]}
    # The accent an enclitic or a proclitic has only where the sentence calls for it (the notation's grave) is not
    # written, or written as an acute.
    - {find: "\u0300", to: "", alternatives: [{id: accented, to: "\u0301"}]}
    # A final short vowel (ε, ο, ᾰ, ῐ) may be elided before a vowel, with its accent (CGCG 24.40): ’.
    - {find: "{EO}{ACU}?$", to: "{EO}{ACU}", alternatives: [{id: elision, to: "’"}]}
    - {find: "{AI}\u0306{ACU}?$", to: "{AI}\u0306{ACU}", alternatives: [{id: elision, to: "’"}]}
    # The movable ν is written, or not.
    - {find: "\\(ν\\)", to: "ν", alternatives: [{id: nu, to: ""}]}
    # A vowel's length is not written.
    - {find: "[\u0304\u0306]", to: ""}
    # Before an enclitic, a word with an acute on its third syllable from the end, or a circumflex on its second, takes
    # an acute on its last too (CGCG 24.38).
    - {find: "{V}", after: "(\u0301{M}*{C}*{V}{M}*({V}{M}*)?{C}{C}*({V}{M}*)?|\u0342{M}*{C}*({V}{M}*)?)", before: "{NV}*$", to: "{V}", alternatives: [{id: enclitic, to: "{V}\u0301"}]}
    # A final acute is written grave before another word (CGCG 24.2).
    - {find: "\u0301", before: "{NV}*$", to: "\u0301", alternatives: [{id: grave, to: "\u0300"}]}
input:
  keyboard: cldr-kbd:el
layout: { vertical: none }
# The alphabet track asks its letters and words as their Attic readings, in the scheme's Latin (ADR 0133): a word's
# vowel lengths are its reading's (χώρᾱ, chōrā).
scriptTrack: { reading: attic }
# Polytonic text is set in a serif face (Noto Serif, OFL-1.1) a little larger than the text around it: the
# breathings and accents stack over the letters and need the size and the line height.
fonts: { stack: [Noto Serif], lineHeight: 1.9, scale: 1.15 }
