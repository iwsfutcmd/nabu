# profiles/es-Latn.standard.yaml
# Spanish in Latin script, as the RAE and ASALE spell it (Ortografía, 2010), for the es course (Cuban Spanish, ADR 0076).
# Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
#  - The acute accent and the diaeresis carry sound (ADR 0148, amending ADR 0076): they are required marks, so one
#    left out, added or moved is never folded away nor a typo. The sound statement below labels the miss: tambien
#    for también and pinguino for pingüino say another sound (phonemic), háblo for hablo the same with the accent
#    where the rule already puts the stress (orthographic); esta for está, tu for tú are another word of the course
#    too (lexical). Not accepted either way (WRONG_WORD), with the note accent (accent-word where it makes another
#    word). Until ADR 0148 a missing accent was accepted with a note (CORRECT_MARKS).
#  - ñ is a letter of its own, not n with a mark: año and ano are different words.
id: es-Latn/standard
lang: es-Latn
exemplars: cldr:es
letters: [a, b, c, d, e, f, g, h, i, j, k, l, m, n, "\u00F1", o, p, q, r, s, t, u, v, w, x, y, z]
segmentation: { content: whitespace, runtime: grapheme }
normalize:
  - nfc
  - map: { "\u2019": "'", "\u2018": "'" }    # curly apostrophes (rare in Spanish; names like O'Farrill)
  - punctuation: strip                    # also the opening marks \u00BF and \u00A1
  - whitespace: collapse
match:
  case: { locale: es }
  # REVIEW: the acute accent and the diaeresis (pingüino), required (ADR 0148: they carry sound). Not the tilde of ñ,
  # which makes another letter. The policy and its note are what a mark outside `required` would get: there is none.
  marks: { set: "[\u0301\u0308]", policy: accept-with-note, note: accent, distinguishes: true, wordNote: accent-word,
           required: "[\u0301\u0308]", requiredNote: accent }
  typo:
    model: keyboard
    layout: cldr-kbd:es
    maxRatio: 0.2
    # REVIEW (ADR 0066): endings one or two letters apart that change the meaning: person and tense on verbs
    # (hablo, habla, hablas, hablan; hablé, habló; hable), gender and number on nouns and adjectives (niño, niña,
    # niños). A word whose accent differs (habló/hablo, hablé/habló) is never a typo: the required marks above.
    contrasts:
      - { id: ending, note: contrast-ending, members: [o, a, e, os, as, es, an, en, amos, emos, imos, aste, iste, aron, ieron, io, i, aba, abas, aban, ia, ias, ian] }
      - { id: pronoun, note: contrast-pronoun, members: [yo, tu, el, ella, ellos, ellas, usted, ustedes, nosotros, nosotras] }
# REVIEW: what the spelling writes of the sound, and what it loses (ADR 0148; profiles/README.md, "The sound
# statement"). The course teaches Cuban Spanish, so the sounds are Cuban: seseo (s, z, and c before e or i are one
# sound), yeísmo (ll and y are one sound), b and v one sound, h silent but in ch, and g before e or i the sound of j
# (in Cuba a breathy [h], so it says "h" here; the letter h itself is silent). The `says` values are only compared
# with one another: "rr" is the trill, "ʝ" the sound of ll and y, "tʃ" ch, "gw" gü, "ks" x.
sound: { from: spelling }
# REVIEW: the acute writes stress. An unmarked word ending in a vowel, n or s is stressed on its next-to-last
# syllable, any other on its last (the RAE's rule). i and u beside another vowel share its syllable unless they carry
# the accent (día has two syllables, dia would have one). So esta and está, tu and tú say different things, and
# háblo says what hablo says (its accent is then a place of its own, rule `stress`).
stress:
  mark: "\u0301"
  vowels: [a, e, i, o, u]
  weak: [i, u]
  default: [{ when: { ends: "[aeiouns]" }, "on": penult }, { "on": last }]
  note: accent
correspondences:
  # REVIEW: every one is fixed: the norm spells each word one way. Each `when` is stated before the wider one it
  # narrows (the longest written form wins, the earlier correspondence on a tie).
  # b and v are one sound (betacismo, everywhere Spanish is spoken).
  - { says: b, written: [b, v], kind: fixed, note: sound-alike }
  # Seseo: c before e or i, s and z are one sound in Cuba (and all of Latin America).
  - { says: s, written: [c], kind: fixed, when: { before: "[eiéí]" }, note: sound-alike }
  - { says: s, written: [s, z], kind: fixed, note: sound-alike }
  # /k/: qu before e or i, c elsewhere; c before e or i is s (above). k is its rare spelling (kilo, kiosco): read as
  # the same sound, so ké for qué is the right sound with the wrong letter, but never offered in place of c or qu.
  - { says: k, written: [qu], kind: fixed, when: { before: "[eiéí]" }, note: sound-alike }
  - { says: k, written: [c], rare: [k], kind: fixed, note: sound-alike }
  # The sound of j: g before e or i, and j everywhere (gente, jefe).
  - { says: h, written: [g], kind: fixed, when: { before: "[eiéí]" }, note: sound-alike }
  - { says: h, written: [j], kind: fixed, note: sound-alike }
  # /g/ before e or i is gu (guerra), and gü says g and u there (pingüino); g elsewhere (gato).
  - { says: g, written: [gu], kind: fixed, when: { before: "[eiéí]" }, note: sound-alike }
  - { says: gw, written: [gü], kind: fixed, when: { before: "[eiéí]" }, note: sound-alike }
  - { says: g, written: [g], kind: fixed, note: sound-alike }
  # y at the end of a word after a vowel is the vowel i (hoy, muy, rey); elsewhere y and ll are one sound (yeísmo).
  # Not stated: the conjunction y standing alone, which says i too; a context can only say "after a vowel" or "at
  # the start", so it reads as the sound of ll here (a spelling card would offer ll for it).
  - { says: i, written: [y], kind: fixed, when: { at: end, after: "[aeiouáéíóú]" } }
  - { says: ʝ, written: [ll, y], kind: fixed, note: sound-alike }
  # ch is one sound; h alone says nothing (hablar, ahora).
  - { says: tʃ, written: [ch], kind: fixed }
  - { says: "", written: [h], kind: fixed, note: sound-alike }
  # The trill: rr between vowels, r at the start of a word and after l, n or s (rosa, honra, Israel); r elsewhere is
  # the tap and says itself.
  - { says: rr, written: [rr], kind: fixed, note: sound-alike }
  - { says: rr, written: [r], kind: fixed, when: { at: start }, note: sound-alike }
  - { says: rr, written: [r], kind: fixed, when: { after: "[lns]" }, note: sound-alike }
  # x is k and s (taxi, examen). México's x (the sound of j) is that word's own, not a rule.
  - { says: ks, written: [x], kind: fixed }
# How the orthography writes a lexical form (docs/rules-design.md, section 3; lexicons/es/language.yaml `notation`):
# as it is, its boundaries dropped (Spanish's lexical form is its spelling). REVIEW: the two clipped words the course
# writes beside their lemma (agro, tele) are free spellings of it, read only by the compiler.
spell:
  from: lexical
  rules:
    - { find: "^agromercado$", to: agromercado, alternatives: [{ id: clipped, to: agro }] }
    - { find: "^televisión$", to: televisión, alternatives: [{ id: clipped, to: tele }] }
layout: { vertical: none }
# What the speech service scores (ADR 0116). REVIEW: per-language choices, to revisit with recorded learners.
# Whisper writes Spanish (tier 1). Not the phones: eSpeak NG's es says Castilian (θ for c and z, every s), and Cuban
# speech (seseo, s aspirated or dropped before a consonant: ehtá) would be marked wrong where it is right.
speech:
  tiers: [1]
