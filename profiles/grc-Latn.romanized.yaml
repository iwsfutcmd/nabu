# Ancient Greek in Latin letters (ADR 0088, 0133): the Attic scheme's Latin, which the alphabet track asks its letters
# and words as (the profile grc-Grek/polytonic's `scriptTrack`), written by the compiler from each word's Attic reading
# (nabu.greek_translit): η ē, ω ō, a long α ι υ ā ī ȳ (χώρᾱ chōrā), υ y (u in diphthongs), θ φ χ th ph ch, the rough
# breathing h, the iota subscript written out, accents left out. Not an orthography a learner can pick: it tags and
# sets the Latin side of letter and word cards.
id: grc-Latn/romanized
lang: grc-Latn
exemplars: cldr:en
# The macrons of the long vowels, and the elision mark.
exemplarsExtra: ["ā", "ē", "ī", "ō", "ȳ", "\u2019"]
segmentation: { content: whitespace, runtime: grapheme }
normalize:
  - nfc
  - map: { "\u2019": "'", "\u2018": "'" }
  - punctuation: strip
  - whitespace: collapse
match:
  case: { locale: en }
  # REVIEW: a macron typed or not (e for ē) is noted, not failed.
  marks: { set: "[\u0304]", policy: accept-with-note, note: greek-marks }
  typo: { model: keyboard, layout: cldr-kbd:en, maxRatio: 0.2 }
# REVIEW (ADR 0148): no `sound`. This Latin is the compiler's rendering of each word's Attic reading
# (nabu.greek_translit), shown and chosen on letter and word cards, never typed (ADR 0133, which ADR 0148 leaves
# standing: its macrons stay noted). So the sound question is never asked of it, and nothing is stated as lost.
correspondences: []
layout: { vertical: none }
