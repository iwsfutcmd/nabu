# Phase 1 profile. Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
id: uz-Cyrl/standard
lang: uz-Cyrl
exemplars: cldr:uz-Cyrl
letters: [а, б, в, г, ғ, д, е, ё, ж, з, и, й, к, қ, л, м, н, о, п, р, с, т, у, ў, ф, х, ҳ, ч, ш, ъ, э, ю, я]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  - punctuation: strip
  - whitespace: collapse
match:
  case: { locale: uz }
  equivalences:
    # REVIEW: Russian-keyboard stand-ins for Uzbek letters are wrong, but say why.
    - { id: uzbek-letters, map: { "\u045E": "\u0443", "\u049B": "\u043A", "\u0493": "\u0433", "\u04B3": "\u0445" }, policy: reject-with-note, note: uzbek-letters }
  typo:
    model: keyboard
    layout: cldr-kbd:uz-Cyrl
    maxRatio: 0.2
    # REVIEW (erratum 46): as uz-Latn/standard, in Cyrillic: Сен for Мен, талабасан for талабаман are WRONG_WORD.
    contrasts:
      - { id: person, note: contrast-person, members: [ман, сан, дир, миз, сиз, лар] }
      - { id: possessive, note: contrast-possessive, members: [[им, м], [инг, нг], [и, си], [имиз, миз], [ингиз, нгиз], лари] }
      - { id: case, note: contrast-case, members: [ни, нинг, [га, ка, қа], [да, та], [дан, тан]] }
      - { id: pronoun, note: contrast-pronoun, members: [мен, сен, у, биз, сиз, улар] }
input:
  extraKeys: ["\u045E", "\u049B", "\u0493", "\u04B3"]
layout: { vertical: none }
transliterate: { to: uz-Latn/standard, via: cldr-transform }
# What the speech service scores (ADR 0116). REVIEW: per-language choices, to revisit with recorded learners.
# Nothing: Whisper writes Uzbek in Latin letters, so a transcript cannot be graded in Cyrillic.
speech:
  tiers: []
