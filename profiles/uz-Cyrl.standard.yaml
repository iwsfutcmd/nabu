# Phase 1 profile. Policies marked REVIEW are Claude's proposals awaiting Ben's linguistic sign-off.
id: uz-Cyrl/standard
lang: uz-Cyrl
exemplars: cldr:uz-Cyrl
letters: [а, б, в, г, ғ, д, е, ё, ж, з, и, й, к, қ, л, м, н, о, п, р, с, т, у, ў, ф, х, ҳ, ч, ш, ъ, э, ю, я]
segmentation: { content: hand-pinned, runtime: grapheme }
normalize:
  - nfc
  - punctuation: strip
  - whitespace: collapse
match:
  case: { locale: uz }
  equivalences:
    # REVIEW: Russian-keyboard stand-ins for Uzbek letters are wrong, but say why.
    - { id: uzbek-letters, map: { "\u045E": "\u0443", "\u049B": "\u043A", "\u0493": "\u0433", "\u04B3": "\u0445" }, policy: reject-with-note, note: uzbek-letters }
  typo:
    model: keyboard
    layout: cldr-kbd:uz-Cyrl
    maxRatio: 0.2
    # REVIEW (erratum 46): as uz-Latn/standard, in Cyrillic: Сен for Мен, талабасан for талабаман are WRONG_WORD.
    contrasts:
      - { id: person, note: contrast-person, members: [ман, сан, дир, миз, сиз, лар] }
      - { id: possessive, note: contrast-possessive, members: [[им, м], [инг, нг], [и, си], [имиз, миз], [ингиз, нгиз], лари] }
      - { id: case, note: contrast-case, members: [ни, нинг, [га, ка, қа], [да, та], [дан, тан]] }
      - { id: pronoun, note: contrast-pronoun, members: [мен, сен, у, биз, сиз, улар] }
# REVIEW (ADR 0148): Uzbek Cyrillic writes a sound with one letter, but for the letters that write й and a vowel together,
# and ц. Each is stated with the usual letter `written` and the spelling the norm never uses there `rare`: read as the
# same sound, so a typed йахши for яхши or сирк for цирк is the right sound in the wrong letters (orthographic, never
# a slip), while no word written the usual way is offered the rare spelling (no Цалом for Салом, no йахши for яхши).
# - я, ю, ё are й with а, у, о everywhere (яхши, юз, ёз; Англия, пиёз). A loan the norm writes with йо (район, майор)
#   is read as ё too, so it would be offered раён: none is in the course.
# - е at a word's start and after a vowel is й and е (ер, емоқ, қаер); after a consonant it is е alone (келди), and
#   йе there says another sound.
# - ц at a word's start is с in Uzbek speech (цирк, цемент; the Latin writes sirk; ADR 0148's own example): stated as
#   с with ц rare, so a с-word is never offered ц, and a ц-word (none in the course yet) would be offered с. Not stated
#   elsewhere: after a vowel ц is ts (the Latin writes ts), which no other letter spells.
# Still left out, `rare` changing nothing there: ь (only фильм, in an accept set: stated silent, the course's филм slip
# would become a miss, and whether it says anything is the speaker's); ъ (the tutuq belgisi, a sound of its own; no word
# of the course has it); э beside е after a consonant (loans only, none in the course); х and ҳ, which the standard
# keeps apart.
sound: { from: spelling }
correspondences:
  - { says: я, written: [я], rare: [йа], kind: fixed, note: sound-alike }
  - { says: ю, written: [ю], rare: [йу], kind: fixed, note: sound-alike }
  - { says: ё, written: [ё], rare: [йо], kind: fixed, note: sound-alike }
  - { says: е, written: [е], rare: [йе], kind: fixed, when: { at: start }, note: sound-alike }
  - { says: е, written: [е], rare: [йе], kind: fixed, when: { after: "[аеёиоуўэюя]" }, note: sound-alike }
  - { says: с, written: [с], rare: [ц], kind: fixed, when: { at: start }, note: sound-alike }
input:
  extraKeys: ["\u045E", "\u049B", "\u0493", "\u04B3"]
layout: { vertical: none }
transliterate: { to: uz-Latn/standard, via: cldr-transform }
# What the speech service scores (ADR 0116). REVIEW: per-language choices, to revisit with recorded learners.
# Nothing: Whisper writes Uzbek in Latin letters, so a transcript cannot be graded in Cyrillic.
speech:
  tiers: []
