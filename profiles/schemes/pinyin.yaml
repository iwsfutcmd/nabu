# Hanyu Pinyin: Mandarin readings of Chinese characters, one syllable per character, tones as marks
# on the vowels (yuè). lzh pins it on every Han word (ADR 0071) and asks it on reading cards when the
# learner reads in Pinyin (ADR 0138).
id: pinyin
# What the UI calls the scheme and its tones, by language (ADR 0109). The translations are an
# LLM's drafts, made for the draft UI catalogs (ADR 0070), and await review as those do.
names:
  en:
    scheme: Pinyin
  ar:
    scheme: "بينيين"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  fa:
    scheme: "پین\u200cیین"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  uz:
    scheme: "Pinyin"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  uz-Cyrl:
    scheme: "Пиньинь"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
  zh-Hant-HK:
    scheme: "漢語拼音"
    provenance: {author: 'llm:claude@baa6bf1d5e24', status: draft}
language: cmn
lang: zh-Latn-pinyin
# A reading card offers and grades its readings as zh-Latn/pinyin: typed with marks or tone numbers.
answer: zh-Latn/pinyin
typedByProfile: true
# REVIEW (ADR 0148): the characters write no tone. Each tone of a vowel is said and not written, and a reading
# card's wrong options give a syllable another tone, the marked vowel traded for the same vowel with another tone's
# mark (`loses`; ADR 0131's sets, ADR 0138). No `of`: a character's reading is listed, not a rule.
correspondences:
  - { says: ā, written: [""], kind: fixed, loses: [á, ǎ, à] }
  - { says: ē, written: [""], kind: fixed, loses: [é, ě, è] }
  - { says: ī, written: [""], kind: fixed, loses: [í, ǐ, ì] }
  - { says: ō, written: [""], kind: fixed, loses: [ó, ǒ, ò] }
  - { says: ū, written: [""], kind: fixed, loses: [ú, ǔ, ù] }
  - { says: ǖ, written: [""], kind: fixed, loses: [ǘ, ǚ, ǜ] }
