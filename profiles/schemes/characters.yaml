# Hong Kong Cantonese characters, as the ruby of a word written in Jyutping (ADR 0126): yue-Latn/jyutping
# writes its words in Jyutping, and each word pins the characters it is written with (`readings: {characters: 學生}`),
# shown above its syllables, one character over each. Shown, never asked: a card asks for characters in the
# Traditional orthography, not here.
id: characters
# What the UI calls the layer, by language (ADR 0109).
names:
  en:
    scheme: Characters
language: yue
lang: yue-Hant-HK
