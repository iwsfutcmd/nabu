# The Tiberian reading of Biblical Hebrew (ADR 0082), in SBL transliteration: an acute on a
# non-final stress, a final hyphen on a word bound by maqaf (šāmáyim, kol-). Every word token of hbo
# pins it, from the Westminster Leningrad Codex; voices say it as phonemes (nabu/audio/tiberian.py),
# never as Modern Hebrew text.
id: tiberian
names:
  en:
    scheme: Tiberian reading (SBL)
language: hbo
lang: hbo-Latn
# A word bound to the next by a maqaf reads with a final hyphen (ʿal-), and unstressed: the compiler checks the reading
# and the maqaf agree, and compares bound words apart from free ones (saʿar-, sáʿar; ADR 0135).
bound: { mark: "-", before: "\u05BE" }
