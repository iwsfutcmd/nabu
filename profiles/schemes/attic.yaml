# Attic Greek as spelled, with each α, ι, υ outside a diphthong marked long (ᾱ) or short (ᾰ) unless a
# circumflex or a subscript settles it (ADR 0087). Every word token of grc pins it; voices say it
# as reconstructed (nabu/audio/attic.py), never as Modern Greek. A word card cites the word with an
# acute where a sentence has its grave.
id: attic
names:
  en:
    scheme: Attic (vowel lengths marked)
language: grc
lang: grc-Grek
# A learner still learning the alphabet reads it in Latin letters (ADR 0133): nabu.greek_translit, the lengths kept
# (χώρᾱ chōrā, ᾰ̓γορᾱ́ agorā).
latin: grc-Latn/romanized
# REVIEW (ADR 0148): what the Greek letters leave out of this reading is the length of α, ι and υ: each is written
# alike long or short (χώρᾱ and ᾰ̓γορᾱ́ write their α's alike), and the reading's macron or breve is what the spelling
# does not give. Stated as sets, one a vowel with each accent and breathing a reading writes on it (the reading's
# macron or breve stands first, then the breathing, then the accent, as the course's pinned readings have them): a
# card may trade the long vowel for the short one there. The letters write the other vowels' length (ε and ο beside η
# and ω), and a circumflex or an iota subscript settles it (the reading marks none there), so those are no loss. No `of`: the scheme is the spelling with its lengths, and no
# relation to state but these sets. Not stated: a length mark with a diaeresis (no reading of the course has one).
# The scheme has no `answer`, so no card asks for it yet: the sets give each word with a marked vowel a reading
# leftover (the word list's) and nothing else.
correspondences:
  - { says: "ᾱ", written: ["α"], kind: fixed, loses: ["ᾰ"] }
  - { says: "ᾱ\u0301", written: ["ά"], kind: fixed, loses: ["ᾰ\u0301"] }
