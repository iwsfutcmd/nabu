# Schluessel's transliteration of Chaghatay (An Introduction to Chaghatay, 2018, xii-xxxii; ADR 0128): a modified
# IJMES system that writes the vowels the Arabic script leaves out (bardi, bärdi). chg pins it on every Arabic word
# as a reading and shows it as ruby over the whole word, over new words (ADR 0131). Reading cards ask for it: a word
# of a sentence, its reading among others, then typed (ADR 0131), as text of the chg-Latn/schluessel profile, which
# also tags the alphabet track's (ADR 0133: words by their readings, letters by their chg-Latn/schluessel forms).
id: schluessel
# What the UI calls the scheme, by language (ADR 0109). The translations are an LLM's drafts, made for the draft UI
# catalogs (ADR 0070), and await review as those do.
names:
  en:
    scheme: Transliteration (Schluessel)
  ar:
    scheme: "النقحرة اللاتينية (شلوسل)"
    provenance: {author: 'llm:claude@chg-draft-v1', status: draft}
  fa:
    scheme: "آوانویسی لاتین (شلوسل)"
    provenance: {author: 'llm:claude@chg-draft-v1', status: draft}
  uz:
    scheme: "Lotin transliteratsiyasi (Schluessel)"
    provenance: {author: 'llm:claude@chg-draft-v1', status: draft}
  uz-Cyrl:
    scheme: "Лотин транслитерацияси (Шлюссел)"
    provenance: {author: 'llm:claude@chg-draft-v1', status: draft}
  zh-Hant-HK:
    scheme: "拉丁轉寫（施呂瑟爾）"
    provenance: {author: 'llm:claude@chg-draft-v1', status: draft}
language: chg
lang: chg-Latn
answer: chg-Latn/schluessel
# Its readings are Latin already: an alphabet track's words are their readings as they stand (ADR 0133).
latin: chg-Latn/schluessel
# Typed once a word's reading was read right by choice (ADR 0131), graded as text of chg-Latn/schluessel: a mark
# left out is noted, not failed, unless it spells another word (bardi for bärdi); ng for ŋ is accepted with a note.
typedByProfile: true
# A Chaghatay word's letters do not line up with its sounds (most vowels are unwritten): the reading stands over
# the whole word.
ruby: word
# REVIEW (ADR 0148): how chg-Arab/standard writes each piece of the reading, the relation a reading card and the
# compiler read (profiles/README.md, "The sound statement"). `says` is a letter of the transliteration, `written` the
# letters that write it ("" where the script leaves it unwritten), `when` where on the spelling it holds. Nothing is
# implied: a reading this does not relate to its spelling is on the review list (`nabu projections ../courses/chg`).
# The first ten carry the sets a reading card trades within (`loses`), drawn from every Arabic spelling of the course
# aligned with its reading (786 words) and erring on more options: a word's vowels (front or back, rounded or not,
# long or short) and the consonants one letter writes alike. With a word's spelling, a card trades only what the
# letter written there also writes, after the course's real homographs. From Schluessel's table of letters (2018,
# xii-xxxii) and the course's own spellings; a reviewer should check the scribal ones last (پ for b).
# REVIEW (ADR 0148, fixed or free): chg-Arab/standard's sound is the pinned reading (`sound: {from: reading}`), so
# grading reads `kind` here: a typed spelling this relates to the expected word's reading by free correspondences
# alone is an accepted variant; by a fixed one, an orthographic miss. Free is what the scribes vary and the course's
# own texts and accept sets write both ways (hundreds of hand-written alternatives in `reverse`):
#  - every vowel's letter, written or left out (کشی and کیشی kiši, سکز and سیکیز säkkiz), a final ه or ا for a or ä
#    (اویده and اویدا öydä), آ or ا at the start (آرزان, ارزان), an ezafe's hamza on a final he;
#  - p as پ or ب (پادشاه, بادشاه pādišāh), ṗ as ف or پ (فادشاه), and پ for b (پز biz, پله billä, پلماسمز bilmäsmiz:
#    the course's texts; added to b's ب, so a reading card may now trade b for p where پ is written);
#  - č as چ or ج (چیقتی and جقتی čiqti, کیچه and کجه kečä), g as ک, گ or غ (یرکه and یرغه yärgä), and a double
#    written once, with a shadda or twice (below).
# Fixed: every other consonant, and an alif that only carries a word's first vowel (اوتوز ottuz: وتوز is no
# spelling of it). Left out, REVIEW: ف for p (the scribes' third letter for p, ADR 0148; the course writes it only as
# ṗ, and stating it would let a card trade p for ṗ wherever ف is written) and ب for ṗ (the same at every ب). Not
# stated as one sound at all: ت/ط, س/ص/ث, ز/ذ/ض/ظ, ه/ح, ع/ء. Schluessel's transliteration keeps them apart (t, ṭ),
# so the reading tells them apart and a typed س for ص says another reading; and stating them fixed would fail what
# the course accepts by hand (آت and آط for at).
of: chg-Arab/standard
# REVIEW: a vowel mark a text adds (the damma one story line writes on سوی, süyi) is no letter of the spelling:
# passed over, as the profile's matching passes over it. Not the shadda, which the relation states.
ignores: "[\u064B-\u0650\u0652\u0670]"
correspondences:
  # REVIEW (ADR 0148): a doubled consonant is written once (ikki ایکی, jannat جنت), once with a shadda (جبّار
  # jabbār) or twice (یتتی and یتی, قاتتیق and قاتیق, اللیک and الیک are all the course's): the second is not
  # written, is the shadda, or is the letter again, right after the letter. Free: the course's texts and accept
  # sets write a double every way. Stated first, so the second of a letter written twice is the double's and
  # not the plain letter's (the earlier correspondence wins a tie).
  - { says: b, written: ["", "\u0651", ب], kind: free, when: { after: "[ب]" } }
  - { says: p, written: ["", "\u0651", پ, ب], kind: free, when: { after: "[پب]" } }
  - { says: t, written: ["", "\u0651", ت], kind: free, when: { after: "[ت]" } }
  - { says: j, written: ["", "\u0651", ج], kind: free, when: { after: "[ج]" } }
  - { says: č, written: ["", "\u0651", چ, ج], kind: free, when: { after: "[چج]" } }
  - { says: ḥ, written: ["", "\u0651", ح], kind: free, when: { after: "[ح]" } }
  - { says: ḫ, written: ["", "\u0651", خ], kind: free, when: { after: "[خ]" } }
  - { says: d, written: ["", "\u0651", د], kind: free, when: { after: "[د]" } }
  - { says: r, written: ["", "\u0651", ر], kind: free, when: { after: "[ر]" } }
  - { says: z, written: ["", "\u0651", ز], kind: free, when: { after: "[ز]" } }
  - { says: s, written: ["", "\u0651", س], kind: free, when: { after: "[س]" } }
  - { says: š, written: ["", "\u0651", ش], kind: free, when: { after: "[ش]" } }
  - { says: ṣ, written: ["", "\u0651", ص], kind: free, when: { after: "[ص]" } }
  - { says: ż, written: ["", "\u0651", ض], kind: free, when: { after: "[ض]" } }
  - { says: ṭ, written: ["", "\u0651", ط], kind: free, when: { after: "[ط]" } }
  - { says: ʿ, written: ["", "\u0651", ع], kind: free, when: { after: "[ع]" } }
  - { says: ǧ, written: ["", "\u0651", غ], kind: free, when: { after: "[غ]" } }
  - { says: f, written: ["", "\u0651", ف], kind: free, when: { after: "[ف]" } }
  - { says: q, written: ["", "\u0651", ق], kind: free, when: { after: "[ق]" } }
  - { says: k, written: ["", "\u0651", ک], kind: free, when: { after: "[ک]" } }
  - { says: g, written: ["", "\u0651", ک, گ], kind: free, when: { after: "[کگ]" } }
  - { says: l, written: ["", "\u0651", ل], kind: free, when: { after: "[ل]" } }
  - { says: m, written: ["", "\u0651", م], kind: free, when: { after: "[م]" } }
  - { says: n, written: ["", "\u0651", ن], kind: free, when: { after: "[ن]" } }
  - { says: y, written: ["", "\u0651", ی], kind: free, when: { after: "[ی]" } }
  - { says: w, written: ["", "\u0651", و], kind: free, when: { after: "[و]" } }
  # alif at the start of a word carries any vowel: a, ä, ā, e, i, u
  - { says: a, written: [ا, آ], kind: free, when: { at: start }, loses: [ä, ā, e, i, u] }
  # vav: o, ö, u, ü, ū
  - { says: o, written: [و], kind: free, loses: [ö, u, ü, ū] }
  # ye: i, e, ī, ä (bär- "give"), à (alif maksura: taʿālà), ē (bē-)
  - { says: i, written: [ی], kind: free, loses: [e, ī, ä, à, ē] }
  # a final he: a, ä, e
  - { says: a, written: [ه], kind: free, when: { at: end }, loses: [ä, e] }
  # no letter at all: a, ä, e, i, u, ü
  - { says: a, written: [""], kind: free, loses: [ä, e, i, u, ü] }
  # keheh: k, g (göšt, yigit, kälgän)
  - { says: k, written: [ک], kind: fixed, loses: [g] }
  # ghain: ǧ, g (the dative -gä after front vowels)
  - { says: ǧ, written: [غ], kind: fixed, loses: [g] }
  # be: b, p (köp, barip: p at the end of a word); pe and fe: p, ṗ
  - { says: b, written: [ب, پ], kind: free, loses: [p, ṗ] }
  # jim: j, č (kälgäč)
  - { says: j, written: [ج], kind: fixed, loses: [č] }
  # nun: n, ŋ (ŋ is usually نک)
  - { says: n, written: [ن], kind: fixed, loses: [ŋ] }
  # The rest of each letter and each vowel. A vowel at the start of a word after a half-space (bē-iḫtiyār) is
  # written as at the start of a word.
  - { says: a, written: [ا, آ], kind: free, when: { after: "[\u200C]" }, loses: [ä, ā, e, i, u] }
  - { says: ā, written: [ا, آ], kind: free, when: { at: start } }
  - { says: ā, written: [ا, آ], kind: free, when: { after: "[\u200C]" } }
  - { says: ä, written: [ا, آ], kind: free, when: { at: start } }
  - { says: ä, written: [ا, آ], kind: free, when: { after: "[\u200C]" } }
  - { says: e, written: [ا, آ], kind: free, when: { at: start } }
  - { says: e, written: [ا, آ], kind: free, when: { after: "[\u200C]" } }
  - { says: i, written: [ا, آ], kind: free, when: { at: start } }
  - { says: i, written: [ا, آ], kind: free, when: { after: "[\u200C]" } }
  - { says: u, written: [ا, آ], kind: free, when: { at: start } }
  - { says: u, written: [ا, آ], kind: free, when: { after: "[\u200C]" } }
  # an alif that starts a word before vav or ye only carries it: اوتوز ottuz, ایکی ikki
  - { says: "", written: [ا, آ], kind: fixed, when: { at: start, before: "[وی]" } }
  - { says: "", written: [ا], kind: fixed, when: { after: "[\u200C]", before: "[وی]" } }
  # Long a and the front a inside a word: alif (and ā as alif maksura at the end, Mūsā).
  - { says: a, written: [ا], kind: free }
  - { says: ā, written: [ا, آ], kind: free }
  - { says: ä, written: [ا], kind: free }
  - { says: ā, written: [ی], kind: free, when: { at: end } }
  # Vowels written with ye, vav or a final he, or not at all.
  - { says: e, written: [ی], kind: free }
  - { says: ī, written: [ی], kind: free }
  - { says: ä, written: [ی], kind: free }
  - { says: à, written: [ی], kind: free }
  - { says: ē, written: [ی], kind: free }
  - { says: ö, written: [و], kind: free }
  - { says: u, written: [و], kind: free }
  - { says: ü, written: [و], kind: free }
  - { says: ū, written: [و], kind: free }
  - { says: ä, written: [ه], kind: free, when: { at: end } }
  - { says: e, written: [ه], kind: free, when: { at: end } }
  # A final he stays final before a half-space and a suffix (darwāzasi), or an ezafe written as a hamza.
  - { says: a, written: [ه], kind: free, when: { before: "[\u200C\u0654]" }, loses: [ä, e] }
  - { says: ä, written: [ه], kind: free, when: { before: "[\u200C\u0654]" } }
  - { says: e, written: [ه], kind: free, when: { before: "[\u200C\u0654]" } }
  - { says: ä, written: [""], kind: free }
  - { says: e, written: [""], kind: free }
  - { says: i, written: [""], kind: free }
  - { says: u, written: [""], kind: free }
  - { says: ü, written: [""], kind: free }
  - { says: o, written: [""], kind: free }
  - { says: ö, written: [""], kind: free }
  # Consonants: Schluessel's letter for each Arabic letter (2018, xii-xxxii).
  - { says: p, written: [پ, ب], kind: free }
  - { says: ṗ, written: [ف, پ], kind: free }
  - { says: t, written: [ت], kind: fixed }
  - { says: s̱, written: [ث], kind: fixed }
  - { says: č, written: [چ, ج], kind: free }
  - { says: ḥ, written: [ح], kind: fixed }
  - { says: ḫ, written: [خ], kind: fixed }
  - { says: d, written: [د], kind: fixed }
  - { says: ẕ, written: [ذ], kind: fixed }
  - { says: r, written: [ر], kind: fixed }
  - { says: z, written: [ز], kind: fixed }
  - { says: ž, written: [ژ], kind: fixed }
  - { says: s, written: [س], kind: fixed }
  - { says: š, written: [ش], kind: fixed }
  - { says: ṣ, written: [ص], kind: fixed }
  - { says: ż, written: [ض], kind: fixed }
  - { says: ṭ, written: [ط], kind: fixed }
  - { says: ẓ, written: [ظ], kind: fixed }
  - { says: ʿ, written: [ع], kind: fixed }
  - { says: g, written: [ک, گ, غ], kind: free }
  - { says: f, written: [ف], kind: fixed }
  - { says: q, written: [ق], kind: fixed }
  - { says: l, written: [ل], kind: fixed }
  - { says: m, written: [م], kind: fixed }
  - { says: ŋ, written: [نک, ڭ], kind: fixed }
  - { says: w, written: [و], kind: fixed }
  - { says: h, written: [ه], kind: fixed }
  - { says: y, written: [ی], kind: fixed }
  - { says: ʾ, written: [ء, ئ, أ, ؤ, "\u0654"], kind: fixed }
  # An ezafe after a final he, written as a hamza on it (شجرهٔ šajara-i).
  - { says: i, written: ["\u0654"], kind: free, when: { after: "[ه]" } }
  # The dative after q: -qa written غا (ḫalāyiqqa).
  - { says: q, written: [غ], kind: fixed, when: { after: "[ق]" } }
  # The Arabic article al- (القصه al-qiṣṣa), its l said as a sun letter after it (الدین ud-Dīn).
  - { says: d, written: [ل], kind: fixed, when: { before: "[د]" } }
  # A hyphen binds a word to the next, or an ezafe -i to its noun (āwāz-i): written as nothing. A half-space
  # before a suffix (Andijāndur) says nothing.
  - { says: "-", written: [""], kind: fixed }
  - { says: "", written: ["\u200C"], kind: fixed }

