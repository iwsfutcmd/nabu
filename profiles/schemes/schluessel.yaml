# Schluessel's transliteration of Chaghatay (An Introduction to Chaghatay, 2018): his reading of
# the Arabic script in Latin letters, the chg course's second orthography (chg-Latn/schluessel,
# ADR 0128). Over the Arabic it is a reading layer of whole words (ADR 0129), taken from the Latin
# form pinned word for word; it is shown, never asked for.
id: schluessel
