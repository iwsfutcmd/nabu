# William Baxter's transcription of Middle Chinese (the Qieyun's language, 601 CE), as Baxter &
# Sagart (2014) write it in ASCII from the Guangyun: one syllable per character (說 ywet). lzh pins
# it on every Han word (ADR 0071); it is shown, never asked for.
id: baxter
