# A feature value with a meaning is a lexeme (ADR 0145), with its forms by context.
language: uz
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@lexical-model-v1', status: draft}
lexemes:
  - id: lexeme:dat
    realises: {Case: Dat}
    gloss: {en: "to"}
    allomorphs:
      - {form: ga}
      - {form: ka, after: {ends: k}}
      - {form: qa, after: {ends: q}}
  - id: lexeme:uy
    pos: NOUN
    gloss: {en: house; home}
    form: uy
  # Until the language has a lexical-form notation an allomorph is pinned by its spellings.
  - id: lexeme:poss-1sg
    realises: {'Person[psor]': "1", 'Number[psor]': Sing}
    gloss: {en: "my"}
    allomorphs:
      - {spelled: {uz-Latn/standard: [m], uz-Cyrl/standard: [м]}}
      - {spelled: {uz-Latn/standard: [im], uz-Cyrl/standard: [им]}}
