# From docs/lexical-forms/apc.yaml: a verb is its radicals, Form and vowels; its other forms are
# pinned until the conjugation is written. The article's alef is written and not said (U+06DF).
language: apc
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@fable-5.2', status: draft}
lexemes:
  - id: lexeme:3allam
    pos: VERB
    gloss: {en: teach}
    form: {radicals: [ع, ل, م], form: II}
  - id: lexeme:agent           # a function head: the pattern that makes one who does it
    head: {takes: [VERB], makes: NOUN}
    form: {templates: {sound: "1َا2ِ3"}}
  - id: lexeme:el
    pos: DET
    gloss: {en: the}
    form: "ا\u06dfل"
    spelled: {apc-Latn/arabizi: [el, l]}
  - id: lexeme:m3allem
    pos: NOUN
    gloss: {en: teacher}
    base: lexeme:3allam
    pattern: lexeme:agent
    spelled: {apc-Arab/standard: [معلّم], apc-Latn/arabizi: [m3allem]}
  - id: lexeme:ra7
    pos: VERB
    gloss: {en: go}
    form: {radicals: [ر, و, ح], form: I, vowels: {present: u}}
    forms:
      - {feats: {Aspect: Perf, Person: "1", Number: Sing}, form: "رُحْت", status: pinned, spelled: {apc-Latn/arabizi: [ru7t]}}
