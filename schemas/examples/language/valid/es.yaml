# Spanish, as docs/migration-design.md sketches it. REVIEW: the classes and defaults are a draft.
id: es
license: CC-BY-SA-4.0
provenance: {author: 'llm:claude@lexical-model-v1', status: draft}
varieties: [es-CU, es-419, es-ES]
registers: [neutral, formal, colloquial]
dimensions:
  VERB: [Mood, Tense, Person, Number, VerbForm]
  NOUN: [Number]
  ADJ: [Gender, Number]
# What a noun has of itself, and the cell an entry is spelled in.
lexical:
  NOUN: [Gender]
citation:
  NOUN: {Gender: Masc, Number: Sing}
  ADJ: {Gender: Masc, Number: Sing}
  VERB: {VerbForm: Inf}
features:
  Gender: [Fem, Masc]
  Number: [Sing, Plur]
  Person: ["1", "2", "3"]
  Tense: [Pres, Past, Imp, Fut]
  Mood: [Ind, Sub, Imp, Cnd]
  VerbForm: [Fin, Inf, Part, Ger]
defaults:
  - {id: gender-a, when: {pos: NOUN, ends: a}, gives: {Gender: Fem}}
  - {id: gender-o, when: {pos: NOUN, ends: o}, gives: {Gender: Masc}}
classes:
  - {id: e-ie, pos: VERB, gloss: {en: "e → ie"}}
  - {id: go, pos: VERB, gloss: {en: "yo form in -go"}}
  - {id: short-future, pos: VERB, gloss: {en: "short future stem"}}
# What a learner is shown for a set of feature values.
labels:
  - {feats: {Tense: Past, Person: "3", Number: Sing}, gloss: {en: "past tense (preterite): he, she, it"}, notes: {en: "-ó, -ió: compró, comió."}, was: 'form:pret-3s'}
  - {feats: {Gender: Fem}, pos: PROPN, gloss: {en: "feminine"}}
