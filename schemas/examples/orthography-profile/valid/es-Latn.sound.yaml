# Shape test for the sound statement (ADR 0148): its sound read off the spelling, a stress rule, a
# silent letter, a context and a rare spelling. Not the real es profile.
id: es-Latn/standard
lang: es-Latn
segmentation: { content: whitespace, runtime: grapheme }
normalize: [nfc]
sound: { from: spelling }
stress:
  mark: "\u0301"
  vowels: [a, e, i, o, u]
  weak: [i, u]
  default: [{ when: { ends: "[aeiouns]" }, "on": penult }, { "on": last }]
correspondences:
  - { says: b, written: [b, v], kind: fixed, note: sound-alike }
  - { says: s, written: [c], kind: fixed, when: { before: "[eiéí]" } }
  - { says: "", written: [h], kind: fixed }
  - { says: k, written: [c], rare: [k], kind: fixed }
