# A word written onto the next or apart, in free forms, assimilated before some letters (Arabizi's article). Not a real profile.
id: apc-Latn/arabizi
lang: apc-Latn
segmentation: { content: hand-pinned, runtime: grapheme }
normalize: [nfc]
match:
  joins:
    - id: article
      forms: [el, il, l]
      assimilates: { before: "[dnrstz{sh}]", forms: ["e{next}", "{next}", e] }
      minRest: 3
      notBefore: [VERB, AUX]
      note: spelling-variant
